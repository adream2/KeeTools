/*!
 * et-chrome.css — 工具通用外壳样式（顶栏 / 页脚 / 弹窗 / 按钮 / 主题）
 *
 * 共享样式源。改这里，然后跑：python scripts/sync_shared.py
 * 所有类名带 et- 前缀，避免与工具自身样式冲突。
 * 依赖：无外部资源；颜色全部为令牌变量。
 */

/* ============ 设计令牌 ============ */
:root {
    --et-accent: #2563eb;
    --et-accent-weak: rgba(37, 99, 235, .14);
    --et-bg: #f4f6fb;
    --et-surface: #ffffff;
    --et-surface-2: #f8fafc;
    --et-fg: #0b1220;
    --et-muted: #64748b;
    --et-line: rgba(15, 23, 42, .12);
    --et-line-strong: rgba(15, 23, 42, .22);
    --et-glass: rgba(255, 255, 255, .85);
    --et-shadow-md: 0 10px 28px -18px rgba(15, 23, 42, .3);
    --et-shadow-lg: 0 24px 60px -32px rgba(15, 23, 42, .4);
    --et-ok: #059669;
    --et-warn: #d97706;
    --et-err: #dc2626;
    --et-radius: 12px;
    --et-radius-sm: 9px;
    --et-font: -apple-system, BlinkMacSystemFont, "Segoe UI",
               "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei",
               "Noto Sans SC", sans-serif;
    --et-mono: ui-monospace, "Cascadia Mono", Consolas, Menlo, monospace;
}

html[data-et-theme="dark"] {
    --et-bg: #0b1120;
    --et-surface: #111a2e;
    --et-surface-2: #0f1729;
    --et-fg: #f1f5f9;
    --et-muted: #94a3b8;
    --et-line: rgba(148, 163, 184, .18);
    --et-line-strong: rgba(148, 163, 184, .3);
    --et-glass: rgba(17, 26, 46, .85);
    --et-shadow-md: 0 10px 34px -18px rgba(0, 0, 0, .8);
    --et-shadow-lg: 0 24px 70px -30px rgba(0, 0, 0, .9);
    --et-ok: #34d399;
    --et-warn: #fbbf24;
    --et-err: #f87171;
}

/* ============ 基础 ============ */

/* body 作为外壳时必须清掉浏览器默认 8px 外边距，
   否则 iframe 预览中文档会比视口高 16px（底部白边 + 多余滚动） */
body.et-app {
    margin: 0;
}

.et-app {
    position: relative;
    isolation: isolate;
    display: flex;
    flex-direction: column;
    height: 100vh;
    height: 100dvh;
    overflow: hidden;
    background: var(--et-bg);
    color: var(--et-fg);
    font-family: var(--et-font);
    -webkit-font-smoothing: antialiased;
    transition: background .25s, color .25s;
}

/* 极光背景：径向渐变 + 呼吸动画（edupick 品质基线，老内核也不掉帧） */
.et-app::before {
    content: '';
    position: fixed;
    inset: 0;
    z-index: -1;
    pointer-events: none;
    background:
        radial-gradient(46% 40% at 20% 18%, var(--et-accent-weak), transparent 65%),
        radial-gradient(42% 38% at 82% 24%, var(--et-accent-weak), transparent 70%),
        radial-gradient(50% 44% at 55% 95%, rgba(16, 185, 129, .10), transparent 65%);
    animation: et-aurora 16s ease-in-out infinite alternate;
}

@keyframes et-aurora {
    from { opacity: .55; transform: scale(1); }
    to { opacity: 1; transform: scale(1.06); }
}

.et-app *,
.et-app *::before,
.et-app *::after { box-sizing: border-box; }

[hidden] { display: none !important; }

.et-icon {
    width: 18px;
    height: 18px;
    fill: none;
    stroke: currentColor;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
    flex: none;
}

/* ============ 顶栏 ============ */
.et-topbar {
    flex: none;
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 11px 20px;
    border-bottom: 1px solid var(--et-line);
    background: var(--et-glass);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    z-index: 20;
}

.et-brand {
    display: flex;
    align-items: center;
    gap: 10px;
    min-width: 0;
}

.et-brand__dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: var(--et-accent);
    box-shadow: 0 0 0 4px var(--et-accent-weak);
    flex: none;
}

.et-brand__name {
    font-weight: 800;
    font-size: 15px;
    letter-spacing: -.01em;
    white-space: nowrap;
}

.et-brand__sub {
    font-size: 12.5px;
    color: var(--et-muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.et-status {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 5px 14px;
    border-radius: 999px;
    font-size: 12.5px;
    color: var(--et-muted);
    background: var(--et-surface-2);
    border: 1px solid var(--et-line);
    white-space: nowrap;
    max-width: 42vw;
    overflow: hidden;
    text-overflow: ellipsis;
}

.et-status__dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--et-ok);
    flex: none;
    transition: background .2s;
}

.et-status[data-tone="err"] .et-status__dot { background: var(--et-err); }
.et-status[data-tone="warn"] .et-status__dot { background: var(--et-warn); }

.et-actions {
    display: flex;
    align-items: center;
    gap: 7px;
}

.et-icon-btn {
    display: inline-grid;
    place-items: center;
    width: 38px;
    height: 38px;
    font-size: 16px;
    line-height: 1;
    border-radius: 11px;
    border: 1px solid var(--et-line);
    background: var(--et-surface-2);
    color: var(--et-fg);
    cursor: pointer;
    transition: transform .14s, border-color .14s, color .14s, opacity .14s;
    -webkit-tap-highlight-color: transparent;
}

.et-icon-btn:hover {
    border-color: var(--et-accent);
    color: var(--et-accent);
    transform: translateY(-1px);
}

.et-icon-btn:active { transform: translateY(0); }
.et-icon-btn.is-off { opacity: .4; }
.et-icon-btn:focus-visible { outline: 2px solid var(--et-accent); outline-offset: 2px; }

/* ============ 主区默认 ============ */
.et-main {
    flex: 1;
    min-height: 0;
    position: relative;
    overflow: auto;
}

/* ============ 页脚（品牌回流 L2） ============ */
.et-footer {
    flex: none;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 7px 16px;
    font-size: 12px;
    color: var(--et-muted);
    border-top: 1px solid var(--et-line);
    background: var(--et-glass);
    user-select: none;
    z-index: 20;
}

.et-footer a {
    color: inherit;
    text-decoration: none;
    transition: color .14s;
}

.et-footer a:hover { color: var(--et-accent); }

/* ============ 按钮 ============ */
.et-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
    padding: 9px 16px;
    border-radius: 11px;
    font: inherit;
    font-size: 13.5px;
    font-weight: 700;
    border: 1px solid var(--et-line);
    background: var(--et-surface-2);
    color: var(--et-fg);
    cursor: pointer;
    transition: transform .14s, border-color .14s, color .14s, background .14s, box-shadow .14s;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
}

.et-btn:hover {
    border-color: var(--et-accent);
    color: var(--et-accent);
    transform: translateY(-1px);
}

.et-btn:active { transform: translateY(0); }
.et-btn:focus-visible { outline: 2px solid var(--et-accent); outline-offset: 2px; }
.et-btn:disabled { opacity: .45; cursor: not-allowed; transform: none; }

.et-btn--primary {
    background: var(--et-accent);
    border-color: var(--et-accent);
    color: #fff;
    box-shadow: 0 6px 18px -8px var(--et-accent);
}

.et-btn--primary:hover { color: #fff; filter: brightness(1.08); }
.et-btn--primary:disabled { filter: none; }

.et-btn--danger:hover {
    border-color: var(--et-err);
    color: var(--et-err);
}

.et-btn--lg {
    padding: 13px 26px;
    font-size: 16px;
    border-radius: 14px;
}

/* ============ 弹窗 ============ */
.et-modal {
    position: fixed;
    inset: 0;
    z-index: 100;
    display: grid;
    place-items: center;
    padding: 24px;
    background: rgba(2, 6, 23, .55);
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    animation: et-fade .18s ease;
}

.et-modal__panel {
    width: min(680px, 94vw);
    max-height: 86vh;
    max-height: 86dvh;
    display: flex;
    flex-direction: column;
    background: var(--et-surface);
    border: 1px solid var(--et-line);
    border-radius: 16px;
    box-shadow: var(--et-shadow-lg);
    animation: et-pop .2s cubic-bezier(.34, 1.4, .64, 1);
    overflow: hidden;
}

.et-modal__panel--narrow { width: min(460px, 92vw); }
.et-modal__panel--wide { width: min(900px, 94vw); }

.et-modal__head {
    flex: none;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 16px 20px;
    border-bottom: 1px solid var(--et-line);
    font-weight: 800;
    font-size: 15px;
}

.et-modal__head .et-icon-btn {
    margin-left: auto;
    width: 32px;
    height: 32px;
}

.et-modal__body {
    flex: 1;
    min-height: 0;
    overflow: auto;
    padding: 18px 20px;
}

.et-modal__foot {
    flex: none;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 14px 20px;
    border-top: 1px solid var(--et-line);
    background: var(--et-surface-2);
}

.et-modal__foot .spacer { flex: 1; }

@keyframes et-fade {
    from { opacity: 0; }
}

@keyframes et-pop {
    from { opacity: 0; transform: translateY(14px) scale(.97); }
}

/* ============ 轻提示（toast） ============ */
.et-toast {
    position: fixed;
    left: 50%;
    bottom: 56px;
    transform: translateX(-50%) translateY(10px);
    z-index: 120;
    display: flex;
    align-items: center;
    gap: 9px;
    max-width: min(520px, 88vw);
    padding: 11px 18px;
    border-radius: 12px;
    font-size: 13.5px;
    font-weight: 600;
    color: #fff;
    background: rgba(15, 23, 42, .92);
    border: 1px solid rgba(148, 163, 184, .25);
    box-shadow: var(--et-shadow-lg);
    opacity: 0;
    pointer-events: none;
    transition: opacity .22s, transform .22s;
}

.et-toast.is-show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
}

.et-toast[data-tone="ok"] { background: rgba(5, 150, 105, .95); }
.et-toast[data-tone="err"] { background: rgba(220, 38, 38, .95); }
.et-toast[data-tone="warn"] { background: rgba(217, 119, 6, .95); }

/* ============ 设置抽屉（右上角入口，edupick 交互） ============ */
.et-drawer-backdrop {
    position: fixed;
    inset: 0;
    z-index: 90;
    background: rgba(2, 6, 23, .45);
    backdrop-filter: blur(3px);
    -webkit-backdrop-filter: blur(3px);
    opacity: 0;
    transition: opacity .2s;
}

.et-drawer-backdrop.is-open { opacity: 1; }

.et-drawer {
    position: absolute;
    top: 0;
    right: 0;
    height: 100%;
    width: min(400px, 92vw);
    display: flex;
    flex-direction: column;
    background: var(--et-surface);
    border-left: 1px solid var(--et-line);
    box-shadow: var(--et-shadow-lg);
    transform: translateX(100%);
    transition: transform .22s cubic-bezier(.32, .72, .35, 1);
}

.et-drawer-backdrop.is-open .et-drawer { transform: translateX(0); }

.et-drawer__head {
    flex: none;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 15px 18px;
    border-bottom: 1px solid var(--et-line);
    font-weight: 800;
    font-size: 15px;
    color: var(--et-accent);
}

.et-drawer__head .et-icon-btn {
    margin-left: auto;
    width: 32px;
    height: 32px;
}

.et-drawer__body {
    flex: 1;
    min-height: 0;
    overflow: auto;
    padding: 16px 18px 24px;
}

/* 抽屉内容通用小节（工具复用） */
.et-drawer__body h4 {
    margin: 18px 0 8px;
    font-size: 12px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: .08em;
    color: var(--et-muted);
}

.et-drawer__body h4:first-child { margin-top: 0; }

.et-drawer__row {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
}

.et-drawer__tip {
    margin: 8px 0 0;
    font-size: 12px;
    line-height: 1.8;
    color: var(--et-muted);
}

.et-drawer__tip b { color: var(--et-fg); }

.et-drawer__input {
    flex: 1;
    min-width: 0;
    padding: 9px 12px;
    border: 1px solid var(--et-line-strong);
    border-radius: 9px;
    background: var(--et-surface-2);
    color: var(--et-fg);
    font: inherit;
    font-size: 13.5px;
    transition: border-color .14s, box-shadow .14s;
}

.et-drawer__input:focus {
    outline: none;
    border-color: var(--et-accent);
    box-shadow: 0 0 0 3px var(--et-accent-weak);
}

.et-drawer__switch {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 10px 0;
    border-bottom: 1px dashed var(--et-line);
    font-size: 13.5px;
    font-weight: 600;
    color: var(--et-fg);
    cursor: pointer;
    user-select: none;
}

.et-drawer__switch input {
    width: 17px;
    height: 17px;
    accent-color: var(--et-accent);
    cursor: pointer;
}
</style>

<style>
/* ── 工具自身样式：自包含，不引用任何外部资源 ── */
.tg-main {
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
    overflow: hidden;
}

/* ── 屏幕控制条 ── */
.tg-bar {
    flex: none;
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    padding: 10px 18px;
    border-bottom: 1px solid var(--et-line);
    background: var(--et-surface-2);
}

.tg-seg {
    display: flex;
    border: 1px solid var(--et-line-strong);
    border-radius: 10px;
    overflow: hidden;
    background: var(--et-surface);
}

.tg-seg button {
    appearance: none;
    -webkit-appearance: none;
    border: 0;
    background: transparent;
    color: var(--et-fg);
    font: inherit;
    font-size: 13.5px;
    font-weight: 700;
    padding: 9px 14px;
    cursor: pointer;
    transition: background .14s, color .14s;
    -webkit-tap-highlight-color: transparent;
}

.tg-seg button + button { border-left: 1px solid var(--et-line); }
.tg-seg button:hover { background: var(--et-accent-weak); }
.tg-seg button.is-on { background: var(--et-accent); color: #fff; }

.tg-stat {
    font-size: 13px;
    color: var(--et-muted);
    white-space: nowrap;
}

.tg-spacer { flex: 1; }

/* ── 舞台（全屏拼图区） ── */
.tg-stage {
    flex: 1;
    min-height: 0;
    position: relative;
    background: #e9edf5;
    overflow: hidden;
}

html[data-et-theme="dark"] .tg-stage { background: #070c17; }

.tg-stage__board {
    position: absolute;
    inset: 0;
}

.tg-board {
    width: 100%;
    height: 100%;
    display: block;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
}

.tg-target polygon {
    fill: #eef2f7;
    stroke: #9aa6b5;
    stroke-width: .05;
    stroke-dasharray: .28 .22;
}

html[data-et-theme="dark"] .tg-target polygon {
    fill: rgba(148, 163, 184, .08);
    stroke: rgba(148, 163, 184, .55);
}

.tg-grid line {
    stroke: #e2e8f0;
    stroke-width: .025;
}

html[data-et-theme="dark"] .tg-grid line {
    stroke: rgba(148, 163, 184, .12);
}

.tg-piece {
    stroke: rgba(15, 23, 42, .45);
    stroke-width: .05;
    cursor: grab;
    transition: stroke-width .12s;
}

.tg-piece:hover { stroke: #0f172a; stroke-width: .08; }

.tg-piece.is-sel {
    stroke: #0f172a;
    stroke-width: .11;
}

.tg-piece.is-drag { cursor: grabbing; }

/* ── 胜利横幅 ── */
.tg-win {
    position: absolute;
    left: 50%;
    top: 10%;
    transform: translateX(-50%);
    z-index: 5;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    padding: 18px 34px;
    border-radius: 18px;
    text-align: center;
    background: var(--et-surface);
    border: 1.5px solid var(--et-ok);
    box-shadow: var(--et-shadow-lg);
    animation: tg-win-in .4s cubic-bezier(.2, 1.5, .4, 1) both;
}

.tg-win__title {
    font-size: 24px;
    font-weight: 900;
    color: var(--et-ok);
}

.tg-win__meta {
    font-size: 13px;
    font-weight: 600;
    color: var(--et-muted);
    font-variant-numeric: tabular-nums;
}

.tg-win__btns {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    justify-content: center;
}

@keyframes tg-win-in {
    from { opacity: 0; transform: translateX(-50%) translateY(-14px) scale(.9); }
}

/* ── 打印：按需生成的 A4 作业纸（平时不显示） ── */
.tg-print { display: none; }

@page {
    size: A4 portrait;
    margin: 0;
}

@media print {
    html,
    body.et-app {
        display: block !important;
        height: auto !important;
        overflow: visible !important;
        background: #fff !important;
        color: #000 !important;

    }

    }
}
</style>

            setTimeout(function () {
                if (backdrop.parentNode) { backdrop.parentNode.removeChild(backdrop); }
            }, 220);
        }
        function onKey(ev) {
            if (ev.key === 'Escape') { ev.stopPropagation(); close(); }
        }
        document.addEventListener('keydown', onKey);
        backdrop.addEventListener('mousedown', function (ev) {
            if (ev.target === backdrop) { close(); }
        });

        if (typeof build === 'function') {
            /* 兼容两种约定：build 自己往 body 里塞内容，或 return 一个元素节点 */
            var ret = build(body, { close: close });
            if (ret && ret.nodeType === 1 && ret.parentNode !== body) {
                body.appendChild(ret);
            }

        return { body: body, close: close };
    }

    /* ---------- 通用弹窗 / toast（同时挂模块级，供其他共享组件使用） ---------- */

    function modal(mo) {
        var backdrop = el('div', 'et-modal');
        var panel = el('div', 'et-modal__panel' + (mo.size === 'narrow' ? ' et-modal__panel--narrow'
            : mo.size === 'wide' ? ' et-modal__panel--wide' : ''));
        var head = el('div', 'et-modal__head');
        if (mo.icon) { head.appendChild(makeIcon(mo.icon)); }
        head.appendChild(el('span', null, mo.title || ''));
        head.appendChild(makeBtn('i-x', '关闭', close));
        panel.appendChild(head);

        var body = el('div', 'et-modal__body');
        if (typeof mo.body === 'string') { body.innerHTML = mo.body; }
        else if (mo.body) { body.appendChild(mo.body); }
        panel.appendChild(body);

        var foot = null;
        if (mo.buttons && mo.buttons.length) {
            foot = el('div', 'et-modal__foot');
            foot.appendChild(el('span', 'spacer'));
            mo.buttons.forEach(function (b) {
                var btn = el('button', 'et-btn' + (b.primary ? ' et-btn--primary' : '') + (b.danger ? ' et-btn--danger' : ''), b.label);
                btn.type = 'button';
                btn.addEventListener('click', function () {
                    if (b.onClick) { b.onClick(close); } else { close(); }
                });
                foot.appendChild(btn);
            });
            panel.appendChild(foot);
        }

        backdrop.appendChild(panel);
        document.body.appendChild(backdrop);

        function close() {
            if (backdrop.parentNode) { backdrop.parentNode.removeChild(backdrop); }
            document.removeEventListener('keydown', onKey);
            if (mo.onClose) { mo.onClose(); }
        }
        function onKey(ev) {
            if (ev.key === 'Escape') { ev.stopPropagation(); close(); }
        }
        document.addEventListener('keydown', onKey);
        backdrop.addEventListener('mousedown', function (ev) {
            if (ev.target === backdrop) { close(); }

        return { panel: panel, body: body, foot: foot, close: close };

    var toastEl = null;
    var toastTimer = 0;

    function toast(msg, tone) {
        if (!toastEl) {
            toastEl = el('div', 'et-toast');
            document.body.appendChild(toastEl);

        toastEl.textContent = msg;
        toastEl.setAttribute('data-tone', tone || '');

        toastEl.classList.add('is-show');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(function () { toastEl.classList.remove('is-show'); }, 2200);
    }

    /* ---------- PWA 元数据（blob manifest，环境不支持时静默跳过） ---------- */

    function installPwa(toolId, title, accent) {
        try {
            var theme = document.querySelector('meta[name="theme-color"]');
            if (!theme) {
                theme = document.createElement('meta');
                theme.setAttribute('name', 'theme-color');

                '<text x="32" y="43" font-size="32" font-weight="800" font-family="sans-serif" ' +
                'fill="#fff" text-anchor="middle">' + (title || '课').charAt(0) + '</text></svg>';
            var iconUri = 'data:image/svg+xml,' + encodeURIComponent(svg);

            var mf = {
                name: title || 'KeeTools 课工具',
                short_name: title || '课工具',
                start_url: '.',
                display: 'standalone',
                background_color: '#f4f6fb',
                theme_color: accent || '#2563eb',
                icons: [{ src: iconUri, sizes: 'any', type: 'image/svg+xml', purpose: 'any' }]
            };
            var blob = new Blob([JSON.stringify(mf)], { type: 'application/manifest+json' });
            var link = document.createElement('link');
            link.rel = 'manifest';
            link.href = URL.createObjectURL(blob);

                if (req) { try { req.call(root); } catch (err) { /* 忽略 */ } }

        });
        document.addEventListener('webkitfullscreenchange', function () {

        });
        syncFsIcon(false);

        api.toggleFullscreen = toggleFullscreen;

        api.beep = function (kind) {

            ? global.ET_SITE_ORIGIN

        function renderFooter() {

        /* 站点来源发现：iframe 内向父窗口询问；也可由宿主直接注入 ET_SITE_ORIGIN */
        try {
            if (global.parent && global.parent !== global) {
                global.parent.postMessage(JSON.stringify({ type: 'et-hello', toolId: toolId }), '*');
            }
        } catch (err) { /* 跨域异常忽略 */ }

        global.addEventListener('message', function (ev) {

            if (typeof data === 'string') {

/*!
 * et-stats.js — 使用统计模块（模块化，可整体移除）
 *
 * 共享逻辑源。改这里，然后跑：python scripts/sync_shared.py
 * 依赖：无（可脱离 et-util / et-chrome 独立运行）。
 * 全局：ET.Stats
 *
 * ┌────────────────────────────────────────────────────────────────┐
 * │ 说明：本模块只做一件事——工具被打开时向上报端点发一条匿名计数。 │
 * │ · 在线（iframe 内）：宿主页面已服务端计数，本模块不重复上报。   │
 * │ · 离线打开（file:// / 下载单文件 / 离线包）：联网条件具备时，   │
 * │   以 sendBeacon 上报 use_offline 事件（text/plain 免预检）。    │
 * │ · 上报端点 = window.ET_SITE_ORIGIN（由宿主注入或离线包配置）。  │
 * │   未配置端点时本模块完全静默，不发任何请求。                    │
 * │ · **整个 <script> 块可安全删除**：删除后工具其余功能完全正常，  │
 * │   且完全不再发起任何网络请求。                                  │
 * └────────────────────────────────────────────────────────────────┘
 */
(function (global) {
    'use strict';

    var ET = global.ET = global.ET || {};

    var Stats = {
        /** 上报端点来源（站点绝对地址，无协议尾斜杠） */
        endpoint: (typeof global.ET_SITE_ORIGIN === 'string' && /^https?:\/\//.test(global.ET_SITE_ORIGIN))
            ? global.ET_SITE_ORIGIN
            : null,

        _done: {},

        /**
         * 上报一次事件（同一事件同一工具每次页面加载只报一次）。
         * event: 'use_offline' 等；toolId: 工具 id。
         */
        send: function (event, toolId) {
            if (!event || this._done[event + ':' + (toolId || '')]) { return false; }
            if (!this.endpoint) { return false; }
            /* iframe 内由宿主统计，避免双计 */
            try {
                if (global.parent && global.parent !== global) { return false; }
            } catch (err) { return false; }
            /* 断网时挂起，网络恢复自动补报一次 */
            if (global.navigator && global.navigator.onLine === false) {
                var self = this;
                global.addEventListener('online', function () { self.send(event, toolId); }, { once: true });
                return false;
            }

            this._done[event + ':' + (toolId || '')] = true;
            var payload = JSON.stringify({ event: event, tool: toolId || '' });

            try {
                if (global.navigator.sendBeacon) {
                    return global.navigator.sendBeacon(
                        this.endpoint + '/api/track',
                        new Blob([payload], { type: 'text/plain;charset=UTF-8' })
                    );
                }
                global.fetch(this.endpoint + '/api/track', {
                    method: 'POST',
                    body: payload,
                    keepalive: true,
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'text/plain;charset=UTF-8' }
                });
                return true;
            } catch (err) {
                return false;
            }
        }
    };

    ET.Stats = Stats;
})(window);
</script>

        secondary: shuffle,      /* 翻页笔上页键 = 撒开 */
        actions: [
            { icon: 'i-shuffle', label: '撒开重来', onClick: shuffle },
            { icon: 'i-eye', label: '看答案', onClick: showAnswer }
        ],
        settings: { title: '七巧板 / 设置', build: buildSettings },
        help: '<div style="font-size:13.5px;line-height:2">' +
            '<p style="margin:0 0 8px"><b>怎么玩</b>：按住色块<b>拖动</b>（按下即选中），' +
            '<b>滚轮</b>或 <b>Q</b> / <b>E</b> 键旋转，<b>W</b> 键或「翻转」按钮翻面，' +
            '<b>方向键</b>微调位置。平行四边形有方向，需要时翻个面。</p>' +
            '<p style="margin:0 0 8px"><b>三种玩法</b>：自由拼摆（随便拼）/ 拼正方形 / 拼大三角形。' +
            '挑战时灰色虚线是轮廓：把 7 块全部放进轮廓、互不重叠、正好铺满就赢，' +
            '工具会自动判定并计时，顶栏实时显示「已放好 N / 7 块」。</p>' +
            '<p style="margin:0 0 8px"><b>其他</b>：「看答案」演示一种标准拼法（拼法不唯一，' +
            '看完点「撒开」开始挑战）；「打印」把当前拼面输出成 A4 作业纸。</p>' +
            '<p style="margin:0"><b>快捷键</b>：<b>1</b>/<b>2</b>/<b>3</b> 切换玩法、<b>R</b> 撒开、' +
            '<b>A</b> 看答案、<b>P</b> 打印；翻页笔下页键 = 看答案、上页键 = 撒开。' +
            '拼法只保存在本机浏览器。</p></div>'
    });

    var els = {
        seg: document.getElementById('taskSeg'),
        stat: document.getElementById('stat'),
        preview: document.getElementById('preview'),
        btnCw: document.getElementById('btnCw'),
        btnCcw: document.getElementById('btnCcw'),
        btnFlip: document.getElementById('btnFlip'),
        btnShuffle: document.getElementById('btnShuffle'),
        btnAnswer: document.getElementById('btnAnswer'),
        btnPrint: document.getElementById('btnPrint'),
        win: document.getElementById('tgWin'),
        winMeta: document.getElementById('tgWinMeta'),
        winAgain: document.getElementById('tgWinAgain'),
        winNext: document.getElementById('tgWinNext')
    };

    var state = loadState();
    var transforms = loadTransforms();
    var svg = null;
    var selected = store.get('selected', 'lg1');
    var order = store.get('order', null);
    var drag = null;
    var animating = false;
    var won = false;        /* 本轮挑战是否已拼好 */
    var demo = false;       /* 看答案演示中（不判定） */
    var challenge = { started: false, startAt: 0, elapsed: 0 };

    /* ---------- 基础工具 ---------- */

    function clampInt(v, min, max, fallback) {
        var n = parseInt(v, 10);
        if (isNaN(n)) { return fallback; }
        return Math.max(min, Math.min(max, n));
    }

    function pickOpt(v, list, fallback) {
        var n = parseInt(v, 10);
        return list.indexOf(n) >= 0 ? n : fallback;
    }

    function loadState() {
        var s = {};
        for (var k in DEFAULTS) {
            if (Object.prototype.hasOwnProperty.call(DEFAULTS, k)) {
                s[k] = store.get(k, DEFAULTS[k]);
            }
        }
        if (TASKS.indexOf(s.task) < 0) { s.task = DEFAULTS.task; }
        s.rotStep = pickOpt(s.rotStep, [5, 15, 45], DEFAULTS.rotStep);
        s.title = typeof s.title === 'string' ? s.title : DEFAULTS.title;
        return s;
    }

    function loadTransforms() {
        var saved = store.get('pieces', null);
        var out = {};
        for (var i = 0; i < PIECES.length; i++) {
            var def = { x: 0, y: 0, rot: 0, flip: false };
            if (Array.isArray(saved)) {
                for (var j = 0; j < saved.length; j++) {
                    var it = saved[j];
                    if (it && it.id === PIECES[i].id) {
                        def = {
                            x: Number(it.x) || 0,
                            y: Number(it.y) || 0,
                            rot: Number(it.rot) || 0,
                            flip: it.flip === true
                        };
                    }
                }
            }
            out[PIECES[i].id] = def;
        }
        return out;
    }

    function pieceOrder() {
        var ids = [];
        for (var i = 0; i < PIECES.length; i++) { ids.push(PIECES[i].id); }
        if (!Array.isArray(order)) { return ids; }
        var out = [];
        for (var j = 0; j < order.length; j++) {
            if (ids.indexOf(order[j]) >= 0 && out.indexOf(order[j]) < 0) { out.push(order[j]); }
        }
        for (var k = 0; k < ids.length; k++) {
            if (out.indexOf(ids[k]) < 0) { out.push(ids[k]); }
        }
        return out;
    }

    function persist() {
        for (var k in DEFAULTS) {
            if (Object.prototype.hasOwnProperty.call(DEFAULTS, k)) {
                store.set(k, state[k]);
            }
        }
        var list = [];
        for (var i = 0; i < PIECES.length; i++) {
            var t = transforms[PIECES[i].id];
            list.push({ id: PIECES[i].id, x: t.x, y: t.y, rot: t.rot, flip: t.flip });
        }
        store.set('pieces', list);
        store.set('selected', selected);
        store.set('order', pieceOrder());
    }

    function defOf(id) {
        for (var i = 0; i < PIECES.length; i++) {
            if (PIECES[i].id === id) { return PIECES[i]; }
        }
        return null;
    }

    function isTypingTarget(node) {
        if (!node || !node.tagName) { return false; }
        var tag = node.tagName.toUpperCase();
        return tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT' || node.isContentEditable === true;
    }

    function text(tag, cls, value) {
        var node = document.createElement(tag);
        if (cls) { node.className = cls; }
        if (value !== undefined && value !== null) { node.textContent = value; }
        return node;
    }

    function svgEl(tag, cls) {
        var node = document.createElementNS(NS, tag);
        if (cls) { node.setAttribute('class', cls); }
        return node;
    }

    function rad(deg) { return deg * Math.PI / 180; }

    /* ---------- 几何 ---------- */

    /** 局部顶点 → 世界坐标（先镜像、再旋转、最后平移，与 SVG transform 顺序一致） */
    function toWorld(def, id) {
        var t = transforms[id];
        var ca = Math.cos(rad(t.rot)), sa = Math.sin(rad(t.rot));
        var out = [];
        for (var i = 0; i < def.local.length; i++) {
            var px = def.local[i][0] * (t.flip ? -1 : 1);
            var py = def.local[i][1];
            out.push([px * ca - py * sa + t.x, px * sa + py * ca + t.y]);
        }
        return out;
    }

    function pointInPoly(pts, x, y) {
        var inside = false;
        var n = pts.length;
        for (var i = 0; i < n; i++) {
            var x1 = pts[i][0], y1 = pts[i][1];
            var x2 = pts[(i + 1) % n][0], y2 = pts[(i + 1) % n][1];
            if ((y1 > y) !== (y2 > y)) {
                if (x1 + (y - y1) * (x2 - x1) / (y2 - y1) > x) { inside = !inside; }
            }
        }
        return inside;
    }

    function centroid(pts) {
        var sx = 0, sy = 0;
        for (var i = 0; i < pts.length; i++) { sx += pts[i][0]; sy += pts[i][1]; }
        return [sx / pts.length, sy / pts.length];
    }

    /**
     * 求「局部形状 → 目标位置」的精确等距变换。
     * 三重枚举：是否镜像 / 目标起点 / 顶点对应方向，再逐顶点验算（不近似）。
     * 返回 { x, y, rot, flip } 或 null。
     */
    function solveTransform(local, target) {
        var n = local.length;
        for (var f = 0; f < 2; f++) {
            var flip = f === 1;
            var L = [];
            for (var i = 0; i < n; i++) {
                L.push([flip ? -local[i][0] : local[i][0], local[i][1]]);
            }
            var cl = centroid(L);
            var ct = centroid(target);
            for (var k = 0; k < n; k++) {
                for (var d = 0; d < 2; d++) {
                    var dir = d === 0 ? 1 : -1;
                    var v0x = L[0][0] - cl[0], v0y = L[0][1] - cl[1];
                    var t0x = target[k][0] - ct[0], t0y = target[k][1] - ct[1];
                    var rot = Math.atan2(t0y, t0x) - Math.atan2(v0y, v0x);
                    var ca = Math.cos(rot), sa = Math.sin(rot);
                    var tx = ct[0] - (cl[0] * ca - cl[1] * sa);
                    var ty = ct[1] - (cl[0] * sa + cl[1] * ca);
                    var ok = true;
                    for (var j = 0; j < n; j++) {
                        var qx = L[j][0] * ca - L[j][1] * sa + tx;
                        var qy = L[j][0] * sa + L[j][1] * ca + ty;
                        var idx = ((k + dir * j) % n + n) % n;
                        var tg = target[idx];
                        if (Math.abs(qx - tg[0]) > 1e-6 || Math.abs(qy - tg[1]) > 1e-6) { ok = false; break; }
                    }
                    if (ok) {
                        var deg = rot * 180 / Math.PI;
                        return { x: tx, y: ty, rot: ((deg % 360) + 360) % 360, flip: flip };
                    }
                }
            }
        }
        return null;
    }

    /** 把形心对到指定位置（撒开用；旋转 45° 步进，平行四边形随机翻面） */
    function centeredOn(def, slotX, slotY) {
        var rot = 45 * Math.floor(Math.random() * 8);
        var flip = def.id === 'pg' ? Math.random() < 0.5 : false;
        var mx = flip ? -1 : 1;
        var ca = Math.cos(rad(rot)), sa = Math.sin(rad(rot));
        var c = centroid(def.local);
        var cx = c[0] * mx, cy = c[1];
        return {
            x: slotX - (cx * ca - cy * sa),
            y: slotY - (cx * sa + cy * ca),
            rot: rot,
            flip: flip
        };
    }

    /* ---------- 渲染 ---------- */

    function currentChallenge() {
        return CHALLENGES[state.task] || null;
    }

    function render() {
        els.preview.innerHTML = '';
        var ch = currentChallenge();
        svg = svgEl('svg', 'tg-board');
        svg.setAttribute('viewBox', VIEWBOX.join(' '));
        svg.setAttribute('preserveAspectRatio', 'xMidYMid meet');

        if (ch && state.showGrid) {
            svg.appendChild(buildGrid(ch.outline));
        }
        if (ch && state.showTarget) {
            var gT = svgEl('g', 'tg-target');
            var poly = svgEl('polygon');
            poly.setAttribute('points', pointsAttr(ch.outline));
            gT.appendChild(poly);
            svg.appendChild(gT);
        }

        var gP = svgEl('g', 'tg-pieces');
        var ids = pieceOrder();
        for (var i = 0; i < ids.length; i++) {
            gP.appendChild(buildPiece(ids[i]));
        }
        svg.appendChild(gP);
        els.preview.appendChild(svg);

        fitView();
        updateProgress();
        syncSeg();
    }

    /** 挑战中心（轮廓包围盒中点）；自由拼摆为 (2,0) */
    function challengeCenter(ch) {
        if (!ch) { return [2, 0]; }
        var minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
        for (var i = 0; i < ch.outline.length; i++) {
            var p = ch.outline[i];
            if (p[0] < minX) { minX = p[0]; }
            if (p[0] > maxX) { maxX = p[0]; }
            if (p[1] < minY) { minY = p[1]; }
            if (p[1] > maxY) { maxY = p[1]; }
        }
        return [(minX + maxX) / 2, (minY + maxY) / 2];
    }

    /** 视口自适应：以轮廓中心为锚点对称取半径（散点圈挂在中心周围），按舞台纵横比扩展 */
    function fitView() {
        if (!svg) { return; }
        var W = els.preview.clientWidth, H = els.preview.clientHeight;
        if (!W || !H) { return; }
        var ch = currentChallenge();
        var c = challengeCenter(ch);
        var minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
        function grow(x, y) {
            if (x < minX) { minX = x; }
            if (x > maxX) { maxX = x; }
            if (y < minY) { minY = y; }
            if (y > maxY) { maxY = y; }
        }
        for (var s = 0; s < SPOTS.length; s++) { grow(c[0] + SPOTS[s][0], c[1] + SPOTS[s][1]); }
        if (ch) {
            for (var o = 0; o < ch.outline.length; o++) { grow(ch.outline[o][0], ch.outline[o][1]); }
        }
        var PAD = 1.6; /* 块体半径 + 抖动 + 呼吸空间 */
        var rx = Math.max(Math.abs(minX - c[0]), Math.abs(maxX - c[0])) + PAD;
        var ry = Math.max(Math.abs(minY - c[1]), Math.abs(maxY - c[1])) + PAD;
        var w = rx * 2, h = ry * 2;
        var aspect = W / H;
        if (w / h < aspect) { w = h * aspect; } else { h = w / aspect; }
        svg.setAttribute('viewBox',
            (c[0] - w / 2).toFixed(2) + ' ' + (c[1] - h / 2).toFixed(2) + ' ' +
            w.toFixed(2) + ' ' + h.toFixed(2));
    }

    function buildGrid(outline) {
        var g = svgEl('g', 'tg-grid');
        var minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
        for (var i = 0; i < outline.length; i++) {
            minX = Math.min(minX, outline[i][0]); maxX = Math.max(maxX, outline[i][0]);
            minY = Math.min(minY, outline[i][1]); maxY = Math.max(maxY, outline[i][1]);
        }
        for (var x = Math.ceil(minX); x <= Math.floor(maxX); x++) {
            var l1 = svgEl('line');
            l1.setAttribute('x1', String(x)); l1.setAttribute('y1', String(minY));
            l1.setAttribute('x2', String(x)); l1.setAttribute('y2', String(maxY));
            g.appendChild(l1);
        }
        for (var y = Math.ceil(minY); y <= Math.floor(maxY); y++) {
            var l2 = svgEl('line');
            l2.setAttribute('x1', String(minX)); l2.setAttribute('y1', String(y));
            l2.setAttribute('x2', String(maxX)); l2.setAttribute('y2', String(y));
            g.appendChild(l2);
        }
        return g;
    }

    function pointsAttr(pts) {
        var out = [];
        for (var i = 0; i < pts.length; i++) {
            out.push(pts[i][0] + ',' + pts[i][1]);
        }
        return out.join(' ');
    }

    function buildPiece(id) {
        var def = defOf(id);
        var poly = svgEl('polygon', 'tg-piece' + (id === selected ? ' is-sel' : ''));
        poly.setAttribute('data-id', id);
        poly.setAttribute('points', pointsAttr(def.local));
        poly.setAttribute('fill', def.color);
        applyTransform(poly, id);
        return poly;
    }

    function applyTransform(node, id) {
        var t = transforms[id];
        node.setAttribute('transform', 'translate(' + t.x + ',' + t.y + ')' +
            ' rotate(' + t.rot + ')' +
            (t.flip ? ' scale(-1,1)' : ''));
    }

    function setResult(msg) {
        els.stat.textContent = msg;
    }

    function updateProgress() {
        var ch = currentChallenge();
        if (!ch) {
            setResult('自由拼摆 · 拖动色块随意创作');
            chrome.setStatus('自由拼摆', 'ok');
            return;
        }
        var n = won ? 7 : countPlaced();
        setResult(ch.label + ' · 已放好 ' + n + ' / 7 块');
        chrome.setStatus(won ? '🎉 ' + ch.label + ' · 拼好了！' : ch.label + ' · ' + n + '/7', 'ok');
    }

    function syncSeg() {
        var btns = els.seg.getElementsByTagName('button');
        for (var i = 0; i < btns.length; i++) {
            btns[i].className = btns[i].getAttribute('data-task') === state.task ? 'is-on' : '';
        }
    }


    /* ---------- 交互 ---------- */

    function toWorldPoint(evt) {
        if (!svg) { return null; }
        var ctm = svg.getScreenCTM();
        if (!ctm) { return null; }
        var inv;
        try { inv = ctm.inverse(); } catch (e) { return null; }
        if (typeof DOMPoint === 'function') {
            var p = new DOMPoint(evt.clientX, evt.clientY).matrixTransform(inv);
            return { x: p.x, y: p.y };
        }
        if (svg.createSVGPoint) {
            var sp = svg.createSVGPoint();
            sp.x = evt.clientX; sp.y = evt.clientY;
            var r = sp.matrixTransform(inv);
            return { x: r.x, y: r.y };
        }
        return null;
    }

    function idFromTarget(node) {
        while (node && node !== svg) {
            if (node.getAttribute && node.getAttribute('data-id')) { return node.getAttribute('data-id'); }
            node = node.parentNode;
        }
        return null;
    }

    function bringToFront(id) {
        var ids = pieceOrder().filter(function (v) { return v !== id; });
        ids.push(id);
        order = ids;
        var gP = svg ? svg.querySelector('.tg-pieces') : null;
        if (!gP) { return; }
        var node = gP.querySelector('.tg-piece[data-id="' + id + '"]');
        if (node && node.parentNode) {
            node.parentNode.removeChild(node);
            gP.appendChild(node);
        }
    }

    function select(id) {
        selected = id;
        if (!svg) { return; }
        var nodes = svg.querySelectorAll('.tg-piece');
        for (var i = 0; i < nodes.length; i++) {
            var on = nodes[i].getAttribute('data-id') === id;
            nodes[i].setAttribute('class', 'tg-piece' + (on ? ' is-sel' : ''));
        }
        persist();
    }

    function onPointerDown(evt) {
        if (animating) { return; }
        var id = idFromTarget(evt.target);
        if (!id) { return; }
        var w = toWorldPoint(evt);
        if (!w) { return; }
        select(id);
        bringToFront(id);
        var t = transforms[id];
        drag = { id: id, dx: t.x - w.x, dy: t.y - w.y };
        evt.preventDefault();
    }

    function onPointerMove(evt) {
        if (!drag) { return; }
        var w = toWorldPoint(evt);
        if (!w) { return; }
        var t = transforms[drag.id];
        t.x = w.x + drag.dx;
        t.y = w.y + drag.dy;
        var node = svg.querySelector('.tg-piece[data-id="' + drag.id + '"]');
        if (node) { applyTransform(node, drag.id); }
        evt.preventDefault();
    }

    function onPointerUp() {
        if (!drag) { return; }
        var id = drag.id;
        drag = null;
        if (state.snap) {
            var t = transforms[id];
            t.x = Math.round(t.x * 4) / 4;
            t.y = Math.round(t.y * 4) / 4;
            var node = svg.querySelector('.tg-piece[data-id="' + id + '"]');
            if (node) { applyTransform(node, id); }
        }
        persist();
        afterMove();
    }

    function rotateSel(delta) {
        var t = transforms[selected];
        if (!t) { return; }
        t.rot = ((t.rot + delta) % 360 + 360) % 360;
        var node = svg ? svg.querySelector('.tg-piece[data-id="' + selected + '"]') : null;
        if (node) { applyTransform(node, selected); }
        persist();
        afterMove();
    }

    function flipSel() {
        var t = transforms[selected];
        if (!t) { return; }
        t.flip = !t.flip;
        var node = svg ? svg.querySelector('.tg-piece[data-id="' + selected + '"]') : null;
        if (node) { applyTransform(node, selected); }
        persist();
        afterMove();
        chrome.toast(t.flip ? '已翻面' : '已翻回正面');
    }

    function nudge(dx, dy) {
        var t = transforms[selected];
        if (!t) { return; }
        t.x += dx;
        t.y += dy;
        var node = svg ? svg.querySelector('.tg-piece[data-id="' + selected + '"]') : null;
        if (node) { applyTransform(node, selected); }
        persist();
        afterMove();
    }

    function shuffle() {
        if (animating) { return; }
        var ch = currentChallenge();
        var c = challengeCenter(ch);
        var cx = c[0], cy = c[1];
        var ids = [];
        for (var i = 0; i < PIECES.length; i++) { ids.push(PIECES[i].id); }
        for (var s = ids.length - 1; s > 0; s--) {
            var j = Math.floor(Math.random() * (s + 1));
            var tmp = ids[s]; ids[s] = ids[j]; ids[j] = tmp;
        }
        var jitter = function () { return (Math.random() - 0.5) * 0.7; };
        for (var k = 0; k < ids.length; k++) {
            transforms[ids[k]] = centeredOn(defOf(ids[k]),
                cx + SPOTS[k][0] + jitter(), cy + SPOTS[k][1] + jitter());
        }
        order = ids;
        won = false;
        demo = false;
        challenge = { started: false, startAt: 0, elapsed: 0 };
        els.win.hidden = true;
        persist();
        render();
        try { chrome.beep('ok'); } catch (e) { /* 静默 */ }
    }

    /** 动画移动到解法位置 */
    function showAnswer() {
        var ch = currentChallenge();
        if (!ch) {
            chrome.toast('先选一个挑战（拼正方形 / 拼大三角形）');
            return;
        }
        if (animating) { return; }
        won = false;
        demo = false;
        els.win.hidden = true;
        var plans = [];
        for (var i = 0; i < PIECES.length; i++) {
            var def = PIECES[i];
            var solved = solveTransform(def.local, ch.targets[def.id]);
            if (!solved) { continue; }
            plans.push({ id: def.id, from: transforms[def.id], to: solved });
        }
        if (!plans.length) { chrome.toast('解法求解失败', 'err'); return; }

        animating = true;
        var t0 = 0;
        var DUR = 520;
        var ease = function (p) { return p < 0.5 ? 2 * p * p : -1 + (4 - 2 * p) * p; };

        function step(ts) {
            if (!t0) { t0 = ts; }
            var p = Math.min(1, (ts - t0) / DUR);
            var e = ease(p);
            for (var i = 0; i < plans.length; i++) {
                var pl = plans[i];
                var t = transforms[pl.id];
                t.x = pl.from.x + (pl.to.x - pl.from.x) * e;
                t.y = pl.from.y + (pl.to.y - pl.from.y) * e;
                var d = ((pl.to.rot - pl.from.rot) % 360 + 540) % 360 - 180;
                t.rot = pl.from.rot + d * e;
                t.flip = pl.to.flip;
                var node = svg.querySelector('.tg-piece[data-id="' + pl.id + '"]');
                if (node) { applyTransform(node, pl.id); }
            }
            if (p < 1) {
                window.requestAnimationFrame(step);
            } else {
                for (var j = 0; j < plans.length; j++) {
                    transforms[plans[j].id] = {
                        x: plans[j].to.x, y: plans[j].to.y,
                        rot: plans[j].to.rot, flip: plans[j].to.flip
                    };
                }
                animating = false;
                persist();
                demo = true;
                setResult('这是标准拼法之一 —— 拼法不唯一，试试别的摆法');
                updateProgress();
                try { chrome.beep('win'); } catch (e) { /* 静默 */ }
            }
        }
        window.requestAnimationFrame(step);
    }

    /* ---------- 连续判定：铺满 = 7 块全部进剪影 + 两两不重叠（分离轴 + 边界容差） ---------- */

    /** 点到线段距离（块顶点常恰好落在剪影边上，射线法对贴边点不稳定） */
    function distToSeg(p, a, b) {
        var vx = b[0] - a[0], vy = b[1] - a[1];
        var wx = p[0] - a[0], wy = p[1] - a[1];
        var len2 = vx * vx + vy * vy;
        var t = len2 > 0 ? Math.max(0, Math.min(1, (wx * vx + wy * vy) / len2)) : 0;
        return Math.hypot(p[0] - (a[0] + t * vx), p[1] - (a[1] + t * vy));
    }

    /** 多边形 poly（各顶点）是否都落在 target 内（或容差内贴边） */
    function polyInside(poly, target) {
        for (var i = 0; i < poly.length; i++) {
            var pt = poly[i];
            if (pointInPoly(target, pt[0], pt[1])) { continue; }
            var onEdge = false;
            for (var j = 0; j < target.length; j++) {
                if (distToSeg(pt, target[j], target[(j + 1) % target.length]) < EPS) {
                    onEdge = true;
                    break;
                }
            }
            if (!onEdge) { return false; }
        }
        return true;
    }

    /** 凸多边形相交（分离轴，EPS 内的重叠视为不重叠） */
    function polysOverlap(a, b) {
        var polys = [a, b];
        for (var p = 0; p < 2; p++) {
            var poly = polys[p];
            for (var i = 0; i < poly.length; i++) {
                var j = (i + 1) % poly.length;
                var nx = poly[j][1] - poly[i][1];
                var ny = -(poly[j][0] - poly[i][0]);
                var len = Math.hypot(nx, ny);
                if (len < 1e-9) { continue; }
                nx /= len; ny /= len;
                var minA = Infinity, maxA = -Infinity, minB = Infinity, maxB = -Infinity;
                for (var k = 0; k < a.length; k++) {
                    var d = a[k][0] * nx + a[k][1] * ny;
                    if (d < minA) { minA = d; }
                    if (d > maxA) { maxA = d; }
                }
                for (var k2 = 0; k2 < b.length; k2++) {
                    var d2 = b[k2][0] * nx + b[k2][1] * ny;
                    if (d2 < minB) { minB = d2; }
                    if (d2 > maxB) { maxB = d2; }
                }
                if (maxA <= minB + EPS || maxB <= minA + EPS) { return false; }
            }
        }
        return true;
    }

    /** 已「放好」的块数：完全在剪影内且不与任何块重叠 */
    function countPlaced() {
        var ch = currentChallenge();
        if (!ch) { return 0; }
        var n = 0;
        for (var i = 0; i < PIECES.length; i++) {
            var poly = toWorld(PIECES[i], PIECES[i].id);
            if (!polyInside(poly, ch.outline)) { continue; }
            var ok = true;
            for (var j = 0; j < PIECES.length; j++) {
                if (j === i) { continue; }
                if (polysOverlap(poly, toWorld(PIECES[j], PIECES[j].id))) { ok = false; break; }
            }
            if (ok) { n++; }
        }
        return n;
    }

    /** 每次移动 / 旋转 / 翻面后的判定入口 */
    function afterMove() {
        var ch = currentChallenge();
        if (!ch || demo || won) { updateProgress(); return; }
        if (!challenge.started) {
            challenge.started = true;
            challenge.startAt = Date.now();
        }
        if (countPlaced() >= 7) {
            won = true;
            challenge.elapsed = Date.now() - challenge.startAt;
            showWin();
        } else {
            updateProgress();
        }
    }

    function showWin() {
        els.winMeta.textContent = '用时 ' + Math.max(1, Math.round(challenge.elapsed / 1000)) +
            ' 秒 · 7 块全部放好、互不重叠';
        els.win.hidden = false;
        try { chrome.beep('win'); } catch (e) { /* 静默 */ }
        updateProgress();
    }

    /** 当前内容（剪影 ∪ 所有块）的世界包围盒，供打印取景 */
    function contentBBox(ch) {
        var pts = [];
        if (ch) { pts = pts.concat(ch.outline); }
        for (var i = 0; i < PIECES.length; i++) {
            pts = pts.concat(toWorld(PIECES[i], PIECES[i].id));
        }
        if (!pts.length) { return VIEWBOX; }
        var minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
        for (var k = 0; k < pts.length; k++) {
            minX = Math.min(minX, pts[k][0]); maxX = Math.max(maxX, pts[k][0]);
            minY = Math.min(minY, pts[k][1]); maxY = Math.max(maxY, pts[k][1]);
        }
        return [minX - 1, minY - 1, (maxX - minX) + 2, (maxY - minY) + 2];
    }

    function doPrint() {
        if (typeof window.print !== 'function') { chrome.toast('当前环境不支持打印', 'err'); return; }
        var old = document.querySelector('.tg-print');
        if (old && old.parentNode) { old.parentNode.removeChild(old); }
        var ch = currentChallenge();
        var wrap = document.createElement('div');
        wrap.className = 'tg-print';
        var title = document.createElement('div');
        title.className = 'tg-print__title';
        title.textContent = state.title || '七 巧 板';
        wrap.appendChild(title);
        var sub = document.createElement('div');
        sub.className = 'tg-print__sub';
        var info = ch ? (ch.label + ' · ' + ch.note) : '自由创作 · 拼法不唯一';
        if (state.showMeta) { info += '　｜　姓名：____________　班级：__________'; }
        sub.textContent = info;
        wrap.appendChild(sub);
        if (svg) {
            var clone = svg.cloneNode(true);
            clone.setAttribute('class', 'tg-print__svg');
            clone.setAttribute('viewBox', contentBBox(ch).join(' '));
            wrap.appendChild(clone);
        }
        document.body.appendChild(wrap);
        var done = function () {
            if (wrap.parentNode) { wrap.parentNode.removeChild(wrap); }
        };
        window.addEventListener('afterprint', done, { once: true });
        window.setTimeout(function () {
            try { window.print(); } catch (e) { chrome.toast('打印失败，请用浏览器打印快捷键', 'err'); }
            window.setTimeout(done, 800);
        }, 60);
    }

    function setTask(task) {
        if (TASKS.indexOf(task) < 0) { return; }
        if (task !== state.task) {
            state.task = task;
            persist();
        }
        shuffle();
    }

    /* ---------- 设置抽屉 ---------- */

    function options(pairs, current) {
        var out = '';
        for (var i = 0; i < pairs.length; i++) {
            out += '<option value="' + pairs[i][0] + '"' +
                (String(pairs[i][0]) === String(current) ? ' selected' : '') + '>' + pairs[i][1] + '</option>';
        }
        return out;
    }

    function buildSettings(body) {
        var v = function (s) { return ET.escapeHtml(s); };
        body.innerHTML =
            '<h4>玩法</h4>' +
            '<div class="et-drawer__row">' +
            '<select class="et-drawer__input" id="tgSetTask">' +
            options([['free', '自由拼摆'], ['square', '拼正方形'], ['triangle', '拼大三角形']], state.task) +
            '</select></div>' +

            '<h4>画布</h4>' +
            '<div class="et-drawer__row">' +
            '<input class="et-drawer__input" id="tgSetTitle" value="' + v(state.title) +
            '" placeholder="纸面标题"></div>' +
            '<label class="et-drawer__switch">显示目标轮廓（灰色虚线）' +
            '<input type="checkbox" id="tgSetTarget"' + (state.showTarget ? ' checked' : '') + '></label>' +
            '<label class="et-drawer__switch">显示参考网格' +
            '<input type="checkbox" id="tgSetGrid"' + (state.showGrid ? ' checked' : '') + '></label>' +
            '<label class="et-drawer__switch">打印姓名 / 班级栏' +
            '<input type="checkbox" id="tgSetMeta"' + (state.showMeta ? ' checked' : '') + '></label>' +

            '<h4>操作手感</h4>' +
            '<label class="et-drawer__switch">松手自动吸附（0.25 格）' +
            '<input type="checkbox" id="tgSetSnap"' + (state.snap ? ' checked' : '') + '></label>' +
            '<div class="et-drawer__row" style="margin-top:8px">' +
            '<select class="et-drawer__input" id="tgSetRot">' +
            options([['15', '每次旋转 15°（推荐）'], ['5', '每次旋转 5°（精调）'],
                ['45', '每次旋转 45°（快）']], state.rotStep) +
            '</select></div>' +

            '<h4>当前选中的块</h4>' +
            '<p class="et-drawer__tip">正在操作：<b>' + (defOf(selected) ? defOf(selected).label : '—') +
            '</b>。拖动可移动；滚轮 / 按钮旋转；平行四边形需要时点「翻转」翻面。</p>' +
            '<div class="et-drawer__row">' +
            '<button class="et-btn" id="tgSetCcw" type="button">逆时针</button>' +
            '<button class="et-btn" id="tgSetCw" type="button">顺时针</button>' +
            '<button class="et-btn" id="tgSetFlip" type="button">翻转</button>' +
            '<button class="et-btn et-btn--danger" id="tgSetReset" type="button">撒开重来</button>' +
            '</div>';

        var q = function (id) { return document.getElementById(id); };

        q('tgSetTask').addEventListener('change', function () { setTask(this.value); });
        q('tgSetTitle').addEventListener('input', function () { state.title = this.value; persist(); render(); });
        q('tgSetTarget').addEventListener('change', function () { state.showTarget = this.checked; persist(); render(); });
        q('tgSetGrid').addEventListener('change', function () { state.showGrid = this.checked; persist(); render(); });
        q('tgSetMeta').addEventListener('change', function () { state.showMeta = this.checked; persist(); render(); });
        q('tgSetSnap').addEventListener('change', function () { state.snap = this.checked; persist(); });
        q('tgSetRot').addEventListener('change', function () {
            state.rotStep = pickOpt(this.value, [5, 15, 45], DEFAULTS.rotStep);
            persist();
        });
        q('tgSetCcw').addEventListener('click', function () { rotateSel(-state.rotStep); });
        q('tgSetCw').addEventListener('click', function () { rotateSel(state.rotStep); });
        q('tgSetFlip').addEventListener('click', flipSel);
        q('tgSetReset').addEventListener('click', shuffle);
    }

    /* ---------- 事件与启动 ---------- */

    els.preview.addEventListener('pointerdown', onPointerDown);
    window.addEventListener('pointermove', onPointerMove);
    window.addEventListener('pointerup', onPointerUp);
    window.addEventListener('pointercancel', onPointerUp);
    window.addEventListener('resize', function () { fitView(); });

    els.preview.addEventListener('wheel', function (evt) {
        if (animating) { return; }
        var id = idFromTarget(evt.target);
        if (!id) { return; }
        select(id);
        evt.preventDefault();
        rotateSel(evt.deltaY > 0 ? state.rotStep : -state.rotStep);
    }, { passive: false });

    var segBtns = els.seg.getElementsByTagName('button');
    for (var b = 0; b < segBtns.length; b++) {
        (function (btn) {
            btn.addEventListener('click', function () { setTask(btn.getAttribute('data-task')); });
        })(segBtns[b]);
    }

    els.btnCw.addEventListener('click', function () { rotateSel(state.rotStep); });
    els.btnCcw.addEventListener('click', function () { rotateSel(-state.rotStep); });
    els.btnFlip.addEventListener('click', flipSel);
    els.btnShuffle.addEventListener('click', shuffle);
    els.btnAnswer.addEventListener('click', showAnswer);
    els.btnPrint.addEventListener('click', doPrint);

    els.winAgain.addEventListener('click', shuffle);
    els.winNext.addEventListener('click', function () {
        setTask(state.task === 'square' ? 'triangle' : 'square');
    });

    document.addEventListener('keydown', function (e) {
        if (isTypingTarget(e.target)) { return; }
        var k = e.key;
        if (k === '1') { setTask('free'); }
        else if (k === '2') { setTask('square'); }
        else if (k === '3') { setTask('triangle'); }
        else if (k === 'q' || k === 'Q') { rotateSel(-state.rotStep); e.preventDefault(); }
        else if (k === 'e' || k === 'E') { rotateSel(state.rotStep); e.preventDefault(); }
        else if (k === 'w' || k === 'W') { flipSel(); }
        else if (k === 'ArrowLeft') { nudge(-NUDGE, 0); e.preventDefault(); }
        else if (k === 'ArrowRight') { nudge(NUDGE, 0); e.preventDefault(); }
        else if (k === 'ArrowUp') { nudge(0, -NUDGE); e.preventDefault(); }
        else if (k === 'ArrowDown') { nudge(0, NUDGE); e.preventDefault(); }
        else if (k === 'r' || k === 'R') { shuffle(); }
        else if (k === 'a' || k === 'A') { showAnswer(); }
        else if ((k === 'p' || k === 'P') && !e.ctrlKey && !e.metaKey) { doPrint(); }
    });

    /* 首次进入：撒开摆放（已有存档则沿用） */
    if (store.get('pieces', null) === null) {
        shuffle();
    } else {
        render();
    }
})();
</script>

</body>
</html>
