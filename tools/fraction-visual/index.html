/*!
 * et-chrome.css — 工具通用外壳样式（顶栏 / 页脚 / 弹窗 / 按钮 / 主题）

/* ============ 设计令牌 ============ */
:root {
    --et-accent: #2563eb;
    --et-accent-weak: rgba(37, 99, 235, .14);
    --et-bg: #f4f6fb;
    --et-surface: #ffffff;
    --et-surface-2: #f8fafc;
    --et-fg: #0b1220;
    --et-muted: #64748b;
    --et-line: rgba(15, 23, 42, .12);
    --et-line-strong: rgba(15, 23, 42, .22);
    --et-glass: rgba(255, 255, 255, .85);
    --et-shadow-md: 0 10px 28px -18px rgba(15, 23, 42, .3);
    --et-shadow-lg: 0 24px 60px -32px rgba(15, 23, 42, .4);
    --et-ok: #059669;
    --et-warn: #d97706;
    --et-err: #dc2626;
    --et-radius: 12px;
    --et-radius-sm: 9px;
    --et-font: -apple-system, BlinkMacSystemFont, "Segoe UI",
               "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei",
               "Noto Sans SC", sans-serif;
    --et-mono: ui-monospace, "Cascadia Mono", Consolas, Menlo, monospace;
}

html[data-et-theme="dark"] {
    --et-bg: #0b1120;
    --et-surface: #111a2e;
    --et-surface-2: #0f1729;
    --et-fg: #f1f5f9;
    --et-muted: #94a3b8;
    --et-line: rgba(148, 163, 184, .18);
    --et-line-strong: rgba(148, 163, 184, .3);
    --et-glass: rgba(17, 26, 46, .85);
    --et-shadow-md: 0 10px 34px -18px rgba(0, 0, 0, .8);
    --et-shadow-lg: 0 24px 70px -30px rgba(0, 0, 0, .9);
    --et-ok: #34d399;
    --et-warn: #fbbf24;
    --et-err: #f87171;
}

/* ============ 基础 ============ */
.et-app {
    position: relative;
    isolation: isolate;
    display: flex;
    flex-direction: column;
    height: 100vh;
    height: 100dvh;
    overflow: hidden;
    background: var(--et-bg);
    color: var(--et-fg);
    font-family: var(--et-font);
    -webkit-font-smoothing: antialiased;
    transition: background .25s, color .25s;
}

/* 极光背景：径向渐变 + 呼吸动画（edupick 品质基线，老内核也不掉帧） */
.et-app::before {
    content: '';
    position: fixed;
    inset: 0;
    z-index: -1;
    pointer-events: none;
    background:
        radial-gradient(46% 40% at 20% 18%, var(--et-accent-weak), transparent 65%),
        radial-gradient(42% 38% at 82% 24%, var(--et-accent-weak), transparent 70%),
        radial-gradient(50% 44% at 55% 95%, rgba(16, 185, 129, .10), transparent 65%);
    animation: et-aurora 16s ease-in-out infinite alternate;
}

@keyframes et-aurora {
    from { opacity: .55; transform: scale(1); }
    to { opacity: 1; transform: scale(1.06); }
}

.et-app *,
.et-app *::before,
.et-app *::after { box-sizing: border-box; }

[hidden] { display: none !important; }

.et-icon {
    width: 18px;
    height: 18px;
    fill: none;
    stroke: currentColor;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
    flex: none;
}

/* ============ 顶栏 ============ */
.et-topbar {
    flex: none;
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 11px 20px;
    border-bottom: 1px solid var(--et-line);
    background: var(--et-glass);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    z-index: 20;
}

.et-brand {
    display: flex;
    align-items: center;
    gap: 10px;
    min-width: 0;
}

.et-brand__dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: var(--et-accent);
    box-shadow: 0 0 0 4px var(--et-accent-weak);
    flex: none;
}

.et-brand__name {
    font-weight: 800;
    font-size: 15px;
    letter-spacing: -.01em;
    white-space: nowrap;
}

.et-brand__sub {
    font-size: 12.5px;
    color: var(--et-muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.et-status {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 5px 14px;
    border-radius: 999px;
    font-size: 12.5px;
    color: var(--et-muted);
    background: var(--et-surface-2);
    border: 1px solid var(--et-line);
    white-space: nowrap;
    max-width: 42vw;
    overflow: hidden;
    text-overflow: ellipsis;
}

.et-status__dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--et-ok);
    flex: none;
    transition: background .2s;
}

.et-status[data-tone="err"] .et-status__dot { background: var(--et-err); }
.et-status[data-tone="warn"] .et-status__dot { background: var(--et-warn); }

.et-actions {
    display: flex;
    align-items: center;
    gap: 7px;
}

.et-icon-btn {
    display: inline-grid;
    place-items: center;
    width: 38px;
    height: 38px;
    font-size: 16px;
    line-height: 1;
    border-radius: 11px;
    border: 1px solid var(--et-line);
    background: var(--et-surface-2);
    color: var(--et-fg);
    cursor: pointer;
    transition: transform .14s, border-color .14s, color .14s, opacity .14s;
    -webkit-tap-highlight-color: transparent;
}

.et-icon-btn:hover {
    border-color: var(--et-accent);
    color: var(--et-accent);
    transform: translateY(-1px);
}

.et-icon-btn:active { transform: translateY(0); }
.et-icon-btn.is-off { opacity: .4; }
.et-icon-btn:focus-visible { outline: 2px solid var(--et-accent); outline-offset: 2px; }

/* ============ 主区默认 ============ */
.et-main {
    flex: 1;
    min-height: 0;
    position: relative;
    overflow: auto;
}

/* ============ 页脚（品牌回流 L2） ============ */
.et-footer {
    flex: none;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 7px 16px;
    font-size: 12px;
    color: var(--et-muted);
    border-top: 1px solid var(--et-line);
    background: var(--et-glass);
    user-select: none;
    z-index: 20;
}

.et-footer a {
    color: inherit;
    text-decoration: none;
    transition: color .14s;
}

.et-footer a:hover { color: var(--et-accent); }

/* ============ 按钮 ============ */
.et-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
    padding: 9px 16px;
    border-radius: 11px;
    font: inherit;
    font-size: 13.5px;
    font-weight: 700;
    border: 1px solid var(--et-line);
    background: var(--et-surface-2);
    color: var(--et-fg);
    cursor: pointer;
    transition: transform .14s, border-color .14s, color .14s, background .14s, box-shadow .14s;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
}

.et-btn:hover {
    border-color: var(--et-accent);
    color: var(--et-accent);
    transform: translateY(-1px);
}

.et-btn:active { transform: translateY(0); }
.et-btn:focus-visible { outline: 2px solid var(--et-accent); outline-offset: 2px; }
.et-btn:disabled { opacity: .45; cursor: not-allowed; transform: none; }

.et-btn--primary {
    background: var(--et-accent);
    border-color: var(--et-accent);
    color: #fff;
    box-shadow: 0 6px 18px -8px var(--et-accent);
}

.et-btn--primary:hover { color: #fff; filter: brightness(1.08); }
.et-btn--primary:disabled { filter: none; }

.et-btn--danger:hover {
    border-color: var(--et-err);
    color: var(--et-err);
}

.et-btn--lg {
    padding: 13px 26px;
    font-size: 16px;
    border-radius: 14px;
}

/* ============ 弹窗 ============ */
.et-modal {
    position: fixed;
    inset: 0;
    z-index: 100;
    display: grid;
    place-items: center;
    padding: 24px;
    background: rgba(2, 6, 23, .55);
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    animation: et-fade .18s ease;
}

.et-modal__panel {
    width: min(680px, 94vw);
    max-height: 86vh;
    max-height: 86dvh;
    display: flex;
    flex-direction: column;
    background: var(--et-surface);
    border: 1px solid var(--et-line);
    border-radius: 16px;
    box-shadow: var(--et-shadow-lg);
    animation: et-pop .2s cubic-bezier(.34, 1.4, .64, 1);
    overflow: hidden;
}

.et-modal__panel--narrow { width: min(460px, 92vw); }
.et-modal__panel--wide { width: min(900px, 94vw); }

.et-modal__head {
    flex: none;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 16px 20px;
    border-bottom: 1px solid var(--et-line);
    font-weight: 800;
    font-size: 15px;
}

.et-modal__head .et-icon-btn {
    margin-left: auto;
    width: 32px;
    height: 32px;
}

.et-modal__body {
    flex: 1;
    min-height: 0;
    overflow: auto;
    padding: 18px 20px;
}

.et-modal__foot {
    flex: none;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 14px 20px;
    border-top: 1px solid var(--et-line);
    background: var(--et-surface-2);
}

.et-modal__foot .spacer { flex: 1; }

@keyframes et-fade {
    from { opacity: 0; }
}

@keyframes et-pop {
    from { opacity: 0; transform: translateY(14px) scale(.97); }
}

/* ============ 轻提示（toast） ============ */
.et-toast {
    position: fixed;
    left: 50%;
    bottom: 56px;
    transform: translateX(-50%) translateY(10px);
    z-index: 120;
    display: flex;
    align-items: center;
    gap: 9px;
    max-width: min(520px, 88vw);
    padding: 11px 18px;
    border-radius: 12px;
    font-size: 13.5px;
    font-weight: 600;
    color: #fff;
    background: rgba(15, 23, 42, .92);
    border: 1px solid rgba(148, 163, 184, .25);
    box-shadow: var(--et-shadow-lg);
    opacity: 0;
    pointer-events: none;
    transition: opacity .22s, transform .22s;
}

.et-toast.is-show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
}

.et-toast[data-tone="ok"] { background: rgba(5, 150, 105, .95); }
.et-toast[data-tone="err"] { background: rgba(220, 38, 38, .95); }
.et-toast[data-tone="warn"] { background: rgba(217, 119, 6, .95); }

/* ============ 设置抽屉（右上角入口，edupick 交互） ============ */
.et-drawer-backdrop {
    position: fixed;
    inset: 0;
    z-index: 90;
    background: rgba(2, 6, 23, .45);
    backdrop-filter: blur(3px);
    -webkit-backdrop-filter: blur(3px);
    opacity: 0;
    transition: opacity .2s;
}

.et-drawer-backdrop.is-open { opacity: 1; }

.et-drawer {
    position: absolute;
    top: 0;
    right: 0;
    height: 100%;
    width: min(400px, 92vw);
    display: flex;
    flex-direction: column;
    background: var(--et-surface);
    border-left: 1px solid var(--et-line);
    box-shadow: var(--et-shadow-lg);
    transform: translateX(100%);
    transition: transform .22s cubic-bezier(.32, .72, .35, 1);
}

.et-drawer-backdrop.is-open .et-drawer { transform: translateX(0); }

.et-drawer__head {
    flex: none;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 15px 18px;
    border-bottom: 1px solid var(--et-line);
    font-weight: 800;
    font-size: 15px;
    color: var(--et-accent);
}

.et-drawer__head .et-icon-btn {
    margin-left: auto;
    width: 32px;
    height: 32px;
}

.et-drawer__body {
    flex: 1;
    min-height: 0;
    overflow: auto;
    padding: 16px 18px 24px;
}

/* 抽屉内容通用小节（工具复用） */
.et-drawer__body h4 {
    margin: 18px 0 8px;
    font-size: 12px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: .08em;
    color: var(--et-muted);
}

.et-drawer__body h4:first-child { margin-top: 0; }

.et-drawer__row {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
}

.et-drawer__tip {
    margin: 8px 0 0;
    font-size: 12px;
    line-height: 1.8;
    color: var(--et-muted);
}

.et-drawer__tip b { color: var(--et-fg); }

.et-drawer__input {
    flex: 1;
    min-width: 0;
    padding: 9px 12px;
    border: 1px solid var(--et-line-strong);
    border-radius: 9px;
    background: var(--et-surface-2);
    color: var(--et-fg);
    font: inherit;
    font-size: 13.5px;
    transition: border-color .14s, box-shadow .14s;
}

.et-drawer__input:focus {
    outline: none;
    border-color: var(--et-accent);
    box-shadow: 0 0 0 3px var(--et-accent-weak);
}

.et-drawer__switch {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 10px 0;
    border-bottom: 1px dashed var(--et-line);
    font-size: 13.5px;
    font-weight: 600;
    color: var(--et-fg);
    cursor: pointer;
    user-select: none;
}

.et-drawer__switch input {
    width: 17px;
    height: 17px;
    accent-color: var(--et-accent);
    cursor: pointer;
}
</style>

            }

            this._done[event + ':' + (toolId || '')] = true;
            var payload = JSON.stringify({ event: event, tool: toolId || '' });

            try {
                if (global.navigator.sendBeacon) {
                    return global.navigator.sendBeacon(
                        this.endpoint + '/api/track',
                        new Blob([payload], { type: 'text/plain;charset=UTF-8' })
                    );
                }
                global.fetch(this.endpoint + '/api/track', {
                    method: 'POST',
                    body: payload,
                    keepalive: true,
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'text/plain;charset=UTF-8' }
                });
                return true;
            } catch (err) {
                return false;
            }
        }
    };

    ET.Stats = Stats;
})(window);
</script>

<!-- 使用统计：删除上方 et-stats 块即可完全不联网（模块化设计） -->
<script>
try { ET.Stats.send('use_offline', 'fraction-visual'); } catch (e) { /* 静默 */ }
</script>

<script>
(function () {
    'use strict';

    var TOOL_ID = 'fraction-visual';
    var store = ET.store(TOOL_ID);

    var CHIPS = [
        [1, 2], [1, 3], [2, 3], [1, 4], [3, 4], [1, 5], [2, 5],
        [3, 5], [1, 6], [5, 6], [1, 8], [3, 8], [1, 10], [3, 10]
    ];
    var MAX_DENS = [12, 20];

    /* ============ 数字工具 ============ */

    function clampInt(value, lo, hi, fallback) {
        var n = Math.round(Number(value));
        if (!isFinite(n)) { return fallback; }
        return Math.max(lo, Math.min(hi, n));
    }

    function gcd(x, y) {
        x = Math.abs(x);
        y = Math.abs(y);
        while (y) {
            var t = x % y;
            x = y;
            y = t;
        }
        return x || 1;
    }

    function lcm(x, y) {
        return x / gcd(x, y) * y;
    }

    function trimNum(n) {
        var s = Number(n).toFixed(3).replace(/0+$/, '').replace(/\.$/, '');
        return s === '-0' || s === '' ? '0' : s;
    }

    function validMaxDen(v) {
        return MAX_DENS.indexOf(Number(v)) !== -1 ? Number(v) : 12;
    }

    function validFrac(raw, fallback, maxDen) {
        var o = raw && typeof raw === 'object' ? raw : {};
        var den = clampInt(o.den, 1, maxDen, fallback.den);
        return { num: clampInt(o.num, 0, den, fallback.num), den: den };
    }

    var maxDen = validMaxDen(store.get('maxDen', 12));

    var state = {
        a: validFrac(store.get('a', null), { num: 1, den: 2 }, maxDen),
        b: validFrac(store.get('b', null), { num: 2, den: 3 }, maxDen),
        maxDen: maxDen,
        compare: store.get('compare', false) === true,
        numeric: store.get('numeric', true) !== false
    };

    var chrome = ET.Chrome.mount({
        toolId: TOOL_ID,
        title: '分数可视化',
        sub: '数学 · 饼图 / 色条 / 约分对比',
        accent: '#d97706',
        status: '就绪',
        sound: true,
        primary: function () { step('a', 'num', 1); },          /* 翻页笔下页键：分子 +1 */
        secondary: toggleCompare,                              /* 翻页笔上页键：开关对比模式 */
        settings: { title: '可视化设置', build: buildSettings },
        help: '<div style="font-size:13.5px;line-height:2">' +
            '<p style="margin:0 0 8px"><b>看什么</b>：左边饼图把整个圆平均分成「分母」份，涂色的是「分子」份；右边色条是同一件事的另一种画法。</p>' +
            '<p style="margin:0 0 8px"><b>改分数</b>：分子 / 分母各有 − + 按钮；也可以直接在色条上左右拖动，涂色格数就是分子。底部常用分数可一键切换。</p>' +
            '<p style="margin:0 0 8px"><b>约分</b>：底部自动给出最简分数，并说明分子分母同除了几。</p>' +
            '<p style="margin:0 0 8px"><b>比大小</b>：点右上「对比模式」出现分数 B，可拖动它的色条；数轴上的 A / B 圆点位置一眼看出谁更靠近 1，底部还会给出通分过程。</p>' +
            '<p style="margin:0"><b>快捷键</b>：空格 / 右键 = 分子 +1；←→ = 分子 ∓1；↑↓ = 分母 ±1。</p></div>'
    });

    /* ============ 绘制 ============ */

    function polar(cx, cy, r, deg) {
        var rad = (deg - 90) * Math.PI / 180;
        return [cx + r * Math.cos(rad), cy + r * Math.sin(rad)];
    }

    function slicePath(cx, cy, r, from, to) {
        var p1 = polar(cx, cy, r, from);
        var p2 = polar(cx, cy, r, to);
        var large = (to - from) > 180 ? 1 : 0;
        return 'M ' + cx + ' ' + cy +
            ' L ' + p1[0].toFixed(2) + ' ' + p1[1].toFixed(2) +
            ' A ' + r + ' ' + r + ' 0 ' + large + ' 1 ' + p2[0].toFixed(2) + ' ' + p2[1].toFixed(2) + ' Z';
    }

    function renderPie(svg, frac) {
        var out = '';
        if (frac.den <= 1) {
            out = '<circle class="fv-slice' + (frac.num >= 1 ? ' is-on' : '') + '" cx="100" cy="100" r="92"></circle>';
        } else {
            for (var i = 0; i < frac.den; i++) {
                var from = i * 360 / frac.den;
                var to = (i + 1) * 360 / frac.den;
                out += '<path class="fv-slice' + (i < frac.num ? ' is-on' : '') + '" d="' +
                    slicePath(100, 100, 92, from, to) + '"></path>';
            }
        }
        svg.innerHTML = out;
    }

    function renderBar(bar, frac) {
        var out = '';
        for (var i = 0; i < frac.den; i++) {
            out += '<span class="fv-seg' + (i < frac.num ? ' is-on' : '') + '"></span>';
        }
        bar.innerHTML = out;

        /* 拖动把手（显示当前分数），让色条也有明确的交互反馈 */
        var knob = document.createElement('span');
        knob.className = 'fv-knob';
        knob.setAttribute('data-label', frac.num + '/' + frac.den);
        knob.style.left = (frac.den ? frac.num / frac.den * 100 : 0) + '%';
        bar.appendChild(knob);
    }

    function memoOf(frac) {
        if (frac.den <= 1) { return '整个圆看作 1，取 ' + frac.num; }
        return '把 1 平均分成 ' + frac.den + ' 份，取其中 ' + frac.num + ' 份';
    }

    function capOf(frac) {
        if (frac.den <= 1) { return '整体 1 · 拖动色条改变份数'; }
        return '每格 = 1/' + frac.den + ' · 拖动色条改变分子';
    }

    function renderNumline() {
        var svg = document.getElementById('numline');
        var x0 = 46;
        var x1 = 854;
        var y = 46;
        var out = '<line class="fv-nl__axis" x1="' + x0 + '" y1="' + y + '" x2="' + x1 + '" y2="' + y + '"></line>';
        for (var i = 0; i <= 10; i++) {
            var x = x0 + (x1 - x0) * i / 10;
            out += '<line class="fv-nl__tick" x1="' + x.toFixed(1) + '" y1="' + (y - 6) +
                '" x2="' + x.toFixed(1) + '" y2="' + (y + 6) + '"></line>';
        }
        out += '<text class="fv-nl__label" x="' + x0 + '" y="' + (y + 26) + '" text-anchor="middle">0</text>';
        out += '<text class="fv-nl__label" x="' + x1 + '" y="' + (y + 26) + '" text-anchor="middle">1</text>';
        out += numlineMarker(x0, x1, y, state.a, 'A', 'fv-nl__mark-a');
        if (state.compare) {
            out += numlineMarker(x0, x1, y, state.b, 'B', 'fv-nl__mark-b');
        }
        svg.innerHTML = out;
    }

    function numlineMarker(x0, x1, y, frac, label, cls) {
        var ratio = frac.den ? frac.num / frac.den : 0;
        var x = (x0 + (x1 - x0) * ratio).toFixed(1);
        return '<circle class="' + cls + '" cx="' + x + '" cy="' + y + '" r="7"></circle>' +
            '<text class="fv-nl__tag" x="' + x + '" y="' + (y - 15) + '" text-anchor="middle">' +
            label + ' ' + frac.num + '/' + frac.den + '</text>';
    }

    /* ============ 信息带 ============ */

    function renderInfo() {
        var a = state.a;
        var value = a.num / a.den;
        var g = gcd(a.num, a.den);
        var rn = a.num / g;
        var rd = a.den / g;

        document.getElementById('infoFrac').textContent = a.num + '/' + a.den;

        var reduced = rn + '/' + rd;
        if (rd === 1) { reduced += '（整数 ' + rn + '）'; }
        reduced += (g > 1 && a.num > 0) ? '，同除以 ' + g : '，已是最简';
        document.getElementById('infoReduced').textContent = reduced;

        document.getElementById('infoDec').textContent = trimNum(value);
        document.getElementById('infoPct').textContent = trimNum(value * 100) + '%';

        var dec = document.getElementById('infoDec').parentElement;
        var pct = document.getElementById('infoPct').parentElement;
        dec.hidden = !state.numeric;
        pct.hidden = !state.numeric;
    }

    function renderVerdict() {
        var el = document.getElementById('verdict');
        el.textContent = '';
        if (!state.compare) { return; }

        var a = state.a;
        var b = state.b;
        var left = a.num * b.den;
        var right = b.num * a.den;
        var sign = left > right ? '>' : (left < right ? '<' : '=');
        var common = lcm(a.den, b.den);
        var an = a.num * (common / a.den);
        var bn = b.num * (common / b.den);

        el.appendChild(document.createTextNode(a.num + '/' + a.den + ' ' + sign + ' ' + b.num + '/' + b.den));

        var small = document.createElement('small');
        small.textContent = sign === '='
            ? '等值分数，通分后都等于 ' + an + '/' + common
            : '通分：' + an + '/' + common + ' ' + sign + ' ' + bn + '/' + common;
        el.appendChild(small);
    }

    function renderChips() {
        var box = document.getElementById('chips');
        box.textContent = '';
        for (var i = 0; i < CHIPS.length; i++) {
            (function (pair) {
                var b = document.createElement('button');
                b.type = 'button';
                b.className = 'fv-chip' + (state.a.num === pair[0] && state.a.den === pair[1] ? ' is-active' : '');
                b.textContent = pair[0] + '/' + pair[1];
                b.title = '把分数 A 设为 ' + pair[0] + '/' + pair[1];
                b.addEventListener('click', function () {
                    setFrac('a', pair[0], pair[1]);
                    chrome.beep('ok');
                });
                box.appendChild(b);
            })(CHIPS[i]);
        }
    }

    function updateStatus() {
        var a = state.a;
        var text = a.num + '/' + a.den;
        if (state.numeric) { text += ' = ' + trimNum(a.num / a.den) + ' · ' + trimNum(a.num * 100 / a.den) + '%'; }
        if (state.compare) {
            var left = a.num * state.b.den;
            var right = state.b.num * a.den;
            text += ' · 与 ' + state.b.num + '/' + state.b.den + ' 相比 ' +
                (left > right ? '更大' : (left < right ? '更小' : '相等'));
        }
        chrome.setStatus(text);
    }

    function render() {
        document.getElementById('valNum').textContent = String(state.a.num);
        document.getElementById('valDen').textContent = String(state.a.den);
        document.getElementById('fracNumA').textContent = String(state.a.num);
        document.getElementById('fracDenA').textContent = String(state.a.den);
        document.getElementById('memoA').textContent = memoOf(state.a);
        document.getElementById('capA').textContent = capOf(state.a);
        renderPie(document.getElementById('pieA'), state.a);
        renderBar(document.getElementById('barA'), state.a);

        document.getElementById('cardB').hidden = !state.compare;
        document.getElementById('nlWrap').hidden = !state.compare;
        document.getElementById('valNumB').textContent = String(state.b.num);
        document.getElementById('valDenB').textContent = String(state.b.den);
        document.getElementById('fracNumB').textContent = String(state.b.num);
        document.getElementById('fracDenB').textContent = String(state.b.den);
        if (state.compare) {
            renderPie(document.getElementById('pieB'), state.b);
            renderBar(document.getElementById('barB'), state.b);
        }

        var btn = document.getElementById('btnCompare');
        btn.classList.toggle('et-btn--primary', state.compare);
        btn.title = state.compare ? '关闭对比模式' : '开启对比模式';
        document.getElementById('btnCompareText').textContent = state.compare ? '关闭对比' : '对比模式';

        renderChips();
        renderInfo();
        renderVerdict();
        if (state.compare) { renderNumline(); }
        updateStatus();
    }

    /* ============ 状态变更 ============ */

    function save() {
        store.set('a', state.a);
        store.set('b', state.b);
        store.set('maxDen', state.maxDen);
        store.set('compare', state.compare);
        store.set('numeric', state.numeric);
    }

    function setFrac(which, num, den) {
        var cur = state[which];
        var d = clampInt(den, 1, state.maxDen, cur.den);
        var n = clampInt(num, 0, d, cur.num);
        state[which] = { num: n, den: d };
        render();
        save();
    }

    function step(which, field, delta) {
        var f = state[which];
        if (field === 'den') {
            var d = f.den + delta;
            if (d < 1) { d = state.maxDen; }
            if (d > state.maxDen) { d = 1; }
            setFrac(which, Math.min(f.num, d), d);
        } else {
            var n = f.num + delta;
            if (n < 0) { n = f.den; }
            if (n > f.den) { n = 0; }
            setFrac(which, n, f.den);
        }
        chrome.beep('tick');
    }

    function toggleCompare() {
        state.compare = !state.compare;
        render();
        save();
        chrome.beep(state.compare ? 'ok' : 'tick');
        chrome.toast(state.compare ? '已开启对比模式：拖动 B 的色条比大小' : '已关闭对比模式');
    }

    /* ============ 色条拖动 ============ */

    function bindBarDrag(bar, which) {
        var dragging = false;

        function setDrag(on) {
            dragging = on;
            bar.classList.toggle('is-drag', on);
        }

        function apply(clientX) {
            var f = state[which];
            var rect = bar.getBoundingClientRect();
            if (!rect.width) { return; }
            var ratio = (clientX - rect.left) / rect.width;
            var idx = Math.ceil(ratio * f.den);
            if (idx < 1) { idx = 1; }
            if (idx > f.den) { idx = f.den; }
            if (idx === f.num) { return; }
            setFrac(which, idx, f.den);
        }

        if (window.PointerEvent) {
            bar.addEventListener('pointerdown', function (ev) {
                setDrag(true);
                if (bar.setPointerCapture) {
                    try { bar.setPointerCapture(ev.pointerId); } catch (err) { /* 忽略 */ }
                }
                apply(ev.clientX);
                ev.preventDefault();
            });
            bar.addEventListener('pointermove', function (ev) {
                if (dragging) { apply(ev.clientX); }
            });
            bar.addEventListener('pointerup', function () { setDrag(false); });
            bar.addEventListener('pointercancel', function () { setDrag(false); });
        } else {
            bar.addEventListener('touchstart', function (ev) {
                setDrag(true);
                apply(ev.touches[0].clientX);
                ev.preventDefault();
            }, { passive: false });
            bar.addEventListener('touchmove', function (ev) {
                if (dragging) { apply(ev.touches[0].clientX); }
            }, { passive: false });
            bar.addEventListener('touchend', function () { setDrag(false); });
            bar.addEventListener('mousedown', function (ev) {
                setDrag(true);
                apply(ev.clientX);
                ev.preventDefault();
            });
            bar.addEventListener('mousemove', function (ev) {
                if (dragging) { apply(ev.clientX); }
            });
            bar.addEventListener('mouseup', function () { setDrag(false); });
        }
    }

    /* ============ 设置抽屉 ============ */

    function buildSettings(body) {
        function heading(text) {
            var h = document.createElement('h4');
            h.textContent = text;
            body.appendChild(h);
        }

        function switchRow(label, checked, onChange, disabled) {
            var row = document.createElement('label');
            row.className = 'et-drawer__switch';
            row.appendChild(document.createTextNode(label));
            var cb = document.createElement('input');
            cb.type = 'checkbox';
            cb.checked = checked;
            cb.disabled = !!disabled;
            cb.addEventListener('change', function () { onChange(cb.checked); });
            row.appendChild(cb);
            body.appendChild(row);
        }

        heading('分母上限');
        var row = document.createElement('div');
        row.className = 'et-drawer__row';
        for (var i = 0; i < MAX_DENS.length; i++) {
            (function (value) {
                var b = document.createElement('button');
                b.type = 'button';
                b.className = 'et-btn' + (value === state.maxDen ? ' et-btn--primary' : '');
                b.style.flex = '1 1 40%';
                b.textContent = '最多 ' + value + ' 等分';
                b.addEventListener('click', function () {
                    state.maxDen = value;
                    if (state.a.den > value) { state.a = { num: Math.min(state.a.num, value), den: value }; }
                    if (state.b.den > value) { state.b = { num: Math.min(state.b.num, value), den: value }; }
                    save();
                    render();
                    refresh();
                });
                row.appendChild(b);
            })(MAX_DENS[i]);
        }
        body.appendChild(row);

        heading('显示选项');
        switchRow('对比模式（分数 B + 数轴）', state.compare, function (on) {
            state.compare = on;
            save();
            render();
            refresh();
        });
        switchRow('显示小数与百分数', state.numeric, function (on) {
            state.numeric = on;
            save();
            render();
        });

        var tip = document.createElement('p');
        tip.className = 'et-drawer__tip';
        tip.innerHTML = '饼图与色条表示同一件事：把 1 平均分成<b>分母</b>份，取其中<b>分子</b>份。'
            + '<br>对比模式下 A 用橙色、B 用蓝色，数轴圆点越靠右表示值越大。'
            + '<br>拖动色条即可改变分子，触屏一体机可直接手指拖动。'
            + '<br>分数与设置保存在本机浏览器，下次打开自动恢复。';
        body.appendChild(tip);

        function refresh() {
            while (body.firstChild) { body.removeChild(body.firstChild); }
            buildSettings(body);
        }
    }

    /* ============ 事件绑定 ============ */

    document.getElementById('numMinus').addEventListener('click', function () { step('a', 'num', -1); });
    document.getElementById('numPlus').addEventListener('click', function () { step('a', 'num', 1); });
    document.getElementById('denMinus').addEventListener('click', function () { step('a', 'den', -1); });
    document.getElementById('denPlus').addEventListener('click', function () { step('a', 'den', 1); });
    document.getElementById('numMinusB').addEventListener('click', function () { step('b', 'num', -1); });
    document.getElementById('numPlusB').addEventListener('click', function () { step('b', 'num', 1); });
    document.getElementById('denMinusB').addEventListener('click', function () { step('b', 'den', -1); });
    document.getElementById('denPlusB').addEventListener('click', function () { step('b', 'den', 1); });
    document.getElementById('btnCompare').addEventListener('click', toggleCompare);

    bindBarDrag(document.getElementById('barA'), 'a');
    bindBarDrag(document.getElementById('barB'), 'b');

    document.addEventListener('keydown', function (ev) {
        var node = document.activeElement;
        var tag = node && node.tagName ? node.tagName.toUpperCase() : '';
        if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT' || (node && node.isContentEditable)) { return; }
        if (document.querySelector('.et-modal, .et-drawer-backdrop')) { return; }

        if (ev.code === 'Space' || ev.key === ' ') {
            ev.preventDefault();
            step('a', 'num', 1);
        } else if (ev.key === 'ArrowRight') {
            ev.preventDefault();
            step('a', 'num', 1);
        } else if (ev.key === 'ArrowLeft') {
            ev.preventDefault();
            step('a', 'num', -1);
        } else if (ev.key === 'ArrowUp') {
            ev.preventDefault();
            step('a', 'den', 1);
        } else if (ev.key === 'ArrowDown') {
            ev.preventDefault();
            step('a', 'den', -1);
        } else if (ev.key === 'c' || ev.key === 'C') {
            ev.preventDefault();
            toggleCompare();
        }
    });

    /* ============ 启动 ============ */

    render();
})();
</script>

</body>
</html>
