/*!

/* ============ 设计令牌 ============ */
:root {
    --et-accent: #2563eb;
    --et-accent-weak: rgba(37, 99, 235, .14);
    --et-bg: #f4f6fb;
    --et-surface: #ffffff;
    --et-surface-2: #f8fafc;
    --et-fg: #0b1220;
    --et-muted: #64748b;
    --et-line: rgba(15, 23, 42, .12);
    --et-line-strong: rgba(15, 23, 42, .22);
    --et-glass: rgba(255, 255, 255, .85);
    --et-shadow-md: 0 10px 28px -18px rgba(15, 23, 42, .3);
    --et-shadow-lg: 0 24px 60px -32px rgba(15, 23, 42, .4);
    --et-ok: #059669;
    --et-warn: #d97706;
    --et-err: #dc2626;
    --et-radius: 12px;
    --et-radius-sm: 9px;
    --et-font: -apple-system, BlinkMacSystemFont, "Segoe UI",
               "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei",
               "Noto Sans SC", sans-serif;
    --et-mono: ui-monospace, "Cascadia Mono", Consolas, Menlo, monospace;
}

html[data-et-theme="dark"] {
    --et-bg: #0b1120;
    --et-surface: #111a2e;
    --et-surface-2: #0f1729;
    --et-fg: #f1f5f9;
    --et-muted: #94a3b8;
    --et-line: rgba(148, 163, 184, .18);
    --et-line-strong: rgba(148, 163, 184, .3);
    --et-glass: rgba(17, 26, 46, .85);
    --et-shadow-md: 0 10px 34px -18px rgba(0, 0, 0, .8);
    --et-shadow-lg: 0 24px 70px -30px rgba(0, 0, 0, .9);
    --et-ok: #34d399;
    --et-warn: #fbbf24;
    --et-err: #f87171;
}

/* ============ 基础 ============ */

/* body 作为外壳时必须清掉浏览器默认 8px 外边距，
   否则 iframe 预览中文档会比视口高 16px（底部白边 + 多余滚动） */
body.et-app {
    margin: 0;
}

.et-app {
    position: relative;
    isolation: isolate;
    display: flex;
    flex-direction: column;
    height: 100vh;
    height: 100dvh;
    overflow: hidden;
    background: var(--et-bg);
    color: var(--et-fg);
    font-family: var(--et-font);
    -webkit-font-smoothing: antialiased;
    transition: background .25s, color .25s;
}

/* 极光背景：径向渐变 + 呼吸动画（edupick 品质基线，老内核也不掉帧） */
.et-app::before {
    content: '';
    position: fixed;
    inset: 0;
    z-index: -1;
    pointer-events: none;
    background:
        radial-gradient(46% 40% at 20% 18%, var(--et-accent-weak), transparent 65%),
        radial-gradient(42% 38% at 82% 24%, var(--et-accent-weak), transparent 70%),
        radial-gradient(50% 44% at 55% 95%, rgba(16, 185, 129, .10), transparent 65%);
    animation: et-aurora 16s ease-in-out infinite alternate;
}

@keyframes et-aurora {
    from { opacity: .55; transform: scale(1); }
    to { opacity: 1; transform: scale(1.06); }
}

.et-app *,
.et-app *::before,
.et-app *::after { box-sizing: border-box; }

[hidden] { display: none !important; }

.et-icon {
    width: 18px;
    height: 18px;
    fill: none;
    stroke: currentColor;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
    flex: none;
}

/* ============ 顶栏 ============ */
.et-topbar {
    flex: none;
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 11px 20px;
    border-bottom: 1px solid var(--et-line);
    background: var(--et-glass);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    z-index: 20;
}

.et-brand {
    display: flex;
    align-items: center;
    gap: 10px;
    min-width: 0;
}

.et-brand__dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: var(--et-accent);
    box-shadow: 0 0 0 4px var(--et-accent-weak);
    flex: none;
}

.et-brand__name {
    font-weight: 800;
    font-size: 15px;
    letter-spacing: -.01em;
    white-space: nowrap;
}

.et-brand__sub {
    font-size: 12.5px;
    color: var(--et-muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.et-status {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 5px 14px;
    border-radius: 999px;
    font-size: 12.5px;
    color: var(--et-muted);
    background: var(--et-surface-2);
    border: 1px solid var(--et-line);
    white-space: nowrap;
    max-width: 42vw;
    overflow: hidden;
    text-overflow: ellipsis;
}

.et-status__dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--et-ok);
    flex: none;
    transition: background .2s;
}

.et-status[data-tone="err"] .et-status__dot { background: var(--et-err); }
.et-status[data-tone="warn"] .et-status__dot { background: var(--et-warn); }

.et-actions {
    display: flex;
    align-items: center;
    gap: 7px;
}

.et-icon-btn {
    display: inline-grid;
    place-items: center;
    width: 38px;
    height: 38px;
    font-size: 16px;
    line-height: 1;
    border-radius: 11px;
    border: 1px solid var(--et-line);
    background: var(--et-surface-2);
    color: var(--et-fg);
    cursor: pointer;
    transition: transform .14s, border-color .14s, color .14s, opacity .14s;
    -webkit-tap-highlight-color: transparent;
}

.et-icon-btn:hover {
    border-color: var(--et-accent);
    color: var(--et-accent);
    transform: translateY(-1px);
}

.et-icon-btn:active { transform: translateY(0); }
.et-icon-btn.is-off { opacity: .4; }
.et-icon-btn:focus-visible { outline: 2px solid var(--et-accent); outline-offset: 2px; }

/* ============ 主区默认 ============ */
.et-main {
    flex: 1;
    min-height: 0;
    position: relative;
    overflow: auto;
}

/* ============ 页脚（品牌回流 L2） ============ */
.et-footer {
    flex: none;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 7px 16px;
    font-size: 12px;
    color: var(--et-muted);
    border-top: 1px solid var(--et-line);
    background: var(--et-glass);
    user-select: none;
    z-index: 20;
}

.et-footer a {
    color: inherit;
    text-decoration: none;
    transition: color .14s;
}

.et-footer a:hover { color: var(--et-accent); }

/* ============ 按钮 ============ */
.et-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
    padding: 9px 16px;
    border-radius: 11px;
    font: inherit;
    font-size: 13.5px;
    font-weight: 700;
    border: 1px solid var(--et-line);
    background: var(--et-surface-2);
    color: var(--et-fg);
    cursor: pointer;
    transition: transform .14s, border-color .14s, color .14s, background .14s, box-shadow .14s;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
}

.et-btn:hover {
    border-color: var(--et-accent);
    color: var(--et-accent);
    transform: translateY(-1px);
}

.et-btn:active { transform: translateY(0); }
.et-btn:focus-visible { outline: 2px solid var(--et-accent); outline-offset: 2px; }
.et-btn:disabled { opacity: .45; cursor: not-allowed; transform: none; }

.et-btn--primary {
    background: var(--et-accent);
    border-color: var(--et-accent);
    color: #fff;
    box-shadow: 0 6px 18px -8px var(--et-accent);
}

.et-btn--primary:hover { color: #fff; filter: brightness(1.08); }
.et-btn--primary:disabled { filter: none; }

.et-btn--danger:hover {
    border-color: var(--et-err);
    color: var(--et-err);
}

.et-btn--lg {
    padding: 13px 26px;
    font-size: 16px;
    border-radius: 14px;
}

/* ============ 弹窗 ============ */
.et-modal {
    position: fixed;
    inset: 0;
    z-index: 100;
    display: grid;
    place-items: center;
    padding: 24px;
    background: rgba(2, 6, 23, .55);
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    animation: et-fade .18s ease;
}

.et-modal__panel {
    width: min(680px, 94vw);
    max-height: 86vh;
    max-height: 86dvh;
    display: flex;
    flex-direction: column;
    background: var(--et-surface);
    border: 1px solid var(--et-line);
    border-radius: 16px;
    box-shadow: var(--et-shadow-lg);
    animation: et-pop .2s cubic-bezier(.34, 1.4, .64, 1);
    overflow: hidden;
}

.et-modal__panel--narrow { width: min(460px, 92vw); }
.et-modal__panel--wide { width: min(900px, 94vw); }

.et-modal__head {
    flex: none;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 16px 20px;
    border-bottom: 1px solid var(--et-line);
    font-weight: 800;
    font-size: 15px;
}

.et-modal__head .et-icon-btn {
    margin-left: auto;
    width: 32px;
    height: 32px;
}

.et-modal__body {
    flex: 1;
    min-height: 0;
    overflow: auto;
    padding: 18px 20px;
}

.et-modal__foot {
    flex: none;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 14px 20px;
    border-top: 1px solid var(--et-line);
    background: var(--et-surface-2);
}

.et-modal__foot .spacer { flex: 1; }

@keyframes et-fade {
    from { opacity: 0; }
}

@keyframes et-pop {
    from { opacity: 0; transform: translateY(14px) scale(.97); }
}

/* ============ 轻提示（toast） ============ */
.et-toast {
    position: fixed;
    left: 50%;
    bottom: 56px;
    transform: translateX(-50%) translateY(10px);
    z-index: 120;
    display: flex;
    align-items: center;
    gap: 9px;
    max-width: min(520px, 88vw);
    padding: 11px 18px;
    border-radius: 12px;
    font-size: 13.5px;
    font-weight: 600;
    color: #fff;
    background: rgba(15, 23, 42, .92);
    border: 1px solid rgba(148, 163, 184, .25);
    box-shadow: var(--et-shadow-lg);
    opacity: 0;
    pointer-events: none;
    transition: opacity .22s, transform .22s;
}

.et-toast.is-show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
}

.et-toast[data-tone="ok"] { background: rgba(5, 150, 105, .95); }
.et-toast[data-tone="err"] { background: rgba(220, 38, 38, .95); }
.et-toast[data-tone="warn"] { background: rgba(217, 119, 6, .95); }

/* ============ 设置抽屉（右上角入口，edupick 交互） ============ */
.et-drawer-backdrop {
    position: fixed;
    inset: 0;
    z-index: 90;
    background: rgba(2, 6, 23, .45);
    backdrop-filter: blur(3px);
    -webkit-backdrop-filter: blur(3px);
    opacity: 0;
    transition: opacity .2s;
}

.et-drawer-backdrop.is-open { opacity: 1; }

.et-drawer {
    position: absolute;
    top: 0;
    right: 0;
    height: 100%;
    width: min(400px, 92vw);
    display: flex;
    flex-direction: column;
    background: var(--et-surface);
    border-left: 1px solid var(--et-line);
    box-shadow: var(--et-shadow-lg);
    transform: translateX(100%);
    transition: transform .22s cubic-bezier(.32, .72, .35, 1);
}

.et-drawer-backdrop.is-open .et-drawer { transform: translateX(0); }

.et-drawer__head {
    flex: none;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 15px 18px;
    border-bottom: 1px solid var(--et-line);
    font-weight: 800;
    font-size: 15px;
    color: var(--et-accent);
}

.et-drawer__head .et-icon-btn {
    margin-left: auto;
    width: 32px;
    height: 32px;
}

.et-drawer__body {
    flex: 1;
    min-height: 0;
    overflow: auto;
    padding: 16px 18px 24px;
}

/* 抽屉内容通用小节（工具复用） */
.et-drawer__body h4 {
    margin: 18px 0 8px;
    font-size: 12px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: .08em;
    color: var(--et-muted);
}

.et-drawer__body h4:first-child { margin-top: 0; }

.et-drawer__row {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
}

.et-drawer__tip {
    margin: 8px 0 0;
    font-size: 12px;
    line-height: 1.8;
    color: var(--et-muted);
}

.et-drawer__tip b { color: var(--et-fg); }

.et-drawer__input {
    flex: 1;
    min-width: 0;
    padding: 9px 12px;
    border: 1px solid var(--et-line-strong);
    border-radius: 9px;
    background: var(--et-surface-2);
    color: var(--et-fg);
    font: inherit;
    font-size: 13.5px;
    transition: border-color .14s, box-shadow .14s;
}

.et-drawer__input:focus {
    outline: none;
    border-color: var(--et-accent);
    box-shadow: 0 0 0 3px var(--et-accent-weak);
}

.et-drawer__switch {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 10px 0;
    border-bottom: 1px dashed var(--et-line);
    font-size: 13.5px;
    font-weight: 600;
    color: var(--et-fg);
    cursor: pointer;
    user-select: none;
}

.et-drawer__switch input {
    width: 17px;
    height: 17px;
    accent-color: var(--et-accent);
    cursor: pointer;
}
</style>

        tick: [[880, 0, 0.06, 0.42]],
        ok: [[660, 0, 0.1, 0.46], [880, 0.1, 0.14, 0.46]],
        win: [[523.25, 0, 0.16, 0.5], [659.25, 0.12, 0.16, 0.5], [783.99, 0.24, 0.16, 0.5], [1046.5, 0.36, 0.34, 0.52]],
        err: [[220, 0, 0.22, 0.46, 'square']],
        over: [[880, 0, 0.18, 0.5], [659.25, 0.2, 0.18, 0.5], [523.25, 0.4, 0.36, 0.5]]
    };

    function playBeep(kind) {
        var ctx = ensureCtx();
        if (!ctx || !BEEPS[kind]) { return; }
        var seq = BEEPS[kind];
        var t0 = ctx.currentTime + 0.01;
        for (var i = 0; i < seq.length; i++) {
            tone(ctx, seq[i][0], t0 + seq[i][1], seq[i][2], seq[i][3] * MASTER_GAIN, seq[i][4]);
        }
    }

    /* ---------- 设置抽屉 ---------- */

    function openDrawer(title, build) {
        var backdrop = el('div', 'et-drawer-backdrop');
        var drawer = el('aside', 'et-drawer');
        drawer.setAttribute('role', 'dialog');
        drawer.setAttribute('aria-label', title);

        var head = el('div', 'et-drawer__head');
        head.appendChild(makeIcon('i-sliders'));
        head.appendChild(el('span', 'et-drawer__title', title));
        head.appendChild(makeBtn('i-x', '关闭', close));
        drawer.appendChild(head);

        var body = el('div', 'et-drawer__body');
        drawer.appendChild(body);

        backdrop.appendChild(drawer);
        document.body.appendChild(backdrop);
        requestAnimationFrame(function () { backdrop.classList.add('is-open'); });

        function close() {
            backdrop.classList.remove('is-open');
            document.removeEventListener('keydown', onKey);
            setTimeout(function () {
                if (backdrop.parentNode) { backdrop.parentNode.removeChild(backdrop); }
            }, 220);
        }
        function onKey(ev) {
            if (ev.key === 'Escape') { ev.stopPropagation(); close(); }
        }
        document.addEventListener('keydown', onKey);
        backdrop.addEventListener('mousedown', function (ev) {
            if (ev.target === backdrop) { close(); }
        });

        if (typeof build === 'function') {
            /* 兼容两种约定：build 自己往 body 里塞内容，或 return 一个元素节点 */
            var ret = build(body, { close: close });
            if (ret && ret.nodeType === 1 && ret.parentNode !== body) {
                body.appendChild(ret);
            }
        }
        return { body: body, close: close };
    }

    /* ---------- 通用弹窗 / toast（同时挂模块级，供其他共享组件使用） ---------- */

    function modal(mo) {
        var backdrop = el('div', 'et-modal');
        var panel = el('div', 'et-modal__panel' + (mo.size === 'narrow' ? ' et-modal__panel--narrow'
            : mo.size === 'wide' ? ' et-modal__panel--wide' : ''));
        var head = el('div', 'et-modal__head');
        if (mo.icon) { head.appendChild(makeIcon(mo.icon)); }
        head.appendChild(el('span', null, mo.title || ''));
        head.appendChild(makeBtn('i-x', '关闭', close));
        panel.appendChild(head);

        var body = el('div', 'et-modal__body');
        if (typeof mo.body === 'string') { body.innerHTML = mo.body; }
        else if (mo.body) { body.appendChild(mo.body); }
        panel.appendChild(body);

        var foot = null;
        if (mo.buttons && mo.buttons.length) {
            foot = el('div', 'et-modal__foot');
            foot.appendChild(el('span', 'spacer'));
            mo.buttons.forEach(function (b) {
                var btn = el('button', 'et-btn' + (b.primary ? ' et-btn--primary' : '') + (b.danger ? ' et-btn--danger' : ''), b.label);
                btn.type = 'button';
                btn.addEventListener('click', function () {
                    if (b.onClick) { b.onClick(close); } else { close(); }
                });
                foot.appendChild(btn);
            });
            panel.appendChild(foot);
        }

        backdrop.appendChild(panel);
        document.body.appendChild(backdrop);

        function close() {
            if (backdrop.parentNode) { backdrop.parentNode.removeChild(backdrop); }
            document.removeEventListener('keydown', onKey);
            if (mo.onClose) { mo.onClose(); }
        }
        function onKey(ev) {
            if (ev.key === 'Escape') { ev.stopPropagation(); close(); }
        }
        document.addEventListener('keydown', onKey);
        backdrop.addEventListener('mousedown', function (ev) {
            if (ev.target === backdrop) { close(); }
        });

        return { panel: panel, body: body, foot: foot, close: close };
    }

    var toastEl = null;
    var toastTimer = 0;

    function toast(msg, tone) {
        if (!toastEl) {
            toastEl = el('div', 'et-toast');
            document.body.appendChild(toastEl);
        }
        toastEl.textContent = msg;
        toastEl.setAttribute('data-tone', tone || '');
        void toastEl.offsetWidth;
        toastEl.classList.add('is-show');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(function () { toastEl.classList.remove('is-show'); }, 2200);
    }

    /* ---------- PWA 元数据（blob manifest，环境不支持时静默跳过） ---------- */

    function installPwa(toolId, title, accent) {
        try {
            var theme = document.querySelector('meta[name="theme-color"]');
            if (!theme) {
                theme = document.createElement('meta');
                theme.setAttribute('name', 'theme-color');
                document.head.appendChild(theme);
            }
            theme.setAttribute('content', accent || '#2563eb');

            var svg = '<svg xmlns="' + NS_SVG + '" viewBox="0 0 64 64">' +
                '<rect width="64" height="64" rx="14" fill="' + (accent || '#2563eb') + '"/>' +
                '<text x="32" y="43" font-size="32" font-weight="800" font-family="sans-serif" ' +
                'fill="#fff" text-anchor="middle">' + (title || '课').charAt(0) + '</text></svg>';
            var iconUri = 'data:image/svg+xml,' + encodeURIComponent(svg);

            var mf = {
                name: title || 'KeeTools 课工具',
                short_name: title || '课工具',
                start_url: '.',
                display: 'standalone',
                background_color: '#f4f6fb',
                theme_color: accent || '#2563eb',
                icons: [{ src: iconUri, sizes: 'any', type: 'image/svg+xml', purpose: 'any' }]
            };
            var blob = new Blob([JSON.stringify(mf)], { type: 'application/manifest+json' });
            var link = document.createElement('link');
            link.rel = 'manifest';
            link.href = URL.createObjectURL(blob);
            document.head.appendChild(link);
        } catch (err) { /* 不支持 PWA 元数据的环境静默跳过 */ }
    }

    /* ---------- 挂载 ---------- */

    function mount(options) {
        var opt = options || {};
        var toolId = opt.toolId || 'unknown-tool';
        var store = global.ET && global.ET.store
            ? global.ET.store(toolId)
            : (function () { return { get: function () { return null; }, set: function () {} }; })();

        var api = { toolId: toolId, store: store };
        var soundEnabled = store.get('sound', true) !== false;

        /* 主题色 */
        if (opt.accent) {
            document.documentElement.style.setProperty('--et-accent', opt.accent);

        installPwa(toolId, opt.title, opt.accent);

        /* ---------- 主题 ---------- */
        var theme = store.get('theme', null);
        if (theme !== 'dark' && theme !== 'light') {
            theme = (global.matchMedia && global.matchMedia('(prefers-color-scheme: dark)').matches)
                ? 'dark' : 'light';
        }
        applyTheme(theme);

        function applyTheme(t) {
            theme = t;
            document.documentElement.setAttribute('data-et-theme', t);
            store.set('theme', t);
            if (themeBtn) {
                themeBtn.innerHTML = '';
                themeBtn.appendChild(makeIcon(t === 'dark' ? 'i-sun' : 'i-moon'));
                themeBtn.title = t === 'dark' ? '切换到浅色' : '切换到深色';
            }
        }

        /* ---------- 顶栏 ---------- */
        var topbar = document.getElementById('et-topbar');
        var main = document.getElementById('et-main');
        var footer = document.getElementById('et-footer');

        if (!topbar) { topbar = el('header'); topbar.id = 'et-topbar'; document.body.insertBefore(topbar, document.body.firstChild); }
        if (!main) { main = el('main'); main.id = 'et-main'; topbar.after(main); }
        if (!footer) { footer = el('footer'); footer.id = 'et-footer'; document.body.appendChild(footer); }

        topbar.className = 'et-topbar';
        main.classList.add('et-main');
        footer.className = 'et-footer';

        /* 品牌 */
        var brand = el('div', 'et-brand');
        brand.appendChild(el('span', 'et-brand__dot'));
        var nameWrap = el('div');
        nameWrap.style.cssText = 'min-width:0;line-height:1.25';
        nameWrap.appendChild(el('div', 'et-brand__name', opt.title || '课工具'));
        if (opt.sub) { nameWrap.appendChild(el('div', 'et-brand__sub', opt.sub)); }
        brand.appendChild(nameWrap);
        topbar.appendChild(brand);

        /* 状态胶囊 */
        var statusPill = el('div', 'et-status');
        statusPill.hidden = true;
        statusPill.appendChild(el('span', 'et-status__dot'));
        var statusText = el('span', null, '');
        statusPill.appendChild(statusText);
        topbar.appendChild(statusPill);

        api.setStatus = function (text, tone) {
            if (!text) { statusPill.hidden = true; return; }
            statusText.textContent = text;
            statusPill.setAttribute('data-tone', tone || 'ok');
            statusPill.hidden = false;
        };
        if (opt.status) { api.setStatus(opt.status); }

        /* 动作区（edupick 交互：右上角聚合设置入口） */
        var actions = el('div', 'et-actions');

        var settingsBtn = null;
        if (opt.settings && typeof opt.settings.build === 'function') {
            settingsBtn = makeBtn('i-sliders', opt.settings.title || '设置', function () {
                openDrawer(opt.settings.title || '设置', function (body, drawerApi) {
                    return opt.settings.build(body, { api: api, close: drawerApi.close });
                });
            });
            actions.appendChild(settingsBtn);
        }

        (opt.actions || []).forEach(function (a) {
            var b = makeBtn(a.icon, a.label || '', a.onClick);
            if (a.id) { b.id = a.id; }

        });

        var soundBtn = null;
        if (opt.sound) {
            soundBtn = makeBtn(soundEnabled ? 'i-volume' : 'i-volume-off',
                soundEnabled ? '关闭音效' : '开启音效', toggleSound);
            if (!soundEnabled) { soundBtn.classList.add('is-off'); }
            actions.appendChild(soundBtn);
        }

        if (opt.help) {
            actions.appendChild(makeBtn('i-help', '使用说明', function () { openHelp(); }));
        }

        var themeBtn = makeBtn('', '切换主题', function () {
            applyTheme(theme === 'dark' ? 'light' : 'dark');
        });
        applyTheme(theme); /* 填充图标 */
        actions.appendChild(themeBtn);

        /* 全屏按钮始终保留：iframe 内对本工具文档 requestFullscreen
           （宿主 iframe 已声明 allow="fullscreen"），与宿主「全屏体验」等效同屏。 */
        var fsBtn = makeBtn('i-maximize', '全屏', toggleFullscreen);
        actions.appendChild(fsBtn);

        topbar.appendChild(actions);

        function toggleSound() {
            soundEnabled = !soundEnabled;
            store.set('sound', soundEnabled);
            soundBtn.innerHTML = '';
            soundBtn.appendChild(makeIcon(soundEnabled ? 'i-volume' : 'i-volume-off'));
            soundBtn.title = soundEnabled ? '关闭音效' : '开启音效';
            soundBtn.classList.toggle('is-off', !soundEnabled);
            if (soundEnabled) { api.beep('ok'); }
        }

        api.openSettings = function () {
            if (settingsBtn) { settingsBtn.click(); }
        };

        /* ---------- 全屏（iframe 内委托宿主，避免双层全屏） ---------- */

        function inIframe() {
            try { return global.parent && global.parent !== global; } catch (err) { return true; }
        }

        function toggleFullscreen() {
            var root = document.documentElement;
            var fsEl = document.fullscreenElement || document.webkitFullscreenElement || null;
            if (fsEl) {
                (document.exitFullscreen || document.webkitExitFullscreen || function () {}).call(document);
            } else {
                var req = root.requestFullscreen || root.webkitRequestFullscreen;
                if (req) { try { req.call(root); } catch (err) { /* 忽略 */ } }
            }
        }

        function syncFsIcon(on) {
            if (!fsBtn) { return; }
            fsBtn.innerHTML = '';
            fsBtn.appendChild(makeIcon(on ? 'i-minimize' : 'i-maximize'));
            fsBtn.title = on ? '退出全屏' : '全屏';
        }

        document.addEventListener('fullscreenchange', function () {
            syncFsIcon(!!(document.fullscreenElement || document.webkitFullscreenElement));
        });
        document.addEventListener('webkitfullscreenchange', function () {
            syncFsIcon(!!(document.fullscreenElement || document.webkitFullscreenElement));
        });
        syncFsIcon(false);

        api.toggleFullscreen = toggleFullscreen;

        /* ---------- 音效 API ---------- */
        api.beep = function (kind) {
            if (!soundEnabled) { return; }
            playBeep(kind);
        };
        api.soundOn = function () { return soundEnabled; };

        api.modal = modal;

        /* ---------- 帮助 ---------- */
        function openHelp() {
            modal({
                title: '使用说明',
                icon: 'i-help',
                size: 'narrow',
                body: opt.help,
                buttons: [{ label: '知道了', primary: true }]
            });
        }
        api.openHelp = openHelp;

        /* ---------- toast ---------- */
        api.toast = toast;

        /* ---------- 页脚（L2 品牌回流，低调一行） ---------- */
        var siteOrigin = typeof global.ET_SITE_ORIGIN === 'string' && /^https?:\/\//.test(global.ET_SITE_ORIGIN)
            ? global.ET_SITE_ORIGIN
            : null;

        function renderFooter() {
            footer.textContent = '';
            footer.appendChild(el('span', null, 'KeeTools 课工具'));
            footer.appendChild(el('span', null, '·'));
            if (siteOrigin) {
                var a = el('a', null, '更多课堂工具');
                a.href = siteOrigin + '/?from=tool-footer&tool=' + encodeURIComponent(toolId);
                a.target = '_blank';
                a.rel = 'noopener';
                footer.appendChild(a);
            } else {
                footer.appendChild(el('span', null, '更多课堂工具'));
            }
        }
        renderFooter();

        /* 站点来源发现：iframe 内向父窗口询问；也可由宿主直接注入 ET_SITE_ORIGIN */
        try {
            if (global.parent && global.parent !== global) {
                global.parent.postMessage(JSON.stringify({ type: 'et-hello', toolId: toolId }), '*');
            }
        } catch (err) { /* 跨域异常忽略 */ }

        global.addEventListener('message', function (ev) {
            var data = ev.data;
            if (typeof data === 'string') {
                try { data = JSON.parse(data); } catch (err) { return; }
            }
            if (!data || typeof data !== 'object') { return; }

            if (data.type === 'et-origin' && typeof data.origin === 'string' && /^https?:\/\//.test(data.origin)) {
                siteOrigin = data.origin;
                if (!global.ET_SITE_ORIGIN) { global.ET_SITE_ORIGIN = data.origin; }
                renderFooter();
            }
            if (data.type === 'et-fullscreen-change' && typeof data.value === 'boolean') {
                syncFsIcon(data.value);
            }
        });

        api.el = { topbar: topbar, main: main, footer: footer, actions: actions };

        /* ---------- 激光笔 / 翻页笔适配（HID 翻页键） ----------
         * 翻页笔的上下页键在系统层等价于 PageDown / PageUp。
         * 工具通过 opt.primary / opt.secondary 注册动作：
         *   PageDown → primary（主操作，如开始点名 / 开始计时）
         *   PageUp   → secondary（副操作，缺省时同 primary）
         * 输入框聚焦或弹窗/抽屉打开时不响应，避免误触。 */
        if (typeof opt.primary === 'function') {
            document.addEventListener('keydown', function (ev) {
                if (ev.key !== 'PageDown' && ev.key !== 'PageUp') { return; }
                var tag = (document.activeElement && document.activeElement.tagName) || '';
                if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') { return; }
                if (document.querySelector('.et-modal, .et-drawer-backdrop, .ws-winner')) { return; }
                ev.preventDefault();
                if (ev.key === 'PageDown') { opt.primary(); }
                else if (typeof opt.secondary === 'function') { opt.secondary(); }
                else { opt.primary(); }
            });
        }

        return api;

    global.ET.Chrome = {

        modal: modal,
        toast: toast,

    };
})(window);
</script>

<script>
  /* 此块由 scripts/sync_shared.py 自动注入，请勿手工修改 */
/*!
 * et-stats.js — 使用统计模块（模块化，可整体移除）
 *
 * 共享逻辑源。改这里，然后跑：python scripts/sync_shared.py
 * 依赖：无（可脱离 et-util / et-chrome 独立运行）。
 * 全局：ET.Stats
 *
 * ┌────────────────────────────────────────────────────────────────┐
 * │ 说明：本模块只做一件事——工具被打开时向上报端点发一条匿名计数。 │
 * │ · 在线（iframe 内）：宿主页面已服务端计数，本模块不重复上报。   │
 * │ · 离线打开（file:// / 下载单文件 / 离线包）：联网条件具备时，   │
 * │   以 sendBeacon 上报 use_offline 事件（text/plain 免预检）。    │
 * │ · 上报端点 = window.ET_SITE_ORIGIN（由宿主注入或离线包配置）。  │
 * │   未配置端点时本模块完全静默，不发任何请求。                    │
 * │ · **整个 <script> 块可安全删除**：删除后工具其余功能完全正常，  │
 * │   且完全不再发起任何网络请求。                                  │
 * └────────────────────────────────────────────────────────────────┘
 */
(function (global) {
    'use strict';

    var ET = global.ET = global.ET || {};

    var Stats = {
        /** 上报端点来源（站点绝对地址，无协议尾斜杠） */
        endpoint: (typeof global.ET_SITE_ORIGIN === 'string' && /^https?:\/\//.test(global.ET_SITE_ORIGIN))
            ? global.ET_SITE_ORIGIN
            : null,

        _done: {},

        /**
         * 上报一次事件（同一事件同一工具每次页面加载只报一次）。
         * event: 'use_offline' 等；toolId: 工具 id。
         */
        send: function (event, toolId) {
            if (!event || this._done[event + ':' + (toolId || '')]) { return false; }
            if (!this.endpoint) { return false; }
            /* iframe 内由宿主统计，避免双计 */
            try {
                if (global.parent && global.parent !== global) { return false; }
            } catch (err) { return false; }
            /* 断网时挂起，网络恢复自动补报一次 */
            if (global.navigator && global.navigator.onLine === false) {
                var self = this;
                global.addEventListener('online', function () { self.send(event, toolId); }, { once: true });
                return false;
            }

            this._done[event + ':' + (toolId || '')] = true;
            var payload = JSON.stringify({ event: event, tool: toolId || '' });

            try {
                if (global.navigator.sendBeacon) {
                    return global.navigator.sendBeacon(
                        this.endpoint + '/api/track',
                        new Blob([payload], { type: 'text/plain;charset=UTF-8' })
                    );
                }
                global.fetch(this.endpoint + '/api/track', {
                    method: 'POST',
                    body: payload,
                    keepalive: true,
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'text/plain;charset=UTF-8' }
                });
                return true;
            } catch (err) {
                return false;
            }
        }
    };

    ET.Stats = Stats;
})(window);
</script>

    var els = {
        scene: document.getElementById('mpScene'),
        slider: document.getElementById('ageSlider'),
        ageNum: document.getElementById('ageNum'),
        viewBox: document.getElementById('viewBox'),
        phaseName: document.getElementById('phaseName'),
        lunarDay: document.getElementById('lunarDay'),
        meta: document.getElementById('meta'),
        quick: document.getElementById('quick'),
        btnPlay: document.getElementById('btnPlay'),
        btnRay: document.getElementById('btnRay'),
        btnReset: document.getElementById('btnReset'),
        btnView: document.getElementById('btnView'),
        btnViewTxt: document.getElementById('btnViewTxt')
    };

    var state = {
        age: store.get('age', 0),
        playing: store.get('playing', true) !== false,
        ray: store.get('ray', true) !== false
    };

    if (typeof state.age !== 'number' || state.age < 0 || state.age > SYNODIC) { state.age = 0; }

    /* ---------- 月相几何 ---------- */

    function phaseOf(age) {
        return ((age / SYNODIC) % 1 + 1) % 1;
    }

    function brightOf(phase) {
        return (1 - Math.cos(phase * Math.PI * 2)) / 2;
    }

    function defOf(phase) {
        for (var i = 0; i < PHASE_DEFS.length; i++) {
            var d = PHASE_DEFS[i];
            if (phase >= d.from && phase < d.to) { return d; }
        }
        return PHASE_DEFS[PHASE_DEFS.length - 1];
    }

    /* 月相亮部路径：k 为亮面比例，waxing 为亮面是否在右侧 */
    function moonPathD(cx, cy, r, k, waxing) {
        var a = r * (2 * k - 1);
        var outerSweep = waxing ? 1 : 0;
        var innerSweep = (a > 0) ? outerSweep : 1 - outerSweep;
        var w = Math.max(0.01, Math.abs(a));
        return 'M ' + cx + ' ' + (cy - r) +
            ' A ' + r + ' ' + r + ' 0 0 ' + outerSweep + ' ' + cx + ' ' + (cy + r) +
            ' A ' + w.toFixed(2) + ' ' + r + ' 0 0 ' + innerSweep + ' ' + cx + ' ' + (cy - r) + ' Z';
    }

    function moonSvg(cx, cy, r, phase, extra) {
        var k = brightOf(phase);
        var waxing = phase < 0.5;
        var out = [];
        out.push('<circle cx="' + cx + '" cy="' + cy + '" r="' + r +
            '" fill="#1e293b" stroke="rgba(148,163,184,.6)" stroke-width="1.5"></circle>');
        if (k > 0.01) {
            var d = moonPathD(cx, cy, r, k, waxing);
            if (waxing) {
                out.push('<path d="' + d + '" fill="#fef9c3"></path>');
            } else {
                out.push('<g transform="translate(' + (2 * cx) + ',0) scale(-1,1)">' +
                    '<path d="' + d + '" fill="#fef9c3"></path></g>');
            }
        }
        if (extra) { out.push(extra); }
        return out.join('');
    }

    /* ---------- 3D 场景（Canvas 手写渲染：透视投影 + 球面晨昏线，无外部库） ----------
     * 世界坐标：地球在原点，+X 朝向太阳，月球轨道在 z=0 平面（半径 ORBIT_R3）。
     * 相机：绕地心的轨道相机（拖拽改 yaw / pitch，滚轮改 zoom），固定距离透视投影。
     * 取景：对当前俯仰角下的「全部偏航角」求包围范围反推焦距 F（含边距），
     *       所以全屏 / 任意窗口比例下，太阳、地球、整条月球轨道都完整落在画面内，
     *       且地心永远在画面正中——既不需要平移，也不会出现「拖不回画面」的情况。
     * 光照：每颗球体按「球心 → 太阳」方向实时求可见亮面比例与晨昏线位置，
     *       把月相形状直接画在 3D 月球上（亮面永远朝向太阳）。 */

    var ORBIT_R3 = 200;      /* 月球轨道半径 */
    var EARTH_R3 = 46;
    var MOON_R3 = 24;        /* 刻意放大：真实月球直径只有地球的 1/4，按真实比例课堂上看不清月相 */
    var MINI_R3 = 14;        /* 轨道上 8 个迷你月球 */
    var SUN_POS = [360, 0, 0];
    var SUN_R3 = 56;
    var SUN_DIR = [1, 0, 0];   /* 地心 → 太阳的单位方向（光照按平行光计算，见 drawSphere） */
    var CAM_DIST = 900;      /* 相机到地心距离（固定，透视强度稳定；缩放只改焦距不改距离） */
    var FIT_MARGIN = 0.06;   /* 取景边距（画面短边比例） */
    var ZOOM_MIN = 0.7;
    var ZOOM_MAX = 2;
    var TAU = Math.PI * 2;
    /* 默认视角刻意取「太阳在画面右侧、相机大致垂直于日地连线」的教科书式侧上方视角：
       此时月球被照亮的一半朝右（朝太阳），晨昏线正对地球，一眼能看出「亮面永远朝向太阳」；
       之前的斜前方视角会让所有月球都显得接近满月，看不出月相差别。 */
    var VIEW_DEFAULT = { yaw: -1.5708, pitch: 0.52, zoom: 1 };

    var TONE_MOON = { lit0: '#fffdf3', lit1: '#f1ebd8', lit2: '#c6c0ad', dark0: '#111a2c', dark1: '#070b16' };
    var TONE_EARTH = { lit0: '#dbeafe', lit1: '#3b82f6', lit2: '#1e40af', dark0: '#0d1a3a', dark1: '#060b18' };

    /* 视角模式：
     *   orbit = 绕地心的轨道视角：看太阳 / 地球 / 月球的相对位置，理解月相成因
     *   earth = 站在地球上看月亮：镜头锁定月球，月面形状就是当晚天空中的月相
     * 两种模式都必须有，因为「俯视整个系统时月球几乎总是被照亮」——
     * 只有站在地球上往外看，才会看到月牙 / 满月的变化。 */
    var viewMode = store.get('view', 'orbit') === 'earth' ? 'earth' : 'orbit';

    function clampNum(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
    function safeNum(v, fallback) { return (typeof v === 'number' && isFinite(v)) ? v : fallback; }

    var scene = {
        ctx: null, w: 0, h: 0, dpr: 1,
        yaw: safeNum(store.get('yaw', VIEW_DEFAULT.yaw), VIEW_DEFAULT.yaw),
        pitch: clampNum(safeNum(store.get('pitch', VIEW_DEFAULT.pitch), VIEW_DEFAULT.pitch), 0.06, 1.45),
        zoom: clampNum(safeNum(store.get('zoom', VIEW_DEFAULT.zoom), VIEW_DEFAULT.zoom), ZOOM_MIN, ZOOM_MAX),
        F: 600, cx0: 0, cy0: 0,
        stars: [], hits: [], dragged: 0
    };

    function sceneResize() {
        var cv = els.scene;
        if (!scene.ctx) { scene.ctx = cv.getContext('2d'); }
        scene.dpr = window.devicePixelRatio || 1;
        var w = Math.max(2, cv.clientWidth || 780);
        var h = Math.max(2, cv.clientHeight || 540);
        if (w === scene.w && h === scene.h && cv.width) { return; }
        scene.w = w;
        scene.h = h;
        cv.width = Math.max(2, Math.round(w * scene.dpr));
        cv.height = Math.max(2, Math.round(h * scene.dpr));
        if (!scene.stars.length) {
            for (var i = 0; i < 150; i++) {
                var v = [Math.random() * 2 - 1, Math.random() * 2 - 1, Math.random() * 2 - 1];
                var m = Math.hypot(v[0], v[1], v[2]) || 1;
                scene.stars.push({ d: [v[0] / m, v[1] / m, v[2] / m], s: Math.random() * 1.3 + 0.4, a: Math.random() * 0.5 + 0.25 });
            }
        }
        sceneFit();
    }

    /* 相机基向量：给定 yaw / pitch 时的相机位置与右 / 前 / 上三轴（单位向量） */
    function camBasis(yaw, pitch) {
        var cyw = Math.cos(yaw), syw = Math.sin(yaw);
        var cp = Math.cos(pitch), sp = Math.sin(pitch);
        return {
            px: cp * cyw * CAM_DIST, py: cp * syw * CAM_DIST, pz: sp * CAM_DIST,
            rx: -syw, ry: cyw, rz: 0,
            fx: -cp * cyw, fy: -cp * syw, fz: -sp,
            ux: -cyw * sp, uy: -syw * sp, uz: cp
        };
    }

    /* 地球视角的相机基向量：相机在地心（月亮距相机恒为 ORBIT_R3），
       up 取世界 +Z（地轴北向）→ 与「北半球抬头看月亮」的方位一致，
       也与右侧大图的左右朝向一致（上半月亮面在右）。 */
    function camBasisEarth() {
        var f = norm3(moonPos3(phaseOf(state.age)));
        var u = [0, 0, 1];                       /* 月球轨道在 z=0 平面 → f ⊥ up，不会退化 */
        var r = [f[1] * u[2] - f[2] * u[1], f[2] * u[0] - f[0] * u[2], f[0] * u[1] - f[1] * u[0]];
        return {
            px: 0, py: 0, pz: 0,
            rx: r[0], ry: r[1], rz: r[2],
            fx: f[0], fy: f[1], fz: f[2],
            ux: u[0], uy: u[1], uz: u[2]
        };
    }

    /* 自动取景：把太阳 / 地球 / 整条月球轨道收进画面（对全部偏航角取范围，
       于是左右旋转时焦距不变、画面不会忽大忽小）。模型左右上下对称 →
       取景框中心即画面中心，地心永远固定在画面正中。 */
    function sceneFit() {
        var shortSide = Math.min(scene.w, scene.h);
        if (viewMode === 'earth') {
            /* 地球视角：让月球球面占画面短边的约 44%（直径） */
            scene.F = 0.22 * shortSide * ORBIT_R3 / MOON_R3 * scene.zoom;
            scene.cx0 = scene.w / 2;
            scene.cy0 = scene.h / 2;
            return;
        }
        var pts = [[SUN_POS, SUN_R3], [[0, 0, 0], EARTH_R3]];
        for (var i = 0; i < 24; i++) {
            var th = i / 24 * TAU;
            pts.push([[Math.cos(th) * ORBIT_R3, Math.sin(th) * ORBIT_R3, 0], MINI_R3]);
        }
        var xMin = 1e9, xMax = -1e9, zMin = 1e9, zMax = -1e9;
        for (var yi = 0; yi < 12; yi++) {
            var B = camBasis(yi / 12 * TAU, scene.pitch);
            for (var k = 0; k < pts.length; k++) {
                var p = pts[k][0];
                var vx = p[0] - B.px, vy = p[1] - B.py, vz = p[2] - B.pz;
                var yc = vx * B.fx + vy * B.fy + vz * B.fz;
                if (yc < 60) { continue; }
                var nx = (vx * B.rx + vy * B.ry + vz * B.rz) / yc;
                var nz = (vx * B.ux + vy * B.uy + vz * B.uz) / yc;
                var rho = pts[k][1] / yc;
                xMin = Math.min(xMin, nx - rho);
                xMax = Math.max(xMax, nx + rho);
                zMin = Math.min(zMin, nz - rho);
                zMax = Math.max(zMax, nz + rho);
            }
        }
        if (xMax <= xMin || zMax <= zMin) { return; }
        var pad = Math.min(scene.w, scene.h) * FIT_MARGIN;
        var fit = Math.min((scene.w / 2 - pad) / Math.max(xMax, -xMin),
                           (scene.h / 2 - pad) / Math.max(zMax, -zMin));
        scene.F = Math.max(160, fit) * scene.zoom;
        scene.cx0 = scene.w / 2 - scene.F * (xMin + xMax) / 2;
        scene.cy0 = scene.h / 2 + scene.F * (zMin + zMax) / 2;
    }

    function norm3(v) {
        var m = Math.hypot(v[0], v[1], v[2]) || 1;
        return [v[0] / m, v[1] / m, v[2] / m];
    }

    function moonPos3(phase) {
        var th = phase * Math.PI * 2;
        return [Math.cos(th) * ORBIT_R3, Math.sin(th) * ORBIT_R3, 0];
    }

    function renderScene() {
        var ctx = scene.ctx;
        if (!ctx) { return; }
        var W = scene.w, H = scene.h;
        var F = scene.F, cx0 = scene.cx0, cy0 = scene.cy0;
        var isEarth = viewMode === 'earth';
        var B = isEarth ? camBasisEarth() : camBasis(scene.yaw, scene.pitch);
        var fontFam = getComputedStyle(document.body).fontFamily;
        ctx.setTransform(scene.dpr, 0, 0, scene.dpr, 0, 0);

        /* 深空背景 */
        var bg = ctx.createLinearGradient(0, 0, 0, H);
        bg.addColorStop(0, '#0a0f22');
        bg.addColorStop(1, '#141c3a');
        ctx.fillStyle = bg;
        ctx.fillRect(0, 0, W, H);

        scene.hits = [];

        function proj(p) {
            var vx = p[0] - B.px, vy = p[1] - B.py, vz = p[2] - B.pz;
            var yc = vx * B.fx + vy * B.fy + vz * B.fz;
            if (yc < 8) { return [0, 0, -1]; }
            var xc = vx * B.rx + vy * B.ry + vz * B.rz;
            var zc = vx * B.ux + vy * B.uy + vz * B.uz;
            return [cx0 + F * xc / yc, cy0 - F * zc / yc, yc];
        }

        /* 星空（随视角产生视差） */
        for (var si = 0; si < scene.stars.length; si++) {
            var st = scene.stars[si];
            var sp2 = proj([st.d[0] * 3000, st.d[1] * 3000, st.d[2] * 3000]);
            if (sp2[2] < 0) { continue; }
            ctx.globalAlpha = st.a;
            ctx.fillStyle = '#dbe4ff';
            ctx.fillRect(sp2[0], sp2[1], st.s, st.s);
        }
        ctx.globalAlpha = 1;

        /* 太阳光线（世界 +X → −X 方向的平行光示意）：只属于轨道视角 */
        if (state.ray && !isEarth) {
            ctx.strokeStyle = 'rgba(245,158,11,.4)';
            ctx.fillStyle = 'rgba(245,158,11,.65)';
            ctx.lineWidth = 1.6;
            ctx.setLineDash([8, 6]);
            for (var rk = 0; rk < 5; rk++) {
                var ry = -160 + rk * 80;
                var a1 = proj([380, ry, 0]);
                var a2 = proj([-380, ry, 0]);
                if (a1[2] < 0 || a2[2] < 0) { continue; }
                ctx.beginPath();
                ctx.moveTo(a1[0], a1[1]);
                ctx.lineTo(a2[0], a2[1]);
                ctx.stroke();
                var ah = proj([-300, ry, 0]);
                if (ah[2] > 0) {
                    ctx.beginPath();
                    ctx.moveTo(ah[0] + 7, ah[1]);
                    ctx.lineTo(ah[0] - 7, ah[1] - 5);
                    ctx.lineTo(ah[0] - 7, ah[1] + 5);
                    ctx.closePath();
                    ctx.fill();
                }
            }
            ctx.setLineDash([]);
        }

        /* 月球当前位置 + 轨道虚线圆 + 地月视线：只属于轨道视角 */
        var mp = moonPos3(phaseOf(state.age));
        if (!isEarth) {
            ctx.strokeStyle = 'rgba(148,163,184,.4)';
            ctx.lineWidth = 1.6;
            ctx.setLineDash([7, 7]);
            ctx.beginPath();
            var first = true;
            for (var oi = 0; oi <= 90; oi++) {
                var th = oi / 90 * Math.PI * 2;
                var op = proj([Math.cos(th) * ORBIT_R3, Math.sin(th) * ORBIT_R3, 0]);
                if (op[2] < 0) { first = true; continue; }
                if (first) { ctx.moveTo(op[0], op[1]); first = false; } else { ctx.lineTo(op[0], op[1]); }
            }
            ctx.stroke();
            ctx.setLineDash([]);

            var ep = proj([0, 0, 0]);
            var mq = proj(mp);
            if (ep[2] > 0 && mq[2] > 0) {
                ctx.strokeStyle = 'rgba(129,140,248,.55)';
                ctx.lineWidth = 1.8;
                ctx.setLineDash([6, 5]);
                ctx.beginPath();
                ctx.moveTo(ep[0], ep[1]);
                ctx.lineTo(mq[0], mq[1]);
                ctx.stroke();
                ctx.setLineDash([]);
            }
        }

        /* 通用球体：暗面 + 真实月相亮面
         * 可见亮面比例 k = (1 + lz) / 2（lz = 光照方向在「朝向观察者」轴上的分量），
         * 晨昏线在屏幕上的投影是短半轴 r·(2k−1) 的椭圆弧 —— 于是 3D 月球上直接
         * 呈现出新月 / 弦月 / 凸月 / 满月的形状，且亮面永远朝向太阳。 */
        function drawSphere(p, r3, tone, deco) {
            var q = proj(p);
            if (q[2] < 0) { return null; }
            var r = r3 * F / q[2];
            if (r < 0.5) { return null; }

            /* 太阳按「无限远平行光」处理（与画面里画出的平行光线一致）：
               否则太阳只在地月距离的 1.8 倍处，上弦月会被算成 74% 亮面，与右侧大图对不上 */
            var L = SUN_DIR;
            var lx = L[0] * B.rx + L[1] * B.ry + L[2] * B.rz;      /* 屏幕「右」分量 */
            var ly = L[0] * B.ux + L[1] * B.uy + L[2] * B.uz;      /* 屏幕「上」分量 */
            var lz = -(L[0] * B.fx + L[1] * B.fy + L[2] * B.fz);   /* 朝向观察者分量 */
            var k = clampNum((1 + lz) / 2, 0, 1);                  /* 可见亮面比例 */
            var lxA = Math.abs(lx);

            /* 暗面（背光半球）：留极弱中心光，保证球体轮廓可辨 */
            var dg = ctx.createRadialGradient(q[0], q[1], r * 0.05, q[0], q[1], r * 1.05);
            dg.addColorStop(0, tone.dark0);
            dg.addColorStop(1, tone.dark1);
            ctx.beginPath();
            ctx.arc(q[0], q[1], r, 0, TAU);
            ctx.fillStyle = dg;
            ctx.fill();
            if (deco) {
                ctx.save();
                ctx.beginPath();
                ctx.arc(q[0], q[1], r, 0, TAU);
                ctx.clip();
                ctx.globalAlpha = 0.45;   /* 暗面细节（地照）弱一点 */
                deco(q, r, lx, ly);
                ctx.restore();
            }

            /* 亮面：外弧 = 被照亮的半球边缘，内弧 = 晨昏线（椭圆弧） */
            if (k > 0.005) {
                ctx.save();
                if (lx < 0) { ctx.translate(q[0] * 2, 0); ctx.scale(-1, 1); }  /* 亮面在左 → 镜像绘制 */
                var a = r * (2 * k - 1);
                var aw = Math.max(0.01, Math.abs(a));
                ctx.beginPath();
                ctx.arc(q[0], q[1], r, -Math.PI / 2, Math.PI / 2, false);
                /* 晨昏线：k>0.5（凸月）时向「暗侧」鼓，k<0.5（月牙）时向「亮侧」鼓 */
                ctx.ellipse(q[0], q[1], aw, r, 0, Math.PI / 2, -Math.PI / 2, a < 0);
                ctx.closePath();
                var off = r * 0.6;
                var lg = ctx.createRadialGradient(q[0] + lxA * off, q[1] - ly * off, r * 0.06,
                                                  q[0] + lxA * off * 0.3, q[1] - ly * off * 0.3, r * 1.25);
                lg.addColorStop(0, tone.lit0);
                lg.addColorStop(0.55, tone.lit1);
                lg.addColorStop(1, tone.lit2);
                ctx.fillStyle = lg;
                ctx.fill();
                if (deco) {
                    ctx.save();
                    ctx.clip();
                    deco(q, r, lx, ly);
                    ctx.restore();
                }
                ctx.restore();
            }

            ctx.beginPath();
            ctx.arc(q[0], q[1], r, 0, TAU);
            ctx.strokeStyle = 'rgba(226,232,240,.2)';
            ctx.lineWidth = 1;
            ctx.stroke();
            return { x: q[0], y: q[1], r: r, k: k };
        }

        /* 太阳（发光体，无明暗） */
        function drawSun() {
            var q = proj(SUN_POS);
            if (q[2] < 0) { return; }
            var r = SUN_R3 * F / q[2];
            var halo = ctx.createRadialGradient(q[0], q[1], r * 0.6, q[0], q[1], r * 2.1);
            halo.addColorStop(0, 'rgba(253,224,71,.5)');
            halo.addColorStop(1, 'rgba(253,224,71,0)');
            ctx.fillStyle = halo;
            ctx.beginPath();
            ctx.arc(q[0], q[1], r * 2.1, 0, Math.PI * 2);
            ctx.fill();
            var g = ctx.createRadialGradient(q[0] - r * 0.2, q[1] - r * 0.2, r * 0.1, q[0], q[1], r);
            g.addColorStop(0, '#fff7d6');
            g.addColorStop(0.7, '#fde047');
            g.addColorStop(1, '#f59e0b');
            ctx.beginPath();
            ctx.arc(q[0], q[1], r, 0, Math.PI * 2);
            ctx.fillStyle = g;
            ctx.fill();
            ctx.fillStyle = 'rgba(180,83,9,.95)';
            ctx.font = '800 14px ' + fontFam;
            ctx.textAlign = 'center';
            ctx.fillText('太阳', q[0], q[1] + 4);
        }

        /* 地球（含随月龄自转的陆地贴片 + 晨昏线明暗） */
        function drawEarth() {
            var res = drawSphere([0, 0, 0], EARTH_R3, TONE_EARTH, function (q, r) {
                var spin = state.age * 0.9;
                ctx.fillStyle = 'rgba(34,197,94,.75)';
                for (var k = 0; k < 3; k++) {
                    var ex = (spin + k * 2.1) % TAU;
                    var px = q[0] + Math.sin(ex) * r * 0.9;
                    var vis = Math.cos(ex);
                    if (vis <= 0) { continue; }
                    ctx.globalAlpha = 0.25 + 0.55 * vis;
                    ctx.beginPath();
                    ctx.ellipse(px, q[1] + (k - 1) * r * 0.28, r * 0.34, r * 0.18, (k - 1) * 0.5, 0, TAU);
                    ctx.fill();
                }
                ctx.globalAlpha = 1;
            });
            if (!res) { return; }
            ctx.fillStyle = 'rgba(147,197,253,.95)';
            ctx.font = '800 14px ' + fontFam;
            ctx.textAlign = 'center';
            ctx.fillText('地球', res.x, res.y + res.r + 18);
        }

        /* 月球：环形山贴片 + 实时月相亮面；label 为真时在球旁边标注当前月相 */
        function drawMoon(p, r3, label) {
            var res = drawSphere(p, r3, TONE_MOON, function (q, r) {
                /* 环形山：软边暗斑（硬边圆点在大尺寸下会显得很假） */
                var craters = [
                    [-0.34, -0.22, 0.19], [0.28, 0.30, 0.14], [0.10, -0.44, 0.10],
                    [-0.06, 0.34, 0.12], [0.44, -0.06, 0.09], [-0.50, 0.22, 0.11],
                    [0.06, 0.06, 0.07]
                ];
                for (var ci = 0; ci < craters.length; ci++) {
                    var cx3 = q[0] + craters[ci][0] * r;
                    var cy3 = q[1] + craters[ci][1] * r;
                    var cr3 = craters[ci][2] * r;
                    var cg = ctx.createRadialGradient(cx3, cy3, cr3 * 0.1, cx3, cy3, cr3);
                    cg.addColorStop(0, 'rgba(74,80,96,.34)');
                    cg.addColorStop(0.7, 'rgba(74,80,96,.22)');
                    cg.addColorStop(1, 'rgba(74,80,96,.02)');
                    ctx.fillStyle = cg;
                    ctx.beginPath();
                    ctx.arc(cx3, cy3, cr3, 0, TAU);
                    ctx.fill();
                }
            });
            if (!res || !label) { return res; }
            /* 两行说明：地球视角下球面比例就是当晚所见；轨道视角下球面比例取决于
               观察角度（俯视时月球常被大半照亮），所以要另外标出「从地球看」的月相 */
            var nm = defOf(phaseOf(state.age)).name;
            var pct = Math.round(res.k * 100);
            var l1, l2;
            if (isEarth) {
                l1 = '月相「' + nm + '」· 亮面 ' + pct + '%';
                l2 = '这就是站在地球上看到的月亮';
            } else {
                l1 = '月球 · 从地球看「' + nm + '」';
                l2 = '当前视角可见亮面 ' + pct + '%（亮面永远朝向太阳）';
            }
            ctx.textAlign = 'center';
            ctx.font = '800 13px ' + fontFam;
            var tw = ctx.measureText(l1).width;
            ctx.font = '700 11.5px ' + fontFam;
            tw = Math.max(tw, ctx.measureText(l2).width);
            var tx = clampNum(res.x, tw / 2 + 10, Math.max(tw / 2 + 10, scene.w - tw / 2 - 10));
            var above = (res.y - res.r - 36) > 14;
            var ty = above ? res.y - res.r - 21 : res.y + res.r + 17;
            ctx.fillStyle = '#c7d2fe';
            ctx.font = '800 13px ' + fontFam;
            ctx.fillText(l1, tx, ty);
            ctx.fillStyle = 'rgba(150,166,190,.95)';
            ctx.font = '700 11.5px ' + fontFam;
            ctx.fillText(l2, tx, ty + 15);
            return res;
        }

        /* 8 个典型位置的迷你月球：各自按真实光照呈现「在那个位置看到的月相」，可点击跳转 */
        function drawMini(i) {
            var pos = moonPos3(i / 8);
            var q = proj(pos);
            if (q[2] < 0) { return; }
            var r = MINI_R3 * F / q[2];
            var phase = phaseOf(state.age);
            var near = Math.abs(((phase - i / 8 + 0.5) % 1 + 1) % 1 - 0.5) < 1 / 16;
            if (near) {
                ctx.beginPath();
                ctx.arc(q[0], q[1], r + 8, 0, TAU);
                ctx.strokeStyle = '#818cf8';
                ctx.lineWidth = 2.4;
                ctx.stroke();
            }
            scene.hits.push({ x: q[0], y: q[1], r: r + 9, i: i });
            drawSphere(pos, MINI_R3, TONE_MOON, null);
        }

        /* 按深度排序绘制（远 → 近），迷你月球按各自位置参与排序。
           地球视角只画月球本身（太阳 / 地球 / 轨道都不在视野里）。 */
        var bodies = [];
        if (!isEarth) {
            bodies.push({ d: Math.hypot(SUN_POS[0] - B.px, SUN_POS[1] - B.py, SUN_POS[2] - B.pz), f: drawSun });
            bodies.push({ d: CAM_DIST, f: drawEarth });
        }
        bodies.push({
            d: Math.hypot(mp[0] - B.px, mp[1] - B.py, mp[2] - B.pz),
            f: function () { drawMoon(mp, MOON_R3, true); }
        });
        if (!isEarth) {
            for (var mi = 0; mi < 8; mi++) {
                (function (idx) {
                    var p3 = moonPos3(idx / 8);
                    bodies.push({
                        d: Math.hypot(p3[0] - B.px, p3[1] - B.py, p3[2] - B.pz),
                        f: function () { drawMini(idx); }
                    });
                })(mi);
            }
        }
        bodies.sort(function (a, b) { return b.d - a.d; });
        for (var bi = 0; bi < bodies.length; bi++) { bodies[bi].f(); }

        /* 地球视角：标出太阳在天空中的方向（月亮亮面永远朝着它） */
        if (isEarth && state.ray) {
            /* 地心 → 太阳 = 世界 +X 方向，在相机基下分解为 右 / 上 / 前 三个分量 */
            var sx = B.rx, su = B.ux, sf = B.fx;
            if (sf > 0.15) {
                var mx = clampNum(cx0 + F * sx / sf, 30, W - 30);
                var my = clampNum(cy0 - F * su / sf, 30, H - 30);
                var hal = ctx.createRadialGradient(mx, my, 3, mx, my, 32);
                hal.addColorStop(0, 'rgba(253,224,71,.5)');
                hal.addColorStop(1, 'rgba(253,224,71,0)');
                ctx.fillStyle = hal;
                ctx.beginPath();
                ctx.arc(mx, my, 32, 0, TAU);
                ctx.fill();
                ctx.fillStyle = '#fbbf24';
                ctx.beginPath();
                ctx.arc(mx, my, 8, 0, TAU);
                ctx.fill();
                ctx.font = '800 12px ' + fontFam;
                ctx.fillStyle = 'rgba(253,230,138,.92)';
                var atRight = mx <= W / 2;
                ctx.textAlign = atRight ? 'left' : 'right';
                ctx.fillText('太阳方向（亮面朝着它）', atRight ? mx + 16 : mx - 16, my + 4);
            }
        }

        /* 底部说明 */
        ctx.fillStyle = 'rgba(148,163,184,.78)';
        ctx.font = '600 12px ' + fontFam;
        ctx.textAlign = 'left';
        ctx.fillText(isEarth
            ? '地球视角：镜头就在地球上，看到的月面形状即当晚的月相 · 滚轮缩放，切回轨道视角可自由旋转'
            : '月球亮面永远朝向太阳（虚线 = 公转轨道与地月视线）· 拖动旋转 / 滚轮缩放 / 双击复位视角', 14, H - 14);
    }

    /* ---------- 3D 场景交互：拖拽旋转 / 滚轮缩放 / 复位视角 ---------- */

    function persistCam() {
        store.set('yaw', scene.yaw);
        store.set('pitch', scene.pitch);
        store.set('zoom', scene.zoom);
    }

    /* 重新测量画布 + 重新取景 + 重绘：窗口/容器尺寸变化（含全屏切换）都走这里 */
    function relayout() {
        sceneResize();
        renderScene();
    }

    function resetView(notify) {
        scene.yaw = VIEW_DEFAULT.yaw;
        scene.pitch = VIEW_DEFAULT.pitch;
        scene.zoom = VIEW_DEFAULT.zoom;
        persistCam();
        relayout();
        if (notify) { chrome.setStatus('视角已复位，系统已自动适配画面', 'ok'); }
    }

    /* 切换「轨道视角 / 地球视角」：按钮文字显示的是「点了会去哪个视角」 */
    function setViewMode(mode, notify) {
        viewMode = mode === 'earth' ? 'earth' : 'orbit';
        store.set('view', viewMode);
        if (els.btnViewTxt) {
            els.btnViewTxt.textContent = viewMode === 'earth' ? '轨道视角' : '地球视角';
        }
        if (els.btnView) {
            els.btnView.title = viewMode === 'earth'
                ? '切回轨道视角（看太阳、地球、月球的相对位置）'
                : '切到地球视角（站在地球上看月亮，月面就是当晚的月相）';
        }
        if (els.scene) { els.scene.style.cursor = viewMode === 'earth' ? 'default' : 'grab'; }
        relayout();
        if (notify) {
            chrome.setStatus(viewMode === 'earth'
                ? '地球视角：这就是站在地球上看到的月相变化'
                : '轨道视角：看太阳、地球、月球的相对位置', 'ok');
        }
    }

    (function bindScene() {
        var cv = els.scene;
        var drag = null;

        cv.addEventListener('pointerdown', function (e) {
            if (viewMode === 'earth') { return; }   /* 地球视角镜头锁定月球，不旋转 */
            drag = { x: e.clientX, y: e.clientY };
            scene.dragged = 0;
            try { cv.setPointerCapture(e.pointerId); } catch (err) { /* 忽略 */ }
        });

        cv.addEventListener('pointermove', function (e) {
            if (!drag) { return; }
            var dx = e.clientX - drag.x;
            var dy = e.clientY - drag.y;
            drag = { x: e.clientX, y: e.clientY };
            scene.dragged += Math.abs(dx) + Math.abs(dy);
            scene.yaw += dx * 0.0065;
            scene.pitch = clampNum(scene.pitch + dy * 0.005, 0.06, 1.45);
            sceneFit();     /* 俯仰角变化 → 重新取景，保证系统始终完整在画面内 */
            renderScene();
        });

        function endDrag(e) {
            if (!drag) { return; }
            drag = null;
            persistCam();
            if (scene.dragged < 6) { sceneClick(e); }
        }
        cv.addEventListener('pointerup', endDrag);
        cv.addEventListener('pointercancel', function () { drag = null; });

        cv.addEventListener('wheel', function (e) {
            e.preventDefault();
            scene.zoom = clampNum(scene.zoom * (e.deltaY < 0 ? 1.1 : 0.9), ZOOM_MIN, ZOOM_MAX);
            persistCam();
            sceneFit();
            renderScene();
        }, { passive: false });

        cv.addEventListener('dblclick', function () { resetView(true); });

        if (els.btnReset) {
            els.btnReset.addEventListener('click', function () { resetView(true); });
        }

        if (els.btnView) {
            els.btnView.addEventListener('click', function () {
                setViewMode(viewMode === 'earth' ? 'orbit' : 'earth', true);
                try { chrome.beep('tick'); } catch (err) { /* 静默 */ }
            });
        }

        window.addEventListener('resize', relayout);
        window.addEventListener('orientationchange', relayout);
        document.addEventListener('fullscreenchange', relayout);
        document.addEventListener('webkitfullscreenchange', relayout);

        /* 容器尺寸变化（分栏 / 抽屉 / iframe 放大）也能立刻重新取景：
           画布是绝对定位 + 100% 尺寸，位图尺寸不参与布局，不会触发循环 */
        if (window.ResizeObserver) {
            try {
                new ResizeObserver(function () { relayout(); }).observe(cv);
            } catch (err) { /* 不支持则退回 resize 事件 */ }
        }
    })();

    function sceneClick(e) {
        var rect = els.scene.getBoundingClientRect();
        var px = e.clientX - rect.left;
        var py = e.clientY - rect.top;
        for (var i = 0; i < scene.hits.length; i++) {
            if (Math.hypot(scene.hits[i].x - px, scene.hits[i].y - py) < scene.hits[i].r) {
                if (state.playing) { togglePlay(); }
                setAge(SYNODIC * scene.hits[i].i / 8);
                return;
            }
        }
    }

    /* ---------- 从地球看到的月相（大图） ---------- */

    function renderView() {
        var phase = phaseOf(state.age);
        var k = brightOf(phase);
        var def = defOf(phase);
        var lunar = lunarDayText(phase);

        var svg = '<svg viewBox="0 0 220 220" width="200" height="200" role="img" aria-label="月相形状">' +
            '<rect x="0" y="0" width="220" height="220" fill="#0f172a" rx="110"></rect>' +
            '<circle cx="110" cy="110" r="72" fill="none" stroke="rgba(148,163,184,.25)" ' +
            'stroke-width="1.5" stroke-dasharray="4 4"></circle>' +
            moonSvg(110, 110, 68, phase, null) +
            '</svg>';
        els.viewBox.innerHTML = svg;

        els.phaseName.textContent = def.name;
        els.lunarDay.textContent = '农历 ' + lunar + ' · 月龄 ' + state.age.toFixed(1) + ' 天';
        els.meta.innerHTML =
            '<span>亮面比例：<b>' + Math.round(k * 100) + '%</b></span>' +
            '<span>出现时间：<b>' + def.when + '</b></span>' +
            '<span>可见时段：<b>' + def.time + '</b></span>' +
            '<span>亮面朝向：<b>' + (k < 0.02 ? '不可见' : (phase < 0.5 ? '右侧（上半月）' : '左侧（下半月）')) + '</b></span>';

        var items = els.quick.children;
        for (var i = 0; i < items.length; i++) {
            var age = parseFloat(items[i].getAttribute('data-age'), 10);
            items[i].classList.toggle('is-on', Math.abs(age - state.age) < 0.6);
        }
    }

    function lunarDayText(phase) {
        var n = Math.floor(phase * SYNODIC) + 1;
        if (n < 1) { n = 1; }
        if (n > 30) { n = 30; }
        if (n <= 10) { return '初' + CYCLE_NUM[n]; }
        if (n < 20) { return '十' + CYCLE_NUM[n - 10]; }
        if (n === 20) { return '二十'; }
        if (n < 30) { return '廿' + CYCLE_NUM[n - 20]; }
        return '三十';
    }

    /* ---------- 更新 ---------- */

    function setAge(age, silent) {
        state.age = Math.max(0, Math.min(SYNODIC, age));
        store.set('age', state.age);
        els.slider.value = String(state.age);
        els.ageNum.textContent = state.age.toFixed(1);
        renderScene();
        renderView();
        if (!silent) {
            var def = defOf(phaseOf(state.age));
            chrome.setStatus(def.name + ' · 月龄 ' + state.age.toFixed(1) + ' 天', 'ok');
        }
    }

    els.slider.addEventListener('input', function () {
        stopPlay();
        setAge(parseFloat(els.slider.value));
    });

    /* ---------- 播放 ---------- */

    var rafId = null;
    var lastTs = 0;

    function frame(ts) {
        rafId = requestAnimationFrame(frame);
        if (!lastTs) { lastTs = ts; }
        var dt = Math.min(0.05, (ts - lastTs) / 1000);
        lastTs = ts;
        var next = state.age + dt * (SYNODIC / 16);
        if (next > SYNODIC) { next -= SYNODIC; }
        setAge(next, true);
    }

    function startPlay() {
        if (rafId) { return; }
        lastTs = 0;
        rafId = requestAnimationFrame(frame);
    }

    function stopPlay() {
        if (rafId) {
            cancelAnimationFrame(rafId);
            rafId = null;
        }
        if (state.playing) {
            state.playing = false;
            store.set('playing', false);
            els.btnPlay.textContent = '播放';
            els.btnPlay.classList.remove('is-on');
        }
    }

    function togglePlay() {
        state.playing = !state.playing;
        store.set('playing', state.playing);
        els.btnPlay.textContent = state.playing ? '暂停' : '播放';
        els.btnPlay.classList.toggle('is-on', state.playing);
        if (state.playing) {
            startPlay();
            chrome.setStatus('播放中：一个朔望月约 16 秒走完', 'ok');
        } else {
            lastTs = 0;
            if (rafId) {
                cancelAnimationFrame(rafId);
                rafId = null;
            }
            chrome.setStatus('已暂停', 'warn');
        }
    }

    els.btnPlay.addEventListener('click', togglePlay);

    els.btnRay.addEventListener('click', function () {
        state.ray = !state.ray;
        store.set('ray', state.ray);
        els.btnRay.classList.toggle('is-on', state.ray);
        renderScene();
    });

    /* ---------- 快捷月相 ---------- */

    function buildQuick() {
        els.quick.innerHTML = '';
        QUICK.forEach(function (q) {
            var b = document.createElement('button');
            b.type = 'button';
            b.className = 'mp-item';
            b.setAttribute('data-age', q.age);
            b.textContent = q.label;
            b.addEventListener('click', function () {
                if (state.playing) { togglePlay(); }
                setAge(q.age);
                try { chrome.beep('tick'); } catch (e) { /* 静默 */ }
            });
            els.quick.appendChild(b);
        });
    }

    /* 轨道上迷你月球的点击命中已由 sceneClick 处理（3D 投影坐标） */

    /* ---------- 键盘 ---------- */

    function isTypingTarget(node) {
        if (!node || !node.tagName) { return false; }
        var tag = node.tagName.toUpperCase();
        return tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT' || node.isContentEditable === true;
    }

    document.addEventListener('keydown', function (e) {
        if (isTypingTarget(e.target) || document.querySelector('.et-modal, .et-drawer-backdrop')) { return; }
        if (e.code === 'Space') {
            e.preventDefault();
            togglePlay();
        } else if (e.key === 'ArrowRight') {
            e.preventDefault();
            setAge(state.age + 0.5);
        } else if (e.key === 'ArrowLeft') {
            e.preventDefault();
            setAge(state.age - 0.5);
        } else if (e.key === 'v' || e.key === 'V') {
            e.preventDefault();
            setViewMode(viewMode === 'earth' ? 'orbit' : 'earth', true);
        }
    });

    /* ---------- 启动 ---------- */

    buildQuick();
    els.btnRay.classList.toggle('is-on', state.ray);
    els.btnPlay.textContent = state.playing ? '暂停' : '播放';
    els.btnPlay.classList.toggle('is-on', state.playing);
    setViewMode(viewMode, false);
    sceneResize();
    setAge(state.age, true);
    if (state.playing) { startPlay(); }
})();
</script>

</body>
</html>
