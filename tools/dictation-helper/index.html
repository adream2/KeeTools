<style>
  /* 此块由 scripts/sync_shared.py 自动注入，请勿手工修改 */
/*!
 * et-chrome.css — 工具通用外壳样式（顶栏 / 页脚 / 弹窗 / 按钮 / 主题）
 *
 * 共享样式源。改这里，然后跑：python scripts/sync_shared.py
 * 所有类名带 et- 前缀，避免与工具自身样式冲突。
 * 依赖：无外部资源；颜色全部为令牌变量。
 */

/* ============ 设计令牌 ============ */
:root {
    --et-accent: #2563eb;
    --et-accent-weak: rgba(37, 99, 235, .14);
    --et-bg: #f4f6fb;
    --et-surface: #ffffff;
    --et-surface-2: #f8fafc;
    --et-fg: #0b1220;
    --et-muted: #64748b;
    --et-line: rgba(15, 23, 42, .12);
    --et-line-strong: rgba(15, 23, 42, .22);
    --et-glass: rgba(255, 255, 255, .85);
    --et-shadow-md: 0 10px 28px -18px rgba(15, 23, 42, .3);
    --et-shadow-lg: 0 24px 60px -32px rgba(15, 23, 42, .4);
    --et-ok: #059669;
    --et-warn: #d97706;
    --et-err: #dc2626;
    --et-radius: 12px;
    --et-radius-sm: 9px;
    --et-font: -apple-system, BlinkMacSystemFont, "Segoe UI",
               "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei",
               "Noto Sans SC", sans-serif;
    --et-mono: ui-monospace, "Cascadia Mono", Consolas, Menlo, monospace;
}

html[data-et-theme="dark"] {
    --et-bg: #0b1120;
    --et-surface: #111a2e;
    --et-surface-2: #0f1729;
    --et-fg: #f1f5f9;
    --et-muted: #94a3b8;
    --et-line: rgba(148, 163, 184, .18);
    --et-line-strong: rgba(148, 163, 184, .3);
    --et-glass: rgba(17, 26, 46, .85);
    --et-shadow-md: 0 10px 34px -18px rgba(0, 0, 0, .8);
    --et-shadow-lg: 0 24px 70px -30px rgba(0, 0, 0, .9);
    --et-ok: #34d399;
    --et-warn: #fbbf24;
    --et-err: #f87171;
}

/* ============ 基础 ============ */
.et-app {
    position: relative;
    isolation: isolate;
    display: flex;
    flex-direction: column;
    height: 100vh;
    height: 100dvh;
    overflow: hidden;
    background: var(--et-bg);
    color: var(--et-fg);
    font-family: var(--et-font);
    -webkit-font-smoothing: antialiased;
    transition: background .25s, color .25s;
}

/* 极光背景：径向渐变 + 呼吸动画（edupick 品质基线，老内核也不掉帧） */
.et-app::before {
    content: '';
    position: fixed;
    inset: 0;
    z-index: -1;
    pointer-events: none;
    background:
        radial-gradient(46% 40% at 20% 18%, var(--et-accent-weak), transparent 65%),
        radial-gradient(42% 38% at 82% 24%, var(--et-accent-weak), transparent 70%),
        radial-gradient(50% 44% at 55% 95%, rgba(16, 185, 129, .10), transparent 65%);
    animation: et-aurora 16s ease-in-out infinite alternate;
}

@keyframes et-aurora {
    from { opacity: .55; transform: scale(1); }
    to { opacity: 1; transform: scale(1.06); }
}

.et-app *,
.et-app *::before,
.et-app *::after { box-sizing: border-box; }

[hidden] { display: none !important; }

.et-icon {
    width: 18px;
    height: 18px;
    fill: none;
    stroke: currentColor;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
    flex: none;
}

/* ============ 顶栏 ============ */
.et-topbar {
    flex: none;
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 11px 20px;
    border-bottom: 1px solid var(--et-line);
    background: var(--et-glass);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    z-index: 20;
}

.et-brand {
    display: flex;
    align-items: center;
    gap: 10px;
    min-width: 0;
}

.et-brand__dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: var(--et-accent);
    box-shadow: 0 0 0 4px var(--et-accent-weak);
    flex: none;
}

.et-brand__name {
    font-weight: 800;
    font-size: 15px;
    letter-spacing: -.01em;
    white-space: nowrap;
}

.et-brand__sub {
    font-size: 12.5px;
    color: var(--et-muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.et-status {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 5px 14px;
    border-radius: 999px;
    font-size: 12.5px;
    color: var(--et-muted);
    background: var(--et-surface-2);
    border: 1px solid var(--et-line);
    white-space: nowrap;
    max-width: 42vw;
    overflow: hidden;
    text-overflow: ellipsis;
}

.et-status__dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--et-ok);
    flex: none;
    transition: background .2s;
}

.et-status[data-tone="err"] .et-status__dot { background: var(--et-err); }
.et-status[data-tone="warn"] .et-status__dot { background: var(--et-warn); }

.et-actions {
    display: flex;
    align-items: center;
    gap: 7px;
}

.et-icon-btn {
    display: inline-grid;
    place-items: center;
    width: 38px;
    height: 38px;
    font-size: 16px;
    line-height: 1;
    border-radius: 11px;
    border: 1px solid var(--et-line);
    background: var(--et-surface-2);
    color: var(--et-fg);
    cursor: pointer;
    transition: transform .14s, border-color .14s, color .14s, opacity .14s;
    -webkit-tap-highlight-color: transparent;
}

.et-icon-btn:hover {
    border-color: var(--et-accent);
    color: var(--et-accent);
    transform: translateY(-1px);
}

.et-icon-btn:active { transform: translateY(0); }
.et-icon-btn.is-off { opacity: .4; }
.et-icon-btn:focus-visible { outline: 2px solid var(--et-accent); outline-offset: 2px; }

/* ============ 主区默认 ============ */
.et-main {
    flex: 1;
    min-height: 0;
    position: relative;
    overflow: auto;
}

/* ============ 页脚（品牌回流 L2） ============ */
.et-footer {
    flex: none;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 7px 16px;
    font-size: 12px;
    color: var(--et-muted);
    border-top: 1px solid var(--et-line);
    background: var(--et-glass);
    user-select: none;
    z-index: 20;
}

.et-footer a {
    color: inherit;
    text-decoration: none;
    transition: color .14s;
}

.et-footer a:hover { color: var(--et-accent); }

/* ============ 按钮 ============ */
.et-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
    padding: 9px 16px;
    border-radius: 11px;
    font: inherit;
    font-size: 13.5px;
    font-weight: 700;
    border: 1px solid var(--et-line);
    background: var(--et-surface-2);
    color: var(--et-fg);
    cursor: pointer;
    transition: transform .14s, border-color .14s, color .14s, background .14s, box-shadow .14s;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
}

.et-btn:hover {
    border-color: var(--et-accent);
    color: var(--et-accent);
    transform: translateY(-1px);
}

.et-btn:active { transform: translateY(0); }
.et-btn:focus-visible { outline: 2px solid var(--et-accent); outline-offset: 2px; }
.et-btn:disabled { opacity: .45; cursor: not-allowed; transform: none; }

.et-btn--primary {
    background: var(--et-accent);
    border-color: var(--et-accent);
    color: #fff;
    box-shadow: 0 6px 18px -8px var(--et-accent);
}

.et-btn--primary:hover { color: #fff; filter: brightness(1.08); }
.et-btn--primary:disabled { filter: none; }

.et-btn--danger:hover {
    border-color: var(--et-err);
    color: var(--et-err);
}

.et-btn--lg {
    padding: 13px 26px;
    font-size: 16px;
    border-radius: 14px;
}

/* ============ 弹窗 ============ */
.et-modal {
    position: fixed;
    inset: 0;
    z-index: 100;
    display: grid;
    place-items: center;
    padding: 24px;
    background: rgba(2, 6, 23, .55);
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    animation: et-fade .18s ease;
}

.et-modal__panel {
    width: min(680px, 94vw);
    max-height: 86vh;
    max-height: 86dvh;
    display: flex;
    flex-direction: column;
    background: var(--et-surface);
    border: 1px solid var(--et-line);
    border-radius: 16px;
    box-shadow: var(--et-shadow-lg);
    animation: et-pop .2s cubic-bezier(.34, 1.4, .64, 1);
    overflow: hidden;
}

.et-modal__panel--narrow { width: min(460px, 92vw); }
.et-modal__panel--wide { width: min(900px, 94vw); }

.et-modal__head {
    flex: none;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 16px 20px;
    border-bottom: 1px solid var(--et-line);
    font-weight: 800;
    font-size: 15px;
}

.et-modal__head .et-icon-btn {
    margin-left: auto;
    width: 32px;
    height: 32px;
}

.et-modal__body {
    flex: 1;
    min-height: 0;
    overflow: auto;
    padding: 18px 20px;
}

.et-modal__foot {
    flex: none;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 14px 20px;
    border-top: 1px solid var(--et-line);
    background: var(--et-surface-2);
}

.et-modal__foot .spacer { flex: 1; }

@keyframes et-fade {
    from { opacity: 0; }
}

@keyframes et-pop {
    from { opacity: 0; transform: translateY(14px) scale(.97); }
}

/* ============ 轻提示（toast） ============ */
.et-toast {
    position: fixed;
    left: 50%;
    bottom: 56px;
    transform: translateX(-50%) translateY(10px);
    z-index: 120;
    display: flex;
    align-items: center;
    gap: 9px;
    max-width: min(520px, 88vw);
    padding: 11px 18px;
    border-radius: 12px;
    font-size: 13.5px;
    font-weight: 600;
    color: #fff;
    background: rgba(15, 23, 42, .92);
    border: 1px solid rgba(148, 163, 184, .25);
    box-shadow: var(--et-shadow-lg);
    opacity: 0;
    pointer-events: none;
    transition: opacity .22s, transform .22s;
}

.et-toast.is-show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
}

.et-toast[data-tone="ok"] { background: rgba(5, 150, 105, .95); }
.et-toast[data-tone="err"] { background: rgba(220, 38, 38, .95); }
.et-toast[data-tone="warn"] { background: rgba(217, 119, 6, .95); }

/* ============ 设置抽屉（右上角入口，edupick 交互） ============ */
.et-drawer-backdrop {
    position: fixed;
    inset: 0;
    z-index: 90;
    background: rgba(2, 6, 23, .45);
    backdrop-filter: blur(3px);
    -webkit-backdrop-filter: blur(3px);
    opacity: 0;
    transition: opacity .2s;
}

.et-drawer-backdrop.is-open { opacity: 1; }

.et-drawer {
    position: absolute;
    top: 0;
    right: 0;
    height: 100%;
    width: min(400px, 92vw);
    display: flex;
    flex-direction: column;
    background: var(--et-surface);
    border-left: 1px solid var(--et-line);
    box-shadow: var(--et-shadow-lg);
    transform: translateX(100%);
    transition: transform .22s cubic-bezier(.32, .72, .35, 1);
}

.et-drawer-backdrop.is-open .et-drawer { transform: translateX(0); }

.et-drawer__head {
    flex: none;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 15px 18px;
    border-bottom: 1px solid var(--et-line);
    font-weight: 800;
    font-size: 15px;
    color: var(--et-accent);
}

.et-drawer__head .et-icon-btn {
    margin-left: auto;
    width: 32px;
    height: 32px;
}

.et-drawer__body {
    flex: 1;
    min-height: 0;
    overflow: auto;
    padding: 16px 18px 24px;
}

/* 抽屉内容通用小节（工具复用） */
.et-drawer__body h4 {
    margin: 18px 0 8px;
    font-size: 12px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: .08em;
    color: var(--et-muted);
}

.et-drawer__body h4:first-child { margin-top: 0; }

.et-drawer__row {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
}

.et-drawer__tip {
    margin: 8px 0 0;
    font-size: 12px;
    line-height: 1.8;
    color: var(--et-muted);
}

.et-drawer__tip b { color: var(--et-fg); }

.et-drawer__input {
    flex: 1;
    min-width: 0;
    padding: 9px 12px;
    border: 1px solid var(--et-line-strong);
    border-radius: 9px;
    background: var(--et-surface-2);
    color: var(--et-fg);
    font: inherit;
    font-size: 13.5px;
    transition: border-color .14s, box-shadow .14s;
}

.et-drawer__input:focus {
    outline: none;
    border-color: var(--et-accent);
    box-shadow: 0 0 0 3px var(--et-accent-weak);
}

.et-drawer__switch {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 10px 0;
    border-bottom: 1px dashed var(--et-line);
    font-size: 13.5px;
    font-weight: 600;
    color: var(--et-fg);
    cursor: pointer;
    user-select: none;
}

.et-drawer__switch input {
    width: 17px;
    height: 17px;
    accent-color: var(--et-accent);
    cursor: pointer;
}
</style>
<!-- /ET:INLINE -->

  /* 此块由 scripts/sync_shared.py 自动注入，请勿手工修改 */
/*!
 * et-import.css — 通用数据导入组件样式
 *

}

    padding: 12px 14px;
    border: 1px solid var(--et-line-strong);
    border-radius: 10px;
    background: var(--et-surface-2);
    color: var(--et-fg);
    font-family: var(--et-mono);
    font-size: 13px;
    line-height: 1.7;
    resize: vertical;
    transition: border-color .14s, box-shadow .14s;
}

.etimp-textarea:focus {
    outline: none;
    border-color: var(--et-accent);
    box-shadow: 0 0 0 3px var(--et-accent-weak);
}

/* ============ 拖放区 ============ */
.etimp-drop {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    min-height: 150px;
    padding: 24px;
    border: 2px dashed var(--et-line-strong);
    border-radius: 12px;
    color: var(--et-muted);
    text-align: center;
    cursor: pointer;
    transition: border-color .16s, background .16s, color .16s;
}

.etimp-drop:hover,
.etimp-drop.is-over {
    border-color: var(--et-accent);
    color: var(--et-accent);
    background: var(--et-accent-weak);
}

.etimp-drop .et-icon { width: 30px; height: 30px; stroke-width: 1.6; }
.etimp-drop__main { font-size: 14px; font-weight: 700; }
.etimp-drop__hint { font-size: 12px; }

.etimp-file {
    position: absolute;
    width: 1px;
    height: 1px;
    opacity: 0;
    overflow: hidden;
}

/* ============ 格式说明 ============ */
.etimp-help {
    margin-top: 12px;

    border-radius: 10px;
    background: var(--et-surface-2);
    border: 1px solid var(--et-line);
    font-size: 12.5px;
    color: var(--et-muted);
    line-height: 1.8;
}

.etimp-help b { color: var(--et-fg); }
.etimp-help code {
    font-family: var(--et-mono);
    font-size: 12px;
    padding: 1px 5px;
    border-radius: 4px;
    background: var(--et-accent-weak);
    color: var(--et-accent);
}

/* ============ 解析结果 ============ */
.etimp-result { margin-top: 14px; }

.etimp-stats {

    flex-wrap: wrap;
    gap: 8px;

}

.etimp-chip {

    gap: 5px;
    padding: 4px 12px;
    border-radius: 999px;
    font-size: 12px;

    background: var(--et-surface-2);

.etimp-chip--ok { color: var(--et-ok); border-color: var(--et-ok); background: rgba(5, 150, 105, .08); }

.etimp-chip--err { color: var(--et-err); border-color: var(--et-err); background: rgba(220, 38, 38, .08); }

}

.etimp-table tr:last-child td { border-bottom: none; }
.etimp-table td.etimp-dim { color: var(--et-muted); }
.etimp-table td.etimp-num { font-variant-numeric: tabular-nums; }

.etimp-errors {

}

.etimp-options {

.etimp-check input {

    height: 16px;
    accent-color: var(--et-accent);
    cursor: pointer;

        for (var i = 0; i < seq.length; i++) {

        head.appendChild(makeIcon('i-sliders'));
        head.appendChild(el('span', 'et-drawer__title', title));
        head.appendChild(makeBtn('i-x', '关闭', close));
        drawer.appendChild(head);

        drawer.appendChild(body);

            setTimeout(function () {

        var head = el('div', 'et-modal__head');
        if (mo.icon) { head.appendChild(makeIcon(mo.icon)); }
        head.appendChild(el('span', null, mo.title || ''));
        head.appendChild(makeBtn('i-x', '关闭', close));
        panel.appendChild(head);

        var body = el('div', 'et-modal__body');
        if (typeof mo.body === 'string') { body.innerHTML = mo.body; }
        else if (mo.body) { body.appendChild(mo.body); }
        panel.appendChild(body);

        var foot = null;
        if (mo.buttons && mo.buttons.length) {
            foot = el('div', 'et-modal__foot');
            foot.appendChild(el('span', 'spacer'));
            mo.buttons.forEach(function (b) {
                var btn = el('button', 'et-btn' + (b.primary ? ' et-btn--primary' : '') + (b.danger ? ' et-btn--danger' : ''), b.label);
                btn.type = 'button';
                btn.addEventListener('click', function () {
                    if (b.onClick) { b.onClick(close); } else { close(); }

                foot.appendChild(btn);

        document.body.appendChild(backdrop);

        function close() {
            if (backdrop.parentNode) { backdrop.parentNode.removeChild(backdrop); }
            document.removeEventListener('keydown', onKey);
            if (mo.onClose) { mo.onClose(); }
        }
        function onKey(ev) {
            if (ev.key === 'Escape') { ev.stopPropagation(); close(); }
        }
        document.addEventListener('keydown', onKey);

        toastTimer = setTimeout(function () { toastEl.classList.remove('is-show'); }, 2200);

                '<rect width="64" height="64" rx="14" fill="' + (accent || '#2563eb') + '"/>' +
                '<text x="32" y="43" font-size="32" font-weight="800" font-family="sans-serif" ' +
                'fill="#fff" text-anchor="middle">' + (title || '课').charAt(0) + '</text></svg>';
            var iconUri = 'data:image/svg+xml,' + encodeURIComponent(svg);

            var mf = {

        if (!main) { main = el('main'); main.id = 'et-main'; topbar.after(main); }
        if (!footer) { footer = el('footer'); footer.id = 'et-footer'; document.body.appendChild(footer); }

        main.classList.add('et-main');
        footer.className = 'et-footer';

        var brand = el('div', 'et-brand');
        brand.appendChild(el('span', 'et-brand__dot'));
        var nameWrap = el('div');

        nameWrap.appendChild(el('div', 'et-brand__name', opt.title || '课工具'));
        if (opt.sub) { nameWrap.appendChild(el('div', 'et-brand__sub', opt.sub)); }
        brand.appendChild(nameWrap);
        topbar.appendChild(brand);

        statusPill.appendChild(el('span', 'et-status__dot'));
        var statusText = el('span', null, '');
        statusPill.appendChild(statusText);
        topbar.appendChild(statusPill);

        api.setStatus = function (text, tone) {
            if (!text) { statusPill.hidden = true; return; }
            statusText.textContent = text;
            statusPill.setAttribute('data-tone', tone || 'ok');
            statusPill.hidden = false;
        };
        if (opt.status) { api.setStatus(opt.status); }

        var actions = el('div', 'et-actions');

        if (opt.settings && typeof opt.settings.build === 'function') {
            settingsBtn = makeBtn('i-sliders', opt.settings.title || '设置', function () {
                openDrawer(opt.settings.title || '设置', function (body, drawerApi) {
                    opt.settings.build(body, { api: api, close: drawerApi.close });
                });
            });
            actions.appendChild(settingsBtn);
        }

        (opt.actions || []).forEach(function (a) {
            var b = makeBtn(a.icon, a.label || '', a.onClick);
            if (a.id) { b.id = a.id; }

        if (opt.sound) {
            soundBtn = makeBtn(soundEnabled ? 'i-volume' : 'i-volume-off',
                soundEnabled ? '关闭音效' : '开启音效', toggleSound);
            if (!soundEnabled) { soundBtn.classList.add('is-off'); }

            actions.appendChild(makeBtn('i-help', '使用说明', function () { openHelp(); }));

        var fsBtn = makeBtn('i-maximize', '全屏', toggleFullscreen);
        actions.appendChild(fsBtn);

        topbar.appendChild(actions);

        function toggleSound() {
            soundEnabled = !soundEnabled;
            store.set('sound', soundEnabled);
            soundBtn.innerHTML = '';
            soundBtn.appendChild(makeIcon(soundEnabled ? 'i-volume' : 'i-volume-off'));
            soundBtn.title = soundEnabled ? '关闭音效' : '开启音效';
            soundBtn.classList.toggle('is-off', !soundEnabled);

            if (settingsBtn) { settingsBtn.click(); }

                if (req) { try { req.call(root); } catch (err) { /* 忽略 */ } }

            if (!fsBtn) { return; }
            fsBtn.innerHTML = '';
            fsBtn.appendChild(makeIcon(on ? 'i-minimize' : 'i-maximize'));
            fsBtn.title = on ? '退出全屏' : '全屏';
        }

            syncFsIcon(!!(document.fullscreenElement || document.webkitFullscreenElement));
        });

        });

        api.beep = function (kind) {
            if (!soundEnabled) { return; }

        /* ---------- 帮助 ---------- */
        function openHelp() {
            modal({
                title: '使用说明',
                icon: 'i-help',
                size: 'narrow',
                body: opt.help,
                buttons: [{ label: '知道了', primary: true }]

        api.openHelp = openHelp;

            ? global.ET_SITE_ORIGIN

        function renderFooter() {
            footer.textContent = '';
            footer.appendChild(el('span', null, 'KeeTools 课工具'));
            footer.appendChild(el('span', null, '·'));
            if (siteOrigin) {
                var a = el('a', null, '更多课堂工具');
                a.href = siteOrigin + '/?from=tool-footer&tool=' + encodeURIComponent(toolId);
                a.target = '_blank';
                a.rel = 'noopener';
                footer.appendChild(a);
            } else {
                footer.appendChild(el('span', null, '更多课堂工具'));
            }
        }
        renderFooter();

        /* 站点来源发现：iframe 内向父窗口询问；也可由宿主直接注入 ET_SITE_ORIGIN */
        try {
            if (global.parent && global.parent !== global) {
                global.parent.postMessage(JSON.stringify({ type: 'et-hello', toolId: toolId }), '*');
            }
        } catch (err) { /* 跨域异常忽略 */ }

        global.addEventListener('message', function (ev) {
            var data = ev.data;
            if (typeof data === 'string') {
                try { data = JSON.parse(data); } catch (err) { return; }
            }
            if (!data || typeof data !== 'object') { return; }

            if (data.type === 'et-origin' && typeof data.origin === 'string' && /^https?:\/\//.test(data.origin)) {
                siteOrigin = data.origin;
                if (!global.ET_SITE_ORIGIN) { global.ET_SITE_ORIGIN = data.origin; }
                renderFooter();
            }
            if (data.type === 'et-fullscreen-change' && typeof data.value === 'boolean') {
                syncFsIcon(data.value);
            }
        });

        api.el = { topbar: topbar, main: main, footer: footer, actions: actions };

        /* ---------- 激光笔 / 翻页笔适配（HID 翻页键） ----------
         * 翻页笔的上下页键在系统层等价于 PageDown / PageUp。
         * 工具通过 opt.primary / opt.secondary 注册动作：
         *   PageDown → primary（主操作，如开始点名 / 开始计时）
         *   PageUp   → secondary（副操作，缺省时同 primary）
         * 输入框聚焦或弹窗/抽屉打开时不响应，避免误触。 */
        if (typeof opt.primary === 'function') {
            document.addEventListener('keydown', function (ev) {
                if (ev.key !== 'PageDown' && ev.key !== 'PageUp') { return; }
                var tag = (document.activeElement && document.activeElement.tagName) || '';
                if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') { return; }
                if (document.querySelector('.et-modal, .et-drawer-backdrop, .ws-winner')) { return; }
                ev.preventDefault();
                if (ev.key === 'PageDown') { opt.primary(); }
                else if (typeof opt.secondary === 'function') { opt.secondary(); }
                else { opt.primary(); }
            });

        return api;

    global.ET = global.ET || {};
    global.ET.Chrome = {
        mount: mount,
        modal: modal,
        toast: toast,
        beep: playBeep /* 挂载前的独立音效入口（不经过音效开关） */
    };
})(window);
</script>

(function (global) {

    var NAME_KEYS = ['姓名', '名字', '名称', '学生', '学员', 'name', 'student'];

    var WEIGHT_KEYS = ['权重', '次数', '倍数', 'weight', 'times'];

    function normCell(s) {

                    stats.blanks++; /* 表头行不算数据 */
                    break;
                }
            }
        }

        /* --- 列映射 --- */
        var map = { name: -1, id: -1, weight: -1 };
        if (header) {
            for (var hc = 0; hc < header.length; hc++) {
                if (map.name < 0 && matchKey(header[hc], NAME_KEYS)) { map.name = hc; }
                else if (opts.id && map.id < 0 && matchKey(header[hc], ID_KEYS)) { map.id = hc; }
                else if (opts.weight && map.weight < 0 && matchKey(header[hc], WEIGHT_KEYS)) { map.weight = hc; }
            }
        }

        var cols = table.map(function (row) { return row; });
        function colValues(idx) {
            return cols.map(function (r) { return normCell(r[idx]); }).filter(function (v) { return v !== ''; });
        }

        if (map.name < 0) {
            if (width === 1) {
                map.name = 0;
            } else {
                var c0 = colValues(0);
                var c1 = colValues(1);
                var numeric0 = isAllNumeric(c0);
                var numeric1 = isAllNumeric(c1);
                if (width === 2) {
                    if (numeric0 && !numeric1) { map.id = 0; map.name = 1; }
                    else if (numeric1 && !numeric0 && opts.weight) { map.name = 0; map.weight = 1; }
                    else { map.name = 0; }
                } else {
                    /* ≥3 列：编号 | 姓名 | 权重 的经典布局 */
                    if (numeric0) { map.id = 0; map.name = 1; } else { map.name = 0; }
                    if (opts.weight) { map.weight = width - 1; }
                }
            }
        }
        if (map.name < 0) { map.name = 0; }
        if (!opts.weight) { map.weight = -1; }
        if (!opts.id) { map.id = -1; }

        /* --- 逐行处理 --- */
        var rows = [];
        var seen = {};
        var wantWeight = map.weight >= 0;

        for (var i = 0; i < table.length; i++) {
            var raw = table[i];
            var lineNo = i + (header ? 2 : 1); /* 用户视角的行号（含表头） */
            var name = map.name < raw.length ? normCell(raw[map.name]) : '';
            var restEmpty = true;
            for (var rc = 0; rc < raw.length; rc++) {
                if (normCell(raw[rc])) { restEmpty = false; break; }
            }
            if (!name && restEmpty) { stats.blanks++; continue; }

            if (!name) {
                stats.errors.push('第 ' + lineNo + ' 行：姓名列为空，已跳过');
                continue;
            }

            var weight = 1;
            if (wantWeight && map.weight < raw.length) {
                var wv = normCell(raw[map.weight]);
                if (wv !== '') {
                    var wn = Number(wv);
                    if (isFinite(wn) && wn >= 1) {
                        weight = Math.min(MAX_WEIGHT, Math.round(wn));
                        if (weight !== wn) {
                            stats.errors.push('第 ' + lineNo + ' 行：权重 "' + wv + '" 已取整为 ' + weight);
                        }
                    } else {
                        stats.errors.push('第 ' + lineNo + ' 行：权重 "' + wv + '" 无效（需 ≥1 的数字），按 1 处理');
                    }
                }
            }

            var id = '';
            if (map.id >= 0 && map.id < raw.length) {
                id = normCell(raw[map.id]);
            }

            if (opts.dedupe !== false && seen[name]) {
                stats.dupes++;
                continue;
            }
            seen[name] = true;

            rows.push({ name: name, id: id, weight: weight });
        }
        return rows;
    }

    function jsonToTable(json) {
        if (Array.isArray(json)) {
            var table = [];
            for (var i = 0; i < json.length; i++) {
                var item = json[i];
                if (typeof item === 'string' || typeof item === 'number') {
                    table.push([String(item)]);
                } else if (item && typeof item === 'object') {
                    var name = item.name || item.姓名 || item.名字 || item.title || '';
                    var weight = item.weight || item.权重 || item.次数 || '';
                    var id = item.id || item.学号 || item.编号 || '';
                    if (name !== undefined && name !== null) {
                        table.push([String(id), String(name), String(weight)]);
                    }
                }
            }
            return table;
        }
        return [];
    }

    /**
     * 纯文本解析入口。
     * 返回 { rows, stats }；stats = { lines, valid, dupes, blanks, errors[] }
     */
    function parseText(text, opts) {
        opts = opts || {};
        var stats = { lines: 0, valid: 0, dupes: 0, blanks: 0, errors: [] };
        var rows = [];

        var trimmed = String(text || '').replace(/^\uFEFF/, '').trim();
        if (!trimmed) {
            return { rows: rows, stats: stats };
        }

        /* JSON 优先 */
        if (trimmed.charAt(0) === '[' || trimmed.charAt(0) === '{') {
            try {
                var json = JSON.parse(trimmed);
                rows = tableToRows(jsonToTable(json), opts, stats);
            } catch (err) {
                stats.errors.push('JSON 解析失败：' + err.message);
            }
        } else {
            var lines = trimmed.split(/\r\n|\r|\n/);
            while (lines.length && !lines[lines.length - 1].trim()) { lines.pop(); }
            stats.lines = lines.length;

            var delim = detectDelimiter(lines);
            var table = [];
            for (var i = 0; i < lines.length; i++) {
                if (!lines[i].trim()) { continue; }
                table.push(delim ? splitLine(lines[i], delim) : [lines[i]]);
            }
            rows = tableToRows(table, opts, stats);
        }

        stats.valid = rows.length;
        return { rows: rows, stats: stats };
    }

    /* ============ 文件解码 ============ */

    function decodeBuffer(buffer) {
        var bytes = new Uint8Array(buffer);
        /* UTF-8 BOM */
        if (bytes[0] === 0xEF && bytes[1] === 0xBB && bytes[2] === 0xBF) {
            return new TextDecoder('utf-8').decode(bytes.subarray(3));
        }
        /* UTF-16 LE BOM */
        if (bytes[0] === 0xFF && bytes[1] === 0xFE) {
            return new TextDecoder('utf-16le').decode(bytes.subarray(2));
        }
        /* 严格 UTF-8 失败 → GBK / GB18030（Excel 导出的中文 CSV 常见） */
        try {
            return new TextDecoder('utf-8', { fatal: true }).decode(bytes);
        } catch (err) {
            try { return new TextDecoder('gb18030').decode(bytes); }
            catch (err2) { return new TextDecoder('gbk').decode(bytes); }
        }
    }

    /* ============ 弹窗 UI ============ */

    function esc(s) {
        return String(s === undefined || s === null ? '' : s)
            .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }

    function chip(label, n, tone) {
        if (!n) { return ''; }
        return '<span class="etimp-chip' + (tone ? ' etimp-chip--' + tone : '') + '">' + esc(label) + ' ' + n + '</span>';
    }

    function renderResult(container, result, opts) {
        var rows = result.rows;
        var stats = result.stats;
        var html = '';

        if (!stats.lines && !rows.length && !stats.errors.length) {
            container.innerHTML = '<div class="etimp-empty">输入内容后这里会显示解析结果</div>';
            return;
        }

        html += '<div class="etimp-stats">';
        html += chip('有效', rows.length, rows.length ? 'ok' : '');
        if (stats.dupes) { html += chip('去重', stats.dupes, 'warn'); }
        if (stats.blanks) { html += chip('空行/表头', stats.blanks, ''); }
        html += '</div>';

        if (rows.length) {
            html += '<div class="etimp-table-wrap"><table class="etimp-table"><thead><tr>';
            html += '<th>#</th><th>姓名</th>';
            if (opts.id) { html += '<th>学号</th>'; }
            if (opts.weight) { html += '<th>权重</th>'; }
            html += '</tr></thead><tbody>';
            var previewMax = Math.min(rows.length, 10);
            for (var i = 0; i < previewMax; i++) {
                html += '<tr><td class="etimp-dim">' + (i + 1) + '</td><td>' + esc(rows[i].name) + '</td>';
                if (opts.id) { html += '<td class="etimp-dim">' + esc(rows[i].id || '—') + '</td>'; }
                if (opts.weight) { html += '<td class="etimp-num">' + rows[i].weight + '</td>'; }
                html += '</tr>';
            }
            html += '</tbody></table></div>';
            if (rows.length > previewMax) {
                html += '<div class="etimp-empty" style="margin-top:8px;border:none;padding:6px">… 共 ' + rows.length + ' 条，仅预览前 ' + previewMax + ' 条</div>';
            }
        } else if (!stats.errors.length) {
            html += '<div class="etimp-empty">未解析出有效数据</div>';
        }

        if (stats.errors.length) {
            html += '<div class="etimp-errors"><b>' + stats.errors.length + ' 处问题：</b><br>' +
                stats.errors.slice(0, 20).map(esc).join('<br>') +
                (stats.errors.length > 20 ? '<br>… 还有 ' + (stats.errors.length - 20) + ' 条' : '') + '</div>';
        }

        container.innerHTML = html;
    }

    function open(options) {
        var opt = options || {};
        var toolId = opt.toolId || 'unknown-tool';
        var opts = {
            weight: (opt.columns || ['name', 'weight']).indexOf('weight') !== -1,
            id: (opt.columns || []).indexOf('id') !== -1,
            dedupe: true
        };

        var Chrome = global.ET && global.ET.Chrome;
        if (!Chrome || !Chrome.modal) {
            if (opt.onConfirm) { opt.onConfirm([], { cancelled: true }); }
            return null;
        }

        var root = document.createElement('div');
        root.innerHTML =
            '<div class="etimp-tabs">' +
            '<button type="button" class="etimp-tab is-active" data-tab="paste"><b>粘贴文本</b></button>' +
            '<button type="button" class="etimp-tab" data-tab="file">打开文件</button>' +
            '</div>' +
            '<div data-panel="paste">' +
            '<textarea class="etimp-textarea" id="etimp-text" placeholder="' +
            '一行一个人，支持粘贴 Excel 表格、逗号/Tab 分隔文本，例如：\n张三\n李四,2\n1,王五,3">' +
            '</textarea>' +
            '<div class="etimp-help">支持 <b>纯姓名</b>（一行一个）、<b>姓名,权重</b>、<b>学号,姓名,权重</b>，' +
            '也支持带表头的 CSV（姓名 / 学号 / 权重 列自动识别）与 JSON 数组。' +
            (opts.weight ? '权重越大被抽中概率越高，默认 1。' : '') + '</div>' +
            '</div>' +
            '<div data-panel="file" hidden>' +
            '<div class="etimp-drop" id="etimp-drop" tabindex="0">' +
            '<span class="et-drop-icon"></span>' +
            '<span class="etimp-drop__main">点击选择或拖入文件</span>' +
            '<span class="etimp-drop__hint">支持 .csv / .txt / .json，自动识别 UTF-8 与 GBK 编码</span>' +
            '<input type="file" class="etimp-file" id="etimp-file" accept=".csv,.txt,.tsv,.json,text/csv,text/plain,application/json">' +
            '</div>' +
            '<div class="etimp-help">Excel 请先另存为 <b>CSV</b> 再导入（文件 → 另存为 → CSV）。</div>' +
            '</div>' +
            '<div class="etimp-result" id="etimp-result"><div class="etimp-empty">输入内容后这里会显示解析结果</div></div>';

        var body = root.firstChild ? root : root;
        /* root 本身作为容器 */
        var wrap = document.createElement('div');
        while (root.firstChild) { wrap.appendChild(root.firstChild); }

        var modal = global.ET.Chrome.modal({
            title: opt.title || '导入数据',
            icon: 'i-upload',
            size: 'wide',
            body: wrap,
            buttons: [
                { label: '取消' },
                {
                    label: '导入',
                    primary: true,
                    onClick: function (close) {
                        if (!lastResult || !lastResult.rows.length) { return; }
                        close();
                        if (opt.onConfirm) {
                            opt.onConfirm(lastResult.rows, {
                                dupes: lastResult.stats.dupes,
                                dedupe: opts.dedupe
                            });
                        }
                    }
                }
            ]
        });

        var q = function (sel) { return wrap.querySelector(sel); };
        var textEl = q('#etimp-text');
        var resultEl = q('#etimp-result');
        var importBtn = modal.foot.querySelector('.et-btn--primary');
        var lastResult = null;

        if (opt.current) { textEl.value = opt.current; }

        function refresh() {
            var text = textEl.value;
            lastResult = parseText(text, opts);
            renderResult(resultEl, lastResult, opts);
            importBtn.disabled = !lastResult.rows.length;
            if (lastResult.rows.length) {
                importBtn.textContent = '导入 ' + lastResult.rows.length + ' 条';
            } else {
                importBtn.textContent = '导入';
            }
        }

        var timer = 0;
        textEl.addEventListener('input', function () {
            clearTimeout(timer);
            timer = setTimeout(refresh, 250);
        });

        /* 页签切换 */
        wrap.querySelectorAll('.etimp-tab').forEach(function (tab) {
            tab.addEventListener('click', function () {
                wrap.querySelectorAll('.etimp-tab').forEach(function (t) { t.classList.remove('is-active'); });
                tab.classList.add('is-active');
                var name = tab.getAttribute('data-tab');
                q('[data-panel="paste"]').hidden = name !== 'paste';
                q('[data-panel="file"]').hidden = name !== 'file';
            });
        });

        /* 文件区 */
        var drop = q('#etimp-drop');
        var fileInput = q('#etimp-file');

        var dropIconHost = drop.querySelector('.et-drop-icon');
        var NS_SVG = 'http://www.w3.org/2000/svg'; /* et-allow-external SVG 命名空间 */
        var dropSvg = document.createElementNS(NS_SVG, 'svg');
        dropSvg.setAttribute('class', 'et-icon');
        var dropUse = document.createElementNS(NS_SVG, 'use');
        dropUse.setAttribute('href', '#i-upload');
        dropSvg.appendChild(dropUse);
        dropIconHost.appendChild(dropSvg);

        drop.addEventListener('click', function () { fileInput.click(); });
        drop.addEventListener('keydown', function (ev) {
            if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); fileInput.click(); }
        });
        ['dragenter', 'dragover'].forEach(function (evName) {
            drop.addEventListener(evName, function (ev) {
                ev.preventDefault();
                drop.classList.add('is-over');
            });
        });
        ['dragleave', 'drop'].forEach(function (evName) {
            drop.addEventListener(evName, function (ev) {
                ev.preventDefault();
                drop.classList.remove('is-over');
            });
        });
        drop.addEventListener('drop', function (ev) {
            var files = ev.dataTransfer && ev.dataTransfer.files;
            if (files && files.length) { readFile(files[0]); }
        });
        fileInput.addEventListener('change', function () {
            if (fileInput.files && fileInput.files.length) { readFile(fileInput.files[0]); }
        });

        function readFile(file) {
            var reader = new FileReader();
            reader.onload = function () {
                var text = decodeBuffer(reader.result);
                var isJson = /\.json$/i.test(file.name) ||
                    (text.charAt(0) !== '\n' && (text.charAt(0) === '['));
                if (isJson) {
                    try {
                        JSON.parse(text.trim()); /* 校验合法性，错误交给 parseText 报 */
                    } catch (err) { /* parseText 会再次报错 */ }
                }
                textEl.value = text;
                /* 切回粘贴页让用户可见内容 */
                wrap.querySelectorAll('.etimp-tab').forEach(function (t) {
                    t.classList.toggle('is-active', t.getAttribute('data-tab') === 'paste');
                });
                q('[data-panel="paste"]').hidden = false;
                q('[data-panel="file"]').hidden = true;
                refresh();
                global.ET.Chrome.toast('已读取 ' + file.name, 'ok');
            };
            reader.onerror = function () {
                global.ET.Chrome.toast('文件读取失败', 'err');
            };
            reader.readAsArrayBuffer(file);
        }

        refresh();
        setTimeout(function () { textEl.focus(); }, 60);

        return modal;
    }

    global.ET = global.ET || {};
    global.ET.Import = { open: open, parseText: parseText, decodeBuffer: decodeBuffer };
})(window);
</script>

<script>
  /* 此块由 scripts/sync_shared.py 自动注入，请勿手工修改 */
/*!
 * et-stats.js — 使用统计模块（模块化，可整体移除）
 *
 * 共享逻辑源。改这里，然后跑：python scripts/sync_shared.py
 * 依赖：无（可脱离 et-util / et-chrome 独立运行）。
 * 全局：ET.Stats
 *
 * ┌────────────────────────────────────────────────────────────────┐
 * │ 说明：本模块只做一件事——工具被打开时向上报端点发一条匿名计数。 │
 * │ · 在线（iframe 内）：宿主页面已服务端计数，本模块不重复上报。   │
 * │ · 离线打开（file:// / 下载单文件 / 离线包）：联网条件具备时，   │
 * │   以 sendBeacon 上报 use_offline 事件（text/plain 免预检）。    │
 * │ · 上报端点 = window.ET_SITE_ORIGIN（由宿主注入或离线包配置）。  │
 * │   未配置端点时本模块完全静默，不发任何请求。                    │
 * │ · **整个 <script> 块可安全删除**：删除后工具其余功能完全正常，  │
 * │   且完全不再发起任何网络请求。                                  │
 * └────────────────────────────────────────────────────────────────┘
 */
(function (global) {
    'use strict';

    var ET = global.ET = global.ET || {};

    var Stats = {
        /** 上报端点来源（站点绝对地址，无协议尾斜杠） */
        endpoint: (typeof global.ET_SITE_ORIGIN === 'string' && /^https?:\/\//.test(global.ET_SITE_ORIGIN))
            ? global.ET_SITE_ORIGIN
            : null,

        _done: {},

        /**
         * 上报一次事件（同一事件同一工具每次页面加载只报一次）。
         * event: 'use_offline' 等；toolId: 工具 id。
         */
        send: function (event, toolId) {
            if (!event || this._done[event + ':' + (toolId || '')]) { return false; }
            if (!this.endpoint) { return false; }
            /* iframe 内由宿主统计，避免双计 */
            try {
                if (global.parent && global.parent !== global) { return false; }
            } catch (err) { return false; }
            /* 断网时挂起，网络恢复自动补报一次 */
            if (global.navigator && global.navigator.onLine === false) {
                var self = this;
                global.addEventListener('online', function () { self.send(event, toolId); }, { once: true });
                return false;
            }

            this._done[event + ':' + (toolId || '')] = true;
            var payload = JSON.stringify({ event: event, tool: toolId || '' });

            try {
                if (global.navigator.sendBeacon) {
                    return global.navigator.sendBeacon(
                        this.endpoint + '/api/track',
                        new Blob([payload], { type: 'text/plain;charset=UTF-8' })
                    );
                }
                global.fetch(this.endpoint + '/api/track', {
                    method: 'POST',
                    body: payload,
                    keepalive: true,
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'text/plain;charset=UTF-8' }
                });
                return true;
            } catch (err) {
                return false;
            }
        }
    };

    ET.Stats = Stats;
})(window);
</script>

        btnPlay: document.getElementById('btnPlay'),
        btnPlayText: document.getElementById('btnPlayText'),
        btnNext: document.getElementById('btnNext'),
        hint: document.getElementById('hint')
    };

    function save() {
        store.set('words', state.words);
        store.set('show_text', state.showText);
        store.set('repeat', state.repeat);
        store.set('gap', state.gap);
        store.set('rate', state.rate);
    }

    /* ============ 语音 ============ */

    function pickVoice() {
        if (!TTS_OK) { return; }
        var list = [];
        try { list = window.speechSynthesis.getVoices() || []; } catch (e) { list = []; }
        var best = null;
        for (var i = 0; i < list.length; i++) {
            var v = list[i];
            var tag = String(v.lang || '') + ' ' + String(v.name || '');
            if (/zh[-_]?CN|Chinese|中文|普通话/i.test(tag)) {
                if (!best || /zh[-_]?CN/i.test(String(v.lang))) { best = v; }
                if (/zh[-_]?CN/i.test(String(v.lang))) { break; }
            }
        }
        voice = best;
    }

    function speak(text) {
        if (!TTS_OK || !text) { return; }
        try {
            window.speechSynthesis.cancel();
        } catch (e) { /* 忽略 */ }

        var u = new window.SpeechSynthesisUtterance(text);
        u.lang = voice ? String(voice.lang || 'zh-CN') : 'zh-CN';
        if (voice) { u.voice = voice; }
        u.rate = state.rate;
        u.pitch = 1;
        try { window.speechSynthesis.speak(u); } catch (e) { /* 忽略 */ }
    }

    function stopSpeaking() {
        if (!TTS_OK) { return; }
        try { window.speechSynthesis.cancel(); } catch (e) { /* 忽略 */ }
    }

    /* ============ 渲染 ============ */

    function currentWord() {
        return state.words[state.index] || '';
    }

    function renderWord() {
        var word = currentWord();
        els.wordBox.className = 'dh-word';

        if (!word) {
            els.wordBox.classList.add('is-placeholder');
            els.wordBox.textContent = state.words.length ? '—' : '请先设置词表';
            return;
        }

        if (state.showText) {
            els.wordBox.textContent = word;
            return;
        }

        // 隐藏文字：用 ○ 表示字数，给一点书写位置提示
        els.wordBox.classList.add('is-hidden');
        var marks = [];
        for (var i = 0; i < word.length; i++) { marks.push('○'); }
        els.wordBox.textContent = marks.join(' ');
    }

    function renderProgress() {
        var total = state.words.length;
        els.idxTotal.textContent = String(total);
        els.idxNow.textContent = String(total ? Math.min(state.index + 1, total) : 0);
        var pct = total ? Math.round((state.index + 1) / total * 100) : 0;
        els.progressFill.style.width = pct + '%';
        els.stateText.textContent = state.playing ? '听写中…' : (total ? '就绪' : '无词表');
        els.btnPlayText.textContent = state.playing ? '暂停' : (state.index > 0 ? '继续听写' : '开始听写');
    }

    function render() {
        renderWord();
        renderProgress();
    }

    /* ============ 播放控制 ============ */

    function clearTimers() {
        for (var i = 0; i < timers.length; i++) { clearTimeout(timers[i]); }
        timers = [];
    }

    function later(fn, ms) {
        timers.push(setTimeout(fn, ms));
    }

    function speakCurrent(announce) {
        var word = currentWord();
        if (!word) { return; }
        if (!TTS_OK) {
            if (announce) { chrome.toast('本机浏览器不支持语音朗读', 'warn'); }
            return;
        }
        speak(word);
    }

    /** 报当前词 repeat 遍，然后等 gap 秒进入下一词（若在播放态） */
    function reportWord() {
        var word = currentWord();
        if (!word) { pause(); return; }

        for (var i = 0; i < state.repeat; i++) {
            (function (round) {
                later(function () {
                    if (!state.playing) { return; }
                    speak(word);
                    if (round === state.repeat - 1 && state.repeat > 1) {
                        // 末遍之后留一点余量再进入等待
                    }
                }, round * 1800);
            })(i);
        }

        chrome.beep('tick');
        var waitMs = state.repeat * 1800 + state.gap * 1000;
        later(function () {
            if (!state.playing) { return; }
            if (state.index >= state.words.length - 1) {
                finish();
                return;
            }
            state.index++;
            render();
            reportWord();
        }, waitMs);
    }

    function play() {
        if (!state.words.length) {
            chrome.toast('先在设置里添加词表', 'warn');
            chrome.beep('err');
            return;
        }
        if (state.index >= state.words.length) { state.index = 0; }
        state.playing = true;
        render();
        chrome.setStatus('听写中 · 第 ' + (state.index + 1) + ' / ' + state.words.length + ' 个');
        if (!TTS_OK) {
            chrome.toast('本浏览器不支持语音朗读，已改为「只显示词语」模式', 'warn');
            state.showText = true;
            save();
            render();
        }
        clearTimers();
        reportWord();
    }

    function pause() {
        state.playing = false;
        clearTimers();
        stopSpeaking();
        render();
        chrome.setStatus('已暂停');
    }

    function finish() {
        state.playing = false;
        clearTimers();
        stopSpeaking();
        render();
        chrome.beep('win');
        chrome.toast('听写结束，共 ' + state.words.length + ' 个词');
        chrome.setStatus('听写结束');
    }

    function next(manual) {
        if (!state.words.length) { return; }
        if (state.index < state.words.length - 1) {
            state.index++;
        } else if (!manual) {
            finish();
            return;
        }
        render();
        if (state.playing) {
            clearTimers();
            reportWord();
        } else {
            speakCurrent(false);
        }
    }

    function prev() {
        if (!state.words.length) { return; }
        if (state.index > 0) { state.index--; }
        render();
        if (state.playing) {
            clearTimers();
            reportWord();
        } else {
            speakCurrent(false);
        }
    }

    /* ============ 词表 ============ */

    function splitWords(text) {
        var out = [];
        var lines = String(text || '').split(/\r\n|\r|\n/);
        for (var i = 0; i < lines.length; i++) {
            var v = lines[i].replace(/^\uFEFF/, '').trim();
            if (v) { out.push(v); }
        }
        return out;
    }

    function setWords(words, silent) {
        state.words = words;
        state.index = 0;
        state.playing = false;
        clearTimers();
        stopSpeaking();
        save();
        render();
        if (!silent) {
            chrome.toast('词表已更新：' + words.length + ' 个词', 'ok');
        }
    }

    function openImport() {
        if (!ET.Import || typeof ET.Import.open !== 'function') {
            chrome.toast('导入组件不可用，请直接在设置里粘贴', 'warn');
            return;
        }
        ET.Import.open({
            toolId: TOOL_ID,
            title: '导入听写词表',
            columns: ['name'],
            current: state.words.join('\n'),
            onConfirm: function (rows, meta) {
                var words = [];
                for (var i = 0; i < rows.length; i++) {
                    var v = String(rows[i].name == null ? '' : rows[i].name).trim();
                    if (v) { words.push(v); }
                }
                if (!words.length) { return; }
                setWords(words);
                if (meta && meta.dupes) {
                    chrome.toast('已自动去重 ' + meta.dupes + ' 个重复词');
                }
            }
        });
    }

    /* ============ 设置抽屉 ============ */

    function buildSettings(body) {
        function heading(text) {
            var h = document.createElement('h4');
            h.textContent = text;
            body.appendChild(h);
        }

        function row() {
            var d = document.createElement('div');
            d.className = 'et-drawer__row';
            body.appendChild(d);
            return d;
        }

        heading('词表（一行一个词）');
        var area = document.createElement('textarea');
        area.className = 'dh-ta';
        area.spellcheck = false;
        area.value = state.words.join('\n');
        area.addEventListener('input', function () {
            state.words = splitWords(area.value);
            state.index = 0;
            save();
            render();
        });
        body.appendChild(area);

        var ops = row();
        var importBtn = document.createElement('button');
        importBtn.type = 'button';
        importBtn.className = 'et-btn et-btn--primary';
        importBtn.style.flex = '1 1 40%';
        importBtn.innerHTML = '<svg class="et-icon"><use href="#i-upload"></use></svg>导入文本 / CSV';
        importBtn.addEventListener('click', openImport);
        ops.appendChild(importBtn);

        var clearBtn = document.createElement('button');
        clearBtn.type = 'button';
        clearBtn.className = 'et-btn';
        clearBtn.style.flex = '1 1 40%';
        clearBtn.innerHTML = '<svg class="et-icon"><use href="#i-trash"></use></svg>清空词表';
        clearBtn.addEventListener('click', function () {
            area.value = '';
            setWords([], true);
            render();
            chrome.toast('词表已清空');
        });
        ops.appendChild(clearBtn);

        heading('显示');
        var showRow = row();
        showRow.innerHTML = '<label style="display:flex;align-items:center;gap:6px;font-size:13.5px;font-weight:600">' +
            '<input type="checkbox" id="dhShow"> 显示文字（关闭时只显示 ○ 个数）</label>';
        var showBox = showRow.querySelector('#dhShow');
        showBox.checked = state.showText;
        showBox.addEventListener('change', function () {
            state.showText = showBox.checked;
            save();
            render();
        });

        heading('朗读遍数 / 间隔 / 语速');
        var repeatRow = row();
        var repeatInput = document.createElement('input');
        repeatInput.className = 'dh-num';
        repeatInput.type = 'number';
        repeatInput.min = '1';
        repeatInput.max = '3';
        repeatInput.value = String(state.repeat);
        repeatInput.title = '每个词朗读几遍';
        repeatInput.addEventListener('change', function () {
            state.repeat = clampNum(repeatInput.value, 1, 3, state.repeat);
            repeatInput.value = String(state.repeat);
            save();
        });
        repeatRow.appendChild(document.createTextNode('朗读遍数 '));
        repeatRow.appendChild(repeatInput);

        var gapInput = document.createElement('input');
        gapInput.className = 'dh-num';
        gapInput.type = 'number';
        gapInput.min = '2';
        gapInput.max = '30';
        gapInput.value = String(state.gap);
        gapInput.title = '两个词之间留出的书写时间（秒）';
        gapInput.addEventListener('change', function () {
            state.gap = clampNum(gapInput.value, 2, 30, state.gap);
            gapInput.value = String(state.gap);
            save();
        });
        repeatRow.appendChild(document.createTextNode('　书写间隔 '));
        repeatRow.appendChild(gapInput);
        repeatRow.appendChild(document.createTextNode(' 秒'));

        var rateRow = row();
        rateRow.appendChild(document.createTextNode('语速 '));
        var slider = document.createElement('input');
        slider.className = 'dh-slider';
        slider.type = 'range';
        slider.min = '0.5';
        slider.max = '1.5';
        slider.step = '0.05';
        slider.value = String(state.rate);
        var rateText = document.createElement('span');
        rateText.style.fontSize = '13px';
        rateText.style.fontWeight = '700';
        rateText.textContent = state.rate.toFixed(2) + '×';
        slider.addEventListener('input', function () {
            state.rate = clampNum(slider.value, 0.5, 1.5, state.rate);
            rateText.textContent = state.rate.toFixed(2) + '×';
            save();
        });
        rateRow.appendChild(slider);
        rateRow.appendChild(rateText);

        var tip = document.createElement('p');
        tip.className = 'et-drawer__tip';
        tip.innerHTML = '间隔秒数 = 报完这个词后留给你书写的时间。'
            + '<br>朗读用浏览器自带中文语音，语速 0.8–0.9 左右最接近课堂语速。'
            + '<br>词表与设置保存在本机浏览器，完全离线，不上传。';
        body.appendChild(tip);
    }

    /* ============ 事件 ============ */

    els.btnPlay.addEventListener('click', function () {
        if (state.playing) { pause(); } else { play(); }
    });
    els.btnNext.addEventListener('click', function () { next(true); });
    els.btnPrev.addEventListener('click', prev);
    els.btnRepeat.addEventListener('click', function () {
        if (state.playing) {
            clearTimers();
            reportWord();
        } else {
            speakCurrent(true);
        }
        chrome.beep('ok');
    });

    document.addEventListener('keydown', function (ev) {
        if (ev.code !== 'Space' && ev.key !== ' ') { return; }
        var node = document.activeElement;
        var tag = node && node.tagName ? node.tagName.toUpperCase() : '';
        if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT' || (node && node.isContentEditable)) { return; }
        if (document.querySelector('.et-modal, .et-drawer-backdrop')) { return; }
        ev.preventDefault();
        els.btnPlay.click();
    });

    /* 页面隐藏时停止朗读，避免切页后还在念 */
    document.addEventListener('visibilitychange', function () {
        if (document.hidden) { stopSpeaking(); }
    });

    /* ============ 启动 ============ */

    if (!TTS_OK) {
        var warn = document.createElement('p');
        warn.className = 'dh-tip-warn';
        warn.textContent = '当前浏览器不支持语音朗读（或已禁用），已切换为「只显示词语」模式：屏幕会直接显示词语，由你口头报词。';
        els.ttsWarn.appendChild(warn);
        els.ttsWarn.hidden = false;
        state.showText = true;
    } else {
        pickVoice();
        if (typeof window.speechSynthesis.addEventListener === 'function') {
            window.speechSynthesis.addEventListener('voiceschanged', pickVoice);
        } else {
            window.speechSynthesis.onvoiceschanged = pickVoice;
        }
    }

    render();
    if (!state.words.length) {
        els.hint.textContent = '词表为空：点右上角 ⚙ 添加词表，或点「导入文本 / CSV」快速导入。';
    }
})();
</script>

</body>
</html>
