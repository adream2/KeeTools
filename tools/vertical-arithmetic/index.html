/* ============ 设计令牌 ============ */
:root {
    --et-accent: #2563eb;
    --et-accent-weak: rgba(37, 99, 235, .14);
    --et-bg: #f4f6fb;
    --et-surface: #ffffff;
    --et-surface-2: #f8fafc;
    --et-fg: #0b1220;
    --et-muted: #64748b;
    --et-line: rgba(15, 23, 42, .12);
    --et-line-strong: rgba(15, 23, 42, .22);
    --et-glass: rgba(255, 255, 255, .85);
    --et-shadow-md: 0 10px 28px -18px rgba(15, 23, 42, .3);
    --et-shadow-lg: 0 24px 60px -32px rgba(15, 23, 42, .4);
    --et-ok: #059669;
    --et-warn: #d97706;
    --et-err: #dc2626;
    --et-radius: 12px;
    --et-radius-sm: 9px;
    --et-font: -apple-system, BlinkMacSystemFont, "Segoe UI",
               "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei",
               "Noto Sans SC", sans-serif;
    --et-mono: ui-monospace, "Cascadia Mono", Consolas, Menlo, monospace;
}

html[data-et-theme="dark"] {
    --et-bg: #0b1120;
    --et-surface: #111a2e;
    --et-surface-2: #0f1729;
    --et-fg: #f1f5f9;
    --et-muted: #94a3b8;
    --et-line: rgba(148, 163, 184, .18);
    --et-line-strong: rgba(148, 163, 184, .3);
    --et-glass: rgba(17, 26, 46, .85);
    --et-shadow-md: 0 10px 34px -18px rgba(0, 0, 0, .8);
    --et-shadow-lg: 0 24px 70px -30px rgba(0, 0, 0, .9);
    --et-ok: #34d399;
    --et-warn: #fbbf24;
    --et-err: #f87171;
}

/* ============ 基础 ============ */

/* body 作为外壳时必须清掉浏览器默认 8px 外边距，
   否则 iframe 预览中文档会比视口高 16px（底部白边 + 多余滚动） */
body.et-app {
    margin: 0;
}

.et-app {
    position: relative;
    isolation: isolate;
    display: flex;
    flex-direction: column;
    height: 100vh;
    height: 100dvh;
    overflow: hidden;
    background: var(--et-bg);
    color: var(--et-fg);
    font-family: var(--et-font);
    -webkit-font-smoothing: antialiased;
    transition: background .25s, color .25s;
}

/* 极光背景：径向渐变 + 呼吸动画（edupick 品质基线，老内核也不掉帧） */
.et-app::before {
    content: '';
    position: fixed;
    inset: 0;
    z-index: -1;
    pointer-events: none;
    background:
        radial-gradient(46% 40% at 20% 18%, var(--et-accent-weak), transparent 65%),
        radial-gradient(42% 38% at 82% 24%, var(--et-accent-weak), transparent 70%),
        radial-gradient(50% 44% at 55% 95%, rgba(16, 185, 129, .10), transparent 65%);
    animation: et-aurora 16s ease-in-out infinite alternate;
}

@keyframes et-aurora {
    from { opacity: .55; transform: scale(1); }
    to { opacity: 1; transform: scale(1.06); }
}

.et-app *,
.et-app *::before,
.et-app *::after { box-sizing: border-box; }

[hidden] { display: none !important; }

.et-icon {
    width: 18px;
    height: 18px;
    fill: none;
    stroke: currentColor;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
    flex: none;
}

/* ============ 顶栏 ============ */
.et-topbar {
    flex: none;
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 11px 20px;
    border-bottom: 1px solid var(--et-line);
    background: var(--et-glass);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    z-index: 20;
}

.et-brand {
    display: flex;
    align-items: center;
    gap: 10px;
    min-width: 0;
}

.et-brand__dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: var(--et-accent);
    box-shadow: 0 0 0 4px var(--et-accent-weak);
    flex: none;
}

.et-brand__name {
    font-weight: 800;
    font-size: 15px;
    letter-spacing: -.01em;
    white-space: nowrap;
}

.et-brand__sub {
    font-size: 12.5px;
    color: var(--et-muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.et-status {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 5px 14px;
    border-radius: 999px;
    font-size: 12.5px;
    color: var(--et-muted);
    background: var(--et-surface-2);
    border: 1px solid var(--et-line);
    white-space: nowrap;
    max-width: 42vw;
    overflow: hidden;
    text-overflow: ellipsis;
}

.et-status__dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--et-ok);
    flex: none;
    transition: background .2s;
}

.et-status[data-tone="err"] .et-status__dot { background: var(--et-err); }
.et-status[data-tone="warn"] .et-status__dot { background: var(--et-warn); }

.et-actions {
    display: flex;
    align-items: center;
    gap: 7px;
}

.et-icon-btn {
    display: inline-grid;
    place-items: center;
    width: 38px;
    height: 38px;
    font-size: 16px;
    line-height: 1;
    border-radius: 11px;
    border: 1px solid var(--et-line);
    background: var(--et-surface-2);
    color: var(--et-fg);
    cursor: pointer;
    transition: transform .14s, border-color .14s, color .14s, opacity .14s;
    -webkit-tap-highlight-color: transparent;
}

.et-icon-btn:hover {
    border-color: var(--et-accent);
    color: var(--et-accent);
    transform: translateY(-1px);
}

.et-icon-btn:active { transform: translateY(0); }
.et-icon-btn.is-off { opacity: .4; }
.et-icon-btn:focus-visible { outline: 2px solid var(--et-accent); outline-offset: 2px; }

/* ============ 主区默认 ============ */
.et-main {
    flex: 1;
    min-height: 0;
    position: relative;
    overflow: auto;
}

/* ============ 页脚（品牌回流 L2） ============ */
.et-footer {
    flex: none;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 7px 16px;
    font-size: 12px;
    color: var(--et-muted);
    border-top: 1px solid var(--et-line);
    background: var(--et-glass);
    user-select: none;
    z-index: 20;
}

.et-footer a {
    color: inherit;
    text-decoration: none;
    transition: color .14s;
}

.et-footer a:hover { color: var(--et-accent); }

/* ============ 按钮 ============ */
.et-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
    padding: 9px 16px;
    border-radius: 11px;
    font: inherit;
    font-size: 13.5px;
    font-weight: 700;
    border: 1px solid var(--et-line);
    background: var(--et-surface-2);
    color: var(--et-fg);
    cursor: pointer;
    transition: transform .14s, border-color .14s, color .14s, background .14s, box-shadow .14s;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
}

.et-btn:hover {
    border-color: var(--et-accent);
    color: var(--et-accent);
    transform: translateY(-1px);
}

.et-btn:active { transform: translateY(0); }
.et-btn:focus-visible { outline: 2px solid var(--et-accent); outline-offset: 2px; }
.et-btn:disabled { opacity: .45; cursor: not-allowed; transform: none; }

.et-btn--primary {
    background: var(--et-accent);
    border-color: var(--et-accent);
    color: #fff;
    box-shadow: 0 6px 18px -8px var(--et-accent);
}

.et-btn--primary:hover { color: #fff; filter: brightness(1.08); }
.et-btn--primary:disabled { filter: none; }

.et-btn--danger:hover {
    border-color: var(--et-err);
    color: var(--et-err);
}

.et-btn--lg {
    padding: 13px 26px;
    font-size: 16px;
    border-radius: 14px;
}

/* ============ 弹窗 ============ */
.et-modal {
    position: fixed;
    inset: 0;
    z-index: 100;
    display: grid;
    place-items: center;
    padding: 24px;
    background: rgba(2, 6, 23, .55);
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    animation: et-fade .18s ease;
}

.et-modal__panel {
    width: min(680px, 94vw);
    max-height: 86vh;
    max-height: 86dvh;
    display: flex;
    flex-direction: column;
    background: var(--et-surface);
    border: 1px solid var(--et-line);
    border-radius: 16px;
    box-shadow: var(--et-shadow-lg);
    animation: et-pop .2s cubic-bezier(.34, 1.4, .64, 1);
    overflow: hidden;
}

.et-modal__panel--narrow { width: min(460px, 92vw); }
.et-modal__panel--wide { width: min(900px, 94vw); }

.et-modal__head {
    flex: none;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 16px 20px;
    border-bottom: 1px solid var(--et-line);
    font-weight: 800;
    font-size: 15px;
}

.et-modal__head .et-icon-btn {
    margin-left: auto;
    width: 32px;
    height: 32px;
}

.et-modal__body {
    flex: 1;
    min-height: 0;
    overflow: auto;
    padding: 18px 20px;
}

.et-modal__foot {
    flex: none;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 14px 20px;
    border-top: 1px solid var(--et-line);
    background: var(--et-surface-2);
}

.et-modal__foot .spacer { flex: 1; }

@keyframes et-fade {
    from { opacity: 0; }
}

@keyframes et-pop {
    from { opacity: 0; transform: translateY(14px) scale(.97); }
}

/* ============ 轻提示（toast） ============ */
.et-toast {
    position: fixed;
    left: 50%;
    bottom: 56px;
    transform: translateX(-50%) translateY(10px);
    z-index: 120;
    display: flex;
    align-items: center;
    gap: 9px;
    max-width: min(520px, 88vw);
    padding: 11px 18px;
    border-radius: 12px;
    font-size: 13.5px;
    font-weight: 600;
    color: #fff;
    background: rgba(15, 23, 42, .92);
    border: 1px solid rgba(148, 163, 184, .25);
    box-shadow: var(--et-shadow-lg);
    opacity: 0;
    pointer-events: none;
    transition: opacity .22s, transform .22s;
}

.et-toast.is-show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
}

.et-toast[data-tone="ok"] { background: rgba(5, 150, 105, .95); }
.et-toast[data-tone="err"] { background: rgba(220, 38, 38, .95); }
.et-toast[data-tone="warn"] { background: rgba(217, 119, 6, .95); }

/* ============ 设置抽屉（右上角入口，edupick 交互） ============ */
.et-drawer-backdrop {
    position: fixed;
    inset: 0;
    z-index: 90;
    background: rgba(2, 6, 23, .45);
    backdrop-filter: blur(3px);
    -webkit-backdrop-filter: blur(3px);
    opacity: 0;
    transition: opacity .2s;
}

.et-drawer-backdrop.is-open { opacity: 1; }

.et-drawer {
    position: absolute;
    top: 0;
    right: 0;
    height: 100%;
    width: min(400px, 92vw);
    display: flex;
    flex-direction: column;
    background: var(--et-surface);
    border-left: 1px solid var(--et-line);
    box-shadow: var(--et-shadow-lg);
    transform: translateX(100%);
    transition: transform .22s cubic-bezier(.32, .72, .35, 1);
}

.et-drawer-backdrop.is-open .et-drawer { transform: translateX(0); }

.et-drawer__head {
    flex: none;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 15px 18px;
    border-bottom: 1px solid var(--et-line);
    font-weight: 800;
    font-size: 15px;
    color: var(--et-accent);
}

.et-drawer__head .et-icon-btn {
    margin-left: auto;
    width: 32px;
    height: 32px;
}

.et-drawer__body {
    flex: 1;
    min-height: 0;
    overflow: auto;
    padding: 16px 18px 24px;
}

/* 抽屉内容通用小节（工具复用） */
.et-drawer__body h4 {
    margin: 18px 0 8px;
    font-size: 12px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: .08em;
    color: var(--et-muted);
}

.et-drawer__body h4:first-child { margin-top: 0; }

.et-drawer__row {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
}

.et-drawer__tip {
    margin: 8px 0 0;
    font-size: 12px;
    line-height: 1.8;
    color: var(--et-muted);
}

.et-drawer__tip b { color: var(--et-fg); }

.et-drawer__input {
    flex: 1;
    min-width: 0;
    padding: 9px 12px;
    border: 1px solid var(--et-line-strong);
    border-radius: 9px;
    background: var(--et-surface-2);
    color: var(--et-fg);
    font: inherit;
    font-size: 13.5px;
    transition: border-color .14s, box-shadow .14s;
}

.et-drawer__input:focus {
    outline: none;
    border-color: var(--et-accent);
    box-shadow: 0 0 0 3px var(--et-accent-weak);
}

.et-drawer__switch {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 10px 0;
    border-bottom: 1px dashed var(--et-line);
    font-size: 13.5px;
    font-weight: 600;
    color: var(--et-fg);
    cursor: pointer;
    user-select: none;
}

.et-drawer__switch input {
    width: 17px;
    height: 17px;
    accent-color: var(--et-accent);
    cursor: pointer;
}
</style>

            if (backdrop.parentNode) { backdrop.parentNode.removeChild(backdrop); }
            document.removeEventListener('keydown', onKey);
            if (mo.onClose) { mo.onClose(); }
        }

<script>
  /* 此块由 scripts/sync_shared.py 自动注入，请勿手工修改 */
/*!
 * et-stats.js — 使用统计模块（模块化，可整体移除）
 *
 * 共享逻辑源。改这里，然后跑：python scripts/sync_shared.py
 * 依赖：无（可脱离 et-util / et-chrome 独立运行）。
 * 全局：ET.Stats
 *
 * ┌────────────────────────────────────────────────────────────────┐
 * │ 说明：本模块只做一件事——工具被打开时向上报端点发一条匿名计数。 │
 * │ · 在线（iframe 内）：宿主页面已服务端计数，本模块不重复上报。   │
 * │ · 离线打开（file:// / 下载单文件 / 离线包）：联网条件具备时，   │
 * │   以 sendBeacon 上报 use_offline 事件（text/plain 免预检）。    │
 * │ · 上报端点 = window.ET_SITE_ORIGIN（由宿主注入或离线包配置）。  │
 * │   未配置端点时本模块完全静默，不发任何请求。                    │
 * │ · **整个 <script> 块可安全删除**：删除后工具其余功能完全正常，  │
 * │   且完全不再发起任何网络请求。                                  │
 * └────────────────────────────────────────────────────────────────┘
 */
(function (global) {
    'use strict';

    var ET = global.ET = global.ET || {};

    var Stats = {
        /** 上报端点来源（站点绝对地址，无协议尾斜杠） */
        endpoint: (typeof global.ET_SITE_ORIGIN === 'string' && /^https?:\/\//.test(global.ET_SITE_ORIGIN))
            ? global.ET_SITE_ORIGIN
            : null,

        _done: {},

        /**
         * 上报一次事件（同一事件同一工具每次页面加载只报一次）。
         * event: 'use_offline' 等；toolId: 工具 id。
         */
        send: function (event, toolId) {
            if (!event || this._done[event + ':' + (toolId || '')]) { return false; }
            if (!this.endpoint) { return false; }
            /* iframe 内由宿主统计，避免双计 */
            try {
                if (global.parent && global.parent !== global) { return false; }
            } catch (err) { return false; }
            /* 断网时挂起，网络恢复自动补报一次 */
            if (global.navigator && global.navigator.onLine === false) {
                var self = this;
                global.addEventListener('online', function () { self.send(event, toolId); }, { once: true });
                return false;
            }

            this._done[event + ':' + (toolId || '')] = true;
            var payload = JSON.stringify({ event: event, tool: toolId || '' });

            try {
                if (global.navigator.sendBeacon) {
                    return global.navigator.sendBeacon(
                        this.endpoint + '/api/track',
                        new Blob([payload], { type: 'text/plain;charset=UTF-8' })
                    );
                }
                global.fetch(this.endpoint + '/api/track', {
                    method: 'POST',
                    body: payload,
                    keepalive: true,
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'text/plain;charset=UTF-8' }
                });
                return true;
            } catch (err) {
                return false;
            }
        }
    };

    ET.Stats = Stats;
})(window);
</script>

<script>
(function () {
    'use strict';

    var TOOL_ID = 'vertical-arithmetic';
    var store = ET.store(TOOL_ID);

    var chrome = ET.Chrome.mount({
        toolId: TOOL_ID,
        title: '竖式计算器',
        sub: '数学 · 竖式演算',
        accent: '#d97706',
        status: '就绪',
        sound: true,
        primary: stepOnce,
        settings: { title: '出题 / 设置', build: buildSettings },
        help: '<div style="font-size:13.5px;line-height:2">' +
            '<p style="margin:0 0 8px"><b>怎么用</b>：上方输入两个数、选择 + / − / ×，竖式自动排出；' +
            '点「单步」逐位演算（红色小字 = 进位，蓝色小字 = 借位），点「自动播放」连续演示。</p>' +
            '<p style="margin:0 0 8px"><b>乘法</b>：先逐层显示部分积，再把部分积相加（支持最多 4 位 × 2 位）。</p>' +
            '<p style="margin:0 0 8px"><b>出题</b>：按设置里的位数与乘法模式随机出题。</p>' +
            '<p style="margin:0"><b>快捷键</b>：空格 / 翻页笔下页键 = 单步。</p></div>'
    });

    var els = {
        inA: document.getElementById('inA'),
        inB: document.getElementById('inB'),
        opSym: document.getElementById('opSym'),
        answer: document.getElementById('answer'),
        ops: document.getElementById('ops'),
        board: document.getElementById('board'),
        stepText: document.getElementById('stepText'),
        hint: document.getElementById('hint'),
        btnStep: document.getElementById('btnStep'),
        btnAuto: document.getElementById('btnAuto'),
        btnNew: document.getElementById('btnNew')
    };

    var OP_CHIPS = [['add', '+'], ['sub', '−'], ['mul', '×']];
    var OP_NAME = { add: '加法', sub: '减法', mul: '乘法' };

    var state = {
        op: store.get('op', 'add'),
        a: '365',
        b: '278',
        steps: [],
        cursor: 0,
        answer: '',
        autoTimer: 0,
        maxDigits: store.get('maxDigits', 3),
        mulMode: store.get('mulMode', 'x1')   /* x1 = ×1位数, x2 = ×2位数 */
    };

    function isTypingTarget(node) {
        if (!node || !node.tagName) { return false; }
        var tag = node.tagName.toUpperCase();
        return tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT' || node.isContentEditable === true;
    }

    /* ---------- 步骤计算 ---------- */

    function digitsOf(s) {
        var out = [];
        for (var i = 0; i < s.length; i++) { out.push(s.charCodeAt(i) - 48); }
        return out;
    }

    /* 加法 / 减法：逐列（从右到左）生成步骤 */
    function buildAddSub(aStr, bStr, op) {
        var a = digitsOf(aStr);
        var b = digitsOf(bStr);
        var n = Math.max(a.length, b.length);
        var steps = [];
        var carry = 0;
        var result = [];

        for (var i = 0; i < n; i++) {
            var da = a[a.length - 1 - i] || 0;
            var db = b[b.length - 1 - i] || 0;
            var colName = ['个位', '十位', '百位', '千位', '万位', '十万位'][i] || ('第' + (i + 1) + '位');
            if (op === 'add') {
                var sum = da + db + carry;
                var digit = sum % 10;
                var cOut = Math.floor(sum / 10);
                var text = colName + '：<b>' + da + (carry ? ' + ' + carry : '') +
                    (db ? ' + ' + db : '') + ' = ' + sum + '</b>';
                if (cOut) { text += '，写 ' + digit + ' <b>进 ' + cOut + '</b>'; }
                else { text += '，写 ' + digit; }
                steps.push({
                    i: i, da: da, db: db, carryIn: carry, carryOut: cOut,
                    digit: digit, text: text
                });
                carry = cOut;
                result.unshift(String(digit));
            } else {
                var cur = da - carry;
                var needBorrow = cur < db;
                var borrow = needBorrow ? 1 : 0;
                var eff = cur + borrow * 10;
                var dgt = eff - db;
                var t = colName + '：<b>' + (carry ? da + ' − ' + carry + '（退位） = ' + cur : da);
                if (needBorrow) {
                    t += '不够减 ' + db + '，向高位借 1 当 10，<b>' + eff + ' − ' + db + ' = ' + dgt + '</b>';
                } else {
                    t += ' − ' + db + ' = <b>' + dgt + '</b>';
                }
                steps.push({
                    i: i, da: da, db: db, carryIn: carry, carryOut: borrow,
                    borrow: needBorrow, digit: dgt, text: t
                });
                carry = borrow;
                result.unshift(String(dgt));
            }
        }
        var res = result.join('').replace(/^0+(?=\d)/, '');
        if (op === 'add' && carry) {
            steps.push({
                i: n, carryIn: carry, carryOut: 0, digit: carry, isFinalCarry: true,
                text: '最高位再写 <b>' + carry + '</b>'
            });
            res = String(carry) + res;
        }
        return { steps: steps, answer: res === '' ? '0' : res };
    }

    /* 乘法：a × b（b 最多 2 位）→ 部分积 + 部分积求和步骤 */
    function buildMul(aStr, bStr) {
        var aNum = parseInt(aStr, 10);
        var bNum = parseInt(bStr, 10);
        var bd = digitsOf(bStr);
        var steps = [];
        var partials = [];

        for (var k = 0; k < bd.length; k++) {
            var bDigit = bd[bd.length - 1 - k];
            var val = aNum * bDigit;
            var shift = Math.pow(10, k);
            var name = k === 0 ? '个位' : '十位';
            partials.push({ val: val, shift: k, digit: bDigit });
            steps.push({
                type: 'partial', idx: k,
                text: '第' + '一二'[k] + '层部分积：' + aNum + ' × ' + bDigit + '（' + name + '）' +
                    ' = <b>' + (val * shift) + '</b>' + (k > 0 ? '（错位写，向左移 ' + k + ' 位）' : '')
            });
        }

        /* 部分积求和（复用列加法逻辑） */
        var padLen = 0;
        var pStrs = [];
        for (var p = 0; p < partials.length; p++) {
            var s = String(partials[p].val);
            for (var sh = 0; sh < partials[p].shift; sh++) { s += '0'; }
            pStrs.push(s);
            if (s.length > padLen) { padLen = s.length; }
        }
        var aligned = [];
        for (var q = 0; q < pStrs.length; q++) {
            while (pStrs[q].length < padLen) { pStrs[q] = '0' + pStrs[q]; }
            aligned.push(pStrs[q]);
        }
        var carry = 0;
        var result = [];
        for (var c = 0; c < padLen; c++) {
            var sum = carry;
            for (var r = 0; r < aligned.length; r++) {
                sum += aligned[r].charCodeAt(padLen - 1 - c) - 48;
            }
            var digit = sum % 10;
            var cOut = Math.floor(sum / 10);
            var colName = ['个位', '十位', '百位', '千位', '万位', '十万位'][c] || ('第' + (c + 1) + '位');
            var t = '把部分积相加 · ' + colName + '：<b>' + (carry ? carry + ' + ' : '') +
                aligned.map(function (s2) { return s2.charAt(padLen - 1 - c); }).join(' + ') +
                ' = ' + sum + '</b>' + (cOut ? '，写 ' + digit + ' <b>进 ' + cOut + '</b>' : '，写 ' + digit);
            steps.push({
                type: 'sum', i: c, carryIn: carry, carryOut: cOut,
                digit: digit, text: t
            });
            carry = cOut;
            result.unshift(String(digit));
        }
        var ans = result.join('').replace(/^0+(?=\d)/, '');
        if (carry) {
            steps.push({
                type: 'sum', i: padLen, carryIn: carry, carryOut: 0, digit: carry,
                isFinalCarry: true, text: '最高位再写 <b>' + carry + '</b>'
            });
            ans = String(carry) + ans;
        }
        return { steps: steps, answer: ans, partials: partials };
    }

    /* ---------- 计算 & 渲染 ---------- */

    function sanitize(s, maxLen) {
        s = String(s).replace(/\D/g, '').replace(/^0+(?=\d)/, '');
        return s.slice(0, maxLen);
    }

    function compute() {
        var a = sanitize(els.inA.value, state.op === 'mul' ? 4 : 4);
        var b = sanitize(els.inB.value, state.op === 'mul' ? 2 : 4);
        if (!a) { a = '0'; }
        if (!b) { b = '0'; }
        els.inA.value = a;
        els.inB.value = b;
        if (state.op === 'sub' && parseInt(a, 10) < parseInt(b, 10)) {
            var big = a;
            a = b;
            b = big;
            els.inA.value = a;
            els.inB.value = b;
            chrome.toast('减法竖式把大数放在上面');
        }
        state.a = a;
        state.b = b;

        var built;
        if (state.op === 'mul') {
            built = buildMul(a, b);
        } else {
            built = buildAddSub(a, b, state.op);
        }
        state.steps = built.steps;
        state.answer = built.answer;
        state.partials = built.partials || [];
        state.cursor = 0;
        stopAuto();
        els.answer.textContent = state.answer;
        chrome.setStatus(OP_NAME[state.op] + ' · 共 ' + state.steps.length + ' 步', 'ok');
        render();
    }

    function render() {
        els.opSym.textContent = OP_CHIPS.filter(function (p) { return p[0] === state.op; })[0][1];

        var a = digitsOf(state.a);
        var b = digitsOf(state.b);
        var cols;
        if (state.op === 'mul') {
            var bl = state.b.length;
            cols = Math.max(state.a.length + bl, state.answer.length) + 1;
        } else {
            cols = Math.max(a.length, b.length, state.answer.length) + 1;
        }
        var rows = [];
        var done = state.cursor;

        /* 每行 = cells 数组 [ {col, text, cls, live} ]，col 从 0（左）起 */
        function dcol(digitIdxFromRight) { return cols - 1 - digitIdxFromRight; }

        /* 进/借位行 */
        var carryRow = [];
        var isAddSub = state.op !== 'mul';
        if (isAddSub) {
            for (var s = 0; s < done; s++) {
                var st = state.steps[s];
                if (st.isFinalCarry) { continue; }
                if (st.carryOut) {
                    carryRow.push({
                        col: dcol(st.i + 1),
                        text: String(st.carryOut),
                        cls: state.op === 'add' ? 'is-carry' : 'is-carry',
                        live: s === done - 1,
                        title: state.op === 'add' ? '进位' : '借位'
                    });
                }
            }
            rows.push({ cells: carryRow, h: 'small' });
        } else {
            rows.push({ cells: [], h: 'small' });
        }

        /* 被乘/加数行 */
        var rowA = [];
        for (var i = 0; i < a.length; i++) {
            rowA.push({ col: dcol(a.length - 1 - i), text: String(a[i]), cls: '' });
        }
        rows.push({ cells: rowA });

        /* 运算符号 + 第二数行 */
        var rowB = [{ col: dcol(Math.max(b.length, a.length) - 1) - 1, text: OP_CHIPS.filter(function (p) { return p[0] === state.op; })[0][1], cls: 'is-op' }];
        for (var j = 0; j < b.length; j++) {
            rowB.push({ col: dcol(b.length - 1 - j), text: String(b[j]), cls: '' });
        }
        rows.push({ cells: rowB });

        /* 横线 */
        rows.push({ cells: [{ col: 0, text: '', cls: 'is-line', span: cols }], h: 'line' });

        /* 乘法部分积行 */
        if (state.op === 'mul') {
            for (var p = 0; p < state.partials.length; p++) {
                var pr = [];
                var revealed = state.steps.slice(0, done).some(function (st) {
                    return st.type === 'partial' && st.idx >= p;
                });
                if (revealed) {
                    var pStr = String(state.partials[p].val);
                    for (var z = 0; z < state.partials[p].shift; z++) { pStr += '0'; }
                    var liveP = done > 0 && state.steps[done - 1].type === 'partial' && state.steps[done - 1].idx === p;
                    for (var y = 0; y < pStr.length; y++) {
                        pr.push({
                            col: dcol(pStr.length - 1 - y),
                            text: pStr.charAt(y),
                            cls: 'is-partial',
                            live: liveP
                        });
                    }
                }
                rows.push({ cells: pr });
            }
            rows.push({ cells: [{ col: 0, text: '', cls: 'is-line', span: cols }], h: 'line' });
        }

        /* 结果行（逐位揭示） */
        var resRow = [];
        var answerDg = digitsOf(state.answer);
        var revealedCount = 0;
        if (isAddSub) {
            revealedCount = done;
        } else {
            var sumDone = state.steps.slice(0, done).filter(function (st) { return st.type === 'sum'; }).length;
            revealedCount = sumDone;
        }
        var ansTotal = answerDg.length;
        for (var d = 0; d < ansTotal; d++) {
            var idxFromRight = ansTotal - 1 - d;
            var isLive = revealedCount === idxFromRight + 1 && done > 0 &&
                done < state.steps.length;
            resRow.push({
                col: dcol(idxFromRight),
                text: d < revealedCount ? String(answerDg[ansTotal - 1 - d]) : '',
                cls: 'is-live',
                live: isLive
            });
        }
        rows.push({ cells: resRow });

        /* --- 渲染为 grid --- */
        var html = '';
        for (var ri = 0; ri < rows.length; ri++) {
            var row = rows[ri];
            var cellMap = {};
            for (var ci = 0; ci < row.cells.length; ci++) {
                var cell = row.cells[ci];
                if (cell.span) {
                    html += '<div class="vertmain-cell ' + (cell.cls || '') + '" style="grid-column:1 / span ' + cell.span + '"></div>';
                    continue;
                }
                cellMap[cell.col] = cell;
            }
            if (row.h !== 'line') {
                for (var col = 0; col < cols; col++) {
                    var c = cellMap[col];
                    if (c) {
                        html += '<div class="vertmain-cell ' + (c.cls || '') + (c.live ? ' is-live' : '') + '"' +
                            (c.title ? ' title="' + c.title + '"' : '') + '>' + c.text + '</div>';
                    } else {
                        html += '<div class="vertmain-cell"></div>';
                    }
                }
            }
        }
        els.board.style.gridTemplateColumns = 'repeat(' + cols + ', auto)';
        els.board.innerHTML = html;

        /* 步骤文案 */
        if (done === 0) {
            els.stepText.innerHTML = OP_NAME[state.op] + '共 <b>' + state.steps.length +
                '</b> 步 · 点「单步」开始逐位演算';
        } else if (done >= state.steps.length) {
            els.stepText.innerHTML = '完成！<b>' + state.a + ' ' + els.opSym.textContent + ' ' + state.b +
                ' = ' + state.answer + '</b>';
        } else {
            els.stepText.innerHTML = '第 ' + done + ' / ' + state.steps.length + ' 步：' + state.steps[done - 1].text;
        }
    }

    function syncOps() {
        var chips = els.ops.children;
        for (var i = 0; i < chips.length; i++) {
            chips[i].classList.toggle('is-on', chips[i].getAttribute('data-op') === state.op);
        }
    }

    /* ---------- 交互 ---------- */

    function stepOnce() {
        if (!state.steps.length) { compute(); return; }
        if (state.cursor >= state.steps.length) {
            try { chrome.beep('tick'); } catch (e) { /* 静默 */ }
            return;
        }
        state.cursor++;
        try { chrome.beep('tick'); } catch (e) { /* 静默 */ }
        if (state.cursor >= state.steps.length) {
            try { chrome.beep('win'); } catch (e) { /* 静默 */ }
            stopAuto();
        }
        render();
    }

    function toggleAuto() {
        if (state.autoTimer) {
            stopAuto();
            render();
            return;
        }
        if (state.cursor >= state.steps.length) { state.cursor = 0; }
        state.autoTimer = setInterval(function () {
            if (state.cursor >= state.steps.length) { stopAuto(); render(); return; }
            stepOnce();
        }, 1100);
        els.btnAuto.textContent = '停止播放';
        chrome.setStatus('自动播放中', 'warn');
    }

    function stopAuto() {
        if (state.autoTimer) {
            clearInterval(state.autoTimer);
            state.autoTimer = 0;
        }
        els.btnAuto.textContent = '自动播放';
    }

    function newProblem() {
        var md = state.maxDigits;
        var lo = md >= 3 ? Math.pow(10, md - 1) : 10;
        var hi = Math.pow(10, md) - 1;
        var a = lo + Math.floor(Math.random() * (hi - lo + 1));
        var b;
        if (state.op === 'mul') {
            b = state.mulMode === 'x2'
                ? 11 + Math.floor(Math.random() * 89)
                : 2 + Math.floor(Math.random() * 8);
        } else {
            b = lo + Math.floor(Math.random() * (hi - lo + 1));
            if (state.op === 'sub' && b > a) {
                var t = a; a = b; b = t;
            }
        }
        els.inA.value = String(a);
        els.inB.value = String(b);
        compute();
        chrome.toast('新题：' + a + ' ' + els.opSym.textContent + ' ' + b);
    }

    function persist() {
        store.set('op', state.op);
        store.set('maxDigits', state.maxDigits);
        store.set('mulMode', state.mulMode);
    }

    function buildSettings(body) {
        body.innerHTML = '';

        var mkTitle = function (t) {
            var p = document.createElement('p');
            p.style.cssText = 'margin:8px 0 4px;font-size:12.5px;font-weight:700;color:var(--et-muted)';
            p.textContent = t;
            body.appendChild(p);
        };

        mkTitle('加减法出题位数');
        var seg = document.createElement('div');
        seg.style.cssText = 'display:flex;gap:6px';
        [2, 3, 4].forEach(function (n) {
            var b = document.createElement('button');
            b.type = 'button';
            b.className = 'et-btn' + (state.maxDigits === n ? ' et-btn--primary' : '');
            b.textContent = n + ' 位';
            b.addEventListener('click', function () {
                state.maxDigits = n;
                persist();
                buildSettings(body);
            });
            seg.appendChild(b);
        });
        body.appendChild(seg);

        mkTitle('乘法模式');
        var seg2 = document.createElement('div');
        seg2.style.cssText = 'display:flex;gap:6px';
        [['x1', '多位数 × 1 位数'], ['x2', '多位数 × 2 位数']].forEach(function (m) {
            var b2 = document.createElement('button');
            b2.type = 'button';
            b2.className = 'et-btn' + (state.mulMode === m[0] ? ' et-btn--primary' : '');
            b2.textContent = m[1];
            b2.addEventListener('click', function () {
                state.mulMode = m[0];
                persist();
                buildSettings(body);
            });
            seg2.appendChild(b2);
        });
        body.appendChild(seg2);

        var note = document.createElement('p');
        note.style.cssText = 'margin:12px 0 0;font-size:12.5px;color:var(--et-muted);line-height:1.7';
        note.textContent = '乘法最大支持 4 位 × 2 位；减法自动保证大数在前。';
        body.appendChild(note);
    }

    /* ---------- 构建 & 事件 ---------- */

    function buildOps() {
        els.ops.innerHTML = '';
        OP_CHIPS.forEach(function (p) {
            var b = document.createElement('button');
            b.type = 'button';
            b.className = 'vertmain-op';
            b.setAttribute('data-op', p[0]);
            b.textContent = p[1];
            b.addEventListener('click', function () {
                state.op = p[0];
                persist();
                syncOps();
                compute();
                try { chrome.beep('tick'); } catch (e) { /* 静默 */ }
            });
            els.ops.appendChild(b);
        });
        syncOps();
    }

    els.inA.addEventListener('change', compute);
    els.inB.addEventListener('change', compute);
    els.btnStep.addEventListener('click', stepOnce);
    els.btnAuto.addEventListener('click', toggleAuto);
    els.btnNew.addEventListener('click', newProblem);

    document.addEventListener('keydown', function (e) {
        if (e.code === 'Space' && !isTypingTarget(e.target)) {
            e.preventDefault();
            stepOnce();
        }
    });

    /* ---------- 启动 ---------- */

    buildOps();
    compute();
})();
</script>

</body>
</html>
