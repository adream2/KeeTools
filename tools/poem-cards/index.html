/* ============ 设计令牌 ============ */
:root {
    --et-accent: #2563eb;
    --et-accent-weak: rgba(37, 99, 235, .14);
    --et-bg: #f4f6fb;
    --et-surface: #ffffff;

    --et-muted: #64748b;
    --et-line: rgba(15, 23, 42, .12);
    --et-line-strong: rgba(15, 23, 42, .22);
    --et-glass: rgba(255, 255, 255, .85);
    --et-shadow-md: 0 10px 28px -18px rgba(15, 23, 42, .3);
    --et-shadow-lg: 0 24px 60px -32px rgba(15, 23, 42, .4);
    --et-ok: #059669;
    --et-warn: #d97706;
    --et-err: #dc2626;
    --et-radius: 12px;
    --et-radius-sm: 9px;
    --et-font: -apple-system, BlinkMacSystemFont, "Segoe UI",
               "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei",
               "Noto Sans SC", sans-serif;
    --et-mono: ui-monospace, "Cascadia Mono", Consolas, Menlo, monospace;
}

html[data-et-theme="dark"] {
    --et-bg: #0b1120;
    --et-surface: #111a2e;
    --et-surface-2: #0f1729;
    --et-fg: #f1f5f9;
    --et-muted: #94a3b8;
    --et-line: rgba(148, 163, 184, .18);
    --et-line-strong: rgba(148, 163, 184, .3);
    --et-glass: rgba(17, 26, 46, .85);
    --et-shadow-md: 0 10px 34px -18px rgba(0, 0, 0, .8);
    --et-shadow-lg: 0 24px 70px -30px rgba(0, 0, 0, .9);
    --et-ok: #34d399;
    --et-warn: #fbbf24;
    --et-err: #f87171;
}

/* ============ 基础 ============ */

/* body 作为外壳时必须清掉浏览器默认 8px 外边距，
   否则 iframe 预览中文档会比视口高 16px（底部白边 + 多余滚动） */
body.et-app {
    margin: 0;
}

.et-app {
    position: relative;
    isolation: isolate;
    display: flex;
    flex-direction: column;
    height: 100vh;
    height: 100dvh;
    overflow: hidden;
    background: var(--et-bg);
    color: var(--et-fg);
    font-family: var(--et-font);
    -webkit-font-smoothing: antialiased;
    transition: background .25s, color .25s;
}

/* 极光背景：径向渐变 + 呼吸动画（edupick 品质基线，老内核也不掉帧） */
.et-app::before {
    content: '';
    position: fixed;
    inset: 0;
    z-index: -1;
    pointer-events: none;
    background:
        radial-gradient(46% 40% at 20% 18%, var(--et-accent-weak), transparent 65%),
        radial-gradient(42% 38% at 82% 24%, var(--et-accent-weak), transparent 70%),
        radial-gradient(50% 44% at 55% 95%, rgba(16, 185, 129, .10), transparent 65%);
    animation: et-aurora 16s ease-in-out infinite alternate;
}

@keyframes et-aurora {
    from { opacity: .55; transform: scale(1); }
    to { opacity: 1; transform: scale(1.06); }
}

.et-app *,
.et-app *::before,
.et-app *::after { box-sizing: border-box; }

[hidden] { display: none !important; }

.et-icon {
    width: 18px;
    height: 18px;
    fill: none;
    stroke: currentColor;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
    flex: none;
}

/* ============ 顶栏 ============ */
.et-topbar {
    flex: none;
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 11px 20px;
    border-bottom: 1px solid var(--et-line);
    background: var(--et-glass);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    z-index: 20;
}

.et-brand {
    display: flex;
    align-items: center;
    gap: 10px;
    min-width: 0;
}

.et-brand__dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: var(--et-accent);
    box-shadow: 0 0 0 4px var(--et-accent-weak);
    flex: none;
}

.et-brand__name {
    font-weight: 800;
    font-size: 15px;
    letter-spacing: -.01em;
    white-space: nowrap;
}

.et-brand__sub {
    font-size: 12.5px;
    color: var(--et-muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.et-status {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 5px 14px;
    border-radius: 999px;
    font-size: 12.5px;
    color: var(--et-muted);
    background: var(--et-surface-2);
    border: 1px solid var(--et-line);
    white-space: nowrap;
    max-width: 42vw;
    overflow: hidden;
    text-overflow: ellipsis;
}

.et-status__dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--et-ok);
    flex: none;
    transition: background .2s;
}

.et-status[data-tone="err"] .et-status__dot { background: var(--et-err); }
.et-status[data-tone="warn"] .et-status__dot { background: var(--et-warn); }

.et-actions {
    display: flex;
    align-items: center;
    gap: 7px;
}

.et-icon-btn {
    display: inline-grid;
    place-items: center;
    width: 38px;
    height: 38px;
    font-size: 16px;
    line-height: 1;
    border-radius: 11px;
    border: 1px solid var(--et-line);
    background: var(--et-surface-2);
    color: var(--et-fg);
    cursor: pointer;
    transition: transform .14s, border-color .14s, color .14s, opacity .14s;
    -webkit-tap-highlight-color: transparent;
}

.et-icon-btn:hover {
    border-color: var(--et-accent);
    color: var(--et-accent);
    transform: translateY(-1px);
}

.et-icon-btn:active { transform: translateY(0); }
.et-icon-btn.is-off { opacity: .4; }
.et-icon-btn:focus-visible { outline: 2px solid var(--et-accent); outline-offset: 2px; }

/* ============ 主区默认 ============ */
.et-main {
    flex: 1;
    min-height: 0;
    position: relative;
    overflow: auto;
}

/* ============ 页脚（品牌回流 L2） ============ */
.et-footer {
    flex: none;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 7px 16px;
    font-size: 12px;
    color: var(--et-muted);
    border-top: 1px solid var(--et-line);
    background: var(--et-glass);
    user-select: none;
    z-index: 20;
}

.et-footer a {
    color: inherit;
    text-decoration: none;
    transition: color .14s;
}

.et-footer a:hover { color: var(--et-accent); }

/* ============ 按钮 ============ */
.et-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
    padding: 9px 16px;
    border-radius: 11px;
    font: inherit;
    font-size: 13.5px;
    font-weight: 700;
    border: 1px solid var(--et-line);
    background: var(--et-surface-2);
    color: var(--et-fg);
    cursor: pointer;
    transition: transform .14s, border-color .14s, color .14s, background .14s, box-shadow .14s;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
}

.et-btn:hover {
    border-color: var(--et-accent);
    color: var(--et-accent);
    transform: translateY(-1px);
}

.et-btn:active { transform: translateY(0); }
.et-btn:focus-visible { outline: 2px solid var(--et-accent); outline-offset: 2px; }
.et-btn:disabled { opacity: .45; cursor: not-allowed; transform: none; }

.et-btn--primary {
    background: var(--et-accent);
    border-color: var(--et-accent);
    color: #fff;
    box-shadow: 0 6px 18px -8px var(--et-accent);
}

.et-btn--primary:hover { color: #fff; filter: brightness(1.08); }
.et-btn--primary:disabled { filter: none; }

.et-btn--danger:hover {
    border-color: var(--et-err);
    color: var(--et-err);
}

.et-btn--lg {
    padding: 13px 26px;
    font-size: 16px;
    border-radius: 14px;
}

/* ============ 弹窗 ============ */
.et-modal {
    position: fixed;
    inset: 0;
    z-index: 100;
    display: grid;
    place-items: center;
    padding: 24px;
    background: rgba(2, 6, 23, .55);
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    animation: et-fade .18s ease;
}

.et-modal__panel {
    width: min(680px, 94vw);
    max-height: 86vh;
    max-height: 86dvh;
    display: flex;
    flex-direction: column;
    background: var(--et-surface);
    border: 1px solid var(--et-line);
    border-radius: 16px;
    box-shadow: var(--et-shadow-lg);
    animation: et-pop .2s cubic-bezier(.34, 1.4, .64, 1);
    overflow: hidden;
}

.et-modal__panel--narrow { width: min(460px, 92vw); }
.et-modal__panel--wide { width: min(900px, 94vw); }

.et-modal__head {
    flex: none;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 16px 20px;
    border-bottom: 1px solid var(--et-line);
    font-weight: 800;
    font-size: 15px;
}

.et-modal__head .et-icon-btn {
    margin-left: auto;
    width: 32px;
    height: 32px;
}

.et-modal__body {
    flex: 1;
    min-height: 0;
    overflow: auto;
    padding: 18px 20px;
}

.et-modal__foot {
    flex: none;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 14px 20px;
    border-top: 1px solid var(--et-line);
    background: var(--et-surface-2);
}

.et-modal__foot .spacer { flex: 1; }

@keyframes et-fade {
    from { opacity: 0; }
}

@keyframes et-pop {
    from { opacity: 0; transform: translateY(14px) scale(.97); }
}

/* ============ 轻提示（toast） ============ */
.et-toast {
    position: fixed;
    left: 50%;
    bottom: 56px;
    transform: translateX(-50%) translateY(10px);
    z-index: 120;
    display: flex;
    align-items: center;
    gap: 9px;
    max-width: min(520px, 88vw);

    pointer-events: none;
    transition: opacity .22s, transform .22s;
}

.et-toast.is-show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
}

.et-toast[data-tone="ok"] { background: rgba(5, 150, 105, .95); }
.et-toast[data-tone="err"] { background: rgba(220, 38, 38, .95); }
.et-toast[data-tone="warn"] { background: rgba(217, 119, 6, .95); }

/* ============ 设置抽屉（右上角入口，edupick 交互） ============ */
.et-drawer-backdrop {
    position: fixed;
    inset: 0;
    z-index: 90;
    background: rgba(2, 6, 23, .45);
    backdrop-filter: blur(3px);
    -webkit-backdrop-filter: blur(3px);

    transition: opacity .2s;
}

.et-drawer-backdrop.is-open { opacity: 1; }

.et-drawer {
    position: absolute;
    top: 0;
    right: 0;
    height: 100%;
    width: min(400px, 92vw);
    display: flex;
    flex-direction: column;

    border-left: 1px solid var(--et-line);
    box-shadow: var(--et-shadow-lg);
    transform: translateX(100%);

.et-drawer-backdrop.is-open .et-drawer { transform: translateX(0); }

.et-drawer__head {

    display: flex;
    align-items: center;

    padding: 15px 18px;

}

}

.et-drawer__switch input {

    accent-color: var(--et-accent);
    cursor: pointer;
}
</style>

    var MASTER_GAIN = 0.5; /* 整体音量层（教室设备音量 100% 也要听得清） */

    function tone(ctx, freq, start, dur, gainPeak, type) {
        var osc = ctx.createOscillator();
        var gain = ctx.createGain();
        osc.type = type || 'triangle';
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(0, start);
        gain.gain.linearRampToValueAtTime(gainPeak, start + 0.012);
        gain.gain.exponentialRampToValueAtTime(0.0001, start + dur);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(start);
        osc.stop(start + dur + 0.05);
    }

    var BEEPS = {
        tick: [[880, 0, 0.06, 0.42]],
        ok: [[660, 0, 0.1, 0.46], [880, 0.1, 0.14, 0.46]],

        err: [[220, 0, 0.22, 0.46, 'square']],

    };

        var ctx = ensureCtx();
        if (!ctx || !BEEPS[kind]) { return; }
        var seq = BEEPS[kind];
        var t0 = ctx.currentTime + 0.01;
        for (var i = 0; i < seq.length; i++) {
            tone(ctx, seq[i][0], t0 + seq[i][1], seq[i][2], seq[i][3] * MASTER_GAIN, seq[i][4]);

    function openDrawer(title, build) {

        drawer.appendChild(body);

        function close() {
            backdrop.classList.remove('is-open');
            document.removeEventListener('keydown', onKey);
            setTimeout(function () {

        head.appendChild(el('span', null, mo.title || ''));

        if (mo.buttons && mo.buttons.length) {
            foot = el('div', 'et-modal__foot');

                btn.type = 'button';
                btn.addEventListener('click', function () {
                    if (b.onClick) { b.onClick(close); } else { close(); }
                });
                foot.appendChild(btn);
            });
            panel.appendChild(foot);
        }

        backdrop.appendChild(panel);
        document.body.appendChild(backdrop);

        function close() {
            if (backdrop.parentNode) { backdrop.parentNode.removeChild(backdrop); }
            document.removeEventListener('keydown', onKey);
            if (mo.onClose) { mo.onClose(); }
        }
        function onKey(ev) {

        }

        if (!main) { main = el('main'); main.id = 'et-main'; topbar.after(main); }

        main.classList.add('et-main');
        footer.className = 'et-footer';

        /* 品牌 */
        var brand = el('div', 'et-brand');
        brand.appendChild(el('span', 'et-brand__dot'));
        var nameWrap = el('div');

        /* 状态胶囊 */

        var actions = el('div', 'et-actions');

        actions.appendChild(fsBtn);

            soundBtn.appendChild(makeIcon(soundEnabled ? 'i-volume' : 'i-volume-off'));
            soundBtn.title = soundEnabled ? '关闭音效' : '开启音效';
            soundBtn.classList.toggle('is-off', !soundEnabled);

            if (settingsBtn) { settingsBtn.click(); }

        function inIframe() {

            fsBtn.appendChild(makeIcon(on ? 'i-minimize' : 'i-maximize'));

        document.addEventListener('fullscreenchange', function () {

        });
        document.addEventListener('webkitfullscreenchange', function () {

        });
        syncFsIcon(false);

        api.toggleFullscreen = toggleFullscreen;

        /* ---------- 音效 API ---------- */
        api.beep = function (kind) {

        api.soundOn = function () { return soundEnabled; };

        api.modal = modal;

        /* ---------- 帮助 ---------- */
        function openHelp() {
            modal({
                title: '使用说明',
                icon: 'i-help',

        api.openHelp = openHelp;

        /* ---------- toast ---------- */
        api.toast = toast;

        var siteOrigin = typeof global.ET_SITE_ORIGIN === 'string' && /^https?:\/\//.test(global.ET_SITE_ORIGIN)
            ? global.ET_SITE_ORIGIN
            : null;

        function renderFooter() {

            footer.appendChild(el('span', null, 'KeeTools 课工具'));
            footer.appendChild(el('span', null, '·'));
            if (siteOrigin) {
                var a = el('a', null, '更多课堂工具');

                a.rel = 'noopener';

                footer.appendChild(el('span', null, '更多课堂工具'));
            }

        renderFooter();

        /* 站点来源发现：iframe 内向父窗口询问；也可由宿主直接注入 ET_SITE_ORIGIN */
        try {
            if (global.parent && global.parent !== global) {
                global.parent.postMessage(JSON.stringify({ type: 'et-hello', toolId: toolId }), '*');
            }
        } catch (err) { /* 跨域异常忽略 */ }

        global.addEventListener('message', function (ev) {

            if (typeof data === 'string') {

<script>

/*!
 * et-stats.js — 使用统计模块（模块化，可整体移除）
 *
 * 共享逻辑源。改这里，然后跑：python scripts/sync_shared.py
 * 依赖：无（可脱离 et-util / et-chrome 独立运行）。
 * 全局：ET.Stats
 *
 * ┌────────────────────────────────────────────────────────────────┐
 * │ 说明：本模块只做一件事——工具被打开时向上报端点发一条匿名计数。 │
 * │ · 在线（iframe 内）：宿主页面已服务端计数，本模块不重复上报。   │
 * │ · 离线打开（file:// / 下载单文件 / 离线包）：联网条件具备时，   │
 * │   以 sendBeacon 上报 use_offline 事件（text/plain 免预检）。    │
 * │ · 上报端点 = window.ET_SITE_ORIGIN（由宿主注入或离线包配置）。  │
 * │   未配置端点时本模块完全静默，不发任何请求。                    │
 * │ · **整个 <script> 块可安全删除**：删除后工具其余功能完全正常，  │
 * │   且完全不再发起任何网络请求。                                  │
 * └────────────────────────────────────────────────────────────────┘
 */
(function (global) {
    'use strict';

    var ET = global.ET = global.ET || {};

    var Stats = {
        /** 上报端点来源（站点绝对地址，无协议尾斜杠） */
        endpoint: (typeof global.ET_SITE_ORIGIN === 'string' && /^https?:\/\//.test(global.ET_SITE_ORIGIN))
            ? global.ET_SITE_ORIGIN
            : null,

        _done: {},

        /**
         * 上报一次事件（同一事件同一工具每次页面加载只报一次）。
         * event: 'use_offline' 等；toolId: 工具 id。
         */
        send: function (event, toolId) {
            if (!event || this._done[event + ':' + (toolId || '')]) { return false; }
            if (!this.endpoint) { return false; }
            /* iframe 内由宿主统计，避免双计 */
            try {
                if (global.parent && global.parent !== global) { return false; }
            } catch (err) { return false; }
            /* 断网时挂起，网络恢复自动补报一次 */
            if (global.navigator && global.navigator.onLine === false) {
                var self = this;
                global.addEventListener('online', function () { self.send(event, toolId); }, { once: true });
                return false;
            }

            this._done[event + ':' + (toolId || '')] = true;
            var payload = JSON.stringify({ event: event, tool: toolId || '' });

            try {
                if (global.navigator.sendBeacon) {
                    return global.navigator.sendBeacon(
                        this.endpoint + '/api/track',
                        new Blob([payload], { type: 'text/plain;charset=UTF-8' })
                    );
                }
                global.fetch(this.endpoint + '/api/track', {
                    method: 'POST',
                    body: payload,
                    keepalive: true,
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'text/plain;charset=UTF-8' }
                });
                return true;
            } catch (err) {
                return false;
            }
        }
    };

    ET.Stats = Stats;
})(window);
</script>

        { t: '池上', a: '白居易', d: '唐', g: '1-2', l: ['小娃撑小艇，偷采白莲回。', '不解藏踪迹，浮萍一道开。'] },
        { t: '小池', a: '杨万里', d: '宋', g: '1-2', l: ['泉眼无声惜细流，树阴照水爱晴柔。', '小荷才露尖尖角，早有蜻蜓立上头。'] },
        { t: '登鹳雀楼', a: '王之涣', d: '唐', g: '1-2', l: ['白日依山尽，黄河入海流。', '欲穷千里目，更上一层楼。'] },
        { t: '古朗月行（节选）', a: '李白', d: '唐', g: '1-2', l: ['小时不识月，呼作白玉盘。', '又疑瑶台镜，飞在青云端。'] },
        { t: '风', a: '李峤', d: '唐', g: '1-2', l: ['解落三秋叶，能开二月花。', '过江千尺浪，入竹万竿斜。'] },
        { t: '江南', a: '汉乐府', d: '汉', g: '1-2', l: ['江南可采莲，莲叶何田田。', '鱼戏莲叶间。', '鱼戏莲叶东，鱼戏莲叶西，', '鱼戏莲叶南，鱼戏莲叶北。'] },
        { t: '敕勒歌', a: '北朝民歌', d: '北朝', g: '1-2', l: ['敕勒川，阴山下。', '天似穹庐，笼盖四野。', '天苍苍，野茫茫，', '风吹草低见牛羊。'] },
        { t: '赠汪伦', a: '李白', d: '唐', g: '1-2', l: ['李白乘舟将欲行，忽闻岸上踏歌声。', '桃花潭水深千尺，不及汪伦送我情。'] },
        { t: '寻隐者不遇', a: '贾岛', d: '唐', g: '1-2', l: ['松下问童子，言师采药去。', '只在此山中，云深不知处。'] },
        { t: '村居', a: '高鼎', d: '清', g: '1-2', l: ['草长莺飞二月天，拂堤杨柳醉春烟。', '儿童散学归来早，忙趁东风放纸鸢。'] },
        { t: '咏柳', a: '贺知章', d: '唐', g: '1-2', l: ['碧玉妆成一树高，万条垂下绿丝绦。', '不知细叶谁裁出，二月春风似剪刀。'] },
        { t: '所见', a: '袁枚', d: '清', g: '1-2', l: ['牧童骑黄牛，歌声振林樾。', '意欲捕鸣蝉，忽然闭口立。'] },
        { t: '望庐山瀑布', a: '李白', d: '唐', g: '1-2', l: ['日照香炉生紫烟，遥看瀑布挂前川。', '飞流直下三千尺，疑是银河落九天。'] },
        { t: '绝句（两个黄鹂鸣翠柳）', a: '杜甫', d: '唐', g: '1-2', l: ['两个黄鹂鸣翠柳，一行白鹭上青天。', '窗含西岭千秋雪，门泊东吴万里船。'] },
        { t: '晓出净慈寺送林子方', a: '杨万里', d: '宋', g: '1-2', l: ['毕竟西湖六月中，风光不与四时同。', '接天莲叶无穷碧，映日荷花别样红。'] },

        /* ---------- 小学中年级（3-4） ---------- */
        { t: '山行', a: '杜牧', d: '唐', g: '3-4', l: ['远上寒山石径斜，白云生处有人家。', '停车坐爱枫林晚，霜叶红于二月花。'] },
        { t: '赠刘景文', a: '苏轼', d: '宋', g: '3-4', l: ['荷尽已无擎雨盖，菊残犹有傲霜枝。', '一年好景君须记，最是橙黄橘绿时。'] },
        { t: '夜书所见', a: '叶绍翁', d: '宋', g: '3-4', l: ['萧萧梧叶送寒声，江上秋风动客情。', '知有儿童挑促织，夜深篱落一灯明。'] },
        { t: '望天门山', a: '李白', d: '唐', g: '3-4', l: ['天门中断楚江开，碧水东流至此回。', '两岸青山相对出，孤帆一片日边来。'] },
        { t: '饮湖上初晴后雨', a: '苏轼', d: '宋', g: '3-4', l: ['水光潋滟晴方好，山色空蒙雨亦奇。', '欲把西湖比西子，淡妆浓抹总相宜。'] },
        { t: '绝句（迟日江山丽）', a: '杜甫', d: '唐', g: '3-4', l: ['迟日江山丽，春风花草香。', '泥融飞燕子，沙暖睡鸳鸯。'] },
        { t: '惠崇春江晚景', a: '苏轼', d: '宋', g: '3-4', l: ['竹外桃花三两枝，春江水暖鸭先知。', '蒌蒿满地芦芽短，正是河豚欲上时。'] },
        { t: '三衢道中', a: '曾几', d: '宋', g: '3-4', l: ['梅子黄时日日晴，小溪泛尽却山行。', '绿阴不减来时路，添得黄鹂四五声。'] },
        { t: '元日', a: '王安石', d: '宋', g: '3-4', l: ['爆竹声中一岁除，春风送暖入屠苏。', '千门万户曈曈日，总把新桃换旧符。'] },
        { t: '清明', a: '杜牧', d: '唐', g: '3-4', l: ['清明时节雨纷纷，路上行人欲断魂。', '借问酒家何处有，牧童遥指杏花村。'] },
        { t: '九月九日忆山东兄弟', a: '王维', d: '唐', g: '3-4', l: ['独在异乡为异客，每逢佳节倍思亲。', '遥知兄弟登高处，遍插茱萸少一人。'] },
        { t: '滁州西涧', a: '韦应物', d: '唐', g: '3-4', l: ['独怜幽草涧边生，上有黄鹂深树鸣。', '春潮带雨晚来急，野渡无人舟自横。'] },
        { t: '大林寺桃花', a: '白居易', d: '唐', g: '3-4', l: ['人间四月芳菲尽，山寺桃花始盛开。', '长恨春归无觅处，不知转入此中来。'] },
        { t: '暮江吟', a: '白居易', d: '唐', g: '3-4', l: ['一道残阳铺水中，半江瑟瑟半江红。', '可怜九月初三夜，露似真珠月似弓。'] },
        { t: '题西林壁', a: '苏轼', d: '宋', g: '3-4', l: ['横看成岭侧成峰，远近高低各不同。', '不识庐山真面目，只缘身在此山中。'] },
        { t: '雪梅', a: '卢梅坡', d: '宋', g: '3-4', l: ['梅雪争春未肯降，骚人阁笔费评章。', '梅须逊雪三分白，雪却输梅一段香。'] },
        { t: '出塞', a: '王昌龄', d: '唐', g: '3-4', l: ['秦时明月汉时关，万里长征人未还。', '但使龙城飞将在，不教胡马度阴山。'] },
        { t: '凉州词', a: '王翰', d: '唐', g: '3-4', l: ['葡萄美酒夜光杯，欲饮琵琶马上催。', '醉卧沙场君莫笑，古来征战几人回。'] },
        { t: '夏日绝句', a: '李清照', d: '宋', g: '3-4', l: ['生当作人杰，死亦为鬼雄。', '至今思项羽，不肯过江东。'] },
        { t: '别董大', a: '高适', d: '唐', g: '3-4', l: ['千里黄云白日曛，北风吹雁雪纷纷。', '莫愁前路无知己，天下谁人不识君。'] },
        { t: '渔歌子', a: '张志和', d: '唐', g: '3-4', l: ['西塞山前白鹭飞，桃花流水鳜鱼肥。', '青箬笠，绿蓑衣，斜风细雨不须归。'] },

        /* ---------- 小学高年级（5-6） ---------- */
        { t: '泊船瓜洲', a: '王安石', d: '宋', g: '5-6', l: ['京口瓜洲一水间，钟山只隔数重山。', '春风又绿江南岸，明月何时照我还。'] },
        { t: '秋思', a: '张籍', d: '唐', g: '5-6', l: ['洛阳城里见秋风，欲作家书意万重。', '复恐匆匆说不尽，行人临发又开封。'] },
        { t: '长相思', a: '纳兰性德', d: '清', g: '5-6', l: ['山一程，水一程，身向榆关那畔行，夜深千帐灯。', '风一更，雪一更，聒碎乡心梦不成，故园无此声。'] },
        { t: '石灰吟', a: '于谦', d: '明', g: '5-6', l: ['千锤万凿出深山，烈火焚烧若等闲。', '粉骨碎身浑不怕，要留清白在人间。'] },
        { t: '竹石', a: '郑燮', d: '清', g: '5-6', l: ['咬定青山不放松，立根原在破岩中。', '千磨万击还坚劲，任尔东西南北风。'] },
        { t: '己亥杂诗', a: '龚自珍', d: '清', g: '5-6', l: ['九州生气恃风雷，万马齐喑究可哀。', '我劝天公重抖擞，不拘一格降人才。'] },
        { t: '望洞庭', a: '刘禹锡', d: '唐', g: '5-6', l: ['湖光秋月两相和，潭面无风镜未磨。', '遥望洞庭山水翠，白银盘里一青螺。'] },
        { t: '浪淘沙（其一）', a: '刘禹锡', d: '唐', g: '5-6', l: ['九曲黄河万里沙，浪淘风簸自天涯。', '如今直上银河去，同到牵牛织女家。'] },
        { t: '江南春', a: '杜牧', d: '唐', g: '5-6', l: ['千里莺啼绿映红，水村山郭酒旗风。', '南朝四百八十寺，多少楼台烟雨中。'] },
        { t: '书湖阴先生壁', a: '王安石', d: '宋', g: '5-6', l: ['茅檐长扫净无苔，花木成畦手自栽。', '一水护田将绿绕，两山排闼送青来。'] },
        { t: '六月二十七日望湖楼醉书', a: '苏轼', d: '宋', g: '5-6', l: ['黑云翻墨未遮山，白雨跳珠乱入船。', '卷地风来忽吹散，望湖楼下水如天。'] },
        { t: '春日', a: '朱熹', d: '宋', g: '5-6', l: ['胜日寻芳泗水滨，无边光景一时新。', '等闲识得东风面，万紫千红总是春。'] },
        { t: '游园不值', a: '叶绍翁', d: '宋', g: '5-6', l: ['应怜屐齿印苍苔，小扣柴扉久不开。', '春色满园关不住，一枝红杏出墙来。'] },
        { t: '宿新市徐公店', a: '杨万里', d: '宋', g: '5-6', l: ['篱落疏疏一径深，树头新绿未成阴。', '儿童急走追黄蝶，飞入菜花无处寻。'] },
        { t: '四时田园杂兴（其二十五）', a: '范成大', d: '宋', g: '5-6', l: ['梅子金黄杏子肥，麦花雪白菜花稀。', '日长篱落无人过，惟有蜻蜓蛱蝶飞。'] },
        { t: '清平乐·村居', a: '辛弃疾', d: '宋', g: '5-6', l: ['茅檐低小，溪上青青草。醉里吴音相媚好，白发谁家翁媪。', '大儿锄豆溪东，中儿正织鸡笼。最喜小儿亡赖，溪头卧剥莲蓬。'] },
        { t: '西江月·夜行黄沙道中', a: '辛弃疾', d: '宋', g: '5-6', l: ['明月别枝惊鹊，清风半夜鸣蝉。稻花香里说丰年，听取蛙声一片。', '七八个星天外，两三点雨山前。旧时茅店社林边，路转溪桥忽见。'] },
        { t: '忆江南', a: '白居易', d: '唐', g: '5-6', l: ['江南好，风景旧曾谙。', '日出江花红胜火，春来江水绿如蓝。', '能不忆江南？'] },
        { t: '如梦令', a: '李清照', d: '宋', g: '5-6', l: ['常记溪亭日暮，沉醉不知归路。', '兴尽晚回舟，误入藕花深处。', '争渡，争渡，惊起一滩鸥鹭。'] },

        /* ---------- 初中（7-9） ---------- */
        { t: '观沧海', a: '曹操', d: '东汉', g: '7-9', l: ['东临碣石，以观沧海。水何澹澹，山岛竦峙。', '树木丛生，百草丰茂。秋风萧瑟，洪波涌起。', '日月之行，若出其中；星汉灿烂，若出其里。', '幸甚至哉，歌以咏志。'] },
        { t: '次北固山下', a: '王湾', d: '唐', g: '7-9', l: ['客路青山外，行舟绿水前。潮平两岸阔，风正一帆悬。', '海日生残夜，江春入旧年。乡书何处达？归雁洛阳边。'] },
        { t: '天净沙·秋思', a: '马致远', d: '元', g: '7-9', l: ['枯藤老树昏鸦，小桥流水人家，古道西风瘦马。', '夕阳西下，断肠人在天涯。'] },
        { t: '闻王昌龄左迁龙标遥有此寄', a: '李白', d: '唐', g: '7-9', l: ['杨花落尽子规啼，闻道龙标过五溪。', '我寄愁心与明月，随君直到夜郎西。'] },
        { t: '使至塞上', a: '王维', d: '唐', g: '7-9', l: ['单车欲问边，属国过居延。征蓬出汉塞，归雁入胡天。', '大漠孤烟直，长河落日圆。萧关逢候骑，都护在燕然。'] },
        { t: '望岳', a: '杜甫', d: '唐', g: '7-9', l: ['岱宗夫如何？齐鲁青未了。造化钟神秀，阴阳割昏晓。', '荡胸生曾云，决眦入归鸟。会当凌绝顶，一览众山小。'] },
        { t: '春望', a: '杜甫', d: '唐', g: '7-9', l: ['国破山河在，城春草木深。感时花溅泪，恨别鸟惊心。', '烽火连三月，家书抵万金。白头搔更短，浑欲不胜簪。'] },
        { t: '钱塘湖春行', a: '白居易', d: '唐', g: '7-9', l: ['孤山寺北贾亭西，水面初平云脚低。', '几处早莺争暖树，谁家新燕啄春泥。', '乱花渐欲迷人眼，浅草才能没马蹄。', '最爱湖东行不足，绿杨阴里白沙堤。'] },
        { t: '雁门太守行', a: '李贺', d: '唐', g: '7-9', l: ['黑云压城城欲摧，甲光向日金鳞开。', '角声满天秋色里，塞上燕脂凝夜紫。', '半卷红旗临易水，霜重鼓寒声不起。', '报君黄金台上意，提携玉龙为君死。'] },
        { t: '赤壁', a: '杜牧', d: '唐', g: '7-9', l: ['折戟沉沙铁未销，自将磨洗认前朝。', '东风不与周郎便，铜雀春深锁二乔。'] },
        { t: '渔家傲·秋思', a: '范仲淹', d: '宋', g: '7-9', l: ['塞下秋来风景异，衡阳雁去无留意。四面边声连角起，千嶂里，长烟落日孤城闭。', '浊酒一杯家万里，燕然未勒归无计。羌管悠悠霜满地，人不寐，将军白发征夫泪。'] },
        { t: '江城子·密州出猎', a: '苏轼', d: '宋', g: '7-9', l: ['老夫聊发少年狂，左牵黄，右擎苍，锦帽貂裘，千骑卷平冈。为报倾城随太守，亲射虎，看孙郎。', '酒酣胸胆尚开张，鬓微霜，又何妨！持节云中，何日遣冯唐？会挽雕弓如满月，西北望，射天狼。'] },
        { t: '破阵子·为陈同甫赋壮词以寄之', a: '辛弃疾', d: '宋', g: '7-9', l: ['醉里挑灯看剑，梦回吹角连营。八百里分麾下炙，五十弦翻塞外声。沙场秋点兵。', '马作的卢飞快，弓如霹雳弦惊。了却君王天下事，赢得生前身后名。可怜白发生！'] },
        { t: '卜算子·咏梅', a: '陆游', d: '宋', g: '7-9', l: ['驿外断桥边，寂寞开无主。已是黄昏独自愁，更著风和雨。', '无意苦争春，一任群芳妒。零落成泥碾作尘，只有香如故。'] },
        { t: '浣溪沙', a: '晏殊', d: '宋', g: '7-9', l: ['一曲新词酒一杯，去年天气旧亭台。夕阳西下几时回？', '无可奈何花落去，似曾相识燕归来。小园香径独徘徊。'] },
        { t: '水调歌头·明月几时有', a: '苏轼', d: '宋', g: '7-9', l: ['明月几时有？把酒问青天。不知天上宫阙，今夕是何年。', '我欲乘风归去，又恐琼楼玉宇，高处不胜寒。起舞弄清影，何似在人间。', '转朱阁，低绮户，照无眠。不应有恨，何事长向别时圆？', '人有悲欢离合，月有阴晴圆缺，此事古难全。但愿人长久，千里共婵娟。'] },
        { t: '饮酒（其五）', a: '陶渊明', d: '东晋', g: '7-9', l: ['结庐在人境，而无车马喧。问君何能尔？心远地自偏。', '采菊东篱下，悠然见南山。山气日夕佳，飞鸟相与还。', '此中有真意，欲辨已忘言。'] },
        { t: '行路难（其一）', a: '李白', d: '唐', g: '7-9', l: ['金樽清酒斗十千，玉盘珍羞直万钱。', '停杯投箸不能食，拔剑四顾心茫然。', '欲渡黄河冰塞川，将登太行雪满山。', '闲来垂钓碧溪上，忽复乘舟梦日边。', '行路难！行路难！多歧路，今安在？', '长风破浪会有时，直挂云帆济沧海。'] },
        { t: '酬乐天扬州初逢席上见赠', a: '刘禹锡', d: '唐', g: '7-9', l: ['巴山楚水凄凉地，二十三年弃置身。', '怀旧空吟闻笛赋，到乡翻似烂柯人。', '沉舟侧畔千帆过，病树前头万木春。', '今日听君歌一曲，暂凭杯酒长精神。'] },
        { t: '白雪歌送武判官归京（节选）', a: '岑参', d: '唐', g: '7-9', l: ['北风卷地白草折，胡天八月即飞雪。', '忽如一夜春风来，千树万树梨花开。'] },

        /* ---------- 初中补充（课本必背） ---------- */
        { t: '登幽州台歌', a: '陈子昂', d: '唐', g: '7-9', l: ['前不见古人，后不见来者。', '念天地之悠悠，独怆然而涕下。'] },
        { t: '竹里馆', a: '王维', d: '唐', g: '7-9', l: ['独坐幽篁里，弹琴复长啸。', '深林人不知，明月来相照。'] },
        { t: '春夜洛城闻笛', a: '李白', d: '唐', g: '7-9', l: ['谁家玉笛暗飞声，散入春风满洛城。', '此夜曲中闻折柳，何人不起故园情。'] },
        { t: '逢入京使', a: '岑参', d: '唐', g: '7-9', l: ['故园东望路漫漫，双袖龙钟泪不干。', '马上相逢无纸笔，凭君传语报平安。'] },
        { t: '晚春', a: '韩愈', d: '唐', g: '7-9', l: ['草树知春不久归，百般红紫斗芳菲。', '杨花榆荚无才思，惟解漫天作雪飞。'] },
        { t: '峨眉山月歌', a: '李白', d: '唐', g: '7-9', l: ['峨眉山月半轮秋，影入平羌江水流。', '夜发清溪向三峡，思君不见下渝州。'] },
        { t: '江南逢李龟年', a: '杜甫', d: '唐', g: '7-9', l: ['岐王宅里寻常见，崔九堂前几度闻。', '正是江南好风景，落花时节又逢君。'] },
        { t: '行军九日思长安故园', a: '岑参', d: '唐', g: '7-9', l: ['强欲登高去，无人送酒来。', '遥怜故园菊，应傍战场开。'] },
        { t: '夜上受降城闻笛', a: '李益', d: '唐', g: '7-9', l: ['回乐烽前沙似雪，受降城外月如霜。', '不知何处吹芦管，一夜征人尽望乡。'] },
        { t: '秋词（其一）', a: '刘禹锡', d: '唐', g: '7-9', l: ['自古逢秋悲寂寥，我言秋日胜春朝。', '晴空一鹤排云上，便引诗情到碧霄。'] },
        { t: '夜雨寄北', a: '李商隐', d: '唐', g: '7-9', l: ['君问归期未有期，巴山夜雨涨秋池。', '何当共剪西窗烛，却话巴山夜雨时。'] },
        { t: '十一月四日风雨大作（其二）', a: '陆游', d: '宋', g: '7-9', l: ['僵卧孤村不自哀，尚思为国戍轮台。', '夜阑卧听风吹雨，铁马冰河入梦来。'] },
        { t: '潼关', a: '谭嗣同', d: '清', g: '7-9', l: ['终古高云簇此城，秋风吹散马蹄声。', '河流大野犹嫌束，山入潼关不解平。'] },
        { t: '约客', a: '赵师秀', d: '宋', g: '7-9', l: ['黄梅时节家家雨，青草池塘处处蛙。', '有约不来过夜半，闲敲棋子落灯花。'] },
        { t: '野望', a: '王绩', d: '唐', g: '7-9', l: ['东皋薄暮望，徙倚欲何依。树树皆秋色，山山唯落晖。', '牧人驱犊返，猎马带禽归。相顾无相识，长歌怀采薇。'] },
        { t: '黄鹤楼', a: '崔颢', d: '唐', g: '7-9', l: ['昔人已乘黄鹤去，此地空余黄鹤楼。', '黄鹤一去不复返，白云千载空悠悠。', '晴川历历汉阳树，芳草萋萋鹦鹉洲。', '日暮乡关何处是？烟波江上使人愁。'] },
        { t: '渡荆门送别', a: '李白', d: '唐', g: '7-9', l: ['渡远荆门外，来从楚国游。山随平野尽，江入大荒流。', '月下飞天镜，云生结海楼。仍怜故乡水，万里送行舟。'] },
        { t: '龟虽寿', a: '曹操', d: '东汉', g: '7-9', l: ['神龟虽寿，犹有竟时。腾蛇乘雾，终为土灰。', '老骥伏枥，志在千里；烈士暮年，壮心不已。', '盈缩之期，不但在天；养怡之福，可得永年。', '幸甚至哉，歌以咏志。'] },
        { t: '赠从弟（其二）', a: '刘桢', d: '东汉', g: '7-9', l: ['亭亭山上松，瑟瑟谷中风。风声一何盛，松枝一何劲！', '冰霜正惨凄，终岁常端正。岂不罹凝寒？松柏有本性。'] },
        { t: '送杜少府之任蜀州', a: '王勃', d: '唐', g: '7-9', l: ['城阙辅三秦，风烟望五津。与君离别意，同是宦游人。', '海内存知己，天涯若比邻。无为在歧路，儿女共沾巾。'] },
        { t: '题破山寺后禅院', a: '常建', d: '唐', g: '7-9', l: ['清晨入古寺，初日照高林。曲径通幽处，禅房花木深。', '山光悦鸟性，潭影空人心。万籁此都寂，但余钟磬音。'] },
        { t: '送友人', a: '李白', d: '唐', g: '7-9', l: ['青山横北郭，白水绕东城。此地一为别，孤蓬万里征。', '浮云游子意，落日故人情。挥手自兹去，萧萧班马鸣。'] },
        { t: '过零丁洋', a: '文天祥', d: '宋', g: '7-9', l: ['辛苦遭逢起一经，干戈寥落四周星。', '山河破碎风飘絮，身世浮沉雨打萍。', '惶恐滩头说惶恐，零丁洋里叹零丁。', '人生自古谁无死？留取丹心照汗青。'] },
        { t: '山坡羊·潼关怀古', a: '张养浩', d: '元', g: '7-9', l: ['峰峦如聚，波涛如怒，山河表里潼关路。', '望西都，意踌躇。伤心秦汉经行处，宫阙万间都做了土。', '兴，百姓苦；亡，百姓苦。'] },
        { t: '南乡子·登京口北固亭有怀', a: '辛弃疾', d: '宋', g: '7-9', l: ['何处望神州？满眼风光北固楼。千古兴亡多少事？悠悠。不尽长江滚滚流。', '年少万兜鍪，坐断东南战未休。天下英雄谁敌手？曹刘。生子当如孙仲谋。'] },
        { t: '月夜忆舍弟', a: '杜甫', d: '唐', g: '7-9', l: ['戍鼓断人行，边秋一雁声。露从今夜白，月是故乡明。', '有弟皆分散，无家问死生。寄书长不达，况乃未休兵。'] },
        { t: '商山早行', a: '温庭筠', d: '唐', g: '7-9', l: ['晨起动征铎，客行悲故乡。鸡声茅店月，人迹板桥霜。', '槲叶落山路，枳花明驿墙。因思杜陵梦，凫雁满回塘。'] },
        { t: '无题（相见时难别亦难）', a: '李商隐', d: '唐', g: '7-9', l: ['相见时难别亦难，东风无力百花残。', '春蚕到死丝方尽，蜡炬成灰泪始干。', '晓镜但愁云鬓改，夜吟应觉月光寒。', '蓬山此去无多路，青鸟殷勤为探看。'] },
        { t: '卜算子·黄州定慧院寓居作', a: '苏轼', d: '宋', g: '7-9', l: ['缺月挂疏桐，漏断人初静。谁见幽人独往来，缥缈孤鸿影。', '惊起却回头，有恨无人省。拣尽寒枝不肯栖，寂寞沙洲冷。'] },
        { t: '木兰诗（节选）', a: '北朝民歌', d: '北朝', g: '7-9', l: ['唧唧复唧唧，木兰当户织。不闻机杼声，惟闻女叹息。', '问女何所思，问女何所忆。女亦无所思，女亦无所忆。', '昨夜见军帖，可汗大点兵。军书十二卷，卷卷有爷名。', '阿爷无大儿，木兰无长兄。愿为市鞍马，从此替爷征。', '东市买骏马，西市买鞍鞯，南市买辔头，北市买长鞭。', '旦辞爷娘去，暮宿黄河边。不闻爷娘唤女声，但闻黄河流水鸣溅溅。', '万里赴戎机，关山度若飞。朔气传金柝，寒光照铁衣。', '将军百战死，壮士十年归。', '雄兔脚扑朔，雌兔眼迷离；双兔傍地走，安能辨我是雄雌？'] },

        /* ---------- 高中（课本必背） ---------- */
        { t: '短歌行（节选）', a: '曹操', d: '东汉', g: '10-12', l: ['对酒当歌，人生几何！譬如朝露，去日苦多。', '慨当以慷，忧思难忘。何以解忧？唯有杜康。', '青青子衿，悠悠我心。但为君故，沉吟至今。', '呦呦鹿鸣，食野之苹。我有嘉宾，鼓瑟吹笙。', '月明星稀，乌鹊南飞。绕树三匝，何枝可依？', '山不厌高，海不厌深。周公吐哺，天下归心。'] },
        { t: '归园田居（其一）', a: '陶渊明', d: '东晋', g: '10-12', l: ['少无适俗韵，性本爱丘山。误落尘网中，一去三十年。', '羁鸟恋旧林，池鱼思故渊。开荒南野际，守拙归园田。', '方宅十余亩，草屋八九间。榆柳荫后檐，桃李罗堂前。', '暧暧远人村，依依墟里烟。狗吠深巷中，鸡鸣桑树颠。', '户庭无尘杂，虚室有余闲。久在樊笼里，复得返自然。'] },
        { t: '登高', a: '杜甫', d: '唐', g: '10-12', l: ['风急天高猿啸哀，渚清沙白鸟飞回。', '无边落木萧萧下，不尽长江滚滚来。', '万里悲秋常作客，百年多病独登台。', '艰难苦恨繁霜鬓，潦倒新停浊酒杯。'] },
        { t: '念奴娇·赤壁怀古', a: '苏轼', d: '宋', g: '10-12', l: ['大江东去，浪淘尽，千古风流人物。故垒西边，人道是，三国周郎赤壁。', '乱石穿空，惊涛拍岸，卷起千堆雪。江山如画，一时多少豪杰。', '遥想公瑾当年，小乔初嫁了，雄姿英发。羽扇纶巾，谈笑间，樯橹灰飞烟灭。', '故国神游，多情应笑我，早生华发。人生如梦，一尊还酹江月。'] },
        { t: '永遇乐·京口北固亭怀古', a: '辛弃疾', d: '宋', g: '10-12', l: ['千古江山，英雄无觅，孙仲谋处。舞榭歌台，风流总被，雨打风吹去。', '斜阳草树，寻常巷陌，人道寄奴曾住。想当年，金戈铁马，气吞万里如虎。', '元嘉草草，封狼居胥，赢得仓皇北顾。四十三年，望中犹记，烽火扬州路。', '可堪回首，佛狸祠下，一片神鸦社鼓。凭谁问：廉颇老矣，尚能饭否？'] },
        { t: '声声慢', a: '李清照', d: '宋', g: '10-12', l: ['寻寻觅觅，冷冷清清，凄凄惨惨戚戚。', '乍暖还寒时候，最难将息。三杯两盏淡酒，怎敌他、晚来风急？', '雁过也，正伤心，却是旧时相识。', '满地黄花堆积。憔悴损，如今有谁堪摘？', '守着窗儿，独自怎生得黑？梧桐更兼细雨，到黄昏、点点滴滴。', '这次第，怎一个愁字了得！'] },
        { t: '锦瑟', a: '李商隐', d: '唐', g: '10-12', l: ['锦瑟无端五十弦，一弦一柱思华年。', '庄生晓梦迷蝴蝶，望帝春心托杜鹃。', '沧海月明珠有泪，蓝田日暖玉生烟。', '此情可待成追忆？只是当时已惘然。'] },
        { t: '书愤', a: '陆游', d: '宋', g: '10-12', l: ['早岁那知世事艰，中原北望气如山。', '楼船夜雪瓜洲渡，铁马秋风大散关。', '塞上长城空自许，镜中衰鬓已先斑。', '出师一表真名世，千载谁堪伯仲间！'] },
        { t: '静女', a: '《诗经》', d: '先秦', g: '10-12', l: ['静女其姝，俟我于城隅。爱而不见，搔首踟蹰。', '静女其娈，贻我彤管。彤管有炜，说怿女美。', '自牧归荑，洵美且异。匪女之为美，美人之贻。'] },
        { t: '客至', a: '杜甫', d: '唐', g: '10-12', l: ['舍南舍北皆春水，但见群鸥日日来。', '花径不曾缘客扫，蓬门今始为君开。', '盘飧市远无兼味，樽酒家贫只旧醅。', '肯与邻翁相对饮，隔篱呼取尽余杯。'] },
        { t: '将进酒（节选）', a: '李白', d: '唐', g: '10-12', l: ['君不见，黄河之水天上来，奔流到海不复回。', '君不见，高堂明镜悲白发，朝如青丝暮成雪。', '人生得意须尽欢，莫使金樽空对月。', '天生我材必有用，千金散尽还复来。', '古来圣贤皆寂寞，惟有饮者留其名。', '五花马，千金裘，呼儿将出换美酒，与尔同销万古愁。'] }
    ];

    /* ============================================================
       作者简介（按作者名索引，覆盖数据中出现的全部作者）
       ============================================================ */
    var AUTHOR_INFO = {
        '李白': '李白（701—762），字太白，号青莲居士，唐代伟大的浪漫主义诗人，被后人尊为「诗仙」。想象奇特、语言奔放，代表作《静夜思》《将进酒》《蜀道难》。',
        '杜甫': '杜甫（712—770），字子美，自号少陵野老，唐代伟大的现实主义诗人，被尊为「诗圣」。诗风沉郁顿挫，被称作「诗史」，代表作「三吏」「三别」、《春望》《登高》。',
        '苏轼': '苏轼（1037—1101），字子瞻，号东坡居士，北宋文学家、书画家，「唐宋八大家」之一。诗、词、文、书、画皆精，豪放词的开创者，代表作《念奴娇·赤壁怀古》《水调歌头》。',
        '辛弃疾': '辛弃疾（1140—1207），字幼安，号稼轩，南宋豪放派词人、爱国将领。一生力主抗金，词风雄浑悲壮，与苏轼并称「苏辛」。',
        '李清照': '李清照（1084—约1155），号易安居士，宋代婉约派女词人。前期词风清新明丽，南渡后转为凄婉深沉，代表作《如梦令》《声声慢》。',
        '白居易': '白居易（772—846），字乐天，号香山居士，唐代诗人，新乐府运动的倡导者。主张「文章合为时而著」，语言平易通俗，代表作《长恨歌》《琵琶行》。',
        '杜牧': '杜牧（803—852），字牧之，唐代诗人，与李商隐并称「小李杜」。诗风俊爽清丽，尤擅七绝。',
        '李商隐': '李商隐（约813—约858），字义山，号玉溪生，唐代诗人，与杜牧并称「小李杜」。诗风深情绵邈，无题诗尤为著名。',
        '王安石': '王安石（1021—1086），字介甫，号半山，北宋政治家、文学家，「唐宋八大家」之一。主持熙宁变法，诗文刚健峭拔。',
        '王维': '王维（701—761），字摩诘，唐代诗人、画家，世称「诗佛」。苏轼评其「诗中有画，画中有诗」，山水田园诗成就极高。',
        '孟浩然': '孟浩然（689—740），襄阳人，唐代山水田园诗人，与王维并称「王孟」。诗风清淡自然，多写田园与旅思。',
        '柳永': '柳永（约987—约1053），原名三变，字耆卿，北宋词人，婉约派代表。大量创作慢词，代表作《雨霖铃》《望海潮》。',
        '陶渊明': '陶渊明（约365—427），名潜，字元亮，世称靖节先生，东晋田园诗派的开创者。不为五斗米折腰，代表作《归园田居》《饮酒》。',
        '曹操': '曹操（155—220），字孟德，东汉末年政治家、军事家、诗人，「建安风骨」的代表。诗风慷慨悲凉、气魄雄浑，代表作《观沧海》《短歌行》。',
        '曹植': '曹植（192—232），字子建，曹操之子，三国时期文学家。钟嵘称其「骨气奇高，词采华茂」，代表作《洛神赋》《白马篇》。',
        '刘桢': '刘桢（?—217），字公干，「建安七子」之一。诗风刚劲挺拔，与曹植并称「曹刘」。',
        '王勃': '王勃（650—676），字子安，「初唐四杰」之首。少年才俊，代表作《送杜少府之任蜀州》《滕王阁序》。',
        '常建': '常建（生卒年不详），唐代诗人，开元年间进士。诗风清幽淡远，以山水田园见长。',
        '崔颢': '崔颢（约704—754），唐代诗人。早期诗风浮艳，后期雄浑奔放，以《黄鹤楼》最负盛名。',
        '陈子昂': '陈子昂（659—700），字伯玉，唐代文学家，初唐诗文革新的人物。主张恢复汉魏风骨，代表作《登幽州台歌》。',
        '岑参': '岑参（约715—770），唐代边塞诗人，与高适并称「高岑」。诗风奇峭壮丽，尤擅描写边塞风光与军旅生活。',
        '韩愈': '韩愈（768—824），字退之，世称韩昌黎，唐代文学家，「唐宋八大家」之首。倡导古文运动，诗风奇特雄健。',
        '刘禹锡': '刘禹锡（772—842），字梦得，唐代文学家，有「诗豪」之称。诗风简练明快，代表作《陋室铭》《秋词》。',
        '陆游': '陆游（1125—1210），字务观，号放翁，南宋爱国诗人。一生不忘收复中原，存诗九千余首，是中国古代存诗最多的诗人。',
        '赵师秀': '赵师秀（1170—1219），字紫芝，号灵秀，南宋「永嘉四灵」之一。诗风清瘦野逸，多写山水与闲居。',
        '王绩': '王绩（约589—644），字无功，号东皋子，初唐诗人。性简傲、嗜酒能诗，五言律诗的开创者之一。',
        '李益': '李益（748—约829），字君虞，唐代诗人，以边塞诗著称，尤擅七绝，写征人思乡最为动人。',
        '文天祥': '文天祥（1236—1283），字履善，号文山，南宋抗元名臣、文学家。兵败被俘后坚贞不屈，代表作《过零丁洋》《正气歌》。',
        '张养浩': '张养浩（1270—1329），字希孟，号云庄，元代散曲家。代表作《山坡羊·潼关怀古》，关心民瘼、笔力沉厚。',
        '温庭筠': '温庭筠（约812—866），字飞卿，唐代诗人、词人，花间词派的鼻祖。辞藻华丽、音律婉转，与李商隐并称「温李」。',
        '谭嗣同': '谭嗣同（1865—1898），字复生，号壮飞，清末维新派志士、诗人。「戊戌六君子」之一，慷慨就义前留下「我自横刀向天笑」。',
        '骆宾王': '骆宾王（约619—约687），「初唐四杰」之一。七岁能诗，相传《咏鹅》即其儿时所作。',
        '李绅': '李绅（772—846），字公垂，唐代诗人，新乐府运动的参与者。以《悯农》二首著称，一句「粒粒皆辛苦」家喻户晓。',
        '王之涣': '王之涣（688—742），字季凌，唐代边塞诗人。存诗仅六首，却以《登鹳雀楼》《凉州词》名垂千古。',
        '李峤': '李峤（644—713），字巨山，唐代诗人，与苏味道并称「苏李」，曾三度拜相。',
        '高适': '高适（约704—765），字达夫，唐代边塞诗人，与岑参并称「高岑」。诗风雄浑质朴，代表作《燕歌行》《别董大》。',
        '张籍': '张籍（约766—约830），字文昌，唐代诗人。乐府诗成就突出，与王建并称「张王」，语言凝练平易。',
        '纳兰性德': '纳兰性德（1655—1685），字容若，清代词人。词风清丽哀婉，被誉为「清代第一词人」，代表作《饮水词》。',
        '王昌龄': '王昌龄（698—757），字少伯，唐代边塞诗人，有「七绝圣手」「诗家夫子」之称，代表作《出塞》《芙蓉楼送辛渐》。',
        '王翰': '王翰（生卒年不详），字子羽，唐代诗人。性格豪放，以《凉州词》知名。',
        '贺知章': '贺知章（约659—约744），字季真，号四明狂客，唐代诗人、书法家。与李白交好，称李白为「谪仙人」。',
        '袁枚': '袁枚（1716—1797），字子才，号简斋，清代诗人、散文家。主张「性灵说」，强调写真情与个性。',
        '杨万里': '杨万里（1127—1206），字廷秀，号诚斋，南宋诗人，「中兴四大诗人」之一。创「诚斋体」，风格活泼自然、多写童趣。',
        '叶绍翁': '叶绍翁（生卒年不详），字嗣宗，号靖逸，南宋江湖派诗人。代表作《游园不值》《夜书所见》。',
        '贾岛': '贾岛（779—843），字浪仙，唐代诗人，「苦吟诗人」的代表，「推敲」的故事即出自他，与孟郊并称「郊寒岛瘦」。',
        '高鼎': '高鼎（生卒年不详），清代后期诗人。以《村居》知名，善于捕捉儿童生活的天真情趣。',
        '朱熹': '朱熹（1130—1200），字元晦，号晦庵，南宋理学家、教育家、诗人。理学的集大成者，诗作多含哲理。',
        '于谦': '于谦（1398—1457），字廷益，号节庵，明代政治家、军事家、诗人。北京保卫战的指挥者，以《石灰吟》明志。',
        '郑燮': '郑燮（1693—1765），字克柔，号板桥，清代书画家、文学家，「扬州八怪」之一。擅画竹石，诗书画号称「三绝」。',
        '龚自珍': '龚自珍（1792—1841），字璱人，号定盦，清代思想家、文学家。主张革新，诗文纵横奇肆，是近代思想启蒙的先驱。',
        '马致远': '马致远（约1250—约1321），号东篱，元代戏曲家、散曲家，「元曲四大家」之一。代表作《天净沙·秋思》《汉宫秋》。',
        '王湾': '王湾（生卒年不详），唐代诗人。以《次北固山下》著名，「海日生残夜，江春入旧年」被誉为千古名句。',
        '范仲淹': '范仲淹（989—1052），字希文，北宋政治家、文学家。主持庆历新政，代表作《岳阳楼记》《渔家傲·秋思》，以「先天下之忧而忧」名世。',
        '晏殊': '晏殊（991—1055），字同叔，北宋词人，婉约派代表。词风闲雅有情思，代表作《浣溪沙》《蝶恋花》。',
        '范成大': '范成大（1126—1193），字致能，号石湖居士，南宋诗人，「中兴四大诗人」之一。晚年所作《四时田园杂兴》是田园诗的集大成之作。',
        '曾几': '曾几（1084—1166），字吉甫，号茶山居士，南宋诗人。陆游曾从其学诗，诗风清淡自然。',
        '卢梅坡': '卢梅坡（生卒年不详），南宋诗人。以《雪梅》知名，「梅须逊雪三分白，雪却输梅一段香」流传甚广。',
        '张志和': '张志和（约730—约810），字子同，号烟波钓徒，唐代词人。代表作《渔歌子》，开文人写渔隐之先声。',
        '韦应物': '韦应物（737—约792），唐代诗人，山水田园诗派代表。诗风恬淡高远，「韦柳」并称。',
        '《诗经》': '《诗经》是我国最早的诗歌总集，收录西周初年至春秋中期的诗歌 305 篇，分风、雅、颂三部分。「风」多为各地民歌，语言质朴，常用赋、比、兴手法。',
        '北朝民歌': '南北朝时期北方地区的民间歌谣，风格刚健质朴、豪迈直率，代表作《木兰诗》《敕勒歌》。',
        '汉乐府': '汉乐府原指汉代掌管音乐的官署，后指其采集与演唱的诗歌。多反映社会现实与民间生活，代表作《江南》《长歌行》《陌上桑》。'
    };

            app: '写「花径不扫、蓬门今开」的郑重与「盘飧无兼味」的歉意，家常话里见真挚情谊。'

        '将进酒（节选）': {
            bg: '约作于天宝十一载（752），李白与友人岑勋、元丹丘在嵩山饮宴时所作，借酒抒怀。',
            notes: [['将进酒', '请饮酒（汉乐府旧题）'], ['会须', '应当'], ['馔玉', '精美的食物'], ['销', '消解']],
            app: '开篇两个「君不见」以黄河与白发写光阴之速，中间在狂放中透出「天生我材必有用」的自信，末句以「万古愁」收束，气势磅礴。'
        }
    };
    var MODES = ['all', 'step', 'hide'];

    /* ============ 小工具 ============ */

    function clampInt(value, lo, hi, fallback) {
        var n = Math.round(Number(value));
        if (!isFinite(n)) { return fallback; }
        return Math.max(lo, Math.min(hi, n));
    }

    function eraOf(d) {
        if (d === '唐') { return '唐'; }
        if (d === '宋') { return '宋'; }
        if (d === '先秦' || d === '汉' || d === '东汉' || d === '东晋' || d === '北朝') { return '先秦汉魏'; }
        return '元明清';
    }

    function pick(list, value, fallback) {
        return list.indexOf(value) !== -1 ? value : fallback;
    }

    /* ============ 状态 ============ */

    var favorites = store.get('favorites', []);
    if (!Array.isArray(favorites)) { favorites = []; }

    var savedIdx = Math.round(Number(store.get('idx', 0)));
    if (!isFinite(savedIdx) || savedIdx < 0) { savedIdx = 0; }

    var state = {
        idx: savedIdx,
        grade: pick(GRADES, store.get('grade', '全部'), '全部'),
        era: pick(ERAS, store.get('era', '全部'), '全部'),
        mode: pick(MODES, store.get('mode', 'all'), 'all'),
        reveal: 0,
        query: '',
        favOnly: store.get('favOnly', false) === true,
        bigFont: store.get('bigFont', false) === true,
        rate: pick([0.7, 0.9, 1.1], Number(store.get('rate', 0.9)), 0.9),
        favorites: favorites
    };

    var canSpeak = typeof window.speechSynthesis !== 'undefined'
        && typeof window.SpeechSynthesisUtterance === 'function';

    var lastLine = 0;

    function speak(text) {
        if (!canSpeak) { return; }
        try {
            window.speechSynthesis.cancel();
            var u = new window.SpeechSynthesisUtterance(text);
            u.lang = 'zh-CN';
            u.rate = state.rate;
            window.speechSynthesis.speak(u);
        } catch (err) { /* 无中文语音包：静默 */ }
    }

    var chrome = ET.Chrome.mount({
        toolId: TOOL_ID,
        title: '古诗词卡片',
        sub: '语文 · ' + POEMS.length + ' 首必背古诗词 · 含作者与注释',
        accent: '#dc2626',
        status: '就绪',
        sound: true,
        primary: advance,       /* 翻页笔下页键：揭晓 / 下一句 / 下一首 */
        secondary: prevPoem,    /* 翻页笔上页键：上一首 */
        settings: { title: '诗词卡设置', build: buildSettings },
        help: '<div style="font-size:13.5px;line-height:2">' +
            '<p style="margin:0 0 8px"><b>怎么用</b>：卡面大字显示诗题、朝代作者与诗文，适合投屏齐诵。内置 <b>121 首</b>中小学必背篇目，按小学低 / 中 / 高年级、初中、高中标注学段。</p>' +
            '<p style="margin:0 0 8px"><b>三种显示模式</b>：全显（整首呈现）／逐句（按空格一句一句揭晓，适合带读与抽背）／隐藏（只留诗题，学生先背，按空格揭晓全诗）。</p>' +
            '<p style="margin:0 0 8px"><b>作者与注释</b>：点「作者与注释」（或按 I）查看<b>作者简介</b>、<b>创作背景</b>、<b>诗中词语注释</b>与<b>主旨赏析</b>。内置了数据中全部 60 余位作者的简介；课本高频重点篇目还补充了背景、注释与赏析，卡面底部会提示「含背景与注释」。</p>' +
            '<p style="margin:0 0 8px"><b>找诗</b>：顶部可按学段、朝代筛选，也可直接搜索诗题、作者或诗句中的字词。</p>' +
            '<p style="margin:0 0 8px"><b>收藏</b>：点「收藏」把常讲的诗挑出来，再点「收藏 N」只看收藏篇目（适合备课与复习专题）。</p>' +
            '<p style="margin:0 0 8px"><b>朗读</b>：点「朗读」用系统语音读出整首（需系统装有中文语音包，没有则不出声）。</p>' +
            '<p style="margin:0"><b>快捷键</b>：空格 = 揭晓 / 下一句 / 下一首；←→ = 上一首 / 下一首；R = 随机一首；F = 收藏；I = 作者与注释；H = 隐藏 / 显示；翻页笔上下页键同效。</p></div>'
    });

    /* ============ 数据筛选 ============ */

    function list() {
        var out = [];
        var kw = state.query.replace(/^\s+|\s+$/g, '').toLowerCase();
        for (var i = 0; i < POEMS.length; i++) {
            var p = POEMS[i];
            if (state.grade !== '全部' && p.g !== state.grade) { continue; }
            if (state.era !== '全部' && eraOf(p.d) !== state.era) { continue; }
            if (state.favOnly && state.favorites.indexOf(p.t) === -1) { continue; }
            if (kw) {
                var hay = (p.t + ' ' + p.a + ' ' + p.d + ' ' + p.l.join('')).toLowerCase();
                if (hay.indexOf(kw) === -1) { continue; }
            }
            out.push(p);
        }
        return out;
    }

    function current(arr) {
        if (!arr.length) { return null; }
        if (state.idx < 0) { state.idx = arr.length - 1; }
        if (state.idx >= arr.length) { state.idx = 0; }
        return arr[state.idx];
    }

    /* ============ 渲染 ============ */

    function renderLines(poem) {
        var box = document.getElementById('poemLines');
        box.textContent = '';

        if (state.mode === 'hide') {
            var blank = document.createElement('div');
            blank.className = 'pc-blank';
            blank.textContent = '诗文已隐藏 · 按空格或点「全显」揭晓';
            box.appendChild(blank);
            return;
        }

        var shown = state.mode === 'step' ? Math.min(state.reveal, poem.l.length) : poem.l.length;
        for (var i = 0; i < shown; i++) {
            var line = document.createElement('div');
            line.className = 'pc-line' + (i === lastLine ? ' is-new' : '');
            line.textContent = poem.l[i];
            box.appendChild(line);
        }

        if (state.mode === 'step' && shown < poem.l.length) {
            var hint = document.createElement('div');
            hint.className = 'pc-card__foot';
            hint.style.borderTop = '0';
            hint.style.paddingTop = '4px';
            hint.textContent = '还有 ' + (poem.l.length - shown) + ' 句 · 按空格继续';
            box.appendChild(hint);
        }
    }

    function render() {
        var arr = list();
        var poem = current(arr);
        var title = document.getElementById('poemTitle');
        var meta = document.getElementById('poemMeta');
        var foot = document.getElementById('poemFoot');
        var card = document.getElementById('card');

        card.classList.toggle('pc-card--big', state.bigFont);
        foot.className = 'pc-card__foot';
        document.getElementById('count').textContent = arr.length
            ? (state.idx + 1) + ' / ' + arr.length
            : '0 / 0';

        if (!poem) {
            title.textContent = '没有符合条件的诗词';
            meta.textContent = '';
            document.getElementById('poemLines').textContent = '';
            foot.textContent = '试试切换学段 / 朝代，或清空搜索词与收藏筛选。';
        } else {
            title.textContent = poem.t;
            meta.textContent = poem.d + ' · ' + poem.a;
            renderLines(poem);
            var isFav = state.favorites.indexOf(poem.t) !== -1;
            var tail = hasExtra(poem) ? ' · 含背景与注释（按 I）' : ' · 按 I 看作者简介';
            foot.textContent = (isFav ? '★ 已收藏' : '按 F 收藏') +
                ' · 共 ' + poem.l.length + ' 句 · ' + GRADE_LABEL[poem.g] + tail;
            foot.className = 'pc-card__foot' + (isFav ? ' pc-star' : '');
        }

        /* 顶部控件状态 */
        markActive('segGrade', 'data-grade', state.grade);
        markActive('segEra', 'data-era', state.era);
        markActive('segMode', 'data-mode', state.mode);

        var favBtn = document.getElementById('btnFav');
        document.getElementById('btnFavText').textContent = '收藏 ' + state.favorites.length;
        favBtn.classList.toggle('et-btn--primary', state.favOnly);

        var starText = document.getElementById('btnStarText');
        var starred = poem && state.favorites.indexOf(poem.t) !== -1;
        starText.textContent = starred ? '已收藏' : '收藏';
        document.getElementById('btnStar').classList.toggle('et-btn--primary', !!starred);

        var modeText = state.mode === 'all' ? '全显' : (state.mode === 'step' ? '逐句' : '隐藏');
        var status = arr.length ? ('第 ' + (state.idx + 1) + '/' + arr.length + ' 首 · ' + modeText) : '无匹配结果';
        if (poem) { status += ' · ' + poem.d + ' ' + poem.a; }
        chrome.setStatus(status);
    }

    function markActive(boxId, attr, value) {
        var box = document.getElementById(boxId);
        var btns = box.querySelectorAll('button');
        for (var i = 0; i < btns.length; i++) {
            btns[i].classList.toggle('is-active', btns[i].getAttribute(attr) === value);
        }
    }

    /* ============ 行为 ============ */

    function save() {
        store.set('idx', state.idx);
        store.set('grade', state.grade);
        store.set('era', state.era);
        store.set('mode', state.mode);
        store.set('favOnly', state.favOnly);
        store.set('bigFont', state.bigFont);
        store.set('rate', state.rate);
        store.set('favorites', state.favorites);
    }

    function advance() {
        var arr = list();
        var poem = current(arr);
        if (!poem) {
            chrome.beep('err');
            chrome.toast('当前筛选下没有诗词', 'warn');
            return;
        }

        if (state.mode === 'hide') {
            state.mode = 'all';
            lastLine = -1;
            chrome.beep('ok');
        } else if (state.mode === 'step') {
            if (state.reveal < poem.l.length) {
                lastLine = state.reveal;
                state.reveal++;
                chrome.beep('tick');
            } else {
                nextPoem();
                return;
            }
        } else {
            nextPoem();
            return;
        }
        render();
        save();
    }

    function nextPoem() {
        state.idx++;
        state.reveal = 0;
        lastLine = -1;
        render();
        save();
        chrome.beep('tick');
    }

    function prevPoem() {
        state.idx--;
        state.reveal = 0;
        lastLine = -1;
        render();
        save();
        chrome.beep('tick');
    }

    function randomPoem() {
        var arr = list();
        if (!arr.length) { return; }
        if (arr.length > 1) {
            var next = state.idx;
            while (next === state.idx) {
                next = Math.floor(Math.random() * arr.length);
            }
            state.idx = next;
        }
        state.reveal = 0;
        lastLine = -1;
        render();
        save();
        chrome.beep('win');
    }

    function toggleStar() {
        var arr = list();
        var poem = current(arr);
        if (!poem) { return; }
        var i = state.favorites.indexOf(poem.t);
        if (i === -1) {
            state.favorites.push(poem.t);
            chrome.beep('ok');
            chrome.toast('已收藏《' + poem.t + '》');
        } else {
            state.favorites.splice(i, 1);
            chrome.beep('tick');
            chrome.toast('已取消收藏《' + poem.t + '》');
        }
        save();
        render();
    }

    function readAloud() {
        var arr = list();
        var poem = current(arr);
        if (!poem) { return; }
        if (!canSpeak) {
            chrome.toast('当前浏览器不支持语音朗读', 'warn');
            return;
        }
        speak(poem.t + '，' + poem.a + '。' + poem.l.join(''));
        chrome.toast('正在朗读《' + poem.t + '》');
    }

    /* ============ 作者简介 / 创作背景 / 注释 ============ */

    function hasExtra(poem) {
        var ex = POEM_EXTRA[poem.t];
        return !!(ex && (ex.bg || ex.app || (ex.notes && ex.notes.length)));
    }

    function openInfo() {
        var arr = list();
        var poem = current(arr);
        if (!poem) { return; }

        var extra = POEM_EXTRA[poem.t] || {};
        var box = document.createElement('div');
        box.className = 'pc-info';

        function section(title, text) {
            if (!text) { return; }
            var h = document.createElement('div');
            h.className = 'pc-info__sec';
            h.textContent = title;
            box.appendChild(h);
            var p = document.createElement('p');
            p.className = 'pc-info__text';
            p.textContent = text;
            box.appendChild(p);
        }

        section('作者简介', AUTHOR_INFO[poem.a] || (poem.d + '·' + poem.a + '——本机数据暂未收录该作者简介。'));

        section('创作背景', extra.bg);

        if (extra.notes && extra.notes.length) {
            var h = document.createElement('div');
            h.className = 'pc-info__sec';
            h.textContent = '诗中词语注释';
            box.appendChild(h);
            var dl = document.createElement('dl');
            dl.className = 'pc-info__dl';
            for (var i = 0; i < extra.notes.length; i++) {
                var dt = document.createElement('dt');
                dt.textContent = extra.notes[i][0];
                var dd = document.createElement('dd');
                dd.textContent = extra.notes[i][1];
                dl.appendChild(dt);
                dl.appendChild(dd);
            }
            box.appendChild(dl);
        }

        section('主旨与赏析', extra.app);

        var tip = document.createElement('p');
        tip.className = 'pc-info__note';
        tip.textContent = hasExtra(poem)
            ? '本篇已收录创作背景、词语注释与主旨赏析。'
            : '本篇当前只收录作者简介；常用重点篇目（小学到高中课本高频篇目）已补充创作背景、注释与赏析，其余篇目可自行对照教辅补充。';
        box.appendChild(tip);

        chrome.modal({
            title: poem.t + ' · ' + poem.d + ' ' + poem.a,
            icon: 'i-info',
            size: 'wide',
            body: box,
            buttons: [{ label: '知道了', primary: true }]
        });
    }

    function setMode(mode) {
        state.mode = pick(MODES, mode, 'all');
        state.reveal = 0;
        lastLine = -1;
        render();
        save();
        chrome.beep('tick');
    }

    /* ============ 设置抽屉 ============ */

    function buildSettings(body) {
        function heading(text) {
            var h = document.createElement('h4');
            h.textContent = text;
            body.appendChild(h);
        }

        function switchRow(label, checked, onChange) {
            var row = document.createElement('label');
            row.className = 'et-drawer__switch';
            row.appendChild(document.createTextNode(label));
            var cb = document.createElement('input');
            cb.type = 'checkbox';
            cb.checked = checked;
            cb.addEventListener('change', function () { onChange(cb.checked); });
            row.appendChild(cb);
            body.appendChild(row);
        }

        heading('显示');
        switchRow('大字模式（后排更清楚）', state.bigFont, function (on) {
            state.bigFont = on;
            save();
            render();
            refresh();
        });
        switchRow('只看收藏篇目', state.favOnly, function (on) {
            state.favOnly = on;
            state.idx = 0;
            state.reveal = 0;
            save();
            render();
            refresh();
        });

        heading('默认显示模式');
        var row = document.createElement('div');
        row.className = 'et-drawer__row';
        [['all', '全显'], ['step', '逐句'], ['hide', '隐藏']].forEach(function (pair) {
            var b = document.createElement('button');
            b.type = 'button';
            b.className = 'et-btn' + (state.mode === pair[0] ? ' et-btn--primary' : '');
            b.style.flex = '1 1 28%';
            b.textContent = pair[1];
            b.addEventListener('click', function () {
                setMode(pair[0]);
                refresh();
            });
            row.appendChild(b);
        });
        body.appendChild(row);

        heading('朗读语速');
        var rateRow = document.createElement('div');
        rateRow.className = 'et-drawer__row';
        [[0.7, '慢速'], [0.9, '正常'], [1.1, '快速']].forEach(function (pair) {
            var b = document.createElement('button');
            b.type = 'button';
            b.className = 'et-btn' + (state.rate === pair[0] ? ' et-btn--primary' : '');
            b.style.flex = '1 1 28%';
            b.textContent = pair[1];
            b.disabled = !canSpeak;
            b.addEventListener('click', function () {
                state.rate = pair[0];
                save();
                speak('春眠不觉晓，处处闻啼鸟。');
                refresh();
            });
            rateRow.appendChild(b);
        });
        body.appendChild(rateRow);

        heading('收藏');
        var favRow = document.createElement('div');
        favRow.className = 'et-drawer__row';
        var clearBtn = document.createElement('button');
        clearBtn.type = 'button';
        clearBtn.className = 'et-btn et-btn--danger';
        clearBtn.style.flex = '1 1 100%';
        clearBtn.textContent = '清空全部收藏（当前 ' + state.favorites.length + ' 首）';
        clearBtn.disabled = !state.favorites.length;
        clearBtn.addEventListener('click', function () {
            state.favorites = [];
            state.favOnly = false;
            save();
            render();
            refresh();
            chrome.toast('收藏已清空');
        });
        favRow.appendChild(clearBtn);
        body.appendChild(favRow);

        var tip = document.createElement('p');
        tip.className = 'et-drawer__tip';
        tip.innerHTML = '内置 <b>' + POEMS.length + ' 首</b>中小学必背古诗词，按小学低 / 中 / 高年级、初中与高中标注学段。'
            + '<br>数据中出现的 <b>' + Object.keys(AUTHOR_INFO).length + ' 位作者</b>都有作者简介；'
            + '课本高频重点篇目另配创作背景、词语注释与主旨赏析（卡面底部提示「含背景与注释」，按 I 查看）。'
            + '<br>「隐藏」模式只显示诗题与朝代作者，适合学生先背、老师再按空格揭晓。'
            + '<br>朗读依赖系统中文语音包（Windows：设置 → 时间和语言 → 语音）。'
            + '<br>收藏与筛选状态保存在本机浏览器，下次打开自动恢复。';
        body.appendChild(tip);

        function refresh() {
            while (body.firstChild) { body.removeChild(body.firstChild); }
            buildSettings(body);
        }
    }

    /* ============ 事件绑定 ============ */

    document.getElementById('segGrade').addEventListener('click', function (ev) {
        var v = ev.target && ev.target.getAttribute ? ev.target.getAttribute('data-grade') : null;
        if (!v) { return; }
        state.grade = v;
        state.idx = 0;
        state.reveal = 0;
        lastLine = -1;
        render();
        save();
        chrome.beep('tick');
    });

    document.getElementById('segEra').addEventListener('click', function (ev) {
        var v = ev.target && ev.target.getAttribute ? ev.target.getAttribute('data-era') : null;
        if (!v) { return; }
        state.era = v;
        state.idx = 0;
        state.reveal = 0;
        lastLine = -1;
        render();
        save();
        chrome.beep('tick');
    });

    document.getElementById('segMode').addEventListener('click', function (ev) {
        var v = ev.target && ev.target.getAttribute ? ev.target.getAttribute('data-mode') : null;
        if (v) { setMode(v); }
    });

    document.getElementById('btnFav').addEventListener('click', function () {
        state.favOnly = !state.favOnly;
        state.idx = 0;
        state.reveal = 0;
        lastLine = -1;
        render();
        save();
        if (state.favOnly && !state.favorites.length) {
            chrome.toast('还没有收藏的诗，按 F 或点「收藏」添加', 'warn');
        }
    });

    document.getElementById('search').addEventListener('input', function (ev) {
        state.query = ev.target.value || '';
        state.idx = 0;
        state.reveal = 0;
        lastLine = -1;
        render();
    });

    document.getElementById('btnPrev').addEventListener('click', prevPoem);
    document.getElementById('btnNext').addEventListener('click', function () {
        if (state.mode === 'step' || state.mode === 'hide') { advance(); } else { nextPoem(); }
    });
    document.getElementById('btnRandom').addEventListener('click', randomPoem);
    document.getElementById('btnStar').addEventListener('click', toggleStar);
    document.getElementById('btnRead').addEventListener('click', readAloud);
    document.getElementById('btnInfo').addEventListener('click', openInfo);

    document.addEventListener('keydown', function (ev) {
        var node = document.activeElement;
        var tag = node && node.tagName ? node.tagName.toUpperCase() : '';
        if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT' || (node && node.isContentEditable)) { return; }
        if (document.querySelector('.et-modal, .et-drawer-backdrop')) { return; }

        if (ev.code === 'Space' || ev.key === ' ') {
            ev.preventDefault();
            advance();
        } else if (ev.key === 'ArrowRight' || ev.key === 'ArrowDown') {
            ev.preventDefault();
            nextPoem();
        } else if (ev.key === 'ArrowLeft' || ev.key === 'ArrowUp') {
            ev.preventDefault();
            prevPoem();
        } else if (ev.key === 'r' || ev.key === 'R') {
            ev.preventDefault();
            randomPoem();
        } else if (ev.key === 'f' || ev.key === 'F') {
            ev.preventDefault();
            toggleStar();
        } else if (ev.key === 'h' || ev.key === 'H') {
            ev.preventDefault();
            setMode(state.mode === 'hide' ? 'all' : 'hide');
        } else if (ev.key === 'i' || ev.key === 'I') {
            ev.preventDefault();
            openInfo();
        }
    });

    /* ============ 启动 ============ */

    render();
})();
</script>

</body>
</html>
