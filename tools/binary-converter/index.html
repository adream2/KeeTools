/* ============ 设计令牌 ============ */
:root {
    --et-accent: #2563eb;
    --et-accent-weak: rgba(37, 99, 235, .14);
    --et-bg: #f4f6fb;
    --et-surface: #ffffff;
    --et-surface-2: #f8fafc;
    --et-fg: #0b1220;
    --et-muted: #64748b;
    --et-line: rgba(15, 23, 42, .12);
    --et-line-strong: rgba(15, 23, 42, .22);
    --et-glass: rgba(255, 255, 255, .85);
    --et-shadow-md: 0 10px 28px -18px rgba(15, 23, 42, .3);
    --et-shadow-lg: 0 24px 60px -32px rgba(15, 23, 42, .4);
    --et-ok: #059669;
    --et-warn: #d97706;
    --et-err: #dc2626;
    --et-radius: 12px;
    --et-radius-sm: 9px;
    --et-font: -apple-system, BlinkMacSystemFont, "Segoe UI",
               "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei",
               "Noto Sans SC", sans-serif;
    --et-mono: ui-monospace, "Cascadia Mono", Consolas, Menlo, monospace;
}

html[data-et-theme="dark"] {
    --et-bg: #0b1120;
    --et-surface: #111a2e;
    --et-surface-2: #0f1729;
    --et-fg: #f1f5f9;
    --et-muted: #94a3b8;
    --et-line: rgba(148, 163, 184, .18);
    --et-line-strong: rgba(148, 163, 184, .3);
    --et-glass: rgba(17, 26, 46, .85);
    --et-shadow-md: 0 10px 34px -18px rgba(0, 0, 0, .8);
    --et-shadow-lg: 0 24px 70px -30px rgba(0, 0, 0, .9);
    --et-ok: #34d399;
    --et-warn: #fbbf24;
    --et-err: #f87171;
}

/* ============ 基础 ============ */
.et-app {
    position: relative;
    isolation: isolate;
    display: flex;
    flex-direction: column;
    height: 100vh;
    height: 100dvh;
    overflow: hidden;
    background: var(--et-bg);
    color: var(--et-fg);
    font-family: var(--et-font);
    -webkit-font-smoothing: antialiased;
    transition: background .25s, color .25s;
}

/* 极光背景：径向渐变 + 呼吸动画（edupick 品质基线，老内核也不掉帧） */
.et-app::before {
    content: '';
    position: fixed;
    inset: 0;
    z-index: -1;
    pointer-events: none;
    background:
        radial-gradient(46% 40% at 20% 18%, var(--et-accent-weak), transparent 65%),
        radial-gradient(42% 38% at 82% 24%, var(--et-accent-weak), transparent 70%),
        radial-gradient(50% 44% at 55% 95%, rgba(16, 185, 129, .10), transparent 65%);
    animation: et-aurora 16s ease-in-out infinite alternate;
}

@keyframes et-aurora {
    from { opacity: .55; transform: scale(1); }
    to { opacity: 1; transform: scale(1.06); }
}

.et-app *,
.et-app *::before,
.et-app *::after { box-sizing: border-box; }

[hidden] { display: none !important; }

.et-icon {
    width: 18px;
    height: 18px;
    fill: none;
    stroke: currentColor;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
    flex: none;
}

/* ============ 顶栏 ============ */
.et-topbar {
    flex: none;
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 11px 20px;
    border-bottom: 1px solid var(--et-line);
    background: var(--et-glass);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    z-index: 20;
}

.et-brand {
    display: flex;
    align-items: center;
    gap: 10px;
    min-width: 0;
}

.et-brand__dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: var(--et-accent);
    box-shadow: 0 0 0 4px var(--et-accent-weak);
    flex: none;
}

.et-brand__name {
    font-weight: 800;
    font-size: 15px;
    letter-spacing: -.01em;
    white-space: nowrap;
}

.et-brand__sub {
    font-size: 12.5px;
    color: var(--et-muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.et-status {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 5px 14px;
    border-radius: 999px;
    font-size: 12.5px;
    color: var(--et-muted);
    background: var(--et-surface-2);
    border: 1px solid var(--et-line);
    white-space: nowrap;
    max-width: 42vw;
    overflow: hidden;
    text-overflow: ellipsis;
}

.et-status__dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--et-ok);
    flex: none;
    transition: background .2s;
}

.et-status[data-tone="err"] .et-status__dot { background: var(--et-err); }
.et-status[data-tone="warn"] .et-status__dot { background: var(--et-warn); }

.et-actions {
    display: flex;
    align-items: center;
    gap: 7px;
}

.et-icon-btn {
    display: inline-grid;
    place-items: center;
    width: 38px;
    height: 38px;
    font-size: 16px;
    line-height: 1;
    border-radius: 11px;
    border: 1px solid var(--et-line);
    background: var(--et-surface-2);
    color: var(--et-fg);
    cursor: pointer;
    transition: transform .14s, border-color .14s, color .14s, opacity .14s;
    -webkit-tap-highlight-color: transparent;
}

.et-icon-btn:hover {
    border-color: var(--et-accent);
    color: var(--et-accent);
    transform: translateY(-1px);
}

.et-icon-btn:active { transform: translateY(0); }
.et-icon-btn.is-off { opacity: .4; }
.et-icon-btn:focus-visible { outline: 2px solid var(--et-accent); outline-offset: 2px; }

/* ============ 主区默认 ============ */
.et-main {
    flex: 1;
    min-height: 0;
    position: relative;
    overflow: auto;
}

/* ============ 页脚（品牌回流 L2） ============ */
.et-footer {
    flex: none;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 7px 16px;
    font-size: 12px;
    color: var(--et-muted);
    border-top: 1px solid var(--et-line);
    background: var(--et-glass);
    user-select: none;
    z-index: 20;
}

.et-footer a {
    color: inherit;
    text-decoration: none;
    transition: color .14s;
}

.et-footer a:hover { color: var(--et-accent); }

/* ============ 按钮 ============ */
.et-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
    padding: 9px 16px;
    border-radius: 11px;
    font: inherit;
    font-size: 13.5px;
    font-weight: 700;
    border: 1px solid var(--et-line);
    background: var(--et-surface-2);
    color: var(--et-fg);
    cursor: pointer;
    transition: transform .14s, border-color .14s, color .14s, background .14s, box-shadow .14s;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
}

.et-btn:hover {
    border-color: var(--et-accent);
    color: var(--et-accent);
    transform: translateY(-1px);
}

.et-btn:active { transform: translateY(0); }
.et-btn:focus-visible { outline: 2px solid var(--et-accent); outline-offset: 2px; }
.et-btn:disabled { opacity: .45; cursor: not-allowed; transform: none; }

.et-btn--primary {
    background: var(--et-accent);
    border-color: var(--et-accent);
    color: #fff;
    box-shadow: 0 6px 18px -8px var(--et-accent);
}

.et-btn--primary:hover { color: #fff; filter: brightness(1.08); }
.et-btn--primary:disabled { filter: none; }

.et-btn--danger:hover {
    border-color: var(--et-err);
    color: var(--et-err);
}

.et-btn--lg {
    padding: 13px 26px;
    font-size: 16px;
    border-radius: 14px;
}

/* ============ 弹窗 ============ */
.et-modal {
    position: fixed;
    inset: 0;
    z-index: 100;
    display: grid;
    place-items: center;
    padding: 24px;
    background: rgba(2, 6, 23, .55);
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    animation: et-fade .18s ease;
}

.et-modal__panel {
    width: min(680px, 94vw);
    max-height: 86vh;
    max-height: 86dvh;
    display: flex;
    flex-direction: column;
    background: var(--et-surface);
    border: 1px solid var(--et-line);
    border-radius: 16px;
    box-shadow: var(--et-shadow-lg);
    animation: et-pop .2s cubic-bezier(.34, 1.4, .64, 1);
    overflow: hidden;
}

.et-modal__panel--narrow { width: min(460px, 92vw); }
.et-modal__panel--wide { width: min(900px, 94vw); }

.et-modal__head {
    flex: none;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 16px 20px;
    border-bottom: 1px solid var(--et-line);
    font-weight: 800;
    font-size: 15px;
}

.et-modal__head .et-icon-btn {
    margin-left: auto;
    width: 32px;
    height: 32px;
}

.et-modal__body {
    flex: 1;
    min-height: 0;
    overflow: auto;
    padding: 18px 20px;
}

.et-modal__foot {
    flex: none;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 14px 20px;
    border-top: 1px solid var(--et-line);
    background: var(--et-surface-2);
}

.et-modal__foot .spacer { flex: 1; }

@keyframes et-fade {
    from { opacity: 0; }
}

@keyframes et-pop {
    from { opacity: 0; transform: translateY(14px) scale(.97); }
}

/* ============ 轻提示（toast） ============ */
.et-toast {
    position: fixed;
    left: 50%;
    bottom: 56px;
    transform: translateX(-50%) translateY(10px);
    z-index: 120;
    display: flex;
    align-items: center;
    gap: 9px;
    max-width: min(520px, 88vw);
    padding: 11px 18px;
    border-radius: 12px;
    font-size: 13.5px;
    font-weight: 600;
    color: #fff;
    background: rgba(15, 23, 42, .92);
    border: 1px solid rgba(148, 163, 184, .25);
    box-shadow: var(--et-shadow-lg);
    opacity: 0;
    pointer-events: none;
    transition: opacity .22s, transform .22s;
}

.et-toast.is-show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
}

.et-toast[data-tone="ok"] { background: rgba(5, 150, 105, .95); }
.et-toast[data-tone="err"] { background: rgba(220, 38, 38, .95); }
.et-toast[data-tone="warn"] { background: rgba(217, 119, 6, .95); }

/* ============ 设置抽屉（右上角入口，edupick 交互） ============ */
.et-drawer-backdrop {
    position: fixed;
    inset: 0;
    z-index: 90;
    background: rgba(2, 6, 23, .45);
    backdrop-filter: blur(3px);
    -webkit-backdrop-filter: blur(3px);
    opacity: 0;
    transition: opacity .2s;
}

.et-drawer-backdrop.is-open { opacity: 1; }

.et-drawer {
    position: absolute;
    top: 0;
    right: 0;
    height: 100%;
    width: min(400px, 92vw);
    display: flex;
    flex-direction: column;
    background: var(--et-surface);
    border-left: 1px solid var(--et-line);
    box-shadow: var(--et-shadow-lg);
    transform: translateX(100%);
    transition: transform .22s cubic-bezier(.32, .72, .35, 1);
}

.et-drawer-backdrop.is-open .et-drawer { transform: translateX(0); }

.et-drawer__head {
    flex: none;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 15px 18px;
    border-bottom: 1px solid var(--et-line);
    font-weight: 800;
    font-size: 15px;
    color: var(--et-accent);
}

.et-drawer__head .et-icon-btn {
    margin-left: auto;
    width: 32px;
    height: 32px;
}

.et-drawer__body {
    flex: 1;
    min-height: 0;
    overflow: auto;
    padding: 16px 18px 24px;
}

/* 抽屉内容通用小节（工具复用） */
.et-drawer__body h4 {
    margin: 18px 0 8px;
    font-size: 12px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: .08em;
    color: var(--et-muted);
}

.et-drawer__body h4:first-child { margin-top: 0; }

.et-drawer__row {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
}

.et-drawer__tip {
    margin: 8px 0 0;
    font-size: 12px;
    line-height: 1.8;
    color: var(--et-muted);
}

.et-drawer__tip b { color: var(--et-fg); }

.et-drawer__input {
    flex: 1;
    min-width: 0;
    padding: 9px 12px;
    border: 1px solid var(--et-line-strong);
    border-radius: 9px;
    background: var(--et-surface-2);
    color: var(--et-fg);
    font: inherit;
    font-size: 13.5px;
    transition: border-color .14s, box-shadow .14s;
}

.et-drawer__input:focus {
    outline: none;
    border-color: var(--et-accent);
    box-shadow: 0 0 0 3px var(--et-accent-weak);
}

.et-drawer__switch {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 10px 0;
    border-bottom: 1px dashed var(--et-line);
    font-size: 13.5px;
    font-weight: 600;
    color: var(--et-fg);
    cursor: pointer;
    user-select: none;
}

.et-drawer__switch input {
    width: 17px;
    height: 17px;
    accent-color: var(--et-accent);
    cursor: pointer;
}
</style>

        document.body.appendChild(backdrop);
        requestAnimationFrame(function () { backdrop.classList.add('is-open'); });

        function close() {
            backdrop.classList.remove('is-open');
            document.removeEventListener('keydown', onKey);
            setTimeout(function () {
                if (backdrop.parentNode) { backdrop.parentNode.removeChild(backdrop); }
            }, 220);
        }
        function onKey(ev) {
            if (ev.key === 'Escape') { ev.stopPropagation(); close(); }
        }
        document.addEventListener('keydown', onKey);
        backdrop.addEventListener('mousedown', function (ev) {
            if (ev.target === backdrop) { close(); }
        });

        if (typeof build === 'function') { build(body, { close: close }); }
        return { body: body, close: close };
    }

    /* ---------- 通用弹窗 / toast（同时挂模块级，供其他共享组件使用） ---------- */

    function modal(mo) {
        var backdrop = el('div', 'et-modal');
        var panel = el('div', 'et-modal__panel' + (mo.size === 'narrow' ? ' et-modal__panel--narrow'
            : mo.size === 'wide' ? ' et-modal__panel--wide' : ''));
        var head = el('div', 'et-modal__head');
        if (mo.icon) { head.appendChild(makeIcon(mo.icon)); }
        head.appendChild(el('span', null, mo.title || ''));
        head.appendChild(makeBtn('i-x', '关闭', close));
        panel.appendChild(head);

        var body = el('div', 'et-modal__body');
        if (typeof mo.body === 'string') { body.innerHTML = mo.body; }
        else if (mo.body) { body.appendChild(mo.body); }
        panel.appendChild(body);

        var foot = null;
        if (mo.buttons && mo.buttons.length) {
            foot = el('div', 'et-modal__foot');
            foot.appendChild(el('span', 'spacer'));
            mo.buttons.forEach(function (b) {
                var btn = el('button', 'et-btn' + (b.primary ? ' et-btn--primary' : '') + (b.danger ? ' et-btn--danger' : ''), b.label);
                btn.type = 'button';
                btn.addEventListener('click', function () {
                    if (b.onClick) { b.onClick(close); } else { close(); }
                });
                foot.appendChild(btn);
            });
            panel.appendChild(foot);
        }

        backdrop.appendChild(panel);
        document.body.appendChild(backdrop);

        function close() {
            if (backdrop.parentNode) { backdrop.parentNode.removeChild(backdrop); }
            document.removeEventListener('keydown', onKey);
            if (mo.onClose) { mo.onClose(); }
        }
        function onKey(ev) {
            if (ev.key === 'Escape') { ev.stopPropagation(); close(); }
        }
        document.addEventListener('keydown', onKey);
        backdrop.addEventListener('mousedown', function (ev) {
            if (ev.target === backdrop) { close(); }
        });

        return { panel: panel, body: body, foot: foot, close: close };

    var toastEl = null;
    var toastTimer = 0;

    function toast(msg, tone) {
        if (!toastEl) {
            toastEl = el('div', 'et-toast');

        toastEl.setAttribute('data-tone', tone || '');

        toastTimer = setTimeout(function () { toastEl.classList.remove('is-show'); }, 2200);

    /* ---------- PWA 元数据（blob manifest，环境不支持时静默跳过） ---------- */

    function installPwa(toolId, title, accent) {

            var svg = '<svg xmlns="' + NS_SVG + '" viewBox="0 0 64 64">' +
                '<rect width="64" height="64" rx="14" fill="' + (accent || '#2563eb') + '"/>' +
                '<text x="32" y="43" font-size="32" font-weight="800" font-family="sans-serif" ' +
                'fill="#fff" text-anchor="middle">' + (title || '课').charAt(0) + '</text></svg>';
            var iconUri = 'data:image/svg+xml,' + encodeURIComponent(svg);

            var mf = {

                display: 'standalone',

                theme_color: accent || '#2563eb',
                icons: [{ src: iconUri, sizes: 'any', type: 'image/svg+xml', purpose: 'any' }]
            };
            var blob = new Blob([JSON.stringify(mf)], { type: 'application/manifest+json' });
            var link = document.createElement('link');
            link.rel = 'manifest';
            link.href = URL.createObjectURL(blob);

    /* ---------- 挂载 ---------- */

    function mount(options) {

            soundBtn.title = soundEnabled ? '关闭音效' : '开启音效';

        api.openSettings = function () {

        /* ---------- 全屏（iframe 内委托宿主，避免双层全屏） ---------- */

        function inIframe() {
            try { return global.parent && global.parent !== global; } catch (err) { return true; }
        }

        function toggleFullscreen() {
            var root = document.documentElement;
            var fsEl = document.fullscreenElement || document.webkitFullscreenElement || null;
            if (fsEl) {
                (document.exitFullscreen || document.webkitExitFullscreen || function () {}).call(document);
            } else {
                var req = root.requestFullscreen || root.webkitRequestFullscreen;
                if (req) { try { req.call(root); } catch (err) { /* 忽略 */ } }
            }
        }

        function syncFsIcon(on) {
            if (!fsBtn) { return; }
            fsBtn.innerHTML = '';
            fsBtn.appendChild(makeIcon(on ? 'i-minimize' : 'i-maximize'));
            fsBtn.title = on ? '退出全屏' : '全屏';
        }

        document.addEventListener('fullscreenchange', function () {
            syncFsIcon(!!(document.fullscreenElement || document.webkitFullscreenElement));
        });
        document.addEventListener('webkitfullscreenchange', function () {
            syncFsIcon(!!(document.fullscreenElement || document.webkitFullscreenElement));
        });
        syncFsIcon(false);

        api.toggleFullscreen = toggleFullscreen;

        /* ---------- 音效 API ---------- */
        api.beep = function (kind) {

        api.soundOn = function () { return soundEnabled; };

        /* ---------- 帮助 ---------- */
        function openHelp() {

        api.openHelp = openHelp;

        /* ---------- toast ---------- */
        api.toast = toast;

        /* ---------- 页脚（L2 品牌回流，低调一行） ---------- */
        var siteOrigin = typeof global.ET_SITE_ORIGIN === 'string' && /^https?:\/\//.test(global.ET_SITE_ORIGIN)
            ? global.ET_SITE_ORIGIN
            : null;

        function renderFooter() {
            footer.textContent = '';
            footer.appendChild(el('span', null, 'KeeTools 课工具'));
            footer.appendChild(el('span', null, '·'));
            if (siteOrigin) {
                var a = el('a', null, '更多课堂工具');
                a.href = siteOrigin + '/?from=tool-footer&tool=' + encodeURIComponent(toolId);
                a.target = '_blank';
                a.rel = 'noopener';
                footer.appendChild(a);
            } else {
                footer.appendChild(el('span', null, '更多课堂工具'));
            }
        }
        renderFooter();

        /* 站点来源发现：iframe 内向父窗口询问；也可由宿主直接注入 ET_SITE_ORIGIN */
        try {
            if (global.parent && global.parent !== global) {
                global.parent.postMessage(JSON.stringify({ type: 'et-hello', toolId: toolId }), '*');
            }
        } catch (err) { /* 跨域异常忽略 */ }

        global.addEventListener('message', function (ev) {
            var data = ev.data;
            if (typeof data === 'string') {
                try { data = JSON.parse(data); } catch (err) { return; }
            }
            if (!data || typeof data !== 'object') { return; }

            if (data.type === 'et-origin' && typeof data.origin === 'string' && /^https?:\/\//.test(data.origin)) {
                siteOrigin = data.origin;
                if (!global.ET_SITE_ORIGIN) { global.ET_SITE_ORIGIN = data.origin; }
                renderFooter();
            }
            if (data.type === 'et-fullscreen-change' && typeof data.value === 'boolean') {
                syncFsIcon(data.value);
            }
        });

        api.el = { topbar: topbar, main: main, footer: footer, actions: actions };

        /* ---------- 激光笔 / 翻页笔适配（HID 翻页键） ----------
         * 翻页笔的上下页键在系统层等价于 PageDown / PageUp。

         *   PageUp   → secondary（副操作，缺省时同 primary）
         * 输入框聚焦或弹窗/抽屉打开时不响应，避免误触。 */
        if (typeof opt.primary === 'function') {
            document.addEventListener('keydown', function (ev) {
                if (ev.key !== 'PageDown' && ev.key !== 'PageUp') { return; }
                var tag = (document.activeElement && document.activeElement.tagName) || '';
                if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') { return; }
                if (document.querySelector('.et-modal, .et-drawer-backdrop, .ws-winner')) { return; }
                ev.preventDefault();
                if (ev.key === 'PageDown') { opt.primary(); }
                else if (typeof opt.secondary === 'function') { opt.secondary(); }
                else { opt.primary(); }
            });

        return api;

    global.ET.Chrome = {
        mount: mount,
        modal: modal,
        toast: toast,

<script>
  /* 此块由 scripts/sync_shared.py 自动注入，请勿手工修改 */
/*!
 * et-stats.js — 使用统计模块（模块化，可整体移除）
 *
 * 共享逻辑源。改这里，然后跑：python scripts/sync_shared.py
 * 依赖：无（可脱离 et-util / et-chrome 独立运行）。
 * 全局：ET.Stats
 *
 * ┌────────────────────────────────────────────────────────────────┐
 * │ 说明：本模块只做一件事——工具被打开时向上报端点发一条匿名计数。 │
 * │ · 在线（iframe 内）：宿主页面已服务端计数，本模块不重复上报。   │
 * │ · 离线打开（file:// / 下载单文件 / 离线包）：联网条件具备时，   │
 * │   以 sendBeacon 上报 use_offline 事件（text/plain 免预检）。    │
 * │ · 上报端点 = window.ET_SITE_ORIGIN（由宿主注入或离线包配置）。  │
 * │   未配置端点时本模块完全静默，不发任何请求。                    │
 * │ · **整个 <script> 块可安全删除**：删除后工具其余功能完全正常，  │
 * │   且完全不再发起任何网络请求。                                  │
 * └────────────────────────────────────────────────────────────────┘
 */
(function (global) {
    'use strict';

    var ET = global.ET = global.ET || {};

    var Stats = {
        /** 上报端点来源（站点绝对地址，无协议尾斜杠） */
        endpoint: (typeof global.ET_SITE_ORIGIN === 'string' && /^https?:\/\//.test(global.ET_SITE_ORIGIN))
            ? global.ET_SITE_ORIGIN
            : null,

        _done: {},

        /**
         * 上报一次事件（同一事件同一工具每次页面加载只报一次）。
         * event: 'use_offline' 等；toolId: 工具 id。
         */
        send: function (event, toolId) {
            if (!event || this._done[event + ':' + (toolId || '')]) { return false; }
            if (!this.endpoint) { return false; }
            /* iframe 内由宿主统计，避免双计 */
            try {
                if (global.parent && global.parent !== global) { return false; }
            } catch (err) { return false; }
            /* 断网时挂起，网络恢复自动补报一次 */
            if (global.navigator && global.navigator.onLine === false) {
                var self = this;
                global.addEventListener('online', function () { self.send(event, toolId); }, { once: true });
                return false;
            }

            this._done[event + ':' + (toolId || '')] = true;
            var payload = JSON.stringify({ event: event, tool: toolId || '' });

            try {
                if (global.navigator.sendBeacon) {
                    return global.navigator.sendBeacon(
                        this.endpoint + '/api/track',
                        new Blob([payload], { type: 'text/plain;charset=UTF-8' })
                    );
                }
                global.fetch(this.endpoint + '/api/track', {
                    method: 'POST',
                    body: payload,
                    keepalive: true,
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'text/plain;charset=UTF-8' }
                });
                return true;
            } catch (err) {
                return false;
            }
        }
    };

    ET.Stats = Stats;
})(window);
</script>

<script>
(function () {
    'use strict';

    var TOOL_ID = 'binary-converter';
    var store = ET.store(TOOL_ID);

    var chrome = ET.Chrome.mount({
        toolId: TOOL_ID,
        title: '二进制转换器',
        sub: '信息技术',
        accent: '#4338ca',
        status: '就绪',
        sound: true,
        primary: function () { nextQuiz(); },
        settings: {
            title: '设置',
            build: function (body) {
                body.innerHTML = '<p style="font-size:13.5px;line-height:2;color:var(--et-muted)">' +
                    '转换范围为 0 ~ 65535（16 位以内）。空格 / 翻页笔下页键 = 练习下一题。</p>';
            }
        },
        help: '<div style="font-size:13.5px;line-height:2">' +
            '<p style="margin:0 0 8px"><b>进制转换</b>：在任意一栏输入，其余进制实时换算；骰子按钮随机出数。</p>' +
            '<p style="margin:0 0 8px"><b>位权展开</b>：展示「按权展开求和」的完整计算过程，红色位是 1 的有效位。</p>' +
            '<p style="margin:0 0 8px"><b>灯板</b>：每盏灯代表一位，点亮 = 1；灯下标注位权 2⁷…2⁰。可演示 255、128 等特殊值。</p>' +
            '<p style="margin:0"><b>练习</b>：随机十进制数转二进制，适合全班抢答。</p></div>'
    });

    var els = {
        inDec: document.getElementById('inDec'),
        inBin: document.getElementById('inBin'),
        inHex: document.getElementById('inHex'),
        inOct: document.getElementById('inOct'),
        results: document.getElementById('results'),
        expand: document.getElementById('expand'),
        lamps: document.getElementById('lamps'),
        lampSum: document.getElementById('lampSum'),
        quizQ: document.getElementById('quizQ'),
        quizIn: document.getElementById('quizIn'),
        btnQuizCheck: document.getElementById('btnQuizCheck'),
        btnQuizNext: document.getElementById('btnQuizNext'),
        btnRand: document.getElementById('btnRand'),
        quizScore: document.getElementById('quizScore')
    };

    var MAX = 65535;
    var bits = store.get('bits', [1, 0, 1, 0, 1, 0, 1, 0]);   /* 高位在前 8 位 */
    var quiz = { answer: 0, total: store.get('qTotal', 0), right: store.get('qRight', 0) };
    var updating = false;   /* 防止输入回环触发 */

    /* ════════ 进制转换 ════════ */

    function parseInBase(str, base) {
        str = String(str || '').trim().toLowerCase();
        if (!str) { return null; }
        var re = base === 2 ? /^[01]+$/
            : base === 8 ? /^[0-7]+$/
            : base === 10 ? /^[0-9]+$/
            : /^[0-9a-f]+$/;
        if (!re.test(str)) { return null; }
        var v = parseInt(str, base);
        if (isNaN(v) || v > MAX) { return null; }
        return v;
    }

    function fmtGroup(bin) {
        /* 每 4 位加空格便于阅读 */
        var pad = bin.length % 4;
        var s = pad ? new Array(5 - pad).join('0') + bin : bin;
        return s.replace(/(.{4})(?=.)/g, '$1 ');
    }

    function updateResults(changed, raw) {
        if (updating) { return; }
        updating = true;
        var bases = { inDec: 10, inBin: 2, inHex: 16, inOct: 8 };
        var val = null;
        var errKey = null;
        if (raw !== undefined) {
            val = parseInBase(raw, bases[changed]);
            if (val === null && String(raw).trim() !== '') { errKey = changed; }
        } else {
            /* 恢复：以十进制为准 */
            var saved = store.get('value', null);
            if (saved !== null) { val = saved; }
        }
        if (val !== null) { store.set('value', val); }

        var map = {
            inDec: val === null ? '' : String(val),
            inBin: val === null ? '' : val.toString(2),
            inHex: val === null ? '' : val.toString(16).toUpperCase(),
            inOct: val === null ? '' : val.toString(8)
        };
        for (var key in map) {
            if (Object.prototype.hasOwnProperty.call(map, key)) {
                if (key !== changed || val !== null) { els[key].value = map[key]; }
                els[key].classList.toggle('is-error', key === errKey);
            }
        }
        renderChips(val);
        renderExpand(val);
        if (val !== null) { setLampsFromValue(val); }
        updating = false;
    }

    function renderChips(val) {
        while (els.results.firstChild) { els.results.removeChild(els.results.firstChild); }
        if (val === null) { return; }
        var items = [
            ['十进制', String(val)],
            ['二进制（每 4 位一组）', fmtGroup(val.toString(2))],
            ['十六进制', '0x' + val.toString(16).toUpperCase()],
            ['八进制', '0o' + val.toString(8)]
        ];
        for (var i = 0; i < items.length; i++) {
            var chip = document.createElement('div');
            chip.className = 'bc-chip';
            var small = document.createElement('small');
            small.textContent = items[i][0];
            var code = document.createElement('code');
            code.textContent = items[i][1];
            chip.appendChild(small); chip.appendChild(code);
            els.results.appendChild(chip);
        }
    }

    /* ════════ 位权展开 ════════ */

    function renderExpand(val) {
        while (els.expand.firstChild) { els.expand.removeChild(els.expand.firstChild); }
        if (val === null || val === undefined) {
            els.expand.textContent = '输入数字后显示按权展开过程。';
            return;
        }
        if (val === 0) {
            els.expand.textContent = '0 = 0';
            return;
        }
        var bin = val.toString(2);
        var n = bin.length;
        /* 第一行：位权式 */
        for (var i = 0; i < n; i++) {
            var bit = Number(bin[i]);
            var span = document.createElement('span');
            span.className = bit ? 'bc-bit-on' : 'bc-bit-off';
            span.textContent = bin[i];
            els.expand.appendChild(span);
            if (i < n - 1) {
                var op = document.createElement('span');
                op.className = 'bc-plus';
                op.textContent = '＋';
                els.expand.appendChild(op);
            }
        }
        var eq = document.createElement('span');
        eq.className = 'bc-plus';
        eq.textContent = '　=　';
        els.expand.appendChild(eq);
        /* 第二行：权值式 */
        var first = true;
        for (var j = 0; j < n; j++) {
            var b2 = Number(bin[j]);
            if (!b2 && val !== 0) {
                /* 跳过 0 位，只展示有效项，但保留全部展示更直观——展示全部 */
            }
            var w = Math.pow(2, n - 1 - j);
            var ws = document.createElement('span');
            ws.className = 'bc-weight';
            ws.textContent = b2 ? w : 0;
            els.expand.appendChild(ws);
            if (j < n - 1) {
                var op2 = document.createElement('span');
                op2.className = 'bc-plus';
                op2.textContent = '＋';
                els.expand.appendChild(op2);
            }
            first = false;
        }
        var eq2 = document.createElement('span');
        eq2.className = 'bc-plus';
        eq2.textContent = '　=　';
        els.expand.appendChild(eq2);
        var sum = document.createElement('span');
        sum.className = 'bc-sum';
        sum.textContent = String(val);
        els.expand.appendChild(sum);
    }

    /* ════════ 灯板 ════════ */

    function buildLamps() {
        while (els.lamps.firstChild) { els.lamps.removeChild(els.lamps.firstChild); }
        for (var i = 0; i < 8; i++) {
            (function (idx) {
                var lamp = document.createElement('div');
                lamp.className = 'bc-lamp';
                var bulb = document.createElement('div');
                bulb.className = 'bc-bulb';
                var bit = document.createElement('div');
                bit.className = 'bc-bit';
                var w = document.createElement('div');
                w.className = 'bc-w';
                w.textContent = '2^' + (7 - idx);
                lamp.appendChild(bulb); lamp.appendChild(bit); lamp.appendChild(w);
                lamp.addEventListener('click', function () {
                    bits[idx] = bits[idx] ? 0 : 1;
                    store.set('bits', bits);
                    try { chrome.beep(bits[idx] ? 'ok' : 'off'); } catch (e) { /* 静默 */ }
                    refreshLamps();
                    /* 灯板操作同步到转换区 */
                    var v = lampValue();
                    updating = true;
                    els.inDec.value = String(v);
                    els.inBin.value = v.toString(2);
                    els.inHex.value = v.toString(16).toUpperCase();
                    els.inOct.value = v.toString(8);
                    store.set('value', v);
                    renderChips(v);
                    renderExpand(v);
                    updating = false;
                });
                lamp.dataset.idx = String(idx);
                els.lamps.appendChild(lamp);
            })(i);
        }
        refreshLamps();
    }

    function lampValue() {
        var v = 0;
        for (var i = 0; i < 8; i++) { v = v * 2 + bits[i]; }
        return v;
    }

    function refreshLamps() {
        var lamps = els.lamps.children;
        for (var i = 0; i < lamps.length; i++) {
            var idx = Number(lamps[i].dataset.idx);
            lamps[i].classList.toggle('is-on', !!bits[idx]);
            lamps[i].querySelector('.bc-bit').textContent = String(bits[idx]);
        }
        var v = lampValue();
        els.lampSum.innerHTML = '当前值：128·b₇ + … + 1·b₀ = <b>' + v + '</b>（十进制） = 0x' +
            v.toString(16).toUpperCase() + '（十六进制）';
    }

    function setLampsFromValue(val) {
        var bin = ('00000000' + (val & 255).toString(2)).slice(-8);
        for (var i = 0; i < 8; i++) { bits[i] = Number(bin[i]); }
        store.set('bits', bits);
        refreshLamps();
    }

    /* ════════ 练习 ════════ */

    function nextQuiz() {
        quiz.answer = Math.floor(Math.random() * 256);
        els.quizQ.textContent = String(quiz.answer);
        els.quizIn.value = '';
        els.quizIn.classList.remove('is-right', 'is-wrong');
        els.quizIn.focus();
    }

    function checkQuiz() {
        var raw = els.quizIn.value.trim();
        if (!raw) { return; }
        var ok = parseInBase(raw, 2) === quiz.answer;
        quiz.total++;
        if (ok) {
            quiz.right++;
            els.quizIn.classList.add('is-right');
            els.quizIn.classList.remove('is-wrong');
            try { chrome.beep('ok'); } catch (e) { /* 静默 */ }
            chrome.toast('回答正确！');
        } else {
            els.quizIn.classList.add('is-wrong');
            els.quizIn.classList.remove('is-right');
            try { chrome.beep('err'); } catch (e2) { /* 静默 */ }
            chrome.toast('不对哦，正确答案是 ' + quiz.answer.toString(2), 'warn');
        }
        store.set('qTotal', quiz.total);
        store.set('qRight', quiz.right);
        renderScore();
    }

    function renderScore() {
        els.quizScore.innerHTML = '答对 <b>' + quiz.right + '</b> / 共 <b>' + quiz.total + '</b>';
    }

    els.inDec.addEventListener('input', function () { updateResults('inDec', els.inDec.value); });
    els.inBin.addEventListener('input', function () { updateResults('inBin', els.inBin.value); });
    els.inHex.addEventListener('input', function () { updateResults('inHex', els.inHex.value); });
    els.inOct.addEventListener('input', function () { updateResults('inOct', els.inOct.value); });

    els.btnRand.addEventListener('click', function () {
        var v = Math.floor(Math.random() * 256);
        updating = true;
        els.inDec.value = String(v);
        updating = false;
        updateResults('inDec', String(v));
        try { chrome.beep('ok'); } catch (e) { /* 静默 */ }
    });

    els.btnQuizCheck.addEventListener('click', checkQuiz);
    els.btnQuizNext.addEventListener('click', nextQuiz);
    els.quizIn.addEventListener('keydown', function (e) {
        if (e.key === 'Enter') { checkQuiz(); }
    });

    buildLamps();
    renderScore();
    /* 首次使用给一个默认示例值，避免空面板 */
    var savedVal = store.get('value', null);
    if (savedVal === null) { savedVal = 202; }
    els.inDec.value = String(savedVal);
    updateResults('inDec', String(savedVal));
    nextQuiz();
})();
</script>

</body>
</html>
