    var audioCtx = null;

    var MASTER_GAIN = 0.5; /* 整体音量层（教室设备音量 100% 也要听得清） */

    function tone(ctx, freq, start, dur, gainPeak, type) {
        var osc = ctx.createOscillator();
        var gain = ctx.createGain();
        osc.type = type || 'triangle';
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(0, start);
        gain.gain.linearRampToValueAtTime(gainPeak, start + 0.012);
        gain.gain.exponentialRampToValueAtTime(0.0001, start + dur);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(start);
        osc.stop(start + dur + 0.05);

        err: [[220, 0, 0.22, 0.46, 'square']],

        if (!ctx || !BEEPS[kind]) { return; }
        var seq = BEEPS[kind];
        var t0 = ctx.currentTime + 0.01;
        for (var i = 0; i < seq.length; i++) {
            tone(ctx, seq[i][0], t0 + seq[i][1], seq[i][2], seq[i][3] * MASTER_GAIN, seq[i][4]);

    function openDrawer(title, build) {

        head.appendChild(makeIcon('i-sliders'));
        head.appendChild(el('span', 'et-drawer__title', title));
        head.appendChild(makeBtn('i-x', '关闭', close));
        drawer.appendChild(head);

        var body = el('div', 'et-drawer__body');
        drawer.appendChild(body);

        backdrop.appendChild(drawer);
        document.body.appendChild(backdrop);
        requestAnimationFrame(function () { backdrop.classList.add('is-open'); });

        function close() {
            backdrop.classList.remove('is-open');
            document.removeEventListener('keydown', onKey);
            setTimeout(function () {
                if (backdrop.parentNode) { backdrop.parentNode.removeChild(backdrop); }
            }, 220);
        }
        function onKey(ev) {
            if (ev.key === 'Escape') { ev.stopPropagation(); close(); }
        }
        document.addEventListener('keydown', onKey);
        backdrop.addEventListener('mousedown', function (ev) {
            if (ev.target === backdrop) { close(); }
        });

        if (typeof build === 'function') {
            /* 兼容两种约定：build 自己往 body 里塞内容，或 return 一个元素节点 */
            var ret = build(body, { close: close });
            if (ret && ret.nodeType === 1 && ret.parentNode !== body) {
                body.appendChild(ret);

    function modal(mo) {

        if (mo.icon) { head.appendChild(makeIcon(mo.icon)); }
        head.appendChild(el('span', null, mo.title || ''));
        head.appendChild(makeBtn('i-x', '关闭', close));
        panel.appendChild(head);

        var body = el('div', 'et-modal__body');
        if (typeof mo.body === 'string') { body.innerHTML = mo.body; }
        else if (mo.body) { body.appendChild(mo.body); }
        panel.appendChild(body);

        var foot = null;
        if (mo.buttons && mo.buttons.length) {
            foot = el('div', 'et-modal__foot');
            foot.appendChild(el('span', 'spacer'));
            mo.buttons.forEach(function (b) {
                var btn = el('button', 'et-btn' + (b.primary ? ' et-btn--primary' : '') + (b.danger ? ' et-btn--danger' : ''), b.label);
                btn.type = 'button';
                btn.addEventListener('click', function () {
                    if (b.onClick) { b.onClick(close); } else { close(); }
                });
                foot.appendChild(btn);
            });
            panel.appendChild(foot);
        }

        backdrop.appendChild(panel);
        document.body.appendChild(backdrop);

        function close() {
            if (backdrop.parentNode) { backdrop.parentNode.removeChild(backdrop); }
            document.removeEventListener('keydown', onKey);
            if (mo.onClose) { mo.onClose(); }
        }
        function onKey(ev) {
            if (ev.key === 'Escape') { ev.stopPropagation(); close(); }
        }
        document.addEventListener('keydown', onKey);

                '<text x="32" y="43" font-size="32" font-weight="800" font-family="sans-serif" ' +
                'fill="#fff" text-anchor="middle">' + (title || '课').charAt(0) + '</text></svg>';
            var iconUri = 'data:image/svg+xml,' + encodeURIComponent(svg);

            var mf = {

                short_name: title || '课工具',

                display: 'standalone',

        if (!topbar) { topbar = el('header'); topbar.id = 'et-topbar'; document.body.insertBefore(topbar, document.body.firstChild); }
        if (!main) { main = el('main'); main.id = 'et-main'; topbar.after(main); }
        if (!footer) { footer = el('footer'); footer.id = 'et-footer'; document.body.appendChild(footer); }

        main.classList.add('et-main');
        footer.className = 'et-footer';

        /* 品牌 */
        var brand = el('div', 'et-brand');
        brand.appendChild(el('span', 'et-brand__dot'));
        var nameWrap = el('div');
        nameWrap.style.cssText = 'min-width:0;line-height:1.25';

        var actions = el('div', 'et-actions');

            settingsBtn = makeBtn('i-sliders', opt.settings.title || '设置', function () {

        (opt.actions || []).forEach(function (a) {

        var fsBtn = makeBtn('i-maximize', '全屏', toggleFullscreen);
        actions.appendChild(fsBtn);

            soundBtn.innerHTML = '';
            soundBtn.appendChild(makeIcon(soundEnabled ? 'i-volume' : 'i-volume-off'));
            soundBtn.title = soundEnabled ? '关闭音效' : '开启音效';
            soundBtn.classList.toggle('is-off', !soundEnabled);

            fsBtn.innerHTML = '';
            fsBtn.appendChild(makeIcon(on ? 'i-minimize' : 'i-maximize'));

        });

        });
        syncFsIcon(false);

        api.toggleFullscreen = toggleFullscreen;

        api.beep = function (kind) {
            if (!soundEnabled) { return; }

        api.soundOn = function () { return soundEnabled; };

        api.modal = modal;

        /* ---------- 帮助 ---------- */
        function openHelp() {
            modal({
                title: '使用说明',

            ? global.ET_SITE_ORIGIN

            footer.appendChild(el('span', null, 'KeeTools 课工具'));
            footer.appendChild(el('span', null, '·'));

        try {
            if (global.parent && global.parent !== global) {

/*!
 * et-stats.js — 使用统计模块（模块化，可整体移除）
 *
 * 共享逻辑源。改这里，然后跑：python scripts/sync_shared.py
 * 依赖：无（可脱离 et-util / et-chrome 独立运行）。
 * 全局：ET.Stats
 *
 * ┌────────────────────────────────────────────────────────────────┐
 * │ 说明：本模块只做一件事——工具被打开时向上报端点发一条匿名计数。 │
 * │ · 在线（iframe 内）：宿主页面已服务端计数，本模块不重复上报。   │
 * │ · 离线打开（file:// / 下载单文件 / 离线包）：联网条件具备时，   │
 * │   以 sendBeacon 上报 use_offline 事件（text/plain 免预检）。    │
 * │ · 上报端点 = window.ET_SITE_ORIGIN（由宿主注入或离线包配置）。  │
 * │   未配置端点时本模块完全静默，不发任何请求。                    │
 * │ · **整个 <script> 块可安全删除**：删除后工具其余功能完全正常，  │
 * │   且完全不再发起任何网络请求。                                  │
 * └────────────────────────────────────────────────────────────────┘
 */
(function (global) {
    'use strict';

    var ET = global.ET = global.ET || {};

    var Stats = {
        /** 上报端点来源（站点绝对地址，无协议尾斜杠） */
        endpoint: (typeof global.ET_SITE_ORIGIN === 'string' && /^https?:\/\//.test(global.ET_SITE_ORIGIN))
            ? global.ET_SITE_ORIGIN
            : null,

        _done: {},

        /**
         * 上报一次事件（同一事件同一工具每次页面加载只报一次）。
         * event: 'use_offline' 等；toolId: 工具 id。
         */
        send: function (event, toolId) {
            if (!event || this._done[event + ':' + (toolId || '')]) { return false; }
            if (!this.endpoint) { return false; }
            /* iframe 内由宿主统计，避免双计 */
            try {
                if (global.parent && global.parent !== global) { return false; }

            var payload = JSON.stringify({ event: event, tool: toolId || '' });

            try {
                if (global.navigator.sendBeacon) {
                    return global.navigator.sendBeacon(
                        this.endpoint + '/api/track',
                        new Blob([payload], { type: 'text/plain;charset=UTF-8' })
                    );
                }
                global.fetch(this.endpoint + '/api/track', {
                    method: 'POST',
                    body: payload,
                    keepalive: true,
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'text/plain;charset=UTF-8' }
                });
                return true;
            } catch (err) {
                return false;
            }
        }
    };

    ET.Stats = Stats;

        { t: '浣溪沙', a: '晏殊', d: '宋', g: '7-9', l: ['一曲新词酒一杯，去年天气旧亭台。夕阳西下几时回？', '无可奈何花落去，似曾相识燕归来。小园香径独徘徊。'] },
        { t: '水调歌头·明月几时有', a: '苏轼', d: '宋', g: '7-9', l: ['明月几时有？把酒问青天。不知天上宫阙，今夕是何年。', '我欲乘风归去，又恐琼楼玉宇，高处不胜寒。起舞弄清影，何似在人间。', '转朱阁，低绮户，照无眠。不应有恨，何事长向别时圆？', '人有悲欢离合，月有阴晴圆缺，此事古难全。但愿人长久，千里共婵娟。'] },
        { t: '饮酒（其五）', a: '陶渊明', d: '东晋', g: '7-9', l: ['结庐在人境，而无车马喧。问君何能尔？心远地自偏。', '采菊东篱下，悠然见南山。山气日夕佳，飞鸟相与还。', '此中有真意，欲辨已忘言。'] },
        { t: '行路难（其一）', a: '李白', d: '唐', g: '7-9', l: ['金樽清酒斗十千，玉盘珍羞直万钱。', '停杯投箸不能食，拔剑四顾心茫然。', '欲渡黄河冰塞川，将登太行雪满山。', '闲来垂钓碧溪上，忽复乘舟梦日边。', '行路难！行路难！多歧路，今安在？', '长风破浪会有时，直挂云帆济沧海。'] },
        { t: '酬乐天扬州初逢席上见赠', a: '刘禹锡', d: '唐', g: '7-9', l: ['巴山楚水凄凉地，二十三年弃置身。', '怀旧空吟闻笛赋，到乡翻似烂柯人。', '沉舟侧畔千帆过，病树前头万木春。', '今日听君歌一曲，暂凭杯酒长精神。'] },
        { t: '白雪歌送武判官归京（节选）', a: '岑参', d: '唐', g: '7-9', l: ['北风卷地白草折，胡天八月即飞雪。', '忽如一夜春风来，千树万树梨花开。'] },

        /* ---------- 初中补充（课本必背） ---------- */
        { t: '登幽州台歌', a: '陈子昂', d: '唐', g: '7-9', l: ['前不见古人，后不见来者。', '念天地之悠悠，独怆然而涕下。'] },
        { t: '竹里馆', a: '王维', d: '唐', g: '7-9', l: ['独坐幽篁里，弹琴复长啸。', '深林人不知，明月来相照。'] },
        { t: '春夜洛城闻笛', a: '李白', d: '唐', g: '7-9', l: ['谁家玉笛暗飞声，散入春风满洛城。', '此夜曲中闻折柳，何人不起故园情。'] },
        { t: '逢入京使', a: '岑参', d: '唐', g: '7-9', l: ['故园东望路漫漫，双袖龙钟泪不干。', '马上相逢无纸笔，凭君传语报平安。'] },
        { t: '晚春', a: '韩愈', d: '唐', g: '7-9', l: ['草树知春不久归，百般红紫斗芳菲。', '杨花榆荚无才思，惟解漫天作雪飞。'] },
        { t: '峨眉山月歌', a: '李白', d: '唐', g: '7-9', l: ['峨眉山月半轮秋，影入平羌江水流。', '夜发清溪向三峡，思君不见下渝州。'] },
        { t: '江南逢李龟年', a: '杜甫', d: '唐', g: '7-9', l: ['岐王宅里寻常见，崔九堂前几度闻。', '正是江南好风景，落花时节又逢君。'] },
        { t: '行军九日思长安故园', a: '岑参', d: '唐', g: '7-9', l: ['强欲登高去，无人送酒来。', '遥怜故园菊，应傍战场开。'] },
        { t: '夜上受降城闻笛', a: '李益', d: '唐', g: '7-9', l: ['回乐烽前沙似雪，受降城外月如霜。', '不知何处吹芦管，一夜征人尽望乡。'] },
        { t: '秋词（其一）', a: '刘禹锡', d: '唐', g: '7-9', l: ['自古逢秋悲寂寥，我言秋日胜春朝。', '晴空一鹤排云上，便引诗情到碧霄。'] },
        { t: '夜雨寄北', a: '李商隐', d: '唐', g: '7-9', l: ['君问归期未有期，巴山夜雨涨秋池。', '何当共剪西窗烛，却话巴山夜雨时。'] },
        { t: '十一月四日风雨大作（其二）', a: '陆游', d: '宋', g: '7-9', l: ['僵卧孤村不自哀，尚思为国戍轮台。', '夜阑卧听风吹雨，铁马冰河入梦来。'] },
        { t: '潼关', a: '谭嗣同', d: '清', g: '7-9', l: ['终古高云簇此城，秋风吹散马蹄声。', '河流大野犹嫌束，山入潼关不解平。'] },
        { t: '约客', a: '赵师秀', d: '宋', g: '7-9', l: ['黄梅时节家家雨，青草池塘处处蛙。', '有约不来过夜半，闲敲棋子落灯花。'] },
        { t: '野望', a: '王绩', d: '唐', g: '7-9', l: ['东皋薄暮望，徙倚欲何依。树树皆秋色，山山唯落晖。', '牧人驱犊返，猎马带禽归。相顾无相识，长歌怀采薇。'] },
        { t: '黄鹤楼', a: '崔颢', d: '唐', g: '7-9', l: ['昔人已乘黄鹤去，此地空余黄鹤楼。', '黄鹤一去不复返，白云千载空悠悠。', '晴川历历汉阳树，芳草萋萋鹦鹉洲。', '日暮乡关何处是？烟波江上使人愁。'] },
        { t: '渡荆门送别', a: '李白', d: '唐', g: '7-9', l: ['渡远荆门外，来从楚国游。山随平野尽，江入大荒流。', '月下飞天镜，云生结海楼。仍怜故乡水，万里送行舟。'] },
        { t: '龟虽寿', a: '曹操', d: '东汉', g: '7-9', l: ['神龟虽寿，犹有竟时。腾蛇乘雾，终为土灰。', '老骥伏枥，志在千里；烈士暮年，壮心不已。', '盈缩之期，不但在天；养怡之福，可得永年。', '幸甚至哉，歌以咏志。'] },
        { t: '赠从弟（其二）', a: '刘桢', d: '东汉', g: '7-9', l: ['亭亭山上松，瑟瑟谷中风。风声一何盛，松枝一何劲！', '冰霜正惨凄，终岁常端正。岂不罹凝寒？松柏有本性。'] },
        { t: '送杜少府之任蜀州', a: '王勃', d: '唐', g: '7-9', l: ['城阙辅三秦，风烟望五津。与君离别意，同是宦游人。', '海内存知己，天涯若比邻。无为在歧路，儿女共沾巾。'] },
        { t: '题破山寺后禅院', a: '常建', d: '唐', g: '7-9', l: ['清晨入古寺，初日照高林。曲径通幽处，禅房花木深。', '山光悦鸟性，潭影空人心。万籁此都寂，但余钟磬音。'] },
        { t: '送友人', a: '李白', d: '唐', g: '7-9', l: ['青山横北郭，白水绕东城。此地一为别，孤蓬万里征。', '浮云游子意，落日故人情。挥手自兹去，萧萧班马鸣。'] },
        { t: '过零丁洋', a: '文天祥', d: '宋', g: '7-9', l: ['辛苦遭逢起一经，干戈寥落四周星。', '山河破碎风飘絮，身世浮沉雨打萍。', '惶恐滩头说惶恐，零丁洋里叹零丁。', '人生自古谁无死？留取丹心照汗青。'] },
        { t: '山坡羊·潼关怀古', a: '张养浩', d: '元', g: '7-9', l: ['峰峦如聚，波涛如怒，山河表里潼关路。', '望西都，意踌躇。伤心秦汉经行处，宫阙万间都做了土。', '兴，百姓苦；亡，百姓苦。'] },
        { t: '南乡子·登京口北固亭有怀', a: '辛弃疾', d: '宋', g: '7-9', l: ['何处望神州？满眼风光北固楼。千古兴亡多少事？悠悠。不尽长江滚滚流。', '年少万兜鍪，坐断东南战未休。天下英雄谁敌手？曹刘。生子当如孙仲谋。'] },
        { t: '月夜忆舍弟', a: '杜甫', d: '唐', g: '7-9', l: ['戍鼓断人行，边秋一雁声。露从今夜白，月是故乡明。', '有弟皆分散，无家问死生。寄书长不达，况乃未休兵。'] },
        { t: '商山早行', a: '温庭筠', d: '唐', g: '7-9', l: ['晨起动征铎，客行悲故乡。鸡声茅店月，人迹板桥霜。', '槲叶落山路，枳花明驿墙。因思杜陵梦，凫雁满回塘。'] },
        { t: '无题（相见时难别亦难）', a: '李商隐', d: '唐', g: '7-9', l: ['相见时难别亦难，东风无力百花残。', '春蚕到死丝方尽，蜡炬成灰泪始干。', '晓镜但愁云鬓改，夜吟应觉月光寒。', '蓬山此去无多路，青鸟殷勤为探看。'] },
        { t: '卜算子·黄州定慧院寓居作', a: '苏轼', d: '宋', g: '7-9', l: ['缺月挂疏桐，漏断人初静。谁见幽人独往来，缥缈孤鸿影。', '惊起却回头，有恨无人省。拣尽寒枝不肯栖，寂寞沙洲冷。'] },
        { t: '木兰诗（节选）', a: '北朝民歌', d: '北朝', g: '7-9', l: ['唧唧复唧唧，木兰当户织。不闻机杼声，惟闻女叹息。', '问女何所思，问女何所忆。女亦无所思，女亦无所忆。', '昨夜见军帖，可汗大点兵。军书十二卷，卷卷有爷名。', '阿爷无大儿，木兰无长兄。愿为市鞍马，从此替爷征。', '东市买骏马，西市买鞍鞯，南市买辔头，北市买长鞭。', '旦辞爷娘去，暮宿黄河边。不闻爷娘唤女声，但闻黄河流水鸣溅溅。', '万里赴戎机，关山度若飞。朔气传金柝，寒光照铁衣。', '将军百战死，壮士十年归。', '雄兔脚扑朔，雌兔眼迷离；双兔傍地走，安能辨我是雄雌？'] },

        /* ---------- 高中（课本必背） ---------- */
        { t: '短歌行（节选）', a: '曹操', d: '东汉', g: '10-12', l: ['对酒当歌，人生几何！譬如朝露，去日苦多。', '慨当以慷，忧思难忘。何以解忧？唯有杜康。', '青青子衿，悠悠我心。但为君故，沉吟至今。', '呦呦鹿鸣，食野之苹。我有嘉宾，鼓瑟吹笙。', '月明星稀，乌鹊南飞。绕树三匝，何枝可依？', '山不厌高，海不厌深。周公吐哺，天下归心。'] },
        { t: '归园田居（其一）', a: '陶渊明', d: '东晋', g: '10-12', l: ['少无适俗韵，性本爱丘山。误落尘网中，一去三十年。', '羁鸟恋旧林，池鱼思故渊。开荒南野际，守拙归园田。', '方宅十余亩，草屋八九间。榆柳荫后檐，桃李罗堂前。', '暧暧远人村，依依墟里烟。狗吠深巷中，鸡鸣桑树颠。', '户庭无尘杂，虚室有余闲。久在樊笼里，复得返自然。'] },
        { t: '登高', a: '杜甫', d: '唐', g: '10-12', l: ['风急天高猿啸哀，渚清沙白鸟飞回。', '无边落木萧萧下，不尽长江滚滚来。', '万里悲秋常作客，百年多病独登台。', '艰难苦恨繁霜鬓，潦倒新停浊酒杯。'] },
        { t: '念奴娇·赤壁怀古', a: '苏轼', d: '宋', g: '10-12', l: ['大江东去，浪淘尽，千古风流人物。故垒西边，人道是，三国周郎赤壁。', '乱石穿空，惊涛拍岸，卷起千堆雪。江山如画，一时多少豪杰。', '遥想公瑾当年，小乔初嫁了，雄姿英发。羽扇纶巾，谈笑间，樯橹灰飞烟灭。', '故国神游，多情应笑我，早生华发。人生如梦，一尊还酹江月。'] },
        { t: '永遇乐·京口北固亭怀古', a: '辛弃疾', d: '宋', g: '10-12', l: ['千古江山，英雄无觅，孙仲谋处。舞榭歌台，风流总被，雨打风吹去。', '斜阳草树，寻常巷陌，人道寄奴曾住。想当年，金戈铁马，气吞万里如虎。', '元嘉草草，封狼居胥，赢得仓皇北顾。四十三年，望中犹记，烽火扬州路。', '可堪回首，佛狸祠下，一片神鸦社鼓。凭谁问：廉颇老矣，尚能饭否？'] },
        { t: '声声慢', a: '李清照', d: '宋', g: '10-12', l: ['寻寻觅觅，冷冷清清，凄凄惨惨戚戚。', '乍暖还寒时候，最难将息。三杯两盏淡酒，怎敌他、晚来风急？', '雁过也，正伤心，却是旧时相识。', '满地黄花堆积。憔悴损，如今有谁堪摘？', '守着窗儿，独自怎生得黑？梧桐更兼细雨，到黄昏、点点滴滴。', '这次第，怎一个愁字了得！'] },
        { t: '锦瑟', a: '李商隐', d: '唐', g: '10-12', l: ['锦瑟无端五十弦，一弦一柱思华年。', '庄生晓梦迷蝴蝶，望帝春心托杜鹃。', '沧海月明珠有泪，蓝田日暖玉生烟。', '此情可待成追忆？只是当时已惘然。'] },
        { t: '书愤', a: '陆游', d: '宋', g: '10-12', l: ['早岁那知世事艰，中原北望气如山。', '楼船夜雪瓜洲渡，铁马秋风大散关。', '塞上长城空自许，镜中衰鬓已先斑。', '出师一表真名世，千载谁堪伯仲间！'] },
        { t: '静女', a: '《诗经》', d: '先秦', g: '10-12', l: ['静女其姝，俟我于城隅。爱而不见，搔首踟蹰。', '静女其娈，贻我彤管。彤管有炜，说怿女美。', '自牧归荑，洵美且异。匪女之为美，美人之贻。'] },
        { t: '客至', a: '杜甫', d: '唐', g: '10-12', l: ['舍南舍北皆春水，但见群鸥日日来。', '花径不曾缘客扫，蓬门今始为君开。', '盘飧市远无兼味，樽酒家贫只旧醅。', '肯与邻翁相对饮，隔篱呼取尽余杯。'] },
        { t: '将进酒（节选）', a: '李白', d: '唐', g: '10-12', l: ['君不见，黄河之水天上来，奔流到海不复回。', '君不见，高堂明镜悲白发，朝如青丝暮成雪。', '人生得意须尽欢，莫使金樽空对月。', '天生我材必有用，千金散尽还复来。', '古来圣贤皆寂寞，惟有饮者留其名。', '五花马，千金裘，呼儿将出换美酒，与尔同销万古愁。'] }

            '<p style="margin:0 0 8px"><b>接句抢答</b>：屏幕给出上句，学生抢答下句，' +
            '点「显示下句」揭晓；「30 秒抢答」给一个倒计时。</p>' +
            '<p style="margin:0"><b>快捷键</b>：<b>1</b>/<b>2</b>/<b>3</b> 切换模式、<b>空格</b> 主操作、' +
            '<b>← →</b> 上下篇、<b>A</b> 显示答案、<b>P</b> 打印。翻页笔下页键 = 主操作。' +
            '选篇与设置只保存在本机浏览器。</p></div>'
    });

    var els = {
        seg: document.getElementById('modeSeg'),
        ctlFill: document.getElementById('fillCtl'),
        ctlFh: document.getElementById('feihuaCtl'),
        ctlSay: document.getElementById('sayCtl'),
        blankSel: document.getElementById('blankSel'),
        fhInput: document.getElementById('fhInput'),
        stat: document.getElementById('stat'),
        preview: document.getElementById('preview'),
        btnReshuffle: document.getElementById('btnReshuffle'),
        btnPrev: document.getElementById('btnPrev'),
        btnNext: document.getElementById('btnNext'),
        btnRandom: document.getElementById('btnRandom'),
        btnSayNext: document.getElementById('btnSayNext'),
        btnSayNew: document.getElementById('btnSayNew'),
        btnSayTimer: document.getElementById('btnSayTimer'),
        btnAnswer: document.getElementById('btnAnswer'),
        btnPrint: document.getElementById('btnPrint')
    };

    var state = loadState();
    var mask = null;          /* 当前篇目的挖空标记 [[bool…]…] */
    var sayPick = null;       /* 接句：{poem, i} */
    var sayRevealed = false;
    var timer = null;         /* 抢答倒计时句柄 */
    var timerOn = false;      /* 倒计时面板是否显示 */
    var timerLeft = 0;

    /* ---------- 基础工具 ---------- */

    function clampInt(v, min, max, fallback) {
        var n = parseInt(v, 10);
        if (isNaN(n)) { return fallback; }
        return Math.max(min, Math.min(max, n));
    }

    function loadState() {
        var s = {};
        for (var k in DEFAULTS) {
            if (Object.prototype.hasOwnProperty.call(DEFAULTS, k)) {
                s[k] = store.get(k, DEFAULTS[k]);
            }
        }
        if (MODES.indexOf(s.mode) < 0) { s.mode = DEFAULTS.mode; }
        if (['chars', 'half', 'line'].indexOf(s.blank) < 0) { s.blank = DEFAULTS.blank; }
        if (!GRADE_LABEL[s.grade]) { s.grade = DEFAULTS.grade; }
        s.ratio = clampInt(s.ratio, 10, 90, DEFAULTS.ratio);
        s.idx = clampInt(s.idx, 0, Math.max(0, POEMS.length - 1), 0);
        s.fh = typeof s.fh === 'string' && s.fh ? s.fh : DEFAULTS.fh;
        return s;
    }

    function persist() {
        for (var k in DEFAULTS) {
            if (Object.prototype.hasOwnProperty.call(DEFAULTS, k)) {
                store.set(k, state[k]);
            }
        }
    }

    function isTypingTarget(node) {
        if (!node || !node.tagName) { return false; }
        var tag = node.tagName.toUpperCase();
        return tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT' || node.isContentEditable === true;
    }

    function el(tag, cls, value) {
        var node = document.createElement(tag);
        if (cls) { node.className = cls; }
        if (value !== undefined && value !== null) { node.textContent = value; }
        return node;
    }

    function isPunct(ch) { return PUNCT.indexOf(ch) >= 0; }

    /* ---------- 篇目 ---------- */

    function pool() {
        if (state.grade === '全部') { return POEMS; }
        var out = [];
        for (var i = 0; i < POEMS.length; i++) {
            if (POEMS[i].g === state.grade) { out.push(POEMS[i]); }
        }
        return out.length ? out : POEMS;
    }

    function currentPoem() {
        var list = pool();
        if (!list.length) { return null; }
        if (state.idx >= list.length) { state.idx = 0; }
        return list[state.idx];
    }

    /* ---------- 挖空 ---------- */

    function buildMask(poem) {
        var out = [];
        for (var i = 0; i < poem.l.length; i++) {
            var line = poem.l[i];
            var flags = [];
            for (var c = 0; c < line.length; c++) {
                var ch = line.charAt(c);
                if (isPunct(ch)) { flags.push(false); continue; }
                if (state.blank === 'line') {
                    flags.push(i % 2 === 1);
                } else if (state.blank === 'half') {
                    flags.push(c >= Math.ceil(line.length / 2));
                } else {
                    flags.push(Math.random() * 100 < state.ratio);
                }
            }
            out.push(flags);
        }
        return out;
    }

    function reshuffle() {
        var poem = currentPoem();
        if (!poem) { return; }
        mask = buildMask(poem);
        state.showAnswer = false;
        persist();
        render();
        chrome.toast('已重新挖空');
    }

    /* ---------- 渲染 ---------- */

    function render() {
        els.preview.innerHTML = '';
        els.preview.appendChild(buildPage());
        syncMode();
        updateStat();
    }

    function buildPage() {
        var page = el('section', 'pq-page');

        var head = el('div', 'pq-head');
        var poem = currentPoem();
        var title = state.mode === 'feihua' ? '飞花令' : (state.mode === 'say' ? '接句抢答' : '古诗默写');
        head.appendChild(el('div', 'pq-title', title));
        var sub = (state.mode === 'fill' && poem)
            ? '《' + poem.t + '》' + poem.d + ' · ' + poem.a
            : (state.mode === 'feihua' ? '含「' + state.fh + '」的诗句' : '看下句，答下句');
        head.appendChild(el('div', 'pq-sub', sub));

        if (state.mode === 'fill' && metaOn()) {
            var meta = el('div', 'pq-meta');
            meta.appendChild(el('span', null, '姓名：____________'));
            meta.appendChild(el('span', null, '班级：__________'));
            meta.appendChild(el('span', null, '得分：________'));
            head.appendChild(meta);
        }
        page.appendChild(head);

        if (state.mode === 'feihua') { page.appendChild(buildFeihua()); }
        else if (state.mode === 'say') { page.appendChild(buildSay()); }
        else { page.appendChild(buildFill(poem)); }
        return page;
    }

    /* ---- 填空默写 ---- */

    function buildFill(poem) {
        var wrap = el('div', 'pq-poem');
        if (!poem) {
            wrap.appendChild(el('div', 'pq-empty', '内置篇目里没有该学段的内容，请在设置里换一个学段。'));
            return wrap;
        }
        if (!mask) { mask = buildMask(poem); }

        wrap.appendChild(el('div', 'pq-poem-title', poem.t));
        wrap.appendChild(el('div', 'pq-poem-author', poem.d + ' · ' + poem.a));

        var lines = el('div', 'pq-lines');
        var blankCount = 0;
        for (var i = 0; i < poem.l.length; i++) {
            var line = el('div', 'pq-line');
            var src = poem.l[i];
            var flags = mask[i] || [];
            for (var c = 0; c < src.length; c++) {
                var ch = src.charAt(c);
                if (flags[c]) {
                    var span = el('span', 'pq-blank' + (state.showAnswer ? ' is-shown' : ''), ch);
                    line.appendChild(span);
                    blankCount++;
                } else {
                    line.appendChild(document.createTextNode(ch));
                }
            }
            lines.appendChild(line);
        }
        wrap.appendChild(lines);
        wrap.appendChild(el('div', 'pq-tip',
            state.blank === 'chars' ? '填空：把空出来的字写在横线上（共 ' + blankCount + ' 字）'
                : state.blank === 'half' ? '补写：把每句的后半句写完整'
                    : '默写：把空出的句子写完整'));
        return wrap;
    }

    /* ---- 飞花令 ---- */

    function buildFeihua() {
        var wrap = el('div');
        var key = state.fh;
        var hits = [];

        if (key) {
            for (var i = 0; i < POEMS.length; i++) {
                var poem = POEMS[i];
                for (var j = 0; j < poem.l.length; j++) {
                    var line = poem.l[j];
                    var from = 0;
                    var at = line.indexOf(key, from);
                    while (at >= 0) {
                        hits.push({ poem: poem, line: line, at: at });
                        from = at + key.length;
                        at = line.indexOf(key, from);
                    }
                }
            }
        }

        var titles = {};
        for (var h = 0; h < hits.length; h++) { titles[hits[h].poem.t] = true; }
        var poemCount = 0;
        for (var kk in titles) {
            if (Object.prototype.hasOwnProperty.call(titles, kk)) { poemCount++; }
        }

        wrap.appendChild(el('div', 'pq-fh-title', key
            ? '含有「' + key + '」的诗句　' + hits.length + ' 处 · 出自 ' + poemCount + ' 首'
            : '在上方输入一个字，或点下面的常用字'));
        wrap.appendChild(el('div', 'pq-fh-count',
            '数据范围：内置 ' + POEMS.length + ' 首教材常见必背篇目（可在设置里按学段筛选）'));

        var chips = el('div', 'pq-chips');
        chips.style.marginTop = '5mm';
        chips.style.justifyContent = 'center';
        for (var c = 0; c < FH_CHIPS.length; c++) {
            (function (word) {
                var chip = el('button', 'pq-chip', word);
                chip.type = 'button';
                chip.addEventListener('click', function () {
                    state.fh = word;
                    els.fhInput.value = word;
                    persist();
                    render();
                });
                chips.appendChild(chip);
            })(FH_CHIPS[c]);
        }
        wrap.appendChild(chips);

        if (!hits.length) {
            wrap.appendChild(el('div', 'pq-empty', key ? '内置篇目中没有含「' + key + '」的诗句' : ''));
            return wrap;
        }

        var list = el('div', 'pq-fh-list');
        var shown = Math.min(hits.length, 60);
        for (var m = 0; m < shown; m++) {
            var item = el('div', 'pq-fh-item');
            item.appendChild(el('span', 'pq-fh-src',
                '《' + hits[m].poem.t + '》' + hits[m].poem.a));
            var text = hits[m].line;
            item.appendChild(document.createTextNode(text.slice(0, hits[m].at)));
            item.appendChild(el('span', 'pq-fh-hit', key));
            item.appendChild(document.createTextNode(text.slice(hits[m].at + key.length)));
            list.appendChild(item);
        }
        wrap.appendChild(list);
        if (hits.length > shown) {
            wrap.appendChild(el('div', 'pq-empty', '… 还有 ' + (hits.length - shown) + ' 处未显示'));
        }
        return wrap;
    }

    /* ---- 接句抢答 ---- */

    function pickSay() {
        var list = pool();
        var tries = 0;
        while (tries++ < 40) {
            var poem = list[Math.floor(Math.random() * list.length)];
            if (!poem || poem.l.length < 2) { continue; }
            var i = Math.floor(Math.random() * (poem.l.length - 1));
            return { poem: poem, i: i };
        }
        return { poem: list[0], i: 0 };
    }

    function buildSay() {
        var wrap = el('div', 'pq-say');
        if (!sayPick) { sayPick = pickSay(); }
        var poem = sayPick.poem;
        var i = sayPick.i;
        var cur = poem.l[i];
        var next = poem.l[i + 1] || '（这是最后一句）';

        wrap.appendChild(el('div', 'pq-say-src', '《' + poem.t + '》' + poem.d + ' · ' + poem.a +
            '　（第 ' + (i + 1) + ' / ' + poem.l.length + ' 句）'));
        wrap.appendChild(el('div', 'pq-say-line', cur));
        var nextBox = el('div', 'pq-say-next' + (sayRevealed ? '' : ' is-hidden'), next);
        wrap.appendChild(nextBox);

        if (timerOn) {
            var clock = el('div', 'pq-timer' + (timerLeft <= 0 ? ' is-over' : ''),
                timerLeft > 0 ? timerLeft + ' 秒' : '时间到！');
            wrap.appendChild(clock);
        }
        wrap.appendChild(el('div', 'pq-tip', sayRevealed ? '点「换一句」继续' : '请抢答下一句，点「显示下句」揭晓'));
        return wrap;
    }

    function showSayNext() {
        if (state.mode !== 'say') { return; }
        if (!sayPick) { sayPick = pickSay(); }
        sayRevealed = true;
        render();
        try { chrome.beep('ok'); } catch (e) { /* 静默 */ }
    }

    function newSay() {
        sayPick = pickSay();
        sayRevealed = false;
        stopTimer();
        render();
    }

    function startTimer() {
        if (state.mode !== 'say') { chrome.toast('先切到「接句抢答」再用倒计时'); return; }
        stopTimer();
        timerOn = true;
        timerLeft = 30;
        timer = window.setInterval(function () {
            timerLeft--;
            if (timerLeft <= 0) {
                timerLeft = 0;
                window.clearInterval(timer);
                timer = null;
                render();
                try { chrome.beep('over'); } catch (e) { /* 静默 */ }
                chrome.toast('时间到！', 'warn');
                return;
            }
            var node = els.preview.querySelector('.pq-timer');
            if (node) { node.textContent = timerLeft + ' 秒'; }
        }, 1000);
        render();
        chrome.toast('30 秒抢答开始');
    }

    function stopTimer() {
        if (timer) {
            window.clearInterval(timer);
            timer = null;
        }
        timerOn = false;
        timerLeft = 0;
    }

    /* ---------- 模式 / 操作 ---------- */

    function syncMode() {
        var btns = els.seg.getElementsByTagName('button');
        for (var i = 0; i < btns.length; i++) {
            btns[i].className = btns[i].getAttribute('data-mode') === state.mode ? 'is-on' : '';
        }
        els.ctlFill.hidden = state.mode !== 'fill';
        els.ctlFh.hidden = state.mode !== 'feihua';
        els.ctlSay.hidden = state.mode !== 'say';
        els.blankSel.value = state.blank;
        els.btnAnswer.querySelector('span').textContent =
            (state.mode === 'say' ? (sayRevealed ? '再藏一次' : '显示下句') : (state.showAnswer ? '隐藏答案' : '显示答案'));
        els.btnAnswer.hidden = state.mode === 'feihua';
        els.btnPrint.hidden = state.mode === 'feihua';
    }

    function updateStat() {
        if (state.mode === 'fill') {
            var poem = currentPoem();
            var list = pool();
            els.stat.textContent = poem
                ? '《' + poem.t + '》· 第 ' + (state.idx + 1) + ' / ' + list.length + ' 首 · ' +
                (GRADE_LABEL[state.grade] || '全部学段')
                : '该学段暂无篇目';
        } else if (state.mode === 'feihua') {
            els.stat.textContent = '含「' + state.fh + '」的诗句';
        } else {
            els.stat.textContent = sayRevealed ? '已揭晓' : '等待抢答';
        }
        chrome.setStatus(state.mode === 'fill' ? '填空默写' : (state.mode === 'feihua' ? '飞花令' : '接句抢答'), 'ok');
    }

    function setMode(mode) {
        if (MODES.indexOf(mode) < 0 || mode === state.mode) { return; }
        state.mode = mode;
        if (mode === 'say' && !sayPick) { sayPick = pickSay(); sayRevealed = false; }
        if (mode !== 'say') { stopTimer(); }
        persist();
        render();
    }

    function go(delta) {
        var list = pool();
        if (!list.length) { return; }
        state.idx = ((state.idx + delta) % list.length + list.length) % list.length;
        mask = null;
        state.showAnswer = false;
        persist();
        render();
    }

    function prevPoem() { go(-1); }

    function nextPoem() { go(1); }

    function randomPoem() {
        var list = pool();
        if (list.length < 2) { return; }
        var next = state.idx;
        while (next === state.idx) { next = Math.floor(Math.random() * list.length); }
        state.idx = next;
        mask = null;
        state.showAnswer = false;
        persist();
        render();
    }

    function toggleAnswer() {
        if (state.mode === 'feihua') { return; }
        if (state.mode === 'say') {
            if (sayRevealed) { sayRevealed = false; render(); }
            else { showSayNext(); }
            return;
        }
        state.showAnswer = !state.showAnswer;
        persist();
        render();
    }

    function doPrint() {
        if (typeof window.print !== 'function') { chrome.toast('当前环境不支持打印', 'err'); return; }
        window.setTimeout(function () {
            try { window.print(); } catch (e) { chrome.toast('打印失败，请用浏览器打印快捷键', 'err'); }
        }, 60);
    }

    function onPrimary() {
        if (state.mode === 'fill') { nextPoem(); }
        else if (state.mode === 'say') { showSayNext(); }
        else { chrome.toast('飞花令模式下可输入关键字查诗句'); }
    }

    function onSecondary() {
        if (state.mode === 'fill') { reshuffle(); }
        else if (state.mode === 'say') { newSay(); }
        else { chrome.toast('飞花令模式下可输入关键字查诗句'); }
    }

    /* ---------- 设置抽屉 ---------- */

    function options(pairs, current) {
        var out = '';
        for (var i = 0; i < pairs.length; i++) {
            out += '<option value="' + pairs[i][0] + '"' +
                (String(pairs[i][0]) === String(current) ? ' selected' : '') + '>' + pairs[i][1] + '</option>';
        }
        return out;
    }

    function buildSettings(body) {
        body.innerHTML =
            '<h4>篇目范围</h4>' +
            '<div class="et-drawer__row">' +
            '<select class="et-drawer__input" id="pqSetGrade">' +
            options([['全部', '全部学段'], ['1-2', '小学低年级（1–2）'], ['3-4', '小学中年级（3–4）'],
                ['5-6', '小学高年级（5–6）'], ['7-9', '初中（7–9）'], ['10-12', '高中（10–12）']], state.grade) +
            '</select></div>' +
            '<p class="et-drawer__tip">当前范围共 <b>' + pool().length + '</b> 首；' +
            '「随机一篇」「上一篇 / 下一篇」都只在这个范围内选。</p>' +

            '<h4>挖空方式</h4>' +
            '<div class="et-drawer__row">' +
            '<select class="et-drawer__input" id="pqSetBlank">' +
            options([['chars', '挖字填空（随机空字）'], ['half', '每句后半挖空（补下句）'],
                ['line', '整句挖空（默整句）']], state.blank) +
            '</select></div>' +
            '<div class="et-drawer__row" style="margin-top:8px">' +
            '<input class="et-drawer__input" id="pqSetRatio" type="number" min="10" max="90" step="5" value="' +
            state.ratio + '" style="flex:0 0 84px" title="挖字比例">' +
            '<span class="etimp-dim">% 挖字比例（仅「挖字填空」生效）</span></div>' +
            '<p class="et-drawer__tip">默写卷建议：低年级 30%（扶一扶），高年级 50% 以上或直接用整句挖空。</p>' +

            '<h4>纸面</h4>' +
            '<label class="et-drawer__switch">打印姓名 / 班级 / 得分栏' +
            '<input type="checkbox" id="pqSetMeta"' + (metaOn() ? ' checked' : '') + '></label>' +
            '<p class="et-drawer__tip">内置 <b>' + POEMS.length + '</b> 首公版古诗文（抽取自同族工具「古诗词卡片」），' +
            '数据完全内置，断网可用。</p>' +

            '<h4>当前</h4>' +
            '<div class="et-drawer__row">' +
            '<button class="et-btn" id="pqSetRe" type="button">重新挖空</button>' +
            '<button class="et-btn" id="pqSetRandom" type="button">随机一篇</button>' +
            '</div>';

        var q = function (id) { return document.getElementById(id); };
        q('pqSetGrade').addEventListener('change', function () {
            state.grade = GRADE_LABEL[this.value] ? this.value : '全部';
            state.idx = 0;
            mask = null;
            persist();
            render();
        });
        q('pqSetBlank').addEventListener('change', function () {
            state.blank = ['chars', 'half', 'line'].indexOf(this.value) >= 0 ? this.value : 'chars';
            mask = null;
            state.showAnswer = false;
            persist();
            render();
        });
        q('pqSetRatio').addEventListener('change', function () {
            state.ratio = clampInt(this.value, 10, 90, DEFAULTS.ratio);
            this.value = state.ratio;
            mask = null;
            persist();
            render();
        });
        q('pqSetMeta').addEventListener('change', function () {
            store.set('meta', this.checked);
            render();
        });
        q('pqSetRe').addEventListener('click', reshuffle);
        q('pqSetRandom').addEventListener('click', randomPoem);
    }

    function metaOn() { return store.get('meta', true) !== false; }

    /* ---------- 事件与启动 ---------- */

    var segBtns = els.seg.getElementsByTagName('button');
    for (var b = 0; b < segBtns.length; b++) {
        (function (btn) {
            btn.addEventListener('click', function () { setMode(btn.getAttribute('data-mode')); });
        })(segBtns[b]);
    }

    els.blankSel.addEventListener('change', function () {
        state.blank = ['chars', 'half', 'line'].indexOf(this.value) >= 0 ? this.value : 'chars';
        mask = null;
        state.showAnswer = false;
        persist();
        render();
    });

    els.fhInput.addEventListener('input', function () {
        state.fh = this.value.trim();
        persist();
        render();
    });

    els.btnReshuffle.addEventListener('click', reshuffle);
    els.btnPrev.addEventListener('click', prevPoem);
    els.btnNext.addEventListener('click', nextPoem);
    els.btnRandom.addEventListener('click', randomPoem);
    els.btnSayNext.addEventListener('click', showSayNext);
    els.btnSayNew.addEventListener('click', newSay);
    els.btnSayTimer.addEventListener('click', startTimer);
    els.btnAnswer.addEventListener('click', toggleAnswer);
    els.btnPrint.addEventListener('click', doPrint);

    document.addEventListener('keydown', function (e) {
        if (isTypingTarget(e.target)) { return; }
        if (e.key === '1') { setMode('fill'); }
        else if (e.key === '2') { setMode('feihua'); }
        else if (e.key === '3') { setMode('say'); }
        else if (e.key === 'ArrowLeft') { if (state.mode === 'fill') { prevPoem(); e.preventDefault(); } }
        else if (e.key === 'ArrowRight') { if (state.mode === 'fill') { nextPoem(); e.preventDefault(); } }
        else if (e.key === 'a' || e.key === 'A') { toggleAnswer(); }
        else if ((e.key === 'p' || e.key === 'P') && !e.ctrlKey && !e.metaKey) { doPrint(); }
        else if (e.key === ' ' || e.code === 'Space') {
            e.preventDefault();
            onPrimary();
        }
    });

    els.fhInput.value = state.fh;
    mask = null;
    render();
