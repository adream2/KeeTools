/*!
 * et-chrome.css — 工具通用外壳样式（顶栏 / 页脚 / 弹窗 / 按钮 / 主题）
 *
 * 共享样式源。改这里，然后跑：python scripts/sync_shared.py
 * 所有类名带 et- 前缀，避免与工具自身样式冲突。
 * 依赖：无外部资源；颜色全部为令牌变量。
 */

/* ============ 设计令牌 ============ */
:root {
    --et-accent: #2563eb;
    --et-accent-weak: rgba(37, 99, 235, .14);
    --et-bg: #f4f6fb;
    --et-surface: #ffffff;
    --et-surface-2: #f8fafc;
    --et-fg: #0b1220;
    --et-muted: #64748b;
    --et-line: rgba(15, 23, 42, .12);
    --et-line-strong: rgba(15, 23, 42, .22);
    --et-glass: rgba(255, 255, 255, .85);
    --et-shadow-md: 0 10px 28px -18px rgba(15, 23, 42, .3);
    --et-shadow-lg: 0 24px 60px -32px rgba(15, 23, 42, .4);
    --et-ok: #059669;
    --et-warn: #d97706;
    --et-err: #dc2626;
    --et-radius: 12px;
    --et-radius-sm: 9px;
    --et-font: -apple-system, BlinkMacSystemFont, "Segoe UI",
               "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei",
               "Noto Sans SC", sans-serif;
    --et-mono: ui-monospace, "Cascadia Mono", Consolas, Menlo, monospace;
}

html[data-et-theme="dark"] {
    --et-bg: #0b1120;
    --et-surface: #111a2e;
    --et-surface-2: #0f1729;
    --et-fg: #f1f5f9;
    --et-muted: #94a3b8;
    --et-line: rgba(148, 163, 184, .18);
    --et-line-strong: rgba(148, 163, 184, .3);
    --et-glass: rgba(17, 26, 46, .85);
    --et-shadow-md: 0 10px 34px -18px rgba(0, 0, 0, .8);
    --et-shadow-lg: 0 24px 70px -30px rgba(0, 0, 0, .9);
    --et-ok: #34d399;
    --et-warn: #fbbf24;
    --et-err: #f87171;
}

/* ============ 基础 ============ */

/* body 作为外壳时必须清掉浏览器默认 8px 外边距，
   否则 iframe 预览中文档会比视口高 16px（底部白边 + 多余滚动） */
body.et-app {
    margin: 0;
}

.et-app {
    position: relative;
    isolation: isolate;
    display: flex;
    flex-direction: column;
    height: 100vh;
    height: 100dvh;
    overflow: hidden;
    background: var(--et-bg);
    color: var(--et-fg);
    font-family: var(--et-font);
    -webkit-font-smoothing: antialiased;
    transition: background .25s, color .25s;
}

/* 极光背景：径向渐变 + 呼吸动画（edupick 品质基线，老内核也不掉帧） */
.et-app::before {
    content: '';
    position: fixed;
    inset: 0;
    z-index: -1;
    pointer-events: none;
    background:
        radial-gradient(46% 40% at 20% 18%, var(--et-accent-weak), transparent 65%),
        radial-gradient(42% 38% at 82% 24%, var(--et-accent-weak), transparent 70%),
        radial-gradient(50% 44% at 55% 95%, rgba(16, 185, 129, .10), transparent 65%);
    animation: et-aurora 16s ease-in-out infinite alternate;
}

@keyframes et-aurora {
    from { opacity: .55; transform: scale(1); }
    to { opacity: 1; transform: scale(1.06); }
}

.et-app *,
.et-app *::before,
.et-app *::after { box-sizing: border-box; }

[hidden] { display: none !important; }

.et-icon {
    width: 18px;
    height: 18px;
    fill: none;
    stroke: currentColor;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
    flex: none;
}

/* ============ 顶栏 ============ */
.et-topbar {
    flex: none;
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 11px 20px;
    border-bottom: 1px solid var(--et-line);
    background: var(--et-glass);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    z-index: 20;
}

.et-brand {
    display: flex;
    align-items: center;
    gap: 10px;
    min-width: 0;
}

.et-brand__dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: var(--et-accent);
    box-shadow: 0 0 0 4px var(--et-accent-weak);
    flex: none;
}

.et-brand__name {
    font-weight: 800;
    font-size: 15px;
    letter-spacing: -.01em;
    white-space: nowrap;
}

.et-brand__sub {
    font-size: 12.5px;
    color: var(--et-muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.et-status {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 5px 14px;
    border-radius: 999px;
    font-size: 12.5px;
    color: var(--et-muted);
    background: var(--et-surface-2);
    border: 1px solid var(--et-line);
    white-space: nowrap;
    max-width: 42vw;
    overflow: hidden;
    text-overflow: ellipsis;
}

.et-status__dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--et-ok);
    flex: none;
    transition: background .2s;
}

.et-status[data-tone="err"] .et-status__dot { background: var(--et-err); }
.et-status[data-tone="warn"] .et-status__dot { background: var(--et-warn); }

.et-actions {
    display: flex;
    align-items: center;
    gap: 7px;
}

.et-icon-btn {
    display: inline-grid;
    place-items: center;
    width: 38px;
    height: 38px;
    font-size: 16px;
    line-height: 1;
    border-radius: 11px;
    border: 1px solid var(--et-line);
    background: var(--et-surface-2);
    color: var(--et-fg);
    cursor: pointer;
    transition: transform .14s, border-color .14s, color .14s, opacity .14s;
    -webkit-tap-highlight-color: transparent;
}

.et-icon-btn:hover {
    border-color: var(--et-accent);
    color: var(--et-accent);
    transform: translateY(-1px);
}

.et-icon-btn:active { transform: translateY(0); }
.et-icon-btn.is-off { opacity: .4; }
.et-icon-btn:focus-visible { outline: 2px solid var(--et-accent); outline-offset: 2px; }

/* ============ 主区默认 ============ */
.et-main {
    flex: 1;
    min-height: 0;
    position: relative;
    overflow: auto;
}

/* ============ 页脚（品牌回流 L2） ============ */
.et-footer {
    flex: none;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 7px 16px;
    font-size: 12px;
    color: var(--et-muted);
    border-top: 1px solid var(--et-line);
    background: var(--et-glass);
    user-select: none;
    z-index: 20;
}

.et-footer a {
    color: inherit;
    text-decoration: none;
    transition: color .14s;
}

.et-footer a:hover { color: var(--et-accent); }

/* ============ 按钮 ============ */
.et-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
    padding: 9px 16px;
    border-radius: 11px;
    font: inherit;
    font-size: 13.5px;
    font-weight: 700;
    border: 1px solid var(--et-line);
    background: var(--et-surface-2);
    color: var(--et-fg);
    cursor: pointer;
    transition: transform .14s, border-color .14s, color .14s, background .14s, box-shadow .14s;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
}

.et-btn:hover {
    border-color: var(--et-accent);
    color: var(--et-accent);
    transform: translateY(-1px);
}

.et-btn:active { transform: translateY(0); }
.et-btn:focus-visible { outline: 2px solid var(--et-accent); outline-offset: 2px; }
.et-btn:disabled { opacity: .45; cursor: not-allowed; transform: none; }

.et-btn--primary {
    background: var(--et-accent);
    border-color: var(--et-accent);
    color: #fff;
    box-shadow: 0 6px 18px -8px var(--et-accent);
}

.et-btn--primary:hover { color: #fff; filter: brightness(1.08); }
.et-btn--primary:disabled { filter: none; }

.et-btn--danger:hover {
    border-color: var(--et-err);
    color: var(--et-err);
}

.et-btn--lg {
    padding: 13px 26px;
    font-size: 16px;
    border-radius: 14px;
}

/* ============ 弹窗 ============ */
.et-modal {
    position: fixed;
    inset: 0;
    z-index: 100;
    display: grid;
    place-items: center;
    padding: 24px;
    background: rgba(2, 6, 23, .55);
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    animation: et-fade .18s ease;
}

.et-modal__panel {
    width: min(680px, 94vw);
    max-height: 86vh;
    max-height: 86dvh;
    display: flex;
    flex-direction: column;
    background: var(--et-surface);
    border: 1px solid var(--et-line);
    border-radius: 16px;
    box-shadow: var(--et-shadow-lg);
    animation: et-pop .2s cubic-bezier(.34, 1.4, .64, 1);
    overflow: hidden;
}

.et-modal__panel--narrow { width: min(460px, 92vw); }
.et-modal__panel--wide { width: min(900px, 94vw); }

.et-modal__head {
    flex: none;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 16px 20px;
    border-bottom: 1px solid var(--et-line);
    font-weight: 800;
    font-size: 15px;
}

.et-modal__head .et-icon-btn {
    margin-left: auto;
    width: 32px;
    height: 32px;
}

.et-modal__body {
    flex: 1;
    min-height: 0;
    overflow: auto;
    padding: 18px 20px;
}

.et-modal__foot {
    flex: none;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 14px 20px;
    border-top: 1px solid var(--et-line);
    background: var(--et-surface-2);
}

.et-modal__foot .spacer { flex: 1; }

@keyframes et-fade {
    from { opacity: 0; }
}

@keyframes et-pop {
    from { opacity: 0; transform: translateY(14px) scale(.97); }
}

/* ============ 轻提示（toast） ============ */
.et-toast {
    position: fixed;
    left: 50%;
    bottom: 56px;
    transform: translateX(-50%) translateY(10px);
    z-index: 120;
    display: flex;
    align-items: center;
    gap: 9px;
    max-width: min(520px, 88vw);
    padding: 11px 18px;
    border-radius: 12px;
    font-size: 13.5px;
    font-weight: 600;
    color: #fff;
    background: rgba(15, 23, 42, .92);
    border: 1px solid rgba(148, 163, 184, .25);
    box-shadow: var(--et-shadow-lg);
    opacity: 0;
    pointer-events: none;
    transition: opacity .22s, transform .22s;
}

.et-toast.is-show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
}

.et-toast[data-tone="ok"] { background: rgba(5, 150, 105, .95); }
.et-toast[data-tone="err"] { background: rgba(220, 38, 38, .95); }
.et-toast[data-tone="warn"] { background: rgba(217, 119, 6, .95); }

/* ============ 设置抽屉（右上角入口，edupick 交互） ============ */
.et-drawer-backdrop {
    position: fixed;
    inset: 0;
    z-index: 90;
    background: rgba(2, 6, 23, .45);
    backdrop-filter: blur(3px);
    -webkit-backdrop-filter: blur(3px);
    opacity: 0;
    transition: opacity .2s;
}

.et-drawer-backdrop.is-open { opacity: 1; }

.et-drawer {
    position: absolute;
    top: 0;
    right: 0;
    height: 100%;
    width: min(400px, 92vw);
    display: flex;
    flex-direction: column;
    background: var(--et-surface);
    border-left: 1px solid var(--et-line);
    box-shadow: var(--et-shadow-lg);
    transform: translateX(100%);
    transition: transform .22s cubic-bezier(.32, .72, .35, 1);
}

.et-drawer-backdrop.is-open .et-drawer { transform: translateX(0); }

.et-drawer__head {
    flex: none;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 15px 18px;
    border-bottom: 1px solid var(--et-line);
    font-weight: 800;
    font-size: 15px;
    color: var(--et-accent);
}

.et-drawer__head .et-icon-btn {
    margin-left: auto;
    width: 32px;
    height: 32px;
}

.et-drawer__body {
    flex: 1;
    min-height: 0;
    overflow: auto;
    padding: 16px 18px 24px;
}

/* 抽屉内容通用小节（工具复用） */
.et-drawer__body h4 {
    margin: 18px 0 8px;
    font-size: 12px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: .08em;
    color: var(--et-muted);
}

.et-drawer__body h4:first-child { margin-top: 0; }

.et-drawer__row {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
}

.et-drawer__tip {
    margin: 8px 0 0;
    font-size: 12px;
    line-height: 1.8;
    color: var(--et-muted);
}

.et-drawer__tip b { color: var(--et-fg); }

.et-drawer__input {
    flex: 1;
    min-width: 0;
    padding: 9px 12px;
    border: 1px solid var(--et-line-strong);
    border-radius: 9px;
    background: var(--et-surface-2);
    color: var(--et-fg);
    font: inherit;
    font-size: 13.5px;
    transition: border-color .14s, box-shadow .14s;
}

.et-drawer__input:focus {
    outline: none;
    border-color: var(--et-accent);
    box-shadow: 0 0 0 3px var(--et-accent-weak);
}

.et-drawer__switch {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 10px 0;
    border-bottom: 1px dashed var(--et-line);
    font-size: 13.5px;
    font-weight: 600;
    color: var(--et-fg);
    cursor: pointer;
    user-select: none;
}

.et-drawer__switch input {
    width: 17px;
    height: 17px;
    accent-color: var(--et-accent);
    cursor: pointer;
}
</style>

        tick: [[880, 0, 0.06, 0.42]],
        ok: [[660, 0, 0.1, 0.46], [880, 0.1, 0.14, 0.46]],
        win: [[523.25, 0, 0.16, 0.5], [659.25, 0.12, 0.16, 0.5], [783.99, 0.24, 0.16, 0.5], [1046.5, 0.36, 0.34, 0.52]],

    };

    function playBeep(kind) {
        var ctx = ensureCtx();
        if (!ctx || !BEEPS[kind]) { return; }
        var seq = BEEPS[kind];
        var t0 = ctx.currentTime + 0.01;
        for (var i = 0; i < seq.length; i++) {
            tone(ctx, seq[i][0], t0 + seq[i][1], seq[i][2], seq[i][3] * MASTER_GAIN, seq[i][4]);

    /* ---------- 设置抽屉 ---------- */

    function openDrawer(title, build) {
        var backdrop = el('div', 'et-drawer-backdrop');
        var drawer = el('aside', 'et-drawer');
        drawer.setAttribute('role', 'dialog');
        drawer.setAttribute('aria-label', title);

        var head = el('div', 'et-drawer__head');
        head.appendChild(makeIcon('i-sliders'));
        head.appendChild(el('span', 'et-drawer__title', title));
        head.appendChild(makeBtn('i-x', '关闭', close));

        backdrop.appendChild(drawer);
        document.body.appendChild(backdrop);

        function close() {
            backdrop.classList.remove('is-open');
            document.removeEventListener('keydown', onKey);
            setTimeout(function () {
                if (backdrop.parentNode) { backdrop.parentNode.removeChild(backdrop); }
            }, 220);

        function onKey(ev) {
            if (ev.key === 'Escape') { ev.stopPropagation(); close(); }
        }
        document.addEventListener('keydown', onKey);
        backdrop.addEventListener('mousedown', function (ev) {

        if (typeof build === 'function') { build(body, { close: close }); }

    /* ---------- 通用弹窗 / toast（同时挂模块级，供其他共享组件使用） ---------- */

    function modal(mo) {

        var panel = el('div', 'et-modal__panel' + (mo.size === 'narrow' ? ' et-modal__panel--narrow'
            : mo.size === 'wide' ? ' et-modal__panel--wide' : ''));

        if (mo.icon) { head.appendChild(makeIcon(mo.icon)); }
        head.appendChild(el('span', null, mo.title || ''));
        head.appendChild(makeBtn('i-x', '关闭', close));
        panel.appendChild(head);

        var body = el('div', 'et-modal__body');
        if (typeof mo.body === 'string') { body.innerHTML = mo.body; }
        else if (mo.body) { body.appendChild(mo.body); }
        panel.appendChild(body);

        var foot = null;
        if (mo.buttons && mo.buttons.length) {
            foot = el('div', 'et-modal__foot');
            foot.appendChild(el('span', 'spacer'));
            mo.buttons.forEach(function (b) {
                var btn = el('button', 'et-btn' + (b.primary ? ' et-btn--primary' : '') + (b.danger ? ' et-btn--danger' : ''), b.label);
                btn.type = 'button';
                btn.addEventListener('click', function () {
                    if (b.onClick) { b.onClick(close); } else { close(); }
                });
                foot.appendChild(btn);
            });
            panel.appendChild(foot);
        }

        backdrop.appendChild(panel);
        document.body.appendChild(backdrop);

        function close() {
            if (backdrop.parentNode) { backdrop.parentNode.removeChild(backdrop); }
            document.removeEventListener('keydown', onKey);
            if (mo.onClose) { mo.onClose(); }
        }
        function onKey(ev) {
            if (ev.key === 'Escape') { ev.stopPropagation(); close(); }
        }
        document.addEventListener('keydown', onKey);
        backdrop.addEventListener('mousedown', function (ev) {

    var toastEl = null;

        toastTimer = setTimeout(function () { toastEl.classList.remove('is-show'); }, 2200);

    /* ---------- PWA 元数据（blob manifest，环境不支持时静默跳过） ---------- */

    function installPwa(toolId, title, accent) {
        try {
            var theme = document.querySelector('meta[name="theme-color"]');
            if (!theme) {
                theme = document.createElement('meta');
                theme.setAttribute('name', 'theme-color');

                'fill="#fff" text-anchor="middle">' + (title || '课').charAt(0) + '</text></svg>';
            var iconUri = 'data:image/svg+xml,' + encodeURIComponent(svg);

            var mf = {
                name: title || 'KeeTools 课工具',
                short_name: title || '课工具',
                start_url: '.',
                display: 'standalone',

                theme_color: accent || '#2563eb',
                icons: [{ src: iconUri, sizes: 'any', type: 'image/svg+xml', purpose: 'any' }]
            };
            var blob = new Blob([JSON.stringify(mf)], { type: 'application/manifest+json' });
            var link = document.createElement('link');
            link.rel = 'manifest';
            link.href = URL.createObjectURL(blob);

        brand.appendChild(nameWrap);
        topbar.appendChild(brand);

        /* 状态胶囊 */

        statusPill.hidden = true;
        statusPill.appendChild(el('span', 'et-status__dot'));
        var statusText = el('span', null, '');

        api.setStatus = function (text, tone) {

        /* 动作区（edupick 交互：右上角聚合设置入口） */
        var actions = el('div', 'et-actions');

        (opt.actions || []).forEach(function (a) {

        var soundBtn = null;

        }

        /* 全屏按钮始终保留：iframe 内对本工具文档 requestFullscreen

        var fsBtn = makeBtn('i-maximize', '全屏', toggleFullscreen);
        actions.appendChild(fsBtn);

        function toggleSound() {
            soundEnabled = !soundEnabled;
            store.set('sound', soundEnabled);
            soundBtn.innerHTML = '';
            soundBtn.appendChild(makeIcon(soundEnabled ? 'i-volume' : 'i-volume-off'));
            soundBtn.title = soundEnabled ? '关闭音效' : '开启音效';
            soundBtn.classList.toggle('is-off', !soundEnabled);

        api.openSettings = function () {
            if (settingsBtn) { settingsBtn.click(); }

        /* ---------- 全屏（iframe 内委托宿主，避免双层全屏） ---------- */

        function inIframe() {
            try { return global.parent && global.parent !== global; } catch (err) { return true; }
        }

        function toggleFullscreen() {
            var root = document.documentElement;
            var fsEl = document.fullscreenElement || document.webkitFullscreenElement || null;
            if (fsEl) {
                (document.exitFullscreen || document.webkitExitFullscreen || function () {}).call(document);
            } else {
                var req = root.requestFullscreen || root.webkitRequestFullscreen;
                if (req) { try { req.call(root); } catch (err) { /* 忽略 */ } }
            }
        }

        function syncFsIcon(on) {

            fsBtn.appendChild(makeIcon(on ? 'i-minimize' : 'i-maximize'));
            fsBtn.title = on ? '退出全屏' : '全屏';
        }

        document.addEventListener('fullscreenchange', function () {
            syncFsIcon(!!(document.fullscreenElement || document.webkitFullscreenElement));
        });
        document.addEventListener('webkitfullscreenchange', function () {
            syncFsIcon(!!(document.fullscreenElement || document.webkitFullscreenElement));
        });
        syncFsIcon(false);

        api.toggleFullscreen = toggleFullscreen;

        /* ---------- 音效 API ---------- */
        api.beep = function (kind) {
            if (!soundEnabled) { return; }
            playBeep(kind);
        };
        api.soundOn = function () { return soundEnabled; };

        api.modal = modal;

        /* ---------- 帮助 ---------- */
        function openHelp() {
            modal({
                title: '使用说明',
                icon: 'i-help',

                buttons: [{ label: '知道了', primary: true }]
            });
        }
        api.openHelp = openHelp;

        /* ---------- toast ---------- */
        api.toast = toast;

        /* ---------- 页脚（L2 品牌回流，低调一行） ---------- */
        var siteOrigin = typeof global.ET_SITE_ORIGIN === 'string' && /^https?:\/\//.test(global.ET_SITE_ORIGIN)
            ? global.ET_SITE_ORIGIN
            : null;

        function renderFooter() {
            footer.textContent = '';
            footer.appendChild(el('span', null, 'KeeTools 课工具'));
            footer.appendChild(el('span', null, '·'));
            if (siteOrigin) {
                var a = el('a', null, '更多课堂工具');
                a.href = siteOrigin + '/?from=tool-footer&tool=' + encodeURIComponent(toolId);
                a.target = '_blank';
                a.rel = 'noopener';
                footer.appendChild(a);
            } else {
                footer.appendChild(el('span', null, '更多课堂工具'));
            }
        }
        renderFooter();

        /* 站点来源发现：iframe 内向父窗口询问；也可由宿主直接注入 ET_SITE_ORIGIN */
        try {
            if (global.parent && global.parent !== global) {
                global.parent.postMessage(JSON.stringify({ type: 'et-hello', toolId: toolId }), '*');
            }
        } catch (err) { /* 跨域异常忽略 */ }

        global.addEventListener('message', function (ev) {
            var data = ev.data;
            if (typeof data === 'string') {
                try { data = JSON.parse(data); } catch (err) { return; }

            if (!data || typeof data !== 'object') { return; }

            if (data.type === 'et-origin' && typeof data.origin === 'string' && /^https?:\/\//.test(data.origin)) {
                siteOrigin = data.origin;
                if (!global.ET_SITE_ORIGIN) { global.ET_SITE_ORIGIN = data.origin; }

            if (data.type === 'et-fullscreen-change' && typeof data.value === 'boolean') {

        if (typeof opt.primary === 'function') {

                if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') { return; }
                if (document.querySelector('.et-modal, .et-drawer-backdrop, .ws-winner')) { return; }
                ev.preventDefault();
                if (ev.key === 'PageDown') { opt.primary(); }
                else if (typeof opt.secondary === 'function') { opt.secondary(); }
                else { opt.primary(); }
            });

<script>
  /* 此块由 scripts/sync_shared.py 自动注入，请勿手工修改 */
/*!
 * et-stats.js — 使用统计模块（模块化，可整体移除）
 *
 * 共享逻辑源。改这里，然后跑：python scripts/sync_shared.py
 * 依赖：无（可脱离 et-util / et-chrome 独立运行）。
 * 全局：ET.Stats
 *
 * ┌────────────────────────────────────────────────────────────────┐
 * │ 说明：本模块只做一件事——工具被打开时向上报端点发一条匿名计数。 │
 * │ · 在线（iframe 内）：宿主页面已服务端计数，本模块不重复上报。   │
 * │ · 离线打开（file:// / 下载单文件 / 离线包）：联网条件具备时，   │
 * │   以 sendBeacon 上报 use_offline 事件（text/plain 免预检）。    │
 * │ · 上报端点 = window.ET_SITE_ORIGIN（由宿主注入或离线包配置）。  │
 * │   未配置端点时本模块完全静默，不发任何请求。                    │
 * │ · **整个 <script> 块可安全删除**：删除后工具其余功能完全正常，  │
 * │   且完全不再发起任何网络请求。                                  │
 * └────────────────────────────────────────────────────────────────┘
 */
(function (global) {
    'use strict';

    var ET = global.ET = global.ET || {};

    var Stats = {
        /** 上报端点来源（站点绝对地址，无协议尾斜杠） */
        endpoint: (typeof global.ET_SITE_ORIGIN === 'string' && /^https?:\/\//.test(global.ET_SITE_ORIGIN))
            ? global.ET_SITE_ORIGIN
            : null,

        _done: {},

        /**
         * 上报一次事件（同一事件同一工具每次页面加载只报一次）。
         * event: 'use_offline' 等；toolId: 工具 id。
         */
        send: function (event, toolId) {
            if (!event || this._done[event + ':' + (toolId || '')]) { return false; }
            if (!this.endpoint) { return false; }
            /* iframe 内由宿主统计，避免双计 */
            try {
                if (global.parent && global.parent !== global) { return false; }
            } catch (err) { return false; }
            /* 断网时挂起，网络恢复自动补报一次 */
            if (global.navigator && global.navigator.onLine === false) {
                var self = this;
                global.addEventListener('online', function () { self.send(event, toolId); }, { once: true });
                return false;
            }

            this._done[event + ':' + (toolId || '')] = true;
            var payload = JSON.stringify({ event: event, tool: toolId || '' });

            try {
                if (global.navigator.sendBeacon) {
                    return global.navigator.sendBeacon(
                        this.endpoint + '/api/track',
                        new Blob([payload], { type: 'text/plain;charset=UTF-8' })
                    );
                }
                global.fetch(this.endpoint + '/api/track', {
                    method: 'POST',
                    body: payload,
                    keepalive: true,
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'text/plain;charset=UTF-8' }
                });
                return true;
            } catch (err) {
                return false;
            }
        }
    };

    ET.Stats = Stats;
})(window);
</script>

            '<p style="margin:0 0 8px"><b>测量</b>：实时显示顶点数、边数、周长与面积（鞋带公式），单位为「格」。</p>' +
            '<p style="margin:0 0 8px"><b>快捷键</b>：空格 = 闭合 / 重绘，← = 撤销，→ = 闭合。</p>' +
            '<p style="margin:0"><b>数据</b>：设置保存在浏览器本地（localStorage）。</p></div>'
    });

    /* ---------- 通用小工具 ---------- */

    function clamp(v) {
        return Math.max(0, Math.min(GRID, v));
    }

    function clampRadius(v) {
        return Math.max(0.5, Math.min(GRID / 2, Math.round(v * 2) / 2));
    }

    function dist(a, b) {
        var dx = a.x - b.x;
        var dy = a.y - b.y;
        return Math.sqrt(dx * dx + dy * dy);
    }

    function fmt2(v) {
        return (Math.round(v * 100) / 100).toFixed(2);
    }

    function fmtNum(v) {
        var s = fmt2(v).replace(/0+$/, '').replace(/\.$/, '');
        return s === '' ? '0' : s;
    }

    function svgY(y) {
        return GRID - y;
    }

    function isTypingTarget(node) {
        if (!node || !node.tagName) { return false; }
        var tag = node.tagName.toUpperCase();
        return tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT' || node.isContentEditable === true;
    }

    function hasOverlay() {
        return !!document.querySelector('.et-modal, .et-drawer-backdrop');
    }

    /* ---------- 历史（撤销） ---------- */

    function cloneState() {
        return {
            mode: state.mode,
            points: state.points.map(function (p) { return { x: p.x, y: p.y }; }),
            closed: state.closed,
            center: { x: state.center.x, y: state.center.y },
            radius: state.radius
        };
    }

    function pushHistory() {
        history.push(cloneState());
        if (history.length > 80) { history.shift(); }
    }

    function undo() {
        if (drag) { return; }
        if (!history.length) {
            chrome.toast('没有可撤销的步骤', 'warn');
            return;
        }
        state = history.pop();
        render();
        chrome.beep('tick');
        chrome.setStatus('已撤销一步', 'warn');
    }

    /* ---------- 几何计算 ---------- */

    function perimeter() {
        var pts = state.points;
        var total = 0;
        for (var i = 0; i < pts.length - 1; i++) {
            total += dist(pts[i], pts[i + 1]);
        }
        if (state.closed && pts.length >= 3) {
            total += dist(pts[pts.length - 1], pts[0]);
        }
        return total;
    }

    function polygonArea() {
        var pts = state.points;
        var n = pts.length;
        if (n < 3) { return 0; }
        var sum = 0;
        for (var i = 0; i < n; i++) {
            var a = pts[i];
            var b = pts[(i + 1) % n];
            sum += a.x * b.y - b.x * a.y;
        }
        return Math.abs(sum) / 2;   /* 鞋带公式，取绝对值 */
    }

    /* ---------- 渲染 ---------- */

    function render() {
        renderGrid();
        renderShapes();
        renderLabels();
        renderStats();
    }

    function renderGrid() {
        if (!prefs.showGrid) {
            gGrid.innerHTML = '';
            return;
        }
        var out = [];
        for (var i = 0; i <= GRID; i++) {
            var vCls = i === 0 ? ' is-axis' : (i % 5 === 0 ? ' is-major' : '');
            var hCls = i === GRID ? ' is-axis' : (i % 5 === 0 ? ' is-major' : '');
            out.push('<line class="geometrybuil-gline' + vCls + '" x1="' + i + '" y1="0" x2="' + i + '" y2="' + GRID + '"/>');
            out.push('<line class="geometrybuil-gline' + hCls + '" x1="0" y1="' + i + '" x2="' + GRID + '" y2="' + i + '"/>');
        }
        gGrid.innerHTML = out.join('');
    }

    function renderShapes() {
        var out = [];

        if (state.mode === 'circle') {
            var cx = state.center.x;
            var cy = svgY(state.center.y);
            out.push('<circle class="geometrybuil-circle" cx="' + cx + '" cy="' + cy + '" r="' + state.radius + '"/>');
            out.push('<line class="geometrybuil-dash" x1="' + cx + '" y1="' + cy + '" x2="' + (cx + state.radius) + '" y2="' + cy + '"/>');
            out.push('<circle class="geometrybuil-center" cx="' + cx + '" cy="' + cy + '" r="0.24"/>');
            out.push('<circle class="geometrybuil-vertex" cx="' + (cx + state.radius) + '" cy="' + cy + '" r="0.24"/>');
            gShapes.innerHTML = out.join('');
            gHandles.innerHTML =
                '<circle class="geometrybuil-hit" data-handle="center" cx="' + cx + '" cy="' + cy + '" r="0.36"/>' +
                '<circle class="geometrybuil-hit" data-handle="radius" cx="' + (cx + state.radius) + '" cy="' + cy + '" r="0.36"/>';
            return;
        }

        var pts = state.points;
        var n = pts.length;
        var coords = [];
        for (var i = 0; i < n; i++) {
            coords.push(pts[i].x + ',' + svgY(pts[i].y));
        }
        if (n >= 3 && state.closed) {
            out.push('<polygon class="geometrybuil-poly" points="' + coords.join(' ') + '"/>');
        } else if (n >= 2) {
            out.push('<polyline class="geometrybuil-path" points="' + coords.join(' ') + '"/>');
        }
        if (n > 0 && !state.closed && hover) {
            var last = pts[n - 1];
            out.push('<line class="geometrybuil-dash" x1="' + last.x + '" y1="' + svgY(last.y) +
                '" x2="' + hover.x + '" y2="' + svgY(hover.y) + '"/>');
        }
        for (var j = 0; j < n; j++) {
            var cls = 'geometrybuil-vertex' + (j === 0 ? ' is-first' : '');
            out.push('<circle class="' + cls + '" cx="' + pts[j].x + '" cy="' + svgY(pts[j].y) + '" r="0.25"/>');
        }
        gShapes.innerHTML = out.join('');

        var handles = [];
        var closable = n >= 3 && !state.closed;
        for (var k = 0; k < n; k++) {
            handles.push('<circle class="geometrybuil-hit" data-vertex="' + k + '"' +
                (k === 0 && closable ? ' data-close="1"' : '') +
                ' cx="' + pts[k].x + '" cy="' + svgY(pts[k].y) + '" r="0.36"/>');
        }
        gHandles.innerHTML = handles.join('');
    }

    function label(x, y, text, cls) {
        return '<text class="geometrybuil-label ' + cls + '" x="' + x + '" y="' + svgY(y) +
            '" text-anchor="middle" dominant-baseline="middle">' + text + '</text>';
    }

    function renderLabels() {
        var out = [];
        var pts = state.points;
        var n = pts.length;

        if (state.mode === 'circle') {
            if (prefs.showEdges) {
                out.push(label(state.center.x + state.radius / 2, state.center.y + 0.55,
                    'r = ' + fmtNum(state.radius), 'geometrybuil-label--edge'));
            }
            gLabels.innerHTML = out.join('');
            return;
        }

        var i;
        if (prefs.showEdges) {
            var edgeCount = (state.closed && n >= 3) ? n : Math.max(0, n - 1);
            for (i = 0; i < edgeCount; i++) {
                var a = pts[i];
                var b = pts[(i + 1) % n];
                var dx = b.x - a.x;
                var dy = b.y - a.y;
                var len = Math.sqrt(dx * dx + dy * dy) || 1;
                out.push(label((a.x + b.x) / 2 + (-dy / len) * 0.5,
                    (a.y + b.y) / 2 + (dx / len) * 0.5,
                    fmtNum(dist(a, b)), 'geometrybuil-label--edge'));
            }
        }
        if (prefs.showCoords) {
            for (i = 0; i < n; i++) {
                out.push(label(pts[i].x, pts[i].y + 0.55,
                    '(' + fmtNum(pts[i].x) + ', ' + fmtNum(pts[i].y) + ')', 'geometrybuil-label--coord'));
            }
        }
        gLabels.innerHTML = out.join('');
    }

    function metricRow(key, value, brand) {
        return '<div class="geometrybuil-metric' + (brand ? ' geometrybuil-metric--brand' : '') + '">' +
            '<span class="geometrybuil-metric__k">' + key + '</span>' +
            '<span class="geometrybuil-metric__v">' + value + '</span></div>';
    }

    function renderStats() {
        var rows = [];

        if (state.mode === 'circle') {
            var r = state.radius;
            rows.push(metricRow('半径 r', fmt2(r) + ' 格'));
            rows.push(metricRow('周长 2πr', fmt2(2 * Math.PI * r) + ' 格', true));
            rows.push(metricRow('面积 πr²', fmt2(Math.PI * r * r) + ' 平方格', true));
            if (prefs.showFormula) {
                rows.push('<p class="geometrybuil-formula">周长 = <code>2πr</code>　面积 = <code>πr²</code><br>' +
                    '取 π ≈ 3.14159，结果保留两位小数。</p>');
            }
            metricsEl.innerHTML = rows.join('');
            tipEl.textContent = '拖动圆心移动圆，拖动圆周上的控制点改变半径（设置里也可直接输入半径）。';
            return;
        }

        var n = state.points.length;
        var closed = state.closed && n >= 3;
        var edgeCount = closed ? n : Math.max(0, n - 1);

        rows.push(metricRow('顶点数', String(n)));
        rows.push(metricRow('边数', String(edgeCount)));
        rows.push(metricRow('周长', n >= 2 ? fmt2(perimeter()) + ' 格' : '—', n >= 2));
        rows.push(metricRow('面积', closed ? fmt2(polygonArea()) + ' 平方格' : '—', closed));

        if (prefs.showFormula) {
            rows.push('<p class="geometrybuil-formula">周长 = <code>各边长度之和</code><br>' +
                '面积 = <code>|Σ(xᵢ·yᵢ₊₁ − xᵢ₊₁·yᵢ)| ÷ 2</code>（鞋带公式）</p>');
        }
        metricsEl.innerHTML = rows.join('');

        if (n === 0) {
            tipEl.textContent = '在网格上点击添加顶点，至少 3 个顶点才能围成图形。';
        } else if (n < 3) {
            tipEl.textContent = '继续点击添加顶点；已有 ' + n + ' 个顶点，还差 ' + (3 - n) + ' 个即可闭合。';
        } else if (!state.closed) {
            tipEl.textContent = '点击第一个顶点或「闭合」完成图形，随后可拖动顶点微调。';
        } else {
            tipEl.textContent = '拖动任意顶点可改变形状' + (prefs.snap ? '（吸附到格点）' : '（自由移动）') + '。';
        }
    }

    /* ---------- 坐标换算 ---------- */

    function worldFromEvent(e) {
        if (!svgEl.getScreenCTM) { return null; }
        var m = svgEl.getScreenCTM();
        if (!m) { return null; }
        var pt = svgEl.createSVGPoint();
        pt.x = e.clientX;
        pt.y = e.clientY;
        var p = pt.matrixTransform(m.inverse());
        return { x: p.x, y: GRID - p.y };
    }

    function snapPoint(p) {
        var x = prefs.snap ? Math.round(p.x) : p.x;
        var y = prefs.snap ? Math.round(p.y) : p.y;
        return { x: clamp(x), y: clamp(y) };
    }

    /* ---------- 操作 ---------- */

    function addVertex(p) {
        var pts = state.points;
        if (pts.length >= MAX_POINTS) {
            chrome.toast('顶点过多，先闭合或清空', 'warn');
            return;
        }
        var last = pts[pts.length - 1];
        if (last && Math.abs(last.x - p.x) < 1e-6 && Math.abs(last.y - p.y) < 1e-6) {
            return;
        }
        pushHistory();
        pts.push(p);
        hover = null;
        render();
        chrome.beep('tick');
        chrome.setStatus('顶点 ' + pts.length + ' 个 · 点击第一个顶点可闭合', 'ok');
    }

    function closePolygon() {
        if (state.points.length < 3) {
            chrome.toast('至少 3 个顶点才能围成图形', 'warn');
            chrome.beep('err');
            return;
        }
        if (state.closed) {
            chrome.toast('图形已经是闭合的');
            return;
        }
        pushHistory();
        state.closed = true;
        render();
        chrome.beep('ok');
        chrome.setStatus('已闭合 · 面积 ' + fmt2(polygonArea()) + ' 平方格', 'ok');
    }

    function removeLast() {
        if (state.mode === 'circle') {
            chrome.toast('圆模式下没有顶点可删除', 'warn');
            return;
        }
        if (state.closed) {
            pushHistory();
            state.closed = false;
            render();
            chrome.beep('tick');
            chrome.setStatus('已取消闭合，可继续添加顶点', 'warn');
            return;
        }
        if (!state.points.length) {
            chrome.toast('没有顶点可删除', 'warn');
            return;
        }
        pushHistory();
        state.points.pop();
        render();
        chrome.beep('tick');
        chrome.setStatus('已删除最后一个顶点', 'warn');
    }

    function clearAll() {
        pushHistory();
        if (state.mode === 'circle') {
            state.center = { x: 10, y: 10 };
            state.radius = 5;
        } else {
            state.points = [];
            state.closed = false;
        }
        hover = null;
        render();
        chrome.beep('tick');
        chrome.setStatus('已清空当前图形', 'warn');
    }

    function primaryAction() {
        if (state.mode === 'circle') {
            render();
            chrome.beep('ok');
            chrome.setStatus('圆已重绘 · r = ' + fmt2(state.radius) + ' 格', 'ok');
            return;
        }
        if (state.closed) {
            chrome.toast('图形已闭合，可拖动顶点调整');
            return;
        }
        if (state.points.length >= 3) {
            closePolygon();
        } else {
            chrome.toast('至少 3 个顶点才能围成图形', 'warn');
            chrome.beep('err');
        }
    }

    function setMode(mode) {
        if (state.mode === mode) { return; }
        pushHistory();
        state.mode = mode;
        drag = null;
        hover = null;
        syncModeButtons();
        render();
        chrome.beep('tick');
        chrome.setStatus(mode === 'circle' ? '圆模式：拖动圆心与半径控制点' : '多边形模式：点击网格添加顶点', 'ok');
    }

    function syncModeButtons() {
        for (var i = 0; i < modeBtns.length; i++) {
            modeBtns[i].classList.toggle('is-on', modeBtns[i].getAttribute('data-mode') === state.mode);
        }
    }

    function applyTemplate(key) {
        var tpl = TEMPLATES[key];
        if (!tpl) { return; }
        pushHistory();
        state.mode = 'polygon';
        state.closed = true;
        state.points = tpl.points.map(function (p) { return { x: p[0], y: p[1] }; });
        state.center = { x: 10, y: 10 };
        hover = null;
        if (tpl.snapOff && prefs.snap) {
            prefs.snap = false;
            store.set('snap', false);
            chrome.toast('等边三角形含小数坐标，已自动关闭吸附');
        } else {
            chrome.toast('已生成「' + tpl.name + '」');
        }
        syncModeButtons();
        render();
        chrome.beep('ok');
        chrome.setStatus(tpl.name + ' · 面积 ' + fmt2(polygonArea()) + ' 平方格', 'ok');
    }

    /* ---------- 画布交互 ---------- */

    function startDrag(kind, idx, e) {
        drag = { kind: kind, idx: idx, moved: false };
        try { svgEl.setPointerCapture(e.pointerId); } catch (err) { /* 忽略 */ }
    }

    function bindCanvas() {
        svgEl.addEventListener('pointerdown', function (e) {
            if (e.button !== 0) { return; }
            var w = worldFromEvent(e);
            if (!w) { return; }
            var t = e.target;
            var closeAttr = t.getAttribute ? t.getAttribute('data-close') : null;
            var vertexAttr = t.getAttribute ? t.getAttribute('data-vertex') : null;
            var handleAttr = t.getAttribute ? t.getAttribute('data-handle') : null;

            if (closeAttr) {
                closePolygon();
                return;
            }
            if (vertexAttr !== null && vertexAttr !== undefined && state.mode === 'polygon') {
                e.preventDefault();
                startDrag('vertex', parseInt(vertexAttr, 10), e);
                return;
            }
            if (handleAttr === 'center') {
                e.preventDefault();
                startDrag('center', 0, e);
                return;
            }
            if (handleAttr === 'radius') {
                e.preventDefault();
                startDrag('radius', 0, e);
                return;
            }

            if (state.mode === 'polygon') {
                if (state.closed) {
                    chrome.toast('图形已闭合，可拖动顶点或用「清空」重新开始');
                    return;
                }
                addVertex(snapPoint(w));
            } else {
                pushHistory();
                state.center = snapPoint(w);
                render();
                chrome.beep('tick');
            }
        });

        svgEl.addEventListener('pointermove', function (e) {
            var w = worldFromEvent(e);
            if (!w) { return; }

            if (drag) {
                if (!drag.moved) {
                    drag.moved = true;
                    pushHistory();
                }
                if (drag.kind === 'vertex') {
                    state.points[drag.idx] = snapPoint(w);
                } else if (drag.kind === 'center') {
                    state.center = snapPoint(w);
                } else if (drag.kind === 'radius') {
                    state.radius = clampRadius(dist(state.center, w));
                }
                render();
                return;
            }

            if (state.mode === 'polygon' && !state.closed && state.points.length > 0) {
                var p = snapPoint(w);
                if (!hover || hover.x !== p.x || hover.y !== p.y) {
                    hover = p;
                    renderShapes();
                }
            }
        });

        svgEl.addEventListener('pointerup', function (e) {
            if (!drag) { return; }
            try { svgEl.releasePointerCapture(e.pointerId); } catch (err) { /* 忽略 */ }
            drag = null;
            render();
            if (state.mode === 'circle') {
                chrome.beep('tick');
            } else {
                chrome.setStatus('顶点已移动', 'ok');
                chrome.beep('tick');
            }
        });

        svgEl.addEventListener('pointercancel', function () {
            drag = null;
            render();
        });

        svgEl.addEventListener('pointerleave', function () {
            if (!drag && hover) {
                hover = null;
                renderShapes();
            }
        });

        svgEl.addEventListener('contextmenu', function (e) {
            e.preventDefault();
            removeLast();
        });
    }

    /* ---------- 视图缩放 ---------- */

    function applyViewBox() {
        var span = GRID / zoom;
        var origin = (GRID - span) / 2;
        svgEl.setAttribute('viewBox', origin + ' ' + origin + ' ' + span + ' ' + span);
    }

    function setZoom(v) {
        zoom = Math.max(0.5, Math.min(4, v));
        applyViewBox();
        chrome.setStatus('缩放 ' + fmtNum(zoom) + '×', 'ok');
    }

    function zoomText() {
        return fmtNum(zoom) + '×';
    }

    /* ---------- 设置抽屉 ---------- */

    function heading(text) {
        return ET.create('h4', null, text);
    }

    function addSwitch(parent, text, checked, onChange) {
        var wrap = ET.create('label', 'et-drawer__switch');
        wrap.appendChild(ET.create('span', null, text));
        var input = document.createElement('input');
        input.type = 'checkbox';
        input.checked = !!checked;
        input.addEventListener('change', function () { onChange(input.checked); });
        wrap.appendChild(input);
        parent.appendChild(wrap);
    }

    function mkBtn(icon, text, onClick, cls) {
        var b = document.createElement('button');
        b.type = 'button';
        b.className = cls || 'et-btn';
        b.innerHTML = '<svg class="et-icon"><use href="#' + icon + '"></use></svg>';
        b.appendChild(ET.create('span', null, text));
        b.addEventListener('click', onClick);
        return b;
    }

    function buildSettings(body, api) {
        body.innerHTML = '';

        body.appendChild(heading('显示'));
        addSwitch(body, '显示网格', prefs.showGrid, function (v) {
            prefs.showGrid = v;
            store.set('showGrid', v);
            render();
        });
        addSwitch(body, '吸附到格点', prefs.snap, function (v) {
            prefs.snap = v;
            store.set('snap', v);
            renderStats();
        });
        addSwitch(body, '显示边长标注', prefs.showEdges, function (v) {
            prefs.showEdges = v;
            store.set('showEdges', v);
            renderLabels();
        });
        addSwitch(body, '显示顶点坐标', prefs.showCoords, function (v) {
            prefs.showCoords = v;
            store.set('showCoords', v);
            renderLabels();
        });
        addSwitch(body, '显示周长 / 面积公式', prefs.showFormula, function (v) {
            prefs.showFormula = v;
            store.set('showFormula', v);
            renderStats();
        });

        body.appendChild(heading('视图缩放'));
        var zoomRow = ET.create('div', 'et-drawer__row');
        var zoomVal = ET.create('span', 'geometrybuil-zoomval', zoomText());
        zoomRow.appendChild(mkBtn('i-minus', '缩小', function () {
            setZoom(zoom / 1.25);
            zoomVal.textContent = zoomText();
        }));
        zoomRow.appendChild(zoomVal);
        zoomRow.appendChild(mkBtn('i-plus', '放大', function () {
            setZoom(zoom * 1.25);
            zoomVal.textContent = zoomText();
        }));
        zoomRow.appendChild(mkBtn('i-refresh', '复位', function () {
            setZoom(1);
            zoomVal.textContent = zoomText();
        }));
        body.appendChild(zoomRow);
        body.appendChild(ET.create('p', 'et-drawer__tip', '放大后网格更稀疏，便于精细拖动顶点。'));

        body.appendChild(heading('圆'));
        var radiusRow = ET.create('div', 'et-drawer__row');
        radiusRow.appendChild(ET.create('span', null, '半径（格）'));
        var radiusInput = document.createElement('input');
        radiusInput.type = 'number';
        radiusInput.className = 'et-drawer__input';
        radiusInput.min = '0.5';
        radiusInput.max = '10';
        radiusInput.step = '0.5';
        radiusInput.value = state.radius;
        radiusInput.addEventListener('change', function () {
            var v = parseFloat(radiusInput.value);
            if (isNaN(v)) { v = state.radius; }
            pushHistory();
            state.radius = clampRadius(v);
            radiusInput.value = state.radius;
            if (state.mode !== 'circle') {
                state.mode = 'circle';
                syncModeButtons();
            }
            render();
        });
        radiusRow.appendChild(radiusInput);
        body.appendChild(radiusRow);
        body.appendChild(ET.create('p', 'et-drawer__tip', '拖动圆周上的控制点同样可以改变半径。'));

        body.appendChild(heading('坐标系'));
        body.appendChild(ET.create('p', 'et-drawer__tip',
            '原点在网格<b>左下角</b>，x 轴向右、y 轴向上，每格 1 单位长度；面积单位为「平方格」。'));

        body.appendChild(heading('操作'));
        var opsRow = ET.create('div', 'et-drawer__row');
        opsRow.appendChild(mkBtn('i-trash', '清空当前图形', function () {
            clearAll();
            api.close();
        }, 'et-btn et-btn--danger'));
        body.appendChild(opsRow);
        body.appendChild(ET.create('p', 'et-drawer__tip',
            '快捷键：空格 = 闭合 / 重绘，← = 撤销，→ = 闭合；右键 = 删除最后一个顶点。'));
    }

    /* ---------- 事件绑定 ---------- */

    function bindEvents() {
        for (var i = 0; i < modeBtns.length; i++) {
            modeBtns[i].addEventListener('click', function () {
                setMode(this.getAttribute('data-mode'));
            });
        }

        var tplBtns = ET.qsa('[data-tpl]');
        for (var j = 0; j < tplBtns.length; j++) {
            tplBtns[j].addEventListener('click', function () {
                applyTemplate(this.getAttribute('data-tpl'));
            });
        }

        document.getElementById('gbClose').addEventListener('click', closePolygon);
        document.getElementById('gbUndo').addEventListener('click', undo);
        document.getElementById('gbDrop').addEventListener('click', removeLast);
        document.getElementById('gbClear').addEventListener('click', clearAll);

        bindCanvas();

        document.addEventListener('keydown', function (e) {
            if (isTypingTarget(e.target) || hasOverlay()) { return; }
            if (e.code === 'Space' || e.key === 'ArrowRight') {
                e.preventDefault();
                primaryAction();
            } else if (e.key === 'ArrowLeft') {
                e.preventDefault();
                undo();
            }
        });
    }

    /* ---------- 启动 ---------- */

    applyViewBox();
    syncModeButtons();
    bindEvents();
    render();
})();
</script>

</body>
</html>
