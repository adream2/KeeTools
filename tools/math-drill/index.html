<style>
  /* 此块由 scripts/sync_shared.py 自动注入，请勿手工修改 */
/*!
 * et-chrome.css — 工具通用外壳样式（顶栏 / 页脚 / 弹窗 / 按钮 / 主题）
 *
 * 共享样式源。改这里，然后跑：python scripts/sync_shared.py
 * 所有类名带 et- 前缀，避免与工具自身样式冲突。
 * 依赖：无外部资源；颜色全部为令牌变量。
 */

/* ============ 设计令牌 ============ */
:root {
    --et-accent: #2563eb;
    --et-accent-weak: rgba(37, 99, 235, .14);
    --et-bg: #f4f6fb;
    --et-surface: #ffffff;
    --et-surface-2: #f8fafc;
    --et-fg: #0b1220;
    --et-muted: #64748b;
    --et-line: rgba(15, 23, 42, .12);
    --et-line-strong: rgba(15, 23, 42, .22);
    --et-glass: rgba(255, 255, 255, .85);
    --et-shadow-md: 0 10px 28px -18px rgba(15, 23, 42, .3);
    --et-shadow-lg: 0 24px 60px -32px rgba(15, 23, 42, .4);
    --et-ok: #059669;
    --et-warn: #d97706;
    --et-err: #dc2626;
    --et-radius: 12px;
    --et-radius-sm: 9px;
    --et-font: -apple-system, BlinkMacSystemFont, "Segoe UI",
               "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei",
               "Noto Sans SC", sans-serif;
    --et-mono: ui-monospace, "Cascadia Mono", Consolas, Menlo, monospace;
}

html[data-et-theme="dark"] {
    --et-bg: #0b1120;
    --et-surface: #111a2e;
    --et-surface-2: #0f1729;
    --et-fg: #f1f5f9;
    --et-muted: #94a3b8;
    --et-line: rgba(148, 163, 184, .18);
    --et-line-strong: rgba(148, 163, 184, .3);
    --et-glass: rgba(17, 26, 46, .85);
    --et-shadow-md: 0 10px 34px -18px rgba(0, 0, 0, .8);
    --et-shadow-lg: 0 24px 70px -30px rgba(0, 0, 0, .9);
    --et-ok: #34d399;
    --et-warn: #fbbf24;
    --et-err: #f87171;
}

/* ============ 基础 ============ */
.et-app {
    position: relative;
    isolation: isolate;
    display: flex;
    flex-direction: column;
    height: 100vh;
    height: 100dvh;
    overflow: hidden;
    background: var(--et-bg);
    color: var(--et-fg);
    font-family: var(--et-font);
    -webkit-font-smoothing: antialiased;
    transition: background .25s, color .25s;
}

/* 极光背景：径向渐变 + 呼吸动画（edupick 品质基线，老内核也不掉帧） */
.et-app::before {
    content: '';
    position: fixed;
    inset: 0;
    z-index: -1;
    pointer-events: none;
    background:
        radial-gradient(46% 40% at 20% 18%, var(--et-accent-weak), transparent 65%),
        radial-gradient(42% 38% at 82% 24%, var(--et-accent-weak), transparent 70%),
        radial-gradient(50% 44% at 55% 95%, rgba(16, 185, 129, .10), transparent 65%);
    animation: et-aurora 16s ease-in-out infinite alternate;
}

@keyframes et-aurora {
    from { opacity: .55; transform: scale(1); }
    to { opacity: 1; transform: scale(1.06); }
}

.et-app *,
.et-app *::before,
.et-app *::after { box-sizing: border-box; }

[hidden] { display: none !important; }

.et-icon {
    width: 18px;
    height: 18px;
    fill: none;
    stroke: currentColor;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
    flex: none;
}

/* ============ 顶栏 ============ */
.et-topbar {
    flex: none;
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 11px 20px;
    border-bottom: 1px solid var(--et-line);
    background: var(--et-glass);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    z-index: 20;
}

.et-brand {
    display: flex;
    align-items: center;
    gap: 10px;
    min-width: 0;
}

.et-brand__dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: var(--et-accent);
    box-shadow: 0 0 0 4px var(--et-accent-weak);
    flex: none;
}

.et-brand__name {
    font-weight: 800;
    font-size: 15px;
    letter-spacing: -.01em;
    white-space: nowrap;
}

.et-brand__sub {
    font-size: 12.5px;
    color: var(--et-muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.et-status {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 5px 14px;
    border-radius: 999px;
    font-size: 12.5px;
    color: var(--et-muted);
    background: var(--et-surface-2);
    border: 1px solid var(--et-line);
    white-space: nowrap;
    max-width: 42vw;
    overflow: hidden;
    text-overflow: ellipsis;
}

.et-status__dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--et-ok);
    flex: none;
    transition: background .2s;
}

.et-status[data-tone="err"] .et-status__dot { background: var(--et-err); }
.et-status[data-tone="warn"] .et-status__dot { background: var(--et-warn); }

.et-actions {
    display: flex;
    align-items: center;
    gap: 7px;
}

.et-icon-btn {
    display: inline-grid;
    place-items: center;
    width: 38px;
    height: 38px;
    font-size: 16px;
    line-height: 1;
    border-radius: 11px;
    border: 1px solid var(--et-line);
    background: var(--et-surface-2);
    color: var(--et-fg);
    cursor: pointer;
    transition: transform .14s, border-color .14s, color .14s, opacity .14s;
    -webkit-tap-highlight-color: transparent;
}

.et-icon-btn:hover {
    border-color: var(--et-accent);
    color: var(--et-accent);
    transform: translateY(-1px);
}

.et-icon-btn:active { transform: translateY(0); }
.et-icon-btn.is-off { opacity: .4; }
.et-icon-btn:focus-visible { outline: 2px solid var(--et-accent); outline-offset: 2px; }

/* ============ 主区默认 ============ */
.et-main {
    flex: 1;
    min-height: 0;
    position: relative;
    overflow: auto;
}

/* ============ 页脚（品牌回流 L2） ============ */
.et-footer {
    flex: none;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 7px 16px;
    font-size: 12px;
    color: var(--et-muted);
    border-top: 1px solid var(--et-line);
    background: var(--et-glass);
    user-select: none;
    z-index: 20;
}

.et-footer a {
    color: inherit;
    text-decoration: none;
    transition: color .14s;
}

.et-footer a:hover { color: var(--et-accent); }

/* ============ 按钮 ============ */
.et-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
    padding: 9px 16px;
    border-radius: 11px;
    font: inherit;
    font-size: 13.5px;
    font-weight: 700;
    border: 1px solid var(--et-line);
    background: var(--et-surface-2);
    color: var(--et-fg);
    cursor: pointer;
    transition: transform .14s, border-color .14s, color .14s, background .14s, box-shadow .14s;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
}

.et-btn:hover {
    border-color: var(--et-accent);
    color: var(--et-accent);
    transform: translateY(-1px);
}

.et-btn:active { transform: translateY(0); }
.et-btn:focus-visible { outline: 2px solid var(--et-accent); outline-offset: 2px; }
.et-btn:disabled { opacity: .45; cursor: not-allowed; transform: none; }

.et-btn--primary {
    background: var(--et-accent);
    border-color: var(--et-accent);
    color: #fff;
    box-shadow: 0 6px 18px -8px var(--et-accent);
}

.et-btn--primary:hover { color: #fff; filter: brightness(1.08); }
.et-btn--primary:disabled { filter: none; }

.et-btn--danger:hover {
    border-color: var(--et-err);
    color: var(--et-err);
}

.et-btn--lg {
    padding: 13px 26px;
    font-size: 16px;
    border-radius: 14px;
}

/* ============ 弹窗 ============ */
.et-modal {
    position: fixed;
    inset: 0;
    z-index: 100;
    display: grid;
    place-items: center;
    padding: 24px;
    background: rgba(2, 6, 23, .55);
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    animation: et-fade .18s ease;
}

.et-modal__panel {
    width: min(680px, 94vw);
    max-height: 86vh;
    max-height: 86dvh;
    display: flex;
    flex-direction: column;
    background: var(--et-surface);
    border: 1px solid var(--et-line);
    border-radius: 16px;
    box-shadow: var(--et-shadow-lg);
    animation: et-pop .2s cubic-bezier(.34, 1.4, .64, 1);
    overflow: hidden;
}

.et-modal__panel--narrow { width: min(460px, 92vw); }
.et-modal__panel--wide { width: min(900px, 94vw); }

.et-modal__head {
    flex: none;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 16px 20px;
    border-bottom: 1px solid var(--et-line);
    font-weight: 800;
    font-size: 15px;
}

.et-modal__head .et-icon-btn {
    margin-left: auto;
    width: 32px;
    height: 32px;
}

.et-modal__body {
    flex: 1;
    min-height: 0;
    overflow: auto;
    padding: 18px 20px;
}

.et-modal__foot {
    flex: none;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 14px 20px;
    border-top: 1px solid var(--et-line);
    background: var(--et-surface-2);
}

.et-modal__foot .spacer { flex: 1; }

@keyframes et-fade {
    from { opacity: 0; }
}

@keyframes et-pop {
    from { opacity: 0; transform: translateY(14px) scale(.97); }
}

/* ============ 轻提示（toast） ============ */
.et-toast {
    position: fixed;
    left: 50%;
    bottom: 56px;
    transform: translateX(-50%) translateY(10px);
    z-index: 120;
    display: flex;
    align-items: center;
    gap: 9px;
    max-width: min(520px, 88vw);
    padding: 11px 18px;
    border-radius: 12px;
    font-size: 13.5px;
    font-weight: 600;
    color: #fff;
    background: rgba(15, 23, 42, .92);
    border: 1px solid rgba(148, 163, 184, .25);
    box-shadow: var(--et-shadow-lg);
    opacity: 0;
    pointer-events: none;
    transition: opacity .22s, transform .22s;
}

.et-toast.is-show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
}

.et-toast[data-tone="ok"] { background: rgba(5, 150, 105, .95); }
.et-toast[data-tone="err"] { background: rgba(220, 38, 38, .95); }
.et-toast[data-tone="warn"] { background: rgba(217, 119, 6, .95); }

/* ============ 设置抽屉（右上角入口，edupick 交互） ============ */
.et-drawer-backdrop {
    position: fixed;
    inset: 0;
    z-index: 90;
    background: rgba(2, 6, 23, .45);
    backdrop-filter: blur(3px);
    -webkit-backdrop-filter: blur(3px);
    opacity: 0;
    transition: opacity .2s;
}

.et-drawer-backdrop.is-open { opacity: 1; }

.et-drawer {
    position: absolute;
    top: 0;
    right: 0;
    height: 100%;
    width: min(400px, 92vw);
    display: flex;
    flex-direction: column;
    background: var(--et-surface);
    border-left: 1px solid var(--et-line);
    box-shadow: var(--et-shadow-lg);
    transform: translateX(100%);
    transition: transform .22s cubic-bezier(.32, .72, .35, 1);
}

.et-drawer-backdrop.is-open .et-drawer { transform: translateX(0); }

.et-drawer__head {
    flex: none;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 15px 18px;
    border-bottom: 1px solid var(--et-line);
    font-weight: 800;
    font-size: 15px;
    color: var(--et-accent);
}

.et-drawer__head .et-icon-btn {
    margin-left: auto;
    width: 32px;
    height: 32px;
}

.et-drawer__body {
    flex: 1;
    min-height: 0;
    overflow: auto;
    padding: 16px 18px 24px;
}

/* 抽屉内容通用小节（工具复用） */
.et-drawer__body h4 {
    margin: 18px 0 8px;
    font-size: 12px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: .08em;
    color: var(--et-muted);
}

.et-drawer__body h4:first-child { margin-top: 0; }

.et-drawer__row {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
}

.et-drawer__tip {
    margin: 8px 0 0;
    font-size: 12px;
    line-height: 1.8;
    color: var(--et-muted);
}

.et-drawer__tip b { color: var(--et-fg); }

.et-drawer__input {
    flex: 1;
    min-width: 0;
    padding: 9px 12px;
    border: 1px solid var(--et-line-strong);
    border-radius: 9px;
    background: var(--et-surface-2);
    color: var(--et-fg);
    font: inherit;
    font-size: 13.5px;
    transition: border-color .14s, box-shadow .14s;
}

.et-drawer__input:focus {
    outline: none;
    border-color: var(--et-accent);
    box-shadow: 0 0 0 3px var(--et-accent-weak);
}

.et-drawer__switch {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 10px 0;
    border-bottom: 1px dashed var(--et-line);
    font-size: 13.5px;
    font-weight: 600;
    color: var(--et-fg);
    cursor: pointer;
    user-select: none;
}

.et-drawer__switch input {
    width: 17px;
    height: 17px;
    accent-color: var(--et-accent);
    cursor: pointer;
}
</style>
<!-- /ET:INLINE -->

<style>
/* ── 口算题生成器：工具自身样式（自包含） ── */
:root { --md-accent: #0891b2; }

.md-main {
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
}

.md-toolbar {
    flex: none;
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
    padding: 12px 20px;
    border-bottom: 1px solid var(--et-line);
    background: var(--et-surface-2);
}

.md-label {
    font-size: 13px;
    font-weight: 700;
    color: var(--et-muted);
}

.md-chips { display: flex; gap: 6px; }

.md-chip {
    min-width: 46px;
    padding: 8px 12px;
    border: 1px solid var(--et-line-strong);
    border-radius: 10px;
    background: var(--et-surface);
    color: var(--et-fg);
    font: inherit;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
}

.md-chip.is-active {
    color: #fff;
    background: var(--et-accent);
    border-color: var(--et-accent);
}

.md-check {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 13px;
    font-weight: 600;
    color: var(--et-fg);
    cursor: pointer;
}

.md-spacer { flex: 1 1 auto; }

.md-scroll {
    flex: 1;
    min-height: 0;
    overflow: auto;
    padding: 22px 24px 32px;
}

.md-sheet {
    max-width: 1040px;
    margin: 0 auto;
    padding: 26px 30px 32px;
    border: 1px solid var(--et-line);
    border-radius: 14px;
    background: var(--et-surface);
    box-shadow: var(--et-shadow-md);
}

.md-head {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 16px;
    padding-bottom: 14px;
    border-bottom: 2px solid var(--et-line-strong);
    margin-bottom: 18px;
}

.md-head__title {
    font-size: 22px;
    font-weight: 900;
    letter-spacing: -.01em;
}

.md-head__meta {
    font-size: 13.5px;
    color: var(--et-muted);
    text-align: right;
    line-height: 1.7;
}

.md-head__meta b { color: var(--et-fg); }

.md-grid {
    display: grid;
    gap: 16px 26px;
}

.md-item {
    display: flex;
    align-items: baseline;
    gap: 8px;
    font-size: var(--md-fs, clamp(17px, 1.6vw, 24px));
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
    min-width: 0;
}

.md-item__no {
    flex: none;
    min-width: 2.2em;
    color: var(--et-muted);
    font-size: .82em;
    font-weight: 700;
}

.md-item__expr { letter-spacing: .01em; }

.md-item__ans {
    display: inline-block;
    min-width: calc(var(--md-fs, 20px) * 2.3);
    color: transparent;
}

.md-item.is-revealed .md-item__ans { color: var(--et-err); }

.md-item__blank {
    display: inline-block;
    min-width: calc(var(--md-fs, 20px) * 2.3);
    border-bottom: 1.5px solid var(--et-line-strong);
}

.md-item.is-revealed .md-item__blank { border-bottom-color: transparent; }

/* ---------- 在线答题 ---------- */
.md-seg {
    display: flex;
    gap: 3px;
    padding: 3px;
    border: 1px solid var(--et-line);
    border-radius: 10px;
    background: var(--et-surface);
}

.md-seg button {
    border: 0;
    background: none;
    color: var(--et-muted);
    font: inherit;
    font-size: 13px;
    font-weight: 700;
    padding: 6px 12px;
    border-radius: 8px;
    cursor: pointer;
    white-space: nowrap;
    transition: background .14s, color .14s;
    -webkit-tap-highlight-color: transparent;
}

.md-seg button:hover { color: var(--et-accent); }
.md-seg button.is-active { background: var(--et-accent); color: #fff; }

.md-quizinfo {
    font-size: 13px;
    font-weight: 700;
    color: var(--et-muted);
    font-variant-numeric: tabular-nums;
}

.md-quizinfo b { color: var(--et-accent); font-size: 15px; }

.md-item__input {
    width: calc(var(--md-fs, 20px) * 2.7);
    min-width: 54px;
    padding: 2px 6px;
    border: 0;
    border-bottom: 2px solid var(--et-line-strong);
    border-radius: 4px 4px 0 0;
    background: var(--et-surface-2);
    color: var(--et-fg);
    font: inherit;
    font-size: 1em;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    text-align: center;
    outline: none;
    transition: border-color .14s, background .14s, box-shadow .14s;
}

.md-item__input:focus {
    border-bottom-color: var(--et-accent);
    background: var(--et-surface);
    box-shadow: 0 2px 0 0 var(--et-accent-weak);
}

.md-item.is-right .md-item__input { border-bottom-color: var(--et-ok); color: var(--et-ok); }
.md-item.is-wrong .md-item__input { border-bottom-color: var(--et-err); color: var(--et-err); }

.md-item__mark {
    flex: none;
    font-size: .8em;
    font-weight: 900;
    line-height: 1;
}

.md-item__mark.is-right { color: var(--et-ok); }
.md-item__mark.is-wrong { color: var(--et-err); }
.md-item__fix { font-size: .78em; font-weight: 700; color: var(--et-err); }

.md-foot {
    margin-top: 22px;
    padding-top: 12px;
    border-top: 1px dashed var(--et-line);
    font-size: 12.5px;
    color: var(--et-muted);
}

.md-ta {
    width: 100%;
    padding: 9px 11px;
    border: 1px solid var(--et-line-strong);
    border-radius: 10px;
    background: var(--et-surface-2);
    color: var(--et-fg);
    font-family: var(--et-font);
    font-size: 14px;
    box-sizing: border-box;
}

@media print {
    @page { size: A4 portrait; margin: 14mm; }

    html, body { height: auto !important; overflow: visible !important; }

    .et-app {
        display: block !important;
        height: auto !important;
        overflow: visible !important;
        background: #fff !important;
    }

    .et-topbar, .et-footer, .md-toolbar, .et-drawer-backdrop, .et-modal, .et-toast {
        display: none !important;
    }

    .md-scroll { overflow: visible !important; padding: 0 !important; }

    .md-sheet {
        max-width: none;
        padding: 0;
        border: 0;
        border-radius: 0;
        box-shadow: none;
    }

    .md-item, .md-item.is-revealed .md-item__ans { color: #000 !important; }
    .md-item__blank { border-bottom-color: #000 !important; }
    .md-grid { break-inside: avoid; --md-fs: 15px !important; }

    /* 打印时输入框还原为空白横线，批改标记不打印 */
    .md-item__input {
        background: transparent !important;
        border-bottom-color: #000 !important;
        color: transparent !important;
        box-shadow: none !important;
    }

        gain.gain.exponentialRampToValueAtTime(0.0001, start + dur);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(start);
        osc.stop(start + dur + 0.05);
    }

    var BEEPS = {
        tick: [[880, 0, 0.06, 0.42]],
        ok: [[660, 0, 0.1, 0.46], [880, 0.1, 0.14, 0.46]],
        win: [[523.25, 0, 0.16, 0.5], [659.25, 0.12, 0.16, 0.5], [783.99, 0.24, 0.16, 0.5], [1046.5, 0.36, 0.34, 0.52]],
        err: [[220, 0, 0.22, 0.46, 'square']],
        over: [[880, 0, 0.18, 0.5], [659.25, 0.2, 0.18, 0.5], [523.25, 0.4, 0.36, 0.5]]
    };

    function playBeep(kind) {
        var ctx = ensureCtx();
        if (!ctx || !BEEPS[kind]) { return; }
        var seq = BEEPS[kind];
        var t0 = ctx.currentTime + 0.01;
        for (var i = 0; i < seq.length; i++) {
            tone(ctx, seq[i][0], t0 + seq[i][1], seq[i][2], seq[i][3] * MASTER_GAIN, seq[i][4]);
        }
    }

    /* ---------- 设置抽屉 ---------- */

    function openDrawer(title, build) {
        var backdrop = el('div', 'et-drawer-backdrop');
        var drawer = el('aside', 'et-drawer');
        drawer.setAttribute('role', 'dialog');
        drawer.setAttribute('aria-label', title);

        var head = el('div', 'et-drawer__head');
        head.appendChild(makeIcon('i-sliders'));
        head.appendChild(el('span', 'et-drawer__title', title));
        head.appendChild(makeBtn('i-x', '关闭', close));
        drawer.appendChild(head);

        var body = el('div', 'et-drawer__body');
        drawer.appendChild(body);

        backdrop.appendChild(drawer);
        document.body.appendChild(backdrop);
        requestAnimationFrame(function () { backdrop.classList.add('is-open'); });

        function close() {
            backdrop.classList.remove('is-open');
            document.removeEventListener('keydown', onKey);
            setTimeout(function () {
                if (backdrop.parentNode) { backdrop.parentNode.removeChild(backdrop); }
            }, 220);
        }
        function onKey(ev) {
            if (ev.key === 'Escape') { ev.stopPropagation(); close(); }
        }
        document.addEventListener('keydown', onKey);
        backdrop.addEventListener('mousedown', function (ev) {
            if (ev.target === backdrop) { close(); }
        });

        if (typeof build === 'function') { build(body, { close: close }); }
        return { body: body, close: close };
    }

    /* ---------- 通用弹窗 / toast（同时挂模块级，供其他共享组件使用） ---------- */

    function modal(mo) {
        var backdrop = el('div', 'et-modal');
        var panel = el('div', 'et-modal__panel' + (mo.size === 'narrow' ? ' et-modal__panel--narrow'
            : mo.size === 'wide' ? ' et-modal__panel--wide' : ''));
        var head = el('div', 'et-modal__head');
        if (mo.icon) { head.appendChild(makeIcon(mo.icon)); }
        head.appendChild(el('span', null, mo.title || ''));
        head.appendChild(makeBtn('i-x', '关闭', close));
        panel.appendChild(head);

        var body = el('div', 'et-modal__body');
        if (typeof mo.body === 'string') { body.innerHTML = mo.body; }
        else if (mo.body) { body.appendChild(mo.body); }
        panel.appendChild(body);

        var foot = null;
        if (mo.buttons && mo.buttons.length) {
            foot = el('div', 'et-modal__foot');
            foot.appendChild(el('span', 'spacer'));
            mo.buttons.forEach(function (b) {
                var btn = el('button', 'et-btn' + (b.primary ? ' et-btn--primary' : '') + (b.danger ? ' et-btn--danger' : ''), b.label);
                btn.type = 'button';
                btn.addEventListener('click', function () {
                    if (b.onClick) { b.onClick(close); } else { close(); }
                });
                foot.appendChild(btn);
            });
            panel.appendChild(foot);
        }

        backdrop.appendChild(panel);
        document.body.appendChild(backdrop);

        function close() {
            if (backdrop.parentNode) { backdrop.parentNode.removeChild(backdrop); }
            document.removeEventListener('keydown', onKey);
            if (mo.onClose) { mo.onClose(); }
        }
        function onKey(ev) {
            if (ev.key === 'Escape') { ev.stopPropagation(); close(); }
        }
        document.addEventListener('keydown', onKey);
        backdrop.addEventListener('mousedown', function (ev) {

        return { panel: panel, body: body, foot: foot, close: close };

    var toastEl = null;

    function toast(msg, tone) {

    /* ---------- PWA 元数据（blob manifest，环境不支持时静默跳过） ---------- */

    function installPwa(toolId, title, accent) {

                '<rect width="64" height="64" rx="14" fill="' + (accent || '#2563eb') + '"/>' +
                '<text x="32" y="43" font-size="32" font-weight="800" font-family="sans-serif" ' +
                'fill="#fff" text-anchor="middle">' + (title || '课').charAt(0) + '</text></svg>';
            var iconUri = 'data:image/svg+xml,' + encodeURIComponent(svg);

            var mf = {

                theme_color: accent || '#2563eb',
                icons: [{ src: iconUri, sizes: 'any', type: 'image/svg+xml', purpose: 'any' }]
            };
            var blob = new Blob([JSON.stringify(mf)], { type: 'application/manifest+json' });
            var link = document.createElement('link');
            link.rel = 'manifest';
            link.href = URL.createObjectURL(blob);

        if (!main) { main = el('main'); main.id = 'et-main'; topbar.after(main); }

        main.classList.add('et-main');
        footer.className = 'et-footer';

        var brand = el('div', 'et-brand');
        brand.appendChild(el('span', 'et-brand__dot'));

        if (opt.sub) { nameWrap.appendChild(el('div', 'et-brand__sub', opt.sub)); }
        brand.appendChild(nameWrap);
        topbar.appendChild(brand);

        /* 状态胶囊 */
        var statusPill = el('div', 'et-status');
        statusPill.hidden = true;
        statusPill.appendChild(el('span', 'et-status__dot'));
        var statusText = el('span', null, '');

        api.setStatus = function (text, tone) {

        /* 动作区（edupick 交互：右上角聚合设置入口） */
        var actions = el('div', 'et-actions');

        /* 全屏按钮始终保留：iframe 内对本工具文档 requestFullscreen

        var fsBtn = makeBtn('i-maximize', '全屏', toggleFullscreen);
        actions.appendChild(fsBtn);

        topbar.appendChild(actions);

        function toggleSound() {
            soundEnabled = !soundEnabled;
            store.set('sound', soundEnabled);
            soundBtn.innerHTML = '';
            soundBtn.appendChild(makeIcon(soundEnabled ? 'i-volume' : 'i-volume-off'));
            soundBtn.title = soundEnabled ? '关闭音效' : '开启音效';
            soundBtn.classList.toggle('is-off', !soundEnabled);
            if (soundEnabled) { api.beep('ok'); }
        }

        api.openSettings = function () {
            if (settingsBtn) { settingsBtn.click(); }

        /* ---------- 全屏（iframe 内委托宿主，避免双层全屏） ---------- */

        function inIframe() {
            try { return global.parent && global.parent !== global; } catch (err) { return true; }
        }

        function toggleFullscreen() {
            var root = document.documentElement;
            var fsEl = document.fullscreenElement || document.webkitFullscreenElement || null;
            if (fsEl) {
                (document.exitFullscreen || document.webkitExitFullscreen || function () {}).call(document);
            } else {
                var req = root.requestFullscreen || root.webkitRequestFullscreen;
                if (req) { try { req.call(root); } catch (err) { /* 忽略 */ } }
            }
        }

        function syncFsIcon(on) {
            if (!fsBtn) { return; }
            fsBtn.innerHTML = '';
            fsBtn.appendChild(makeIcon(on ? 'i-minimize' : 'i-maximize'));
            fsBtn.title = on ? '退出全屏' : '全屏';
        }

        document.addEventListener('fullscreenchange', function () {
            syncFsIcon(!!(document.fullscreenElement || document.webkitFullscreenElement));
        });
        document.addEventListener('webkitfullscreenchange', function () {
            syncFsIcon(!!(document.fullscreenElement || document.webkitFullscreenElement));
        });
        syncFsIcon(false);

        api.toggleFullscreen = toggleFullscreen;

        /* ---------- 音效 API ---------- */
        api.beep = function (kind) {
            if (!soundEnabled) { return; }
            playBeep(kind);
        };
        api.soundOn = function () { return soundEnabled; };

        api.modal = modal;

        /* ---------- 帮助 ---------- */
        function openHelp() {
            modal({
                title: '使用说明',
                icon: 'i-help',
                size: 'narrow',
                body: opt.help,
                buttons: [{ label: '知道了', primary: true }]
            });
        }
        api.openHelp = openHelp;

        /* ---------- toast ---------- */
        api.toast = toast;

        /* ---------- 页脚（L2 品牌回流，低调一行） ---------- */
        var siteOrigin = typeof global.ET_SITE_ORIGIN === 'string' && /^https?:\/\//.test(global.ET_SITE_ORIGIN)
            ? global.ET_SITE_ORIGIN
            : null;

        function renderFooter() {
            footer.textContent = '';
            footer.appendChild(el('span', null, 'KeeTools 课工具'));
            footer.appendChild(el('span', null, '·'));
            if (siteOrigin) {
                var a = el('a', null, '更多课堂工具');
                a.href = siteOrigin + '/?from=tool-footer&tool=' + encodeURIComponent(toolId);
                a.target = '_blank';
                a.rel = 'noopener';
                footer.appendChild(a);
            } else {
                footer.appendChild(el('span', null, '更多课堂工具'));
            }
        }
        renderFooter();

        /* 站点来源发现：iframe 内向父窗口询问；也可由宿主直接注入 ET_SITE_ORIGIN */
        try {
            if (global.parent && global.parent !== global) {
                global.parent.postMessage(JSON.stringify({ type: 'et-hello', toolId: toolId }), '*');
            }
        } catch (err) { /* 跨域异常忽略 */ }

        global.addEventListener('message', function (ev) {
            var data = ev.data;
            if (typeof data === 'string') {
                try { data = JSON.parse(data); } catch (err) { return; }
            }
            if (!data || typeof data !== 'object') { return; }

            if (data.type === 'et-origin' && typeof data.origin === 'string' && /^https?:\/\//.test(data.origin)) {
                siteOrigin = data.origin;
                if (!global.ET_SITE_ORIGIN) { global.ET_SITE_ORIGIN = data.origin; }
                renderFooter();
            }
            if (data.type === 'et-fullscreen-change' && typeof data.value === 'boolean') {
                syncFsIcon(data.value);
            }
        });

        api.el = { topbar: topbar, main: main, footer: footer, actions: actions };

         * 翻页笔的上下页键在系统层等价于 PageDown / PageUp。
         * 工具通过 opt.primary / opt.secondary 注册动作：
         *   PageDown → primary（主操作，如开始点名 / 开始计时）
         *   PageUp   → secondary（副操作，缺省时同 primary）
         * 输入框聚焦或弹窗/抽屉打开时不响应，避免误触。 */
        if (typeof opt.primary === 'function') {
            document.addEventListener('keydown', function (ev) {
                if (ev.key !== 'PageDown' && ev.key !== 'PageUp') { return; }
                var tag = (document.activeElement && document.activeElement.tagName) || '';
                if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') { return; }
                if (document.querySelector('.et-modal, .et-drawer-backdrop, .ws-winner')) { return; }
                ev.preventDefault();
                if (ev.key === 'PageDown') { opt.primary(); }
                else if (typeof opt.secondary === 'function') { opt.secondary(); }
                else { opt.primary(); }
            });
        }

        return api;
    }

    global.ET = global.ET || {};
    global.ET.Chrome = {
        mount: mount,
        modal: modal,
        toast: toast,
        beep: playBeep /* 挂载前的独立音效入口（不经过音效开关） */
    };
})(window);

<script>
  /* 此块由 scripts/sync_shared.py 自动注入，请勿手工修改 */
/*!
 * et-stats.js — 使用统计模块（模块化，可整体移除）
 *
 * 共享逻辑源。改这里，然后跑：python scripts/sync_shared.py
 * 依赖：无（可脱离 et-util / et-chrome 独立运行）。
 * 全局：ET.Stats
 *
 * ┌────────────────────────────────────────────────────────────────┐
 * │ 说明：本模块只做一件事——工具被打开时向上报端点发一条匿名计数。 │
 * │ · 在线（iframe 内）：宿主页面已服务端计数，本模块不重复上报。   │
 * │ · 离线打开（file:// / 下载单文件 / 离线包）：联网条件具备时，   │
 * │   以 sendBeacon 上报 use_offline 事件（text/plain 免预检）。    │
 * │ · 上报端点 = window.ET_SITE_ORIGIN（由宿主注入或离线包配置）。  │
 * │   未配置端点时本模块完全静默，不发任何请求。                    │
 * │ · **整个 <script> 块可安全删除**：删除后工具其余功能完全正常，  │
 * │   且完全不再发起任何网络请求。                                  │
 * └────────────────────────────────────────────────────────────────┘
 */
(function (global) {
    'use strict';

    var ET = global.ET = global.ET || {};

    var Stats = {
        /** 上报端点来源（站点绝对地址，无协议尾斜杠） */
        endpoint: (typeof global.ET_SITE_ORIGIN === 'string' && /^https?:\/\//.test(global.ET_SITE_ORIGIN))
            ? global.ET_SITE_ORIGIN
            : null,

        _done: {},

        /**
         * 上报一次事件（同一事件同一工具每次页面加载只报一次）。
         * event: 'use_offline' 等；toolId: 工具 id。
         */
        send: function (event, toolId) {
            if (!event || this._done[event + ':' + (toolId || '')]) { return false; }
            if (!this.endpoint) { return false; }
            /* iframe 内由宿主统计，避免双计 */
            try {
                if (global.parent && global.parent !== global) { return false; }
            } catch (err) { return false; }
            /* 断网时挂起，网络恢复自动补报一次 */
            if (global.navigator && global.navigator.onLine === false) {
                var self = this;
                global.addEventListener('online', function () { self.send(event, toolId); }, { once: true });
                return false;
            }

            this._done[event + ':' + (toolId || '')] = true;
            var payload = JSON.stringify({ event: event, tool: toolId || '' });

            try {
                if (global.navigator.sendBeacon) {
                    return global.navigator.sendBeacon(
                        this.endpoint + '/api/track',
                        new Blob([payload], { type: 'text/plain;charset=UTF-8' })
                    );
                }
                global.fetch(this.endpoint + '/api/track', {
                    method: 'POST',
                    body: payload,
                    keepalive: true,
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'text/plain;charset=UTF-8' }
                });
                return true;
            } catch (err) {
                return false;
            }
        }
    };

    ET.Stats = Stats;
})(window);
</script>

        help: '<div style="font-size:13.5px;line-height:2">' +
            '<p style="margin:0 0 8px"><b>两种模式</b>：顶部可切换「题卷模式」（打印纸质题卷）与「在线答题」（学生直接在屏幕上作答、自动判分）。</p>' +
            '<p style="margin:0 0 8px"><b>在线答题</b>：每题横线上填答案，回车跳到下一题，写完点「批改」——自动标出对错（✓ / ✗）、显示错题正确答案、给出正确题数与得分、以及做题用时；点「重做」清空，点「只练错题」用这次的错题重新组一份卷子。</p>' +
            '<p style="margin:0 0 8px"><b>除法余数</b>写成 7……3 或 7余3 都算对（自动识别全角数字与空格）。</p>' +
            '<p style="margin:0 0 8px"><b>减法不出现负数</b>、<b>除数永远不为 0</b>；除法可选是否必须整除。</p>' +
            '<p style="margin:0 0 8px"><b>题卷模式</b>：勾选「显示答案」把答案以红色显示在同一行；打印时按需勾选即可印出答案页。</p>' +
            '<p style="margin:0 0 8px"><b>打印</b>：点「打印题卷」只打印题卷区，工具栏自动隐藏；算式字号会自动缩到格子内，不会溢出；在打印对话框选「另存为 PDF」即可发到班级群。</p>' +
            '<p style="margin:0 0 8px"><b>快捷键</b>：空格 = 答题模式批改 / 题卷模式再来一份；回车 = 下一题；翻页笔下页键同效。</p>' +
            '<p style="margin:0"><b>设置</b>：右上角 ⚙ 可调运算类型、数值范围、每行题数与进退位规则。</p></div>'
    });

    var els = {
        chips: document.getElementById('chips'),
        chkReveal: document.getElementById('chkReveal'),
        btnPrint: document.getElementById('btnPrint'),
        btnNew: document.getElementById('btnNew'),
        btnNewText: document.getElementById('btnNewText'),
        sheet: document.getElementById('sheet'),
        segMode: document.getElementById('segMode'),
        revealWrap: document.getElementById('revealWrap'),
        quizInfo: document.getElementById('quizInfo'),
        btnGrade: document.getElementById('btnGrade'),
        btnRetry: document.getElementById('btnRetry'),
        btnWrong: document.getElementById('btnWrong')
    };

    function save() {
        store.set('ops', state.ops);
        store.set('max', state.max);
        store.set('count', state.count);
        store.set('cols', state.cols);
        store.set('carry', state.carry);
        store.set('exact', state.exact);
        store.set('reveal', state.reveal);
        store.set('mode', state.mode);
    }

    /* ============ 出题 ============ */

    function randInt(lo, hi) {
        return lo + Math.floor(Math.random() * (hi - lo + 1));
    }

    function pickOp() {
        return state.ops[Math.floor(Math.random() * state.ops.length)];
    }

    /**
     * 生成一道题。返回 null 表示本次尝试不合法（调用方重试）。
     */
    function makeOne(op) {
        var max = state.max;
        var a, b, ans;

        if (op === 'add') {
            a = randInt(1, max - 1);
            b = randInt(1, max - a);
            if (!state.carry && (a % 10) + (b % 10) >= 10) { return null; }
            ans = a + b;
        } else if (op === 'sub') {
            a = randInt(2, max);
            b = randInt(1, a - 1);
            // 不借位：被减数个位 >= 减数个位
            if (!state.carry && (a % 10) < (b % 10)) { return null; }
            ans = a - b;
        } else if (op === 'mul') {
            var cap = Math.max(2, Math.min(12, Math.floor(Math.sqrt(max)) + 3));
            a = randInt(2, cap);
            b = randInt(2, Math.min(9, Math.floor(max / a)) || 2);
            if (a * b > max * 2) { return null; }
            ans = a * b;
        } else {
            b = randInt(2, Math.max(2, Math.min(9, Math.floor(max / 2))));
            ans = randInt(2, Math.max(2, Math.floor(max / b)));
            a = b * ans;
            if (a > max * 2) { return null; }
            if (!state.exact && Math.random() < 0.35) {
                // 有余数：改成 a = b * q + r 的形式，商与余数都要写
                var q = ans;
                var r = randInt(1, b - 1);
                return { op: 'div', a: b * q + r, b: b, ans: q + '……' + r, expr: (b * q + r) + ' ÷ ' + b + ' =' };
            }
        }

        return {
            op: op,
            a: a,
            b: b,
            ans: ans,
            expr: a + ' ' + OP_SIGN[op] + ' ' + b + ' ='
        };
    }

    function buildQuestions() {
        var list = [];
        var seen = {};
        var guard = 0;

        while (list.length < state.count && guard < state.count * 80) {
            guard++;
            var op = pickOp();
            var q = makeOne(op);
            if (!q) { continue; }
            var key = q.expr;
            if (seen[key]) { continue; }
            seen[key] = true;
            list.push(q);
        }

        // 极端参数下可能凑不满（如范围内可选算式太少）：退化为允许重复，保证题量达标
        guard = 0;
        while (list.length < state.count && guard < state.count * 40) {
            guard++;
            var q2 = makeOne(pickOp());
            if (q2) { list.push(q2); }
        }

        return list;
    }

    /* ============ 渲染 ============ */

    function render(questions) {
        var today = new Date();
        var stamp = today.getFullYear() + '-' +
            ('0' + (today.getMonth() + 1)).slice(-2) + '-' +
            ('0' + today.getDate()).slice(-2);

        stopQuizTimer();
        quiz.questions = questions;
        quiz.graded = null;
        quiz.elapsed = 0;

        els.sheet.textContent = '';

        var head = document.createElement('div');
        head.className = 'md-head';
        var title = document.createElement('div');
        title.className = 'md-head__title';
        title.textContent = quiz.wrongMode ? '错题重练' : '口算练习';
        var meta = document.createElement('div');
        meta.className = 'md-head__meta';
        var opText = [];
        for (var i = 0; i < state.ops.length; i++) { opText.push(OP_LABEL[state.ops[i]]); }
        meta.innerHTML = '姓名：________________<br>日期：________________<br>' +
            '范围 <b>' + state.max + ' 以内</b> · <b>' + opText.join(' / ') + '</b> · 共 <b>' +
            questions.length + '</b> 题 · ' + stamp +
            (state.mode === 'quiz' ? ' · <b>在线答题</b>' : '');
        head.appendChild(title);
        head.appendChild(meta);

        var grid = document.createElement('div');
        grid.className = 'md-grid';
        grid.style.gridTemplateColumns = 'repeat(' + state.cols + ', minmax(0, 1fr))';

        for (var k = 0; k < questions.length; k++) {
            var q = questions[k];

            var item = document.createElement('div');
            item.className = 'md-item' + (state.mode === 'paper' && state.reveal ? ' is-revealed' : '');

            var no = document.createElement('span');
            no.className = 'md-item__no';
            no.textContent = (k + 1) + '.';

            var expr = document.createElement('span');
            expr.className = 'md-item__expr';
            expr.textContent = q.expr;

            item.appendChild(no);
            item.appendChild(expr);

            if (state.mode === 'quiz') {
                item.appendChild(buildAnswerInput(k));
                var mark = document.createElement('span');
                mark.className = 'md-item__mark';
                item.appendChild(mark);
            } else {
                var blank = document.createElement('span');
                blank.className = 'md-item__blank';
                blank.textContent = ' ';

                var ans = document.createElement('span');
                ans.className = 'md-item__ans';
                ans.textContent = String(q.ans);

                item.appendChild(state.reveal ? ans : blank);
            }

            grid.appendChild(item);
        }

        var foot = document.createElement('div');
        foot.className = 'md-foot';
        if (state.mode === 'quiz') {
            foot.textContent = '在横线上填写答案，回车跳到下一题，全部写完点「批改」自动判分（商带余数写成 7……3 或 7余3 都算对）。';
        } else {
            foot.textContent = state.reveal
                ? '答案已显示（红色）。如需空白题卷，请取消勾选「显示答案」后再打印。'
                : '计时：______ 分 ______ 秒　　正确：______ 题　　错题：______ 题';
        }

        els.sheet.appendChild(head);
        els.sheet.appendChild(grid);
        els.sheet.appendChild(foot);

        fitFont();
        renderQuizBar();
    }

    /* ============ 在线答题 ============ */

    function buildAnswerInput(index) {
        var input = document.createElement('input');
        input.type = 'text';
        input.className = 'md-item__input';
        input.setAttribute('inputmode', 'text');
        input.setAttribute('autocomplete', 'off');
        input.setAttribute('spellcheck', 'false');
        input.setAttribute('aria-label', '第 ' + (index + 1) + ' 题答案');
        input.addEventListener('input', function () {
            var item = input.parentNode;
            item.classList.remove('is-right', 'is-wrong');
            var mark = item.querySelector('.md-item__mark');
            if (mark) { mark.className = 'md-item__mark'; mark.textContent = ''; }
            var fix = item.querySelector('.md-item__fix');
            if (fix && fix.parentNode) { fix.parentNode.removeChild(fix); }
            if (quiz.graded) {
                quiz.graded = null;
                els.btnWrong.hidden = true;
            }
            startQuizTimer();
            updateQuizInfo();
        });
        input.addEventListener('keydown', function (ev) {
            if (ev.key !== 'Enter') { return; }
            ev.preventDefault();
            var inputs = ET.qsa('.md-item__input');
            var idx = inputs.indexOf(ev.target);
            if (idx >= 0 && idx + 1 < inputs.length) {
                inputs[idx + 1].focus();
                inputs[idx + 1].select();
            } else {
                gradeQuiz();
            }
        });
        return input;
    }

    function normalizeAnswer(raw) {
        var s = String(raw === undefined || raw === null ? '' : raw);
        s = s.replace(/[０-９]/g, function (c) { return String.fromCharCode(c.charCodeAt(0) - 0xFEE0); });
        s = s.replace(/[\s，。．、,]/g, '');
        s = s.replace(/余数/g, '……').replace(/余/g, '……');
        s = s.replace(/[.．]{2,}/g, '……');
        s = s.replace(/…+/g, '……');
        return s;
    }

    function fmtClock(ms) {
        var total = Math.max(0, Math.floor(ms / 1000));
        var m = Math.floor(total / 60);
        var s = total % 60;
        return m + ':' + (s < 10 ? '0' : '') + s;
    }

    function startQuizTimer() {
        if (state.mode !== 'quiz' || quiz.timerId) { return; }
        quiz.startAt = Date.now() - quiz.elapsed;
        quiz.timerId = window.setInterval(updateQuizInfo, 500);
    }

    function stopQuizTimer() {
        if (quiz.timerId) {
            window.clearInterval(quiz.timerId);
            quiz.timerId = 0;
        }
        if (quiz.startAt) {
            quiz.elapsed = Date.now() - quiz.startAt;
            quiz.startAt = 0;
        }
    }

    function updateQuizInfo() {
        if (state.mode !== 'quiz') {
            els.quizInfo.hidden = true;
            return;
        }
        els.quizInfo.hidden = false;
        var inputs = ET.qsa('.md-item__input');
        var filled = 0;
        for (var i = 0; i < inputs.length; i++) {
            if (String(inputs[i].value || '').replace(/\s/g, '')) { filled++; }
        }
        var elapsed = quiz.elapsed + (quiz.startAt ? Date.now() - quiz.startAt : 0);
        if (quiz.graded) {
            els.quizInfo.innerHTML = '正确 <b>' + quiz.graded.right + '/' + quiz.graded.total +
                '</b> · 得分 <b>' + Math.round(quiz.graded.right / quiz.graded.total * 100) +
                '</b> · 用时 ' + fmtClock(quiz.elapsed);
        } else {
            els.quizInfo.innerHTML = '已作答 <b>' + filled + '/' + inputs.length +
                '</b> · 用时 ' + fmtClock(elapsed);
        }
    }

    function gradeQuiz() {
        if (state.mode !== 'quiz') { return; }
        var inputs = ET.qsa('.md-item__input');
        if (!inputs.length) { return; }

        stopQuizTimer();

        var right = 0;
        var wrongIdx = [];
        var empty = 0;

        for (var i = 0; i < inputs.length; i++) {
            var item = inputs[i].parentNode;
            var mark = item.querySelector('.md-item__mark');
            var q = quiz.questions[i] || {};
            var given = normalizeAnswer(inputs[i].value);
            var expect = normalizeAnswer(q.ans);

            var oldFix = item.querySelector('.md-item__fix');
            if (oldFix && oldFix.parentNode) { oldFix.parentNode.removeChild(oldFix); }

            if (!given) { empty++; }

            if (given && given === expect) {
                right++;
                item.classList.remove('is-wrong');
                item.classList.add('is-right');
                if (mark) { mark.className = 'md-item__mark is-right'; mark.textContent = '✓'; }
            } else {
                wrongIdx.push(i);
                item.classList.remove('is-right');
                item.classList.add('is-wrong');
                if (mark) { mark.className = 'md-item__mark is-wrong'; mark.textContent = '✗'; }
                var fix = document.createElement('span');
                fix.className = 'md-item__fix';
                fix.textContent = String(q.ans);
                item.appendChild(fix);
            }
        }

        var total = inputs.length;
        var score = Math.round(right / total * 100);
        quiz.graded = { right: right, wrong: total - right, empty: empty, wrongIdx: wrongIdx, total: total };

        chrome.beep(score >= 80 ? 'win' : (score >= 60 ? 'ok' : 'err'));
        chrome.toast('正确 ' + right + '/' + total + ' · 得分 ' + score +
            (empty ? '（其中 ' + empty + ' 题未作答）' : '') + ' · 用时 ' + fmtClock(quiz.elapsed),
            score >= 60 ? 'ok' : 'err');

        updateQuizInfo();
        renderQuizBar();
    }

    function retryQuiz() {
        var inputs = ET.qsa('.md-item__input');
        for (var i = 0; i < inputs.length; i++) {
            inputs[i].value = '';
            var item = inputs[i].parentNode;
            item.classList.remove('is-right', 'is-wrong');
            var mark = item.querySelector('.md-item__mark');
            if (mark) { mark.className = 'md-item__mark'; mark.textContent = ''; }
            var fix = item.querySelector('.md-item__fix');
            if (fix && fix.parentNode) { fix.parentNode.removeChild(fix); }
        }
        quiz.graded = null;
        quiz.elapsed = 0;
        quiz.startAt = 0;
        stopQuizTimer();
        updateQuizInfo();
        renderQuizBar();
        chrome.beep('tick');
        chrome.toast('已清空答案，重新作答');
    }

    function wrongOnly() {
        if (!quiz.graded || !quiz.graded.wrongIdx.length) {
            chrome.toast('这次没有错题，很棒！', 'ok');
            return;
        }
        var list = [];
        for (var i = 0; i < quiz.graded.wrongIdx.length; i++) {
            list.push(quiz.questions[quiz.graded.wrongIdx[i]]);
        }
        quiz.wrongMode = true;
        render(list);
        chrome.beep('ok');
        chrome.toast('已生成 ' + list.length + ' 道错题重练卷');
    }

    function renderQuizBar() {
        var isQuiz = state.mode === 'quiz';
        els.segModeButtons = els.segMode.querySelectorAll('button');
        for (var i = 0; i < els.segModeButtons.length; i++) {
            els.segModeButtons[i].classList.toggle('is-active',
                els.segModeButtons[i].getAttribute('data-mode') === state.mode);
        }
        els.revealWrap.hidden = isQuiz;
        els.btnGrade.hidden = !isQuiz;
        els.btnRetry.hidden = !isQuiz;
        els.btnWrong.hidden = !isQuiz || !(quiz.graded && quiz.graded.wrongIdx.length);
        els.quizInfo.hidden = !isQuiz;
        if (isQuiz) { updateQuizInfo(); }

        chrome.setStatus(isQuiz
            ? (quiz.graded ? '已批改：正确 ' + quiz.graded.right + '/' + quiz.graded.total
                : '在线答题 · 共 ' + quiz.questions.length + ' 题')
            : '共 ' + quiz.questions.length + ' 题 · ' + state.max + ' 以内 · ' + state.cols + ' 列');
    }

    function setMode(mode, announce) {
        mode = mode === 'quiz' ? 'quiz' : 'paper';
        if (mode === state.mode) { return; }
        state.mode = mode;
        store.set('mode', mode);
        quiz.wrongMode = false;
        render(quiz.questions.length ? quiz.questions : buildQuestions());
        if (announce) {
            chrome.beep('ok');
            chrome.toast(mode === 'quiz' ? '已切到在线答题：填答案后点「批改」自动判分' : '已切回题卷模式：可打印纸质题卷');
        }
    }

    /* 依据实际列宽把字号缩到刚好放得下，避免算式溢出格子 */
    function fitFont() {
        var grid = document.querySelector('.md-grid');
        if (!grid) { return; }
        grid.style.removeProperty('--md-fs');

        var items = grid.querySelectorAll('.md-item');
        if (!items.length) { return; }

        var colWidth = (grid.clientWidth - GRID_GAP * (state.cols - 1)) / state.cols;
        if (!(colWidth > 0)) { return; }

        for (var pass = 0; pass < 4; pass++) {
            var widest = 0;
            var widestEl = null;
            for (var i = 0; i < items.length; i++) {
                var w = items[i].scrollWidth;
                if (w > widest) { widest = w; widestEl = items[i]; }
            }
            if (!widestEl || widest <= colWidth) { return; }
            var current = parseFloat(window.getComputedStyle(widestEl).fontSize) || 20;
            var next = Math.max(12, Math.floor(current * colWidth / widest * 10) / 10);
            if (next >= current) { return; }
            grid.style.setProperty('--md-fs', next + 'px');
        }
    }

    function generate(announce) {
        var questions = buildQuestions();
        if (!questions.length) {
            chrome.toast('当前参数下出不了题，请放宽数值范围', 'err');
            chrome.beep('err');
            return;
        }
        quiz.wrongMode = false;
        render(questions);
        els.btnNewText.textContent = '再来一份';
        if (announce) {
            chrome.beep('win');
            chrome.toast('已生成 ' + questions.length + ' 道题' +
                (state.mode === 'quiz' ? ' · 可直接在线作答' : ''));
        }
    }

    function renderChips() {
        els.chips.textContent = '';
        for (var i = 0; i < COUNTS.length; i++) {
            (function (value) {
                var b = document.createElement('button');
                b.type = 'button';
                b.className = 'md-chip' + (value === state.count ? ' is-active' : '');
                b.textContent = String(value);
                b.title = value + ' 题';
                b.addEventListener('click', function () {
                    state.count = value;
                    save();
                    renderChips();
                    chrome.beep('ok');
                    generate(false);
                });
                els.chips.appendChild(b);
            })(COUNTS[i]);
        }
    }

    /* ============ 设置抽屉 ============ */

    function buildSettings(body) {
        function heading(text) {
            var h = document.createElement('h4');
            h.textContent = text;
            body.appendChild(h);
        }

        heading('使用模式');
        var modeBox = document.createElement('div');
        modeBox.className = 'et-drawer__row';
        [['paper', '题卷模式（打印）'], ['quiz', '在线答题（自动判分）']].forEach(function (pair) {
            var b = document.createElement('button');
            b.type = 'button';
            b.className = 'et-btn' + (state.mode === pair[0] ? ' et-btn--primary' : '');
            b.style.flex = '1 1 40%';
            b.textContent = pair[1];
            b.addEventListener('click', function () {
                setMode(pair[0], true);
                buildRefresh();
            });
            modeBox.appendChild(b);
        });
        body.appendChild(modeBox);

        heading('运算类型（可多选）');
        var opBox = document.createElement('div');
        opBox.className = 'et-drawer__row';
        for (var i = 0; i < OPS.length; i++) {
            (function (op) {
                var label = document.createElement('label');
                label.className = 'md-check';
                label.style.flex = '1 1 40%';
                var input = document.createElement('input');
                input.type = 'checkbox';
                input.checked = state.ops.indexOf(op) !== -1;
                input.addEventListener('change', function () {
                    var next = [];
                    for (var k = 0; k < OPS.length; k++) {
                        var boxes = opBox.querySelectorAll('input');
                        if (boxes[k] && boxes[k].checked) { next.push(OPS[k]); }
                    }
                    if (!next.length) {
                        input.checked = true;
                        chrome.toast('至少保留一种运算', 'warn');
                        return;
                    }
                    state.ops = next;
                    save();
                    generate(false);
                });
                label.appendChild(input);
                label.appendChild(document.createTextNode(' ' + OP_LABEL[op] + '法'));
                opBox.appendChild(label);
            })(OPS[i]);
        }
        body.appendChild(opBox);

        heading('数值范围');
        var maxBox = document.createElement('div');
        maxBox.className = 'et-drawer__row';
        for (var m = 0; m < MAXES.length; m++) {
            (function (value) {
                var b = document.createElement('button');
                b.type = 'button';
                b.className = 'et-btn' + (value === state.max ? ' et-btn--primary' : '');
                b.style.flex = '1 1 30%';
                b.textContent = value + ' 以内';
                b.addEventListener('click', function () {
                    state.max = value;
                    save();
                    buildRefresh();
                    generate(false);
                });
                maxBox.appendChild(b);
            })(MAXES[m]);
        }
        body.appendChild(maxBox);

        var customRow = document.createElement('div');
        customRow.className = 'et-drawer__row';
        var customInput = document.createElement('input');
        customInput.className = 'md-ta';
        customInput.type = 'number';
        customInput.min = '10';
        customInput.max = '999';
        customInput.value = String(state.max);
        customInput.title = '自定义最大数（10–999）';
        customInput.addEventListener('change', function () {
            state.max = clampInt(customInput.value, 10, 999, state.max);
            customInput.value = String(state.max);
            save();
            buildRefresh();
            generate(false);
        });
        customRow.appendChild(customInput);
        body.appendChild(customRow);

        heading('每行题数');
        var colBox = document.createElement('div');
        colBox.className = 'et-drawer__row';
        [4, 3, 2].forEach(function (value) {
            var b = document.createElement('button');
            b.type = 'button';
            b.className = 'et-btn' + (value === state.cols ? ' et-btn--primary' : '');
            b.style.flex = '1 1 30%';
            b.textContent = value + ' 列';
            b.addEventListener('click', function () {
                state.cols = value;
                save();
                buildRefresh();
                generate(false);
            });
            colBox.appendChild(b);
        });
        body.appendChild(colBox);

        heading('规则');
        var ruleBox = document.createElement('div');
        ruleBox.className = 'et-drawer__row';
        ruleBox.innerHTML =
            '<label class="md-check" style="flex:1 1 40%"><input type="checkbox" id="mdCarry"> 允许进位 / 借位</label>' +
            '<label class="md-check" style="flex:1 1 40%"><input type="checkbox" id="mdExact"> 除法必须整除</label>';
        body.appendChild(ruleBox);

        var carry = ruleBox.querySelector('#mdCarry');
        var exact = ruleBox.querySelector('#mdExact');
        carry.checked = state.carry;
        exact.checked = state.exact;
        carry.addEventListener('change', function () {
            state.carry = carry.checked;
            save();
            generate(false);
        });
        exact.addEventListener('change', function () {
            state.exact = exact.checked;
            save();
            generate(false);
        });

        var tip = document.createElement('p');
        tip.className = 'et-drawer__tip';
        tip.innerHTML = '减法永不出现负数，除数永不为 0。'
            + '<br>不勾选「允许进位 / 借位」时，只出个位不需进位、不需借位的题，适合刚学竖式的阶段。'
            + '<br>勾选「除法必须整除」时结果都是整数；取消后会出带余数的题（写成「商……余数」）。';
        body.appendChild(tip);

        function buildRefresh() {
            while (body.firstChild) { body.removeChild(body.firstChild); }
            buildSettings(body);
        }
    }

    /* ============ 事件 ============ */

    els.chkReveal.checked = state.reveal;
    els.chkReveal.addEventListener('change', function () {
        state.reveal = els.chkReveal.checked;
        save();
        generate(false);
        chrome.toast(state.reveal ? '答案已显示（红色）' : '答案已隐藏');
    });

    els.btnNew.addEventListener('click', function () { generate(true); });

    els.btnPrint.addEventListener('click', function () {
        chrome.toast('打印时把「目标」选为「另存为 PDF」即可保存');
        setTimeout(function () { window.print(); }, 120);
    });

    els.segMode.addEventListener('click', function (ev) {
        var v = ev.target && ev.target.getAttribute ? ev.target.getAttribute('data-mode') : null;
        if (v) { setMode(v, true); }
    });

    els.btnGrade.addEventListener('click', gradeQuiz);
    els.btnRetry.addEventListener('click', retryQuiz);
    els.btnWrong.addEventListener('click', wrongOnly);

    document.addEventListener('keydown', function (ev) {
        if (ev.code !== 'Space' && ev.key !== ' ') { return; }
        var node = document.activeElement;
        var tag = node && node.tagName ? node.tagName.toUpperCase() : '';
        if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT' || (node && node.isContentEditable)) { return; }
        if (document.querySelector('.et-modal, .et-drawer-backdrop')) { return; }
        ev.preventDefault();
        if (state.mode === 'quiz') { gradeQuiz(); } else { generate(true); }
    });

    window.addEventListener('resize', function () {
        window.clearTimeout(window.__mdResize);
        window.__mdResize = window.setTimeout(fitFont, 160);
    });

    /* ============ 启动 ============ */

    renderChips();
    generate(false);
})();
</script>

</body>
</html>
