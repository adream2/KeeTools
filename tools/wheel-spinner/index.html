/*!
 * et-chrome.css — 工具通用外壳样式（顶栏 / 页脚 / 弹窗 / 按钮 / 主题）
 *
 * 共享样式源。改这里，然后跑：python scripts/sync_shared.py

/* ============ 设计令牌 ============ */
:root {
    --et-accent: #2563eb;
    --et-accent-weak: rgba(37, 99, 235, .14);
    --et-bg: #f4f6fb;
    --et-surface: #ffffff;
    --et-surface-2: #f8fafc;
    --et-fg: #0b1220;
    --et-muted: #64748b;
    --et-line: rgba(15, 23, 42, .12);
    --et-line-strong: rgba(15, 23, 42, .22);
    --et-glass: rgba(255, 255, 255, .85);
    --et-shadow-md: 0 10px 28px -18px rgba(15, 23, 42, .3);
    --et-shadow-lg: 0 24px 60px -32px rgba(15, 23, 42, .4);
    --et-ok: #059669;
    --et-warn: #d97706;
    --et-err: #dc2626;
    --et-radius: 12px;
    --et-radius-sm: 9px;
    --et-font: -apple-system, BlinkMacSystemFont, "Segoe UI",
               "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei",
               "Noto Sans SC", sans-serif;
    --et-mono: ui-monospace, "Cascadia Mono", Consolas, Menlo, monospace;
}

html[data-et-theme="dark"] {
    --et-bg: #0b1120;
    --et-surface: #111a2e;
    --et-surface-2: #0f1729;
    --et-fg: #f1f5f9;
    --et-muted: #94a3b8;
    --et-line: rgba(148, 163, 184, .18);
    --et-line-strong: rgba(148, 163, 184, .3);
    --et-glass: rgba(17, 26, 46, .85);
    --et-shadow-md: 0 10px 34px -18px rgba(0, 0, 0, .8);
    --et-shadow-lg: 0 24px 70px -30px rgba(0, 0, 0, .9);
    --et-ok: #34d399;
    --et-warn: #fbbf24;
    --et-err: #f87171;
}

/* ============ 基础 ============ */
.et-app {
    position: relative;
    isolation: isolate;
    display: flex;
    flex-direction: column;
    height: 100vh;
    height: 100dvh;
    overflow: hidden;
    background: var(--et-bg);
    color: var(--et-fg);
    font-family: var(--et-font);
    -webkit-font-smoothing: antialiased;
    transition: background .25s, color .25s;
}

/* 极光背景：径向渐变 + 呼吸动画（edupick 品质基线，老内核也不掉帧） */
.et-app::before {
    content: '';
    position: fixed;
    inset: 0;
    z-index: -1;
    pointer-events: none;
    background:
        radial-gradient(46% 40% at 20% 18%, var(--et-accent-weak), transparent 65%),
        radial-gradient(42% 38% at 82% 24%, var(--et-accent-weak), transparent 70%),
        radial-gradient(50% 44% at 55% 95%, rgba(16, 185, 129, .10), transparent 65%);
    animation: et-aurora 16s ease-in-out infinite alternate;
}

@keyframes et-aurora {
    from { opacity: .55; transform: scale(1); }
    to { opacity: 1; transform: scale(1.06); }
}

.et-app *,
.et-app *::before,
.et-app *::after { box-sizing: border-box; }

[hidden] { display: none !important; }

.et-icon {
    width: 18px;
    height: 18px;
    fill: none;
    stroke: currentColor;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
    flex: none;
}

/* ============ 顶栏 ============ */
.et-topbar {
    flex: none;
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 11px 20px;
    border-bottom: 1px solid var(--et-line);
    background: var(--et-glass);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    z-index: 20;
}

.et-brand {
    display: flex;
    align-items: center;
    gap: 10px;
    min-width: 0;
}

.et-brand__dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: var(--et-accent);
    box-shadow: 0 0 0 4px var(--et-accent-weak);
    flex: none;
}

.et-brand__name {
    font-weight: 800;
    font-size: 15px;
    letter-spacing: -.01em;
    white-space: nowrap;
}

.et-brand__sub {
    font-size: 12.5px;
    color: var(--et-muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.et-status {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 5px 14px;
    border-radius: 999px;
    font-size: 12.5px;
    color: var(--et-muted);
    background: var(--et-surface-2);
    border: 1px solid var(--et-line);
    white-space: nowrap;
    max-width: 42vw;
    overflow: hidden;
    text-overflow: ellipsis;
}

.et-status__dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--et-ok);
    flex: none;
    transition: background .2s;
}

.et-status[data-tone="err"] .et-status__dot { background: var(--et-err); }
.et-status[data-tone="warn"] .et-status__dot { background: var(--et-warn); }

.et-actions {
    display: flex;
    align-items: center;
    gap: 7px;
}

.et-icon-btn {
    display: inline-grid;
    place-items: center;
    width: 38px;
    height: 38px;
    font-size: 16px;
    line-height: 1;
    border-radius: 11px;
    border: 1px solid var(--et-line);
    background: var(--et-surface-2);
    color: var(--et-fg);
    cursor: pointer;
    transition: transform .14s, border-color .14s, color .14s, opacity .14s;
    -webkit-tap-highlight-color: transparent;
}

.et-icon-btn:hover {
    border-color: var(--et-accent);
    color: var(--et-accent);
    transform: translateY(-1px);
}

.et-icon-btn:active { transform: translateY(0); }
.et-icon-btn.is-off { opacity: .4; }
.et-icon-btn:focus-visible { outline: 2px solid var(--et-accent); outline-offset: 2px; }

/* ============ 主区默认 ============ */
.et-main {
    flex: 1;
    min-height: 0;
    position: relative;
    overflow: auto;
}

/* ============ 页脚（品牌回流 L2） ============ */
.et-footer {
    flex: none;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 7px 16px;
    font-size: 12px;
    color: var(--et-muted);
    border-top: 1px solid var(--et-line);
    background: var(--et-glass);
    user-select: none;
    z-index: 20;
}

.et-footer a {
    color: inherit;
    text-decoration: none;
    transition: color .14s;
}

.et-footer a:hover { color: var(--et-accent); }

/* ============ 按钮 ============ */
.et-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
    padding: 9px 16px;
    border-radius: 11px;
    font: inherit;
    font-size: 13.5px;
    font-weight: 700;
    border: 1px solid var(--et-line);
    background: var(--et-surface-2);
    color: var(--et-fg);
    cursor: pointer;
    transition: transform .14s, border-color .14s, color .14s, background .14s, box-shadow .14s;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
}

.et-btn:hover {
    border-color: var(--et-accent);
    color: var(--et-accent);
    transform: translateY(-1px);
}

.et-btn:active { transform: translateY(0); }
.et-btn:focus-visible { outline: 2px solid var(--et-accent); outline-offset: 2px; }
.et-btn:disabled { opacity: .45; cursor: not-allowed; transform: none; }

.et-btn--primary {
    background: var(--et-accent);
    border-color: var(--et-accent);
    color: #fff;
    box-shadow: 0 6px 18px -8px var(--et-accent);
}

.et-btn--primary:hover { color: #fff; filter: brightness(1.08); }
.et-btn--primary:disabled { filter: none; }

.et-btn--danger:hover {
    border-color: var(--et-err);
    color: var(--et-err);
}

.et-btn--lg {
    padding: 13px 26px;
    font-size: 16px;
    border-radius: 14px;
}

/* ============ 弹窗 ============ */
.et-modal {
    position: fixed;
    inset: 0;
    z-index: 100;
    display: grid;
    place-items: center;
    padding: 24px;
    background: rgba(2, 6, 23, .55);
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    animation: et-fade .18s ease;
}

.et-modal__panel {
    width: min(680px, 94vw);
    max-height: 86vh;
    max-height: 86dvh;
    display: flex;
    flex-direction: column;
    background: var(--et-surface);
    border: 1px solid var(--et-line);
    border-radius: 16px;
    box-shadow: var(--et-shadow-lg);
    animation: et-pop .2s cubic-bezier(.34, 1.4, .64, 1);
    overflow: hidden;
}

.et-modal__panel--narrow { width: min(460px, 92vw); }
.et-modal__panel--wide { width: min(900px, 94vw); }

.et-modal__head {
    flex: none;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 16px 20px;
    border-bottom: 1px solid var(--et-line);
    font-weight: 800;
    font-size: 15px;
}

.et-modal__head .et-icon-btn {
    margin-left: auto;
    width: 32px;
    height: 32px;
}

.et-modal__body {
    flex: 1;
    min-height: 0;
    overflow: auto;
    padding: 18px 20px;
}

.et-modal__foot {
    flex: none;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 14px 20px;
    border-top: 1px solid var(--et-line);
    background: var(--et-surface-2);
}

.et-modal__foot .spacer { flex: 1; }

@keyframes et-fade {
    from { opacity: 0; }
}

@keyframes et-pop {
    from { opacity: 0; transform: translateY(14px) scale(.97); }
}

/* ============ 轻提示（toast） ============ */
.et-toast {
    position: fixed;
    left: 50%;
    bottom: 56px;
    transform: translateX(-50%) translateY(10px);
    z-index: 120;
    display: flex;
    align-items: center;
    gap: 9px;
    max-width: min(520px, 88vw);
    padding: 11px 18px;
    border-radius: 12px;
    font-size: 13.5px;
    font-weight: 600;
    color: #fff;
    background: rgba(15, 23, 42, .92);
    border: 1px solid rgba(148, 163, 184, .25);
    box-shadow: var(--et-shadow-lg);
    opacity: 0;
    pointer-events: none;
    transition: opacity .22s, transform .22s;
}

.et-toast.is-show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
}

.et-toast[data-tone="ok"] { background: rgba(5, 150, 105, .95); }
.et-toast[data-tone="err"] { background: rgba(220, 38, 38, .95); }
.et-toast[data-tone="warn"] { background: rgba(217, 119, 6, .95); }

/* ============ 设置抽屉（右上角入口，edupick 交互） ============ */
.et-drawer-backdrop {
    position: fixed;
    inset: 0;
    z-index: 90;
    background: rgba(2, 6, 23, .45);
    backdrop-filter: blur(3px);
    -webkit-backdrop-filter: blur(3px);
    opacity: 0;
    transition: opacity .2s;
}

.et-drawer-backdrop.is-open { opacity: 1; }

.et-drawer {
    position: absolute;
    top: 0;
    right: 0;
    height: 100%;
    width: min(400px, 92vw);
    display: flex;
    flex-direction: column;
    background: var(--et-surface);
    border-left: 1px solid var(--et-line);
    box-shadow: var(--et-shadow-lg);
    transform: translateX(100%);
    transition: transform .22s cubic-bezier(.32, .72, .35, 1);
}

.et-drawer-backdrop.is-open .et-drawer { transform: translateX(0); }

.et-drawer__head {
    flex: none;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 15px 18px;
    border-bottom: 1px solid var(--et-line);
    font-weight: 800;
    font-size: 15px;
    color: var(--et-accent);
}

.et-drawer__head .et-icon-btn {
    margin-left: auto;
    width: 32px;
    height: 32px;
}

.et-drawer__body {
    flex: 1;
    min-height: 0;
    overflow: auto;
    padding: 16px 18px 24px;
}

/* 抽屉内容通用小节（工具复用） */
.et-drawer__body h4 {
    margin: 18px 0 8px;
    font-size: 12px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: .08em;
    color: var(--et-muted);
}

.et-drawer__body h4:first-child { margin-top: 0; }

.et-drawer__row {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
}

.et-drawer__tip {
    margin: 8px 0 0;
    font-size: 12px;
    line-height: 1.8;
    color: var(--et-muted);
}

.et-drawer__tip b { color: var(--et-fg); }

.et-drawer__input {
    flex: 1;
    min-width: 0;
    padding: 9px 12px;
    border: 1px solid var(--et-line-strong);
    border-radius: 9px;
    background: var(--et-surface-2);
    color: var(--et-fg);
    font: inherit;
    font-size: 13.5px;
    transition: border-color .14s, box-shadow .14s;
}

.et-drawer__input:focus {
    outline: none;
    border-color: var(--et-accent);
    box-shadow: 0 0 0 3px var(--et-accent-weak);
}

.et-drawer__switch {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 10px 0;
    border-bottom: 1px dashed var(--et-line);
    font-size: 13.5px;
    font-weight: 600;
    color: var(--et-fg);
    cursor: pointer;
    user-select: none;
}

.et-drawer__switch input {
    width: 17px;
    height: 17px;
    accent-color: var(--et-accent);
    cursor: pointer;
}
</style>

.ws-seg { stroke: var(--et-surface); stroke-width: 2; }
.ws-seg-label {
    font-weight: 800;
    fill: #fff;
    pointer-events: none;
    paint-order: stroke;
    stroke: rgba(0, 0, 0, .18);
    stroke-width: 0;
}
.ws-seg-label--dark { fill: #1f2937; stroke: none; }

/* 中心按钮 */
.ws-hub {
    position: absolute;
    z-index: 5;
    width: 21%;
    aspect-ratio: 1;
    border-radius: 50%;
    border: 5px solid var(--et-surface);
    background: radial-gradient(circle at 32% 28%, #fbbf24, var(--et-accent) 70%);
    color: #fff;
    font: inherit;
    font-size: clamp(20px, 3vw, 30px);
    font-weight: 900;
    letter-spacing: .15em;
    text-indent: .15em;
    cursor: pointer;
    box-shadow: 0 8px 26px -8px rgba(0, 0, 0, .5), inset 0 -3px 8px rgba(0, 0, 0, .18);
    transition: transform .14s, filter .14s;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
}

.ws-hub:hover:not(:disabled) { transform: scale(1.06); filter: brightness(1.06); }
.ws-hub:active:not(:disabled) { transform: scale(.97); }
.ws-hub:disabled { filter: grayscale(.4); cursor: not-allowed; }

/* 指针 */
.ws-pointer {
    position: absolute;
    top: -6px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 6;
    width: 34px;
    height: 52px;
    filter: drop-shadow(0 4px 8px rgba(0, 0, 0, .35));
    pointer-events: none;
}

/* ---------- 空态 ---------- */
.ws-empty {
    position: absolute;
    inset: 0;
    display: grid;
    place-items: center;
    z-index: 8;
    background: var(--et-bg);
    border-radius: 50%;
    text-align: center;
    padding: 24px;
}

.ws-empty__title { font-size: 22px; font-weight: 900; margin-bottom: 14px; }
.ws-empty__hint { font-size: 13.5px; color: var(--et-muted); margin-bottom: 18px; }

/* ---------- 中奖展示 ---------- */
.ws-winner {
    position: absolute;
    inset: 0;
    z-index: 20;
    display: grid;
    place-items: center;
    background: rgba(2, 6, 23, .66);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    animation: ws-fade .25s ease;
}

.ws-winner__card {
    text-align: center;
    padding: clamp(28px, 6vh, 56px) clamp(36px, 8vw, 96px);
    border-radius: 26px;
    background: var(--et-surface);
    border: 1px solid var(--et-line);
    box-shadow: var(--et-shadow-lg);
    animation: ws-pop .5s cubic-bezier(.34, 1.56, .64, 1);
    max-width: 90vw;
}

.ws-winner__label {
    display: inline-block;
    padding: 5px 18px;
    border-radius: 999px;
    font-size: 13px;
    font-weight: 800;
    letter-spacing: .2em;
    text-indent: .2em;
    color: #fff;
    background: var(--et-accent);
    margin-bottom: 18px;
}

.ws-winner__name {
    font-size: clamp(48px, 10vw, 120px);
    font-weight: 900;
    line-height: 1.15;
    color: var(--et-accent);
    word-break: break-all;
}

.ws-winner__actions {
    margin-top: 26px;
    display: flex;
    justify-content: center;
    gap: 12px;
    flex-wrap: wrap;
}

.ws-winner canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
}

@keyframes ws-fade { from { opacity: 0; } }
@keyframes ws-pop {
    0% { opacity: 0; transform: scale(.7); }
    60% { transform: scale(1.05); }
    100% { transform: scale(1); }
}

@media (max-width: 720px) {
    .ws-main { gap: 10px; }
}
</style>

     * 把"原始表格行（二维数组）"规范化为 rows。
     * opts.weight 是否识别权重列；opts.id 是否识别学号列。
     */
    function tableToRows(table, opts, stats) {
        opts = opts || {};
        if (!table.length) { return []; }

        var width = 0;
        for (var w = 0; w < table.length; w++) {
            width = Math.max(width, table[w].length);
        }

        /* --- 表头识别 --- */
        var header = null;
        var first = table[0];
        var firstAllEmpty = true;
        for (var c0 = 0; c0 < first.length; c0++) {
            if (normCell(first[c0])) { firstAllEmpty = false; break; }
        }
        if (!firstAllEmpty) {
            for (var c = 0; c < first.length; c++) {
                if (matchKey(first[c], NAME_KEYS) || matchKey(first[c], WEIGHT_KEYS) || matchKey(first[c], ID_KEYS)) {
                    header = first;
                    table = table.slice(1);
                    stats.blanks++; /* 表头行不算数据 */
                    break;
                }
            }
        }

        /* --- 列映射 --- */
        var map = { name: -1, id: -1, weight: -1 };
        if (header) {
            for (var hc = 0; hc < header.length; hc++) {
                if (map.name < 0 && matchKey(header[hc], NAME_KEYS)) { map.name = hc; }
                else if (opts.id && map.id < 0 && matchKey(header[hc], ID_KEYS)) { map.id = hc; }
                else if (opts.weight && map.weight < 0 && matchKey(header[hc], WEIGHT_KEYS)) { map.weight = hc; }
            }
        }

        var cols = table.map(function (row) { return row; });
        function colValues(idx) {
            return cols.map(function (r) { return normCell(r[idx]); }).filter(function (v) { return v !== ''; });
        }

        if (map.name < 0) {
            if (width === 1) {
                map.name = 0;
            } else {
                var c0 = colValues(0);
                var c1 = colValues(1);
                var numeric0 = isAllNumeric(c0);
                var numeric1 = isAllNumeric(c1);
                if (width === 2) {
                    if (numeric0 && !numeric1) { map.id = 0; map.name = 1; }
                    else if (numeric1 && !numeric0 && opts.weight) { map.name = 0; map.weight = 1; }
                    else { map.name = 0; }
                } else {
                    /* ≥3 列：编号 | 姓名 | 权重 的经典布局 */
                    if (numeric0) { map.id = 0; map.name = 1; } else { map.name = 0; }
                    if (opts.weight) { map.weight = width - 1; }
                }
            }
        }
        if (map.name < 0) { map.name = 0; }
        if (!opts.weight) { map.weight = -1; }
        if (!opts.id) { map.id = -1; }

        /* --- 逐行处理 --- */
        var rows = [];
        var seen = {};
        var wantWeight = map.weight >= 0;

        for (var i = 0; i < table.length; i++) {
            var raw = table[i];
            var lineNo = i + (header ? 2 : 1); /* 用户视角的行号（含表头） */
            var name = map.name < raw.length ? normCell(raw[map.name]) : '';
            var restEmpty = true;
            for (var rc = 0; rc < raw.length; rc++) {
                if (normCell(raw[rc])) { restEmpty = false; break; }
            }
            if (!name && restEmpty) { stats.blanks++; continue; }

            if (!name) {
                stats.errors.push('第 ' + lineNo + ' 行：姓名列为空，已跳过');
                continue;
            }

            var weight = 1;
            if (wantWeight && map.weight < raw.length) {
                var wv = normCell(raw[map.weight]);
                if (wv !== '') {
                    var wn = Number(wv);
                    if (isFinite(wn) && wn >= 1) {
                        weight = Math.min(MAX_WEIGHT, Math.round(wn));
                        if (weight !== wn) {
                            stats.errors.push('第 ' + lineNo + ' 行：权重 "' + wv + '" 已取整为 ' + weight);
                        }
                    } else {
                        stats.errors.push('第 ' + lineNo + ' 行：权重 "' + wv + '" 无效（需 ≥1 的数字），按 1 处理');
                    }
                }
            }

            var id = '';
            if (map.id >= 0 && map.id < raw.length) {
                id = normCell(raw[map.id]);
            }

            if (opts.dedupe !== false && seen[name]) {
                stats.dupes++;
                continue;
            }
            seen[name] = true;

            rows.push({ name: name, id: id, weight: weight });
        }
        return rows;
    }

    function jsonToTable(json) {
        if (Array.isArray(json)) {
            var table = [];
            for (var i = 0; i < json.length; i++) {
                var item = json[i];
                if (typeof item === 'string' || typeof item === 'number') {
                    table.push([String(item)]);
                } else if (item && typeof item === 'object') {
                    var name = item.name || item.姓名 || item.名字 || item.title || '';
                    var weight = item.weight || item.权重 || item.次数 || '';
                    var id = item.id || item.学号 || item.编号 || '';
                    if (name !== undefined && name !== null) {
                        table.push([String(id), String(name), String(weight)]);
                    }
                }
            }
            return table;
        }
        return [];
    }

    /**
     * 纯文本解析入口。
     * 返回 { rows, stats }；stats = { lines, valid, dupes, blanks, errors[] }
     */
    function parseText(text, opts) {
        opts = opts || {};
        var stats = { lines: 0, valid: 0, dupes: 0, blanks: 0, errors: [] };
        var rows = [];

        var trimmed = String(text || '').replace(/^\uFEFF/, '').trim();
        if (!trimmed) {
            return { rows: rows, stats: stats };
        }

        /* JSON 优先 */
        if (trimmed.charAt(0) === '[' || trimmed.charAt(0) === '{') {
            try {
                var json = JSON.parse(trimmed);
                rows = tableToRows(jsonToTable(json), opts, stats);
            } catch (err) {
                stats.errors.push('JSON 解析失败：' + err.message);
            }
        } else {
            var lines = trimmed.split(/\r\n|\r|\n/);
            while (lines.length && !lines[lines.length - 1].trim()) { lines.pop(); }
            stats.lines = lines.length;

            var delim = detectDelimiter(lines);
            var table = [];
            for (var i = 0; i < lines.length; i++) {
                if (!lines[i].trim()) { continue; }
                table.push(delim ? splitLine(lines[i], delim) : [lines[i]]);
            }
            rows = tableToRows(table, opts, stats);
        }

        stats.valid = rows.length;
        return { rows: rows, stats: stats };
    }

    /* ============ 文件解码 ============ */

    function decodeBuffer(buffer) {
        var bytes = new Uint8Array(buffer);
        /* UTF-8 BOM */
        if (bytes[0] === 0xEF && bytes[1] === 0xBB && bytes[2] === 0xBF) {
            return new TextDecoder('utf-8').decode(bytes.subarray(3));
        }
        /* UTF-16 LE BOM */
        if (bytes[0] === 0xFF && bytes[1] === 0xFE) {
            return new TextDecoder('utf-16le').decode(bytes.subarray(2));
        }
        /* 严格 UTF-8 失败 → GBK / GB18030（Excel 导出的中文 CSV 常见） */
        try {
            return new TextDecoder('utf-8', { fatal: true }).decode(bytes);
        } catch (err) {
            try { return new TextDecoder('gb18030').decode(bytes); }
            catch (err2) { return new TextDecoder('gbk').decode(bytes); }
        }
    }

    /* ============ 弹窗 UI ============ */

    function esc(s) {
        return String(s === undefined || s === null ? '' : s)
            .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')

    function chip(label, n, tone) {

    }

    function renderResult(container, result, opts) {
        var rows = result.rows;
        var stats = result.stats;
        var html = '';

        if (!stats.lines && !rows.length && !stats.errors.length) {
            container.innerHTML = '<div class="etimp-empty">输入内容后这里会显示解析结果</div>';
            return;
        }

        html += '<div class="etimp-stats">';
        html += chip('有效', rows.length, rows.length ? 'ok' : '');
        if (stats.dupes) { html += chip('去重', stats.dupes, 'warn'); }
        if (stats.blanks) { html += chip('空行/表头', stats.blanks, ''); }
        html += '</div>';

        if (rows.length) {
            html += '<div class="etimp-table-wrap"><table class="etimp-table"><thead><tr>';
            html += '<th>#</th><th>姓名</th>';
            if (opts.id) { html += '<th>学号</th>'; }
            if (opts.weight) { html += '<th>权重</th>'; }
            html += '</tr></thead><tbody>';
            var previewMax = Math.min(rows.length, 10);
            for (var i = 0; i < previewMax; i++) {
                html += '<tr><td class="etimp-dim">' + (i + 1) + '</td><td>' + esc(rows[i].name) + '</td>';
                if (opts.id) { html += '<td class="etimp-dim">' + esc(rows[i].id || '—') + '</td>'; }
                if (opts.weight) { html += '<td class="etimp-num">' + rows[i].weight + '</td>'; }
                html += '</tr>';
            }
            html += '</tbody></table></div>';
            if (rows.length > previewMax) {
                html += '<div class="etimp-empty" style="margin-top:8px;border:none;padding:6px">… 共 ' + rows.length + ' 条，仅预览前 ' + previewMax + ' 条</div>';
            }
        } else if (!stats.errors.length) {
            html += '<div class="etimp-empty">未解析出有效数据</div>';
        }

        if (stats.errors.length) {
            html += '<div class="etimp-errors"><b>' + stats.errors.length + ' 处问题：</b><br>' +
                stats.errors.slice(0, 20).map(esc).join('<br>') +
                (stats.errors.length > 20 ? '<br>… 还有 ' + (stats.errors.length - 20) + ' 条' : '') + '</div>';
        }

        container.innerHTML = html;
    }

    function open(options) {
        var opt = options || {};
        var toolId = opt.toolId || 'unknown-tool';
        var opts = {
            weight: (opt.columns || ['name', 'weight']).indexOf('weight') !== -1,
            id: (opt.columns || []).indexOf('id') !== -1,
            dedupe: true
        };

        var Chrome = global.ET && global.ET.Chrome;
        if (!Chrome || !Chrome.modal) {
            if (opt.onConfirm) { opt.onConfirm([], { cancelled: true }); }
            return null;
        }

        var root = document.createElement('div');
        root.innerHTML =
            '<div class="etimp-tabs">' +
            '<button type="button" class="etimp-tab is-active" data-tab="paste"><b>粘贴文本</b></button>' +
            '<button type="button" class="etimp-tab" data-tab="file">打开文件</button>' +
            '</div>' +
            '<div data-panel="paste">' +
            '<textarea class="etimp-textarea" id="etimp-text" placeholder="' +
            '一行一个人，支持粘贴 Excel 表格、逗号/Tab 分隔文本，例如：\n张三\n李四,2\n1,王五,3">' +
            '</textarea>' +
            '<div class="etimp-help">支持 <b>纯姓名</b>（一行一个）、<b>姓名,权重</b>、<b>学号,姓名,权重</b>，' +
            '也支持带表头的 CSV（姓名 / 学号 / 权重 列自动识别）与 JSON 数组。' +
            (opts.weight ? '权重越大被抽中概率越高，默认 1。' : '') + '</div>' +
            '</div>' +
            '<div data-panel="file" hidden>' +
            '<div class="etimp-drop" id="etimp-drop" tabindex="0">' +
            '<span class="et-drop-icon"></span>' +
            '<span class="etimp-drop__main">点击选择或拖入文件</span>' +
            '<span class="etimp-drop__hint">支持 .csv / .txt / .json，自动识别 UTF-8 与 GBK 编码</span>' +
            '<input type="file" class="etimp-file" id="etimp-file" accept=".csv,.txt,.tsv,.json,text/csv,text/plain,application/json">' +
            '</div>' +
            '<div class="etimp-help">Excel 请先另存为 <b>CSV</b> 再导入（文件 → 另存为 → CSV）。</div>' +
            '</div>' +
            '<div class="etimp-result" id="etimp-result"><div class="etimp-empty">输入内容后这里会显示解析结果</div></div>';

        var body = root.firstChild ? root : root;
        /* root 本身作为容器 */
        var wrap = document.createElement('div');
        while (root.firstChild) { wrap.appendChild(root.firstChild); }

        var modal = global.ET.Chrome.modal({
            title: opt.title || '导入数据',
            icon: 'i-upload',
            size: 'wide',
            body: wrap,
            buttons: [
                { label: '取消' },
                {
                    label: '导入',
                    primary: true,
                    onClick: function (close) {
                        if (!lastResult || !lastResult.rows.length) { return; }
                        close();
                        if (opt.onConfirm) {
                            opt.onConfirm(lastResult.rows, {
                                dupes: lastResult.stats.dupes,
                                dedupe: opts.dedupe
                            });
                        }
                    }
                }
            ]
        });

        var q = function (sel) { return wrap.querySelector(sel); };
        var textEl = q('#etimp-text');
        var resultEl = q('#etimp-result');
        var importBtn = modal.foot.querySelector('.et-btn--primary');
        var lastResult = null;

        if (opt.current) { textEl.value = opt.current; }

        function refresh() {
            var text = textEl.value;
            lastResult = parseText(text, opts);
            renderResult(resultEl, lastResult, opts);
            importBtn.disabled = !lastResult.rows.length;
            if (lastResult.rows.length) {
                importBtn.textContent = '导入 ' + lastResult.rows.length + ' 条';
            } else {
                importBtn.textContent = '导入';
            }
        }

        var timer = 0;
        textEl.addEventListener('input', function () {
            clearTimeout(timer);
            timer = setTimeout(refresh, 250);
        });

        /* 页签切换 */
        wrap.querySelectorAll('.etimp-tab').forEach(function (tab) {
            tab.addEventListener('click', function () {
                wrap.querySelectorAll('.etimp-tab').forEach(function (t) { t.classList.remove('is-active'); });
                tab.classList.add('is-active');
                var name = tab.getAttribute('data-tab');
                q('[data-panel="paste"]').hidden = name !== 'paste';
                q('[data-panel="file"]').hidden = name !== 'file';
            });
        });

        /* 文件区 */
        var drop = q('#etimp-drop');
        var fileInput = q('#etimp-file');

        var dropIconHost = drop.querySelector('.et-drop-icon');
        var NS_SVG = 'http://www.w3.org/2000/svg'; /* et-allow-external SVG 命名空间 */
        var dropSvg = document.createElementNS(NS_SVG, 'svg');
        dropSvg.setAttribute('class', 'et-icon');
        var dropUse = document.createElementNS(NS_SVG, 'use');
        dropUse.setAttribute('href', '#i-upload');
        dropSvg.appendChild(dropUse);
        dropIconHost.appendChild(dropSvg);

        drop.addEventListener('click', function () { fileInput.click(); });
        drop.addEventListener('keydown', function (ev) {
            if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); fileInput.click(); }
        });
        ['dragenter', 'dragover'].forEach(function (evName) {
            drop.addEventListener(evName, function (ev) {
                ev.preventDefault();
                drop.classList.add('is-over');
            });
        });
        ['dragleave', 'drop'].forEach(function (evName) {
            drop.addEventListener(evName, function (ev) {
                ev.preventDefault();
                drop.classList.remove('is-over');
            });
        });
        drop.addEventListener('drop', function (ev) {
            var files = ev.dataTransfer && ev.dataTransfer.files;
            if (files && files.length) { readFile(files[0]); }
        });
        fileInput.addEventListener('change', function () {
            if (fileInput.files && fileInput.files.length) { readFile(fileInput.files[0]); }
        });

        function readFile(file) {
            var reader = new FileReader();
            reader.onload = function () {
                var text = decodeBuffer(reader.result);
                var isJson = /\.json$/i.test(file.name) ||
                    (text.charAt(0) !== '\n' && (text.charAt(0) === '['));
                if (isJson) {
                    try {
                        JSON.parse(text.trim()); /* 校验合法性，错误交给 parseText 报 */
                    } catch (err) { /* parseText 会再次报错 */ }
                }
                textEl.value = text;
                /* 切回粘贴页让用户可见内容 */
                wrap.querySelectorAll('.etimp-tab').forEach(function (t) {
                    t.classList.toggle('is-active', t.getAttribute('data-tab') === 'paste');
                });
                q('[data-panel="paste"]').hidden = false;
                q('[data-panel="file"]').hidden = true;
                refresh();
                global.ET.Chrome.toast('已读取 ' + file.name, 'ok');
            };
            reader.onerror = function () {
                global.ET.Chrome.toast('文件读取失败', 'err');
            };
            reader.readAsArrayBuffer(file);
        }

        refresh();
        setTimeout(function () { textEl.focus(); }, 60);

        return modal;
    }

    global.ET = global.ET || {};
    global.ET.Import = { open: open, parseText: parseText, decodeBuffer: decodeBuffer };
})(window);
</script>

(function (global) {

/*!
 * random-pick.js — 随机抽取（加权 / 去重 / 候选池）
 *
 * 共享逻辑源。改这里，然后跑：python scripts/sync_shared.py
 * 依赖：无。
 * 全局：ET.Pick
 */
(function (global) {
    'use strict';

    /**
     * 按权重随机返回索引。
     * weights: [num]，每项 ≥1。
     */
    function weightedIndex(weights) {
        var total = 0;
        for (var i = 0; i < weights.length; i++) {
            total += Math.max(1, weights[i] || 1);
        }
        var r = Math.random() * total;
        var acc = 0;
        for (var j = 0; j < weights.length; j++) {
            acc += Math.max(1, weights[j] || 1);
            if (r < acc) { return j; }
        }
        return weights.length - 1;
    }

    /**
     * 构建候选池。
     * items: [{name, weight, id?}]

     * 返回 [{ index, name, weight, id }]（index 为在 items 中的下标）
     */
    function buildCandidates(items, opts) {

    }

     * 从候选池抽 1 个。

            for (var i = 0; i < candidates.length; i++) { weights.push(candidates[i].weight); }
            idx = weightedIndex(weights);

        }

    }

    /**
     * 洗牌（Fisher–Yates），返回新数组，不改原数组。
     */

            out[j] = tmp;

    }

    /**
     * 抽 N 个（不重复），加权时按权重有放回地抽再去重。
     */
    function pickMany(candidates, n, opts) {
        opts = opts || {};
        var pool = candidates.slice();
        var out = [];
        n = Math.min(n, pool.length);
        for (var k = 0; k < n; k++) {
            var one = pickOne(pool, opts);
            if (!one) { break; }
            out.push(one);
            pool = pool.filter(function (c) { return c.name !== one.name; });
        }
        return out;
    }

    global.ET = global.ET || {};
    global.ET.Pick = {
        weightedIndex: weightedIndex,
        buildCandidates: buildCandidates,
        pickOne: pickOne,
        pickMany: pickMany,
        shuffle: shuffle
    };
})(window);
</script>

<!-- 使用统计（模块化：删除上方 et-stats 注入块即可完全不联网，见 README） -->
<script>
try { ET.Stats.send('use_offline', 'wheel-spinner'); } catch (e) { /* 静默 */ }
</script>

<script>
(function () {
    'use strict';

    var TOOL_ID = 'wheel-spinner';
    var store = ET.store(TOOL_ID);

    var PALETTE = [
        '#ef4444', '#3b82f6', '#22c55e', '#f59e0b',
        '#a855f7', '#ec4899', '#06b6d4', '#f97316',
        '#84cc16', '#6366f1', '#14b8a6', '#d946ef'
    ];

    var CX = 260, CY = 260, R = 250;

    var state = {
        items: store.get('items', []),        /* [{name, id, weight}] */
        weighted: store.get('weighted', true),
        removeWinner: store.get('remove_winner', false),
        removedStack: [],                     /* 自动移除的备份，用于撤销 */
        rotation: 0,
        spinning: false
    };

    var chrome = ET.Chrome.mount({
        toolId: TOOL_ID,
        title: '课堂大转盘',
        sub: '点名 · 抽签 · 抽奖',
        accent: '#f59e0b',
        status: state.items.length ? '转盘 ' + state.items.length + ' 格' : '尚未导入数据',
        sound: true,
        primary: spin,             /* 翻页笔 PageDown：旋转 */
        secondary: spin,           /* 翻页笔 PageUp：同样旋转 */
        help: '<div style="font-size:13.5px;line-height:2">' +
            '<p style="margin:0 0 8px"><b>转</b>：点中心按钮或按空格键。</p>' +
            '<p style="margin:0 0 8px"><b>数据</b>：右上角 ⚙ 导入 / 快速生成 / 离线名单。</p>' +
            '<p style="margin:0 0 8px"><b>按权重分配扇区</b>：权重越大的名字扇区越大；关闭则等分等概率。</p>' +
            '<p style="margin:0 0 8px"><b>抽中自动移除</b>：开奖后该扇区消失（可撤销），适合轮流抽奖。</p>' +
            '<p style="margin:0"><b>数据</b>：名单保存在本机浏览器，不会上传。</p>' +
            '<p style="margin:0"><b>翻页笔</b>：激光笔 / 翻页笔的上下页键均可直接旋转。</p></div>',
        settings: {
            title: '数据 / 设置',
            build: buildSettings
        }
    });

    var els = {
        svg: document.getElementById('wheelSvg'),
        hub: document.getElementById('hubBtn'),
        empty: document.getElementById('emptyState'),
        btnEmptyImport: document.getElementById('btnEmptyImport'),
        main: document.getElementById('et-main')
    };

    /* ============ 扇区几何 ============ */

    function segs() {
        var items = state.items.filter(function (it) { return it && it.name; });
        if (!items.length) { return []; }
        var useWeight = state.weighted;
        var weights = items.map(function (it) { return useWeight ? Math.max(1, it.weight || 1) : 1; });
        var total = 0;
        for (var i = 0; i < weights.length; i++) { total += weights[i]; }
        var out = [];
        var start = 0;
        for (var j = 0; j < items.length; j++) {
            var sweep = weights[j] / total * 360;
            out.push({ name: items[j].name, id: items[j].id, weight: weights[j], start: start, sweep: sweep });
            start += sweep;
        }
        return out;
    }

    function polar(angleDeg, radius) {
        var a = angleDeg * Math.PI / 180;
        return [CX + radius * Math.cos(a), CY + radius * Math.sin(a)];
    }

    function segPath(s) {
        var large = s.sweep > 180 ? 1 : 0;
        var p1 = polar(s.start, R);
        var p2 = polar(s.start + s.sweep, R);
        if (s.sweep >= 359.99) {
            return 'M ' + CX + ' ' + CY +
                ' m -' + R + ' 0 a ' + R + ' ' + R + ' 0 1 0 ' + (R * 2) + ' 0 a ' + R + ' ' + R + ' 0 1 0 -' + (R * 2) + ' 0';
        }
        return 'M ' + CX + ' ' + CY +
            ' L ' + p1[0].toFixed(2) + ' ' + p1[1].toFixed(2) +
            ' A ' + R + ' ' + R + ' 0 ' + large + ' 1 ' + p2[0].toFixed(2) + ' ' + p2[1].toFixed(2) +
            ' Z';
    }

    function luminance(hex) {
        var r = parseInt(hex.slice(1, 3), 16) / 255;
        var g = parseInt(hex.slice(3, 5), 16) / 255;
        var b = parseInt(hex.slice(5, 7), 16) / 255;
        return 0.2126 * r + 0.7152 * g + 0.0722 * b;
    }

    function renderWheel() {
        var svgNS = 'http://www.w3.org/2000/svg'; /* et-allow-external SVG 命名空间 */
        els.svg.textContent = '';
        var list = segs();

        if (!list.length) {
            els.empty.hidden = false;
            els.hub.disabled = true;
            chrome.setStatus('尚未导入数据');
            return;
        }
        els.empty.hidden = true;
        els.hub.disabled = state.spinning;

        var n = list.length;
        for (var i = 0; i < n; i++) {
            var s = list[i];
            var color = PALETTE[i % PALETTE.length];

            var path = document.createElementNS(svgNS, 'path');
            path.setAttribute('d', segPath(s));
            path.setAttribute('fill', color);
            path.setAttribute('class', 'ws-seg');
            els.svg.appendChild(path);

            /* 标签（sweep < 12° 或超出 24 格时跳过） */
            if (s.sweep >= 12 && n <= 24) {
                var mid = s.start + s.sweep / 2;
                var flipped = mid > 90 && mid < 270;
                var textR = R * 0.62;
                var pos = polar(mid, textR);
                var fontSize = n > 16 ? 15 : n > 10 ? 19 : 24;
                if (s.name.length > 5) { fontSize = Math.max(12, fontSize - 4); }
                if (s.name.length > 9) { fontSize = Math.max(11, fontSize - 2); }

                var text = document.createElementNS(svgNS, 'text');
                text.setAttribute('x', pos[0].toFixed(1));
                text.setAttribute('y', pos[1].toFixed(1));
                text.setAttribute('class', 'ws-seg-label' + (luminance(color) > 0.62 ? ' ws-seg-label--dark' : ''));
                text.setAttribute('font-size', fontSize);
                text.setAttribute('text-anchor', 'middle');
                text.setAttribute('dominant-baseline', 'central');
                if (flipped) {
                    text.setAttribute('transform', 'rotate(180 ' + pos[0].toFixed(1) + ' ' + pos[1].toFixed(1) + ')');
                }
                var label = s.name;
                if (s.weight > 1 && state.weighted && label.length <= 4) {
                    label += ' ×' + s.weight;
                }
                text.textContent = label;
                els.svg.appendChild(text);
            }
        }
        chrome.setStatus('转盘 ' + n + ' 格' + (state.weighted ? ' · 按权重' : ''));
    }

    /* ============ 旋转 ============ */

    function segAt(angleDeg) {
        var list = segs();
        var a = ((angleDeg % 360) + 360) % 360;
        for (var i = 0; i < list.length; i++) {
            var s = list[i];
            if (a >= s.start && a < s.start + s.sweep) { return { index: i, seg: s }; }
        }
        return { index: list.length - 1, seg: list[list.length - 1] };
    }

    function spin() {
        if (state.spinning) { return; }
        var list = segs();
        if (list.length < 2) {
            chrome.toast(list.length === 1 ? '至少需要 2 个扇区才能转' : '请先导入数据', 'warn');
            return;
        }

        state.spinning = true;
        els.hub.disabled = true;
        els.hub.textContent = '…';

        /* 均匀取落点角度 → 天然按扇区大小（权重）分配概率 */
        var landAngle = Math.random() * 360;
        var hit = segAt(landAngle);
        /* 避开边界：向扇区中部收 15% */
        var margin = hit.seg.sweep * 0.15;
        var theta = hit.seg.start + margin + Math.random() * (hit.seg.sweep - margin * 2);

        /* 指针在 270°：θ + Rf ≡ 270 (mod 360) */
        var turns = 6 + Math.floor(Math.random() * 4);
        var Rf = 270 - theta + turns * 360;
        while (Rf <= state.rotation + 360) { Rf += 360; }

        var R0 = state.rotation;
        var duration = 4400 + Math.random() * 900;
        var t0 = performance.now();
        var lastSegIndex = segAt(270 - R0).index;

        function easeOutQuart(t) { return 1 - Math.pow(1 - t, 4); }

        function frame(now) {
            var t = Math.min(1, (now - t0) / duration);
            var rot = R0 + (Rf - R0) * easeOutQuart(t);
            state.rotation = rot;
            els.svg.style.transform = 'rotate(' + rot.toFixed(2) + 'deg)';

            var cur = segAt(270 - rot).index;
            if (cur !== lastSegIndex) {
                lastSegIndex = cur;
                chrome.beep('tick');
            }

            if (t < 1) {
                requestAnimationFrame(frame);
            } else {
                finish(hit.index);
            }
        }
        requestAnimationFrame(frame);
    }

    function finish(index) {
        state.rotation = ((state.rotation % 360) + 360) % 360;
        var winner = state.items[index];
        state.spinning = false;
        els.hub.textContent = '转';

        if (state.removeWinner) {
            state.removedStack.push({ index: index, item: winner });
            state.items.splice(index, 1);
            persist();
        }

        chrome.beep('win');
        showWinner(winner);
        renderWheel();
        if (state.removeWinner) { chrome.setStatus('已移除「' + winner.name + '」，可在设置中撤销'); }
    }

    /* ============ 中奖展示 + 彩带 ============ */

    function showWinner(winner) {
        var overlay = document.createElement('div');
        overlay.className = 'ws-winner';
        overlay.innerHTML =
            '<canvas></canvas>' +
            '<div class="ws-winner__card">' +
            '<div class="ws-winner__label">恭喜选中</div>' +
            '<div class="ws-winner__name"></div>' +
            '<div class="ws-winner__actions">' +
            '<button class="et-btn et-btn--lg et-btn--primary" data-act="again">再来一次</button>' +
            '<button class="et-btn et-btn--lg" data-act="close">关闭</button>' +
            '</div></div>';
        overlay.querySelector('.ws-winner__name').textContent = winner.name;
        els.main.appendChild(overlay);

        var canvas = overlay.querySelector('canvas');
        var rect = overlay.getBoundingClientRect();
        canvas.width = rect.width;
        canvas.height = rect.height;
        runConfetti(canvas);

        function close() { if (overlay.parentNode) { overlay.parentNode.removeChild(overlay); } }
        overlay.addEventListener('click', function (ev) {
            var act = ev.target.getAttribute && ev.target.getAttribute('data-act');
            if (ev.target === overlay || act === 'close') { close(); }
            if (act === 'again') { close(); spin(); }
        });
        document.addEventListener('keydown', function onKey(ev) {
            if (ev.key === 'Escape') { document.removeEventListener('keydown', onKey); close(); }
        });
    }

    var confettiRaf = 0;

    function runConfetti(canvas) {
        var colors = PALETTE;
        var parts = [];
        var W = canvas.width, H = canvas.height;
        for (var i = 0; i < 90; i++) {
            parts.push({
                x: W / 2 + (Math.random() - 0.5) * W * 0.4,
                y: H * 0.4,
                vx: (Math.random() - 0.5) * 11,
                vy: -7 - Math.random() * 8,
                w: 5 + Math.random() * 6,
                h: 3 + Math.random() * 4,
                rot: Math.random() * Math.PI,
                vr: (Math.random() - 0.5) * 0.32,
                color: colors[i % colors.length],
                life: 1
            });
        }
        var ctx = canvas.getContext('2d');
        if (confettiRaf) { cancelAnimationFrame(confettiRaf); }

        function frame() {
            ctx.clearRect(0, 0, W, H);
            var alive = 0;
            for (var k = 0; k < parts.length; k++) {
                var p = parts[k];
                p.vy += 0.3;
                p.x += p.vx; p.y += p.vy; p.rot += p.vr;
                p.life -= 0.01;
                if (p.life > 0 && p.y < H + 24) {
                    alive++;
                    ctx.save();
                    ctx.globalAlpha = Math.max(0, p.life);
                    ctx.translate(p.x, p.y);
                    ctx.rotate(p.rot);
                    ctx.fillStyle = p.color;
                    ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
                    ctx.restore();
                }
            }
            if (alive && canvas.isConnected) {
                confettiRaf = requestAnimationFrame(frame);
            } else {
                confettiRaf = 0;
            }
        }
        confettiRaf = requestAnimationFrame(frame);
    }

    /* ============ 持久化 / 数据操作 ============ */

    function persist() {
        store.set('items', state.items);
        store.set('weighted', state.weighted);
        store.set('remove_winner', state.removeWinner);
    }

    function applyItems(rows) {
        if (rows.length < 2) {
            chrome.toast('至少需要 2 条数据才能成盘', 'warn');
            return false;
        }
        state.items = rows;
        state.removedStack = [];
        persist();
        renderWheel();
        return true;
    }

    function openImport() {
        ET.Import.open({
            toolId: TOOL_ID,
            title: '导入转盘数据',
            columns: ['name', 'id', 'weight'],
            current: state.items.map(function (r) {
                return (r.id ? r.id + ',' : '') + r.name + (r.weight > 1 ? ',' + r.weight : '');
            }).join('\n'),
            onConfirm: function (rows, meta) {
                if (applyItems(rows)) {
                    chrome.toast('转盘已更新：' + rows.length + ' 格' +
                        (meta.dupes ? '（去重 ' + meta.dupes + '）' : ''), 'ok');
                }
            }
        });
    }

    function exportItems() {
        if (!state.items.length) { chrome.toast('数据为空，先导入或生成'); return; }
        var csv = '\uFEFF名称,权重\n' + state.items.map(function (r) {
            return r.name + ',' + r.weight;
        }).join('\n');
        var blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });
        var a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = '转盘数据.csv';
        a.click();
        setTimeout(function () { URL.revokeObjectURL(a.href); }, 2000);
        chrome.toast('数据已导出', 'ok');
    }

    /* ============ 设置抽屉（右上角 ⚙） ============ */

    function drawerHead(body, text) {
        var h = document.createElement('h4');
        h.textContent = text;
        body.appendChild(h);
    }

    function drawerButton(body, label, icon, primary, onClick) {
        var b = document.createElement('button');
        b.className = 'et-btn' + (primary ? ' et-btn--primary' : '');
        b.style.flex = '1';
        b.innerHTML = '<svg class="et-icon"><use href="#' + icon + '"></use></svg>' + label;
        b.addEventListener('click', onClick);
        body.appendChild(b);
        return b;
    }

    function buildSettings(body) {
        /* —— 数据 —— */
        drawerHead(body, '转盘数据（当前 ' + state.items.length + ' 条）');
        var row1 = document.createElement('div');
        row1.className = 'et-drawer__row';
        body.appendChild(row1);
        drawerButton(row1, '导入 / 编辑', 'i-upload', true, openImport);
        drawerButton(row1, '导出 CSV', 'i-download', false, exportItems);

        /* 按学号快速生成 */
        var gen = document.createElement('div');
        gen.className = 'et-drawer__row';
        gen.style.marginTop = '10px';
        gen.innerHTML =
            '<input class="et-drawer__input" id="wsGenFrom" type="number" min="1" max="999" value="1" style="flex:0 0 72px" title="起始学号">' +
            '<span class="etimp-dim">到</span>' +
            '<input class="et-drawer__input" id="wsGenTo" type="number" min="1" max="999" value="40" style="flex:0 0 72px" title="结束学号">' +
            '<input class="et-drawer__input" id="wsGenTpl" value="{n}号" title="名称模板，{n} 代表学号">' +
            '<button class="et-btn" id="wsGenBtn"><svg class="et-icon"><use href="#i-zap"></use></svg>生成</button>';
        body.appendChild(gen);

        var tip1 = document.createElement('p');
        tip1.className = 'et-drawer__tip';
        tip1.innerHTML = '按学号快速生成转盘（点名用），模板中 <b>{n}</b> 代表学号。';
        body.appendChild(tip1);

        /* —— 转盘选项 —— */
        drawerHead(body, '转盘选项');
        [['按权重分配扇区（权重越大扇区越大）', 'weighted'],
         ['抽中自动移除（开奖后移出转盘，可撤销）', 'removeWinner']].forEach(function (def) {
            var label = document.createElement('label');
            label.className = 'et-drawer__switch';
            var span = document.createElement('span');
            span.textContent = def[0];
            var input = document.createElement('input');
            input.type = 'checkbox';
            input.checked = state[def[1]];
            input.addEventListener('change', function () {
                state[def[1]] = input.checked;
                persist();
                renderWheel();
            });
            label.appendChild(span);
            label.appendChild(input);
            body.appendChild(label);
        });

        /* —— 撤销移除 —— */
        if (state.removedStack.length) {
            drawerHead(body, '最近移除');
            var row3 = document.createElement('div');
            row3.className = 'et-drawer__row';
            body.appendChild(row3);
            drawerButton(row3, '撤销移除（' + state.removedStack.length + '）', 'i-undo', false, function () {
                var last = state.removedStack.pop();
                if (!last) { return; }
                state.items.splice(Math.min(last.index, state.items.length), 0, last.item);
                persist();
                renderWheel();
                chrome.toast('已恢复：' + last.item.name, 'ok');
            });
        }

        /* —— 离线名单 —— */
        drawerHead(body, '离线名单（推荐）');
        var tip2 = document.createElement('p');
        tip2.className = 'et-drawer__tip';
        tip2.innerHTML = '把数据存成 <b>roster.js</b> 放在本工具同目录，下次打开自动加载：' +
            '<br><code style="font-family:var(--et-mono);font-size:12px">window.ET_ROSTER = "一等奖\\n二等奖,2";</code>' +
            '<br>也可用 <b>roster.txt</b>（在线打开时生效）。';
        body.appendChild(tip2);

        gen.querySelector('#wsGenBtn').addEventListener('click', function () {
            var from = Math.max(1, Math.round(Number(document.getElementById('wsGenFrom').value) || 1));
            var to = Math.max(from, Math.round(Number(document.getElementById('wsGenTo').value) || from));
            var tpl = document.getElementById('wsGenTpl').value || '{n}号';
            if (to - from + 1 > 999) { chrome.toast('一次最多生成 999 条', 'warn'); return; }
            var rows = [];
            for (var n = from; n <= to; n++) {
                rows.push({ name: tpl.replace(/\{n\}/g, String(n)), id: String(n), weight: 1 });
            }
            if (applyItems(rows)) { chrome.toast('已生成 ' + rows.length + ' 格转盘', 'ok'); }
        });
    }

    /* ============ 离线名单（优先级最高） ============ */

    function tryOfflineRoster() {
        var rows = null;

        /* 1. roster.js（同步，file:// 与 http 均可） */
        if (Array.isArray(window.ET_ROSTER)) {
            rows = window.ET_ROSTER.map(function (x) {
                return typeof x === 'string' ? { name: x.trim(), id: '', weight: 1 }
                    : { name: String(x.name || '').trim(), id: String(x.id || ''), weight: Math.max(1, x.weight || 1) };
            }).filter(function (r) { return r.name; });
        } else if (typeof window.ET_ROSTER === 'string' && window.ET_ROSTER.trim()) {
            rows = ET.Import.parseText(window.ET_ROSTER, { weight: true }).rows;
        }

        if (rows && rows.length) {
            if (rows.length >= 2) {
                state.items = rows;
                persist();
                chrome.setStatus('离线数据 ' + rows.length + ' 条（roster.js）');
            }
            return;
        }

        /* 2. roster.txt（仅 http(s)） */
        if (/^https?:$/.test(location.protocol)) {
            fetch('roster.txt', { cache: 'no-store' }).then(function (res) {
                if (!res.ok) { return; }
                return res.text().then(function (text) {
                    if (!text.trim()) { return; }
                    var parsed = ET.Import.parseText(text, { weight: true }).rows;
                    if (parsed.length >= 2) {
                        state.items = parsed;
                        persist();
                        renderWheel();
                        chrome.setStatus('离线数据 ' + parsed.length + ' 条（roster.txt）');
                    }
                });
            }).catch(function () { /* 无离线名单，静默 */ });
        }
    }

    /* ============ 事件 ============ */

    els.hub.addEventListener('click', spin);
    els.btnEmptyImport.addEventListener('click', openImport);

    document.addEventListener('keydown', function (ev) {
        if (ev.key !== ' ' && ev.key !== 'Enter') { return; }
        var tag = (document.activeElement && document.activeElement.tagName) || '';
        if (tag === 'TEXTAREA' || tag === 'INPUT' || tag === 'BUTTON') { return; }
        if (document.querySelector('.et-modal, .et-drawer-backdrop, .ws-winner')) { return; }
        ev.preventDefault();
        spin();
    });

    /* ============ 启动 ============ */
    renderWheel();
    els.svg.style.transform = 'rotate(' + state.rotation + 'deg)';
    tryOfflineRoster();
})();
</script>
