.et-app {
    position: relative;
    isolation: isolate;

.et-btn--primary {

/* ============ 弹窗 ============ */
.et-modal {

    inset: 0;
    z-index: 100;
    display: grid;

/* ============ 轻提示（toast） ============ */
.et-toast {

                var btn = el('button', 'et-btn' + (b.primary ? ' et-btn--primary' : '') + (b.danger ? ' et-btn--danger' : ''), b.label);
                btn.type = 'button';
                btn.addEventListener('click', function () {
                    if (b.onClick) { b.onClick(close); } else { close(); }
                });
                foot.appendChild(btn);
            });
            panel.appendChild(foot);
        }

        backdrop.appendChild(panel);
        document.body.appendChild(backdrop);

        function close() {
            if (backdrop.parentNode) { backdrop.parentNode.removeChild(backdrop); }
            document.removeEventListener('keydown', onKey);
            if (mo.onClose) { mo.onClose(); }
        }
        function onKey(ev) {
            if (ev.key === 'Escape') { ev.stopPropagation(); close(); }
        }
        document.addEventListener('keydown', onKey);
        backdrop.addEventListener('mousedown', function (ev) {
            if (ev.target === backdrop) { close(); }
        });

        return { panel: panel, body: body, foot: foot, close: close };
    }

    var toastEl = null;
    var toastTimer = 0;

    function toast(msg, tone) {
        if (!toastEl) {
            toastEl = el('div', 'et-toast');
            document.body.appendChild(toastEl);
        }
        toastEl.textContent = msg;
        toastEl.setAttribute('data-tone', tone || '');
        void toastEl.offsetWidth;
        toastEl.classList.add('is-show');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(function () { toastEl.classList.remove('is-show'); }, 2200);
    }

    /* ---------- PWA 元数据（blob manifest，环境不支持时静默跳过） ---------- */

    function installPwa(toolId, title, accent) {
        try {
            var theme = document.querySelector('meta[name="theme-color"]');
            if (!theme) {
                theme = document.createElement('meta');
                theme.setAttribute('name', 'theme-color');
                document.head.appendChild(theme);
            }
            theme.setAttribute('content', accent || '#2563eb');

            var svg = '<svg xmlns="' + NS_SVG + '" viewBox="0 0 64 64">' +
                '<rect width="64" height="64" rx="14" fill="' + (accent || '#2563eb') + '"/>' +
                '<text x="32" y="43" font-size="32" font-weight="800" font-family="sans-serif" ' +
                'fill="#fff" text-anchor="middle">' + (title || '课').charAt(0) + '</text></svg>';
            var iconUri = 'data:image/svg+xml,' + encodeURIComponent(svg);

            var mf = {
                name: title || 'KeeTools 课工具',
                short_name: title || '课工具',
                start_url: '.',
                display: 'standalone',
                background_color: '#f4f6fb',
                theme_color: accent || '#2563eb',
                icons: [{ src: iconUri, sizes: 'any', type: 'image/svg+xml', purpose: 'any' }]
            };
            var blob = new Blob([JSON.stringify(mf)], { type: 'application/manifest+json' });
            var link = document.createElement('link');
            link.rel = 'manifest';
            link.href = URL.createObjectURL(blob);
            document.head.appendChild(link);
        } catch (err) { /* 不支持 PWA 元数据的环境静默跳过 */ }
    }

    /* ---------- 挂载 ---------- */

    function mount(options) {
        var opt = options || {};
        var toolId = opt.toolId || 'unknown-tool';
        var store = global.ET && global.ET.store
            ? global.ET.store(toolId)
            : (function () { return { get: function () { return null; }, set: function () {} }; })();

        var api = { toolId: toolId, store: store };
        var soundEnabled = store.get('sound', true) !== false;

        /* 主题色 */
        if (opt.accent) {
            document.documentElement.style.setProperty('--et-accent', opt.accent);
        }

        installPwa(toolId, opt.title, opt.accent);

        /* ---------- 主题 ---------- */
        var theme = store.get('theme', null);
        if (theme !== 'dark' && theme !== 'light') {
            theme = (global.matchMedia && global.matchMedia('(prefers-color-scheme: dark)').matches)
                ? 'dark' : 'light';
        }
        applyTheme(theme);

        function applyTheme(t) {
            theme = t;
            document.documentElement.setAttribute('data-et-theme', t);
            store.set('theme', t);
            if (themeBtn) {
                themeBtn.innerHTML = '';
                themeBtn.appendChild(makeIcon(t === 'dark' ? 'i-sun' : 'i-moon'));
                themeBtn.title = t === 'dark' ? '切换到浅色' : '切换到深色';
            }
        }

        /* ---------- 顶栏 ---------- */
        var topbar = document.getElementById('et-topbar');
        var main = document.getElementById('et-main');
        var footer = document.getElementById('et-footer');

        if (!topbar) { topbar = el('header'); topbar.id = 'et-topbar'; document.body.insertBefore(topbar, document.body.firstChild); }
        if (!main) { main = el('main'); main.id = 'et-main'; topbar.after(main); }
        if (!footer) { footer = el('footer'); footer.id = 'et-footer'; document.body.appendChild(footer); }

        topbar.className = 'et-topbar';
        main.classList.add('et-main');
        footer.className = 'et-footer';

        /* 品牌 */
        var brand = el('div', 'et-brand');
        brand.appendChild(el('span', 'et-brand__dot'));
        var nameWrap = el('div');
        nameWrap.style.cssText = 'min-width:0;line-height:1.25';

        if (opt.sub) { nameWrap.appendChild(el('div', 'et-brand__sub', opt.sub)); }
        brand.appendChild(nameWrap);
        topbar.appendChild(brand);

        /* 状态胶囊 */
        var statusPill = el('div', 'et-status');
        statusPill.hidden = true;
        statusPill.appendChild(el('span', 'et-status__dot'));
        var statusText = el('span', null, '');
        statusPill.appendChild(statusText);
        topbar.appendChild(statusPill);

        api.setStatus = function (text, tone) {
            if (!text) { statusPill.hidden = true; return; }
            statusText.textContent = text;
            statusPill.setAttribute('data-tone', tone || 'ok');
            statusPill.hidden = false;

        if (opt.status) { api.setStatus(opt.status); }

        /* 动作区（edupick 交互：右上角聚合设置入口） */
        var actions = el('div', 'et-actions');

        var settingsBtn = null;
        if (opt.settings && typeof opt.settings.build === 'function') {
            settingsBtn = makeBtn('i-sliders', opt.settings.title || '设置', function () {

                    opt.settings.build(body, { api: api, close: drawerApi.close });
                });

        }

        (opt.actions || []).forEach(function (a) {
            var b = makeBtn(a.icon, a.label || '', a.onClick);

        });

        var soundBtn = null;
        if (opt.sound) {

        if (opt.help) {
            actions.appendChild(makeBtn('i-help', '使用说明', function () { openHelp(); }));
        }

        var themeBtn = makeBtn('', '切换主题', function () {

        /* 全屏按钮始终保留：iframe 内对本工具文档 requestFullscreen

        var fsBtn = makeBtn('i-maximize', '全屏', toggleFullscreen);
        actions.appendChild(fsBtn);

        function toggleSound() {

            soundBtn.appendChild(makeIcon(soundEnabled ? 'i-volume' : 'i-volume-off'));
            soundBtn.title = soundEnabled ? '关闭音效' : '开启音效';
            soundBtn.classList.toggle('is-off', !soundEnabled);
            if (soundEnabled) { api.beep('ok'); }
        }

        api.openSettings = function () {
            if (settingsBtn) { settingsBtn.click(); }

        /* ---------- 全屏（iframe 内委托宿主，避免双层全屏） ---------- */

        function inIframe() {
            try { return global.parent && global.parent !== global; } catch (err) { return true; }
        }

        function toggleFullscreen() {
            var root = document.documentElement;
            var fsEl = document.fullscreenElement || document.webkitFullscreenElement || null;
            if (fsEl) {
                (document.exitFullscreen || document.webkitExitFullscreen || function () {}).call(document);
            } else {
                var req = root.requestFullscreen || root.webkitRequestFullscreen;
                if (req) { try { req.call(root); } catch (err) { /* 忽略 */ } }
            }
        }

        function syncFsIcon(on) {
            if (!fsBtn) { return; }
            fsBtn.innerHTML = '';
            fsBtn.appendChild(makeIcon(on ? 'i-minimize' : 'i-maximize'));
            fsBtn.title = on ? '退出全屏' : '全屏';
        }

        document.addEventListener('fullscreenchange', function () {
            syncFsIcon(!!(document.fullscreenElement || document.webkitFullscreenElement));
        });
        document.addEventListener('webkitfullscreenchange', function () {
            syncFsIcon(!!(document.fullscreenElement || document.webkitFullscreenElement));
        });
        syncFsIcon(false);

        api.toggleFullscreen = toggleFullscreen;

        /* ---------- 音效 API ---------- */
        api.beep = function (kind) {
            if (!soundEnabled) { return; }
            playBeep(kind);
        };
        api.soundOn = function () { return soundEnabled; };

        api.modal = modal;

        /* ---------- 帮助 ---------- */
        function openHelp() {
            modal({
                title: '使用说明',
                icon: 'i-help',
                size: 'narrow',
                body: opt.help,
                buttons: [{ label: '知道了', primary: true }]
            });
        }
        api.openHelp = openHelp;

        /* ---------- toast ---------- */
        api.toast = toast;

        /* ---------- 页脚（L2 品牌回流，低调一行） ---------- */
        var siteOrigin = typeof global.ET_SITE_ORIGIN === 'string' && /^https?:\/\//.test(global.ET_SITE_ORIGIN)
            ? global.ET_SITE_ORIGIN
            : null;

        function renderFooter() {
            footer.textContent = '';
            footer.appendChild(el('span', null, 'KeeTools 课工具'));
            footer.appendChild(el('span', null, '·'));
            if (siteOrigin) {
                var a = el('a', null, '更多课堂工具');
                a.href = siteOrigin + '/?from=tool-footer&tool=' + encodeURIComponent(toolId);
                a.target = '_blank';
                a.rel = 'noopener';
                footer.appendChild(a);
            } else {
                footer.appendChild(el('span', null, '更多课堂工具'));
            }
        }
        renderFooter();

        /* 站点来源发现：iframe 内向父窗口询问；也可由宿主直接注入 ET_SITE_ORIGIN */
        try {
            if (global.parent && global.parent !== global) {
                global.parent.postMessage(JSON.stringify({ type: 'et-hello', toolId: toolId }), '*');
            }
        } catch (err) { /* 跨域异常忽略 */ }

        global.addEventListener('message', function (ev) {
            var data = ev.data;
            if (typeof data === 'string') {
                try { data = JSON.parse(data); } catch (err) { return; }
            }
            if (!data || typeof data !== 'object') { return; }

            if (data.type === 'et-origin' && typeof data.origin === 'string' && /^https?:\/\//.test(data.origin)) {
                siteOrigin = data.origin;
                if (!global.ET_SITE_ORIGIN) { global.ET_SITE_ORIGIN = data.origin; }
                renderFooter();
            }
            if (data.type === 'et-fullscreen-change' && typeof data.value === 'boolean') {
                syncFsIcon(data.value);
            }
        });

        api.el = { topbar: topbar, main: main, footer: footer, actions: actions };

        /* ---------- 激光笔 / 翻页笔适配（HID 翻页键） ----------
         * 翻页笔的上下页键在系统层等价于 PageDown / PageUp。
         * 工具通过 opt.primary / opt.secondary 注册动作：
         *   PageDown → primary（主操作，如开始点名 / 开始计时）
         *   PageUp   → secondary（副操作，缺省时同 primary）
         * 输入框聚焦或弹窗/抽屉打开时不响应，避免误触。 */
        if (typeof opt.primary === 'function') {
            document.addEventListener('keydown', function (ev) {
                if (ev.key !== 'PageDown' && ev.key !== 'PageUp') { return; }
                var tag = (document.activeElement && document.activeElement.tagName) || '';
                if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') { return; }
                if (document.querySelector('.et-modal, .et-drawer-backdrop, .ws-winner')) { return; }
                ev.preventDefault();
                if (ev.key === 'PageDown') { opt.primary(); }
                else if (typeof opt.secondary === 'function') { opt.secondary(); }
                else { opt.primary(); }
            });
        }

        return api;
    }

    global.ET = global.ET || {};
    global.ET.Chrome = {
        mount: mount,
        modal: modal,
        toast: toast,
        beep: playBeep /* 挂载前的独立音效入口（不经过音效开关） */
    };
})(window);
</script>

<script>
  /* 此块由 scripts/sync_shared.py 自动注入，请勿手工修改 */
/*!
 * et-stats.js — 使用统计模块（模块化，可整体移除）
 *
 * 共享逻辑源。改这里，然后跑：python scripts/sync_shared.py
 * 依赖：无（可脱离 et-util / et-chrome 独立运行）。
 * 全局：ET.Stats
 *
 * ┌────────────────────────────────────────────────────────────────┐
 * │ 说明：本模块只做一件事——工具被打开时向上报端点发一条匿名计数。 │
 * │ · 在线（iframe 内）：宿主页面已服务端计数，本模块不重复上报。   │
 * │ · 离线打开（file:// / 下载单文件 / 离线包）：联网条件具备时，   │
 * │   以 sendBeacon 上报 use_offline 事件（text/plain 免预检）。    │
 * │ · 上报端点 = window.ET_SITE_ORIGIN（由宿主注入或离线包配置）。  │
 * │   未配置端点时本模块完全静默，不发任何请求。                    │
 * │ · **整个 <script> 块可安全删除**：删除后工具其余功能完全正常，  │
 * │   且完全不再发起任何网络请求。                                  │
 * └────────────────────────────────────────────────────────────────┘
 */
(function (global) {
    'use strict';

    var ET = global.ET = global.ET || {};

    var Stats = {
        /** 上报端点来源（站点绝对地址，无协议尾斜杠） */
        endpoint: (typeof global.ET_SITE_ORIGIN === 'string' && /^https?:\/\//.test(global.ET_SITE_ORIGIN))
            ? global.ET_SITE_ORIGIN
            : null,

        _done: {},

        /**
         * 上报一次事件（同一事件同一工具每次页面加载只报一次）。
         * event: 'use_offline' 等；toolId: 工具 id。
         */
        send: function (event, toolId) {
            if (!event || this._done[event + ':' + (toolId || '')]) { return false; }
            if (!this.endpoint) { return false; }
            /* iframe 内由宿主统计，避免双计 */
            try {
                if (global.parent && global.parent !== global) { return false; }
            } catch (err) { return false; }
            /* 断网时挂起，网络恢复自动补报一次 */
            if (global.navigator && global.navigator.onLine === false) {
                var self = this;
                global.addEventListener('online', function () { self.send(event, toolId); }, { once: true });
                return false;
            }

            this._done[event + ':' + (toolId || '')] = true;
            var payload = JSON.stringify({ event: event, tool: toolId || '' });

            try {
                if (global.navigator.sendBeacon) {
                    return global.navigator.sendBeacon(
                        this.endpoint + '/api/track',
                        new Blob([payload], { type: 'text/plain;charset=UTF-8' })
                    );
                }
                global.fetch(this.endpoint + '/api/track', {
                    method: 'POST',
                    body: payload,
                    keepalive: true,
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'text/plain;charset=UTF-8' }
                });
                return true;
            } catch (err) {
                return false;
            }
        }
    };

    ET.Stats = Stats;
})(window);
</script>

<script>
(function () {
    'use strict';

    var TOOL_ID = 'lever-balance';
    var store = ET.store(TOOL_ID);

    var chrome = ET.Chrome.mount({
        toolId: TOOL_ID,
        title: '杠杆平衡',
        sub: '物理 · F₁L₁=F₂L₂',
        accent: '#4f46e5',
        status: '就绪',
        sound: true,
        primary: challenge,
        help: '<div style="font-size:13.5px;line-height:2">' +
            '<p style="margin:0 0 8px"><b>怎么玩</b>：右侧选好砝码（0.5N / 1N / 2N），点杠杆上的刻度挂上去；点击砝码取下。杠杆会实时倾斜，两边力矩相等时恢复水平。</p>' +
            '<p style="margin:0 0 8px"><b>平衡条件</b>：动力 × 动力臂 = 阻力 × 阻力臂（F₁L₁ = F₂L₂），力臂从支点数格子。</p>' +
            '<p style="margin:0 0 8px"><b>挑战</b>：点「出题挑战」，杠杆左边已挂好砝码，请在右边配平。</p>' +
            '<p style="margin:0"><b>快捷键</b>：空格 / 翻页笔下页键 = 出题挑战。</p></div>'
    });

    var els = {
        board: document.getElementById('board'),
        massBtns: document.getElementById('massBtns'),
        torqueList: document.getElementById('torqueList'),
        sums: document.getElementById('sums'),
        btnChallenge: document.getElementById('btnChallenge'),
        btnClear: document.getElementById('btnClear'),
        formula: document.getElementById('formula'),
        hint: document.getElementById('hint')
    };

    var MASSES = [
        { f: 0.5, g: 50, w: 34, h: 20, color: '#64748b' },
        { f: 1.0, g: 100, w: 44, h: 26, color: '#4f46e5' },
        { f: 2.0, g: 200, w: 56, h: 33, color: '#b45309' }
    ];

    var state = {
        selected: 1.0,
        weights: store.get('weights', []),
        angle: 0,
        vel: 0,
        target: 0,
        raf: 0,
        challenge: null,
        celebrated: false
    };

    var PIVOT = [500, 318];
    var UNIT = 40;

    /* ---------- 板面骨架 ---------- */

    function buildBoard() {
        var s = '<defs>' +
            '<linearGradient id="lbBeam" x1="0" y1="0" x2="0" y2="1">' +
            '<stop offset="0" stop-color="var(--et-surface-2)"/><stop offset="1" stop-color="var(--et-line-strong)"/>' +
            '</linearGradient></defs>';

        /* 底座阴影与地面 */
        s += '<line x1="120" y1="492" x2="880" y2="492" stroke="var(--et-line)" stroke-width="3"/>';
        /* 铅垂参考线 */
        s += '<line x1="500" y1="318" x2="500" y2="470" stroke="var(--et-line)" stroke-width="1.5" stroke-dasharray="4 5"/>';

        /* 杠杆组（旋转） */
        s += '<g id="beamG">';
        s += '<rect x="100" y="308" width="800" height="20" rx="5" fill="url(#lbBeam)" stroke="var(--et-line-strong)" stroke-width="1.6"/>';
        for (var i = -10; i <= 10; i++) {
            if (i === 0) { continue; }
            var x = PIVOT[0] + i * UNIT;
            s += '<line x1="' + x + '" y1="308" x2="' + x + '" y2="300" stroke="var(--et-muted)" stroke-width="2" opacity=".7"/>';
            if (i % 5 === 0) {
                s += '<text x="' + x + '" y="292" font-size="13" font-weight="700" text-anchor="middle" fill="var(--et-muted)">' +
                    Math.abs(i) + '</text>';
            }
        }
        s += '<g id="weightsG"></g>';
        s += '</g>';

        /* 支点三角 */
        s += '<polygon points="500,318 458,472 542,472" fill="var(--et-surface)" stroke="var(--et-line-strong)" stroke-width="2"/>';
        s += '<circle cx="500" cy="318" r="9" fill="var(--et-accent)"/>';
        s += '<text x="500" y="498" font-size="14" font-weight="700" text-anchor="middle" fill="var(--et-muted)">支点 O</text>';

        /* 倾角读数 */
        s += '<text id="angleText" x="540" y="340" font-size="15" font-weight="800" fill="var(--et-accent)">0.0°</text>';

        /* 刻度挂钩热区（不随杠杆旋转，简化点击；位置按水平刻度） */
        s += '<g id="hooksG"></g>';

        els.board.innerHTML = s;
        renderHooks();
        renderWeights();
    }

    function renderHooks() {
        var s = '';
        for (var i = -10; i <= 10; i++) {
            if (i === 0) { continue; }
            var x = PIVOT[0] + i * UNIT;
            s += '<circle class="leverbalance-hook" data-pos="' + i + '" cx="' + x + '" cy="318" r="15" ' +
                'fill="transparent" stroke="none" style="cursor:pointer"><title>' +
                (i > 0 ? '右' : '左') + Math.abs(i) + '格</title></circle>';
        }
        els.board.querySelector('#hooksG').innerHTML = s;
        var hooks = els.board.querySelectorAll('.leverbalance-hook');
        for (var k = 0; k < hooks.length; k++) {
            hooks[k].addEventListener('click', onHookClick);
        }
    }

    function weightAt(pos) {
        for (var i = 0; i < state.weights.length; i++) {
            if (state.weights[i].pos === pos) { return i; }
        }
        return -1;
    }

    function onHookClick(ev) {
        var pos = parseInt(ev.currentTarget.getAttribute('data-pos'), 10);
        var exist = weightAt(pos);
        if (exist >= 0) {
            state.weights.splice(exist, 1);
            chrome.beep('tick');
        } else {
            var mass = MASSES.filter(function (m) { return m.f === state.selected; })[0];
            state.weights.push({ pos: pos, f: mass.f });
            chrome.beep('tick');
            if (state.challenge && pos < 0) {
                chrome.toast('挑战是把右边配平——砝码要挂在右边（正刻度）');
            }
        }
        persist();
        updateAll();
    }

    /* ---------- 砝码渲染 ---------- */

    function weightSvg(w) {
        var mass = MASSES.filter(function (m) { return m.f === w.f; })[0];
        var x = PIVOT[0] + w.pos * UNIT;
        var hw = mass.w / 2;
        var s = '<g class="leverbalance-w" data-pos="' + w.pos + '" transform="translate(' + x + ',' + (PIVOT[1] + 12) + ')">' +
            '<g class="leverbalance-win" transform="rotate(' + (-state.angle).toFixed(2) + ')">' +
            '<path d="M -5 0 A 5 5 0 1 1 5 0" fill="none" stroke="' + mass.color + '" stroke-width="2.5"/>' +
            '<rect x="' + (-hw) + '" y="4" width="' + mass.w + '" height="' + mass.h + '" rx="4" fill="' + mass.color + '"/>' +
            '<rect x="' + (-hw) + '" y="4" width="' + mass.w + '" height="' + (mass.h * .38) + '" rx="3" fill="#fff" opacity=".18"/>' +
            '<text x="0" y="' + (4 + mass.h * .68) + '" font-size="' + Math.max(11, mass.h * .5) +
            '" font-weight="800" text-anchor="middle" fill="#fff">' + mass.g + 'g</text>' +
            '</g></g>';
        return s;
    }

    function renderWeights() {
        var s = '';
        var sorted = state.weights.slice().sort(function (a, b) { return a.pos - b.pos; });
        var stack = {};
        for (var i = 0; i < sorted.length; i++) {
            var pos = sorted[i].pos;
            stack[pos] = (stack[pos] || 0) + 1;
            var order = stack[pos];
            var w = sorted[i];
            var xml = weightSvg(w);
            if (order > 1) {
                /* 同格叠加：整体向下平移 */
                xml = xml.replace('transform="translate(' + (PIVOT[0] + pos * UNIT) + ',' + (PIVOT[1] + 12) + ')"',
                    'transform="translate(' + (PIVOT[0] + pos * UNIT) + ',' + (PIVOT[1] + 12 + (order - 1) * 0) + ')"');
            }
            s += xml;
        }
        els.board.querySelector('#weightsG').innerHTML = s;
        var nodes = els.board.querySelectorAll('.leverbalance-w');
        for (var k = 0; k < nodes.length; k++) {
            nodes[k].addEventListener('click', function (ev) {
                var pos = parseInt(ev.currentTarget.getAttribute('data-pos'), 10);
                var idx = weightAt(pos);
                if (idx >= 0) {
                    state.weights.splice(idx, 1);
                    persist();
                    updateAll();
                }
            });
        }
    }

    /* ---------- 物理与动画 ---------- */

    function netTorque() {
        var t = 0;
        for (var i = 0; i < state.weights.length; i++) {
            var w = state.weights[i];
            t += w.f * w.pos;
        }
        return t;
    }

    function sideSums() {
        var left = 0, right = 0;
        for (var i = 0; i < state.weights.length; i++) {
            var w = state.weights[i];
            if (w.pos < 0) { left += w.f * (-w.pos); } else { right += w.f * w.pos; }
        }
        return { left: left, right: right };
    }

    function tick() {
        state.vel += (state.target - state.angle) * 0.085;
        state.vel *= 0.82;
        state.angle += state.vel;
        applyPose();
        if (Math.abs(state.vel) > 0.002 || Math.abs(state.target - state.angle) > 0.01) {
            state.raf = requestAnimationFrame(tick);
        } else {
            state.angle = state.target;
            state.vel = 0;
            applyPose();
            state.raf = 0;
            onSettled();
        }
    }

    function applyPose() {
        els.board.querySelector('#beamG').setAttribute('transform',
            'rotate(' + state.angle.toFixed(2) + ' ' + PIVOT[0] + ' ' + PIVOT[1] + ')');
        var wins = els.board.querySelectorAll('.leverbalance-win');
        for (var i = 0; i < wins.length; i++) {
            wins[i].setAttribute('transform', 'rotate(' + (-state.angle).toFixed(2) + ')');
        }
        var at = els.board.querySelector('#angleText');
        if (at) { at.textContent = Math.abs(state.angle).toFixed(1) + '°'; }
    }

    function onSettled() {
        var balanced = netTorque() === 0 && state.weights.length > 0;
        if (balanced && !state.celebrated) {
            state.celebrated = true;
            if (state.challenge) {
                chrome.beep('win');
                chrome.toast('挑战成功！F₁·L₁ = F₂·L₂ = ' + sideSums().left + ' N·格');
                state.challenge = null;
                chrome.setStatus('挑战成功', 'ok');
            } else {
                chrome.beep('ok');
                chrome.toast('杠杆平衡');
                chrome.setStatus('平衡', 'ok');
            }
        }
        if (!balanced) { state.celebrated = false; }
    }

    function updateAll() {
        var t = netTorque();
        state.target = Math.max(-13, Math.min(13, t * 2.6));
        if (!state.raf) { state.raf = requestAnimationFrame(tick); }

        /* 力矩明细 */
        var sorted = state.weights.slice().sort(function (a, b) { return a.pos - b.pos; });
        var rows = '';
        for (var i = 0; i < sorted.length; i++) {
            var w = sorted[i];
            var left = w.pos < 0;
            rows += '<div class="leverbalance-row ' + (left ? 'is-left' : 'is-right') + '">' +
                '<span>' + w.f.toFixed(1) + 'N × ' + Math.abs(w.pos) + '格</span>' +
                '<span class="lr">' + (left ? 'L' : 'R') + '</span>' +
                '<span>= ' + (w.f * Math.abs(w.pos)).toFixed(1) + ' N·格</span></div>';
        }
        if (!sorted.length) { rows = '<div style="color:var(--et-muted)">尚未挂砝码</div>'; }
        els.torqueList.innerHTML = rows;

        var sums = sideSums();
        els.sums.innerHTML = '<span>左 L₁合计 <b style="color:var(--et-accent)">' + sums.left.toFixed(1) + '</b></span>' +
            '<span>右 L₂合计 <b style="color:var(--et-warn)">' + sums.right.toFixed(1) + '</b></span>';

        var balanced = sums.left === sums.right && state.weights.length > 0;
        els.formula.setAttribute('data-bal', balanced ? '1' : '0');
        if (balanced) {
            els.formula.textContent = '✓ 平衡：F₁·L₁ = F₂·L₂ = ' + sums.left.toFixed(1) + ' N·格';
        } else {
            els.formula.textContent = '平衡条件：F₁·L₁ = F₂·L₂（当前 ' +
                sums.left.toFixed(1) + ' vs ' + sums.right.toFixed(1) + ' N·格）';
        }
        if (!balanced && state.weights.length) {
            chrome.setStatus(t > 0 ? '右倾' : '左倾', 'warn');
        }

        renderWeights();
    }

    function persist() { store.set('weights', state.weights); }

    /* ---------- 砝码选择 ---------- */

    function buildMassBtns() {
        MASSES.forEach(function (m) {
            var b = document.createElement('button');
            b.type = 'button';
            b.className = 'leverbalance-mass';
            b.innerHTML = m.f.toFixed(1) + 'N<small>' + m.g + 'g</small>';
            b.addEventListener('click', function () {
                state.selected = m.f;
                syncMassBtns();
                chrome.beep('tick');
            });
            b.setAttribute('data-f', m.f);
            els.massBtns.appendChild(b);
        });
        syncMassBtns();
    }

    function syncMassBtns() {
        var btns = els.massBtns.children;
        for (var i = 0; i < btns.length; i++) {
            btns[i].classList.toggle('is-on', parseFloat(btns[i].getAttribute('data-f')) === state.selected);
        }
    }

    /* ---------- 挑战 ---------- */

    function challenge() {
        state.weights = [];
        var m = MASSES[Math.floor(Math.random() * MASSES.length)];
        var m2 = MASSES[Math.floor(Math.random() * MASSES.length)];
        var pos1 = 1 + Math.floor(Math.random() * 9);
        state.weights.push({ pos: -pos1, f: m.f });
        if (Math.random() > .45) {
            var pos2 = 1 + Math.floor(Math.random() * 9);
            if (pos2 !== pos1) { state.weights.push({ pos: -pos2, f: m2.f }); }
        }
        state.challenge = true;
        state.celebrated = false;
        persist();
        updateAll();
        chrome.setStatus('挑战中：请在右侧配平', 'run');
        chrome.toast('挑战：在右边挂砝码让杠杆平衡！');
    }

    els.btnChallenge.addEventListener('click', challenge);
    els.btnClear.addEventListener('click', function () {
        state.weights = [];
        state.challenge = null;
        persist();
        updateAll();
        chrome.setStatus('就绪', 'ok');
    });

    document.addEventListener('keydown', function (e) {
        if (e.code === 'Space' && !isTypingTarget(e.target)) {
            e.preventDefault();
            challenge();
        }
    });

    function isTypingTarget(node) {
        if (!node || !node.tagName) { return false; }
        var tag = node.tagName.toUpperCase();
        return tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT' || node.isContentEditable === true;
    }

    /* 恢复上次状态 */
    state.weights = state.weights.filter(function (w) {
        return w && Number.isInteger(w.pos) && w.pos !== 0 && w.pos >= -10 && w.pos <= 10 &&
            MASSES.some(function (m) { return m.f === w.f; });
    });
    buildMassBtns();
    buildBoard();
    updateAll();
})();
</script>

</body>
</html>
