  /* 此块由 scripts/sync_shared.py 自动注入，请勿手工修改 */
/*!
 * et-chrome.css — 工具通用外壳样式（顶栏 / 页脚 / 弹窗 / 按钮 / 主题）
 *
 * 共享样式源。改这里，然后跑：python scripts/sync_shared.py
 * 所有类名带 et- 前缀，避免与工具自身样式冲突。
 * 依赖：无外部资源；颜色全部为令牌变量。
 */

/* ============ 设计令牌 ============ */
:root {
    --et-accent: #2563eb;
    --et-accent-weak: rgba(37, 99, 235, .14);
    --et-bg: #f4f6fb;
    --et-surface: #ffffff;
    --et-surface-2: #f8fafc;
    --et-fg: #0b1220;
    --et-muted: #64748b;
    --et-line: rgba(15, 23, 42, .12);
    --et-line-strong: rgba(15, 23, 42, .22);
    --et-glass: rgba(255, 255, 255, .85);
    --et-shadow-md: 0 10px 28px -18px rgba(15, 23, 42, .3);
    --et-shadow-lg: 0 24px 60px -32px rgba(15, 23, 42, .4);
    --et-ok: #059669;
    --et-warn: #d97706;
    --et-err: #dc2626;
    --et-radius: 12px;
    --et-radius-sm: 9px;
    --et-font: -apple-system, BlinkMacSystemFont, "Segoe UI",
               "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei",
               "Noto Sans SC", sans-serif;
    --et-mono: ui-monospace, "Cascadia Mono", Consolas, Menlo, monospace;
}

html[data-et-theme="dark"] {
    --et-bg: #0b1120;
    --et-surface: #111a2e;
    --et-surface-2: #0f1729;
    --et-fg: #f1f5f9;
    --et-muted: #94a3b8;
    --et-line: rgba(148, 163, 184, .18);
    --et-line-strong: rgba(148, 163, 184, .3);
    --et-glass: rgba(17, 26, 46, .85);
    --et-shadow-md: 0 10px 34px -18px rgba(0, 0, 0, .8);
    --et-shadow-lg: 0 24px 70px -30px rgba(0, 0, 0, .9);
    --et-ok: #34d399;
    --et-warn: #fbbf24;
    --et-err: #f87171;
}

/* ============ 基础 ============ */

/* body 作为外壳时必须清掉浏览器默认 8px 外边距，
   否则 iframe 预览中文档会比视口高 16px（底部白边 + 多余滚动） */
body.et-app {
    margin: 0;
}

.et-app {
    position: relative;
    isolation: isolate;
    display: flex;
    flex-direction: column;
    height: 100vh;
    height: 100dvh;
    overflow: hidden;
    background: var(--et-bg);
    color: var(--et-fg);
    font-family: var(--et-font);
    -webkit-font-smoothing: antialiased;
    transition: background .25s, color .25s;
}

/* 极光背景：径向渐变 + 呼吸动画（edupick 品质基线，老内核也不掉帧） */
.et-app::before {
    content: '';
    position: fixed;
    inset: 0;
    z-index: -1;
    pointer-events: none;
    background:
        radial-gradient(46% 40% at 20% 18%, var(--et-accent-weak), transparent 65%),
        radial-gradient(42% 38% at 82% 24%, var(--et-accent-weak), transparent 70%),
        radial-gradient(50% 44% at 55% 95%, rgba(16, 185, 129, .10), transparent 65%);
    animation: et-aurora 16s ease-in-out infinite alternate;
}

@keyframes et-aurora {
    from { opacity: .55; transform: scale(1); }
    to { opacity: 1; transform: scale(1.06); }
}

.et-app *,
.et-app *::before,
.et-app *::after { box-sizing: border-box; }

[hidden] { display: none !important; }

.et-icon {
    width: 18px;
    height: 18px;
    fill: none;
    stroke: currentColor;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
    flex: none;
}

/* ============ 顶栏 ============ */
.et-topbar {
    flex: none;
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 11px 20px;
    border-bottom: 1px solid var(--et-line);
    background: var(--et-glass);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    z-index: 20;
}

.et-brand {
    display: flex;
    align-items: center;
    gap: 10px;
    min-width: 0;
}

.et-brand__dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: var(--et-accent);
    box-shadow: 0 0 0 4px var(--et-accent-weak);
    flex: none;
}

.et-brand__name {
    font-weight: 800;
    font-size: 15px;
    letter-spacing: -.01em;
    white-space: nowrap;
}

.et-brand__sub {
    font-size: 12.5px;
    color: var(--et-muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.et-status {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 5px 14px;
    border-radius: 999px;
    font-size: 12.5px;
    color: var(--et-muted);
    background: var(--et-surface-2);
    border: 1px solid var(--et-line);
    white-space: nowrap;
    max-width: 42vw;
    overflow: hidden;
    text-overflow: ellipsis;
}

.et-status__dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--et-ok);
    flex: none;
    transition: background .2s;
}

.et-status[data-tone="err"] .et-status__dot { background: var(--et-err); }
.et-status[data-tone="warn"] .et-status__dot { background: var(--et-warn); }

.et-actions {
    display: flex;
    align-items: center;
    gap: 7px;
}

.et-icon-btn {
    display: inline-grid;
    place-items: center;
    width: 38px;
    height: 38px;
    font-size: 16px;
    line-height: 1;
    border-radius: 11px;
    border: 1px solid var(--et-line);
    background: var(--et-surface-2);
    color: var(--et-fg);
    cursor: pointer;
    transition: transform .14s, border-color .14s, color .14s, opacity .14s;
    -webkit-tap-highlight-color: transparent;
}

.et-icon-btn:hover {
    border-color: var(--et-accent);
    color: var(--et-accent);
    transform: translateY(-1px);
}

.et-icon-btn:active { transform: translateY(0); }
.et-icon-btn.is-off { opacity: .4; }
.et-icon-btn:focus-visible { outline: 2px solid var(--et-accent); outline-offset: 2px; }

/* ============ 主区默认 ============ */
.et-main {
    flex: 1;
    min-height: 0;
    position: relative;
    overflow: auto;
}

/* ============ 页脚（品牌回流 L2） ============ */
.et-footer {
    flex: none;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 7px 16px;
    font-size: 12px;
    color: var(--et-muted);
    border-top: 1px solid var(--et-line);
    background: var(--et-glass);
    user-select: none;
    z-index: 20;
}

.et-footer a {
    color: inherit;
    text-decoration: none;
    transition: color .14s;
}

.et-footer a:hover { color: var(--et-accent); }

/* ============ 按钮 ============ */
.et-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
    padding: 9px 16px;
    border-radius: 11px;
    font: inherit;
    font-size: 13.5px;
    font-weight: 700;
    border: 1px solid var(--et-line);
    background: var(--et-surface-2);
    color: var(--et-fg);
    cursor: pointer;
    transition: transform .14s, border-color .14s, color .14s, background .14s, box-shadow .14s;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
}

.et-btn:hover {
    border-color: var(--et-accent);
    color: var(--et-accent);
    transform: translateY(-1px);
}

.et-btn:active { transform: translateY(0); }
.et-btn:focus-visible { outline: 2px solid var(--et-accent); outline-offset: 2px; }
.et-btn:disabled { opacity: .45; cursor: not-allowed; transform: none; }

.et-btn--primary {
    background: var(--et-accent);
    border-color: var(--et-accent);
    color: #fff;
    box-shadow: 0 6px 18px -8px var(--et-accent);
}

.et-btn--primary:hover { color: #fff; filter: brightness(1.08); }
.et-btn--primary:disabled { filter: none; }

.et-btn--danger:hover {
    border-color: var(--et-err);
    color: var(--et-err);
}

.et-btn--lg {
    padding: 13px 26px;
    font-size: 16px;
    border-radius: 14px;
}

/* ============ 弹窗 ============ */
.et-modal {
    position: fixed;
    inset: 0;
    z-index: 100;
    display: grid;
    place-items: center;
    padding: 24px;
    background: rgba(2, 6, 23, .55);
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    animation: et-fade .18s ease;
}

.et-modal__panel {
    width: min(680px, 94vw);
    max-height: 86vh;
    max-height: 86dvh;
    display: flex;
    flex-direction: column;
    background: var(--et-surface);
    border: 1px solid var(--et-line);
    border-radius: 16px;
    box-shadow: var(--et-shadow-lg);
    animation: et-pop .2s cubic-bezier(.34, 1.4, .64, 1);
    overflow: hidden;
}

.et-modal__panel--narrow { width: min(460px, 92vw); }
.et-modal__panel--wide { width: min(900px, 94vw); }

.et-modal__head {
    flex: none;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 16px 20px;
    border-bottom: 1px solid var(--et-line);
    font-weight: 800;
    font-size: 15px;
}

.et-modal__head .et-icon-btn {
    margin-left: auto;
    width: 32px;
    height: 32px;
}

.et-modal__body {
    flex: 1;
    min-height: 0;
    overflow: auto;
    padding: 18px 20px;
}

.et-modal__foot {
    flex: none;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 14px 20px;
    border-top: 1px solid var(--et-line);
    background: var(--et-surface-2);
}

.et-modal__foot .spacer { flex: 1; }

@keyframes et-fade {
    from { opacity: 0; }
}

@keyframes et-pop {
    from { opacity: 0; transform: translateY(14px) scale(.97); }
}

/* ============ 轻提示（toast） ============ */
.et-toast {
    position: fixed;
    left: 50%;
    bottom: 56px;
    transform: translateX(-50%) translateY(10px);
    z-index: 120;
    display: flex;
    align-items: center;
    gap: 9px;
    max-width: min(520px, 88vw);
    padding: 11px 18px;
    border-radius: 12px;
    font-size: 13.5px;
    font-weight: 600;
    color: #fff;
    background: rgba(15, 23, 42, .92);
    border: 1px solid rgba(148, 163, 184, .25);
    box-shadow: var(--et-shadow-lg);
    opacity: 0;
    pointer-events: none;
    transition: opacity .22s, transform .22s;
}

.et-toast.is-show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
}

.et-toast[data-tone="ok"] { background: rgba(5, 150, 105, .95); }
.et-toast[data-tone="err"] { background: rgba(220, 38, 38, .95); }
.et-toast[data-tone="warn"] { background: rgba(217, 119, 6, .95); }

/* ============ 设置抽屉（右上角入口，edupick 交互） ============ */
.et-drawer-backdrop {
    position: fixed;
    inset: 0;
    z-index: 90;
    background: rgba(2, 6, 23, .45);
    backdrop-filter: blur(3px);
    -webkit-backdrop-filter: blur(3px);
    opacity: 0;
    transition: opacity .2s;
}

.et-drawer-backdrop.is-open { opacity: 1; }

.et-drawer {
    position: absolute;
    top: 0;
    right: 0;
    height: 100%;
    width: min(400px, 92vw);
    display: flex;
    flex-direction: column;
    background: var(--et-surface);
    border-left: 1px solid var(--et-line);
    box-shadow: var(--et-shadow-lg);
    transform: translateX(100%);
    transition: transform .22s cubic-bezier(.32, .72, .35, 1);
}

.et-drawer-backdrop.is-open .et-drawer { transform: translateX(0); }

.et-drawer__head {
    flex: none;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 15px 18px;
    border-bottom: 1px solid var(--et-line);
    font-weight: 800;
    font-size: 15px;
    color: var(--et-accent);
}

.et-drawer__head .et-icon-btn {
    margin-left: auto;
    width: 32px;
    height: 32px;
}

.et-drawer__body {
    flex: 1;
    min-height: 0;
    overflow: auto;
    padding: 16px 18px 24px;
}

/* 抽屉内容通用小节（工具复用） */
.et-drawer__body h4 {
    margin: 18px 0 8px;
    font-size: 12px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: .08em;
    color: var(--et-muted);
}

.et-drawer__body h4:first-child { margin-top: 0; }

.et-drawer__row {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
}

.et-drawer__tip {
    margin: 8px 0 0;
    font-size: 12px;
    line-height: 1.8;
    color: var(--et-muted);
}

.et-drawer__tip b { color: var(--et-fg); }

.et-drawer__input {
    flex: 1;
    min-width: 0;
    padding: 9px 12px;
    border: 1px solid var(--et-line-strong);
    border-radius: 9px;
    background: var(--et-surface-2);
    color: var(--et-fg);
    font: inherit;
    font-size: 13.5px;
    transition: border-color .14s, box-shadow .14s;
}

.et-drawer__input:focus {
    outline: none;
    border-color: var(--et-accent);
    box-shadow: 0 0 0 3px var(--et-accent-weak);
}

.et-drawer__switch {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 10px 0;
    border-bottom: 1px dashed var(--et-line);
    font-size: 13.5px;
    font-weight: 600;
    color: var(--et-fg);
    cursor: pointer;
    user-select: none;
}

.et-drawer__switch input {
    width: 17px;
    height: 17px;
    accent-color: var(--et-accent);
    cursor: pointer;
}
</style>

    margin: 0 auto;
    padding: 18px 22px 22px;
}

/* ── 顶部分数与进度条 ── */
.wordflashcard-head {
    display: flex;
    flex-direction: column;
    gap: 10px;
}

.wordflashcard-chips {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 10px;
}

.wordflashcard-chip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 7px 14px;
    border-radius: 999px;
    font-size: 13.5px;
    font-weight: 700;
    color: var(--et-muted);
    background: var(--et-surface-2);
    border: 1px solid var(--et-line);
}

.wordflashcard-chip b { font-size: 15px; color: var(--et-fg); }
.wordflashcard-chip--known b { color: var(--wordflashcard-known); }
.wordflashcard-chip--unknown b { color: var(--wordflashcard-unknown); }

.wordflashcard-progress {
    height: 8px;
    border-radius: 999px;
    overflow: hidden;
    background: var(--et-surface-2);
    border: 1px solid var(--et-line);
}

.wordflashcard-progress > i {
    display: block;
    height: 100%;
    width: 0;
    border-radius: 999px;
    background: linear-gradient(90deg, var(--wordflashcard-accent), var(--wordflashcard-known));
    transition: width .35s ease;
}

/* ── 卡片：CSS 3D 翻面 ── */
.wordflashcard-stage {
    flex: 1;
    min-height: 260px;
    display: flex;
    align-items: center;
    justify-content: center;
    perspective: 1400px;
}

.wordflashcard-card {
    position: relative;
    width: min(760px, 94%);
    height: clamp(230px, 40vh, 340px);
    padding: 0;
    border: none;
    background: none;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
}

.wordflashcard-card:focus-visible {
    outline: 2px solid var(--et-accent);
    outline-offset: 6px;
    border-radius: 24px;
}

.wordflashcard-inner {
    position: relative;
    width: 100%;
    height: 100%;
    transform-style: preserve-3d;
    transition: transform .5s cubic-bezier(.2, .75, .3, 1);
}

.wordflashcard-card.is-flipped .wordflashcard-inner { transform: rotateY(180deg); }

.wordflashcard-face {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    padding: 26px 30px;
    overflow: hidden;
    text-align: center;
    border-radius: 24px;
    border: 1px solid var(--et-line);
    background: var(--et-surface);
    box-shadow: var(--et-shadow-md);
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
}

.wordflashcard-face--front {
    background: linear-gradient(160deg, var(--et-surface-2), var(--et-surface));
}

.wordflashcard-face--back { transform: rotateY(180deg); }

.wordflashcard-tag {
    font-size: 12px;
    font-weight: 800;
    letter-spacing: .1em;
    color: var(--et-muted);
}

.wordflashcard-word {
    font-size: clamp(38px, 8vw, 88px);
    font-weight: 900;
    letter-spacing: -.02em;
    line-height: 1.12;
    color: var(--et-fg);
    word-break: break-word;
}

.wordflashcard-ipa {
    font-size: clamp(19px, 3vw, 29px);
    font-weight: 700;
    color: var(--wordflashcard-accent);
    word-break: break-word;
}

.wordflashcard-mean {
    font-size: clamp(22px, 3.4vw, 34px);
    font-weight: 700;
    line-height: 1.5;
    color: var(--et-fg);
    word-break: break-word;
}

.wordflashcard-card--done .wordflashcard-word { font-size: clamp(30px, 5vw, 52px); }

/* 无 3D 支持时降级：直接淡入淡出切换两面 */
.wordflashcard-card.is-flat .wordflashcard-inner { transform: none; }

.wordflashcard-card.is-flat .wordflashcard-face {
    backface-visibility: visible;
    -webkit-backface-visibility: visible;
    transition: opacity .25s ease;
}

.wordflashcard-card.is-flat .wordflashcard-face--back {
    transform: none;
    opacity: 0;
    pointer-events: none;
}

.wordflashcard-card.is-flat.is-flipped .wordflashcard-face--front { opacity: 0; }
.wordflashcard-card.is-flat.is-flipped .wordflashcard-face--back { opacity: 1; pointer-events: auto; }

/* ── 操作区 ── */
.wordflashcard-actions,
.wordflashcard-subactions {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    justify-content: center;
}

.wordflashcard-actions .et-btn { min-width: 132px; }

@media (max-width: 720px) {
    .wordflashcard-main { padding: 12px; gap: 12px; }
    .wordflashcard-actions .et-btn { min-width: 96px; }
}
</style>

                wrap.querySelectorAll('.etimp-tab').forEach(function (t) { t.classList.remove('is-active'); });
                tab.classList.add('is-active');
                var name = tab.getAttribute('data-tab');
                q('[data-panel="paste"]').hidden = name !== 'paste';
                q('[data-panel="file"]').hidden = name !== 'file';
            });
        });

        /* 文件区 */
        var drop = q('#etimp-drop');
        var fileInput = q('#etimp-file');

        var dropIconHost = drop.querySelector('.et-drop-icon');
        var NS_SVG = 'http://www.w3.org/2000/svg'; /* et-allow-external SVG 命名空间 */
        var dropSvg = document.createElementNS(NS_SVG, 'svg');
        dropSvg.setAttribute('class', 'et-icon');
        var dropUse = document.createElementNS(NS_SVG, 'use');
        dropUse.setAttribute('href', '#i-upload');
        dropSvg.appendChild(dropUse);
        dropIconHost.appendChild(dropSvg);

        drop.addEventListener('click', function () { fileInput.click(); });
        drop.addEventListener('keydown', function (ev) {
            if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); fileInput.click(); }
        });
        ['dragenter', 'dragover'].forEach(function (evName) {
            drop.addEventListener(evName, function (ev) {
                ev.preventDefault();
                drop.classList.add('is-over');
            });
        });
        ['dragleave', 'drop'].forEach(function (evName) {
            drop.addEventListener(evName, function (ev) {
                ev.preventDefault();
                drop.classList.remove('is-over');
            });
        });
        drop.addEventListener('drop', function (ev) {
            var files = ev.dataTransfer && ev.dataTransfer.files;
            if (files && files.length) { readFile(files[0]); }
        });
        fileInput.addEventListener('change', function () {
            if (fileInput.files && fileInput.files.length) { readFile(fileInput.files[0]); }
        });

        function readFile(file) {
            var reader = new FileReader();
            reader.onload = function () {
                var text = decodeBuffer(reader.result);
                var isJson = /\.json$/i.test(file.name) ||
                    (text.charAt(0) !== '\n' && (text.charAt(0) === '['));
                if (isJson) {
                    try {
                        JSON.parse(text.trim()); /* 校验合法性，错误交给 parseText 报 */
                    } catch (err) { /* parseText 会再次报错 */ }
                }
                textEl.value = text;
                /* 切回粘贴页让用户可见内容 */
                wrap.querySelectorAll('.etimp-tab').forEach(function (t) {
                    t.classList.toggle('is-active', t.getAttribute('data-tab') === 'paste');
                });
                q('[data-panel="paste"]').hidden = false;
                q('[data-panel="file"]').hidden = true;
                refresh();
                global.ET.Chrome.toast('已读取 ' + file.name, 'ok');
            };
            reader.onerror = function () {
                global.ET.Chrome.toast('文件读取失败', 'err');
            };
            reader.readAsArrayBuffer(file);
        }

        refresh();
        setTimeout(function () { textEl.focus(); }, 60);

        return modal;
    }

    global.ET = global.ET || {};
    global.ET.Import = { open: open, parseText: parseText, decodeBuffer: decodeBuffer };

<script>
  /* 此块由 scripts/sync_shared.py 自动注入，请勿手工修改 */
/*!
 * et-stats.js — 使用统计模块（模块化，可整体移除）
 *
 * 共享逻辑源。改这里，然后跑：python scripts/sync_shared.py
 * 依赖：无（可脱离 et-util / et-chrome 独立运行）。
 * 全局：ET.Stats
 *
 * ┌────────────────────────────────────────────────────────────────┐
 * │ 说明：本模块只做一件事——工具被打开时向上报端点发一条匿名计数。 │
 * │ · 在线（iframe 内）：宿主页面已服务端计数，本模块不重复上报。   │
 * │ · 离线打开（file:// / 下载单文件 / 离线包）：联网条件具备时，   │
 * │   以 sendBeacon 上报 use_offline 事件（text/plain 免预检）。    │
 * │ · 上报端点 = window.ET_SITE_ORIGIN（由宿主注入或离线包配置）。  │
 * │   未配置端点时本模块完全静默，不发任何请求。                    │
 * │ · **整个 <script> 块可安全删除**：删除后工具其余功能完全正常，  │
 * │   且完全不再发起任何网络请求。                                  │
 * └────────────────────────────────────────────────────────────────┘
 */
(function (global) {
    'use strict';

    var ET = global.ET = global.ET || {};

    var Stats = {
        /** 上报端点来源（站点绝对地址，无协议尾斜杠） */
        endpoint: (typeof global.ET_SITE_ORIGIN === 'string' && /^https?:\/\//.test(global.ET_SITE_ORIGIN))
            ? global.ET_SITE_ORIGIN
            : null,

        _done: {},

        /**
         * 上报一次事件（同一事件同一工具每次页面加载只报一次）。
         * event: 'use_offline' 等；toolId: 工具 id。
         */
        send: function (event, toolId) {
            if (!event || this._done[event + ':' + (toolId || '')]) { return false; }
            if (!this.endpoint) { return false; }
            /* iframe 内由宿主统计，避免双计 */
            try {
                if (global.parent && global.parent !== global) { return false; }
            } catch (err) { return false; }
            /* 断网时挂起，网络恢复自动补报一次 */
            if (global.navigator && global.navigator.onLine === false) {
                var self = this;
                global.addEventListener('online', function () { self.send(event, toolId); }, { once: true });
                return false;
            }

            this._done[event + ':' + (toolId || '')] = true;
            var payload = JSON.stringify({ event: event, tool: toolId || '' });

            try {
                if (global.navigator.sendBeacon) {
                    return global.navigator.sendBeacon(
                        this.endpoint + '/api/track',
                        new Blob([payload], { type: 'text/plain;charset=UTF-8' })
                    );
                }
                global.fetch(this.endpoint + '/api/track', {
                    method: 'POST',
                    body: payload,
                    keepalive: true,
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'text/plain;charset=UTF-8' }
                });
                return true;
            } catch (err) {
                return false;
            }
        }
    };

    ET.Stats = Stats;
})(window);

    function isTypingTarget(node) {

    function countKeys(map) {

        for (var k in map) {

    function idsOf(map) {

        for (var k in map) {

        for (var i = arr.length - 1; i > 0; i--) {

            arr[i] = arr[j];
            arr[j] = t;
        }

            els.ipa.textContent = card.i || '（未填音标）';
            els.mean.textContent = card.m || '（未填释义）';

        applyFlip();
        els.card.classList.toggle('wordflashcard-card--done', !!done || !total);
        els.btnKnow.disabled = !card;
        els.btnAgain.disabled = !card;
        els.btnFlip.disabled = !card;

        if (!total) {
            chrome.setStatus('待导入词表', 'warn');

            chrome.setStatus('全部认识', 'ok');

        }
    }

    function flip() {
        if (!currentCard()) { return; }
        setFlipped(!state.flipped);
        chrome.beep('tick');
        if (state.flipped && state.autoSpeak) { speakCurrent(); }
    }

    function markKnown() {
        if (!currentCard()) { return; }
        var id = currentId();
        state.known[id] = true;
        delete state.unknown[id];
        state.pool.splice(state.cursor, 1);
        if (state.cursor >= state.pool.length) { state.cursor = 0; }
        state.flipped = false;
        render();
        if (!state.pool.length) {

    }

        if (!currentCard()) { return; }
        var id = currentId();
        state.unknown[id] = true;
        state.pool.splice(state.cursor, 1);

    var tts = { supported: false, voice: null };

    function loadVoices() {
        var voices = [];
        try { voices = window.speechSynthesis.getVoices() || []; } catch (e) { voices = []; }
        if (!voices.length) { return; }
        var us = null, gb = null, any = null;
        for (var i = 0; i < voices.length; i++) {
            var lang = String(voices[i].lang || '');
            if (/^en[-_]US/i.test(lang)) { if (!us) { us = voices[i]; } }
            else if (/^en[-_]GB/i.test(lang)) { if (!gb) { gb = voices[i]; } }
            else if (/^en/i.test(lang)) { if (!any) { any = voices[i]; } }
        }

                window.speechSynthesis.addEventListener('voiceschanged', loadVoices);
            } else {
                window.speechSynthesis.onvoiceschanged = loadVoices;

    }

        if (!tts.supported) {
            chrome.toast('当前浏览器不支持朗读', 'warn');

            window.speechSynthesis.cancel();
            var u = new window.SpeechSynthesisUtterance(t);
            u.lang = (tts.voice && tts.voice.lang) ? tts.voice.lang : 'en-US';
            if (tts.voice) { u.voice = tts.voice; }

            chrome.toast('朗读失败', 'err');
        }
    }

        var card = currentCard();

    /* ── 导出 CSV（UTF-8 BOM） ── */

    function csvCell(v) {
        var s = String(v === undefined || v === null ? '' : v);
        if (/[",\n\r]/.test(s)) { return '"' + s.replace(/"/g, '""') + '"'; }
        return s;
    }

    function exportCsv(ids, name) {
        var lines = ['单词,音标,释义'];
        for (var k = 0; k < ids.length; k++) {
            var c = state.cards[ids[k]];
            if (!c) { continue; }
            lines.push(csvCell(c.w) + ',' + csvCell(c.i) + ',' + csvCell(c.m));
        }
        if (lines.length === 1) {
            chrome.toast('没有可导出的数据', 'warn');
            return;
        }
        var text = '\uFEFF' + lines.join('\r\n');
        var blob = new Blob([text], { type: 'text/csv;charset=utf-8' });
        var url = URL.createObjectURL(blob);
        var a = document.createElement('a');
        a.href = url;
        a.download = name + '.csv';
        document.body.appendChild(a);
        a.click();
        setTimeout(function () {
            if (a.parentNode) { a.parentNode.removeChild(a); }
            URL.revokeObjectURL(url);
        }, 120);
        chrome.toast('已导出 ' + (lines.length - 1) + ' 条', 'ok');
    }

    function cardsToText(list) {
        var out = [];
        for (var k = 0; k < list.length; k++) {
            out.push([list[k].w, list[k].i, list[k].m].join(' '));
        }
        return out.join('\n');
    }

    function openImport() {
        if (!ET.Import || typeof ET.Import.open !== 'function') {
            chrome.toast('导入组件不可用', 'err');
            return;
        }
        ET.Import.open({
            toolId: TOOL_ID,
            title: '导入词表',
            fields: [
                { key: 'word', label: '单词', keys: ['单词', 'word', 'Word', '英文'] },
                { key: 'ipa', label: '音标', keys: ['音标', 'ipa', 'IPA', '读音'] },
                { key: 'mean', label: '释义', keys: ['释义', '含义', '中文', 'mean', 'meaning'] }
            ],
            placeholder: '每行一个单词：单词 音标 释义（用空格 / 逗号 / 制表符分隔）\napple /ˈæpəl/ 苹果',
            help: '每行一条，按「单词 / 音标 / 释义」三列填写；支持逗号 / Tab 分隔文本、带表头的 CSV 与 JSON 数组。首列重复的行会自动去重。',
            current: cardsToText(state.cards),
            onConfirm: function (rows) {
                var list = [];
                for (var k = 0; k < rows.length; k++) {
                    list.push({ w: rows[k].word || '', i: rows[k].ipa || '', m: rows[k].mean || '' });
                }
                if (!list.length) { return; }
                setCards(list, '已导入 ' + list.length + ' 个单词');
            }
        });
    }

    /* ── 设置抽屉 ── */

    function buildSettings(body) {
        body.innerHTML =
            '<h4>词表</h4>' +
            '<p class="et-drawer__tip">当前共 <b>' + state.cards.length + '</b> 个单词；已认识 <b>'
                + countKeys(state.known) + '</b> 个，待复习 <b>' + state.pool.length + '</b> 个。</p>' +
            '<div class="et-drawer__row" style="margin-top:10px">' +
                '<button class="et-btn et-btn--primary" id="wfSetImport" type="button">导入词表</button>' +
                '<button class="et-btn" id="wfSetDefault" type="button">恢复默认词表</button>' +
            '</div>' +
            '<h4>按序号快速生成</h4>' +
            '<div class="et-drawer__row">' +
                '<input class="et-drawer__input" id="wfSetPattern" type="text" value="单词{n}" aria-label="单词格式">' +
            '</div>' +
            '<div class="et-drawer__row" style="margin-top:8px">' +
                '<input class="et-drawer__input" id="wfSetCount" type="number" min="1" max="500" value="20" aria-label="生成数量">' +
                '<button class="et-btn" id="wfSetGen" type="button">生成</button>' +
            '</div>' +
            '<p class="et-drawer__tip">用 <b>{n}</b> 作为序号占位符，例如「单词{n}」「Word-{n}」，最多 500 条。</p>' +
            '<h4>复习</h4>' +
            '<label class="et-drawer__switch"><span>随机复习顺序</span>' +
                '<input type="checkbox" id="wfSetRandom"' + (state.order === 'random' ? ' checked' : '') + '></label>' +
            '<label class="et-drawer__switch"><span>翻到正面时自动朗读</span>' +
                '<input type="checkbox" id="wfSetAuto"' + (state.autoSpeak ? ' checked' : '') + '></label>' +
            '<h4>进度与导出</h4>' +
            '<div class="et-drawer__row">' +
                '<button class="et-btn" id="wfSetReset" type="button">清空进度</button>' +
                '<button class="et-btn" id="wfSetExpKnown" type="button">导出已认识</button>' +
                '<button class="et-btn" id="wfSetExpUnknown" type="button">导出不认识</button>' +
            '</div>' +
            '<p class="et-drawer__tip">导出 CSV 含 UTF-8 BOM，可直接用 Excel / WPS 打开。</p>';

        var q = function (id) { return body.querySelector('#' + id); };

        q('wfSetImport').addEventListener('click', openImport);
        q('wfSetDefault').addEventListener('click', function () {
            setCards(DEFAULT_WORDS, '已恢复默认词表');
            buildSettings(body);
        });
        q('wfSetGen').addEventListener('click', function () {
            var pattern = q('wfSetPattern').value || '单词{n}';
            var n = parseInt(q('wfSetCount').value, 10);
            if (!(n > 0)) {
                chrome.toast('请输入生成数量', 'warn');
                return;
            }
            if (n > 500) { n = 500; }
            var list = [];
            for (var k = 1; k <= n; k++) {
                list.push({ w: pattern.split('{n}').join(String(k)), i: '', m: '' });
            }
            setCards(list, '已生成 ' + n + ' 个占位单词');
            buildSettings(body);
        });
        q('wfSetRandom').addEventListener('change', function (e) {
            state.order = e.target.checked ? 'random' : 'seq';
            store.set('order', state.order);
            resetProgress();
            chrome.toast(state.order === 'random' ? '复习顺序：随机' : '复习顺序：顺序');
        });
        q('wfSetAuto').addEventListener('change', function (e) {
            state.autoSpeak = e.target.checked;
            store.set('autoSpeak', state.autoSpeak);
            chrome.toast(state.autoSpeak ? '已开启自动朗读' : '已关闭自动朗读');
        });
        q('wfSetReset').addEventListener('click', function () {
            resetProgress();
            buildSettings(body);
            chrome.toast('进度已清空');
        });
        q('wfSetExpKnown').addEventListener('click', function () {
            exportCsv(idsOf(state.known), '单词卡片-已认识');
        });
        q('wfSetExpUnknown').addEventListener('click', function () {
            exportCsv(idsOf(state.unknown), '单词卡片-不认识');
        });
    }

    /* ── 事件绑定 ── */

    els.card.addEventListener('click', flip);
    els.card.addEventListener('keydown', function (e) {
        if (e.key === 'Enter') {
            e.preventDefault();
            flip();
        }
    });
    els.btnFlip.addEventListener('click', flip);
    els.btnKnow.addEventListener('click', markKnown);
    els.btnAgain.addEventListener('click', markUnknown);
    els.speak.addEventListener('click', speakCurrent);

    document.addEventListener('keydown', function (e) {
        if (isTypingTarget(e.target)) { return; }
        if (document.querySelector('.et-modal, .et-drawer-backdrop')) { return; }

        if (e.code === 'Space' || e.key === ' ') {
            e.preventDefault();
            if (e.target && typeof e.target.blur === 'function') { e.target.blur(); }
            flip();
        } else if (e.key === 'ArrowRight') {
            e.preventDefault();
            markKnown();
        } else if (e.key === 'ArrowLeft') {
            e.preventDefault();
            markUnknown();
        }
    });

    /* ── 初始化 ── */

    var saved = store.get('cards', null);
    state.cards = (saved && saved.length) ? cloneCards(saved) : cloneCards(DEFAULT_WORDS);
    state.order = store.get('order', 'seq') === 'random' ? 'random' : 'seq';
    state.autoSpeak = store.get('autoSpeak', false) === true;

    try {
        if (!(window.CSS && window.CSS.supports
            && window.CSS.supports('transform-style', 'preserve-3d'))) {
            els.card.classList.add('is-flat');
        }
    } catch (e) { /* 保持 3D 效果 */ }

    initTts();
    resetProgress();
})();
</script>

</body>
</html>
