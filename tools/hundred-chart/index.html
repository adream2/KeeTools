/* ============ 设计令牌 ============ */
:root {
    --et-accent: #2563eb;
    --et-accent-weak: rgba(37, 99, 235, .14);
    --et-bg: #f4f6fb;
    --et-surface: #ffffff;
    --et-surface-2: #f8fafc;
    --et-fg: #0b1220;
    --et-muted: #64748b;
    --et-line: rgba(15, 23, 42, .12);
    --et-line-strong: rgba(15, 23, 42, .22);
    --et-glass: rgba(255, 255, 255, .85);
    --et-shadow-md: 0 10px 28px -18px rgba(15, 23, 42, .3);
    --et-shadow-lg: 0 24px 60px -32px rgba(15, 23, 42, .4);
    --et-ok: #059669;
    --et-warn: #d97706;
    --et-err: #dc2626;
    --et-radius: 12px;
    --et-radius-sm: 9px;
    --et-font: -apple-system, BlinkMacSystemFont, "Segoe UI",
               "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei",
               "Noto Sans SC", sans-serif;
    --et-mono: ui-monospace, "Cascadia Mono", Consolas, Menlo, monospace;
}

html[data-et-theme="dark"] {
    --et-bg: #0b1120;
    --et-surface: #111a2e;
    --et-surface-2: #0f1729;
    --et-fg: #f1f5f9;
    --et-muted: #94a3b8;
    --et-line: rgba(148, 163, 184, .18);
    --et-line-strong: rgba(148, 163, 184, .3);
    --et-glass: rgba(17, 26, 46, .85);
    --et-shadow-md: 0 10px 34px -18px rgba(0, 0, 0, .8);
    --et-shadow-lg: 0 24px 70px -30px rgba(0, 0, 0, .9);
    --et-ok: #34d399;
    --et-warn: #fbbf24;
    --et-err: #f87171;
}

/* ============ 基础 ============ */

/* body 作为外壳时必须清掉浏览器默认 8px 外边距，
   否则 iframe 预览中文档会比视口高 16px（底部白边 + 多余滚动） */
body.et-app {
    margin: 0;
}

.et-app {
    position: relative;
    isolation: isolate;
    display: flex;
    flex-direction: column;
    height: 100vh;
    height: 100dvh;
    overflow: hidden;
    background: var(--et-bg);
    color: var(--et-fg);
    font-family: var(--et-font);
    -webkit-font-smoothing: antialiased;
    transition: background .25s, color .25s;
}

/* 极光背景：径向渐变 + 呼吸动画（edupick 品质基线，老内核也不掉帧） */
.et-app::before {
    content: '';
    position: fixed;
    inset: 0;
    z-index: -1;
    pointer-events: none;
    background:
        radial-gradient(46% 40% at 20% 18%, var(--et-accent-weak), transparent 65%),
        radial-gradient(42% 38% at 82% 24%, var(--et-accent-weak), transparent 70%),
        radial-gradient(50% 44% at 55% 95%, rgba(16, 185, 129, .10), transparent 65%);
    animation: et-aurora 16s ease-in-out infinite alternate;
}

@keyframes et-aurora {
    from { opacity: .55; transform: scale(1); }
    to { opacity: 1; transform: scale(1.06); }
}

.et-app *,
.et-app *::before,
.et-app *::after { box-sizing: border-box; }

[hidden] { display: none !important; }

.et-icon {
    width: 18px;
    height: 18px;
    fill: none;
    stroke: currentColor;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
    flex: none;
}

/* ============ 顶栏 ============ */
.et-topbar {
    flex: none;
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 11px 20px;
    border-bottom: 1px solid var(--et-line);
    background: var(--et-glass);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    z-index: 20;
}

.et-brand {
    display: flex;
    align-items: center;
    gap: 10px;
    min-width: 0;
}

.et-brand__dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: var(--et-accent);
    box-shadow: 0 0 0 4px var(--et-accent-weak);
    flex: none;
}

.et-brand__name {
    font-weight: 800;
    font-size: 15px;
    letter-spacing: -.01em;
    white-space: nowrap;
}

.et-brand__sub {
    font-size: 12.5px;
    color: var(--et-muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.et-status {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 5px 14px;
    border-radius: 999px;
    font-size: 12.5px;
    color: var(--et-muted);
    background: var(--et-surface-2);
    border: 1px solid var(--et-line);
    white-space: nowrap;
    max-width: 42vw;
    overflow: hidden;
    text-overflow: ellipsis;
}

.et-status__dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--et-ok);
    flex: none;
    transition: background .2s;
}

.et-status[data-tone="err"] .et-status__dot { background: var(--et-err); }
.et-status[data-tone="warn"] .et-status__dot { background: var(--et-warn); }

.et-actions {
    display: flex;
    align-items: center;
    gap: 7px;
}

.et-icon-btn {
    display: inline-grid;
    place-items: center;
    width: 38px;
    height: 38px;
    font-size: 16px;
    line-height: 1;
    border-radius: 11px;
    border: 1px solid var(--et-line);
    background: var(--et-surface-2);
    color: var(--et-fg);
    cursor: pointer;
    transition: transform .14s, border-color .14s, color .14s, opacity .14s;
    -webkit-tap-highlight-color: transparent;
}

.et-icon-btn:hover {
    border-color: var(--et-accent);
    color: var(--et-accent);
    transform: translateY(-1px);
}

.et-icon-btn:active { transform: translateY(0); }
.et-icon-btn.is-off { opacity: .4; }
.et-icon-btn:focus-visible { outline: 2px solid var(--et-accent); outline-offset: 2px; }

/* ============ 主区默认 ============ */
.et-main {
    flex: 1;
    min-height: 0;
    position: relative;
    overflow: auto;
}

/* ============ 页脚（品牌回流 L2） ============ */
.et-footer {
    flex: none;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 7px 16px;
    font-size: 12px;
    color: var(--et-muted);
    border-top: 1px solid var(--et-line);
    background: var(--et-glass);
    user-select: none;
    z-index: 20;
}

.et-footer a {
    color: inherit;
    text-decoration: none;
    transition: color .14s;
}

.et-footer a:hover { color: var(--et-accent); }

/* ============ 按钮 ============ */
.et-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
    padding: 9px 16px;
    border-radius: 11px;
    font: inherit;
    font-size: 13.5px;
    font-weight: 700;
    border: 1px solid var(--et-line);
    background: var(--et-surface-2);
    color: var(--et-fg);
    cursor: pointer;
    transition: transform .14s, border-color .14s, color .14s, background .14s, box-shadow .14s;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
}

.et-btn:hover {
    border-color: var(--et-accent);
    color: var(--et-accent);
    transform: translateY(-1px);
}

.et-btn:active { transform: translateY(0); }
.et-btn:focus-visible { outline: 2px solid var(--et-accent); outline-offset: 2px; }
.et-btn:disabled { opacity: .45; cursor: not-allowed; transform: none; }

.et-btn--primary {
    background: var(--et-accent);
    border-color: var(--et-accent);
    color: #fff;
    box-shadow: 0 6px 18px -8px var(--et-accent);
}

.et-btn--primary:hover { color: #fff; filter: brightness(1.08); }
.et-btn--primary:disabled { filter: none; }

.et-btn--danger:hover {
    border-color: var(--et-err);
    color: var(--et-err);
}

.et-btn--lg {
    padding: 13px 26px;
    font-size: 16px;
    border-radius: 14px;
}

/* ============ 弹窗 ============ */
.et-modal {
    position: fixed;
    inset: 0;
    z-index: 100;
    display: grid;
    place-items: center;
    padding: 24px;
    background: rgba(2, 6, 23, .55);
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    animation: et-fade .18s ease;
}

.et-modal__panel {
    width: min(680px, 94vw);
    max-height: 86vh;
    max-height: 86dvh;
    display: flex;
    flex-direction: column;
    background: var(--et-surface);
    border: 1px solid var(--et-line);
    border-radius: 16px;
    box-shadow: var(--et-shadow-lg);
    animation: et-pop .2s cubic-bezier(.34, 1.4, .64, 1);
    overflow: hidden;
}

.et-modal__panel--narrow { width: min(460px, 92vw); }
.et-modal__panel--wide { width: min(900px, 94vw); }

.et-modal__head {
    flex: none;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 16px 20px;
    border-bottom: 1px solid var(--et-line);
    font-weight: 800;
    font-size: 15px;
}

.et-modal__head .et-icon-btn {
    margin-left: auto;
    width: 32px;
    height: 32px;
}

.et-modal__body {
    flex: 1;
    min-height: 0;
    overflow: auto;
    padding: 18px 20px;
}

.et-modal__foot {
    flex: none;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 14px 20px;
    border-top: 1px solid var(--et-line);
    background: var(--et-surface-2);
}

.et-modal__foot .spacer { flex: 1; }

@keyframes et-fade {
    from { opacity: 0; }
}

@keyframes et-pop {
    from { opacity: 0; transform: translateY(14px) scale(.97); }
}

/* ============ 轻提示（toast） ============ */
.et-toast {
    position: fixed;
    left: 50%;
    bottom: 56px;
    transform: translateX(-50%) translateY(10px);
    z-index: 120;
    display: flex;
    align-items: center;
    gap: 9px;
    max-width: min(520px, 88vw);
    padding: 11px 18px;
    border-radius: 12px;
    font-size: 13.5px;
    font-weight: 600;
    color: #fff;
    background: rgba(15, 23, 42, .92);
    border: 1px solid rgba(148, 163, 184, .25);
    box-shadow: var(--et-shadow-lg);
    opacity: 0;
    pointer-events: none;
    transition: opacity .22s, transform .22s;
}

.et-toast.is-show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
}

.et-toast[data-tone="ok"] { background: rgba(5, 150, 105, .95); }
.et-toast[data-tone="err"] { background: rgba(220, 38, 38, .95); }
.et-toast[data-tone="warn"] { background: rgba(217, 119, 6, .95); }

/* ============ 设置抽屉（右上角入口，edupick 交互） ============ */
.et-drawer-backdrop {
    position: fixed;
    inset: 0;
    z-index: 90;
    background: rgba(2, 6, 23, .45);
    backdrop-filter: blur(3px);
    -webkit-backdrop-filter: blur(3px);
    opacity: 0;
    transition: opacity .2s;
}

.et-drawer-backdrop.is-open { opacity: 1; }

.et-drawer {
    position: absolute;
    top: 0;
    right: 0;
    height: 100%;
    width: min(400px, 92vw);
    display: flex;
    flex-direction: column;
    background: var(--et-surface);
    border-left: 1px solid var(--et-line);
    box-shadow: var(--et-shadow-lg);
    transform: translateX(100%);
    transition: transform .22s cubic-bezier(.32, .72, .35, 1);
}

.et-drawer-backdrop.is-open .et-drawer { transform: translateX(0); }

.et-drawer__head {
    flex: none;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 15px 18px;
    border-bottom: 1px solid var(--et-line);
    font-weight: 800;
    font-size: 15px;
    color: var(--et-accent);
}

.et-drawer__head .et-icon-btn {
    margin-left: auto;
    width: 32px;
    height: 32px;
}

.et-drawer__body {
    flex: 1;
    min-height: 0;
    overflow: auto;
    padding: 16px 18px 24px;
}

/* 抽屉内容通用小节（工具复用） */
.et-drawer__body h4 {
    margin: 18px 0 8px;
    font-size: 12px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: .08em;
    color: var(--et-muted);
}

.et-drawer__body h4:first-child { margin-top: 0; }

.et-drawer__row {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
}

.et-drawer__tip {
    margin: 8px 0 0;
    font-size: 12px;
    line-height: 1.8;
    color: var(--et-muted);
}

.et-drawer__tip b { color: var(--et-fg); }

.et-drawer__input {
    flex: 1;
    min-width: 0;
    padding: 9px 12px;
    border: 1px solid var(--et-line-strong);
    border-radius: 9px;
    background: var(--et-surface-2);
    color: var(--et-fg);
    font: inherit;
    font-size: 13.5px;
    transition: border-color .14s, box-shadow .14s;
}

.et-drawer__input:focus {
    outline: none;
    border-color: var(--et-accent);
    box-shadow: 0 0 0 3px var(--et-accent-weak);
}

.et-drawer__switch {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 10px 0;
    border-bottom: 1px dashed var(--et-line);
    font-size: 13.5px;
    font-weight: 600;
    color: var(--et-fg);
    cursor: pointer;
    user-select: none;
}

.et-drawer__switch input {
    width: 17px;
    height: 17px;
    accent-color: var(--et-accent);
    cursor: pointer;
}
</style>

    function openDrawer(title, build) {
        var backdrop = el('div', 'et-drawer-backdrop');
        var drawer = el('aside', 'et-drawer');
        drawer.setAttribute('role', 'dialog');
        drawer.setAttribute('aria-label', title);

        var head = el('div', 'et-drawer__head');
        head.appendChild(makeIcon('i-sliders'));
        head.appendChild(el('span', 'et-drawer__title', title));
        head.appendChild(makeBtn('i-x', '关闭', close));
        drawer.appendChild(head);

        var body = el('div', 'et-drawer__body');
        drawer.appendChild(body);

        backdrop.appendChild(drawer);
        document.body.appendChild(backdrop);
        requestAnimationFrame(function () { backdrop.classList.add('is-open'); });

        function close() {
            backdrop.classList.remove('is-open');
            document.removeEventListener('keydown', onKey);
            setTimeout(function () {
                if (backdrop.parentNode) { backdrop.parentNode.removeChild(backdrop); }
            }, 220);
        }
        function onKey(ev) {
            if (ev.key === 'Escape') { ev.stopPropagation(); close(); }
        }
        document.addEventListener('keydown', onKey);
        backdrop.addEventListener('mousedown', function (ev) {
            if (ev.target === backdrop) { close(); }
        });

        if (typeof build === 'function') {
            /* 兼容两种约定：build 自己往 body 里塞内容，或 return 一个元素节点 */
            var ret = build(body, { close: close });
            if (ret && ret.nodeType === 1 && ret.parentNode !== body) {
                body.appendChild(ret);
            }
        }
        return { body: body, close: close };
    }

    /* ---------- 通用弹窗 / toast（同时挂模块级，供其他共享组件使用） ---------- */

    function modal(mo) {
        var backdrop = el('div', 'et-modal');
        var panel = el('div', 'et-modal__panel' + (mo.size === 'narrow' ? ' et-modal__panel--narrow'
            : mo.size === 'wide' ? ' et-modal__panel--wide' : ''));
        var head = el('div', 'et-modal__head');
        if (mo.icon) { head.appendChild(makeIcon(mo.icon)); }
        head.appendChild(el('span', null, mo.title || ''));
        head.appendChild(makeBtn('i-x', '关闭', close));
        panel.appendChild(head);

        var body = el('div', 'et-modal__body');
        if (typeof mo.body === 'string') { body.innerHTML = mo.body; }
        else if (mo.body) { body.appendChild(mo.body); }
        panel.appendChild(body);

        var foot = null;
        if (mo.buttons && mo.buttons.length) {
            foot = el('div', 'et-modal__foot');
            foot.appendChild(el('span', 'spacer'));
            mo.buttons.forEach(function (b) {
                var btn = el('button', 'et-btn' + (b.primary ? ' et-btn--primary' : '') + (b.danger ? ' et-btn--danger' : ''), b.label);
                btn.type = 'button';
                btn.addEventListener('click', function () {
                    if (b.onClick) { b.onClick(close); } else { close(); }
                });
                foot.appendChild(btn);
            });
            panel.appendChild(foot);
        }

        backdrop.appendChild(panel);
        document.body.appendChild(backdrop);

        function close() {
            if (backdrop.parentNode) { backdrop.parentNode.removeChild(backdrop); }
            document.removeEventListener('keydown', onKey);
            if (mo.onClose) { mo.onClose(); }
        }
        function onKey(ev) {
            if (ev.key === 'Escape') { ev.stopPropagation(); close(); }
        }
        document.addEventListener('keydown', onKey);
        backdrop.addEventListener('mousedown', function (ev) {
            if (ev.target === backdrop) { close(); }
        });

        return { panel: panel, body: body, foot: foot, close: close };

    var toastEl = null;
    var toastTimer = 0;

    function toast(msg, tone) {
        if (!toastEl) {
            toastEl = el('div', 'et-toast');
            document.body.appendChild(toastEl);
        }
        toastEl.textContent = msg;
        toastEl.setAttribute('data-tone', tone || '');
        void toastEl.offsetWidth;
        toastEl.classList.add('is-show');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(function () { toastEl.classList.remove('is-show'); }, 2200);
    }

    /* ---------- PWA 元数据（blob manifest，环境不支持时静默跳过） ---------- */

    function installPwa(toolId, title, accent) {
        try {
            var theme = document.querySelector('meta[name="theme-color"]');
            if (!theme) {
                theme = document.createElement('meta');
                theme.setAttribute('name', 'theme-color');
                document.head.appendChild(theme);
            }
            theme.setAttribute('content', accent || '#2563eb');

            var svg = '<svg xmlns="' + NS_SVG + '" viewBox="0 0 64 64">' +
                '<rect width="64" height="64" rx="14" fill="' + (accent || '#2563eb') + '"/>' +
                '<text x="32" y="43" font-size="32" font-weight="800" font-family="sans-serif" ' +
                'fill="#fff" text-anchor="middle">' + (title || '课').charAt(0) + '</text></svg>';
            var iconUri = 'data:image/svg+xml,' + encodeURIComponent(svg);

            var mf = {
                name: title || 'KeeTools 课工具',
                short_name: title || '课工具',
                start_url: '.',
                display: 'standalone',
                background_color: '#f4f6fb',
                theme_color: accent || '#2563eb',
                icons: [{ src: iconUri, sizes: 'any', type: 'image/svg+xml', purpose: 'any' }]
            };
            var blob = new Blob([JSON.stringify(mf)], { type: 'application/manifest+json' });
            var link = document.createElement('link');
            link.rel = 'manifest';
            link.href = URL.createObjectURL(blob);

        var fsBtn = makeBtn('i-maximize', '全屏', toggleFullscreen);

            soundBtn.title = soundEnabled ? '关闭音效' : '开启音效';

                if (req) { try { req.call(root); } catch (err) { /* 忽略 */ } }

        }

        }

        document.addEventListener('fullscreenchange', function () {
            syncFsIcon(!!(document.fullscreenElement || document.webkitFullscreenElement));
        });
        document.addEventListener('webkitfullscreenchange', function () {
            syncFsIcon(!!(document.fullscreenElement || document.webkitFullscreenElement));
        });
        syncFsIcon(false);

        api.toggleFullscreen = toggleFullscreen;

        /* ---------- 音效 API ---------- */
        api.beep = function (kind) {
            if (!soundEnabled) { return; }

        };
        api.soundOn = function () { return soundEnabled; };

        api.modal = modal;

        /* ---------- 帮助 ---------- */
        function openHelp() {

                buttons: [{ label: '知道了', primary: true }]
            });
        }
        api.openHelp = openHelp;

        /* ---------- toast ---------- */
        api.toast = toast;

        /* ---------- 页脚（L2 品牌回流，低调一行） ---------- */
        var siteOrigin = typeof global.ET_SITE_ORIGIN === 'string' && /^https?:\/\//.test(global.ET_SITE_ORIGIN)
            ? global.ET_SITE_ORIGIN
            : null;

        function renderFooter() {
            footer.textContent = '';
            footer.appendChild(el('span', null, 'KeeTools 课工具'));
            footer.appendChild(el('span', null, '·'));
            if (siteOrigin) {
                var a = el('a', null, '更多课堂工具');
                a.href = siteOrigin + '/?from=tool-footer&tool=' + encodeURIComponent(toolId);
                a.target = '_blank';
                a.rel = 'noopener';
                footer.appendChild(a);
            } else {
                footer.appendChild(el('span', null, '更多课堂工具'));
            }
        }
        renderFooter();

        /* 站点来源发现：iframe 内向父窗口询问；也可由宿主直接注入 ET_SITE_ORIGIN */
        try {
            if (global.parent && global.parent !== global) {

            if (data.type === 'et-origin' && typeof data.origin === 'string' && /^https?:\/\//.test(data.origin)) {
                siteOrigin = data.origin;
                if (!global.ET_SITE_ORIGIN) { global.ET_SITE_ORIGIN = data.origin; }

        if (typeof opt.primary === 'function') {

                if (document.querySelector('.et-modal, .et-drawer-backdrop, .ws-winner')) { return; }
                ev.preventDefault();

                else if (typeof opt.secondary === 'function') { opt.secondary(); }
                else { opt.primary(); }
            });

<script>
  /* 此块由 scripts/sync_shared.py 自动注入，请勿手工修改 */
/*!
 * et-stats.js — 使用统计模块（模块化，可整体移除）
 *
 * 共享逻辑源。改这里，然后跑：python scripts/sync_shared.py
 * 依赖：无（可脱离 et-util / et-chrome 独立运行）。
 * 全局：ET.Stats
 *
 * ┌────────────────────────────────────────────────────────────────┐
 * │ 说明：本模块只做一件事——工具被打开时向上报端点发一条匿名计数。 │
 * │ · 在线（iframe 内）：宿主页面已服务端计数，本模块不重复上报。   │
 * │ · 离线打开（file:// / 下载单文件 / 离线包）：联网条件具备时，   │
 * │   以 sendBeacon 上报 use_offline 事件（text/plain 免预检）。    │
 * │ · 上报端点 = window.ET_SITE_ORIGIN（由宿主注入或离线包配置）。  │
 * │   未配置端点时本模块完全静默，不发任何请求。                    │
 * │ · **整个 <script> 块可安全删除**：删除后工具其余功能完全正常，  │
 * │   且完全不再发起任何网络请求。                                  │
 * └────────────────────────────────────────────────────────────────┘
 */
(function (global) {
    'use strict';

    var ET = global.ET = global.ET || {};

    var Stats = {
        /** 上报端点来源（站点绝对地址，无协议尾斜杠） */
        endpoint: (typeof global.ET_SITE_ORIGIN === 'string' && /^https?:\/\//.test(global.ET_SITE_ORIGIN))
            ? global.ET_SITE_ORIGIN
            : null,

        _done: {},

        /**
         * 上报一次事件（同一事件同一工具每次页面加载只报一次）。
         * event: 'use_offline' 等；toolId: 工具 id。
         */
        send: function (event, toolId) {
            if (!event || this._done[event + ':' + (toolId || '')]) { return false; }
            if (!this.endpoint) { return false; }
            /* iframe 内由宿主统计，避免双计 */
            try {
                if (global.parent && global.parent !== global) { return false; }
            } catch (err) { return false; }
            /* 断网时挂起，网络恢复自动补报一次 */
            if (global.navigator && global.navigator.onLine === false) {
                var self = this;
                global.addEventListener('online', function () { self.send(event, toolId); }, { once: true });
                return false;
            }

            this._done[event + ':' + (toolId || '')] = true;
            var payload = JSON.stringify({ event: event, tool: toolId || '' });

            try {
                if (global.navigator.sendBeacon) {
                    return global.navigator.sendBeacon(
                        this.endpoint + '/api/track',
                        new Blob([payload], { type: 'text/plain;charset=UTF-8' })
                    );
                }
                global.fetch(this.endpoint + '/api/track', {
                    method: 'POST',
                    body: payload,
                    keepalive: true,
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'text/plain;charset=UTF-8' }
                });
                return true;
            } catch (err) {
                return false;
            }
        }
    };

    ET.Stats = Stats;
})(window);
</script>

            }
        }
        if (TOOLS.indexOf(s.tool) < 0) { s.tool = DEFAULTS.tool; }
        if (MASK_STYLES.indexOf(s.maskStyle) < 0) { s.maskStyle = DEFAULTS.maskStyle; }
        s.cols = pickOpt(s.cols, COLS_OPTS, DEFAULTS.cols);
        s.max = pickOpt(s.max, MAX_OPTS, DEFAULTS.max);
        s.holes = clampInt(s.holes, 3, 60, DEFAULTS.holes);
        s.step = [0, 2, 3, 5, 10].indexOf(parseInt(s.step, 10)) >= 0 ? parseInt(s.step, 10) : 0;
        s.title = typeof s.title === 'string' ? s.title : DEFAULTS.title;
        return s;
    }

    function loadMasked() {
        var raw = store.get('masked', []);
        var out = {};
        if (!Array.isArray(raw)) { return out; }
        for (var i = 0; i < raw.length; i++) {
            var n = parseInt(raw[i], 10);
            if (n >= 1 && n <= 100) { out[n] = true; }
        }
        return out;
    }

    function maskedList() {
        var out = [];
        for (var k in masked) {
            if (Object.prototype.hasOwnProperty.call(masked, k)) { out.push(parseInt(k, 10)); }
        }
        out.sort(function (a, b) { return a - b; });
        return out;
    }

    function persist() {
        for (var k in DEFAULTS) {
            if (Object.prototype.hasOwnProperty.call(DEFAULTS, k)) {
                store.set(k, state[k]);
            }
        }
        store.set('masked', maskedList());
        store.set('probe', probe);
    }

    function isTypingTarget(node) {
        if (!node || !node.tagName) { return false; }
        var tag = node.tagName.toUpperCase();
        return tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT' || node.isContentEditable === true;
    }

    function text(tag, cls, value) {
        var node = document.createElement(tag);
        if (cls) { node.className = cls; }
        if (value !== undefined && value !== null) { node.textContent = value; }
        return node;
    }

    /* ---------- 规律计算 ---------- */

    function rowsCount() { return Math.ceil(state.max / state.cols); }

    /** 相邻数：左右 ±1（不跨行）+ 上下 ±cols */
    function neighborsOf(n) {
        var out = [];
        if (n % state.cols !== 1) { out.push(n - 1); }
        if (n % state.cols !== 0 && n + 1 <= state.max) { out.push(n + 1); }
        if (n - state.cols >= 1) { out.push(n - state.cols); }
        if (n + state.cols <= state.max) { out.push(n + state.cols); }
        return out;
    }

    function relLabel(delta) {
        return (delta > 0 ? '+' : '−') + Math.abs(delta);
    }

    /* ---------- 渲染 ---------- */

    function render() {
        els.preview.innerHTML = '';
        els.preview.appendChild(buildPage());
        updateStat();
        syncToolSeg();
        els.stepSel.value = String(state.step);
    }

    function buildPage() {
        var page = text('section', 'hc-page');

        // 标题行（可关）
        page.appendChild(text('div', 'hc-title', state.title || '百 数 表'));

        if (state.showMeta) {
            var meta = text('div', 'hc-meta');
            meta.appendChild(text('span', null, '姓名：____________'));
            meta.appendChild(text('span', null, '班级：__________'));
            meta.appendChild(text('span', null, '日期：__________'));
            meta.appendChild(text('span', null, hintLabel()));
            page.appendChild(meta);
        }

        var grid = text('div', 'hc-grid');
        grid.style.setProperty('--hc-cols', String(state.cols));
        grid.style.setProperty('--hc-rows', String(rowsCount()));

        var relMap = {};
        if (state.tool === 'probe' && probe >= 1 && probe <= state.max) {
            var ns = neighborsOf(probe);
            for (var r = 0; r < ns.length; r++) { relMap[ns[r]] = ns[r] - probe; }
        }

        var frag = document.createDocumentFragment();
        for (var n = 1; n <= state.max; n++) {
            var cell = text('div', 'hc-cell', String(n));
            cell.setAttribute('data-n', String(n));

            if (state.step > 0 && n % state.step === 0) { cell.className += ' is-step'; }
            if (masked[n]) {
                cell.className += ' is-masked';
                if (state.maskStyle === 'hollow') { cell.className += ' is-hollow'; }
                else if (state.maskStyle === 'question') { cell.className += ' is-question'; }
            }
            if (relMap[n] !== undefined) {
                cell.className += ' is-rel';
                cell.textContent = '';
                cell.appendChild(text('span', null, String(n)));
                cell.appendChild(text('span', 'hc-rel', relLabel(relMap[n])));
            }
            if (probe === n && state.tool === 'probe') { cell.className += ' is-probe'; }

            frag.appendChild(cell);
        }
        grid.appendChild(frag);
        page.appendChild(grid);

        var foot = text('div', 'hc-foot');
        foot.appendChild(text('span', null, footLeft()));
        foot.appendChild(text('span', null, footRight()));
        page.appendChild(foot);

        return page;
    }

    function hintLabel() {
        if (state.tool === 'probe') { return '相邻数探针'; }
        if (state.step > 0) { return state.step + ' 个一数'; }
        return '百数表';
    }

    function footLeft() {
        if (state.tool === 'probe' && probe >= 1) {
            var ns = neighborsOf(probe);
            var parts = [];
            for (var i = 0; i < ns.length; i++) {
                parts.push(ns[i] + '(' + relLabel(ns[i] - probe) + ')');
            }
            return '选中 ' + probe + '：' + parts.join('  ') + '　左右相差 1，上下相差 ' + state.cols;
        }
        if (state.step > 0) {
            return state.step + ' 个一数：' + stepSample();
        }
        return '点格子可遮住 / 揭开；切到「相邻数探针」再点格子看规律';
    }

    function stepSample() {
        var out = [];
        for (var n = state.step; n <= state.max && out.length < 10; n += state.step) {
            out.push(n);
        }
        return out.join(' → ') + (state.step * 10 <= state.max ? ' → …' : '');
    }

    function footRight() {
        var m = maskedList().length;
        return '1 – ' + state.max + ' · 每行 ' + state.cols + ' 格' +
            (m ? ' · 已遮 ' + m + ' 格' : '');
    }

    function updateStat() {
        els.stat.textContent = '1 – ' + state.max + ' · 每行 ' + state.cols +
            ' 格' + (maskedList().length ? ' · 已遮 ' + maskedList().length + ' 格' : '');
        chrome.setStatus(state.tool === 'probe' ? '相邻数探针' : '遮罩提问', 'ok');
    }

    function syncToolSeg() {
        var btns = els.toolSeg.getElementsByTagName('button');
        for (var i = 0; i < btns.length; i++) {
            btns[i].className = btns[i].getAttribute('data-tool') === state.tool ? 'is-on' : '';
        }
    }

    /* ---------- 交互 ---------- */

    function onCellClick(n) {
        if (state.tool === 'probe') {
            probe = (probe === n) ? 0 : n;
            persist();
            render();
            return;
        }
        if (masked[n]) { delete masked[n]; } else { masked[n] = true; }
        persist();
        var cell = els.preview.querySelector('.hc-cell[data-n="' + n + '"]');
        if (cell) {
            cell.className = 'hc-cell' +
                (state.step > 0 && n % state.step === 0 ? ' is-step' : '') +
                (masked[n] ? ' is-masked' + maskStyleClass() : '');
        }
        updateStat();
        footRefresh();
    }

    function maskStyleClass() {
        if (state.maskStyle === 'hollow') { return ' is-hollow'; }
        if (state.maskStyle === 'question') { return ' is-question'; }
        return '';
    }

    function footRefresh() {
        var foot = els.preview.querySelector('.hc-foot');
        if (!foot) { return; }
        foot.innerHTML = '';
        foot.appendChild(text('span', null, footLeft()));
        foot.appendChild(text('span', null, footRight()));
    }

    function setTool(tool) {
        if (TOOLS.indexOf(tool) < 0 || tool === state.tool) { return; }
        state.tool = tool;
        persist();
        render();
    }

    function randomHoles() {
        var pool = [];
        for (var n = 1; n <= state.max; n++) { pool.push(n); }
        for (var i = pool.length - 1; i > 0; i--) {
            var j = Math.floor(Math.random() * (i + 1));
            var t = pool[i]; pool[i] = pool[j]; pool[j] = t;
        }
        var want = Math.min(state.holes, pool.length);
        masked = {};
        for (var k = 0; k < want; k++) { masked[pool[k]] = true; }
        probe = 0;
        persist();
        render();
        try { chrome.beep('ok'); } catch (e) { /* 静默 */ }
        chrome.toast('已随机盖住 ' + want + ' 个格子，问：被盖住的是几？', 'ok');
    }

    function revealAll() {
        if (!maskedList().length && !probe) { chrome.toast('本来就没有遮住任何格子'); return; }
        masked = {};
        probe = 0;
        persist();
        render();
        chrome.toast('已全部揭开');
    }

    function exportAnswer() {
        var lines = ['数字,是否被遮住,是否' + state.step + '的倍数'];
        for (var n = 1; n <= state.max; n++) {
            lines.push([n, masked[n] ? '是' : '', state.step > 0 && n % state.step === 0 ? '是' : ''].join(','));
        }
        var name = (state.title || '百数表').replace(/[\\/:*?"<>|\s]/g, '') || '百数表';
        download(name + (state.step > 0 ? '-' + state.step + '的倍数' : '') + '.csv', '\uFEFF' + lines.join('\r\n'));
    }

    function download(filename, content) {
        try {
            var blob = new Blob([content], { type: 'text/csv;charset=utf-8' });
            var url = URL.createObjectURL(blob);
            var a = document.createElement('a');
            a.href = url;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            window.setTimeout(function () {
                if (a.parentNode) { a.parentNode.removeChild(a); }
                URL.revokeObjectURL(url);
            }, 0);
            chrome.toast('已导出 ' + filename, 'ok');
        } catch (e) {
            chrome.toast('导出失败', 'err');
        }
    }

    function doPrint() {
        if (typeof window.print !== 'function') { chrome.toast('当前环境不支持打印', 'err'); return; }
        window.setTimeout(function () {
            try { window.print(); } catch (e) { chrome.toast('打印失败，请用浏览器打印快捷键', 'err'); }
        }, 60);
    }

    /* ---------- 设置抽屉 ---------- */

    function options(pairs, current) {
        var out = '';
        for (var i = 0; i < pairs.length; i++) {
            out += '<option value="' + pairs[i][0] + '"' +
                (String(pairs[i][0]) === String(current) ? ' selected' : '') + '>' + pairs[i][1] + '</option>';
        }
        return out;
    }

    function buildSettings(body) {
        var v = function (s) { return ET.escapeHtml(s); };
        body.innerHTML =
            '<h4>表头</h4>' +
            '<div class="et-drawer__row">' +
            '<input class="et-drawer__input" id="hcSetTitle" value="' + v(state.title) +
            '" placeholder="表格标题，如 百 数 表"></div>' +
            '<label class="et-drawer__switch">打印「姓名 / 班级 / 日期」栏' +
            '<input type="checkbox" id="hcSetMeta"' + (state.showMeta ? ' checked' : '') + '></label>' +

            '<h4>表的结构</h4>' +
            '<div class="et-drawer__row">' +
            '<select class="et-drawer__input" id="hcSetCols">' +
            options([['10', '每行 10 格（标准）'], ['5', '每行 5 格（低年级）']], state.cols) +
            '</select>' +
            '<select class="et-drawer__input" id="hcSetMax">' +
            options([['100', '1 – 100'], ['50', '1 – 50']], state.max) +
            '</select></div>' +
            '<p class="et-drawer__tip">每行 10 格时：右边 +1、下边 +10，是百数表的基本规律。</p>' +

            '<h4>挖空 · 遮罩</h4>' +
            '<div class="et-drawer__row">' +
            '<input class="et-drawer__input" id="hcSetHoles" type="number" min="3" max="60" value="' +
            state.holes + '" style="flex:0 0 84px" title="每次随机挖空个数">' +
            '<span class="etimp-dim">个（随机挖空一次盖住的格子数）</span></div>' +
            '<div class="et-drawer__row" style="margin-top:8px">' +
            '<select class="et-drawer__input" id="hcSetMask">' +
            options([['solid', '被遮格显示为深色块'], ['hollow', '被遮格显示为空白格'],
                ['question', '被遮格显示为 ？']], state.maskStyle) +
            '</select></div>' +
            '<p class="et-drawer__tip">打印练习纸建议选「空白格」或「？」，' +
            '省墨且学生可直接在格子里写答案。</p>' +

            '<h4>当前状态</h4>' +
            '<p class="et-drawer__tip">已遮 <b>' + maskedList().length + '</b> 格' +
            (maskedList().length ? '（' + maskedPreview() + '）' : '') + '；' +
            '探针选中 <b>' + (probe || '无') + '</b>。</p>' +
            '<div class="et-drawer__row">' +
            '<button class="et-btn" id="hcSetHole" type="button">随机挖空</button>' +
            '<button class="et-btn" id="hcSetReveal" type="button">全部揭开</button>' +
            '<button class="et-btn" id="hcSetCsv" type="button">导出答案 CSV</button>' +
            '</div>';

        var q = function (id) { return document.getElementById(id); };

        q('hcSetTitle').addEventListener('input', function () { state.title = this.value; persist(); render(); });
        q('hcSetMeta').addEventListener('change', function () { state.showMeta = this.checked; persist(); render(); });
        q('hcSetCols').addEventListener('change', function () {
            state.cols = pickOpt(this.value, COLS_OPTS, DEFAULTS.cols);
            probe = 0;
            persist(); render();
        });
        q('hcSetMax').addEventListener('change', function () {
            state.max = pickOpt(this.value, MAX_OPTS, DEFAULTS.max);
            var keys = [];
            for (var k in masked) {
                if (Object.prototype.hasOwnProperty.call(masked, k) && parseInt(k, 10) > state.max) { keys.push(k); }
            }
            for (var i = 0; i < keys.length; i++) { delete masked[keys[i]]; }
            probe = 0;
            persist(); render();
        });
        q('hcSetHoles').addEventListener('change', function () {
            state.holes = clampInt(this.value, 3, 60, DEFAULTS.holes);
            this.value = state.holes;
            persist();
        });
        q('hcSetMask').addEventListener('change', function () {
            state.maskStyle = MASK_STYLES.indexOf(this.value) >= 0 ? this.value : DEFAULTS.maskStyle;
            persist(); render();
        });
        q('hcSetHole').addEventListener('click', randomHoles);
        q('hcSetReveal').addEventListener('click', revealAll);
        q('hcSetCsv').addEventListener('click', exportAnswer);
    }

    function maskedPreview() {
        var list = maskedList();
        var head = list.slice(0, 12).join('、');
        return head + (list.length > 12 ? ' …' : '');
    }

    /* ---------- 事件与启动 ---------- */

    els.preview.addEventListener('click', function (ev) {
        var cell = ev.target;
        while (cell && cell !== els.preview) {
            if (cell.className && String(cell.className).indexOf('hc-cell') >= 0) {
                var n = parseInt(cell.getAttribute('data-n'), 10);
                if (n >= 1) { onCellClick(n); }
                return;
            }
            cell = cell.parentNode;
        }
    });

    els.stepSel.addEventListener('change', function () {
        state.step = clampInt(this.value, 0, 10, 0);
        persist();
        render();
    });

    var toolBtns = els.toolSeg.getElementsByTagName('button');
    for (var b = 0; b < toolBtns.length; b++) {
        (function (btn) {
            btn.addEventListener('click', function () { setTool(btn.getAttribute('data-tool')); });
        })(toolBtns[b]);
    }

    els.btnHole.addEventListener('click', randomHoles);
    els.btnReveal.addEventListener('click', revealAll);
    els.btnPrint.addEventListener('click', doPrint);

    document.addEventListener('keydown', function (e) {
        if (isTypingTarget(e.target)) { return; }
        if (e.key === '1') { setTool('mask'); }
        else if (e.key === '2') { setTool('probe'); }
        else if (e.key === 'r' || e.key === 'R') { randomHoles(); }
        else if ((e.key === 'p' || e.key === 'P') && !e.ctrlKey && !e.metaKey) { doPrint(); }
    });

    render();
})();
</script>

</body>
</html>
