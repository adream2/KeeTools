/*!
 * et-chrome.css — 工具通用外壳样式（顶栏 / 页脚 / 弹窗 / 按钮 / 主题）
 *
 * 共享样式源。改这里，然后跑：python scripts/sync_shared.py

 * 依赖：无外部资源；颜色全部为令牌变量。

/* ============ 设计令牌 ============ */
:root {
    --et-accent: #2563eb;
    --et-accent-weak: rgba(37, 99, 235, .14);
    --et-bg: #f4f6fb;
    --et-surface: #ffffff;
    --et-surface-2: #f8fafc;
    --et-fg: #0b1220;
    --et-muted: #64748b;
    --et-line: rgba(15, 23, 42, .12);
    --et-line-strong: rgba(15, 23, 42, .22);
    --et-glass: rgba(255, 255, 255, .85);
    --et-shadow-md: 0 10px 28px -18px rgba(15, 23, 42, .3);
    --et-shadow-lg: 0 24px 60px -32px rgba(15, 23, 42, .4);
    --et-ok: #059669;
    --et-warn: #d97706;
    --et-err: #dc2626;
    --et-radius: 12px;
    --et-radius-sm: 9px;
    --et-font: -apple-system, BlinkMacSystemFont, "Segoe UI",
               "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei",
               "Noto Sans SC", sans-serif;
    --et-mono: ui-monospace, "Cascadia Mono", Consolas, Menlo, monospace;
}

html[data-et-theme="dark"] {
    --et-bg: #0b1120;
    --et-surface: #111a2e;
    --et-surface-2: #0f1729;
    --et-fg: #f1f5f9;
    --et-muted: #94a3b8;
    --et-line: rgba(148, 163, 184, .18);
    --et-line-strong: rgba(148, 163, 184, .3);
    --et-glass: rgba(17, 26, 46, .85);
    --et-shadow-md: 0 10px 34px -18px rgba(0, 0, 0, .8);
    --et-shadow-lg: 0 24px 70px -30px rgba(0, 0, 0, .9);
    --et-ok: #34d399;
    --et-warn: #fbbf24;
    --et-err: #f87171;
}

/* ============ 基础 ============ */

/* body 作为外壳时必须清掉浏览器默认 8px 外边距，
   否则 iframe 预览中文档会比视口高 16px（底部白边 + 多余滚动） */
body.et-app {
    margin: 0;
}

.et-app {
    position: relative;
    isolation: isolate;
    display: flex;
    flex-direction: column;
    height: 100vh;
    height: 100dvh;
    overflow: hidden;
    background: var(--et-bg);
    color: var(--et-fg);
    font-family: var(--et-font);
    -webkit-font-smoothing: antialiased;
    transition: background .25s, color .25s;
}

/* 极光背景：径向渐变 + 呼吸动画（edupick 品质基线，老内核也不掉帧） */
.et-app::before {
    content: '';
    position: fixed;
    inset: 0;
    z-index: -1;
    pointer-events: none;
    background:
        radial-gradient(46% 40% at 20% 18%, var(--et-accent-weak), transparent 65%),
        radial-gradient(42% 38% at 82% 24%, var(--et-accent-weak), transparent 70%),
        radial-gradient(50% 44% at 55% 95%, rgba(16, 185, 129, .10), transparent 65%);
    animation: et-aurora 16s ease-in-out infinite alternate;
}

@keyframes et-aurora {
    from { opacity: .55; transform: scale(1); }
    to { opacity: 1; transform: scale(1.06); }
}

.et-app *,
.et-app *::before,
.et-app *::after { box-sizing: border-box; }

[hidden] { display: none !important; }

.et-icon {
    width: 18px;
    height: 18px;
    fill: none;
    stroke: currentColor;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
    flex: none;
}

/* ============ 顶栏 ============ */
.et-topbar {
    flex: none;
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 11px 20px;
    border-bottom: 1px solid var(--et-line);
    background: var(--et-glass);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    z-index: 20;
}

.et-brand {
    display: flex;
    align-items: center;
    gap: 10px;
    min-width: 0;
}

.et-brand__dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: var(--et-accent);
    box-shadow: 0 0 0 4px var(--et-accent-weak);
    flex: none;
}

.et-brand__name {
    font-weight: 800;
    font-size: 15px;
    letter-spacing: -.01em;
    white-space: nowrap;
}

.et-brand__sub {
    font-size: 12.5px;
    color: var(--et-muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.et-status {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 5px 14px;
    border-radius: 999px;
    font-size: 12.5px;
    color: var(--et-muted);
    background: var(--et-surface-2);
    border: 1px solid var(--et-line);
    white-space: nowrap;
    max-width: 42vw;
    overflow: hidden;
    text-overflow: ellipsis;
}

.et-status__dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--et-ok);
    flex: none;
    transition: background .2s;
}

.et-status[data-tone="err"] .et-status__dot { background: var(--et-err); }
.et-status[data-tone="warn"] .et-status__dot { background: var(--et-warn); }

.et-actions {
    display: flex;
    align-items: center;
    gap: 7px;
}

.et-icon-btn {
    display: inline-grid;
    place-items: center;
    width: 38px;
    height: 38px;
    font-size: 16px;
    line-height: 1;
    border-radius: 11px;
    border: 1px solid var(--et-line);
    background: var(--et-surface-2);
    color: var(--et-fg);
    cursor: pointer;
    transition: transform .14s, border-color .14s, color .14s, opacity .14s;
    -webkit-tap-highlight-color: transparent;
}

.et-icon-btn:hover {
    border-color: var(--et-accent);
    color: var(--et-accent);
    transform: translateY(-1px);
}

.et-icon-btn:active { transform: translateY(0); }
.et-icon-btn.is-off { opacity: .4; }
.et-icon-btn:focus-visible { outline: 2px solid var(--et-accent); outline-offset: 2px; }

/* ============ 主区默认 ============ */
.et-main {
    flex: 1;
    min-height: 0;
    position: relative;
    overflow: auto;
}

/* ============ 页脚（品牌回流 L2） ============ */
.et-footer {
    flex: none;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 7px 16px;
    font-size: 12px;
    color: var(--et-muted);
    border-top: 1px solid var(--et-line);
    background: var(--et-glass);
    user-select: none;
    z-index: 20;
}

.et-footer a {
    color: inherit;
    text-decoration: none;
    transition: color .14s;
}

.et-footer a:hover { color: var(--et-accent); }

/* ============ 按钮 ============ */
.et-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
    padding: 9px 16px;
    border-radius: 11px;
    font: inherit;
    font-size: 13.5px;
    font-weight: 700;
    border: 1px solid var(--et-line);
    background: var(--et-surface-2);
    color: var(--et-fg);
    cursor: pointer;
    transition: transform .14s, border-color .14s, color .14s, background .14s, box-shadow .14s;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
}

.et-btn:hover {
    border-color: var(--et-accent);
    color: var(--et-accent);
    transform: translateY(-1px);
}

.et-btn:active { transform: translateY(0); }
.et-btn:focus-visible { outline: 2px solid var(--et-accent); outline-offset: 2px; }
.et-btn:disabled { opacity: .45; cursor: not-allowed; transform: none; }

.et-btn--primary {
    background: var(--et-accent);
    border-color: var(--et-accent);
    color: #fff;
    box-shadow: 0 6px 18px -8px var(--et-accent);
}

.et-btn--primary:hover { color: #fff; filter: brightness(1.08); }
.et-btn--primary:disabled { filter: none; }

.et-btn--danger:hover {
    border-color: var(--et-err);
    color: var(--et-err);
}

.et-btn--lg {
    padding: 13px 26px;
    font-size: 16px;
    border-radius: 14px;
}

/* ============ 弹窗 ============ */
.et-modal {
    position: fixed;
    inset: 0;
    z-index: 100;
    display: grid;
    place-items: center;
    padding: 24px;
    background: rgba(2, 6, 23, .55);
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    animation: et-fade .18s ease;
}

.et-modal__panel {
    width: min(680px, 94vw);
    max-height: 86vh;
    max-height: 86dvh;
    display: flex;
    flex-direction: column;
    background: var(--et-surface);
    border: 1px solid var(--et-line);
    border-radius: 16px;
    box-shadow: var(--et-shadow-lg);
    animation: et-pop .2s cubic-bezier(.34, 1.4, .64, 1);
    overflow: hidden;
}

.et-modal__panel--narrow { width: min(460px, 92vw); }
.et-modal__panel--wide { width: min(900px, 94vw); }

.et-modal__head {
    flex: none;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 16px 20px;
    border-bottom: 1px solid var(--et-line);
    font-weight: 800;
    font-size: 15px;
}

.et-modal__head .et-icon-btn {
    margin-left: auto;
    width: 32px;
    height: 32px;
}

.et-modal__body {
    flex: 1;
    min-height: 0;
    overflow: auto;
    padding: 18px 20px;
}

.et-modal__foot {
    flex: none;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 14px 20px;
    border-top: 1px solid var(--et-line);
    background: var(--et-surface-2);
}

.et-modal__foot .spacer { flex: 1; }

@keyframes et-fade {
    from { opacity: 0; }
}

@keyframes et-pop {
    from { opacity: 0; transform: translateY(14px) scale(.97); }
}

/* ============ 轻提示（toast） ============ */
.et-toast {
    position: fixed;
    left: 50%;
    bottom: 56px;
    transform: translateX(-50%) translateY(10px);
    z-index: 120;
    display: flex;
    align-items: center;
    gap: 9px;
    max-width: min(520px, 88vw);
    padding: 11px 18px;
    border-radius: 12px;
    font-size: 13.5px;
    font-weight: 600;
    color: #fff;
    background: rgba(15, 23, 42, .92);
    border: 1px solid rgba(148, 163, 184, .25);
    box-shadow: var(--et-shadow-lg);
    opacity: 0;
    pointer-events: none;
    transition: opacity .22s, transform .22s;
}

.et-toast.is-show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
}

.et-toast[data-tone="ok"] { background: rgba(5, 150, 105, .95); }
.et-toast[data-tone="err"] { background: rgba(220, 38, 38, .95); }
.et-toast[data-tone="warn"] { background: rgba(217, 119, 6, .95); }

/* ============ 设置抽屉（右上角入口，edupick 交互） ============ */
.et-drawer-backdrop {
    position: fixed;
    inset: 0;
    z-index: 90;
    background: rgba(2, 6, 23, .45);
    backdrop-filter: blur(3px);
    -webkit-backdrop-filter: blur(3px);
    opacity: 0;
    transition: opacity .2s;
}

.et-drawer-backdrop.is-open { opacity: 1; }

.et-drawer {
    position: absolute;
    top: 0;
    right: 0;
    height: 100%;
    width: min(400px, 92vw);
    display: flex;
    flex-direction: column;
    background: var(--et-surface);
    border-left: 1px solid var(--et-line);
    box-shadow: var(--et-shadow-lg);
    transform: translateX(100%);
    transition: transform .22s cubic-bezier(.32, .72, .35, 1);
}

.et-drawer-backdrop.is-open .et-drawer { transform: translateX(0); }

.et-drawer__head {
    flex: none;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 15px 18px;
    border-bottom: 1px solid var(--et-line);
    font-weight: 800;
    font-size: 15px;
    color: var(--et-accent);
}

.et-drawer__head .et-icon-btn {
    margin-left: auto;
    width: 32px;
    height: 32px;
}

.et-drawer__body {
    flex: 1;
    min-height: 0;
    overflow: auto;
    padding: 16px 18px 24px;
}

/* 抽屉内容通用小节（工具复用） */
.et-drawer__body h4 {
    margin: 18px 0 8px;
    font-size: 12px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: .08em;
    color: var(--et-muted);
}

.et-drawer__body h4:first-child { margin-top: 0; }

.et-drawer__row {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
}

.et-drawer__tip {
    margin: 8px 0 0;
    font-size: 12px;
    line-height: 1.8;
    color: var(--et-muted);
}

.et-drawer__tip b { color: var(--et-fg); }

.et-drawer__input {
    flex: 1;
    min-width: 0;
    padding: 9px 12px;
    border: 1px solid var(--et-line-strong);
    border-radius: 9px;
    background: var(--et-surface-2);
    color: var(--et-fg);
    font: inherit;
    font-size: 13.5px;
    transition: border-color .14s, box-shadow .14s;
}

.et-drawer__input:focus {
    outline: none;
    border-color: var(--et-accent);
    box-shadow: 0 0 0 3px var(--et-accent-weak);
}

.et-drawer__switch {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 10px 0;
    border-bottom: 1px dashed var(--et-line);
    font-size: 13.5px;
    font-weight: 600;
    color: var(--et-fg);
    cursor: pointer;
    user-select: none;
}

.et-drawer__switch input {
    width: 17px;
    height: 17px;
    accent-color: var(--et-accent);
    cursor: pointer;
}
</style>

<style>
/* ── 工具自身样式：自包含，不引用任何外部资源 ── */
:root {
    --phonicschart-accent: #0d9488;
}

.pc-main {
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
    gap: 10px;
    padding: 12px 16px 0;
}

/* ---------- 工具栏 ---------- */

.pc-bar {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
}

.pc-seg {
    display: inline-flex;
    gap: 2px;
    padding: 3px;
    border: 1px solid var(--et-line);
    border-radius: 10px;
    background: var(--et-surface-2);
    flex-wrap: wrap;
}

.pc-seg button {
    border: 0;
    background: transparent;
    color: var(--et-muted);
    font: inherit;
    font-size: 13.5px;
    padding: 6px 12px;
    border-radius: 8px;
    cursor: pointer;
}

.pc-seg button.is-on {
    background: var(--et-surface);
    color: var(--phonicschart-accent);
    box-shadow: var(--et-shadow-md);
    font-weight: 600;
}

.pc-stat {
    font-size: 13px;
    color: var(--et-muted);
}

.pc-spacer { flex: 1; }

/* ---------- 网格 ---------- */

.pc-stage {
    flex: 1;
    min-height: 0;
    border: 1px solid var(--et-line);
    border-radius: 14px;
    background: var(--et-surface);
    overflow: auto;
    padding: 14px;
}

.pc-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(clamp(170px, 16vw, 280px), 1fr));
    gap: 10px;
}

.pc-cell {
    border: 1px solid var(--et-line-strong);
    border-radius: 12px;
    background: var(--et-surface-2);
    padding: 10px 12px;
    cursor: pointer;
    text-align: center;
    transition: transform .12s, border-color .15s, background .15s;
    font: inherit;
    color: var(--et-fg);
}

.pc-cell:hover {
    transform: translateY(-3px);
    border-color: var(--phonicschart-accent);
}

.pc-cell:focus-visible {
    outline: 3px solid var(--phonicschart-accent);
    outline-offset: 2px;
}

.pc-cell.is-on {
    border-color: var(--phonicschart-accent);
    background: var(--et-accent-weak);
}

.pc-cell .pc-key {
    font-size: clamp(24px, 5.4vmin, 62px);
    font-weight: 800;
    color: var(--phonicschart-accent);
    line-height: 1.2;
    letter-spacing: 2px;
}

.pc-cell .pc-words {
    margin-top: 4px;
    font-size: clamp(12.5px, 1.6vmin, 20px);
    line-height: 1.65;
    color: var(--et-muted);
}

.pc-cell .pc-words b {
    color: var(--et-fg);
    font-weight: 600;
}

.pc-note {
    margin-top: 12px;
    font-size: 12.5px;
    line-height: 1.9;
    color: var(--et-muted);
    border-top: 1px dashed var(--et-line);
    padding-top: 10px;
}

.pc-note b { color: var(--et-fg); }

@media print {
    .pc-bar { display: none !important; }
}
</style>

                if (req) { try { req.call(root); } catch (err) { /* 忽略 */ } }

        var siteOrigin = typeof global.ET_SITE_ORIGIN === 'string' && /^https?:\/\//.test(global.ET_SITE_ORIGIN)
            ? global.ET_SITE_ORIGIN

        /* 站点来源发现：iframe 内向父窗口询问；也可由宿主直接注入 ET_SITE_ORIGIN */
        try {
            if (global.parent && global.parent !== global) {
                global.parent.postMessage(JSON.stringify({ type: 'et-hello', toolId: toolId }), '*');
            }
        } catch (err) { /* 跨域异常忽略 */ }

        global.addEventListener('message', function (ev) {
            var data = ev.data;
            if (typeof data === 'string') {

            if (!data || typeof data !== 'object') { return; }

            if (data.type === 'et-origin' && typeof data.origin === 'string' && /^https?:\/\//.test(data.origin)) {

                if (!global.ET_SITE_ORIGIN) { global.ET_SITE_ORIGIN = data.origin; }

        if (typeof opt.primary === 'function') {

                else { opt.primary(); }

<script>
  /* 此块由 scripts/sync_shared.py 自动注入，请勿手工修改 */
/*!
 * et-stats.js — 使用统计模块（模块化，可整体移除）
 *
 * 共享逻辑源。改这里，然后跑：python scripts/sync_shared.py
 * 依赖：无（可脱离 et-util / et-chrome 独立运行）。
 * 全局：ET.Stats
 *
 * ┌────────────────────────────────────────────────────────────────┐
 * │ 说明：本模块只做一件事——工具被打开时向上报端点发一条匿名计数。 │
 * │ · 在线（iframe 内）：宿主页面已服务端计数，本模块不重复上报。   │
 * │ · 离线打开（file:// / 下载单文件 / 离线包）：联网条件具备时，   │
 * │   以 sendBeacon 上报 use_offline 事件（text/plain 免预检）。    │
 * │ · 上报端点 = window.ET_SITE_ORIGIN（由宿主注入或离线包配置）。  │
 * │   未配置端点时本模块完全静默，不发任何请求。                    │
 * │ · **整个 <script> 块可安全删除**：删除后工具其余功能完全正常，  │
 * │   且完全不再发起任何网络请求。                                  │
 * └────────────────────────────────────────────────────────────────┘
 */
(function (global) {
    'use strict';

    var ET = global.ET = global.ET || {};

    var Stats = {
        /** 上报端点来源（站点绝对地址，无协议尾斜杠） */
        endpoint: (typeof global.ET_SITE_ORIGIN === 'string' && /^https?:\/\//.test(global.ET_SITE_ORIGIN))
            ? global.ET_SITE_ORIGIN
            : null,

        _done: {},

        /**
         * 上报一次事件（同一事件同一工具每次页面加载只报一次）。
         * event: 'use_offline' 等；toolId: 工具 id。
         */
        send: function (event, toolId) {
            if (!event || this._done[event + ':' + (toolId || '')]) { return false; }
            if (!this.endpoint) { return false; }
            /* iframe 内由宿主统计，避免双计 */
            try {
                if (global.parent && global.parent !== global) { return false; }
            } catch (err) { return false; }
            /* 断网时挂起，网络恢复自动补报一次 */
            if (global.navigator && global.navigator.onLine === false) {
                var self = this;
                global.addEventListener('online', function () { self.send(event, toolId); }, { once: true });
                return false;
            }

            this._done[event + ':' + (toolId || '')] = true;
            var payload = JSON.stringify({ event: event, tool: toolId || '' });

            try {
                if (global.navigator.sendBeacon) {
                    return global.navigator.sendBeacon(
                        this.endpoint + '/api/track',
                        new Blob([payload], { type: 'text/plain;charset=UTF-8' })
                    );
                }
                global.fetch(this.endpoint + '/api/track', {
                    method: 'POST',
                    body: payload,
                    keepalive: true,
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'text/plain;charset=UTF-8' }
                });
                return true;
            } catch (err) {
                return false;
            }
        }
    };

    ET.Stats = Stats;
})(window);
</script>

            '<p style="margin:0"><b>说明</b>：本表发音为常见规律，英语拼写例外很多，' +
            '规律之外请以词典和老师示范为准。</p></div>'
    });

    var els = {
        seg: document.getElementById('groupSeg'),
        stat: document.getElementById('stat'),
        grid: document.getElementById('grid'),
        note: document.getElementById('note'),
        btnSpeak: document.getElementById('btnSpeak')
    };

    var groupIdx = 0;
    var speakOn = store.get('speak', 1) === 1;
    var ttsOk = typeof window.speechSynthesis !== 'undefined' &&
        typeof window.SpeechSynthesisUtterance !== 'undefined';

    /* ---------- 渲染 ---------- */

    function buildSeg() {
        els.seg.textContent = '';
        for (var i = 0; i < GROUPS.length; i++) {
            (function (idx) {
                var btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = GROUPS[idx].label;
                if (idx === groupIdx) { btn.classList.add('is-on'); }
                btn.addEventListener('click', function () { setGroup(idx); });
                els.seg.appendChild(btn);
            })(i);
        }
    }

    function setGroup(idx) {
        groupIdx = Math.max(0, Math.min(GROUPS.length - 1, idx));
        store.set('group', groupIdx);
        render();
    }

    function cycleGroup(d) {
        setGroup((groupIdx + d + GROUPS.length) % GROUPS.length);
    }

    function render() {
        buildSeg();
        var g = GROUPS[groupIdx];
        chrome.setStatus(g.label);
        els.stat.textContent = g.label + ' · ' + g.cells.length + ' 张卡片';
        els.note.innerHTML = g.note;
        els.btnSpeak.classList.toggle('is-off', !speakOn);
        els.grid.textContent = '';
        for (var i = 0; i < g.cells.length; i++) {
            (function (cell) {
                var btn = document.createElement('button');
                btn.type = 'button';
                btn.className = 'pc-cell';
                var key = document.createElement('div');
                key.className = 'pc-key';
                key.textContent = cell.t;
                btn.appendChild(key);
                var words = document.createElement('div');
                words.className = 'pc-words';
                words.innerHTML = cell.words.map(function (w) {
                    var at = w.indexOf(' ');
                    if (at < 0) { return '<b>' + w + '</b>'; }
                    return '<b>' + w.slice(0, at) + '</b>' + w.slice(at);
                }).join('<br>');
                btn.appendChild(words);
                btn.addEventListener('click', function () { pick(btn, cell); });
                els.grid.appendChild(btn);
            })(g.cells[i]);
        }
    }

    function pick(btn, cell) {
        var on = els.grid.querySelector('.pc-cell.is-on');
        if (on) { on.classList.remove('is-on'); }
        btn.classList.add('is-on');
        if (!speakOn) { return; }
        if (!ttsOk) {
            chrome.toast('当前浏览器不支持语音朗读，请带读例词', 'warn');
            return;
        }
        speak(cell);
    }

    /* ---------- 语音 ---------- */

    function speak(cell) {
        var synth = window.speechSynthesis;
        if (!synth) { return; }
        synth.cancel();
        /* 字母组合本身先读一遍（对单字母读字母名，组合读第一个例词代读） */
        var texts;
        if (/^[A-Za-z] [a-z]$/.test(cell.t)) {
            texts = [cell.t.replace(' ', ''), cell.words[0]];
        } else {
            texts = cell.words.slice(0, 2);
        }
        for (var i = 0; i < texts.length; i++) {
            (function (text, delay) {
                setTimeout(function () {
                    var u = new SpeechSynthesisUtterance(text.replace(/\s*[\u4e00-\u9fa5].*$/, ''));
                    u.lang = 'en-US';
                    u.rate = 0.75;
                    synth.speak(u);
                }, delay);
            })(texts[i], i * 900);
        }
    }

    /* ---------- 事件 ---------- */

    els.btnSpeak.addEventListener('click', function () {
        speakOn = !speakOn;
        store.set('speak', speakOn ? 1 : 0);
        els.btnSpeak.classList.toggle('is-off', !speakOn);
        chrome.toast(speakOn ? '已开启朗读' : '已关闭朗读');
        if (speakOn && !ttsOk) {
            chrome.toast('当前浏览器不支持语音朗读', 'warn');
        }
    });

    function buildSettings() {
        var box = document.createElement('div');
        box.innerHTML =
            '<div class="et-drawer__row"><label>点击朗读</label>' +
            '<label class="et-drawer__switch"><input type="checkbox" id="pcSetSpeak"' +
            (speakOn ? ' checked' : '') + (ttsOk ? '' : ' disabled') + '></label></div>' +
            '<div class="et-drawer__tip">' +
            (ttsOk
                ? '朗读使用浏览器内置英语语音（离线是否可用取决于操作系统安装的语音包）。'
                : '当前浏览器不支持语音合成，只能看例词跟读。') +
            '</div>';
        box.querySelector('#pcSetSpeak').addEventListener('change', function () {
            speakOn = this.checked;
            store.set('speak', speakOn ? 1 : 0);
            els.btnSpeak.classList.toggle('is-off', !speakOn);
        });
        return box;
    }

    groupIdx = parseInt(store.get('group', 0), 10) || 0;
    if (groupIdx < 0 || groupIdx >= GROUPS.length) { groupIdx = 0; }
    render();
})();
})();
</script>

</body>
</html>
