/*!
 * et-chrome.css — 工具通用外壳样式（顶栏 / 页脚 / 弹窗 / 按钮 / 主题）
 *
 * 共享样式源。改这里，然后跑：python scripts/sync_shared.py
 * 所有类名带 et- 前缀，避免与工具自身样式冲突。
 * 依赖：无外部资源；颜色全部为令牌变量。
 */

/* ============ 设计令牌 ============ */
:root {
    --et-accent: #2563eb;
    --et-accent-weak: rgba(37, 99, 235, .14);
    --et-bg: #f4f6fb;
    --et-surface: #ffffff;
    --et-surface-2: #f8fafc;
    --et-fg: #0b1220;
    --et-muted: #64748b;
    --et-line: rgba(15, 23, 42, .12);
    --et-line-strong: rgba(15, 23, 42, .22);
    --et-glass: rgba(255, 255, 255, .85);
    --et-shadow-md: 0 10px 28px -18px rgba(15, 23, 42, .3);
    --et-shadow-lg: 0 24px 60px -32px rgba(15, 23, 42, .4);
    --et-ok: #059669;
    --et-warn: #d97706;
    --et-err: #dc2626;
    --et-radius: 12px;
    --et-radius-sm: 9px;
    --et-font: -apple-system, BlinkMacSystemFont, "Segoe UI",
               "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei",
               "Noto Sans SC", sans-serif;
    --et-mono: ui-monospace, "Cascadia Mono", Consolas, Menlo, monospace;
}

html[data-et-theme="dark"] {
    --et-bg: #0b1120;
    --et-surface: #111a2e;
    --et-surface-2: #0f1729;
    --et-fg: #f1f5f9;
    --et-muted: #94a3b8;
    --et-line: rgba(148, 163, 184, .18);
    --et-line-strong: rgba(148, 163, 184, .3);
    --et-glass: rgba(17, 26, 46, .85);
    --et-shadow-md: 0 10px 34px -18px rgba(0, 0, 0, .8);
    --et-shadow-lg: 0 24px 70px -30px rgba(0, 0, 0, .9);
    --et-ok: #34d399;
    --et-warn: #fbbf24;
    --et-err: #f87171;
}

/* ============ 基础 ============ */

/* body 作为外壳时必须清掉浏览器默认 8px 外边距，
   否则 iframe 预览中文档会比视口高 16px（底部白边 + 多余滚动） */
body.et-app {
    margin: 0;
}

.et-app {
    position: relative;
    isolation: isolate;
    display: flex;
    flex-direction: column;
    height: 100vh;
    height: 100dvh;
    overflow: hidden;
    background: var(--et-bg);
    color: var(--et-fg);
    font-family: var(--et-font);
    -webkit-font-smoothing: antialiased;
    transition: background .25s, color .25s;
}

/* 极光背景：径向渐变 + 呼吸动画（edupick 品质基线，老内核也不掉帧） */
.et-app::before {
    content: '';
    position: fixed;
    inset: 0;
    z-index: -1;
    pointer-events: none;
    background:
        radial-gradient(46% 40% at 20% 18%, var(--et-accent-weak), transparent 65%),
        radial-gradient(42% 38% at 82% 24%, var(--et-accent-weak), transparent 70%),
        radial-gradient(50% 44% at 55% 95%, rgba(16, 185, 129, .10), transparent 65%);
    animation: et-aurora 16s ease-in-out infinite alternate;
}

@keyframes et-aurora {
    from { opacity: .55; transform: scale(1); }
    to { opacity: 1; transform: scale(1.06); }
}

.et-app *,
.et-app *::before,
.et-app *::after { box-sizing: border-box; }

[hidden] { display: none !important; }

.et-icon {
    width: 18px;
    height: 18px;
    fill: none;
    stroke: currentColor;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
    flex: none;
}

/* ============ 顶栏 ============ */
.et-topbar {
    flex: none;
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 11px 20px;
    border-bottom: 1px solid var(--et-line);
    background: var(--et-glass);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    z-index: 20;
}

.et-brand {
    display: flex;
    align-items: center;
    gap: 10px;
    min-width: 0;
}

.et-brand__dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: var(--et-accent);
    box-shadow: 0 0 0 4px var(--et-accent-weak);
    flex: none;
}

.et-brand__name {
    font-weight: 800;
    font-size: 15px;
    letter-spacing: -.01em;
    white-space: nowrap;
}

.et-brand__sub {
    font-size: 12.5px;
    color: var(--et-muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.et-status {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 5px 14px;
    border-radius: 999px;
    font-size: 12.5px;
    color: var(--et-muted);
    background: var(--et-surface-2);
    border: 1px solid var(--et-line);
    white-space: nowrap;
    max-width: 42vw;
    overflow: hidden;
    text-overflow: ellipsis;
}

.et-status__dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--et-ok);
    flex: none;
    transition: background .2s;
}

.et-status[data-tone="err"] .et-status__dot { background: var(--et-err); }
.et-status[data-tone="warn"] .et-status__dot { background: var(--et-warn); }

.et-actions {
    display: flex;
    align-items: center;
    gap: 7px;
}

.et-icon-btn {
    display: inline-grid;
    place-items: center;
    width: 38px;
    height: 38px;
    font-size: 16px;
    line-height: 1;
    border-radius: 11px;
    border: 1px solid var(--et-line);
    background: var(--et-surface-2);
    color: var(--et-fg);
    cursor: pointer;
    transition: transform .14s, border-color .14s, color .14s, opacity .14s;
    -webkit-tap-highlight-color: transparent;
}

.et-icon-btn:hover {
    border-color: var(--et-accent);
    color: var(--et-accent);
    transform: translateY(-1px);
}

.et-icon-btn:active { transform: translateY(0); }
.et-icon-btn.is-off { opacity: .4; }
.et-icon-btn:focus-visible { outline: 2px solid var(--et-accent); outline-offset: 2px; }

/* ============ 主区默认 ============ */
.et-main {
    flex: 1;
    min-height: 0;
    position: relative;
    overflow: auto;
}

/* ============ 页脚（品牌回流 L2） ============ */
.et-footer {
    flex: none;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 7px 16px;
    font-size: 12px;
    color: var(--et-muted);
    border-top: 1px solid var(--et-line);
    background: var(--et-glass);
    user-select: none;
    z-index: 20;
}

.et-footer a {
    color: inherit;
    text-decoration: none;
    transition: color .14s;
}

.et-footer a:hover { color: var(--et-accent); }

/* ============ 按钮 ============ */
.et-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
    padding: 9px 16px;
    border-radius: 11px;
    font: inherit;
    font-size: 13.5px;
    font-weight: 700;
    border: 1px solid var(--et-line);
    background: var(--et-surface-2);
    color: var(--et-fg);
    cursor: pointer;
    transition: transform .14s, border-color .14s, color .14s, background .14s, box-shadow .14s;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
}

.et-btn:hover {
    border-color: var(--et-accent);
    color: var(--et-accent);
    transform: translateY(-1px);
}

.et-btn:active { transform: translateY(0); }
.et-btn:focus-visible { outline: 2px solid var(--et-accent); outline-offset: 2px; }
.et-btn:disabled { opacity: .45; cursor: not-allowed; transform: none; }

.et-btn--primary {
    background: var(--et-accent);
    border-color: var(--et-accent);
    color: #fff;
    box-shadow: 0 6px 18px -8px var(--et-accent);
}

.et-btn--primary:hover { color: #fff; filter: brightness(1.08); }
.et-btn--primary:disabled { filter: none; }

.et-btn--danger:hover {
    border-color: var(--et-err);
    color: var(--et-err);
}

.et-btn--lg {
    padding: 13px 26px;
    font-size: 16px;
    border-radius: 14px;
}

/* ============ 弹窗 ============ */
.et-modal {
    position: fixed;
    inset: 0;
    z-index: 100;
    display: grid;
    place-items: center;
    padding: 24px;
    background: rgba(2, 6, 23, .55);
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    animation: et-fade .18s ease;
}

.et-modal__panel {
    width: min(680px, 94vw);
    max-height: 86vh;
    max-height: 86dvh;
    display: flex;
    flex-direction: column;
    background: var(--et-surface);
    border: 1px solid var(--et-line);
    border-radius: 16px;
    box-shadow: var(--et-shadow-lg);
    animation: et-pop .2s cubic-bezier(.34, 1.4, .64, 1);
    overflow: hidden;
}

.et-modal__panel--narrow { width: min(460px, 92vw); }
.et-modal__panel--wide { width: min(900px, 94vw); }

.et-modal__head {
    flex: none;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 16px 20px;
    border-bottom: 1px solid var(--et-line);
    font-weight: 800;
    font-size: 15px;
}

.et-modal__head .et-icon-btn {
    margin-left: auto;
    width: 32px;
    height: 32px;
}

.et-modal__body {
    flex: 1;
    min-height: 0;
    overflow: auto;
    padding: 18px 20px;
}

.et-modal__foot {
    flex: none;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 14px 20px;
    border-top: 1px solid var(--et-line);
    background: var(--et-surface-2);
}

.et-modal__foot .spacer { flex: 1; }

@keyframes et-fade {
    from { opacity: 0; }
}

@keyframes et-pop {
    from { opacity: 0; transform: translateY(14px) scale(.97); }
}

/* ============ 轻提示（toast） ============ */
.et-toast {
    position: fixed;
    left: 50%;
    bottom: 56px;
    transform: translateX(-50%) translateY(10px);
    z-index: 120;
    display: flex;
    align-items: center;
    gap: 9px;
    max-width: min(520px, 88vw);
    padding: 11px 18px;
    border-radius: 12px;
    font-size: 13.5px;
    font-weight: 600;
    color: #fff;
    background: rgba(15, 23, 42, .92);
    border: 1px solid rgba(148, 163, 184, .25);
    box-shadow: var(--et-shadow-lg);
    opacity: 0;
    pointer-events: none;
    transition: opacity .22s, transform .22s;
}

.et-toast.is-show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
}

.et-toast[data-tone="ok"] { background: rgba(5, 150, 105, .95); }
.et-toast[data-tone="err"] { background: rgba(220, 38, 38, .95); }
.et-toast[data-tone="warn"] { background: rgba(217, 119, 6, .95); }

/* ============ 设置抽屉（右上角入口，edupick 交互） ============ */
.et-drawer-backdrop {
    position: fixed;
    inset: 0;
    z-index: 90;
    background: rgba(2, 6, 23, .45);
    backdrop-filter: blur(3px);
    -webkit-backdrop-filter: blur(3px);
    opacity: 0;
    transition: opacity .2s;
}

.et-drawer-backdrop.is-open { opacity: 1; }

.et-drawer {
    position: absolute;
    top: 0;
    right: 0;
    height: 100%;
    width: min(400px, 92vw);
    display: flex;
    flex-direction: column;
    background: var(--et-surface);
    border-left: 1px solid var(--et-line);
    box-shadow: var(--et-shadow-lg);
    transform: translateX(100%);
    transition: transform .22s cubic-bezier(.32, .72, .35, 1);
}

.et-drawer-backdrop.is-open .et-drawer { transform: translateX(0); }

.et-drawer__head {
    flex: none;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 15px 18px;
    border-bottom: 1px solid var(--et-line);
    font-weight: 800;
    font-size: 15px;
    color: var(--et-accent);
}

.et-drawer__head .et-icon-btn {
    margin-left: auto;
    width: 32px;
    height: 32px;
}

.et-drawer__body {
    flex: 1;
    min-height: 0;
    overflow: auto;
    padding: 16px 18px 24px;
}

/* 抽屉内容通用小节（工具复用） */
.et-drawer__body h4 {
    margin: 18px 0 8px;
    font-size: 12px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: .08em;
    color: var(--et-muted);
}

.et-drawer__body h4:first-child { margin-top: 0; }

.et-drawer__row {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
}

.et-drawer__tip {
    margin: 8px 0 0;
    font-size: 12px;
    line-height: 1.8;
    color: var(--et-muted);
}

.et-drawer__tip b { color: var(--et-fg); }

.et-drawer__input {
    flex: 1;
    min-width: 0;
    padding: 9px 12px;
    border: 1px solid var(--et-line-strong);
    border-radius: 9px;
    background: var(--et-surface-2);
    color: var(--et-fg);
    font: inherit;
    font-size: 13.5px;
    transition: border-color .14s, box-shadow .14s;
}

.et-drawer__input:focus {
    outline: none;
    border-color: var(--et-accent);
    box-shadow: 0 0 0 3px var(--et-accent-weak);
}

.et-drawer__switch {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 10px 0;
    border-bottom: 1px dashed var(--et-line);
    font-size: 13.5px;
    font-weight: 600;
    color: var(--et-fg);
    cursor: pointer;
    user-select: none;
}

.et-drawer__switch input {
    width: 17px;
    height: 17px;
    accent-color: var(--et-accent);
    cursor: pointer;
}
</style>

            setTimeout(function () {
                if (backdrop.parentNode) { backdrop.parentNode.removeChild(backdrop); }
            }, 220);
        }
        function onKey(ev) {
            if (ev.key === 'Escape') { ev.stopPropagation(); close(); }
        }
        document.addEventListener('keydown', onKey);
        backdrop.addEventListener('mousedown', function (ev) {
            if (ev.target === backdrop) { close(); }
        });

        if (typeof build === 'function') { build(body, { close: close }); }
        return { body: body, close: close };

    /* ---------- 通用弹窗 / toast（同时挂模块级，供其他共享组件使用） ---------- */

    function modal(mo) {

        var panel = el('div', 'et-modal__panel' + (mo.size === 'narrow' ? ' et-modal__panel--narrow'
            : mo.size === 'wide' ? ' et-modal__panel--wide' : ''));

        if (mo.icon) { head.appendChild(makeIcon(mo.icon)); }
        head.appendChild(el('span', null, mo.title || ''));

        if (mo.buttons && mo.buttons.length) {

                var btn = el('button', 'et-btn' + (b.primary ? ' et-btn--primary' : '') + (b.danger ? ' et-btn--danger' : ''), b.label);
                btn.type = 'button';
                btn.addEventListener('click', function () {
                    if (b.onClick) { b.onClick(close); } else { close(); }
                });
                foot.appendChild(btn);
            });
            panel.appendChild(foot);
        }

        backdrop.appendChild(panel);
        document.body.appendChild(backdrop);

        function close() {
            if (backdrop.parentNode) { backdrop.parentNode.removeChild(backdrop); }
            document.removeEventListener('keydown', onKey);
            if (mo.onClose) { mo.onClose(); }
        }
        function onKey(ev) {

        }

        document.addEventListener('fullscreenchange', function () {

        });
        document.addEventListener('webkitfullscreenchange', function () {

            ? global.ET_SITE_ORIGIN

        try {

        } catch (err) { /* 跨域异常忽略 */ }

        global.addEventListener('message', function (ev) {

            if (data.type === 'et-origin' && typeof data.origin === 'string' && /^https?:\/\//.test(data.origin)) {

<script>
  /* 此块由 scripts/sync_shared.py 自动注入，请勿手工修改 */
/*!
 * et-stats.js — 使用统计模块（模块化，可整体移除）
 *
 * 共享逻辑源。改这里，然后跑：python scripts/sync_shared.py
 * 依赖：无（可脱离 et-util / et-chrome 独立运行）。
 * 全局：ET.Stats
 *
 * ┌────────────────────────────────────────────────────────────────┐
 * │ 说明：本模块只做一件事——工具被打开时向上报端点发一条匿名计数。 │
 * │ · 在线（iframe 内）：宿主页面已服务端计数，本模块不重复上报。   │
 * │ · 离线打开（file:// / 下载单文件 / 离线包）：联网条件具备时，   │
 * │   以 sendBeacon 上报 use_offline 事件（text/plain 免预检）。    │
 * │ · 上报端点 = window.ET_SITE_ORIGIN（由宿主注入或离线包配置）。  │
 * │   未配置端点时本模块完全静默，不发任何请求。                    │
 * │ · **整个 <script> 块可安全删除**：删除后工具其余功能完全正常，  │
 * │   且完全不再发起任何网络请求。                                  │
 * └────────────────────────────────────────────────────────────────┘
 */
(function (global) {
    'use strict';

    var ET = global.ET = global.ET || {};

    var Stats = {
        /** 上报端点来源（站点绝对地址，无协议尾斜杠） */
        endpoint: (typeof global.ET_SITE_ORIGIN === 'string' && /^https?:\/\//.test(global.ET_SITE_ORIGIN))
            ? global.ET_SITE_ORIGIN
            : null,

        _done: {},

        /**
         * 上报一次事件（同一事件同一工具每次页面加载只报一次）。
         * event: 'use_offline' 等；toolId: 工具 id。
         */
        send: function (event, toolId) {
            if (!event || this._done[event + ':' + (toolId || '')]) { return false; }
            if (!this.endpoint) { return false; }
            /* iframe 内由宿主统计，避免双计 */
            try {
                if (global.parent && global.parent !== global) { return false; }
            } catch (err) { return false; }
            /* 断网时挂起，网络恢复自动补报一次 */
            if (global.navigator && global.navigator.onLine === false) {
                var self = this;
                global.addEventListener('online', function () { self.send(event, toolId); }, { once: true });
                return false;
            }

            this._done[event + ':' + (toolId || '')] = true;
            var payload = JSON.stringify({ event: event, tool: toolId || '' });

            try {
                if (global.navigator.sendBeacon) {
                    return global.navigator.sendBeacon(
                        this.endpoint + '/api/track',
                        new Blob([payload], { type: 'text/plain;charset=UTF-8' })
                    );
                }
                global.fetch(this.endpoint + '/api/track', {
                    method: 'POST',
                    body: payload,
                    keepalive: true,
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'text/plain;charset=UTF-8' }
                });
                return true;
            } catch (err) {
                return false;
            }
        }
    };

    ET.Stats = Stats;
})(window);
</script>

                    var x = -half + col * colW + offset;
                    s += '<rect x="' + x.toFixed(1) + '" y="' + y.toFixed(1) + '" width="' + (colW - 4).toFixed(1) +
                        '" height="' + (rowH - 4).toFixed(1) + '" rx="10" fill="rgba(221,214,254,.28)" stroke="rgba(107,33,168,.55)" stroke-width="1.6"/>';
                    if (r() > .18) {
                        s += '<ellipse cx="' + (x + colW / 2).toFixed(1) + '" cy="' + (y + rowH / 2).toFixed(1) +
                            '" rx="' + (colW * .16).toFixed(1) + '" ry="' + (rowH * .26).toFixed(1) +
                            '" fill="rgba(91,33,182,.4)"/>';
                    }
                }
            }
        } else if (id === 'mouth') {
            /* 口腔上皮：散落的扁圆形细胞 */
            for (var i = 0; i < 620; i++) {
                var cx = (r() - .5) * half * 2;
                var cy = (r() - .5) * half * 2;
                var rx = CELL * (.4 + r() * .25);
                var ry = rx * (.62 + r() * .2);
                var ang = (r() * 60 - 30).toFixed(1);
                s += '<ellipse cx="' + cx.toFixed(1) + '" cy="' + cy.toFixed(1) + '" rx="' + rx.toFixed(1) +
                    '" ry="' + ry.toFixed(1) + '" transform="rotate(' + ang + ' ' + cx.toFixed(1) + ' ' + cy.toFixed(1) +
                    ')" fill="rgba(254,240,222,.4)" stroke="rgba(180,83,9,.5)" stroke-width="1.6"/>';
                s += '<circle cx="' + (cx + rx * .2).toFixed(1) + '" cy="' + (cy - ry * .1).toFixed(1) + '" r="' +
                    (rx * .22).toFixed(1) + '" fill="rgba(146,64,14,.42)"/>';
            }
        } else {
            /* 叶下表皮：不规则细胞 + 气孔 */
            var side = CELL * .92;
            for (var gy = 0; gy * side < half * 2 + side; gy++) {
                for (var gx = 0; gx * side < half * 2 + side; gx++) {
                    var px = -half + gx * side;
                    var py = -half + gy * side;
                    var j1 = (r() - .5) * 10, j2 = (r() - .5) * 10;
                    if ((gx + gy) % 5 === 2 && r() > .3) {
                        /* 气孔：两个肾形保卫细胞 */
                        var scx = px + side / 2, scy = py + side / 2;
                        s += '<ellipse cx="' + (scx - side * .12).toFixed(1) + '" cy="' + scy.toFixed(1) +
                            '" rx="' + (side * .3).toFixed(1) + '" ry="' + (side * .17).toFixed(1) +
                            '" fill="rgba(187,247,208,.5)" stroke="rgba(21,128,61,.7)" stroke-width="1.8"/>';
                        s += '<ellipse cx="' + (scx + side * .12).toFixed(1) + '" cy="' + scy.toFixed(1) +
                            '" rx="' + (side * .3).toFixed(1) + '" ry="' + (side * .17).toFixed(1) +
                            '" fill="rgba(187,247,208,.5)" stroke="rgba(21,128,61,.7)" stroke-width="1.8"/>';
                        s += '<ellipse cx="' + scx.toFixed(1) + '" cy="' + scy.toFixed(1) + '" rx="' +
                            (side * .12).toFixed(1) + '" ry="' + (side * .08).toFixed(1) + '" fill="rgba(6,78,59,.55)"/>';
                    } else {
                        s += '<rect x="' + (px + j1).toFixed(1) + '" y="' + (py + j2).toFixed(1) + '" width="' +
                            (side - 4).toFixed(1) + '" height="' + (side - 4).toFixed(1) +
                            '" rx="14" fill="rgba(220,252,231,.3)" stroke="rgba(22,101,52,.45)" stroke-width="1.6"/>';
                    }
                }
            }
        }
        return s;
    }

    function buildFov() {
        var s = '<defs>' +
            '<clipPath id="fovClip"><circle cx="250" cy="250" r="238"/></clipPath>' +
            '<filter id="fovBlur" x="-20%" y="-20%" width="140%" height="140%">' +
            '<feGaussianBlur id="fovBlurNode" stdDeviation="0"/></filter>' +
            '<radialGradient id="fovShade" cx="50%" cy="46%" r="60%">' +
            '<stop offset="70%" stop-color="#000" stop-opacity="0"/>' +
            '<stop offset="100%" stop-color="#000" stop-opacity=".45"/></radialGradient>' +
            '</defs>';
        s += '<circle cx="250" cy="250" r="244" fill="#0c0f14"/>';
        s += '<g clip-path="url(#fovClip)">';
        s += '<rect x="0" y="0" width="500" height="500" fill="#f5f0e6"/>';
        s += '<g id="fovSpecimen" filter="url(#fovBlur)">' + specimenHtml(state.specimen) + '</g>';
        s += '<rect x="0" y="0" width="500" height="500" fill="url(#fovShade)" pointer-events="none"/>';
        s += '<circle id="fovDark" cx="250" cy="250" r="244" fill="#000" opacity="0" pointer-events="none"/>';
        s += '</g>';
        s += '<circle cx="250" cy="250" r="240" fill="none" stroke="rgba(0,0,0,.55)" stroke-width="8"/>';
        s += '<circle cx="250" cy="250" r="238" fill="none" stroke="rgba(255,255,255,.25)" stroke-width="1.5"/>';
        s += '<g id="crosshair" opacity=".35" pointer-events="none">' +
            '<line x1="250" y1="238" x2="250" y2="262" stroke="#334155" stroke-width="1.4"/>' +
            '<line x1="238" y1="250" x2="262" y2="250" stroke="#334155" stroke-width="1.4"/></g>';
        els.fov.innerHTML = s;
    }

    /* ---------- 状态计算 ---------- */

    function totalMag() { return state.eyepiece * state.objective; }

    function focusTarget() { return state.objective === 40 ? 70 : 62; }

    function effectivePos() { return state.coarse * 0.9 + state.fine * 0.1; }

    function blurAmount() {
        var dist = Math.abs(effectivePos() - focusTarget());
        return Math.min(6, dist * 0.32 * (state.objective === 40 ? 2.6 : 1));
    }

    function clarityPct() {
        var dist = Math.abs(effectivePos() - focusTarget());
        var cap = state.objective === 40 ? 5 : 12;
        return Math.max(0, Math.round(100 - (dist / cap) * 100));
    }

    function centerDist() {
        return Math.sqrt(state.offsetX * state.offsetX + state.offsetY * state.offsetY);
    }

    /* ---------- 主刷新 ---------- */

    function refresh(silent) {
        var mag = totalMag();
        var scale = mag / 100;

        els.fov.querySelector('#fovSpecimen').setAttribute('transform',
            'translate(' + (250 - state.offsetX * scale).toFixed(1) + ',' + (250 - state.offsetY * scale).toFixed(1) + ') scale(' + scale.toFixed(3) + ')');
        els.fov.querySelector('#fovBlurNode').setAttribute('stdDeviation', blurAmount().toFixed(2));
        els.fov.querySelector('#fovDark').setAttribute('opacity',
            Math.min(.82, (1 - state.light / 100) * .6 + (state.objective === 40 ? .22 : 0)).toFixed(2));

        els.magOut.textContent = mag + '×';
        els.clarityOut.textContent = clarityPct() + '%';
        els.coarseOut.textContent = state.coarse;
        els.fineOut.textContent = state.fine;
        els.lightOut.textContent = state.light;

        /* 玻片位置与镜筒示意 */
        var stageY = 96 + (1 - state.coarse / 100) * 10;
        var stageG = els.scheme.querySelector('#schemeStage');
        if (stageG) { stageG.setAttribute('transform', 'translate(0,' + ((state.coarse / 100) * 14 - 7).toFixed(1) + ')'); }
        var turretG = els.scheme.querySelector('#schemeTurret');
        if (turretG) {
            turretG.setAttribute('transform', state.objective === 40 ? 'rotate(-24 165 34)' : 'rotate(0 165 34)');
        }
        var knobLine = els.scheme.querySelector('#schemeKnob');
        if (knobLine) {
            var ang = state.coarse / 100 * 300 - 150;
            knobLine.setAttribute('transform', 'rotate(' + ang.toFixed(0) + ' 240 118)');
        }

        checkSteps(silent);
    }

    /* ---------- 引导步骤 ---------- */

    var STEPS = [
        { text: '选 10× 物镜，把反光镜亮度调到 60 以上', check: function () { return state.objective === 10 && state.light >= 60; } },
        { text: '调粗准焦，找到物像（清晰度 ≥ 70%）', check: function () { return clarityPct() >= 70; } },
        { text: '拖动玻片，把目标移到视野中央', check: function () { return centerDist() < 45; } },
        { text: '转换 40× 物镜', check: function () { return state.objective === 40; } },
        { text: '只用细准焦调清晰（清晰度 ≥ 95%）', check: function () { return state.objective === 40 && clarityPct() >= 95; } }
    ];

    function renderSteps() {
        var html = '';
        STEPS.forEach(function (st, i) {
            var done = state.stepsDone.indexOf(i) >= 0;
            html += '<li class="' + (done ? 'is-done' : '') + '">' +
                '<span class="microscopesi-dot">' + (done ? '✓' : (i + 1)) + '</span><span>' + st.text + '</span></li>';
        });
        els.steps.innerHTML = html;
    }

    function checkSteps(silent) {
        var newly = false;
        for (var i = 0; i < STEPS.length; i++) {
            if (state.stepsDone.indexOf(i) < 0 && STEPS[i].check()) {
                state.stepsDone.push(i);
                newly = true;
            }
        }
        if (newly) {
            renderSteps();
            if (!silent) { chrome.beep('tick'); }
            if (state.stepsDone.length === STEPS.length) {
                chrome.beep('win');
                chrome.toast('观察流程全部完成，了不起！');
                chrome.setStatus('观察完成', 'ok');
            }
        }
    }

    /* ---------- 示意图 ---------- */

    function buildScheme() {
        var s = '<g stroke-linecap="round">' +
            /* 镜座与镜臂 */
            '<rect x="70" y="128" width="150" height="10" rx="4" fill="var(--et-muted)" opacity=".5"/>' +
            '<path d="M 95 132 Q 88 80 108 52" fill="none" stroke="var(--et-muted)" stroke-width="7" opacity=".55"/>' +
            /* 镜筒 */
            '<rect x="150" y="6" width="30" height="34" rx="3" fill="var(--et-surface-2)" stroke="var(--et-line-strong)" stroke-width="1.5"/>' +
            '<text x="165" y="26" font-size="10" text-anchor="middle" fill="var(--et-muted)" font-weight="700">目镜</text>' +
            /* 转换器 + 物镜 */
            '<g id="schemeTurret">' +
            '<rect x="150" y="42" width="30" height="16" rx="3" fill="var(--et-accent)" opacity=".9"/>' +
            '<rect x="147" y="58" width="14" height="22" rx="2" fill="var(--et-surface-2)" stroke="var(--et-line-strong)"/>' +
            '<rect x="169" y="58" width="14" height="16" rx="2" fill="var(--et-surface-2)" stroke="var(--et-line-strong)" opacity=".45"/>' +
            '</g>' +
            /* 载物台 + 玻片 */
            '<g id="schemeStage">' +
            '<rect x="118" y="88" width="94" height="8" rx="2" fill="var(--et-surface-2)" stroke="var(--et-line-strong)" stroke-width="1.5"/>' +
            '<rect x="152" y="84" width="26" height="4" rx="1" fill="rgba(101,163,13,.7)"/>' +
            '</g>' +
            /* 反光镜 */
            '<ellipse cx="165" cy="112" rx="14" ry="5" fill="var(--et-surface-2)" stroke="var(--et-line-strong)" stroke-width="1.5"/>' +
            /* 粗准焦旋钮 */
            '<circle cx="240" cy="118" r="12" fill="var(--et-surface-2)" stroke="var(--et-line-strong)" stroke-width="2"/>' +
            '<line id="schemeKnob" x1="240" y1="108" x2="240" y2="113" stroke="var(--et-accent)" stroke-width="2.4"/>' +
            '<text x="240" y="144" font-size="9" text-anchor="middle" fill="var(--et-muted)">粗准焦</text>' +
            '</g>';
        els.scheme.innerHTML = s;
    }

    /* ---------- 控件 ---------- */

    function buildButtons() {
        OBJECTIVES.forEach(function (o) {
            var b = document.createElement('button');
            b.type = 'button';
            b.className = 'microscopesi-opt';
            b.innerHTML = o.label + '<small>物镜</small>';
            b.addEventListener('click', function () {
                if (state.objective === o.mag) { return; }
                state.objective = o.mag;
                if (o.mag === 40) {
                    chrome.toast('已换高倍镜：视野变暗、只能用细准焦', 'warn');
                    chrome.beep('tick');
                } else {
                    chrome.beep('tick');
                }
                save();
                syncButtons();
                refresh();
            });
            b.setAttribute('data-mag', o.mag);
            els.objectiveBtns.appendChild(b);
        });
        EYEPIECES.forEach(function (m) {
            var b = document.createElement('button');
            b.type = 'button';
            b.className = 'microscopesi-opt';
            b.innerHTML = m + '×<small>目镜</small>';
            b.addEventListener('click', function () {
                state.eyepiece = m;
                chrome.beep('tick');
                save();
                syncButtons();
                refresh();
            });
            b.setAttribute('data-mag', m);
            els.eyepieceBtns.appendChild(b);
        });
        SPECIMENS.forEach(function (sp) {
            var b = document.createElement('button');
            b.type = 'button';
            b.className = 'microscopesi-chip';
            b.textContent = sp.name;
            b.addEventListener('click', function () {
                if (state.specimen === sp.id) { return; }
                state.specimen = sp.id;
                state.offsetX = 0;
                state.offsetY = 0;
                chrome.beep('tick');
                save();
                syncButtons();
                buildFov();
                refresh();
            });
            b.setAttribute('data-id', sp.id);
            els.specChips.appendChild(b);
        });
        syncButtons();
    }

    function syncButtons() {
        var optBtns = els.objectiveBtns.children;
        for (var i = 0; i < optBtns.length; i++) {
            optBtns[i].classList.toggle('is-on', parseInt(optBtns[i].getAttribute('data-mag'), 10) === state.objective);
        }
        var eyeBtns = els.eyepieceBtns.children;
        for (i = 0; i < eyeBtns.length; i++) {
            eyeBtns[i].classList.toggle('is-on', parseInt(eyeBtns[i].getAttribute('data-mag'), 10) === state.eyepiece);
        }
        var chips = els.specChips.children;
        for (i = 0; i < chips.length; i++) {
            chips[i].classList.toggle('is-on', chips[i].getAttribute('data-id') === state.specimen);
        }
    }

    els.coarse.addEventListener('input', function () {
        state.coarse = clampInt(this.value, 0, 100);
        if (state.objective === 40 && !state.warned && state.coarse > 55) {
            state.warned = true;
            chrome.toast('高倍镜下禁止使用粗准焦螺旋！容易压碎玻片', 'warn');
            chrome.beep('err');
        }
        if (state.coarse <= 45) { state.warned = false; }
        save();
        refresh();
    });
    els.fine.addEventListener('input', function () {
        state.fine = clampInt(this.value, 0, 100);
        save();
        refresh();
    });
    els.light.addEventListener('input', function () {
        state.light = clampInt(this.value, 0, 100);
        save();
        refresh();
    });

    /* ---------- 视野拖动（倒像：玻片与像反向） ---------- */

    function fovPoint(ev) {
        var rect = els.fov.getBoundingClientRect();
        var scale = Math.min(rect.width, rect.height) / 500;
        var cx = rect.left + (rect.width - 500 * scale) / 2;
        var cy = rect.top + (rect.height - 500 * scale) / 2;
        return {
            x: (ev.clientX - cx) / scale,
            y: (ev.clientY - cy) / scale
        };
    }

    var dragging = false;
    var dragStart = null;

    els.fov.addEventListener('pointerdown', function (ev) {
        dragging = true;
        dragStart = { x: ev.clientX, y: ev.clientY, ox: state.offsetX, oy: state.offsetY };
        els.fov.setPointerCapture(ev.pointerId);
        ev.preventDefault();
    });
    els.fov.addEventListener('pointermove', function (ev) {
        if (!dragging) { return; }
        var rect = els.fov.getBoundingClientRect();
        var scale = Math.min(rect.width, rect.height) / 500;
        /* 倒像：物像移动方向与玻片相反，所以玻片坐标取反 */
        state.offsetX = clampRange(dragStart.ox - (ev.clientX - dragStart.x) / scale, -1100, 1100);
        state.offsetY = clampRange(dragStart.oy - (ev.clientY - dragStart.y) / scale, -1100, 1100);
        refresh();
    });
    function endDrag() {
        if (!dragging) { return; }
        dragging = false;
        save();
        refresh();
    }
    els.fov.addEventListener('pointerup', endDrag);
    els.fov.addEventListener('pointercancel', endDrag);

    function clampRange(v, lo, hi) { return Math.min(hi, Math.max(lo, v)); }

    /* ---------- 启动 ---------- */
    buildScheme();
    buildFov();
    buildButtons();
    renderSteps();
    refresh(true);
    chrome.setStatus('对光中', 'run');
})();
</script>

</body>
