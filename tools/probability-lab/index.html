/* ============ 设计令牌 ============ */
:root {
    --et-accent: #2563eb;
    --et-accent-weak: rgba(37, 99, 235, .14);
    --et-bg: #f4f6fb;
    --et-surface: #ffffff;
    --et-surface-2: #f8fafc;
    --et-fg: #0b1220;
    --et-muted: #64748b;
    --et-line: rgba(15, 23, 42, .12);
    --et-line-strong: rgba(15, 23, 42, .22);
    --et-glass: rgba(255, 255, 255, .85);
    --et-shadow-md: 0 10px 28px -18px rgba(15, 23, 42, .3);
    --et-shadow-lg: 0 24px 60px -32px rgba(15, 23, 42, .4);
    --et-ok: #059669;
    --et-warn: #d97706;
    --et-err: #dc2626;
    --et-radius: 12px;
    --et-radius-sm: 9px;
    --et-font: -apple-system, BlinkMacSystemFont, "Segoe UI",
               "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei",
               "Noto Sans SC", sans-serif;
    --et-mono: ui-monospace, "Cascadia Mono", Consolas, Menlo, monospace;
}

html[data-et-theme="dark"] {
    --et-bg: #0b1120;
    --et-surface: #111a2e;
    --et-surface-2: #0f1729;
    --et-fg: #f1f5f9;
    --et-muted: #94a3b8;
    --et-line: rgba(148, 163, 184, .18);
    --et-line-strong: rgba(148, 163, 184, .3);
    --et-glass: rgba(17, 26, 46, .85);
    --et-shadow-md: 0 10px 34px -18px rgba(0, 0, 0, .8);
    --et-shadow-lg: 0 24px 70px -30px rgba(0, 0, 0, .9);
    --et-ok: #34d399;
    --et-warn: #fbbf24;
    --et-err: #f87171;
}

/* ============ 基础 ============ */

/* body 作为外壳时必须清掉浏览器默认 8px 外边距，
   否则 iframe 预览中文档会比视口高 16px（底部白边 + 多余滚动） */
body.et-app {
    margin: 0;
}

.et-app {
    position: relative;
    isolation: isolate;
    display: flex;
    flex-direction: column;
    height: 100vh;
    height: 100dvh;
    overflow: hidden;
    background: var(--et-bg);
    color: var(--et-fg);
    font-family: var(--et-font);
    -webkit-font-smoothing: antialiased;
    transition: background .25s, color .25s;
}

/* 极光背景：径向渐变 + 呼吸动画（edupick 品质基线，老内核也不掉帧） */
.et-app::before {
    content: '';
    position: fixed;
    inset: 0;
    z-index: -1;
    pointer-events: none;
    background:
        radial-gradient(46% 40% at 20% 18%, var(--et-accent-weak), transparent 65%),
        radial-gradient(42% 38% at 82% 24%, var(--et-accent-weak), transparent 70%),
        radial-gradient(50% 44% at 55% 95%, rgba(16, 185, 129, .10), transparent 65%);
    animation: et-aurora 16s ease-in-out infinite alternate;
}

@keyframes et-aurora {
    from { opacity: .55; transform: scale(1); }
    to { opacity: 1; transform: scale(1.06); }
}

.et-app *,
.et-app *::before,
.et-app *::after { box-sizing: border-box; }

[hidden] { display: none !important; }

.et-icon {
    width: 18px;
    height: 18px;
    fill: none;
    stroke: currentColor;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
    flex: none;
}

/* ============ 顶栏 ============ */
.et-topbar {
    flex: none;
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 11px 20px;
    border-bottom: 1px solid var(--et-line);
    background: var(--et-glass);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    z-index: 20;
}

.et-brand {
    display: flex;
    align-items: center;
    gap: 10px;
    min-width: 0;
}

.et-brand__dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: var(--et-accent);
    box-shadow: 0 0 0 4px var(--et-accent-weak);
    flex: none;
}

.et-brand__name {
    font-weight: 800;
    font-size: 15px;
    letter-spacing: -.01em;
    white-space: nowrap;
}

.et-brand__sub {
    font-size: 12.5px;
    color: var(--et-muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.et-status {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 5px 14px;
    border-radius: 999px;
    font-size: 12.5px;
    color: var(--et-muted);
    background: var(--et-surface-2);
    border: 1px solid var(--et-line);
    white-space: nowrap;
    max-width: 42vw;
    overflow: hidden;
    text-overflow: ellipsis;
}

.et-status__dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--et-ok);
    flex: none;
    transition: background .2s;
}

.et-status[data-tone="err"] .et-status__dot { background: var(--et-err); }
.et-status[data-tone="warn"] .et-status__dot { background: var(--et-warn); }

.et-actions {
    display: flex;
    align-items: center;
    gap: 7px;
}

.et-icon-btn {
    display: inline-grid;
    place-items: center;
    width: 38px;
    height: 38px;
    font-size: 16px;
    line-height: 1;
    border-radius: 11px;
    border: 1px solid var(--et-line);
    background: var(--et-surface-2);
    color: var(--et-fg);
    cursor: pointer;
    transition: transform .14s, border-color .14s, color .14s, opacity .14s;
    -webkit-tap-highlight-color: transparent;
}

.et-icon-btn:hover {
    border-color: var(--et-accent);
    color: var(--et-accent);
    transform: translateY(-1px);
}

.et-icon-btn:active { transform: translateY(0); }
.et-icon-btn.is-off { opacity: .4; }
.et-icon-btn:focus-visible { outline: 2px solid var(--et-accent); outline-offset: 2px; }

/* ============ 主区默认 ============ */
.et-main {
    flex: 1;
    min-height: 0;
    position: relative;
    overflow: auto;
}

/* ============ 页脚（品牌回流 L2） ============ */
.et-footer {
    flex: none;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 7px 16px;
    font-size: 12px;
    color: var(--et-muted);
    border-top: 1px solid var(--et-line);
    background: var(--et-glass);
    user-select: none;
    z-index: 20;
}

.et-footer a {
    color: inherit;
    text-decoration: none;
    transition: color .14s;
}

.et-footer a:hover { color: var(--et-accent); }

/* ============ 按钮 ============ */
.et-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
    padding: 9px 16px;
    border-radius: 11px;
    font: inherit;
    font-size: 13.5px;
    font-weight: 700;
    border: 1px solid var(--et-line);
    background: var(--et-surface-2);
    color: var(--et-fg);
    cursor: pointer;
    transition: transform .14s, border-color .14s, color .14s, background .14s, box-shadow .14s;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
}

.et-btn:hover {
    border-color: var(--et-accent);
    color: var(--et-accent);
    transform: translateY(-1px);
}

.et-btn:active { transform: translateY(0); }
.et-btn:focus-visible { outline: 2px solid var(--et-accent); outline-offset: 2px; }
.et-btn:disabled { opacity: .45; cursor: not-allowed; transform: none; }

.et-btn--primary {
    background: var(--et-accent);
    border-color: var(--et-accent);
    color: #fff;
    box-shadow: 0 6px 18px -8px var(--et-accent);
}

.et-btn--primary:hover { color: #fff; filter: brightness(1.08); }
.et-btn--primary:disabled { filter: none; }

.et-btn--danger:hover {
    border-color: var(--et-err);
    color: var(--et-err);
}

.et-btn--lg {
    padding: 13px 26px;
    font-size: 16px;
    border-radius: 14px;
}

/* ============ 弹窗 ============ */
.et-modal {
    position: fixed;
    inset: 0;
    z-index: 100;
    display: grid;
    place-items: center;
    padding: 24px;
    background: rgba(2, 6, 23, .55);
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    animation: et-fade .18s ease;
}

.et-modal__panel {
    width: min(680px, 94vw);
    max-height: 86vh;
    max-height: 86dvh;
    display: flex;
    flex-direction: column;
    background: var(--et-surface);
    border: 1px solid var(--et-line);
    border-radius: 16px;
    box-shadow: var(--et-shadow-lg);
    animation: et-pop .2s cubic-bezier(.34, 1.4, .64, 1);
    overflow: hidden;
}

.et-modal__panel--narrow { width: min(460px, 92vw); }
.et-modal__panel--wide { width: min(900px, 94vw); }

.et-modal__head {
    flex: none;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 16px 20px;
    border-bottom: 1px solid var(--et-line);
    font-weight: 800;
    font-size: 15px;
}

.et-modal__head .et-icon-btn {
    margin-left: auto;
    width: 32px;
    height: 32px;
}

.et-modal__body {
    flex: 1;
    min-height: 0;
    overflow: auto;
    padding: 18px 20px;
}

.et-modal__foot {
    flex: none;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 14px 20px;
    border-top: 1px solid var(--et-line);
    background: var(--et-surface-2);
}

.et-modal__foot .spacer { flex: 1; }

@keyframes et-fade {
    from { opacity: 0; }
}

@keyframes et-pop {
    from { opacity: 0; transform: translateY(14px) scale(.97); }
}

/* ============ 轻提示（toast） ============ */
.et-toast {
    position: fixed;
    left: 50%;
    bottom: 56px;
    transform: translateX(-50%) translateY(10px);
    z-index: 120;
    display: flex;
    align-items: center;
    gap: 9px;
    max-width: min(520px, 88vw);
    padding: 11px 18px;
    border-radius: 12px;
    font-size: 13.5px;
    font-weight: 600;
    color: #fff;
    background: rgba(15, 23, 42, .92);
    border: 1px solid rgba(148, 163, 184, .25);
    box-shadow: var(--et-shadow-lg);
    opacity: 0;
    pointer-events: none;
    transition: opacity .22s, transform .22s;
}

.et-toast.is-show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
}

.et-toast[data-tone="ok"] { background: rgba(5, 150, 105, .95); }
.et-toast[data-tone="err"] { background: rgba(220, 38, 38, .95); }
.et-toast[data-tone="warn"] { background: rgba(217, 119, 6, .95); }

/* ============ 设置抽屉（右上角入口，edupick 交互） ============ */
.et-drawer-backdrop {
    position: fixed;
    inset: 0;
    z-index: 90;
    background: rgba(2, 6, 23, .45);
    backdrop-filter: blur(3px);
    -webkit-backdrop-filter: blur(3px);
    opacity: 0;
    transition: opacity .2s;
}

.et-drawer-backdrop.is-open { opacity: 1; }

.et-drawer {
    position: absolute;
    top: 0;
    right: 0;
    height: 100%;
    width: min(400px, 92vw);
    display: flex;
    flex-direction: column;
    background: var(--et-surface);
    border-left: 1px solid var(--et-line);
    box-shadow: var(--et-shadow-lg);
    transform: translateX(100%);
    transition: transform .22s cubic-bezier(.32, .72, .35, 1);
}

.et-drawer-backdrop.is-open .et-drawer { transform: translateX(0); }

.et-drawer__head {
    flex: none;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 15px 18px;
    border-bottom: 1px solid var(--et-line);
    font-weight: 800;
    font-size: 15px;
    color: var(--et-accent);
}

.et-drawer__head .et-icon-btn {
    margin-left: auto;
    width: 32px;
    height: 32px;
}

.et-drawer__body {
    flex: 1;
    min-height: 0;
    overflow: auto;
    padding: 16px 18px 24px;
}

/* 抽屉内容通用小节（工具复用） */
.et-drawer__body h4 {
    margin: 18px 0 8px;
    font-size: 12px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: .08em;
    color: var(--et-muted);
}

.et-drawer__body h4:first-child { margin-top: 0; }

.et-drawer__row {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
}

.et-drawer__tip {
    margin: 8px 0 0;
    font-size: 12px;
    line-height: 1.8;
    color: var(--et-muted);
}

.et-drawer__tip b { color: var(--et-fg); }

.et-drawer__input {
    flex: 1;
    min-width: 0;
    padding: 9px 12px;
    border: 1px solid var(--et-line-strong);
    border-radius: 9px;
    background: var(--et-surface-2);
    color: var(--et-fg);
    font: inherit;
    font-size: 13.5px;
    transition: border-color .14s, box-shadow .14s;
}

.et-drawer__input:focus {
    outline: none;
    border-color: var(--et-accent);
    box-shadow: 0 0 0 3px var(--et-accent-weak);
}

.et-drawer__switch {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 10px 0;
    border-bottom: 1px dashed var(--et-line);
    font-size: 13.5px;
    font-weight: 600;
    color: var(--et-fg);
    cursor: pointer;
    user-select: none;
}

.et-drawer__switch input {
    width: 17px;
    height: 17px;
    accent-color: var(--et-accent);
    cursor: pointer;
}
</style>

.probabilityl-stage {

        var gain = ctx.createGain();
        osc.type = type || 'triangle';
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(0, start);
        gain.gain.linearRampToValueAtTime(gainPeak, start + 0.012);
        gain.gain.exponentialRampToValueAtTime(0.0001, start + dur);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(start);
        osc.stop(start + dur + 0.05);
    }

    var BEEPS = {
        tick: [[880, 0, 0.06, 0.42]],
        ok: [[660, 0, 0.1, 0.46], [880, 0.1, 0.14, 0.46]],
        win: [[523.25, 0, 0.16, 0.5], [659.25, 0.12, 0.16, 0.5], [783.99, 0.24, 0.16, 0.5], [1046.5, 0.36, 0.34, 0.52]],
        err: [[220, 0, 0.22, 0.46, 'square']],
        over: [[880, 0, 0.18, 0.5], [659.25, 0.2, 0.18, 0.5], [523.25, 0.4, 0.36, 0.5]]
    };

    function playBeep(kind) {
        var ctx = ensureCtx();
        if (!ctx || !BEEPS[kind]) { return; }
        var seq = BEEPS[kind];
        var t0 = ctx.currentTime + 0.01;
        for (var i = 0; i < seq.length; i++) {
            tone(ctx, seq[i][0], t0 + seq[i][1], seq[i][2], seq[i][3] * MASTER_GAIN, seq[i][4]);

            backdrop.classList.remove('is-open');

                btn.type = 'button';
                btn.addEventListener('click', function () {
                    if (b.onClick) { b.onClick(close); } else { close(); }
                });
                foot.appendChild(btn);
            });

        }

        backdrop.appendChild(panel);
        document.body.appendChild(backdrop);

        function close() {
            if (backdrop.parentNode) { backdrop.parentNode.removeChild(backdrop); }

    /* ---------- PWA 元数据（blob manifest，环境不支持时静默跳过） ---------- */

        /* 状态胶囊 */

            soundBtn.title = soundEnabled ? '关闭音效' : '开启音效';

        function inIframe() {
            try { return global.parent && global.parent !== global; } catch (err) { return true; }
        }

        function toggleFullscreen() {
            var root = document.documentElement;
            var fsEl = document.fullscreenElement || document.webkitFullscreenElement || null;
            if (fsEl) {

            } else {
                var req = root.requestFullscreen || root.webkitRequestFullscreen;
                if (req) { try { req.call(root); } catch (err) { /* 忽略 */ } }
            }
        }

        function syncFsIcon(on) {

            fsBtn.appendChild(makeIcon(on ? 'i-minimize' : 'i-maximize'));

        document.addEventListener('fullscreenchange', function () {

        });
        document.addEventListener('webkitfullscreenchange', function () {

        });
        syncFsIcon(false);

        api.toggleFullscreen = toggleFullscreen;

        api.beep = function (kind) {

        api.openHelp = openHelp;

        /* ---------- toast ---------- */
        api.toast = toast;

        /* ---------- 页脚（L2 品牌回流，低调一行） ---------- */
        var siteOrigin = typeof global.ET_SITE_ORIGIN === 'string' && /^https?:\/\//.test(global.ET_SITE_ORIGIN)
            ? global.ET_SITE_ORIGIN

        function renderFooter() {

            footer.appendChild(el('span', null, 'KeeTools 课工具'));

        try {

<script>
  /* 此块由 scripts/sync_shared.py 自动注入，请勿手工修改 */
/*!
 * et-stats.js — 使用统计模块（模块化，可整体移除）
 *
 * 共享逻辑源。改这里，然后跑：python scripts/sync_shared.py
 * 依赖：无（可脱离 et-util / et-chrome 独立运行）。
 * 全局：ET.Stats
 *
 * ┌────────────────────────────────────────────────────────────────┐
 * │ 说明：本模块只做一件事——工具被打开时向上报端点发一条匿名计数。 │
 * │ · 在线（iframe 内）：宿主页面已服务端计数，本模块不重复上报。   │
 * │ · 离线打开（file:// / 下载单文件 / 离线包）：联网条件具备时，   │
 * │   以 sendBeacon 上报 use_offline 事件（text/plain 免预检）。    │
 * │ · 上报端点 = window.ET_SITE_ORIGIN（由宿主注入或离线包配置）。  │
 * │   未配置端点时本模块完全静默，不发任何请求。                    │
 * │ · **整个 <script> 块可安全删除**：删除后工具其余功能完全正常，  │
 * │   且完全不再发起任何网络请求。                                  │
 * └────────────────────────────────────────────────────────────────┘
 */
(function (global) {
    'use strict';

    var ET = global.ET = global.ET || {};

    var Stats = {
        /** 上报端点来源（站点绝对地址，无协议尾斜杠） */
        endpoint: (typeof global.ET_SITE_ORIGIN === 'string' && /^https?:\/\//.test(global.ET_SITE_ORIGIN))
            ? global.ET_SITE_ORIGIN
            : null,

        _done: {},

        /**
         * 上报一次事件（同一事件同一工具每次页面加载只报一次）。
         * event: 'use_offline' 等；toolId: 工具 id。
         */
        send: function (event, toolId) {
            if (!event || this._done[event + ':' + (toolId || '')]) { return false; }
            if (!this.endpoint) { return false; }
            /* iframe 内由宿主统计，避免双计 */
            try {
                if (global.parent && global.parent !== global) { return false; }
            } catch (err) { return false; }
            /* 断网时挂起，网络恢复自动补报一次 */
            if (global.navigator && global.navigator.onLine === false) {
                var self = this;
                global.addEventListener('online', function () { self.send(event, toolId); }, { once: true });
                return false;
            }

            this._done[event + ':' + (toolId || '')] = true;
            var payload = JSON.stringify({ event: event, tool: toolId || '' });

            try {
                if (global.navigator.sendBeacon) {
                    return global.navigator.sendBeacon(
                        this.endpoint + '/api/track',
                        new Blob([payload], { type: 'text/plain;charset=UTF-8' })
                    );
                }
                global.fetch(this.endpoint + '/api/track', {
                    method: 'POST',
                    body: payload,
                    keepalive: true,
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'text/plain;charset=UTF-8' }
                });
                return true;
            } catch (err) {
                return false;
            }
        }
    };

    ET.Stats = Stats;
})(window);
</script>

        chart: ET.el('plChart'),
        legend: ET.el('plLegend'),
        dev: ET.el('plDev')
    };

    /* ── 当前实验定义 ── */

    function kindSize() { return state.kind === 'coin' ? 2 : 6; }

    function kindNames() {
        if (state.kind === 'coin') { return ['正面', '反面']; }
        return ['1 点', '2 点', '3 点', '4 点', '5 点', '6 点'];
    }

    function kindProbs() {
        var n = kindSize();
        var p = 1 / n;
        var out = [];
        for (var i = 0; i < n; i++) { out.push(p); }
        return out;
    }

    function isTypingTarget(node) {
        if (!node || !node.tagName) { return false; }
        var tag = node.tagName.toUpperCase();
        return tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT' || node.isContentEditable === true;
    }

    function setBtnText(btn, text) {
        var sp = btn.querySelector('span');
        if (sp) { sp.textContent = text; } else { btn.textContent = text; }
    }

    /* ── 统计 ── */

    function resetStats() {
        if (animating) { return; }
        var n = kindSize();
        state.counts = [];
        for (var i = 0; i < n; i++) { state.counts.push(0); }
        state.series = [];
        state.total = 0;
        state.spin = 0;
        if (els.coin) { els.coin.style.transform = 'rotateY(0deg)'; }
        paintDie(1);
        els.result.textContent = '点击「' + (state.kind === 'coin' ? '抛' : '掷')
            + ' 1 次」或按空格开始实验';
        renderAll();
    }

    function commit(idx) {
        state.counts[idx] = (state.counts[idx] || 0) + 1;
        state.series.push(idx);
        state.total++;
    }

    function showResult(idx) {
        els.result.innerHTML = '本次结果：<b>' + ET.escapeHtml(kindNames()[idx]) + '</b>';
    }

    /* ── 动画 ── */

    function setBusy(on) {
        els.once.disabled = on;
        els.b10.disabled = on;
        els.b100.disabled = on;
        els.b1000.disabled = on;
    }

    function spinCoin(idx) {
        state.spin += 3;
        els.coin.style.transform = 'rotateY(' + (state.spin * 360 + (idx === 1 ? 180 : 0)) + 'deg)';
    }

    function paintDie(face) {
        var on = PIPS[face] || [];
        var dots = ET.qsa('i', els.die);
        for (var i = 0; i < dots.length; i++) {
            var hit = false;
            for (var j = 0; j < on.length; j++) {
                if (on[j] === i) { hit = true; break; }
            }
            dots[i].classList.toggle('is-on', hit);
        }
    }

    function rollDie(idx) {
        els.die.classList.remove('is-rolling');
        void els.die.offsetWidth;
        els.die.classList.add('is-rolling');
        var timer = setInterval(function () {
            paintDie(Math.floor(Math.random() * 6) + 1);
        }, 60);
        setTimeout(function () {
            clearInterval(timer);
            paintDie(idx + 1);
            els.die.classList.remove('is-rolling');
        }, 480);
    }

    function pulse() {
        els.stage.classList.remove('is-pulse');
        void els.stage.offsetWidth;
        els.stage.classList.add('is-pulse');
        setTimeout(function () { els.stage.classList.remove('is-pulse'); }, 300);
    }

    /* ── 实验 ── */

    function doOne() {
        if (animating) { return; }
        var idx = Math.floor(Math.random() * kindSize());

        if (!state.animate) {
            commit(idx);
            if (state.kind === 'coin') { spinCoin(idx); } else { paintDie(idx + 1); }
            showResult(idx);
            renderAll();
            chrome.beep('tick');
            return;
        }

        animating = true;
        setBusy(true);
        if (state.kind === 'coin') { spinCoin(idx); } else { rollDie(idx); }
        setTimeout(function () {
            animating = false;
            setBusy(false);
            commit(idx);
            showResult(idx);
            renderAll();
            chrome.beep('tick');
        }, 520);
    }

    function runBatch(n) {
        if (animating) { return; }
        var room = MAX_TRIALS - state.total;
        if (room <= 0) {
            chrome.toast('已达 ' + MAX_TRIALS + ' 次上限，请先重置', 'warn');
            return;
        }
        if (n > room) { n = room; }
        var k = kindSize();
        var last = 0;
        for (var i = 0; i < n; i++) {
            var idx = Math.floor(Math.random() * k);
            state.counts[idx]++;
            state.series.push(idx);
            last = idx;
        }
        state.total += n;
        if (state.kind === 'coin') { spinCoin(last); } else { paintDie(last + 1); }
        showResult(last);
        pulse();
        renderAll();
        chrome.beep(n >= 1000 ? 'ok' : 'tick');
    }

    function setKind(k) {
        if (state.kind === k) { return; }
        state.kind = k;
        store.set('kind', k);
        resetStats();
        chrome.toast(k === 'coin' ? '已切换到抛硬币' : '已切换到掷骰子');
    }

    /* ── 渲染：标签 / 统计表 / 图例 ── */

    function renderTabs() {
        var coin = state.kind === 'coin';
        els.tabCoin.classList.toggle('is-active', coin);
        els.tabDice.classList.toggle('is-active', !coin);
        var v = coin ? '抛' : '掷';
        setBtnText(els.once, v + ' 1 次');
        setBtnText(els.b10, v + ' 10 次');
        setBtnText(els.b100, v + ' 100 次');
        setBtnText(els.b1000, v + ' 1000 次');
        els.coin.hidden = !coin;
        els.die.hidden = coin;
    }

    function renderStats() {
        var names = kindNames();
        var probs = kindProbs();
        var html = '<thead><tr><th>结果</th><th>次数</th><th>频率</th><th>理论概率</th><th>偏差</th></tr></thead><tbody>';
        for (var i = 0; i < names.length; i++) {
            var c = state.counts[i] || 0;
            var f = state.total ? c / state.total : 0;
            var d = f - probs[i];
            html += '<tr>'
                + '<td><span class="probabilityl-dot" style="background:' + COLORS[i % COLORS.length] + '"></span>'
                + ET.escapeHtml(names[i]) + '</td>'
                + '<td class="probabilityl-num">' + c + '</td>'
                + '<td class="probabilityl-num">' + f.toFixed(4) + '</td>'
                + '<td class="probabilityl-num">' + probs[i].toFixed(4) + '</td>'
                + '<td class="probabilityl-num">' + (d >= 0 ? '+' : '-') + Math.abs(d).toFixed(4) + '</td>'
                + '</tr>';
        }
        els.table.innerHTML = html + '</tbody>';
    }

    function maxDeviation() {
        if (!state.total) { return null; }
        var probs = kindProbs();
        var max = 0;
        for (var i = 0; i < probs.length; i++) {
            var f = (state.counts[i] || 0) / state.total;
            var d = Math.abs(f - probs[i]);
            if (d > max) { max = d; }
        }
        return max;
    }

    function renderLegend() {
        var names = kindNames();
        var probs = kindProbs();
        var html = '';
        for (var i = 0; i < names.length; i++) {
            html += '<span><i style="background:' + COLORS[i % COLORS.length] + '"></i>'
                + ET.escapeHtml(names[i]) + '（理论 ' + probs[i].toFixed(3) + '）</span>';
        }
        if (state.showTheory) {
            html += '<span><i class="probabilityl-legend__dash"></i>理论概率虚线</span>';
        }
        els.legend.innerHTML = html;
    }

    /* ── 渲染：曲线 ── */

    /** 采样点：最多 maxPts 个，频率用全量数据计算 */
    function sampleRows(maxPts) {
        var N = state.total;
        var k = kindSize();
        if (!N) { return []; }

        var idxs = [];
        if (N <= maxPts) {
            for (var i = 1; i <= N; i++) { idxs.push(i); }
        } else {
            for (var j = 0; j < maxPts; j++) {
                var v = Math.round(1 + j * (N - 1) / (maxPts - 1));
                if (!idxs.length || idxs[idxs.length - 1] !== v) { idxs.push(v); }
            }
            if (idxs[idxs.length - 1] !== N) { idxs.push(N); }
        }

        var counts = [];
        for (var c = 0; c < k; c++) { counts.push(0); }
        var rows = [];
        var ptr = 0;
        for (var t = 1; t <= N; t++) {
            counts[state.series[t - 1]]++;
            if (ptr < idxs.length && idxs[ptr] === t) {
                var f = [];
                for (var c2 = 0; c2 < k; c2++) { f.push(counts[c2] / t); }
                rows.push({ n: t, f: f });
                ptr++;
            }
        }
        return rows;
    }

    function xTicks(N) {
        if (N <= 0) { return [0]; }
        var out = [];
        var seen = {};
        for (var i = 0; i <= 4; i++) {
            var v = Math.round(N * i / 4);
            if (!seen[v]) { seen[v] = 1; out.push(v); }
        }
        return out;
    }

    function renderChart() {
        var W = 1000, H = 360;
        var padL = 68, padR = 24, padT = 20, padB = 46;
        var iw = W - padL - padR;
        var ih = H - padT - padB;
        var N = state.total;
        var k = kindSize();
        var probs = kindProbs();

        function px(n) { return N > 0 ? padL + (n / N) * iw : padL; }
        function py(f) { return padT + ih - f * ih; }

        var s = [];

        /* 横向网格 + 纵轴刻度 */
        var yt = [0, 0.25, 0.5, 0.75, 1];
        for (var y = 0; y < yt.length; y++) {
            var gy = py(yt[y]);
            s.push('<line x1="' + padL + '" y1="' + gy + '" x2="' + (padL + iw) + '" y2="' + gy
                + '" stroke="var(--et-line)" stroke-width="1"/>');
            s.push('<text x="' + (padL - 12) + '" y="' + (gy + 5) + '" text-anchor="end" font-size="13"'
                + ' fill="var(--et-muted)">' + yt[y].toFixed(2) + '</text>');
        }

        /* 坐标轴 */
        s.push('<line x1="' + padL + '" y1="' + padT + '" x2="' + padL + '" y2="' + (padT + ih)
            + '" stroke="var(--et-line-strong)" stroke-width="1.5"/>');
        s.push('<line x1="' + padL + '" y1="' + (padT + ih) + '" x2="' + (padL + iw) + '" y2="' + (padT + ih)
            + '" stroke="var(--et-line-strong)" stroke-width="1.5"/>');

        /* 横轴刻度 */
        var xt = xTicks(N);
        for (var t = 0; t < xt.length; t++) {
            var gx = px(xt[t]);
            s.push('<line x1="' + gx + '" y1="' + (padT + ih) + '" x2="' + gx + '" y2="' + (padT + ih + 6)
                + '" stroke="var(--et-line-strong)" stroke-width="1.5"/>');
            s.push('<text x="' + gx + '" y="' + (padT + ih + 25) + '" text-anchor="middle" font-size="13"'
                + ' fill="var(--et-muted)">' + xt[t] + '</text>');
        }
        s.push('<text x="' + padL + '" y="' + (padT - 6) + '" font-size="12" fill="var(--et-muted)">频率</text>');
        s.push('<text x="' + (padL + iw) + '" y="' + (H - 8) + '" text-anchor="end" font-size="12"'
            + ' fill="var(--et-muted)">实验次数</text>');

        /* 理论概率虚线 */
        if (state.showTheory) {
            for (var p = 0; p < k; p++) {
                var ty = py(probs[p]);
                s.push('<line x1="' + padL + '" y1="' + ty + '" x2="' + (padL + iw) + '" y2="' + ty
                    + '" stroke="' + COLORS[p % COLORS.length] + '" stroke-width="1.5"'
                    + ' stroke-dasharray="7 6" opacity=".5"/>');
            }
        }

        /* 频率折线 */
        var rows = sampleRows(state.samples);
        for (var c = 0; c < k; c++) {
            if (!rows.length) { break; }
            var col = COLORS[c % COLORS.length];
            if (rows.length === 1) {
                s.push('<circle cx="' + px(rows[0].n).toFixed(1) + '" cy="' + py(rows[0].f[c]).toFixed(1)
                    + '" r="3.5" fill="' + col + '"/>');
                continue;
            }
            var pts = [];
            for (var r = 0; r < rows.length; r++) {
                pts.push(px(rows[r].n).toFixed(1) + ',' + py(rows[r].f[c]).toFixed(1));
            }
            s.push('<polyline points="' + pts.join(' ') + '" fill="none" stroke="' + col
                + '" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>');
        }

        els.chart.innerHTML = s.join('');
    }

    function renderAll() {
        renderTabs();
        renderStats();
        renderLegend();
        renderChart();
        var dev = maxDeviation();
        els.dev.textContent = '当前最大偏差：' + (dev === null ? '—' : dev.toFixed(4));
        if (!state.total) {
            chrome.setStatus('待开始实验', 'warn');
        } else if (dev !== null && dev <= 0.02) {
            chrome.setStatus('共 ' + state.total + ' 次 · 已很接近理论值', 'ok');
        } else {
            chrome.setStatus('共 ' + state.total + ' 次', 'ok');
        }
    }

    /* ── 设置抽屉 ── */

    function buildSettings(body) {
        var coin = state.kind === 'coin';
        body.innerHTML =
            '<h4>实验类型</h4>' +
            '<div class="et-drawer__row">' +
                '<button class="et-btn' + (coin ? ' et-btn--primary' : '') + '" id="plSetCoin" type="button">抛硬币</button>' +
                '<button class="et-btn' + (coin ? '' : ' et-btn--primary') + '" id="plSetDice" type="button">掷骰子</button>' +
            '</div>' +
            '<p class="et-drawer__tip">切换类型会清空当前统计与曲线。</p>' +
            '<h4>显示</h4>' +
            '<label class="et-drawer__switch"><span>显示理论概率虚线</span>' +
                '<input type="checkbox" id="plSetTheory"' + (state.showTheory ? ' checked' : '') + '></label>' +
            '<label class="et-drawer__switch"><span>显示动画</span>' +
                '<input type="checkbox" id="plSetAnim"' + (state.animate ? ' checked' : '') + '></label>' +
            '<h4>曲线采样点数</h4>' +
            '<select class="et-drawer__input" id="plSetSamples">' +
                '<option value="60">少（最多 60 个点）</option>' +
                '<option value="120">中（最多 120 个点）</option>' +
                '<option value="200">多（最多 200 个点）</option>' +
            '</select>' +
            '<p class="et-drawer__tip">采样只影响曲线画点数量，频率始终按<b>全量数据</b>计算。</p>' +
            '<h4>统计</h4>' +
            '<div class="et-drawer__row">' +
                '<button class="et-btn et-btn--danger" id="plSetReset" type="button">重置统计</button>' +
            '</div>' +
            '<p class="et-drawer__tip">当前共 <b>' + state.total + '</b> 次实验；上限 ' + MAX_TRIALS + ' 次。</p>';

        var q = function (id) { return body.querySelector('#' + id); };

        q('plSetCoin').addEventListener('click', function () {
            setKind('coin');
            buildSettings(body);
        });
        q('plSetDice').addEventListener('click', function () {
            setKind('dice');
            buildSettings(body);
        });
        q('plSetTheory').addEventListener('change', function (e) {
            state.showTheory = e.target.checked;
            store.set('showTheory', state.showTheory);
            renderAll();
            chrome.toast(state.showTheory ? '已显示理论概率虚线' : '已隐藏理论概率虚线');
        });
        q('plSetAnim').addEventListener('change', function (e) {
            state.animate = e.target.checked;
            store.set('animate', state.animate);
            chrome.toast(state.animate ? '已开启动画' : '已关闭动画');
        });
        var sel = q('plSetSamples');
        sel.value = String(state.samples);
        sel.addEventListener('change', function (e) {
            state.samples = parseInt(e.target.value, 10) || 120;
            store.set('samples', state.samples);
            renderChart();
            chrome.toast('采样点数：' + state.samples);
        });
        q('plSetReset').addEventListener('click', function () {
            resetStats();
            buildSettings(body);
            chrome.toast('统计已重置');
        });
    }

    /* ── 事件绑定 ── */

    els.tabCoin.addEventListener('click', function () { setKind('coin'); });
    els.tabDice.addEventListener('click', function () { setKind('dice'); });
    els.once.addEventListener('click', doOne);
    els.b10.addEventListener('click', function () { runBatch(10); });
    els.b100.addEventListener('click', function () { runBatch(100); });
    els.b1000.addEventListener('click', function () { runBatch(1000); });
    els.reset.addEventListener('click', resetStats);

    document.addEventListener('keydown', function (e) {
        if (isTypingTarget(e.target)) { return; }
        if (document.querySelector('.et-modal, .et-drawer-backdrop')) { return; }

        if (e.code === 'Space' || e.key === ' ') {
            e.preventDefault();
            if (e.target && typeof e.target.blur === 'function') { e.target.blur(); }
            doOne();
        } else if (e.key === 'ArrowRight') {
            e.preventDefault();
            setKind(state.kind === 'coin' ? 'dice' : 'coin');
        } else if (e.key === 'ArrowLeft') {
            e.preventDefault();
            setKind(state.kind === 'coin' ? 'dice' : 'coin');
        }
    });

    /* ── 初始化（统计与曲线不跨刷新保留） ── */

    state.kind = store.get('kind', 'coin') === 'dice' ? 'dice' : 'coin';
    state.showTheory = store.get('showTheory', true) !== false;
    state.animate = store.get('animate', true) !== false;
    var savedSamples = parseInt(store.get('samples', 120), 10);
    state.samples = (savedSamples === 60 || savedSamples === 200) ? savedSamples : 120;

    resetStats();
})();
</script>

</body>
</html>
