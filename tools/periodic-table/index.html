/*!
 * et-chrome.css — 工具通用外壳样式（顶栏 / 页脚 / 弹窗 / 按钮 / 主题）
 *
 * 共享样式源。改这里，然后跑：python scripts/sync_shared.py

 * 依赖：无外部资源；颜色全部为令牌变量。
 */

/* ============ 设计令牌 ============ */
:root {
    --et-accent: #2563eb;
    --et-accent-weak: rgba(37, 99, 235, .14);
    --et-bg: #f4f6fb;
    --et-surface: #ffffff;
    --et-surface-2: #f8fafc;
    --et-fg: #0b1220;
    --et-muted: #64748b;
    --et-line: rgba(15, 23, 42, .12);
    --et-line-strong: rgba(15, 23, 42, .22);
    --et-glass: rgba(255, 255, 255, .85);
    --et-shadow-md: 0 10px 28px -18px rgba(15, 23, 42, .3);
    --et-shadow-lg: 0 24px 60px -32px rgba(15, 23, 42, .4);
    --et-ok: #059669;
    --et-warn: #d97706;
    --et-err: #dc2626;
    --et-radius: 12px;
    --et-radius-sm: 9px;
    --et-font: -apple-system, BlinkMacSystemFont, "Segoe UI",
               "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei",
               "Noto Sans SC", sans-serif;
    --et-mono: ui-monospace, "Cascadia Mono", Consolas, Menlo, monospace;
}

html[data-et-theme="dark"] {
    --et-bg: #0b1120;
    --et-surface: #111a2e;
    --et-surface-2: #0f1729;
    --et-fg: #f1f5f9;
    --et-muted: #94a3b8;
    --et-line: rgba(148, 163, 184, .18);
    --et-line-strong: rgba(148, 163, 184, .3);
    --et-glass: rgba(17, 26, 46, .85);
    --et-shadow-md: 0 10px 34px -18px rgba(0, 0, 0, .8);
    --et-shadow-lg: 0 24px 70px -30px rgba(0, 0, 0, .9);
    --et-ok: #34d399;
    --et-warn: #fbbf24;
    --et-err: #f87171;
}

/* ============ 基础 ============ */
.et-app {
    position: relative;
    isolation: isolate;
    display: flex;
    flex-direction: column;
    height: 100vh;
    height: 100dvh;
    overflow: hidden;
    background: var(--et-bg);
    color: var(--et-fg);
    font-family: var(--et-font);
    -webkit-font-smoothing: antialiased;
    transition: background .25s, color .25s;
}

/* 极光背景：径向渐变 + 呼吸动画（edupick 品质基线，老内核也不掉帧） */
.et-app::before {
    content: '';
    position: fixed;
    inset: 0;
    z-index: -1;
    pointer-events: none;
    background:
        radial-gradient(46% 40% at 20% 18%, var(--et-accent-weak), transparent 65%),
        radial-gradient(42% 38% at 82% 24%, var(--et-accent-weak), transparent 70%),
        radial-gradient(50% 44% at 55% 95%, rgba(16, 185, 129, .10), transparent 65%);
    animation: et-aurora 16s ease-in-out infinite alternate;
}

@keyframes et-aurora {
    from { opacity: .55; transform: scale(1); }
    to { opacity: 1; transform: scale(1.06); }
}

.et-app *,
.et-app *::before,
.et-app *::after { box-sizing: border-box; }

[hidden] { display: none !important; }

.et-icon {
    width: 18px;
    height: 18px;
    fill: none;
    stroke: currentColor;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
    flex: none;
}

/* ============ 顶栏 ============ */
.et-topbar {
    flex: none;
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 11px 20px;
    border-bottom: 1px solid var(--et-line);
    background: var(--et-glass);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    z-index: 20;
}

.et-brand {
    display: flex;
    align-items: center;
    gap: 10px;
    min-width: 0;
}

.et-brand__dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: var(--et-accent);
    box-shadow: 0 0 0 4px var(--et-accent-weak);
    flex: none;
}

.et-brand__name {
    font-weight: 800;
    font-size: 15px;
    letter-spacing: -.01em;
    white-space: nowrap;
}

.et-brand__sub {
    font-size: 12.5px;
    color: var(--et-muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.et-status {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 5px 14px;
    border-radius: 999px;
    font-size: 12.5px;
    color: var(--et-muted);
    background: var(--et-surface-2);
    border: 1px solid var(--et-line);
    white-space: nowrap;
    max-width: 42vw;
    overflow: hidden;
    text-overflow: ellipsis;
}

.et-status__dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--et-ok);
    flex: none;
    transition: background .2s;
}

.et-status[data-tone="err"] .et-status__dot { background: var(--et-err); }
.et-status[data-tone="warn"] .et-status__dot { background: var(--et-warn); }

.et-actions {
    display: flex;
    align-items: center;
    gap: 7px;
}

.et-icon-btn {
    display: inline-grid;
    place-items: center;
    width: 38px;
    height: 38px;
    font-size: 16px;
    line-height: 1;
    border-radius: 11px;
    border: 1px solid var(--et-line);
    background: var(--et-surface-2);
    color: var(--et-fg);
    cursor: pointer;
    transition: transform .14s, border-color .14s, color .14s, opacity .14s;
    -webkit-tap-highlight-color: transparent;
}

.et-icon-btn:hover {
    border-color: var(--et-accent);
    color: var(--et-accent);
    transform: translateY(-1px);
}

.et-icon-btn:active { transform: translateY(0); }
.et-icon-btn.is-off { opacity: .4; }
.et-icon-btn:focus-visible { outline: 2px solid var(--et-accent); outline-offset: 2px; }

/* ============ 主区默认 ============ */
.et-main {
    flex: 1;
    min-height: 0;
    position: relative;
    overflow: auto;
}

/* ============ 页脚（品牌回流 L2） ============ */
.et-footer {
    flex: none;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 7px 16px;
    font-size: 12px;
    color: var(--et-muted);
    border-top: 1px solid var(--et-line);
    background: var(--et-glass);
    user-select: none;
    z-index: 20;
}

.et-footer a {
    color: inherit;
    text-decoration: none;
    transition: color .14s;
}

.et-footer a:hover { color: var(--et-accent); }

/* ============ 按钮 ============ */
.et-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
    padding: 9px 16px;
    border-radius: 11px;
    font: inherit;
    font-size: 13.5px;
    font-weight: 700;
    border: 1px solid var(--et-line);
    background: var(--et-surface-2);
    color: var(--et-fg);
    cursor: pointer;
    transition: transform .14s, border-color .14s, color .14s, background .14s, box-shadow .14s;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
}

.et-btn:hover {
    border-color: var(--et-accent);
    color: var(--et-accent);
    transform: translateY(-1px);
}

.et-btn:active { transform: translateY(0); }
.et-btn:focus-visible { outline: 2px solid var(--et-accent); outline-offset: 2px; }
.et-btn:disabled { opacity: .45; cursor: not-allowed; transform: none; }

.et-btn--primary {
    background: var(--et-accent);
    border-color: var(--et-accent);
    color: #fff;
    box-shadow: 0 6px 18px -8px var(--et-accent);
}

.et-btn--primary:hover { color: #fff; filter: brightness(1.08); }
.et-btn--primary:disabled { filter: none; }

.et-btn--danger:hover {
    border-color: var(--et-err);
    color: var(--et-err);
}

.et-btn--lg {
    padding: 13px 26px;
    font-size: 16px;
    border-radius: 14px;
}

/* ============ 弹窗 ============ */
.et-modal {
    position: fixed;
    inset: 0;
    z-index: 100;
    display: grid;
    place-items: center;
    padding: 24px;
    background: rgba(2, 6, 23, .55);
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    animation: et-fade .18s ease;
}

.et-modal__panel {
    width: min(680px, 94vw);
    max-height: 86vh;
    max-height: 86dvh;
    display: flex;
    flex-direction: column;
    background: var(--et-surface);
    border: 1px solid var(--et-line);
    border-radius: 16px;
    box-shadow: var(--et-shadow-lg);
    animation: et-pop .2s cubic-bezier(.34, 1.4, .64, 1);
    overflow: hidden;
}

.et-modal__panel--narrow { width: min(460px, 92vw); }
.et-modal__panel--wide { width: min(900px, 94vw); }

.et-modal__head {
    flex: none;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 16px 20px;
    border-bottom: 1px solid var(--et-line);
    font-weight: 800;
    font-size: 15px;
}

.et-modal__head .et-icon-btn {
    margin-left: auto;
    width: 32px;
    height: 32px;
}

.et-modal__body {
    flex: 1;
    min-height: 0;
    overflow: auto;
    padding: 18px 20px;
}

.et-modal__foot {
    flex: none;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 14px 20px;
    border-top: 1px solid var(--et-line);
    background: var(--et-surface-2);
}

.et-modal__foot .spacer { flex: 1; }

@keyframes et-fade {
    from { opacity: 0; }
}

@keyframes et-pop {
    from { opacity: 0; transform: translateY(14px) scale(.97); }
}

/* ============ 轻提示（toast） ============ */
.et-toast {
    position: fixed;
    left: 50%;
    bottom: 56px;
    transform: translateX(-50%) translateY(10px);
    z-index: 120;
    display: flex;
    align-items: center;
    gap: 9px;
    max-width: min(520px, 88vw);
    padding: 11px 18px;
    border-radius: 12px;
    font-size: 13.5px;
    font-weight: 600;
    color: #fff;
    background: rgba(15, 23, 42, .92);
    border: 1px solid rgba(148, 163, 184, .25);
    box-shadow: var(--et-shadow-lg);
    opacity: 0;
    pointer-events: none;
    transition: opacity .22s, transform .22s;
}

.et-toast.is-show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
}

.et-toast[data-tone="ok"] { background: rgba(5, 150, 105, .95); }
.et-toast[data-tone="err"] { background: rgba(220, 38, 38, .95); }
.et-toast[data-tone="warn"] { background: rgba(217, 119, 6, .95); }

/* ============ 设置抽屉（右上角入口，edupick 交互） ============ */
.et-drawer-backdrop {
    position: fixed;
    inset: 0;
    z-index: 90;
    background: rgba(2, 6, 23, .45);
    backdrop-filter: blur(3px);
    -webkit-backdrop-filter: blur(3px);
    opacity: 0;
    transition: opacity .2s;
}

.et-drawer-backdrop.is-open { opacity: 1; }

.et-drawer {
    position: absolute;
    top: 0;
    right: 0;
    height: 100%;
    width: min(400px, 92vw);
    display: flex;
    flex-direction: column;
    background: var(--et-surface);
    border-left: 1px solid var(--et-line);
    box-shadow: var(--et-shadow-lg);
    transform: translateX(100%);
    transition: transform .22s cubic-bezier(.32, .72, .35, 1);
}

.et-drawer-backdrop.is-open .et-drawer { transform: translateX(0); }

.et-drawer__head {
    flex: none;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 15px 18px;
    border-bottom: 1px solid var(--et-line);
    font-weight: 800;
    font-size: 15px;
    color: var(--et-accent);
}

.et-drawer__head .et-icon-btn {
    margin-left: auto;
    width: 32px;
    height: 32px;
}

.et-drawer__body {
    flex: 1;
    min-height: 0;
    overflow: auto;
    padding: 16px 18px 24px;
}

/* 抽屉内容通用小节（工具复用） */
.et-drawer__body h4 {
    margin: 18px 0 8px;
    font-size: 12px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: .08em;
    color: var(--et-muted);
}

.et-drawer__body h4:first-child { margin-top: 0; }

.et-drawer__row {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
}

.et-drawer__tip {
    margin: 8px 0 0;
    font-size: 12px;
    line-height: 1.8;
    color: var(--et-muted);
}

.et-drawer__tip b { color: var(--et-fg); }

.et-drawer__input {
    flex: 1;
    min-width: 0;
    padding: 9px 12px;
    border: 1px solid var(--et-line-strong);
    border-radius: 9px;
    background: var(--et-surface-2);
    color: var(--et-fg);
    font: inherit;
    font-size: 13.5px;
    transition: border-color .14s, box-shadow .14s;
}

.et-drawer__input:focus {
    outline: none;
    border-color: var(--et-accent);
    box-shadow: 0 0 0 3px var(--et-accent-weak);
}

.et-drawer__switch {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 10px 0;
    border-bottom: 1px dashed var(--et-line);
    font-size: 13.5px;
    font-weight: 600;
    color: var(--et-fg);
    cursor: pointer;
    user-select: none;
}

.et-drawer__switch input {
    width: 17px;
    height: 17px;
    accent-color: var(--et-accent);
    cursor: pointer;
}
</style>

<style>

    width: 11px;
    height: 11px;
    border-radius: 3px;
    background: var(--pt-c);
}

/* ---------- 详情带 ---------- */
.pt-detail {
    flex: none;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px 24px;
    flex-wrap: wrap;
    min-height: 62px;
    padding: 8px 18px 12px;
    border-top: 1px solid var(--et-line);
    background: var(--et-surface-2);
}

.pt-hero {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 6px 14px;
    border: 1px solid var(--pt-c, var(--et-line));
    border-radius: 12px;
    background: var(--et-surface);
}

.pt-hero__sym {
    font-size: clamp(20px, 3vh, 30px);
    font-weight: 900;
    color: var(--pt-c, var(--et-accent));
    line-height: 1;
}

.pt-hero__box { line-height: 1.35; }
.pt-hero__name { font-size: 15px; font-weight: 800; }
.pt-hero__sub { font-size: 12px; color: var(--et-muted); }

.pt-field { font-size: 13px; font-weight: 700; color: var(--et-muted); }
.pt-field b { font-size: 16px; color: var(--et-fg); font-variant-numeric: tabular-nums; }

.pt-shells { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }

.pt-shell {
    display: inline-flex;
    align-items: baseline;
    gap: 3px;
    padding: 3px 8px;
    border: 1px solid var(--et-line);
    border-radius: 8px;
    background: var(--et-surface);
    font-size: 12px;
    font-weight: 700;
    color: var(--et-muted);
}

.pt-shell b { font-size: 14px; color: var(--et-fg); font-variant-numeric: tabular-nums; }
.pt-hint { font-size: 13.5px; color: var(--et-muted); }

/* ---------- 元素详情弹窗（3D 原子模型 + 详细介绍） ---------- */
.ptd { display: flex; gap: 18px; align-items: flex-start; }
.ptd__left { flex: 0 0 44%; min-width: 0; }
.ptd__right { flex: 1; min-width: 0; }

.ptd__stage {
    position: relative;
    width: 100%;
    aspect-ratio: 1 / 1;
    max-height: 42vh;
    margin: 0 auto;
    perspective: 760px;
    cursor: grab;
    touch-action: none;
    overflow: hidden;
    border: 1px solid var(--et-line);
    border-radius: 14px;
    background: radial-gradient(circle at 50% 45%, var(--et-accent-weak), transparent 72%);
}

.ptd__stage.is-drag { cursor: grabbing; }

.ptd__scene {
    position: absolute;
    inset: 0;
    display: grid;
    place-items: center;
    transform-style: preserve-3d;
    will-change: transform;
}

.ptd__svg { width: 88%; height: 88%; display: block; }

.pt3d__ring {
    fill: none;
    stroke: var(--et-line-strong);
    stroke-width: 1;
    stroke-dasharray: 4 4;
}

.pt3d__e {
    fill: var(--et-accent);
    filter: drop-shadow(0 0 4px var(--et-accent));
}

.pt3d__shell {
    transform-box: view-box;
    transform-origin: 100px 100px;
    animation-name: pt3d-orbit;
    animation-timing-function: linear;
    animation-iteration-count: infinite;
}

@keyframes pt3d-orbit {
    to { transform: rotate(360deg); }
}

.pt3d__core { fill: var(--et-accent); }
.pt3d__sym {
    fill: #fff;
    font-size: 15px;
    font-weight: 900;
    text-anchor: middle;
    dominant-baseline: central;
    font-family: var(--et-font);
}

.ptd__hint { margin: 8px 0 0; font-size: 12px; color: var(--et-muted); text-align: center; }
.ptd__shells { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin-top: 10px; }

.ptd__dl { display: grid; grid-template-columns: auto 1fr; gap: 7px 14px; margin: 0; font-size: 13.5px; }
.ptd__dl dt { color: var(--et-muted); font-weight: 700; white-space: nowrap; }
.ptd__dl dd { margin: 0; font-weight: 700; color: var(--et-fg); font-variant-numeric: tabular-nums; }

.ptd__sec {
    margin: 16px 0 6px;
    font-size: 11.5px;
    font-weight: 800;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--et-muted);
}

.ptd__text { margin: 0; font-size: 13.5px; line-height: 1.95; color: var(--et-fg); }
.ptd__note { margin: 12px 0 0; font-size: 12px; line-height: 1.85; color: var(--et-muted); }

@media (max-width: 960px) {
    .ptd { flex-direction: column; }
    .ptd__left { flex: none; width: 100%; max-width: 300px; margin: 0 auto; }
}

    function shellsOf(z) {
        if (SHELL_FIX[z]) { return SHELL_FIX[z]; }
        var shells = [];
        var remain = z;
        for (var i = 0; i < ORBITALS.length && remain > 0; i++) {
            var n = ORBITALS[i][0];
            var take = Math.min(ORBITALS[i][1], remain);
            shells[n - 1] = (shells[n - 1] || 0) + take;
            remain -= take;
        }
        var out = [];
        for (i = 0; i < shells.length; i++) {
            out.push(shells[i] || 0);
        }
        return out.join(',');
    }

    function matchFilter(el) {
        if (!FILTERS[state.filter](el)) { return false; }
        var kw = state.query.replace(/^\s+|\s+$/g, '').toLowerCase();
        if (!kw) { return true; }
        if (String(el.z) === kw) { return true; }
        if (el.sym.toLowerCase() === kw) { return true; }
        if (el.sym.toLowerCase().indexOf(kw) === 0) { return true; }
        if (el.cn && el.cn.indexOf(kw) !== -1) { return true; }
        return false;
    }

        var i, el, cell;
        for (i = 0; i < ELS.length; i++) {
            el = ELS[i];
            cell = cells[el.z];
            if (!cell) { continue; }
            cell.classList.toggle('is-dim', !matchFilter(el));
            cell.classList.toggle('is-sel', state.selected === el.z);
            var hl = false;
            if (state.hlPeriod) { hl = el.period === state.hlPeriod; }
            else if (state.hlGroup) {
                if (state.hlGroup === 'lanthanide') { hl = el.cat === 'lanthanide'; }
                else if (state.hlGroup === 'actinide') { hl = el.cat === 'actinide'; }
                else { hl = String(el.group) === String(state.hlGroup); }
            }
            cell.classList.toggle('is-hl', hl);
        }

        var btns = document.getElementById('segCat').querySelectorAll('button');
        for (i = 0; i < btns.length; i++) {
            btns[i].classList.toggle('is-active', btns[i].getAttribute('data-cat') === state.filter);
        }

        var hds = document.getElementById('grid').querySelectorAll('.pt-hd');
        for (i = 0; i < hds.length; i++) {
            var g = hds[i].getAttribute('data-group');
            var p = hds[i].getAttribute('data-period');
            if (g) { hds[i].classList.toggle('is-active', String(state.hlGroup) === g); }
            if (p) { hds[i].classList.toggle('is-active', String(state.hlPeriod) === p); }
        }
        if (cells.__lan) { cells.__lan.classList.toggle('is-active', state.hlGroup === 'lanthanide'); }
        if (cells.__act) { cells.__act.classList.toggle('is-active', state.hlGroup === 'actinide'); }

        document.getElementById('grid').classList.toggle('is-tight', !state.cn);
        document.getElementById('legend').hidden = !state.legend;

        var matched = 0;
        for (i = 0; i < ELS.length; i++) {
            if (matchFilter(ELS[i])) { matched++; }
        }
        if (state.query || state.filter !== 'all') {
            chrome.setStatus('筛选出 ' + matched + ' 种元素（共 118 种）');
        } else if (state.detail) {
            chrome.setStatus(state.detail.z + ' ' + state.detail.sym + ' · ' + CAT_NAME[state.detail.cat]);
        } else {
            chrome.setStatus('118 种元素就绪');
        }
    }

    /* ============ 详情带 ============ */

    function renderDetail(el) {
        var box = document.getElementById('detail');
        box.textContent = '';
        if (!el) {
            var hint = document.createElement('span');
            hint.className = 'pt-hint';
            hint.textContent = '点任意元素看详情　·　空格随机抽一个元素';
            box.appendChild(hint);
            return;
        }

        state.detail = el;
        var hero = document.createElement('div');
        hero.className = 'pt-hero';
        hero.style.setProperty('--pt-c', CAT_COLOR[el.cat] || '#64748b');

        var sym = document.createElement('span');
        sym.className = 'pt-hero__sym';
        sym.textContent = el.sym;

        var info = document.createElement('span');
        info.className = 'pt-hero__box';
        var name = document.createElement('span');
        name.className = 'pt-hero__name';
        name.textContent = (el.cn || '（中文名生僻字，多数字体缺少字形）') + '　' + el.z + ' 号';
        var sub = document.createElement('span');
        sub.className = 'pt-hero__sub';
        sub.textContent = CAT_NAME[el.cat] + ' · 第 ' + el.period + ' 周期 · ' +
            (el.group === 0 ? (el.cat === 'lanthanide' ? '镧系' : '锕系') : '第 ' + el.group + ' 族');
        info.appendChild(name);
        info.appendChild(document.createElement('br'));
        info.appendChild(sub);
        hero.appendChild(sym);
        hero.appendChild(info);
        box.appendChild(hero);

        var mass = document.createElement('span');
        mass.className = 'pt-field';
        mass.innerHTML = '相对原子质量 <b>' + trimNum(el.mass, 3) + '</b>' +
            (Math.abs(el.mass - Math.round(el.mass)) > 0.05 ? '（取整 ' + Math.round(el.mass) + '）' : '');
        box.appendChild(mass);

        var shells = document.createElement('span');
        shells.className = 'pt-shells';
        var parts = el.shells.split(',');
        for (var i = 0; i < parts.length; i++) {
            var chip = document.createElement('span');
            chip.className = 'pt-shell';
            chip.innerHTML = (SHELL_LABEL[i] || ('n' + (i + 1))) + ' <b>' + parts[i] + '</b>';
            shells.appendChild(chip);
        }
        var shellLabel = document.createElement('span');
        shellLabel.className = 'pt-field';
        shellLabel.textContent = '电子层排布';
        var wrap = document.createElement('span');
        wrap.className = 'pt-shells';
        wrap.appendChild(shellLabel);
        wrap.appendChild(shells);
        box.appendChild(wrap);

        var open = document.createElement('button');
        open.type = 'button';
        open.className = 'et-btn et-btn--primary';
        open.innerHTML = '<svg class="et-icon"><use href="#i-info"></use></svg><span>3D 模型与详细介绍</span>';
        open.addEventListener('click', function () { openElementDetail(el); });
        box.appendChild(open);
    }

    function trimNum(v, digits) {
        var s = Number(v).toFixed(digits);
        s = s.replace(/0+$/, '').replace(/\.$/, '');
        return s;
    }

    function select(z, announce, withModal) {
        var el = BY_Z[z];
        if (!el) {
            state.selected = 0;
            renderDetail(null);
            paint();
            return;
        }
        state.selected = z;
        renderDetail(el);
        store.set('selected', z);
        if (announce) {
            chrome.beep('tick');
            if (cells[z]) {
                try { cells[z].scrollIntoView({ block: 'nearest', inline: 'nearest' }); } catch (err) { /* 忽略 */ }
            }
        }
        paint();
        if (withModal && state.detail3d) { openElementDetail(el); }
    }

    /* ============ 3D 原子模型 + 详细介绍 ============ */

    var SUBSHELL_ORDER = [
        ['1s', 2], ['2s', 2], ['2p', 6], ['3s', 2], ['3p', 6], ['4s', 2], ['3d', 10], ['4p', 6],
        ['5s', 2], ['4d', 10], ['5p', 6], ['6s', 2], ['4f', 14], ['5d', 10], ['6p', 6],
        ['7s', 2], ['5f', 14], ['6d', 10], ['7p', 6]
    ];

    var SUP_DIGITS = { '0': '⁰', '1': '¹', '2': '²', '3': '³', '4': '⁴', '5': '⁵', '6': '⁶', '7': '⁷', '8': '⁸', '9': '⁹' };

    function sup(n) {
        var s = String(n);
        var out = '';
        for (var i = 0; i < s.length; i++) { out += SUP_DIGITS[s.charAt(i)] || s.charAt(i); }
        return out;
    }

    /* 电子排布式：按构造原理（Aufbau）顺序填充，如 1s² 2s² 2p⁶ 3s² 3p⁶ 3d⁶ 4s² */
    function subshellConfig(z) {
        var out = [];
        var remain = z;
        for (var i = 0; i < SUBSHELL_ORDER.length && remain > 0; i++) {
            var take = Math.min(SUBSHELL_ORDER[i][1], remain);
            out.push(SUBSHELL_ORDER[i][0] + sup(take));
            remain -= take;
        }
        return out.join(' ');
    }

    function shellText(el) {
        var parts = el.shells.split(',');
        var out = [];
        for (var i = 0; i < parts.length; i++) {
            out.push((SHELL_LABEL[i] || ('n' + (i + 1))) + ' ' + parts[i]);
        }
        return out.join(' · ');
    }

    function makeAtom(el) {
        var left = document.createElement('div');
        left.className = 'ptd__left';

        var stage = document.createElement('div');
        stage.className = 'ptd__stage';
        stage.style.setProperty('--et-accent', CAT_COLOR[el.cat] || '#2563eb');

        var scene = document.createElement('div');
        scene.className = 'ptd__scene';

        var shells = el.shells.split(',').map(Number);
        var minR = 22;
        var maxR = 78;
        var svg = ['<svg viewBox="0 0 200 200" class="ptd__svg" aria-hidden="true">'];
        for (var i = 0; i < shells.length; i++) {
            var r = Math.round(minR + (maxR - minR) * (i + 1) / shells.length);
            var n = shells[i];
            svg.push('<g class="pt3d__shell" style="animation-duration:' + (9 + i * 4) + 's">');
            svg.push('<circle class="pt3d__ring" cx="100" cy="100" r="' + r + '"></circle>');
            for (var e = 0; e < n; e++) {
                var ang = (Math.PI * 2 * e) / n - Math.PI / 2;
                var ex = (100 + r * Math.cos(ang)).toFixed(1);
                var ey = (100 + r * Math.sin(ang)).toFixed(1);
                svg.push('<circle class="pt3d__e" cx="' + ex + '" cy="' + ey + '" r="3.4"></circle>');
            }
            svg.push('</g>');
        }
        svg.push('<circle class="pt3d__core" cx="100" cy="100" r="15"></circle>');
        svg.push('<text class="pt3d__sym" x="100" y="100">' + el.sym + '</text>');
        svg.push('</svg>');
        scene.innerHTML = svg.join('');
        stage.appendChild(scene);

        /* 拖动旋转（水平改 Z 轴旋转，垂直改倾角） */
        var tilt = 58;
        var rot = 0;
        var drag = null;

        function apply() {
            scene.style.transform = 'rotateX(' + tilt.toFixed(1) + 'deg) rotateZ(' + rot.toFixed(1) + 'deg)';
        }
        apply();

        stage.addEventListener('pointerdown', function (ev) {
            drag = { x: ev.clientX, y: ev.clientY, tilt: tilt, rot: rot };
            stage.classList.add('is-drag');
            if (stage.setPointerCapture) {
                try { stage.setPointerCapture(ev.pointerId); } catch (err) { /* 忽略 */ }
            }
            ev.preventDefault();
        });
        stage.addEventListener('pointermove', function (ev) {
            if (!drag) { return; }
            rot = drag.rot + (ev.clientX - drag.x) * 0.6;
            tilt = Math.max(0, Math.min(86, drag.tilt - (ev.clientY - drag.y) * 0.45));
            apply();
        });
        function endDrag() {
            drag = null;
            stage.classList.remove('is-drag');
        }
        stage.addEventListener('pointerup', endDrag);
        stage.addEventListener('pointercancel', endDrag);
        stage.addEventListener('pointerleave', function () { if (drag) { endDrag(); } });

        left.appendChild(stage);

        var shellsBox = document.createElement('div');
        shellsBox.className = 'ptd__shells';
        var parts = el.shells.split(',');
        for (var s = 0; s < parts.length; s++) {
            var chip = document.createElement('span');
            chip.className = 'pt-shell';
            chip.innerHTML = (SHELL_LABEL[s] || ('n' + (s + 1))) + ' <b>' + parts[s] + '</b>';
            shellsBox.appendChild(chip);
        }
        left.appendChild(shellsBox);

        var hint = document.createElement('p');
        hint.className = 'ptd__hint';
        hint.textContent = '拖动模型可旋转视角 · 电子按各层实际数目排布并绕核运动';
        left.appendChild(hint);

        return left;
    }

    function makeInfo(el) {
        var box = document.createElement('div');
        box.className = 'ptd__right';

        function row(k, v) {
            var dt = document.createElement('dt');
            dt.textContent = k;
            var dd = document.createElement('dd');
            if (v && v.nodeType) { dd.appendChild(v); } else { dd.textContent = String(v); }
            box.appendChild(dt);
            box.appendChild(dd);
        }

        var dl = document.createElement('dl');
        dl.className = 'ptd__dl';
        box.appendChild(dl);

        var neutrons = Math.max(0, Math.round(el.mass) - el.z);

        row('符号 / 英文名', el.sym + ' · ' + (EN_NAMES[el.z - 1] || '—'));
        row('中文名', el.cn || '生僻字（扩充 B 区字形，多数字体缺字形）');
        row('原子序数', el.z);
        row('相对原子质量', trimNum(el.mass, 3) + '（取整 ' + Math.round(el.mass) + '）');
        row('元素类别', CAT_NAME[el.cat]);
        row('周期与族', '第 ' + el.period + ' 周期 · ' +
            (el.group === 0 ? (el.cat === 'lanthanide' ? '镧系（ⅢB 族位置）' : '锕系（ⅢB 族位置）') : '第 ' + el.group + ' 族'));
        row('质子 / 中子 / 电子', el.z + ' / ' + neutrons + ' / ' + el.z);
        row('电子层排布', shellText(el));
        row('电子排布式', subshellConfig(el.z));

        function section(title, text) {
            var h = document.createElement('div');
            h.className = 'ptd__sec';
            h.textContent = title;
            box.appendChild(h);
            var p = document.createElement('p');
            p.className = 'ptd__text';
            p.textContent = text;
            box.appendChild(p);
        }

        section('性质与用途', ELEMENT_NOTES[el.z] || ('该元素属' + CAT_NAME[el.cat] + '。' + (CAT_NOTES[el.cat] || '')));
        if (ELEMENT_NOTES[el.z]) {
            section('这一类元素', CAT_NOTES[el.cat] || '');
        }

        var note = document.createElement('p');
        note.className = 'ptd__note';
        note.textContent = '电子层排布按实际排布给出（Cr、Cu、Pd、Ag、Pt、Au 等' +
            '少数元素已修正）；电子排布式按构造原理（Aufbau）顺序书写，个别元素实际排布略有差异。' +
            '相对原子质量取中学常用值。';
        box.appendChild(note);

        return box;
    }

    function openElementDetail(el) {
        if (!el) { return null; }
        var body = document.createElement('div');
        body.className = 'ptd';
        body.appendChild(makeAtom(el));
        body.appendChild(makeInfo(el));
        return chrome.modal({
            title: el.z + ' ' + el.sym + (el.cn ? ' ' + el.cn : '') + ' · ' + (EN_NAMES[el.z - 1] || ''),
            icon: 'i-info',
            size: 'wide',
            body: body,
            buttons: [{ label: '知道了', primary: true }]
        });
    }

    function randomElement() {
        var el = ELS[Math.floor(Math.random() * ELS.length)];
        select(el.z, true, true);
        chrome.beep('win');
        chrome.toast('抽到：' + el.z + ' 号 ' + el.sym + (el.cn ? '（' + el.cn + '）' : ''));
    }

    function moveHorizontal(delta) {
        var z = state.selected || 1;
        z = z + delta;
        if (z < 1) { z = 118; }
        if (z > 118) { z = 1; }
        select(z, true);
    }

    function moveVertical(delta) {
        if (!state.selected) { return; }
        var cur = BY_Z[state.selected];
        if (!cur) { return; }
        if (cur.group === 0) {
            var base = cur.z >= 89 ? 89 : 57;
            var idx = cur.z - base;
            select((cur.z >= 89 ? 57 : 89) + idx, true);
            return;
        }
        for (var z = cur.z + delta; z >= 1 && z <= 118; z += delta) {
            var e = BY_Z[z];
            if (e && e.group === cur.group) {
                select(z, true);
                return;
            }
        }
    }

    /* ============ 图例与设置 ============ */

    function buildLegend() {
        var box = document.getElementById('legend');
        box.textContent = '';
        for (var i = 0; i < CATS.length; i++) {
            var item = document.createElement('span');
            item.className = 'pt-legend__item';
            var dot = document.createElement('span');
            dot.className = 'pt-legend__dot';
            dot.style.setProperty('--pt-c', CATS[i].color);
            var label = document.createElement('span');
            label.textContent = CATS[i].name;
            item.appendChild(dot);
            item.appendChild(label);
            box.appendChild(item);
        }
        box.hidden = !state.legend;
    }

    function buildSettings(body) {
        function heading(text) {
            var h = document.createElement('h4');
            h.textContent = text;
            body.appendChild(h);
        }

        function switchRow(label, checked, onChange) {
            var row = document.createElement('label');
            row.className = 'et-drawer__switch';
            row.appendChild(document.createTextNode(label));
            var cb = document.createElement('input');
            cb.type = 'checkbox';
            cb.checked = checked;
            cb.addEventListener('change', function () { onChange(cb.checked); });
            row.appendChild(cb);
            body.appendChild(row);
        }

        heading('显示');
        switchRow('方块内显示中文名', state.cn, function (on) {
            state.cn = on;
            store.set('cn', on);
            document.getElementById('chkCn').checked = on;
            paint();
        });
        switchRow('方块内显示原子量（取整）', state.mass, function (on) {
            state.mass = on;
            store.set('mass', on);
            document.getElementById('chkMass').checked = on;
            applyMass();
        });
        switchRow('点击元素弹出 3D 详情', state.detail3d, function (on) {
            state.detail3d = on;
            store.set('detail3d', on);
            document.getElementById('chkDetail').checked = on;
        });
        switchRow('显示类别图例', state.legend, function (on) {
            state.legend = on;
            store.set('legend', on);
            document.getElementById('legend').hidden = !on;
        });

        heading('高亮');
        var row = document.createElement('div');
        row.className = 'et-drawer__row';
        var clearBtn = document.createElement('button');
        clearBtn.type = 'button';
        clearBtn.className = 'et-btn';
        clearBtn.style.flex = '1 1 100%';
        clearBtn.textContent = '取消周期 / 族高亮';
        clearBtn.addEventListener('click', function () {
            state.hlGroup = 0;
            state.hlPeriod = 0;
            paint();
        });
        row.appendChild(clearBtn);
        body.appendChild(row);

        var tip = document.createElement('p');
        tip.className = 'et-drawer__tip';
        tip.innerHTML = '数据为 118 种元素的<b>原子序数、符号、中文名、相对原子质量、类别、周期、族与电子层排布</b>。'
            + '<br>电子层排布由构造原理（Aufbau 顺序 1s→2s→2p→3s→3p→4s→3d…）逐层累加得出，'
            + 'Cr、Cu、Nb、Mo、Ru、Rh、Pd、Ag、La、Ce、Gd、Pt、Au 及锕系若干元素的排布已按实际情况修正。'
            + '<br>镧系（57-71）与锕系（89-103）按惯例单独排在表格下方两行，主表中以 57-71 / 89-103 标记指示。'
            + '<br>104 号以后部分元素的中文名为生僻字（扩充 B 区字形），多数系统字体不含，故留空以免显示为方框。';
        body.appendChild(tip);
    }

    function applyMass() {
        var grid = document.getElementById('grid');
        grid.classList.toggle('is-mass', state.mass);
        grid.classList.toggle('is-tight', !state.cn);
    }

    /* ============ 事件绑定 ============ */

    document.getElementById('segCat').addEventListener('click', function (ev) {
        var v = ev.target && ev.target.getAttribute ? ev.target.getAttribute('data-cat') : null;
        if (!v || !FILTERS[v]) { return; }
        state.filter = v;
        paint();
        store.set('filter', v);
        chrome.beep('tick');
    });

    document.getElementById('grid').addEventListener('click', function (ev) {
        var t = ev.target;
        var g = t && t.getAttribute ? t.getAttribute('data-group') : null;
        var p = t && t.getAttribute ? t.getAttribute('data-period') : null;
        if (g) {
            state.hlGroup = (String(state.hlGroup) === g) ? 0 : Number(g);
            state.hlPeriod = 0;
            paint();
            chrome.beep('tick');
        } else if (p) {
            state.hlPeriod = (String(state.hlPeriod) === p) ? 0 : Number(p);
            state.hlGroup = 0;
            paint();
            chrome.beep('tick');
        }
    });

    document.getElementById('search').addEventListener('input', function (ev) {
        state.query = ev.target.value || '';
        paint();
    });

    document.getElementById('chkMass').addEventListener('change', function (ev) {
        state.mass = ev.target.checked;
        store.set('mass', state.mass);
        applyMass();
    });

    document.getElementById('chkCn').addEventListener('change', function (ev) {
        state.cn = ev.target.checked;
        store.set('cn', state.cn);
        paint();
    });

    document.getElementById('chkDetail').addEventListener('change', function (ev) {
        state.detail3d = ev.target.checked;
        store.set('detail3d', state.detail3d);
        chrome.toast(state.detail3d ? '点击元素将弹出 3D 详情' : '已关闭自动弹窗，可用底部按钮打开');
    });

    document.addEventListener('keydown', function (ev) {
        var node = document.activeElement;
        var tag = node && node.tagName ? node.tagName.toUpperCase() : '';
        if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT' || (node && node.isContentEditable)) { return; }
        if (document.querySelector('.et-modal, .et-drawer-backdrop')) { return; }

        if (ev.key === 'ArrowLeft') { moveHorizontal(-1); ev.preventDefault(); }
        else if (ev.key === 'ArrowRight') { moveHorizontal(1); ev.preventDefault(); }
        else if (ev.key === 'ArrowUp') { moveVertical(-1); ev.preventDefault(); }
        else if (ev.key === 'ArrowDown') { moveVertical(1); ev.preventDefault(); }
        else if (ev.key === 'r' || ev.key === 'R') { randomElement(); ev.preventDefault(); }
        else if (ev.code === 'Space' || ev.key === ' ') {
            ev.preventDefault();
            randomElement();
        }
    });

    /* ============ 启动 ============ */

    buildGrid();
    buildLegend();
    document.getElementById('chkMass').checked = state.mass;
    document.getElementById('chkCn').checked = state.cn;
    document.getElementById('chkDetail').checked = state.detail3d;
    applyMass();
    if (state.selected && BY_Z[state.selected]) {
        renderDetail(BY_Z[state.selected]);
        state.selected = Number(state.selected);
    } else {
        state.selected = 0;
        renderDetail(null);
    }
    paint();
})();
</script>

</body>
</html>
