<style>

/*!
 * et-chrome.css — 工具通用外壳样式（顶栏 / 页脚 / 弹窗 / 按钮 / 主题）
 *
 * 共享样式源。改这里，然后跑：python scripts/sync_shared.py
 * 所有类名带 et- 前缀，避免与工具自身样式冲突。
 * 依赖：无外部资源；颜色全部为令牌变量。
 */

/* ============ 设计令牌 ============ */
:root {
    --et-accent: #2563eb;
    --et-accent-weak: rgba(37, 99, 235, .14);
    --et-bg: #f4f6fb;
    --et-surface: #ffffff;
    --et-surface-2: #f8fafc;
    --et-fg: #0b1220;
    --et-muted: #64748b;
    --et-line: rgba(15, 23, 42, .12);
    --et-line-strong: rgba(15, 23, 42, .22);
    --et-glass: rgba(255, 255, 255, .85);
    --et-shadow-md: 0 10px 28px -18px rgba(15, 23, 42, .3);
    --et-shadow-lg: 0 24px 60px -32px rgba(15, 23, 42, .4);
    --et-ok: #059669;
    --et-warn: #d97706;
    --et-err: #dc2626;
    --et-radius: 12px;
    --et-radius-sm: 9px;
    --et-font: -apple-system, BlinkMacSystemFont, "Segoe UI",
               "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei",
               "Noto Sans SC", sans-serif;
    --et-mono: ui-monospace, "Cascadia Mono", Consolas, Menlo, monospace;
}

html[data-et-theme="dark"] {
    --et-bg: #0b1120;
    --et-surface: #111a2e;
    --et-surface-2: #0f1729;
    --et-fg: #f1f5f9;
    --et-muted: #94a3b8;
    --et-line: rgba(148, 163, 184, .18);
    --et-line-strong: rgba(148, 163, 184, .3);
    --et-glass: rgba(17, 26, 46, .85);
    --et-shadow-md: 0 10px 34px -18px rgba(0, 0, 0, .8);
    --et-shadow-lg: 0 24px 70px -30px rgba(0, 0, 0, .9);
    --et-ok: #34d399;
    --et-warn: #fbbf24;
    --et-err: #f87171;
}

/* ============ 基础 ============ */

/* body 作为外壳时必须清掉浏览器默认 8px 外边距，
   否则 iframe 预览中文档会比视口高 16px（底部白边 + 多余滚动） */
body.et-app {
    margin: 0;
}

.et-app {
    position: relative;
    isolation: isolate;
    display: flex;
    flex-direction: column;
    height: 100vh;
    height: 100dvh;
    overflow: hidden;
    background: var(--et-bg);
    color: var(--et-fg);
    font-family: var(--et-font);
    -webkit-font-smoothing: antialiased;
    transition: background .25s, color .25s;
}

/* 极光背景：径向渐变 + 呼吸动画（edupick 品质基线，老内核也不掉帧） */
.et-app::before {
    content: '';
    position: fixed;
    inset: 0;
    z-index: -1;
    pointer-events: none;
    background:
        radial-gradient(46% 40% at 20% 18%, var(--et-accent-weak), transparent 65%),
        radial-gradient(42% 38% at 82% 24%, var(--et-accent-weak), transparent 70%),
        radial-gradient(50% 44% at 55% 95%, rgba(16, 185, 129, .10), transparent 65%);
    animation: et-aurora 16s ease-in-out infinite alternate;
}

@keyframes et-aurora {
    from { opacity: .55; transform: scale(1); }
    to { opacity: 1; transform: scale(1.06); }
}

.et-app *,
.et-app *::before,
.et-app *::after { box-sizing: border-box; }

[hidden] { display: none !important; }

.et-icon {
    width: 18px;
    height: 18px;
    fill: none;
    stroke: currentColor;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
    flex: none;
}

/* ============ 顶栏 ============ */
.et-topbar {
    flex: none;
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 11px 20px;
    border-bottom: 1px solid var(--et-line);
    background: var(--et-glass);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    z-index: 20;
}

.et-brand {
    display: flex;
    align-items: center;
    gap: 10px;
    min-width: 0;
}

.et-brand__dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: var(--et-accent);
    box-shadow: 0 0 0 4px var(--et-accent-weak);
    flex: none;
}

.et-brand__name {
    font-weight: 800;
    font-size: 15px;
    letter-spacing: -.01em;
    white-space: nowrap;
}

.et-brand__sub {
    font-size: 12.5px;
    color: var(--et-muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.et-status {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 5px 14px;
    border-radius: 999px;
    font-size: 12.5px;
    color: var(--et-muted);
    background: var(--et-surface-2);
    border: 1px solid var(--et-line);
    white-space: nowrap;
    max-width: 42vw;
    overflow: hidden;
    text-overflow: ellipsis;
}

.et-status__dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--et-ok);
    flex: none;
    transition: background .2s;
}

.et-status[data-tone="err"] .et-status__dot { background: var(--et-err); }
.et-status[data-tone="warn"] .et-status__dot { background: var(--et-warn); }

.et-actions {
    display: flex;
    align-items: center;
    gap: 7px;
}

.et-icon-btn {
    display: inline-grid;
    place-items: center;
    width: 38px;
    height: 38px;
    font-size: 16px;
    line-height: 1;
    border-radius: 11px;
    border: 1px solid var(--et-line);
    background: var(--et-surface-2);
    color: var(--et-fg);
    cursor: pointer;
    transition: transform .14s, border-color .14s, color .14s, opacity .14s;
    -webkit-tap-highlight-color: transparent;
}

.et-icon-btn:hover {
    border-color: var(--et-accent);
    color: var(--et-accent);
    transform: translateY(-1px);
}

.et-icon-btn:active { transform: translateY(0); }
.et-icon-btn.is-off { opacity: .4; }
.et-icon-btn:focus-visible { outline: 2px solid var(--et-accent); outline-offset: 2px; }

/* ============ 主区默认 ============ */
.et-main {
    flex: 1;
    min-height: 0;
    position: relative;
    overflow: auto;
}

/* ============ 页脚（品牌回流 L2） ============ */
.et-footer {
    flex: none;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 7px 16px;
    font-size: 12px;
    color: var(--et-muted);
    border-top: 1px solid var(--et-line);
    background: var(--et-glass);
    user-select: none;
    z-index: 20;
}

.et-footer a {
    color: inherit;
    text-decoration: none;
    transition: color .14s;
}

.et-footer a:hover { color: var(--et-accent); }

/* ============ 按钮 ============ */
.et-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
    padding: 9px 16px;
    border-radius: 11px;
    font: inherit;
    font-size: 13.5px;
    font-weight: 700;
    border: 1px solid var(--et-line);
    background: var(--et-surface-2);
    color: var(--et-fg);
    cursor: pointer;
    transition: transform .14s, border-color .14s, color .14s, background .14s, box-shadow .14s;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
}

.et-btn:hover {
    border-color: var(--et-accent);
    color: var(--et-accent);
    transform: translateY(-1px);
}

.et-btn:active { transform: translateY(0); }
.et-btn:focus-visible { outline: 2px solid var(--et-accent); outline-offset: 2px; }
.et-btn:disabled { opacity: .45; cursor: not-allowed; transform: none; }

.et-btn--primary {
    background: var(--et-accent);
    border-color: var(--et-accent);
    color: #fff;
    box-shadow: 0 6px 18px -8px var(--et-accent);
}

.et-btn--primary:hover { color: #fff; filter: brightness(1.08); }
.et-btn--primary:disabled { filter: none; }

.et-btn--danger:hover {
    border-color: var(--et-err);
    color: var(--et-err);
}

.et-btn--lg {
    padding: 13px 26px;
    font-size: 16px;
    border-radius: 14px;
}

/* ============ 弹窗 ============ */
.et-modal {
    position: fixed;
    inset: 0;
    z-index: 100;
    display: grid;
    place-items: center;
    padding: 24px;
    background: rgba(2, 6, 23, .55);
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    animation: et-fade .18s ease;
}

.et-modal__panel {
    width: min(680px, 94vw);
    max-height: 86vh;
    max-height: 86dvh;
    display: flex;
    flex-direction: column;
    background: var(--et-surface);
    border: 1px solid var(--et-line);
    border-radius: 16px;
    box-shadow: var(--et-shadow-lg);
    animation: et-pop .2s cubic-bezier(.34, 1.4, .64, 1);
    overflow: hidden;
}

.et-modal__panel--narrow { width: min(460px, 92vw); }
.et-modal__panel--wide { width: min(900px, 94vw); }

.et-modal__head {
    flex: none;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 16px 20px;
    border-bottom: 1px solid var(--et-line);
    font-weight: 800;
    font-size: 15px;
}

.et-modal__head .et-icon-btn {
    margin-left: auto;
    width: 32px;
    height: 32px;
}

.et-modal__body {
    flex: 1;
    min-height: 0;
    overflow: auto;
    padding: 18px 20px;
}

.et-modal__foot {
    flex: none;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 14px 20px;
    border-top: 1px solid var(--et-line);
    background: var(--et-surface-2);
}

.et-modal__foot .spacer { flex: 1; }

@keyframes et-fade {
    from { opacity: 0; }
}

@keyframes et-pop {
    from { opacity: 0; transform: translateY(14px) scale(.97); }
}

/* ============ 轻提示（toast） ============ */
.et-toast {
    position: fixed;
    left: 50%;
    bottom: 56px;
    transform: translateX(-50%) translateY(10px);
    z-index: 120;
    display: flex;
    align-items: center;
    gap: 9px;
    max-width: min(520px, 88vw);
    padding: 11px 18px;
    border-radius: 12px;
    font-size: 13.5px;
    font-weight: 600;
    color: #fff;
    background: rgba(15, 23, 42, .92);
    border: 1px solid rgba(148, 163, 184, .25);
    box-shadow: var(--et-shadow-lg);
    opacity: 0;
    pointer-events: none;
    transition: opacity .22s, transform .22s;
}

.et-toast.is-show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
}

.et-toast[data-tone="ok"] { background: rgba(5, 150, 105, .95); }
.et-toast[data-tone="err"] { background: rgba(220, 38, 38, .95); }
.et-toast[data-tone="warn"] { background: rgba(217, 119, 6, .95); }

/* ============ 设置抽屉（右上角入口，edupick 交互） ============ */
.et-drawer-backdrop {
    position: fixed;
    inset: 0;
    z-index: 90;
    background: rgba(2, 6, 23, .45);
    backdrop-filter: blur(3px);
    -webkit-backdrop-filter: blur(3px);
    opacity: 0;
    transition: opacity .2s;
}

.et-drawer-backdrop.is-open { opacity: 1; }

.et-drawer {
    position: absolute;
    top: 0;
    right: 0;
    height: 100%;
    width: min(400px, 92vw);
    display: flex;
    flex-direction: column;
    background: var(--et-surface);
    border-left: 1px solid var(--et-line);
    box-shadow: var(--et-shadow-lg);
    transform: translateX(100%);
    transition: transform .22s cubic-bezier(.32, .72, .35, 1);
}

.et-drawer-backdrop.is-open .et-drawer { transform: translateX(0); }

.et-drawer__head {
    flex: none;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 15px 18px;
    border-bottom: 1px solid var(--et-line);
    font-weight: 800;
    font-size: 15px;
    color: var(--et-accent);
}

.et-drawer__head .et-icon-btn {
    margin-left: auto;
    width: 32px;
    height: 32px;
}

.et-drawer__body {
    flex: 1;
    min-height: 0;
    overflow: auto;
    padding: 16px 18px 24px;
}

/* 抽屉内容通用小节（工具复用） */
.et-drawer__body h4 {
    margin: 18px 0 8px;
    font-size: 12px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: .08em;
    color: var(--et-muted);
}

.et-drawer__body h4:first-child { margin-top: 0; }

.et-drawer__row {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
}

.et-drawer__tip {
    margin: 8px 0 0;
    font-size: 12px;
    line-height: 1.8;
    color: var(--et-muted);
}

.et-drawer__tip b { color: var(--et-fg); }

.et-drawer__input {
    flex: 1;
    min-width: 0;
    padding: 9px 12px;
    border: 1px solid var(--et-line-strong);
    border-radius: 9px;
    background: var(--et-surface-2);
    color: var(--et-fg);
    font: inherit;
    font-size: 13.5px;
    transition: border-color .14s, box-shadow .14s;
}

.et-drawer__input:focus {
    outline: none;
    border-color: var(--et-accent);
    box-shadow: 0 0 0 3px var(--et-accent-weak);
}

.et-drawer__switch {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 10px 0;
    border-bottom: 1px dashed var(--et-line);
    font-size: 13.5px;
    font-weight: 600;
    color: var(--et-fg);
    cursor: pointer;
    user-select: none;
}

.et-drawer__switch input {
    width: 17px;
    height: 17px;
    accent-color: var(--et-accent);
    cursor: pointer;
}
</style>
<!-- /ET:INLINE -->

<style>
/* ── 函数图像绘制器：工具自身样式（自包含，不引用任何外部资源） ── */
:root { --fg-accent: #2563eb; }

.fg-main { flex: 1; min-height: 0; display: flex; flex-direction: column; }

/* ---------- 输入栏 ---------- */
.fg-bar {
    flex: none;
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    padding: 9px 18px;
    border-bottom: 1px solid var(--et-line);
    background: var(--et-surface-2);
}

.fg-label {
    font-family: "Cambria Math", Georgia, "Times New Roman", serif;
    font-size: 20px;
    font-weight: 700;
    color: var(--et-muted);
}

.fg-input {
    width: min(46vw, 430px);
    padding: 9px 13px;
    border: 1px solid var(--et-line-strong);
    border-radius: 10px;
    background: var(--et-surface);
    color: var(--et-fg);
    font-family: var(--et-mono);
    font-size: 16px;
    outline: none;
    transition: border-color .14s, box-shadow .14s;
}

.fg-input:focus { border-color: var(--et-accent); box-shadow: 0 0 0 3px var(--et-accent-weak); }
.fg-input.is-err { border-color: var(--et-err); }

.fg-msg { font-size: 13px; font-weight: 700; color: var(--et-muted); max-width: 34vw; }
.fg-msg.is-err { color: var(--et-err); }
.fg-msg.is-ok { color: var(--et-ok); }
.fg-spacer { flex: 1 1 auto; }

.fg-chips { display: flex; gap: 5px; flex-wrap: wrap; padding: 2px; }

.fg-chip {
    flex: none;
    padding: 6px 10px;
    border: 1px solid var(--et-line);
    border-radius: 9px;
    background: var(--et-surface);
    color: var(--et-muted);
    font: inherit;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    white-space: nowrap;
    transition: border-color .14s, color .14s, background .14s;
    -webkit-tap-highlight-color: transparent;
}

.fg-chip:hover { border-color: var(--et-accent); color: var(--et-accent); }
.fg-chip.is-active { background: var(--et-accent); border-color: var(--et-accent); color: #fff; }

/* ---------- 画布舞台 ---------- */
.fg-stage {
    position: relative;
    flex: 1;
    min-height: 0;
    overflow: hidden;
    background: var(--et-surface);
}

.fg-stage canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    cursor: grab;
    touch-action: none;
}

.fg-stage canvas.is-drag { cursor: grabbing; }

.fg-overlay {
    position: absolute;
    left: 14px;
    top: 12px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    pointer-events: none;
    max-width: 44%;
}

.fg-tag {
    align-self: flex-start;
    padding: 6px 12px;
    border: 1px solid var(--et-line);
    border-radius: 10px;
    background: var(--et-glass);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    font-family: var(--et-mono);
    font-size: 14px;
    font-weight: 700;
    color: var(--et-accent);
    box-shadow: var(--et-shadow-md);
}

.fg-keys {
    padding: 8px 12px;
    border: 1px solid var(--et-line);
    border-radius: 10px;
    background: var(--et-glass);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    font-size: 12.5px;
    line-height: 1.9;
    color: var(--et-muted);
    box-shadow: var(--et-shadow-md);
}

.fg-keys b { color: var(--et-fg); font-variant-numeric: tabular-nums; }

.fg-panel {
    position: absolute;
    right: 14px;
    top: 12px;
    max-height: calc(100% - 24px);
    overflow: auto;
    padding: 10px 12px;
    border: 1px solid var(--et-line);
    border-radius: 12px;
    background: var(--et-glass);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    box-shadow: var(--et-shadow-md);
}

.fg-panel h4 {
    margin: 0 0 6px;
    font-size: 11.5px;
    font-weight: 800;
    letter-spacing: .08em;
    color: var(--et-muted);
    text-transform: uppercase;
}

.fg-panel table { border-collapse: collapse; font-size: 13px; font-variant-numeric: tabular-nums; }
.fg-panel th, .fg-panel td { padding: 3px 10px; text-align: right; }
.fg-panel th { color: var(--et-muted); font-weight: 700; border-bottom: 1px solid var(--et-line); }
.fg-panel td:first-child { color: var(--et-accent); font-weight: 700; }

/* ---------- 底部工具条 ---------- */
.fg-foot {
    flex: none;
    display: flex;
    align-items: center;
    gap: 9px;
    flex-wrap: wrap;
    padding: 9px 18px 12px;
    border-top: 1px solid var(--et-line);
    background: var(--et-surface-2);
}

.fg-check {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 13px;
    font-weight: 600;
    color: var(--et-fg);
    cursor: pointer;
    user-select: none;
}

.fg-check input { width: 16px; height: 16px; accent-color: var(--et-accent); cursor: pointer; }

.fg-span {
    font-size: 13px;
    font-weight: 700;
    color: var(--et-muted);
    font-variant-numeric: tabular-nums;
}

.fg-vsep { width: 1px; align-self: stretch; background: var(--et-line); }

@media (max-width: 1180px) {
    .fg-chips { max-width: 34vw; }
    .fg-msg { max-width: 22vw; }
    .fg-input { width: min(38vw, 320px); }
}
</style>

<body class="et-app">

<header id="et-topbar"></header>

<main id="et-main" class="fg-main">

    <div class="fg-bar">
        <span class="fg-label">y =</span>
        <input class="fg-input" id="expr" type="text" spellcheck="false" autocomplete="off"
               placeholder="例如 x^2-2x-3 、1/x 、sin x" aria-label="函数解析式">
        <button class="et-btn et-btn--primary" id="btnDraw" type="button" title="绘制（回车）">
            <svg class="et-icon"><use href="#i-check"></use></svg>
            <span>绘制</span>
        </button>
        <span class="fg-msg" id="msg"></span>
        <span class="fg-spacer"></span>
        <div class="fg-chips" id="chips" aria-label="示例函数"></div>

    <div class="fg-stage" id="stage">
        <canvas id="cv" aria-label="函数图像画布"></canvas>
        <div class="fg-overlay">
            <div class="fg-tag" id="tag">y = x</div>
            <div class="fg-keys" id="keys">拖动平移 · 滚轮缩放 · 鼠标移到图上读取坐标</div>
        </div>
        <div class="fg-panel" id="panel" hidden>
            <h4>数值表</h4>
            <div id="tableBox"></div>
        </div>

    /* ---------- 设置抽屉 ---------- */

    function openDrawer(title, build) {
        var backdrop = el('div', 'et-drawer-backdrop');
        var drawer = el('aside', 'et-drawer');
        drawer.setAttribute('role', 'dialog');
        drawer.setAttribute('aria-label', title);

        var head = el('div', 'et-drawer__head');
        head.appendChild(makeIcon('i-sliders'));
        head.appendChild(el('span', 'et-drawer__title', title));
        head.appendChild(makeBtn('i-x', '关闭', close));
        drawer.appendChild(head);

        var body = el('div', 'et-drawer__body');
        drawer.appendChild(body);

        backdrop.appendChild(drawer);
        document.body.appendChild(backdrop);
        requestAnimationFrame(function () { backdrop.classList.add('is-open'); });

        function close() {
            backdrop.classList.remove('is-open');
            document.removeEventListener('keydown', onKey);
            setTimeout(function () {
                if (backdrop.parentNode) { backdrop.parentNode.removeChild(backdrop); }
            }, 220);
        }
        function onKey(ev) {
            if (ev.key === 'Escape') { ev.stopPropagation(); close(); }
        }
        document.addEventListener('keydown', onKey);
        backdrop.addEventListener('mousedown', function (ev) {
            if (ev.target === backdrop) { close(); }
        });

        if (typeof build === 'function') {
            /* 兼容两种约定：build 自己往 body 里塞内容，或 return 一个元素节点 */
            var ret = build(body, { close: close });
            if (ret && ret.nodeType === 1 && ret.parentNode !== body) {
                body.appendChild(ret);
            }
        }
        return { body: body, close: close };
    }

    /* ---------- 通用弹窗 / toast（同时挂模块级，供其他共享组件使用） ---------- */

    function modal(mo) {
        var backdrop = el('div', 'et-modal');
        var panel = el('div', 'et-modal__panel' + (mo.size === 'narrow' ? ' et-modal__panel--narrow'
            : mo.size === 'wide' ? ' et-modal__panel--wide' : ''));
        var head = el('div', 'et-modal__head');
        if (mo.icon) { head.appendChild(makeIcon(mo.icon)); }
        head.appendChild(el('span', null, mo.title || ''));
        head.appendChild(makeBtn('i-x', '关闭', close));
        panel.appendChild(head);

        var body = el('div', 'et-modal__body');
        if (typeof mo.body === 'string') { body.innerHTML = mo.body; }
        else if (mo.body) { body.appendChild(mo.body); }
        panel.appendChild(body);

        var foot = null;
        if (mo.buttons && mo.buttons.length) {
            foot = el('div', 'et-modal__foot');
            foot.appendChild(el('span', 'spacer'));
            mo.buttons.forEach(function (b) {
                var btn = el('button', 'et-btn' + (b.primary ? ' et-btn--primary' : '') + (b.danger ? ' et-btn--danger' : ''), b.label);
                btn.type = 'button';
                btn.addEventListener('click', function () {
                    if (b.onClick) { b.onClick(close); } else { close(); }
                });
                foot.appendChild(btn);
            });
            panel.appendChild(foot);
        }

        backdrop.appendChild(panel);
        document.body.appendChild(backdrop);

        function close() {
            if (backdrop.parentNode) { backdrop.parentNode.removeChild(backdrop); }
            document.removeEventListener('keydown', onKey);
            if (mo.onClose) { mo.onClose(); }
        }
        function onKey(ev) {
            if (ev.key === 'Escape') { ev.stopPropagation(); close(); }
        }
        document.addEventListener('keydown', onKey);
        backdrop.addEventListener('mousedown', function (ev) {
            if (ev.target === backdrop) { close(); }
        });

        return { panel: panel, body: body, foot: foot, close: close };

    var toastEl = null;
    var toastTimer = 0;

    function toast(msg, tone) {
        if (!toastEl) {
            toastEl = el('div', 'et-toast');
            document.body.appendChild(toastEl);
        }
        toastEl.textContent = msg;
        toastEl.setAttribute('data-tone', tone || '');
        void toastEl.offsetWidth;
        toastEl.classList.add('is-show');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(function () { toastEl.classList.remove('is-show'); }, 2200);
    }

    /* ---------- PWA 元数据（blob manifest，环境不支持时静默跳过） ---------- */

    function installPwa(toolId, title, accent) {
        try {
            var theme = document.querySelector('meta[name="theme-color"]');
            if (!theme) {
                theme = document.createElement('meta');
                theme.setAttribute('name', 'theme-color');
                document.head.appendChild(theme);
            }
            theme.setAttribute('content', accent || '#2563eb');

            var svg = '<svg xmlns="' + NS_SVG + '" viewBox="0 0 64 64">' +
                '<rect width="64" height="64" rx="14" fill="' + (accent || '#2563eb') + '"/>' +
                '<text x="32" y="43" font-size="32" font-weight="800" font-family="sans-serif" ' +
                'fill="#fff" text-anchor="middle">' + (title || '课').charAt(0) + '</text></svg>';
            var iconUri = 'data:image/svg+xml,' + encodeURIComponent(svg);

            var mf = {
                name: title || 'KeeTools 课工具',
                short_name: title || '课工具',
                start_url: '.',
                display: 'standalone',
                background_color: '#f4f6fb',
                theme_color: accent || '#2563eb',
                icons: [{ src: iconUri, sizes: 'any', type: 'image/svg+xml', purpose: 'any' }]
            };
            var blob = new Blob([JSON.stringify(mf)], { type: 'application/manifest+json' });
            var link = document.createElement('link');
            link.rel = 'manifest';
            link.href = URL.createObjectURL(blob);

    /* ---------- 挂载 ---------- */

    function mount(options) {

        var store = global.ET && global.ET.store

        var api = { toolId: toolId, store: store };

            if (themeBtn) {

                themeBtn.title = t === 'dark' ? '切换到浅色' : '切换到深色';
            }

        /* ---------- 顶栏 ---------- */
        var topbar = document.getElementById('et-topbar');

        var footer = document.getElementById('et-footer');

        if (!topbar) { topbar = el('header'); topbar.id = 'et-topbar'; document.body.insertBefore(topbar, document.body.firstChild); }
        if (!main) { main = el('main'); main.id = 'et-main'; topbar.after(main); }
        if (!footer) { footer = el('footer'); footer.id = 'et-footer'; document.body.appendChild(footer); }

        topbar.className = 'et-topbar';
        main.classList.add('et-main');
        footer.className = 'et-footer';

        /* 品牌 */
        var brand = el('div', 'et-brand');
        brand.appendChild(el('span', 'et-brand__dot'));
        var nameWrap = el('div');
        nameWrap.style.cssText = 'min-width:0;line-height:1.25';

        if (opt.sub) { nameWrap.appendChild(el('div', 'et-brand__sub', opt.sub)); }
        brand.appendChild(nameWrap);

        /* 状态胶囊 */

        statusPill.hidden = true;
        statusPill.appendChild(el('span', 'et-status__dot'));
        var statusText = el('span', null, '');

        api.setStatus = function (text, tone) {

            statusPill.setAttribute('data-tone', tone || 'ok');

        /* 动作区（edupick 交互：右上角聚合设置入口） */
        var actions = el('div', 'et-actions');

            settingsBtn = makeBtn('i-sliders', opt.settings.title || '设置', function () {

        }

        (opt.actions || []).forEach(function (a) {

        if (opt.help) {
            actions.appendChild(makeBtn('i-help', '使用说明', function () { openHelp(); }));
        }

        var themeBtn = makeBtn('', '切换主题', function () {

        actions.appendChild(themeBtn);

        var fsBtn = makeBtn('i-maximize', '全屏', toggleFullscreen);
        actions.appendChild(fsBtn);

        topbar.appendChild(actions);

        function toggleSound() {

            soundBtn.innerHTML = '';
            soundBtn.appendChild(makeIcon(soundEnabled ? 'i-volume' : 'i-volume-off'));
            soundBtn.title = soundEnabled ? '关闭音效' : '开启音效';
            soundBtn.classList.toggle('is-off', !soundEnabled);

        api.openSettings = function () {
            if (settingsBtn) { settingsBtn.click(); }

        }

                var req = root.requestFullscreen || root.webkitRequestFullscreen;
                if (req) { try { req.call(root); } catch (err) { /* 忽略 */ } }
            }
        }

        function syncFsIcon(on) {
            if (!fsBtn) { return; }
            fsBtn.innerHTML = '';
            fsBtn.appendChild(makeIcon(on ? 'i-minimize' : 'i-maximize'));
            fsBtn.title = on ? '退出全屏' : '全屏';
        }

        document.addEventListener('fullscreenchange', function () {
            syncFsIcon(!!(document.fullscreenElement || document.webkitFullscreenElement));
        });
        document.addEventListener('webkitfullscreenchange', function () {
            syncFsIcon(!!(document.fullscreenElement || document.webkitFullscreenElement));
        });
        syncFsIcon(false);

        api.toggleFullscreen = toggleFullscreen;

        /* ---------- 音效 API ---------- */
        api.beep = function (kind) {
            if (!soundEnabled) { return; }
            playBeep(kind);
        };
        api.soundOn = function () { return soundEnabled; };

        api.modal = modal;

        /* ---------- 帮助 ---------- */
        function openHelp() {
            modal({
                title: '使用说明',
                icon: 'i-help',
                size: 'narrow',
                body: opt.help,
                buttons: [{ label: '知道了', primary: true }]
            });
        }
        api.openHelp = openHelp;

        /* ---------- toast ---------- */
        api.toast = toast;

        /* ---------- 页脚（L2 品牌回流，低调一行） ---------- */
        var siteOrigin = typeof global.ET_SITE_ORIGIN === 'string' && /^https?:\/\//.test(global.ET_SITE_ORIGIN)
            ? global.ET_SITE_ORIGIN
            : null;

        function renderFooter() {
            footer.textContent = '';
            footer.appendChild(el('span', null, 'KeeTools 课工具'));
            footer.appendChild(el('span', null, '·'));
            if (siteOrigin) {
                var a = el('a', null, '更多课堂工具');
                a.href = siteOrigin + '/?from=tool-footer&tool=' + encodeURIComponent(toolId);
                a.target = '_blank';
                a.rel = 'noopener';
                footer.appendChild(a);
            } else {
                footer.appendChild(el('span', null, '更多课堂工具'));
            }
        }
        renderFooter();

        /* 站点来源发现：iframe 内向父窗口询问；也可由宿主直接注入 ET_SITE_ORIGIN */
        try {
            if (global.parent && global.parent !== global) {
                global.parent.postMessage(JSON.stringify({ type: 'et-hello', toolId: toolId }), '*');
            }
        } catch (err) { /* 跨域异常忽略 */ }

        global.addEventListener('message', function (ev) {
            var data = ev.data;
            if (typeof data === 'string') {
                try { data = JSON.parse(data); } catch (err) { return; }
            }
            if (!data || typeof data !== 'object') { return; }

            if (data.type === 'et-origin' && typeof data.origin === 'string' && /^https?:\/\//.test(data.origin)) {
                siteOrigin = data.origin;
                if (!global.ET_SITE_ORIGIN) { global.ET_SITE_ORIGIN = data.origin; }
                renderFooter();
            }
            if (data.type === 'et-fullscreen-change' && typeof data.value === 'boolean') {
                syncFsIcon(data.value);

        api.el = { topbar: topbar, main: main, footer: footer, actions: actions };

         * 翻页笔的上下页键在系统层等价于 PageDown / PageUp。
         * 工具通过 opt.primary / opt.secondary 注册动作：
         *   PageDown → primary（主操作，如开始点名 / 开始计时）
         *   PageUp   → secondary（副操作，缺省时同 primary）
         * 输入框聚焦或弹窗/抽屉打开时不响应，避免误触。 */
        if (typeof opt.primary === 'function') {

                if (ev.key !== 'PageDown' && ev.key !== 'PageUp') { return; }
                var tag = (document.activeElement && document.activeElement.tagName) || '';
                if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') { return; }
                if (document.querySelector('.et-modal, .et-drawer-backdrop, .ws-winner')) { return; }
                ev.preventDefault();
                if (ev.key === 'PageDown') { opt.primary(); }
                else if (typeof opt.secondary === 'function') { opt.secondary(); }
                else { opt.primary(); }
            });
        }

        return api;
    }

    global.ET.Chrome = {
        mount: mount,
        modal: modal,
        toast: toast,
        beep: playBeep /* 挂载前的独立音效入口（不经过音效开关） */
    };
})(window);
</script>

/*!
 * et-stats.js — 使用统计模块（模块化，可整体移除）
 *
 * 共享逻辑源。改这里，然后跑：python scripts/sync_shared.py
 * 依赖：无（可脱离 et-util / et-chrome 独立运行）。
 * 全局：ET.Stats
 *
 * ┌────────────────────────────────────────────────────────────────┐
 * │ 说明：本模块只做一件事——工具被打开时向上报端点发一条匿名计数。 │
 * │ · 在线（iframe 内）：宿主页面已服务端计数，本模块不重复上报。   │
 * │ · 离线打开（file:// / 下载单文件 / 离线包）：联网条件具备时，   │
 * │   以 sendBeacon 上报 use_offline 事件（text/plain 免预检）。    │
 * │ · 上报端点 = window.ET_SITE_ORIGIN（由宿主注入或离线包配置）。  │
 * │   未配置端点时本模块完全静默，不发任何请求。                    │
 * │ · **整个 <script> 块可安全删除**：删除后工具其余功能完全正常，  │
 * │   且完全不再发起任何网络请求。                                  │
 * └────────────────────────────────────────────────────────────────┘
 */
(function (global) {
    'use strict';

    var ET = global.ET = global.ET || {};

    var Stats = {
        /** 上报端点来源（站点绝对地址，无协议尾斜杠） */
        endpoint: (typeof global.ET_SITE_ORIGIN === 'string' && /^https?:\/\//.test(global.ET_SITE_ORIGIN))
            ? global.ET_SITE_ORIGIN
            : null,

        _done: {},

        /**
         * 上报一次事件（同一事件同一工具每次页面加载只报一次）。
         * event: 'use_offline' 等；toolId: 工具 id。
         */
        send: function (event, toolId) {
            if (!event || this._done[event + ':' + (toolId || '')]) { return false; }
            if (!this.endpoint) { return false; }
            /* iframe 内由宿主统计，避免双计 */
            try {
                if (global.parent && global.parent !== global) { return false; }
            } catch (err) { return false; }
            /* 断网时挂起，网络恢复自动补报一次 */
            if (global.navigator && global.navigator.onLine === false) {
                var self = this;
                global.addEventListener('online', function () { self.send(event, toolId); }, { once: true });
                return false;
            }

            this._done[event + ':' + (toolId || '')] = true;
            var payload = JSON.stringify({ event: event, tool: toolId || '' });

            try {
                if (global.navigator.sendBeacon) {
                    return global.navigator.sendBeacon(
                        this.endpoint + '/api/track',
                        new Blob([payload], { type: 'text/plain;charset=UTF-8' })
                    );
                }
                global.fetch(this.endpoint + '/api/track', {
                    method: 'POST',
                    body: payload,
                    keepalive: true,
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'text/plain;charset=UTF-8' }
                });
                return true;
            } catch (err) {
                return false;
            }
        }
    };

    ET.Stats = Stats;
})(window);
</script>

        }
    };

    /* 常见别名，照顾课本与习惯写法 */
    FUNCS.arcsin = FUNCS.asin;
    FUNCS.arccos = FUNCS.acos;
    FUNCS.arctan = FUNCS.atan;
    FUNCS.log10 = FUNCS.log;
    FUNCS.tg = FUNCS.tan;
    FUNCS.ctg = FUNCS.cot;
    FUNCS.lg = FUNCS.log;
    FUNCS.mod = function (v) { return Math.abs(v); };
    FUNCS.int = Math.floor;

    /* |x| → abs(x)：非嵌套绝对值 */
    function convertBars(s) {
        var out = '';
        var open = true;
        for (var i = 0; i < s.length; i++) {
            var c = s.charAt(i);
            if (c === '|') {
                out += open ? 'abs(' : ')';
                open = !open;
            } else {
                out += c;
            }
        }
        return out;
    }

    function normalize(src) {
        var s = String(src === undefined || src === null ? '' : src);
        s = s.replace(/[（【\[]/g, '(').replace(/[）】\]]/g, ')');
        s = s.replace(/[×＊·∙⋅✕]/g, '*').replace(/[÷／]/g, '/');
        s = s.replace(/[－—–−]/g, '-').replace(/＋/g, '+');
        s = s.replace(/．|。/g, '.');
        s = s.replace(/\*\*/g, '^');
        s = s.replace(/²/g, '^2').replace(/³/g, '^3');
        s = s.replace(/√/g, 'sqrt ');
        s = s.replace(/π/g, 'pi');
        /* 允许整体全角输入 */
        s = s.replace(/[Ａ-Ｚａ-ｚ０-９]/g, function (c) {
            return String.fromCharCode(c.charCodeAt(0) - 0xFEE0);
        });
        /* 去掉开头的 y= / f(x)= （空格式写法也兼容） */
        s = s.replace(/^\s*y\s*=\s*/i, '').replace(/^\s*f\s*\(\s*x\s*\)\s*=\s*/i, '');
        return convertBars(s);
    }

    function tokenize(s) {
        var tokens = [];
        var i = 0;
        while (i < s.length) {
            var c = s.charAt(i);
            /* 空白仅作分隔符：让「sin x」「sqrt x」这类写法与「sin(x)」等价 */
            if (c === ' ' || c === '\t' || c === '\n' || c === '\r' || c === '\u3000') {
                i++;
                continue;
            }
            if ((c >= '0' && c <= '9') || c === '.') {
                var num = '';
                while (i < s.length && ((s.charAt(i) >= '0' && s.charAt(i) <= '9') || s.charAt(i) === '.')) {
                    num += s.charAt(i);
                    i++;
                }
                if (isNaN(Number(num))) { throw new Error('数字格式有误：' + num); }
                tokens.push({ t: 'num', v: Number(num) });
                continue;
            }
            if (/[a-zA-Z]/.test(c)) {
                var name = '';
                while (i < s.length && /[a-zA-Z]/.test(s.charAt(i))) {
                    name += s.charAt(i);
                    i++;
                }
                /* log2 / log10 / asinh 这类含数字的函数名：仅当「字母 + 数字」确实是已注册函数时才吃进数字，
                   否则保持原样（x2 仍是 x 乘 2） */
                var digits = '';
                var probe = i;
                while (probe < s.length && /[0-9]/.test(s.charAt(probe))) {
                    digits += s.charAt(probe);
                    probe++;
                }
                if (digits && FUNCS[(name + digits).toLowerCase()]) {
                    name = name + digits;
                    i = probe;
                }
                tokens.push({ t: 'name', v: name.toLowerCase() });
                continue;
            }
            if ('+-*/^()'.indexOf(c) !== -1) {
                tokens.push({ t: c === '(' ? 'lp' : (c === ')' ? 'rp' : 'op'), v: c });
                i++;
                continue;
            }
            throw new Error('不认识的字符：' + c);
        }
        return tokens;
    }

    function compile(src) {
        var tokens = tokenize(normalize(src));
        if (!tokens.length) { throw new Error('请输入解析式，例如 x^2-2x-3'); }

        var pos = 0;

        function peek() { return tokens[pos]; }
        function isOp(v) { var t = peek(); return !!t && t.t === 'op' && t.v === v; }
        function mul(a, b) { return function (x) { return a(x) * b(x); }; }

        function primary() {
            var t = peek();
            if (!t) { throw new Error('解析式不完整'); }

            if (t.t === 'num') {
                pos++;
                var value = t.v;
                return function () { return value; };
            }

            if (t.t === 'lp') {
                pos++;
                var inner = expr();
                if (!peek() || peek().t !== 'rp') { throw new Error('括号没有闭合'); }
                pos++;
                return inner;
            }

            if (t.t === 'name') {
                var name = t.v;
                pos++;
                if (name === 'x') { return function (x) { return x; }; }
                if (name === 'pi') { return function () { return Math.PI; }; }
                if (name === 'e') { return function () { return Math.E; }; }
                if (name === 'tau') { return function () { return Math.PI * 2; }; }
                if (name === 'phi') { return function () { return (1 + Math.sqrt(5)) / 2; }; }
                var fn = FUNCS[name];
                if (!fn) { throw new Error('不认识的符号：' + name); }
                var argFn;
                if (peek() && peek().t === 'lp') {
                    pos++;
                    argFn = expr();
                    if (!peek() || peek().t !== 'rp') { throw new Error('函数 ' + name + ' 的括号没有闭合'); }
                    pos++;
                } else {
                    argFn = unary();
                }
                return function (x) { return fn(argFn(x)); };
            }

            throw new Error('解析式不完整');
        }

        function power() {
            var base = primary();
            if (isOp('^')) {
                pos++;
                var ex = unary();
                return function (x) { return Math.pow(base(x), ex(x)); };
            }
            return base;
        }

        function unary() {
            if (isOp('-')) {
                pos++;
                var a = unary();
                return function (x) { return -a(x); };
            }
            if (isOp('+')) {
                pos++;
                return unary();
            }
            return power();
        }

        function term() {
            var left = unary();
            for (;;) {
                var t = peek();
                if (!t) { break; }
                if (t.t === 'op' && (t.v === '*' || t.v === '/')) {
                    pos++;
                    var right = unary();
                    left = t.v === '*' ? mul(left, right)
                        : (function (a, b) { return function (x) { return a(x) / b(x); }; })(left, right);
                    continue;
                }
                /* 隐式乘法：2x、3(x+1)、x sin x */
                if (t.t === 'num' || t.t === 'name' || t.t === 'lp') {
                    left = mul(left, unary());
                    continue;
                }
                break;
            }
            return left;
        }

        function expr() {
            var left = term();
            for (;;) {
                var t = peek();
                if (!t || t.t !== 'op' || (t.v !== '+' && t.v !== '-')) { break; }
                pos++;
                var right = term();
                left = (function (a, b, op) {
                    return op === '+'
                        ? function (x) { return a(x) + b(x); }
                        : function (x) { return a(x) - b(x); };
                })(left, right, t.v);
            }
            return left;
        }

        var fn = expr();
        if (pos < tokens.length) { throw new Error('解析式有多余内容'); }
        return fn;
    }

    /* ============ 状态 ============ */

    var cv = document.getElementById('cv');
    var ctx = cv.getContext('2d');

    var W = 800;
    var H = 600;
    var view = { cx: 0, cy: 0, ppu: 60 };
    var f = null;
    var trace = null;
    var keyPoints = [];
    var rafId = 0;

    var settings = {
        grid: store.get('grid', true) !== false,
        keys: store.get('keys', true) !== false,
        table: store.get('table', false) === true,
        deg: store.get('deg', false) === true
    };

    degMode = settings.deg;

    function safeEval(x) {
        if (!f) { return NaN; }
        try {
            var v = f(x);
            return typeof v === 'number' ? v : NaN;
        } catch (err) {
            return NaN;
        }
    }

    function toPx(x) { return (x - view.cx) * view.ppu + W / 2; }
    function toPy(y) { return H / 2 - (y - view.cy) * view.ppu; }
    function toX(px) { return (px - W / 2) / view.ppu + view.cx; }
    function toY(py) { return (H / 2 - py) / view.ppu + view.cy; }

    function cssVar(name, fallback) {
        try {
            var v = window.getComputedStyle(document.documentElement).getPropertyValue(name);
            v = String(v || '').replace(/^\s+|\s+$/g, '');
            return v || fallback;
        } catch (err) {
            return fallback;
        }
    }

    function trimNum(v, digits) {
        var d = typeof digits === 'number' ? digits : 2;
        var s = Number(v).toFixed(d);
        s = s.replace(/0+$/, '').replace(/\.$/, '');
        return (s === '-0' || s === '') ? '0' : s;
    }

    var chrome = ET.Chrome.mount({
        toolId: TOOL_ID,
        title: '函数图像绘制器',
        sub: '数学 · 输入解析式即时绘图',
        accent: '#2563eb',
        status: '就绪',
        sound: true,
        primary: function () { applyExpr(document.getElementById('expr').value, true); },
        secondary: resetView,
        settings: { title: '绘图设置', build: buildSettings },
        help: '<div style="font-size:13.5px;line-height:2">' +
            '<p style="margin:0 0 8px"><b>输入解析式</b>：支持 + − × ÷ ^ 与括号（<code>**</code> 等同 <code>^</code>），可省略乘号（2x、3(x+1) 都行），函数可带括号也可空格分隔（<code>sin x</code> = <code>sin(x)</code>），支持 |x| 绝对值、√ 根号、² ³ 上下标，y= 开头可省略；全角字符会自动转换。</p>' +
            '<p style="margin:0 0 8px"><b>函数库</b>：<br>' +
            '· 三角：sin cos tan cot sec csc；反三角 asin acos atan（别名 arcsin 等）<br>' +
            '· 双曲：sinh cosh tanh asinh acosh atanh<br>' +
            '· 幂根对数：sqrt cbrt abs ln log(10) log2 exp<br>' +
            '· 取整分段：floor ceil round sign frac step relu clamp<br>' +
            '· 有趣波形：gauss（钟形）sinc（sin x/x）square（方波）triangle（三角波）saw（锯齿波）<br>' +
            '· 常量：pi e tau phi</p>' +
            '<p style="margin:0 0 8px"><b>看图像</b>：按住拖动可平移，滚轮缩放，鼠标移到图上会实时读出该点的坐标；点「自适应」按函数值自动调整纵向范围。</p>' +
            '<p style="margin:0 0 8px"><b>关键点</b>：自动标出与 y 轴交点、与 x 轴交点（蓝色）与最高 / 最低点（红色），便于讲二次函数顶点、方程根。</p>' +
            '<p style="margin:0 0 8px"><b>数值表</b>：勾选后右上角出现 x / y 对应表；「导出 PNG」把当前画布保存为图片，可直接插入课件。</p>' +
            '<p style="margin:0"><b>快捷键</b>：回车 = 绘制；↑↓←→ 平移；+ / − 缩放；R 重置；翻页笔下页键 = 绘制。</p></div>'
    });

    /* ============ 画布绘制 ============ */

    function niceStep(targetPx) {
        var raw = targetPx / view.ppu;
        if (!isFinite(raw) || raw <= 0) { return 1; }
        var exp = Math.floor(Math.log(raw) / Math.LN10);
        var base = Math.pow(10, exp);
        var m = raw / base;
        var mult = m <= 1 ? 1 : (m <= 2 ? 2 : (m <= 5 ? 5 : 10));
        return mult * base;
    }

    function tickLabel(v, step) {
        if (Math.abs(v) < step / 1e6) { return '0'; }
        var dec = Math.max(0, Math.min(6, Math.ceil(-Math.log(step) / Math.LN10)));
        return Number(v).toFixed(dec);
    }

    function draw() {
        var cBg = cssVar('--et-surface', '#ffffff');
        var cLine = cssVar('--et-line', 'rgba(15,23,42,.12)');
        var cMuted = cssVar('--et-muted', '#64748b');
        var cFg = cssVar('--et-fg', '#0b1220');
        var cAccent = cssVar('--et-accent', '#2563eb');

        ctx.clearRect(0, 0, W, H);
        ctx.fillStyle = cBg;
        ctx.fillRect(0, 0, W, H);

        var step = niceStep(88);
        var xMin = toX(0);
        var xMax = toX(W);
        var yMin = toY(H);
        var yMax = toY(0);
        var x, y, px, py;

        /* 网格 */
        if (settings.grid) {
            ctx.strokeStyle = cLine;
            ctx.lineWidth = 1;
            ctx.beginPath();
            x = Math.ceil(xMin / step) * step;
            for (; x <= xMax; x += step) {
                px = Math.round(toPx(x)) + 0.5;
                ctx.moveTo(px, 0);
                ctx.lineTo(px, H);
            }
            y = Math.ceil(yMin / step) * step;
            for (; y <= yMax; y += step) {
                py = Math.round(toPy(y)) + 0.5;
                ctx.moveTo(0, py);
                ctx.lineTo(W, py);
            }
            ctx.stroke();
        }

        /* 坐标轴 */
        var axisY = toPy(0);
        var axisX = toPx(0);
        ctx.strokeStyle = cMuted;
        ctx.lineWidth = 1.6;
        ctx.beginPath();
        if (axisY >= -1 && axisY <= H + 1) {
            ctx.moveTo(0, Math.round(axisY) + 0.5);
            ctx.lineTo(W, Math.round(axisY) + 0.5);
        }
        if (axisX >= -1 && axisX <= W + 1) {
            ctx.moveTo(Math.round(axisX) + 0.5, 0);
            ctx.lineTo(Math.round(axisX) + 0.5, H);
        }
        ctx.stroke();

        /* 刻度 */
        ctx.fillStyle = cMuted;
        ctx.font = '12px ' + FONT;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'top';
        var labelY = Math.min(Math.max(axisY + 5, 4), H - 18);
        x = Math.ceil(xMin / step) * step;
        for (; x <= xMax; x += step) {
            if (Math.abs(x) < step / 1e6) { continue; }
            ctx.fillText(tickLabel(x, step), toPx(x), labelY);
        }
        ctx.textAlign = 'right';
        ctx.textBaseline = 'middle';
        var labelX = Math.min(Math.max(axisX - 6, 36), W - 4);
        y = Math.ceil(yMin / step) * step;
        for (; y <= yMax; y += step) {
            if (Math.abs(y) < step / 1e6) { continue; }
            ctx.fillText(tickLabel(y, step), labelX, toPy(y));
        }
        ctx.textAlign = 'left';
        ctx.textBaseline = 'top';
        ctx.fillText('O', Math.min(Math.max(axisX + 5, 4), W - 16), Math.min(Math.max(axisY + 5, 4), H - 18));

        /* 曲线 */
        if (f) {
            ctx.strokeStyle = cAccent;
            ctx.lineWidth = 2.6;
            ctx.lineJoin = 'round';
            ctx.lineCap = 'round';
            ctx.beginPath();
            var started = false;
            var prevPy = 0;
            var limit = H * 6;
            for (var p = -2; p <= W + 2; p += 1) {
                var vx = toX(p);
                var vy = safeEval(vx);
                if (!isFinite(vy)) { started = false; continue; }
                var cpy = toPy(vy);
                if (!isFinite(cpy) || cpy < -limit || cpy > limit) { started = false; continue; }
                if (started && Math.abs(cpy - prevPy) > H * 1.6) { started = false; }
                if (started) { ctx.lineTo(p, cpy); } else { ctx.moveTo(p, cpy); started = true; }
                prevPy = cpy;
            }
            ctx.stroke();
        }

        /* 关键点 */
        if (settings.keys && keyPoints.length) {
            for (var i = 0; i < keyPoints.length; i++) {
                var kp = keyPoints[i];
                var kx = toPx(kp.x);
                var ky = toPy(kp.y);
                if (kx < 10 || kx > W - 10 || ky < 10 || ky > H - 10) { continue; }
                ctx.beginPath();
                ctx.arc(kx, ky, 5, 0, Math.PI * 2);
                ctx.fillStyle = cBg;
                ctx.fill();
                ctx.lineWidth = 2.4;
                ctx.strokeStyle = kp.type === 'ext' ? '#dc2626' : cAccent;
                ctx.stroke();

                ctx.fillStyle = cFg;
                ctx.font = '12px ' + FONT;
                ctx.textAlign = 'left';
                ctx.textBaseline = 'bottom';
                var text = kp.label;
                var tw = ctx.measureText(text).width;
                var tx = kx + 9;
                if (tx + tw > W - 8) { tx = kx - 9 - tw; }
                ctx.fillText(text, tx, ky - 8);
            }
        }

        /* 追踪十字线 */
        if (trace && trace.ok) {
            var tpx = trace.px;
            var tpy = toPy(trace.y);
            ctx.strokeStyle = cMuted;
            ctx.lineWidth = 1;
            ctx.setLineDash([4, 4]);
            ctx.beginPath();
            ctx.moveTo(tpx, 0);
            ctx.lineTo(tpx, H);
            ctx.moveTo(0, tpy);
            ctx.lineTo(W, tpy);
            ctx.stroke();
            ctx.setLineDash([]);

            ctx.beginPath();
            ctx.arc(tpx, tpy, 5.5, 0, Math.PI * 2);
            ctx.fillStyle = cAccent;
            ctx.fill();

            var tip = '(' + trimNum(trace.x, 2) + ', ' + trimNum(trace.y, 2) + ')';
            ctx.font = '13px ' + FONT;
            var tipW = ctx.measureText(tip).width;
            var bx = tpx + 12;
            if (bx + tipW + 16 > W) { bx = tpx - tipW - 28; }
            var by = Math.min(Math.max(tpy - 34, 6), H - 34);
            ctx.fillStyle = cssVar('--et-glass', 'rgba(255,255,255,.9)');
            ctx.fillRect(bx, by, tipW + 16, 26);
            ctx.strokeStyle = cMuted;
            ctx.lineWidth = 1;
            ctx.strokeRect(bx + 0.5, by + 0.5, tipW + 15, 25);
            ctx.fillStyle = cFg;
            ctx.textAlign = 'left';
            ctx.textBaseline = 'middle';
            ctx.fillText(tip, bx + 8, by + 14);
            ctx.textBaseline = 'top';
        }
    }

    function scheduleDraw() {
        if (rafId) { return; }
        rafId = window.requestAnimationFrame(function () {
            rafId = 0;
            draw();
        });
    }

    /* ============ 关键点分析 ============ */

    function bisect(a, b) {
        var fa = safeEval(a);
        if (!isFinite(fa)) { return null; }
        for (var i = 0; i < 60; i++) {
            var m = (a + b) / 2;
            var fm = safeEval(m);
            if (!isFinite(fm)) { return null; }
            if (Math.abs(fm) < 1e-12 || (b - a) < 1e-9) { return m; }
            if ((fa > 0) !== (fm > 0)) { b = m; } else { a = m; fa = fm; }
        }
        return (a + b) / 2;
    }

    function analyze() {
        keyPoints = [];
        if (!f) { return; }

        var xMin = toX(0);
        var xMax = toX(W);
        var yMin = toY(H);
        var yMax = toY(0);

        var y0 = safeEval(0);

        /* x 轴交点 */
        var n = 700;
        var prevX = xMin;
        var prevY = safeEval(xMin);
        var roots = [];
        for (var i = 1; i <= n && roots.length < 6; i++) {
            var x = xMin + (xMax - xMin) * i / n;
            var y = safeEval(x);
            if (isFinite(prevY) && isFinite(y) && prevY !== 0 && y !== 0 && (prevY > 0) !== (y > 0)) {
                var r = bisect(prevX, x);
                if (r !== null && isFinite(r)) { roots.push(r); }
            } else if (isFinite(y) && y === 0 && prevY !== 0) {
                roots.push(x);
            }
            prevX = x;
            prevY = y;
        }
        var nearZeroRoot = false;
        for (i = 0; i < roots.length; i++) {
            var dup = false;
            for (var j = 0; j < i; j++) {
                if (Math.abs(roots[i] - roots[j]) < 1e-6) { dup = true; }
            }
            if (dup) { continue; }
            if (Math.abs(roots[i]) < 1e-6) { nearZeroRoot = true; }
            keyPoints.push({ x: roots[i], y: 0, type: 'root', label: '(' + trimNum(roots[i], 3) + ', 0)' });
        }

        /* y 轴交点（已在原点标过就不再重复） */
        if (!nearZeroRoot && isFinite(y0) && y0 >= yMin - 1e-9 && y0 <= yMax + 1e-9) {
            keyPoints.push({ x: 0, y: y0, type: 'root', label: 'y 轴交点 (0, ' + trimNum(y0, 3) + ')' });
        }

        /* 最高 / 最低点（三点抛物线插值） */
        var m = 500;
        var pts = [];
        for (i = 0; i <= m; i++) {
            var pxVal = xMin + (xMax - xMin) * i / m;
            pts.push({ x: pxVal, y: safeEval(pxVal) });
        }
        var found = 0;
        for (i = 1; i < m && found < 4; i++) {
            var a = pts[i - 1].y;
            var b = pts[i].y;
            var c = pts[i + 1].y;
            if (!isFinite(a) || !isFinite(b) || !isFinite(c)) { continue; }
            var isMax = (b > a && b >= c);
            var isMin = (b < a && b <= c);
            if (!isMax && !isMin) { continue; }
            var h = pts[i].x - pts[i - 1].x;
            var den = a - 2 * b + c;
            var xv = Math.abs(den) < 1e-12 ? pts[i].x : pts[i].x + h * (a - c) / (2 * den);
            var yv = safeEval(xv);
            if (!isFinite(yv)) { continue; }
            if (yv < yMin || yv > yMax) { continue; }
            found++;
            keyPoints.push({
                x: xv,
                y: yv,
                type: 'ext',
                label: (isMin ? '最低点 ' : '最高点 ') + '(' + trimNum(xv, 3) + ', ' + trimNum(yv, 3) + ')'
            });
        }
    }

    /* ============ 数值表与信息 ============ */

    function renderTable() {
        var panel = document.getElementById('panel');
        if (!settings.table || !f) {
            panel.hidden = true;
            return;
        }
        panel.hidden = false;

        var xMin = Math.ceil(toX(0));
        var xMax = Math.floor(toX(W));
        var span = xMax - xMin;
        var stepI = span > 44 ? Math.ceil(span / 40) : 1;
        var rows = '';
        var count = 0;
        for (var x = xMin; x <= xMax && count < 44; x += stepI, count++) {
            var y = safeEval(x);
            rows += '<tr><td>' + x + '</td><td>' +
                (isFinite(y) ? trimNum(y, 3) : '—') + '</td></tr>';
        }
        document.getElementById('tableBox').innerHTML =
            '<table><thead><tr><th>x</th><th>y</th></tr></thead><tbody>' + rows + '</tbody></table>';
    }

    function updateInfo() {
        var xMin = toX(0);
        var xMax = toX(W);
        document.getElementById('spanInfo').textContent =
            'x ∈ [' + trimNum(xMin, 2) + ', ' + trimNum(xMax, 2) + ']　' +
            (f ? ('关键点 ' + keyPoints.length + ' 个') : '未绘制');
    }

    function refresh(needAnalyze) {
        if (needAnalyze !== false) { analyze(); }
        renderTable();
        updateInfo();
        draw();
    }

    /* ============ 视图操作 ============ */

    function resize() {
        var stage = document.getElementById('stage');
        var rect = stage.getBoundingClientRect();
        var dpr = window.devicePixelRatio || 1;
        W = Math.max(160, Math.floor(rect.width));
        H = Math.max(140, Math.floor(rect.height));
        cv.width = Math.round(W * dpr);
        cv.height = Math.round(H * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        refresh(false);
    }

    function resetView() {
        view.ppu = Math.max(22, Math.min(W, H) / 12);
        view.cx = 0;
        view.cy = 0;
        refresh(true);
        chrome.beep('tick');
    }

    function autoFit() {
        if (!f) { return; }
        var values = [];
        for (var x = -12; x <= 12; x += 0.05) {
            var y = safeEval(x);
            if (isFinite(y) && Math.abs(y) < 1e6) { values.push(y); }
        }
        if (values.length < 8) {
            chrome.toast('该函数在当前范围内取不到有效值，已回到默认视图', 'warn');
            resetView();
            return;
        }
        values.sort(function (a, b) { return a - b; });
        var lo = values[Math.floor(values.length * 0.05)];
        var hi = values[Math.floor(values.length * 0.95)];
        if (hi - lo < 1e-6) { hi = lo + 2; lo -= 2; }
        var pad = (hi - lo) * 0.16;
        lo -= pad;
        hi += pad;
        view.cx = 0;
        view.cy = (lo + hi) / 2;
        view.ppu = Math.max(2, Math.min(H / (hi - lo), W / ((hi - lo) * 1.5)));
        refresh(true);
        chrome.beep('ok');
        chrome.toast('已按函数值自适应视图');
    }

    function zoomBy(factor) {
        view.ppu = Math.max(1e-3, Math.min(1e6, view.ppu * factor));
        refresh(true);
    }

    /* ============ 应用解析式 ============ */

    function setMsg(text, tone) {
        var el = document.getElementById('msg');
        el.textContent = text || '';
        el.className = 'fg-msg' + (tone === 'err' ? ' is-err' : (tone === 'ok' ? ' is-ok' : ''));
    }

    function applyExpr(text, announce) {
        var raw = String(text === undefined || text === null ? '' : text).replace(/^\s+|\s+$/g, '');
        if (!raw) { raw = 'x'; }

        var fn;
        try {
            fn = compile(raw);
            fn(1.7);
            fn(-2.3);
        } catch (err) {
            document.getElementById('expr').classList.add('is-err');
            setMsg(err && err.message ? err.message : '解析失败', 'err');
            chrome.beep('err');
            return false;
        }

        var compiled = fn;
        f = function (x) {
            try {
                var v = compiled(x);
                return typeof v === 'number' ? v : NaN;
            } catch (err2) {
                return NaN;
            }
        };

        document.getElementById('expr').classList.remove('is-err');
        document.getElementById('tag').textContent = 'y = ' + raw;
        setMsg('绘制成功', 'ok');
        store.set('expr', raw);
        renderChips(raw);
        refresh(true);
        if (announce) { chrome.beep('ok'); }
        return true;
    }

    /* ============ 界面控件 ============ */

    function renderChips(current) {
        var box = document.getElementById('chips');
        box.textContent = '';
        for (var i = 0; i < CHIPS.length; i++) {
            (function (pair) {
                var b = document.createElement('button');
                b.type = 'button';
                b.className = 'fg-chip' + (pair[1] === current ? ' is-active' : '');
                b.textContent = pair[0];
                b.title = '使用示例：' + pair[1];
                b.addEventListener('click', function () {
                    document.getElementById('expr').value = pair[1];
                    applyExpr(pair[1], true);
                });
                box.appendChild(b);
            })(CHIPS[i]);
        }
    }

    /* ============ 设置抽屉 ============ */

    function buildSettings(body) {
        function heading(text) {
            var h = document.createElement('h4');
            h.textContent = text;
            body.appendChild(h);
        }

        function switchRow(label, checked, onChange) {
            var row = document.createElement('label');
            row.className = 'et-drawer__switch';
            row.appendChild(document.createTextNode(label));
            var cb = document.createElement('input');
            cb.type = 'checkbox';
            cb.checked = checked;
            cb.addEventListener('change', function () { onChange(cb.checked); });
            row.appendChild(cb);
            body.appendChild(row);
        }

        function syncCheckbox(id, value) {
            var el = document.getElementById(id);
            if (el) { el.checked = value; }
        }

        heading('显示');
        switchRow('显示网格', settings.grid, function (on) {
            settings.grid = on;
            store.set('grid', on);
            syncCheckbox('chkGrid', on);
            refresh(false);
        });
        switchRow('标注关键点', settings.keys, function (on) {
            settings.keys = on;
            store.set('keys', on);
            syncCheckbox('chkKeys', on);
            refresh(false);
        });
        switchRow('显示数值表', settings.table, function (on) {
            settings.table = on;
            store.set('table', on);
            syncCheckbox('chkTable', on);
            renderTable();
        });

        heading('三角函数');
        switchRow('角度制（sin 30 = 0.5）', settings.deg, function (on) {
            settings.deg = on;
            degMode = on;
            store.set('deg', on);
            applyExpr(document.getElementById('expr').value, false);
        });

        heading('视图');
        var row = document.createElement('div');
        row.className = 'et-drawer__row';
        var fitBtn = document.createElement('button');
        fitBtn.type = 'button';
        fitBtn.className = 'et-btn';
        fitBtn.style.flex = '1 1 40%';
        fitBtn.textContent = '自适应函数值';
        fitBtn.addEventListener('click', function () { autoFit(); });
        var resetBtn = document.createElement('button');
        resetBtn.type = 'button';
        resetBtn.className = 'et-btn';
        resetBtn.style.flex = '1 1 40%';
        resetBtn.textContent = '重置为原点视图';
        resetBtn.addEventListener('click', function () { resetView(); });
        row.appendChild(fitBtn);
        row.appendChild(resetBtn);
        body.appendChild(row);

        var tip = document.createElement('p');
        tip.className = 'et-drawer__tip';
        tip.innerHTML = '当前解析式：<b>y = ' + (document.getElementById('tag').textContent || 'x').replace('y = ', '') + '</b>'
            + '<br>平移拖动、滚轮缩放时，网格刻度会自动选取 1 / 2 / 5 × 10ⁿ 的整数档位，避免出现杂乱小数。'
            + '<br>关键点中<b>蓝色</b>为与坐标轴交点，<b>红色</b>为最高 / 最低点（二次函数即顶点）。'
            + '<br>角度制只影响 sin / cos / tan 与反三角函数的输入输出单位（默认弧度制）。';
        body.appendChild(tip);
    }

    /* ============ 事件绑定 ============ */

    function bindCanvas() {
        var dragging = false;
        var lastX = 0;
        var lastY = 0;
        var moved = false;

        cv.addEventListener('pointerdown', function (ev) {
            dragging = true;
            moved = false;
            lastX = ev.clientX;
            lastY = ev.clientY;
            cv.classList.add('is-drag');
            if (cv.setPointerCapture) {
                try { cv.setPointerCapture(ev.pointerId); } catch (err) { /* 忽略 */ }
            }
            ev.preventDefault();
        });

        cv.addEventListener('pointermove', function (ev) {
            if (dragging) {
                var dx = ev.clientX - lastX;
                var dy = ev.clientY - lastY;
                if (Math.abs(dx) + Math.abs(dy) > 1) { moved = true; }
                view.cx -= dx / view.ppu;
                view.cy += dy / view.ppu;
                lastX = ev.clientX;
                lastY = ev.clientY;
                scheduleDraw();
                return;
            }
            var rect = cv.getBoundingClientRect();
            var px = ev.clientX - rect.left;
            var y = safeEval(toX(px));
            trace = { x: toX(px), y: y, px: px, ok: isFinite(y) };
            scheduleDraw();
        });

        function endDrag() {
            if (!dragging) { return; }
            dragging = false;
            cv.classList.remove('is-drag');
            if (moved) { refresh(true); }
        }

        cv.addEventListener('pointerup', endDrag);
        cv.addEventListener('pointercancel', endDrag);
        cv.addEventListener('pointerleave', function () {
            if (dragging) { return; }
            trace = null;
            scheduleDraw();
        });

        cv.addEventListener('wheel', function (ev) {
            ev.preventDefault();
            var rect = cv.getBoundingClientRect();
            var px = ev.clientX - rect.left;
            var py = ev.clientY - rect.top;
            var mx = toX(px);
            var my = toY(py);
            var factor = Math.pow(1.0015, -ev.deltaY);
            var next = Math.max(1e-3, Math.min(1e6, view.ppu * factor));
            if (next === view.ppu) { return; }
            view.ppu = next;
            view.cx = mx - (px - W / 2) / view.ppu;
            view.cy = my + (py - H / 2) / view.ppu;
            refresh(true);
        }, { passive: false });
    }

    document.getElementById('btnDraw').addEventListener('click', function () {
        applyExpr(document.getElementById('expr').value, true);
    });

    document.getElementById('expr').addEventListener('keydown', function (ev) {
        if (ev.key === 'Enter') {
            ev.preventDefault();
            applyExpr(ev.target.value, true);
        }
    });

    document.getElementById('btnZoomIn').addEventListener('click', function () { zoomBy(1.25); });
    document.getElementById('btnZoomOut').addEventListener('click', function () { zoomBy(0.8); });
    document.getElementById('btnReset').addEventListener('click', resetView);
    document.getElementById('btnFit').addEventListener('click', autoFit);

    document.getElementById('chkGrid').addEventListener('change', function (ev) {
        settings.grid = ev.target.checked;
        store.set('grid', settings.grid);
        refresh(false);
    });
    document.getElementById('chkKeys').addEventListener('change', function (ev) {
        settings.keys = ev.target.checked;
        store.set('keys', settings.keys);
        refresh(false);
    });
    document.getElementById('chkTable').addEventListener('change', function (ev) {
        settings.table = ev.target.checked;
        store.set('table', settings.table);
        renderTable();
    });

    document.getElementById('btnPng').addEventListener('click', function () {
        try {
            var url = cv.toDataURL('image/png');
            var a = document.createElement('a');
            a.href = url;
            a.download = 'function-graph.png';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            chrome.toast('已导出 PNG，可直接插入课件');
        } catch (err) {
            chrome.toast('当前环境不支持导出图片，可改用系统截图', 'err');
        }
    });

    document.addEventListener('keydown', function (ev) {
        var node = document.activeElement;
        var tag = node && node.tagName ? node.tagName.toUpperCase() : '';
        if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT' || (node && node.isContentEditable)) { return; }
        if (document.querySelector('.et-modal, .et-drawer-backdrop')) { return; }

        var pan = 40 / view.ppu;
        if (ev.key === 'ArrowLeft') { view.cx -= pan; refresh(true); ev.preventDefault(); }
        else if (ev.key === 'ArrowRight') { view.cx += pan; refresh(true); ev.preventDefault(); }
        else if (ev.key === 'ArrowUp') { view.cy += pan; refresh(true); ev.preventDefault(); }
        else if (ev.key === 'ArrowDown') { view.cy -= pan; refresh(true); ev.preventDefault(); }
        else if (ev.key === '+' || ev.key === '=') { zoomBy(1.25); ev.preventDefault(); }
        else if (ev.key === '-' || ev.key === '_') { zoomBy(0.8); ev.preventDefault(); }
        else if (ev.key === 'r' || ev.key === 'R') { resetView(); ev.preventDefault(); }
        else if (ev.code === 'Space' || ev.key === ' ') {
            ev.preventDefault();
            applyExpr(document.getElementById('expr').value, true);
        }
    });

    window.addEventListener('resize', function () {
        window.clearTimeout(window.__fgResize);
        window.__fgResize = window.setTimeout(resize, 140);
    });

    /* 主题切换后重绘（跟随 data-et-theme 变化） */
    try {
        var observer = new MutationObserver(function () { scheduleDraw(); });
        observer.observe(document.documentElement, { attributes: true, attributeFilter: ['data-et-theme'] });
    } catch (err) { /* 老内核无 MutationObserver：忽略 */ }

    /* ============ 启动 ============ */

    var savedExpr = store.get('expr', 'x');
    if (typeof savedExpr !== 'string' || !savedExpr) { savedExpr = 'x'; }
    document.getElementById('expr').value = savedExpr;
    document.getElementById('chkGrid').checked = settings.grid;
    document.getElementById('chkKeys').checked = settings.keys;
    document.getElementById('chkTable').checked = settings.table;

    bindCanvas();
    resize();
    resetView();
    applyExpr(savedExpr, false);
})();
</script>

</body>
