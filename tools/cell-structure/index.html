/*!

/* ============ 设计令牌 ============ */
:root {
    --et-accent: #2563eb;
    --et-accent-weak: rgba(37, 99, 235, .14);
    --et-bg: #f4f6fb;
    --et-surface: #ffffff;
    --et-surface-2: #f8fafc;
    --et-fg: #0b1220;
    --et-muted: #64748b;
    --et-line: rgba(15, 23, 42, .12);
    --et-line-strong: rgba(15, 23, 42, .22);
    --et-glass: rgba(255, 255, 255, .85);
    --et-shadow-md: 0 10px 28px -18px rgba(15, 23, 42, .3);
    --et-shadow-lg: 0 24px 60px -32px rgba(15, 23, 42, .4);
    --et-ok: #059669;
    --et-warn: #d97706;
    --et-err: #dc2626;
    --et-radius: 12px;
    --et-radius-sm: 9px;
    --et-font: -apple-system, BlinkMacSystemFont, "Segoe UI",
               "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei",
               "Noto Sans SC", sans-serif;
    --et-mono: ui-monospace, "Cascadia Mono", Consolas, Menlo, monospace;
}

html[data-et-theme="dark"] {
    --et-bg: #0b1120;
    --et-surface: #111a2e;
    --et-surface-2: #0f1729;
    --et-fg: #f1f5f9;
    --et-muted: #94a3b8;
    --et-line: rgba(148, 163, 184, .18);
    --et-line-strong: rgba(148, 163, 184, .3);
    --et-glass: rgba(17, 26, 46, .85);
    --et-shadow-md: 0 10px 34px -18px rgba(0, 0, 0, .8);
    --et-shadow-lg: 0 24px 70px -30px rgba(0, 0, 0, .9);
    --et-ok: #34d399;
    --et-warn: #fbbf24;
    --et-err: #f87171;
}

/* ============ 基础 ============ */

/* body 作为外壳时必须清掉浏览器默认 8px 外边距，
   否则 iframe 预览中文档会比视口高 16px（底部白边 + 多余滚动） */
body.et-app {
    margin: 0;
}

.et-app {
    position: relative;
    isolation: isolate;
    display: flex;
    flex-direction: column;
    height: 100vh;
    height: 100dvh;
    overflow: hidden;
    background: var(--et-bg);
    color: var(--et-fg);
    font-family: var(--et-font);
    -webkit-font-smoothing: antialiased;
    transition: background .25s, color .25s;
}

/* 极光背景：径向渐变 + 呼吸动画（edupick 品质基线，老内核也不掉帧） */
.et-app::before {
    content: '';
    position: fixed;
    inset: 0;
    z-index: -1;
    pointer-events: none;
    background:
        radial-gradient(46% 40% at 20% 18%, var(--et-accent-weak), transparent 65%),
        radial-gradient(42% 38% at 82% 24%, var(--et-accent-weak), transparent 70%),
        radial-gradient(50% 44% at 55% 95%, rgba(16, 185, 129, .10), transparent 65%);
    animation: et-aurora 16s ease-in-out infinite alternate;
}

@keyframes et-aurora {
    from { opacity: .55; transform: scale(1); }
    to { opacity: 1; transform: scale(1.06); }
}

.et-app *,
.et-app *::before,
.et-app *::after { box-sizing: border-box; }

[hidden] { display: none !important; }

.et-icon {
    width: 18px;
    height: 18px;
    fill: none;
    stroke: currentColor;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
    flex: none;
}

/* ============ 顶栏 ============ */
.et-topbar {
    flex: none;
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 11px 20px;
    border-bottom: 1px solid var(--et-line);
    background: var(--et-glass);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    z-index: 20;
}

.et-brand {
    display: flex;
    align-items: center;
    gap: 10px;
    min-width: 0;
}

.et-brand__dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: var(--et-accent);
    box-shadow: 0 0 0 4px var(--et-accent-weak);
    flex: none;
}

.et-brand__name {
    font-weight: 800;
    font-size: 15px;
    letter-spacing: -.01em;
    white-space: nowrap;
}

.et-brand__sub {
    font-size: 12.5px;
    color: var(--et-muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.et-status {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 5px 14px;
    border-radius: 999px;
    font-size: 12.5px;
    color: var(--et-muted);
    background: var(--et-surface-2);
    border: 1px solid var(--et-line);
    white-space: nowrap;
    max-width: 42vw;
    overflow: hidden;
    text-overflow: ellipsis;
}

.et-status__dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--et-ok);
    flex: none;
    transition: background .2s;
}

.et-status[data-tone="err"] .et-status__dot { background: var(--et-err); }
.et-status[data-tone="warn"] .et-status__dot { background: var(--et-warn); }

.et-actions {
    display: flex;
    align-items: center;
    gap: 7px;
}

.et-icon-btn {
    display: inline-grid;
    place-items: center;
    width: 38px;
    height: 38px;
    font-size: 16px;
    line-height: 1;
    border-radius: 11px;
    border: 1px solid var(--et-line);
    background: var(--et-surface-2);
    color: var(--et-fg);
    cursor: pointer;
    transition: transform .14s, border-color .14s, color .14s, opacity .14s;
    -webkit-tap-highlight-color: transparent;
}

.et-icon-btn:hover {
    border-color: var(--et-accent);
    color: var(--et-accent);
    transform: translateY(-1px);
}

.et-icon-btn:active { transform: translateY(0); }
.et-icon-btn.is-off { opacity: .4; }
.et-icon-btn:focus-visible { outline: 2px solid var(--et-accent); outline-offset: 2px; }

/* ============ 主区默认 ============ */
.et-main {
    flex: 1;
    min-height: 0;
    position: relative;
    overflow: auto;
}

/* ============ 页脚（品牌回流 L2） ============ */
.et-footer {
    flex: none;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 7px 16px;
    font-size: 12px;
    color: var(--et-muted);
    border-top: 1px solid var(--et-line);
    background: var(--et-glass);
    user-select: none;
    z-index: 20;
}

.et-footer a {
    color: inherit;
    text-decoration: none;
    transition: color .14s;
}

.et-footer a:hover { color: var(--et-accent); }

/* ============ 按钮 ============ */
.et-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
    padding: 9px 16px;
    border-radius: 11px;
    font: inherit;
    font-size: 13.5px;
    font-weight: 700;
    border: 1px solid var(--et-line);
    background: var(--et-surface-2);
    color: var(--et-fg);
    cursor: pointer;
    transition: transform .14s, border-color .14s, color .14s, background .14s, box-shadow .14s;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
}

.et-btn:hover {
    border-color: var(--et-accent);
    color: var(--et-accent);
    transform: translateY(-1px);
}

.et-btn:active { transform: translateY(0); }
.et-btn:focus-visible { outline: 2px solid var(--et-accent); outline-offset: 2px; }
.et-btn:disabled { opacity: .45; cursor: not-allowed; transform: none; }

.et-btn--primary {
    background: var(--et-accent);
    border-color: var(--et-accent);
    color: #fff;
    box-shadow: 0 6px 18px -8px var(--et-accent);
}

.et-btn--primary:hover { color: #fff; filter: brightness(1.08); }
.et-btn--primary:disabled { filter: none; }

.et-btn--danger:hover {
    border-color: var(--et-err);
    color: var(--et-err);
}

.et-btn--lg {
    padding: 13px 26px;
    font-size: 16px;
    border-radius: 14px;
}

/* ============ 弹窗 ============ */
.et-modal {
    position: fixed;
    inset: 0;
    z-index: 100;
    display: grid;
    place-items: center;
    padding: 24px;
    background: rgba(2, 6, 23, .55);
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    animation: et-fade .18s ease;
}

.et-modal__panel {
    width: min(680px, 94vw);
    max-height: 86vh;
    max-height: 86dvh;
    display: flex;
    flex-direction: column;
    background: var(--et-surface);
    border: 1px solid var(--et-line);
    border-radius: 16px;
    box-shadow: var(--et-shadow-lg);
    animation: et-pop .2s cubic-bezier(.34, 1.4, .64, 1);
    overflow: hidden;
}

.et-modal__panel--narrow { width: min(460px, 92vw); }
.et-modal__panel--wide { width: min(900px, 94vw); }

.et-modal__head {
    flex: none;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 16px 20px;
    border-bottom: 1px solid var(--et-line);
    font-weight: 800;
    font-size: 15px;
}

.et-modal__head .et-icon-btn {
    margin-left: auto;
    width: 32px;
    height: 32px;
}

.et-modal__body {
    flex: 1;
    min-height: 0;
    overflow: auto;
    padding: 18px 20px;
}

.et-modal__foot {
    flex: none;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 14px 20px;
    border-top: 1px solid var(--et-line);
    background: var(--et-surface-2);
}

.et-modal__foot .spacer { flex: 1; }

@keyframes et-fade {
    from { opacity: 0; }
}

@keyframes et-pop {
    from { opacity: 0; transform: translateY(14px) scale(.97); }
}

/* ============ 轻提示（toast） ============ */
.et-toast {
    position: fixed;
    left: 50%;
    bottom: 56px;
    transform: translateX(-50%) translateY(10px);
    z-index: 120;
    display: flex;
    align-items: center;
    gap: 9px;
    max-width: min(520px, 88vw);
    padding: 11px 18px;
    border-radius: 12px;
    font-size: 13.5px;
    font-weight: 600;
    color: #fff;
    background: rgba(15, 23, 42, .92);
    border: 1px solid rgba(148, 163, 184, .25);
    box-shadow: var(--et-shadow-lg);
    opacity: 0;
    pointer-events: none;
    transition: opacity .22s, transform .22s;
}

.et-toast.is-show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
}

.et-toast[data-tone="ok"] { background: rgba(5, 150, 105, .95); }
.et-toast[data-tone="err"] { background: rgba(220, 38, 38, .95); }
.et-toast[data-tone="warn"] { background: rgba(217, 119, 6, .95); }

/* ============ 设置抽屉（右上角入口，edupick 交互） ============ */
.et-drawer-backdrop {
    position: fixed;
    inset: 0;
    z-index: 90;
    background: rgba(2, 6, 23, .45);
    backdrop-filter: blur(3px);
    -webkit-backdrop-filter: blur(3px);
    opacity: 0;
    transition: opacity .2s;
}

.et-drawer-backdrop.is-open { opacity: 1; }

.et-drawer {
    position: absolute;
    top: 0;
    right: 0;
    height: 100%;
    width: min(400px, 92vw);
    display: flex;
    flex-direction: column;
    background: var(--et-surface);
    border-left: 1px solid var(--et-line);
    box-shadow: var(--et-shadow-lg);
    transform: translateX(100%);
    transition: transform .22s cubic-bezier(.32, .72, .35, 1);
}

.et-drawer-backdrop.is-open .et-drawer { transform: translateX(0); }

.et-drawer__head {
    flex: none;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 15px 18px;
    border-bottom: 1px solid var(--et-line);
    font-weight: 800;
    font-size: 15px;
    color: var(--et-accent);
}

.et-drawer__head .et-icon-btn {
    margin-left: auto;
    width: 32px;
    height: 32px;
}

.et-drawer__body {
    flex: 1;
    min-height: 0;
    overflow: auto;
    padding: 16px 18px 24px;
}

/* 抽屉内容通用小节（工具复用） */
.et-drawer__body h4 {
    margin: 18px 0 8px;
    font-size: 12px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: .08em;
    color: var(--et-muted);
}

.et-drawer__body h4:first-child { margin-top: 0; }

.et-drawer__row {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
}

.et-drawer__tip {
    margin: 8px 0 0;
    font-size: 12px;
    line-height: 1.8;
    color: var(--et-muted);
}

.et-drawer__tip b { color: var(--et-fg); }

.et-drawer__input {
    flex: 1;
    min-width: 0;
    padding: 9px 12px;
    border: 1px solid var(--et-line-strong);
    border-radius: 9px;
    background: var(--et-surface-2);
    color: var(--et-fg);
    font: inherit;
    font-size: 13.5px;
    transition: border-color .14s, box-shadow .14s;
}

.et-drawer__input:focus {
    outline: none;
    border-color: var(--et-accent);
    box-shadow: 0 0 0 3px var(--et-accent-weak);
}

.et-drawer__switch {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 10px 0;
    border-bottom: 1px dashed var(--et-line);
    font-size: 13.5px;
    font-weight: 600;
    color: var(--et-fg);
    cursor: pointer;
    user-select: none;
}

.et-drawer__switch input {
    width: 17px;
    height: 17px;
    accent-color: var(--et-accent);
    cursor: pointer;
}
</style>

    function modal(mo) {
        var backdrop = el('div', 'et-modal');
        var panel = el('div', 'et-modal__panel' + (mo.size === 'narrow' ? ' et-modal__panel--narrow'
            : mo.size === 'wide' ? ' et-modal__panel--wide' : ''));
        var head = el('div', 'et-modal__head');
        if (mo.icon) { head.appendChild(makeIcon(mo.icon)); }
        head.appendChild(el('span', null, mo.title || ''));
        head.appendChild(makeBtn('i-x', '关闭', close));
        panel.appendChild(head);

        var body = el('div', 'et-modal__body');
        if (typeof mo.body === 'string') { body.innerHTML = mo.body; }
        else if (mo.body) { body.appendChild(mo.body); }
        panel.appendChild(body);

        var foot = null;
        if (mo.buttons && mo.buttons.length) {
            foot = el('div', 'et-modal__foot');
            foot.appendChild(el('span', 'spacer'));
            mo.buttons.forEach(function (b) {
                var btn = el('button', 'et-btn' + (b.primary ? ' et-btn--primary' : '') + (b.danger ? ' et-btn--danger' : ''), b.label);
                btn.type = 'button';
                btn.addEventListener('click', function () {
                    if (b.onClick) { b.onClick(close); } else { close(); }
                });
                foot.appendChild(btn);
            });
            panel.appendChild(foot);
        }

        backdrop.appendChild(panel);
        document.body.appendChild(backdrop);

        function close() {
            if (backdrop.parentNode) { backdrop.parentNode.removeChild(backdrop); }
            document.removeEventListener('keydown', onKey);
            if (mo.onClose) { mo.onClose(); }
        }
        function onKey(ev) {
            if (ev.key === 'Escape') { ev.stopPropagation(); close(); }
        }
        document.addEventListener('keydown', onKey);
        backdrop.addEventListener('mousedown', function (ev) {
            if (ev.target === backdrop) { close(); }

        return { panel: panel, body: body, foot: foot, close: close };

    var toastEl = null;

        if (!toastEl) {

        toastEl.setAttribute('data-tone', tone || '');

        toastTimer = setTimeout(function () { toastEl.classList.remove('is-show'); }, 2200);

            var iconUri = 'data:image/svg+xml,' + encodeURIComponent(svg);

            var mf = {

                theme_color: accent || '#2563eb',

            };
            var blob = new Blob([JSON.stringify(mf)], { type: 'application/manifest+json' });
            var link = document.createElement('link');
            link.rel = 'manifest';
            link.href = URL.createObjectURL(blob);

        function toggleFullscreen() {

            var fsEl = document.fullscreenElement || document.webkitFullscreenElement || null;
            if (fsEl) {
                (document.exitFullscreen || document.webkitExitFullscreen || function () {}).call(document);
            } else {
                var req = root.requestFullscreen || root.webkitRequestFullscreen;
                if (req) { try { req.call(root); } catch (err) { /* 忽略 */ } }
            }

        document.addEventListener('fullscreenchange', function () {
            syncFsIcon(!!(document.fullscreenElement || document.webkitFullscreenElement));
        });
        document.addEventListener('webkitfullscreenchange', function () {
            syncFsIcon(!!(document.fullscreenElement || document.webkitFullscreenElement));
        });
        syncFsIcon(false);

        api.toggleFullscreen = toggleFullscreen;

        /* ---------- 音效 API ---------- */
        api.beep = function (kind) {

        var siteOrigin = typeof global.ET_SITE_ORIGIN === 'string' && /^https?:\/\//.test(global.ET_SITE_ORIGIN)
            ? global.ET_SITE_ORIGIN

        function renderFooter() {

            footer.appendChild(el('span', null, 'KeeTools 课工具'));

        try {

<script>

/*!
 * et-stats.js — 使用统计模块（模块化，可整体移除）
 *
 * 共享逻辑源。改这里，然后跑：python scripts/sync_shared.py
 * 依赖：无（可脱离 et-util / et-chrome 独立运行）。
 * 全局：ET.Stats
 *
 * ┌────────────────────────────────────────────────────────────────┐
 * │ 说明：本模块只做一件事——工具被打开时向上报端点发一条匿名计数。 │
 * │ · 在线（iframe 内）：宿主页面已服务端计数，本模块不重复上报。   │
 * │ · 离线打开（file:// / 下载单文件 / 离线包）：联网条件具备时，   │
 * │   以 sendBeacon 上报 use_offline 事件（text/plain 免预检）。    │
 * │ · 上报端点 = window.ET_SITE_ORIGIN（由宿主注入或离线包配置）。  │
 * │   未配置端点时本模块完全静默，不发任何请求。                    │
 * │ · **整个 <script> 块可安全删除**：删除后工具其余功能完全正常，  │
 * │   且完全不再发起任何网络请求。                                  │
 * └────────────────────────────────────────────────────────────────┘
 */
(function (global) {
    'use strict';

    var ET = global.ET = global.ET || {};

    var Stats = {
        /** 上报端点来源（站点绝对地址，无协议尾斜杠） */
        endpoint: (typeof global.ET_SITE_ORIGIN === 'string' && /^https?:\/\//.test(global.ET_SITE_ORIGIN))
            ? global.ET_SITE_ORIGIN
            : null,

        _done: {},

        /**
         * 上报一次事件（同一事件同一工具每次页面加载只报一次）。
         * event: 'use_offline' 等；toolId: 工具 id。
         */
        send: function (event, toolId) {
            if (!event || this._done[event + ':' + (toolId || '')]) { return false; }
            if (!this.endpoint) { return false; }
            /* iframe 内由宿主统计，避免双计 */
            try {
                if (global.parent && global.parent !== global) { return false; }
            } catch (err) { return false; }
            /* 断网时挂起，网络恢复自动补报一次 */
            if (global.navigator && global.navigator.onLine === false) {
                var self = this;
                global.addEventListener('online', function () { self.send(event, toolId); }, { once: true });
                return false;
            }

            this._done[event + ':' + (toolId || '')] = true;
            var payload = JSON.stringify({ event: event, tool: toolId || '' });

            try {
                if (global.navigator.sendBeacon) {
                    return global.navigator.sendBeacon(
                        this.endpoint + '/api/track',
                        new Blob([payload], { type: 'text/plain;charset=UTF-8' })
                    );
                }
                global.fetch(this.endpoint + '/api/track', {
                    method: 'POST',
                    body: payload,
                    keepalive: true,
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'text/plain;charset=UTF-8' }
                });
                return true;
            } catch (err) {
                return false;
            }
        }
    };

    ET.Stats = Stats;
})(window);

        svg: document.getElementById('cellSvg'),
        panel: document.getElementById('panel'),
        badge: document.getElementById('badge'),
        btnAnimal: document.getElementById('btnAnimal'),
        btnPlant: document.getElementById('btnPlant'),
        btnCompare: document.getElementById('btnCompare'),
        btnQuiz: document.getElementById('btnQuiz')
    };

    var state = {
        kind: store.get('kind', 'animal'),
        sel: store.get('sel', 'nucleus'),
        quiz: null,
        total: 0,
        hit: 0
    };

    if (state.kind !== 'animal' && state.kind !== 'plant') { state.kind = 'animal'; }

    /* ---------- 细胞图 ---------- */

    function animalSvg() {
        var out = [];
        var body = 'M 320 36 C 452 36 578 122 578 232 C 578 348 452 428 320 428 ' +
            'C 188 428 62 348 62 232 C 62 122 188 36 320 36 Z';
        out.push('<path data-part="cytoplasm" d="' + body + '" fill="#e0f2fe" stroke="none"></path>');
        out.push('<path data-part="membrane" d="' + body + '" fill="none" stroke="#0284c7" stroke-width="9"></path>');

        /* 小液泡 */
        out.push('<ellipse data-part="vacuole" cx="428" cy="330" rx="46" ry="33" fill="#bae6fd" ' +
            'stroke="#0284c7" stroke-width="4"></ellipse>');
        out.push('<ellipse cx="428" cy="330" rx="30" ry="20" fill="none" stroke="#7dd3fc" stroke-width="2"></ellipse>');

        /* 线粒体 3 个 */
        out.push(mito(212, 108, -22));
        out.push(mito(452, 148, 28));
        out.push(mito(180, 350, 16));

        /* 细胞核 */
        out.push('<circle data-part="nucleus" cx="278" cy="228" r="80" fill="#c7d2fe" ' +
            'stroke="#4f46e5" stroke-width="5"></circle>');
        out.push('<circle data-part="nucleus" cx="278" cy="228" r="62" fill="#a5b4fc" ' +
            'stroke="#6366f1" stroke-width="2"></circle>');
        out.push('<circle data-part="nucleus" cx="252" cy="206" r="22" fill="#818cf8"></circle>');

        /* 细胞质里的小点（核糖体） */
        out.push('<g data-part="cytoplasm" fill="#38bdf8">' +
            dot(398, 92) + dot(464, 232) + dot(520, 190) + dot(360, 372) + dot(150, 176) +
            dot(112, 288) + dot(430, 400) + dot(548, 292) + '</g>');

        return out.join('');
    }

    function plantSvg() {
        var out = [];
        out.push('<rect data-part="wall" x="34" y="26" width="572" height="408" rx="16" ' +
            'fill="#dcfce7" stroke="#15803d" stroke-width="12"></rect>');
        out.push('<rect data-part="membrane" x="52" y="44" width="536" height="372" rx="10" ' +
            'fill="none" stroke="#16a34a" stroke-width="5"></rect>');
        out.push('<rect data-part="cytoplasm" x="52" y="44" width="536" height="372" rx="10" ' +
            'fill="#ecfdf5" stroke="none"></rect>');
        out.push('<rect data-part="membrane" x="52" y="44" width="536" height="372" rx="10" ' +
            'fill="none" stroke="#16a34a" stroke-width="5"></rect>');

        /* 中央大液泡 */
        out.push('<rect data-part="vacuole" x="206" y="112" width="336" height="252" rx="56" ' +
            'fill="#bae6fd" stroke="#0284c7" stroke-width="5"></rect>');
        out.push('<rect x="232" y="136" width="284" height="204" rx="44" fill="none" ' +
            'stroke="#7dd3fc" stroke-width="2"></rect>');

        /* 细胞核 */
        out.push('<circle data-part="nucleus" cx="136" cy="196" r="62" fill="#c7d2fe" ' +
            'stroke="#4f46e5" stroke-width="5"></circle>');
        out.push('<circle data-part="nucleus" cx="120" cy="178" r="18" fill="#818cf8"></circle>');

        /* 叶绿体 */
        out.push(chloro(120, 320, -18));
        out.push(chloro(160, 388, 12));
        out.push(chloro(262, 396, -8));
        out.push(chloro(360, 396, 16));
        out.push(chloro(464, 396, -12));
        out.push(chloro(556, 340, 24));
        out.push(chloro(560, 168, -16));
        out.push(chloro(430, 78, 8));

        /* 线粒体 */
        out.push(mito(214, 84, 14));
        out.push(mito(300, 396, -14));

        return out.join('');
    }

    function mito(x, y, deg) {
        return '<g data-part="mitochondria" transform="rotate(' + deg + ' ' + x + ' ' + y + ')">' +
            '<ellipse cx="' + x + '" cy="' + y + '" rx="46" ry="22" fill="#fecaca" ' +
            'stroke="#dc2626" stroke-width="4"></ellipse>' +
            '<path d="M ' + (x - 30) + ' ' + y + ' q 10 -12 20 0 q 10 12 20 0 q 10 -12 20 0" ' +
            'fill="none" stroke="#dc2626" stroke-width="3"></path></g>';
    }

    function chloro(x, y, deg) {
        return '<g data-part="chloroplast" transform="rotate(' + deg + ' ' + x + ' ' + y + ')">' +
            '<ellipse cx="' + x + '" cy="' + y + '" rx="30" ry="17" fill="#4ade80" ' +
            'stroke="#15803d" stroke-width="3"></ellipse>' +
            '<line x1="' + (x - 18) + '" y1="' + y + '" x2="' + (x + 18) + '" y2="' + y + '" ' +
            'stroke="#15803d" stroke-width="2"></line></g>';
    }

    function dot(x, y) {
        return '<circle cx="' + x + '" cy="' + y + '" r="5"></circle>';
    }

    /* ---------- 选中与面板 ---------- */

    function applyFocus() {
        var nodes = els.svg.querySelectorAll('[data-part]');
        for (var i = 0; i < nodes.length; i++) {
            if (nodes[i].getAttribute('data-part') === state.sel) {
                nodes[i].classList.add('is-on');
            } else {
                nodes[i].classList.remove('is-on');
            }
        }
        els.svg.classList.toggle('is-focus', !!state.sel);
    }

    function renderPanel() {
        var html = '';

        if (state.quiz) {
            html += '<div class="cs-quiz">' +
                '<div class="cs-quiz__q">' + state.quiz.text + '</div>' +
                '<div class="cs-quiz__feed" id="qFeed">请在图中点出这个结构</div>' +
                '<div class="cs-quiz__stat" id="qStat">已答 ' + state.total + ' 题，答对 ' + state.hit +
                ' 题</div>' +
                '<button class="cs-btn cs-btn--primary" id="btnQuizNext" type="button">换一题</button>' +
                '<button class="cs-btn" id="btnQuizExit" type="button">退出测验</button>' +
                '</div>';
        }

        var p = PARTS[state.sel];
        if (p && !state.quiz) {
            html += '<div class="cs-name">' + p.n + '</div>';
            html += '<span class="cs-tagline">' + p.scope + '</span>';
            html += '<p class="cs-fn">' + p.fn + '</p>';
            html += '<p class="cs-extra">' + p.tip + '</p>';
        } else if (!state.quiz) {
            html += '<div class="cs-empty">点击图中的结构<br>查看它的功能</div>';
        }

        html += '<div class="cs-sec">结构列表（点击定位）</div><div class="cs-list">';
        Object.keys(PARTS).forEach(function (k) {
            if (!isVisible(k)) { return; }
            html += '<button class="cs-item' + (k === state.sel ? ' is-on' : '') +
                '" data-part-btn="' + k + '" type="button">' + PARTS[k].n + '</button>';
        });
        html += '</div>';

        els.panel.innerHTML = html;
        bindPanel();
    }

    function isVisible(k) {
        if (state.kind === 'animal') {
            return k !== 'wall' && k !== 'chloroplast';
        }
        return true;
    }

    function bindPanel() {
        var list = els.panel.querySelectorAll('[data-part-btn]');
        for (var i = 0; i < list.length; i++) {
            list[i].addEventListener('click', function () {
                var k = this.getAttribute('data-part-btn');
                if (state.quiz) { answerQuiz(k); return; }
                selectPart(k);
            });
        }
        var nx = document.getElementById('btnQuizNext');
        if (nx) { nx.addEventListener('click', quizNext); }
        var ex = document.getElementById('btnQuizExit');
        if (ex) { ex.addEventListener('click', function () { state.quiz = null; renderPanel(); }); }
    }

    function selectPart(k) {
        state.sel = k;
        store.set('sel', k);
        applyFocus();
        renderPanel();
        chrome.setStatus(PARTS[k].n + ' · ' + PARTS[k].scope, 'ok');
        try { chrome.beep('tick'); } catch (e) { /* 静默 */ }
    }

    function draw() {
        els.svg.innerHTML = state.kind === 'animal' ? animalSvg() : plantSvg();
        els.badge.textContent = state.kind === 'animal' ? '动物细胞' : '植物细胞';
        applyFocus();
        renderPanel();
    }

    /* ---------- 切换细胞类型 ---------- */

    function setKind(k) {
        state.kind = k;
        store.set('kind', k);
        els.btnAnimal.classList.toggle('is-on', k === 'animal');
        els.btnPlant.classList.toggle('is-on', k === 'plant');
        if (!isVisible(state.sel)) { state.sel = 'nucleus'; }
        draw();
    }

    els.btnAnimal.addEventListener('click', function () { setKind('animal'); });
    els.btnPlant.addEventListener('click', function () { setKind('plant'); });

    /* ---------- 图形点击 ---------- */

    els.svg.addEventListener('click', function (e) {
        var t = e.target;
        var part = t.getAttribute && t.getAttribute('data-part');
        if (!part) { return; }
        if (state.quiz) {
            answerQuiz(part);
            return;
        }
        selectPart(part);
    });

    /* ---------- 对比表 ---------- */

    els.btnCompare.addEventListener('click', function () {
        var rows = [
            ['细胞壁', '没有', '有（最外层，起保护和支持作用）'],
            ['细胞膜', '有（最外层）', '有（紧贴细胞壁内侧）'],
            ['细胞质', '有', '有'],
            ['细胞核', '有', '有'],
            ['线粒体', '有', '有'],
            ['叶绿体', '没有', '绿色部分有（光合作用场所）'],
            ['液泡', '一般不明显', '成熟细胞有大液泡']
        ];
        var html = '<table class="cs-table"><thead><tr><th>结构</th><th>动物细胞</th>' +
            '<th>植物细胞</th></tr></thead><tbody>';
        rows.forEach(function (r) {
            html += '<tr><td><b>' + r[0] + '</b></td><td>' + r[1] + '</td><td>' + r[2] + '</td></tr>';
        });
        html += '</tbody></table>' +
            '<p class="cs-extra" style="margin-top:12px">记忆口诀：<b>细胞膜、细胞质、细胞核</b>是两者共有；' +
            '植物细胞"多一壁、多一绿、多一泡"（细胞壁、叶绿体、液泡）。</p>';
        chrome.modal({
            title: '动植物细胞结构对比',
            icon: 'i-grid',
            body: '<div style="font-size:13.5px">' + html + '</div>',
            buttons: [{ label: '知道了', primary: true }]
        });
    });

    /* ---------- 识图测验 ---------- */

    var QUIZ_TOTAL = 10;

    function availableParts() {
        return Object.keys(PARTS).filter(isVisible);
    }

    function startQuiz() {
        var pool = availableParts();
        var out = [];
        while (out.length < QUIZ_TOTAL) {
            var copy = pool.slice();
            for (var i = copy.length - 1; i > 0; i--) {
                var r = Math.floor(Math.random() * (i + 1));
                var tmp = copy[i];
                copy[i] = copy[r];
                copy[r] = tmp;
            }
            out = out.concat(copy);
        }
        state.quiz = { qs: out.slice(0, QUIZ_TOTAL), idx: 0, locked: false };
        state.total = 0;
        state.hit = 0;
        quizShow();
    }

    function quizShow() {
        if (!state.quiz) { return; }
        if (state.quiz.idx >= state.quiz.qs.length) {
            state.quiz.done = true;
            state.quiz.text = '测验结束：答对 ' + state.hit + ' / ' + state.quiz.qs.length + ' 题';
            renderPanel();
            chrome.modal({
                title: '识图测验结果',
                icon: 'i-trophy',
                body: '<div style="font-size:16px;line-height:2">答对 <b>' + state.hit + '</b> 题，共 ' +
                    state.quiz.qs.length + ' 题（正确率 ' +
                    Math.round(state.hit / state.quiz.qs.length * 100) + '%）。</div>',
                buttons: [{ label: '继续浏览', primary: true }]
            });
            state.quiz = null;
            renderPanel();
            return;
        }
        var k = state.quiz.qs[state.quiz.idx];
        state.quiz.cur = k;
        state.quiz.locked = false;
        state.quiz.text = '请点出「' + PARTS[k].n + '」';
        renderPanel();
        chrome.setStatus('第 ' + (state.quiz.idx + 1) + ' / ' + state.quiz.qs.length + ' 题', 'ok');
    }

    function quizNext() {
        if (!state.quiz) {
            startQuiz();
            return;
        }
        state.quiz.idx++;
        state.quiz.locked = false;
        quizShow();
    }

    function answerQuiz(part) {
        if (!state.quiz || state.quiz.locked || state.quiz.done) { return; }
        state.quiz.locked = true;
        state.total++;
        var ok = part === state.quiz.cur;
        var feed = document.getElementById('qFeed');
        var stat = document.getElementById('qStat');

        if (ok) {
            state.hit++;
            if (feed) {
                feed.className = 'cs-quiz__feed is-ok';
                feed.textContent = '✓ 正确！' + PARTS[state.quiz.cur].n;
            }
            try { chrome.beep('ok'); } catch (e) { /* 静默 */ }
        } else {
            if (feed) {
                feed.className = 'cs-quiz__feed is-no';
                feed.textContent = '✗ 你选的是' + PARTS[part].n + '，正确答案是「' +
                    PARTS[state.quiz.cur].n + '」，已为你高亮';
            }
            try { chrome.beep('err'); } catch (e) { /* 静默 */ }
        }
        if (stat) {
            stat.textContent = '已答 ' + state.total + ' 题，答对 ' + state.hit + ' 题';
        }

        if (!ok) {
            state.sel = state.quiz.cur;
            applyFocus();
        }
        chrome.setStatus(ok ? '答对了' : '正确答案已高亮', ok ? 'ok' : 'warn');
        setTimeout(function () {
            if (state.quiz) { quizNext(); }
        }, ok ? 700 : 1600);
    }

    els.btnQuiz.addEventListener('click', function () {
        if (state.quiz) {
            state.quiz = null;
            renderPanel();
            return;
        }
        startQuiz();
    });

    function isTypingTarget(node) {
        if (!node || !node.tagName) { return false; }
        var tag = node.tagName.toUpperCase();
        return tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT' || node.isContentEditable === true;
    }

    document.addEventListener('keydown', function (e) {
        if (isTypingTarget(e.target) || document.querySelector('.et-modal, .et-drawer-backdrop')) { return; }
        if (e.code === 'Space') {
            e.preventDefault();
            quizNext();
        } else if (e.key === 'Escape' && state.quiz) {
            state.quiz = null;
            renderPanel();
        }
    });

    /* ---------- 启动 ---------- */

    els.btnAnimal.classList.toggle('is-on', state.kind === 'animal');
    els.btnPlant.classList.toggle('is-on', state.kind === 'plant');
    if (!isVisible(state.sel) || !PARTS[state.sel]) { state.sel = 'nucleus'; }
    draw();
})();
</script>

</body>
</html>
