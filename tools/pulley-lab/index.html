/*!
 * et-chrome.css — 工具通用外壳样式（顶栏 / 页脚 / 弹窗 / 按钮 / 主题）
 *
 * 共享样式源。改这里，然后跑：python scripts/sync_shared.py

/* ============ 设计令牌 ============ */
:root {
    --et-accent: #2563eb;
    --et-accent-weak: rgba(37, 99, 235, .14);
    --et-bg: #f4f6fb;
    --et-surface: #ffffff;
    --et-surface-2: #f8fafc;
    --et-fg: #0b1220;
    --et-muted: #64748b;
    --et-line: rgba(15, 23, 42, .12);
    --et-line-strong: rgba(15, 23, 42, .22);
    --et-glass: rgba(255, 255, 255, .85);
    --et-shadow-md: 0 10px 28px -18px rgba(15, 23, 42, .3);
    --et-shadow-lg: 0 24px 60px -32px rgba(15, 23, 42, .4);
    --et-ok: #059669;
    --et-warn: #d97706;
    --et-err: #dc2626;
    --et-radius: 12px;
    --et-radius-sm: 9px;
    --et-font: -apple-system, BlinkMacSystemFont, "Segoe UI",
               "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei",
               "Noto Sans SC", sans-serif;
    --et-mono: ui-monospace, "Cascadia Mono", Consolas, Menlo, monospace;
}

html[data-et-theme="dark"] {
    --et-bg: #0b1120;
    --et-surface: #111a2e;
    --et-surface-2: #0f1729;
    --et-fg: #f1f5f9;
    --et-muted: #94a3b8;
    --et-line: rgba(148, 163, 184, .18);
    --et-line-strong: rgba(148, 163, 184, .3);
    --et-glass: rgba(17, 26, 46, .85);
    --et-shadow-md: 0 10px 34px -18px rgba(0, 0, 0, .8);
    --et-shadow-lg: 0 24px 70px -30px rgba(0, 0, 0, .9);
    --et-ok: #34d399;
    --et-warn: #fbbf24;
    --et-err: #f87171;
}

/* ============ 基础 ============ */

/* body 作为外壳时必须清掉浏览器默认 8px 外边距，
   否则 iframe 预览中文档会比视口高 16px（底部白边 + 多余滚动） */
body.et-app {
    margin: 0;
}

.et-app {
    position: relative;
    isolation: isolate;
    display: flex;
    flex-direction: column;
    height: 100vh;
    height: 100dvh;
    overflow: hidden;
    background: var(--et-bg);
    color: var(--et-fg);
    font-family: var(--et-font);
    -webkit-font-smoothing: antialiased;
    transition: background .25s, color .25s;
}

/* 极光背景：径向渐变 + 呼吸动画（edupick 品质基线，老内核也不掉帧） */
.et-app::before {
    content: '';
    position: fixed;
    inset: 0;
    z-index: -1;
    pointer-events: none;
    background:
        radial-gradient(46% 40% at 20% 18%, var(--et-accent-weak), transparent 65%),
        radial-gradient(42% 38% at 82% 24%, var(--et-accent-weak), transparent 70%),
        radial-gradient(50% 44% at 55% 95%, rgba(16, 185, 129, .10), transparent 65%);
    animation: et-aurora 16s ease-in-out infinite alternate;
}

@keyframes et-aurora {
    from { opacity: .55; transform: scale(1); }
    to { opacity: 1; transform: scale(1.06); }
}

.et-app *,
.et-app *::before,
.et-app *::after { box-sizing: border-box; }

[hidden] { display: none !important; }

.et-icon {
    width: 18px;
    height: 18px;
    fill: none;
    stroke: currentColor;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
    flex: none;
}

/* ============ 顶栏 ============ */
.et-topbar {
    flex: none;
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 11px 20px;
    border-bottom: 1px solid var(--et-line);
    background: var(--et-glass);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    z-index: 20;
}

.et-brand {
    display: flex;
    align-items: center;
    gap: 10px;
    min-width: 0;
}

.et-brand__dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: var(--et-accent);
    box-shadow: 0 0 0 4px var(--et-accent-weak);
    flex: none;
}

.et-brand__name {
    font-weight: 800;
    font-size: 15px;
    letter-spacing: -.01em;
    white-space: nowrap;
}

.et-brand__sub {
    font-size: 12.5px;
    color: var(--et-muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.et-status {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 5px 14px;
    border-radius: 999px;
    font-size: 12.5px;
    color: var(--et-muted);
    background: var(--et-surface-2);
    border: 1px solid var(--et-line);
    white-space: nowrap;
    max-width: 42vw;
    overflow: hidden;
    text-overflow: ellipsis;
}

.et-status__dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--et-ok);
    flex: none;
    transition: background .2s;
}

.et-status[data-tone="err"] .et-status__dot { background: var(--et-err); }
.et-status[data-tone="warn"] .et-status__dot { background: var(--et-warn); }

.et-actions {
    display: flex;
    align-items: center;
    gap: 7px;
}

.et-icon-btn {
    display: inline-grid;
    place-items: center;
    width: 38px;
    height: 38px;
    font-size: 16px;
    line-height: 1;
    border-radius: 11px;
    border: 1px solid var(--et-line);
    background: var(--et-surface-2);
    color: var(--et-fg);
    cursor: pointer;
    transition: transform .14s, border-color .14s, color .14s, opacity .14s;
    -webkit-tap-highlight-color: transparent;
}

.et-icon-btn:hover {
    border-color: var(--et-accent);
    color: var(--et-accent);
    transform: translateY(-1px);
}

.et-icon-btn:active { transform: translateY(0); }
.et-icon-btn.is-off { opacity: .4; }
.et-icon-btn:focus-visible { outline: 2px solid var(--et-accent); outline-offset: 2px; }

/* ============ 主区默认 ============ */
.et-main {
    flex: 1;
    min-height: 0;
    position: relative;
    overflow: auto;
}

/* ============ 页脚（品牌回流 L2） ============ */
.et-footer {
    flex: none;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 7px 16px;
    font-size: 12px;
    color: var(--et-muted);
    border-top: 1px solid var(--et-line);
    background: var(--et-glass);
    user-select: none;
    z-index: 20;
}

.et-footer a {
    color: inherit;
    text-decoration: none;
    transition: color .14s;
}

.et-footer a:hover { color: var(--et-accent); }

/* ============ 按钮 ============ */
.et-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
    padding: 9px 16px;
    border-radius: 11px;
    font: inherit;
    font-size: 13.5px;
    font-weight: 700;
    border: 1px solid var(--et-line);
    background: var(--et-surface-2);
    color: var(--et-fg);
    cursor: pointer;
    transition: transform .14s, border-color .14s, color .14s, background .14s, box-shadow .14s;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
}

.et-btn:hover {
    border-color: var(--et-accent);
    color: var(--et-accent);
    transform: translateY(-1px);
}

.et-btn:active { transform: translateY(0); }
.et-btn:focus-visible { outline: 2px solid var(--et-accent); outline-offset: 2px; }
.et-btn:disabled { opacity: .45; cursor: not-allowed; transform: none; }

.et-btn--primary {
    background: var(--et-accent);
    border-color: var(--et-accent);
    color: #fff;
    box-shadow: 0 6px 18px -8px var(--et-accent);
}

.et-btn--primary:hover { color: #fff; filter: brightness(1.08); }
.et-btn--primary:disabled { filter: none; }

.et-btn--danger:hover {
    border-color: var(--et-err);
    color: var(--et-err);
}

.et-btn--lg {
    padding: 13px 26px;
    font-size: 16px;
    border-radius: 14px;
}

/* ============ 弹窗 ============ */
.et-modal {
    position: fixed;
    inset: 0;
    z-index: 100;
    display: grid;
    place-items: center;
    padding: 24px;
    background: rgba(2, 6, 23, .55);
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    animation: et-fade .18s ease;
}

.et-modal__panel {
    width: min(680px, 94vw);
    max-height: 86vh;
    max-height: 86dvh;
    display: flex;
    flex-direction: column;
    background: var(--et-surface);
    border: 1px solid var(--et-line);
    border-radius: 16px;
    box-shadow: var(--et-shadow-lg);
    animation: et-pop .2s cubic-bezier(.34, 1.4, .64, 1);
    overflow: hidden;
}

.et-modal__panel--narrow { width: min(460px, 92vw); }
.et-modal__panel--wide { width: min(900px, 94vw); }

.et-modal__head {
    flex: none;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 16px 20px;
    border-bottom: 1px solid var(--et-line);
    font-weight: 800;
    font-size: 15px;
}

.et-modal__head .et-icon-btn {
    margin-left: auto;
    width: 32px;
    height: 32px;
}

.et-modal__body {
    flex: 1;
    min-height: 0;
    overflow: auto;
    padding: 18px 20px;
}

.et-modal__foot {
    flex: none;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 14px 20px;
    border-top: 1px solid var(--et-line);
    background: var(--et-surface-2);
}

.et-modal__foot .spacer { flex: 1; }

@keyframes et-fade {
    from { opacity: 0; }
}

@keyframes et-pop {
    from { opacity: 0; transform: translateY(14px) scale(.97); }
}

/* ============ 轻提示（toast） ============ */
.et-toast {
    position: fixed;
    left: 50%;
    bottom: 56px;
    transform: translateX(-50%) translateY(10px);
    z-index: 120;
    display: flex;
    align-items: center;
    gap: 9px;
    max-width: min(520px, 88vw);
    padding: 11px 18px;
    border-radius: 12px;
    font-size: 13.5px;
    font-weight: 600;
    color: #fff;
    background: rgba(15, 23, 42, .92);
    border: 1px solid rgba(148, 163, 184, .25);
    box-shadow: var(--et-shadow-lg);
    opacity: 0;
    pointer-events: none;
    transition: opacity .22s, transform .22s;
}

.et-toast.is-show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
}

.et-toast[data-tone="ok"] { background: rgba(5, 150, 105, .95); }
.et-toast[data-tone="err"] { background: rgba(220, 38, 38, .95); }
.et-toast[data-tone="warn"] { background: rgba(217, 119, 6, .95); }

/* ============ 设置抽屉（右上角入口，edupick 交互） ============ */
.et-drawer-backdrop {
    position: fixed;
    inset: 0;
    z-index: 90;
    background: rgba(2, 6, 23, .45);
    backdrop-filter: blur(3px);
    -webkit-backdrop-filter: blur(3px);
    opacity: 0;
    transition: opacity .2s;
}

.et-drawer-backdrop.is-open { opacity: 1; }

.et-drawer {
    position: absolute;
    top: 0;
    right: 0;
    height: 100%;
    width: min(400px, 92vw);
    display: flex;
    flex-direction: column;
    background: var(--et-surface);
    border-left: 1px solid var(--et-line);
    box-shadow: var(--et-shadow-lg);
    transform: translateX(100%);
    transition: transform .22s cubic-bezier(.32, .72, .35, 1);
}

.et-drawer-backdrop.is-open .et-drawer { transform: translateX(0); }

.et-drawer__head {
    flex: none;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 15px 18px;
    border-bottom: 1px solid var(--et-line);
    font-weight: 800;
    font-size: 15px;
    color: var(--et-accent);
}

.et-drawer__head .et-icon-btn {
    margin-left: auto;
    width: 32px;
    height: 32px;
}

.et-drawer__body {
    flex: 1;
    min-height: 0;
    overflow: auto;
    padding: 16px 18px 24px;
}

/* 抽屉内容通用小节（工具复用） */
.et-drawer__body h4 {
    margin: 18px 0 8px;
    font-size: 12px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: .08em;
    color: var(--et-muted);
}

.et-drawer__body h4:first-child { margin-top: 0; }

.et-drawer__row {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
}

.et-drawer__tip {
    margin: 8px 0 0;
    font-size: 12px;
    line-height: 1.8;
    color: var(--et-muted);
}

.et-drawer__tip b { color: var(--et-fg); }

.et-drawer__input {
    flex: 1;
    min-width: 0;
    padding: 9px 12px;
    border: 1px solid var(--et-line-strong);
    border-radius: 9px;
    background: var(--et-surface-2);
    color: var(--et-fg);
    font: inherit;
    font-size: 13.5px;
    transition: border-color .14s, box-shadow .14s;
}

.et-drawer__input:focus {
    outline: none;
    border-color: var(--et-accent);
    box-shadow: 0 0 0 3px var(--et-accent-weak);
}

.et-drawer__switch {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 10px 0;
    border-bottom: 1px dashed var(--et-line);
    font-size: 13.5px;
    font-weight: 600;
    color: var(--et-fg);
    cursor: pointer;
    user-select: none;
}

.et-drawer__switch input {
    width: 17px;
    height: 17px;
    accent-color: var(--et-accent);
    cursor: pointer;
}
</style>

        if (mo.buttons && mo.buttons.length) {

                btn.type = 'button';
                btn.addEventListener('click', function () {
                    if (b.onClick) { b.onClick(close); } else { close(); }
                });
                foot.appendChild(btn);
            });
            panel.appendChild(foot);
        }

        backdrop.appendChild(panel);
        document.body.appendChild(backdrop);

        function close() {
            if (backdrop.parentNode) { backdrop.parentNode.removeChild(backdrop); }
            document.removeEventListener('keydown', onKey);
            if (mo.onClose) { mo.onClose(); }
        }
        function onKey(ev) {
            if (ev.key === 'Escape') { ev.stopPropagation(); close(); }
        }

    var toastEl = null;

    /* ---------- PWA 元数据（blob manifest，环境不支持时静默跳过） ---------- */

            var blob = new Blob([JSON.stringify(mf)], { type: 'application/manifest+json' });
            var link = document.createElement('link');

        var siteOrigin = typeof global.ET_SITE_ORIGIN === 'string' && /^https?:\/\//.test(global.ET_SITE_ORIGIN)
            ? global.ET_SITE_ORIGIN

        function renderFooter() {

        try {

        global.addEventListener('message', function (ev) {

                if (!global.ET_SITE_ORIGIN) { global.ET_SITE_ORIGIN = data.origin; }

        if (typeof opt.primary === 'function') {

<script>
  /* 此块由 scripts/sync_shared.py 自动注入，请勿手工修改 */
/*!
 * et-stats.js — 使用统计模块（模块化，可整体移除）
 *
 * 共享逻辑源。改这里，然后跑：python scripts/sync_shared.py
 * 依赖：无（可脱离 et-util / et-chrome 独立运行）。
 * 全局：ET.Stats
 *
 * ┌────────────────────────────────────────────────────────────────┐
 * │ 说明：本模块只做一件事——工具被打开时向上报端点发一条匿名计数。 │
 * │ · 在线（iframe 内）：宿主页面已服务端计数，本模块不重复上报。   │
 * │ · 离线打开（file:// / 下载单文件 / 离线包）：联网条件具备时，   │
 * │   以 sendBeacon 上报 use_offline 事件（text/plain 免预检）。    │
 * │ · 上报端点 = window.ET_SITE_ORIGIN（由宿主注入或离线包配置）。  │
 * │   未配置端点时本模块完全静默，不发任何请求。                    │
 * │ · **整个 <script> 块可安全删除**：删除后工具其余功能完全正常，  │
 * │   且完全不再发起任何网络请求。                                  │
 * └────────────────────────────────────────────────────────────────┘
 */
(function (global) {
    'use strict';

    var ET = global.ET = global.ET || {};

    var Stats = {
        /** 上报端点来源（站点绝对地址，无协议尾斜杠） */
        endpoint: (typeof global.ET_SITE_ORIGIN === 'string' && /^https?:\/\//.test(global.ET_SITE_ORIGIN))
            ? global.ET_SITE_ORIGIN
            : null,

        _done: {},

        /**
         * 上报一次事件（同一事件同一工具每次页面加载只报一次）。
         * event: 'use_offline' 等；toolId: 工具 id。
         */
        send: function (event, toolId) {
            if (!event || this._done[event + ':' + (toolId || '')]) { return false; }
            if (!this.endpoint) { return false; }
            /* iframe 内由宿主统计，避免双计 */
            try {
                if (global.parent && global.parent !== global) { return false; }
            } catch (err) { return false; }
            /* 断网时挂起，网络恢复自动补报一次 */
            if (global.navigator && global.navigator.onLine === false) {
                var self = this;
                global.addEventListener('online', function () { self.send(event, toolId); }, { once: true });
                return false;
            }

            this._done[event + ':' + (toolId || '')] = true;
            var payload = JSON.stringify({ event: event, tool: toolId || '' });

            try {
                if (global.navigator.sendBeacon) {
                    return global.navigator.sendBeacon(
                        this.endpoint + '/api/track',
                        new Blob([payload], { type: 'text/plain;charset=UTF-8' })
                    );
                }
                global.fetch(this.endpoint + '/api/track', {
                    method: 'POST',
                    body: payload,
                    keepalive: true,
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'text/plain;charset=UTF-8' }
                });
                return true;
            } catch (err) {
                return false;
            }
        }
    };

    ET.Stats = Stats;
})(window);
</script>

            '<circle id="movWheel" cx="500" cy="92" r="28" fill="var(--et-surface)" stroke="var(--et-accent)" stroke-width="3.5"/>' +
            '<circle cx="500" cy="92" r="4" fill="var(--et-accent)"/></g>';
        s += '<g id="loadG">' +
            '<rect id="loadRect" x="445" y="140" width="110" height="76" rx="8" fill="rgba(124,58,237,.18)" ' +
            'stroke="var(--et-accent)" stroke-width="3"/>' +
            '<text id="loadLabel" text-anchor="middle" font-size="20" font-weight="800" fill="var(--et-accent)"/></g>';

        /* 绳 */
        s += '<path id="rope" fill="none" stroke="var(--et-accent)" stroke-width="3.5" stroke-linecap="round"/>';
        /* 绳端拉力箭头 */
        s += '<line id="pullArrow" stroke="#7c3aed" stroke-width="4" marker-end="url(#plArr)"/>';
        s += '<text id="pullLabel" font-size="16" font-weight="800" fill="#7c3aed" text-anchor="middle">F</text>';

        /* 标尺（0.25m 刻度） */
        s += '<g id="rulerG"></g>';
        s += '<line id="hMark" x1="330" x2="392" y1="0" y2="0" stroke="#059669" stroke-width="3"/>';
        s += '<text id="hMarkLabel" x="330" y="0" font-size="13" font-weight="800" fill="#059669"></text>';

        /* 数绳子高亮层 */
        s += '<g id="segG"></g>';

        els.board.innerHTML = s;
        renderRuler();
    }

    function renderRuler() {
        var s = '';
        for (var i = 0; i <= 12; i++) {
            var y = 90 + i * PX_PER_M / 4;
            var major = i % 4 === 0;
            s += '<line x1="330" y1="' + y + '" x2="' + (major ? 306 : 318) + '" y2="' + y +
                '" stroke="var(--et-muted)" stroke-width="1.6" opacity=".8"/>';
            if (major) {
                s += '<text x="300" y="' + (y + 4) + '" font-size="12" text-anchor="end" fill="var(--et-muted)">' +
                    (i / 4) + 'm</text>';
            }
        }
        s += '<line x1="330" y1="86" x2="330" y2="' + (90 + 12 * PX_PER_M / 4) +
            '" stroke="var(--et-muted)" stroke-width="1.4" opacity=".6"/>';
        els.board.querySelector('#rulerG').innerHTML = s;
    }

    /* ---------- 渲染 ---------- */

    function render() {
        var my = movingY();
        var rope = els.board.querySelector('#rope');
        rope.setAttribute('d', ropePath());

        /* 定滑轮位置 */
        var fixedG = els.board.querySelector('#fixedG');
        if (state.config === 1) {
            fixedG.setAttribute('transform', 'translate(0,0)');
            fixedG.setAttribute('opacity', 1);
        } else if (state.config === 2) {
            fixedG.setAttribute('opacity', 0);
        } else {
            fixedG.setAttribute('transform', 'translate(-16,0)');
            fixedG.setAttribute('opacity', 1);
        }

        /* 动滑轮与重物 */
        var movG = els.board.querySelector('#movG');
        var loadG = els.board.querySelector('#loadG');
        if (state.config === 1) {
            movG.setAttribute('opacity', 0);
            loadG.setAttribute('transform', 'translate(28,0)');
        } else {
            movG.setAttribute('opacity', 1);
            movG.setAttribute('transform', 'translate(0,' + (my - 92).toFixed(1) + ')');
            loadG.setAttribute('transform', state.config === 3 ? 'translate(-30,0)' : 'translate(0,0)');
        }
        var loadRect = els.board.querySelector('#loadRect');
        loadRect.setAttribute('y', loadTop().toFixed(1));
        var loadLabel = els.board.querySelector('#loadLabel');
        loadLabel.setAttribute('x', state.config === 1 ? 528 : state.config === 2 ? 500 : 470);
        loadLabel.setAttribute('y', (loadTop() + 48).toFixed(1));
        loadLabel.textContent = state.g + 'N';

        /* 绳端箭头 */
        var arrow = els.board.querySelector('#pullArrow');
        var plabel = els.board.querySelector('#pullLabel');
        var ey = ropeEndY();
        var F = force();
        if (state.config === 1) {
            arrow.setAttribute('x1', 472); arrow.setAttribute('y1', ey + 6);
            arrow.setAttribute('x2', 472); arrow.setAttribute('y2', ey + 52);
            plabel.setAttribute('x', 500); plabel.setAttribute('y', ey + 36);
        } else {
            arrow.setAttribute('x1', state.config === 2 ? 528 : 442);
            arrow.setAttribute('y1', ey - 6);
            arrow.setAttribute('x2', state.config === 2 ? 528 : 442);
            arrow.setAttribute('y2', ey - 52);
            plabel.setAttribute('x', (state.config === 2 ? 528 : 442) + 34);
            plabel.setAttribute('y', ey - 34);
        }
        plabel.textContent = 'F=' + F.toFixed(1) + 'N';

        /* h 标记 */
        var h = state.pull / state.config / PX_PER_M;
        var hMark = els.board.querySelector('#hMark');
        hMark.setAttribute('y1', loadTop().toFixed(1));
        hMark.setAttribute('y2', loadTop().toFixed(1));
        var hLab = els.board.querySelector('#hMarkLabel');
        hLab.setAttribute('y', (loadTop() - 6).toFixed(1));
        hLab.textContent = 'h=' + h.toFixed(2) + 'm';

        /* 读数 */
        var s = state.pull / PX_PER_M;
        els.nOut.textContent = state.config;
        els.fOut.textContent = F.toFixed(1) + ' N';
        els.hOut.textContent = h.toFixed(2) + ' m';
        els.sOut.textContent = s.toFixed(2) + ' m';
        var wUse = state.g * h;
        var wTotal = F * s;
        els.wuseOut.textContent = wUse.toFixed(2) + ' J';
        els.wtotalOut.textContent = wTotal.toFixed(2) + ' J';
        if (state.config === 1 || state.gdyn === 0) {
            els.effOut.textContent = '100%（理想）';
        } else {
            els.effOut.textContent = (state.g / (state.g + state.gdyn) * 100).toFixed(0) + '%';
        }
        els.formula.textContent = 'F = (G物' + (state.config > 1 ? ' + G动' : '') + ') / n = ' + F.toFixed(1) +
            'N　·　s = n·h = ' + state.config + '×' + h.toFixed(2) + 'm';

        var chips = els.configChips.children;
        for (var i = 0; i < chips.length; i++) {
            chips[i].classList.toggle('is-on', parseInt(chips[i].getAttribute('data-n'), 10) === state.config);
        }
    }

    function force() {
        var gdyn = state.config === 1 ? 0 : state.gdyn;
        return (state.g + gdyn) / state.config;
    }

    /* ---------- 拉动动画 ---------- */

    function tick() {
        var diff = state.pullTarget - state.pull;
        if (Math.abs(diff) > 0.5) {
            state.pull += diff * 0.16;
            if (Math.abs(state.pullTarget - state.pull) < 0.5) { state.pull = state.pullTarget; }
            render();
            state.raf = requestAnimationFrame(tick);
        } else {
            state.pull = state.pullTarget;
            state.raf = 0;
            render();
        }
    }

    function wake() {
        if (!state.raf) { state.raf = requestAnimationFrame(tick); }
    }

    function pullOnce() {
        var max = MAX_PULL[state.config];
        if (state.pullTarget >= max) {
            chrome.toast('已经拉到头了，点「复位」重新开始');
            return;
        }
        state.pullTarget = Math.min(max, state.pullTarget + 40);
        chrome.beep('tick');
        if (state.pullTarget >= max) {
            chrome.beep('ok');
            chrome.toast('s = ' + state.config + ' × h，省力但费了 ' + state.config + ' 倍距离');
        }
        wake();
    }

    els.btnPull.addEventListener('click', pullOnce);
    els.btnReset.addEventListener('click', function () {
        state.pullTarget = 0;
        chrome.beep('tick');
        wake();
    });

    /* ---------- 数绳子 ---------- */

    var segTimer = 0;

    els.btnCount.addEventListener('click', function () {
        clearTimeout(segTimer);
        var segs = supportSegs();
        var s = '';
        for (var i = 0; i < segs.length; i++) {
            var mid = [(segs[i][0] + segs[i][2]) / 2, (segs[i][1] + segs[i][3]) / 2];
            s += '<g class="pl-seg" data-i="' + i + '" opacity="0">' +
                '<line x1="' + segs[i][0] + '" y1="' + segs[i][1] + '" x2="' + segs[i][2] + '" y2="' + segs[i][3] +
                '" stroke="#f59e0b" stroke-width="8" opacity=".45" stroke-linecap="round"/>' +
                '<circle cx="' + mid[0] + '" cy="' + mid[1] + '" r="15" fill="#f59e0b"/>' +
                '<text x="' + mid[0] + '" y="' + (mid[1] + 5) + '" font-size="16" font-weight="800" ' +
                'text-anchor="middle" fill="#fff">' + (i + 1) + '</text></g>';
        }
        els.board.querySelector('#segG').innerHTML = s;
        var nodes = els.board.querySelectorAll('.pl-seg');
        for (var k = 0; k < nodes.length; k++) {
            (function (node, idx) {
                setTimeout(function () {
                    node.setAttribute('opacity', 1);
                    chrome.beep('tick');
                }, idx * 550);
            })(nodes[k], k);
        }
        segTimer = setTimeout(function () {
            var inner = els.board.querySelector('#segG');
            if (inner) { inner.innerHTML = ''; }
        }, segs.length * 550 + 1800);
        chrome.toast('承重绳段数 n = ' + state.config);
    });

    /* ---------- 配置与控件 ---------- */

    CONFIGS.forEach(function (c) {
        var chip = document.createElement('button');
        chip.type = 'button';
        chip.className = 'pulleylab-chip';
        chip.textContent = c.name + ' n=' + c.n;
        chip.setAttribute('data-n', c.n);
        chip.addEventListener('click', function () {
            if (state.config === c.n) { return; }
            state.config = c.n;
            state.pull = 0;
            state.pullTarget = 0;
            chrome.beep('tick');
            store.set('config', state.config);
            syncControls();
            render();
        });
        els.configChips.appendChild(chip);
    });

    els.gRange.addEventListener('input', function () {
        state.g = clampInt(this.value, 2, 20);
        store.set('g', state.g);
        syncControls();
        render();
    });
    els.gdynRange.addEventListener('input', function () {
        state.gdyn = clampF(this.value, 0, 4);
        store.set('gdyn', state.gdyn);
        syncControls();
        render();
    });

    function syncControls() {
        els.gRange.value = state.g;
        els.gdynRange.value = state.gdyn;
        els.gOut.textContent = state.g + ' N';
        els.gdynOut.textContent = state.gdyn.toFixed(1) + ' N';
        var hasDyn = state.config > 1;
        els.dynRow.style.display = hasDyn ? '' : 'none';
        els.gdynRange.style.display = hasDyn ? '' : 'none';
        els.gdynRange.disabled = !hasDyn;
    }

    document.addEventListener('keydown', function (e) {
        if (e.code === 'Space' && !isTypingTarget(e.target)) {
            e.preventDefault();
            pullOnce();
        }
    });

    function isTypingTarget(node) {
        if (!node || !node.tagName) { return false; }
        var tag = node.tagName.toUpperCase();
        return tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT' || node.isContentEditable === true;
    }

    /* 恢复上次状态 */
    syncControls();
    buildBoard();
    render();
})();
</script>

</body>
</html>
