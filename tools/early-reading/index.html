/*!
 * et-chrome.css — 工具通用外壳样式（顶栏 / 页脚 / 弹窗 / 按钮 / 主题）
 *
 * 共享样式源。改这里，然后跑：python scripts/sync_shared.py
 * 所有类名带 et- 前缀，避免与工具自身样式冲突。
 * 依赖：无外部资源；颜色全部为令牌变量。
 */

/* ============ 设计令牌 ============ */
:root {
    --et-accent: #2563eb;
    --et-accent-weak: rgba(37, 99, 235, .14);
    --et-bg: #f4f6fb;
    --et-surface: #ffffff;
    --et-surface-2: #f8fafc;
    --et-fg: #0b1220;
    --et-muted: #64748b;
    --et-line: rgba(15, 23, 42, .12);
    --et-line-strong: rgba(15, 23, 42, .22);
    --et-glass: rgba(255, 255, 255, .85);
    --et-shadow-md: 0 10px 28px -18px rgba(15, 23, 42, .3);
    --et-shadow-lg: 0 24px 60px -32px rgba(15, 23, 42, .4);
    --et-ok: #059669;
    --et-warn: #d97706;
    --et-err: #dc2626;
    --et-radius: 12px;
    --et-radius-sm: 9px;
    --et-font: -apple-system, BlinkMacSystemFont, "Segoe UI",
               "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei",
               "Noto Sans SC", sans-serif;
    --et-mono: ui-monospace, "Cascadia Mono", Consolas, Menlo, monospace;
}

html[data-et-theme="dark"] {
    --et-bg: #0b1120;
    --et-surface: #111a2e;
    --et-surface-2: #0f1729;
    --et-fg: #f1f5f9;
    --et-muted: #94a3b8;
    --et-line: rgba(148, 163, 184, .18);
    --et-line-strong: rgba(148, 163, 184, .3);
    --et-glass: rgba(17, 26, 46, .85);
    --et-shadow-md: 0 10px 34px -18px rgba(0, 0, 0, .8);
    --et-shadow-lg: 0 24px 70px -30px rgba(0, 0, 0, .9);
    --et-ok: #34d399;
    --et-warn: #fbbf24;
    --et-err: #f87171;
}

/* ============ 基础 ============ */

/* body 作为外壳时必须清掉浏览器默认 8px 外边距，
   否则 iframe 预览中文档会比视口高 16px（底部白边 + 多余滚动） */
body.et-app {
    margin: 0;
}

.et-app {
    position: relative;
    isolation: isolate;
    display: flex;
    flex-direction: column;
    height: 100vh;
    height: 100dvh;
    overflow: hidden;
    background: var(--et-bg);
    color: var(--et-fg);
    font-family: var(--et-font);
    -webkit-font-smoothing: antialiased;
    transition: background .25s, color .25s;
}

/* 极光背景：径向渐变 + 呼吸动画（edupick 品质基线，老内核也不掉帧） */
.et-app::before {
    content: '';
    position: fixed;
    inset: 0;
    z-index: -1;
    pointer-events: none;
    background:
        radial-gradient(46% 40% at 20% 18%, var(--et-accent-weak), transparent 65%),
        radial-gradient(42% 38% at 82% 24%, var(--et-accent-weak), transparent 70%),
        radial-gradient(50% 44% at 55% 95%, rgba(16, 185, 129, .10), transparent 65%);
    animation: et-aurora 16s ease-in-out infinite alternate;
}

@keyframes et-aurora {
    from { opacity: .55; transform: scale(1); }
    to { opacity: 1; transform: scale(1.06); }
}

.et-app *,
.et-app *::before,
.et-app *::after { box-sizing: border-box; }

[hidden] { display: none !important; }

.et-icon {
    width: 18px;
    height: 18px;
    fill: none;
    stroke: currentColor;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
    flex: none;
}

/* ============ 顶栏 ============ */
.et-topbar {
    flex: none;
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 11px 20px;
    border-bottom: 1px solid var(--et-line);
    background: var(--et-glass);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    z-index: 20;
}

.et-brand {
    display: flex;
    align-items: center;
    gap: 10px;
    min-width: 0;
}

.et-brand__dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: var(--et-accent);
    box-shadow: 0 0 0 4px var(--et-accent-weak);
    flex: none;
}

.et-brand__name {
    font-weight: 800;
    font-size: 15px;
    letter-spacing: -.01em;
    white-space: nowrap;
}

.et-brand__sub {
    font-size: 12.5px;
    color: var(--et-muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.et-status {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 5px 14px;
    border-radius: 999px;
    font-size: 12.5px;
    color: var(--et-muted);
    background: var(--et-surface-2);
    border: 1px solid var(--et-line);
    white-space: nowrap;
    max-width: 42vw;
    overflow: hidden;
    text-overflow: ellipsis;
}

.et-status__dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--et-ok);
    flex: none;
    transition: background .2s;
}

.et-status[data-tone="err"] .et-status__dot { background: var(--et-err); }
.et-status[data-tone="warn"] .et-status__dot { background: var(--et-warn); }

.et-actions {
    display: flex;
    align-items: center;
    gap: 7px;
}

.et-icon-btn {
    display: inline-grid;
    place-items: center;
    width: 38px;
    height: 38px;
    font-size: 16px;
    line-height: 1;
    border-radius: 11px;
    border: 1px solid var(--et-line);
    background: var(--et-surface-2);
    color: var(--et-fg);
    cursor: pointer;
    transition: transform .14s, border-color .14s, color .14s, opacity .14s;
    -webkit-tap-highlight-color: transparent;
}

.et-icon-btn:hover {
    border-color: var(--et-accent);
    color: var(--et-accent);
    transform: translateY(-1px);
}

.et-icon-btn:active { transform: translateY(0); }
.et-icon-btn.is-off { opacity: .4; }
.et-icon-btn:focus-visible { outline: 2px solid var(--et-accent); outline-offset: 2px; }

/* ============ 主区默认 ============ */
.et-main {
    flex: 1;
    min-height: 0;
    position: relative;
    overflow: auto;
}

/* ============ 页脚（品牌回流 L2） ============ */
.et-footer {
    flex: none;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 7px 16px;
    font-size: 12px;
    color: var(--et-muted);
    border-top: 1px solid var(--et-line);
    background: var(--et-glass);
    user-select: none;
    z-index: 20;
}

.et-footer a {
    color: inherit;
    text-decoration: none;
    transition: color .14s;
}

.et-footer a:hover { color: var(--et-accent); }

/* ============ 按钮 ============ */
.et-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
    padding: 9px 16px;
    border-radius: 11px;
    font: inherit;
    font-size: 13.5px;
    font-weight: 700;
    border: 1px solid var(--et-line);
    background: var(--et-surface-2);
    color: var(--et-fg);
    cursor: pointer;
    transition: transform .14s, border-color .14s, color .14s, background .14s, box-shadow .14s;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
}

.et-btn:hover {
    border-color: var(--et-accent);
    color: var(--et-accent);
    transform: translateY(-1px);
}

.et-btn:active { transform: translateY(0); }
.et-btn:focus-visible { outline: 2px solid var(--et-accent); outline-offset: 2px; }
.et-btn:disabled { opacity: .45; cursor: not-allowed; transform: none; }

.et-btn--primary {
    background: var(--et-accent);
    border-color: var(--et-accent);
    color: #fff;
    box-shadow: 0 6px 18px -8px var(--et-accent);
}

.et-btn--primary:hover { color: #fff; filter: brightness(1.08); }
.et-btn--primary:disabled { filter: none; }

.et-btn--danger:hover {
    border-color: var(--et-err);
    color: var(--et-err);
}

.et-btn--lg {
    padding: 13px 26px;
    font-size: 16px;
    border-radius: 14px;
}

/* ============ 弹窗 ============ */
.et-modal {
    position: fixed;
    inset: 0;
    z-index: 100;
    display: grid;
    place-items: center;
    padding: 24px;
    background: rgba(2, 6, 23, .55);
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    animation: et-fade .18s ease;
}

.et-modal__panel {
    width: min(680px, 94vw);
    max-height: 86vh;
    max-height: 86dvh;
    display: flex;
    flex-direction: column;
    background: var(--et-surface);
    border: 1px solid var(--et-line);
    border-radius: 16px;
    box-shadow: var(--et-shadow-lg);
    animation: et-pop .2s cubic-bezier(.34, 1.4, .64, 1);
    overflow: hidden;
}

.et-modal__panel--narrow { width: min(460px, 92vw); }
.et-modal__panel--wide { width: min(900px, 94vw); }

.et-modal__head {
    flex: none;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 16px 20px;
    border-bottom: 1px solid var(--et-line);
    font-weight: 800;
    font-size: 15px;
}

.et-modal__head .et-icon-btn {
    margin-left: auto;
    width: 32px;
    height: 32px;
}

.et-modal__body {
    flex: 1;
    min-height: 0;
    overflow: auto;
    padding: 18px 20px;
}

.et-modal__foot {
    flex: none;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 14px 20px;
    border-top: 1px solid var(--et-line);
    background: var(--et-surface-2);
}

.et-modal__foot .spacer { flex: 1; }

@keyframes et-fade {
    from { opacity: 0; }
}

@keyframes et-pop {
    from { opacity: 0; transform: translateY(14px) scale(.97); }
}

/* ============ 轻提示（toast） ============ */
.et-toast {
    position: fixed;
    left: 50%;
    bottom: 56px;
    transform: translateX(-50%) translateY(10px);
    z-index: 120;
    display: flex;
    align-items: center;
    gap: 9px;
    max-width: min(520px, 88vw);
    padding: 11px 18px;
    border-radius: 12px;
    font-size: 13.5px;
    font-weight: 600;
    color: #fff;
    background: rgba(15, 23, 42, .92);
    border: 1px solid rgba(148, 163, 184, .25);
    box-shadow: var(--et-shadow-lg);
    opacity: 0;
    pointer-events: none;
    transition: opacity .22s, transform .22s;
}

.et-toast.is-show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
}

.et-toast[data-tone="ok"] { background: rgba(5, 150, 105, .95); }
.et-toast[data-tone="err"] { background: rgba(220, 38, 38, .95); }
.et-toast[data-tone="warn"] { background: rgba(217, 119, 6, .95); }

/* ============ 设置抽屉（右上角入口，edupick 交互） ============ */
.et-drawer-backdrop {
    position: fixed;
    inset: 0;
    z-index: 90;
    background: rgba(2, 6, 23, .45);
    backdrop-filter: blur(3px);
    -webkit-backdrop-filter: blur(3px);
    opacity: 0;
    transition: opacity .2s;
}

.et-drawer-backdrop.is-open { opacity: 1; }

.et-drawer {
    position: absolute;
    top: 0;
    right: 0;
    height: 100%;
    width: min(400px, 92vw);
    display: flex;
    flex-direction: column;
    background: var(--et-surface);
    border-left: 1px solid var(--et-line);
    box-shadow: var(--et-shadow-lg);
    transform: translateX(100%);
    transition: transform .22s cubic-bezier(.32, .72, .35, 1);
}

.et-drawer-backdrop.is-open .et-drawer { transform: translateX(0); }

.et-drawer__head {
    flex: none;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 15px 18px;
    border-bottom: 1px solid var(--et-line);
    font-weight: 800;
    font-size: 15px;
    color: var(--et-accent);
}

.et-drawer__head .et-icon-btn {
    margin-left: auto;
    width: 32px;
    height: 32px;
}

.et-drawer__body {
    flex: 1;
    min-height: 0;
    overflow: auto;
    padding: 16px 18px 24px;
}

/* 抽屉内容通用小节（工具复用） */
.et-drawer__body h4 {
    margin: 18px 0 8px;
    font-size: 12px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: .08em;
    color: var(--et-muted);
}

.et-drawer__body h4:first-child { margin-top: 0; }

.et-drawer__row {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
}

.et-drawer__tip {
    margin: 8px 0 0;
    font-size: 12px;
    line-height: 1.8;
    color: var(--et-muted);
}

.et-drawer__tip b { color: var(--et-fg); }

.et-drawer__input {
    flex: 1;
    min-width: 0;
    padding: 9px 12px;
    border: 1px solid var(--et-line-strong);
    border-radius: 9px;
    background: var(--et-surface-2);
    color: var(--et-fg);
    font: inherit;
    font-size: 13.5px;
    transition: border-color .14s, box-shadow .14s;
}

.et-drawer__input:focus {
    outline: none;
    border-color: var(--et-accent);
    box-shadow: 0 0 0 3px var(--et-accent-weak);
}

.et-drawer__switch {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 10px 0;
    border-bottom: 1px dashed var(--et-line);
    font-size: 13.5px;
    font-weight: 600;
    color: var(--et-fg);
    cursor: pointer;
    user-select: none;
}

.et-drawer__switch input {
    width: 17px;
    height: 17px;
    accent-color: var(--et-accent);
    cursor: pointer;
}
</style>

        actions: [
            { icon: 'i-play', label: '开始 / 结束', onClick: toggle },
            { icon: 'i-download', label: '导出本轮 CSV', onClick: exportCsv },
            { icon: 'i-refresh', label: '重置本轮', onClick: resetRound }
        ],
        settings: { title: '早读 / 设置', build: buildSettings },
        help: '<div style="font-size:13.5px;line-height:2">' +
            '<p style="margin:0 0 8px"><b>怎么用</b>：设定时长（默认 15 分钟）后点「开始早读检测」并允许麦克风权限，' +
            '工具按音量把每分钟判定为<b>朗读中 / 声音过小 / 太吵</b>；时间到自动结束并给出早读报告。</p>' +
            '<p style="margin:0 0 8px"><b>判定说明</b>：音量需要连续达到设定秒数（默认 2 秒）才切换状态，' +
            '避免咳嗽、翻书、挪椅子造成的误判；音量区间默认 55 – 85 dB，可在设置里按班级实际调整。</p>' +
            '<p style="margin:0 0 8px"><b>读数说明</b>：显示的是<b>近似分贝</b>（浏览器拿不到声级计标定）。' +
            '它衡量的是"有没有读出声音、声音是否稳定"，不等同于朗读的准确度。</p>' +
            '<p style="margin:0 0 8px"><b>麦克风可用条件</b>：需要 HTTPS 或本站在线体验；' +
            'http 页面会被浏览器直接禁止，本地文件方式能否使用取决于浏览器策略，被拒绝时工具会给出引导。</p>' +
            '<p style="margin:0"><b>快捷键</b>：空格 / 翻页笔下页键 = 开始或结束。设置只保存在本机，' +
            '本轮记录关闭页面即清空。</p></div>'
    });

    var els = {
        main: document.getElementById('et-main'),
        state: document.getElementById('erState'),
        clock: document.getElementById('erClock'),
        db: document.getElementById('erDb'),
        range: document.getElementById('erRange'),
        rateLabel: document.getElementById('erRateLabel'),
        rateFill: document.getElementById('erRateFill'),
        progressLabel: document.getElementById('erProgressLabel'),
        timeFill: document.getElementById('erTimeFill'),
        guide: document.getElementById('erGuide'),
        btn: document.getElementById('erBtn'),
        btnLabel: document.getElementById('erBtnLabel'),
        btnIcon: document.getElementById('erBtnIcon').querySelector('use'),
        stReading: document.getElementById('erStReading'),
        stRate: document.getElementById('erStRate'),
        stLongest: document.getElementById('erStLongest'),
        stQuiet: document.getElementById('erStQuiet'),
        stNoisy: document.getElementById('erStNoisy'),
        stAvg: document.getElementById('erStAvg'),
        legend: document.getElementById('erLegend'),
        chart: document.getElementById('erChart'),
        events: document.getElementById('erEvents'),
        eventCount: document.getElementById('erEventCount')
    };

    var state = {
        duration: clampInt(store.get('duration', 15), 1, 60),
        low: clampInt(store.get('low', 55), DB_MIN, 95),
        high: clampInt(store.get('high', 85), 40, DB_MAX),
        hold: clampNum(store.get('hold', 2), 0.5, 10),
        smooth: clampNum(store.get('smooth', 0.85), 0.3, 0.95),
        alarm: store.get('alarm', true) !== false,
        running: false
    };
    if (state.high <= state.low + 5) { state.high = Math.min(DB_MAX, state.low + 10); }

    var mic = ET.Mic.create();
    var chart = ET.LevelChart.attach(els.chart, {
        capacity: 240,
        min: DB_MIN,
        max: DB_MAX,
        threshold: state.low,
        thresholdHigh: state.high,
        accent: '#0d9488'
    });

    var live = newLive();

    /* ---------- 小工具 ---------- */

    function clampInt(value, min, max) {
        var n = parseInt(value, 10);
        if (isNaN(n)) { return min; }
        return Math.max(min, Math.min(max, n));
    }

    function clampNum(value, min, max) {
        var n = Number(value);
        if (!isFinite(n)) { return min; }
        return Math.max(min, Math.min(max, n));
    }

    function newLive() {
        return {
            db: DB_MIN,
            dbfs: -100,
            candidate: null,
            candidateSince: 0,
            committed: 'idle',
            lastTs: 0,
            lastUi: 0,
            lastPush: 0,
            lastQuietAlarm: 0,
            lastNoisyAlarm: 0,
            bucket: { reading: 0, quiet: 0, noisy: 0 },
            streak: 0,
            longest: 0,
            quietRun: 0,
            noisyRun: 0,
            quietCount: 0,
            noisyCount: 0,
            frames: 0,
            sum: 0,
            peak: 0,
            startedAt: 0,
            endsAt: 0,
            ticker: 0,
            events: []
        };
    }

    function rawOf(db) {
        if (db < state.low) { return 'quiet'; }
        if (db > state.high) { return 'noisy'; }
        return 'reading';
    }

    function toneOf(key) {
        if (key === 'reading') { return 'ok'; }
        if (key === 'noisy') { return 'bad'; }
        return '';
    }

    function fmtClock(ms) {
        var total = Math.max(0, Math.floor(ms / 1000));
        var m = Math.floor(total / 60);
        var s = total % 60;
        return (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s;
    }

    function fmtText(ms) {
        if (ms < 1000) { return '0 秒'; }
        var total = Math.round(ms / 1000);
        var m = Math.floor(total / 60);
        var s = total % 60;
        return m > 0 ? (m + ' 分 ' + s + ' 秒') : (s + ' 秒');
    }

    function totalMs() {
        return live.bucket.reading + live.bucket.quiet + live.bucket.noisy;
    }

    function rateOf() {
        var total = totalMs();
        return total > 0 ? live.bucket.reading / total : 0;
    }

    /* ---------- 采集与判定 ---------- */

    function onFrame(f) {
        var db = f.smoothed;
        live.db = f.smoothed;
        live.dbfs = f.dbfs;
        live.frames++;
        live.sum += f.db;
        if (f.peak > live.peak) { live.peak = f.peak; }

        /* 去抖：同一判定需持续 hold 秒才真正切换 */
        var raw = rawOf(db);
        if (raw !== live.candidate) {
            live.candidate = raw;
            live.candidateSince = f.ts;
        }
        if (live.committed !== raw && f.ts - live.candidateSince >= state.hold * 1000) {
            commit(raw, f.ts);
        }

        /* 时长累加到当前判定 */
        var dt = live.lastTs > 0 ? f.ts - live.lastTs : 0;
        if (dt > 0 && dt < 500) {
            live.bucket[live.committed] += dt;
            if (live.committed === 'reading') {
                live.streak += dt;
                if (live.streak > live.longest) { live.longest = live.streak; }
                live.quietRun = 0;
                live.noisyRun = 0;
            } else if (live.committed === 'quiet') {
                live.quietRun += dt;
                live.noisyRun = 0;
            } else if (live.committed === 'noisy') {
                live.noisyRun += dt;
                live.quietRun = 0;
            }
        }
        live.lastTs = f.ts;

        /* 持续性提醒 */
        if (state.alarm) {
            if (live.quietRun > QUIET_ALARM_MS && f.ts - live.lastQuietAlarm > ALARM_GAP) {
                live.lastQuietAlarm = f.ts;
                try { chrome.beep('tick'); } catch (err) { /* 静默 */ }
            }
            if (live.noisyRun > NOISY_ALARM_MS && f.ts - live.lastNoisyAlarm > ALARM_GAP) {
                live.lastNoisyAlarm = f.ts;
                try { chrome.beep('err'); } catch (err2) { /* 静默 */ }
            }
        }

        if (f.ts - live.lastUi >= UI_MS) {
            live.lastUi = f.ts;
            paintLive();
        }
        if (f.ts - live.lastPush >= PUSH_MS) {
            live.lastPush = f.ts;
            chart.push(db, toneOf(live.committed));
        }
    }

    function commit(next, ts) {
        var prev = live.committed;
        live.committed = next;

        if (next === 'quiet') {
            live.quietCount++;
            live.streak = 0;
            pushEvent(ts, '声音过小');
        } else if (next === 'noisy') {
            live.noisyCount++;
            live.streak = 0;
            pushEvent(ts, '太吵');
        } else if (next === 'reading' && (prev === 'quiet' || prev === 'noisy')) {
            pushEvent(ts, '恢复朗读');
        }
        paintLive();
    }

    function onMicState(name) {
        if (name === 'running') {
            state.running = true;
            live.startedAt = Date.now();
            live.endsAt = live.startedAt + state.duration * 60000;
            live.candidateSince = 0;
            startTicker();
            setBtn(true);
            hideGuide();
            paintAll();
            chrome.setStatus('检测中 · 剩余 ' + state.duration + ' 分钟', 'ok');
            return;
        }

        if (name === 'pending') {
            showGuide('warn', '等待麦克风授权', '浏览器会弹出权限询问，请选择「允许」。');
            chrome.setStatus('等待授权…', 'warn');
            return;
        }

        state.running = false;
        stopTicker();
        setBtn(false);

        if (name === 'closed') {
            if (!live.startedAt) { hideGuide(); }
            chrome.setStatus('已停止', '');
            return;
        }

        var hint = ET.Mic.hint(name);
        showGuide(name === 'insecure' || name === 'denied' ? 'err' : 'warn', hint.title, hint.tip);
        chrome.setStatus(hint.title, 'err');
        chrome.toast(hint.title, 'err');
    }

    /* ---------- 渲染 ---------- */

    function paintAll() {
        paintLive();
        paintStats();
    }

    function paintLive() {
        var key = state.running || live.startedAt ? live.committed : 'idle';
        els.main.setAttribute('data-state', key);
        els.state.textContent = STATE_LABEL[key] || '未开始';
        els.db.textContent = state.running ? String(Math.round(live.db)) : '--';

        var rate = rateOf();
        els.rateFill.style.width = Math.round(rate * 100) + '%';
        els.rateLabel.textContent = Math.round(rate * 100) + '%';

        var elapsed = live.startedAt ? Math.min(Date.now() - live.startedAt, state.duration * 60000) : 0;
        var remain = Math.max(0, state.duration * 60000 - elapsed);
        els.clock.textContent = state.running ? fmtClock(remain) : (live.startedAt ? '00:00' : '--:--');
        els.progressLabel.textContent = Math.floor(elapsed / 60000) + ' / ' + state.duration + ' 分钟';
        els.timeFill.style.width = (state.duration > 0 ? (elapsed / (state.duration * 60000)) * 100 : 0) + '%';
    }

    function paintStats() {
        els.stReading.textContent = fmtClock(live.bucket.reading);
        els.stRate.textContent = Math.round(rateOf() * 100) + '%';
        els.stLongest.textContent = fmtClock(live.longest);
        els.stQuiet.textContent = String(live.quietCount);
        els.stNoisy.textContent = String(live.noisyCount);
        els.stAvg.textContent = live.frames ? String(Math.round(live.sum / live.frames)) : '--';
        els.range.textContent = '朗读区间 ' + state.low + ' – ' + state.high + ' dB';
    }

    function pushEvent(ts, label) {
        var rel = live.startedAt ? Math.max(0, ts - live.startedAt) : 0;
        live.events.push({ t: rel, label: label });
        if (live.events.length > 60) { live.events.shift(); }
        paintEvents();
    }

    function paintEvents() {
        els.eventCount.textContent = '共 ' + live.events.length + ' 条';
        els.events.innerHTML = '';
        if (!live.events.length) {
            var none = document.createElement('div');
            none.className = 'er-none';
            none.textContent = '开始检测后，这里会记录状态变化的时间点。';
            els.events.appendChild(none);
            return;
        }
        var list = live.events.slice(-8).reverse();
        for (var i = 0; i < list.length; i++) {
            var row = document.createElement('div');
            row.className = 'er-event';
            var t = document.createElement('time');
            t.textContent = fmtClock(list[i].t);
            var b = document.createElement('b');
            b.textContent = list[i].label;
            row.appendChild(t);
            row.appendChild(b);
            els.events.appendChild(row);
        }
    }

    function setBtn(running) {
        els.btnLabel.textContent = running ? '结束并查看报告' : '开始早读检测';
        els.btnIcon.setAttribute('href', running ? '#i-pause' : '#i-play');
        els.btn.className = 'et-btn et-btn--lg ' + (running ? 'et-btn--danger' : 'et-btn--primary');
    }

    function showGuide(tone, title, tip) {
        els.guide.hidden = false;
        els.guide.setAttribute('data-tone', tone || '');
        els.guide.innerHTML = '';
        var strong = document.createElement('b');
        strong.textContent = title;
        var body = document.createElement('div');
        body.textContent = tip;
        els.guide.appendChild(strong);
        els.guide.appendChild(body);
    }

    function hideGuide() {
        els.guide.hidden = true;
        els.guide.innerHTML = '';
        els.guide.setAttribute('data-tone', '');
    }

    function syncLegend() {
        els.legend.textContent = '虚线：下限 ' + state.low + ' / 上限 ' + state.high + ' dB';
    }

    /* ---------- 计时与控制 ---------- */

    function startTicker() {
        stopTicker();
        live.ticker = window.setInterval(function () {
            if (!state.running) { return; }
            paintLive();
            if (Date.now() >= live.endsAt) { finish(true); }
        }, 250);
    }

    function stopTicker() {
        if (live.ticker) {
            window.clearInterval(live.ticker);
            live.ticker = 0;
        }
    }

    function toggle() {
        if (state.running) { finish(false); } else { start(); }
    }

    function start() {
        if (state.running) { return; }
        resetRound();
        mic.open({
            offset: 90,
            smooth: state.smooth,
            fftSize: 2048,
            onState: onMicState,
            onFrame: onFrame
        });
    }

    function finish(auto) {
        if (!live.startedAt) {
            mic.close();
            return;
        }
        state.running = false;
        mic.close();
        stopTicker();
        setBtn(false);
        paintAll();
        showReport(reportData(), auto);
    }

    function resetRound() {
        live = newLive();
        chart.reset();
        chart.setThreshold(state.low, state.high);
        syncLegend();
        paintEvents();
        paintAll();
    }

    /* ---------- 报告 ---------- */

    function reportData() {
        var total = totalMs();
        return {
            total: total,
            reading: live.bucket.reading,
            quiet: live.bucket.quiet,
            noisy: live.bucket.noisy,
            rate: total > 0 ? live.bucket.reading / total : 0,
            longest: live.longest,
            quietCount: live.quietCount,
            noisyCount: live.noisyCount,
            avg: live.frames ? live.sum / live.frames : 0,
            peak: live.peak,
            events: live.events.slice()
        };
    }

    function ratingOf(rate) {
        if (rate >= 0.8) { return { label: '优秀', color: 'var(--et-ok)', desc: '全班朗读投入，声音稳定。' }; }
        if (rate >= 0.6) { return { label: '良好', color: 'var(--et-ok)', desc: '大部分时间在读，偶有停顿。' }; }
        if (rate >= 0.4) { return { label: '一般', color: 'var(--et-warn)', desc: '约一半时间没有读出声音。' }; }
        return { label: '需改进', color: 'var(--et-err)', desc: '朗读声音明显不足，建议老师带读。' };
    }

    function adviceOf(d) {
        var tips = [];
        if (d.rate < 0.6) {
            tips.push('朗读率偏低：可指定领读员、按小组轮读，先把声音带起来。');
        }
        if (d.quietCount >= 3) {
            tips.push('多次出现"声音过小"：通常是齐读越读越小，可安排中途一次提醒。');
        }
        if (d.noisyCount >= 3) {
            tips.push('多次出现"太吵"：留意是否有说话、走动干扰，可先整顿秩序再继续。');
        }
        if (d.total > 300000 && d.longest < 60000) {
            tips.push('最长连续朗读不足 1 分钟：建议把早读拆成几个小段，每段设一个目标。');
        }
        if (d.avg > 0 && d.avg < state.low + 5) {
            tips.push('平均音量贴近下限：提醒学生抬头、张口，声音会更清晰。');
        }
        if (!tips.length) {
            tips.push('整体表现不错，保持现有的早读组织方式。');
        }
        return tips.join(' ');
    }

    function reportRows(d) {
        return [
            ['检测时长', fmtText(d.total)],
            ['朗读时长', fmtText(d.reading)],
            ['达标率', Math.round(d.rate * 100) + '%'],
            ['最长连续朗读', fmtText(d.longest)],
            ['声音过小', d.quietCount + ' 次（' + fmtText(d.quiet) + '）'],
            ['太吵', d.noisyCount + ' 次（' + fmtText(d.noisy) + '）'],
            ['平均音量', d.avg > 0 ? Math.round(d.avg) + ' dB' : '--'],
            ['峰值音量', d.peak > 0 ? Math.round(d.peak) + ' dB' : '--'],
            ['朗读区间', state.low + ' – ' + state.high + ' dB（判定 ' + state.hold + ' 秒）']
        ];
    }

    function showReport(d, auto) {
        var rating = ratingOf(d.rate);
        var box = document.createElement('div');
        box.className = 'er-report';

        var head = document.createElement('div');
        head.className = 'er-report-rating';
        var badge = document.createElement('b');
        badge.textContent = rating.label;
        badge.style.color = rating.color;
        var desc = document.createElement('span');
        desc.textContent = (auto ? '本轮时间到，已自动结束。' : '本轮已结束。') + rating.desc;
        head.appendChild(badge);
        head.appendChild(desc);
        box.appendChild(head);

        var rows = reportRows(d);
        var grid = document.createElement('div');
        grid.className = 'er-report-grid';
        for (var i = 0; i < rows.length; i++) {
            var row = document.createElement('div');
            var label = document.createElement('span');
            label.textContent = rows[i][0];
            var value = document.createElement('span');
            value.textContent = rows[i][1];
            row.appendChild(label);
            row.appendChild(value);
            grid.appendChild(row);
        }
        box.appendChild(grid);

        var advice = document.createElement('p');
        advice.className = 'er-report-advice';
        advice.textContent = '建议：' + adviceOf(d);
        box.appendChild(advice);

        chrome.modal({
            title: '早读报告',
            icon: 'i-bar-chart-3',
            size: 'wide',
            body: box,
            buttons: [
                { label: '复制报告', onClick: function () { copyReport(d); } },
                { label: '导出 CSV', onClick: function () { exportCsv(); } },
                { label: '关闭', primary: true }
            ]
        });
    }

    function reportText(d) {
        var lines = ['早读报告（KeeTools 课工具）', '生成时间：' + new Date().toLocaleString()];
        var rows = reportRows(d);
        for (var i = 0; i < rows.length; i++) {
            lines.push(rows[i][0] + '：' + rows[i][1]);
        }
        lines.push('评级：' + ratingOf(d.rate).label);
        lines.push('建议：' + adviceOf(d));
        return lines.join('\n');
    }

    function copyReport(d) {
        var text = reportText(d);
        if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(text).then(function () {
                chrome.toast('报告已复制到剪贴板', 'ok');
            }, function () {
                chrome.toast('复制失败，请手动选择文本', 'err');
            });
            return;
        }
        chrome.toast('当前浏览器不支持一键复制，请用「导出 CSV」', 'warn');
    }

    function csvCell(value) {
        var s = String(value === undefined || value === null ? '' : value);
        if (/[",\r\n]/.test(s)) { return '"' + s.split('"').join('""') + '"'; }
        return s;
    }

    function exportCsv() {
        if (!live.startedAt) {
            chrome.toast('还没有检测记录', 'warn');
            return;
        }
        var d = reportData();
        var lines = ['项目,数值'];
        var rows = reportRows(d);
        for (var i = 0; i < rows.length; i++) {
            lines.push([csvCell(rows[i][0]), csvCell(rows[i][1])].join(','));
        }
        lines.push([csvCell('评级'), csvCell(ratingOf(d.rate).label)].join(','));
        lines.push([csvCell('建议'), csvCell(adviceOf(d))].join(','));
        lines.push('');
        lines.push('时间,事件');
        for (var j = 0; j < d.events.length; j++) {
            lines.push([csvCell(fmtClock(d.events[j].t)), csvCell(d.events[j].label)].join(','));
        }
        var name = '早读报告-' + new Date().toISOString().slice(0, 10) + '.csv';
        download(name, '\uFEFF' + lines.join('\r\n'));
    }

    function download(filename, content) {
        try {
            var blob = new Blob([content], { type: 'text/csv;charset=utf-8' });
            var url = URL.createObjectURL(blob);
            var a = document.createElement('a');
            a.href = url;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            window.setTimeout(function () {
                if (a.parentNode) { a.parentNode.removeChild(a); }
                URL.revokeObjectURL(url);
            }, 0);
            chrome.toast('已导出 ' + filename, 'ok');
        } catch (err) {
            chrome.toast('导出失败', 'err');
        }
    }

    /* ---------- 设置抽屉 ---------- */

    function buildSettings(body) {
        body.innerHTML =
            '<h4>检测参数</h4>' +
            '<div class="et-drawer__row">' +
            '<input class="et-drawer__input" id="erSetDuration" type="number" min="1" max="60" value="' +
            state.duration + '" title="检测时长（分钟）">' +
            '<span class="etimp-dim">分钟</span>' +
            '</div>' +
            '<p class="et-drawer__tip">时间到自动结束并弹出报告（默认 15 分钟）。</p>' +

            '<h4>朗读音量区间</h4>' +
            '<div class="et-drawer__row">' +
            '<input class="et-drawer__input" id="erSetLow" type="number" min="' + DB_MIN + '" max="95" value="' +
            state.low + '" title="下限：低于此值算声音过小">' +
            '<span class="etimp-dim">到</span>' +
            '<input class="et-drawer__input" id="erSetHigh" type="number" min="40" max="' + DB_MAX + '" value="' +
            state.high + '" title="上限：高于此值算太吵">' +
            '<span class="etimp-dim">dB</span>' +
            '</div>' +
            '<p class="et-drawer__tip">区间内视为<b>朗读中</b>。安静班级可整体下调，' +
            '大班 / 扩音教室可上调；上下限至少相差 10 dB。</p>' +

            '<h4>判定与响应</h4>' +
            '<div class="et-drawer__row">' +
            '<input class="et-drawer__input" id="erSetHold" type="number" min="0.5" max="10" step="0.5" value="' +
            state.hold + '" title="判定秒数">' +
            '<span class="etimp-dim">秒后切换判定</span>' +
            '</div>' +
            '<p class="et-drawer__tip">音量需连续达到该秒数才切换状态，用来过滤咳嗽、翻书等瞬时声（默认 2 秒）。</p>' +
            '<div class="et-drawer__row">' +
            '<input type="range" id="erSetSmooth" min="0.3" max="0.95" step="0.05" value="' +
            state.smooth + '" style="flex:1">' +
            '<b id="erSetSmoothValue" style="min-width:48px;text-align:right;font-family:var(--et-mono)">' +
            state.smooth.toFixed(2) + '</b>' +
            '</div>' +
            '<p class="et-drawer__tip">平滑系数越大读数越稳（默认 0.85）。</p>' +
            '<label class="et-drawer__switch"><span>持续时间异常时提示音</span>' +
            '<input type="checkbox" id="erSetAlarm"' + (state.alarm ? ' checked' : '') + '></label>' +

            '<h4>本轮</h4>' +
            '<div class="et-drawer__row">' +
            '<button class="et-btn" id="erSetReset" type="button">重置本轮记录</button>' +
            '<button class="et-btn" id="erSetExport" type="button">导出 CSV</button>' +
            '</div>';

        var q = function (id) { return document.getElementById(id); };

        q('erSetDuration').addEventListener('change', function () {
            state.duration = clampInt(this.value, 1, 60);
            this.value = state.duration;
            store.set('duration', state.duration);
            if (state.running) {
                live.endsAt = live.startedAt + state.duration * 60000;
            }
            paintLive();
        });

        q('erSetLow').addEventListener('change', function () {
            state.low = clampInt(this.value, DB_MIN, 95);
            if (state.high <= state.low + 5) { state.high = Math.min(DB_MAX, state.low + 10); }
            this.value = state.low;
            q('erSetHigh').value = state.high;
            store.set('low', state.low);
            store.set('high', state.high);
            chart.setThreshold(state.low, state.high);
            syncLegend();
            paintStats();
        });

        q('erSetHigh').addEventListener('change', function () {
            state.high = clampInt(this.value, 40, DB_MAX);
            if (state.high <= state.low + 5) { state.high = Math.min(DB_MAX, state.low + 10); }
            this.value = state.high;
            store.set('high', state.high);
            chart.setThreshold(state.low, state.high);
            syncLegend();
            paintStats();
        });

        q('erSetHold').addEventListener('change', function () {
            state.hold = clampNum(this.value, 0.5, 10);
            this.value = state.hold;
            store.set('hold', state.hold);
            paintStats();
        });

        q('erSetSmooth').addEventListener('input', function () {
            state.smooth = clampNum(this.value, 0.3, 0.95);
            q('erSetSmoothValue').textContent = state.smooth.toFixed(2);
            store.set('smooth', state.smooth);
            mic.setSmooth(state.smooth);
        });

        q('erSetAlarm').addEventListener('change', function () {
            state.alarm = this.checked;
            store.set('alarm', state.alarm);
        });

        q('erSetReset').addEventListener('click', function () {
            resetRound();
            chrome.toast('本轮记录已重置');
        });

        q('erSetExport').addEventListener('click', exportCsv);
    }

    /* ---------- 键盘 / 主题 ---------- */

    function isTypingTarget(node) {
        if (!node || !node.tagName) { return false; }
        var tag = node.tagName.toUpperCase();
        return tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT' || node.isContentEditable === true;
    }

    document.addEventListener('keydown', function (e) {
        if (e.code === 'Space' && !isTypingTarget(e.target)) {
            e.preventDefault();
            toggle();
        }
    });

    if (window.MutationObserver) {
        new MutationObserver(function () { chart.draw(); })
            .observe(document.documentElement, { attributes: true, attributeFilter: ['data-et-theme'] });
    }

    /* ---------- 启动 ---------- */

    els.btn.addEventListener('click', toggle);
    chart.setThreshold(state.low, state.high);
    syncLegend();
    setBtn(false);
    resetRound();

    if (!ET.Mic.supported()) {
        showGuide('err', ET.Mic.hint('unsupported').title, ET.Mic.hint('unsupported').tip);
    } else if (!ET.Mic.isSecure()) {
        showGuide('err', ET.Mic.hint('insecure').title, ET.Mic.hint('insecure').tip);
        chrome.setStatus('需 HTTPS / 在线使用', 'warn');
    } else if (ET.Mic.isLocalFile()) {
        showGuide('warn', '你正在以本地文件方式打开',
            '本地文件（file://）能否取麦取决于浏览器的安全策略：点「开始早读检测」后没有被拒绝就能正常使用；' +
            '若被拒绝，请改用本页「在线体验」或在 HTTPS 环境下打开。');
    }
})();
</script>

</body>
</html>
