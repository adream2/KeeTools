/*!
 * et-chrome.css — 工具通用外壳样式（顶栏 / 页脚 / 弹窗 / 按钮 / 主题）
 *
 * 共享样式源。改这里，然后跑：python scripts/sync_shared.py
 * 所有类名带 et- 前缀，避免与工具自身样式冲突。
 * 依赖：无外部资源；颜色全部为令牌变量。
 */

/* ============ 设计令牌 ============ */
:root {
    --et-accent: #2563eb;
    --et-accent-weak: rgba(37, 99, 235, .14);
    --et-bg: #f4f6fb;
    --et-surface: #ffffff;
    --et-surface-2: #f8fafc;
    --et-fg: #0b1220;
    --et-muted: #64748b;
    --et-line: rgba(15, 23, 42, .12);
    --et-line-strong: rgba(15, 23, 42, .22);
    --et-glass: rgba(255, 255, 255, .85);
    --et-shadow-md: 0 10px 28px -18px rgba(15, 23, 42, .3);
    --et-shadow-lg: 0 24px 60px -32px rgba(15, 23, 42, .4);
    --et-ok: #059669;
    --et-warn: #d97706;
    --et-err: #dc2626;
    --et-radius: 12px;
    --et-radius-sm: 9px;
    --et-font: -apple-system, BlinkMacSystemFont, "Segoe UI",
               "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei",
               "Noto Sans SC", sans-serif;
    --et-mono: ui-monospace, "Cascadia Mono", Consolas, Menlo, monospace;
}

html[data-et-theme="dark"] {
    --et-bg: #0b1120;
    --et-surface: #111a2e;
    --et-surface-2: #0f1729;
    --et-fg: #f1f5f9;
    --et-muted: #94a3b8;
    --et-line: rgba(148, 163, 184, .18);
    --et-line-strong: rgba(148, 163, 184, .3);
    --et-glass: rgba(17, 26, 46, .85);
    --et-shadow-md: 0 10px 34px -18px rgba(0, 0, 0, .8);
    --et-shadow-lg: 0 24px 70px -30px rgba(0, 0, 0, .9);
    --et-ok: #34d399;
    --et-warn: #fbbf24;
    --et-err: #f87171;
}

/* ============ 基础 ============ */
.et-app {
    position: relative;
    isolation: isolate;
    display: flex;
    flex-direction: column;
    height: 100vh;
    height: 100dvh;
    overflow: hidden;
    background: var(--et-bg);
    color: var(--et-fg);
    font-family: var(--et-font);
    -webkit-font-smoothing: antialiased;
    transition: background .25s, color .25s;
}

/* 极光背景：径向渐变 + 呼吸动画（edupick 品质基线，老内核也不掉帧） */
.et-app::before {
    content: '';
    position: fixed;
    inset: 0;
    z-index: -1;
    pointer-events: none;
    background:
        radial-gradient(46% 40% at 20% 18%, var(--et-accent-weak), transparent 65%),
        radial-gradient(42% 38% at 82% 24%, var(--et-accent-weak), transparent 70%),
        radial-gradient(50% 44% at 55% 95%, rgba(16, 185, 129, .10), transparent 65%);
    animation: et-aurora 16s ease-in-out infinite alternate;
}

@keyframes et-aurora {
    from { opacity: .55; transform: scale(1); }
    to { opacity: 1; transform: scale(1.06); }
}

.et-app *,
.et-app *::before,
.et-app *::after { box-sizing: border-box; }

[hidden] { display: none !important; }

.et-icon {
    width: 18px;
    height: 18px;
    fill: none;
    stroke: currentColor;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
    flex: none;
}

/* ============ 顶栏 ============ */
.et-topbar {
    flex: none;
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 11px 20px;
    border-bottom: 1px solid var(--et-line);
    background: var(--et-glass);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    z-index: 20;
}

.et-brand {
    display: flex;
    align-items: center;
    gap: 10px;
    min-width: 0;
}

.et-brand__dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: var(--et-accent);
    box-shadow: 0 0 0 4px var(--et-accent-weak);
    flex: none;
}

.et-brand__name {
    font-weight: 800;
    font-size: 15px;
    letter-spacing: -.01em;
    white-space: nowrap;
}

.et-brand__sub {
    font-size: 12.5px;
    color: var(--et-muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.et-status {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 5px 14px;
    border-radius: 999px;
    font-size: 12.5px;
    color: var(--et-muted);
    background: var(--et-surface-2);
    border: 1px solid var(--et-line);
    white-space: nowrap;
    max-width: 42vw;
    overflow: hidden;
    text-overflow: ellipsis;
}

.et-status__dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--et-ok);
    flex: none;
    transition: background .2s;
}

.et-status[data-tone="err"] .et-status__dot { background: var(--et-err); }
.et-status[data-tone="warn"] .et-status__dot { background: var(--et-warn); }

.et-actions {
    display: flex;
    align-items: center;
    gap: 7px;
}

.et-icon-btn {
    display: inline-grid;
    place-items: center;
    width: 38px;
    height: 38px;
    font-size: 16px;
    line-height: 1;
    border-radius: 11px;
    border: 1px solid var(--et-line);
    background: var(--et-surface-2);
    color: var(--et-fg);
    cursor: pointer;
    transition: transform .14s, border-color .14s, color .14s, opacity .14s;
    -webkit-tap-highlight-color: transparent;
}

.et-icon-btn:hover {
    border-color: var(--et-accent);
    color: var(--et-accent);
    transform: translateY(-1px);
}

.et-icon-btn:active { transform: translateY(0); }
.et-icon-btn.is-off { opacity: .4; }
.et-icon-btn:focus-visible { outline: 2px solid var(--et-accent); outline-offset: 2px; }

/* ============ 主区默认 ============ */
.et-main {
    flex: 1;
    min-height: 0;
    position: relative;
    overflow: auto;
}

/* ============ 页脚（品牌回流 L2） ============ */
.et-footer {
    flex: none;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 7px 16px;
    font-size: 12px;
    color: var(--et-muted);
    border-top: 1px solid var(--et-line);
    background: var(--et-glass);
    user-select: none;
    z-index: 20;
}

.et-footer a {
    color: inherit;
    text-decoration: none;
    transition: color .14s;
}

.et-footer a:hover { color: var(--et-accent); }

/* ============ 按钮 ============ */
.et-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
    padding: 9px 16px;
    border-radius: 11px;
    font: inherit;
    font-size: 13.5px;
    font-weight: 700;
    border: 1px solid var(--et-line);
    background: var(--et-surface-2);
    color: var(--et-fg);
    cursor: pointer;
    transition: transform .14s, border-color .14s, color .14s, background .14s, box-shadow .14s;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
}

.et-btn:hover {
    border-color: var(--et-accent);
    color: var(--et-accent);
    transform: translateY(-1px);
}

.et-btn:active { transform: translateY(0); }
.et-btn:focus-visible { outline: 2px solid var(--et-accent); outline-offset: 2px; }
.et-btn:disabled { opacity: .45; cursor: not-allowed; transform: none; }

.et-btn--primary {
    background: var(--et-accent);
    border-color: var(--et-accent);
    color: #fff;
    box-shadow: 0 6px 18px -8px var(--et-accent);
}

.et-btn--primary:hover { color: #fff; filter: brightness(1.08); }
.et-btn--primary:disabled { filter: none; }

.et-btn--danger:hover {
    border-color: var(--et-err);
    color: var(--et-err);
}

.et-btn--lg {
    padding: 13px 26px;
    font-size: 16px;
    border-radius: 14px;
}

/* ============ 弹窗 ============ */
.et-modal {
    position: fixed;
    inset: 0;
    z-index: 100;
    display: grid;
    place-items: center;
    padding: 24px;
    background: rgba(2, 6, 23, .55);
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    animation: et-fade .18s ease;
}

.et-modal__panel {
    width: min(680px, 94vw);
    max-height: 86vh;
    max-height: 86dvh;
    display: flex;
    flex-direction: column;
    background: var(--et-surface);
    border: 1px solid var(--et-line);
    border-radius: 16px;
    box-shadow: var(--et-shadow-lg);
    animation: et-pop .2s cubic-bezier(.34, 1.4, .64, 1);
    overflow: hidden;
}

.et-modal__panel--narrow { width: min(460px, 92vw); }
.et-modal__panel--wide { width: min(900px, 94vw); }

.et-modal__head {
    flex: none;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 16px 20px;
    border-bottom: 1px solid var(--et-line);
    font-weight: 800;
    font-size: 15px;
}

.et-modal__head .et-icon-btn {
    margin-left: auto;
    width: 32px;
    height: 32px;
}

.et-modal__body {
    flex: 1;
    min-height: 0;
    overflow: auto;
    padding: 18px 20px;
}

.et-modal__foot {
    flex: none;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 14px 20px;
    border-top: 1px solid var(--et-line);
    background: var(--et-surface-2);
}

.et-modal__foot .spacer { flex: 1; }

@keyframes et-fade {
    from { opacity: 0; }
}

@keyframes et-pop {
    from { opacity: 0; transform: translateY(14px) scale(.97); }
}

/* ============ 轻提示（toast） ============ */
.et-toast {
    position: fixed;
    left: 50%;
    bottom: 56px;
    transform: translateX(-50%) translateY(10px);
    z-index: 120;
    display: flex;
    align-items: center;
    gap: 9px;
    max-width: min(520px, 88vw);
    padding: 11px 18px;
    border-radius: 12px;
    font-size: 13.5px;
    font-weight: 600;
    color: #fff;
    background: rgba(15, 23, 42, .92);
    border: 1px solid rgba(148, 163, 184, .25);
    box-shadow: var(--et-shadow-lg);
    opacity: 0;
    pointer-events: none;
    transition: opacity .22s, transform .22s;
}

.et-toast.is-show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
}

.et-toast[data-tone="ok"] { background: rgba(5, 150, 105, .95); }
.et-toast[data-tone="err"] { background: rgba(220, 38, 38, .95); }
.et-toast[data-tone="warn"] { background: rgba(217, 119, 6, .95); }

/* ============ 设置抽屉（右上角入口，edupick 交互） ============ */
.et-drawer-backdrop {
    position: fixed;
    inset: 0;
    z-index: 90;
    background: rgba(2, 6, 23, .45);
    backdrop-filter: blur(3px);
    -webkit-backdrop-filter: blur(3px);
    opacity: 0;
    transition: opacity .2s;
}

.et-drawer-backdrop.is-open { opacity: 1; }

.et-drawer {
    position: absolute;
    top: 0;
    right: 0;
    height: 100%;
    width: min(400px, 92vw);
    display: flex;
    flex-direction: column;
    background: var(--et-surface);
    border-left: 1px solid var(--et-line);
    box-shadow: var(--et-shadow-lg);
    transform: translateX(100%);
    transition: transform .22s cubic-bezier(.32, .72, .35, 1);
}

.et-drawer-backdrop.is-open .et-drawer { transform: translateX(0); }

.et-drawer__head {
    flex: none;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 15px 18px;
    border-bottom: 1px solid var(--et-line);
    font-weight: 800;
    font-size: 15px;
    color: var(--et-accent);
}

.et-drawer__head .et-icon-btn {
    margin-left: auto;
    width: 32px;
    height: 32px;
}

.et-drawer__body {
    flex: 1;
    min-height: 0;
    overflow: auto;
    padding: 16px 18px 24px;
}

/* 抽屉内容通用小节（工具复用） */
.et-drawer__body h4 {
    margin: 18px 0 8px;
    font-size: 12px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: .08em;
    color: var(--et-muted);
}

.et-drawer__body h4:first-child { margin-top: 0; }

.et-drawer__row {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
}

.et-drawer__tip {
    margin: 8px 0 0;
    font-size: 12px;
    line-height: 1.8;
    color: var(--et-muted);
}

.et-drawer__tip b { color: var(--et-fg); }

.et-drawer__input {
    flex: 1;
    min-width: 0;
    padding: 9px 12px;
    border: 1px solid var(--et-line-strong);
    border-radius: 9px;
    background: var(--et-surface-2);
    color: var(--et-fg);
    font: inherit;
    font-size: 13.5px;
    transition: border-color .14s, box-shadow .14s;
}

.et-drawer__input:focus {
    outline: none;
    border-color: var(--et-accent);
    box-shadow: 0 0 0 3px var(--et-accent-weak);
}

.et-drawer__switch {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 10px 0;
    border-bottom: 1px dashed var(--et-line);
    font-size: 13.5px;
    font-weight: 600;
    color: var(--et-fg);
    cursor: pointer;
    user-select: none;
}

.et-drawer__switch input {
    width: 17px;
    height: 17px;
    accent-color: var(--et-accent);
    cursor: pointer;
}
</style>

        api.beep = function (kind) {

/*!
 * et-stats.js — 使用统计模块（模块化，可整体移除）
 *
 * 共享逻辑源。改这里，然后跑：python scripts/sync_shared.py

 * 全局：ET.Stats
 *
 * ┌────────────────────────────────────────────────────────────────┐
 * │ 说明：本模块只做一件事——工具被打开时向上报端点发一条匿名计数。 │
 * │ · 在线（iframe 内）：宿主页面已服务端计数，本模块不重复上报。   │
 * │ · 离线打开（file:// / 下载单文件 / 离线包）：联网条件具备时，   │
 * │   以 sendBeacon 上报 use_offline 事件（text/plain 免预检）。    │
 * │ · 上报端点 = window.ET_SITE_ORIGIN（由宿主注入或离线包配置）。  │
 * │   未配置端点时本模块完全静默，不发任何请求。                    │
 * │ · **整个 <script> 块可安全删除**：删除后工具其余功能完全正常，  │
 * │   且完全不再发起任何网络请求。                                  │
 * └────────────────────────────────────────────────────────────────┘
 */
(function (global) {
    'use strict';

    var ET = global.ET = global.ET || {};

    var Stats = {
        /** 上报端点来源（站点绝对地址，无协议尾斜杠） */
        endpoint: (typeof global.ET_SITE_ORIGIN === 'string' && /^https?:\/\//.test(global.ET_SITE_ORIGIN))
            ? global.ET_SITE_ORIGIN
            : null,

        _done: {},

        /**
         * 上报一次事件（同一事件同一工具每次页面加载只报一次）。
         * event: 'use_offline' 等；toolId: 工具 id。
         */
        send: function (event, toolId) {
            if (!event || this._done[event + ':' + (toolId || '')]) { return false; }
            if (!this.endpoint) { return false; }
            /* iframe 内由宿主统计，避免双计 */

                global.addEventListener('online', function () { self.send(event, toolId); }, { once: true });

            var payload = JSON.stringify({ event: event, tool: toolId || '' });

            try {
                if (global.navigator.sendBeacon) {
                    return global.navigator.sendBeacon(
                        this.endpoint + '/api/track',
                        new Blob([payload], { type: 'text/plain;charset=UTF-8' })

                    method: 'POST',
                    body: payload,
                    keepalive: true,
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'text/plain;charset=UTF-8' }
                });
                return true;
            } catch (err) {
                return false;
            }
        }
    };

    ET.Stats = Stats;

            '<p style="margin:0 0 8px"><b>注意</b>：海陆轮廓为教学示意（已大幅简化），仅用于认识大洲大洋的相对位置，' +

    var els = {
        svg: document.getElementById('mwMap'),
        panel: document.getElementById('panel'),
        key: document.getElementById('key'),
        btnGrid: document.getElementById('btnGrid'),
        btnCap: document.getElementById('btnCap'),
        btnLabel: document.getElementById('btnLabel')
    };

    var state = {
        grid: store.get('grid', true) !== false,
        caps: store.get('caps', false) === true,
        labels: store.get('labels', true) !== false,
        sel: store.get('sel', null)
    };

    var current = null;   /* {type:'continent'|'country', key} */

    function X(lon) { return (lon + 180) / 360 * VW; }
    function Y(lat) { return (90 - lat) / 180 * VH; }

    function pathOf(pts) {
        var out = 'M';
        for (var i = 0; i < pts.length; i++) {
            out += (i ? ' L' : ' ') + X(pts[i][0]).toFixed(1) + ' ' + Y(pts[i][1]).toFixed(1);
        }
        return out + ' Z';
    }

    /* ---------- 绘制 ---------- */

    function render() {
        var parts = [];
        parts.push('<rect x="0" y="0" width="' + VW + '" height="' + VH + '" fill="#cfe8ff"/>');

        if (state.grid) {
            parts.push(gridSvg());
        }

        CONTINENTS.forEach(function (ct) {
            var on = current && current.type === 'continent' && current.key === ct.k;
            parts.push('<path class="mw-land" data-ct="' + ct.k + '" d="' + pathOf(ct.pts) + '" fill="' +
                ct.color + '" stroke="#ffffff" stroke-width="' + (on ? 3 : 1.2) + '" opacity="' +
                (current && current.type === 'continent' && !on ? .55 : .92) + '"></path>');
            (ct.extra || []).forEach(function (pts) {
                parts.push('<path class="mw-land" data-ct="' + ct.k + '" d="' + pathOf(pts) + '" fill="' +
                    ct.color + '" stroke="#ffffff" stroke-width="1.2" opacity="' +
                    (current && current.type === 'continent' && !on ? .55 : .92) + '"></path>');
            });
        });

        if (state.labels) {
            CONTINENTS.forEach(function (ct) {
                var c = centerOf(ct);
                parts.push('<text x="' + c[0].toFixed(0) + '" y="' + c[1].toFixed(0) +
                    '" text-anchor="middle" font-size="15" font-weight="800" fill="#ffffff" ' +
                    'stroke="rgba(15,23,42,.55)" stroke-width="3" paint-order="stroke" ' +
                    'style="pointer-events:none">' + ct.n + '</text>');
            });
        }

        if (state.caps) {
            COUNTRIES.forEach(function (c, i) {
                var on = current && current.type === 'country' && current.key === i;
                parts.push('<circle class="mw-dot" data-cn="' + i + '" cx="' + X(c.lon).toFixed(1) +
                    '" cy="' + Y(c.lat).toFixed(1) + '" r="' + (on ? 6 : 4) + '" fill="' +
                    (on ? '#dc2626' : 'rgba(15,23,42,.75)') + '" stroke="#fff" stroke-width="1.5"></circle>');
            });
        }

        els.svg.innerHTML = parts.join('');
    }

    function gridSvg() {
        var out = [];
        var i;
        /* 每 30° 经纬网 */
        for (i = -180; i <= 180; i += 30) {
            out.push('<line x1="' + X(i).toFixed(1) + '" y1="0" x2="' + X(i).toFixed(1) +
                '" y2="' + VH + '" stroke="rgba(255,255,255,.75)" stroke-width="1"></line>');
        }
        for (i = -60; i <= 60; i += 30) {
            out.push('<line x1="0" y1="' + Y(i).toFixed(1) + '" x2="' + VW + '" y2="' + Y(i).toFixed(1) +
                '" stroke="rgba(255,255,255,.75)" stroke-width="1"></line>');
        }
        /* 特殊线 */
        out.push(line(Y(0), 'rgba(190,24,93,.85)', 2, '10 5'));
        out.push(line(Y(23.5), 'rgba(217,119,6,.9)', 1.5, '8 5'));
        out.push(line(Y(-23.5), 'rgba(217,119,6,.9)', 1.5, '8 5'));
        out.push(line(Y(66.5), 'rgba(79,70,229,.85)', 1.5, '8 5'));
        out.push(line(Y(-66.5), 'rgba(79,70,229,.85)', 1.5, '8 5'));
        out.push('<line x1="' + X(0) + '" y1="0" x2="' + X(0) + '" y2="' + VH +
            '" stroke="rgba(190,24,93,.7)" stroke-width="1.5"></line>');

        /* 标注 */
        out.push('<text x="' + (VW - 8) + '" y="' + (Y(0) - 6) + '" text-anchor="end" font-size="12" ' +
            'font-weight="700" fill="rgba(190,24,93,.95)" style="pointer-events:none">赤道 0°</text>');
        out.push('<text x="' + (VW - 8) + '" y="' + (Y(23.5) - 5) + '" text-anchor="end" font-size="11.5" ' +
            'font-weight="700" fill="rgba(217,119,6,.95)" style="pointer-events:none">北回归线 23.5°N</text>');
        out.push('<text x="' + (VW - 8) + '" y="' + (Y(-23.5) + 13) + '" text-anchor="end" font-size="11.5" ' +
            'font-weight="700" fill="rgba(217,119,6,.95)" style="pointer-events:none">南回归线 23.5°S</text>');
        out.push('<text x="8" y="' + (Y(0) + 14) + '" font-size="11.5" font-weight="700" ' +
            'fill="rgba(190,24,93,.95)" style="pointer-events:none">本初子午线</text>');
        return out.join('');
    }

    function line(y, color, width, dash) {
        return '<line x1="0" y1="' + y.toFixed(1) + '" x2="' + VW + '" y2="' + y.toFixed(1) +
            '" stroke="' + color + '" stroke-width="' + width + '" stroke-dasharray="' + dash +
            '" style="pointer-events:none"></line>';
    }

    /* 大洲标注位置：取多边形重心 */
    function centerOf(ct) {
        var sx = 0;
        var sy = 0;
        ct.pts.forEach(function (p) { sx += X(p[0]); sy += Y(p[1]); });
        return [sx / ct.pts.length, sy / ct.pts.length];
    }

    /* ---------- 面板 ---------- */

    function renderKey() {
        els.key.innerHTML = '';
        CONTINENTS.forEach(function (ct) {
            var sp = document.createElement('span');
            sp.innerHTML = '<i style="background:' + ct.color + '"></i>' + ct.n;
            els.key.appendChild(sp);
        });
    }

    function renderPanel() {
        var html = '';
        els.panel.style.removeProperty('--mw-color');

        if (current && current.type === 'continent') {
            var ct = byKey(current.key);
            if (ct) {
                els.panel.style.setProperty('--mw-color', ct.color);
                html += '<div class="mw-title"><h2>' + ct.n + '</h2><span>大洲</span></div>';
                html += '<div class="mw-grid2">' +
                    cell('面积', ct.area + ' 万平方千米') +
                    cell('人口', ct.pop) +
                    cell('最高峰', ct.top) +
                    cell('半球位置', hemisOf(ct)) +
                    '</div>';
                html += '<p class="mw-tip">' + ct.alt + '</p>';
                html += '<p class="mw-tip">' + ct.tip + '</p>';

                var list = countriesOf(ct.k);
                if (list.length) {
                    html += '<div class="mw-sec">该洲主要国家（点击查看）</div><div class="mw-list">';
                    list.forEach(function (c) {
                        html += '<button class="mw-item" data-cn="' + c.i + '" type="button">' + c.n + '</button>';
                    });
                    html += '</div>';
                }
            }
        } else if (current && current.type === 'country') {
            var c = COUNTRIES[current.key];
            if (c) {
                var ct2 = byKey(c.ct);
                els.panel.style.setProperty('--mw-color', ct2 ? ct2.color : '#0369a1');
                html += '<div class="mw-title"><h2>' + c.n + '</h2><span>' + (ct2 ? ct2.n : '') + '</span></div>';
                html += '<div class="mw-grid2">' +
                    cell('首都', c.c) +
                    cell('所在大洲', ct2 ? ct2.n : '—') +
                    cell('纬度', latText(c.lat)) +
                    cell('经度', lonText(c.lon)) +
                    '</div>';
                html += '<p class="mw-tip">' + c.tip + '</p>';
            }
        } else {
            html += '<div class="mw-sec">世界概况</div>';
            html += '<p class="mw-tip">地球表面海洋约占 <b>71%</b>、陆地约占 <b>29%</b>；' +
                '陆地分为七大洲，海洋分为四大洋。</p>';
            html += '<div class="mw-sec">七大洲（点击查看）</div><div class="mw-list">';
            CONTINENTS.forEach(function (ct) {
                html += '<button class="mw-item" data-ct="' + ct.k + '" type="button">' + ct.n + '</button>';
            });
            html += '</div>';
            html += '<div class="mw-sec">四大洋</div>';
            html += '<p class="mw-tip">太平洋（约 1.8 亿 km²，最大最深）· 大西洋（约 9337 万 km²）· ' +
                '印度洋（约 7492 万 km²）· 北冰洋（约 1310 万 km²，最小最浅）</p>';
        }

        if (current) {
            html += '<button class="mw-item" id="btnBack" type="button" style="margin-top:14px">返回世界概况</button>';
        }

        els.panel.innerHTML = html;
        bindPanel();
    }

    function bindPanel() {
        var back = document.getElementById('btnBack');
        if (back) {
            back.addEventListener('click', function () {
                current = null;
                state.sel = null;
                store.set('sel', null);
                render();
                renderPanel();
            });
        }
        var list = els.panel.querySelectorAll('[data-ct]');
        for (var i = 0; i < list.length; i++) {
            list[i].addEventListener('click', function () {
                focusContinent(this.getAttribute('data-ct'));
            });
        }
        var list2 = els.panel.querySelectorAll('[data-cn]');
        for (var k = 0; k < list2.length; k++) {
            list2[k].addEventListener('click', function () {
                focusCountry(parseInt(this.getAttribute('data-cn'), 10));
            });
        }
    }

    function cell(label, value) {
        return '<div class="mw-cell"><b>' + label + '</b><span>' + value + '</span></div>';
    }

    function byKey(k) {
        for (var i = 0; i < CONTINENTS.length; i++) {
            if (CONTINENTS[i].k === k) { return CONTINENTS[i]; }
        }
        return null;
    }

    function countriesOf(k) {
        var out = [];
        COUNTRIES.forEach(function (c, i) {
            if (c.ct === k) { out.push({ i: i, n: c.n }); }
        });
        return out;
    }

    function latText(v) {
        if (Math.abs(v) < 0.05) { return '0°（赤道）'; }
        return (v > 0 ? '北纬 ' : '南纬 ') + Math.abs(v).toFixed(1) + '°';
    }

    function lonText(v) {
        if (Math.abs(v) < 0.05) { return '0°（本初子午线）'; }
        return (v > 0 ? '东经 ' : '西经 ') + Math.abs(v).toFixed(1) + '°';
    }

    function hemisOf(ct) {
        var minLat = 90;
        var maxLat = -90;
        ct.pts.forEach(function (p) {
            if (p[1] < minLat) { minLat = p[1]; }
            if (p[1] > maxLat) { maxLat = p[1]; }
        });
        var ns = minLat >= 0 ? '全部位于北半球'
            : (maxLat <= 0 ? '全部位于南半球' : '跨南北半球');
        return ns;
    }

    /* ---------- 选中 ---------- */

    function focusContinent(k) {
        current = { type: 'continent', key: k };
        state.sel = k;
        store.set('sel', k);
        render();
        renderPanel();
        var ct = byKey(k);
        if (ct) { chrome.setStatus(ct.n + ' · ' + ct.area + ' 万 km²', 'ok'); }
        try { chrome.beep('tick'); } catch (e) { /* 静默 */ }
    }

    function focusCountry(i) {
        current = { type: 'country', key: i };
        state.sel = i;
        store.set('sel', i);
        render();
        renderPanel();
        chrome.setStatus(COUNTRIES[i].n + ' · 首都 ' + COUNTRIES[i].c, 'ok');
        try { chrome.beep('tick'); } catch (e) { /* 静默 */ }
    }

    function cycleContinent() {
        var idx = 0;
        if (current && current.type === 'continent') {
            for (var i = 0; i < CONTINENTS.length; i++) {
                if (CONTINENTS[i].k === current.key) { idx = i + 1; }
            }
        }
        focusContinent(CONTINENTS[idx % CONTINENTS.length].k);
    }

    els.svg.addEventListener('click', function (e) {
        var t = e.target;
        var ct = t.getAttribute && t.getAttribute('data-ct');
        var cn = t.getAttribute && t.getAttribute('data-cn');
        if (cn !== null && cn !== undefined && cn !== '') {
            focusCountry(parseInt(cn, 10));
        } else if (ct) {
            focusContinent(ct);
        }
    });

    /* ---------- 开关 ---------- */

    function toggle(which) {
        state[which] = !state[which];
        store.set(which, state[which]);
        els.btnGrid.classList.toggle('is-on', state.grid);
        els.btnCap.classList.toggle('is-on', state.caps);
        els.btnLabel.classList.toggle('is-on', state.labels);
        render();
    }

    els.btnGrid.addEventListener('click', function () { toggle('grid'); });
    els.btnCap.addEventListener('click', function () { toggle('caps'); });
    els.btnLabel.addEventListener('click', function () { toggle('labels'); });

    function isTypingTarget(node) {
        if (!node || !node.tagName) { return false; }
        var tag = node.tagName.toUpperCase();
        return tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT' || node.isContentEditable === true;
    }

    document.addEventListener('keydown', function (e) {
        if (isTypingTarget(e.target) || document.querySelector('.et-modal, .et-drawer-backdrop')) { return; }
        if (e.code === 'Space') {
            e.preventDefault();
            cycleContinent();
        } else if (e.key === 'Escape') {
            current = null;
            state.sel = null;
            render();
            renderPanel();
        }
    });

    /* ---------- 启动 ---------- */

    renderKey();
    els.btnGrid.classList.toggle('is-on', state.grid);
    els.btnCap.classList.toggle('is-on', state.caps);
    els.btnLabel.classList.toggle('is-on', state.labels);

    if (state.sel && byKey(state.sel)) {
        current = { type: 'continent', key: state.sel };
    }
    render();
    renderPanel();
})();
</script>

</body>
</html>
