/*!
 * et-chrome.css — 工具通用外壳样式（顶栏 / 页脚 / 弹窗 / 按钮 / 主题）
 *
 * 共享样式源。改这里，然后跑：python scripts/sync_shared.py
 * 所有类名带 et- 前缀，避免与工具自身样式冲突。
 * 依赖：无外部资源；颜色全部为令牌变量。
 */

/* ============ 设计令牌 ============ */
:root {
    --et-accent: #2563eb;
    --et-accent-weak: rgba(37, 99, 235, .14);
    --et-bg: #f4f6fb;
    --et-surface: #ffffff;
    --et-surface-2: #f8fafc;
    --et-fg: #0b1220;
    --et-muted: #64748b;
    --et-line: rgba(15, 23, 42, .12);
    --et-line-strong: rgba(15, 23, 42, .22);
    --et-glass: rgba(255, 255, 255, .85);
    --et-shadow-md: 0 10px 28px -18px rgba(15, 23, 42, .3);
    --et-shadow-lg: 0 24px 60px -32px rgba(15, 23, 42, .4);
    --et-ok: #059669;
    --et-warn: #d97706;
    --et-err: #dc2626;
    --et-radius: 12px;
    --et-radius-sm: 9px;
    --et-font: -apple-system, BlinkMacSystemFont, "Segoe UI",
               "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei",
               "Noto Sans SC", sans-serif;
    --et-mono: ui-monospace, "Cascadia Mono", Consolas, Menlo, monospace;
}

html[data-et-theme="dark"] {
    --et-bg: #0b1120;
    --et-surface: #111a2e;
    --et-surface-2: #0f1729;
    --et-fg: #f1f5f9;
    --et-muted: #94a3b8;
    --et-line: rgba(148, 163, 184, .18);
    --et-line-strong: rgba(148, 163, 184, .3);
    --et-glass: rgba(17, 26, 46, .85);
    --et-shadow-md: 0 10px 34px -18px rgba(0, 0, 0, .8);
    --et-shadow-lg: 0 24px 70px -30px rgba(0, 0, 0, .9);
    --et-ok: #34d399;
    --et-warn: #fbbf24;
    --et-err: #f87171;
}

/* ============ 基础 ============ */

/* body 作为外壳时必须清掉浏览器默认 8px 外边距，
   否则 iframe 预览中文档会比视口高 16px（底部白边 + 多余滚动） */
body.et-app {
    margin: 0;
}

.et-app {
    position: relative;
    isolation: isolate;
    display: flex;
    flex-direction: column;
    height: 100vh;
    height: 100dvh;
    overflow: hidden;
    background: var(--et-bg);
    color: var(--et-fg);
    font-family: var(--et-font);
    -webkit-font-smoothing: antialiased;
    transition: background .25s, color .25s;
}

/* 极光背景：径向渐变 + 呼吸动画（edupick 品质基线，老内核也不掉帧） */
.et-app::before {
    content: '';
    position: fixed;
    inset: 0;
    z-index: -1;
    pointer-events: none;
    background:
        radial-gradient(46% 40% at 20% 18%, var(--et-accent-weak), transparent 65%),
        radial-gradient(42% 38% at 82% 24%, var(--et-accent-weak), transparent 70%),
        radial-gradient(50% 44% at 55% 95%, rgba(16, 185, 129, .10), transparent 65%);
    animation: et-aurora 16s ease-in-out infinite alternate;
}

@keyframes et-aurora {
    from { opacity: .55; transform: scale(1); }
    to { opacity: 1; transform: scale(1.06); }
}

.et-app *,
.et-app *::before,
.et-app *::after { box-sizing: border-box; }

[hidden] { display: none !important; }

.et-icon {
    width: 18px;
    height: 18px;
    fill: none;
    stroke: currentColor;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
    flex: none;
}

/* ============ 顶栏 ============ */
.et-topbar {
    flex: none;
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 11px 20px;
    border-bottom: 1px solid var(--et-line);
    background: var(--et-glass);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    z-index: 20;
}

.et-brand {
    display: flex;
    align-items: center;
    gap: 10px;
    min-width: 0;
}

.et-brand__dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: var(--et-accent);
    box-shadow: 0 0 0 4px var(--et-accent-weak);
    flex: none;
}

.et-brand__name {
    font-weight: 800;
    font-size: 15px;
    letter-spacing: -.01em;
    white-space: nowrap;
}

.et-brand__sub {
    font-size: 12.5px;
    color: var(--et-muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.et-status {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 5px 14px;
    border-radius: 999px;
    font-size: 12.5px;
    color: var(--et-muted);
    background: var(--et-surface-2);
    border: 1px solid var(--et-line);
    white-space: nowrap;
    max-width: 42vw;
    overflow: hidden;
    text-overflow: ellipsis;
}

.et-status__dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--et-ok);
    flex: none;
    transition: background .2s;
}

.et-status[data-tone="err"] .et-status__dot { background: var(--et-err); }
.et-status[data-tone="warn"] .et-status__dot { background: var(--et-warn); }

.et-actions {
    display: flex;
    align-items: center;
    gap: 7px;
}

.et-icon-btn {
    display: inline-grid;
    place-items: center;
    width: 38px;
    height: 38px;
    font-size: 16px;
    line-height: 1;
    border-radius: 11px;
    border: 1px solid var(--et-line);
    background: var(--et-surface-2);
    color: var(--et-fg);
    cursor: pointer;
    transition: transform .14s, border-color .14s, color .14s, opacity .14s;
    -webkit-tap-highlight-color: transparent;
}

.et-icon-btn:hover {
    border-color: var(--et-accent);
    color: var(--et-accent);
    transform: translateY(-1px);
}

.et-icon-btn:active { transform: translateY(0); }
.et-icon-btn.is-off { opacity: .4; }
.et-icon-btn:focus-visible { outline: 2px solid var(--et-accent); outline-offset: 2px; }

/* ============ 主区默认 ============ */
.et-main {
    flex: 1;
    min-height: 0;
    position: relative;
    overflow: auto;
}

/* ============ 页脚（品牌回流 L2） ============ */
.et-footer {
    flex: none;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 7px 16px;
    font-size: 12px;
    color: var(--et-muted);
    border-top: 1px solid var(--et-line);
    background: var(--et-glass);
    user-select: none;
    z-index: 20;
}

.et-footer a {
    color: inherit;
    text-decoration: none;
    transition: color .14s;
}

.et-footer a:hover { color: var(--et-accent); }

/* ============ 按钮 ============ */
.et-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
    padding: 9px 16px;
    border-radius: 11px;
    font: inherit;
    font-size: 13.5px;
    font-weight: 700;
    border: 1px solid var(--et-line);
    background: var(--et-surface-2);
    color: var(--et-fg);
    cursor: pointer;
    transition: transform .14s, border-color .14s, color .14s, background .14s, box-shadow .14s;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
}

.et-btn:hover {
    border-color: var(--et-accent);
    color: var(--et-accent);
    transform: translateY(-1px);
}

.et-btn:active { transform: translateY(0); }
.et-btn:focus-visible { outline: 2px solid var(--et-accent); outline-offset: 2px; }
.et-btn:disabled { opacity: .45; cursor: not-allowed; transform: none; }

.et-btn--primary {
    background: var(--et-accent);
    border-color: var(--et-accent);
    color: #fff;
    box-shadow: 0 6px 18px -8px var(--et-accent);
}

.et-btn--primary:hover { color: #fff; filter: brightness(1.08); }
.et-btn--primary:disabled { filter: none; }

.et-btn--danger:hover {
    border-color: var(--et-err);
    color: var(--et-err);
}

.et-btn--lg {
    padding: 13px 26px;
    font-size: 16px;
    border-radius: 14px;
}

/* ============ 弹窗 ============ */
.et-modal {
    position: fixed;
    inset: 0;
    z-index: 100;
    display: grid;
    place-items: center;
    padding: 24px;
    background: rgba(2, 6, 23, .55);
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    animation: et-fade .18s ease;
}

.et-modal__panel {
    width: min(680px, 94vw);
    max-height: 86vh;
    max-height: 86dvh;
    display: flex;
    flex-direction: column;
    background: var(--et-surface);
    border: 1px solid var(--et-line);
    border-radius: 16px;
    box-shadow: var(--et-shadow-lg);
    animation: et-pop .2s cubic-bezier(.34, 1.4, .64, 1);
    overflow: hidden;
}

.et-modal__panel--narrow { width: min(460px, 92vw); }
.et-modal__panel--wide { width: min(900px, 94vw); }

.et-modal__head {
    flex: none;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 16px 20px;
    border-bottom: 1px solid var(--et-line);
    font-weight: 800;
    font-size: 15px;
}

.et-modal__head .et-icon-btn {
    margin-left: auto;
    width: 32px;
    height: 32px;
}

.et-modal__body {
    flex: 1;
    min-height: 0;
    overflow: auto;
    padding: 18px 20px;
}

.et-modal__foot {
    flex: none;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 14px 20px;
    border-top: 1px solid var(--et-line);
    background: var(--et-surface-2);
}

.et-modal__foot .spacer { flex: 1; }

@keyframes et-fade {
    from { opacity: 0; }
}

@keyframes et-pop {
    from { opacity: 0; transform: translateY(14px) scale(.97); }
}

/* ============ 轻提示（toast） ============ */
.et-toast {
    position: fixed;
    left: 50%;
    bottom: 56px;
    transform: translateX(-50%) translateY(10px);
    z-index: 120;
    display: flex;
    align-items: center;
    gap: 9px;
    max-width: min(520px, 88vw);
    padding: 11px 18px;
    border-radius: 12px;
    font-size: 13.5px;
    font-weight: 600;
    color: #fff;
    background: rgba(15, 23, 42, .92);
    border: 1px solid rgba(148, 163, 184, .25);
    box-shadow: var(--et-shadow-lg);
    opacity: 0;
    pointer-events: none;
    transition: opacity .22s, transform .22s;
}

.et-toast.is-show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
}

.et-toast[data-tone="ok"] { background: rgba(5, 150, 105, .95); }
.et-toast[data-tone="err"] { background: rgba(220, 38, 38, .95); }
.et-toast[data-tone="warn"] { background: rgba(217, 119, 6, .95); }

/* ============ 设置抽屉（右上角入口，edupick 交互） ============ */
.et-drawer-backdrop {
    position: fixed;
    inset: 0;
    z-index: 90;
    background: rgba(2, 6, 23, .45);
    backdrop-filter: blur(3px);
    -webkit-backdrop-filter: blur(3px);
    opacity: 0;
    transition: opacity .2s;
}

.et-drawer-backdrop.is-open { opacity: 1; }

.et-drawer {
    position: absolute;
    top: 0;
    right: 0;
    height: 100%;
    width: min(400px, 92vw);
    display: flex;
    flex-direction: column;
    background: var(--et-surface);
    border-left: 1px solid var(--et-line);
    box-shadow: var(--et-shadow-lg);
    transform: translateX(100%);
    transition: transform .22s cubic-bezier(.32, .72, .35, 1);
}

.et-drawer-backdrop.is-open .et-drawer { transform: translateX(0); }

.et-drawer__head {
    flex: none;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 15px 18px;
    border-bottom: 1px solid var(--et-line);
    font-weight: 800;
    font-size: 15px;
    color: var(--et-accent);
}

.et-drawer__head .et-icon-btn {
    margin-left: auto;
    width: 32px;
    height: 32px;
}

.et-drawer__body {
    flex: 1;
    min-height: 0;
    overflow: auto;
    padding: 16px 18px 24px;
}

/* 抽屉内容通用小节（工具复用） */
.et-drawer__body h4 {
    margin: 18px 0 8px;
    font-size: 12px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: .08em;
    color: var(--et-muted);
}

.et-drawer__body h4:first-child { margin-top: 0; }

.et-drawer__row {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
}

.et-drawer__tip {
    margin: 8px 0 0;
    font-size: 12px;
    line-height: 1.8;
    color: var(--et-muted);
}

.et-drawer__tip b { color: var(--et-fg); }

.et-drawer__input {
    flex: 1;
    min-width: 0;
    padding: 9px 12px;
    border: 1px solid var(--et-line-strong);
    border-radius: 9px;
    background: var(--et-surface-2);
    color: var(--et-fg);
    font: inherit;
    font-size: 13.5px;
    transition: border-color .14s, box-shadow .14s;
}

.et-drawer__input:focus {
    outline: none;
    border-color: var(--et-accent);
    box-shadow: 0 0 0 3px var(--et-accent-weak);
}

.et-drawer__switch {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 10px 0;
    border-bottom: 1px dashed var(--et-line);
    font-size: 13.5px;
    font-weight: 600;
    color: var(--et-fg);
    cursor: pointer;
    user-select: none;
}

.et-drawer__switch input {
    width: 17px;
    height: 17px;
    accent-color: var(--et-accent);
    cursor: pointer;
}
</style>

                p2.innerHTML = '<b>四大洋</b>：太平洋（约 1.8 亿 km²，最大最深）、大西洋（约 9337 万 km²）、' +
                    '印度洋（约 7492 万 km²）、北冰洋（约 1310 万 km²，最小最浅）。';
                body.appendChild(p);
                body.appendChild(p2);
            }
        }
    });

    var els = {
        svg: document.getElementById('mwMap'),
        globe: document.getElementById('mwGlobe'),
        panel: document.getElementById('panel'),
        key: document.getElementById('key'),
        modeFlat: document.getElementById('modeFlat'),
        modeGlobe: document.getElementById('modeGlobe'),
        btnGrid: document.getElementById('btnGrid'),
        btnCap: document.getElementById('btnCap'),
        btnLabel: document.getElementById('btnLabel'),
        btnSpin: document.getElementById('btnSpin')
    };

    var state = {
        view: store.get('view', 'flat') === 'globe' ? 'globe' : 'flat',
        spin: store.get('spin', true) !== false,
        grid: store.get('grid', true) !== false,
        caps: store.get('caps', false) === true,
        labels: store.get('labels', true) !== false,
        sel: store.get('sel', null)
    };

    var current = null;   /* {type:'continent'|'country', key} */

    function X(lon) { return (lon + 180) / 360 * VW; }
    function Y(lat) { return (90 - lat) / 180 * VH; }

    /* ---------- 真实海陆数据解析（MC_WORLD 由 scripts/gen_world_map.py 生成） ---------- */

    var LAND = [];        /* {c:洲key, n:国名, rings:[[x,y]...](视口), geo:[[lon,lat]...], bbox} */
    var LAND_PATHS = [];  /* 与 LAND 对齐的 SVG path d */

    (function parseWorld() {
        if (typeof MC_WORLD === 'undefined') { return; }
        MC_WORLD.l.forEach(function (it) {
            var rings = [];
            var geo = [];
            var bx1 = 1e9, by1 = 1e9, bx2 = -1e9, by2 = -1e9;
            it[2].split('|').forEach(function (rs) {
                var rv = [];
                var gv = [];
                rs.split(' ').forEach(function (pair) {
                    var pp = pair.split(',');
                    var lon = parseInt(pp[0], 10) / 10;
                    var lat = parseInt(pp[1], 10) / 10;
                    var x = X(lon), y = Y(lat);
                    gv.push([lon, lat]);
                    rv.push([x, y]);
                    if (x < bx1) { bx1 = x; }
                    if (y < by1) { by1 = y; }
                    if (x > bx2) { bx2 = x; }
                    if (y > by2) { by2 = y; }
                });
                if (rv.length >= 4) {
                    rings.push(rv);
                    geo.push(gv);
                }
            });
            LAND.push({ c: it[0], n: it[1], rings: rings, geo: geo, b: [bx1, by1, bx2, by2] });
        });
        function pathOfRings(rings) {
            var out = [];
            rings.forEach(function (r) {
                var s = 'M';
                for (var i = 0; i < r.length; i++) {
                    s += (i ? ' L' : '') + r[i][0].toFixed(1) + ' ' + r[i][1].toFixed(1);
                }
                out.push(s + ' Z');
            });
            return out.join(' ');
        }
        LAND.forEach(function (c) { LAND_PATHS.push(pathOfRings(c.rings)); });
    })();

    function colorOf(ck) {
        var ct = byKey(ck);
        return ct ? ct.color : '#94a3b8';
    }

    /* ---------- 绘制（平面） ---------- */

    function render() {
        if (state.view === 'globe') {
            drawGlobe();
            return;
        }
        var parts = [];
        parts.push('<rect x="0" y="0" width="' + VW + '" height="' + VH + '" fill="#cfe8ff"/>');

        if (state.grid) {
            parts.push(gridSvg());
        }

        LAND.forEach(function (c, i) {
            var on = current && current.type === 'continent' && current.key === c.c;
            var dim = current && current.type === 'continent' && !on;
            parts.push('<path class="mw-land" data-ct="' + c.c + '" d="' + LAND_PATHS[i] +
                '" fill="' + colorOf(c.c) + '" fill-rule="evenodd" stroke="#ffffff" stroke-width="' +
                (on ? 1.8 : 0.7) + '" opacity="' + (dim ? .32 : (on ? 1 : .92)) + '">' +
                '<title>' + c.n + '</title></path>');
        });

        if (state.labels) {
            CONTINENTS.forEach(function (ct) {
                parts.push('<text x="' + X(ct.lab[0]).toFixed(0) + '" y="' + Y(ct.lab[1]).toFixed(0) +
                    '" text-anchor="middle" font-size="15" font-weight="800" fill="#ffffff" ' +
                    'stroke="rgba(15,23,42,.55)" stroke-width="3" paint-order="stroke" ' +
                    'style="pointer-events:none">' + ct.n + '</text>');
            });
        }

        if (state.caps) {
            COUNTRIES.forEach(function (c, i) {
                var on = current && current.type === 'country' && current.key === i;
                parts.push('<circle class="mw-dot" data-cn="' + i + '" cx="' + X(c.lon).toFixed(1) +
                    '" cy="' + Y(c.lat).toFixed(1) + '" r="' + (on ? 6 : 4) + '" fill="' +
                    (on ? '#dc2626' : 'rgba(15,23,42,.75)') + '" stroke="#fff" stroke-width="1.5"></circle>');
            });
        }

        els.svg.innerHTML = parts.join('');
    }

    function gridSvg() {
        var out = [];
        var i;
        /* 每 30° 经纬网 */
        for (i = -180; i <= 180; i += 30) {
            out.push('<line x1="' + X(i).toFixed(1) + '" y1="0" x2="' + X(i).toFixed(1) +
                '" y2="' + VH + '" stroke="rgba(255,255,255,.75)" stroke-width="1"></line>');
        }
        for (i = -60; i <= 60; i += 30) {
            out.push('<line x1="0" y1="' + Y(i).toFixed(1) + '" x2="' + VW + '" y2="' + Y(i).toFixed(1) +
                '" stroke="rgba(255,255,255,.75)" stroke-width="1"></line>');
        }
        /* 特殊线 */
        out.push(line(Y(0), 'rgba(190,24,93,.85)', 2, '10 5'));
        out.push(line(Y(23.5), 'rgba(217,119,6,.9)', 1.5, '8 5'));
        out.push(line(Y(-23.5), 'rgba(217,119,6,.9)', 1.5, '8 5'));
        out.push(line(Y(66.5), 'rgba(79,70,229,.85)', 1.5, '8 5'));
        out.push(line(Y(-66.5), 'rgba(79,70,229,.85)', 1.5, '8 5'));
        out.push('<line x1="' + X(0) + '" y1="0" x2="' + X(0) + '" y2="' + VH +
            '" stroke="rgba(190,24,93,.7)" stroke-width="1.5"></line>');

        /* 标注 */
        out.push('<text x="' + (VW - 8) + '" y="' + (Y(0) - 6) + '" text-anchor="end" font-size="12" ' +
            'font-weight="700" fill="rgba(190,24,93,.95)" style="pointer-events:none">赤道 0°</text>');
        out.push('<text x="' + (VW - 8) + '" y="' + (Y(23.5) - 5) + '" text-anchor="end" font-size="11.5" ' +
            'font-weight="700" fill="rgba(217,119,6,.95)" style="pointer-events:none">北回归线 23.5°N</text>');
        out.push('<text x="' + (VW - 8) + '" y="' + (Y(-23.5) + 13) + '" text-anchor="end" font-size="11.5" ' +
            'font-weight="700" fill="rgba(217,119,6,.95)" style="pointer-events:none">南回归线 23.5°S</text>');
        out.push('<text x="8" y="' + (Y(0) + 14) + '" font-size="11.5" font-weight="700" ' +
            'fill="rgba(190,24,93,.95)" style="pointer-events:none">本初子午线</text>');
        return out.join('');
    }

    function line(y, color, width, dash) {
        return '<line x1="0" y1="' + y.toFixed(1) + '" x2="' + VW + '" y2="' + y.toFixed(1) +
            '" stroke="' + color + '" stroke-width="' + width + '" stroke-dasharray="' + dash +
            '" style="pointer-events:none"></line>';
    }

    /* ---------- 3D 地球仪（Canvas 正射投影，可拖拽 / 缩放 / 自转） ---------- */

    var globe = {
        ctx: null, w: 0, h: 0, dpr: 1, R: 1,
        yaw: 105, pitch: 30, zoom: 1,
        dragging: false, moved: 0, lastX: 0, lastY: 0,
        raf: 0, lastT: 0, hits: []
    };

    function initGlobe() {
        globe.ctx = els.globe.getContext('2d');
        resizeGlobe();
    }

    function resizeGlobe() {
        var cv = els.globe;
        globe.dpr = window.devicePixelRatio || 1;
        var w = cv.clientWidth || 600;
        var h = cv.clientHeight || 400;
        globe.w = w;
        globe.h = h;
        cv.width = Math.max(2, Math.round(w * globe.dpr));
        cv.height = Math.max(2, Math.round(h * globe.dpr));
    }

    /* 正射投影：返回 [屏幕x, 屏幕y, cosc]（cosc<0 为背面不可见） */
    function proj(lon, lat) {
        var lam = (lon - globe.yaw) * Math.PI / 180;
        var phi = lat * Math.PI / 180;
        var phi0 = globe.pitch * Math.PI / 180;
        var cosc = Math.sin(phi0) * Math.sin(phi) + Math.cos(phi0) * Math.cos(phi) * Math.cos(lam);
        var R = globe.R;
        var cx = globe.w / 2;
        var cy = globe.h / 2;
        return [
            cx + R * Math.cos(phi) * Math.sin(lam),
            cy - R * (Math.cos(phi0) * Math.sin(phi) - Math.sin(phi0) * Math.cos(phi) * Math.cos(lam)),
            cosc
        ];
    }

    /* 反解：屏幕点 → 经纬度（用于点击命中） */
    function unproj(px, py) {
        var R = globe.R;
        var x = (px - globe.w / 2) / R;
        var y = (globe.h / 2 - py) / R;
        var rho = Math.sqrt(x * x + y * y);
        if (rho > 1.001) { return null; }
        if (rho < 1e-6) { return [globe.yaw, globe.pitch]; }
        var c = Math.asin(Math.min(1, rho));
        var phi0 = globe.pitch * Math.PI / 180;
        var sy = Math.sin(phi0);
        var cy0 = Math.cos(phi0);
        var phi = Math.asin(Math.max(-1, Math.min(1, Math.cos(c) * sy + y * Math.sin(c) * cy0 / rho)));
        var lam = Math.atan2(x * Math.sin(c), rho * cy0 * Math.cos(c) - y * sy * Math.sin(c));
        var lon = globe.yaw + lam * 180 / Math.PI;
        lon = ((lon + 540) % 360) - 180;
        return [lon, phi * 180 / Math.PI];
    }

    /* 环的可见段拆分：与地平圆求交，避免弦切缺口 */
    function ringRuns(ring) {
        function cross(a, b) {
            var pa = proj(a[0], a[1]);
            var pb = proj(b[0], b[1]);
            var t = pa[2] / (pa[2] - pb[2] || 1e-9);
            var q = proj(a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t);
            return [q[0], q[1]];
        }
        var runs = [];
        var cur = null;
        var prev = null;
        var firstVis = false;
        var i;
        var p;
        var q;
        var vis;
        for (i = 0; i < ring.length; i++) {
            p = ring[i];
            q = proj(p[0], p[1]);
            vis = q[2] >= 0;
            if (vis) {
                if (!cur) {
                    cur = [];
                    if (prev && !firstVis) { cur.push(cross(prev, p)); }
                    runs.push(cur);
                }
                cur.push([q[0], q[1]]);
            } else if (cur) {
                cur.push(cross(prev, p));
                cur = null;
            }
            if (i === 0) { firstVis = vis; }
            prev = p;
        }
        if (cur && !firstVis && ring.length > 1) { cur.push(cross(prev, ring[0])); }
        return runs;
    }

    function drawGlobe() {
        var ctx = globe.ctx;
        if (!ctx) { return; }
        globe.R = Math.min(globe.w, globe.h) / 2 * 0.92 * globe.zoom;
        var R = globe.R;
        var cx = globe.w / 2;
        var cy = globe.h / 2;
        var i;
        var j;

        ctx.setTransform(globe.dpr, 0, 0, globe.dpr, 0, 0);
        ctx.clearRect(0, 0, globe.w, globe.h);

        /* 球体海洋 + 大气辉光 */
        var grad = ctx.createRadialGradient(cx - R * 0.35, cy - R * 0.4, R * 0.1, cx, cy, R * 1.02);
        grad.addColorStop(0, '#e0f2fe');
        grad.addColorStop(0.7, '#bae6fd');
        grad.addColorStop(1, '#7dd3fc');
        ctx.save();
        ctx.shadowColor = 'rgba(59,130,246,.4)';
        ctx.shadowBlur = 26;
        ctx.beginPath();
        ctx.arc(cx, cy, R, 0, Math.PI * 2);
        ctx.fillStyle = grad;
        ctx.fill();
        ctx.restore();
        ctx.beginPath();
        ctx.arc(cx, cy, R, 0, Math.PI * 2);
        ctx.strokeStyle = 'rgba(30,64,175,.35)';
        ctx.lineWidth = 1.2;
        ctx.stroke();

        /* 裁剪到球面圆内 */
        ctx.save();
        ctx.beginPath();
        ctx.arc(cx, cy, R, 0, Math.PI * 2);
        ctx.clip();

        /* 经纬网（每 30° + 特殊纬线） */
        function strokePolyline(pts, color, width, dash) {
            ctx.beginPath();
            var pen = false;
            for (var k = 0; k < pts.length; k++) {
                var q = proj(pts[k][0], pts[k][1]);
                if (q[2] >= 0) {
                    if (pen) { ctx.lineTo(q[0], q[1]); } else { ctx.moveTo(q[0], q[1]); pen = true; }
                } else {
                    pen = false;
                }
            }
            ctx.strokeStyle = color;
            ctx.lineWidth = width;
            ctx.setLineDash(dash || []);
            ctx.stroke();
            ctx.setLineDash([]);
        }

        if (state.grid) {
            var lon;
            var lat;
            var pts;
            for (lon = -180; lon < 180; lon += 30) {
                pts = [];
                for (lat = -80; lat <= 80; lat += 4) { pts.push([lon, lat]); }
                strokePolyline(pts, 'rgba(255,255,255,.7)', 1);
            }
            for (lat = -60; lat <= 60; lat += 30) {
                pts = [];
                for (lon = -180; lon <= 180; lon += 4) { pts.push([lon, lat]); }
                strokePolyline(pts, 'rgba(255,255,255,.7)', 1);
            }
            pts = [];
            for (lon = -180; lon <= 180; lon += 4) { pts.push([lon, 23.5]); }
            strokePolyline(pts, 'rgba(217,119,6,.9)', 1.4, [7, 4]);
            pts = [];
            for (lon = -180; lon <= 180; lon += 4) { pts.push([lon, -23.5]); }
            strokePolyline(pts, 'rgba(217,119,6,.9)', 1.4, [7, 4]);
            pts = [];
            for (lon = -180; lon <= 180; lon += 4) { pts.push([lon, 66.5]); }
            strokePolyline(pts, 'rgba(79,70,229,.85)', 1.4, [7, 4]);
            pts = [];
            for (lon = -180; lon <= 180; lon += 4) { pts.push([lon, -66.5]); }
            strokePolyline(pts, 'rgba(79,70,229,.85)', 1.4, [7, 4]);
            pts = [];
            for (lon = -180; lon <= 180; lon += 4) { pts.push([lon, 0]); }
            strokePolyline(pts, 'rgba(190,24,93,.85)', 1.8, [9, 5]);
        }

        /* 陆地：按国家环绘制（可见段填充 + 白色国界） */
        var dimAll = current && current.type === 'continent';
        ctx.lineJoin = 'round';
        for (i = 0; i < LAND.length; i++) {
            var c = LAND[i];
            /* 视口 bbox 快速剔除（平面 bbox 与球面可见性的保守判断） */
            if (c.b[2] - c.b[0] < VW - 5) {
                var mid = [(c.b[0] + c.b[2]) / 2, (c.b[1] + c.b[3]) / 2];
                var ml = (mid[0] / VW * 360 - 180);
                var mt = (90 - mid[1] / VH * 180);
                var halfSpan = Math.max(c.b[2] - c.b[0], c.b[3] - c.b[1]) / 2 / VW * 360;
                var pm = proj(ml, mt);
                if (pm[2] < -0.35 && halfSpan < 25) { continue; }
            }
            var on = dimAll && current.key === c.c;
            var dim = dimAll && !on;
            var runs = [];
            for (j = 0; j < c.geo.length; j++) {
                runs = runs.concat(ringRuns(c.geo[j]));
            }
            if (!runs.length) { continue; }
            ctx.globalAlpha = dim ? 0.3 : (on ? 1 : 0.92);
            ctx.beginPath();
            for (j = 0; j < runs.length; j++) {
                var rr = runs[j];
                ctx.moveTo(rr[0][0], rr[0][1]);
                for (var k2 = 1; k2 < rr.length; k2++) { ctx.lineTo(rr[k2][0], rr[k2][1]); }
                ctx.closePath();
            }
            ctx.fillStyle = colorOf(c.c);
            ctx.fill('evenodd');
            ctx.strokeStyle = 'rgba(255,255,255,.85)';
            ctx.lineWidth = 0.6;
            ctx.stroke();
            ctx.globalAlpha = 1;
        }

        /* 首都标记 */
        globe.hits = [];
        if (state.caps) {
            for (i = 0; i < COUNTRIES.length; i++) {
                var co = COUNTRIES[i];
                var q2 = proj(co.lon, co.lat);
                if (q2[2] < 0.02) { continue; }
                var on2 = current && current.type === 'country' && current.key === i;
                ctx.beginPath();
                ctx.arc(q2[0], q2[1], on2 ? 6 : 4, 0, Math.PI * 2);
                ctx.fillStyle = on2 ? '#dc2626' : 'rgba(15,23,42,.75)';
                ctx.fill();
                ctx.strokeStyle = '#fff';
                ctx.lineWidth = 1.5;
                ctx.stroke();
                globe.hits.push({ x: q2[0], y: q2[1], i: i });
            }
        }

        /* 大洲名称 */
        if (state.labels) {
            ctx.font = '800 15px ' + getComputedStyle(document.body).fontFamily;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            for (i = 0; i < CONTINENTS.length; i++) {
                var ct = CONTINENTS[i];
                var q3 = proj(ct.lab[0], ct.lab[1]);
                if (q3[2] < 0.15) { continue; }
                ctx.lineWidth = 3.5;
                ctx.strokeStyle = 'rgba(15,23,42,.55)';
                ctx.strokeText(ct.n, q3[0], q3[1]);
                ctx.fillStyle = '#ffffff';
                ctx.fillText(ct.n, q3[0], q3[1]);
            }
        }

        ctx.restore();
    }

    function globeLoop(t) {
        if (state.view !== 'globe') { globe.raf = 0; return; }
        var dt = globe.lastT ? (t - globe.lastT) / 1000 : 0;
        globe.lastT = t;
        if (state.spin && !globe.dragging && dt > 0 && dt < 0.2) {
            globe.yaw = ((globe.yaw + dt * 6) % 360 + 360) % 360;
            drawGlobe();
        }
        globe.raf = requestAnimationFrame(globeLoop);
    }

    function startGlobe() {
        if (!globe.ctx) { initGlobe(); }
        resizeGlobe();
        drawGlobe();
        if (!globe.raf) { globe.lastT = 0; globe.raf = requestAnimationFrame(globeLoop); }
    }

    /* 地球仪交互：拖拽旋转 / 滚轮缩放 / 点击命中 */
    (function bindGlobe() {
        var cv = els.globe;

        cv.addEventListener('pointerdown', function (e) {
            globe.dragging = true;
            globe.moved = 0;
            globe.lastX = e.clientX;
            globe.lastY = e.clientY;
            try { cv.setPointerCapture(e.pointerId); } catch (err) { /* 忽略 */ }
        });

        cv.addEventListener('pointermove', function (e) {
            if (!globe.dragging) { return; }
            var dx = e.clientX - globe.lastX;
            var dy = e.clientY - globe.lastY;
            globe.lastX = e.clientX;
            globe.lastY = e.clientY;
            globe.moved += Math.abs(dx) + Math.abs(dy);
            var k = 180 / Math.PI / globe.R * 0.9;
            globe.yaw = ((globe.yaw + dx * k) % 360 + 360) % 360;
            globe.pitch = Math.max(-85, Math.min(85, globe.pitch + dy * k));
            drawGlobe();
        });

        function endDrag(e) {
            if (!globe.dragging) { return; }
            globe.dragging = false;
            if (globe.moved < 6) { globeClick(e); }
        }
        cv.addEventListener('pointerup', endDrag);
        cv.addEventListener('pointercancel', function () { globe.dragging = false; });

        cv.addEventListener('wheel', function (e) {
            e.preventDefault();
            globe.zoom = Math.max(0.6, Math.min(4, globe.zoom * (e.deltaY < 0 ? 1.12 : 0.89)));
            drawGlobe();
        }, { passive: false });

        window.addEventListener('resize', function () {
            if (state.view !== 'globe') { return; }
            resizeGlobe();
            drawGlobe();
        });
    })();

    function globeClick(e) {
        var rect = els.globe.getBoundingClientRect();
        var px = e.clientX - rect.left;
        var py = e.clientY - rect.top;
        /* 先看首都圆点 */
        var best = -1;
        var bestD = 12;
        for (var i = 0; i < globe.hits.length; i++) {
            var d = Math.hypot(globe.hits[i].x - px, globe.hits[i].y - py);
            if (d < bestD) { bestD = d; best = globe.hits[i].i; }
        }
        if (best >= 0) {
            focusCountry(best);
            return;
        }
        /* 再按经纬度做点在内判定 */
        var ll = unproj(px, py);
        if (!ll) { return; }
        for (var k = 0; k < LAND.length; k++) {
            if (pointInLand(ll[0], ll[1], LAND[k])) {
                focusContinent(LAND[k].c);
                return;
            }
        }
    }

    function pointInLand(lon, lat, c) {
        for (var r = 0; r < c.geo.length; r++) {
            var ring = c.geo[r];
            var inside = false;
            for (var i = 0, j2 = ring.length - 1; i < ring.length; j2 = i++) {
                var xi = ring[i][0];
                var yi = ring[i][1];
                var xj = ring[j2][0];
                var yj = ring[j2][1];
                if (((yi > lat) !== (yj > lat)) &&
                    (lon < (xj - xi) * (lat - yi) / (yj - yi) + xi)) {
                    inside = !inside;
                }
            }
            if (inside) { return true; }
        }
        return false;
    }

    /* ---------- 视图切换 ---------- */

    function setView(v) {
        state.view = v;
        store.set('view', v);
        els.modeFlat.classList.toggle('is-on', v === 'flat');
        els.modeGlobe.classList.toggle('is-on', v === 'globe');
        els.btnSpin.hidden = v !== 'globe';
        /* SVGElement 没有 hidden IDL 属性，必须用 attribute */
        if (v === 'globe') { els.svg.setAttribute('hidden', ''); } else { els.svg.removeAttribute('hidden'); }
        if (v === 'globe') { els.globe.removeAttribute('hidden'); } else { els.globe.setAttribute('hidden', ''); }
        if (v === 'globe') {
            startGlobe();
        } else if (globe.raf) {
            cancelAnimationFrame(globe.raf);
            globe.raf = 0;
            render();
        } else {
            render();
        }
    }

    /* ---------- 面板 ---------- */

    function renderKey() {
        els.key.innerHTML = '';
        CONTINENTS.forEach(function (ct) {
            var sp = document.createElement('span');
            sp.innerHTML = '<i style="background:' + ct.color + '"></i>' + ct.n;
            els.key.appendChild(sp);
        });
    }

    function renderPanel() {
        var html = '';
        els.panel.style.removeProperty('--mw-color');

        if (current && current.type === 'continent') {
            var ct = byKey(current.key);
            if (ct) {
                els.panel.style.setProperty('--mw-color', ct.color);
                html += '<div class="mw-title"><h2>' + ct.n + '</h2><span>大洲</span></div>';
                html += '<div class="mw-grid2">' +
                    cell('面积', ct.area + ' 万平方千米') +
                    cell('人口', ct.pop) +
                    cell('最高峰', ct.top) +
                    cell('半球位置', hemisOf(ct)) +
                    '</div>';
                html += '<p class="mw-tip">' + ct.alt + '</p>';
                html += '<p class="mw-tip">' + ct.tip + '</p>';

                var list = countriesOf(ct.k);
                if (list.length) {
                    html += '<div class="mw-sec">该洲主要国家（点击查看）</div><div class="mw-list">';
                    list.forEach(function (c) {
                        html += '<button class="mw-item" data-cn="' + c.i + '" type="button">' + c.n + '</button>';
                    });
                    html += '</div>';
                }
            }
        } else if (current && current.type === 'country') {
            var c = COUNTRIES[current.key];
            if (c) {
                var ct2 = byKey(c.ct);
                els.panel.style.setProperty('--mw-color', ct2 ? ct2.color : '#0369a1');
                html += '<div class="mw-title"><h2>' + c.n + '</h2><span>' + (ct2 ? ct2.n : '') + '</span></div>';
                html += '<div class="mw-grid2">' +
                    cell('首都', c.c) +
                    cell('所在大洲', ct2 ? ct2.n : '—') +
                    cell('纬度', latText(c.lat)) +
                    cell('经度', lonText(c.lon)) +
                    '</div>';
                html += '<p class="mw-tip">' + c.tip + '</p>';
            }
        } else {
            html += '<div class="mw-sec">世界概况</div>';
            html += '<p class="mw-tip">地球表面海洋约占 <b>71%</b>、陆地约占 <b>29%</b>；' +
                '陆地分为七大洲，海洋分为四大洋。</p>';
            html += '<div class="mw-sec">七大洲（点击查看）</div><div class="mw-list">';
            CONTINENTS.forEach(function (ct) {
                html += '<button class="mw-item" data-ct="' + ct.k + '" type="button">' + ct.n + '</button>';
            });
            html += '</div>';
            html += '<div class="mw-sec">四大洋</div>';
            html += '<p class="mw-tip">太平洋（约 1.8 亿 km²，最大最深）· 大西洋（约 9337 万 km²）· ' +
                '印度洋（约 7492 万 km²）· 北冰洋（约 1310 万 km²，最小最浅）</p>';
        }

        if (current) {
            html += '<button class="mw-item" id="btnBack" type="button" style="margin-top:14px">返回世界概况</button>';
        }

        els.panel.innerHTML = html;
        bindPanel();
    }

    function bindPanel() {
        var back = document.getElementById('btnBack');
        if (back) {
            back.addEventListener('click', function () {
                current = null;
                state.sel = null;
                store.set('sel', null);
                render();
                renderPanel();
            });
        }
        var list = els.panel.querySelectorAll('[data-ct]');
        for (var i = 0; i < list.length; i++) {
            list[i].addEventListener('click', function () {
                focusContinent(this.getAttribute('data-ct'));
            });
        }
        var list2 = els.panel.querySelectorAll('[data-cn]');
        for (var k = 0; k < list2.length; k++) {
            list2[k].addEventListener('click', function () {
                focusCountry(parseInt(this.getAttribute('data-cn'), 10));
            });
        }
    }

    function cell(label, value) {
        return '<div class="mw-cell"><b>' + label + '</b><span>' + value + '</span></div>';
    }

    function byKey(k) {
        for (var i = 0; i < CONTINENTS.length; i++) {
            if (CONTINENTS[i].k === k) { return CONTINENTS[i]; }
        }
        return null;
    }

    function countriesOf(k) {
        var out = [];
        COUNTRIES.forEach(function (c, i) {
            if (c.ct === k) { out.push({ i: i, n: c.n }); }
        });
        return out;
    }

    function latText(v) {
        if (Math.abs(v) < 0.05) { return '0°（赤道）'; }
        return (v > 0 ? '北纬 ' : '南纬 ') + Math.abs(v).toFixed(1) + '°';
    }

    function lonText(v) {
        if (Math.abs(v) < 0.05) { return '0°（本初子午线）'; }
        return (v > 0 ? '东经 ' : '西经 ') + Math.abs(v).toFixed(1) + '°';
    }

    function hemisOf(ct) {
        return ct.hemi || '—';
    }

    /* ---------- 选中 ---------- */

    function focusContinent(k) {
        current = { type: 'continent', key: k };
        state.sel = k;
        store.set('sel', k);
        render();
        renderPanel();
        var ct = byKey(k);
        if (ct) { chrome.setStatus(ct.n + ' · ' + ct.area + ' 万 km²', 'ok'); }
        try { chrome.beep('tick'); } catch (e) { /* 静默 */ }
    }

    function focusCountry(i) {
        current = { type: 'country', key: i };
        state.sel = i;
        store.set('sel', i);
        render();
        renderPanel();
        chrome.setStatus(COUNTRIES[i].n + ' · 首都 ' + COUNTRIES[i].c, 'ok');
        try { chrome.beep('tick'); } catch (e) { /* 静默 */ }
    }

    function cycleContinent() {
        var idx = 0;
        if (current && current.type === 'continent') {
            for (var i = 0; i < CONTINENTS.length; i++) {
                if (CONTINENTS[i].k === current.key) { idx = i + 1; }
            }
        }
        focusContinent(CONTINENTS[idx % CONTINENTS.length].k);
    }

    els.svg.addEventListener('click', function (e) {
        var t = e.target;
        var ct = t.getAttribute && t.getAttribute('data-ct');
        var cn = t.getAttribute && t.getAttribute('data-cn');
        if (cn !== null && cn !== undefined && cn !== '') {
            focusCountry(parseInt(cn, 10));
        } else if (ct) {
            focusContinent(ct);
        }
    });

    /* ---------- 开关 ---------- */

    function toggle(which) {
        state[which] = !state[which];
        store.set(which, state[which]);
        els.btnGrid.classList.toggle('is-on', state.grid);
        els.btnCap.classList.toggle('is-on', state.caps);
        els.btnLabel.classList.toggle('is-on', state.labels);
        render();
    }

    els.btnGrid.addEventListener('click', function () { toggle('grid'); });
    els.btnCap.addEventListener('click', function () { toggle('caps'); });
    els.btnLabel.addEventListener('click', function () { toggle('labels'); });
    els.btnSpin.addEventListener('click', function () {
        state.spin = !state.spin;
        store.set('spin', state.spin);
        els.btnSpin.classList.toggle('is-on', state.spin);
    });
    els.modeFlat.addEventListener('click', function () { setView('flat'); });
    els.modeGlobe.addEventListener('click', function () { setView('globe'); });

    function isTypingTarget(node) {
        if (!node || !node.tagName) { return false; }
        var tag = node.tagName.toUpperCase();
        return tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT' || node.isContentEditable === true;
    }

    document.addEventListener('keydown', function (e) {
        if (isTypingTarget(e.target) || document.querySelector('.et-modal, .et-drawer-backdrop')) { return; }
        if (e.code === 'Space') {
            e.preventDefault();
            cycleContinent();
        } else if (e.key === 'Escape') {
            current = null;
            state.sel = null;
            render();
            renderPanel();
        }
    });

    /* ---------- 启动 ---------- */

    renderKey();
    els.btnGrid.classList.toggle('is-on', state.grid);
    els.btnCap.classList.toggle('is-on', state.caps);
    els.btnLabel.classList.toggle('is-on', state.labels);
    els.btnSpin.classList.toggle('is-on', state.spin);

    if (state.sel && byKey(state.sel)) {
        current = { type: 'continent', key: state.sel };
    }
    setView(state.view);
    renderPanel();
})();
</script>

</body>
</html>
