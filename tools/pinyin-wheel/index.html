/* ============ 设计令牌 ============ */

/* ============ 基础 ============ */

/* body 作为外壳时必须清掉浏览器默认 8px 外边距，
   否则 iframe 预览中文档会比视口高 16px（底部白边 + 多余滚动） */
body.et-app {
    margin: 0;
}

.et-app {
    position: relative;
    isolation: isolate;
    display: flex;
    flex-direction: column;
    height: 100vh;
    height: 100dvh;
    overflow: hidden;
    background: var(--et-bg);

/* 极光背景：径向渐变 + 呼吸动画（edupick 品质基线，老内核也不掉帧） */

    inset: 0;
    z-index: -1;

        radial-gradient(42% 38% at 82% 24%, var(--et-accent-weak), transparent 70%),
        radial-gradient(50% 44% at 55% 95%, rgba(16, 185, 129, .10), transparent 65%);
    animation: et-aurora 16s ease-in-out infinite alternate;

@keyframes et-aurora {
    from { opacity: .55; transform: scale(1); }

.et-app *::before,
.et-app *::after { box-sizing: border-box; }

[hidden] { display: none !important; }

.et-icon {

    stroke-linecap: round;
    stroke-linejoin: round;

}

/* ============ 顶栏 ============ */
.et-topbar {
    flex: none;

    align-items: center;
    gap: 14px;
    padding: 11px 20px;
    border-bottom: 1px solid var(--et-line);

.et-brand__dot {

}

.et-status__dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;

    transition: background .2s;
}

.et-status[data-tone="err"] .et-status__dot { background: var(--et-err); }
.et-status[data-tone="warn"] .et-status__dot { background: var(--et-warn); }

.et-actions {
    display: flex;
    align-items: center;
    gap: 7px;
}

.et-icon-btn {
    display: inline-grid;
    place-items: center;
    width: 38px;
    height: 38px;
    font-size: 16px;
    line-height: 1;
    border-radius: 11px;
    border: 1px solid var(--et-line);
    background: var(--et-surface-2);
    color: var(--et-fg);
    cursor: pointer;
    transition: transform .14s, border-color .14s, color .14s, opacity .14s;
    -webkit-tap-highlight-color: transparent;
}

.et-icon-btn:hover {
    border-color: var(--et-accent);
    color: var(--et-accent);
    transform: translateY(-1px);
}

.et-icon-btn:active { transform: translateY(0); }
.et-icon-btn.is-off { opacity: .4; }
.et-icon-btn:focus-visible { outline: 2px solid var(--et-accent); outline-offset: 2px; }

    position: relative;
    overflow: auto;
}

/* ============ 页脚（品牌回流 L2） ============ */
.et-footer {
    flex: none;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 7px 16px;
    font-size: 12px;

    border-top: 1px solid var(--et-line);

}

/* ============ 按钮 ============ */

    font-size: 13.5px;
    font-weight: 700;
    border: 1px solid var(--et-line);
    background: var(--et-surface-2);
    color: var(--et-fg);
    cursor: pointer;
    transition: transform .14s, border-color .14s, color .14s, background .14s, box-shadow .14s;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
}

.et-btn:hover {
    border-color: var(--et-accent);
    color: var(--et-accent);
    transform: translateY(-1px);
}

.et-btn:active { transform: translateY(0); }
.et-btn:focus-visible { outline: 2px solid var(--et-accent); outline-offset: 2px; }
.et-btn:disabled { opacity: .45; cursor: not-allowed; transform: none; }

.et-btn--primary {
    background: var(--et-accent);
    border-color: var(--et-accent);
    color: #fff;
    box-shadow: 0 6px 18px -8px var(--et-accent);
}

.et-btn--primary:hover { color: #fff; filter: brightness(1.08); }
.et-btn--primary:disabled { filter: none; }

.et-btn--danger:hover {
    border-color: var(--et-err);
    color: var(--et-err);
}

.et-btn--lg {
    padding: 13px 26px;
    font-size: 16px;
    border-radius: 14px;
}

/* ============ 弹窗 ============ */
.et-modal {
    position: fixed;
    inset: 0;
    z-index: 100;
    display: grid;
    place-items: center;
    padding: 24px;
    background: rgba(2, 6, 23, .55);
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    animation: et-fade .18s ease;
}

.et-modal__panel {
    width: min(680px, 94vw);
    max-height: 86vh;
    max-height: 86dvh;

    background: var(--et-surface);

    animation: et-pop .2s cubic-bezier(.34, 1.4, .64, 1);
    overflow: hidden;
}

.et-modal__panel--narrow { width: min(460px, 92vw); }
.et-modal__panel--wide { width: min(900px, 94vw); }

.et-modal__head {
    flex: none;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 16px 20px;
    border-bottom: 1px solid var(--et-line);
    font-weight: 800;
    font-size: 15px;
}

.et-modal__head .et-icon-btn {
    margin-left: auto;
    width: 32px;
    height: 32px;
}

.et-modal__body {
    flex: 1;
    min-height: 0;
    overflow: auto;
    padding: 18px 20px;
}

.et-modal__foot {
    flex: none;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 14px 20px;
    border-top: 1px solid var(--et-line);
    background: var(--et-surface-2);
}

.et-modal__foot .spacer { flex: 1; }

@keyframes et-fade {
    from { opacity: 0; }
}

@keyframes et-pop {
    from { opacity: 0; transform: translateY(14px) scale(.97); }
}

/* ============ 轻提示（toast） ============ */
.et-toast {
    position: fixed;
    left: 50%;
    bottom: 56px;
    transform: translateX(-50%) translateY(10px);
    z-index: 120;
    display: flex;
    align-items: center;
    gap: 9px;
    max-width: min(520px, 88vw);
    padding: 11px 18px;
    border-radius: 12px;
    font-size: 13.5px;

    background: rgba(15, 23, 42, .92);
    border: 1px solid rgba(148, 163, 184, .25);
    box-shadow: var(--et-shadow-lg);
    opacity: 0;
    pointer-events: none;
    transition: opacity .22s, transform .22s;
}

.et-toast.is-show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
}

.et-toast[data-tone="ok"] { background: rgba(5, 150, 105, .95); }
.et-toast[data-tone="err"] { background: rgba(220, 38, 38, .95); }
.et-toast[data-tone="warn"] { background: rgba(217, 119, 6, .95); }

/* ============ 设置抽屉（右上角入口，edupick 交互） ============ */
.et-drawer-backdrop {
    position: fixed;
    inset: 0;
    z-index: 90;
    background: rgba(2, 6, 23, .45);
    backdrop-filter: blur(3px);
    -webkit-backdrop-filter: blur(3px);
    opacity: 0;
    transition: opacity .2s;
}

.et-drawer-backdrop.is-open { opacity: 1; }

.et-drawer {
    position: absolute;
    top: 0;
    right: 0;
    height: 100%;
    width: min(400px, 92vw);
    display: flex;
    flex-direction: column;
    background: var(--et-surface);
    border-left: 1px solid var(--et-line);
    box-shadow: var(--et-shadow-lg);

.et-drawer-backdrop.is-open .et-drawer { transform: translateX(0); }

.et-drawer__head {

    padding: 15px 18px;

.et-drawer__body {

.et-drawer__tip {

}

.et-drawer__switch input {
    width: 17px;
    height: 17px;
    accent-color: var(--et-accent);
    cursor: pointer;
}
</style>

        function onKey(ev) {
            if (ev.key === 'Escape') { ev.stopPropagation(); close(); }

        document.addEventListener('keydown', onKey);

        return { panel: panel, body: body, foot: foot, close: close };

    var toastEl = null;
    var toastTimer = 0;

    function toast(msg, tone) {
        if (!toastEl) {
            toastEl = el('div', 'et-toast');
            document.body.appendChild(toastEl);
        }
        toastEl.textContent = msg;
        toastEl.setAttribute('data-tone', tone || '');
        void toastEl.offsetWidth;
        toastEl.classList.add('is-show');

        toastTimer = setTimeout(function () { toastEl.classList.remove('is-show'); }, 2200);

    function installPwa(toolId, title, accent) {

            if (!theme) {
                theme = document.createElement('meta');
                theme.setAttribute('name', 'theme-color');
                document.head.appendChild(theme);
            }
            theme.setAttribute('content', accent || '#2563eb');

            var svg = '<svg xmlns="' + NS_SVG + '" viewBox="0 0 64 64">' +
                '<rect width="64" height="64" rx="14" fill="' + (accent || '#2563eb') + '"/>' +
                '<text x="32" y="43" font-size="32" font-weight="800" font-family="sans-serif" ' +
                'fill="#fff" text-anchor="middle">' + (title || '课').charAt(0) + '</text></svg>';
            var iconUri = 'data:image/svg+xml,' + encodeURIComponent(svg);

            var mf = {
                name: title || 'KeeTools 课工具',
                short_name: title || '课工具',
                start_url: '.',
                display: 'standalone',
                background_color: '#f4f6fb',
                theme_color: accent || '#2563eb',
                icons: [{ src: iconUri, sizes: 'any', type: 'image/svg+xml', purpose: 'any' }]
            };
            var blob = new Blob([JSON.stringify(mf)], { type: 'application/manifest+json' });
            var link = document.createElement('link');
            link.rel = 'manifest';
            link.href = URL.createObjectURL(blob);

    function mount(options) {

        installPwa(toolId, opt.title, opt.accent);

        /* ---------- 主题 ---------- */

            if (themeBtn) {

                themeBtn.appendChild(makeIcon(t === 'dark' ? 'i-sun' : 'i-moon'));
                themeBtn.title = t === 'dark' ? '切换到浅色' : '切换到深色';
            }

        if (!main) { main = el('main'); main.id = 'et-main'; topbar.after(main); }
        if (!footer) { footer = el('footer'); footer.id = 'et-footer'; document.body.appendChild(footer); }

        main.classList.add('et-main');
        footer.className = 'et-footer';

        var brand = el('div', 'et-brand');
        brand.appendChild(el('span', 'et-brand__dot'));
        var nameWrap = el('div');
        nameWrap.style.cssText = 'min-width:0;line-height:1.25';
        nameWrap.appendChild(el('div', 'et-brand__name', opt.title || '课工具'));
        if (opt.sub) { nameWrap.appendChild(el('div', 'et-brand__sub', opt.sub)); }
        brand.appendChild(nameWrap);

        statusPill.hidden = true;
        statusPill.appendChild(el('span', 'et-status__dot'));
        var statusText = el('span', null, '');
        statusPill.appendChild(statusText);
        topbar.appendChild(statusPill);

        api.setStatus = function (text, tone) {
            if (!text) { statusPill.hidden = true; return; }
            statusText.textContent = text;
            statusPill.setAttribute('data-tone', tone || 'ok');

            settingsBtn = makeBtn('i-sliders', opt.settings.title || '设置', function () {

                    return opt.settings.build(body, { api: api, close: drawerApi.close });

            fsBtn.appendChild(makeIcon(on ? 'i-minimize' : 'i-maximize'));
            fsBtn.title = on ? '退出全屏' : '全屏';
        }

        document.addEventListener('fullscreenchange', function () {
            syncFsIcon(!!(document.fullscreenElement || document.webkitFullscreenElement));
        });
        document.addEventListener('webkitfullscreenchange', function () {
            syncFsIcon(!!(document.fullscreenElement || document.webkitFullscreenElement));
        });
        syncFsIcon(false);

        api.toggleFullscreen = toggleFullscreen;

        /* ---------- 音效 API ---------- */
        api.beep = function (kind) {
            if (!soundEnabled) { return; }
            playBeep(kind);
        };
        api.soundOn = function () { return soundEnabled; };

        api.modal = modal;

        /* ---------- 帮助 ---------- */
        function openHelp() {
            modal({
                title: '使用说明',
                icon: 'i-help',
                size: 'narrow',
                body: opt.help,
                buttons: [{ label: '知道了', primary: true }]
            });
        }
        api.openHelp = openHelp;

        /* ---------- toast ---------- */
        api.toast = toast;

        /* ---------- 页脚（L2 品牌回流，低调一行） ---------- */
        var siteOrigin = typeof global.ET_SITE_ORIGIN === 'string' && /^https?:\/\//.test(global.ET_SITE_ORIGIN)
            ? global.ET_SITE_ORIGIN
            : null;

        function renderFooter() {
            footer.textContent = '';
            footer.appendChild(el('span', null, 'KeeTools 课工具'));
            footer.appendChild(el('span', null, '·'));
            if (siteOrigin) {
                var a = el('a', null, '更多课堂工具');
                a.href = siteOrigin + '/?from=tool-footer&tool=' + encodeURIComponent(toolId);
                a.target = '_blank';
                a.rel = 'noopener';

                footer.appendChild(el('span', null, '更多课堂工具'));
            }

        try {
            if (global.parent && global.parent !== global) {

            }
        } catch (err) { /* 跨域异常忽略 */ }

    function toneVowelIndex(s) {
        var i = s.indexOf('a');

        if (i >= 0) { return i; }

        var uu = s.indexOf('u');
        var vv = s.indexOf('ü');
        if (ii >= 0) { cands.push(ii); }
        if (uu >= 0) { cands.push(uu); }

        return syll.slice(0, i) + repl + syll.slice(i + 1);
    }

            ' A ' + r2 + ' ' + r2 + ' 0 ' + large + ' 1 ' + p2[0].toFixed(2) + ' ' + p2[1].toFixed(2) +
            ' L ' + p3[0].toFixed(2) + ' ' + p3[1].toFixed(2) +

                gRot.appendChild(path);

                var label = svgEl('text', 'pw-lab');

                label.setAttribute('y', lp[1].toFixed(2));

                label.setAttribute('dominant-baseline', 'middle');
                label.setAttribute('font-size', fontSize);
                label.setAttribute('data-ring', ring);
                label.setAttribute('data-idx', idx);
                label.textContent = items[idx];
                gRot.appendChild(label);

        }

        if (!ch) {
            /* j/q/x/y 后 ü 规范写作 u（xué），键做归一化回退 */
            var ini = INITIALS[state.i];
            if ((ini === 'j' || ini === 'q' || ini === 'x' || ini === 'y') && key.indexOf('ü') >= 0) {
                ch = PW_READ[key.replace(/ü/g, 'u')] || '';
            }
        }
        if (!ch) {
            if (manual) { chrome.toast('「' + key + '」不是规范音节，读不了', 'warn'); }
            return;
        }
        try {
            window.speechSynthesis.cancel();
            var u = new window.SpeechSynthesisUtterance(ch);
            u.lang = 'zh-CN';
            u.rate = 0.6;
            u.pitch = 1.1;
            window.speechSynthesis.speak(u);
        } catch (e) { /* 静默 */ }
    }

    /* ---------- 转盘动作 ---------- */

    function randomBoth() {
        var ri = Math.floor(Math.random() * INITIALS.length);
        var rf = Math.floor(Math.random() * FINALS.length);
        state.i = ri;
        state.f = rf;
        rotateTo(gRotI, 'i', ri, 3);
        rotateTo(gRotF, 'f', rf, 3);
        syncLabels();
        try { chrome.beep('ok'); } catch (e) { /* 静默 */ }
        window.setTimeout(function () {
            if (state.speaking) { speak(); }
        }, 1700);
    }

    function spinOne(which) {
        var n = which === 'i' ? INITIALS.length : FINALS.length;
        var idx = Math.floor(Math.random() * n);
        if (which === 'i') { state.i = idx; rotateTo(gRotI, 'i', idx, 3); }
        else { state.f = idx; rotateTo(gRotF, 'f', idx, 3); }
        syncLabels();
        try { chrome.beep('tick'); } catch (e) { /* 静默 */ }
    }

    function onSectorClick(ev) {
        var t = ev.target;
        if (!t || !t.getAttribute || !t.getAttribute('data-ring')) { return; }
        var ring = t.getAttribute('data-ring');
        var idx = parseInt(t.getAttribute('data-idx'), 10);
        if (isNaN(idx)) { return; }
        if (ring === 'i') { state.i = idx; rotateTo(gRotI, 'i', idx, 1); }
        else { state.f = idx; rotateTo(gRotF, 'f', idx, 1); }
        syncLabels();
        try { chrome.beep('tick'); } catch (e) { /* 静默 */ }
    }

    /* ---------- 声调条 ---------- */

    function buildTones() {
        for (var i = 0; i < TONES.length; i++) {
            (function (t) {
                var b = document.createElement('button');
                b.type = 'button';
                b.className = 'pw-tone' + (t.v === state.tone ? ' is-on' : '');
                b.textContent = t.label;
                b.addEventListener('click', function () {
                    state.tone = t.v;
                    var btns = els.tones.children;
                    for (var k = 0; k < btns.length; k++) {
                        btns[k].className = 'pw-tone';
                    }
                    b.className = 'pw-tone is-on';
                    updateSyllable();
                });
                els.tones.appendChild(b);
            })(TONES[i]);
        }
    }

    /* ---------- 事件与启动 ---------- */

    els.box.addEventListener('click', onSectorClick);
    els.random.addEventListener('click', randomBoth);
    els.spinI.addEventListener('click', function () { spinOne('i'); });
    els.spinF.addEventListener('click', function () { spinOne('f'); });
    els.speak.addEventListener('click', function () { speak(true); });
    if (!ttsOk) {
        els.speak.disabled = true;
        els.speak.title = '当前浏览器不支持语音朗读';
    }

    document.addEventListener('keydown', function (e) {
        if (isTypingTarget(e.target)) { return; }
        if (e.code === 'Space') {
            e.preventDefault();
            randomBoth();
        } else if (e.key === 'ArrowLeft') { spinOne('i'); e.preventDefault(); }
        else if (e.key === 'ArrowRight') { spinOne('f'); e.preventDefault(); }
        else if (e.key >= '1' && e.key <= '4') { setToneByKey(parseInt(e.key, 10)); }
        else if (e.key === '0') { setToneByKey(0); }
        else if (e.key.toLowerCase() === 's') { speak(true); }
    });

    function setToneByKey(v) {
        var btns = els.tones.children;
        for (var i = 0; i < TONES.length; i++) {
            if (TONES[i].v === v && btns[i]) { btns[i].click(); return; }
        }
    }

    function isTypingTarget(node) {
        if (!node || !node.tagName) { return false; }
        var tag = node.tagName.toUpperCase();
        return tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT' || node.isContentEditable === true;
    }

    buildTones();
    render();
})();
</script>

</body>
</html>
