/*!

/* ============ 设计令牌 ============ */
:root {
    --et-accent: #2563eb;
    --et-accent-weak: rgba(37, 99, 235, .14);
    --et-bg: #f4f6fb;
    --et-surface: #ffffff;
    --et-surface-2: #f8fafc;
    --et-fg: #0b1220;
    --et-muted: #64748b;
    --et-line: rgba(15, 23, 42, .12);
    --et-line-strong: rgba(15, 23, 42, .22);
    --et-glass: rgba(255, 255, 255, .85);
    --et-shadow-md: 0 10px 28px -18px rgba(15, 23, 42, .3);
    --et-shadow-lg: 0 24px 60px -32px rgba(15, 23, 42, .4);
    --et-ok: #059669;
    --et-warn: #d97706;
    --et-err: #dc2626;
    --et-radius: 12px;
    --et-radius-sm: 9px;
    --et-font: -apple-system, BlinkMacSystemFont, "Segoe UI",
               "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei",
               "Noto Sans SC", sans-serif;
    --et-mono: ui-monospace, "Cascadia Mono", Consolas, Menlo, monospace;
}

html[data-et-theme="dark"] {
    --et-bg: #0b1120;
    --et-surface: #111a2e;
    --et-surface-2: #0f1729;
    --et-fg: #f1f5f9;
    --et-muted: #94a3b8;
    --et-line: rgba(148, 163, 184, .18);
    --et-line-strong: rgba(148, 163, 184, .3);
    --et-glass: rgba(17, 26, 46, .85);
    --et-shadow-md: 0 10px 34px -18px rgba(0, 0, 0, .8);
    --et-shadow-lg: 0 24px 70px -30px rgba(0, 0, 0, .9);
    --et-ok: #34d399;
    --et-warn: #fbbf24;
    --et-err: #f87171;
}

/* ============ 基础 ============ */

/* body 作为外壳时必须清掉浏览器默认 8px 外边距，
   否则 iframe 预览中文档会比视口高 16px（底部白边 + 多余滚动） */
body.et-app {
    margin: 0;
}

.et-app {
    position: relative;
    isolation: isolate;
    display: flex;
    flex-direction: column;
    height: 100vh;
    height: 100dvh;
    overflow: hidden;
    background: var(--et-bg);
    color: var(--et-fg);
    font-family: var(--et-font);
    -webkit-font-smoothing: antialiased;
    transition: background .25s, color .25s;
}

/* 极光背景：径向渐变 + 呼吸动画（edupick 品质基线，老内核也不掉帧） */
.et-app::before {
    content: '';
    position: fixed;
    inset: 0;
    z-index: -1;
    pointer-events: none;
    background:
        radial-gradient(46% 40% at 20% 18%, var(--et-accent-weak), transparent 65%),
        radial-gradient(42% 38% at 82% 24%, var(--et-accent-weak), transparent 70%),
        radial-gradient(50% 44% at 55% 95%, rgba(16, 185, 129, .10), transparent 65%);
    animation: et-aurora 16s ease-in-out infinite alternate;
}

@keyframes et-aurora {
    from { opacity: .55; transform: scale(1); }
    to { opacity: 1; transform: scale(1.06); }
}

.et-app *,
.et-app *::before,
.et-app *::after { box-sizing: border-box; }

[hidden] { display: none !important; }

.et-icon {
    width: 18px;
    height: 18px;
    fill: none;
    stroke: currentColor;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
    flex: none;
}

/* ============ 顶栏 ============ */
.et-topbar {
    flex: none;
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 11px 20px;
    border-bottom: 1px solid var(--et-line);
    background: var(--et-glass);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    z-index: 20;
}

.et-brand {
    display: flex;
    align-items: center;
    gap: 10px;
    min-width: 0;
}

.et-brand__dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: var(--et-accent);
    box-shadow: 0 0 0 4px var(--et-accent-weak);
    flex: none;
}

.et-brand__name {
    font-weight: 800;
    font-size: 15px;
    letter-spacing: -.01em;
    white-space: nowrap;
}

.et-brand__sub {
    font-size: 12.5px;
    color: var(--et-muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.et-status {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 5px 14px;
    border-radius: 999px;
    font-size: 12.5px;
    color: var(--et-muted);
    background: var(--et-surface-2);
    border: 1px solid var(--et-line);
    white-space: nowrap;
    max-width: 42vw;
    overflow: hidden;
    text-overflow: ellipsis;
}

.et-status__dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--et-ok);
    flex: none;
    transition: background .2s;
}

.et-status[data-tone="err"] .et-status__dot { background: var(--et-err); }
.et-status[data-tone="warn"] .et-status__dot { background: var(--et-warn); }

.et-actions {
    display: flex;
    align-items: center;
    gap: 7px;
}

.et-icon-btn {
    display: inline-grid;
    place-items: center;
    width: 38px;
    height: 38px;
    font-size: 16px;
    line-height: 1;
    border-radius: 11px;
    border: 1px solid var(--et-line);
    background: var(--et-surface-2);
    color: var(--et-fg);
    cursor: pointer;
    transition: transform .14s, border-color .14s, color .14s, opacity .14s;
    -webkit-tap-highlight-color: transparent;
}

.et-icon-btn:hover {
    border-color: var(--et-accent);
    color: var(--et-accent);
    transform: translateY(-1px);
}

.et-icon-btn:active { transform: translateY(0); }
.et-icon-btn.is-off { opacity: .4; }
.et-icon-btn:focus-visible { outline: 2px solid var(--et-accent); outline-offset: 2px; }

/* ============ 主区默认 ============ */
.et-main {
    flex: 1;
    min-height: 0;
    position: relative;
    overflow: auto;
}

/* ============ 页脚（品牌回流 L2） ============ */
.et-footer {
    flex: none;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 7px 16px;
    font-size: 12px;
    color: var(--et-muted);
    border-top: 1px solid var(--et-line);
    background: var(--et-glass);
    user-select: none;
    z-index: 20;
}

.et-footer a {
    color: inherit;
    text-decoration: none;
    transition: color .14s;
}

.et-footer a:hover { color: var(--et-accent); }

/* ============ 按钮 ============ */
.et-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
    padding: 9px 16px;
    border-radius: 11px;
    font: inherit;
    font-size: 13.5px;
    font-weight: 700;
    border: 1px solid var(--et-line);
    background: var(--et-surface-2);
    color: var(--et-fg);
    cursor: pointer;
    transition: transform .14s, border-color .14s, color .14s, background .14s, box-shadow .14s;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
}

.et-btn:hover {
    border-color: var(--et-accent);
    color: var(--et-accent);
    transform: translateY(-1px);
}

.et-btn:active { transform: translateY(0); }
.et-btn:focus-visible { outline: 2px solid var(--et-accent); outline-offset: 2px; }
.et-btn:disabled { opacity: .45; cursor: not-allowed; transform: none; }

.et-btn--primary {
    background: var(--et-accent);
    border-color: var(--et-accent);
    color: #fff;
    box-shadow: 0 6px 18px -8px var(--et-accent);
}

.et-btn--primary:hover { color: #fff; filter: brightness(1.08); }
.et-btn--primary:disabled { filter: none; }

.et-btn--danger:hover {
    border-color: var(--et-err);
    color: var(--et-err);
}

.et-btn--lg {
    padding: 13px 26px;
    font-size: 16px;
    border-radius: 14px;
}

/* ============ 弹窗 ============ */
.et-modal {
    position: fixed;
    inset: 0;
    z-index: 100;
    display: grid;
    place-items: center;
    padding: 24px;
    background: rgba(2, 6, 23, .55);
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    animation: et-fade .18s ease;
}

.et-modal__panel {
    width: min(680px, 94vw);
    max-height: 86vh;
    max-height: 86dvh;
    display: flex;
    flex-direction: column;
    background: var(--et-surface);
    border: 1px solid var(--et-line);
    border-radius: 16px;
    box-shadow: var(--et-shadow-lg);
    animation: et-pop .2s cubic-bezier(.34, 1.4, .64, 1);
    overflow: hidden;
}

.et-modal__panel--narrow { width: min(460px, 92vw); }
.et-modal__panel--wide { width: min(900px, 94vw); }

.et-modal__head {
    flex: none;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 16px 20px;
    border-bottom: 1px solid var(--et-line);
    font-weight: 800;
    font-size: 15px;
}

.et-modal__head .et-icon-btn {
    margin-left: auto;
    width: 32px;
    height: 32px;
}

.et-modal__body {
    flex: 1;
    min-height: 0;
    overflow: auto;
    padding: 18px 20px;
}

.et-modal__foot {
    flex: none;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 14px 20px;
    border-top: 1px solid var(--et-line);
    background: var(--et-surface-2);
}

.et-modal__foot .spacer { flex: 1; }

@keyframes et-fade {
    from { opacity: 0; }
}

@keyframes et-pop {
    from { opacity: 0; transform: translateY(14px) scale(.97); }
}

/* ============ 轻提示（toast） ============ */
.et-toast {
    position: fixed;
    left: 50%;
    bottom: 56px;
    transform: translateX(-50%) translateY(10px);
    z-index: 120;
    display: flex;
    align-items: center;
    gap: 9px;
    max-width: min(520px, 88vw);
    padding: 11px 18px;
    border-radius: 12px;
    font-size: 13.5px;
    font-weight: 600;
    color: #fff;
    background: rgba(15, 23, 42, .92);
    border: 1px solid rgba(148, 163, 184, .25);
    box-shadow: var(--et-shadow-lg);
    opacity: 0;
    pointer-events: none;
    transition: opacity .22s, transform .22s;
}

.et-toast.is-show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
}

.et-toast[data-tone="ok"] { background: rgba(5, 150, 105, .95); }
.et-toast[data-tone="err"] { background: rgba(220, 38, 38, .95); }
.et-toast[data-tone="warn"] { background: rgba(217, 119, 6, .95); }

/* ============ 设置抽屉（右上角入口，edupick 交互） ============ */
.et-drawer-backdrop {
    position: fixed;
    inset: 0;
    z-index: 90;
    background: rgba(2, 6, 23, .45);
    backdrop-filter: blur(3px);
    -webkit-backdrop-filter: blur(3px);
    opacity: 0;
    transition: opacity .2s;
}

.et-drawer-backdrop.is-open { opacity: 1; }

.et-drawer {
    position: absolute;
    top: 0;
    right: 0;
    height: 100%;
    width: min(400px, 92vw);
    display: flex;
    flex-direction: column;
    background: var(--et-surface);
    border-left: 1px solid var(--et-line);
    box-shadow: var(--et-shadow-lg);
    transform: translateX(100%);
    transition: transform .22s cubic-bezier(.32, .72, .35, 1);
}

.et-drawer-backdrop.is-open .et-drawer { transform: translateX(0); }

.et-drawer__head {
    flex: none;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 15px 18px;
    border-bottom: 1px solid var(--et-line);
    font-weight: 800;
    font-size: 15px;
    color: var(--et-accent);
}

.et-drawer__head .et-icon-btn {
    margin-left: auto;
    width: 32px;
    height: 32px;
}

.et-drawer__body {
    flex: 1;
    min-height: 0;
    overflow: auto;
    padding: 16px 18px 24px;
}

/* 抽屉内容通用小节（工具复用） */
.et-drawer__body h4 {
    margin: 18px 0 8px;
    font-size: 12px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: .08em;
    color: var(--et-muted);
}

.et-drawer__body h4:first-child { margin-top: 0; }

.et-drawer__row {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
}

.et-drawer__tip {
    margin: 8px 0 0;
    font-size: 12px;
    line-height: 1.8;
    color: var(--et-muted);
}

.et-drawer__tip b { color: var(--et-fg); }

.et-drawer__input {
    flex: 1;
    min-width: 0;
    padding: 9px 12px;
    border: 1px solid var(--et-line-strong);
    border-radius: 9px;
    background: var(--et-surface-2);
    color: var(--et-fg);
    font: inherit;
    font-size: 13.5px;
    transition: border-color .14s, box-shadow .14s;
}

.et-drawer__input:focus {
    outline: none;
    border-color: var(--et-accent);
    box-shadow: 0 0 0 3px var(--et-accent-weak);
}

.et-drawer__switch {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 10px 0;
    border-bottom: 1px dashed var(--et-line);
    font-size: 13.5px;
    font-weight: 600;
    color: var(--et-fg);
    cursor: pointer;
    user-select: none;
}

.et-drawer__switch input {
    width: 17px;
    height: 17px;
    accent-color: var(--et-accent);
    cursor: pointer;
}
</style>

<style>
/* ── 凸透镜成像模拟：工具自身样式（自包含，不引用任何外部资源） ── */
:root { --lc-accent: #8b5cf6; }

.lc-main { flex: 1; min-height: 0; display: flex; flex-direction: column; }

/* ---------- 工具栏 ---------- */
.lc-bar {
    flex: none;
    display: flex;
    align-items: center;
    gap: 10px 16px;
    flex-wrap: wrap;
    padding: 9px 16px;
    border-bottom: 1px solid var(--et-line);
    background: var(--et-surface-2);
}

.lc-group { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }

.lc-group__label {
    font-size: 12px;
    font-weight: 800;
    letter-spacing: .04em;
    color: var(--et-muted);
}

.lc-seg {
    display: flex;
    gap: 3px;
    padding: 3px;
    border: 1px solid var(--et-line);
    border-radius: 10px;
    background: var(--et-surface);
}

.lc-seg button {
    border: 0;
    background: none;
    color: var(--et-muted);
    font: inherit;
    font-size: 12.5px;
    font-weight: 700;
    padding: 5px 9px;
    border-radius: 7px;
    cursor: pointer;
    white-space: nowrap;
    transition: background .14s, color .14s;
    -webkit-tap-highlight-color: transparent;
}

.lc-seg button:hover { color: var(--et-accent); }
.lc-seg button.is-active { background: var(--et-accent); color: #fff; }
.lc-spacer { flex: 1 1 auto; }

.lc-check {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 13px;
    font-weight: 600;
    color: var(--et-fg);
    cursor: pointer;
    user-select: none;
}

.lc-check input { width: 16px; height: 16px; accent-color: var(--et-accent); cursor: pointer; }

/* ---------- 画布 ---------- */
.lc-stage {
    position: relative;
    flex: 1;
    min-height: 0;
    overflow: hidden;
    background: var(--et-surface);
}

.lc-stage canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    touch-action: none;
    cursor: grab;
}

.lc-stage canvas.is-drag { cursor: grabbing; }

.lc-tip {
    position: absolute;
    left: 14px;
    bottom: 12px;
    padding: 6px 12px;
    border: 1px solid var(--et-line);
    border-radius: 10px;
    background: var(--et-glass);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    font-size: 12.5px;
    color: var(--et-muted);
    pointer-events: none;
    box-shadow: var(--et-shadow-md);
}

/* ---------- 结论带 ---------- */
.lc-foot {
    flex: none;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px 22px;
    flex-wrap: wrap;
    min-height: 58px;
    padding: 8px 16px 12px;
    border-top: 1px solid var(--et-line);
    background: var(--et-surface-2);
}

.lc-stat { font-size: 13px; font-weight: 700; color: var(--et-muted); }
.lc-stat b { font-size: 15px; color: var(--et-fg); font-variant-numeric: tabular-nums; }
.lc-nature { font-size: clamp(14px, 2.1vh, 20px); font-weight: 900; color: var(--et-accent); }
.lc-app { font-size: 14px; font-weight: 800; color: var(--et-ok); }
.lc-warn { font-size: 14px; font-weight: 800; color: var(--et-warn); }

@media (max-width: 1180px) {
    .lc-seg button { font-size: 11.5px; padding: 4px 7px; }
}
</style>

                btn.type = 'button';
                btn.addEventListener('click', function () {
                    if (b.onClick) { b.onClick(close); } else { close(); }
                });
                foot.appendChild(btn);
            });
            panel.appendChild(foot);
        }

        backdrop.appendChild(panel);
        document.body.appendChild(backdrop);

        function close() {
            if (backdrop.parentNode) { backdrop.parentNode.removeChild(backdrop); }
            document.removeEventListener('keydown', onKey);
            if (mo.onClose) { mo.onClose(); }
        }
        function onKey(ev) {
            if (ev.key === 'Escape') { ev.stopPropagation(); close(); }
        }
        document.addEventListener('keydown', onKey);
        backdrop.addEventListener('mousedown', function (ev) {

    var toastEl = null;

        if (typeof opt.primary === 'function') {

<script>
  /* 此块由 scripts/sync_shared.py 自动注入，请勿手工修改 */
/*!
 * et-stats.js — 使用统计模块（模块化，可整体移除）
 *
 * 共享逻辑源。改这里，然后跑：python scripts/sync_shared.py
 * 依赖：无（可脱离 et-util / et-chrome 独立运行）。
 * 全局：ET.Stats
 *
 * ┌────────────────────────────────────────────────────────────────┐
 * │ 说明：本模块只做一件事——工具被打开时向上报端点发一条匿名计数。 │
 * │ · 在线（iframe 内）：宿主页面已服务端计数，本模块不重复上报。   │
 * │ · 离线打开（file:// / 下载单文件 / 离线包）：联网条件具备时，   │
 * │   以 sendBeacon 上报 use_offline 事件（text/plain 免预检）。    │
 * │ · 上报端点 = window.ET_SITE_ORIGIN（由宿主注入或离线包配置）。  │
 * │   未配置端点时本模块完全静默，不发任何请求。                    │
 * │ · **整个 <script> 块可安全删除**：删除后工具其余功能完全正常，  │
 * │   且完全不再发起任何网络请求。                                  │
 * └────────────────────────────────────────────────────────────────┘
 */
(function (global) {
    'use strict';

    var ET = global.ET = global.ET || {};

    var Stats = {
        /** 上报端点来源（站点绝对地址，无协议尾斜杠） */
        endpoint: (typeof global.ET_SITE_ORIGIN === 'string' && /^https?:\/\//.test(global.ET_SITE_ORIGIN))
            ? global.ET_SITE_ORIGIN
            : null,

        _done: {},

        /**
         * 上报一次事件（同一事件同一工具每次页面加载只报一次）。
         * event: 'use_offline' 等；toolId: 工具 id。
         */
        send: function (event, toolId) {
            if (!event || this._done[event + ':' + (toolId || '')]) { return false; }
            if (!this.endpoint) { return false; }
            /* iframe 内由宿主统计，避免双计 */
            try {
                if (global.parent && global.parent !== global) { return false; }
            } catch (err) { return false; }
            /* 断网时挂起，网络恢复自动补报一次 */
            if (global.navigator && global.navigator.onLine === false) {
                var self = this;
                global.addEventListener('online', function () { self.send(event, toolId); }, { once: true });
                return false;
            }

            this._done[event + ':' + (toolId || '')] = true;
            var payload = JSON.stringify({ event: event, tool: toolId || '' });

            try {
                if (global.navigator.sendBeacon) {
                    return global.navigator.sendBeacon(
                        this.endpoint + '/api/track',
                        new Blob([payload], { type: 'text/plain;charset=UTF-8' })
                    );
                }
                global.fetch(this.endpoint + '/api/track', {
                    method: 'POST',
                    body: payload,
                    keepalive: true,
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'text/plain;charset=UTF-8' }
                });
                return true;
            } catch (err) {
                return false;
            }
        }
    };

    ET.Stats = Stats;
})(window);
</script>

<script>
(function () {
    'use strict';

    var TOOL_ID = 'lens-imaging';
    var store = ET.store(TOOL_ID);

    var FONT = 'system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif';
    var FOCALS = [5, 10, 15, 20];
    var MULS = [3, 2, 1.5, 1, 0.5];

    function pick(list, value, fallback) {
        return list.indexOf(value) !== -1 ? value : fallback;
    }

    function trimNum(v, digits) {
        var s = Number(v).toFixed(digits === undefined ? 1 : digits);
        s = s.replace(/0+$/, '').replace(/\.$/, '');
        return (s === '-0' || s === '') ? '0' : s;
    }

    var savedU = Number(store.get('u', 0));

    var state = {
        f: pick(FOCALS, Number(store.get('f', 10)), 10),
        u: (isFinite(savedU) && savedU > 0) ? savedU : 30,
        screenOn: store.get('screenOn', false) === true,
        screenX: Number(store.get('screenX', 0)) || 0,
        rays: store.get('rays', true) !== false,
        labels: store.get('labels', true) !== false
    };

    if (state.screenX <= 0) { state.screenX = state.f * 2; }

    function clampU() {
        state.u = Math.max(state.f * 0.15, Math.min(state.f * 3.3, state.u));
    }

    function clampScreen() {
        state.screenX = Math.max(state.f * 0.25, Math.min(state.f * 3.3, state.screenX));
    }

    clampU();
    clampScreen();

    var chrome = ET.Chrome.mount({
        toolId: TOOL_ID,
        title: '凸透镜成像模拟',
        sub: '物理 · 光路实时绘制',
        accent: '#8b5cf6',
        status: '就绪',
        sound: true,
        primary: moveScreenToImage,
        secondary: cycleTypical,
        settings: { title: '成像设置', build: buildSettings },
        help: '<div style="font-size:13.5px;line-height:2">' +
            '<p style="margin:0 0 8px"><b>怎么玩</b>：左右拖动点燃的蜡烛（物体）改变物距 u，右侧光屏也可以拖动；三条特殊光线与像会实时重画，像距 v 与放大率按 1/u + 1/v = 1/f 计算。</p>' +
            '<p style="margin:0 0 8px"><b>看规律</b>：点「典型位置」里的 u=3f / u=2f / f&#60;u&#60;2f / u=f / u&#60;f，逐个观察像的位置、正倒、大小、虚实变化，底部会给出像的性质与对应的生活应用。</p>' +
            '<p style="margin:0 0 8px"><b>找清晰的像</b>：勾选「光屏」后按空格，光屏会自动移到成像位置并显示「清晰」；拖到别处会看到模糊的光斑。</p>' +
            '<p style="margin:0 0 8px"><b>三条光线</b>：① 平行主光轴的光线折射后过另一侧焦点；② 过光心的光线方向不变；③ 过焦点的光线折射后平行主光轴。u&#60;f 时的虚线表示折射光线的反向延长线。</p>' +
            '<p style="margin:0"><b>快捷键</b>：空格 = 光屏移到像的位置；←→ = 移动物体；↑↓ = 改焦距；翻页笔下页键同上页键 = 循环典型位置。</p></div>'
    });

    /* ============ 光学计算 ============ */

    function optics() {
        var f = state.f;
        var u = state.u;
        var atFocal = Math.abs(u - f) < f * 0.02;
        var v = atFocal ? Infinity : (u * f) / (u - f);
        var m = atFocal ? Infinity : -v / u;
        return { f: f, u: u, v: v, m: m, atFocal: atFocal, real: isFinite(v) && v > 0 };
    }

    /* ============ 画布 ============ */

    var cv = document.getElementById('cv');
    var ctx = cv.getContext('2d');
    var W = 900;
    var H = 480;
    var geom = { cx: 450, cy: 260, s: 10, objPx: 90 };
    var raf = 0;
    var tween = null;
    var drag = null;

    function layout() {
        geom.cx = W * 0.5;
        geom.cy = H * 0.55;
        var half = 3.4 * state.f;
        geom.s = (W / 2 - 44) / half;
        geom.objPx = Math.min(H * 0.23, 106);
    }

    function pxX(cm) { return geom.cx + cm * geom.s; }
    function cmX(px) { return (px - geom.cx) / geom.s; }

    function cssVar(name, fallback) {
        try {
            var v = window.getComputedStyle(document.documentElement).getPropertyValue(name);
            v = String(v || '').replace(/^\s+|\s+$/g, '');
            return v || fallback;
        } catch (err) {
            return fallback;
        }
    }

    function line(x1, y1, x2, y2, color, width, dash) {
        ctx.save();
        ctx.strokeStyle = color;
        ctx.lineWidth = width;
        ctx.lineCap = 'round';
        if (dash) { ctx.setLineDash(dash); }
        ctx.beginPath();
        ctx.moveTo(x1, y1);
        ctx.lineTo(x2, y2);
        ctx.stroke();
        ctx.restore();
    }

    function arrow(x1, y1, x2, y2, color, width, dash) {
        line(x1, y1, x2, y2, color, width, dash);
        var ang = Math.atan2(y2 - y1, x2 - x1);
        var head = Math.max(7, width * 3.2);
        ctx.save();
        ctx.translate(x2, y2);
        ctx.rotate(ang);
        ctx.fillStyle = color;
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.lineTo(-head, -head * 0.45);
        ctx.lineTo(-head, head * 0.45);
        ctx.closePath();
        ctx.fill();
        ctx.restore();
    }

    function text(str, x, y, color, size, align, baseline) {
        ctx.save();
        ctx.fillStyle = color;
        ctx.font = 'bold ' + (size || 13) + 'px ' + FONT;
        ctx.textAlign = align || 'center';
        ctx.textBaseline = baseline || 'middle';
        ctx.fillText(str, x, y);
        ctx.restore();
    }

    function chip(str, x, y, color, bg) {
        ctx.save();
        ctx.font = 'bold 12.5px ' + FONT;
        var w = ctx.measureText(str).width;
        ctx.fillStyle = bg;
        ctx.globalAlpha = 0.9;
        ctx.fillRect(x - w / 2 - 6, y - 9, w + 12, 18);
        ctx.globalAlpha = 1;
        ctx.fillStyle = color;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(str, x, y + 0.5);
        ctx.restore();
    }

    function drawAxis(cMuted, cFg) {
        line(0, geom.cy, W, geom.cy, cMuted, 1.4);
        text('主光轴', W - 12, geom.cy - 12, cMuted, 12, 'right');
    }

    function drawLens(cAccent) {
        var hL = Math.min(H * 0.34, 156);
        var wL = Math.max(10, Math.min(18, geom.s * 2.2));
        ctx.save();
        ctx.beginPath();
        ctx.moveTo(geom.cx, geom.cy - hL);
        ctx.quadraticCurveTo(geom.cx - wL, geom.cy, geom.cx, geom.cy + hL);
        ctx.quadraticCurveTo(geom.cx + wL, geom.cy, geom.cx, geom.cy - hL);
        ctx.closePath();
        ctx.fillStyle = cAccent;
        ctx.globalAlpha = 0.16;
        ctx.fill();
        ctx.globalAlpha = 0.85;
        ctx.strokeStyle = cAccent;
        ctx.lineWidth = 2.2;
        ctx.stroke();
        ctx.restore();
        text('凸透镜', geom.cx + 34, geom.cy - hL + 12, cAccent, 12, 'left');
    }

    function drawFocalMarks(cMuted, cLabels) {
        var marks = [
            { cm: -2, label: '2F' },
            { cm: -1, label: 'F' },
            { cm: 1, label: "F′" },
            { cm: 2, label: "2F′" }
        ];
        for (var i = 0; i < marks.length; i++) {
            var x = pxX(marks[i].cm * state.f);
            if (x < 6 || x > W - 6) { continue; }
            ctx.save();
            ctx.fillStyle = cMuted;
            ctx.beginPath();
            ctx.arc(x, geom.cy, 3.4, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
            if (cLabels) {
                text(marks[i].label, x, geom.cy - 16, cMuted, 12.5);
            }
        }
    }

    function drawObject(cObj) {
        var ox = pxX(-state.u);
        var oy = geom.cy - geom.objPx;
        arrow(ox, geom.cy, ox, oy, cObj, 3);
        text('物', ox, oy - 14, cObj, 13);
    }

    function rayThrough(x0, y0, x1, y1, xTo) {
        var dx = x1 - x0;
        if (Math.abs(dx) < 1e-6) { return [xTo, y1]; }
        var t = (xTo - x0) / dx;
        return [xTo, y0 + (y1 - y0) * t];
    }

    function drawRays(o, cRay, cMuted) {
        var ox = pxX(-state.u);
        var oy = geom.cy - geom.objPx;
        var fpx = state.f * geom.s;
        var fx2 = geom.cx + fpx;

        /* ① 平行主光轴 → 过另一侧焦点 */
        var after1 = rayThrough(geom.cx, oy, fx2, geom.cy, W + 4);
        line(ox, oy, geom.cx, oy, cRay, 1.8);
        line(geom.cx, oy, after1[0], after1[1], cRay, 1.8);

        /* ② 过光心 → 方向不变 */
        var after2 = rayThrough(ox, oy, geom.cx, geom.cy, W + 4);
        line(ox, oy, after2[0], after2[1], cRay, 1.8);

        /* ③ 过焦点 F → 折射后平行主光轴 */
        var fx1 = geom.cx - fpx;
        var y3;
        if (Math.abs(ox - fx1) < 1e-6) {
            y3 = oy;
        } else {
            y3 = geom.cy + (oy - geom.cy) * (geom.cx - fx1) / (ox - fx1);
        }
        line(ox, oy, geom.cx, y3, cRay, 1.8);
        line(geom.cx, y3, W + 4, y3, cRay, 1.8);

        /* 虚像：折射光线的反向延长线（虚线） */
        if (!o.atFocal && o.v < 0) {
            var imgX = pxX(o.v);
            var tipY = geom.cy + geom.objPx * (-o.m);
            line(geom.cx, oy, imgX - 6, tipY, cMuted, 1.2, [5, 6]);
            line(geom.cx, y3, imgX - 6, tipY, cMuted, 1.2, [5, 6]);
        }
    }

    function drawImage(o, cImg) {
        if (o.atFocal) { return; }
        var imgX = pxX(o.v);
        var hpx = geom.objPx * (-o.m);      /* > 0：倒立（向下）；< 0：正立（向上） */
        var limit = H * 0.45;
        var drawH = hpx;
        var clamped = false;
        if (Math.abs(hpx) > limit) {
            drawH = hpx > 0 ? limit : -limit;
            clamped = true;
        }
        var tipY = geom.cy + drawH;
        arrow(imgX, geom.cy, imgX, tipY, cImg, 3, o.real ? null : [7, 6]);
        text(o.real ? '实像' : '虚像', imgX, tipY + (drawH > 0 ? 16 : -16), cImg, 13);
        if (clamped) {
            text('（像太大，画面已截断）', imgX, tipY + (drawH > 0 ? 34 : -34), cImg, 11.5);
        }
    }

    function drawDistance(xa, xb, y, label, color) {
        var dir = xb > xa ? 1 : -1;
        line(xa, y, xb, y, color, 1.4);
        arrow(xa + dir * 2, y, xa, y, color, 1.4);
        arrow(xb - dir * 2, y, xb, y, color, 1.4);
        var mid = (xa + xb) / 2;
        chip(label, mid, y, color, cssVar('--et-surface', '#fff'));
    }

    function drawScreen(o, cMuted, cImg, cOk, cWarn) {
        if (!state.screenOn) { return; }
        var sx = pxX(state.screenX);
        var hS = Math.min(H * 0.3, 132);
        ctx.save();
        ctx.fillStyle = cMuted;
        ctx.globalAlpha = 0.14;
        ctx.fillRect(sx - 5, geom.cy - hS, 10, hS * 2);
        ctx.globalAlpha = 0.8;
        ctx.fillStyle = cMuted;
        ctx.fillRect(sx - 2, geom.cy - hS, 4, hS * 2);
        ctx.restore();
        text('光屏', sx, geom.cy - hS - 12, cMuted, 12.5);

        if (!isFinite(o.v)) {
            chip('不成像', sx, geom.cy + hS - 16, cWarn, cssVar('--et-surface', '#fff'));
            return;
        }
        if (!o.real) {
            chip('光屏上接不到虚像', sx, geom.cy + hS - 16, cWarn, cssVar('--et-surface', '#fff'));
            return;
        }

        var diff = Math.abs(state.screenX - o.v);
        var tol = Math.max(0.25, o.v * 0.03);
        var hpx = geom.objPx * Math.abs(o.m);
        if (diff <= tol) {
            /* 清晰 */
            var tip = geom.cy + (geom.objPx * (-o.m) > 0 ? hpx : -hpx);
            arrow(sx, geom.cy, sx, tip, cOk, 2.6);
            chip('清晰', sx, geom.cy - hS + 18, cOk, cssVar('--et-surface', '#fff'));
        } else {
            /* 模糊：椭圆光斑 */
            var ry = Math.max(14, hpx * (1 + Math.min(2, diff / Math.max(0.5, o.v * 0.1))));
            ctx.save();
            ctx.translate(sx, geom.cy);
            var grd = ctx.createRadialGradient(0, 0, 2, 0, 0, Math.max(ry, 20));
            grd.addColorStop(0, 'rgba(37,99,235,.5)');
            grd.addColorStop(1, 'rgba(37,99,235,0)');
            ctx.fillStyle = grd;
            ctx.beginPath();
            ctx.ellipse(0, 0, Math.max(24, hpx * 0.6), ry, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
            chip('模糊', sx, geom.cy - hS + 18, cImg, cssVar('--et-surface', '#fff'));
        }
    }

    function draw() {
        var cBg = cssVar('--et-surface', '#ffffff');
        var cFg = cssVar('--et-fg', '#0b1220');
        var cMuted = cssVar('--et-muted', '#64748b');
        var cAccent = cssVar('--et-accent', '#8b5cf6');
        var cObj = '#e11d48';
        var cImg = '#2563eb';
        var cRay = '#f59e0b';
        var cOk = cssVar('--et-ok', '#059669');
        var cWarn = cssVar('--et-warn', '#d97706');

        var o = optics();

        ctx.clearRect(0, 0, W, H);
        ctx.fillStyle = cBg;
        ctx.fillRect(0, 0, W, H);

        drawAxis(cMuted, cFg);
        drawFocalMarks(cMuted, state.labels);

        if (state.rays) { drawRays(o, cRay, cMuted); }

        drawLens(cAccent);
        drawObject(cObj);
        drawImage(o, cImg);
        drawScreen(o, cMuted, cImg, cOk, cWarn);

        if (state.labels) {
            var yU = geom.cy + 30;
            drawDistance(pxX(-state.u), geom.cx, yU, 'u = ' + trimNum(state.u, 1) + 'cm', cObj);
            if (isFinite(o.v)) {
                var yV = geom.cy + (o.v > 0 ? 56 : 30);
                drawDistance(geom.cx, pxX(o.v), yV, (o.v > 0 ? 'v = ' : 'v = -') + trimNum(Math.abs(o.v), 1) + 'cm', cImg);
            }
        }
    }

    function tick() {
        raf = 0;
        if (tween) {
            var now = (window.performance && window.performance.now) ? window.performance.now() : Date.now();
            var p = Math.min(1, (now - tween.t0) / tween.dur);
            var e = 1 - Math.pow(1 - p, 3);
            state[tween.prop] = tween.from + (tween.to - tween.from) * e;
            renderChips();
            if (p >= 1) { state[tween.prop] = tween.to; tween = null; afterChange(); }
            draw();
            if (tween) { raf = window.requestAnimationFrame(tick); }
            return;
        }
        draw();
    }

    function requestDraw() {
        if (!raf) { raf = window.requestAnimationFrame(tick); }
    }

    function tweenTo(prop, target, dur) {
        tween = {
            prop: prop,
            from: state[prop],
            to: target,
            t0: (window.performance && window.performance.now) ? window.performance.now() : Date.now(),
            dur: dur || 300
        };
        requestDraw();
    }

    function afterChange() {
        renderChips();
        renderFoot();
        save();
        requestDraw();
    }

    /* ============ 结论带 ============ */

    function el(tag, cls, txt) {
        var node = document.createElement(tag);
        if (cls) { node.className = cls; }
        if (txt !== undefined && txt !== null) { node.textContent = txt; }
        return node;
    }

    function stat(label, value) {
        var s = el('span', 'lc-stat', label + ' ');
        s.appendChild(el('b', null, value));
        return s;
    }

    function natureOf(o) {
        if (o.atFocal) { return 'u = f：不成像（折射光线平行射出）'; }
        if (!o.real) { return '正立、放大的虚像（与物体同侧，光屏接不到）'; }
        var am = Math.abs(o.m);
        var size = am > 1.03 ? '放大' : (am < 0.97 ? '缩小' : '等大');
        return '倒立、' + size + '的实像（与物体异侧）';
    }

    function appOf(o) {
        if (o.atFocal) { return '无像'; }
        if (Math.abs(o.u - 2 * state.f) < state.f * 0.06) { return '测焦距（u = 2f，像与物等大）'; }
        if (o.u > 2 * state.f) { return '照相机原理（u > 2f）'; }
        if (o.u > state.f) { return '投影仪 / 幻灯机原理（f < u < 2f）'; }
        return '放大镜原理（u < f）';
    }

    function renderFoot() {
        var foot = document.getElementById('foot');
        var o = optics();
        foot.textContent = '';

        if (Math.abs(o.u - state.f) < state.f * 0.02) {
            foot.appendChild(stat('物距 u', trimNum(o.u, 1) + 'cm'));
            foot.appendChild(stat('焦距 f', state.f + 'cm'));
            foot.appendChild(el('span', 'lc-nature', 'u = f：不成像'));
            foot.appendChild(el('span', 'lc-warn', '折射光线平行射出，光屏上只有一片均匀光斑'));
            return;
        }

        foot.appendChild(stat('物距 u', trimNum(o.u, 1) + 'cm'));
        foot.appendChild(stat('焦距 f', state.f + 'cm'));
        foot.appendChild(stat('像距 v', trimNum(Math.abs(o.v), 1) + 'cm' + (o.v < 0 ? '（虚像，同侧）' : '')));
        foot.appendChild(stat('放大率', trimNum(Math.abs(o.m), 2) + '×'));
        foot.appendChild(el('span', 'lc-nature', natureOf(o)));
        foot.appendChild(el('span', 'lc-app', appOf(o)));
    }

    /* ============ 操作 ============ */

    function save() {
        store.set('f', state.f);
        store.set('u', state.u);
        store.set('screenOn', state.screenOn);
        store.set('screenX', state.screenX);
        store.set('rays', state.rays);
        store.set('labels', state.labels);
    }

    /* 当前物距相当于焦距的多少倍（供典型位置按钮高亮 / 循环取用） */
    function mulNow() {
        return state.u / state.f;
    }

    function setFocal(f) {
        if (FOCALS.indexOf(f) === -1) { return; }
        tween = null;
        state.f = f;
        /* 换透镜时物距不变，只重新夹取范围 */
        clampU();
        clampScreen();
        layout();
        afterChange();
        chrome.beep('tick');
    }

    function setMul(mul) {
        if (MULS.indexOf(mul) === -1) { return; }
        var target = Math.max(state.f * 0.15, Math.min(state.f * 3.3, mul * state.f));
        tweenTo('u', target, 340);
        chrome.beep('ok');
    }

    /* 循环到下一个「典型位置」：按 u/f 的实际倍率决定下一站 */
    function cycleTypical() {
        var cur = mulNow();
        var next = MULS[0];
        for (var i = 0; i < MULS.length; i++) {
            if (MULS[i] < cur - 0.02) { next = MULS[i]; break; }
        }
        setMul(next);
        chrome.toast('典型位置：u = ' + (next === 1.5 ? '1.5f' : next + 'f'));
    }

    function moveScreenToImage() {
        var o = optics();
        if (!isFinite(o.v) || o.v <= 0) {
            chrome.toast(isFinite(o.v) ? '此时成虚像，光屏上接不到' : '此时不成像，无法在光屏上得到像', 'warn');
            chrome.beep('err');
            renderFoot();
            save();
            requestDraw();
            return;
        }
        if (!state.screenOn) {
            state.screenOn = true;
            document.getElementById('chkScreen').checked = true;
        }
        var target = Math.max(state.f * 0.25, Math.min(state.f * 3.3, o.v));
        tweenTo('screenX', target, 320);
        chrome.beep('ok');
        chrome.toast('光屏已移到像的位置（' + trimNum(o.v, 1) + 'cm），此时最清晰');
    }

    function renderChips() {
        var list = document.getElementById('segF').querySelectorAll('button');
        var i;
        for (i = 0; i < list.length; i++) {
            list[i].classList.toggle('is-active', Number(list[i].getAttribute('data-f')) === state.f);
        }
        /* 物距接近某个典型位置时点亮对应按钮（跟随实际 u/f 实时更新） */
        var m = mulNow();
        list = document.getElementById('segU').querySelectorAll('button');
        for (i = 0; i < list.length; i++) {
            var mul = Number(list[i].getAttribute('data-mul'));
            list[i].classList.toggle('is-active', Math.abs(m - mul) < 0.02);
        }
    }

    /* ============ 交互 ============ */

    function canvasX(ev) {
        var rect = cv.getBoundingClientRect();
        return ev.clientX - rect.left;
    }

    cv.addEventListener('pointerdown', function (ev) {
        var px = canvasX(ev);
        var objPx = pxX(-state.u);
        var scrPx = pxX(state.screenX);
        if (state.screenOn && Math.abs(px - scrPx) < 24) {
            drag = 'screen';
        } else if (Math.abs(px - objPx) < 34 || px < geom.cx) {
            drag = 'obj';
        } else if (state.screenOn) {
            drag = 'screen';
        } else {
            drag = 'obj';
        }
        cv.classList.add('is-drag');
        if (cv.setPointerCapture) {
            try { cv.setPointerCapture(ev.pointerId); } catch (err) { /* 忽略 */ }
        }
        tween = null;
        applyDrag(px);
        ev.preventDefault();
    });

    cv.addEventListener('pointermove', function (ev) {
        if (!drag) { return; }
        applyDrag(canvasX(ev));
    });

    function applyDrag(px) {
        if (drag === 'obj') {
            if (px > geom.cx - 6) { px = geom.cx - 6; }
            state.u = -cmX(px);
            clampU();
            var o = optics();
            if (o.real && Math.abs(state.screenX - o.v) < 0.4) { state.screenX = o.v; }
        } else if (drag === 'screen') {
            state.screenX = cmX(px);
            clampScreen();
            var oo = optics();
            if (oo.real && Math.abs(state.screenX - oo.v) < 0.35) { state.screenX = oo.v; }
        }
        syncAfterMove();
    }

    function syncAfterMove() {
        renderChips();
        renderFoot();
        save();
        requestDraw();
    }

    function endDrag() {
        if (!drag) { return; }
        drag = null;
        cv.classList.remove('is-drag');
        var o = optics();
        if (o.real && Math.abs(state.screenX - o.v) < 0.05) {
            chrome.beep('ok');
        }
    }

    cv.addEventListener('pointerup', endDrag);
    cv.addEventListener('pointercancel', endDrag);

    document.getElementById('segF').addEventListener('click', function (ev) {
        var v = ev.target && ev.target.getAttribute ? ev.target.getAttribute('data-f') : null;
        if (v) { setFocal(Number(v)); }
    });

    document.getElementById('segU').addEventListener('click', function (ev) {
        var v = ev.target && ev.target.getAttribute ? ev.target.getAttribute('data-mul') : null;
        if (v) { setMul(Number(v)); }
    });

    document.getElementById('chkScreen').addEventListener('change', function (ev) {
        state.screenOn = ev.target.checked;
        save();
        renderFoot();
        requestDraw();
    });

    document.getElementById('chkRays').addEventListener('change', function (ev) {
        state.rays = ev.target.checked;
        save();
        requestDraw();
    });

    document.getElementById('chkLabels').addEventListener('change', function (ev) {
        state.labels = ev.target.checked;
        save();
        requestDraw();
    });

    document.addEventListener('keydown', function (ev) {
        var node = document.activeElement;
        var tag = node && node.tagName ? node.tagName.toUpperCase() : '';
        if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT' || (node && node.isContentEditable)) { return; }
        if (document.querySelector('.et-modal, .et-drawer-backdrop')) { return; }

        if (ev.code === 'Space' || ev.key === ' ') {
            ev.preventDefault();
            moveScreenToImage();
        } else if (ev.key === 'ArrowLeft') {
            ev.preventDefault();
            tween = null;
            drag = 'obj';
            state.u = Math.min(state.f * 3.3, state.u + 0.5);
            clampU();
            syncAfterMove();
            drag = null;
        } else if (ev.key === 'ArrowRight') {
            ev.preventDefault();
            tween = null;
            drag = 'obj';
            state.u = Math.max(state.f * 0.15, state.u - 0.5);
            clampU();
            syncAfterMove();
            drag = null;
        } else if (ev.key === 'ArrowUp' || ev.key === 'ArrowDown') {
            ev.preventDefault();
            var idx = FOCALS.indexOf(state.f);
            idx = ev.key === 'ArrowUp'
                ? Math.min(FOCALS.length - 1, idx + 1)
                : Math.max(0, idx - 1);
            setFocal(FOCALS[idx]);
        }
    });

    /* ============ 设置抽屉 ============ */

    function buildSettings(body) {
        function heading(t) {
            var h = document.createElement('h4');
            h.textContent = t;
            body.appendChild(h);
        }

        function segRow(labels, values, current, onPick) {
            var row = document.createElement('div');
            row.className = 'et-drawer__row';
            for (var i = 0; i < values.length; i++) {
                (function (value, label) {
                    var b = document.createElement('button');
                    b.type = 'button';
                    b.className = 'et-btn' + (value === current ? ' et-btn--primary' : '');
                    b.style.flex = '1 1 28%';
                    b.textContent = label;
                    b.addEventListener('click', function () {
                        onPick(value);
                        refresh();
                    });
                    row.appendChild(b);
                })(values[i], labels[i]);
            }
            body.appendChild(row);
        }

        function checkRow(label, checked, onChange) {
            var row = document.createElement('label');
            row.className = 'et-drawer__switch';
            row.appendChild(document.createTextNode(label));
            var cb = document.createElement('input');
            cb.type = 'checkbox';
            cb.checked = checked;
            cb.addEventListener('change', function () { onChange(cb.checked); });
            row.appendChild(cb);
            body.appendChild(row);
        }

        heading('焦距');
        segRow(['5cm', '10cm', '15cm', '20cm'], FOCALS, state.f, function (v) { setFocal(v); });

        heading('显示');
        checkRow('三条特殊光线', state.rays, function (on) {
            state.rays = on;
            document.getElementById('chkRays').checked = on;
            save();
            requestDraw();
        });
        checkRow('标注（F / 2F / u / v）', state.labels, function (on) {
            state.labels = on;
            document.getElementById('chkLabels').checked = on;
            save();
            requestDraw();
        });
        checkRow('光屏', state.screenOn, function (on) {
            state.screenOn = on;
            document.getElementById('chkScreen').checked = on;
            renderFoot();
            save();
            requestDraw();
        });

        heading('快捷操作');
        var row = document.createElement('div');
        row.className = 'et-drawer__row';
        var b1 = document.createElement('button');
        b1.type = 'button';
        b1.className = 'et-btn et-btn--primary';
        b1.style.flex = '1 1 40%';
        b1.textContent = '光屏移到像的位置';
        b1.addEventListener('click', moveScreenToImage);
        var b2 = document.createElement('button');
        b2.type = 'button';
        b2.className = 'et-btn';
        b2.style.flex = '1 1 40%';
        b2.textContent = '恢复 u = 3f';
        b2.addEventListener('click', function () { setMul(3); });
        row.appendChild(b1);
        row.appendChild(b2);
        body.appendChild(row);

        var tip = document.createElement('p');
        tip.className = 'et-drawer__tip';
        tip.innerHTML = '成像公式：<b>1/u + 1/v = 1/f</b>，放大率 |m| = v/u。'
            + '<br>u &#62; 2f 成缩小倒立实像（照相机）；u = 2f 成等大倒立实像（测焦距）；'
            + 'f &#60; u &#60; 2f 成放大倒立实像（投影仪）；u = f 不成像；u &#60; f 成放大正立虚像（放大镜）。'
            + '<br>虚像用虚线箭头表示，与物体同侧，光屏上接不到。'
            + '<br>拖动光屏时若靠近成像位置会自动吸附，方便演示「只有像的位置才清晰」。';
        body.appendChild(tip);

        function refresh() {
            while (body.firstChild) { body.removeChild(body.firstChild); }
            buildSettings(body);
        }
    }

    /* ============ 尺寸与启动 ============ */

    function resize() {
        var stage = document.getElementById('stage');
        var rect = stage.getBoundingClientRect();
        var dpr = window.devicePixelRatio || 1;
        W = Math.max(360, Math.floor(rect.width));
        H = Math.max(220, Math.floor(rect.height));
        cv.width = Math.round(W * dpr);
        cv.height = Math.round(H * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        layout();
        draw();
    }

    window.addEventListener('resize', function () {
        window.clearTimeout(window.__lcResize);
        window.__lcResize = window.setTimeout(resize, 140);
    });

    try {
        var observer = new MutationObserver(function () { requestDraw(); });
        observer.observe(document.documentElement, { attributes: true, attributeFilter: ['data-et-theme'] });
    } catch (err) { /* 老内核忽略 */ }

    document.getElementById('chkScreen').checked = state.screenOn;
    document.getElementById('chkRays').checked = state.rays;
    document.getElementById('chkLabels').checked = state.labels;

    renderChips();
    resize();
    renderFoot();
})();
</script>

</body>
</html>
