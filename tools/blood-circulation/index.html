/* ============ 设计令牌 ============ */
:root {
    --et-accent: #2563eb;
    --et-accent-weak: rgba(37, 99, 235, .14);
    --et-bg: #f4f6fb;
    --et-surface: #ffffff;
    --et-surface-2: #f8fafc;
    --et-fg: #0b1220;
    --et-muted: #64748b;
    --et-line: rgba(15, 23, 42, .12);
    --et-line-strong: rgba(15, 23, 42, .22);
    --et-glass: rgba(255, 255, 255, .85);
    --et-shadow-md: 0 10px 28px -18px rgba(15, 23, 42, .3);
    --et-shadow-lg: 0 24px 60px -32px rgba(15, 23, 42, .4);
    --et-ok: #059669;
    --et-warn: #d97706;
    --et-err: #dc2626;
    --et-radius: 12px;
    --et-radius-sm: 9px;
    --et-font: -apple-system, BlinkMacSystemFont, "Segoe UI",
               "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei",
               "Noto Sans SC", sans-serif;
    --et-mono: ui-monospace, "Cascadia Mono", Consolas, Menlo, monospace;
}

html[data-et-theme="dark"] {
    --et-bg: #0b1120;
    --et-surface: #111a2e;
    --et-surface-2: #0f1729;
    --et-fg: #f1f5f9;
    --et-muted: #94a3b8;
    --et-line: rgba(148, 163, 184, .18);
    --et-line-strong: rgba(148, 163, 184, .3);
    --et-glass: rgba(17, 26, 46, .85);
    --et-shadow-md: 0 10px 34px -18px rgba(0, 0, 0, .8);
    --et-shadow-lg: 0 24px 70px -30px rgba(0, 0, 0, .9);
    --et-ok: #34d399;
    --et-warn: #fbbf24;
    --et-err: #f87171;
}

/* ============ 基础 ============ */

/* body 作为外壳时必须清掉浏览器默认 8px 外边距，
   否则 iframe 预览中文档会比视口高 16px（底部白边 + 多余滚动） */
body.et-app {
    margin: 0;
}

.et-app {
    position: relative;
    isolation: isolate;
    display: flex;
    flex-direction: column;
    height: 100vh;
    height: 100dvh;
    overflow: hidden;
    background: var(--et-bg);
    color: var(--et-fg);
    font-family: var(--et-font);
    -webkit-font-smoothing: antialiased;
    transition: background .25s, color .25s;
}

/* 极光背景：径向渐变 + 呼吸动画（edupick 品质基线，老内核也不掉帧） */
.et-app::before {
    content: '';
    position: fixed;
    inset: 0;
    z-index: -1;
    pointer-events: none;
    background:
        radial-gradient(46% 40% at 20% 18%, var(--et-accent-weak), transparent 65%),
        radial-gradient(42% 38% at 82% 24%, var(--et-accent-weak), transparent 70%),
        radial-gradient(50% 44% at 55% 95%, rgba(16, 185, 129, .10), transparent 65%);
    animation: et-aurora 16s ease-in-out infinite alternate;
}

@keyframes et-aurora {
    from { opacity: .55; transform: scale(1); }
    to { opacity: 1; transform: scale(1.06); }
}

.et-app *,
.et-app *::before,
.et-app *::after { box-sizing: border-box; }

[hidden] { display: none !important; }

.et-icon {
    width: 18px;
    height: 18px;
    fill: none;
    stroke: currentColor;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
    flex: none;
}

/* ============ 顶栏 ============ */
.et-topbar {
    flex: none;
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 11px 20px;
    border-bottom: 1px solid var(--et-line);
    background: var(--et-glass);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    z-index: 20;
}

.et-brand {
    display: flex;
    align-items: center;
    gap: 10px;
    min-width: 0;
}

.et-brand__dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: var(--et-accent);
    box-shadow: 0 0 0 4px var(--et-accent-weak);
    flex: none;
}

.et-brand__name {
    font-weight: 800;
    font-size: 15px;
    letter-spacing: -.01em;
    white-space: nowrap;
}

.et-brand__sub {
    font-size: 12.5px;
    color: var(--et-muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.et-status {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 5px 14px;
    border-radius: 999px;
    font-size: 12.5px;
    color: var(--et-muted);
    background: var(--et-surface-2);
    border: 1px solid var(--et-line);
    white-space: nowrap;
    max-width: 42vw;
    overflow: hidden;
    text-overflow: ellipsis;
}

.et-status__dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--et-ok);
    flex: none;
    transition: background .2s;
}

.et-status[data-tone="err"] .et-status__dot { background: var(--et-err); }
.et-status[data-tone="warn"] .et-status__dot { background: var(--et-warn); }

.et-actions {
    display: flex;
    align-items: center;
    gap: 7px;
}

.et-icon-btn {
    display: inline-grid;
    place-items: center;
    width: 38px;
    height: 38px;
    font-size: 16px;
    line-height: 1;
    border-radius: 11px;
    border: 1px solid var(--et-line);
    background: var(--et-surface-2);
    color: var(--et-fg);
    cursor: pointer;
    transition: transform .14s, border-color .14s, color .14s, opacity .14s;
    -webkit-tap-highlight-color: transparent;
}

.et-icon-btn:hover {
    border-color: var(--et-accent);
    color: var(--et-accent);
    transform: translateY(-1px);
}

.et-icon-btn:active { transform: translateY(0); }
.et-icon-btn.is-off { opacity: .4; }
.et-icon-btn:focus-visible { outline: 2px solid var(--et-accent); outline-offset: 2px; }

/* ============ 主区默认 ============ */
.et-main {
    flex: 1;
    min-height: 0;
    position: relative;
    overflow: auto;
}

/* ============ 页脚（品牌回流 L2） ============ */
.et-footer {
    flex: none;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 7px 16px;
    font-size: 12px;
    color: var(--et-muted);
    border-top: 1px solid var(--et-line);
    background: var(--et-glass);
    user-select: none;
    z-index: 20;
}

.et-footer a {
    color: inherit;
    text-decoration: none;
    transition: color .14s;
}

.et-footer a:hover { color: var(--et-accent); }

/* ============ 按钮 ============ */
.et-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
    padding: 9px 16px;
    border-radius: 11px;
    font: inherit;
    font-size: 13.5px;
    font-weight: 700;
    border: 1px solid var(--et-line);
    background: var(--et-surface-2);
    color: var(--et-fg);
    cursor: pointer;
    transition: transform .14s, border-color .14s, color .14s, background .14s, box-shadow .14s;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
}

.et-btn:hover {
    border-color: var(--et-accent);
    color: var(--et-accent);
    transform: translateY(-1px);
}

.et-btn:active { transform: translateY(0); }
.et-btn:focus-visible { outline: 2px solid var(--et-accent); outline-offset: 2px; }
.et-btn:disabled { opacity: .45; cursor: not-allowed; transform: none; }

.et-btn--primary {
    background: var(--et-accent);
    border-color: var(--et-accent);
    color: #fff;
    box-shadow: 0 6px 18px -8px var(--et-accent);
}

.et-btn--primary:hover { color: #fff; filter: brightness(1.08); }
.et-btn--primary:disabled { filter: none; }

.et-btn--danger:hover {
    border-color: var(--et-err);
    color: var(--et-err);
}

.et-btn--lg {
    padding: 13px 26px;
    font-size: 16px;
    border-radius: 14px;
}

/* ============ 弹窗 ============ */
.et-modal {
    position: fixed;
    inset: 0;
    z-index: 100;
    display: grid;
    place-items: center;
    padding: 24px;
    background: rgba(2, 6, 23, .55);
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    animation: et-fade .18s ease;
}

.et-modal__panel {
    width: min(680px, 94vw);
    max-height: 86vh;
    max-height: 86dvh;
    display: flex;
    flex-direction: column;
    background: var(--et-surface);
    border: 1px solid var(--et-line);
    border-radius: 16px;
    box-shadow: var(--et-shadow-lg);
    animation: et-pop .2s cubic-bezier(.34, 1.4, .64, 1);
    overflow: hidden;
}

.et-modal__panel--narrow { width: min(460px, 92vw); }
.et-modal__panel--wide { width: min(900px, 94vw); }

.et-modal__head {
    flex: none;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 16px 20px;
    border-bottom: 1px solid var(--et-line);
    font-weight: 800;
    font-size: 15px;
}

.et-modal__head .et-icon-btn {
    margin-left: auto;
    width: 32px;
    height: 32px;
}

.et-modal__body {
    flex: 1;
    min-height: 0;
    overflow: auto;
    padding: 18px 20px;
}

.et-modal__foot {
    flex: none;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 14px 20px;
    border-top: 1px solid var(--et-line);
    background: var(--et-surface-2);
}

.et-modal__foot .spacer { flex: 1; }

@keyframes et-fade {
    from { opacity: 0; }
}

@keyframes et-pop {
    from { opacity: 0; transform: translateY(14px) scale(.97); }
}

/* ============ 轻提示（toast） ============ */
.et-toast {
    position: fixed;
    left: 50%;
    bottom: 56px;
    transform: translateX(-50%) translateY(10px);
    z-index: 120;
    display: flex;
    align-items: center;
    gap: 9px;
    max-width: min(520px, 88vw);
    padding: 11px 18px;
    border-radius: 12px;
    font-size: 13.5px;
    font-weight: 600;
    color: #fff;
    background: rgba(15, 23, 42, .92);
    border: 1px solid rgba(148, 163, 184, .25);
    box-shadow: var(--et-shadow-lg);
    opacity: 0;
    pointer-events: none;
    transition: opacity .22s, transform .22s;
}

.et-toast.is-show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
}

.et-toast[data-tone="ok"] { background: rgba(5, 150, 105, .95); }
.et-toast[data-tone="err"] { background: rgba(220, 38, 38, .95); }
.et-toast[data-tone="warn"] { background: rgba(217, 119, 6, .95); }

/* ============ 设置抽屉（右上角入口，edupick 交互） ============ */
.et-drawer-backdrop {
    position: fixed;
    inset: 0;
    z-index: 90;
    background: rgba(2, 6, 23, .45);
    backdrop-filter: blur(3px);
    -webkit-backdrop-filter: blur(3px);
    opacity: 0;
    transition: opacity .2s;
}

.et-drawer-backdrop.is-open { opacity: 1; }

.et-drawer {
    position: absolute;
    top: 0;
    right: 0;
    height: 100%;
    width: min(400px, 92vw);
    display: flex;
    flex-direction: column;
    background: var(--et-surface);
    border-left: 1px solid var(--et-line);
    box-shadow: var(--et-shadow-lg);
    transform: translateX(100%);
    transition: transform .22s cubic-bezier(.32, .72, .35, 1);
}

.et-drawer-backdrop.is-open .et-drawer { transform: translateX(0); }

.et-drawer__head {
    flex: none;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 15px 18px;
    border-bottom: 1px solid var(--et-line);
    font-weight: 800;
    font-size: 15px;
    color: var(--et-accent);
}

.et-drawer__head .et-icon-btn {
    margin-left: auto;
    width: 32px;
    height: 32px;
}

.et-drawer__body {
    flex: 1;
    min-height: 0;
    overflow: auto;
    padding: 16px 18px 24px;
}

/* 抽屉内容通用小节（工具复用） */
.et-drawer__body h4 {
    margin: 18px 0 8px;
    font-size: 12px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: .08em;
    color: var(--et-muted);
}

.et-drawer__body h4:first-child { margin-top: 0; }

.et-drawer__row {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
}

.et-drawer__tip {
    margin: 8px 0 0;
    font-size: 12px;
    line-height: 1.8;
    color: var(--et-muted);
}

.et-drawer__tip b { color: var(--et-fg); }

.et-drawer__input {
    flex: 1;
    min-width: 0;
    padding: 9px 12px;
    border: 1px solid var(--et-line-strong);
    border-radius: 9px;
    background: var(--et-surface-2);
    color: var(--et-fg);
    font: inherit;
    font-size: 13.5px;
    transition: border-color .14s, box-shadow .14s;
}

.et-drawer__input:focus {
    outline: none;
    border-color: var(--et-accent);
    box-shadow: 0 0 0 3px var(--et-accent-weak);
}

.et-drawer__switch {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 10px 0;
    border-bottom: 1px dashed var(--et-line);
    font-size: 13.5px;
    font-weight: 600;
    color: var(--et-fg);
    cursor: pointer;
    user-select: none;
}

.et-drawer__switch input {
    width: 17px;
    height: 17px;
    accent-color: var(--et-accent);
    cursor: pointer;
}
</style>

            if (ev.target === backdrop) { close(); }
        });

        if (typeof build === 'function') {
            /* 兼容两种约定：build 自己往 body 里塞内容，或 return 一个元素节点 */
            var ret = build(body, { close: close });
            if (ret && ret.nodeType === 1 && ret.parentNode !== body) {
                body.appendChild(ret);
            }
        }
        return { body: body, close: close };
    }

    /* ---------- 通用弹窗 / toast（同时挂模块级，供其他共享组件使用） ---------- */

    function modal(mo) {
        var backdrop = el('div', 'et-modal');
        var panel = el('div', 'et-modal__panel' + (mo.size === 'narrow' ? ' et-modal__panel--narrow'
            : mo.size === 'wide' ? ' et-modal__panel--wide' : ''));
        var head = el('div', 'et-modal__head');
        if (mo.icon) { head.appendChild(makeIcon(mo.icon)); }
        head.appendChild(el('span', null, mo.title || ''));
        head.appendChild(makeBtn('i-x', '关闭', close));
        panel.appendChild(head);

        var body = el('div', 'et-modal__body');
        if (typeof mo.body === 'string') { body.innerHTML = mo.body; }
        else if (mo.body) { body.appendChild(mo.body); }
        panel.appendChild(body);

        var foot = null;
        if (mo.buttons && mo.buttons.length) {
            foot = el('div', 'et-modal__foot');
            foot.appendChild(el('span', 'spacer'));
            mo.buttons.forEach(function (b) {
                var btn = el('button', 'et-btn' + (b.primary ? ' et-btn--primary' : '') + (b.danger ? ' et-btn--danger' : ''), b.label);
                btn.type = 'button';
                btn.addEventListener('click', function () {
                    if (b.onClick) { b.onClick(close); } else { close(); }
                });
                foot.appendChild(btn);
            });
            panel.appendChild(foot);
        }

        backdrop.appendChild(panel);
        document.body.appendChild(backdrop);

        function close() {
            if (backdrop.parentNode) { backdrop.parentNode.removeChild(backdrop); }
            document.removeEventListener('keydown', onKey);
            if (mo.onClose) { mo.onClose(); }
        }
        function onKey(ev) {
            if (ev.key === 'Escape') { ev.stopPropagation(); close(); }
        }
        document.addEventListener('keydown', onKey);
        backdrop.addEventListener('mousedown', function (ev) {
            if (ev.target === backdrop) { close(); }
        });

        return { panel: panel, body: body, foot: foot, close: close };
    }

    var toastEl = null;
    var toastTimer = 0;

    function toast(msg, tone) {
        if (!toastEl) {
            toastEl = el('div', 'et-toast');
            document.body.appendChild(toastEl);
        }
        toastEl.textContent = msg;
        toastEl.setAttribute('data-tone', tone || '');
        void toastEl.offsetWidth;
        toastEl.classList.add('is-show');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(function () { toastEl.classList.remove('is-show'); }, 2200);
    }

    /* ---------- PWA 元数据（blob manifest，环境不支持时静默跳过） ---------- */

    function installPwa(toolId, title, accent) {
        try {
            var theme = document.querySelector('meta[name="theme-color"]');
            if (!theme) {
                theme = document.createElement('meta');
                theme.setAttribute('name', 'theme-color');
                document.head.appendChild(theme);
            }
            theme.setAttribute('content', accent || '#2563eb');

            var svg = '<svg xmlns="' + NS_SVG + '" viewBox="0 0 64 64">' +
                '<rect width="64" height="64" rx="14" fill="' + (accent || '#2563eb') + '"/>' +
                '<text x="32" y="43" font-size="32" font-weight="800" font-family="sans-serif" ' +
                'fill="#fff" text-anchor="middle">' + (title || '课').charAt(0) + '</text></svg>';
            var iconUri = 'data:image/svg+xml,' + encodeURIComponent(svg);

            var mf = {
                name: title || 'KeeTools 课工具',
                short_name: title || '课工具',
                start_url: '.',
                display: 'standalone',
                background_color: '#f4f6fb',
                theme_color: accent || '#2563eb',
                icons: [{ src: iconUri, sizes: 'any', type: 'image/svg+xml', purpose: 'any' }]
            };
            var blob = new Blob([JSON.stringify(mf)], { type: 'application/manifest+json' });
            var link = document.createElement('link');
            link.rel = 'manifest';
            link.href = URL.createObjectURL(blob);
            document.head.appendChild(link);
        } catch (err) { /* 不支持 PWA 元数据的环境静默跳过 */ }
    }

    /* ---------- 挂载 ---------- */

    function mount(options) {
        var opt = options || {};
        var toolId = opt.toolId || 'unknown-tool';
        var store = global.ET && global.ET.store
            ? global.ET.store(toolId)
            : (function () { return { get: function () { return null; }, set: function () {} }; })();

        var api = { toolId: toolId, store: store };
        var soundEnabled = store.get('sound', true) !== false;

        /* 主题色 */
        if (opt.accent) {
            document.documentElement.style.setProperty('--et-accent', opt.accent);
        }

        installPwa(toolId, opt.title, opt.accent);

        /* ---------- 主题 ---------- */
        var theme = store.get('theme', null);
        if (theme !== 'dark' && theme !== 'light') {
            theme = (global.matchMedia && global.matchMedia('(prefers-color-scheme: dark)').matches)
                ? 'dark' : 'light';
        }
        applyTheme(theme);

        function applyTheme(t) {
            theme = t;
            document.documentElement.setAttribute('data-et-theme', t);
            store.set('theme', t);
            if (themeBtn) {
                themeBtn.innerHTML = '';
                themeBtn.appendChild(makeIcon(t === 'dark' ? 'i-sun' : 'i-moon'));
                themeBtn.title = t === 'dark' ? '切换到浅色' : '切换到深色';
            }
        }

        /* ---------- 顶栏 ---------- */
        var topbar = document.getElementById('et-topbar');
        var main = document.getElementById('et-main');
        var footer = document.getElementById('et-footer');

        if (!topbar) { topbar = el('header'); topbar.id = 'et-topbar'; document.body.insertBefore(topbar, document.body.firstChild); }
        if (!main) { main = el('main'); main.id = 'et-main'; topbar.after(main); }
        if (!footer) { footer = el('footer'); footer.id = 'et-footer'; document.body.appendChild(footer); }

        topbar.className = 'et-topbar';
        main.classList.add('et-main');
        footer.className = 'et-footer';

        /* 品牌 */
        var brand = el('div', 'et-brand');
        brand.appendChild(el('span', 'et-brand__dot'));
        var nameWrap = el('div');
        nameWrap.style.cssText = 'min-width:0;line-height:1.25';
        nameWrap.appendChild(el('div', 'et-brand__name', opt.title || '课工具'));
        if (opt.sub) { nameWrap.appendChild(el('div', 'et-brand__sub', opt.sub)); }
        brand.appendChild(nameWrap);
        topbar.appendChild(brand);

        /* 状态胶囊 */
        var statusPill = el('div', 'et-status');
        statusPill.hidden = true;
        statusPill.appendChild(el('span', 'et-status__dot'));
        var statusText = el('span', null, '');
        statusPill.appendChild(statusText);
        topbar.appendChild(statusPill);

        api.setStatus = function (text, tone) {
            if (!text) { statusPill.hidden = true; return; }
            statusText.textContent = text;
            statusPill.setAttribute('data-tone', tone || 'ok');
            statusPill.hidden = false;
        };
        if (opt.status) { api.setStatus(opt.status); }

        /* 动作区（edupick 交互：右上角聚合设置入口） */
        var actions = el('div', 'et-actions');

        var settingsBtn = null;
        if (opt.settings && typeof opt.settings.build === 'function') {
            settingsBtn = makeBtn('i-sliders', opt.settings.title || '设置', function () {
                openDrawer(opt.settings.title || '设置', function (body, drawerApi) {
                    return opt.settings.build(body, { api: api, close: drawerApi.close });
                });
            });
            actions.appendChild(settingsBtn);
        }

        (opt.actions || []).forEach(function (a) {
            var b = makeBtn(a.icon, a.label || '', a.onClick);
            if (a.id) { b.id = a.id; }
            actions.appendChild(b);
        });

        var soundBtn = null;
        if (opt.sound) {
            soundBtn = makeBtn(soundEnabled ? 'i-volume' : 'i-volume-off',
                soundEnabled ? '关闭音效' : '开启音效', toggleSound);
            if (!soundEnabled) { soundBtn.classList.add('is-off'); }
            actions.appendChild(soundBtn);
        }

        if (opt.help) {
            actions.appendChild(makeBtn('i-help', '使用说明', function () { openHelp(); }));
        }

        var themeBtn = makeBtn('', '切换主题', function () {
            applyTheme(theme === 'dark' ? 'light' : 'dark');
        });
        applyTheme(theme); /* 填充图标 */
        actions.appendChild(themeBtn);

        /* 全屏按钮始终保留：iframe 内对本工具文档 requestFullscreen
           （宿主 iframe 已声明 allow="fullscreen"），与宿主「全屏体验」等效同屏。 */
        var fsBtn = makeBtn('i-maximize', '全屏', toggleFullscreen);
        actions.appendChild(fsBtn);

        topbar.appendChild(actions);

        function toggleSound() {
            soundEnabled = !soundEnabled;
            store.set('sound', soundEnabled);
            soundBtn.innerHTML = '';
            soundBtn.appendChild(makeIcon(soundEnabled ? 'i-volume' : 'i-volume-off'));
            soundBtn.title = soundEnabled ? '关闭音效' : '开启音效';
            soundBtn.classList.toggle('is-off', !soundEnabled);
            if (soundEnabled) { api.beep('ok'); }
        }

        api.openSettings = function () {
            if (settingsBtn) { settingsBtn.click(); }
        };

        /* ---------- 全屏（iframe 内委托宿主，避免双层全屏） ---------- */

        function inIframe() {
            try { return global.parent && global.parent !== global; } catch (err) { return true; }
        }

        function toggleFullscreen() {
            var root = document.documentElement;
            var fsEl = document.fullscreenElement || document.webkitFullscreenElement || null;
            if (fsEl) {
                (document.exitFullscreen || document.webkitExitFullscreen || function () {}).call(document);
            } else {
                var req = root.requestFullscreen || root.webkitRequestFullscreen;
                if (req) { try { req.call(root); } catch (err) { /* 忽略 */ } }
            }
        }

        function syncFsIcon(on) {
            if (!fsBtn) { return; }
            fsBtn.innerHTML = '';
            fsBtn.appendChild(makeIcon(on ? 'i-minimize' : 'i-maximize'));
            fsBtn.title = on ? '退出全屏' : '全屏';
        }

        document.addEventListener('fullscreenchange', function () {
            syncFsIcon(!!(document.fullscreenElement || document.webkitFullscreenElement));
        });
        document.addEventListener('webkitfullscreenchange', function () {
            syncFsIcon(!!(document.fullscreenElement || document.webkitFullscreenElement));
        });
        syncFsIcon(false);

        api.toggleFullscreen = toggleFullscreen;

        /* ---------- 音效 API ---------- */
        api.beep = function (kind) {
            if (!soundEnabled) { return; }
            playBeep(kind);
        };
        api.soundOn = function () { return soundEnabled; };

        api.modal = modal;

        /* ---------- 帮助 ---------- */
        function openHelp() {
            modal({
                title: '使用说明',
                icon: 'i-help',
                size: 'narrow',
                body: opt.help,
                buttons: [{ label: '知道了', primary: true }]
            });
        }
        api.openHelp = openHelp;

        /* ---------- toast ---------- */
        api.toast = toast;

        /* ---------- 页脚（L2 品牌回流，低调一行） ---------- */
        var siteOrigin = typeof global.ET_SITE_ORIGIN === 'string' && /^https?:\/\//.test(global.ET_SITE_ORIGIN)
            ? global.ET_SITE_ORIGIN
            : null;

        function renderFooter() {
            footer.textContent = '';
            footer.appendChild(el('span', null, 'KeeTools 课工具'));
            footer.appendChild(el('span', null, '·'));
            if (siteOrigin) {
                var a = el('a', null, '更多课堂工具');
                a.href = siteOrigin + '/?from=tool-footer&tool=' + encodeURIComponent(toolId);
                a.target = '_blank';
                a.rel = 'noopener';
                footer.appendChild(a);
            } else {
                footer.appendChild(el('span', null, '更多课堂工具'));
            }
        }
        renderFooter();

        /* 站点来源发现：iframe 内向父窗口询问；也可由宿主直接注入 ET_SITE_ORIGIN */
        try {
            if (global.parent && global.parent !== global) {
                global.parent.postMessage(JSON.stringify({ type: 'et-hello', toolId: toolId }), '*');
            }
        } catch (err) { /* 跨域异常忽略 */ }

        global.addEventListener('message', function (ev) {
            var data = ev.data;
            if (typeof data === 'string') {
                try { data = JSON.parse(data); } catch (err) { return; }
            }
            if (!data || typeof data !== 'object') { return; }

            if (data.type === 'et-origin' && typeof data.origin === 'string' && /^https?:\/\//.test(data.origin)) {
                siteOrigin = data.origin;
                if (!global.ET_SITE_ORIGIN) { global.ET_SITE_ORIGIN = data.origin; }
                renderFooter();
            }
            if (data.type === 'et-fullscreen-change' && typeof data.value === 'boolean') {
                syncFsIcon(data.value);
            }
        });

        api.el = { topbar: topbar, main: main, footer: footer, actions: actions };

        /* ---------- 激光笔 / 翻页笔适配（HID 翻页键） ----------
         * 翻页笔的上下页键在系统层等价于 PageDown / PageUp。
         * 工具通过 opt.primary / opt.secondary 注册动作：
         *   PageDown → primary（主操作，如开始点名 / 开始计时）
         *   PageUp   → secondary（副操作，缺省时同 primary）
         * 输入框聚焦或弹窗/抽屉打开时不响应，避免误触。 */
        if (typeof opt.primary === 'function') {
            document.addEventListener('keydown', function (ev) {
                if (ev.key !== 'PageDown' && ev.key !== 'PageUp') { return; }
                var tag = (document.activeElement && document.activeElement.tagName) || '';
                if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') { return; }
                if (document.querySelector('.et-modal, .et-drawer-backdrop, .ws-winner')) { return; }
                ev.preventDefault();
                if (ev.key === 'PageDown') { opt.primary(); }
                else if (typeof opt.secondary === 'function') { opt.secondary(); }
                else { opt.primary(); }
            });
        }

        return api;
    }

    global.ET = global.ET || {};
    global.ET.Chrome = {
        mount: mount,
        modal: modal,
        toast: toast,
        beep: playBeep /* 挂载前的独立音效入口（不经过音效开关） */
    };
})(window);
</script>

<script>
  /* 此块由 scripts/sync_shared.py 自动注入，请勿手工修改 */
/*!
 * et-stats.js — 使用统计模块（模块化，可整体移除）
 *
 * 共享逻辑源。改这里，然后跑：python scripts/sync_shared.py
 * 依赖：无（可脱离 et-util / et-chrome 独立运行）。
 * 全局：ET.Stats
 *
 * ┌────────────────────────────────────────────────────────────────┐
 * │ 说明：本模块只做一件事——工具被打开时向上报端点发一条匿名计数。 │
 * │ · 在线（iframe 内）：宿主页面已服务端计数，本模块不重复上报。   │
 * │ · 离线打开（file:// / 下载单文件 / 离线包）：联网条件具备时，   │
 * │   以 sendBeacon 上报 use_offline 事件（text/plain 免预检）。    │
 * │ · 上报端点 = window.ET_SITE_ORIGIN（由宿主注入或离线包配置）。  │
 * │   未配置端点时本模块完全静默，不发任何请求。                    │
 * │ · **整个 <script> 块可安全删除**：删除后工具其余功能完全正常，  │
 * │   且完全不再发起任何网络请求。                                  │
 * └────────────────────────────────────────────────────────────────┘
 */
(function (global) {
    'use strict';

    var ET = global.ET = global.ET || {};

    var Stats = {
        /** 上报端点来源（站点绝对地址，无协议尾斜杠） */
        endpoint: (typeof global.ET_SITE_ORIGIN === 'string' && /^https?:\/\//.test(global.ET_SITE_ORIGIN))
            ? global.ET_SITE_ORIGIN
            : null,

        _done: {},

        /**
         * 上报一次事件（同一事件同一工具每次页面加载只报一次）。
         * event: 'use_offline' 等；toolId: 工具 id。
         */
        send: function (event, toolId) {
            if (!event || this._done[event + ':' + (toolId || '')]) { return false; }
            if (!this.endpoint) { return false; }
            /* iframe 内由宿主统计，避免双计 */
            try {
                if (global.parent && global.parent !== global) { return false; }
            } catch (err) { return false; }
            /* 断网时挂起，网络恢复自动补报一次 */
            if (global.navigator && global.navigator.onLine === false) {
                var self = this;
                global.addEventListener('online', function () { self.send(event, toolId); }, { once: true });
                return false;
            }

            this._done[event + ':' + (toolId || '')] = true;
            var payload = JSON.stringify({ event: event, tool: toolId || '' });

            try {
                if (global.navigator.sendBeacon) {
                    return global.navigator.sendBeacon(
                        this.endpoint + '/api/track',
                        new Blob([payload], { type: 'text/plain;charset=UTF-8' })
                    );
                }
                global.fetch(this.endpoint + '/api/track', {
                    method: 'POST',
                    body: payload,
                    keepalive: true,
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'text/plain;charset=UTF-8' }
                });
                return true;
            } catch (err) {
                return false;
            }
        }
    };

    ET.Stats = Stats;
})(window);
</script>

    /* ============================================================
       Canvas 几何系统：血管用三次贝塞尔链定义，重采样为等距点列，
       既用于绘制管腔，也用于驱动血细胞按弧长匀速流动。
       画布逻辑坐标 900×600，图左为右心、图右为左心（解剖位）。
       血流方向：右心室 → 肺动脉（分左右两支）→ 肺毛细血管 → 肺静脉
                 → 左心房 → 左心室 → 主动脉 → 全身毛细血管 → 腔静脉 → 右心房
       ============================================================ */

    function bez(p0, c1, c2, p1, t) {
        var u = 1 - t, a = u * u * u, b = 3 * u * u * t, c = 3 * u * t * t, d = t * t * t;
        return {
            x: a * p0[0] + b * c1[0] + c * c2[0] + d * p1[0],
            y: a * p0[1] + b * c1[1] + c * c2[1] + d * p1[1]
        };
    }

    /* 贝塞尔链 → 等距点列（step px），保证血细胞全程匀速 */
    function samplePath(start, segs, step) {
        var raw = [{ x: start[0], y: start[1] }];
        var prev = start;
        var i, k;
        for (i = 0; i < segs.length; i++) {
            var s = segs[i];
            for (k = 1; k <= 26; k++) {
                raw.push(bez(prev, s[0], s[1], s[2], k / 26));
            }
            prev = s[2];
        }
        var total = 0;
        for (i = 1; i < raw.length; i++) {
            total += Math.hypot(raw[i].x - raw[i - 1].x, raw[i].y - raw[i - 1].y);
        }
        var pts = [{ x: raw[0].x, y: raw[0].y }];
        if (total > 0 && step > 0) {
            var target = 0, acc = 0;
            for (i = 1; i < raw.length; i++) {
                var dx = raw[i].x - raw[i - 1].x, dy = raw[i].y - raw[i - 1].y;
                var d = Math.hypot(dx, dy);
                while (acc + d >= target + step) {
                    target += step;
                    var r = (target - acc) / d;
                    pts.push({ x: raw[i - 1].x + dx * r, y: raw[i - 1].y + dy * r });
                }
                acc += d;
            }
            var last = pts[pts.length - 1], tail = raw[raw.length - 1];
            if (Math.hypot(tail.x - last.x, tail.y - last.y) > step * 0.35) {
                pts.push({ x: tail.x, y: tail.y });
            }
        }
        return { pts: pts, len: total };
    }

        return 'rgb(' + Math.round(a[0] + (b[0] - a[0]) * f) + ',' +

        c.arcTo(x + w, y + h, x, y + h, r);

            }
        }
        strokePoly(p.pts, 'rgba(255,255,255,.22)', Math.max(1.4, p.w * 0.34));
        ctx.globalAlpha = 1;
    }

    function label(text, x, y, size, color, align, weight) {
        ctx.font = (weight || 800) + ' ' + size +
            'px -apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif';
        ctx.textAlign = align || 'center';
        ctx.fillStyle = color;
        ctx.fillText(text, x, y);
    }

    function drawSilhouette(pal) {
        /* 头 */
        ctx.beginPath();
        ctx.arc(450, 62, 34, 0, Math.PI * 2);
        ctx.fillStyle = pal.silFill;
        ctx.fill();
        ctx.strokeStyle = pal.silStroke;
        ctx.lineWidth = 2.5;
        ctx.stroke();
        /* 颈 */
        ctx.fillStyle = pal.neckFill;
        ctx.fillRect(436, 92, 28, 24);
        /* 躯干 */
        ctx.beginPath();
        ctx.moveTo(356, 116);
        ctx.bezierCurveTo(386, 102, 514, 102, 544, 116);
        ctx.bezierCurveTo(572, 124, 586, 146, 588, 190);
        ctx.bezierCurveTo(590, 280, 586, 360, 592, 470);
        ctx.bezierCurveTo(595, 522, 590, 542, 574, 548);
        ctx.bezierCurveTo(496, 568, 404, 568, 326, 548);
        ctx.bezierCurveTo(310, 542, 305, 522, 308, 470);
        ctx.bezierCurveTo(314, 360, 310, 280, 312, 190);
        ctx.bezierCurveTo(314, 146, 328, 124, 356, 116);
        ctx.closePath();
        ctx.fillStyle = pal.silFill;
        ctx.fill();
        ctx.strokeStyle = pal.silStroke;
        ctx.lineWidth = 2.5;
        ctx.stroke();
    }

    function drawTrachea() {
        ctx.lineCap = 'round';
        ctx.strokeStyle = '#fb7185';
        ctx.lineWidth = 5;
        ctx.beginPath();
        ctx.moveTo(450, 102);
        ctx.lineTo(450, 134);
        ctx.stroke();
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.moveTo(450, 134);
        ctx.bezierCurveTo(438, 142, 434, 146, 428, 150);
        ctx.moveTo(450, 134);
        ctx.bezierCurveTo(462, 142, 466, 146, 472, 150);
        ctx.stroke();
    }

    function drawLungs(pal, alpha) {
        if (alpha <= 0.01) { return; }
        ctx.globalAlpha = alpha;
        ctx.fillStyle = pal.lungFill;
        ctx.fill(LOBE_L);
        ctx.fill(LOBE_R);
        /* 肺泡纹理 */
        ctx.fillStyle = pal.alv;
        for (var i = 0; i < ALVEOLI.length; i++) {
            ctx.beginPath();
            ctx.arc(ALVEOLI[i].x, ALVEOLI[i].y, ALVEOLI[i].r, 0, Math.PI * 2);
            ctx.fill();
        }
        ctx.strokeStyle = pal.lungStroke;
        ctx.lineWidth = 3.5;
        ctx.stroke(LOBE_L);
        ctx.stroke(LOBE_R);
        ctx.globalAlpha = 1;
    }

    function drawTissue(pal, alpha) {
        if (alpha <= 0.01) { return; }
        ctx.globalAlpha = alpha;
        ctx.fillStyle = pal.tissueFill;
        ctx.fill(BODY_ZONE);
        /* 毛细血管网 */
        ctx.strokeStyle = pal.net;
        ctx.lineWidth = 1.4;
        ctx.beginPath();
        for (var x = 336; x <= 564; x += 28) {
            ctx.moveTo(x, 448);
            ctx.lineTo(x, 512);
        }
        var ys = [456, 479, 502];
        for (var i = 0; i < 3; i++) {
            ctx.moveTo(318, ys[i]);
            ctx.lineTo(582, ys[i]);
        }
        ctx.stroke();
        ctx.strokeStyle = pal.tissueStroke;
        ctx.lineWidth = 3;
        ctx.stroke(BODY_ZONE);
        ctx.globalAlpha = 1;
    }

    var CHAMBERS = [
        { part: 'ra', x: 396, y: 298, w: 52, h: 50, n: '右心房', right: true },
        { part: 'rv', x: 396, y: 352, w: 52, h: 54, n: '右心室', right: true },
        { part: 'la', x: 458, y: 298, w: 52, h: 50, n: '左心房', right: false },
        { part: 'lv', x: 458, y: 352, w: 52, h: 54, n: '左心室', right: false }
    ];

    function drawHeart(pal, pulse) {
        ctx.save();
        var s = 1 + 0.028 * pulse;   /* 心室搏动缩放 */
        ctx.translate(452, 350);
        ctx.scale(s, s);
        ctx.translate(-452, -350);

        /* 心外膜 */
        ctx.beginPath();
        ctx.moveTo(398, 292);
        ctx.bezierCurveTo(382, 298, 374, 326, 380, 354);
        ctx.bezierCurveTo(386, 390, 414, 414, 452, 414);
        ctx.bezierCurveTo(490, 414, 518, 390, 524, 354);
        ctx.bezierCurveTo(530, 326, 522, 298, 506, 292);
        ctx.bezierCurveTo(490, 286, 472, 290, 452, 294);
        ctx.bezierCurveTo(432, 288, 414, 286, 398, 292);
        ctx.closePath();
        ctx.fillStyle = pal.heartFill;
        ctx.fill();
        ctx.strokeStyle = pal.heartStroke;
        ctx.lineWidth = 3;
        ctx.stroke();

        /* 四腔 */
        var i, c;
        for (i = 0; i < 4; i++) {
            c = CHAMBERS[i];
            ctx.beginPath();
            rr(ctx, c.x, c.y, c.w, c.h, 12);
            ctx.fillStyle = c.right ? pal.chR : pal.chL;
            ctx.fill();
            ctx.strokeStyle = c.right ? pal.chRStroke : pal.chLStroke;
            ctx.lineWidth = 2.2;
            ctx.stroke();
        }

        /* 房间隔 / 室间隔 */
        ctx.strokeStyle = pal.heartStroke;
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(454, 296);
        ctx.lineTo(454, 406);
        ctx.stroke();

        /* 心腔内血流（房 → 室） */
        tube(LA_LV, 0.8);
        tube(RA_RV, 0.8);

        /* 房室瓣（随心动周期开合） */
        var drop = 4 + pulse * 5;
        ctx.lineWidth = 2.4;
        ctx.strokeStyle = 'rgba(30,58,138,.75)';
        ctx.beginPath();
        ctx.moveTo(400, 352);
        ctx.lineTo(421, 352 + drop);
        ctx.moveTo(444, 352);
        ctx.lineTo(423, 352 + drop);
        ctx.stroke();
        ctx.strokeStyle = 'rgba(127,29,29,.75)';
        ctx.beginPath();
        ctx.moveTo(462, 352);
        ctx.lineTo(481, 352 + drop);
        ctx.moveTo(504, 352);
        ctx.lineTo(483, 352 + drop);
        ctx.stroke();

        /* 腔名 */
        for (i = 0; i < 4; i++) {
            c = CHAMBERS[i];
            label(c.n, c.x + c.w / 2, c.y + c.h / 2 + 4.5, 12, pal.chamberText, 'center', 700);
        }
        ctx.restore();
    }

    function drawLabels(pal) {
        label('肺（气体交换）', 598, 172, 15, pal.lungText, 'left');
        ctx.strokeStyle = pal.lungStroke;
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.moveTo(594, 168);
        ctx.lineTo(560, 178);
        ctx.stroke();

        label('主动脉', 598, 306, 14, pal.labRed, 'left');
        label('上、下腔静脉', 302, 322, 14, pal.labBlue, 'right');
        label('肺动脉', 396, 252, 14, pal.labBlue, 'right');
        label('肺静脉', 516, 292, 14, pal.labRed, 'left');
        label('心脏（图左为右心，图右为左心）', 452, 436, 12, pal.muted, 'center', 700);

        /* 组织细胞文字（小底 chip 压住网格线） */
        ctx.beginPath();
        rr(ctx, 450 - 116, 494, 232, 20, 10);
        ctx.fillStyle = pal.chip;
        ctx.fill();
        label('全身各处的组织细胞（毛细血管网）', 450, 508.5, 13, pal.tissueText, 'center');
    }

    /* ---------- O₂ / CO₂ 气体交换粒子 ---------- */

    var GAS_PTS = {
        lung: [[384, 192], [518, 192], [392, 212]],
        lungTop: [450, 96],
        body: [[512, 470], [450, 470], [388, 470]],
        bodyBottom: [[512, 506], [450, 508], [388, 506]]
    };

    function dot(x, y, r, color, alpha) {
        ctx.globalAlpha = alpha;
        ctx.beginPath();
        ctx.arc(x, y, r, 0, Math.PI * 2);
        ctx.fillStyle = color;
        ctx.fill();
        ctx.globalAlpha = 1;
    }

    function drawGas() {
        var i, ph, a, p, x, y;
        if (state.mode !== 'body') {
            /* 肺：O₂ 从气管进入肺泡，CO₂ 从肺泡排出 */
            for (i = 0; i < 3; i++) {
                ph = (gasT * 0.5 + i / 3) % 1;
                a = Math.sin(Math.PI * ph);
                p = GAS_PTS.lung[i];
                x = 450 + (p[0] - 450) * ph;
                y = 96 + (p[1] - 96) * ph;
                dot(x, y, 4, '#059669', a);
                x = p[0] + (450 - p[0]) * ph;
                y = p[1] + (96 - p[1]) * ph;
                dot(x, y, 4, '#64748b', a);
            }
        }
        if (state.mode !== 'lung') {
            /* 体：O₂ 从血液进入组织细胞，CO₂ 反向 */
            for (i = 0; i < 3; i++) {
                ph = (gasT * 0.5 + i / 3 + 0.17) % 1;
                a = Math.sin(Math.PI * ph);
                p = GAS_PTS.body[i];
                x = p[0];
                y = 470 + (p[1] - 470) * ph;
                dot(x, y, 4, '#059669', a);
                y = p[1] + (470 - p[1]) * ph;
                dot(x, y, 4, '#64748b', a);
            }
        }
    }

    /* ---------- 选中高亮 ---------- */

    function drawHighlight() {
        var part = state.sel;
        if (!PARTS[part]) { return; }
        ctx.save();
        ctx.shadowColor = 'rgba(185,28,28,.85)';
        ctx.shadowBlur = 13;
        var paths = HIGHLIGHT_PATHS[part];
        var i, c;
        if (paths) {
            ctx.strokeStyle = 'rgba(185,28,28,.9)';
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            for (i = 0; i < paths.length; i++) {
                strokePoly(paths[i].pts, 'rgba(185,28,28,.9)', paths[i].w + 2);
            }
        } else if (part === 'lung') {
            ctx.fillStyle = 'rgba(244,63,94,.3)';
            ctx.strokeStyle = '#fb7185';
            ctx.lineWidth = 4;
            ctx.fill(LOBE_L);
            ctx.stroke(LOBE_L);
            ctx.fill(LOBE_R);
            ctx.stroke(LOBE_R);
        } else if (part === 'body') {
            ctx.fillStyle = 'rgba(185,28,28,.16)';
            ctx.strokeStyle = '#fb7185';
            ctx.lineWidth = 4;
            ctx.fill(BODY_ZONE);
            ctx.stroke(BODY_ZONE);
        } else {
            for (i = 0; i < 4; i++) {
                c = CHAMBERS[i];
                if (c.part === part) {
                    ctx.fillStyle = 'rgba(185,28,28,.2)';
                    ctx.strokeStyle = '#fb7185';
                    ctx.lineWidth = 3.5;
                    ctx.beginPath();
                    rr(ctx, c.x - 3, c.y - 3, c.w + 6, c.h + 6, 14);
                    ctx.fill();
                    ctx.stroke();
                }
            }
        }
        ctx.restore();
    }

    /* ---------- 整帧渲染 ---------- */

    function render() {
        var pulse = Math.pow(Math.max(0, Math.sin(phase)), 2);
        var pal = palette();
        var dimLung = state.mode === 'body' ? 0.15 : 1;
        var dimBody = state.mode === 'lung' ? 0.15 : 1;

        ctx.setTransform(view.dpr * view.scale, 0, 0, view.dpr * view.scale, 0, 0);
        ctx.clearRect(0, 0, 900, 600);

        drawSilhouette(pal);
        drawTrachea();
        drawLungs(pal, dimLung);
        drawTissue(pal, dimBody);

        tube(RV_OUT, dimLung);
        tube(PA_L, dimLung);
        tube(PA_R, dimLung);
        tube(PV_L, dimLung);
        tube(PV_R, dimLung);
        tube(PV_IN, dimLung);
        tube(AORTA, dimBody);
        tube(CAP_BODY, dimBody);
        tube(VC, dimBody);

        drawHeart(pal, pulse);
        drawLabels(pal);
        drawCells();
        drawGas();
        drawHighlight();
    }

    /* ---------- 血细胞动画（沿闭合环路按弧长匀速流动） ---------- */

    function makeCells() {
        cells = [];
        var n = Math.max(20, Math.round(LOOP_LEN / 50));
        for (var i = 0; i < n; i++) {
            cells.push({
                s: i / n * LOOP_LEN,
                run: -1,
                b: i % 2,          /* 过肺时左右支交替 */
                x: -20, y: -20, col: RED, r: 4
            });
        }
    }

    function updateCells(dv) {
        for (var i = 0; i < cells.length; i++) {
            var c = cells[i];
            c.s += dv;
            if (c.s >= LOOP_LEN) {
                c.s -= LOOP_LEN;
                c.run = -1;
            }
            var loc = locate(c.s);
            var run = RUNS[loc.idx];
            if (run.type === 'b' && loc.idx !== c.run) {
                c.b = 1 - c.b;     /* 每经过一次肺循环换一边 */
            }
            c.run = loc.idx;
            var p = run.type === 'b'
                ? chainPos(c.b ? CHAIN_R : CHAIN_L, loc.f * run.len)
                : posOnPath(run.path, loc.f);
            c.x = p.x;
            c.y = p.y;
            c.col = p.col;
            c.r = Math.max(2.8, Math.min(4.8, p.w * 0.42));
        }
    }

    function drawCells() {
        for (var i = 0; i < cells.length; i++) {
            var c = cells[i];
            var run = RUNS[c.run];
            if (run && run.ring && state.mode !== 'all' && run.ring !== state.mode) { continue; }
            ctx.beginPath();
            ctx.arc(c.x, c.y, c.r, 0, Math.PI * 2);
            ctx.fillStyle = c.col;
            ctx.fill();
            ctx.strokeStyle = 'rgba(255,255,255,.8)';
            ctx.lineWidth = 1.3;
            ctx.stroke();
        }
    }

    function frame(ts) {
        rafId = requestAnimationFrame(frame);
        if (!lastTs) { lastTs = ts; }
        var dt = Math.min(0.05, (ts - lastTs) / 1000);
        lastTs = ts;
        if (state.playing) {
            updateCells((44 + state.speed * 26) * dt);
            phase += dt * (1.1 + state.speed * 0.4);
            gasT += dt * (0.55 + state.speed * 0.22);
        }
        render();
    }

    function startAnim() {
        if (rafId) { return; }
        lastTs = 0;
        rafId = requestAnimationFrame(frame);
    }

    function stopAnim() {
        if (rafId) {
            cancelAnimationFrame(rafId);
            rafId = null;
        }
    }

    /* ---------- 面板 ---------- */

    function renderPanel() {
        var p = PARTS[state.sel];
        var html = '';
        if (p) {
            html += '<div class="bc-name">' + p.n + '</div>';
            html += '<span class="bc-sub">' + p.scope + '</span>';
            html += '<p class="bc-fn">' + p.fn + '</p>';
            html += '<p class="bc-extra">' + p.tip + '</p>';
            if (p.kp) {
                html += '<p class="bc-kp"><span class="bc-kp__tag">考点</span>' + p.kp + '</p>';
            }
        }
        html += '<div class="bc-sec">循环的意义</div>' +
            '<p class="bc-fn">血液循环是一条<b>运送物质的运输线</b>：把氧气和养料送给全身细胞，' +
            '把二氧化碳等废物运走排出，同时协助运送激素、调节体温。心脏是「泵」，血管是「管道」，' +
            '瓣膜保证血液<b>只朝一个方向流</b>。</p>';
        html += '<div class="bc-sec">体循环路线</div><ul class="bc-route">' +
            '<li>左心室 → <b>主动脉</b> → 全身毛细血管 → 上、下腔静脉 → 右心房</li>' +
            '<li>血液变化：动脉血 → <b>静脉血</b></li></ul>';
        html += '<div class="bc-sec">肺循环路线</div><ul class="bc-route">' +
            '<li>右心室 → <b>肺动脉</b> → 肺部毛细血管 → 肺静脉 → 左心房</li>' +
            '<li>血液变化：静脉血 → <b>动脉血</b></li></ul>';
        html += '<div class="bc-sec">易错警示</div><ul class="bc-route bc-warn">' +
            '<li>肺动脉里流<b>静脉血</b>、肺静脉里流<b>动脉血</b>——判断血液性质看<b>含氧量</b>，不看血管名称。</li>' +
            '<li>血液性质发生变化的地方都是<b>毛细血管</b>，动脉与静脉里血液性质不变。</li>' +
            '<li>心脏<b>左侧</b>流动脉血、<b>右侧</b>流静脉血，口诀「左动右静」。</li>' +
            '<li>心室连<b>动脉</b>、心房连<b>静脉</b>；瓣膜（房室瓣 / 动脉瓣）保证血液不倒流。</li></ul>';
        html += '<div class="bc-sec">结构速查</div><div class="bc-list">';
        Object.keys(PARTS).forEach(function (k) {
            html += '<button class="bc-item' + (k === state.sel ? ' is-on' : '') +
                '" data-part-btn="' + k + '" type="button">' + PARTS[k].n + '</button>';
        });
        html += '</div>';
        els.panel.innerHTML = html;
        bindPanel();
    }

    function bindPanel() {
        var list = els.panel.querySelectorAll('[data-part-btn]');
        for (var i = 0; i < list.length; i++) {
            list[i].addEventListener('click', function () {
                selectPart(this.getAttribute('data-part-btn'));
            });
        }
    }

    function selectPart(k) {
        if (!PARTS[k]) { return; }
        state.sel = k;
        store.set('sel', k);
        renderPanel();
        chrome.setStatus(PARTS[k].n, 'ok');
    }

    /* ---------- 模式与播放 ---------- */

    function setMode(mode) {
        state.mode = mode;
        store.set('mode', mode);
        els.modeAll.classList.toggle('is-on', mode === 'all');
        els.modeBody.classList.toggle('is-on', mode === 'body');
        els.modeLung.classList.toggle('is-on', mode === 'lung');
        draw();
    }

    function togglePlay() {
        state.playing = !state.playing;
        store.set('playing', state.playing);
        els.btnPlay.textContent = state.playing ? '暂停动画' : '播放动画';
        els.btnPlay.classList.toggle('is-on', state.playing);
        chrome.setStatus(state.playing ? '动画播放中' : '动画已暂停', state.playing ? 'ok' : 'warn');
    }

    els.modeAll.addEventListener('click', function () { setMode('all'); });
    els.modeBody.addEventListener('click', function () { setMode('body'); });
    els.modeLung.addEventListener('click', function () { setMode('lung'); });
    els.btnPlay.addEventListener('click', togglePlay);

    els.speed.addEventListener('input', function () {
        state.speed = parseInt(els.speed.value, 10) || 3;
        store.set('speed', state.speed);
    });

    function toLogical(e) {
        var rect = els.canvas.getBoundingClientRect();
        return { x: (e.clientX - rect.left) / view.scale, y: (e.clientY - rect.top) / view.scale };
    }

    els.canvas.addEventListener('click', function (e) {
        var p = toLogical(e);
        var part = hitPart(p.x, p.y);
        if (part && PARTS[part]) { selectPart(part); }
    });

    els.canvas.addEventListener('mousemove', function (e) {
        var p = toLogical(e);
        els.canvas.style.cursor = hitPart(p.x, p.y) ? 'pointer' : 'default';
    });

    /* ---------- 舞台尺寸自适应（保持 900×600 逻辑坐标，DPR 感知） ---------- */

    function fit() {
        var stage = els.canvas.parentNode;
        var w = Math.max(60, stage.clientWidth - 20);
        var h = Math.max(60, stage.clientHeight - 20);
        var k = Math.max(0.1, Math.min(w / 900, h / 600));
        view.scale = k;
        view.dpr = window.devicePixelRatio || 1;
        els.canvas.style.width = (900 * k) + 'px';
        els.canvas.style.height = (600 * k) + 'px';
        els.canvas.width = Math.round(900 * k * view.dpr);
        els.canvas.height = Math.round(600 * k * view.dpr);
    }

    window.addEventListener('resize', fit);

    function isTypingTarget(node) {
        if (!node || !node.tagName) { return false; }
        var tag = node.tagName.toUpperCase();
        return tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT' || node.isContentEditable === true;
    }

    document.addEventListener('keydown', function (e) {
        if (isTypingTarget(e.target) || document.querySelector('.et-modal, .et-drawer-backdrop')) { return; }
        if (e.code === 'Space') {
            e.preventDefault();
            togglePlay();
        }
    });

    /* ---------- 启动（能力检测：无 Canvas 时提示并保持空白舞台） ---------- */

    els.speed.value = String(state.speed);
    els.btnPlay.textContent = state.playing ? '暂停动画' : '播放动画';
    els.btnPlay.classList.toggle('is-on', state.playing);
    els.modeAll.classList.toggle('is-on', state.mode === 'all');
    els.modeBody.classList.toggle('is-on', state.mode === 'body');
    els.modeLung.classList.toggle('is-on', state.mode === 'lung');

    fit();
    makeCells();
    renderPanel();

    if (!ctx) {
        chrome.setStatus('当前浏览器不支持 Canvas，无法显示动画', 'err');
    } else {
        startAnim();
    }
})();
</script>

</body>
</html>
