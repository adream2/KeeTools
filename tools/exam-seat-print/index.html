/* ============ 设计令牌 ============ */
:root {
    --et-accent: #2563eb;
    --et-accent-weak: rgba(37, 99, 235, .14);
    --et-bg: #f4f6fb;
    --et-surface: #ffffff;
    --et-surface-2: #f8fafc;
    --et-fg: #0b1220;
    --et-muted: #64748b;
    --et-line: rgba(15, 23, 42, .12);
    --et-line-strong: rgba(15, 23, 42, .22);
    --et-glass: rgba(255, 255, 255, .85);
    --et-shadow-md: 0 10px 28px -18px rgba(15, 23, 42, .3);
    --et-shadow-lg: 0 24px 60px -32px rgba(15, 23, 42, .4);
    --et-ok: #059669;
    --et-warn: #d97706;
    --et-err: #dc2626;
    --et-radius: 12px;
    --et-radius-sm: 9px;
    --et-font: -apple-system, BlinkMacSystemFont, "Segoe UI",
               "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei",
               "Noto Sans SC", sans-serif;
    --et-mono: ui-monospace, "Cascadia Mono", Consolas, Menlo, monospace;
}

html[data-et-theme="dark"] {
    --et-bg: #0b1120;
    --et-surface: #111a2e;
    --et-surface-2: #0f1729;
    --et-fg: #f1f5f9;
    --et-muted: #94a3b8;
    --et-line: rgba(148, 163, 184, .18);
    --et-line-strong: rgba(148, 163, 184, .3);
    --et-glass: rgba(17, 26, 46, .85);
    --et-shadow-md: 0 10px 34px -18px rgba(0, 0, 0, .8);
    --et-shadow-lg: 0 24px 70px -30px rgba(0, 0, 0, .9);
    --et-ok: #34d399;
    --et-warn: #fbbf24;
    --et-err: #f87171;
}

/* ============ 基础 ============ */

/* body 作为外壳时必须清掉浏览器默认 8px 外边距，
   否则 iframe 预览中文档会比视口高 16px（底部白边 + 多余滚动） */
body.et-app {
    margin: 0;
}

.et-app {
    position: relative;
    isolation: isolate;
    display: flex;
    flex-direction: column;
    height: 100vh;
    height: 100dvh;
    overflow: hidden;
    background: var(--et-bg);
    color: var(--et-fg);
    font-family: var(--et-font);
    -webkit-font-smoothing: antialiased;
    transition: background .25s, color .25s;
}

/* 极光背景：径向渐变 + 呼吸动画（edupick 品质基线，老内核也不掉帧） */
.et-app::before {
    content: '';
    position: fixed;
    inset: 0;
    z-index: -1;
    pointer-events: none;
    background:
        radial-gradient(46% 40% at 20% 18%, var(--et-accent-weak), transparent 65%),
        radial-gradient(42% 38% at 82% 24%, var(--et-accent-weak), transparent 70%),
        radial-gradient(50% 44% at 55% 95%, rgba(16, 185, 129, .10), transparent 65%);
    animation: et-aurora 16s ease-in-out infinite alternate;
}

@keyframes et-aurora {
    from { opacity: .55; transform: scale(1); }
    to { opacity: 1; transform: scale(1.06); }
}

.et-app *,
.et-app *::before,
.et-app *::after { box-sizing: border-box; }

[hidden] { display: none !important; }

.et-icon {
    width: 18px;
    height: 18px;
    fill: none;
    stroke: currentColor;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
    flex: none;
}

/* ============ 顶栏 ============ */
.et-topbar {
    flex: none;
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 11px 20px;
    border-bottom: 1px solid var(--et-line);
    background: var(--et-glass);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    z-index: 20;
}

.et-brand {
    display: flex;
    align-items: center;
    gap: 10px;
    min-width: 0;
}

.et-brand__dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: var(--et-accent);
    box-shadow: 0 0 0 4px var(--et-accent-weak);
    flex: none;
}

.et-brand__name {
    font-weight: 800;
    font-size: 15px;
    letter-spacing: -.01em;
    white-space: nowrap;
}

.et-brand__sub {
    font-size: 12.5px;
    color: var(--et-muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.et-status {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 5px 14px;
    border-radius: 999px;
    font-size: 12.5px;
    color: var(--et-muted);
    background: var(--et-surface-2);
    border: 1px solid var(--et-line);
    white-space: nowrap;
    max-width: 42vw;
    overflow: hidden;
    text-overflow: ellipsis;
}

.et-status__dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--et-ok);
    flex: none;
    transition: background .2s;
}

.et-status[data-tone="err"] .et-status__dot { background: var(--et-err); }
.et-status[data-tone="warn"] .et-status__dot { background: var(--et-warn); }

.et-actions {
    display: flex;
    align-items: center;
    gap: 7px;
}

.et-icon-btn {
    display: inline-grid;
    place-items: center;
    width: 38px;
    height: 38px;
    font-size: 16px;
    line-height: 1;
    border-radius: 11px;
    border: 1px solid var(--et-line);
    background: var(--et-surface-2);
    color: var(--et-fg);
    cursor: pointer;
    transition: transform .14s, border-color .14s, color .14s, opacity .14s;
    -webkit-tap-highlight-color: transparent;
}

.et-icon-btn:hover {
    border-color: var(--et-accent);
    color: var(--et-accent);
    transform: translateY(-1px);
}

.et-icon-btn:active { transform: translateY(0); }
.et-icon-btn.is-off { opacity: .4; }
.et-icon-btn:focus-visible { outline: 2px solid var(--et-accent); outline-offset: 2px; }

/* ============ 主区默认 ============ */
.et-main {
    flex: 1;
    min-height: 0;
    position: relative;
    overflow: auto;
}

/* ============ 页脚（品牌回流 L2） ============ */
.et-footer {
    flex: none;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 7px 16px;
    font-size: 12px;
    color: var(--et-muted);
    border-top: 1px solid var(--et-line);
    background: var(--et-glass);
    user-select: none;
    z-index: 20;
}

.et-footer a {
    color: inherit;
    text-decoration: none;
    transition: color .14s;
}

.et-footer a:hover { color: var(--et-accent); }

/* ============ 按钮 ============ */
.et-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
    padding: 9px 16px;
    border-radius: 11px;
    font: inherit;
    font-size: 13.5px;
    font-weight: 700;
    border: 1px solid var(--et-line);
    background: var(--et-surface-2);
    color: var(--et-fg);
    cursor: pointer;
    transition: transform .14s, border-color .14s, color .14s, background .14s, box-shadow .14s;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
}

.et-btn:hover {
    border-color: var(--et-accent);
    color: var(--et-accent);
    transform: translateY(-1px);
}

.et-btn:active { transform: translateY(0); }
.et-btn:focus-visible { outline: 2px solid var(--et-accent); outline-offset: 2px; }
.et-btn:disabled { opacity: .45; cursor: not-allowed; transform: none; }

.et-btn--primary {
    background: var(--et-accent);
    border-color: var(--et-accent);
    color: #fff;
    box-shadow: 0 6px 18px -8px var(--et-accent);
}

.et-btn--primary:hover { color: #fff; filter: brightness(1.08); }
.et-btn--primary:disabled { filter: none; }

.et-btn--danger:hover {
    border-color: var(--et-err);
    color: var(--et-err);
}

.et-btn--lg {
    padding: 13px 26px;
    font-size: 16px;
    border-radius: 14px;
}

/* ============ 弹窗 ============ */
.et-modal {
    position: fixed;
    inset: 0;
    z-index: 100;
    display: grid;
    place-items: center;
    padding: 24px;
    background: rgba(2, 6, 23, .55);
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    animation: et-fade .18s ease;
}

.et-modal__panel {
    width: min(680px, 94vw);
    max-height: 86vh;
    max-height: 86dvh;
    display: flex;
    flex-direction: column;
    background: var(--et-surface);
    border: 1px solid var(--et-line);
    border-radius: 16px;
    box-shadow: var(--et-shadow-lg);
    animation: et-pop .2s cubic-bezier(.34, 1.4, .64, 1);
    overflow: hidden;
}

.et-modal__panel--narrow { width: min(460px, 92vw); }
.et-modal__panel--wide { width: min(900px, 94vw); }

.et-modal__head {
    flex: none;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 16px 20px;
    border-bottom: 1px solid var(--et-line);
    font-weight: 800;
    font-size: 15px;
}

.et-modal__head .et-icon-btn {
    margin-left: auto;
    width: 32px;
    height: 32px;
}

.et-modal__body {
    flex: 1;
    min-height: 0;
    overflow: auto;
    padding: 18px 20px;
}

.et-modal__foot {
    flex: none;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 14px 20px;
    border-top: 1px solid var(--et-line);
    background: var(--et-surface-2);
}

.et-modal__foot .spacer { flex: 1; }

@keyframes et-fade {
    from { opacity: 0; }
}

@keyframes et-pop {
    from { opacity: 0; transform: translateY(14px) scale(.97); }
}

/* ============ 轻提示（toast） ============ */
.et-toast {
    position: fixed;
    left: 50%;
    bottom: 56px;
    transform: translateX(-50%) translateY(10px);
    z-index: 120;
    display: flex;
    align-items: center;
    gap: 9px;
    max-width: min(520px, 88vw);
    padding: 11px 18px;
    border-radius: 12px;
    font-size: 13.5px;
    font-weight: 600;
    color: #fff;
    background: rgba(15, 23, 42, .92);
    border: 1px solid rgba(148, 163, 184, .25);
    box-shadow: var(--et-shadow-lg);
    opacity: 0;
    pointer-events: none;
    transition: opacity .22s, transform .22s;
}

.et-toast.is-show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
}

.et-toast[data-tone="ok"] { background: rgba(5, 150, 105, .95); }
.et-toast[data-tone="err"] { background: rgba(220, 38, 38, .95); }
.et-toast[data-tone="warn"] { background: rgba(217, 119, 6, .95); }

/* ============ 设置抽屉（右上角入口，edupick 交互） ============ */
.et-drawer-backdrop {
    position: fixed;
    inset: 0;
    z-index: 90;
    background: rgba(2, 6, 23, .45);
    backdrop-filter: blur(3px);
    -webkit-backdrop-filter: blur(3px);
    opacity: 0;
    transition: opacity .2s;
}

.et-drawer-backdrop.is-open { opacity: 1; }

.et-drawer {
    position: absolute;
    top: 0;
    right: 0;
    height: 100%;
    width: min(400px, 92vw);
    display: flex;
    flex-direction: column;
    background: var(--et-surface);
    border-left: 1px solid var(--et-line);
    box-shadow: var(--et-shadow-lg);
    transform: translateX(100%);
    transition: transform .22s cubic-bezier(.32, .72, .35, 1);
}

.et-drawer-backdrop.is-open .et-drawer { transform: translateX(0); }

.et-drawer__head {
    flex: none;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 15px 18px;
    border-bottom: 1px solid var(--et-line);
    font-weight: 800;
    font-size: 15px;
    color: var(--et-accent);
}

.et-drawer__head .et-icon-btn {
    margin-left: auto;
    width: 32px;
    height: 32px;
}

.et-drawer__body {
    flex: 1;
    min-height: 0;
    overflow: auto;
    padding: 16px 18px 24px;
}

/* 抽屉内容通用小节（工具复用） */
.et-drawer__body h4 {
    margin: 18px 0 8px;
    font-size: 12px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: .08em;
    color: var(--et-muted);
}

.et-drawer__body h4:first-child { margin-top: 0; }

.et-drawer__row {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
}

.et-drawer__tip {
    margin: 8px 0 0;
    font-size: 12px;
    line-height: 1.8;
    color: var(--et-muted);
}

.et-drawer__tip b { color: var(--et-fg); }

.et-drawer__input {
    flex: 1;
    min-width: 0;
    padding: 9px 12px;
    border: 1px solid var(--et-line-strong);
    border-radius: 9px;
    background: var(--et-surface-2);
    color: var(--et-fg);
    font: inherit;
    font-size: 13.5px;
    transition: border-color .14s, box-shadow .14s;
}

.et-drawer__input:focus {
    outline: none;
    border-color: var(--et-accent);
    box-shadow: 0 0 0 3px var(--et-accent-weak);
}

.et-drawer__switch {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 10px 0;
    border-bottom: 1px dashed var(--et-line);
    font-size: 13.5px;
    font-weight: 600;
    color: var(--et-fg);
    cursor: pointer;
    user-select: none;
}

.et-drawer__switch input {
    width: 17px;
    height: 17px;
    accent-color: var(--et-accent);
    cursor: pointer;
}
</style>

<script>
  /* 此块由 scripts/sync_shared.py 自动注入，请勿手工修改 */
/*!
 * et-import.js — 通用数据导入组件（shell 型工具的核心基建）
 *
 * 共享逻辑源。改这里，然后跑：python scripts/sync_shared.py
 * 依赖：et-util.js（ET.store）、et-chrome.js（ET.Chrome.modal，弹窗宿主）
 * 兼容性：现代浏览器（TextDecoder GBK / FileReader / Drag&Drop）。
 * 全局：ET.Import
 *
 * 用法（名单模式，默认）：
 *   ET.Import.open({
 *     toolId: 'random-name-classic',
 *     title: '导入名单',
 *     columns: ['name', 'id', 'weight'],   // 允许识别的列
 *     current: '张三\n李四',                // 可选，回填当前数据便于增改
 *     onConfirm: function (rows, meta) { … }  // rows: [{name, id, weight}]
 *   });
 *
 * 用法（自定义字段模式，词表 / 题表等非名单数据）：
 *   ET.Import.open({
 *     toolId: 'word-flashcard',
 *     title: '导入单词表',
 *     fields: [
 *       { key: 'word', label: '单词', keys: ['单词', '英文', 'word'] },
 *       { key: 'ipa',  label: '音标', keys: ['音标', '发音', 'phonetic'] },
 *       { key: 'mean', label: '释义', keys: ['释义', '意思', 'meaning'] }
 *     ],
 *     placeholder: '…',   // 可选，覆盖粘贴框提示
 *     help: '…',          // 可选，覆盖说明文字
 *     onConfirm: function (rows, meta) { … }  // rows: [{word, ipa, mean}]
 *   });
 *   未传 fields 时行为与旧版完全一致（name / id / weight 三列）。
 *
 * 也提供纯解析入口（不弹窗）：
 *   var result = ET.Import.parseText(text, { weight: true });
 *   // result = { rows: [...], stats: { lines, valid, dupes, blanks, errors: [...] } }
 */
(function (global) {
    'use strict';

    /* ============ 常量 ============ */

    var NAME_KEYS = ['姓名', '名字', '名称', '学生', '学员', 'name', 'student'];
    var ID_KEYS = ['学号', '编号', '序号', '号码', 'id', 'no', 'number'];
    var WEIGHT_KEYS = ['权重', '次数', '倍数', 'weight', 'times'];

    var MAX_WEIGHT = 99;

    /* ============ 解析 ============ */

    function normCell(s) {
        return String(s === undefined || s === null ? '' : s).trim();
    }

    function matchKey(cell, keys) {
        var c = normCell(cell).toLowerCase();
        if (!c) { return false; }
        for (var i = 0; i < keys.length; i++) {
            if (c === keys[i]) { return true; }
        }
        for (var j = 0; j < keys.length; j++) {
            /* 中文表头常见"学生姓名"，用包含匹配 */
            if (/[\u4e00-\u9fa5]/.test(keys[j]) && c.indexOf(keys[j]) !== -1) { return true; }
        }
        return false;
    }

    function isAllNumeric(arr) {
        if (!arr.length) { return false; }
        for (var i = 0; i < arr.length; i++) {
            if (!/^\d{1,6}(\.\d+)?$/.test(normCell(arr[i]))) { return false; }
        }
        return true;
    }

    /** 引号感知的 CSV 行拆分（RFC4180 简化版，不支持跨行引号） */
    function splitLine(line, delim) {
        var out = [];
        var cur = '';
        var inQ = false;
        for (var i = 0; i < line.length; i++) {
            var ch = line[i];
            if (inQ) {
                if (ch === '"') {
                    if (line.charAt(i + 1) === '"') { cur += '"'; i++; }
                    else { inQ = false; }
                } else {
                    cur += ch;
                }
            } else if (ch === '"') {
                inQ = true;
            } else if (ch === delim) {
                out.push(cur);
                cur = '';
            } else {
                cur += ch;
            }
        }
        out.push(cur);
        return out;
    }

    function detectDelimiter(lines) {
        var counts = { '\t': 0, ',': 0, ';': 0 };
        for (var i = 0; i < lines.length; i++) {
            for (var d in counts) {
                counts[d] += lines[i].split(d).length - 1;
            }
        }
        var best = '\t';
        var bestN = -1;
        for (var k in counts) {
            if (counts[k] > bestN) { bestN = counts[k]; best = k; }
        }
        return bestN > 0 ? best : null;
    }

    /**
     * 把"原始表格行（二维数组）"规范化为 rows。
     * opts.weight 是否识别权重列；opts.id 是否识别学号列。
     */
    function tableToRows(table, opts, stats) {
        opts = opts || {};
        if (!table.length) { return []; }

        var width = 0;
        for (var w = 0; w < table.length; w++) {
            width = Math.max(width, table[w].length);
        }

        /* --- 表头识别 --- */
        var header = null;
        var first = table[0];
        var firstAllEmpty = true;
        for (var c0 = 0; c0 < first.length; c0++) {
            if (normCell(first[c0])) { firstAllEmpty = false; break; }
        }
        if (!firstAllEmpty) {
            for (var c = 0; c < first.length; c++) {
                if (matchKey(first[c], NAME_KEYS) || matchKey(first[c], WEIGHT_KEYS) || matchKey(first[c], ID_KEYS)) {
                    header = first;
                    table = table.slice(1);
                    stats.blanks++; /* 表头行不算数据 */
                    break;
                }
            }
        }

        /* --- 列映射 --- */
        var map = { name: -1, id: -1, weight: -1 };
        if (header) {
            for (var hc = 0; hc < header.length; hc++) {
                if (map.name < 0 && matchKey(header[hc], NAME_KEYS)) { map.name = hc; }
                else if (opts.id && map.id < 0 && matchKey(header[hc], ID_KEYS)) { map.id = hc; }
                else if (opts.weight && map.weight < 0 && matchKey(header[hc], WEIGHT_KEYS)) { map.weight = hc; }
            }
        }

        var cols = table.map(function (row) { return row; });
        function colValues(idx) {
            return cols.map(function (r) { return normCell(r[idx]); }).filter(function (v) { return v !== ''; });
        }

        if (map.name < 0) {
            if (width === 1) {
                map.name = 0;
            } else {
                var c0 = colValues(0);
                var c1 = colValues(1);
                var numeric0 = isAllNumeric(c0);
                var numeric1 = isAllNumeric(c1);
                if (width === 2) {
                    if (numeric0 && !numeric1) { map.id = 0; map.name = 1; }
                    else if (numeric1 && !numeric0 && opts.weight) { map.name = 0; map.weight = 1; }
                    else { map.name = 0; }
                } else {
                    /* ≥3 列：编号 | 姓名 | 权重 的经典布局 */
                    if (numeric0) { map.id = 0; map.name = 1; } else { map.name = 0; }
                    if (opts.weight) { map.weight = width - 1; }
                }
            }
        }
        if (map.name < 0) { map.name = 0; }
        if (!opts.weight) { map.weight = -1; }
        if (!opts.id) { map.id = -1; }

        /* --- 逐行处理 --- */
        var rows = [];
        var seen = {};
        var wantWeight = map.weight >= 0;

        for (var i = 0; i < table.length; i++) {
            var raw = table[i];
            var lineNo = i + (header ? 2 : 1); /* 用户视角的行号（含表头） */
            var name = map.name < raw.length ? normCell(raw[map.name]) : '';
            var restEmpty = true;
            for (var rc = 0; rc < raw.length; rc++) {
                if (normCell(raw[rc])) { restEmpty = false; break; }
            }
            if (!name && restEmpty) { stats.blanks++; continue; }

            if (!name) {
                stats.errors.push('第 ' + lineNo + ' 行：姓名列为空，已跳过');
                continue;
            }

            var weight = 1;
            if (wantWeight && map.weight < raw.length) {
                var wv = normCell(raw[map.weight]);
                if (wv !== '') {
                    var wn = Number(wv);
                    if (isFinite(wn) && wn >= 1) {
                        weight = Math.min(MAX_WEIGHT, Math.round(wn));
                        if (weight !== wn) {
                            stats.errors.push('第 ' + lineNo + ' 行：权重 "' + wv + '" 已取整为 ' + weight);
                        }
                    } else {
                        stats.errors.push('第 ' + lineNo + ' 行：权重 "' + wv + '" 无效（需 ≥1 的数字），按 1 处理');
                    }
                }
            }

            var id = '';
            if (map.id >= 0 && map.id < raw.length) {
                id = normCell(raw[map.id]);
            }

            if (opts.dedupe !== false && seen[name]) {
                stats.dupes++;
                continue;
            }
            seen[name] = true;

            rows.push({ name: name, id: id, weight: weight });
        }
        return rows;
    }

    /* ============ 自定义字段模式（词表 / 题表等非名单数据） ============ */

    function normKeyList(field) {
        var keys = field.keys && field.keys.length ? field.keys.slice() : [];
        if (field.label) { keys.push(field.label); }
        return keys;
    }

    function matchAnyKey(cell, keys) {
        for (var i = 0; i < keys.length; i++) {
            if (matchKey(cell, [keys[i]])) { return true; }
        }
        return false;
    }

    function colTaken(map, idx) {
        for (var k in map) {
            if (map[k] === idx) { return true; }
        }
        return false;
    }

    /**
     * 把二维表格规范化为「按 fields 定义的对象数组」。
     * fields = [{key, label, keys?}]，行对象形如 {key1: '…', key2: '…'}。
     * 与 tableToRows 并列存在：只有显式传 fields 时才走这里，名单路径行为不变。
     */
    function tableToFields(table, fields, stats) {
        if (!table.length) { return []; }

        var width = 0;
        for (var w = 0; w < table.length; w++) {
            width = Math.max(width, table[w].length);
        }

        var keyLists = [];
        var flat = [];
        for (var f = 0; f < fields.length; f++) {
            var list = normKeyList(fields[f]);
            keyLists.push(list);
            for (var k = 0; k < list.length; k++) { flat.push(list[k]); }
        }

        /* --- 表头识别 --- */
        var header = null;
        var first = table[0];
        var hasAny = false;
        for (var c0 = 0; c0 < first.length; c0++) {
            if (normCell(first[c0])) { hasAny = true; break; }
        }
        if (hasAny) {
            for (var c = 0; c < first.length; c++) {
                if (matchAnyKey(first[c], flat)) {
                    header = first;
                    table = table.slice(1);
                    stats.blanks++; /* 表头行不算数据 */
                    break;
                }
            }
        }

        /* --- 列映射：先按表头，缺的按出现顺序补空列 --- */
        var map = {};
        for (var fi = 0; fi < fields.length; fi++) { map[fields[fi].key] = -1; }

        if (header) {
            for (var hc = 0; hc < header.length; hc++) {
                for (var fj = 0; fj < fields.length; fj++) {
                    if (map[fields[fj].key] < 0 && matchAnyKey(header[hc], keyLists[fj])) {
                        map[fields[fj].key] = hc;
                        break;
                    }
                }
            }
        }

        var next = 0;
        for (var fp = 0; fp < fields.length; fp++) {
            if (map[fields[fp].key] >= 0) { continue; }
            while (next < width && colTaken(map, next)) { next++; }
            if (next < width) {
                map[fields[fp].key] = next;
                next++;
            }
        }

        /* --- 逐行处理 --- */
        var rows = [];
        var seen = {};
        var firstKey = fields[0].key;

        for (var i = 0; i < table.length; i++) {
            var raw = table[i];
            var lineNo = i + (header ? 2 : 1);
            var row = {};
            var allEmpty = true;

            for (var rf = 0; rf < fields.length; rf++) {
                var col = map[fields[rf].key];
                var val = (col >= 0 && col < raw.length) ? normCell(raw[col]) : '';
                row[fields[rf].key] = val;
                if (val) { allEmpty = false; }
            }

            if (allEmpty) { stats.blanks++; continue; }

            if (!row[firstKey]) {
                stats.errors.push('第 ' + lineNo + ' 行：' + (fields[0].label || '首列') + '为空，已跳过');
                continue;
            }

            if (seen[row[firstKey]]) { stats.dupes++; continue; }
            seen[row[firstKey]] = true;

            rows.push(row);
        }
        return rows;
    }

    /** 统一入口：有 fields 走自定义字段，否则沿用名单路径 */
    function buildRows(table, opts, stats) {
        return opts.fields ? tableToFields(table, opts.fields, stats) : tableToRows(table, opts, stats);
    }

    function jsonToTableFields(json, fields) {
        if (!Array.isArray(json)) { return []; }
        var labels = [];
        for (var i = 0; i < fields.length; i++) { labels.push(fields[i].label || fields[i].key); }
        var table = [labels];

        for (var r = 0; r < json.length; r++) {
            var item = json[r];
            var out = [];
            if (typeof item === 'string' || typeof item === 'number') {
                for (var c = 0; c < fields.length; c++) {
                    out.push(c === 0 ? String(item) : '');
                }
            } else if (item && typeof item === 'object') {
                for (var c2 = 0; c2 < fields.length; c2++) {
                    var v = item[fields[c2].key];
                    if (v === undefined || v === null) { v = item[fields[c2].label] || ''; }
                    out.push(String(v));
                }
            } else {
                continue;
            }
            table.push(out);
        }
        return table;
    }

    function jsonToTable(json) {
        if (Array.isArray(json)) {
            var table = [];
            for (var i = 0; i < json.length; i++) {
                var item = json[i];
                if (typeof item === 'string' || typeof item === 'number') {
                    table.push([String(item)]);
                } else if (item && typeof item === 'object') {
                    var name = item.name || item.姓名 || item.名字 || item.title || '';
                    var weight = item.weight || item.权重 || item.次数 || '';
                    var id = item.id || item.学号 || item.编号 || '';
                    if (name !== undefined && name !== null) {
                        table.push([String(id), String(name), String(weight)]);
                    }
                }
            }
            return table;
        }
        return [];
    }

    /**
     * 纯文本解析入口。
     * 返回 { rows, stats }；stats = { lines, valid, dupes, blanks, errors[] }
     */
    function parseText(text, opts) {
        opts = opts || {};
        var stats = { lines: 0, valid: 0, dupes: 0, blanks: 0, errors: [] };
        var rows = [];

        var trimmed = String(text || '').replace(/^\uFEFF/, '').trim();
        if (!trimmed) {
            return { rows: rows, stats: stats };
        }

        /* JSON 优先 */
        if (trimmed.charAt(0) === '[' || trimmed.charAt(0) === '{') {
            try {
                var json = JSON.parse(trimmed);
                var jsonTable = opts.fields ? jsonToTableFields(json, opts.fields) : jsonToTable(json);
                rows = buildRows(jsonTable, opts, stats);
            } catch (err) {
                stats.errors.push('JSON 解析失败：' + err.message);
            }
        } else {
            var lines = trimmed.split(/\r\n|\r|\n/);
            while (lines.length && !lines[lines.length - 1].trim()) { lines.pop(); }
            stats.lines = lines.length;

            var delim = detectDelimiter(lines);
            var table = [];
            for (var i = 0; i < lines.length; i++) {
                if (!lines[i].trim()) { continue; }
                table.push(delim ? splitLine(lines[i], delim) : [lines[i]]);
            }
            rows = buildRows(table, opts, stats);
        }

        stats.valid = rows.length;
        return { rows: rows, stats: stats };
    }

    /* ============ 文件解码 ============ */

    function decodeBuffer(buffer) {
        var bytes = new Uint8Array(buffer);
        /* UTF-8 BOM */
        if (bytes[0] === 0xEF && bytes[1] === 0xBB && bytes[2] === 0xBF) {
            return new TextDecoder('utf-8').decode(bytes.subarray(3));
        }
        /* UTF-16 LE BOM */
        if (bytes[0] === 0xFF && bytes[1] === 0xFE) {
            return new TextDecoder('utf-16le').decode(bytes.subarray(2));
        }
        /* 严格 UTF-8 失败 → GBK / GB18030（Excel 导出的中文 CSV 常见） */
        try {
            return new TextDecoder('utf-8', { fatal: true }).decode(bytes);
        } catch (err) {
            try { return new TextDecoder('gb18030').decode(bytes); }
            catch (err2) { return new TextDecoder('gbk').decode(bytes); }
        }
    }

    /* ============ 弹窗 UI ============ */

    function esc(s) {
        return String(s === undefined || s === null ? '' : s)
            .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }

    function chip(label, n, tone) {
        if (!n) { return ''; }
        return '<span class="etimp-chip' + (tone ? ' etimp-chip--' + tone : '') + '">' + esc(label) + ' ' + n + '</span>';
    }

    function renderResult(container, result, opts) {
        var rows = result.rows;
        var stats = result.stats;
        var html = '';

        if (!stats.lines && !rows.length && !stats.errors.length) {
            container.innerHTML = '<div class="etimp-empty">输入内容后这里会显示解析结果</div>';
            return;
        }

        html += '<div class="etimp-stats">';
        html += chip('有效', rows.length, rows.length ? 'ok' : '');
        if (stats.dupes) { html += chip('去重', stats.dupes, 'warn'); }
        if (stats.blanks) { html += chip('空行/表头', stats.blanks, ''); }
        html += '</div>';

        if (rows.length) {
            html += '<div class="etimp-table-wrap"><table class="etimp-table"><thead><tr>';
            html += '<th>#</th>';
            if (opts.fields) {
                for (var lc = 0; lc < opts.fields.length; lc++) {
                    html += '<th>' + esc(opts.fields[lc].label || opts.fields[lc].key) + '</th>';
                }
            } else {
                html += '<th>姓名</th>';
                if (opts.id) { html += '<th>学号</th>'; }
                if (opts.weight) { html += '<th>权重</th>'; }
            }
            html += '</tr></thead><tbody>';
            var previewMax = Math.min(rows.length, 10);
            for (var i = 0; i < previewMax; i++) {
                html += '<tr><td class="etimp-dim">' + (i + 1) + '</td>';
                if (opts.fields) {
                    for (var fc = 0; fc < opts.fields.length; fc++) {
                        html += '<td>' + esc(rows[i][opts.fields[fc].key] || '—') + '</td>';
                    }
                } else {
                    html += '<td>' + esc(rows[i].name) + '</td>';
                    if (opts.id) { html += '<td class="etimp-dim">' + esc(rows[i].id || '—') + '</td>'; }
                    if (opts.weight) { html += '<td class="etimp-num">' + rows[i].weight + '</td>'; }
                }
                html += '</tr>';
            }
            html += '</tbody></table></div>';
            if (rows.length > previewMax) {
                html += '<div class="etimp-empty" style="margin-top:8px;border:none;padding:6px">… 共 ' + rows.length + ' 条，仅预览前 ' + previewMax + ' 条</div>';
            }
        } else if (!stats.errors.length) {
            html += '<div class="etimp-empty">未解析出有效数据</div>';
        }

        if (stats.errors.length) {
            html += '<div class="etimp-errors"><b>' + stats.errors.length + ' 处问题：</b><br>' +
                stats.errors.slice(0, 20).map(esc).join('<br>') +
                (stats.errors.length > 20 ? '<br>… 还有 ' + (stats.errors.length - 20) + ' 条' : '') + '</div>';
        }

        container.innerHTML = html;
    }

    function open(options) {
        var opt = options || {};
        var toolId = opt.toolId || 'unknown-tool';
        var customFields = (opt.fields && opt.fields.length) ? opt.fields : null;
        var opts = {
            weight: customFields ? false : (opt.columns || ['name', 'weight']).indexOf('weight') !== -1,
            id: customFields ? false : (opt.columns || []).indexOf('id') !== -1,
            fields: customFields,
            dedupe: true
        };

        var Chrome = global.ET && global.ET.Chrome;
        if (!Chrome || !Chrome.modal) {
            if (opt.onConfirm) { opt.onConfirm([], { cancelled: true }); }
            return null;
        }

        var defaultPlaceholder = customFields
            ? ('一行一条，按列依次填写，例如：\n' + customFields.map(function (f) {
                return '示例' + (f.label || f.key);
            }).join(', '))
            : '一行一个人，支持粘贴 Excel 表格、逗号/Tab 分隔文本，例如：\n张三\n李四,2\n1,王五,3';

        var defaultHelp = customFields
            ? ('每行一条，按列依次为 <b>' + customFields.map(function (f) {
                return esc(f.label || f.key);
            }).join(' / ') + '</b>；支持逗号 / Tab 分隔文本、带表头的 CSV 与 JSON 数组。首列重复的行会自动去重。')
            : ('支持 <b>纯姓名</b>（一行一个）、<b>姓名,权重</b>、<b>学号,姓名,权重</b>，' +
                '也支持带表头的 CSV（姓名 / 学号 / 权重 列自动识别）与 JSON 数组。' +
                (opts.weight ? '权重越大被抽中概率越高，默认 1。' : ''));

        var root = document.createElement('div');
        root.innerHTML =
            '<div class="etimp-tabs">' +
            '<button type="button" class="etimp-tab is-active" data-tab="paste"><b>粘贴文本</b></button>' +
            '<button type="button" class="etimp-tab" data-tab="file">打开文件</button>' +
            '</div>' +
            '<div data-panel="paste">' +
            '<textarea class="etimp-textarea" id="etimp-text" placeholder="' +
            esc(opt.placeholder || defaultPlaceholder) + '"></textarea>' +
            '<div class="etimp-help">' + (opt.help || defaultHelp) + '</div>' +
            '</div>' +
            '<div data-panel="file" hidden>' +
            '<div class="etimp-drop" id="etimp-drop" tabindex="0">' +
            '<span class="et-drop-icon"></span>' +
            '<span class="etimp-drop__main">点击选择或拖入文件</span>' +
            '<span class="etimp-drop__hint">支持 .csv / .txt / .json，自动识别 UTF-8 与 GBK 编码</span>' +
            '<input type="file" class="etimp-file" id="etimp-file" accept=".csv,.txt,.tsv,.json,text/csv,text/plain,application/json">' +
            '</div>' +
            '<div class="etimp-help">Excel 请先另存为 <b>CSV</b> 再导入（文件 → 另存为 → CSV）。</div>' +
            '</div>' +
            '<div class="etimp-result" id="etimp-result"><div class="etimp-empty">输入内容后这里会显示解析结果</div></div>';

        var body = root.firstChild ? root : root;
        /* root 本身作为容器 */
        var wrap = document.createElement('div');
        while (root.firstChild) { wrap.appendChild(root.firstChild); }

        var modal = global.ET.Chrome.modal({
            title: opt.title || '导入数据',
            icon: 'i-upload',
            size: 'wide',
            body: wrap,
            buttons: [
                { label: '取消' },
                {
                    label: '导入',
                    primary: true,
                    onClick: function (close) {
                        if (!lastResult || !lastResult.rows.length) { return; }
                        close();
                        if (opt.onConfirm) {
                            opt.onConfirm(lastResult.rows, {
                                dupes: lastResult.stats.dupes,
                                dedupe: opts.dedupe
                            });
                        }
                    }
                }
            ]
        });

        var q = function (sel) { return wrap.querySelector(sel); };
        var textEl = q('#etimp-text');
        var resultEl = q('#etimp-result');
        var importBtn = modal.foot.querySelector('.et-btn--primary');
        var lastResult = null;

        if (opt.current) { textEl.value = opt.current; }

        function refresh() {
            var text = textEl.value;
            lastResult = parseText(text, opts);
            renderResult(resultEl, lastResult, opts);
            importBtn.disabled = !lastResult.rows.length;
            if (lastResult.rows.length) {
                importBtn.textContent = '导入 ' + lastResult.rows.length + ' 条';
            } else {
                importBtn.textContent = '导入';
            }
        }

        var timer = 0;
        textEl.addEventListener('input', function () {
            clearTimeout(timer);
            timer = setTimeout(refresh, 250);
        });

        /* 页签切换 */
        wrap.querySelectorAll('.etimp-tab').forEach(function (tab) {
            tab.addEventListener('click', function () {
                wrap.querySelectorAll('.etimp-tab').forEach(function (t) { t.classList.remove('is-active'); });
                tab.classList.add('is-active');
                var name = tab.getAttribute('data-tab');
                q('[data-panel="paste"]').hidden = name !== 'paste';
                q('[data-panel="file"]').hidden = name !== 'file';
            });
        });

        /* 文件区 */
        var drop = q('#etimp-drop');
        var fileInput = q('#etimp-file');

        var dropIconHost = drop.querySelector('.et-drop-icon');
        var NS_SVG = 'http://www.w3.org/2000/svg'; /* et-allow-external SVG 命名空间 */
        var dropSvg = document.createElementNS(NS_SVG, 'svg');
        dropSvg.setAttribute('class', 'et-icon');
        var dropUse = document.createElementNS(NS_SVG, 'use');
        dropUse.setAttribute('href', '#i-upload');
        dropSvg.appendChild(dropUse);
        dropIconHost.appendChild(dropSvg);

        drop.addEventListener('click', function () { fileInput.click(); });
        drop.addEventListener('keydown', function (ev) {
            if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); fileInput.click(); }
        });
        ['dragenter', 'dragover'].forEach(function (evName) {
            drop.addEventListener(evName, function (ev) {
                ev.preventDefault();
                drop.classList.add('is-over');
            });
        });
        ['dragleave', 'drop'].forEach(function (evName) {
            drop.addEventListener(evName, function (ev) {
                ev.preventDefault();
                drop.classList.remove('is-over');
            });
        });
        drop.addEventListener('drop', function (ev) {
            var files = ev.dataTransfer && ev.dataTransfer.files;
            if (files && files.length) { readFile(files[0]); }
        });
        fileInput.addEventListener('change', function () {
            if (fileInput.files && fileInput.files.length) { readFile(fileInput.files[0]); }
        });

        function readFile(file) {
            var reader = new FileReader();
            reader.onload = function () {
                var text = decodeBuffer(reader.result);
                var isJson = /\.json$/i.test(file.name) ||
                    (text.charAt(0) !== '\n' && (text.charAt(0) === '['));
                if (isJson) {
                    try {
                        JSON.parse(text.trim()); /* 校验合法性，错误交给 parseText 报 */
                    } catch (err) { /* parseText 会再次报错 */ }
                }
                textEl.value = text;
                /* 切回粘贴页让用户可见内容 */
                wrap.querySelectorAll('.etimp-tab').forEach(function (t) {
                    t.classList.toggle('is-active', t.getAttribute('data-tab') === 'paste');
                });
                q('[data-panel="paste"]').hidden = false;
                q('[data-panel="file"]').hidden = true;
                refresh();
                global.ET.Chrome.toast('已读取 ' + file.name, 'ok');
            };
            reader.onerror = function () {
                global.ET.Chrome.toast('文件读取失败', 'err');
            };
            reader.readAsArrayBuffer(file);
        }

        refresh();
        setTimeout(function () { textEl.focus(); }, 60);

        return modal;
    }

    global.ET = global.ET || {};
    global.ET.Import = { open: open, parseText: parseText, decodeBuffer: decodeBuffer };
})(window);
</script>

<script>
  /* 此块由 scripts/sync_shared.py 自动注入，请勿手工修改 */
/*!
 * et-stats.js — 使用统计模块（模块化，可整体移除）
 *
 * 共享逻辑源。改这里，然后跑：python scripts/sync_shared.py
 * 依赖：无（可脱离 et-util / et-chrome 独立运行）。
 * 全局：ET.Stats
 *
 * ┌────────────────────────────────────────────────────────────────┐
 * │ 说明：本模块只做一件事——工具被打开时向上报端点发一条匿名计数。 │
 * │ · 在线（iframe 内）：宿主页面已服务端计数，本模块不重复上报。   │
 * │ · 离线打开（file:// / 下载单文件 / 离线包）：联网条件具备时，   │
 * │   以 sendBeacon 上报 use_offline 事件（text/plain 免预检）。    │
 * │ · 上报端点 = window.ET_SITE_ORIGIN（由宿主注入或离线包配置）。  │
 * │   未配置端点时本模块完全静默，不发任何请求。                    │
 * │ · **整个 <script> 块可安全删除**：删除后工具其余功能完全正常，  │
 * │   且完全不再发起任何网络请求。                                  │
 * └────────────────────────────────────────────────────────────────┘
 */
(function (global) {
    'use strict';

    var ET = global.ET = global.ET || {};

    var Stats = {
        /** 上报端点来源（站点绝对地址，无协议尾斜杠） */
        endpoint: (typeof global.ET_SITE_ORIGIN === 'string' && /^https?:\/\//.test(global.ET_SITE_ORIGIN))
            ? global.ET_SITE_ORIGIN
            : null,

        _done: {},

        /**
         * 上报一次事件（同一事件同一工具每次页面加载只报一次）。
         * event: 'use_offline' 等；toolId: 工具 id。
         */
        send: function (event, toolId) {
            if (!event || this._done[event + ':' + (toolId || '')]) { return false; }
            if (!this.endpoint) { return false; }
            /* iframe 内由宿主统计，避免双计 */
            try {
                if (global.parent && global.parent !== global) { return false; }
            } catch (err) { return false; }
            /* 断网时挂起，网络恢复自动补报一次 */
            if (global.navigator && global.navigator.onLine === false) {
                var self = this;
                global.addEventListener('online', function () { self.send(event, toolId); }, { once: true });
                return false;
            }

            this._done[event + ':' + (toolId || '')] = true;
            var payload = JSON.stringify({ event: event, tool: toolId || '' });

            try {
                if (global.navigator.sendBeacon) {
                    return global.navigator.sendBeacon(
                        this.endpoint + '/api/track',
                        new Blob([payload], { type: 'text/plain;charset=UTF-8' })
                    );
                }
                global.fetch(this.endpoint + '/api/track', {
                    method: 'POST',
                    body: payload,
                    keepalive: true,
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'text/plain;charset=UTF-8' }
                });
                return true;
            } catch (err) {
                return false;
            }
        }
    };

    ET.Stats = Stats;
})(window);
</script>

<script>
(function () {
    'use strict';

    var TOOL_ID = 'exam-seat-print';
    var store = ET.store(TOOL_ID);

    var LABEL_ROWS = 8;   /* 每页贴条行数（列数在设置里调） */
    var TABLE_ROWS = 30;  /* 签到表每页最多行数 */
    var MODES = ['rooms', 'labels', 'roster'];
    var MODE_LABEL = { rooms: '打印考场总表', labels: '打印座位贴条', roster: '打印签到表' };

    var chrome = ET.Chrome.mount({
        toolId: TOOL_ID,
        title: '考试座位表打印',
        sub: '通用 · 考场编排 / A4 打印',
        accent: '#2563eb',
        status: '就绪',
        sound: true,
        primary: doPrint,        /* 翻页笔下页键 = 打印 */
        secondary: openImport,   /* 翻页笔上页键 = 导入名单 */
        actions: [
            { icon: 'i-upload', label: '导入名单', onClick: openImport },
            { icon: 'i-shuffle', label: '打乱考场顺序', onClick: shuffleRoster },
            { icon: 'i-download', label: '导出 CSV', onClick: exportCsv },
            { icon: 'i-trash', label: '清空名单', onClick: clearRoster }
        ],
        settings: { title: '考场 / 设置', build: buildSettings },
        help: '<div style="font-size:13.5px;line-height:2">' +
            '<p style="margin:0 0 8px"><b>怎么用</b>：右上角「导入名单」粘贴考生姓名（一行一个，Excel 可整列复制，' +
            '支持「姓名,学号」）→ 自动按每考场座位数分考场排座；⚙ 设置里可调每考场行数 / 列数 / 编号方式。</p>' +
            '<p style="margin:0 0 8px"><b>三种打印稿</b>：① 考场座位总表（一个考场一页，考场门张贴 + 监考用）' +
            '② 座位贴条（每页 16 / 24 / 32 张，裁剪后贴课桌）③ 考场签到表（含考生签名栏，超 30 人自动分页）。' +
            '屏上看到的就是打印出来的，不需要二次排版。</p>' +
            '<p style="margin:0 0 8px"><b>打印设置</b>：A4 纵向、缩放 100%；若浏览器弹出边距选项，选「无 / 默认」最准' +
            '（页面已按 A4 排好版）。</p>' +
            '<p style="margin:0 0 8px"><b>考号规则</b>：默认「考场号 + 座位号」（第 2 考场 3 号 → 0203）；' +
            '也可按名单顺序编号（可设起始号与位数），或直接使用名单中的学号。</p>' +
            '<p style="margin:0"><b>快捷键</b>：<b>1</b> / <b>2</b> / <b>3</b> 切换打印稿、<b>P</b> 打印；' +
            '翻页笔下页键 = 打印，上页键 = 导入名单。名单与设置只保存在本机浏览器。</p></div>'
    });

    var els = {
        seg: document.getElementById('modeSeg'),
        stat: document.getElementById('stat'),
        preview: document.getElementById('preview'),
        empty: document.getElementById('empty'),
        btnPrint: document.getElementById('btnPrint'),
        btnPrintLabel: document.getElementById('btnPrintLabel'),
        btnImport: document.getElementById('btnImport')
    };

    var state = {
        school: store.get('school', ''),
        examTitle: store.get('examTitle', '期末考试'),
        rows: clampInt(store.get('rows', 6), 1, 20),
        cols: clampInt(store.get('cols', 8), 1, 20),
        fill: store.get('fill', 'snake'),
        examNoMode: store.get('examNoMode', 'room-seat'),
        startNo: clampInt(store.get('startNo', 1), 0, 999999),
        examNoWidth: clampInt(store.get('examNoWidth', 4), 1, 10),
        labelCols: clampInt(store.get('labelCols', 3), 2, 4),
        mode: store.get('mode', 'rooms'),
        roster: normalizeRoster(store.get('roster', []))
    };

    if (['row', 'snake', 'col'].indexOf(state.fill) < 0) { state.fill = 'snake'; }
    if (['seq', 'room-seat', 'id'].indexOf(state.examNoMode) < 0) { state.examNoMode = 'room-seat'; }
    if (MODES.indexOf(state.mode) < 0) { state.mode = 'rooms'; }

    var rosterSource = '';   /* 离线名单来源标记（roster.js / roster.txt） */

    /* ---------- 基础工具 ---------- */

    function clampInt(v, min, max) {
        var n = parseInt(v, 10);
        if (isNaN(n)) { return min; }
        return Math.max(min, Math.min(max, n));
    }

    function normalizeRoster(list) {
        var out = [];
        if (!Array.isArray(list)) { return out; }
        for (var i = 0; i < list.length; i++) {
            var it = list[i];
            if (!it) { continue; }
            var name = String(it.name === undefined || it.name === null ? '' : it.name).trim();
            if (!name) { continue; }
            out.push({
                name: name,
                id: String(it.id === undefined || it.id === null ? '' : it.id).trim()
            });
        }
        return out;
    }

    function persist() {
        store.set('school', state.school);
        store.set('examTitle', state.examTitle);
        store.set('rows', state.rows);
        store.set('cols', state.cols);
        store.set('fill', state.fill);
        store.set('examNoMode', state.examNoMode);
        store.set('startNo', state.startNo);
        store.set('examNoWidth', state.examNoWidth);
        store.set('labelCols', state.labelCols);
        store.set('mode', state.mode);
        store.set('roster', state.roster);
    }

    function isTypingTarget(node) {
        if (!node || !node.tagName) { return false; }
        var tag = node.tagName.toUpperCase();
        return tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT' || node.isContentEditable === true;
    }

    function pad(n, w) {
        var s = String(n);
        while (s.length < w) { s = '0' + s; }
        return s;
    }

    function perRoom() { return state.rows * state.cols; }

    /* ---------- 编排 ---------- */

    /** 线性位次 k → 网格坐标（按编号方式决定座位号在教室里的走向） */
    function kOf(row, col) {
        if (state.fill === 'col') { return col * state.rows + row; }
        if (state.fill === 'snake') {
            return row * state.cols + (row % 2 === 0 ? col : state.cols - 1 - col);
        }
        return row * state.cols + col;
    }

    function examNoOf(globalIdx, roomIdx, k) {
        if (state.examNoMode === 'id') {
            var rid = state.roster[globalIdx] ? state.roster[globalIdx].id : '';
            if (rid) { return rid; }
        }
        if (state.examNoMode === 'room-seat') {
            return pad(roomIdx + 1, 2) + pad(k + 1, 2);
        }
        return pad((Number(state.startNo) || 0) + globalIdx, state.examNoWidth);
    }

    function arrange() {
        var per = perRoom();
        var rooms = [];
        if (!state.roster.length || per < 1) { return rooms; }
        var count = Math.ceil(state.roster.length / per);
        for (var r = 0; r < count; r++) {
            var seats = [];
            for (var s = 0; s < per; s++) { seats.push(null); }
            rooms.push({ no: r + 1, seats: seats, count: 0 });
        }
        for (var i = 0; i < state.roster.length; i++) {
            var room = rooms[Math.floor(i / per)];
            var k = i % per;
            room.seats[k] = {
                seatNo: k + 1,
                name: state.roster[i].name,
                sid: state.roster[i].id,
                examNo: examNoOf(i, room.no - 1, k)
            };
            room.count++;
        }
        return rooms;
    }

    function fillLabel() {
        if (state.fill === 'snake') { return '蛇形编号'; }
        if (state.fill === 'col') { return '按列编号'; }
        return '按行编号';
    }

    function examNoLabel() {
        if (state.examNoMode === 'id') { return '名单中的学号'; }
        if (state.examNoMode === 'room-seat') { return '考场号 + 座位号'; }
        return '顺序编号（起始 ' + state.startNo + '，' + state.examNoWidth + ' 位）';
    }

    /* ---------- 渲染 ---------- */

    function render() {
        var rooms = arrange();
        els.preview.innerHTML = '';
        if (!state.roster.length) {
            els.preview.appendChild(els.empty);
        } else {
            var frag = document.createDocumentFragment();
            if (state.mode === 'labels') { labelPages(frag, rooms); }
            else if (state.mode === 'roster') { rosterPages(frag, rooms); }
            else { roomPages(frag, rooms); }
            els.preview.appendChild(frag);
        }
        updateStat(rooms);
        syncSeg();
    }

    function updateStat(rooms) {
        if (!state.roster.length) {
            els.stat.textContent = '尚未导入名单';
            chrome.setStatus('待导入名单', 'warn');
            return;
        }
        els.stat.textContent = state.roster.length + ' 人 · 每考场 ' +
            state.rows + '×' + state.cols + ' = ' + perRoom() + ' 座 · 共 ' + rooms.length + ' 个考场';
        chrome.setStatus('已编排 ' + state.roster.length + ' 人' +
            (rosterSource ? '（离线名单 ' + rosterSource + '）' : ''), 'ok');
    }

    function syncSeg() {
        var btns = els.seg.getElementsByTagName('button');
        for (var i = 0; i < btns.length; i++) {
            var on = btns[i].getAttribute('data-mode') === state.mode;
            if (on) { btns[i].className = 'is-on'; } else { btns[i].className = ''; }
        }
        els.btnPrintLabel.textContent = MODE_LABEL[state.mode] || '打印';
    }

    function text(tag, cls, value) {
        var node = document.createElement(tag);
        if (cls) { node.className = cls; }
        node.textContent = value;
        return node;
    }

    function pageHead(right) {
        var box = document.createElement('div');
        box.className = 'esp-head';
        box.appendChild(text('div', 'esp-head__title', (state.examTitle || '考试') + ' 座位表'));
        var sub = [];
        if (state.school) { sub.push(state.school); }
        sub.push('考场座位表 · 按座位号编排：' + fillLabel());
        box.appendChild(text('div', 'esp-head__sub', sub.join(' · ')));
        if (right && right.length) {
            var line = document.createElement('div');
            line.className = 'esp-head__line';
            for (var i = 0; i < right.length; i++) {
                line.appendChild(text('span', null, right[i]));
            }
            box.appendChild(line);
        }
        return box;
    }

    function pageFoot(left, right) {
        var f = document.createElement('div');
        f.className = 'esp-foot';
        f.appendChild(text('span', null, left));
        f.appendChild(text('span', null, right));
        return f;
    }

    function pageEl() {
        var p = document.createElement('section');
        p.className = 'esp-page';
        return p;
    }

    function seatCell(seat, seatNo) {
        var d = document.createElement('div');
        if (!seat) {
            d.className = 'esp-cell is-empty';
            d.appendChild(text('span', 'esp-cell__no', seatNo + ' 号'));
            d.appendChild(text('span', 'esp-cell__name', '空位'));
            return d;
        }
        d.className = 'esp-cell';
        d.appendChild(text('span', 'esp-cell__no', seat.seatNo + ' 号'));
        d.appendChild(text('span', 'esp-cell__name', seat.name));
        d.appendChild(text('span', 'esp-cell__exam', seat.examNo));
        return d;
    }

    /* ① 考场座位总表：一个考场一页 */
    function roomPages(frag, rooms) {
        for (var r = 0; r < rooms.length; r++) {
            var room = rooms[r];
            var page = pageEl();
            page.appendChild(pageHead([
                '第 ' + room.no + ' 考场',
                '考生 ' + room.count + ' 人 / ' + perRoom() + ' 座',
                '监考签名：____________'
            ]));

            page.appendChild(text('div', 'esp-podium', '讲 台'));

            var grid = document.createElement('div');
            grid.className = 'esp-grid';
            grid.style.gridTemplateColumns = 'repeat(' + state.cols + ', minmax(0, 1fr))';
            for (var row = 0; row < state.rows; row++) {
                for (var col = 0; col < state.cols; col++) {
                    var k = kOf(row, col);
                    grid.appendChild(seatCell(room.seats[k], k + 1));
                }
            }
            page.appendChild(grid);
            page.appendChild(pageFoot('编号：' + fillLabel() + '；考号规则：' + examNoLabel(),
                '第 ' + (r + 1) + ' / ' + rooms.length + ' 页'));
            frag.appendChild(page);
        }
    }

    /* ② 座位贴条：裁开贴课桌 */
    function labelEl(roomNo, seat) {
        var d = document.createElement('div');
        d.className = 'esp-label';
        var head = document.createElement('div');
        head.className = 'esp-label__head';
        head.appendChild(text('span', 'esp-label__room', '第 ' + roomNo + ' 考场'));
        head.appendChild(text('span', null, '座位 ' + seat.seatNo + ' 号'));
        d.appendChild(head);
        d.appendChild(text('div', 'esp-label__name', seat.name));
        d.appendChild(text('div', 'esp-label__meta',
            '考号 ' + seat.examNo + (seat.sid ? ' · 学号 ' + seat.sid : '')));
        return d;
    }

    function labelPages(frag, rooms) {
        var perPage = state.labelCols * LABEL_ROWS;
        var items = [];
        for (var r = 0; r < rooms.length; r++) {
            for (var k = 0; k < rooms[r].seats.length; k++) {
                if (rooms[r].seats[k]) { items.push({ room: rooms[r].no, seat: rooms[r].seats[k] }); }
            }
        }
        var total = Math.max(1, Math.ceil(items.length / perPage));
        for (var p = 0; p < total; p++) {
            var page = pageEl();
            var grid = document.createElement('div');
            grid.className = 'esp-labels';
            grid.style.gridTemplateColumns = 'repeat(' + state.labelCols + ', minmax(0, 1fr))';
            for (var i = p * perPage; i < Math.min(items.length, (p + 1) * perPage); i++) {
                grid.appendChild(labelEl(items[i].room, items[i].seat));
            }
            page.appendChild(grid);
            page.appendChild(pageFoot('沿虚线裁开，贴在课桌左上角',
                '第 ' + (p + 1) + ' / ' + total + ' 页 · 每页 ' + perPage + ' 张'));
            frag.appendChild(page);
        }
    }

    /* ③ 考场签到表 */
    function rosterPages(frag, rooms) {
        var chunks = [];
        for (var r = 0; r < rooms.length; r++) {
            var rows = [];
            for (var k = 0; k < rooms[r].seats.length; k++) {
                if (rooms[r].seats[k]) { rows.push(rooms[r].seats[k]); }
            }
            for (var i = 0; i < rows.length; i += TABLE_ROWS) {
                chunks.push({ room: rooms[r], rows: rows.slice(i, i + TABLE_ROWS) });
            }
        }
        for (var c = 0; c < chunks.length; c++) {
            var page = pageEl();
            page.appendChild(pageHead([
                '第 ' + chunks[c].room.no + ' 考场',
                '应到 ' + chunks[c].room.count + ' 人',
                '实到 ______ 人'
            ]));
            var table = document.createElement('table');
            table.className = 'esp-table';
            var thead = document.createElement('thead');
            thead.innerHTML = '<tr><th style="width:15%">座位号</th>' +
                '<th style="width:22%">考号</th><th style="width:28%">姓名</th>' +
                '<th>考生签名</th></tr>';
            table.appendChild(thead);
            var tbody = document.createElement('tbody');
            for (var t = 0; t < chunks[c].rows.length; t++) {
                var tr = document.createElement('tr');
                tr.appendChild(text('td', 'is-center', chunks[c].rows[t].seatNo + ' 号'));
                tr.appendChild(text('td', 'is-center', chunks[c].rows[t].examNo));
                tr.appendChild(text('td', null, chunks[c].rows[t].name));
                tr.appendChild(text('td', null, ''));
                tbody.appendChild(tr);
            }
            table.appendChild(tbody);
            page.appendChild(table);
            page.appendChild(pageFoot('缺考情况：____________________',
                '第 ' + (c + 1) + ' / ' + chunks.length + ' 页 · 监考教师签名：____________'));
            frag.appendChild(page);
        }
    }

    /* ---------- 模式 / 打印 / 数据 ---------- */

    function setMode(mode) {
        if (MODES.indexOf(mode) < 0) { return; }
        state.mode = mode;
        store.set('mode', mode);
        render();
    }

    function doPrint() {
        if (!state.roster.length) { chrome.toast('先导入名单', 'warn'); return; }
        if (typeof window.print !== 'function') { chrome.toast('当前环境不支持打印', 'err'); return; }
        window.setTimeout(function () {
            try { window.print(); } catch (e) { chrome.toast('打印失败，请用浏览器打印快捷键', 'err'); }
        }, 60);
    }

    function exportCsv() {
        if (!state.roster.length) { chrome.toast('先导入名单', 'warn'); return; }
        var rooms = arrange();
        var lines = ['考场,座位号,考号,姓名,学号'];
        for (var r = 0; r < rooms.length; r++) {
            for (var k = 0; k < rooms[r].seats.length; k++) {
                var s = rooms[r].seats[k];
                if (!s) { continue; }
                lines.push([rooms[r].no, s.seatNo, s.examNo, s.name, s.sid].map(csvCell).join(','));
            }
        }
        var name = (state.examTitle || '考试').replace(/[\\/:*?"<>|]/g, '') + '-座位表.csv';
        download(name, '\uFEFF' + lines.join('\r\n'));
    }

    function csvCell(v) {
        var s = String(v === undefined || v === null ? '' : v);
        if (/[",\r\n]/.test(s)) { return '"' + s.split('"').join('""') + '"'; }
        return s;
    }

    function download(filename, content) {
        try {
            var blob = new Blob([content], { type: 'text/csv;charset=utf-8' });
            var url = URL.createObjectURL(blob);
            var a = document.createElement('a');
            a.href = url;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            window.setTimeout(function () {
                if (a.parentNode) { a.parentNode.removeChild(a); }
                URL.revokeObjectURL(url);
            }, 0);
            chrome.toast('已导出 ' + filename, 'ok');
        } catch (e) {
            chrome.toast('导出失败', 'err');
        }
    }

    function shuffleRoster() {
        if (state.roster.length < 2) { chrome.toast('名单太少，无需打乱', 'warn'); return; }
        for (var i = state.roster.length - 1; i > 0; i--) {
            var j = Math.floor(Math.random() * (i + 1));
            var t = state.roster[i];
            state.roster[i] = state.roster[j];
            state.roster[j] = t;
        }
        persist();
        render();
        try { chrome.beep('win'); } catch (e) { /* 静默 */ }
        chrome.toast(state.examNoMode === 'seq' ? '已打乱，考号按新顺序重排' : '已打乱考场分派顺序', 'ok');
    }

    function clearRoster() {
        if (!state.roster.length) { chrome.toast('名单已经是空的'); return; }
        chrome.modal({
            title: '清空名单',
            icon: 'i-trash',
            size: 'narrow',
            body: '<p style="margin:0;font-size:13.5px;line-height:1.9">将删除本机保存的 <b>' +
                state.roster.length + '</b> 名考生，打印设置保留。此操作不可撤销。</p>',
            buttons: [
                { label: '取消' },
                {
                    label: '清空',
                    primary: true,
                    danger: true,
                    onClick: function (close) {
                        state.roster = [];
                        persist();
                        render();
                        close();
                        chrome.toast('名单已清空');
                    }
                }
            ]
        });
    }

    function openImport() {
        if (!(window.ET && ET.Import)) { chrome.toast('导入组件未加载'); return; }
        var lines = [];
        for (var i = 0; i < state.roster.length; i++) {
            lines.push(state.roster[i].sid ? state.roster[i].name + ',' + state.roster[i].sid : state.roster[i].name);
        }
        ET.Import.open({
            toolId: TOOL_ID,
            title: '导入考生名单',
            columns: ['name', 'id'],
            current: lines.join('\n'),
            placeholder: '一行一名考生，也可直接粘贴 Excel 整列：\n张三\n李四,2026002',
            help: '支持 <b>姓名</b>、<b>姓名,学号</b>、<b>学号,姓名</b>，也支持带表头的 CSV' +
                '（姓名 / 学号列自动识别，Excel 请先另存为 CSV）。学号会作为「学号」打印在座位贴条上。',
            onConfirm: function (rows) {
                var list = [];
                for (var r = 0; r < rows.length; r++) {
                    if (!rows[r].name) { continue; }
                    list.push({ name: rows[r].name, id: rows[r].id || '' });
                }
                state.roster = list;
                persist();
                render();
                try { chrome.beep('ok'); } catch (e) { /* 静默 */ }
                chrome.toast('已导入 ' + list.length + ' 人，分 ' + arrange().length + ' 个考场', 'ok');
            }
        });
    }

    function generateRoster(from, to, tpl) {
        from = clampInt(from, 1, 9999);
        to = clampInt(to, from, 9999);
        if (to - from + 1 > 999) { chrome.toast('一次最多生成 999 人', 'warn'); return; }
        var list = [];
        for (var n = from; n <= to; n++) {
            list.push({ name: (tpl || '考生{n}').split('{n}').join(String(n)), id: String(n) });
        }
        state.roster = list;
        persist();
        render();
        chrome.toast('已生成 ' + list.length + ' 人名单', 'ok');
    }

    /* ---------- 设置抽屉 ---------- */

    function options(pairs, current) {
        var out = '';
        for (var i = 0; i < pairs.length; i++) {
            out += '<option value="' + pairs[i][0] + '"' +
                (pairs[i][0] === current ? ' selected' : '') + '>' + pairs[i][1] + '</option>';
        }
        return out;
    }

    function buildSettings(body) {
        var v = function (s) { return ET.escapeHtml(s); };
        body.innerHTML =
            '<h4>打印抬头</h4>' +
            '<div class="et-drawer__row">' +
            '<input class="et-drawer__input" id="espSetExam" value="' + v(state.examTitle) +
            '" placeholder="考试名称，如 期中考试"></div>' +
            '<div class="et-drawer__row" style="margin-top:8px">' +
            '<input class="et-drawer__input" id="espSetSchool" value="' + v(state.school) +
            '" placeholder="学校 / 考点（可留空）"></div>' +

            '<h4>考场座位</h4>' +
            '<div class="et-drawer__row">' +
            '<input class="et-drawer__input" id="espSetRows" type="number" min="1" max="20" value="' +
            state.rows + '" style="flex:0 0 76px" title="每考场行数">' +
            '<span class="etimp-dim">行</span>' +
            '<input class="et-drawer__input" id="espSetCols" type="number" min="1" max="20" value="' +
            state.cols + '" style="flex:0 0 76px" title="每考场列数">' +
            '<span class="etimp-dim">列</span>' +
            '</div>' +
            '<div class="et-drawer__row" style="margin-top:8px">' +
            '<select class="et-drawer__input" id="espSetFill">' +
            options([['snake', '蛇形编号（推荐）'], ['row', '按行编号'], ['col', '按列编号']], state.fill) +
            '</select></div>' +
            '<p class="et-drawer__tip" id="espSetSummary"></p>' +

            '<h4>考号规则</h4>' +
            '<div class="et-drawer__row">' +
            '<select class="et-drawer__input" id="espSetExamNo">' +
            options([['room-seat', '考场号 + 座位号（0203）'], ['seq', '按名单顺序编号'],
                ['id', '使用名单中的学号']], state.examNoMode) +
            '</select></div>' +
            '<div class="et-drawer__row" style="margin-top:8px">' +
            '<input class="et-drawer__input" id="espSetStart" type="number" min="0" max="999999" value="' +
            state.startNo + '" style="flex:0 0 86px" title="起始考号">' +
            '<input class="et-drawer__input" id="espSetWidth" type="number" min="1" max="10" value="' +
            state.examNoWidth + '" style="flex:0 0 86px" title="考号位数">' +
            '<span class="etimp-dim">起始号 / 位数</span>' +
            '</div>' +
            '<p class="et-drawer__tip">起始号与位数仅「按名单顺序编号」时生效（起始 1、4 位 → 0001）。</p>' +

            '<h4>座位贴条</h4>' +
            '<div class="et-drawer__row">' +
            '<select class="et-drawer__input" id="espSetLabelCols">' +
            options([['2', '每页 2 列（16 张）'], ['3', '每页 3 列（24 张）'], ['4', '每页 4 列（32 张）']],
                String(state.labelCols)) +
            '</select></div>' +
            '<p class="et-drawer__tip">每页固定 8 行；打印后沿虚线裁开贴在课桌左上角。</p>' +

            '<h4>名单</h4>' +
            '<div class="et-drawer__row">' +
            '<input class="et-drawer__input" id="espGenFrom" type="number" min="1" max="9999" value="1"' +
            ' style="flex:0 0 76px" title="起始学号">' +
            '<span class="etimp-dim">到</span>' +
            '<input class="et-drawer__input" id="espGenTo" type="number" min="1" max="9999" value="' +
            Math.max(1, state.roster.length || 40) + '" style="flex:0 0 76px" title="结束学号">' +
            '<input class="et-drawer__input" id="espGenTpl" value="考生{n}" title="姓名模板，{n} 为学号">' +
            '<button class="et-btn" id="espGenBtn" type="button">生成</button>' +
            '</div>' +
            '<p class="et-drawer__tip">按起止学号快速生成名单，学号同时写入「学号」列' +
            '（模板中 <b>{n}</b> 代表学号）。当前名单 <b id="espSetCount">' + state.roster.length + '</b> 人。</p>' +
            '<div class="et-drawer__row" style="margin-top:8px">' +
            '<button class="et-btn" id="espSetImport" type="button">导入名单</button>' +
            '<button class="et-btn" id="espSetCsv" type="button">导出 CSV</button>' +
            '<button class="et-btn et-btn--danger" id="espSetClear" type="button">清空</button>' +
            '</div>' +

            '<h4>离线名单（推荐）</h4>' +
            '<p class="et-drawer__tip">把名单存成 <b>roster.js</b> 放在本工具同目录，下次双击打开自动加载：' +
            '<br><code style="font-family:var(--et-mono);font-size:12px">window.ET_ROSTER = "张三\\n李四,2026002";</code>' +
            '<br>在线打开时也支持 <b>roster.txt</b>（一行一个，UTF-8）。离线名单优先于本机保存的名单。</p>';

        var q = function (id) { return document.getElementById(id); };
        var summary = function () {
            var per = perRoom();
            var need = state.roster.length ? Math.ceil(state.roster.length / per) : 0;
            var warn = per > 60 ? '（建议每考场 ≤ 60 座，否则一页 A4 排不下）' : '';
            q('espSetSummary').innerHTML = '每考场 <b>' + state.rows + '×' + state.cols + ' = ' + per +
                '</b> 座；当前 ' + state.roster.length + ' 人 → 需要 <b>' + need + '</b> 个考场。' + warn;
        };

        q('espSetExam').addEventListener('input', function () { state.examTitle = this.value; persist(); render(); });
        q('espSetSchool').addEventListener('input', function () { state.school = this.value; persist(); render(); });
        q('espSetRows').addEventListener('change', function () {
            state.rows = clampInt(this.value, 1, 20);
            this.value = state.rows;
            persist(); render(); summary();
        });
        q('espSetCols').addEventListener('change', function () {
            state.cols = clampInt(this.value, 1, 20);
            this.value = state.cols;
            persist(); render(); summary();
        });
        q('espSetFill').addEventListener('change', function () {
            state.fill = this.value; persist(); render();
        });
        q('espSetExamNo').addEventListener('change', function () {
            state.examNoMode = this.value; persist(); render();
        });
        q('espSetStart').addEventListener('change', function () {
            state.startNo = clampInt(this.value, 0, 999999);
            this.value = state.startNo;
            persist(); render();
        });
        q('espSetWidth').addEventListener('change', function () {
            state.examNoWidth = clampInt(this.value, 1, 10);
            this.value = state.examNoWidth;
            persist(); render();
        });
        q('espSetLabelCols').addEventListener('change', function () {
            state.labelCols = clampInt(this.value, 2, 4);
            persist(); render();
        });
        q('espGenBtn').addEventListener('click', function () {
            generateRoster(q('espGenFrom').value, q('espGenTo').value, q('espGenTpl').value);
            q('espSetCount').textContent = String(state.roster.length);
            summary();
        });
        q('espSetImport').addEventListener('click', openImport);
        q('espSetCsv').addEventListener('click', exportCsv);
        q('espSetClear').addEventListener('click', function () {
            clearRoster();
            q('espSetCount').textContent = String(state.roster.length);
            summary();
        });

        summary();
    }

    /* ---------- 离线名单（优先级最高） ---------- */

    function tryOfflineRoster() {
        var rows = null;

        /* 1. roster.js（同步，file:// 与 http 均可） */
        if (Array.isArray(window.ET_ROSTER)) {
            rows = window.ET_ROSTER.map(function (x) {
                return typeof x === 'string'
                    ? { name: String(x).trim(), id: '' }
                    : { name: String(x.name || '').trim(), id: String(x.id || '').trim() };
            });
        } else if (typeof window.ET_ROSTER === 'string' && window.ET_ROSTER.trim()) {
            rows = ET.Import.parseText(window.ET_ROSTER, { id: true }).rows;
        }

        rows = normalizeRoster(rows);
        if (rows.length) {
            state.roster = rows;
            rosterSource = 'roster.js';
            persist();
            return;
        }

        /* 2. roster.txt（仅 http(s)） */
        if (/^https?:$/.test(location.protocol)) {
            fetch('roster.txt', { cache: 'no-store' }).then(function (res) {
                if (!res.ok) { return; }
                return res.text().then(function (t) {
                    if (!t.trim()) { return; }
                    var parsed = normalizeRoster(ET.Import.parseText(t, { id: true }).rows);
                    if (!parsed.length) { return; }
                    state.roster = parsed;
                    rosterSource = 'roster.txt';
                    persist();
                    render();
                });
            }).catch(function () { /* 没有 roster.txt 时静默 */ });
        }
    }

    /* ---------- 事件与启动 ---------- */

    els.btnPrint.addEventListener('click', doPrint);
    els.btnImport.addEventListener('click', openImport);

    var segBtns = els.seg.getElementsByTagName('button');
    for (var b = 0; b < segBtns.length; b++) {
        (function (btn) {
            btn.addEventListener('click', function () { setMode(btn.getAttribute('data-mode')); });
        })(segBtns[b]);
    }

    document.addEventListener('keydown', function (e) {
        if (isTypingTarget(e.target)) { return; }
        if (e.key === '1') { setMode('rooms'); }
        else if (e.key === '2') { setMode('labels'); }
        else if (e.key === '3') { setMode('roster'); }
        else if ((e.key === 'p' || e.key === 'P') && !e.ctrlKey && !e.metaKey) { doPrint(); }
    });

    tryOfflineRoster();
    render();
})();
</script>
