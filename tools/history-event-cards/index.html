/* ============ 设计令牌 ============ */
:root {
    --et-accent: #2563eb;
    --et-accent-weak: rgba(37, 99, 235, .14);
    --et-bg: #f4f6fb;
    --et-surface: #ffffff;
    --et-surface-2: #f8fafc;
    --et-fg: #0b1220;
    --et-muted: #64748b;
    --et-line: rgba(15, 23, 42, .12);
    --et-line-strong: rgba(15, 23, 42, .22);
    --et-glass: rgba(255, 255, 255, .85);
    --et-shadow-md: 0 10px 28px -18px rgba(15, 23, 42, .3);
    --et-shadow-lg: 0 24px 60px -32px rgba(15, 23, 42, .4);
    --et-ok: #059669;
    --et-warn: #d97706;
    --et-err: #dc2626;
    --et-radius: 12px;
    --et-radius-sm: 9px;
    --et-font: -apple-system, BlinkMacSystemFont, "Segoe UI",
               "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei",
               "Noto Sans SC", sans-serif;
    --et-mono: ui-monospace, "Cascadia Mono", Consolas, Menlo, monospace;
}

html[data-et-theme="dark"] {
    --et-bg: #0b1120;
    --et-surface: #111a2e;
    --et-surface-2: #0f1729;
    --et-fg: #f1f5f9;
    --et-muted: #94a3b8;
    --et-line: rgba(148, 163, 184, .18);
    --et-line-strong: rgba(148, 163, 184, .3);
    --et-glass: rgba(17, 26, 46, .85);
    --et-shadow-md: 0 10px 34px -18px rgba(0, 0, 0, .8);
    --et-shadow-lg: 0 24px 70px -30px rgba(0, 0, 0, .9);
    --et-ok: #34d399;
    --et-warn: #fbbf24;
    --et-err: #f87171;
}

/* ============ 基础 ============ */
.et-app {
    position: relative;
    isolation: isolate;
    display: flex;
    flex-direction: column;
    height: 100vh;
    height: 100dvh;
    overflow: hidden;
    background: var(--et-bg);
    color: var(--et-fg);
    font-family: var(--et-font);
    -webkit-font-smoothing: antialiased;
    transition: background .25s, color .25s;
}

/* 极光背景：径向渐变 + 呼吸动画（edupick 品质基线，老内核也不掉帧） */
.et-app::before {
    content: '';
    position: fixed;
    inset: 0;
    z-index: -1;
    pointer-events: none;
    background:
        radial-gradient(46% 40% at 20% 18%, var(--et-accent-weak), transparent 65%),
        radial-gradient(42% 38% at 82% 24%, var(--et-accent-weak), transparent 70%),
        radial-gradient(50% 44% at 55% 95%, rgba(16, 185, 129, .10), transparent 65%);
    animation: et-aurora 16s ease-in-out infinite alternate;
}

@keyframes et-aurora {
    from { opacity: .55; transform: scale(1); }
    to { opacity: 1; transform: scale(1.06); }
}

.et-app *,
.et-app *::before,
.et-app *::after { box-sizing: border-box; }

[hidden] { display: none !important; }

.et-icon {
    width: 18px;
    height: 18px;
    fill: none;
    stroke: currentColor;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
    flex: none;
}

/* ============ 顶栏 ============ */
.et-topbar {
    flex: none;
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 11px 20px;
    border-bottom: 1px solid var(--et-line);
    background: var(--et-glass);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    z-index: 20;
}

.et-brand {
    display: flex;
    align-items: center;
    gap: 10px;
    min-width: 0;
}

.et-brand__dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: var(--et-accent);
    box-shadow: 0 0 0 4px var(--et-accent-weak);
    flex: none;
}

.et-brand__name {
    font-weight: 800;
    font-size: 15px;
    letter-spacing: -.01em;
    white-space: nowrap;
}

.et-brand__sub {
    font-size: 12.5px;
    color: var(--et-muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.et-status {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 5px 14px;
    border-radius: 999px;
    font-size: 12.5px;
    color: var(--et-muted);
    background: var(--et-surface-2);
    border: 1px solid var(--et-line);
    white-space: nowrap;
    max-width: 42vw;
    overflow: hidden;
    text-overflow: ellipsis;
}

.et-status__dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--et-ok);
    flex: none;
    transition: background .2s;
}

.et-status[data-tone="err"] .et-status__dot { background: var(--et-err); }
.et-status[data-tone="warn"] .et-status__dot { background: var(--et-warn); }

.et-actions {
    display: flex;
    align-items: center;
    gap: 7px;
}

.et-icon-btn {
    display: inline-grid;
    place-items: center;
    width: 38px;
    height: 38px;
    font-size: 16px;
    line-height: 1;
    border-radius: 11px;
    border: 1px solid var(--et-line);
    background: var(--et-surface-2);
    color: var(--et-fg);
    cursor: pointer;
    transition: transform .14s, border-color .14s, color .14s, opacity .14s;
    -webkit-tap-highlight-color: transparent;
}

.et-icon-btn:hover {
    border-color: var(--et-accent);
    color: var(--et-accent);
    transform: translateY(-1px);
}

.et-icon-btn:active { transform: translateY(0); }
.et-icon-btn.is-off { opacity: .4; }
.et-icon-btn:focus-visible { outline: 2px solid var(--et-accent); outline-offset: 2px; }

/* ============ 主区默认 ============ */
.et-main {
    flex: 1;
    min-height: 0;
    position: relative;
    overflow: auto;
}

/* ============ 页脚（品牌回流 L2） ============ */
.et-footer {
    flex: none;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 7px 16px;
    font-size: 12px;
    color: var(--et-muted);
    border-top: 1px solid var(--et-line);
    background: var(--et-glass);
    user-select: none;
    z-index: 20;
}

.et-footer a {
    color: inherit;
    text-decoration: none;
    transition: color .14s;
}

.et-footer a:hover { color: var(--et-accent); }

/* ============ 按钮 ============ */
.et-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
    padding: 9px 16px;
    border-radius: 11px;
    font: inherit;
    font-size: 13.5px;
    font-weight: 700;
    border: 1px solid var(--et-line);
    background: var(--et-surface-2);
    color: var(--et-fg);
    cursor: pointer;
    transition: transform .14s, border-color .14s, color .14s, background .14s, box-shadow .14s;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
}

.et-btn:hover {
    border-color: var(--et-accent);
    color: var(--et-accent);
    transform: translateY(-1px);
}

.et-btn:active { transform: translateY(0); }
.et-btn:focus-visible { outline: 2px solid var(--et-accent); outline-offset: 2px; }
.et-btn:disabled { opacity: .45; cursor: not-allowed; transform: none; }

.et-btn--primary {
    background: var(--et-accent);
    border-color: var(--et-accent);
    color: #fff;
    box-shadow: 0 6px 18px -8px var(--et-accent);
}

.et-btn--primary:hover { color: #fff; filter: brightness(1.08); }
.et-btn--primary:disabled { filter: none; }

.et-btn--danger:hover {
    border-color: var(--et-err);
    color: var(--et-err);
}

.et-btn--lg {
    padding: 13px 26px;
    font-size: 16px;
    border-radius: 14px;
}

/* ============ 弹窗 ============ */
.et-modal {
    position: fixed;
    inset: 0;
    z-index: 100;
    display: grid;
    place-items: center;
    padding: 24px;
    background: rgba(2, 6, 23, .55);
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    animation: et-fade .18s ease;
}

.et-modal__panel {
    width: min(680px, 94vw);
    max-height: 86vh;
    max-height: 86dvh;
    display: flex;
    flex-direction: column;
    background: var(--et-surface);
    border: 1px solid var(--et-line);
    border-radius: 16px;
    box-shadow: var(--et-shadow-lg);
    animation: et-pop .2s cubic-bezier(.34, 1.4, .64, 1);
    overflow: hidden;
}

.et-modal__panel--narrow { width: min(460px, 92vw); }
.et-modal__panel--wide { width: min(900px, 94vw); }

.et-modal__head {
    flex: none;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 16px 20px;
    border-bottom: 1px solid var(--et-line);
    font-weight: 800;
    font-size: 15px;
}

.et-modal__head .et-icon-btn {
    margin-left: auto;
    width: 32px;
    height: 32px;
}

.et-modal__body {
    flex: 1;
    min-height: 0;
    overflow: auto;
    padding: 18px 20px;
}

.et-modal__foot {
    flex: none;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 14px 20px;
    border-top: 1px solid var(--et-line);
    background: var(--et-surface-2);
}

.et-modal__foot .spacer { flex: 1; }

@keyframes et-fade {
    from { opacity: 0; }
}

@keyframes et-pop {
    from { opacity: 0; transform: translateY(14px) scale(.97); }
}

/* ============ 轻提示（toast） ============ */
.et-toast {
    position: fixed;
    left: 50%;
    bottom: 56px;
    transform: translateX(-50%) translateY(10px);
    z-index: 120;
    display: flex;
    align-items: center;
    gap: 9px;
    max-width: min(520px, 88vw);
    padding: 11px 18px;
    border-radius: 12px;
    font-size: 13.5px;
    font-weight: 600;
    color: #fff;
    background: rgba(15, 23, 42, .92);
    border: 1px solid rgba(148, 163, 184, .25);
    box-shadow: var(--et-shadow-lg);
    opacity: 0;
    pointer-events: none;
    transition: opacity .22s, transform .22s;
}

.et-toast.is-show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
}

.et-toast[data-tone="ok"] { background: rgba(5, 150, 105, .95); }
.et-toast[data-tone="err"] { background: rgba(220, 38, 38, .95); }
.et-toast[data-tone="warn"] { background: rgba(217, 119, 6, .95); }

/* ============ 设置抽屉（右上角入口，edupick 交互） ============ */
.et-drawer-backdrop {
    position: fixed;
    inset: 0;
    z-index: 90;
    background: rgba(2, 6, 23, .45);
    backdrop-filter: blur(3px);
    -webkit-backdrop-filter: blur(3px);
    opacity: 0;
    transition: opacity .2s;
}

.et-drawer-backdrop.is-open { opacity: 1; }

.et-drawer {
    position: absolute;
    top: 0;
    right: 0;
    height: 100%;
    width: min(400px, 92vw);
    display: flex;
    flex-direction: column;
    background: var(--et-surface);
    border-left: 1px solid var(--et-line);
    box-shadow: var(--et-shadow-lg);
    transform: translateX(100%);
    transition: transform .22s cubic-bezier(.32, .72, .35, 1);
}

.et-drawer-backdrop.is-open .et-drawer { transform: translateX(0); }

.et-drawer__head {
    flex: none;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 15px 18px;
    border-bottom: 1px solid var(--et-line);
    font-weight: 800;
    font-size: 15px;
    color: var(--et-accent);
}

.et-drawer__head .et-icon-btn {
    margin-left: auto;
    width: 32px;
    height: 32px;
}

.et-drawer__body {
    flex: 1;
    min-height: 0;
    overflow: auto;
    padding: 16px 18px 24px;
}

/* 抽屉内容通用小节（工具复用） */
.et-drawer__body h4 {
    margin: 18px 0 8px;
    font-size: 12px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: .08em;
    color: var(--et-muted);
}

.et-drawer__body h4:first-child { margin-top: 0; }

.et-drawer__row {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
}

.et-drawer__tip {
    margin: 8px 0 0;
    font-size: 12px;
    line-height: 1.8;
    color: var(--et-muted);
}

.et-drawer__tip b { color: var(--et-fg); }

.et-drawer__input {
    flex: 1;
    min-width: 0;
    padding: 9px 12px;
    border: 1px solid var(--et-line-strong);
    border-radius: 9px;
    background: var(--et-surface-2);
    color: var(--et-fg);
    font: inherit;
    font-size: 13.5px;
    transition: border-color .14s, box-shadow .14s;
}

.et-drawer__input:focus {
    outline: none;
    border-color: var(--et-accent);
    box-shadow: 0 0 0 3px var(--et-accent-weak);
}

.et-drawer__switch {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 10px 0;
    border-bottom: 1px dashed var(--et-line);
    font-size: 13.5px;
    font-weight: 600;
    color: var(--et-fg);
    cursor: pointer;
    user-select: none;
}

.et-drawer__switch input {
    width: 17px;
    height: 17px;
    accent-color: var(--et-accent);
    cursor: pointer;
}
</style>

    var audioCtx = null;

    function ensureCtx() {
        if (!audioCtx) {
            var AC = global.AudioContext || global.webkitAudioContext;
            if (!AC) { return null; }
            try { audioCtx = new AC(); } catch (err) { return null; }
        }
        if (audioCtx.state === 'suspended') {
            try { audioCtx.resume(); } catch (err) { /* 忽略 */ }
        }
        return audioCtx;
    }

    var MASTER_GAIN = 0.5; /* 整体音量层（教室设备音量 100% 也要听得清） */

    function tone(ctx, freq, start, dur, gainPeak, type) {
        var osc = ctx.createOscillator();
        var gain = ctx.createGain();
        osc.type = type || 'triangle';
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(0, start);
        gain.gain.linearRampToValueAtTime(gainPeak, start + 0.012);
        gain.gain.exponentialRampToValueAtTime(0.0001, start + dur);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(start);
        osc.stop(start + dur + 0.05);
    }

    var BEEPS = {
        tick: [[880, 0, 0.06, 0.42]],
        ok: [[660, 0, 0.1, 0.46], [880, 0.1, 0.14, 0.46]],
        win: [[523.25, 0, 0.16, 0.5], [659.25, 0.12, 0.16, 0.5], [783.99, 0.24, 0.16, 0.5], [1046.5, 0.36, 0.34, 0.52]],
        err: [[220, 0, 0.22, 0.46, 'square']],
        over: [[880, 0, 0.18, 0.5], [659.25, 0.2, 0.18, 0.5], [523.25, 0.4, 0.36, 0.5]]
    };

    function playBeep(kind) {
        var ctx = ensureCtx();
        if (!ctx || !BEEPS[kind]) { return; }
        var seq = BEEPS[kind];
        var t0 = ctx.currentTime + 0.01;
        for (var i = 0; i < seq.length; i++) {
            tone(ctx, seq[i][0], t0 + seq[i][1], seq[i][2], seq[i][3] * MASTER_GAIN, seq[i][4]);
        }
    }

    /* ---------- 设置抽屉 ---------- */

    function openDrawer(title, build) {
        var backdrop = el('div', 'et-drawer-backdrop');
        var drawer = el('aside', 'et-drawer');
        drawer.setAttribute('role', 'dialog');
        drawer.setAttribute('aria-label', title);

        var head = el('div', 'et-drawer__head');
        head.appendChild(makeIcon('i-sliders'));
        head.appendChild(el('span', 'et-drawer__title', title));
        head.appendChild(makeBtn('i-x', '关闭', close));
        drawer.appendChild(head);

        var body = el('div', 'et-drawer__body');
        drawer.appendChild(body);

        backdrop.appendChild(drawer);
        document.body.appendChild(backdrop);
        requestAnimationFrame(function () { backdrop.classList.add('is-open'); });

        function close() {
            backdrop.classList.remove('is-open');
            document.removeEventListener('keydown', onKey);
            setTimeout(function () {
                if (backdrop.parentNode) { backdrop.parentNode.removeChild(backdrop); }
            }, 220);
        }
        function onKey(ev) {
            if (ev.key === 'Escape') { ev.stopPropagation(); close(); }
        }
        document.addEventListener('keydown', onKey);
        backdrop.addEventListener('mousedown', function (ev) {
            if (ev.target === backdrop) { close(); }
        });

        if (typeof build === 'function') { build(body, { close: close }); }
        return { body: body, close: close };
    }

    /* ---------- 通用弹窗 / toast（同时挂模块级，供其他共享组件使用） ---------- */

    function modal(mo) {
        var backdrop = el('div', 'et-modal');
        var panel = el('div', 'et-modal__panel' + (mo.size === 'narrow' ? ' et-modal__panel--narrow'
            : mo.size === 'wide' ? ' et-modal__panel--wide' : ''));
        var head = el('div', 'et-modal__head');
        if (mo.icon) { head.appendChild(makeIcon(mo.icon)); }
        head.appendChild(el('span', null, mo.title || ''));
        head.appendChild(makeBtn('i-x', '关闭', close));
        panel.appendChild(head);

        var body = el('div', 'et-modal__body');
        if (typeof mo.body === 'string') { body.innerHTML = mo.body; }
        else if (mo.body) { body.appendChild(mo.body); }
        panel.appendChild(body);

        var foot = null;
        if (mo.buttons && mo.buttons.length) {
            foot = el('div', 'et-modal__foot');
            foot.appendChild(el('span', 'spacer'));
            mo.buttons.forEach(function (b) {
                var btn = el('button', 'et-btn' + (b.primary ? ' et-btn--primary' : '') + (b.danger ? ' et-btn--danger' : ''), b.label);
                btn.type = 'button';
                btn.addEventListener('click', function () {
                    if (b.onClick) { b.onClick(close); } else { close(); }
                });
                foot.appendChild(btn);
            });
            panel.appendChild(foot);
        }

        backdrop.appendChild(panel);
        document.body.appendChild(backdrop);

        function close() {
            if (backdrop.parentNode) { backdrop.parentNode.removeChild(backdrop); }
            document.removeEventListener('keydown', onKey);
            if (mo.onClose) { mo.onClose(); }
        }
        function onKey(ev) {
            if (ev.key === 'Escape') { ev.stopPropagation(); close(); }
        }
        document.addEventListener('keydown', onKey);
        backdrop.addEventListener('mousedown', function (ev) {
            if (ev.target === backdrop) { close(); }
        });

        return { panel: panel, body: body, foot: foot, close: close };

    var toastEl = null;
    var toastTimer = 0;

    function toast(msg, tone) {
        if (!toastEl) {
            toastEl = el('div', 'et-toast');
            document.body.appendChild(toastEl);
        }
        toastEl.textContent = msg;
        toastEl.setAttribute('data-tone', tone || '');
        void toastEl.offsetWidth;
        toastEl.classList.add('is-show');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(function () { toastEl.classList.remove('is-show'); }, 2200);
    }

    /* ---------- PWA 元数据（blob manifest，环境不支持时静默跳过） ---------- */

    function installPwa(toolId, title, accent) {
        try {
            var theme = document.querySelector('meta[name="theme-color"]');
            if (!theme) {
                theme = document.createElement('meta');
                theme.setAttribute('name', 'theme-color');
                document.head.appendChild(theme);
            }
            theme.setAttribute('content', accent || '#2563eb');

            var svg = '<svg xmlns="' + NS_SVG + '" viewBox="0 0 64 64">' +
                '<rect width="64" height="64" rx="14" fill="' + (accent || '#2563eb') + '"/>' +
                '<text x="32" y="43" font-size="32" font-weight="800" font-family="sans-serif" ' +
                'fill="#fff" text-anchor="middle">' + (title || '课').charAt(0) + '</text></svg>';
            var iconUri = 'data:image/svg+xml,' + encodeURIComponent(svg);

            var mf = {
                name: title || 'KeeTools 课工具',
                short_name: title || '课工具',
                start_url: '.',
                display: 'standalone',
                background_color: '#f4f6fb',
                theme_color: accent || '#2563eb',
                icons: [{ src: iconUri, sizes: 'any', type: 'image/svg+xml', purpose: 'any' }]
            };
            var blob = new Blob([JSON.stringify(mf)], { type: 'application/manifest+json' });
            var link = document.createElement('link');
            link.rel = 'manifest';
            link.href = URL.createObjectURL(blob);
            document.head.appendChild(link);

    /* ---------- 挂载 ---------- */

    function mount(options) {

        var store = global.ET && global.ET.store
            ? global.ET.store(toolId)

        var api = { toolId: toolId, store: store };
        var soundEnabled = store.get('sound', true) !== false;

        /* 主题色 */
        if (opt.accent) {

        installPwa(toolId, opt.title, opt.accent);

        /* ---------- 主题 ---------- */
        var theme = store.get('theme', null);
        if (theme !== 'dark' && theme !== 'light') {
            theme = (global.matchMedia && global.matchMedia('(prefers-color-scheme: dark)').matches)
                ? 'dark' : 'light';
        }
        applyTheme(theme);

        function applyTheme(t) {
            theme = t;
            document.documentElement.setAttribute('data-et-theme', t);
            store.set('theme', t);
            if (themeBtn) {
                themeBtn.innerHTML = '';
                themeBtn.appendChild(makeIcon(t === 'dark' ? 'i-sun' : 'i-moon'));
                themeBtn.title = t === 'dark' ? '切换到浅色' : '切换到深色';
            }
        }

        /* ---------- 顶栏 ---------- */
        var topbar = document.getElementById('et-topbar');
        var main = document.getElementById('et-main');
        var footer = document.getElementById('et-footer');

        if (!topbar) { topbar = el('header'); topbar.id = 'et-topbar'; document.body.insertBefore(topbar, document.body.firstChild); }
        if (!main) { main = el('main'); main.id = 'et-main'; topbar.after(main); }
        if (!footer) { footer = el('footer'); footer.id = 'et-footer'; document.body.appendChild(footer); }

        topbar.className = 'et-topbar';
        main.classList.add('et-main');
        footer.className = 'et-footer';

        /* 品牌 */
        var brand = el('div', 'et-brand');
        brand.appendChild(el('span', 'et-brand__dot'));
        var nameWrap = el('div');
        nameWrap.style.cssText = 'min-width:0;line-height:1.25';
        nameWrap.appendChild(el('div', 'et-brand__name', opt.title || '课工具'));
        if (opt.sub) { nameWrap.appendChild(el('div', 'et-brand__sub', opt.sub)); }
        brand.appendChild(nameWrap);
        topbar.appendChild(brand);

        /* 状态胶囊 */
        var statusPill = el('div', 'et-status');
        statusPill.hidden = true;
        statusPill.appendChild(el('span', 'et-status__dot'));
        var statusText = el('span', null, '');
        statusPill.appendChild(statusText);
        topbar.appendChild(statusPill);

        api.setStatus = function (text, tone) {
            if (!text) { statusPill.hidden = true; return; }
            statusText.textContent = text;
            statusPill.setAttribute('data-tone', tone || 'ok');
            statusPill.hidden = false;
        };
        if (opt.status) { api.setStatus(opt.status); }

        /* 动作区（edupick 交互：右上角聚合设置入口） */
        var actions = el('div', 'et-actions');

        var settingsBtn = null;
        if (opt.settings && typeof opt.settings.build === 'function') {
            settingsBtn = makeBtn('i-sliders', opt.settings.title || '设置', function () {
                openDrawer(opt.settings.title || '设置', function (body, drawerApi) {
                    opt.settings.build(body, { api: api, close: drawerApi.close });
                });
            });
            actions.appendChild(settingsBtn);
        }

        (opt.actions || []).forEach(function (a) {
            var b = makeBtn(a.icon, a.label || '', a.onClick);
            if (a.id) { b.id = a.id; }
            actions.appendChild(b);
        });

        var soundBtn = null;
        if (opt.sound) {
            soundBtn = makeBtn(soundEnabled ? 'i-volume' : 'i-volume-off',
                soundEnabled ? '关闭音效' : '开启音效', toggleSound);
            if (!soundEnabled) { soundBtn.classList.add('is-off'); }
            actions.appendChild(soundBtn);
        }

        if (opt.help) {
            actions.appendChild(makeBtn('i-help', '使用说明', function () { openHelp(); }));
        }

        var themeBtn = makeBtn('', '切换主题', function () {
            applyTheme(theme === 'dark' ? 'light' : 'dark');
        });
        applyTheme(theme); /* 填充图标 */
        actions.appendChild(themeBtn);

        /* 全屏按钮始终保留：iframe 内对本工具文档 requestFullscreen
           （宿主 iframe 已声明 allow="fullscreen"），与宿主「全屏体验」等效同屏。 */
        var fsBtn = makeBtn('i-maximize', '全屏', toggleFullscreen);
        actions.appendChild(fsBtn);

        topbar.appendChild(actions);

        function toggleSound() {
            soundEnabled = !soundEnabled;
            store.set('sound', soundEnabled);
            soundBtn.innerHTML = '';
            soundBtn.appendChild(makeIcon(soundEnabled ? 'i-volume' : 'i-volume-off'));
            soundBtn.title = soundEnabled ? '关闭音效' : '开启音效';
            soundBtn.classList.toggle('is-off', !soundEnabled);
            if (soundEnabled) { api.beep('ok'); }
        }

        api.openSettings = function () {
            if (settingsBtn) { settingsBtn.click(); }
        };

        /* ---------- 全屏（iframe 内委托宿主，避免双层全屏） ---------- */

        function inIframe() {
            try { return global.parent && global.parent !== global; } catch (err) { return true; }
        }

        function toggleFullscreen() {
            var root = document.documentElement;
            var fsEl = document.fullscreenElement || document.webkitFullscreenElement || null;
            if (fsEl) {
                (document.exitFullscreen || document.webkitExitFullscreen || function () {}).call(document);
            } else {
                var req = root.requestFullscreen || root.webkitRequestFullscreen;
                if (req) { try { req.call(root); } catch (err) { /* 忽略 */ } }
            }
        }

        function syncFsIcon(on) {
            if (!fsBtn) { return; }
            fsBtn.innerHTML = '';
            fsBtn.appendChild(makeIcon(on ? 'i-minimize' : 'i-maximize'));
            fsBtn.title = on ? '退出全屏' : '全屏';
        }

        document.addEventListener('fullscreenchange', function () {
            syncFsIcon(!!(document.fullscreenElement || document.webkitFullscreenElement));
        });
        document.addEventListener('webkitfullscreenchange', function () {
            syncFsIcon(!!(document.fullscreenElement || document.webkitFullscreenElement));
        });
        syncFsIcon(false);

        api.toggleFullscreen = toggleFullscreen;

        /* ---------- 音效 API ---------- */
        api.beep = function (kind) {
            if (!soundEnabled) { return; }
            playBeep(kind);
        };
        api.soundOn = function () { return soundEnabled; };

        api.modal = modal;

        /* ---------- 帮助 ---------- */
        function openHelp() {
            modal({
                title: '使用说明',
                icon: 'i-help',
                size: 'narrow',
                body: opt.help,
                buttons: [{ label: '知道了', primary: true }]
            });
        }
        api.openHelp = openHelp;

        /* ---------- toast ---------- */
        api.toast = toast;

        /* ---------- 页脚（L2 品牌回流，低调一行） ---------- */
        var siteOrigin = typeof global.ET_SITE_ORIGIN === 'string' && /^https?:\/\//.test(global.ET_SITE_ORIGIN)
            ? global.ET_SITE_ORIGIN
            : null;

        function renderFooter() {
            footer.textContent = '';
            footer.appendChild(el('span', null, 'KeeTools 课工具'));
            footer.appendChild(el('span', null, '·'));
            if (siteOrigin) {
                var a = el('a', null, '更多课堂工具');
                a.href = siteOrigin + '/?from=tool-footer&tool=' + encodeURIComponent(toolId);
                a.target = '_blank';
                a.rel = 'noopener';
                footer.appendChild(a);
            } else {
                footer.appendChild(el('span', null, '更多课堂工具'));
            }
        }
        renderFooter();

        /* 站点来源发现：iframe 内向父窗口询问；也可由宿主直接注入 ET_SITE_ORIGIN */
        try {
            if (global.parent && global.parent !== global) {
                global.parent.postMessage(JSON.stringify({ type: 'et-hello', toolId: toolId }), '*');
            }
        } catch (err) { /* 跨域异常忽略 */ }

        global.addEventListener('message', function (ev) {
            var data = ev.data;
            if (typeof data === 'string') {
                try { data = JSON.parse(data); } catch (err) { return; }
            }
            if (!data || typeof data !== 'object') { return; }

            if (data.type === 'et-origin' && typeof data.origin === 'string' && /^https?:\/\//.test(data.origin)) {
                siteOrigin = data.origin;
                if (!global.ET_SITE_ORIGIN) { global.ET_SITE_ORIGIN = data.origin; }
                renderFooter();
            }
            if (data.type === 'et-fullscreen-change' && typeof data.value === 'boolean') {
                syncFsIcon(data.value);
            }
        });

        api.el = { topbar: topbar, main: main, footer: footer, actions: actions };

         * 翻页笔的上下页键在系统层等价于 PageDown / PageUp。
         * 工具通过 opt.primary / opt.secondary 注册动作：
         *   PageDown → primary（主操作，如开始点名 / 开始计时）
         *   PageUp   → secondary（副操作，缺省时同 primary）
         * 输入框聚焦或弹窗/抽屉打开时不响应，避免误触。 */
        if (typeof opt.primary === 'function') {
            document.addEventListener('keydown', function (ev) {
                if (ev.key !== 'PageDown' && ev.key !== 'PageUp') { return; }

                if (document.querySelector('.et-modal, .et-drawer-backdrop, .ws-winner')) { return; }
                ev.preventDefault();
                if (ev.key === 'PageDown') { opt.primary(); }
                else if (typeof opt.secondary === 'function') { opt.secondary(); }
                else { opt.primary(); }
            });
        }

        return api;
    }

    global.ET = global.ET || {};
    global.ET.Chrome = {
        mount: mount,
        modal: modal,
        toast: toast,
        beep: playBeep /* 挂载前的独立音效入口（不经过音效开关） */
    };
})(window);
</script>

/*!
 * et-stats.js — 使用统计模块（模块化，可整体移除）
 *
 * 共享逻辑源。改这里，然后跑：python scripts/sync_shared.py
 * 依赖：无（可脱离 et-util / et-chrome 独立运行）。
 * 全局：ET.Stats
 *
 * ┌────────────────────────────────────────────────────────────────┐
 * │ 说明：本模块只做一件事——工具被打开时向上报端点发一条匿名计数。 │
 * │ · 在线（iframe 内）：宿主页面已服务端计数，本模块不重复上报。   │
 * │ · 离线打开（file:// / 下载单文件 / 离线包）：联网条件具备时，   │
 * │   以 sendBeacon 上报 use_offline 事件（text/plain 免预检）。    │
 * │ · 上报端点 = window.ET_SITE_ORIGIN（由宿主注入或离线包配置）。  │
 * │   未配置端点时本模块完全静默，不发任何请求。                    │
 * │ · **整个 <script> 块可安全删除**：删除后工具其余功能完全正常，  │
 * │   且完全不再发起任何网络请求。                                  │
 * └────────────────────────────────────────────────────────────────┘
 */
(function (global) {
    'use strict';

    var ET = global.ET = global.ET || {};

    var Stats = {
        /** 上报端点来源（站点绝对地址，无协议尾斜杠） */
        endpoint: (typeof global.ET_SITE_ORIGIN === 'string' && /^https?:\/\//.test(global.ET_SITE_ORIGIN))
            ? global.ET_SITE_ORIGIN
            : null,

        _done: {},

        /**
         * 上报一次事件（同一事件同一工具每次页面加载只报一次）。
         * event: 'use_offline' 等；toolId: 工具 id。
         */
        send: function (event, toolId) {
            if (!event || this._done[event + ':' + (toolId || '')]) { return false; }
            if (!this.endpoint) { return false; }
            /* iframe 内由宿主统计，避免双计 */
            try {
                if (global.parent && global.parent !== global) { return false; }
            } catch (err) { return false; }
            /* 断网时挂起，网络恢复自动补报一次 */
            if (global.navigator && global.navigator.onLine === false) {
                var self = this;
                global.addEventListener('online', function () { self.send(event, toolId); }, { once: true });
                return false;
            }

            this._done[event + ':' + (toolId || '')] = true;
            var payload = JSON.stringify({ event: event, tool: toolId || '' });

            try {
                if (global.navigator.sendBeacon) {
                    return global.navigator.sendBeacon(
                        this.endpoint + '/api/track',
                        new Blob([payload], { type: 'text/plain;charset=UTF-8' })
                    );
                }
                global.fetch(this.endpoint + '/api/track', {
                    method: 'POST',
                    body: payload,
                    keepalive: true,
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'text/plain;charset=UTF-8' }
                });
                return true;
            } catch (err) {
                return false;
            }
        }
    };

    ET.Stats = Stats;
})(window);
</script>

        qOpts: document.getElementById('qOpts'),
        qFeed: document.getElementById('qFeed'),
        qExit: document.getElementById('qExit')
    };

    var state = {
        period: store.get('period', 'all'),
        keyword: '',
        sel: store.get('sel', 0),
        done: store.get('done', {}) || {}
    };

    if (state.period !== 'all' && !PERIODS[state.period]) { state.period = 'all'; }
    if (typeof state.done !== 'object' || state.done === null) { state.done = {}; }

    var view = [];       /* 当前筛选结果 */
    var quiz = null;     /* 自测状态 */

    /* ---------- 工具函数 ---------- */

    function yearText(y) {
        return y < 0 ? ('前' + Math.abs(y)) : String(y);
    }

    function esc(s) {
        return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    function inList(arr, v) {
        for (var i = 0; i < arr.length; i++) {
            if (arr[i] === v) { return true; }
        }
        return false;
    }

    function shuffle(arr) {
        for (var i = arr.length - 1; i > 0; i--) {
            var r = Math.floor(Math.random() * (i + 1));
            var tmp = arr[i];
            arr[i] = arr[r];
            arr[r] = tmp;
        }
        return arr;
    }

    function colorOf(ev) {
        return (PERIODS[ev.p] || { color: '#9a3412' }).color;
    }

    /* ---------- 筛选 ---------- */

    function applyFilter() {
        var kw = state.keyword.trim().toLowerCase();
        view = [];
        for (var i = 0; i < EVENTS.length; i++) {
            var ev = EVENTS[i];
            if (state.period !== 'all' && ev.p !== state.period) { continue; }
            if (kw) {
                var hay = (yearText(ev.y) + ' ' + ev.t + ' ' + ev.d + ' ' + ev.s + ' ' + ev.c).toLowerCase();
                if (hay.indexOf(kw) === -1) { continue; }
            }
            view.push(ev);
        }
        if (state.sel < 0 || state.sel >= view.length) { state.sel = view.length ? 0 : -1; }
    }

    /* ---------- 渲染 ---------- */

    function render() {
        applyFilter();
        renderPeriodChips();
        renderGrid();
        renderPanel();
        els.count.textContent = '当前显示 ' + view.length + ' / ' + EVENTS.length + ' 条事件' +
            (state.period === 'all' ? '' : '（' + PERIODS[state.period].label + '）');
    }

    function renderPeriodChips() {
        els.periods.innerHTML = '';
        var all = document.createElement('button');
        all.type = 'button';
        all.className = 'hec-chip' + (state.period === 'all' ? ' is-on' : '');
        all.textContent = '全部';
        all.addEventListener('click', function () {
            state.period = 'all';
            state.sel = 0;
            store.set('period', 'all');
            render();
        });
        els.periods.appendChild(all);

        Object.keys(PERIODS).forEach(function (k) {
            var b = document.createElement('button');
            b.type = 'button';
            b.className = 'hec-chip' + (state.period === k ? ' is-on' : '');
            b.textContent = PERIODS[k].label;
            b.addEventListener('click', function () {
                state.period = k;
                state.sel = 0;
                store.set('period', k);
                render();
            });
            els.periods.appendChild(b);
        });
    }

    function renderGrid() {
        els.grid.innerHTML = '';
        if (!view.length) {
            var empty = document.createElement('div');
            empty.className = 'hec-empty';
            empty.textContent = '没有匹配的事件，换个关键词或时期试试。';
            els.grid.appendChild(empty);
            return;
        }

        view.forEach(function (ev, i) {
            var card = document.createElement('button');
            card.type = 'button';
            card.className = 'hec-card' + (i === state.sel ? ' is-on' : '');
            card.style.setProperty('--hec-period', colorOf(ev));

            var bar = document.createElement('span');
            bar.className = 'hec-card__bar';
            card.appendChild(bar);

            var y = document.createElement('div');
            y.className = 'hec-card__year';
            y.textContent = yearText(ev.y);
            card.appendChild(y);

            var t = document.createElement('div');
            t.className = 'hec-card__title';
            t.textContent = ev.t;
            card.appendChild(t);

            var meta = document.createElement('div');
            meta.className = 'hec-card__meta';
            meta.innerHTML = '<span class="hec-tag">' + PERIODS[ev.p].label + '</span>' +
                '<span class="hec-tag">' + esc(ev.c) + '</span>';
            card.appendChild(meta);

            var done = document.createElement('button');
            done.type = 'button';
            done.className = 'hec-done' + (state.done[ev.t] ? ' is-on' : '');
            done.title = state.done[ev.t] ? '取消「已掌握」' : '标记「已掌握」';
            done.textContent = '✓';
            done.addEventListener('click', function (e) {
                e.stopPropagation();
                toggleDone(ev);
            });
            card.appendChild(done);

            card.addEventListener('click', function () {
                selectCard(i);
                try { chrome.beep('tick'); } catch (e) { /* 静默 */ }
            });

            els.grid.appendChild(card);
        });
    }

    function renderPanel() {
        if (state.sel < 0 || !view.length) {
            els.panel.innerHTML = '<div class="hec-empty">点击左侧任意卡片<br>查看事件详情与历史意义</div>';
            els.panel.style.removeProperty('--hec-period');
            return;
        }
        var ev = view[state.sel];
        els.panel.style.setProperty('--hec-period', colorOf(ev));
        var html = '';
        html += '<div class="hec-panel__year">' + yearText(ev.y) + ' · ' + PERIODS[ev.p].label +
            ' · ' + esc(ev.c) + '</div>';
        html += '<h2 class="hec-panel__title">' + esc(ev.t) + '</h2>';
        html += '<h3 class="hec-sec">事件经过</h3>';
        html += '<p class="hec-panel__desc">' + esc(ev.d) + '</p>';
        html += '<h3 class="hec-sec">历史意义</h3>';
        html += '<p class="hec-sig">' + esc(ev.s) + '</p>';
        html += '<button class="hec-btn' + (state.done[ev.t] ? ' hec-btn--primary' : '') +
            '" id="btnDone" type="button">' + (state.done[ev.t] ? '✓ 已掌握（点此取消）' : '标记为「已掌握」') + '</button>';
        els.panel.innerHTML = html;

        var b = document.getElementById('btnDone');
        if (b) {
            b.addEventListener('click', function () { toggleDone(ev); });
        }
    }

    function toggleDone(ev) {
        if (state.done[ev.t]) {
            delete state.done[ev.t];
        } else {
            state.done[ev.t] = 1;
            try { chrome.beep('ok'); } catch (e) { /* 静默 */ }
        }
        store.set('done', state.done);
        renderGrid();
        renderPanel();
    }

    function selectCard(i) {
        state.sel = i;
        store.set('sel', i);
        var cards = els.grid.children;
        for (var k = 0; k < cards.length; k++) {
            if (cards[k].classList && cards[k].classList.contains('hec-card')) {
                cards[k].classList.remove('is-on');
            }
        }
        if (cards[i]) {
            cards[i].classList.add('is-on');
        }
        renderPanel();
        var ev = view[i];
        if (ev) { chrome.setStatus(yearText(ev.y) + ' · ' + ev.t, 'ok'); }
        /* 键盘/随机切换时滚动到可见位置 */
        if (cards[i] && cards[i].scrollIntoView) {
            cards[i].scrollIntoView({ block: 'nearest' });
        }
    }

    function nextCard() {
        if (!view.length) { return; }
        state.sel = (state.sel + 1) % view.length;
        selectCard(state.sel);
    }

    function prevCard() {
        if (!view.length) { return; }
        state.sel = (state.sel - 1 + view.length) % view.length;
        selectCard(state.sel);
    }

    function randomCard() {
        if (!view.length) { return; }
        var i = Math.floor(Math.random() * view.length);
        state.sel = i;
        selectCard(i);
        try { chrome.beep('ok'); } catch (e) { /* 静默 */ }
    }

    /* ---------- 自测模式 ---------- */

    var QUIZ_TOTAL = 10;

    function startQuiz() {
        if (view.length < 4) {
            chrome.toast('当前筛选下事件太少，先切到「全部」再自测');
            return;
        }
        quiz = { qs: pickQuestions(), idx: 0, score: 0, locked: false };
        els.quiz.hidden = false;
        renderQuiz();
    }

    function pickQuestions() {
        var pool = view.slice();
        var out = [];
        var n = Math.min(QUIZ_TOTAL, pool.length);
        for (var i = 0; i < n; i++) {
            var j = Math.floor(Math.random() * pool.length);
            out.push(pool.splice(j, 1)[0]);
        }
        return out;
    }

    function renderQuiz() {
        if (!quiz) { return; }
        if (quiz.idx >= quiz.qs.length) {
            els.qProg.textContent = '已完成';
            els.qScore.textContent = '得分 ' + quiz.score + ' / ' + quiz.qs.length;
            els.qText.textContent = '本轮自测结束，正确 ' + quiz.score + ' 题，共 ' + quiz.qs.length + ' 题。';
            els.qOpts.innerHTML = '';
            els.qFeed.textContent = quiz.score >= quiz.qs.length * 0.8 ? '掌握得很扎实！' : '再复习一遍会更牢。';
            var again = document.createElement('button');
            again.type = 'button';
            again.className = 'hec-btn hec-btn--primary';
            again.textContent = '再来一轮';
            again.addEventListener('click', startQuiz);
            els.qOpts.appendChild(again);
            return;
        }

        var q = quiz.qs[quiz.idx];
        quiz.locked = false;
        els.qProg.textContent = '第 ' + (quiz.idx + 1) + ' / ' + quiz.qs.length + ' 题';
        els.qScore.textContent = '得分 ' + quiz.score;
        els.qText.textContent = q.t;
        els.qFeed.textContent = '';

        var opts = buildOptions(q);
        els.qOpts.innerHTML = '';
        opts.forEach(function (y) {
            var b = document.createElement('button');
            b.type = 'button';
            b.className = 'hec-opt';
            b.textContent = yearText(y);
            b.addEventListener('click', function () { answer(b, y, q); });
            els.qOpts.appendChild(b);
        });
    }

    function buildOptions(q) {
        var set = [q.y];
        var i;
        /* 干扰项优先取同一时期（更贴近真实考试的年代辨析），不足再全局补足 */
        var same = [];
        for (i = 0; i < EVENTS.length; i++) {
            if (EVENTS[i].p === q.p && EVENTS[i].y !== q.y) { same.push(EVENTS[i].y); }
        }
        shuffle(same);
        for (i = 0; i < same.length && set.length < 4; i++) {
            if (!inList(set, same[i])) { set.push(same[i]); }
        }
        var guard = 0;
        while (set.length < 4 && guard < 500) {
            guard++;
            var y = EVENTS[Math.floor(Math.random() * EVENTS.length)].y;
            if (!inList(set, y)) { set.push(y); }
        }
        return shuffle(set);
    }

    function answer(btn, y, q) {
        if (quiz.locked) { return; }
        quiz.locked = true;
        var ok = y === q.y;
        btn.classList.add(ok ? 'is-ok' : 'is-no');
        if (ok) {
            quiz.score++;
            els.qFeed.textContent = '✓ 答对了';
            try { chrome.beep('ok'); } catch (e) { /* 静默 */ }
        } else {
            els.qFeed.textContent = '✗ 正确答案：' + yearText(q.y);
            try { chrome.beep('err'); } catch (e) { /* 静默 */ }
            var opts = els.qOpts.children;
            for (var i = 0; i < opts.length; i++) {
                if (opts[i].textContent === yearText(q.y)) { opts[i].classList.add('is-ok'); }
            }
        }
        els.qScore.textContent = '得分 ' + quiz.score;
        quiz.idx++;
        setTimeout(function () {
            if (quiz) { renderQuiz(); }
        }, ok ? 620 : 1250);
    }

    function stopQuiz() {
        quiz = null;
        els.quiz.hidden = true;
    }

    /* ---------- 事件绑定 ---------- */

    els.search.addEventListener('input', function () {
        state.keyword = els.search.value;
        state.sel = 0;
        render();
    });

    els.btnRandom.addEventListener('click', randomCard);
    els.btnQuiz.addEventListener('click', startQuiz);
    els.qExit.addEventListener('click', stopQuiz);

    function isTypingTarget(node) {
        if (!node || !node.tagName) { return false; }
        var tag = node.tagName.toUpperCase();
        return tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT' || node.isContentEditable === true;
    }

    document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape' && quiz) {
            stopQuiz();
            return;
        }
        if (quiz || isTypingTarget(e.target) || document.querySelector('.et-modal, .et-drawer-backdrop')) { return; }
        if (e.key === 'ArrowRight') {
            e.preventDefault();
            nextCard();
        } else if (e.key === 'ArrowLeft') {
            e.preventDefault();
            prevCard();
        } else if (e.code === 'Space') {
            e.preventDefault();
            randomCard();
        }
    });

    /* ---------- 启动 ---------- */

    render();
})();
</script>

</body>
</html>
