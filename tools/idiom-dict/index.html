/* ============ 弹窗 ============ */
.et-modal {

.et-toast {

    font-size: 11.5px;
    color: var(--et-muted);
    font-family: var(--et-mono);
}

/* ── 详情面板 ── */
.idiomdict-detail {
    min-height: 0;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    padding: 16px;
    border-radius: 14px;
    border: 1px solid var(--et-line);
    background: var(--et-surface);
    box-shadow: var(--et-shadow-md);
}

.idiomdict-detail__empty {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    color: var(--et-muted);
    font-size: 13px;
    line-height: 1.9;
    text-align: center;
}

.idiomdict-detail__empty .et-icon {
    width: 34px;
    height: 34px;
    opacity: .5;
}

.idiomdict-detail__body {
    display: flex;
    flex-direction: column;
    gap: 14px;
}

.idiomdict-detail__word {
    font-size: 30px;
    font-weight: 900;
    letter-spacing: .1em;
    color: var(--idiomdict-accent);
    line-height: 1.2;
}

.idiomdict-detail__ends {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
}

.idiomdict-endtag {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 3px 10px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 700;
    background: var(--et-surface-2);
    border: 1px solid var(--et-line);
    color: var(--et-muted);
}

.idiomdict-endtag b {
    color: var(--et-fg);
    font-size: 13.5px;
}

.idiomdict-field {
    display: flex;
    flex-direction: column;
    gap: 5px;
}

.idiomdict-field__k {
    font-size: 11px;
    font-weight: 800;
    letter-spacing: .1em;
    color: var(--et-muted);
}

.idiomdict-field__v {
    font-size: 14px;
    line-height: 1.8;
    word-break: break-word;
}

.idiomdict-rel {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
}

.idiomdict-rel__btn {
    padding: 4px 10px;
    border-radius: 8px;
    border: 1px solid var(--et-line);
    background: var(--et-surface-2);
    color: var(--et-fg);
    font: inherit;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: .06em;
    cursor: pointer;
    transition: border-color .14s, color .14s;
}

.idiomdict-rel__btn:hover {
    border-color: var(--idiomdict-accent);
    color: var(--idiomdict-accent);
}

.idiomdict-detail__none {
    font-size: 12.5px;
    color: var(--et-muted);
}

/* ── 接龙 ── */
.idiomdict-chainbar {
    flex: none;
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
    padding: 10px 12px;
    border-radius: 12px;
    border: 1px solid var(--et-line);
    background: var(--et-surface);
    box-shadow: var(--et-shadow-md);
}

.idiomdict-chainbar__label {
    font-size: 12.5px;
    font-weight: 700;
    color: var(--et-muted);
}

#chainStart {
    width: 142px;
}

.idiomdict-stat {
    margin-left: auto;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--et-muted);
    white-space: nowrap;
}

.idiomdict-chain {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 3px;
    padding: 14px 16px;
    border-radius: 14px;
    border: 1px solid var(--et-line);
    background: var(--et-surface);
    box-shadow: var(--et-shadow-md);
}

.idiomdict-chain__link {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 3px 0 3px 30px;
    font-size: 12px;
    color: var(--et-muted);
}

.idiomdict-chain__char {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 26px;
    height: 20px;
    padding: 0 6px;
    border-radius: 999px;
    background: var(--idiomdict-weak);
    color: var(--idiomdict-accent);
    font-weight: 800;
    font-size: 13px;
}

.idiomdict-chain__row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 9px 14px;
    border-radius: 11px;
    background: var(--et-surface-2);
    border: 1px solid var(--et-line);
}

.idiomdict-chain__item.is-last .idiomdict-chain__row {
    border-color: var(--idiomdict-accent);
    box-shadow: 0 0 0 2px var(--idiomdict-weak);
    background: var(--et-surface);
}

.idiomdict-chain__idx {
    flex: none;
    width: 24px;
    height: 24px;
    display: grid;
    place-items: center;
    border-radius: 50%;
    background: var(--et-surface);
    border: 1px solid var(--et-line);
    font-size: 12px;
    font-weight: 800;
    color: var(--et-muted);
}

.idiomdict-chain__word {
    font-size: 20px;
    font-weight: 800;
    letter-spacing: .08em;
}

.idiomdict-chain__tag {
    padding: 2px 8px;
    border-radius: 999px;
    font-size: 11px;
    font-weight: 800;
    background: var(--idiomdict-weak);
    color: var(--idiomdict-accent);
}

.idiomdict-chain__tail {
    margin-left: auto;
    font-size: 12px;
    color: var(--et-muted);
    white-space: nowrap;
}

.idiomdict-chainfoot {
    flex: none;
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
}

.idiomdict-chainfoot input {
    flex: 1;
    min-width: 150px;
}

@media (max-width: 900px) {
    .idiomdict-split {
        grid-template-columns: minmax(0, 1fr);
        grid-template-rows: minmax(180px, 1fr) auto;
    }

    .idiomdict-detail {
        max-height: 40vh;
    }

    .idiomdict-grid {
        grid-template-columns: repeat(auto-fill, minmax(132px, 1fr));
    }
}
</style>

<body class="et-app">

<header id="et-topbar"></header>

<main id="et-main" class="idiomdict-main">

        <div class="idiomdict-chips" id="charChips"></div>

                    <svg class="et-icon"><use href="#i-search"></use></svg>

                    <div class="idiomdict-detail__word" id="detailWord">—</div>

                        <span class="idiomdict-field__v" id="detailSrc">—</span>
                    </div>

                        <span class="idiomdict-field__k">学段</span>
                        <span class="idiomdict-field__v" id="detailStage">—</span>
                    </div>
                    <div class="idiomdict-field">
                        <span class="idiomdict-field__k">同首字成语</span>
                        <div class="idiomdict-rel" id="detailRel"></div>
                    </div>
                </div>
            </aside>
        </div>
    </section>

    <section class="idiomdict-panel" id="panelChain" hidden>
        <div class="idiomdict-chainbar">
            <span class="idiomdict-chainbar__label">起始成语</span>
            <input class="idiomdict-input" id="chainStart" type="text" placeholder="起始成语" autocomplete="off" spellcheck="false">
            <button class="et-btn" id="btnRandomStart" type="button">
                <svg class="et-icon"><use href="#i-dice"></use></svg>
                <span>换一个</span>
            </button>
            <button class="et-btn" id="btnRestart" type="button">
                <svg class="et-icon"><use href="#i-refresh"></use></svg>
                <span>重来</span>
            </button>
            <span class="idiomdict-stat" id="chainStat"></span>
        </div>

        <div class="idiomdict-chain" id="chainList"></div>

        <div class="idiomdict-chainfoot">
            <input class="idiomdict-input" id="chainInput" type="text" placeholder="输入以当前尾字开头的成语…" autocomplete="off" spellcheck="false">
            <button class="et-btn et-btn--primary" id="btnChain" type="button">
                <svg class="et-icon"><use href="#i-check"></use></svg>

            <button class="et-btn" id="btnHint" type="button">
                <svg class="et-icon"><use href="#i-help"></use></svg>
                <span>提示</span>

(function (global) {
    'use strict';

    var ET = global.ET = global.ET || {};

    var Stats = {
        /** 上报端点来源（站点绝对地址，无协议尾斜杠） */
        endpoint: (typeof global.ET_SITE_ORIGIN === 'string' && /^https?:\/\//.test(global.ET_SITE_ORIGIN))

         * event: 'use_offline' 等；toolId: 工具 id。
         */
        send: function (event, toolId) {
            if (!event || this._done[event + ':' + (toolId || '')]) { return false; }
            if (!this.endpoint) { return false; }

                    method: 'POST',
                    body: payload,
                    keepalive: true,
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'text/plain;charset=UTF-8' }

    /* ══════════════ 建索引：首字 / 尾字由成语本身推导 ══════════════ */
    /* 用户导入的词条（{ 成语: [释义, 出处, 学段] }），与内置词库合并 */
    var EXTRA = store.get('extra', null);
    if (!EXTRA || typeof EXTRA !== 'object') { EXTRA = {}; }

    var ALL = [];
    var HEAD_MAP = {};
    var WORD_MAP = {};
    var RAW_COUNT = 0;

    function extraCount() {
        var n = 0;
        var k;
        for (k in EXTRA) {
            if (Object.prototype.hasOwnProperty.call(EXTRA, k) && k.length === 4) { n++; }
        }
        return n;
    }

    function buildIndex() {
        ALL = [];
        HEAD_MAP = {};
        WORD_MAP = {};
        var merged = {};
        var key;
        for (key in RAW) {
            if (!Object.prototype.hasOwnProperty.call(RAW, key)) { continue; }
            merged[key] = RAW[key];
        }
        for (key in EXTRA) {
            if (!Object.prototype.hasOwnProperty.call(EXTRA, key)) { continue; }
            merged[key] = EXTRA[key];
        }
        for (key in merged) {
            if (!Object.prototype.hasOwnProperty.call(merged, key)) { continue; }
            if (key.length !== 4) { continue; }
            var rec = {
                word: key,
                mean: merged[key][0] || '—',
                src: merged[key][1] || '—',
                stage: merged[key][2] || '其他',
                head: key.charAt(0),
                tail: key.charAt(3)
            };
            ALL.push(rec);
            WORD_MAP[key] = rec;
            if (!HEAD_MAP[rec.head]) { HEAD_MAP[rec.head] = []; }
            HEAD_MAP[rec.head].push(rec);
        }
    }

    var rawKey;
    RAW_COUNT = 0;
    for (rawKey in RAW) {
        if (Object.prototype.hasOwnProperty.call(RAW, rawKey) && rawKey.length === 4) { RAW_COUNT++; }
    }

    buildIndex();

        store.set('showMean', cfg.showMean);
        store.set('autoChain', cfg.autoChain);

    var mode = 'dict';
    var filtered = ALL.slice();
    var selIdx = -1;
    var chipChar = '';
    var chipStage = '';

    function applyFilter() {
        var q = (els.search.value || '').trim();
        filtered = ALL.filter(function (r) {
            if (chipStage && r.stage !== chipStage) { return false; }
            if (chipChar && r.head !== chipChar) { return false; }
            if (!q) { return true; }
            return r.word.indexOf(q) >= 0 || r.mean.indexOf(q) >= 0 || r.head === q;
        });
        selIdx = -1;
        renderGrid();
        if (mode === 'dict') {
            chrome.setStatus('词典 · 共 ' + ALL.length + ' 条 · 当前 ' + filtered.length + ' 条');
        }
    }

    function renderGrid() {
        els.grid.textContent = '';
        if (!filtered.length) {
            els.grid.appendChild(ET.create('p', 'idiomdict-empty', '没有找到匹配的成语，换个关键词试试～'));
            return;
        }
        var frag = document.createDocumentFragment();
        filtered.forEach(function (r, idx) {
            var card = ET.create('button', 'idiomdict-card' + (idx === selIdx ? ' is-sel' : ''));
            card.type = 'button';
            card.appendChild(ET.create('span', 'idiomdict-card__word', r.word));
            if (cfg.showMean) {
                card.appendChild(ET.create('span', 'idiomdict-card__mean', r.mean));
            }
            var ends = ET.create('span', 'idiomdict-card__ends');
            ends.appendChild(ET.create('span', null, '首 ' + r.head));
            ends.appendChild(ET.create('span', null, '尾 ' + r.tail));
            card.appendChild(ends);
            card.addEventListener('click', function () { selectIdiom(idx, true); });
            frag.appendChild(card);
        });
        els.grid.appendChild(frag);
    }

    function makeEndTag(label, ch) {
        var tag = ET.create('span', 'idiomdict-endtag');
        tag.appendChild(document.createTextNode(label + ' '));
        tag.appendChild(ET.create('b', null, ch));
        return tag;
    }

    function showDetail(r) {
        els.detailEmpty.hidden = true;
        els.detailBody.hidden = false;
        els.detailWord.textContent = r.word;
        els.detailEnds.textContent = '';
        els.detailEnds.appendChild(makeEndTag('首字', r.head));
        els.detailEnds.appendChild(makeEndTag('尾字', r.tail));
        els.detailMean.textContent = r.mean;
        els.detailSrc.textContent = r.src || '—';
        els.detailStage.textContent = r.stage || '其他';

        els.detailRel.textContent = '';
        var peers = HEAD_MAP[r.head] || [];
        peers.forEach(function (x) {
            if (x.word === r.word) { return; }
            var b = ET.create('button', 'idiomdict-rel__btn', x.word);
            b.type = 'button';
            b.addEventListener('click', function () {
                if (filtered.indexOf(x) < 0) {
                    chipChar = '';
                    chipStage = '';
                    els.search.value = '';
                    renderStages();
                    renderChips();
                    applyFilter();
                }
                selectIdiom(filtered.indexOf(x), true);
            });
            els.detailRel.appendChild(b);
        });
        if (!els.detailRel.childNodes.length) {
            els.detailRel.appendChild(ET.create('span', 'idiomdict-detail__none', '暂无'));
        }
    }

    function selectIdiom(idx, scrollIntoView) {
        if (idx < 0 || idx >= filtered.length) { return; }
        selIdx = idx;
        var cards = ET.qsa('.idiomdict-card', els.grid);
        cards.forEach(function (c, i) { c.classList.toggle('is-sel', i === idx); });
        if (scrollIntoView && cards[idx]) {
            cards[idx].scrollIntoView({ block: 'nearest' });
        }
        showDetail(filtered[idx]);
    }

    function moveSel(step) {
        if (!filtered.length) { return; }
        var next;
        if (selIdx < 0) {
            next = step > 0 ? 0 : filtered.length - 1;
        } else {
            next = selIdx + step;
        }
        if (next < 0) { next = 0; }
        if (next >= filtered.length) { next = filtered.length - 1; }
        if (next === selIdx) { return; }
        selectIdiom(next, true);
        chrome.beep('tick');
    }

    function renderStages() {
        var counts = {};
        ALL.forEach(function (r) { counts[r.stage] = (counts[r.stage] || 0) + 1; });
        var order = ['小学', '初中', '高中'];
        order = order.filter(function (s) { return counts[s]; });
        Object.keys(counts).forEach(function (s) {
            if (order.indexOf(s) < 0) { order.push(s); }
        });

        els.stages.textContent = '';
        els.stages.appendChild(ET.create('span', 'idiomdict-stages__label', '学段'));

        var mk = function (label, value, n) {
            var b = ET.create('button', 'idiomdict-stage' + (chipStage === value ? ' is-active' : ''), label);
            b.type = 'button';
            b.title = '共 ' + n + ' 条';
            b.addEventListener('click', function () {
                chipStage = (chipStage === value) ? '' : value;
                renderStages();
                renderChips();
                applyFilter();
            });
            els.stages.appendChild(b);
        };

        mk('全部', '', ALL.length);
        order.forEach(function (s) { mk(s, s, counts[s]); });
    }

    function renderChips() {
        var counts = {};
        ALL.forEach(function (r) {
            if (chipStage && r.stage !== chipStage) { return; }
            counts[r.head] = (counts[r.head] || 0) + 1;
        });
        var list = [];
        var c;
        for (c in counts) {
            if (!Object.prototype.hasOwnProperty.call(counts, c)) { continue; }
            list.push({ ch: c, n: counts[c] });
        }
        list.sort(function (a, b) { return b.n - a.n; });

        els.chips.textContent = '';
        els.chips.appendChild(ET.create('span', 'idiomdict-chips__label', '高频首字'));

        var all = ET.create('button', 'idiomdict-chip' + (chipChar === '' ? ' is-active' : ''), '全部');
        all.type = 'button';
        all.addEventListener('click', function () {
            chipChar = '';
            els.search.value = '';
            renderChips();
            applyFilter();
        });
        els.chips.appendChild(all);

        list.slice(0, 16).forEach(function (o) {
            var b = ET.create('button', 'idiomdict-chip' + (chipChar === o.ch ? ' is-active' : ''), o.ch);
            b.type = 'button';
            b.title = '共 ' + o.n + ' 条';
            b.addEventListener('click', function () {
                chipChar = (chipChar === o.ch) ? '' : o.ch;
                els.search.value = '';
                renderChips();
                applyFilter();
            });
            els.chips.appendChild(b);
        });
    }

    /* ══════════════ 接龙模式 ══════════════ */
    var chain = [];
    var used = {};
    var startWord = '';

    function makeChainRec(word, by) {
        return {
            word: word,
            head: word.charAt(0),
            tail: word.charAt(3),
            by: by
        };
    }

    function pickStart() {
        var tries;
        for (tries = 0; tries < 60; tries++) {
            var r = ALL[Math.floor(Math.random() * ALL.length)];
            if ((HEAD_MAP[r.tail] || []).length > 1) { return r.word; }
        }
        return ALL[0].word;
    }

    function updateStatus() {
        if (mode !== 'chain') { return; }
        var last = chain[chain.length - 1];
        chrome.setStatus('接龙中 · 当前尾字「' + last.tail + '」· 已接 ' + chain.length + ' 环');
    }

    function renderChain() {
        els.chainList.textContent = '';
        chain.forEach(function (r, idx) {
            var item = ET.create('div', 'idiomdict-chain__item' + (idx === chain.length - 1 ? ' is-last' : ''));
            if (idx > 0) {
                var link = ET.create('div', 'idiomdict-chain__link');
                link.appendChild(ET.create('span', 'idiomdict-chain__char', chain[idx - 1].tail));
                link.appendChild(document.createTextNode('接下去'));
                item.appendChild(link);
            }
            var row = ET.create('div', 'idiomdict-chain__row');
            row.appendChild(ET.create('span', 'idiomdict-chain__idx', String(idx + 1)));
            row.appendChild(ET.create('span', 'idiomdict-chain__word', r.word));
            if (r.by === 'ai') {
                row.appendChild(ET.create('span', 'idiomdict-chain__tag', '电脑'));
            }
            row.appendChild(ET.create('span', 'idiomdict-chain__tail', '尾字 ' + r.tail));
            item.appendChild(row);
            els.chainList.appendChild(item);
        });
        els.chainList.scrollTop = els.chainList.scrollHeight;
        els.chainStat.textContent = '本局 ' + chain.length + ' 环 · 最佳 ' + best + ' 环';
    }

    function resetChain(word) {
        var w = (word && WORD_MAP[word]) ? word : pickStart();
        startWord = w;
        chain = [makeChainRec(w, 'start')];
        used = {};
        used[w] = true;
        els.chainStart.value = w;
        els.chainInput.value = '';
        renderChain();
        updateStatus();
    }

    function addToChain(word, by) {
        chain.push(makeChainRec(word, by));
        used[word] = true;
        if (chain.length > best) {
            best = chain.length;
            store.set('best', best);
        }
    }

    function candidatesFor(tail) {
        return (HEAD_MAP[tail] || []).filter(function (r) { return !used[r.word]; });
    }

    function submitChain() {
        var w = (els.chainInput.value || '').replace(/\s+/g, '');
        if (!w) {
            chrome.toast('请先输入一个成语', 'warn');
            return;
        }
        var last = chain[chain.length - 1];
        if (w.length !== 4 || !WORD_MAP[w]) {
            chrome.beep('err');
            chrome.toast('「' + w + '」未收录，换一个试试', 'err');
            return;
        }
        if (w.charAt(0) !== last.tail) {
            chrome.beep('err');
            chrome.toast('首字应为「' + last.tail + '」', 'err');
            return;
        }
        if (used[w]) {
            chrome.beep('err');
            chrome.toast('「' + w + '」已经用过了', 'err');
            return;
        }
        addToChain(w, 'user');
        chrome.beep('ok');
        els.chainInput.value = '';
        renderChain();
        updateStatus();
        if (cfg.autoChain) {
            window.setTimeout(aiTurn, 560);
        }
    }

    function aiTurn() {
        if (mode !== 'chain') { return; }
        var last = chain[chain.length - 1];
        var cands = candidatesFor(last.tail);
        if (!cands.length) {
            chrome.beep('win');
            chrome.toast('电脑接不上了，你赢了！', 'ok');
            chrome.setStatus('电脑认输 · 你赢了！', 'ok');
            return;
        }
        var pick = cands[Math.floor(Math.random() * cands.length)];
        addToChain(pick.word, 'ai');
        chrome.beep('tick');
        renderChain();
        updateStatus();
    }

    function hintChain() {
        var last = chain[chain.length - 1];
        var cands = candidatesFor(last.tail);
        if (!cands.length) {
            chrome.toast('没有能接上的成语了', 'warn');
            return;
        }
        var pick = cands[Math.floor(Math.random() * cands.length)];
        chrome.toast('提示：' + pick.word.charAt(0) + pick.word.charAt(1) + '……', 'ok');
        chrome.beep('tick');
    }

    function undoChain() {
        if (chain.length <= 1) {
            chrome.toast('已经回到起点了', 'warn');
            return;
        }
        var rec = chain.pop();
        if (rec.word !== startWord) { delete used[rec.word]; }
        renderChain();
        updateStatus();
        chrome.beep('tick');
    }

    function applyStart() {
        var w = (els.chainStart.value || '').replace(/\s+/g, '');
        if (!w) { els.chainStart.value = startWord; return; }
        if (w.length !== 4 || !WORD_MAP[w]) {
            chrome.beep('err');
            chrome.toast('「' + w + '」未收录，请换一个', 'err');
            els.chainStart.value = startWord;
            return;
        }
        resetChain(w);
        chrome.beep('ok');
    }

    /* ══════════════ 模式切换 / 主副操作 ══════════════ */
    function setMode(m) {
        mode = m;
        els.tabs.forEach(function (t) {
            t.classList.toggle('is-active', t.getAttribute('data-mode') === m);
        });
        els.panelDict.hidden = (m !== 'dict');
        els.panelChain.hidden = (m !== 'chain');
        if (m === 'dict') {
            applyFilter();
        } else {
            updateStatus();
        }
    }

    function primaryAction() {
        if (mode === 'chain') {
            submitChain();
        } else if (els.search) {
            els.search.focus();
            els.search.select();
        }
    }

    function secondaryAction() {
        if (mode === 'chain') {
            hintChain();
        } else {
            els.search.value = '';
            chipChar = '';
            chipStage = '';
            renderStages();
            renderChips();
            applyFilter();
            els.search.focus();
        }
    }

    /* ══════════════ 词库管理（导入 / 导出） ══════════════ */
    var STAGES = ['小学', '初中', '高中'];

    function normStage(s) {
        var v = String(s == null ? '' : s).replace(/\s+/g, '');
        if (STAGES.indexOf(v) >= 0) { return v; }
        if (v === '中学' || v === '七年级' || v === '八年级' || v === '九年级') { return '初中'; }
        return '其他';
    }

    function pushEntry(out, word, mean, src, stage) {
        var w = String(word == null ? '' : word).replace(/\s+/g, '');
        if (w.length !== 4) { return false; }
        var m = String(mean == null ? '' : mean).trim();
        if (!m || m === '—') { m = '自定义词条'; }
        out[w] = [m, String(src == null ? '' : src).trim() || '—', normStage(stage)];
        return true;
    }

    function parseCsvLine(line) {
        var cells = [];
        var cur = '';
        var quoted = false;
        for (var i = 0; i < line.length; i++) {
            var ch = line.charAt(i);
            if (quoted) {
                if (ch === '"') {
                    if (line.charAt(i + 1) === '"') { cur += '"'; i++; } else { quoted = false; }
                } else {
                    cur += ch;
                }
            } else if (ch === '"') {
                quoted = true;
            } else if (ch === ',' || ch === '\t') {
                cells.push(cur);
                cur = '';
            } else {
                cur += ch;
            }
        }
        cells.push(cur);
        return cells;
    }

    function parseLibraryImport(text, filename) {
        var out = {};
        var total = 0;
        var isJson = /\.json$/i.test(filename) || /^[\s\r\n]*[[{]/.test(text);
        if (isJson) {
            var data;
            try {
                data = JSON.parse(text.replace(/^\uFEFF/, ''));
            } catch (e) {
                return { error: 'JSON 解析失败，请检查文件格式' };
            }
            if (Array.isArray(data)) {
                data.forEach(function (it) {
                    if (!it) { return; }
                    total++;
                    if (typeof it === 'string') { pushEntry(out, it, '自定义词条', '—', '其他'); return; }
                    pushEntry(out, it.word || it.成语 || it.name, it.mean || it.释义, it.src || it.出处, it.stage || it.学段);
                });
            } else if (data && typeof data === 'object') {
                Object.keys(data).forEach(function (k) {
                    total++;
                    var v = data[k];
                    if (v == null) { pushEntry(out, k, '自定义词条', '—', '其他'); return; }
                    if (typeof v === 'string') { pushEntry(out, k, v, '—', '其他'); return; }
                    if (Array.isArray(v)) { pushEntry(out, k, v[0], v[1], v[2]); return; }
                    pushEntry(out, k, v.mean || v.释义, v.src || v.出处, v.stage || v.学段);
                });
            } else {
                return { error: 'JSON 结构无法识别' };
            }
        } else {
            text.replace(/^\uFEFF/, '').split(/\r?\n/).forEach(function (line, i) {
                if (!line.trim()) { return; }
                var cells = parseCsvLine(line);
                if (i === 0 && /成语|word/i.test(cells[0] || '')) { return; }
                total++;
                pushEntry(out, cells[0], cells[1], cells[2], cells[3]);
            });
        }
        var n = Object.keys(out).length;
        if (!n) { return { error: '没有解析到有效词条（成语须为 4 个字）' }; }
        return { entries: out, ok: n, total: total };
    }

    function exportLibrary() {
        var lines = ['成语,释义,出处,学段'];
        var cell = function (s) {
            var v = String(s == null ? '' : s);
            return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v;
        };
        ALL.slice().sort(function (a, b) { return a.word < b.word ? -1 : 1; }).forEach(function (r) {
            lines.push([cell(r.word), cell(r.mean), cell(r.src), cell(r.stage)].join(','));
        });
        var blob = new Blob(['\uFEFF' + lines.join('\r\n')], { type: 'text/csv;charset=utf-8' });
        var url = URL.createObjectURL(blob);
        var a = document.createElement('a');
        a.href = url;
        a.download = 'idiom-library.csv';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
    }

    function refreshLibrary() {
        buildIndex();
        chipChar = '';
        chipStage = '';
        renderStages();
        renderChips();
        applyFilter();
        resetChain('');
    }

    /* ══════════════ 设置抽屉 ══════════════ */
    function buildSettings(body) {
        body.textContent = '';

        body.appendChild(ET.create('h4', null, '词库管理'));

        var libTip = ET.create('p', 'et-drawer__tip');
        libTip.innerHTML = '内置 <b>' + RAW_COUNT + '</b> 条，自定义 <b>' + extraCount() + '</b> 条，合计 <b>' + ALL.length + '</b> 条。';
        body.appendChild(libTip);

        var fileRow = ET.create('div', 'et-drawer__row');
        var file = document.createElement('input');
        file.type = 'file';
        file.accept = '.json,.csv,.txt';
        file.style.display = 'none';
        var btnIn = ET.create('button', 'et-btn');
        btnIn.type = 'button';
        btnIn.appendChild(iconEl('i-upload'));
        btnIn.appendChild(ET.create('span', null, '导入 JSON / CSV'));
        btnIn.addEventListener('click', function () { file.click(); });
        file.addEventListener('change', function () {
            var f = file.files && file.files[0];
            if (!f) { return; }
            var reader = new FileReader();
            reader.onload = function () {
                var res = parseLibraryImport(String(reader.result || ''), f.name);
                if (res.error) {
                    chrome.beep('err');
                    chrome.toast(res.error, 'err');
                } else {
                    var added = 0;
                    var k;
                    for (k in res.entries) {
                        if (!Object.prototype.hasOwnProperty.call(res.entries, k)) { continue; }
                        if (!EXTRA[k]) { added++; }
                        EXTRA[k] = res.entries[k];
                    }
                    store.set('extra', EXTRA);
                    refreshLibrary();
                    libTip.innerHTML = '内置 <b>' + RAW_COUNT + '</b> 条，自定义 <b>' + extraCount() + '</b> 条，合计 <b>' + ALL.length + '</b> 条。';
                    chrome.beep('ok');
                    chrome.toast('导入成功：新增 ' + added + ' 条，覆盖 ' + (res.ok - added) + ' 条', 'ok');
                }
                file.value = '';
            };
            reader.readAsText(f, 'UTF-8');
        });
        fileRow.appendChild(btnIn);
        fileRow.appendChild(file);

        var btnOut = ET.create('button', 'et-btn');
        btnOut.type = 'button';
        btnOut.appendChild(iconEl('i-download'));
        btnOut.appendChild(ET.create('span', null, '导出词库 CSV'));
        btnOut.addEventListener('click', function () {
            exportLibrary();
            chrome.beep('ok');
            chrome.toast('已导出 ' + ALL.length + ' 条为 CSV', 'ok');
        });
        fileRow.appendChild(btnOut);
        body.appendChild(fileRow);

        var fmt = ET.create('p', 'et-drawer__tip');
        fmt.innerHTML = 'CSV 列序：<b>成语,释义,出处,学段</b>（学段填「小学 / 初中 / 高中」）；' +
            'JSON 支持 <code>{"成语": ["释义","出处","学段"]}</code>、对象数组或纯成语数组。导入词条仅存本机浏览器，不影响内置词库。';
        body.appendChild(fmt);

        var rowClr = ET.create('div', 'et-drawer__row');
        var btnClr = ET.create('button', 'et-btn et-btn--danger', '清空自定义词条');
        btnClr.type = 'button';
        btnClr.addEventListener('click', function () {
            if (!extraCount()) {
                chrome.toast('当前没有自定义词条', 'warn');
                return;
            }
            EXTRA = {};
            store.remove('extra');
            refreshLibrary();
            libTip.innerHTML = '内置 <b>' + RAW_COUNT + '</b> 条，自定义 <b>0</b> 条，合计 <b>' + ALL.length + '</b> 条。';
            chrome.beep('ok');
            chrome.toast('自定义词条已清空', 'ok');
        });
        rowClr.appendChild(btnClr);
        body.appendChild(rowClr);

        body.appendChild(ET.create('h4', null, '词典模式'));

        var sw1 = ET.create('label', 'et-drawer__switch');
        sw1.appendChild(ET.create('span', null, '卡片直接显示释义'));
        var cb1 = document.createElement('input');
        cb1.type = 'checkbox';
        cb1.checked = cfg.showMean;
        cb1.addEventListener('change', function () {
            cfg.showMean = cb1.checked;
            saveCfg();
            renderGrid();

        var tip = ET.create('p', 'et-drawer__tip');
        tip.innerHTML = '最佳记录：<b>' + best + '</b> 环';
        body.appendChild(tip);

        var row = ET.create('div', 'et-drawer__row');
        var clr = ET.create('button', 'et-btn et-btn--danger', '清空最佳记录');
        clr.type = 'button';

    document.addEventListener('keydown', function (ev) {
        var t = ev.target || {};
        var tag = (t.tagName || '').toUpperCase();
        var typing = tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT' || t.isContentEditable === true;

        if (document.querySelector('.et-modal, .et-drawer-backdrop')) { return; }

        if (ev.code === 'Space' && !typing) {
            ev.preventDefault();
            primaryAction();
            return;
        }
        if (typing) { return; }

        if (ev.key === 'ArrowLeft') {
            ev.preventDefault();
            if (mode === 'dict') { moveSel(-1); } else { undoChain(); }
        } else if (ev.key === 'ArrowRight') {
            ev.preventDefault();
            if (mode === 'dict') { moveSel(1); } else { hintChain(); }
        }
    });
