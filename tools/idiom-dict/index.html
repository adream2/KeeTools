    --et-shadow-md: 0 10px 28px -18px rgba(15, 23, 42, .3);
    --et-shadow-lg: 0 24px 60px -32px rgba(15, 23, 42, .4);

    --et-fg: #f1f5f9;

    --et-shadow-md: 0 10px 34px -18px rgba(0, 0, 0, .8);
    --et-shadow-lg: 0 24px 70px -30px rgba(0, 0, 0, .9);
    --et-ok: #34d399;
    --et-warn: #fbbf24;

}

/* ============ 基础 ============ */
.et-app {
    position: relative;
    isolation: isolate;
    display: flex;
    flex-direction: column;
    height: 100vh;
    height: 100dvh;
    overflow: hidden;
    background: var(--et-bg);
    color: var(--et-fg);
    font-family: var(--et-font);
    -webkit-font-smoothing: antialiased;
    transition: background .25s, color .25s;

/* 极光背景：径向渐变 + 呼吸动画（edupick 品质基线，老内核也不掉帧） */
.et-app::before {
    content: '';
    position: fixed;
    inset: 0;
    z-index: -1;
    pointer-events: none;
    background:
        radial-gradient(46% 40% at 20% 18%, var(--et-accent-weak), transparent 65%),
        radial-gradient(42% 38% at 82% 24%, var(--et-accent-weak), transparent 70%),
        radial-gradient(50% 44% at 55% 95%, rgba(16, 185, 129, .10), transparent 65%);
    animation: et-aurora 16s ease-in-out infinite alternate;
}

@keyframes et-aurora {
    from { opacity: .55; transform: scale(1); }
    to { opacity: 1; transform: scale(1.06); }
}

.et-app *,
.et-app *::before,
.et-app *::after { box-sizing: border-box; }

[hidden] { display: none !important; }

.et-icon {

}

}

}

.et-status[data-tone="err"] .et-status__dot { background: var(--et-err); }

.et-actions {
    display: flex;

    gap: 7px;
}

.et-icon-btn {
    display: inline-grid;
    place-items: center;
    width: 38px;
    height: 38px;
    font-size: 16px;
    line-height: 1;
    border-radius: 11px;
    border: 1px solid var(--et-line);
    background: var(--et-surface-2);

    transition: transform .14s, border-color .14s, color .14s, opacity .14s;
    -webkit-tap-highlight-color: transparent;
}

.et-icon-btn:hover {
    border-color: var(--et-accent);
    color: var(--et-accent);

}

.et-icon-btn:active { transform: translateY(0); }
.et-icon-btn.is-off { opacity: .4; }
.et-icon-btn:focus-visible { outline: 2px solid var(--et-accent); outline-offset: 2px; }

/* ============ 主区默认 ============ */
.et-main {
    flex: 1;
    min-height: 0;
    position: relative;
    overflow: auto;
}

/* ============ 页脚（品牌回流 L2） ============ */
.et-footer {

}

.et-footer a {

}

/* ============ 按钮 ============ */
.et-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
    padding: 9px 16px;
    border-radius: 11px;

    font-size: 13.5px;
    font-weight: 700;
    border: 1px solid var(--et-line);
    background: var(--et-surface-2);
    color: var(--et-fg);
    cursor: pointer;
    transition: transform .14s, border-color .14s, color .14s, background .14s, box-shadow .14s;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
}

.et-btn:hover {
    border-color: var(--et-accent);
    color: var(--et-accent);
    transform: translateY(-1px);
}

.et-btn:active { transform: translateY(0); }
.et-btn:focus-visible { outline: 2px solid var(--et-accent); outline-offset: 2px; }
.et-btn:disabled { opacity: .45; cursor: not-allowed; transform: none; }

.et-btn--primary {
    background: var(--et-accent);
    border-color: var(--et-accent);
    color: #fff;
    box-shadow: 0 6px 18px -8px var(--et-accent);
}

.et-btn--primary:hover { color: #fff; filter: brightness(1.08); }
.et-btn--primary:disabled { filter: none; }

.et-btn--danger:hover {
    border-color: var(--et-err);
    color: var(--et-err);
}

.et-btn--lg {
    padding: 13px 26px;
    font-size: 16px;
    border-radius: 14px;
}

/* ============ 弹窗 ============ */
.et-modal {
    position: fixed;
    inset: 0;
    z-index: 100;
    display: grid;
    place-items: center;
    padding: 24px;
    background: rgba(2, 6, 23, .55);
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);

}

.et-modal__panel {

}

.et-modal__body {

}

.et-modal__foot {

@keyframes et-fade {

}

@keyframes et-pop {

}

/* ============ 轻提示（toast） ============ */
.et-toast {
    position: fixed;
    left: 50%;

.et-toast.is-show {

.et-toast[data-tone="err"] { background: rgba(220, 38, 38, .95); }

/* ============ 设置抽屉（右上角入口，edupick 交互） ============ */

    display: flex;
    flex-wrap: wrap;
    gap: 8px;
}

.idiomdict-endtag {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 3px 10px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 700;
    background: var(--et-surface-2);
    border: 1px solid var(--et-line);
    color: var(--et-muted);
}

.idiomdict-endtag b {
    color: var(--et-fg);
    font-size: 13.5px;
}

.idiomdict-field {
    display: flex;
    flex-direction: column;
    gap: 5px;
}

.idiomdict-field__k {
    font-size: 11px;
    font-weight: 800;
    letter-spacing: .1em;
    color: var(--et-muted);
}

.idiomdict-field__v {
    font-size: 14px;
    line-height: 1.8;
    word-break: break-word;
}

.idiomdict-rel {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
}

.idiomdict-rel__btn {
    padding: 4px 10px;
    border-radius: 8px;
    border: 1px solid var(--et-line);
    background: var(--et-surface-2);
    color: var(--et-fg);
    font: inherit;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: .06em;
    cursor: pointer;
    transition: border-color .14s, color .14s;
}

.idiomdict-rel__btn:hover {
    border-color: var(--idiomdict-accent);
    color: var(--idiomdict-accent);
}

.idiomdict-detail__none {
    font-size: 12.5px;
    color: var(--et-muted);
}

/* ── 接龙 ── */
.idiomdict-chainbar {
    flex: none;
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
    padding: 10px 12px;
    border-radius: 12px;
    border: 1px solid var(--et-line);
    background: var(--et-surface);
    box-shadow: var(--et-shadow-md);
}

.idiomdict-chainbar__label {
    font-size: 12.5px;
    font-weight: 700;
    color: var(--et-muted);
}

#chainStart {
    width: 142px;
}

.idiomdict-stat {
    margin-left: auto;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--et-muted);
    white-space: nowrap;
}

.idiomdict-chain {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 3px;
    padding: 14px 16px;
    border-radius: 14px;
    border: 1px solid var(--et-line);
    background: var(--et-surface);
    box-shadow: var(--et-shadow-md);
}

.idiomdict-chain__link {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 3px 0 3px 30px;
    font-size: 12px;
    color: var(--et-muted);
}

.idiomdict-chain__char {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 26px;
    height: 20px;
    padding: 0 6px;
    border-radius: 999px;
    background: var(--idiomdict-weak);
    color: var(--idiomdict-accent);
    font-weight: 800;
    font-size: 13px;
}

.idiomdict-chain__row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 9px 14px;
    border-radius: 11px;
    background: var(--et-surface-2);
    border: 1px solid var(--et-line);
}

.idiomdict-chain__item.is-last .idiomdict-chain__row {
    border-color: var(--idiomdict-accent);
    box-shadow: 0 0 0 2px var(--idiomdict-weak);
    background: var(--et-surface);
}

.idiomdict-chain__idx {
    flex: none;
    width: 24px;
    height: 24px;
    display: grid;
    place-items: center;
    border-radius: 50%;
    background: var(--et-surface);
    border: 1px solid var(--et-line);
    font-size: 12px;
    font-weight: 800;
    color: var(--et-muted);
}

.idiomdict-chain__word {
    font-size: 20px;
    font-weight: 800;
    letter-spacing: .08em;
}

.idiomdict-chain__tag {
    padding: 2px 8px;
    border-radius: 999px;
    font-size: 11px;
    font-weight: 800;
    background: var(--idiomdict-weak);
    color: var(--idiomdict-accent);
}

.idiomdict-chain__tail {
    margin-left: auto;
    font-size: 12px;
    color: var(--et-muted);
    white-space: nowrap;
}

.idiomdict-chainfoot {
    flex: none;
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
}

.idiomdict-chainfoot input {
    flex: 1;
    min-width: 150px;
}

@media (max-width: 900px) {
    .idiomdict-split {
        grid-template-columns: minmax(0, 1fr);
        grid-template-rows: minmax(180px, 1fr) auto;
    }

    .idiomdict-detail {
        max-height: 40vh;
    }

    .idiomdict-grid {
        grid-template-columns: repeat(auto-fill, minmax(132px, 1fr));
    }
}

 * 共享逻辑源。改这里，然后跑：python scripts/sync_shared.py
 * 依赖：无（可脱离 et-util / et-chrome 独立运行）。
 * 全局：ET.Stats
 *
 * ┌────────────────────────────────────────────────────────────────┐
 * │ 说明：本模块只做一件事——工具被打开时向上报端点发一条匿名计数。 │
 * │ · 在线（iframe 内）：宿主页面已服务端计数，本模块不重复上报。   │
 * │ · 离线打开（file:// / 下载单文件 / 离线包）：联网条件具备时，   │
 * │   以 sendBeacon 上报 use_offline 事件（text/plain 免预检）。    │
 * │ · 上报端点 = window.ET_SITE_ORIGIN（由宿主注入或离线包配置）。  │
 * │   未配置端点时本模块完全静默，不发任何请求。                    │
 * │ · **整个 <script> 块可安全删除**：删除后工具其余功能完全正常，  │
 * │   且完全不再发起任何网络请求。                                  │
 * └────────────────────────────────────────────────────────────────┘
 */
(function (global) {
    'use strict';

    var ET = global.ET = global.ET || {};

    var Stats = {
        /** 上报端点来源（站点绝对地址，无协议尾斜杠） */
        endpoint: (typeof global.ET_SITE_ORIGIN === 'string' && /^https?:\/\//.test(global.ET_SITE_ORIGIN))
            ? global.ET_SITE_ORIGIN
            : null,

        _done: {},

        /**
         * 上报一次事件（同一事件同一工具每次页面加载只报一次）。
         * event: 'use_offline' 等；toolId: 工具 id。
         */
        send: function (event, toolId) {
            if (!event || this._done[event + ':' + (toolId || '')]) { return false; }
            if (!this.endpoint) { return false; }
            /* iframe 内由宿主统计，避免双计 */
            try {
                if (global.parent && global.parent !== global) { return false; }
            } catch (err) { return false; }
            /* 断网时挂起，网络恢复自动补报一次 */
            if (global.navigator && global.navigator.onLine === false) {
                var self = this;
                global.addEventListener('online', function () { self.send(event, toolId); }, { once: true });
                return false;
            }

            this._done[event + ':' + (toolId || '')] = true;
            var payload = JSON.stringify({ event: event, tool: toolId || '' });

            try {
                if (global.navigator.sendBeacon) {
                    return global.navigator.sendBeacon(
                        this.endpoint + '/api/track',
                        new Blob([payload], { type: 'text/plain;charset=UTF-8' })
                    );
                }
                global.fetch(this.endpoint + '/api/track', {
                    method: 'POST',
                    body: payload,
                    keepalive: true,
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'text/plain;charset=UTF-8' }
                });
                return true;
            } catch (err) {
                return false;
            }
        }
    };

    ET.Stats = Stats;
})(window);
</script>

        '迎刃而解': ['主要问题解决了，其他问题就容易解决', '《晋书》'],
        '乐不思蜀': ['乐而忘返，忘掉故乡', '《三国志》'],
        '起死回生': ['把将死的人救活，形容医术高明', '《史记》'],
        '鸡鸣狗盗': ['微不足道的本领', '《史记》'],
        '汗流浃背': ['出汗很多，湿透了背上的衣服', '—'],
        '不远千里': ['不怕路途遥远', '《孟子》'],
        '手舞足蹈': ['高兴得手脚都动起来', '《孟子》'],
        '心悦诚服': ['由衷地高兴，真心地服气', '《孟子》'],
        '事半功倍': ['费力小而收效大', '《孟子》'],
        '举足轻重': ['地位重要，一举一动都影响全局', '《后汉书》'],
        '轻重倒置': ['把重要的和不重要的弄颠倒了', '—']
    };

    /* ══════════════ 建索引：首字 / 尾字由成语本身推导 ══════════════ */
    var ALL = [];
    var HEAD_MAP = {};
    var key;
    for (key in RAW) {
        if (!Object.prototype.hasOwnProperty.call(RAW, key)) { continue; }
        if (key.length !== 4) { continue; }
        var rec = {
            word: key,
            mean: RAW[key][0] || '—',
            src: RAW[key][1] || '—',
            head: key.charAt(0),
            tail: key.charAt(3)
        };
        ALL.push(rec);
        if (!HEAD_MAP[rec.head]) { HEAD_MAP[rec.head] = []; }
        HEAD_MAP[rec.head].push(rec);
    }

    /* ══════════════ 设置 ══════════════ */
    var cfg = {
        showMean: store.get('showMean', true) !== false,
        autoChain: store.get('autoChain', true) !== false
    };
    var best = store.get('best', 0) || 0;

    function saveCfg() {
        store.set('showMean', cfg.showMean);
        store.set('autoChain', cfg.autoChain);
    }

    /* ══════════════ 外壳 ══════════════ */
    var chrome = ET.Chrome.mount({
        toolId: TOOL_ID,
        title: '成语词典 / 接龙',
        sub: '语文 · 词典与接龙',
        accent: '#be123c',
        status: '词典 · 共 ' + ALL.length + ' 条',
        sound: true,
        primary: primaryAction,
        secondary: secondaryAction,
        settings: { title: '设置', build: buildSettings },
        help: '<div style="font-size:13.5px;line-height:2">' +
            '<p style="margin:0 0 8px"><b>词典模式</b>：搜索框输入成语、释义关键词或首字即可筛选；点上方首字小按钮可按首字过滤；点卡片查看释义与出处。</p>' +
            '<p style="margin:0 0 8px"><b>接龙模式</b>：输入以当前尾字开头的成语，点「接龙」提交；接对了电脑会自动接一环。</p>' +
            '<p style="margin:0 0 8px"><b>快捷键</b>：空格 = 主操作（词典＝聚焦搜索框／接龙＝提交）；← 与 → 在词典里切换上一条 / 下一条，在接龙里分别是「撤销一环 / 提示」。</p>' +
            '<p style="margin:0"><b>翻页笔</b>：下页键 = 主操作；上页键 = 提示。设置持久化在浏览器本地。</p></div>'
    });

    /* ══════════════ 元素 ══════════════ */
    var els = {
        tabs: ET.qsa('.idiomdict-tab'),
        panelDict: ET.el('panelDict'),
        panelChain: ET.el('panelChain'),
        search: ET.el('idiomSearch'),
        clearSearch: ET.el('btnClearSearch'),
        chips: ET.el('charChips'),
        grid: ET.el('idiomGrid'),
        detailEmpty: ET.el('detailEmpty'),
        detailBody: ET.el('detailBody'),
        detailWord: ET.el('detailWord'),
        detailEnds: ET.el('detailEnds'),
        detailMean: ET.el('detailMean'),
        detailSrc: ET.el('detailSrc'),
        detailRel: ET.el('detailRel'),
        chainStart: ET.el('chainStart'),
        btnRandomStart: ET.el('btnRandomStart'),
        btnRestart: ET.el('btnRestart'),
        chainStat: ET.el('chainStat'),
        chainList: ET.el('chainList'),
        chainInput: ET.el('chainInput'),
        btnChain: ET.el('btnChain'),
        btnHint: ET.el('btnHint')
    };

    /* ══════════════ 词典模式 ══════════════ */
    var mode = 'dict';
    var filtered = ALL.slice();
    var selIdx = -1;
    var chipChar = '';

    function applyFilter() {
        var q = (els.search.value || '').trim();
        filtered = ALL.filter(function (r) {
            if (chipChar && r.head !== chipChar) { return false; }
            if (!q) { return true; }
            return r.word.indexOf(q) >= 0 || r.mean.indexOf(q) >= 0 || r.head === q;
        });
        selIdx = -1;
        renderGrid();
    }

    function renderGrid() {
        els.grid.textContent = '';
        if (!filtered.length) {
            els.grid.appendChild(ET.create('p', 'idiomdict-empty', '没有找到匹配的成语，换个关键词试试～'));
            return;
        }
        var frag = document.createDocumentFragment();
        filtered.forEach(function (r, idx) {
            var card = ET.create('button', 'idiomdict-card' + (idx === selIdx ? ' is-sel' : ''));
            card.type = 'button';
            card.appendChild(ET.create('span', 'idiomdict-card__word', r.word));
            if (cfg.showMean) {
                card.appendChild(ET.create('span', 'idiomdict-card__mean', r.mean));
            }
            var ends = ET.create('span', 'idiomdict-card__ends');
            ends.appendChild(ET.create('span', null, '首 ' + r.head));
            ends.appendChild(ET.create('span', null, '尾 ' + r.tail));
            card.appendChild(ends);
            card.addEventListener('click', function () { selectIdiom(idx, true); });
            frag.appendChild(card);
        });
        els.grid.appendChild(frag);
    }

    function makeEndTag(label, ch) {
        var tag = ET.create('span', 'idiomdict-endtag');
        tag.appendChild(document.createTextNode(label + ' '));
        tag.appendChild(ET.create('b', null, ch));
        return tag;
    }

    function showDetail(r) {
        els.detailEmpty.hidden = true;
        els.detailBody.hidden = false;
        els.detailWord.textContent = r.word;
        els.detailEnds.textContent = '';
        els.detailEnds.appendChild(makeEndTag('首字', r.head));
        els.detailEnds.appendChild(makeEndTag('尾字', r.tail));
        els.detailMean.textContent = r.mean;
        els.detailSrc.textContent = r.src || '—';

        els.detailRel.textContent = '';
        var peers = HEAD_MAP[r.head] || [];
        peers.forEach(function (x) {
            if (x.word === r.word) { return; }
            var b = ET.create('button', 'idiomdict-rel__btn', x.word);
            b.type = 'button';
            b.addEventListener('click', function () {
                if (filtered.indexOf(x) < 0) {
                    chipChar = '';
                    els.search.value = '';
                    renderChips();
                    applyFilter();
                }
                selectIdiom(filtered.indexOf(x), true);
            });
            els.detailRel.appendChild(b);
        });
        if (!els.detailRel.childNodes.length) {
            els.detailRel.appendChild(ET.create('span', 'idiomdict-detail__none', '暂无'));
        }
    }

    function selectIdiom(idx, scrollIntoView) {
        if (idx < 0 || idx >= filtered.length) { return; }
        selIdx = idx;
        var cards = ET.qsa('.idiomdict-card', els.grid);
        cards.forEach(function (c, i) { c.classList.toggle('is-sel', i === idx); });
        if (scrollIntoView && cards[idx]) {
            cards[idx].scrollIntoView({ block: 'nearest' });
        }
        showDetail(filtered[idx]);
    }

    function moveSel(step) {
        if (!filtered.length) { return; }
        var next;
        if (selIdx < 0) {
            next = step > 0 ? 0 : filtered.length - 1;
        } else {
            next = selIdx + step;
        }
        if (next < 0) { next = 0; }
        if (next >= filtered.length) { next = filtered.length - 1; }
        if (next === selIdx) { return; }
        selectIdiom(next, true);
        chrome.beep('tick');
    }

    function renderChips() {
        var counts = {};
        ALL.forEach(function (r) { counts[r.head] = (counts[r.head] || 0) + 1; });
        var list = [];
        var c;
        for (c in counts) {
            if (!Object.prototype.hasOwnProperty.call(counts, c)) { continue; }
            list.push({ ch: c, n: counts[c] });
        }
        list.sort(function (a, b) { return b.n - a.n; });

        els.chips.textContent = '';
        els.chips.appendChild(ET.create('span', 'idiomdict-chips__label', '高频首字'));

        var all = ET.create('button', 'idiomdict-chip' + (chipChar === '' ? ' is-active' : ''), '全部');
        all.type = 'button';
        all.addEventListener('click', function () {
            chipChar = '';
            els.search.value = '';
            renderChips();
            applyFilter();
        });
        els.chips.appendChild(all);

        list.slice(0, 16).forEach(function (o) {
            var b = ET.create('button', 'idiomdict-chip' + (chipChar === o.ch ? ' is-active' : ''), o.ch);
            b.type = 'button';
            b.title = '共 ' + o.n + ' 条';
            b.addEventListener('click', function () {
                chipChar = (chipChar === o.ch) ? '' : o.ch;
                els.search.value = '';
                renderChips();
                applyFilter();
            });
            els.chips.appendChild(b);
        });
    }

    /* ══════════════ 接龙模式 ══════════════ */
    var chain = [];
    var used = {};
    var startWord = '';

    function makeChainRec(word, by) {
        return {
            word: word,
            head: word.charAt(0),
            tail: word.charAt(3),
            by: by
        };
    }

    function pickStart() {
        var tries;
        for (tries = 0; tries < 60; tries++) {
            var r = ALL[Math.floor(Math.random() * ALL.length)];
            if ((HEAD_MAP[r.tail] || []).length > 1) { return r.word; }
        }
        return ALL[0].word;
    }

    function updateStatus() {
        if (mode !== 'chain') { return; }
        var last = chain[chain.length - 1];
        chrome.setStatus('接龙中 · 当前尾字「' + last.tail + '」· 已接 ' + chain.length + ' 环');
    }

    function renderChain() {
        els.chainList.textContent = '';
        chain.forEach(function (r, idx) {
            var item = ET.create('div', 'idiomdict-chain__item' + (idx === chain.length - 1 ? ' is-last' : ''));
            if (idx > 0) {
                var link = ET.create('div', 'idiomdict-chain__link');
                link.appendChild(ET.create('span', 'idiomdict-chain__char', chain[idx - 1].tail));
                link.appendChild(document.createTextNode('接下去'));
                item.appendChild(link);
            }
            var row = ET.create('div', 'idiomdict-chain__row');
            row.appendChild(ET.create('span', 'idiomdict-chain__idx', String(idx + 1)));
            row.appendChild(ET.create('span', 'idiomdict-chain__word', r.word));
            if (r.by === 'ai') {
                row.appendChild(ET.create('span', 'idiomdict-chain__tag', '电脑'));
            }
            row.appendChild(ET.create('span', 'idiomdict-chain__tail', '尾字 ' + r.tail));
            item.appendChild(row);
            els.chainList.appendChild(item);
        });
        els.chainList.scrollTop = els.chainList.scrollHeight;
        els.chainStat.textContent = '本局 ' + chain.length + ' 环 · 最佳 ' + best + ' 环';
    }

    function resetChain(word) {
        var w = (word && RAW[word] && word.length === 4) ? word : pickStart();
        startWord = w;
        chain = [makeChainRec(w, 'start')];
        used = {};
        used[w] = true;
        els.chainStart.value = w;
        els.chainInput.value = '';
        renderChain();
        updateStatus();
    }

    function addToChain(word, by) {
        chain.push(makeChainRec(word, by));
        used[word] = true;
        if (chain.length > best) {
            best = chain.length;
            store.set('best', best);
        }
    }

    function candidatesFor(tail) {
        return (HEAD_MAP[tail] || []).filter(function (r) { return !used[r.word]; });
    }

    function submitChain() {
        var w = (els.chainInput.value || '').replace(/\s+/g, '');
        if (!w) {
            chrome.toast('请先输入一个成语', 'warn');
            return;
        }
        var last = chain[chain.length - 1];
        if (w.length !== 4 || !RAW[w]) {
            chrome.beep('err');
            chrome.toast('「' + w + '」未收录，换一个试试', 'err');
            return;
        }
        if (w.charAt(0) !== last.tail) {
            chrome.beep('err');
            chrome.toast('首字应为「' + last.tail + '」', 'err');
            return;
        }
        if (used[w]) {
            chrome.beep('err');
            chrome.toast('「' + w + '」已经用过了', 'err');
            return;
        }
        addToChain(w, 'user');
        chrome.beep('ok');
        els.chainInput.value = '';
        renderChain();
        updateStatus();
        if (cfg.autoChain) {
            window.setTimeout(aiTurn, 560);
        }
    }

    function aiTurn() {
        if (mode !== 'chain') { return; }
        var last = chain[chain.length - 1];
        var cands = candidatesFor(last.tail);
        if (!cands.length) {
            chrome.beep('win');
            chrome.toast('电脑接不上了，你赢了！', 'ok');
            chrome.setStatus('电脑认输 · 你赢了！', 'ok');
            return;
        }
        var pick = cands[Math.floor(Math.random() * cands.length)];
        addToChain(pick.word, 'ai');
        chrome.beep('tick');
        renderChain();
        updateStatus();
    }

    function hintChain() {
        var last = chain[chain.length - 1];
        var cands = candidatesFor(last.tail);
        if (!cands.length) {
            chrome.toast('没有能接上的成语了', 'warn');
            return;
        }
        var pick = cands[Math.floor(Math.random() * cands.length)];
        chrome.toast('提示：' + pick.word.charAt(0) + pick.word.charAt(1) + '……', 'ok');
        chrome.beep('tick');
    }

    function undoChain() {
        if (chain.length <= 1) {
            chrome.toast('已经回到起点了', 'warn');
            return;
        }
        var rec = chain.pop();
        if (rec.word !== startWord) { delete used[rec.word]; }
        renderChain();
        updateStatus();
        chrome.beep('tick');
    }

    function applyStart() {
        var w = (els.chainStart.value || '').replace(/\s+/g, '');
        if (!w) { els.chainStart.value = startWord; return; }
        if (w.length !== 4 || !RAW[w]) {
            chrome.beep('err');
            chrome.toast('「' + w + '」未收录，请换一个', 'err');
            els.chainStart.value = startWord;
            return;
        }
        resetChain(w);
        chrome.beep('ok');
    }

    /* ══════════════ 模式切换 / 主副操作 ══════════════ */
    function setMode(m) {
        mode = m;
        els.tabs.forEach(function (t) {
            t.classList.toggle('is-active', t.getAttribute('data-mode') === m);
        });
        els.panelDict.hidden = (m !== 'dict');
        els.panelChain.hidden = (m !== 'chain');
        if (m === 'dict') {
            chrome.setStatus('词典 · 共 ' + ALL.length + ' 条');
        } else {
            updateStatus();
        }
    }

    function primaryAction() {
        if (mode === 'chain') {
            submitChain();
        } else if (els.search) {
            els.search.focus();
            els.search.select();
        }
    }

    function secondaryAction() {
        if (mode === 'chain') {
            hintChain();
        } else {
            els.search.value = '';
            chipChar = '';
            renderChips();
            applyFilter();
            els.search.focus();
        }
    }

    /* ══════════════ 设置抽屉 ══════════════ */
    function buildSettings(body) {
        body.textContent = '';

        body.appendChild(ET.create('h4', null, '词典模式'));

        var sw1 = ET.create('label', 'et-drawer__switch');
        sw1.appendChild(ET.create('span', null, '卡片直接显示释义'));
        var cb1 = document.createElement('input');
        cb1.type = 'checkbox';
        cb1.checked = cfg.showMean;
        cb1.addEventListener('change', function () {
            cfg.showMean = cb1.checked;
            saveCfg();
            renderGrid();
        });
        sw1.appendChild(cb1);
        body.appendChild(sw1);

        body.appendChild(ET.create('h4', null, '接龙模式'));

        var sw2 = ET.create('label', 'et-drawer__switch');
        sw2.appendChild(ET.create('span', null, '电脑自动接龙'));
        var cb2 = document.createElement('input');
        cb2.type = 'checkbox';
        cb2.checked = cfg.autoChain;
        cb2.addEventListener('change', function () {
            cfg.autoChain = cb2.checked;
            saveCfg();
        });
        sw2.appendChild(cb2);
        body.appendChild(sw2);

        body.appendChild(ET.create('h4', null, '战绩'));

        var tip = ET.create('p', 'et-drawer__tip');
        tip.innerHTML = '最佳记录：<b>' + best + '</b> 环';
        body.appendChild(tip);

        var row = ET.create('div', 'et-drawer__row');
        var clr = ET.create('button', 'et-btn et-btn--danger', '清空最佳记录');
        clr.type = 'button';
        clr.addEventListener('click', function () {
            best = 0;
            store.set('best', 0);
            tip.innerHTML = '最佳记录：<b>0</b> 环';
            renderChain();
            chrome.beep('ok');
            chrome.toast('最佳记录已清空', 'ok');
        });
        row.appendChild(clr);
        body.appendChild(row);

        var tip2 = ET.create('p', 'et-drawer__tip');
        tip2.innerHTML = '成语库共 <b>' + ALL.length + '</b> 条，全部内置，离线可用。';
        body.appendChild(tip2);
    }

    /* ══════════════ 事件绑定 ══════════════ */
    els.tabs.forEach(function (t) {
        t.addEventListener('click', function () { setMode(t.getAttribute('data-mode')); });
    });

    els.search.addEventListener('input', applyFilter);
    els.clearSearch.addEventListener('click', function () {
        els.search.value = '';
        chipChar = '';
        renderChips();
        applyFilter();
        els.search.focus();
    });

    els.btnChain.addEventListener('click', submitChain);
    els.btnHint.addEventListener('click', hintChain);
    els.chainInput.addEventListener('keydown', function (ev) {
        if (ev.key === 'Enter') {
            ev.preventDefault();
            submitChain();
        }
    });
    els.chainStart.addEventListener('keydown', function (ev) {
        if (ev.key === 'Enter') {
            ev.preventDefault();
            applyStart();
        }
    });
    els.chainStart.addEventListener('change', applyStart);
    els.btnRandomStart.addEventListener('click', function () {
        resetChain('');
        chrome.beep('tick');
    });
    els.btnRestart.addEventListener('click', function () {
        resetChain(startWord);
        chrome.beep('tick');
    });

    document.addEventListener('keydown', function (ev) {
        var t = ev.target || {};
        var tag = (t.tagName || '').toUpperCase();
        var typing = tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT' || t.isContentEditable === true;

        if (document.querySelector('.et-modal, .et-drawer-backdrop')) { return; }

        if (ev.code === 'Space' && !typing) {
            ev.preventDefault();
            primaryAction();
            return;
        }
        if (typing) { return; }

        if (ev.key === 'ArrowLeft') {
            ev.preventDefault();
            if (mode === 'dict') { moveSel(-1); } else { undoChain(); }
        } else if (ev.key === 'ArrowRight') {
            ev.preventDefault();
            if (mode === 'dict') { moveSel(1); } else { hintChain(); }
        }
    });

    /* ══════════════ 初始化 ══════════════ */
    renderChips();
    applyFilter();
    resetChain('');
    setMode('dict');
})();
</script>

</body>
</html>
