/* ============ 设计令牌 ============ */
:root {
    --et-accent: #2563eb;
    --et-accent-weak: rgba(37, 99, 235, .14);

    --et-surface: #ffffff;

    --et-line: rgba(15, 23, 42, .12);

    --et-glass: rgba(255, 255, 255, .85);
    --et-shadow-md: 0 10px 28px -18px rgba(15, 23, 42, .3);
    --et-shadow-lg: 0 24px 60px -32px rgba(15, 23, 42, .4);
    --et-ok: #059669;
    --et-warn: #d97706;
    --et-err: #dc2626;
    --et-radius: 12px;
    --et-radius-sm: 9px;
    --et-font: -apple-system, BlinkMacSystemFont, "Segoe UI",
               "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei",
               "Noto Sans SC", sans-serif;
    --et-mono: ui-monospace, "Cascadia Mono", Consolas, Menlo, monospace;
}

html[data-et-theme="dark"] {
    --et-bg: #0b1120;
    --et-surface: #111a2e;
    --et-surface-2: #0f1729;
    --et-fg: #f1f5f9;
    --et-muted: #94a3b8;
    --et-line: rgba(148, 163, 184, .18);
    --et-line-strong: rgba(148, 163, 184, .3);
    --et-glass: rgba(17, 26, 46, .85);
    --et-shadow-md: 0 10px 34px -18px rgba(0, 0, 0, .8);
    --et-shadow-lg: 0 24px 70px -30px rgba(0, 0, 0, .9);
    --et-ok: #34d399;
    --et-warn: #fbbf24;
    --et-err: #f87171;
}

/* ============ 基础 ============ */

/* body 作为外壳时必须清掉浏览器默认 8px 外边距，
   否则 iframe 预览中文档会比视口高 16px（底部白边 + 多余滚动） */
body.et-app {
    margin: 0;
}

.et-app {
    position: relative;
    isolation: isolate;
    display: flex;
    flex-direction: column;
    height: 100vh;
    height: 100dvh;
    overflow: hidden;
    background: var(--et-bg);
    color: var(--et-fg);
    font-family: var(--et-font);
    -webkit-font-smoothing: antialiased;
    transition: background .25s, color .25s;
}

/* 极光背景：径向渐变 + 呼吸动画（edupick 品质基线，老内核也不掉帧） */
.et-app::before {
    content: '';
    position: fixed;
    inset: 0;
    z-index: -1;
    pointer-events: none;
    background:
        radial-gradient(46% 40% at 20% 18%, var(--et-accent-weak), transparent 65%),
        radial-gradient(42% 38% at 82% 24%, var(--et-accent-weak), transparent 70%),
        radial-gradient(50% 44% at 55% 95%, rgba(16, 185, 129, .10), transparent 65%);
    animation: et-aurora 16s ease-in-out infinite alternate;
}

@keyframes et-aurora {
    from { opacity: .55; transform: scale(1); }
    to { opacity: 1; transform: scale(1.06); }
}

.et-app *,
.et-app *::before,
.et-app *::after { box-sizing: border-box; }

[hidden] { display: none !important; }

.et-icon {
    width: 18px;
    height: 18px;
    fill: none;
    stroke: currentColor;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
    flex: none;
}

/* ============ 顶栏 ============ */
.et-topbar {
    flex: none;

    align-items: center;
    gap: 14px;
    padding: 11px 20px;
    border-bottom: 1px solid var(--et-line);
    background: var(--et-glass);

    -webkit-backdrop-filter: blur(14px);

}

.et-brand {

}

.et-brand__dot {

.et-brand__name {

}

.et-status {

    background: var(--et-surface-2);

}

.et-status__dot {
    width: 7px;

}

.et-status[data-tone="err"] .et-status__dot { background: var(--et-err); }
.et-status[data-tone="warn"] .et-status__dot { background: var(--et-warn); }

.et-actions {
    display: flex;
    align-items: center;
    gap: 7px;
}

.et-icon-btn {
    display: inline-grid;
    place-items: center;
    width: 38px;
    height: 38px;
    font-size: 16px;
    line-height: 1;
    border-radius: 11px;
    border: 1px solid var(--et-line);
    background: var(--et-surface-2);
    color: var(--et-fg);
    cursor: pointer;
    transition: transform .14s, border-color .14s, color .14s, opacity .14s;
    -webkit-tap-highlight-color: transparent;
}

.et-icon-btn:hover {
    border-color: var(--et-accent);
    color: var(--et-accent);

}

.et-icon-btn:active { transform: translateY(0); }
.et-icon-btn.is-off { opacity: .4; }
.et-icon-btn:focus-visible { outline: 2px solid var(--et-accent); outline-offset: 2px; }

/* ============ 主区默认 ============ */
.et-main {
    flex: 1;
    min-height: 0;
    position: relative;
    overflow: auto;
}

/* ============ 页脚（品牌回流 L2） ============ */
.et-footer {
    flex: none;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 7px 16px;
    font-size: 12px;
    color: var(--et-muted);
    border-top: 1px solid var(--et-line);
    background: var(--et-glass);

    z-index: 20;
}

.et-footer a {
    color: inherit;
    text-decoration: none;
    transition: color .14s;
}

.et-footer a:hover { color: var(--et-accent); }

/* ============ 按钮 ============ */
.et-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
    padding: 9px 16px;

    font-size: 13.5px;
    font-weight: 700;
    border: 1px solid var(--et-line);
    background: var(--et-surface-2);
    color: var(--et-fg);
    cursor: pointer;
    transition: transform .14s, border-color .14s, color .14s, background .14s, box-shadow .14s;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
}

.et-btn:hover {
    border-color: var(--et-accent);
    color: var(--et-accent);
    transform: translateY(-1px);
}

.et-btn:active { transform: translateY(0); }
.et-btn:focus-visible { outline: 2px solid var(--et-accent); outline-offset: 2px; }
.et-btn:disabled { opacity: .45; cursor: not-allowed; transform: none; }

.et-btn--primary {
    background: var(--et-accent);
    border-color: var(--et-accent);
    color: #fff;
    box-shadow: 0 6px 18px -8px var(--et-accent);
}

.et-btn--primary:hover { color: #fff; filter: brightness(1.08); }
.et-btn--primary:disabled { filter: none; }

.et-btn--danger:hover {
    border-color: var(--et-err);
    color: var(--et-err);
}

.et-btn--lg {
    padding: 13px 26px;

    border-radius: 14px;
}

/* ============ 弹窗 ============ */
.et-modal {
    position: fixed;
    inset: 0;
    z-index: 100;
    display: grid;
    place-items: center;
    padding: 24px;
    background: rgba(2, 6, 23, .55);

}

.et-modal__head .et-icon-btn {

    height: 32px;
}

.et-modal__body {

    min-height: 0;
    overflow: auto;
    padding: 18px 20px;
}

.et-modal__foot {
    flex: none;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 14px 20px;

}

@keyframes et-fade {

}

@keyframes et-pop {
    from { opacity: 0; transform: translateY(14px) scale(.97); }
}

/* ============ 轻提示（toast） ============ */
.et-toast {
    position: fixed;
    left: 50%;

 *       { key: 'mean', label: '释义', keys: ['释义', '意思', 'meaning'] }
 *     ],
 *     placeholder: '…',   // 可选，覆盖粘贴框提示
 *     help: '…',          // 可选，覆盖说明文字
 *     onConfirm: function (rows, meta) { … }  // rows: [{word, ipa, mean}]
 *   });
 *   未传 fields 时行为与旧版完全一致（name / id / weight 三列）。
 *
 * 也提供纯解析入口（不弹窗）：
 *   var result = ET.Import.parseText(text, { weight: true });
 *   // result = { rows: [...], stats: { lines, valid, dupes, blanks, errors: [...] } }
 */
(function (global) {
    'use strict';

    /* ============ 常量 ============ */

    var NAME_KEYS = ['姓名', '名字', '名称', '学生', '学员', 'name', 'student'];
    var ID_KEYS = ['学号', '编号', '序号', '号码', 'id', 'no', 'number'];
    var WEIGHT_KEYS = ['权重', '次数', '倍数', 'weight', 'times'];

    var MAX_WEIGHT = 99;

    /* ============ 解析 ============ */

    function normCell(s) {
        return String(s === undefined || s === null ? '' : s).trim();
    }

    function matchKey(cell, keys) {
        var c = normCell(cell).toLowerCase();
        if (!c) { return false; }
        for (var i = 0; i < keys.length; i++) {
            if (c === keys[i]) { return true; }
        }
        for (var j = 0; j < keys.length; j++) {
            /* 中文表头常见"学生姓名"，用包含匹配 */
            if (/[\u4e00-\u9fa5]/.test(keys[j]) && c.indexOf(keys[j]) !== -1) { return true; }
        }
        return false;
    }

    function isAllNumeric(arr) {
        if (!arr.length) { return false; }
        for (var i = 0; i < arr.length; i++) {
            if (!/^\d{1,6}(\.\d+)?$/.test(normCell(arr[i]))) { return false; }
        }
        return true;
    }

    /** 引号感知的 CSV 行拆分（RFC4180 简化版，不支持跨行引号） */
    function splitLine(line, delim) {
        var out = [];
        var cur = '';
        var inQ = false;
        for (var i = 0; i < line.length; i++) {
            var ch = line[i];
            if (inQ) {
                if (ch === '"') {
                    if (line.charAt(i + 1) === '"') { cur += '"'; i++; }
                    else { inQ = false; }
                } else {
                    cur += ch;
                }
            } else if (ch === '"') {
                inQ = true;
            } else if (ch === delim) {
                out.push(cur);
                cur = '';
            } else {
                cur += ch;
            }
        }
        out.push(cur);
        return out;
    }

    function detectDelimiter(lines) {
        var counts = { '\t': 0, ',': 0, ';': 0 };
        for (var i = 0; i < lines.length; i++) {

            }
        }
        var best = '\t';
        var bestN = -1;
        for (var k in counts) {
            if (counts[k] > bestN) { bestN = counts[k]; best = k; }
        }
        return bestN > 0 ? best : null;
    }

    /**
     * 把"原始表格行（二维数组）"规范化为 rows。
     * opts.weight 是否识别权重列；opts.id 是否识别学号列。
     */
    function tableToRows(table, opts, stats) {
        opts = opts || {};
        if (!table.length) { return []; }

        var width = 0;
        for (var w = 0; w < table.length; w++) {
            width = Math.max(width, table[w].length);
        }

        /* --- 表头识别 --- */
        var header = null;
        var first = table[0];
        var firstAllEmpty = true;
        for (var c0 = 0; c0 < first.length; c0++) {
            if (normCell(first[c0])) { firstAllEmpty = false; break; }
        }
        if (!firstAllEmpty) {
            for (var c = 0; c < first.length; c++) {
                if (matchKey(first[c], NAME_KEYS) || matchKey(first[c], WEIGHT_KEYS) || matchKey(first[c], ID_KEYS)) {
                    header = first;
                    table = table.slice(1);
                    stats.blanks++; /* 表头行不算数据 */
                    break;
                }
            }
        }

        /* --- 列映射 --- */
        var map = { name: -1, id: -1, weight: -1 };
        if (header) {
            for (var hc = 0; hc < header.length; hc++) {
                if (map.name < 0 && matchKey(header[hc], NAME_KEYS)) { map.name = hc; }
                else if (opts.id && map.id < 0 && matchKey(header[hc], ID_KEYS)) { map.id = hc; }
                else if (opts.weight && map.weight < 0 && matchKey(header[hc], WEIGHT_KEYS)) { map.weight = hc; }
            }
        }

        var cols = table.map(function (row) { return row; });
        function colValues(idx) {
            return cols.map(function (r) { return normCell(r[idx]); }).filter(function (v) { return v !== ''; });
        }

        if (map.name < 0) {
            if (width === 1) {
                map.name = 0;
            } else {
                var c0 = colValues(0);
                var c1 = colValues(1);
                var numeric0 = isAllNumeric(c0);
                var numeric1 = isAllNumeric(c1);
                if (width === 2) {
                    if (numeric0 && !numeric1) { map.id = 0; map.name = 1; }
                    else if (numeric1 && !numeric0 && opts.weight) { map.name = 0; map.weight = 1; }
                    else { map.name = 0; }
                } else {
                    /* ≥3 列：编号 | 姓名 | 权重 的经典布局 */
                    if (numeric0) { map.id = 0; map.name = 1; } else { map.name = 0; }
                    if (opts.weight) { map.weight = width - 1; }
                }
            }
        }
        if (map.name < 0) { map.name = 0; }
        if (!opts.weight) { map.weight = -1; }
        if (!opts.id) { map.id = -1; }

        /* --- 逐行处理 --- */
        var rows = [];
        var seen = {};
        var wantWeight = map.weight >= 0;

        for (var i = 0; i < table.length; i++) {
            var raw = table[i];
            var lineNo = i + (header ? 2 : 1); /* 用户视角的行号（含表头） */
            var name = map.name < raw.length ? normCell(raw[map.name]) : '';
            var restEmpty = true;
            for (var rc = 0; rc < raw.length; rc++) {
                if (normCell(raw[rc])) { restEmpty = false; break; }
            }
            if (!name && restEmpty) { stats.blanks++; continue; }

            if (!name) {
                stats.errors.push('第 ' + lineNo + ' 行：姓名列为空，已跳过');
                continue;
            }

            var weight = 1;
            if (wantWeight && map.weight < raw.length) {
                var wv = normCell(raw[map.weight]);
                if (wv !== '') {
                    var wn = Number(wv);
                    if (isFinite(wn) && wn >= 1) {
                        weight = Math.min(MAX_WEIGHT, Math.round(wn));
                        if (weight !== wn) {
                            stats.errors.push('第 ' + lineNo + ' 行：权重 "' + wv + '" 已取整为 ' + weight);
                        }
                    } else {

                    }

    /* ============ 自定义字段模式（词表 / 题表等非名单数据） ============ */

    }

                    table = table.slice(1);

                }

            }
        }

        var rows = [];
        var seen = {};

        for (var i = 0; i < table.length; i++) {
            var raw = table[i];
            var lineNo = i + (header ? 2 : 1);
            var row = {};
            var allEmpty = true;

            for (var rf = 0; rf < fields.length; rf++) {
                var col = map[fields[rf].key];
                var val = (col >= 0 && col < raw.length) ? normCell(raw[col]) : '';
                row[fields[rf].key] = val;
                if (val) { allEmpty = false; }
            }

            if (allEmpty) { stats.blanks++; continue; }

            if (!row[firstKey]) {
                stats.errors.push('第 ' + lineNo + ' 行：' + (fields[0].label || '首列') + '为空，已跳过');
                continue;
            }

            if (seen[row[firstKey]]) { stats.dupes++; continue; }
            seen[row[firstKey]] = true;

            rows.push(row);
        }
        return rows;
    }

    /** 统一入口：有 fields 走自定义字段，否则沿用名单路径 */
    function buildRows(table, opts, stats) {

    function jsonToTableFields(json, fields) {

                    var v = item[fields[c2].key];
                    if (v === undefined || v === null) { v = item[fields[c2].label] || ''; }
                    out.push(String(v));
                }
            } else {
                continue;
            }
            table.push(out);
        }
        return table;
    }

    function jsonToTable(json) {
        if (Array.isArray(json)) {
            var table = [];
            for (var i = 0; i < json.length; i++) {
                var item = json[i];
                if (typeof item === 'string' || typeof item === 'number') {
                    table.push([String(item)]);
                } else if (item && typeof item === 'object') {
                    var name = item.name || item.姓名 || item.名字 || item.title || '';
                    var weight = item.weight || item.权重 || item.次数 || '';
                    var id = item.id || item.学号 || item.编号 || '';
                    if (name !== undefined && name !== null) {

                    }
                }
            }
            return table;
        }
        return [];

    /**
     * 纯文本解析入口。
     * 返回 { rows, stats }；stats = { lines, valid, dupes, blanks, errors[] }
     */
    function parseText(text, opts) {
        opts = opts || {};

        var rows = [];

        var trimmed = String(text || '').replace(/^\uFEFF/, '').trim();
        if (!trimmed) {
            return { rows: rows, stats: stats };
        }

        /* JSON 优先 */
        if (trimmed.charAt(0) === '[' || trimmed.charAt(0) === '{') {
            try {
                var json = JSON.parse(trimmed);
                var jsonTable = opts.fields ? jsonToTableFields(json, opts.fields) : jsonToTable(json);
                rows = buildRows(jsonTable, opts, stats);
            } catch (err) {
                stats.errors.push('JSON 解析失败：' + err.message);
            }
        } else {
            var lines = trimmed.split(/\r\n|\r|\n/);
            while (lines.length && !lines[lines.length - 1].trim()) { lines.pop(); }
            stats.lines = lines.length;

            var delim = detectDelimiter(lines);
            var table = [];
            for (var i = 0; i < lines.length; i++) {
                if (!lines[i].trim()) { continue; }
                table.push(delim ? splitLine(lines[i], delim) : [lines[i]]);
            }

        }

    }

    /* ============ 文件解码 ============ */

        if (bytes[0] === 0xFF && bytes[1] === 0xFE) {
            return new TextDecoder('utf-16le').decode(bytes.subarray(2));
        }
        /* 严格 UTF-8 失败 → GBK / GB18030（Excel 导出的中文 CSV 常见） */
        try {
            return new TextDecoder('utf-8', { fatal: true }).decode(bytes);
        } catch (err) {
            try { return new TextDecoder('gb18030').decode(bytes); }
            catch (err2) { return new TextDecoder('gbk').decode(bytes); }
        }

    /* ============ 弹窗 UI ============ */

            html += '<th>#</th>';
            if (opts.fields) {

                    html += '<th>' + esc(opts.fields[lc].label || opts.fields[lc].key) + '</th>';
                }
            } else {
                html += '<th>姓名</th>';
                if (opts.id) { html += '<th>学号</th>'; }
                if (opts.weight) { html += '<th>权重</th>'; }

            for (var i = 0; i < previewMax; i++) {

                if (opts.fields) {

                    }

                    html += '<td>' + esc(rows[i].name) + '</td>';
                    if (opts.id) { html += '<td class="etimp-dim">' + esc(rows[i].id || '—') + '</td>'; }
                    if (opts.weight) { html += '<td class="etimp-num">' + rows[i].weight + '</td>'; }

        }

    }

                '也支持带表头的 CSV（姓名 / 学号 / 权重 列自动识别）与 JSON 数组。' +

            '<button type="button" class="etimp-tab" data-tab="file">打开文件</button>' +
            '</div>' +
            '<div data-panel="paste">' +

            '<span class="etimp-drop__main">点击选择或拖入文件</span>' +
            '<span class="etimp-drop__hint">支持 .csv / .txt / .json，自动识别 UTF-8 与 GBK 编码</span>' +
            '<input type="file" class="etimp-file" id="etimp-file" accept=".csv,.txt,.tsv,.json,text/csv,text/plain,application/json">' +
            '</div>' +
            '<div class="etimp-help">Excel 请先另存为 <b>CSV</b> 再导入（文件 → 另存为 → CSV）。</div>' +
            '</div>' +
            '<div class="etimp-result" id="etimp-result"><div class="etimp-empty">输入内容后这里会显示解析结果</div></div>';

            buttons: [

                        close();
                        if (opt.onConfirm) {

        function refresh() {

        var timer = 0;
        textEl.addEventListener('input', function () {
            clearTimeout(timer);
            timer = setTimeout(refresh, 250);
        });

        /* 页签切换 */
        wrap.querySelectorAll('.etimp-tab').forEach(function (tab) {
            tab.addEventListener('click', function () {
                wrap.querySelectorAll('.etimp-tab').forEach(function (t) { t.classList.remove('is-active'); });
                tab.classList.add('is-active');
                var name = tab.getAttribute('data-tab');
                q('[data-panel="paste"]').hidden = name !== 'paste';
                q('[data-panel="file"]').hidden = name !== 'file';
            });
        });

        /* 文件区 */
        var drop = q('#etimp-drop');
        var fileInput = q('#etimp-file');

        var dropIconHost = drop.querySelector('.et-drop-icon');
        var NS_SVG = 'http://www.w3.org/2000/svg'; /* et-allow-external SVG 命名空间 */
        var dropSvg = document.createElementNS(NS_SVG, 'svg');
        dropSvg.setAttribute('class', 'et-icon');
        var dropUse = document.createElementNS(NS_SVG, 'use');
        dropUse.setAttribute('href', '#i-upload');
        dropSvg.appendChild(dropUse);
        dropIconHost.appendChild(dropSvg);

        drop.addEventListener('click', function () { fileInput.click(); });
        drop.addEventListener('keydown', function (ev) {
            if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); fileInput.click(); }
        });
        ['dragenter', 'dragover'].forEach(function (evName) {
            drop.addEventListener(evName, function (ev) {
                ev.preventDefault();
                drop.classList.add('is-over');
            });
        });
        ['dragleave', 'drop'].forEach(function (evName) {
            drop.addEventListener(evName, function (ev) {
                ev.preventDefault();
                drop.classList.remove('is-over');
            });
        });
        drop.addEventListener('drop', function (ev) {
            var files = ev.dataTransfer && ev.dataTransfer.files;
            if (files && files.length) { readFile(files[0]); }
        });
        fileInput.addEventListener('change', function () {
            if (fileInput.files && fileInput.files.length) { readFile(fileInput.files[0]); }
        });

        function readFile(file) {
            var reader = new FileReader();
            reader.onload = function () {
                var text = decodeBuffer(reader.result);
                var isJson = /\.json$/i.test(file.name) ||
                    (text.charAt(0) !== '\n' && (text.charAt(0) === '['));
                if (isJson) {
                    try {
                        JSON.parse(text.trim()); /* 校验合法性，错误交给 parseText 报 */
                    } catch (err) { /* parseText 会再次报错 */ }
                }
                textEl.value = text;
                /* 切回粘贴页让用户可见内容 */
                wrap.querySelectorAll('.etimp-tab').forEach(function (t) {
                    t.classList.toggle('is-active', t.getAttribute('data-tab') === 'paste');
                });
                q('[data-panel="paste"]').hidden = false;
                q('[data-panel="file"]').hidden = true;
                refresh();
                global.ET.Chrome.toast('已读取 ' + file.name, 'ok');
            };
            reader.onerror = function () {
                global.ET.Chrome.toast('文件读取失败', 'err');
            };
            reader.readAsArrayBuffer(file);
        }

        refresh();
        setTimeout(function () { textEl.focus(); }, 60);

        return modal;
    }

    global.ET = global.ET || {};
    global.ET.Import = { open: open, parseText: parseText, decodeBuffer: decodeBuffer };

    function parseDict(raw) {
        var map = {};
        if (typeof raw !== 'string' || !raw) { return map; }
        var char = '', py = '';
        for (var i = 0; i < raw.length; i++) {
            var ch = raw.charAt(i);
            if (HANZI_RE.test(ch)) {
                if (char) { map[char] = py; }
                char = ch;
                py = '';
            } else {
                py += ch;
            }
        }
        if (char) { map[char] = py; }
        return map;
    }

    function pinyinFor(word) {
        var chars = String(word).split('');
        var parts = [];
        var missing = [];
        for (var i = 0; i < chars.length; i++) {
            var ch = chars[i];
            if (!HANZI_RE.test(ch)) { parts.push(ch); continue; }
            var py = DICT[ch];
            if (py) { parts.push(py); } else { parts.push('?'); missing.push(ch); }
        }
        return { py: parts.join(' '), missing: missing };
    }

        if (STYLES.indexOf(s.style) < 0) { s.style = DEFAULTS.style; }
        s.perLine = clampInt(s.perLine, 1, 4, DEFAULTS.perLine);
        s.title = typeof s.title === 'string' ? s.title : DEFAULTS.title;
        s.items = normalizeItems(store.get('items', null));
        if (!s.items.length) { s.items = toItems(SAMPLE_WORDS); }
        return s;
    }

    function normalizeItems(list) {
        var out = [];
        if (!Array.isArray(list)) { return out; }
        for (var i = 0; i < list.length; i++) {
            var it = list[i];
            if (!it) { continue; }
            var w = String(it.word === undefined || it.word === null ? '' : it.word).trim();
            if (!w) { continue; }
            out.push({
                word: w,
                py: String(it.py === undefined || it.py === null ? '' : it.py).trim()
            });
        }
        return out;
    }

    function toItems(words) {
        var out = [];
        for (var i = 0; i < words.length; i++) {
            out.push({ word: words[i], py: '' });
        }
        return out;
    }

    function persist() {
        for (var k in DEFAULTS) {
            if (Object.prototype.hasOwnProperty.call(DEFAULTS, k)) {
                store.set(k, state[k]);
            }
        }
        store.set('items', state.items);
    }

    function isTypingTarget(node) {
        if (!node || !node.tagName) { return false; }
        var tag = node.tagName.toUpperCase();
        return tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT' || node.isContentEditable === true;
    }

    function text(tag, cls, value) {
        var node = document.createElement(tag);
        if (cls) { node.className = cls; }
        if (value !== undefined && value !== null) { node.textContent = value; }
        return node;
    }

    /* ---------- 排版尺寸 ---------- */

    function maxChars() {
        var m = 1;
        for (var i = 0; i < state.items.length; i++) {
            m = Math.max(m, state.items[i].word.length);
        }
        return m;
    }

    function cellSize() {
        var groupW = PAGE_W / state.perLine - GAP_X;
        var size = Math.min(16, groupW / maxChars());
        return Math.max(7, Math.round(size * 2) / 2);
    }

    function pyHeight() { return Math.round(cellSize() * 0.42 * 2) / 2; }

    function linesPerPage() {
        var per = Math.max(1, Math.floor((PAGE_H - 30) / LINE_H));
        return per;
    }

    /* ---------- 渲染 ---------- */

    function render() {
        els.preview.innerHTML = '';
        if (!state.items.length) {
            var empty = text('div', 'pw-empty');
            empty.appendChild(text('div', 'pw-empty__title', '还没有练习内容'));
            var p = document.createElement('div');
            p.innerHTML = '点右上角「导入词语」粘贴本课词语（一行一个），或点「示例词语」载入 20 个常用词。<br>' +
                '多音字可用 <b>词语,拼音</b> 的写法覆盖自动注音。';
            empty.appendChild(p);
            els.preview.appendChild(empty);
            updateStat(0);
            return;
        }

        var per = linesPerPage();
        var perLine = state.perLine;
        var totalLines = Math.ceil(state.items.length / perLine);
        var pages = Math.max(1, Math.ceil(totalLines / per));

        var frag = document.createDocumentFragment();
        for (var p2 = 0; p2 < pages; p2++) {
            frag.appendChild(buildPage(p2, per, pages));
        }
        els.preview.appendChild(frag);
        updateStat(pages);
        syncSeg();
    }

    function buildPage(pageIdx, per, pages) {
        var page = text('section', 'pw-page');

        var head = text('div', 'pw-head');
        head.appendChild(text('div', 'pw-title', state.title || '看拼音写词语'));
        if (state.showMeta) {
            var meta = text('div', 'pw-meta');
            meta.appendChild(text('span', null, '姓名：____________'));
            meta.appendChild(text('span', null, '班级：__________'));
            meta.appendChild(text('span', null, '日期：__________'));
            meta.appendChild(text('span', null, '得分：________'));
            head.appendChild(meta);
        }
        page.appendChild(head);

        var lines = text('div', 'pw-lines');
        lines.style.setProperty('--pw-cols', String(state.perLine));
        lines.style.setProperty('--pw-cell', cellSize() + 'mm');
        lines.style.setProperty('--pw-pyh', pyHeight() + 'mm');
        lines.style.setProperty('--pw-gap', '5mm');
        lines.style.setProperty('--pw-gapx', GAP_X + 'mm');

        var perLine = state.perLine;
        var fromLine = pageIdx * per;
        var start = fromLine * perLine;
        var end = Math.min(state.items.length, (fromLine + per) * perLine);

        for (var i = start; i < end; i += perLine) {
            var row = text('div', 'pw-line');
            for (var j = 0; j < perLine; j++) {
                var idx = i + j;
                if (idx >= state.items.length) { break; }
                row.appendChild(buildItem(state.items[idx]));
            }
            lines.appendChild(row);
        }
        page.appendChild(lines);

        var foot = text('div', 'pw-foot');
        foot.appendChild(text('span', null, 'KeeTools 课工具 · 看拼音写词语'));
        foot.appendChild(text('span', null, '第 ' + (pageIdx + 1) + ' 页 / 共 ' + pages + ' 页'));
        page.appendChild(foot);

        return page;
    }

    function buildItem(item) {
        var box = text('div', 'pw-item');
        var info = item.py ? { py: item.py, missing: [] } : pinyinFor(item.word);

        var py = text('div', 'pw-py');
        var segs = info.py.split(' ');
        for (var s = 0; s < segs.length; s++) {
            if (s) { py.appendChild(document.createTextNode(' ')); }
            if (segs[s] === '?') {
                py.appendChild(text('span', 'pw-q', '?'));
            } else {
                py.appendChild(document.createTextNode(segs[s]));
            }
        }
        py.style.fontSize = pyFontSize(info.py) + 'mm';
        box.appendChild(py);

        var boxes = text('div', 'pw-boxes');
        var chars = item.word.split('');
        for (var c = 0; c < chars.length; c++) {
            var cell = text('span', 'pw-box' + (state.style === 'plain' ? ' is-plain' : ''));
            if (state.showAnswer) { cell.textContent = chars[c]; }
            boxes.appendChild(cell);
        }
        box.appendChild(boxes);
        return box;
    }

    function pyFontSize(py) {
        var groupW = Math.max(cellSize() * maxChars(), 20);
        var len = Math.max(1, py.length);
        var size = groupW / (len * 0.52);
        return Math.max(2.6, Math.min(4.6, Math.round(size * 10) / 10));
    }

    function unknownChars() {
        var bad = [];
        for (var i = 0; i < state.items.length; i++) {
            var it = state.items[i];
            if (it.py) { continue; }
            var info = pinyinFor(it.word);
            for (var j = 0; j < info.missing.length; j++) {
                if (bad.indexOf(info.missing[j]) < 0) { bad.push(info.missing[j]); }
            }
        }
        return bad;
    }

    function updateStat(pages) {
        if (!state.items.length) {
            els.stat.textContent = '尚未导入词语';
            els.stat.className = 'pw-stat';
            chrome.setStatus('待导入词语', 'warn');
            return;
        }
        var bad = unknownChars();
        els.stat.textContent = state.items.length + ' 词 · 每行 ' + state.perLine + ' 个 · 共 ' +
            Math.max(1, pages) + ' 页' + (bad.length ? ' · ' + bad.length + ' 个字未收录' : '');
        els.stat.className = 'pw-stat' + (bad.length ? ' is-warn' : '');
        els.btnAnswer.querySelector('span').textContent = state.showAnswer ? '隐藏答案' : '显示答案';
        chrome.setStatus('已排 ' + state.items.length + ' 个词语', 'ok');
    }

    function syncSeg() {
        var btns = els.seg.getElementsByTagName('button');
        for (var i = 0; i < btns.length; i++) {
            btns[i].className = btns[i].getAttribute('data-style') === state.style ? 'is-on' : '';
        }
    }

    /* ---------- 操作 ---------- */

    function setStyle(style) {
        if (STYLES.indexOf(style) < 0 || style === state.style) { return; }
        state.style = style;
        persist();
        render();
    }

    function toggleAnswer() {
        state.showAnswer = !state.showAnswer;
        persist();
        render();
        chrome.toast(state.showAnswer ? '答案已显示（浅灰字），可直接打印对照' : '已隐藏答案');
    }

    function doPrint() {
        if (!state.items.length) { chrome.toast('先导入词语', 'warn'); return; }
        if (typeof window.print !== 'function') { chrome.toast('当前环境不支持打印', 'err'); return; }
        window.setTimeout(function () {
            try { window.print(); } catch (e) { chrome.toast('打印失败，请用浏览器打印快捷键', 'err'); }
        }, 60);
    }

    function clearItems() {
        if (!state.items.length) { chrome.toast('词语已经是空的'); return; }
        chrome.modal({
            title: '清空词语',
            icon: 'i-trash',
            size: 'narrow',
            body: '<p style="margin:0;font-size:13.5px;line-height:1.9">将删除本机保存的 <b>' +
                state.items.length + '</b> 个词语，设置保留。此操作不可撤销。</p>',
            buttons: [
                { label: '取消' },
                {
                    label: '清空',
                    primary: true,
                    danger: true,
                    onClick: function (close) {
                        state.items = [];
                        persist();
                        render();
                        close();
                        chrome.toast('词语已清空');
                    }
                }
            ]
        });
    }

    function openImport() {
        if (!(window.ET && ET.Import)) { chrome.toast('导入组件未加载', 'err'); return; }
        var lines = [];
        for (var i = 0; i < state.items.length; i++) {
            lines.push(state.items[i].py
                ? state.items[i].word + ',' + state.items[i].py
                : state.items[i].word);
        }
        ET.Import.open({
            toolId: TOOL_ID,
            title: '导入词语',
            fields: [
                { key: 'word', label: '词语', keys: ['词语', '生词', '内容', '汉字', 'word'] },
                { key: 'py', label: '拼音', keys: ['拼音', '注音', 'pinyin'] }
            ],
            current: lines.join('\n'),
            placeholder: '一行一个词语，拼音可留空（自动注音）：\n春天\n朋友\n长跑,cháng pǎo',
            help: '第一列是<b>词语</b>（一行一个，可直接粘贴 Excel 整列）；第二列<b>拼音可留空</b>，' +
                '留空时用内置常用字表自动注音。多音字建议手工写上拼音覆盖，例如 <b>长跑,cháng pǎo</b>。',
            onConfirm: function (rows) {
                var list = [];
                for (var r = 0; r < rows.length; r++) {
                    if (!rows[r].word) { continue; }
                    list.push({ word: rows[r].word, py: rows[r].py || '' });
                }
                state.items = list;
                persist();
                render();
                try { chrome.beep('ok'); } catch (e) { /* 静默 */ }
                var bad = unknownChars();
                chrome.toast('已导入 ' + list.length + ' 个词语' +
                    (bad.length ? '，其中 ' + bad.length + ' 个字未收录（拼音显示 ?）' : ''), 'ok');
            }
        });
    }

    function loadSample() {
        state.items = toItems(SAMPLE_WORDS);
        persist();
        render();
        chrome.toast('已载入 ' + SAMPLE_WORDS.length + ' 个常用词语');
    }

    function exportCsv() {
        if (!state.items.length) { chrome.toast('先导入词语', 'warn'); return; }
        var lines = ['词语,拼音'];
        for (var i = 0; i < state.items.length; i++) {
            lines.push(csvCell(state.items[i].word) + ',' + csvCell(state.items[i].py || pinyinFor(state.items[i].word).py));
        }
        download('看拼音写词语.csv', '\uFEFF' + lines.join('\r\n'));
    }

    function csvCell(v) {
        var s = String(v === undefined || v === null ? '' : v);
        return /[",\r\n]/.test(s) ? '"' + s.split('"').join('""') + '"' : s;
    }

    function download(filename, content) {
        try {
            var blob = new Blob([content], { type: 'text/csv;charset=utf-8' });
            var url = URL.createObjectURL(blob);
            var a = document.createElement('a');
            a.href = url;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            window.setTimeout(function () {
                if (a.parentNode) { a.parentNode.removeChild(a); }
                URL.revokeObjectURL(url);
            }, 0);
            chrome.toast('已导出 ' + filename, 'ok');
        } catch (e) {
            chrome.toast('导出失败', 'err');
        }
    }

    /* ---------- 设置抽屉 ---------- */

    function options(pairs, current) {
        var out = '';
        for (var i = 0; i < pairs.length; i++) {
            out += '<option value="' + pairs[i][0] + '"' +
                (String(pairs[i][0]) === String(current) ? ' selected' : '') + '>' + pairs[i][1] + '</option>';
        }
        return out;
    }

    function buildSettings(body) {
        var v = function (s) { return ET.escapeHtml(s); };
        body.innerHTML =
            '<h4>纸面</h4>' +
            '<div class="et-drawer__row">' +
            '<input class="et-drawer__input" id="pwSetTitle" value="' + v(state.title) +
            '" placeholder="练习卷标题"></div>' +
            '<label class="et-drawer__switch">打印姓名 / 班级 / 日期 / 得分栏' +
            '<input type="checkbox" id="pwSetMeta"' + (state.showMeta ? ' checked' : '') + '></label>' +
            '<label class="et-drawer__switch">格中印出答案（浅灰字）' +
            '<input type="checkbox" id="pwSetAnswer"' + (state.showAnswer ? ' checked' : '') + '></label>' +

            '<h4>格子 / 排版</h4>' +
            '<div class="et-drawer__row">' +
            '<select class="et-drawer__input" id="pwSetStyle">' +
            options([['tian', '田字格（红虚线）'], ['plain', '方格（灰实线）']], state.style) +
            '</select>' +
            '<select class="et-drawer__input" id="pwSetPerLine">' +
            options([['1', '每行 1 个词'], ['2', '每行 2 个词'], ['3', '每行 3 个词'],
                ['4', '每行 4 个词']], state.perLine) +
            '</select></div>' +
            '<p class="et-drawer__tip">格子大小自动适配最长词语（' + maxChars() + ' 字 → ' +
            cellSize() + 'mm）；每页约 <b>' + linesPerPage() + '</b> 行，' +
            '当前 <b>' + state.items.length + '</b> 个词 → <b>' +
            Math.max(1, Math.ceil(Math.ceil(state.items.length / state.perLine) / linesPerPage())) +
            '</b> 页。</p>' +

            '<h4>词语</h4>' +
            '<div class="et-drawer__row">' +
            '<button class="et-btn" id="pwSetImport" type="button">导入词语</button>' +
            '<button class="et-btn" id="pwSetSample" type="button">示例词语</button>' +
            '<button class="et-btn" id="pwSetCsv" type="button">导出（含拼音）</button>' +
            '<button class="et-btn et-btn--danger" id="pwSetClear" type="button">清空</button>' +
            '</div>' +
            '<p class="et-drawer__tip">内置常用字表共 <b>' + dictCount() + '</b> 个常用字' +
            '（GB2312 一级字集，通用读音）。多音字请用「词语,拼音」覆盖。</p>';

        var q = function (id) { return document.getElementById(id); };
        q('pwSetTitle').addEventListener('input', function () { state.title = this.value; persist(); render(); });
        q('pwSetMeta').addEventListener('change', function () { state.showMeta = this.checked; persist(); render(); });
        q('pwSetAnswer').addEventListener('change', function () {
            state.showAnswer = this.checked; persist(); render();
        });
        q('pwSetStyle').addEventListener('change', function () { setStyle(this.value); render(); });
        q('pwSetPerLine').addEventListener('change', function () {
            state.perLine = clampInt(this.value, 1, 4, DEFAULTS.perLine);
            persist();
            render();
        });
        q('pwSetImport').addEventListener('click', openImport);
        q('pwSetSample').addEventListener('click', loadSample);
        q('pwSetCsv').addEventListener('click', exportCsv);
        q('pwSetClear').addEventListener('click', clearItems);
    }

    function dictCount() {
        var n = 0;
        for (var k in DICT) {
            if (Object.prototype.hasOwnProperty.call(DICT, k)) { n++; }
        }
        return n;
    }

    /* ---------- 事件与启动 ---------- */

    var segBtns = els.seg.getElementsByTagName('button');
    for (var b = 0; b < segBtns.length; b++) {
        (function (btn) {
            btn.addEventListener('click', function () { setStyle(btn.getAttribute('data-style')); });
        })(segBtns[b]);
    }

    els.btnPrint.addEventListener('click', doPrint);
    els.btnImport.addEventListener('click', openImport);
    els.btnSample.addEventListener('click', loadSample);
    els.btnAnswer.addEventListener('click', toggleAnswer);

    document.addEventListener('keydown', function (e) {
        if (isTypingTarget(e.target)) { return; }
        if (e.key === 'a' || e.key === 'A') { toggleAnswer(); }
        else if ((e.key === 'p' || e.key === 'P') && !e.ctrlKey && !e.metaKey) { doPrint(); }
        else if (e.key === '1') { setStyle('tian'); }
        else if (e.key === '2') { setStyle('plain'); }
    });

    render();
})();
</script>

</body>
</html>
