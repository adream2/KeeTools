/* ============ 设计令牌 ============ */
:root {
    --et-accent: #2563eb;
    --et-accent-weak: rgba(37, 99, 235, .14);
    --et-bg: #f4f6fb;
    --et-surface: #ffffff;
    --et-surface-2: #f8fafc;
    --et-fg: #0b1220;
    --et-muted: #64748b;
    --et-line: rgba(15, 23, 42, .12);
    --et-line-strong: rgba(15, 23, 42, .22);
    --et-glass: rgba(255, 255, 255, .85);
    --et-shadow-md: 0 10px 28px -18px rgba(15, 23, 42, .3);
    --et-shadow-lg: 0 24px 60px -32px rgba(15, 23, 42, .4);
    --et-ok: #059669;
    --et-warn: #d97706;
    --et-err: #dc2626;
    --et-radius: 12px;
    --et-radius-sm: 9px;
    --et-font: -apple-system, BlinkMacSystemFont, "Segoe UI",
               "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei",
               "Noto Sans SC", sans-serif;
    --et-mono: ui-monospace, "Cascadia Mono", Consolas, Menlo, monospace;
}

html[data-et-theme="dark"] {
    --et-bg: #0b1120;
    --et-surface: #111a2e;
    --et-surface-2: #0f1729;
    --et-fg: #f1f5f9;
    --et-muted: #94a3b8;
    --et-line: rgba(148, 163, 184, .18);
    --et-line-strong: rgba(148, 163, 184, .3);
    --et-glass: rgba(17, 26, 46, .85);
    --et-shadow-md: 0 10px 34px -18px rgba(0, 0, 0, .8);
    --et-shadow-lg: 0 24px 70px -30px rgba(0, 0, 0, .9);
    --et-ok: #34d399;
    --et-warn: #fbbf24;
    --et-err: #f87171;
}

/* ============ 基础 ============ */

/* body 作为外壳时必须清掉浏览器默认 8px 外边距，
   否则 iframe 预览中文档会比视口高 16px（底部白边 + 多余滚动） */
body.et-app {
    margin: 0;
}

.et-app {
    position: relative;
    isolation: isolate;
    display: flex;
    flex-direction: column;
    height: 100vh;
    height: 100dvh;
    overflow: hidden;
    background: var(--et-bg);
    color: var(--et-fg);
    font-family: var(--et-font);
    -webkit-font-smoothing: antialiased;
    transition: background .25s, color .25s;
}

/* 极光背景：径向渐变 + 呼吸动画（edupick 品质基线，老内核也不掉帧） */
.et-app::before {
    content: '';
    position: fixed;
    inset: 0;
    z-index: -1;
    pointer-events: none;
    background:
        radial-gradient(46% 40% at 20% 18%, var(--et-accent-weak), transparent 65%),
        radial-gradient(42% 38% at 82% 24%, var(--et-accent-weak), transparent 70%),
        radial-gradient(50% 44% at 55% 95%, rgba(16, 185, 129, .10), transparent 65%);
    animation: et-aurora 16s ease-in-out infinite alternate;
}

@keyframes et-aurora {
    from { opacity: .55; transform: scale(1); }
    to { opacity: 1; transform: scale(1.06); }
}

.et-app *,
.et-app *::before,
.et-app *::after { box-sizing: border-box; }

[hidden] { display: none !important; }

.et-icon {
    width: 18px;
    height: 18px;
    fill: none;
    stroke: currentColor;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
    flex: none;
}

/* ============ 顶栏 ============ */
.et-topbar {
    flex: none;
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 11px 20px;
    border-bottom: 1px solid var(--et-line);
    background: var(--et-glass);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    z-index: 20;
}

.et-brand {
    display: flex;
    align-items: center;
    gap: 10px;
    min-width: 0;
}

.et-brand__dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: var(--et-accent);
    box-shadow: 0 0 0 4px var(--et-accent-weak);
    flex: none;
}

.et-brand__name {
    font-weight: 800;
    font-size: 15px;
    letter-spacing: -.01em;
    white-space: nowrap;
}

.et-brand__sub {
    font-size: 12.5px;
    color: var(--et-muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.et-status {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 5px 14px;
    border-radius: 999px;
    font-size: 12.5px;
    color: var(--et-muted);
    background: var(--et-surface-2);
    border: 1px solid var(--et-line);
    white-space: nowrap;
    max-width: 42vw;
    overflow: hidden;
    text-overflow: ellipsis;
}

.et-status__dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--et-ok);
    flex: none;
    transition: background .2s;
}

.et-status[data-tone="err"] .et-status__dot { background: var(--et-err); }
.et-status[data-tone="warn"] .et-status__dot { background: var(--et-warn); }

.et-actions {
    display: flex;
    align-items: center;
    gap: 7px;
}

.et-icon-btn {
    display: inline-grid;
    place-items: center;
    width: 38px;
    height: 38px;
    font-size: 16px;
    line-height: 1;
    border-radius: 11px;
    border: 1px solid var(--et-line);
    background: var(--et-surface-2);
    color: var(--et-fg);
    cursor: pointer;
    transition: transform .14s, border-color .14s, color .14s, opacity .14s;
    -webkit-tap-highlight-color: transparent;
}

.et-icon-btn:hover {
    border-color: var(--et-accent);
    color: var(--et-accent);
    transform: translateY(-1px);
}

.et-icon-btn:active { transform: translateY(0); }
.et-icon-btn.is-off { opacity: .4; }
.et-icon-btn:focus-visible { outline: 2px solid var(--et-accent); outline-offset: 2px; }

/* ============ 主区默认 ============ */
.et-main {
    flex: 1;
    min-height: 0;
    position: relative;
    overflow: auto;
}

/* ============ 页脚（品牌回流 L2） ============ */
.et-footer {
    flex: none;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 7px 16px;
    font-size: 12px;
    color: var(--et-muted);
    border-top: 1px solid var(--et-line);
    background: var(--et-glass);
    user-select: none;
    z-index: 20;
}

.et-footer a {
    color: inherit;
    text-decoration: none;
    transition: color .14s;
}

.et-footer a:hover { color: var(--et-accent); }

/* ============ 按钮 ============ */
.et-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
    padding: 9px 16px;
    border-radius: 11px;
    font: inherit;
    font-size: 13.5px;
    font-weight: 700;
    border: 1px solid var(--et-line);
    background: var(--et-surface-2);
    color: var(--et-fg);
    cursor: pointer;
    transition: transform .14s, border-color .14s, color .14s, background .14s, box-shadow .14s;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
}

.et-btn:hover {
    border-color: var(--et-accent);
    color: var(--et-accent);
    transform: translateY(-1px);
}

.et-btn:active { transform: translateY(0); }
.et-btn:focus-visible { outline: 2px solid var(--et-accent); outline-offset: 2px; }
.et-btn:disabled { opacity: .45; cursor: not-allowed; transform: none; }

.et-btn--primary {
    background: var(--et-accent);
    border-color: var(--et-accent);
    color: #fff;
    box-shadow: 0 6px 18px -8px var(--et-accent);
}

.et-btn--primary:hover { color: #fff; filter: brightness(1.08); }
.et-btn--primary:disabled { filter: none; }

.et-btn--danger:hover {
    border-color: var(--et-err);
    color: var(--et-err);
}

.et-btn--lg {
    padding: 13px 26px;
    font-size: 16px;
    border-radius: 14px;
}

/* ============ 弹窗 ============ */
.et-modal {
    position: fixed;
    inset: 0;
    z-index: 100;
    display: grid;
    place-items: center;
    padding: 24px;
    background: rgba(2, 6, 23, .55);
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    animation: et-fade .18s ease;
}

.et-modal__panel {
    width: min(680px, 94vw);
    max-height: 86vh;
    max-height: 86dvh;
    display: flex;
    flex-direction: column;
    background: var(--et-surface);
    border: 1px solid var(--et-line);
    border-radius: 16px;
    box-shadow: var(--et-shadow-lg);
    animation: et-pop .2s cubic-bezier(.34, 1.4, .64, 1);
    overflow: hidden;
}

.et-modal__panel--narrow { width: min(460px, 92vw); }
.et-modal__panel--wide { width: min(900px, 94vw); }

.et-modal__head {
    flex: none;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 16px 20px;
    border-bottom: 1px solid var(--et-line);
    font-weight: 800;
    font-size: 15px;
}

.et-modal__head .et-icon-btn {
    margin-left: auto;
    width: 32px;
    height: 32px;
}

.et-modal__body {
    flex: 1;
    min-height: 0;
    overflow: auto;
    padding: 18px 20px;
}

.et-modal__foot {
    flex: none;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 14px 20px;
    border-top: 1px solid var(--et-line);
    background: var(--et-surface-2);
}

.et-modal__foot .spacer { flex: 1; }

@keyframes et-fade {
    from { opacity: 0; }
}

@keyframes et-pop {
    from { opacity: 0; transform: translateY(14px) scale(.97); }
}

/* ============ 轻提示（toast） ============ */
.et-toast {
    position: fixed;
    left: 50%;
    bottom: 56px;
    transform: translateX(-50%) translateY(10px);
    z-index: 120;
    display: flex;
    align-items: center;
    gap: 9px;
    max-width: min(520px, 88vw);
    padding: 11px 18px;
    border-radius: 12px;
    font-size: 13.5px;
    font-weight: 600;
    color: #fff;
    background: rgba(15, 23, 42, .92);
    border: 1px solid rgba(148, 163, 184, .25);
    box-shadow: var(--et-shadow-lg);
    opacity: 0;
    pointer-events: none;
    transition: opacity .22s, transform .22s;
}

.et-toast.is-show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
}

.et-toast[data-tone="ok"] { background: rgba(5, 150, 105, .95); }
.et-toast[data-tone="err"] { background: rgba(220, 38, 38, .95); }
.et-toast[data-tone="warn"] { background: rgba(217, 119, 6, .95); }

/* ============ 设置抽屉（右上角入口，edupick 交互） ============ */
.et-drawer-backdrop {
    position: fixed;
    inset: 0;
    z-index: 90;
    background: rgba(2, 6, 23, .45);
    backdrop-filter: blur(3px);
    -webkit-backdrop-filter: blur(3px);
    opacity: 0;
    transition: opacity .2s;
}

.et-drawer-backdrop.is-open { opacity: 1; }

.et-drawer {
    position: absolute;
    top: 0;
    right: 0;
    height: 100%;
    width: min(400px, 92vw);
    display: flex;
    flex-direction: column;
    background: var(--et-surface);
    border-left: 1px solid var(--et-line);
    box-shadow: var(--et-shadow-lg);
    transform: translateX(100%);
    transition: transform .22s cubic-bezier(.32, .72, .35, 1);
}

.et-drawer-backdrop.is-open .et-drawer { transform: translateX(0); }

.et-drawer__head {
    flex: none;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 15px 18px;
    border-bottom: 1px solid var(--et-line);
    font-weight: 800;
    font-size: 15px;
    color: var(--et-accent);
}

.et-drawer__head .et-icon-btn {
    margin-left: auto;
    width: 32px;
    height: 32px;
}

.et-drawer__body {
    flex: 1;
    min-height: 0;
    overflow: auto;
    padding: 16px 18px 24px;
}

/* 抽屉内容通用小节（工具复用） */
.et-drawer__body h4 {
    margin: 18px 0 8px;
    font-size: 12px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: .08em;
    color: var(--et-muted);
}

.et-drawer__body h4:first-child { margin-top: 0; }

.et-drawer__row {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
}

.et-drawer__tip {
    margin: 8px 0 0;
    font-size: 12px;
    line-height: 1.8;
    color: var(--et-muted);
}

.et-drawer__tip b { color: var(--et-fg); }

.et-drawer__input {
    flex: 1;
    min-width: 0;
    padding: 9px 12px;
    border: 1px solid var(--et-line-strong);
    border-radius: 9px;
    background: var(--et-surface-2);
    color: var(--et-fg);
    font: inherit;
    font-size: 13.5px;
    transition: border-color .14s, box-shadow .14s;
}

.et-drawer__input:focus {
    outline: none;
    border-color: var(--et-accent);
    box-shadow: 0 0 0 3px var(--et-accent-weak);
}

.et-drawer__switch {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 10px 0;
    border-bottom: 1px dashed var(--et-line);
    font-size: 13.5px;
    font-weight: 600;
    color: var(--et-fg);
    cursor: pointer;
    user-select: none;
}

.et-drawer__switch input {
    width: 17px;
    height: 17px;
    accent-color: var(--et-accent);
    cursor: pointer;
}
</style>

        if (mo.buttons && mo.buttons.length) {
            foot = el('div', 'et-modal__foot');

                var btn = el('button', 'et-btn' + (b.primary ? ' et-btn--primary' : '') + (b.danger ? ' et-btn--danger' : ''), b.label);
                btn.type = 'button';
                btn.addEventListener('click', function () {
                    if (b.onClick) { b.onClick(close); } else { close(); }
                });
                foot.appendChild(btn);
            });
            panel.appendChild(foot);
        }

        backdrop.appendChild(panel);
        document.body.appendChild(backdrop);

        function close() {
            if (backdrop.parentNode) { backdrop.parentNode.removeChild(backdrop); }
            document.removeEventListener('keydown', onKey);
            if (mo.onClose) { mo.onClose(); }
        }

            var blob = new Blob([JSON.stringify(mf)], { type: 'application/manifest+json' });

        syncFsIcon(false);

        var siteOrigin = typeof global.ET_SITE_ORIGIN === 'string' && /^https?:\/\//.test(global.ET_SITE_ORIGIN)
            ? global.ET_SITE_ORIGIN

        function renderFooter() {

            footer.appendChild(el('span', null, 'KeeTools 课工具'));

        try {

<script>
  /* 此块由 scripts/sync_shared.py 自动注入，请勿手工修改 */
/*!
 * et-stats.js — 使用统计模块（模块化，可整体移除）
 *
 * 共享逻辑源。改这里，然后跑：python scripts/sync_shared.py
 * 依赖：无（可脱离 et-util / et-chrome 独立运行）。
 * 全局：ET.Stats
 *
 * ┌────────────────────────────────────────────────────────────────┐
 * │ 说明：本模块只做一件事——工具被打开时向上报端点发一条匿名计数。 │
 * │ · 在线（iframe 内）：宿主页面已服务端计数，本模块不重复上报。   │
 * │ · 离线打开（file:// / 下载单文件 / 离线包）：联网条件具备时，   │
 * │   以 sendBeacon 上报 use_offline 事件（text/plain 免预检）。    │
 * │ · 上报端点 = window.ET_SITE_ORIGIN（由宿主注入或离线包配置）。  │
 * │   未配置端点时本模块完全静默，不发任何请求。                    │
 * │ · **整个 <script> 块可安全删除**：删除后工具其余功能完全正常，  │
 * │   且完全不再发起任何网络请求。                                  │
 * └────────────────────────────────────────────────────────────────┘
 */
(function (global) {
    'use strict';

    var ET = global.ET = global.ET || {};

    var Stats = {
        /** 上报端点来源（站点绝对地址，无协议尾斜杠） */
        endpoint: (typeof global.ET_SITE_ORIGIN === 'string' && /^https?:\/\//.test(global.ET_SITE_ORIGIN))
            ? global.ET_SITE_ORIGIN
            : null,

        _done: {},

        /**
         * 上报一次事件（同一事件同一工具每次页面加载只报一次）。
         * event: 'use_offline' 等；toolId: 工具 id。
         */
        send: function (event, toolId) {
            if (!event || this._done[event + ':' + (toolId || '')]) { return false; }
            if (!this.endpoint) { return false; }
            /* iframe 内由宿主统计，避免双计 */
            try {
                if (global.parent && global.parent !== global) { return false; }
            } catch (err) { return false; }
            /* 断网时挂起，网络恢复自动补报一次 */
            if (global.navigator && global.navigator.onLine === false) {
                var self = this;
                global.addEventListener('online', function () { self.send(event, toolId); }, { once: true });
                return false;
            }

            this._done[event + ':' + (toolId || '')] = true;
            var payload = JSON.stringify({ event: event, tool: toolId || '' });

            try {
                if (global.navigator.sendBeacon) {
                    return global.navigator.sendBeacon(
                        this.endpoint + '/api/track',
                        new Blob([payload], { type: 'text/plain;charset=UTF-8' })
                    );
                }
                global.fetch(this.endpoint + '/api/track', {
                    method: 'POST',
                    body: payload,
                    keepalive: true,
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'text/plain;charset=UTF-8' }
                });
                return true;
            } catch (err) {
                return false;
            }
        }
    };

    ET.Stats = Stats;
})(window);
</script>

<script>
(function () {

            '<p style="margin:0 0 8px"><b>快捷键</b>：空格 / 翻页笔下页键 = 自动扫描开关。</p>' +
            '<p style="margin:0">反射/折射光占比按菲涅耳公式估算（自然光），供直观感受强弱。</p></div>'
    });

    var els = {

    };

    var MEDIA = [
        { id: 'air-water', name: '空气→水', n1: 1.00, n2: 1.33, m1: '空气', m2: '水', tint: 'rgba(14,165,183,.14)' },
        { id: 'air-glass', name: '空气→玻璃', n1: 1.00, n2: 1.50, m1: '空气', m2: '玻璃', tint: 'rgba(16,185,129,.10)' },
        { id: 'water-air', name: '水→空气', n1: 1.33, n2: 1.00, m1: '水', m2: '空气', tint: 'rgba(14,165,183,.14)' },
        { id: 'glass-air', name: '玻璃→空气', n1: 1.50, n2: 1.00, m1: '玻璃', m2: '空气', tint: 'rgba(16,185,129,.10)' }

        var m = media();
        if (m.n1 <= m.n2) { return null; }

    function fresnel(theta1Deg) {
        var m = media();
        var th1 = theta1Deg * Math.PI / 180;
        var sin2 = m.n1 * Math.sin(th1) / m.n2;
        if (sin2 > 1) { return { tir: true, R: 1, T: 0 }; }

        var rp = Math.pow((m.n1 * c2 - m.n2 * c1) / (m.n1 * c2 + m.n2 * c1), 2);

        s += '<circle cx="500" cy="320" r="5" fill="var(--et-fg)"/>';

            '</g>';
        /* 箭头 */
        s += '<polygon id="reflArrow" fill="#fbbf24"/><polygon id="refrArrow" fill="#f87171"/>';
        /* 拖动手柄 */
        s += '<circle id="dragHandle" r="13" fill="var(--et-accent)" stroke="#fff" stroke-width="3" ' +
            'style="cursor:grab"/><circle id="dragHit" r="34" fill="transparent" style="cursor:grab"/>';

        /* 角度弧与标签 */
        s += '<path id="arcI" fill="none" stroke="var(--et-accent)" stroke-width="2"/>';
        s += '<path id="arcR" fill="none" stroke="var(--et-accent)" stroke-width="2"/>';
        s += '<path id="arcG" fill="none" stroke="#f87171" stroke-width="2"/>';
        s += '<text id="labI" font-size="17" font-weight="800" fill="var(--et-accent)" text-anchor="middle">i</text>';
        s += '<text id="labG" font-size="17" font-weight="800" fill="#f87171" text-anchor="middle">γ</text>';

        els.board.innerHTML = s;

        var handle = els.board.querySelector('#dragHandle');
        var hit = els.board.querySelector('#dragHit');
        handle.addEventListener('pointerdown', startDrag);
        hit.addEventListener('pointerdown', startDrag);
        window.addEventListener('pointermove', moveDrag);
        window.addEventListener('pointerup', endDrag);
    }

    function arcPath(radius, d1, d2) {
        /* d 以法线正上方为 0°，顺时针为正；折射侧用 180-γ 表示 */
        function pt(d) {
            var rad = d * Math.PI / 180;
            return (O[0] + radius * Math.sin(rad)).toFixed(1) + ',' + (O[1] - radius * Math.cos(rad)).toFixed(1);
        }
        var sweep = d2 > d1 ? 1 : 0;
        return 'M ' + pt(d1) + ' A ' + radius + ' ' + radius + ' 0 0 ' + sweep + ' ' + pt(d2);
    }

    function render() {
        var m = media();
        var i = state.angle;
        var f = fresnel(i);
        var rad = i * Math.PI / 180;

        var ix = O[0] - RAY * Math.sin(rad), iy = O[1] - RAY * Math.cos(rad);
        var rx = O[0] + RAY * Math.sin(rad), ry = O[1] - RAY * Math.cos(rad);

        var inc = els.board.querySelector('#incidentRay');
        inc.setAttribute('x1', ix.toFixed(1)); inc.setAttribute('y1', iy.toFixed(1));
        inc.setAttribute('x2', O[0]); inc.setAttribute('y2', O[1]);
        inc.setAttribute('opacity', .95);

        var refl = els.board.querySelector('#reflRay');
        refl.setAttribute('x1', O[0]); refl.setAttribute('y1', O[1]);
        refl.setAttribute('x2', rx.toFixed(1)); refl.setAttribute('y2', ry.toFixed(1));
        refl.setAttribute('opacity', f.tir ? 1 : (0.3 + 0.7 * f.R).toFixed(2));
        var midx = O[0] + RAY * .55 * Math.sin(rad), midy = O[1] - RAY * .55 * Math.cos(rad);
        var dx = rx - O[0], dy = ry - O[1], L = Math.hypot(dx, dy);
        els.board.querySelector('#reflArrow').setAttribute('points',
            (midx + dx / L * 9).toFixed(1) + ',' + (midy + dy / L * 9).toFixed(1) + ' ' +
            (midx - dx / L * 7 + dy / L * 6).toFixed(1) + ',' + (midy - dy / L * 7 - dx / L * 6).toFixed(1) + ' ' +
            (midx - dx / L * 7 - dy / L * 6).toFixed(1) + ',' + (midy - dy / L * 7 + dx / L * 6).toFixed(1));

        var refr = els.board.querySelector('#refrRay');
        var refrArrow = els.board.querySelector('#refrArrow');
        if (f.tir || i < 0.2) {
            refr.setAttribute('opacity', 0);
            refrArrow.setAttribute('opacity', 0);
        } else {
            var t2 = f.theta2 * Math.PI / 180;
            var R2 = RAY * 0.9;
            var gx = O[0] + R2 * Math.sin(t2), gy = O[1] + R2 * Math.cos(t2);
            refr.setAttribute('x1', O[0]); refr.setAttribute('y1', O[1]);
            refr.setAttribute('x2', gx.toFixed(1)); refr.setAttribute('y2', gy.toFixed(1));
            refr.setAttribute('opacity', Math.max(.18, f.T).toFixed(2));
            dx = gx - O[0]; dy = gy - O[1]; L = Math.hypot(dx, dy);
            midx = O[0] + R2 * .55 * Math.sin(t2); midy = O[1] + R2 * .55 * Math.cos(t2);
            refrArrow.setAttribute('points',
                (midx + dx / L * 9).toFixed(1) + ',' + (midy + dy / L * 9).toFixed(1) + ' ' +
                (midx - dx / L * 7 + dy / L * 6).toFixed(1) + ',' + (midy - dy / L * 7 - dx / L * 6).toFixed(1) + ' ' +
                (midx - dx / L * 7 - dy / L * 6).toFixed(1) + ',' + (midy - dy / L * 7 + dx / L * 6).toFixed(1));
            refrArrow.setAttribute('opacity', 1);
        }

        /* 手柄 */
        var handle = els.board.querySelector('#dragHandle');
        var hit = els.board.querySelector('#dragHit');
        handle.setAttribute('cx', ix.toFixed(1)); handle.setAttribute('cy', iy.toFixed(1));
        hit.setAttribute('cx', ix.toFixed(1)); hit.setAttribute('cy', iy.toFixed(1));

        /* 弧与标签 */
        els.board.querySelector('#arcI').setAttribute('d', arcPath(64, -i, 0));
        els.board.querySelector('#arcR').setAttribute('d', arcPath(56, 0, i));
        var labI = els.board.querySelector('#labI');
        labI.setAttribute('x', O[0] - 92 * Math.sin(rad / 2));
        labI.setAttribute('y', O[1] - 92 * Math.cos(rad / 2) + 5);
        labI.textContent = 'i=' + i.toFixed(1) + '°';
        if (f.tir) {
            els.board.querySelector('#arcG').setAttribute('d', '');
            els.board.querySelector('#labG').setAttribute('opacity', 0);
        } else {
            var g2 = f.theta2;
            els.board.querySelector('#arcG').setAttribute('d', arcPath(72, 180, 180 - g2));
            var labG = els.board.querySelector('#labG');
            labG.setAttribute('opacity', 1);
            labG.setAttribute('x', O[0] + 100 * Math.sin(g2 * Math.PI / 360));
            labG.setAttribute('y', O[1] + 100 * Math.cos(g2 * Math.PI / 360));
            labG.textContent = 'γ=' + g2.toFixed(1) + '°';
        }

        /* 读数 */
        els.angleOut.textContent = i.toFixed(1) + '°';
        els.reflOut.textContent = i.toFixed(1) + '°';
        var crit = criticalAngle();
        if (f.tir) {
            els.refrRow.classList.add('tir');
            els.refrOut.textContent = '全反射';
            els.critText.innerHTML = '<span class="warn">⚠ 已超过临界角 ' + crit.toFixed(1) +
                '°，发生全反射！</span>';
            chrome.setStatus('全反射', 'warn');
        } else {
            els.refrRow.classList.remove('tir');
            els.refrOut.textContent = f.theta2.toFixed(1) + '°';
            var ratio = i < 0.2 ? '—' : (Math.sin(rad) / Math.sin(f.theta2 * Math.PI / 180)).toFixed(2);
            els.critText.textContent = (crit !== null ? '临界角 ' + crit.toFixed(1) + '°　·　' : '') +
                'sin i / sin γ = ' + ratio + '（应等于 n₂/n₁ = ' + (m.n2 / m.n1).toFixed(2) + '）';
            chrome.setStatus('i = ' + i.toFixed(1) + '°', 'ok');
        }
        els.rOut.textContent = Math.round(f.R * 100) + '%';
        els.tOut.textContent = Math.round(f.T * 100) + '%';

        var chips = els.mediaChips.children;
        for (var k = 0; k < chips.length; k++) {
            chips[k].classList.toggle('is-on', chips[k].getAttribute('data-id') === state.media);
        }
        els.angleRange.value = state.angle;
    }

    /* ---------- 交互 ---------- */

    var dragging = false;

    function startDrag(ev) {
        dragging = true;
        stopScan();
        ev.preventDefault();
        moveDrag(ev);
    }

    function moveDrag(ev) {
        if (!dragging) { return; }
        var rect = els.board.getBoundingClientRect();
        var scale = Math.min(rect.width / 1000, rect.height / 640);
        var ox = rect.left + (rect.width - 1000 * scale) / 2;
        var oy = rect.top + (rect.height - 640 * scale) / 2;
        var px = (ev.clientX - ox) / scale;
        var py = (ev.clientY - oy) / scale;
        var dx = Math.abs(px - O[0]);
        var dy = O[1] - py;
        if (dy < 8) { dy = 8; }
        state.angle = clampF(Math.atan2(dx, dy) * 180 / Math.PI, 0, 89);
        persist();
        render();
    }

    function endDrag() { dragging = false; }

    els.angleRange.addEventListener('input', function () {
        stopScan();
        state.angle = clampF(this.value, 0, 89);
        persist();
        render();
    });

    MEDIA.forEach(function (m) {
        var chip = document.createElement('button');
        chip.type = 'button';
        chip.className = 'lightreflect-chip';
        chip.textContent = m.name;
        chip.setAttribute('data-id', m.id);
        chip.addEventListener('click', function () {
            state.media = m.id;
            chrome.beep('tick');
            persist();
            buildBoard();
            render();
        });
        els.mediaChips.appendChild(chip);
    });

    function scanLoop() {
        state.angle += state.scanDir * 0.35;
        var crit = criticalAngle();
        var hi = crit !== null ? Math.min(89, crit + 6) : 89;
        if (state.angle >= hi) { state.angle = hi; state.scanDir = -1; }
        if (state.angle <= 3) { state.angle = 3; state.scanDir = 1; }
        persist();
        render();
        state.raf = requestAnimationFrame(scanLoop);
    }

    function startScan() {
        if (state.scanning) { return; }
        state.scanning = true;
        els.scanText.textContent = '停止扫描';
        chrome.setStatus('自动扫描中', 'run');
        state.raf = requestAnimationFrame(scanLoop);
    }

    function stopScan() {
        if (!state.scanning) { return; }
        state.scanning = false;
        els.scanText.textContent = '自动扫描';
        if (state.raf) { cancelAnimationFrame(state.raf); state.raf = 0; }
        persist();
        render();
    }

    function toggleScan() {
        if (state.scanning) { stopScan(); } else { startScan(); }
    }

    els.btnScan.addEventListener('click', toggleScan);
    els.btnRandom.addEventListener('click', function () {
        stopScan();
        state.angle = clampF(5 + Math.random() * 80, 0, 89);
        chrome.beep('tick');
        persist();
        render();
    });

    document.addEventListener('keydown', function (e) {
        if (e.code === 'Space' && !isTypingTarget(e.target)) {
            e.preventDefault();
            toggleScan();
        }
    });

    function isTypingTarget(node) {
        if (!node || !node.tagName) { return false; }
        var tag = node.tagName.toUpperCase();
        return tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT' || node.isContentEditable === true;
    }

    function persist() {
        store.set('media', state.media);
        store.set('angle', Math.round(state.angle * 10) / 10);
    }

    /* 恢复上次状态 */
    if (MEDIA.every(function (m) { return m.id !== state.media; })) { state.media = MEDIA[0].id; }
    buildBoard();
    render();
})();
</script>

</body>
</html>
