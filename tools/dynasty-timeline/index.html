/* ============ 设计令牌 ============ */
:root {
    --et-accent: #2563eb;
    --et-accent-weak: rgba(37, 99, 235, .14);
    --et-bg: #f4f6fb;
    --et-surface: #ffffff;
    --et-surface-2: #f8fafc;
    --et-fg: #0b1220;
    --et-muted: #64748b;
    --et-line: rgba(15, 23, 42, .12);
    --et-line-strong: rgba(15, 23, 42, .22);
    --et-glass: rgba(255, 255, 255, .85);
    --et-shadow-md: 0 10px 28px -18px rgba(15, 23, 42, .3);
    --et-shadow-lg: 0 24px 60px -32px rgba(15, 23, 42, .4);
    --et-ok: #059669;
    --et-warn: #d97706;
    --et-err: #dc2626;
    --et-radius: 12px;
    --et-radius-sm: 9px;
    --et-font: -apple-system, BlinkMacSystemFont, "Segoe UI",
               "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei",
               "Noto Sans SC", sans-serif;
    --et-mono: ui-monospace, "Cascadia Mono", Consolas, Menlo, monospace;
}

html[data-et-theme="dark"] {
    --et-bg: #0b1120;
    --et-surface: #111a2e;
    --et-surface-2: #0f1729;
    --et-fg: #f1f5f9;
    --et-muted: #94a3b8;
    --et-line: rgba(148, 163, 184, .18);
    --et-line-strong: rgba(148, 163, 184, .3);
    --et-glass: rgba(17, 26, 46, .85);
    --et-shadow-md: 0 10px 34px -18px rgba(0, 0, 0, .8);
    --et-shadow-lg: 0 24px 70px -30px rgba(0, 0, 0, .9);
    --et-ok: #34d399;
    --et-warn: #fbbf24;
    --et-err: #f87171;
}

/* ============ 基础 ============ */

/* body 作为外壳时必须清掉浏览器默认 8px 外边距，
   否则 iframe 预览中文档会比视口高 16px（底部白边 + 多余滚动） */
body.et-app {
    margin: 0;
}

.et-app {
    position: relative;
    isolation: isolate;
    display: flex;
    flex-direction: column;
    height: 100vh;
    height: 100dvh;
    overflow: hidden;
    background: var(--et-bg);
    color: var(--et-fg);
    font-family: var(--et-font);
    -webkit-font-smoothing: antialiased;
    transition: background .25s, color .25s;
}

/* 极光背景：径向渐变 + 呼吸动画（edupick 品质基线，老内核也不掉帧） */
.et-app::before {
    content: '';
    position: fixed;
    inset: 0;
    z-index: -1;
    pointer-events: none;
    background:
        radial-gradient(46% 40% at 20% 18%, var(--et-accent-weak), transparent 65%),
        radial-gradient(42% 38% at 82% 24%, var(--et-accent-weak), transparent 70%),
        radial-gradient(50% 44% at 55% 95%, rgba(16, 185, 129, .10), transparent 65%);
    animation: et-aurora 16s ease-in-out infinite alternate;
}

@keyframes et-aurora {
    from { opacity: .55; transform: scale(1); }
    to { opacity: 1; transform: scale(1.06); }
}

.et-app *,
.et-app *::before,
.et-app *::after { box-sizing: border-box; }

[hidden] { display: none !important; }

.et-icon {
    width: 18px;
    height: 18px;
    fill: none;
    stroke: currentColor;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
    flex: none;
}

/* ============ 顶栏 ============ */
.et-topbar {
    flex: none;
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 11px 20px;
    border-bottom: 1px solid var(--et-line);
    background: var(--et-glass);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    z-index: 20;
}

.et-brand {
    display: flex;
    align-items: center;
    gap: 10px;
    min-width: 0;
}

.et-brand__dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: var(--et-accent);
    box-shadow: 0 0 0 4px var(--et-accent-weak);
    flex: none;
}

.et-brand__name {
    font-weight: 800;
    font-size: 15px;
    letter-spacing: -.01em;
    white-space: nowrap;
}

.et-brand__sub {
    font-size: 12.5px;
    color: var(--et-muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.et-status {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 5px 14px;
    border-radius: 999px;
    font-size: 12.5px;
    color: var(--et-muted);
    background: var(--et-surface-2);
    border: 1px solid var(--et-line);
    white-space: nowrap;
    max-width: 42vw;
    overflow: hidden;
    text-overflow: ellipsis;
}

.et-status__dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--et-ok);
    flex: none;
    transition: background .2s;
}

.et-status[data-tone="err"] .et-status__dot { background: var(--et-err); }
.et-status[data-tone="warn"] .et-status__dot { background: var(--et-warn); }

.et-actions {
    display: flex;
    align-items: center;
    gap: 7px;
}

.et-icon-btn {
    display: inline-grid;
    place-items: center;
    width: 38px;
    height: 38px;
    font-size: 16px;
    line-height: 1;
    border-radius: 11px;
    border: 1px solid var(--et-line);
    background: var(--et-surface-2);
    color: var(--et-fg);
    cursor: pointer;
    transition: transform .14s, border-color .14s, color .14s, opacity .14s;
    -webkit-tap-highlight-color: transparent;
}

.et-icon-btn:hover {
    border-color: var(--et-accent);
    color: var(--et-accent);
    transform: translateY(-1px);
}

.et-icon-btn:active { transform: translateY(0); }
.et-icon-btn.is-off { opacity: .4; }
.et-icon-btn:focus-visible { outline: 2px solid var(--et-accent); outline-offset: 2px; }

/* ============ 主区默认 ============ */
.et-main {
    flex: 1;
    min-height: 0;
    position: relative;
    overflow: auto;
}

/* ============ 页脚（品牌回流 L2） ============ */
.et-footer {
    flex: none;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 7px 16px;
    font-size: 12px;
    color: var(--et-muted);
    border-top: 1px solid var(--et-line);
    background: var(--et-glass);
    user-select: none;
    z-index: 20;
}

.et-footer a {
    color: inherit;
    text-decoration: none;
    transition: color .14s;
}

.et-footer a:hover { color: var(--et-accent); }

/* ============ 按钮 ============ */
.et-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
    padding: 9px 16px;
    border-radius: 11px;
    font: inherit;
    font-size: 13.5px;
    font-weight: 700;
    border: 1px solid var(--et-line);
    background: var(--et-surface-2);
    color: var(--et-fg);
    cursor: pointer;
    transition: transform .14s, border-color .14s, color .14s, background .14s, box-shadow .14s;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
}

.et-btn:hover {
    border-color: var(--et-accent);
    color: var(--et-accent);
    transform: translateY(-1px);
}

.et-btn:active { transform: translateY(0); }
.et-btn:focus-visible { outline: 2px solid var(--et-accent); outline-offset: 2px; }
.et-btn:disabled { opacity: .45; cursor: not-allowed; transform: none; }

.et-btn--primary {
    background: var(--et-accent);
    border-color: var(--et-accent);
    color: #fff;
    box-shadow: 0 6px 18px -8px var(--et-accent);
}

.et-btn--primary:hover { color: #fff; filter: brightness(1.08); }
.et-btn--primary:disabled { filter: none; }

.et-btn--danger:hover {
    border-color: var(--et-err);
    color: var(--et-err);
}

.et-btn--lg {
    padding: 13px 26px;
    font-size: 16px;
    border-radius: 14px;
}

/* ============ 弹窗 ============ */
.et-modal {
    position: fixed;
    inset: 0;
    z-index: 100;
    display: grid;
    place-items: center;
    padding: 24px;
    background: rgba(2, 6, 23, .55);
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    animation: et-fade .18s ease;
}

.et-modal__panel {
    width: min(680px, 94vw);
    max-height: 86vh;
    max-height: 86dvh;
    display: flex;
    flex-direction: column;
    background: var(--et-surface);
    border: 1px solid var(--et-line);
    border-radius: 16px;
    box-shadow: var(--et-shadow-lg);
    animation: et-pop .2s cubic-bezier(.34, 1.4, .64, 1);
    overflow: hidden;
}

.et-modal__panel--narrow { width: min(460px, 92vw); }
.et-modal__panel--wide { width: min(900px, 94vw); }

.et-modal__head {
    flex: none;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 16px 20px;
    border-bottom: 1px solid var(--et-line);
    font-weight: 800;
    font-size: 15px;
}

.et-modal__head .et-icon-btn {
    margin-left: auto;
    width: 32px;
    height: 32px;
}

.et-modal__body {
    flex: 1;
    min-height: 0;
    overflow: auto;
    padding: 18px 20px;
}

.et-modal__foot {
    flex: none;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 14px 20px;
    border-top: 1px solid var(--et-line);
    background: var(--et-surface-2);
}

.et-modal__foot .spacer { flex: 1; }

@keyframes et-fade {
    from { opacity: 0; }
}

@keyframes et-pop {
    from { opacity: 0; transform: translateY(14px) scale(.97); }
}

/* ============ 轻提示（toast） ============ */
.et-toast {
    position: fixed;
    left: 50%;
    bottom: 56px;
    transform: translateX(-50%) translateY(10px);
    z-index: 120;
    display: flex;
    align-items: center;
    gap: 9px;
    max-width: min(520px, 88vw);
    padding: 11px 18px;
    border-radius: 12px;
    font-size: 13.5px;
    font-weight: 600;
    color: #fff;
    background: rgba(15, 23, 42, .92);
    border: 1px solid rgba(148, 163, 184, .25);
    box-shadow: var(--et-shadow-lg);
    opacity: 0;
    pointer-events: none;
    transition: opacity .22s, transform .22s;
}

.et-toast.is-show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
}

.et-toast[data-tone="ok"] { background: rgba(5, 150, 105, .95); }
.et-toast[data-tone="err"] { background: rgba(220, 38, 38, .95); }
.et-toast[data-tone="warn"] { background: rgba(217, 119, 6, .95); }

/* ============ 设置抽屉（右上角入口，edupick 交互） ============ */
.et-drawer-backdrop {
    position: fixed;
    inset: 0;
    z-index: 90;
    background: rgba(2, 6, 23, .45);
    backdrop-filter: blur(3px);
    -webkit-backdrop-filter: blur(3px);
    opacity: 0;
    transition: opacity .2s;
}

.et-drawer-backdrop.is-open { opacity: 1; }

.et-drawer {
    position: absolute;
    top: 0;
    right: 0;
    height: 100%;
    width: min(400px, 92vw);
    display: flex;
    flex-direction: column;
    background: var(--et-surface);
    border-left: 1px solid var(--et-line);
    box-shadow: var(--et-shadow-lg);
    transform: translateX(100%);
    transition: transform .22s cubic-bezier(.32, .72, .35, 1);
}

.et-drawer-backdrop.is-open .et-drawer { transform: translateX(0); }

.et-drawer__head {
    flex: none;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 15px 18px;
    border-bottom: 1px solid var(--et-line);
    font-weight: 800;
    font-size: 15px;
    color: var(--et-accent);
}

.et-drawer__head .et-icon-btn {
    margin-left: auto;
    width: 32px;
    height: 32px;
}

.et-drawer__body {
    flex: 1;
    min-height: 0;
    overflow: auto;
    padding: 16px 18px 24px;
}

/* 抽屉内容通用小节（工具复用） */
.et-drawer__body h4 {
    margin: 18px 0 8px;
    font-size: 12px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: .08em;
    color: var(--et-muted);
}

.et-drawer__body h4:first-child { margin-top: 0; }

.et-drawer__row {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
}

.et-drawer__tip {
    margin: 8px 0 0;
    font-size: 12px;
    line-height: 1.8;
    color: var(--et-muted);
}

.et-drawer__tip b { color: var(--et-fg); }

.et-drawer__input {
    flex: 1;
    min-width: 0;
    padding: 9px 12px;
    border: 1px solid var(--et-line-strong);
    border-radius: 9px;
    background: var(--et-surface-2);
    color: var(--et-fg);
    font: inherit;
    font-size: 13.5px;
    transition: border-color .14s, box-shadow .14s;
}

.et-drawer__input:focus {
    outline: none;
    border-color: var(--et-accent);
    box-shadow: 0 0 0 3px var(--et-accent-weak);
}

.et-drawer__switch {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 10px 0;
    border-bottom: 1px dashed var(--et-line);
    font-size: 13.5px;
    font-weight: 600;
    color: var(--et-fg);
    cursor: pointer;
    user-select: none;
}

.et-drawer__switch input {
    width: 17px;
    height: 17px;
    accent-color: var(--et-accent);
    cursor: pointer;
}
</style>

        for (var i = 0; i < seq.length; i++) {

        function close() {
            backdrop.classList.remove('is-open');

            setTimeout(function () {

        }
        document.addEventListener('keydown', onKey);
        backdrop.addEventListener('mousedown', function (ev) {
            if (ev.target === backdrop) { close(); }
        });

        if (typeof build === 'function') {
            /* 兼容两种约定：build 自己往 body 里塞内容，或 return 一个元素节点 */
            var ret = build(body, { close: close });

        if (mo.buttons && mo.buttons.length) {
            foot = el('div', 'et-modal__foot');
            foot.appendChild(el('span', 'spacer'));
            mo.buttons.forEach(function (b) {
                var btn = el('button', 'et-btn' + (b.primary ? ' et-btn--primary' : '') + (b.danger ? ' et-btn--danger' : ''), b.label);
                btn.type = 'button';
                btn.addEventListener('click', function () {
                    if (b.onClick) { b.onClick(close); } else { close(); }
                });

            });
            panel.appendChild(foot);
        }

        backdrop.appendChild(panel);
        document.body.appendChild(backdrop);

        function close() {
            if (backdrop.parentNode) { backdrop.parentNode.removeChild(backdrop); }
            document.removeEventListener('keydown', onKey);

        });

        api.beep = function (kind) {

/*!
 * et-stats.js — 使用统计模块（模块化，可整体移除）
 *
 * 共享逻辑源。改这里，然后跑：python scripts/sync_shared.py
 * 依赖：无（可脱离 et-util / et-chrome 独立运行）。
 * 全局：ET.Stats
 *
 * ┌────────────────────────────────────────────────────────────────┐
 * │ 说明：本模块只做一件事——工具被打开时向上报端点发一条匿名计数。 │
 * │ · 在线（iframe 内）：宿主页面已服务端计数，本模块不重复上报。   │
 * │ · 离线打开（file:// / 下载单文件 / 离线包）：联网条件具备时，   │
 * │   以 sendBeacon 上报 use_offline 事件（text/plain 免预检）。    │
 * │ · 上报端点 = window.ET_SITE_ORIGIN（由宿主注入或离线包配置）。  │
 * │   未配置端点时本模块完全静默，不发任何请求。                    │
 * │ · **整个 <script> 块可安全删除**：删除后工具其余功能完全正常，  │
 * │   且完全不再发起任何网络请求。                                  │
 * └────────────────────────────────────────────────────────────────┘
 */
(function (global) {
    'use strict';

    var ET = global.ET = global.ET || {};

    var Stats = {
        /** 上报端点来源（站点绝对地址，无协议尾斜杠） */
        endpoint: (typeof global.ET_SITE_ORIGIN === 'string' && /^https?:\/\//.test(global.ET_SITE_ORIGIN))
            ? global.ET_SITE_ORIGIN
            : null,

        _done: {},

        /**
         * 上报一次事件（同一事件同一工具每次页面加载只报一次）。
         * event: 'use_offline' 等；toolId: 工具 id。
         */
        send: function (event, toolId) {
            if (!event || this._done[event + ':' + (toolId || '')]) { return false; }
            if (!this.endpoint) { return false; }
            /* iframe 内由宿主统计，避免双计 */
            try {
                if (global.parent && global.parent !== global) { return false; }

                var self = this;
                global.addEventListener('online', function () { self.send(event, toolId); }, { once: true });
                return false;
            }

            var payload = JSON.stringify({ event: event, tool: toolId || '' });

            try {
                if (global.navigator.sendBeacon) {
                    return global.navigator.sendBeacon(
                        this.endpoint + '/api/track',
                        new Blob([payload], { type: 'text/plain;charset=UTF-8' })
                    );

                global.fetch(this.endpoint + '/api/track', {
                    method: 'POST',
                    body: payload,
                    keepalive: true,
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'text/plain;charset=UTF-8' }
                });
                return true;
            } catch (err) {
                return false;
            }
        }
    };

    ET.Stats = Stats;

    var els = {
        axis: document.getElementById('axis'),
        inner: document.getElementById('axisInner'),
        scroll: document.getElementById('axisScroll'),
        ruler: document.getElementById('ruler'),
        list: document.getElementById('list'),
        detail: document.getElementById('detail'),

        btnSong: document.getElementById('btnSong'),
        spanNote: document.getElementById('spanNote')
    };

    var MIN_YEAR = -2070;
    var MAX_YEAR = 1912;
    var SPAN = MAX_YEAR - MIN_YEAR;
    var MIN_BLOCK = 26;
    var MIN_EVEN = 74;

    var state = {
        mode: store.get('mode', 'ratio'),
        sel: store.get('sel', 0)
    };

    if (state.mode !== 'ratio' && state.mode !== 'even') { state.mode = 'ratio'; }
    if (typeof state.sel !== 'number' || state.sel < 0 || state.sel >= DYNASTIES.length) { state.sel = 0; }

    /* ---------- 年代格式化 ---------- */

    function yearText(y) {
        if (y < 0) { return '前' + Math.abs(y); }
        return String(y);
    }

    function spanText(d) {
        return yearText(d.start) + ' — ' + yearText(d.end);
    }

    function lengthText(d) {
        var n = d.end - d.start;
        return '历时约 ' + n + ' 年';
    }

    /* ---------- 时间轴渲染 ---------- */

    function buildBlocks() {
        els.axis.innerHTML = '';
        DYNASTIES.forEach(function (d, i) {
            var b = document.createElement('button');
            b.type = 'button';
            b.className = 'dt-block';
            b.setAttribute('data-i', i);
            b.title = d.name + '（' + spanText(d) + '）';
            b.style.setProperty('--dt-region', REGIONS[d.region].color);

            var nm = document.createElement('span');
            nm.className = 'dt-block__name';
            nm.textContent = d.name;
            b.appendChild(nm);

            var sp = document.createElement('span');
            sp.className = 'dt-block__span';
            sp.textContent = yearText(d.end);
            b.appendChild(sp);

            b.addEventListener('click', function () {
                select(i);
                try { chrome.beep('tick'); } catch (e) { /* 静默 */ }
            });
            els.axis.appendChild(b);
        });
    }

    function layout() {
        var avail = Math.max(320, els.scroll.clientWidth - 22);
        var blocks = els.axis.children;
        var widths = [];
        var i;
        var n = DYNASTIES.length;

        if (state.mode === 'even') {
            var w = Math.max(MIN_EVEN, avail / n);
            for (i = 0; i < n; i++) { widths.push(w); }
        } else {
            var pxPerYear = avail / SPAN;
            for (i = 0; i < DYNASTIES.length; i++) {
                var d = DYNASTIES[i];
                widths.push(Math.max(MIN_BLOCK, (d.end - d.start) * pxPerYear));
            }
            /* 迭代归一化：既守住最小可点宽度，又刚好铺满容器（避免默认滚动） */
            for (var pass = 0; pass < 6; pass++) {
                var sum = 0;
                for (i = 0; i < n; i++) { sum += widths[i]; }
                var k = avail / sum;
                if (Math.abs(k - 1) < 0.002) { break; }
                for (i = 0; i < n; i++) { widths[i] = Math.max(MIN_BLOCK, widths[i] * k); }
            }
        }

        var total = 0;
        for (i = 0; i < widths.length; i++) {
            blocks[i].style.width = widths[i] + 'px';
            blocks[i].classList.toggle('is-narrow', widths[i] < 42);
            total += widths[i];
        }
        els.inner.style.width = total + 'px';

        /* 年份刻度 */
        els.ruler.innerHTML = '';
        var ticks = state.mode === 'even'
            ? evenTicks(widths)
            : ratioTicks(widths, avail, total);
        ticks.forEach(function (t) {
            var s = document.createElement('span');
            s.className = 'dt-tick';
            s.style.left = t.x + 'px';
            s.textContent = t.text;
            els.ruler.appendChild(s);
        });
    }

    /* 比例模式：按真实年份位置放置刻度（以最后一块的右端为 1912 年基准校准） */
    function ratioTicks(widths, avail, total) {
        var marks = [-2000, -1500, -1000, -500, 0, 500, 1000, 1500, 1912];
        var pxPerYear = total / SPAN;
        var out = [];
        marks.forEach(function (y) {
            var x = (y - MIN_YEAR) * pxPerYear;
            if (x < 12 || x > total - 12) { return; }
            out.push({ x: x, text: yearText(y) });
        });
        return out;
    }

    /* 等宽模式：每 3 个朝代标一次起止年 */
    function evenTicks(widths) {
        var out = [];
        for (var i = 0; i < widths.length; i++) {
            if (i % 3 !== 0) { continue; }
            out.push({ x: widthSum(widths, i) + widths[i] / 2, text: yearText(DYNASTIES[i].start) });
        }
        return out;
    }

    function widthSum(widths, n) {
        var s = 0;
        for (var i = 0; i < n; i++) { s += widths[i]; }
        return s;
    }

    /* ---------- 列表 ---------- */

    function buildList() {
        els.list.innerHTML = '';
        DYNASTIES.forEach(function (d, i) {
            var b = document.createElement('button');
            b.type = 'button';
            b.className = 'dt-item';
            b.setAttribute('data-i', i);
            b.textContent = d.name;
            var y = document.createElement('span');
            y.className = 'dt-item__y';
            y.textContent = spanText(d);
            b.appendChild(y);
            b.addEventListener('click', function () { select(i); });
            els.list.appendChild(b);
        });
    }

    /* ---------- 详情 ---------- */

    function renderDetail() {
        var d = DYNASTIES[state.sel];
        var region = REGIONS[d.region];
        var html = '';
        html += '<div class="dt-head" style="--dt-region:' + region.color + '">' +
            '<span class="dt-head__name">' + d.name + '</span>' +
            '<span class="dt-head__years">' + spanText(d) + '</span>' +
            '<span class="dt-head__len">' + lengthText(d) + ' · ' + region.label + '</span>' +
            '</div>';
        html += '<p class="dt-summary">' + d.summary + '</p>';
        html += '<div class="dt-grid">' +
            cell('都城', d.capital) +
            cell('开国君主', d.founder) +
            cell('亡国 / 末代君主', d.last) +
            cell('起止年代', spanText(d)) +
            '</div>';
        html += '<h3 class="dt-sec-title">重要事件</h3><ul class="dt-events" style="--dt-region:' + region.color + '">';
        d.events.forEach(function (e) {
            html += '<li>' + e + '</li>';
        });
        html += '</ul>';
        html += '<p class="dt-note">' + d.note + '</p>';
        els.detail.innerHTML = html;
        els.detail.scrollTop = 0;
    }

    function cell(label, value) {
        return '<div class="dt-cell"><b>' + label + '</b><span>' + value + '</span></div>';
    }

    /* ---------- 选中与高亮 ---------- */

    function select(i, scroll) {
        if (i < 0) { i = 0; }
        if (i >= DYNASTIES.length) { i = DYNASTIES.length - 1; }
        state.sel = i;
        store.set('sel', i);

        var blocks = els.axis.children;
        var items = els.list.children;
        for (var k = 0; k < blocks.length; k++) {
            blocks[k].classList.toggle('is-on', k === i);
        }
        for (var m = 0; m < items.length; m++) {
            items[m].classList.toggle('is-on', m === i);
        }

        renderDetail();
        chrome.setStatus(DYNASTIES[i].name + ' · ' + spanText(DYNASTIES[i]), 'ok');

        if (scroll !== false) {
            var b = blocks[i];
            if (b) {
                var left = b.offsetLeft;
                if (left < els.scroll.scrollLeft || left + b.offsetWidth > els.scroll.scrollLeft + els.scroll.clientWidth) {
                    els.scroll.scrollLeft = Math.max(0, left - 60);
                }
            }
            var it = items[i];
            if (it && it.scrollIntoView) { it.scrollIntoView({ block: 'nearest' }); }
        }
    }

    /* ---------- 依次演进 ---------- */

    var playTimer = null;

    function playNext() {
        if (playTimer) { stopPlay(); return; }
        var i = state.sel;
        if (i >= DYNASTIES.length - 1) { i = -1; }
        playTimer = setInterval(function () {
            i++;
            if (i >= DYNASTIES.length) { stopPlay(); return; }
            select(i);
            try { chrome.beep('tick'); } catch (e) { /* 静默 */ }
        }, 900);
        select(i + 1);
        chrome.setStatus('依次演进中…（再按空格停止）', 'ok');
    }

    function stopPlay() {
        if (playTimer) { clearInterval(playTimer); playTimer = null; }
    }

    /* ---------- 模式切换 ---------- */

    function setMode(mode) {
        state.mode = mode;
        store.set('mode', mode);
        els.modeRatio.classList.toggle('is-on', mode === 'ratio');
        els.modeEven.classList.toggle('is-on', mode === 'even');
        layout();
        select(state.sel, false);
        chrome.toast(mode === 'ratio' ? '按年代比例排布' : '等宽排列');
    }

    els.modeRatio.addEventListener('click', function () { setMode('ratio'); });
    els.modeEven.addEventListener('click', function () { setMode('even'); });

    /* ---------- 朝代歌 ---------- */

    els.btnSong.addEventListener('click', function () {
        chrome.modal({
            title: '朝代顺序歌',
            icon: 'i-history',
            body: '<div class="dt-song">' + SONG + '</div>' +
                '<p class="dt-note" style="margin-top:14px">口诀用于记住朝代先后顺序，' +
                '具体年代仍以时间轴与详情卡为准。</p>',
            buttons: [{ label: '知道了', primary: true }]
        });
    });

    /* ---------- 键盘 ---------- */

    function isTypingTarget(node) {
        if (!node || !node.tagName) { return false; }
        var tag = node.tagName.toUpperCase();
        return tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT' || node.isContentEditable === true;
    }

    document.addEventListener('keydown', function (e) {
        if (isTypingTarget(e.target) || document.querySelector('.et-modal, .et-drawer-backdrop')) { return; }
        if (e.key === 'ArrowRight') {
            e.preventDefault();
            select(state.sel + 1);
            try { chrome.beep('tick'); } catch (err) { /* 静默 */ }
        } else if (e.key === 'ArrowLeft') {
            e.preventDefault();
            select(state.sel - 1);
            try { chrome.beep('tick'); } catch (err) { /* 静默 */ }
        } else if (e.code === 'Space') {
            e.preventDefault();
            playNext();
        } else if (e.key === 'Escape') {
            stopPlay();
        }
    });

    var resizeTimer = null;
    window.addEventListener('resize', function () {
        if (resizeTimer) { clearTimeout(resizeTimer); }
        resizeTimer = setTimeout(function () { layout(); select(state.sel, false); }, 120);
    });

    /* ---------- 启动 ---------- */

    els.spanNote.textContent = '公元前 2070 — 公元 1912 · ' + DYNASTIES.length + ' 个朝代 / 时期';
    buildBlocks();
    buildList();
    layout();
    select(state.sel, true);
})();
</script>

</body>
</html>
