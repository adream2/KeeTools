/* ============ 设计令牌 ============ */
:root {
    --et-accent: #2563eb;
    --et-accent-weak: rgba(37, 99, 235, .14);
    --et-bg: #f4f6fb;
    --et-surface: #ffffff;
    --et-surface-2: #f8fafc;
    --et-fg: #0b1220;
    --et-muted: #64748b;
    --et-line: rgba(15, 23, 42, .12);
    --et-line-strong: rgba(15, 23, 42, .22);
    --et-glass: rgba(255, 255, 255, .85);
    --et-shadow-md: 0 10px 28px -18px rgba(15, 23, 42, .3);
    --et-shadow-lg: 0 24px 60px -32px rgba(15, 23, 42, .4);
    --et-ok: #059669;
    --et-warn: #d97706;
    --et-err: #dc2626;
    --et-radius: 12px;
    --et-radius-sm: 9px;
    --et-font: -apple-system, BlinkMacSystemFont, "Segoe UI",
               "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei",
               "Noto Sans SC", sans-serif;
    --et-mono: ui-monospace, "Cascadia Mono", Consolas, Menlo, monospace;
}

html[data-et-theme="dark"] {
    --et-bg: #0b1120;
    --et-surface: #111a2e;
    --et-surface-2: #0f1729;
    --et-fg: #f1f5f9;
    --et-muted: #94a3b8;
    --et-line: rgba(148, 163, 184, .18);
    --et-line-strong: rgba(148, 163, 184, .3);
    --et-glass: rgba(17, 26, 46, .85);
    --et-shadow-md: 0 10px 34px -18px rgba(0, 0, 0, .8);
    --et-shadow-lg: 0 24px 70px -30px rgba(0, 0, 0, .9);
    --et-ok: #34d399;
    --et-warn: #fbbf24;
    --et-err: #f87171;
}

/* ============ 基础 ============ */

/* body 作为外壳时必须清掉浏览器默认 8px 外边距，
   否则 iframe 预览中文档会比视口高 16px（底部白边 + 多余滚动） */
body.et-app {
    margin: 0;
}

.et-app {
    position: relative;
    isolation: isolate;
    display: flex;
    flex-direction: column;
    height: 100vh;
    height: 100dvh;
    overflow: hidden;
    background: var(--et-bg);
    color: var(--et-fg);
    font-family: var(--et-font);
    -webkit-font-smoothing: antialiased;
    transition: background .25s, color .25s;
}

/* 极光背景：径向渐变 + 呼吸动画（edupick 品质基线，老内核也不掉帧） */
.et-app::before {
    content: '';
    position: fixed;
    inset: 0;
    z-index: -1;
    pointer-events: none;
    background:
        radial-gradient(46% 40% at 20% 18%, var(--et-accent-weak), transparent 65%),
        radial-gradient(42% 38% at 82% 24%, var(--et-accent-weak), transparent 70%),
        radial-gradient(50% 44% at 55% 95%, rgba(16, 185, 129, .10), transparent 65%);
    animation: et-aurora 16s ease-in-out infinite alternate;
}

@keyframes et-aurora {
    from { opacity: .55; transform: scale(1); }
    to { opacity: 1; transform: scale(1.06); }
}

.et-app *,
.et-app *::before,
.et-app *::after { box-sizing: border-box; }

[hidden] { display: none !important; }

.et-icon {
    width: 18px;
    height: 18px;
    fill: none;
    stroke: currentColor;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
    flex: none;
}

/* ============ 顶栏 ============ */
.et-topbar {
    flex: none;
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 11px 20px;
    border-bottom: 1px solid var(--et-line);
    background: var(--et-glass);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);

}

.et-brand {
    display: flex;
    align-items: center;
    gap: 10px;
    min-width: 0;
}

.et-brand__dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: var(--et-accent);
    box-shadow: 0 0 0 4px var(--et-accent-weak);

}

.et-brand__name {
    font-weight: 800;
    font-size: 15px;
    letter-spacing: -.01em;
    white-space: nowrap;
}

.et-brand__sub {
    font-size: 12.5px;
    color: var(--et-muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.et-status {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 5px 14px;
    border-radius: 999px;
    font-size: 12.5px;
    color: var(--et-muted);
    background: var(--et-surface-2);
    border: 1px solid var(--et-line);
    white-space: nowrap;
    max-width: 42vw;
    overflow: hidden;
    text-overflow: ellipsis;
}

.et-status__dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--et-ok);
    flex: none;
    transition: background .2s;
}

.et-status[data-tone="err"] .et-status__dot { background: var(--et-err); }
.et-status[data-tone="warn"] .et-status__dot { background: var(--et-warn); }

.et-actions {
    display: flex;
    align-items: center;
    gap: 7px;
}

.et-icon-btn {
    display: inline-grid;
    place-items: center;
    width: 38px;
    height: 38px;
    font-size: 16px;
    line-height: 1;
    border-radius: 11px;
    border: 1px solid var(--et-line);
    background: var(--et-surface-2);
    color: var(--et-fg);
    cursor: pointer;
    transition: transform .14s, border-color .14s, color .14s, opacity .14s;
    -webkit-tap-highlight-color: transparent;
}

.et-icon-btn:hover {
    border-color: var(--et-accent);
    color: var(--et-accent);
    transform: translateY(-1px);
}

.et-icon-btn:active { transform: translateY(0); }
.et-icon-btn.is-off { opacity: .4; }
.et-icon-btn:focus-visible { outline: 2px solid var(--et-accent); outline-offset: 2px; }

/* ============ 主区默认 ============ */
.et-main {
    flex: 1;
    min-height: 0;
    position: relative;
    overflow: auto;
}

/* ============ 页脚（品牌回流 L2） ============ */
.et-footer {
    flex: none;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 7px 16px;
    font-size: 12px;
    color: var(--et-muted);
    border-top: 1px solid var(--et-line);
    background: var(--et-glass);
    user-select: none;
    z-index: 20;
}

.et-footer a {
    color: inherit;
    text-decoration: none;
    transition: color .14s;
}

.et-footer a:hover { color: var(--et-accent); }

/* ============ 按钮 ============ */
.et-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
    padding: 9px 16px;
    border-radius: 11px;
    font: inherit;
    font-size: 13.5px;
    font-weight: 700;
    border: 1px solid var(--et-line);
    background: var(--et-surface-2);
    color: var(--et-fg);
    cursor: pointer;
    transition: transform .14s, border-color .14s, color .14s, background .14s, box-shadow .14s;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
}

.et-btn:hover {
    border-color: var(--et-accent);
    color: var(--et-accent);
    transform: translateY(-1px);
}

.et-btn:active { transform: translateY(0); }
.et-btn:focus-visible { outline: 2px solid var(--et-accent); outline-offset: 2px; }
.et-btn:disabled { opacity: .45; cursor: not-allowed; transform: none; }

.et-btn--primary {
    background: var(--et-accent);
    border-color: var(--et-accent);
    color: #fff;
    box-shadow: 0 6px 18px -8px var(--et-accent);
}

.et-btn--primary:hover { color: #fff; filter: brightness(1.08); }
.et-btn--primary:disabled { filter: none; }

.et-btn--danger:hover {
    border-color: var(--et-err);
    color: var(--et-err);
}

.et-btn--lg {
    padding: 13px 26px;
    font-size: 16px;
    border-radius: 14px;
}

/* ============ 弹窗 ============ */
.et-modal {
    position: fixed;
    inset: 0;
    z-index: 100;
    display: grid;
    place-items: center;
    padding: 24px;
    background: rgba(2, 6, 23, .55);
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    animation: et-fade .18s ease;
}

.et-modal__panel {
    width: min(680px, 94vw);
    max-height: 86vh;
    max-height: 86dvh;
    display: flex;
    flex-direction: column;
    background: var(--et-surface);
    border: 1px solid var(--et-line);
    border-radius: 16px;
    box-shadow: var(--et-shadow-lg);
    animation: et-pop .2s cubic-bezier(.34, 1.4, .64, 1);
    overflow: hidden;
}

.et-modal__panel--narrow { width: min(460px, 92vw); }
.et-modal__panel--wide { width: min(900px, 94vw); }

.et-modal__head {
    flex: none;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 16px 20px;
    border-bottom: 1px solid var(--et-line);
    font-weight: 800;
    font-size: 15px;
}

.et-modal__head .et-icon-btn {
    margin-left: auto;
    width: 32px;
    height: 32px;
}

.et-modal__body {
    flex: 1;
    min-height: 0;
    overflow: auto;
    padding: 18px 20px;
}

.et-modal__foot {
    flex: none;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 14px 20px;
    border-top: 1px solid var(--et-line);
    background: var(--et-surface-2);
}

.et-modal__foot .spacer { flex: 1; }

@keyframes et-fade {
    from { opacity: 0; }
}

@keyframes et-pop {
    from { opacity: 0; transform: translateY(14px) scale(.97); }
}

/* ============ 轻提示（toast） ============ */
.et-toast {
    position: fixed;
    left: 50%;
    bottom: 56px;
    transform: translateX(-50%) translateY(10px);
    z-index: 120;
    display: flex;
    align-items: center;
    gap: 9px;
    max-width: min(520px, 88vw);
    padding: 11px 18px;
    border-radius: 12px;
    font-size: 13.5px;
    font-weight: 600;
    color: #fff;
    background: rgba(15, 23, 42, .92);
    border: 1px solid rgba(148, 163, 184, .25);
    box-shadow: var(--et-shadow-lg);
    opacity: 0;
    pointer-events: none;
    transition: opacity .22s, transform .22s;
}

.et-toast.is-show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
}

.et-toast[data-tone="ok"] { background: rgba(5, 150, 105, .95); }
.et-toast[data-tone="err"] { background: rgba(220, 38, 38, .95); }
.et-toast[data-tone="warn"] { background: rgba(217, 119, 6, .95); }

/* ============ 设置抽屉（右上角入口，edupick 交互） ============ */
.et-drawer-backdrop {
    position: fixed;
    inset: 0;
    z-index: 90;
    background: rgba(2, 6, 23, .45);
    backdrop-filter: blur(3px);
    -webkit-backdrop-filter: blur(3px);
    opacity: 0;
    transition: opacity .2s;
}

.et-drawer-backdrop.is-open { opacity: 1; }

.et-drawer {

    top: 0;
    right: 0;
    height: 100%;
    width: min(400px, 92vw);
    display: flex;
    flex-direction: column;
    background: var(--et-surface);
    border-left: 1px solid var(--et-line);
    box-shadow: var(--et-shadow-lg);

.et-drawer-backdrop.is-open .et-drawer { transform: translateX(0); }

.et-drawer__head {

    padding: 15px 18px;

.et-drawer__body {

}

.et-drawer__row {

.et-drawer__tip {

.et-drawer__input {

}

.et-drawer__input:focus {

.et-drawer__switch {

    font-weight: 600;
    color: var(--et-fg);
    cursor: pointer;

}

.et-drawer__switch input {
    width: 17px;
    height: 17px;
    accent-color: var(--et-accent);
    cursor: pointer;
}

.ws-table tbody tr:last-child td { border-bottom: none; }

.ws-yes { color: var(--et-ok); font-weight: 700; }
.ws-no { color: var(--et-warn); font-weight: 700; }

/* 三态变化清单 */
.ws-cycle {
    display: flex;
    flex-direction: column;
    gap: 4px;
    font-size: 13px;
    line-height: 1.5;
}

.ws-cycle > span {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 4px 8px;
    border-radius: 8px;
    color: var(--et-muted);
    transition: background .16s, color .16s;
}

.ws-cycle > span b { color: var(--et-fg); font-weight: 800; }
.ws-cycle > span em {
    margin-left: auto;
    font-style: normal;
    font-size: 11.5px;
    white-space: nowrap;
}

.ws-cycle > span.is-on {
    background: var(--et-accent-weak);
    color: var(--et-accent);
}

.ws-cycle > span.is-on b { color: var(--et-accent); }

.ws-hint {
    flex: none;
    margin: 0;
    text-align: center;
    font-size: 12.5px;
    color: var(--et-muted);
}

@media (max-width: 880px) {
    .ws-body { flex-direction: column; }
    .ws-canvas-wrap { min-height: 260px; }
    .ws-info { max-width: none; }
    .ws-temp-val { width: 112px; }
}

    function makeIcon(id, cls) {
        var svg = document.createElementNS(NS_SVG, 'svg');
        svg.setAttribute('class', cls || 'et-icon');
        var use = document.createElementNS(NS_SVG, 'use');
        use.setAttribute('href', '#' + id);
        use.setAttributeNS(NS_XLINK, 'xlink:href', '#' + id);

    function makeBtn(icon, title, onClick) {
        var b = document.createElement('button');
        b.className = 'et-icon-btn';
        b.type = 'button';
        b.title = title;
        b.setAttribute('aria-label', title);
        b.appendChild(makeIcon(icon));
        if (onClick) { b.addEventListener('click', onClick); }
        return b;
    }

    function el(tag, cls, text) {
        var node = document.createElement(tag);
        if (cls) { node.className = cls; }
        if (text !== undefined && text !== null) { node.textContent = text; }
        return node;

    /* ---------- 音效（WebAudio，无音频文件，音量按教室大屏调校） ---------- */

    var audioCtx = null;

    function ensureCtx() {
        if (!audioCtx) {
            var AC = global.AudioContext || global.webkitAudioContext;
            if (!AC) { return null; }
            try { audioCtx = new AC(); } catch (err) { return null; }
        }
        if (audioCtx.state === 'suspended') {
            try { audioCtx.resume(); } catch (err) { /* 忽略 */ }
        }
        return audioCtx;
    }

    var MASTER_GAIN = 0.5; /* 整体音量层（教室设备音量 100% 也要听得清） */

    function tone(ctx, freq, start, dur, gainPeak, type) {
        var osc = ctx.createOscillator();
        var gain = ctx.createGain();
        osc.type = type || 'triangle';
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(0, start);
        gain.gain.linearRampToValueAtTime(gainPeak, start + 0.012);
        gain.gain.exponentialRampToValueAtTime(0.0001, start + dur);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(start);
        osc.stop(start + dur + 0.05);
    }

    var BEEPS = {
        tick: [[880, 0, 0.06, 0.42]],
        ok: [[660, 0, 0.1, 0.46], [880, 0.1, 0.14, 0.46]],
        win: [[523.25, 0, 0.16, 0.5], [659.25, 0.12, 0.16, 0.5], [783.99, 0.24, 0.16, 0.5], [1046.5, 0.36, 0.34, 0.52]],
        err: [[220, 0, 0.22, 0.46, 'square']],
        over: [[880, 0, 0.18, 0.5], [659.25, 0.2, 0.18, 0.5], [523.25, 0.4, 0.36, 0.5]]
    };

    function playBeep(kind) {
        var ctx = ensureCtx();
        if (!ctx || !BEEPS[kind]) { return; }
        var seq = BEEPS[kind];
        var t0 = ctx.currentTime + 0.01;
        for (var i = 0; i < seq.length; i++) {
            tone(ctx, seq[i][0], t0 + seq[i][1], seq[i][2], seq[i][3] * MASTER_GAIN, seq[i][4]);
        }

    /* ---------- 设置抽屉 ---------- */

    function openDrawer(title, build) {
        var backdrop = el('div', 'et-drawer-backdrop');
        var drawer = el('aside', 'et-drawer');
        drawer.setAttribute('role', 'dialog');
        drawer.setAttribute('aria-label', title);

        var head = el('div', 'et-drawer__head');
        head.appendChild(makeIcon('i-sliders'));
        head.appendChild(el('span', 'et-drawer__title', title));
        head.appendChild(makeBtn('i-x', '关闭', close));
        drawer.appendChild(head);

        var body = el('div', 'et-drawer__body');
        drawer.appendChild(body);

        backdrop.appendChild(drawer);
        document.body.appendChild(backdrop);
        requestAnimationFrame(function () { backdrop.classList.add('is-open'); });

        function close() {
            backdrop.classList.remove('is-open');
            document.removeEventListener('keydown', onKey);
            setTimeout(function () {
                if (backdrop.parentNode) { backdrop.parentNode.removeChild(backdrop); }
            }, 220);
        }
        function onKey(ev) {
            if (ev.key === 'Escape') { ev.stopPropagation(); close(); }
        }
        document.addEventListener('keydown', onKey);
        backdrop.addEventListener('mousedown', function (ev) {
            if (ev.target === backdrop) { close(); }
        });

        if (typeof build === 'function') {
            /* 兼容两种约定：build 自己往 body 里塞内容，或 return 一个元素节点 */
            var ret = build(body, { close: close });
            if (ret && ret.nodeType === 1 && ret.parentNode !== body) {
                body.appendChild(ret);
            }

        return { body: body, close: close };

    /* ---------- 通用弹窗 / toast（同时挂模块级，供其他共享组件使用） ---------- */

    function modal(mo) {
        var backdrop = el('div', 'et-modal');
        var panel = el('div', 'et-modal__panel' + (mo.size === 'narrow' ? ' et-modal__panel--narrow'
            : mo.size === 'wide' ? ' et-modal__panel--wide' : ''));
        var head = el('div', 'et-modal__head');
        if (mo.icon) { head.appendChild(makeIcon(mo.icon)); }
        head.appendChild(el('span', null, mo.title || ''));
        head.appendChild(makeBtn('i-x', '关闭', close));
        panel.appendChild(head);

        var body = el('div', 'et-modal__body');
        if (typeof mo.body === 'string') { body.innerHTML = mo.body; }
        else if (mo.body) { body.appendChild(mo.body); }
        panel.appendChild(body);

        var foot = null;
        if (mo.buttons && mo.buttons.length) {
            foot = el('div', 'et-modal__foot');
            foot.appendChild(el('span', 'spacer'));
            mo.buttons.forEach(function (b) {
                var btn = el('button', 'et-btn' + (b.primary ? ' et-btn--primary' : '') + (b.danger ? ' et-btn--danger' : ''), b.label);
                btn.type = 'button';
                btn.addEventListener('click', function () {
                    if (b.onClick) { b.onClick(close); } else { close(); }
                });
                foot.appendChild(btn);
            });
            panel.appendChild(foot);
        }

        backdrop.appendChild(panel);
        document.body.appendChild(backdrop);

        function close() {
            if (backdrop.parentNode) { backdrop.parentNode.removeChild(backdrop); }
            document.removeEventListener('keydown', onKey);
            if (mo.onClose) { mo.onClose(); }
        }
        function onKey(ev) {
            if (ev.key === 'Escape') { ev.stopPropagation(); close(); }
        }
        document.addEventListener('keydown', onKey);
        backdrop.addEventListener('mousedown', function (ev) {

        toastTimer = setTimeout(function () { toastEl.classList.remove('is-show'); }, 2200);

    /* ---------- PWA 元数据（blob manifest，环境不支持时静默跳过） ---------- */

    function installPwa(toolId, title, accent) {
        try {
            var theme = document.querySelector('meta[name="theme-color"]');
            if (!theme) {
                theme = document.createElement('meta');
                theme.setAttribute('name', 'theme-color');

            }
            theme.setAttribute('content', accent || '#2563eb');

            var svg = '<svg xmlns="' + NS_SVG + '" viewBox="0 0 64 64">' +
                '<rect width="64" height="64" rx="14" fill="' + (accent || '#2563eb') + '"/>' +
                '<text x="32" y="43" font-size="32" font-weight="800" font-family="sans-serif" ' +
                'fill="#fff" text-anchor="middle">' + (title || '课').charAt(0) + '</text></svg>';
            var iconUri = 'data:image/svg+xml,' + encodeURIComponent(svg);

            var mf = {
                name: title || 'KeeTools 课工具',
                short_name: title || '课工具',
                start_url: '.',
                display: 'standalone',
                background_color: '#f4f6fb',
                theme_color: accent || '#2563eb',
                icons: [{ src: iconUri, sizes: 'any', type: 'image/svg+xml', purpose: 'any' }]
            };
            var blob = new Blob([JSON.stringify(mf)], { type: 'application/manifest+json' });
            var link = document.createElement('link');
            link.rel = 'manifest';

    /* ---------- 挂载 ---------- */

    function mount(options) {

        var store = global.ET && global.ET.store
            ? global.ET.store(toolId)

        var api = { toolId: toolId, store: store };
        var soundEnabled = store.get('sound', true) !== false;

        /* 主题色 */

        installPwa(toolId, opt.title, opt.accent);

        function applyTheme(t) {

            store.set('theme', t);
            if (themeBtn) {

                themeBtn.appendChild(makeIcon(t === 'dark' ? 'i-sun' : 'i-moon'));
                themeBtn.title = t === 'dark' ? '切换到浅色' : '切换到深色';
            }
        }

        /* ---------- 顶栏 ---------- */
        var topbar = document.getElementById('et-topbar');
        var main = document.getElementById('et-main');
        var footer = document.getElementById('et-footer');

        if (!topbar) { topbar = el('header'); topbar.id = 'et-topbar'; document.body.insertBefore(topbar, document.body.firstChild); }
        if (!main) { main = el('main'); main.id = 'et-main'; topbar.after(main); }
        if (!footer) { footer = el('footer'); footer.id = 'et-footer'; document.body.appendChild(footer); }

        topbar.className = 'et-topbar';
        main.classList.add('et-main');
        footer.className = 'et-footer';

        /* 品牌 */
        var brand = el('div', 'et-brand');
        brand.appendChild(el('span', 'et-brand__dot'));
        var nameWrap = el('div');
        nameWrap.style.cssText = 'min-width:0;line-height:1.25';
        nameWrap.appendChild(el('div', 'et-brand__name', opt.title || '课工具'));
        if (opt.sub) { nameWrap.appendChild(el('div', 'et-brand__sub', opt.sub)); }
        brand.appendChild(nameWrap);
        topbar.appendChild(brand);

        /* 状态胶囊 */
        var statusPill = el('div', 'et-status');
        statusPill.hidden = true;
        statusPill.appendChild(el('span', 'et-status__dot'));
        var statusText = el('span', null, '');
        statusPill.appendChild(statusText);
        topbar.appendChild(statusPill);

        api.setStatus = function (text, tone) {
            if (!text) { statusPill.hidden = true; return; }
            statusText.textContent = text;
            statusPill.setAttribute('data-tone', tone || 'ok');
            statusPill.hidden = false;
        };
        if (opt.status) { api.setStatus(opt.status); }

        /* 动作区（edupick 交互：右上角聚合设置入口） */
        var actions = el('div', 'et-actions');

        var settingsBtn = null;
        if (opt.settings && typeof opt.settings.build === 'function') {
            settingsBtn = makeBtn('i-sliders', opt.settings.title || '设置', function () {
                openDrawer(opt.settings.title || '设置', function (body, drawerApi) {
                    return opt.settings.build(body, { api: api, close: drawerApi.close });
                });
            });
            actions.appendChild(settingsBtn);
        }

        (opt.actions || []).forEach(function (a) {
            var b = makeBtn(a.icon, a.label || '', a.onClick);
            if (a.id) { b.id = a.id; }

        });

        var soundBtn = null;
        if (opt.sound) {
            soundBtn = makeBtn(soundEnabled ? 'i-volume' : 'i-volume-off',
                soundEnabled ? '关闭音效' : '开启音效', toggleSound);
            if (!soundEnabled) { soundBtn.classList.add('is-off'); }

        if (opt.help) {
            actions.appendChild(makeBtn('i-help', '使用说明', function () { openHelp(); }));
        }

        var themeBtn = makeBtn('', '切换主题', function () {

        actions.appendChild(themeBtn);

        /* 全屏按钮始终保留：iframe 内对本工具文档 requestFullscreen

        var fsBtn = makeBtn('i-maximize', '全屏', toggleFullscreen);
        actions.appendChild(fsBtn);

        topbar.appendChild(actions);

        function toggleSound() {
            soundEnabled = !soundEnabled;
            store.set('sound', soundEnabled);
            soundBtn.innerHTML = '';
            soundBtn.appendChild(makeIcon(soundEnabled ? 'i-volume' : 'i-volume-off'));
            soundBtn.title = soundEnabled ? '关闭音效' : '开启音效';
            soundBtn.classList.toggle('is-off', !soundEnabled);
            if (soundEnabled) { api.beep('ok'); }
        }

        api.openSettings = function () {
            if (settingsBtn) { settingsBtn.click(); }
        };

        /* ---------- 全屏（iframe 内委托宿主，避免双层全屏） ---------- */

        function inIframe() {

        }

        function toggleFullscreen() {
            var root = document.documentElement;
            var fsEl = document.fullscreenElement || document.webkitFullscreenElement || null;

            } else {
                var req = root.requestFullscreen || root.webkitRequestFullscreen;
                if (req) { try { req.call(root); } catch (err) { /* 忽略 */ } }
            }
        }

        function syncFsIcon(on) {
            if (!fsBtn) { return; }
            fsBtn.innerHTML = '';
            fsBtn.appendChild(makeIcon(on ? 'i-minimize' : 'i-maximize'));
            fsBtn.title = on ? '退出全屏' : '全屏';
        }

        document.addEventListener('fullscreenchange', function () {
            syncFsIcon(!!(document.fullscreenElement || document.webkitFullscreenElement));
        });
        document.addEventListener('webkitfullscreenchange', function () {
            syncFsIcon(!!(document.fullscreenElement || document.webkitFullscreenElement));
        });
        syncFsIcon(false);

        api.toggleFullscreen = toggleFullscreen;

        /* ---------- 音效 API ---------- */
        api.beep = function (kind) {
            if (!soundEnabled) { return; }
            playBeep(kind);
        };
        api.soundOn = function () { return soundEnabled; };

        api.modal = modal;

        /* ---------- 帮助 ---------- */
        function openHelp() {
            modal({
                title: '使用说明',
                icon: 'i-help',
                size: 'narrow',
                body: opt.help,
                buttons: [{ label: '知道了', primary: true }]

        api.openHelp = openHelp;

        /* ---------- toast ---------- */
        api.toast = toast;

            ? global.ET_SITE_ORIGIN
            : null;

        function renderFooter() {
            footer.textContent = '';
            footer.appendChild(el('span', null, 'KeeTools 课工具'));
            footer.appendChild(el('span', null, '·'));
            if (siteOrigin) {
                var a = el('a', null, '更多课堂工具');
                a.href = siteOrigin + '/?from=tool-footer&tool=' + encodeURIComponent(toolId);
                a.target = '_blank';
                a.rel = 'noopener';
                footer.appendChild(a);
            } else {
                footer.appendChild(el('span', null, '更多课堂工具'));
            }
        }
        renderFooter();

        /* 站点来源发现：iframe 内向父窗口询问；也可由宿主直接注入 ET_SITE_ORIGIN */
        try {
            if (global.parent && global.parent !== global) {
                global.parent.postMessage(JSON.stringify({ type: 'et-hello', toolId: toolId }), '*');
            }
        } catch (err) { /* 跨域异常忽略 */ }

        global.addEventListener('message', function (ev) {
            var data = ev.data;
            if (typeof data === 'string') {
                try { data = JSON.parse(data); } catch (err) { return; }

            if (data.type === 'et-origin' && typeof data.origin === 'string' && /^https?:\/\//.test(data.origin)) {

                if (!global.ET_SITE_ORIGIN) { global.ET_SITE_ORIGIN = data.origin; }

                if (document.querySelector('.et-modal, .et-drawer-backdrop, .ws-winner')) { return; }
                ev.preventDefault();

                else if (typeof opt.secondary === 'function') { opt.secondary(); }

<script>
  /* 此块由 scripts/sync_shared.py 自动注入，请勿手工修改 */
/*!
 * et-stats.js — 使用统计模块（模块化，可整体移除）
 *
 * 共享逻辑源。改这里，然后跑：python scripts/sync_shared.py
 * 依赖：无（可脱离 et-util / et-chrome 独立运行）。
 * 全局：ET.Stats
 *
 * ┌────────────────────────────────────────────────────────────────┐
 * │ 说明：本模块只做一件事——工具被打开时向上报端点发一条匿名计数。 │
 * │ · 在线（iframe 内）：宿主页面已服务端计数，本模块不重复上报。   │
 * │ · 离线打开（file:// / 下载单文件 / 离线包）：联网条件具备时，   │
 * │   以 sendBeacon 上报 use_offline 事件（text/plain 免预检）。    │
 * │ · 上报端点 = window.ET_SITE_ORIGIN（由宿主注入或离线包配置）。  │
 * │   未配置端点时本模块完全静默，不发任何请求。                    │
 * │ · **整个 <script> 块可安全删除**：删除后工具其余功能完全正常，  │
 * │   且完全不再发起任何网络请求。                                  │
 * └────────────────────────────────────────────────────────────────┘
 */
(function (global) {
    'use strict';

    var ET = global.ET = global.ET || {};

    var Stats = {
        /** 上报端点来源（站点绝对地址，无协议尾斜杠） */
        endpoint: (typeof global.ET_SITE_ORIGIN === 'string' && /^https?:\/\//.test(global.ET_SITE_ORIGIN))
            ? global.ET_SITE_ORIGIN
            : null,

        _done: {},

        /**
         * 上报一次事件（同一事件同一工具每次页面加载只报一次）。
         * event: 'use_offline' 等；toolId: 工具 id。
         */
        send: function (event, toolId) {
            if (!event || this._done[event + ':' + (toolId || '')]) { return false; }
            if (!this.endpoint) { return false; }
            /* iframe 内由宿主统计，避免双计 */
            try {
                if (global.parent && global.parent !== global) { return false; }
            } catch (err) { return false; }
            /* 断网时挂起，网络恢复自动补报一次 */
            if (global.navigator && global.navigator.onLine === false) {
                var self = this;
                global.addEventListener('online', function () { self.send(event, toolId); }, { once: true });
                return false;
            }

            this._done[event + ':' + (toolId || '')] = true;
            var payload = JSON.stringify({ event: event, tool: toolId || '' });

            try {
                if (global.navigator.sendBeacon) {
                    return global.navigator.sendBeacon(
                        this.endpoint + '/api/track',
                        new Blob([payload], { type: 'text/plain;charset=UTF-8' })
                    );
                }
                global.fetch(this.endpoint + '/api/track', {
                    method: 'POST',
                    body: payload,
                    keepalive: true,
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'text/plain;charset=UTF-8' }
                });
                return true;
            } catch (err) {
                return false;
            }
        }
    };

    ET.Stats = Stats;
})(window);
</script>

    /* ============ 面板渲染 ============ */

    function buildCompareTable() {
        els.compareBody.innerHTML = '';
        COMPARE.forEach(function (row) {

            tr.setAttribute('data-t', row.t);

            tr.appendChild(th);
            row.cells.forEach(function (cell) {

                td.textContent = cell.text;

                tr.appendChild(td);
            });
            tr.addEventListener('click', function () {
                if (auto.on) { toggleAuto(); }
                setTemp(row.t);
                try { chrome.beep('tick'); } catch (err) { /* 静默 */ }
            });
            els.compareBody.appendChild(tr);
        });
        trs = ET.qsa('tr', els.compareBody);
    }

    function paintTrans(z) {
        var ongoing = ZONE_TRANS[z] || [];
        var items = els.cycleList.children;
        for (var i = 0; i < items.length; i++) {
            var key = items[i].getAttribute('data-k');
            var on = ongoing.indexOf(key) !== -1 || key === flashKey;
            items[i].classList.toggle('is-on', on);
        }
    }

    function setTransition(prev, z) {
        flashKey = FLASH_TRANS[prev + '>' + z] || null;
        if (transTimer) { clearTimeout(transTimer); transTimer = 0; }
        if (flashKey) {
            transTimer = setTimeout(function () {
                transTimer = 0;
                flashKey = null;
                paintTrans(zone);
            }, 3600);
        }
        paintTrans(z);
    }

    function applyInfo(z) {
        var info = ZONES[z];

        els.stateBadge.style.setProperty('--ws-state', info.color);
        els.stateTag.textContent = info.tag;
        els.stateTag.style.setProperty('--ws-state', info.color);
        els.stateTitle.textContent = info.title;
        els.stateDesc.innerHTML = info.desc;

        var act = ROW_ACTIVE[z] || [];
        for (var i = 0; i < trs.length; i++) {
            trs[i].classList.toggle('is-on', act.indexOf(trs[i].getAttribute('data-state')) !== -1);
        }
        paintTrans(z);
    }

    function buildPresets() {
        els.presets.innerHTML = '';
        PRESETS.forEach(function (item) {

            b.type = 'button';
            b.className = 'ws-preset';

            b.addEventListener('click', function () {

                setTemp(item.t);
                try { chrome.beep('tick'); } catch (err) { /* 静默 */ }
            });
            els.presets.appendChild(b);
        });
    }

    function syncPresets() {
        var list = els.presets.children;
        for (var i = 0; i < list.length; i++) {
            list[i].classList.toggle('is-on', parseInt(list[i].getAttribute('data-t'), 10) === state.t);
        }
    }

    /* ============ 温度 ============ */

    function setTemp(t, silent) {
        var old = state.t;
        var next = Math.max(-20, Math.min(130, Math.round(t)));
        state.t = next;
        els.slider.value = next;
        els.tempNum.textContent = next;
        store.set('t', next);
        syncPresets();

        var prev = zoneOf(old);
        var z = zoneOf(next);
        if (prev === z) { return; }

        zone = z;
        applyInfo(z);
        if (silent) { return; }

        try { chrome.beep('ok'); } catch (err) { /* 静默 */ }
        chrome.setStatus(ZONES[z].name, 'ok');
        setTransition(prev, z);

        var tip = TRANS_TIP[prev + '>' + z];
        if (tip) {
            try { chrome.toast(tip, z === 'melt' ? 'ok' : z === 'boil' ? 'warn' : ''); } catch (err) { /* 静默 */ }
        }
    }

    function heatUp() {
        if (auto.on) { toggleAuto(); }
        setTemp(state.t + 5);
    }

    function coolDown() {
        if (auto.on) { toggleAuto(); }
        setTemp(state.t - 5);
    }

    function toggleAuto() {
        auto.on = !auto.on;
        auto.acc = 0;
        els.autoBtn.classList.toggle('is-on', auto.on);
        els.autoLabel.textContent = auto.on ? '暂停演示' : '自动升温';
        if (auto.on) {
            if (state.t >= 130) { setTemp(-20); }
            chrome.setStatus('自动升温演示中…', 'warn');
        } else {
            chrome.setStatus(ZONES[zone].name, 'ok');
        }
    }

    function stepAuto(dt) {
        auto.acc += dt;
        while (auto.acc >= 0.16) {
            auto.acc -= 0.16;
            if (state.t >= 130) { toggleAuto(); return; }
            setTemp(state.t + 1);
        }
    }

    function isTypingTarget(node) {
        if (!node || !node.tagName) { return false; }
        var tag = node.tagName.toUpperCase();
        return tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT' || node.isContentEditable === true;
    }

    els.slider.addEventListener('input', function () {

    els.autoBtn.addEventListener('click', function () { toggleAuto(); });

    document.addEventListener('keydown', function (ev) {

    /* ---------- 画布场景 ----------

    var canvas = els.canvas;
    var ctx = (canvas && canvas.getContext) ? canvas.getContext('2d') : null;
    var CW = canvas ? canvas.width : 900;
    var CH = canvas ? canvas.height : 480;

    var BX0 = 296, BX1 = 624, BY0 = 106, BY1 = 408;    /* 烧杯外框 */
    var IX0 = 302, IX1 = 618, IY0 = 112, IY1 = 402;    /* 烧杯内腔 */
    var CX = (BX0 + BX1) / 2;

    var T_CX = 92, T_TOP = 138, T_BOT = 392, T_HALF = 7, T_BULB = 15;

    var LATTICE_MAX = 24, FREE_MAX = 34, MIST_MAX = 18;
    var TAU = Math.PI * 2;
    var FONT = '700 13px "Microsoft YaHei", "PingFang SC", system-ui, -apple-system, sans-serif';

    var PAL_LIGHT = {
        glass: 'rgba(100,116,139,.5)',

    function pal() {
        return document.documentElement.getAttribute('data-et-theme') === 'dark' ? PAL_DARK : PAL_LIGHT;
    }

    /* 各状态的目标形态（帧间缓动，切换时冰会"化"、水会"涨"） */
    var TARGETS = {
        solid: { iceH: 152, iceW: 196, waterDepth: 0, haze: 0, speed: 0.35, boil: 0, floatAmt: 0 },
        melt: { iceH: 84, iceW: 124, waterDepth: 108, haze: 0, speed: 0.8, boil: 0, floatAmt: 1 },
        liquid: { iceH: 0, iceW: 0, waterDepth: 168, haze: 0, speed: 1, boil: 0, floatAmt: 0 },
        boil: { iceH: 0, iceW: 0, waterDepth: 168, haze: 0.7, speed: 1.7, boil: 1, floatAmt: 0 },
        gas: { iceH: 0, iceW: 0, waterDepth: 0, haze: 1, speed: 2.6, boil: 0, floatAmt: 0 }
    };

    var cur = { iceH: 0, iceW: 0, waterDepth: 168, haze: 0, speed: 1, boil: 0, floatAmt: 0 };

    var lattice = [];   /* 冰晶格里的水分子（位置固定） */
    var free = [];      /* 水 / 水蒸气里自由运动的水分子 */
    var bubbles = [];
    var mists = [];
    var sprite = null;
    var spriteKey = null;

    function initParticles() {
        var i, a;
        lattice = [];
        for (i = 0; i < LATTICE_MAX; i++) {
            lattice.push({
                hx: CX, hy: IY1 - 70, px: CX, py: IY1 - 70,
                ang: 0.5, ph: Math.random() * TAU
            });
        }
        free = [];
        for (i = 0; i < FREE_MAX; i++) {
            a = Math.random() * TAU;
            free.push({
                /* 气态起手就散布在整个空间；液态时首帧会被水面包围盒约束住 */
                x: zone === 'gas'
                    ? 84 + Math.random() * (CW - 168)
                    : CX + (Math.random() - 0.5) * 240,
                y: zone === 'gas'
                    ? 54 + Math.random() * (CH - 150)
                    : IY1 - 40 - Math.random() * 120,
                vx: Math.cos(a), vy: Math.sin(a),
                ang: Math.random() * TAU,
                spin: (Math.random() - 0.5) * 0.05,
                ph: Math.random() * TAU
            });
        }
        bubbles = [];
        mists = [];
    }

    function easeAll(dt) {
        var tg = TARGETS[zone] || TARGETS.liquid;
        var k = 1 - Math.pow(0.0012, Math.min(dt, 0.1));
        for (var key in tg) {
            if (!Object.prototype.hasOwnProperty.call(tg, key)) { continue; }
            var d = tg[key] - cur[key];
            cur[key] = Math.abs(d) < 0.05 ? tg[key] : cur[key] + d * k;
        }
    }

    function surfaceY() { return IY1 - cur.waterDepth; }

    function iceRect() {
        var h = cur.iceH, w = cur.iceW;
        var sy = surfaceY();
        var bottom = IY1 - cur.floatAmt * Math.max(0, IY1 - sy - 0.7 * h);
        return { x: CX - w / 2, y: bottom - h, w: w, h: h };
    }

    function waveY(x, now, amp) {
        return surfaceY()
            + Math.sin(x * 0.022 + now * 1.7) * amp
            + Math.sin(x * 0.05 - now * 2.6) * amp * 0.42;
    }

    function roundRectPath(c, x, y, w, h, r) {
        var rr = Math.min(r, w / 2, h / 2);
        c.beginPath();
        c.moveTo(x + rr, y);
        c.arcTo(x + w, y, x + w, y + h, rr);
        c.arcTo(x + w, y + h, x, y + h, rr);
        c.arcTo(x, y + h, x, y, rr);
        c.arcTo(x, y, x + w, y, rr);
        c.closePath();
    }

    function clipInner(c) {
        c.beginPath();
        c.moveTo(IX0, IY0);
        c.lineTo(IX0, IY1 - 16);
        c.quadraticCurveTo(IX0, IY1, IX0 + 16, IY1);
        c.lineTo(IX1 - 16, IY1);
        c.quadraticCurveTo(IX1, IY1, IX1, IY1 - 16);
        c.lineTo(IX1, IY0);
        c.closePath();
        c.clip();
    }

    /* 一个水分子：1 个氧原子 + 2 个氢原子 */
    function drawMolecule(c, x, y, ang, r, p, alpha) {
        var d = r * 1.32;
        var ax = x + Math.cos(ang - 0.95) * d, ay = y + Math.sin(ang - 0.95) * d;
        var bx = x + Math.cos(ang + 0.95) * d, by = y + Math.sin(ang + 0.95) * d;
        c.globalAlpha = alpha;
        c.strokeStyle = p.atomEdge;
        c.lineWidth = 1;
        c.fillStyle = p.h;
        c.beginPath(); c.arc(ax, ay, r * 0.5, 0, TAU); c.fill(); c.stroke();
        c.beginPath(); c.arc(bx, by, r * 0.5, 0, TAU); c.fill(); c.stroke();
        c.beginPath(); c.arc(x, y, r, 0, TAU);
        c.fillStyle = p.o;
        c.fill();
        c.stroke();
        c.globalAlpha = 1;
    }

    /* ---------- 场景分层绘制 ---------- */

    function drawGround(p) {
        ctx.beginPath();
        ctx.ellipse(CX, 462, 152, 9, 0, 0, TAU);
        ctx.fillStyle = p.shadow;
        ctx.fill();
    }

    /* 加热火焰：只在 30 °C 以上出现，温度越高火越旺（火苗顶到杯底） */
    function drawHeat(p, now) {
        roundRectPath(ctx, CX - 118, 432, 236, 18, 9);
        ctx.fillStyle = p.burner;
        ctx.fill();

        var heat = Math.max(0, Math.min(1, (state.t - 30) / 95));
        if (heat <= 0.02) { return; }
        var hMax = 6 + heat * 20;
        for (var i = 0; i < 7; i++) {
            var fx = CX - 84 + i * 28;
            var flick = 0.78 + 0.16 * Math.sin(now * 7 + i * 1.9) + 0.1 * Math.sin(now * 13 + i * 0.7);
            var hh = hMax * flick;
            var g = ctx.createLinearGradient(0, 432, 0, 432 - hh);
            g.addColorStop(0, 'rgba(253,224,71,.95)');
            g.addColorStop(0.55, 'rgba(251,146,60,.85)');
            g.addColorStop(1, 'rgba(239,68,68,.12)');
            ctx.fillStyle = g;
            ctx.beginPath();
            ctx.moveTo(fx - 9, 432);
            ctx.quadraticCurveTo(fx - 11, 432 - hh * 0.6, fx, 432 - hh);
            ctx.quadraticCurveTo(fx + 11, 432 - hh * 0.6, fx + 9, 432);
            ctx.closePath();
            ctx.fill();
        }
    }

    /* 水体：形状随烧杯（这是"形状不固定、体积固定"的关键视觉） */
    function waterWavePath(now, amp) {
        ctx.beginPath();
        ctx.moveTo(IX0, waveY(IX0, now, amp));
        for (var x = IX0 + 6; x <= IX1; x += 6) { ctx.lineTo(x, waveY(x, now, amp)); }
    }

    function waterAmp() {
        return 1.3 + Math.min(3, Math.max(0, (state.t - 20) * 0.02)) + cur.boil * 4.5;
    }

    function drawWaterBody(p, now) {
        if (cur.waterDepth < 1) { return; }
        var amp = waterAmp();
        ctx.save();
        clipInner(ctx);
        waterWavePath(now, amp);
        ctx.lineTo(IX1, IY1);
        ctx.lineTo(IX0, IY1);
        ctx.closePath();
        var wg = ctx.createLinearGradient(0, surfaceY(), 0, IY1);
        wg.addColorStop(0, p.waterTop);
        wg.addColorStop(1, p.waterBottom);
        ctx.fillStyle = wg;
        ctx.fill();
        ctx.restore();

        /* 水面线 */
        waterWavePath(now, amp);
        ctx.strokeStyle = p.surface;
        ctx.lineWidth = 2.2;
        ctx.lineCap = 'round';
        ctx.stroke();
        ctx.lineCap = 'butt';
    }

    /* 沉在水下的部分隔水看会偏水色 */
    function drawSubmerged(p, now) {
        if (cur.waterDepth < 2 || cur.iceH < 2) { return; }
        ctx.save();
        clipInner(ctx);
        waterWavePath(now, waterAmp());
        ctx.lineTo(IX1, IY1);
        ctx.lineTo(IX0, IY1);
        ctx.closePath();
        ctx.fillStyle = p.overTint;
        ctx.fill();
        ctx.restore();
    }

    /* 冰晶块：轮廓固定不变（"形状固定"的关键视觉） */
    function drawIce(p, now) {
        var r = iceRect();
        if (cur.iceH < 4 || r.w < 6) { return; }

        var pts = [
            [r.x, r.y + r.h],
            [r.x, r.y + r.h * 0.32],
            [r.x + r.w * 0.24, r.y],
            [r.x + r.w * 0.76, r.y],
            [r.x + r.w, r.y + r.h * 0.32],
            [r.x + r.w, r.y + r.h]
        ];
        ctx.beginPath();
        ctx.moveTo(pts[0][0], pts[0][1]);
        for (var i = 1; i < pts.length; i++) { ctx.lineTo(pts[i][0], pts[i][1]); }
        ctx.closePath();
        var ig = ctx.createLinearGradient(0, r.y, 0, r.y + r.h);
        ig.addColorStop(0, p.iceTop);
        ig.addColorStop(1, p.iceBottom);
        ctx.fillStyle = ig;
        ctx.fill();
        ctx.strokeStyle = p.iceEdge;
        ctx.lineWidth = 2;
        ctx.lineJoin = 'round';
        ctx.stroke();

        /* 棱面 */
        ctx.strokeStyle = p.facet;
        ctx.lineWidth = 1.4;
        ctx.beginPath();
        ctx.moveTo(r.x + r.w * 0.24, r.y);
        ctx.lineTo(r.x + r.w * 0.5, r.y + r.h * 0.34);
        ctx.lineTo(r.x + r.w * 0.76, r.y);
        ctx.moveTo(r.x + r.w * 0.5, r.y + r.h * 0.34);
        ctx.lineTo(r.x + r.w * 0.5, r.y + r.h);
        ctx.stroke();

        /* 闪光（形状固定，只是闪） */
        ctx.strokeStyle = p.iceTop;
        ctx.lineWidth = 2;
        for (var s = 0; s < 3; s++) {
            var sx = r.x + r.w * (0.3 + s * 0.2);
            var sy = r.y + r.h * (0.24 + (s % 2) * 0.42);
            ctx.globalAlpha = 0.2 + 0.6 * (0.5 + 0.5 * Math.sin(now * 2.4 + s * 2.1));
            ctx.beginPath();
            ctx.moveTo(sx - 4, sy); ctx.lineTo(sx + 4, sy);
            ctx.moveTo(sx, sy - 4); ctx.lineTo(sx, sy + 4);
            ctx.stroke();
        }
        ctx.globalAlpha = 1;

        /* 晶格分子：原位振动，不流动 */
        var g = layoutLattice(r);
        var vib = 0.6 + Math.max(0, state.t + 20) * 0.07;
        var k, q;
        for (k = 0; k < g.n; k++) {
            q = lattice[k];
            q.px = q.hx + Math.sin(now * 3.4 + q.ph) * vib;
            q.py = q.hy + Math.cos(now * 3.0 + q.ph) * vib;
        }
        ctx.strokeStyle = p.bond;
        ctx.lineWidth = 2;
        ctx.beginPath();
        for (k = 0; k < g.n; k++) {
            var col = k % g.cols;
            var row = Math.floor(k / g.cols);
            if (col + 1 < g.cols && k + 1 < g.n) {
                ctx.moveTo(lattice[k].px, lattice[k].py);
                ctx.lineTo(lattice[k + 1].px, lattice[k + 1].py);
            }
            if (row + 1 < g.rows && k + g.cols < g.n) {
                ctx.moveTo(lattice[k].px, lattice[k].py);
                ctx.lineTo(lattice[k + g.cols].px, lattice[k + g.cols].py);
            }
        }
        ctx.stroke();
        for (k = 0; k < g.n; k++) {
            q = lattice[k];
            drawMolecule(ctx, q.px, q.py, q.ang, 6.6, p, 0.95);
        }
    }

    function layoutLattice(r) {
        var cols = Math.max(2, Math.min(5, Math.round(r.w / 40)));
        var rows = Math.max(1, Math.min(4, Math.round(r.h / 40)));
        var n = Math.min(cols * rows, lattice.length);
        var padX = r.w * 0.17;
        var padY = r.h * 0.2;
        var x0 = cols > 1 ? r.x + padX : r.x + r.w / 2;
        var y0 = rows > 1 ? r.y + padY : r.y + r.h / 2;
        var stepX = cols > 1 ? (r.w - padX * 2) / (cols - 1) : 0;
        var stepY = rows > 1 ? (r.h - padY * 2) / (rows - 1) : 0;
        var k = 0;
        for (var row = 0; row < rows; row++) {
            for (var col = 0; col < cols; col++) {
                if (k >= n) { break; }
                lattice[k].hx = x0 + col * stepX;
                lattice[k].hy = y0 + row * stepY;
                lattice[k].ang = row % 2 ? 0.32 : 0.62;   /* 朝向也是固定的 */
                k++;
            }
        }
        return { n: n, cols: cols, rows: rows };
    }

    /* 自由分子：液态被水面和杯壁约束；气态带拖尾飞散、跑出杯口 */
    function drawFreePart(p, now, dt) {
        /* 既没有水也没有蒸汽（固态）时，自由分子应当已"结"进晶格，全部隐去 */
        var life = Math.max(cur.waterDepth / 70, cur.haze);
        if (life > 1) { life = 1; }
        if (life < 0.02) { return; }
        var liquidMode = cur.waterDepth > 8 && cur.haze < 0.8;
        var k = dt * 60;
        var m;
        for (var i = 0; i < free.length; i++) {
            var q = free[i];
            if (liquidMode) {
                var spd = 0.35 + 0.8 * cur.speed;
                q.vx += (Math.random() - 0.5) * 0.24;
                q.vy += (Math.random() - 0.5) * 0.24;
                if (cur.boil > 0.2) { q.vy -= 0.12 * cur.boil; }
                m = Math.sqrt(q.vx * q.vx + q.vy * q.vy) || 1;
                q.vx = q.vx / m * spd;
                q.vy = q.vy / m * spd;
                q.x += q.vx * k;
                q.y += q.vy * k;
                var left = IX0 + 15, right = IX1 - 15;
                var top = Math.max(surfaceY() + 13, IY0 + 16), bottom = IY1 - 15;
                if (q.x < left) { q.x = left; q.vx = Math.abs(q.vx); }
                if (q.x > right) { q.x = right; q.vx = -Math.abs(q.vx); }
                if (q.y < top) { q.y = top; q.vy = Math.abs(q.vy); }
                if (q.y > bottom) { q.y = bottom; q.vy = -Math.abs(q.vy); }
                q.ang += 0.03 + q.spin;
                drawMolecule(ctx, q.x, q.y, q.ang, 7, p, 0.92 * life);
            } else {
                var spd2 = 1 + cur.speed * 1.35;
                m = Math.sqrt(q.vx * q.vx + q.vy * q.vy) || 1;
                q.vx = q.vx / m * spd2;
                q.vy = q.vy / m * spd2;
                q.x += q.vx * k;
                q.y += q.vy * k;
                if (q.x < 70) { q.x = 70; q.vx = Math.abs(q.vx); }
                if (q.x > CW - 70) { q.x = CW - 70; q.vx = -Math.abs(q.vx); }
                if (q.y < 42) { q.y = 42; q.vy = Math.abs(q.vy); }
                if (q.y > CH - 46) { q.y = CH - 46; q.vy = -Math.abs(q.vy); }
                q.ang += 0.07 + q.spin;
                ctx.globalAlpha = life;
                ctx.strokeStyle = p.trail;
                ctx.lineWidth = 2;
                ctx.lineCap = 'round';
                ctx.beginPath();
                ctx.moveTo(q.x - q.vx * 5, q.y - q.vy * 5);
                ctx.lineTo(q.x, q.y);
                ctx.stroke();
                ctx.lineCap = 'butt';
                ctx.globalAlpha = 1;
                drawMolecule(ctx, q.x, q.y, q.ang, 6.2, p, 0.9 * life);
            }
        }
    }

    /* 沸腾气泡 */
    function drawBubbles(p, now, dt) {
        if (cur.boil < 0.1) { bubbles.length = 0; return; }
        if (cur.boil > 0.25 && bubbles.length < 24 && Math.random() < cur.boil * 0.6) {
            bubbles.push({
                x: IX0 + 26 + Math.random() * (IX1 - IX0 - 52),
                y: IY1 - 14,
                r: 2.4 + Math.random() * 3.4,
                v: 0.7 + Math.random() * 1.2,
                ph: Math.random() * TAU
            });
        }
        if (!bubbles.length) { return; }
        var sy = surfaceY();
        ctx.save();
        clipInner(ctx);
        for (var i = bubbles.length - 1; i >= 0; i--) {
            var b = bubbles[i];
            b.y -= b.v * (0.7 + cur.boil * 1.1) * dt * 60;
            b.x += Math.sin(now * 3 + b.ph) * 0.7;
            if (b.y < sy + 6) { bubbles.splice(i, 1); continue; }
            ctx.beginPath();
            ctx.arc(b.x, b.y, b.r, 0, TAU);
            ctx.fillStyle = p.bubble;
            ctx.fill();
            ctx.strokeStyle = p.surface;
            ctx.lineWidth = 1.2;
            ctx.stroke();
        }
        ctx.restore();
    }

    /* 蒸汽 / 水蒸气（预渲染软团，避免每帧建渐变） */
    function mistSprite(p) {
        if (sprite && spriteKey === p.mistRgb) { return sprite; }
        var c = document.createElement('canvas');
        c.width = 128;
        c.height = 128;
        var c2 = c.getContext('2d');
        var g = c2.createRadialGradient(64, 64, 0, 64, 64, 64);
        g.addColorStop(0, 'rgba(' + p.mistRgb + ',.5)');
        g.addColorStop(0.5, 'rgba(' + p.mistRgb + ',.22)');
        g.addColorStop(1, 'rgba(' + p.mistRgb + ',0)');
        c2.fillStyle = g;
        c2.fillRect(0, 0, 128, 128);
        sprite = c;
        spriteKey = p.mistRgb;
        return c;
    }

    function drawMist(p, now, dt) {
        if (cur.haze < 0.04) { mists.length = 0; return; }
        var wide = cur.haze > 0.75;
        var want = Math.round(MIST_MAX * cur.haze);
        while (mists.length < want) {
            mists.push({
                x: wide ? BX0 - 70 + Math.random() * (BX1 - BX0 + 140)
                    : IX0 + 24 + Math.random() * (IX1 - IX0 - 48),
                y: wide ? 46 + Math.random() * (IY1 - 56) : surfaceY() - Math.random() * 46,
                r: 18 + Math.random() * 26,
                v: 0.25 + Math.random() * 0.5,
                ph: Math.random() * TAU,
                a: 0.2 + Math.random() * 0.3
            });
        }
        while (mists.length > want) { mists.pop(); }
        var img = mistSprite(p);
        for (var i = 0; i < mists.length; i++) {
            var m = mists[i];
            m.y -= m.v * dt * 60 * (0.6 + cur.haze * 0.8);
            m.x += Math.sin(now * 0.8 + m.ph) * 0.4;
            if (m.y < 44) {
                m.y = wide ? 44 + Math.random() * 24 : IY1 - 20 - Math.random() * 30;
                m.x = wide ? BX0 - 70 + Math.random() * (BX1 - BX0 + 140)
                    : IX0 + 24 + Math.random() * (IX1 - IX0 - 48);
            }
            ctx.globalAlpha = m.a * Math.min(1, cur.haze * 0.7);
            ctx.drawImage(img, m.x - m.r, m.y - m.r, m.r * 2, m.r * 2);
        }
        ctx.globalAlpha = 1;
    }

    /* 烧杯（画在内容之上，形成"隔着玻璃"的观感） */
    function drawGlass(p) {
        ctx.lineJoin = 'round';
        ctx.strokeStyle = p.glass;
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(BX0, BY0);
        ctx.lineTo(BX0, BY1 - 18);
        ctx.quadraticCurveTo(BX0, BY1, BX0 + 18, BY1);
        ctx.lineTo(BX1 - 18, BY1);
        ctx.quadraticCurveTo(BX1, BY1, BX1, BY1 - 18);
        ctx.lineTo(BX1, BY0);
        ctx.stroke();

        /* 杯口 */
        ctx.beginPath();
        ctx.moveTo(BX0 - 6, BY0);
        ctx.lineTo(BX1 + 6, BY0);
        ctx.stroke();

        /* 刻度线 */
        ctx.strokeStyle = p.tickSoft;
        ctx.lineWidth = 2;
        ctx.beginPath();
        for (var i = 1; i <= 3; i++) {
            var y = IY1 - (IY1 - IY0) * i / 4;
            ctx.moveTo(IX1 - 30, y);
            ctx.lineTo(IX1 - 8, y);
        }
        ctx.stroke();

        /* 玻璃高光 */
        ctx.strokeStyle = p.glassHi;
        ctx.lineWidth = 4;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(BX0 + 13, BY1 - 40);
        ctx.lineTo(BX0 + 13, BY0 + 46);
        ctx.stroke();
        ctx.lineCap = 'butt';
    }

    /* 温度计：0 °C / 100 °C 有刻度线，液柱颜色随温度由蓝转红 */
    /* 温度 → 颜色：与滑杆渐变同源（冰蓝 → 水蓝 → 琥珀 → 橙 → 红） */
    var T_STOPS = [
        [0, [191, 219, 254]], [0.08, [147, 197, 253]], [0.133, [125, 211, 252]],
        [0.4, [56, 189, 248]], [0.68, [251, 191, 36]], [0.8, [249, 115, 22]],
        [1, [239, 68, 68]]
    ];

    function tColor(t) {
        var v = Math.max(0, Math.min(1, (t + 20) / 150));
        for (var i = 1; i < T_STOPS.length; i++) {
            if (v <= T_STOPS[i][0]) {
                var a = T_STOPS[i - 1], b = T_STOPS[i];
                var k = (v - a[0]) / ((b[0] - a[0]) || 1);
                return 'rgb(' +
                    Math.round(a[1][0] + (b[1][0] - a[1][0]) * k) + ',' +
                    Math.round(a[1][1] + (b[1][1] - a[1][1]) * k) + ',' +
                    Math.round(a[1][2] + (b[1][2] - a[1][2]) * k) + ')';
            }
        }
        return 'rgb(239,68,68)';
    }

    function drawTick(val, color, label) {
        var y = T_BOT - ((val + 20) / 150) * (T_BOT - T_TOP);
        ctx.strokeStyle = color;
        ctx.lineWidth = 2.5;
        ctx.beginPath();
        ctx.moveTo(T_CX + T_HALF, y);
        ctx.lineTo(T_CX + T_HALF + 12, y);
        ctx.stroke();
        ctx.fillStyle = color;
        ctx.fillText(label, T_CX + T_HALF + 16, y);
    }

    function drawThermo(p) {
        var v = Math.max(0, Math.min(1, (state.t + 20) / 150));
        var colTop = T_BOT - v * (T_BOT - T_TOP);
        var col = tColor(state.t);

        roundRectPath(ctx, T_CX - T_HALF, T_TOP, T_HALF * 2, T_BOT - T_TOP + 2, T_HALF);
        ctx.fillStyle = p.tube;
        ctx.fill();
        ctx.strokeStyle = p.tubeLine;
        ctx.lineWidth = 2;
        ctx.stroke();

        /* 液柱 */
        ctx.save();
        roundRectPath(ctx, T_CX - T_HALF, T_TOP, T_HALF * 2, T_BOT - T_TOP + 2, T_HALF);
        ctx.clip();
        ctx.fillStyle = col;
        ctx.fillRect(T_CX - T_HALF, colTop, T_HALF * 2, T_BOT - colTop + 4);
        ctx.restore();

        /* 球泡 */
        ctx.beginPath();
        ctx.arc(T_CX, T_BOT, T_BULB, 0, TAU);
        ctx.fillStyle = col;
        ctx.fill();
        ctx.strokeStyle = p.tubeLine;
        ctx.lineWidth = 2;
        ctx.stroke();

        ctx.font = '700 12px "Microsoft YaHei", system-ui, sans-serif';
        ctx.textAlign = 'left';
        ctx.textBaseline = 'middle';
        drawTick(0, '#0ea5e9', '0 °C');
        drawTick(100, '#f97316', '100 °C');
    }

    /* 场景内标签 */
    function pill(x, y, text, p, color) {
        ctx.font = FONT;
        ctx.textAlign = 'left';
        ctx.textBaseline = 'middle';
        var w = ctx.measureText(text).width + 22;
        roundRectPath(ctx, x, y - 13, w, 26, 13);
        ctx.fillStyle = p.labelBg;
        ctx.fill();
        ctx.strokeStyle = color || p.labelLine;
        ctx.lineWidth = 1.5;
        ctx.stroke();
        ctx.fillStyle = color || p.labelFg;
        ctx.fillText(text, x + 11, y + 1);
    }

    function drawLabels(p) {
        var x = 646;
        if (zone === 'solid') {
            pill(x, 214, '分子排列整齐', p);
            pill(x, 250, '形状、体积都固定', p, '#3b82f6');
        } else if (zone === 'melt') {
            pill(x, 200, '冰在熔化，水在凝固', p);
            pill(x, 236, '温度停在 0 °C', p, '#0ea5e9');
        } else if (zone === 'liquid') {
            pill(x, surfaceY() - 20, '水面：随容器变形', p);
            pill(x, surfaceY() + 18, '形状不固定 · 体积固定', p, '#0284c7');
        } else if (zone === 'boil') {
            pill(x, surfaceY() - 46, '内部和表面同时汽化', p);
            pill(x, surfaceY() - 10, '温度停在 100 °C', p, '#f97316');
        } else {
            pill(x, 176, '分子四处飞散', p);
            pill(x, 212, '充满整个空间', p, '#8b5cf6');
            pill(x, 248, '形状、体积都不固定', p, '#8b5cf6');
        }
    }

    function drawAll(ts, dt) {
        var p = pal();
        var now = ts / 1000;
        easeAll(dt);
        ctx.clearRect(0, 0, CW, CH);
        drawGround(p);
        drawHeat(p, now);
        drawWaterBody(p, now);
        drawIce(p, now);
        drawSubmerged(p, now);
        drawFreePart(p, now, dt);
        drawBubbles(p, now, dt);
        drawMist(p, now, dt);
        drawGlass(p);
        drawThermo(p);
        drawLabels(p);
    }

    /* ---------- 启动（Canvas 能力检测：缺失时降级为文字说明） ---------- */

    var saved = Number(store.get('t', 25));
    if (!isFinite(saved)) { saved = 25; }
    state.t = Math.max(-20, Math.min(130, Math.round(saved)));
    zone = zoneOf(state.t);

    buildCompareTable();
    buildPresets();
    els.slider.value = state.t;
    els.tempNum.textContent = state.t;
    applyInfo(zone);
    syncPresets();

    if (!ctx) {
        if (canvas) { canvas.style.display = 'none'; }
        els.stateDesc.innerHTML = '当前浏览器不支持 Canvas 绘制，仅保留温度控制与文字说明。';
    } else {
        initParticles();
        var startTarget = TARGETS[zone];
        for (var startKey in startTarget) {
            if (Object.prototype.hasOwnProperty.call(startTarget, startKey)) {
                cur[startKey] = startTarget[startKey];
            }
        }
        var lastTs = 0;
        var frame = function (ts) {
            var dt = lastTs ? Math.min(0.05, (ts - lastTs) / 1000) : 0.016;
            lastTs = ts;
            if (auto.on) { stepAuto(dt); }
            drawAll(ts, dt);
            requestAnimationFrame(frame);
        };
        requestAnimationFrame(frame);
    }
})();
</script>

</body>
