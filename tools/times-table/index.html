<style>
  /* 此块由 scripts/sync_shared.py 自动注入，请勿手工修改 */
/*!
 * et-chrome.css — 工具通用外壳样式（顶栏 / 页脚 / 弹窗 / 按钮 / 主题）
 *
 * 共享样式源。改这里，然后跑：python scripts/sync_shared.py
 * 所有类名带 et- 前缀，避免与工具自身样式冲突。
 * 依赖：无外部资源；颜色全部为令牌变量。
 */

/* ============ 设计令牌 ============ */
:root {
    --et-accent: #2563eb;
    --et-accent-weak: rgba(37, 99, 235, .14);
    --et-bg: #f4f6fb;
    --et-surface: #ffffff;
    --et-surface-2: #f8fafc;
    --et-fg: #0b1220;
    --et-muted: #64748b;
    --et-line: rgba(15, 23, 42, .12);
    --et-line-strong: rgba(15, 23, 42, .22);
    --et-glass: rgba(255, 255, 255, .85);
    --et-shadow-md: 0 10px 28px -18px rgba(15, 23, 42, .3);
    --et-shadow-lg: 0 24px 60px -32px rgba(15, 23, 42, .4);
    --et-ok: #059669;
    --et-warn: #d97706;
    --et-err: #dc2626;
    --et-radius: 12px;
    --et-radius-sm: 9px;
    --et-font: -apple-system, BlinkMacSystemFont, "Segoe UI",
               "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei",
               "Noto Sans SC", sans-serif;
    --et-mono: ui-monospace, "Cascadia Mono", Consolas, Menlo, monospace;
}

html[data-et-theme="dark"] {
    --et-bg: #0b1120;
    --et-surface: #111a2e;
    --et-surface-2: #0f1729;
    --et-fg: #f1f5f9;
    --et-muted: #94a3b8;
    --et-line: rgba(148, 163, 184, .18);
    --et-line-strong: rgba(148, 163, 184, .3);
    --et-glass: rgba(17, 26, 46, .85);
    --et-shadow-md: 0 10px 34px -18px rgba(0, 0, 0, .8);
    --et-shadow-lg: 0 24px 70px -30px rgba(0, 0, 0, .9);
    --et-ok: #34d399;
    --et-warn: #fbbf24;
    --et-err: #f87171;
}

/* ============ 基础 ============ */

/* body 作为外壳时必须清掉浏览器默认 8px 外边距，
   否则 iframe 预览中文档会比视口高 16px（底部白边 + 多余滚动） */
body.et-app {
    margin: 0;
}

.et-app {
    position: relative;
    isolation: isolate;
    display: flex;
    flex-direction: column;
    height: 100vh;
    height: 100dvh;
    overflow: hidden;
    background: var(--et-bg);
    color: var(--et-fg);
    font-family: var(--et-font);
    -webkit-font-smoothing: antialiased;
    transition: background .25s, color .25s;
}

/* 极光背景：径向渐变 + 呼吸动画（edupick 品质基线，老内核也不掉帧） */
.et-app::before {
    content: '';
    position: fixed;
    inset: 0;
    z-index: -1;
    pointer-events: none;
    background:
        radial-gradient(46% 40% at 20% 18%, var(--et-accent-weak), transparent 65%),
        radial-gradient(42% 38% at 82% 24%, var(--et-accent-weak), transparent 70%),
        radial-gradient(50% 44% at 55% 95%, rgba(16, 185, 129, .10), transparent 65%);
    animation: et-aurora 16s ease-in-out infinite alternate;
}

@keyframes et-aurora {
    from { opacity: .55; transform: scale(1); }
    to { opacity: 1; transform: scale(1.06); }
}

.et-app *,
.et-app *::before,
.et-app *::after { box-sizing: border-box; }

[hidden] { display: none !important; }

.et-icon {
    width: 18px;
    height: 18px;
    fill: none;
    stroke: currentColor;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
    flex: none;
}

/* ============ 顶栏 ============ */
.et-topbar {
    flex: none;
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 11px 20px;
    border-bottom: 1px solid var(--et-line);
    background: var(--et-glass);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    z-index: 20;
}

.et-brand {
    display: flex;
    align-items: center;
    gap: 10px;
    min-width: 0;
}

.et-brand__dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: var(--et-accent);
    box-shadow: 0 0 0 4px var(--et-accent-weak);
    flex: none;
}

.et-brand__name {
    font-weight: 800;
    font-size: 15px;
    letter-spacing: -.01em;
    white-space: nowrap;
}

.et-brand__sub {
    font-size: 12.5px;
    color: var(--et-muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.et-status {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 5px 14px;
    border-radius: 999px;
    font-size: 12.5px;
    color: var(--et-muted);
    background: var(--et-surface-2);
    border: 1px solid var(--et-line);
    white-space: nowrap;
    max-width: 42vw;
    overflow: hidden;
    text-overflow: ellipsis;
}

.et-status__dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--et-ok);
    flex: none;
    transition: background .2s;
}

.et-status[data-tone="err"] .et-status__dot { background: var(--et-err); }
.et-status[data-tone="warn"] .et-status__dot { background: var(--et-warn); }

.et-actions {
    display: flex;
    align-items: center;
    gap: 7px;
}

.et-icon-btn {
    display: inline-grid;
    place-items: center;
    width: 38px;
    height: 38px;
    font-size: 16px;
    line-height: 1;
    border-radius: 11px;
    border: 1px solid var(--et-line);
    background: var(--et-surface-2);
    color: var(--et-fg);
    cursor: pointer;
    transition: transform .14s, border-color .14s, color .14s, opacity .14s;
    -webkit-tap-highlight-color: transparent;
}

.et-icon-btn:hover {
    border-color: var(--et-accent);
    color: var(--et-accent);
    transform: translateY(-1px);
}

.et-icon-btn:active { transform: translateY(0); }
.et-icon-btn.is-off { opacity: .4; }
.et-icon-btn:focus-visible { outline: 2px solid var(--et-accent); outline-offset: 2px; }

/* ============ 主区默认 ============ */
.et-main {
    flex: 1;
    min-height: 0;
    position: relative;
    overflow: auto;
}

/* ============ 页脚（品牌回流 L2） ============ */
.et-footer {
    flex: none;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 7px 16px;
    font-size: 12px;
    color: var(--et-muted);
    border-top: 1px solid var(--et-line);
    background: var(--et-glass);
    user-select: none;
    z-index: 20;
}

.et-footer a {
    color: inherit;
    text-decoration: none;
    transition: color .14s;
}

.et-footer a:hover { color: var(--et-accent); }

/* ============ 按钮 ============ */
.et-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
    padding: 9px 16px;
    border-radius: 11px;
    font: inherit;
    font-size: 13.5px;
    font-weight: 700;
    border: 1px solid var(--et-line);
    background: var(--et-surface-2);
    color: var(--et-fg);
    cursor: pointer;
    transition: transform .14s, border-color .14s, color .14s, background .14s, box-shadow .14s;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
}

.et-btn:hover {
    border-color: var(--et-accent);
    color: var(--et-accent);
    transform: translateY(-1px);
}

.et-btn:active { transform: translateY(0); }
.et-btn:focus-visible { outline: 2px solid var(--et-accent); outline-offset: 2px; }
.et-btn:disabled { opacity: .45; cursor: not-allowed; transform: none; }

.et-btn--primary {
    background: var(--et-accent);
    border-color: var(--et-accent);
    color: #fff;
    box-shadow: 0 6px 18px -8px var(--et-accent);
}

.et-btn--primary:hover { color: #fff; filter: brightness(1.08); }
.et-btn--primary:disabled { filter: none; }

.et-btn--danger:hover {
    border-color: var(--et-err);
    color: var(--et-err);
}

.et-btn--lg {
    padding: 13px 26px;
    font-size: 16px;
    border-radius: 14px;
}

/* ============ 弹窗 ============ */
.et-modal {
    position: fixed;
    inset: 0;
    z-index: 100;
    display: grid;
    place-items: center;
    padding: 24px;
    background: rgba(2, 6, 23, .55);
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    animation: et-fade .18s ease;
}

.et-modal__panel {
    width: min(680px, 94vw);
    max-height: 86vh;
    max-height: 86dvh;
    display: flex;
    flex-direction: column;
    background: var(--et-surface);
    border: 1px solid var(--et-line);
    border-radius: 16px;
    box-shadow: var(--et-shadow-lg);
    animation: et-pop .2s cubic-bezier(.34, 1.4, .64, 1);
    overflow: hidden;
}

.et-modal__panel--narrow { width: min(460px, 92vw); }
.et-modal__panel--wide { width: min(900px, 94vw); }

.et-modal__head {
    flex: none;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 16px 20px;
    border-bottom: 1px solid var(--et-line);
    font-weight: 800;
    font-size: 15px;
}

.et-modal__head .et-icon-btn {
    margin-left: auto;
    width: 32px;
    height: 32px;
}

.et-modal__body {
    flex: 1;
    min-height: 0;
    overflow: auto;
    padding: 18px 20px;
}

.et-modal__foot {
    flex: none;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 14px 20px;
    border-top: 1px solid var(--et-line);
    background: var(--et-surface-2);
}

.et-modal__foot .spacer { flex: 1; }

@keyframes et-fade {
    from { opacity: 0; }
}

@keyframes et-pop {
    from { opacity: 0; transform: translateY(14px) scale(.97); }
}

/* ============ 轻提示（toast） ============ */
.et-toast {
    position: fixed;
    left: 50%;
    bottom: 56px;
    transform: translateX(-50%) translateY(10px);
    z-index: 120;
    display: flex;
    align-items: center;
    gap: 9px;
    max-width: min(520px, 88vw);
    padding: 11px 18px;
    border-radius: 12px;
    font-size: 13.5px;
    font-weight: 600;
    color: #fff;
    background: rgba(15, 23, 42, .92);
    border: 1px solid rgba(148, 163, 184, .25);
    box-shadow: var(--et-shadow-lg);
    opacity: 0;
    pointer-events: none;
    transition: opacity .22s, transform .22s;
}

.et-toast.is-show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
}

.et-toast[data-tone="ok"] { background: rgba(5, 150, 105, .95); }
.et-toast[data-tone="err"] { background: rgba(220, 38, 38, .95); }
.et-toast[data-tone="warn"] { background: rgba(217, 119, 6, .95); }

/* ============ 设置抽屉（右上角入口，edupick 交互） ============ */
.et-drawer-backdrop {
    position: fixed;
    inset: 0;
    z-index: 90;
    background: rgba(2, 6, 23, .45);
    backdrop-filter: blur(3px);
    -webkit-backdrop-filter: blur(3px);
    opacity: 0;
    transition: opacity .2s;
}

.et-drawer-backdrop.is-open { opacity: 1; }

.et-drawer {
    position: absolute;
    top: 0;
    right: 0;
    height: 100%;
    width: min(400px, 92vw);
    display: flex;
    flex-direction: column;
    background: var(--et-surface);
    border-left: 1px solid var(--et-line);
    box-shadow: var(--et-shadow-lg);
    transform: translateX(100%);
    transition: transform .22s cubic-bezier(.32, .72, .35, 1);
}

.et-drawer-backdrop.is-open .et-drawer { transform: translateX(0); }

.et-drawer__head {
    flex: none;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 15px 18px;
    border-bottom: 1px solid var(--et-line);
    font-weight: 800;
    font-size: 15px;
    color: var(--et-accent);
}

.et-drawer__head .et-icon-btn {
    margin-left: auto;
    width: 32px;
    height: 32px;
}

.et-drawer__body {
    flex: 1;
    min-height: 0;
    overflow: auto;
    padding: 16px 18px 24px;
}

/* 抽屉内容通用小节（工具复用） */
.et-drawer__body h4 {
    margin: 18px 0 8px;
    font-size: 12px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: .08em;
    color: var(--et-muted);
}

.et-drawer__body h4:first-child { margin-top: 0; }

.et-drawer__row {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
}

.et-drawer__tip {
    margin: 8px 0 0;
    font-size: 12px;
    line-height: 1.8;
    color: var(--et-muted);
}

.et-drawer__tip b { color: var(--et-fg); }

.et-drawer__input {
    flex: 1;
    min-width: 0;
    padding: 9px 12px;
    border: 1px solid var(--et-line-strong);
    border-radius: 9px;
    background: var(--et-surface-2);
    color: var(--et-fg);
    font: inherit;
    font-size: 13.5px;
    transition: border-color .14s, box-shadow .14s;
}

.et-drawer__input:focus {
    outline: none;
    border-color: var(--et-accent);
    box-shadow: 0 0 0 3px var(--et-accent-weak);
}

.et-drawer__switch {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 10px 0;
    border-bottom: 1px dashed var(--et-line);
    font-size: 13.5px;
    font-weight: 600;
    color: var(--et-fg);
    cursor: pointer;
    user-select: none;
}

.et-drawer__switch input {
    width: 17px;
    height: 17px;
    accent-color: var(--et-accent);
    cursor: pointer;
}
</style>
<!-- /ET:INLINE -->

<style>
/* ── 乘法口诀表：工具自身样式（自包含，不引用任何外部资源） ── */
:root { --tt-accent: #0891b2; }

.tt-main { flex: 1; min-height: 0; display: flex; flex-direction: column; }

/* ---------- 工具栏 ---------- */
.tt-bar {
    flex: none;
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    padding: 10px 18px;
    border-bottom: 1px solid var(--et-line);
    background: var(--et-surface-2);
}

.tt-seg {
    display: flex;
    gap: 3px;
    padding: 3px;
    border: 1px solid var(--et-line);
    border-radius: 11px;
    background: var(--et-surface);
}

.tt-seg button {
    border: 0;
    background: none;
    color: var(--et-muted);
    font: inherit;
    font-size: 13px;
    font-weight: 700;
    padding: 6px 12px;
    border-radius: 8px;
    cursor: pointer;
    white-space: nowrap;
    transition: background .14s, color .14s;
    -webkit-tap-highlight-color: transparent;
}

.tt-seg button:hover { color: var(--et-accent); }
.tt-seg button.is-active { background: var(--et-accent); color: #fff; }
.tt-spacer { flex: 1 1 auto; }

/* ---------- 表格舞台 ---------- */
.tt-stage {
    flex: 1;
    min-height: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 10px 16px 2px;
    overflow: auto;
}

.tt-grid {
    width: min(96%, 1120px, calc(100vh - 206px));
    display: grid;
    grid-template-columns: repeat(10, minmax(0, 1fr));
    gap: 5px;
}

.tt-head {
    display: grid;
    place-items: center;
    min-height: 24px;
    padding: 0;
    border: 1px solid transparent;
    border-radius: 8px;
    background: none;
    color: var(--et-muted);
    font: inherit;
    font-size: clamp(12px, 1.6vh, 18px);
    font-weight: 800;
    cursor: pointer;
    transition: background .14s, color .14s;
    -webkit-tap-highlight-color: transparent;
}

.tt-head:hover { background: var(--et-accent-weak); color: var(--et-accent); }
.tt-head.is-active { background: var(--et-accent); color: #fff; }

.tt-corner {
    cursor: default;
    background: none;
    color: var(--et-line-strong);
    font-size: clamp(13px, 1.8vh, 20px);
}

.tt-corner:hover { background: none; color: var(--et-line-strong); }

.tt-cell {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: .14em;
    aspect-ratio: 1 / 1;
    padding: 2px;
    border: 1px solid var(--et-line);
    border-radius: 10px;
    background: var(--et-surface);
    color: var(--et-fg);
    font: inherit;
    font-size: clamp(10px, 1.72vh, 19px);
    font-weight: 800;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
    overflow: hidden;
    cursor: pointer;
    transition: transform .12s, border-color .14s, background .14s, opacity .2s, box-shadow .14s;
    -webkit-tap-highlight-color: transparent;
}

.tt-cell:hover { border-color: var(--et-accent); transform: translateY(-1px); box-shadow: var(--et-shadow-md); }
.tt-cell:focus-visible { outline: 2px solid var(--et-accent); outline-offset: 1px; }
.tt-cell__ans { color: var(--et-accent); }
.tt-cell__mask { display: none; color: var(--et-muted); }
.tt-cell.is-square { background: var(--et-accent-weak); }
.tt-cell.is-masked { background: var(--et-surface-2); }
.tt-cell.is-masked .tt-cell__ans { display: none; }
.tt-cell.is-masked .tt-cell__mask { display: inline; }
.tt-cell.is-hit { animation: tt-pop .34s cubic-bezier(.34, 1.5, .64, 1); }
.tt-cell.is-pick { border-color: var(--et-accent); box-shadow: 0 0 0 3px var(--et-accent-weak); }
.tt-cell.is-dim { opacity: .24; }
.tt-cell.is-out { opacity: .14; pointer-events: none; }

@keyframes tt-pop {
    0% { transform: scale(.9); }
    60% { transform: scale(1.07); }
    100% { transform: scale(1); }
}

/* ---------- 口诀宣读条 ---------- */
.tt-readout {
    flex: none;
    display: flex;
    align-items: baseline;
    justify-content: center;
    gap: 14px;
    flex-wrap: wrap;
    min-height: 64px;
    padding: 4px 18px 12px;
}

.tt-readout__kj {
    font-size: clamp(22px, 4.4vh, 46px);
    font-weight: 900;
    letter-spacing: .05em;
    line-height: 1.1;
    color: var(--et-accent);
}

.tt-readout__expr {
    font-size: clamp(13px, 1.8vh, 18px);
    font-weight: 700;
    color: var(--et-muted);
    font-variant-numeric: tabular-nums;
}

.tt-readout.is-empty .tt-readout__kj { color: var(--et-line-strong); }

@media (max-height: 700px) {
    .tt-readout { min-height: 46px; padding-bottom: 6px; }
    .tt-head { display: none; }
    .tt-grid { grid-template-columns: repeat(9, minmax(0, 1fr)); }
    .tt-corner { display: none; }
}
</style>
</head>
<body class="et-app">

<header id="et-topbar"></header>

<main id="et-main" class="tt-main">

    <div class="tt-bar">
        <div class="tt-seg" id="segRange" role="group" aria-label="口诀范围">
            <button type="button" data-range="1-9">全部 1–9</button>
            <button type="button" data-range="1-5">1–5 基础</button>
            <button type="button" data-range="6-9">6–9 进阶</button>
        </div>

        <div class="tt-seg" id="segAction" role="group" aria-label="遮挡与抽考">
            <button type="button" data-act="show">全部揭晓</button>
            <button type="button" data-act="hide">全部遮住</button>
            <button type="button" data-act="ask">随机抽考</button>
            <button type="button" data-act="one">抽一个</button>
        </div>

        <span class="tt-spacer"></span>

        <button class="et-btn" id="btnSpeak" type="button" title="口诀朗读开关">
            <svg class="et-icon"><use href="#i-volume"></use></svg>
            <span id="btnSpeakText">朗读开</span>
        </button>
    </div>

    <div class="tt-stage">
        <div class="tt-grid" id="grid" aria-label="乘法口诀表"></div>
    </div>

    <div class="tt-readout is-empty" id="readout" aria-live="polite">
        <span class="tt-readout__kj" id="kj">点格子看口诀</span>
        <span class="tt-readout__expr" id="expr">点击任意格子揭晓答案，空格键一键遮住 / 揭晓</span>
    </div>

</main>

<footer id="et-footer"></footer>

        var panel = el('div', 'et-modal__panel' + (mo.size === 'narrow' ? ' et-modal__panel--narrow'
            : mo.size === 'wide' ? ' et-modal__panel--wide' : ''));
        var head = el('div', 'et-modal__head');
        if (mo.icon) { head.appendChild(makeIcon(mo.icon)); }
        head.appendChild(el('span', null, mo.title || ''));
        head.appendChild(makeBtn('i-x', '关闭', close));
        panel.appendChild(head);

        var body = el('div', 'et-modal__body');
        if (typeof mo.body === 'string') { body.innerHTML = mo.body; }
        else if (mo.body) { body.appendChild(mo.body); }
        panel.appendChild(body);

        var foot = null;
        if (mo.buttons && mo.buttons.length) {
            foot = el('div', 'et-modal__foot');
            foot.appendChild(el('span', 'spacer'));
            mo.buttons.forEach(function (b) {
                var btn = el('button', 'et-btn' + (b.primary ? ' et-btn--primary' : '') + (b.danger ? ' et-btn--danger' : ''), b.label);
                btn.type = 'button';
                btn.addEventListener('click', function () {
                    if (b.onClick) { b.onClick(close); } else { close(); }
                });
                foot.appendChild(btn);
            });
            panel.appendChild(foot);
        }

        backdrop.appendChild(panel);
        document.body.appendChild(backdrop);

        function close() {
            if (backdrop.parentNode) { backdrop.parentNode.removeChild(backdrop); }
            document.removeEventListener('keydown', onKey);
            if (mo.onClose) { mo.onClose(); }
        }
        function onKey(ev) {
            if (ev.key === 'Escape') { ev.stopPropagation(); close(); }
        }
        document.addEventListener('keydown', onKey);
        backdrop.addEventListener('mousedown', function (ev) {
            if (ev.target === backdrop) { close(); }
        });

        return { panel: panel, body: body, foot: foot, close: close };
    }

    var toastEl = null;
    var toastTimer = 0;

    function toast(msg, tone) {
        if (!toastEl) {
            toastEl = el('div', 'et-toast');
            document.body.appendChild(toastEl);
        }
        toastEl.textContent = msg;
        toastEl.setAttribute('data-tone', tone || '');
        void toastEl.offsetWidth;
        toastEl.classList.add('is-show');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(function () { toastEl.classList.remove('is-show'); }, 2200);
    }

    /* ---------- PWA 元数据（blob manifest，环境不支持时静默跳过） ---------- */

    function installPwa(toolId, title, accent) {
        try {
            var theme = document.querySelector('meta[name="theme-color"]');
            if (!theme) {
                theme = document.createElement('meta');
                theme.setAttribute('name', 'theme-color');
                document.head.appendChild(theme);
            }
            theme.setAttribute('content', accent || '#2563eb');

            var svg = '<svg xmlns="' + NS_SVG + '" viewBox="0 0 64 64">' +
                '<rect width="64" height="64" rx="14" fill="' + (accent || '#2563eb') + '"/>' +
                '<text x="32" y="43" font-size="32" font-weight="800" font-family="sans-serif" ' +
                'fill="#fff" text-anchor="middle">' + (title || '课').charAt(0) + '</text></svg>';
            var iconUri = 'data:image/svg+xml,' + encodeURIComponent(svg);

            var mf = {
                name: title || 'KeeTools 课工具',
                short_name: title || '课工具',
                start_url: '.',
                display: 'standalone',
                background_color: '#f4f6fb',
                theme_color: accent || '#2563eb',
                icons: [{ src: iconUri, sizes: 'any', type: 'image/svg+xml', purpose: 'any' }]
            };
            var blob = new Blob([JSON.stringify(mf)], { type: 'application/manifest+json' });
            var link = document.createElement('link');
            link.rel = 'manifest';
            link.href = URL.createObjectURL(blob);
            document.head.appendChild(link);
        } catch (err) { /* 不支持 PWA 元数据的环境静默跳过 */ }
    }

    /* ---------- 挂载 ---------- */

    function mount(options) {
        var opt = options || {};
        var toolId = opt.toolId || 'unknown-tool';
        var store = global.ET && global.ET.store
            ? global.ET.store(toolId)
            : (function () { return { get: function () { return null; }, set: function () {} }; })();

        var api = { toolId: toolId, store: store };

        /* 主题色 */
        if (opt.accent) {

        installPwa(toolId, opt.title, opt.accent);

        /* ---------- 主题 ---------- */
        var theme = store.get('theme', null);
        if (theme !== 'dark' && theme !== 'light') {
            theme = (global.matchMedia && global.matchMedia('(prefers-color-scheme: dark)').matches)
                ? 'dark' : 'light';
        }
        applyTheme(theme);

        function applyTheme(t) {
            theme = t;
            document.documentElement.setAttribute('data-et-theme', t);
            store.set('theme', t);
            if (themeBtn) {
                themeBtn.innerHTML = '';
                themeBtn.appendChild(makeIcon(t === 'dark' ? 'i-sun' : 'i-moon'));
                themeBtn.title = t === 'dark' ? '切换到浅色' : '切换到深色';
            }
        }

        /* ---------- 顶栏 ---------- */
        var topbar = document.getElementById('et-topbar');
        var main = document.getElementById('et-main');
        var footer = document.getElementById('et-footer');

        if (!topbar) { topbar = el('header'); topbar.id = 'et-topbar'; document.body.insertBefore(topbar, document.body.firstChild); }
        if (!main) { main = el('main'); main.id = 'et-main'; topbar.after(main); }
        if (!footer) { footer = el('footer'); footer.id = 'et-footer'; document.body.appendChild(footer); }

        topbar.className = 'et-topbar';
        main.classList.add('et-main');
        footer.className = 'et-footer';

        /* 品牌 */
        var brand = el('div', 'et-brand');
        brand.appendChild(el('span', 'et-brand__dot'));
        var nameWrap = el('div');
        nameWrap.style.cssText = 'min-width:0;line-height:1.25';
        nameWrap.appendChild(el('div', 'et-brand__name', opt.title || '课工具'));
        if (opt.sub) { nameWrap.appendChild(el('div', 'et-brand__sub', opt.sub)); }
        brand.appendChild(nameWrap);
        topbar.appendChild(brand);

        /* 状态胶囊 */
        var statusPill = el('div', 'et-status');
        statusPill.hidden = true;
        statusPill.appendChild(el('span', 'et-status__dot'));
        var statusText = el('span', null, '');
        statusPill.appendChild(statusText);
        topbar.appendChild(statusPill);

        api.setStatus = function (text, tone) {
            if (!text) { statusPill.hidden = true; return; }

            statusPill.setAttribute('data-tone', tone || 'ok');

        if (opt.status) { api.setStatus(opt.status); }

        /* 动作区（edupick 交互：右上角聚合设置入口） */
        var actions = el('div', 'et-actions');

            settingsBtn = makeBtn('i-sliders', opt.settings.title || '设置', function () {

        (opt.actions || []).forEach(function (a) {

        var soundBtn = null;

        if (opt.help) {

        }

        /* 全屏按钮始终保留：iframe 内对本工具文档 requestFullscreen

        var fsBtn = makeBtn('i-maximize', '全屏', toggleFullscreen);
        actions.appendChild(fsBtn);

        function toggleSound() {
            soundEnabled = !soundEnabled;
            store.set('sound', soundEnabled);
            soundBtn.innerHTML = '';
            soundBtn.appendChild(makeIcon(soundEnabled ? 'i-volume' : 'i-volume-off'));
            soundBtn.title = soundEnabled ? '关闭音效' : '开启音效';
            soundBtn.classList.toggle('is-off', !soundEnabled);
            if (soundEnabled) { api.beep('ok'); }
        }

        api.openSettings = function () {
            if (settingsBtn) { settingsBtn.click(); }
        };

        /* ---------- 全屏（iframe 内委托宿主，避免双层全屏） ---------- */

        function inIframe() {
            try { return global.parent && global.parent !== global; } catch (err) { return true; }
        }

        function toggleFullscreen() {
            var root = document.documentElement;
            var fsEl = document.fullscreenElement || document.webkitFullscreenElement || null;
            if (fsEl) {
                (document.exitFullscreen || document.webkitExitFullscreen || function () {}).call(document);
            } else {
                var req = root.requestFullscreen || root.webkitRequestFullscreen;
                if (req) { try { req.call(root); } catch (err) { /* 忽略 */ } }
            }
        }

        function syncFsIcon(on) {
            if (!fsBtn) { return; }
            fsBtn.innerHTML = '';
            fsBtn.appendChild(makeIcon(on ? 'i-minimize' : 'i-maximize'));
            fsBtn.title = on ? '退出全屏' : '全屏';
        }

        document.addEventListener('fullscreenchange', function () {
            syncFsIcon(!!(document.fullscreenElement || document.webkitFullscreenElement));
        });
        document.addEventListener('webkitfullscreenchange', function () {
            syncFsIcon(!!(document.fullscreenElement || document.webkitFullscreenElement));
        });
        syncFsIcon(false);

        api.toggleFullscreen = toggleFullscreen;

        /* ---------- 音效 API ---------- */
        api.beep = function (kind) {
            if (!soundEnabled) { return; }
            playBeep(kind);
        };
        api.soundOn = function () { return soundEnabled; };

        api.modal = modal;

        /* ---------- 帮助 ---------- */
        function openHelp() {
            modal({
                title: '使用说明',
                icon: 'i-help',
                size: 'narrow',
                body: opt.help,
                buttons: [{ label: '知道了', primary: true }]
            });
        }
        api.openHelp = openHelp;

        /* ---------- toast ---------- */
        api.toast = toast;

        /* ---------- 页脚（L2 品牌回流，低调一行） ---------- */
        var siteOrigin = typeof global.ET_SITE_ORIGIN === 'string' && /^https?:\/\//.test(global.ET_SITE_ORIGIN)
            ? global.ET_SITE_ORIGIN
            : null;

        function renderFooter() {
            footer.textContent = '';
            footer.appendChild(el('span', null, 'KeeTools 课工具'));
            footer.appendChild(el('span', null, '·'));
            if (siteOrigin) {
                var a = el('a', null, '更多课堂工具');
                a.href = siteOrigin + '/?from=tool-footer&tool=' + encodeURIComponent(toolId);
                a.target = '_blank';
                a.rel = 'noopener';
                footer.appendChild(a);
            } else {
                footer.appendChild(el('span', null, '更多课堂工具'));
            }
        }
        renderFooter();

        /* 站点来源发现：iframe 内向父窗口询问；也可由宿主直接注入 ET_SITE_ORIGIN */
        try {
            if (global.parent && global.parent !== global) {
                global.parent.postMessage(JSON.stringify({ type: 'et-hello', toolId: toolId }), '*');
            }
        } catch (err) { /* 跨域异常忽略 */ }

        global.addEventListener('message', function (ev) {
            var data = ev.data;
            if (typeof data === 'string') {
                try { data = JSON.parse(data); } catch (err) { return; }
            }
            if (!data || typeof data !== 'object') { return; }

            if (data.type === 'et-origin' && typeof data.origin === 'string' && /^https?:\/\//.test(data.origin)) {
                siteOrigin = data.origin;
                if (!global.ET_SITE_ORIGIN) { global.ET_SITE_ORIGIN = data.origin; }
                renderFooter();
            }
            if (data.type === 'et-fullscreen-change' && typeof data.value === 'boolean') {
                syncFsIcon(data.value);
            }
        });

        api.el = { topbar: topbar, main: main, footer: footer, actions: actions };

        /* ---------- 激光笔 / 翻页笔适配（HID 翻页键） ----------
         * 翻页笔的上下页键在系统层等价于 PageDown / PageUp。
         * 工具通过 opt.primary / opt.secondary 注册动作：
         *   PageDown → primary（主操作，如开始点名 / 开始计时）
         *   PageUp   → secondary（副操作，缺省时同 primary）
         * 输入框聚焦或弹窗/抽屉打开时不响应，避免误触。 */
        if (typeof opt.primary === 'function') {
            document.addEventListener('keydown', function (ev) {
                if (ev.key !== 'PageDown' && ev.key !== 'PageUp') { return; }
                var tag = (document.activeElement && document.activeElement.tagName) || '';
                if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') { return; }
                if (document.querySelector('.et-modal, .et-drawer-backdrop, .ws-winner')) { return; }
                ev.preventDefault();
                if (ev.key === 'PageDown') { opt.primary(); }
                else if (typeof opt.secondary === 'function') { opt.secondary(); }
                else { opt.primary(); }
            });
        }

        return api;
    }

    global.ET = global.ET || {};
    global.ET.Chrome = {
        mount: mount,
        modal: modal,
        toast: toast,
        beep: playBeep /* 挂载前的独立音效入口（不经过音效开关） */
    };
})(window);
</script>

<script>
  /* 此块由 scripts/sync_shared.py 自动注入，请勿手工修改 */
/*!
 * et-stats.js — 使用统计模块（模块化，可整体移除）
 *
 * 共享逻辑源。改这里，然后跑：python scripts/sync_shared.py
 * 依赖：无（可脱离 et-util / et-chrome 独立运行）。
 * 全局：ET.Stats
 *
 * ┌────────────────────────────────────────────────────────────────┐
 * │ 说明：本模块只做一件事——工具被打开时向上报端点发一条匿名计数。 │
 * │ · 在线（iframe 内）：宿主页面已服务端计数，本模块不重复上报。   │
 * │ · 离线打开（file:// / 下载单文件 / 离线包）：联网条件具备时，   │
 * │   以 sendBeacon 上报 use_offline 事件（text/plain 免预检）。    │
 * │ · 上报端点 = window.ET_SITE_ORIGIN（由宿主注入或离线包配置）。  │
 * │   未配置端点时本模块完全静默，不发任何请求。                    │
 * │ · **整个 <script> 块可安全删除**：删除后工具其余功能完全正常，  │
 * │   且完全不再发起任何网络请求。                                  │
 * └────────────────────────────────────────────────────────────────┘
 */
(function (global) {
    'use strict';

    var ET = global.ET = global.ET || {};

    var Stats = {
        /** 上报端点来源（站点绝对地址，无协议尾斜杠） */
        endpoint: (typeof global.ET_SITE_ORIGIN === 'string' && /^https?:\/\//.test(global.ET_SITE_ORIGIN))
            ? global.ET_SITE_ORIGIN
            : null,

        _done: {},

        /**
         * 上报一次事件（同一事件同一工具每次页面加载只报一次）。
         * event: 'use_offline' 等；toolId: 工具 id。
         */
        send: function (event, toolId) {
            if (!event || this._done[event + ':' + (toolId || '')]) { return false; }
            if (!this.endpoint) { return false; }
            /* iframe 内由宿主统计，避免双计 */
            try {
                if (global.parent && global.parent !== global) { return false; }
            } catch (err) { return false; }
            /* 断网时挂起，网络恢复自动补报一次 */
            if (global.navigator && global.navigator.onLine === false) {
                var self = this;
                global.addEventListener('online', function () { self.send(event, toolId); }, { once: true });
                return false;
            }

            this._done[event + ':' + (toolId || '')] = true;
            var payload = JSON.stringify({ event: event, tool: toolId || '' });

            try {
                if (global.navigator.sendBeacon) {
                    return global.navigator.sendBeacon(
                        this.endpoint + '/api/track',
                        new Blob([payload], { type: 'text/plain;charset=UTF-8' })
                    );
                }
                global.fetch(this.endpoint + '/api/track', {
                    method: 'POST',
                    body: payload,
                    keepalive: true,
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'text/plain;charset=UTF-8' }
                });
                return true;
            } catch (err) {
                return false;
            }
        }
    };

    ET.Stats = Stats;
})(window);
</script>

<script>
(function () {
    'use strict';

    var TOOL_ID = 'times-table';
    var store = ET.store(TOOL_ID);

    var CN = ['', '一', '二', '三', '四', '五', '六', '七', '八', '九'];
    var RANGES = { '1-9': [1, 9], '1-5': [1, 5], '6-9': [6, 9] };
    var ASK_COUNTS = [6, 12, 18, 81];
    var RATES = [0.7, 0.9, 1.1];

    /* ============ 口诀读法 ============ */

    function cnNum(n) {
        if (n < 10) { return CN[n]; }
        if (n === 10) { return '一十'; }
        if (n < 20) { return '十' + CN[n - 10]; }
        var tens = Math.floor(n / 10);
        var unit = n % 10;
        return CN[tens] + '十' + (unit ? CN[unit] : '');
    }

    /* 小数在前：3×4 → 三四十二；积不足 10 加「得」：2×2 → 二二得四 */
    function koujue(a, b) {
        var p = a * b;
        return CN[Math.min(a, b)] + CN[Math.max(a, b)] + (p < 10 ? '得' : '') + cnNum(p);
    }

    function cellKey(a, b) { return a + '-' + b; }

    /* ============ 状态 ============ */

    function validRange(v) { return RANGES[v] ? v : '1-9'; }
    function validCount(v) { return ASK_COUNTS.indexOf(Number(v)) !== -1 ? Number(v) : 12; }
    function validRate(v) { return RATES.indexOf(Number(v)) !== -1 ? Number(v) : 0.9; }

    var state = {
        range: validRange(store.get('range', '1-9')),
        askCount: validCount(store.get('askCount', 12)),
        rate: validRate(store.get('rate', 0.9)),
        speak: store.get('speak', true) !== false,
        masked: {},
        ask: [],
        hlRow: 0,
        hlCol: 0
    };

    var cells = {};
    var heads = { row: {}, col: {} };
    var pickedKey = null;

    /* ============ 语音（能力检测 + 静默降级） ============ */

    var canSpeak = typeof window.speechSynthesis !== 'undefined'
        && typeof window.SpeechSynthesisUtterance === 'function';

    function speak(text) {
        if (!state.speak || !canSpeak) { return; }
        try {
            window.speechSynthesis.cancel();
            var u = new window.SpeechSynthesisUtterance(text);
            u.lang = 'zh-CN';
            u.rate = state.rate;
            window.speechSynthesis.speak(u);
        } catch (err) { /* 无语音包 / 被策略拦截：静默 */ }
    }

    var chrome = ET.Chrome.mount({
        toolId: TOOL_ID,
        title: '乘法口诀表',
        sub: '数学 · 点格子揭晓 / 遮住',
        accent: '#0891b2',
        status: '就绪',
        sound: true,
        primary: toggleMask,    /* 翻页笔下页键：揭晓 / 遮住 全部 */
        secondary: pickOne,     /* 翻页笔上页键：抽一个 */
        settings: { title: '口诀表设置', build: buildSettings },
        help: '<div style="font-size:13.5px;line-height:2">' +
            '<p style="margin:0 0 8px"><b>怎么用</b>：点任意格子切换「揭晓 / 遮住」，口诀会显示在下方宣读条大字号位置。</p>' +
            '<p style="margin:0 0 8px"><b>讲课三招</b>：① 点左上「全部遮住」让全班齐背；② 点「随机抽考」遮住若干格，学生答对后点格子揭晓；③ 点「抽一个」随机点题，让某个学生回答。</p>' +
            '<p style="margin:0 0 8px"><b>讲专题</b>：点表头的行号或列号，可以高亮整行 / 整列（例如只讲 7 的乘法）；再点一次取消。</p>' +
            '<p style="margin:0 0 8px"><b>范围</b>：可切成 1–5 基础或 6–9 进阶，范围外的格子自动变暗。</p>' +
            '<p style="margin:0 0 8px"><b>朗读</b>：点格子会自动读出「三四十二」这样的口诀（按小数在前、积小于 10 读「得」的规则）；系统没有中文语音包时不会出声，可关掉。</p>' +
            '<p style="margin:0"><b>快捷键</b>：空格 = 全部揭晓 / 遮住；翻页笔下页键同效，上页键 = 抽一个。</p></div>'
    });

    /* ============ 表格构建 ============ */

    function makeHead(label, kind, index, title) {
        var b = document.createElement('button');
        b.type = 'button';
        b.className = 'tt-head';
        b.textContent = label;
        b.title = title;
        b.addEventListener('click', function () {
            if (kind === 'row') {
                state.hlRow = state.hlRow === index ? 0 : index;
            } else {
                state.hlCol = state.hlCol === index ? 0 : index;
            }
            paint();
            chrome.beep('tick');
        });
        return b;
    }

    function makeCell(a, b) {
        var cell = document.createElement('button');
        cell.type = 'button';
        cell.className = 'tt-cell';

        var expr = document.createElement('span');
        expr.className = 'tt-cell__expr';
        expr.textContent = a + '×' + b;

        var ans = document.createElement('span');
        ans.className = 'tt-cell__ans';
        ans.textContent = '=' + (a * b);

        var mask = document.createElement('span');
        mask.className = 'tt-cell__mask';
        mask.textContent = '=?';

        cell.appendChild(expr);
        cell.appendChild(ans);
        cell.appendChild(mask);
        cell.addEventListener('click', function () { onCell(a, b); });
        cell.addEventListener('mouseenter', function () { preview(a, b); });
        return cell;
    }

    function buildGrid() {
        var grid = document.getElementById('grid');
        grid.textContent = '';
        cells = {};
        heads = { row: {}, col: {} };

        var corner = document.createElement('div');
        corner.className = 'tt-head tt-corner';
        corner.textContent = '×';
        grid.appendChild(corner);

        var i, j;
        for (j = 1; j <= 9; j++) {
            heads.col[j] = makeHead('×' + j, 'col', j, '高亮第 ' + j + ' 列');
            grid.appendChild(heads.col[j]);
        }

        for (i = 1; i <= 9; i++) {
            heads.row[i] = makeHead(String(i), 'row', i, '高亮第 ' + i + ' 行');
            grid.appendChild(heads.row[i]);
            for (j = 1; j <= 9; j++) {
                var cell = makeCell(i, j);
                cells[cellKey(i, j)] = cell;
                grid.appendChild(cell);
            }
        }
    }

    /* ============ 判定与绘制 ============ */

    function inRange(a, b) {
        var r = RANGES[state.range];
        return a >= r[0] && a <= r[1] && b >= r[0] && b <= r[1];
    }

    function hasAnyMasked() {
        for (var k in state.masked) {
            if (state.masked[k]) { return true; }
        }
        return false;
    }

    function pulse(el, cls) {
        el.classList.remove(cls);
        void el.offsetWidth;
        el.classList.add(cls);
        setTimeout(function () { el.classList.remove(cls); }, 420);
    }

    function clearPick() {
        if (pickedKey && cells[pickedKey]) { cells[pickedKey].classList.remove('is-pick'); }
        pickedKey = null;
    }

    function paint() {
        var a, b, k, cell, inR, masked, dim;
        for (a = 1; a <= 9; a++) {
            for (b = 1; b <= 9; b++) {
                k = cellKey(a, b);
                cell = cells[k];
                if (!cell) { continue; }
                inR = inRange(a, b);
                masked = !!state.masked[k];
                dim = (state.hlRow && a !== state.hlRow) || (state.hlCol && b !== state.hlCol);
                cell.classList.toggle('is-out', !inR);
                cell.classList.toggle('is-masked', masked && inR);
                cell.classList.toggle('is-square', a === b && inR);
                cell.classList.toggle('is-dim', !!dim && inR);
                cell.title = a + '×' + b + (inR ? (masked ? '（点击揭晓）' : '（点击遮住）') : '（当前范围外）');
            }
        }
        for (var i = 1; i <= 9; i++) {
            if (heads.row[i]) { heads.row[i].classList.toggle('is-active', state.hlRow === i); }
            if (heads.col[i]) { heads.col[i].classList.toggle('is-active', state.hlCol === i); }
        }
        updateStatus();
    }

    function updateStatus() {
        var masked = 0;
        var left = 0;
        var i;
        for (var k in state.masked) {
            if (state.masked[k]) { masked++; }
        }
        for (i = 0; i < state.ask.length; i++) {
            if (state.masked[state.ask[i]]) { left++; }
        }

        var text = state.range === '1-9' ? '全部口诀' : state.range.replace('-', '–') + ' 范围';
        if (state.ask.length) {
            text += ' · 抽考 ' + state.ask.length + ' 格 · 已揭晓 ' + (state.ask.length - left);
        } else if (masked) {
            text += ' · 遮住 ' + masked + ' 格';
        } else {
            text += ' · 全部揭晓';
        }
        chrome.setStatus(text);
    }

    /* ============ 宣读条 ============ */

    function showReadout(a, b, reveal) {
        document.getElementById('kj').textContent = reveal
            ? koujue(a, b)
            : a + ' × ' + b + ' = ?';
        document.getElementById('expr').textContent = reveal
            ? a + ' × ' + b + ' = ' + (a * b)
            : '请同学回答后，点这个格子揭晓';
        document.getElementById('readout').classList.remove('is-empty');
    }

    function resetReadout() {
        document.getElementById('kj').textContent = '点格子看口诀';
        document.getElementById('expr').textContent = '点击任意格子揭晓答案，空格键一键遮住 / 揭晓';
        document.getElementById('readout').classList.add('is-empty');
    }

    function preview(a, b) {
        if (!inRange(a, b)) { return; }
        if (state.masked[cellKey(a, b)]) { showReadout(a, b, false); }
        else { showReadout(a, b, true); }
    }

    /* ============ 交互 ============ */

    function onCell(a, b) {
        if (!inRange(a, b)) { return; }
        var k = cellKey(a, b);
        var cell = cells[k];

        if (state.masked[k]) {
            delete state.masked[k];
            chrome.beep('tick');
            showReadout(a, b, true);
            speak(koujue(a, b));
            if (cell) { pulse(cell, 'is-hit'); }
        } else {
            state.masked[k] = true;
            showReadout(a, b, false);
        }
        if (pickedKey === k) { clearPick(); }
        paint();
        save();
    }

    function showAll() {
        state.masked = {};
        state.ask = [];
        clearPick();
        resetReadout();
        paint();
        save();
        chrome.beep('ok');
    }

    function hideAll() {
        state.masked = {};
        state.ask = [];
        clearPick();
        var a, b;
        for (a = 1; a <= 9; a++) {
            for (b = 1; b <= 9; b++) {
                if (inRange(a, b)) { state.masked[cellKey(a, b)] = true; }
            }
        }
        paint();
        save();
        chrome.beep('tick');
        chrome.toast('已遮住 ' + countMasked() + ' 格，点格子逐个揭晓');
    }

    function countMasked() {
        var n = 0;
        for (var k in state.masked) {
            if (state.masked[k]) { n++; }
        }
        return n;
    }

    function doAsk() {
        var pool = [];
        var a, b;
        for (a = 1; a <= 9; a++) {
            for (b = 1; b <= 9; b++) {
                if (inRange(a, b)) { pool.push(cellKey(a, b)); }
            }
        }
        for (var i = pool.length - 1; i > 0; i--) {
            var j = Math.floor(Math.random() * (i + 1));
            var t = pool[i];
            pool[i] = pool[j];
            pool[j] = t;
        }

        var n = Math.min(state.askCount, pool.length);
        state.masked = {};
        state.ask = [];
        clearPick();
        for (i = 0; i < n; i++) {
            state.masked[pool[i]] = true;
            state.ask.push(pool[i]);
        }
        paint();
        save();
        chrome.beep('ok');
        chrome.toast('已随机遮住 ' + n + ' 格，点格子揭晓');
    }

    function pickOne() {
        var pool = [];
        for (var k in state.masked) {
            if (state.masked[k]) { pool.push(k); }
        }
        if (!pool.length) {
            chrome.toast('先点「全部遮住」或「随机抽考」，再抽题', 'warn');
            chrome.beep('err');
            return;
        }
        clearPick();
        pickedKey = pool[Math.floor(Math.random() * pool.length)];
        var cell = cells[pickedKey];
        var parts = pickedKey.split('-');
        if (cell) {
            cell.classList.add('is-pick');
            try { cell.scrollIntoView({ block: 'center', inline: 'center' }); } catch (err) { /* 老内核忽略 */ }
        }
        showReadout(Number(parts[0]), Number(parts[1]), false);
        chrome.beep('ok');
    }

    function toggleMask() {
        if (hasAnyMasked()) { showAll(); } else { hideAll(); }
    }

    function setRange(v) {
        state.range = validRange(v);
        var k, p, i, q;
        for (k in state.masked) {
            p = k.split('-');
            if (!inRange(Number(p[0]), Number(p[1]))) { delete state.masked[k]; }
        }
        var nextAsk = [];
        for (i = 0; i < state.ask.length; i++) {
            q = state.ask[i].split('-');
            if (inRange(Number(q[0]), Number(q[1]))) { nextAsk.push(state.ask[i]); }
        }
        state.ask = nextAsk;
        state.hlRow = 0;
        state.hlCol = 0;
        clearPick();
        renderChips();
        paint();
        save();
    }

    /* ============ 持久化 ============ */

    function save() {
        store.set('range', state.range);
        store.set('askCount', state.askCount);
        store.set('rate', state.rate);
        store.set('speak', state.speak);
        store.set('ask', state.ask);
        var keys = [];
        for (var k in state.masked) {
            if (state.masked[k]) { keys.push(k); }
        }
        store.set('masked', keys);
    }

    function restore() {
        var keys = store.get('masked', []);
        var i, parts, a, b;
        if (Array.isArray(keys)) {
            for (i = 0; i < keys.length; i++) {
                parts = String(keys[i]).split('-');
                a = Number(parts[0]);
                b = Number(parts[1]);
                if (a >= 1 && a <= 9 && b >= 1 && b <= 9 && inRange(a, b)) { state.masked[keys[i]] = true; }
            }
        }
        var ask = store.get('ask', []);
        if (Array.isArray(ask)) {
            for (i = 0; i < ask.length; i++) {
                parts = String(ask[i]).split('-');
                a = Number(parts[0]);
                b = Number(parts[1]);
                if (a >= 1 && a <= 9 && b >= 1 && b <= 9 && inRange(a, b)) { state.ask.push(ask[i]); }
            }
        }
    }

    /* ============ 界面控件 ============ */

    function renderChips() {
        var list = document.getElementById('segRange').querySelectorAll('button');
        for (var i = 0; i < list.length; i++) {
            list[i].classList.toggle('is-active', list[i].getAttribute('data-range') === state.range);
        }

        var btn = document.getElementById('btnSpeak');
        var btnText = document.getElementById('btnSpeakText');
        if (!btn || !btnText) { return; }
        if (!canSpeak) {
            btnText.textContent = '朗读不可用';
            btn.classList.add('is-off');
            btn.title = '当前浏览器不支持语音朗读，可按下方口诀条带读';
        } else {
            btnText.textContent = state.speak ? '朗读开' : '朗读关';
            btn.classList.toggle('is-off', !state.speak);
            btn.title = state.speak ? '点击关闭口诀朗读' : '点击开启口诀朗读';
        }
    }

    /* ============ 设置抽屉 ============ */

    function buildSettings(body) {
        function heading(text) {
            var h = document.createElement('h4');
            h.textContent = text;
            body.appendChild(h);
        }

        function segRow(labels, values, current, onPick) {
            var row = document.createElement('div');
            row.className = 'et-drawer__row';
            for (var i = 0; i < values.length; i++) {
                (function (value, label) {
                    var b = document.createElement('button');
                    b.type = 'button';
                    b.className = 'et-btn' + (value === current ? ' et-btn--primary' : '');
                    b.style.flex = '1 1 28%';
                    b.textContent = label;
                    b.addEventListener('click', function () {
                        onPick(value);
                        refresh();
                    });
                    row.appendChild(b);
                })(values[i], labels[i]);
            }
            body.appendChild(row);
        }

        heading('口诀范围');
        segRow(['全部 1–9', '1–5 基础', '6–9 进阶'], ['1-9', '1-5', '6-9'], state.range, function (v) {
            setRange(v);
            chrome.beep('tick');
        });

        heading('随机抽考题量');
        segRow(['6 格', '12 格', '18 格', '全部'], [6, 12, 18, 81], state.askCount, function (v) {
            state.askCount = validCount(v);
            save();
        });

        heading('口诀朗读');
        var switchRow = document.createElement('label');
        switchRow.className = 'et-drawer__switch';
        switchRow.appendChild(document.createTextNode('点格子时朗读口诀'));
        var cb = document.createElement('input');
        cb.type = 'checkbox';
        cb.checked = state.speak;
        cb.disabled = !canSpeak;
        cb.addEventListener('change', function () {
            state.speak = cb.checked;
            save();
            renderChips();
            if (state.speak) { speak('三四十二'); }
        });
        switchRow.appendChild(cb);
        body.appendChild(switchRow);

        if (!canSpeak) {
            var warn = document.createElement('p');
            warn.className = 'et-drawer__tip';
            warn.textContent = '当前浏览器不支持语音朗读（speechSynthesis）。功能已自动关闭，不影响其它操作。';
            body.appendChild(warn);
        }

        segRow(['慢速', '正常', '快速'], [0.7, 0.9, 1.1], state.rate, function (v) {
            state.rate = validRate(v);
            save();
            speak('三四十二');
        });

        var tip = document.createElement('p');
        tip.className = 'et-drawer__tip';
        tip.innerHTML = '口诀按<b>小数在前</b>读，如 3×4 读作「三四十二」；积小于 10 时加「得」，如 2×2 读作「二二得四」。'
            + '<br>若点格子没有声音，请检查系统是否装了中文语音包（Windows：设置 → 时间和语言 → 语音）。'
            + '<br>点表头行号 / 列号可高亮整行整列，适合讲「7 的乘法」这类专题。'
            + '<br>范围、遮罩、题量、朗读设置都保存在本机浏览器，下次打开自动恢复。';
        body.appendChild(tip);

        function refresh() {
            while (body.firstChild) { body.removeChild(body.firstChild); }
            buildSettings(body);
        }
    }

    /* ============ 事件绑定 ============ */

    document.getElementById('segRange').addEventListener('click', function (ev) {
        var t = ev.target;
        var v = t && t.getAttribute ? t.getAttribute('data-range') : null;
        if (v) {
            setRange(v);
            chrome.beep('tick');
        }
    });

    document.getElementById('segAction').addEventListener('click', function (ev) {
        var t = ev.target;
        var act = t && t.getAttribute ? t.getAttribute('data-act') : null;
        if (act === 'show') { showAll(); }
        else if (act === 'hide') { hideAll(); }
        else if (act === 'ask') { doAsk(); }
        else if (act === 'one') { pickOne(); }
    });

    document.getElementById('btnSpeak').addEventListener('click', function () {
        if (!canSpeak) {
            chrome.toast('当前浏览器不支持语音朗读，可跟读下方口诀条', 'warn');
            return;
        }
        state.speak = !state.speak;
        save();
        renderChips();
        if (state.speak) {
            speak('三四十二');
        } else {
            try { window.speechSynthesis.cancel(); } catch (err) { /* 静默 */ }
        }
    });

    document.addEventListener('keydown', function (ev) {
        if (ev.code !== 'Space' && ev.key !== ' ') { return; }
        var node = document.activeElement;
        var tag = node && node.tagName ? node.tagName.toUpperCase() : '';
        if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT' || (node && node.isContentEditable)) { return; }
        if (document.querySelector('.et-modal, .et-drawer-backdrop')) { return; }
        ev.preventDefault();
        toggleMask();
    });

    /* ============ 启动 ============ */

    buildGrid();
    restore();
    renderChips();
    paint();
})();
</script>

</body>
</html>
