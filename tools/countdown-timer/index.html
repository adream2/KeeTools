/*!
 * et-chrome.css — 工具通用外壳样式（顶栏 / 页脚 / 弹窗 / 按钮 / 主题）

/* ============ 设计令牌 ============ */
:root {
    --et-accent: #2563eb;
    --et-accent-weak: rgba(37, 99, 235, .14);
    --et-bg: #f4f6fb;
    --et-surface: #ffffff;
    --et-surface-2: #f8fafc;
    --et-fg: #0b1220;
    --et-muted: #64748b;
    --et-line: rgba(15, 23, 42, .12);
    --et-line-strong: rgba(15, 23, 42, .22);
    --et-glass: rgba(255, 255, 255, .85);
    --et-shadow-md: 0 10px 28px -18px rgba(15, 23, 42, .3);
    --et-shadow-lg: 0 24px 60px -32px rgba(15, 23, 42, .4);
    --et-ok: #059669;
    --et-warn: #d97706;
    --et-err: #dc2626;
    --et-radius: 12px;
    --et-radius-sm: 9px;
    --et-font: -apple-system, BlinkMacSystemFont, "Segoe UI",
               "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei",
               "Noto Sans SC", sans-serif;
    --et-mono: ui-monospace, "Cascadia Mono", Consolas, Menlo, monospace;
}

html[data-et-theme="dark"] {
    --et-bg: #0b1120;
    --et-surface: #111a2e;
    --et-surface-2: #0f1729;
    --et-fg: #f1f5f9;
    --et-muted: #94a3b8;
    --et-line: rgba(148, 163, 184, .18);
    --et-line-strong: rgba(148, 163, 184, .3);
    --et-glass: rgba(17, 26, 46, .85);
    --et-shadow-md: 0 10px 34px -18px rgba(0, 0, 0, .8);
    --et-shadow-lg: 0 24px 70px -30px rgba(0, 0, 0, .9);
    --et-ok: #34d399;
    --et-warn: #fbbf24;
    --et-err: #f87171;
}

/* ============ 基础 ============ */

/* body 作为外壳时必须清掉浏览器默认 8px 外边距，
   否则 iframe 预览中文档会比视口高 16px（底部白边 + 多余滚动） */
body.et-app {
    margin: 0;
}

.et-app {
    position: relative;
    isolation: isolate;
    display: flex;
    flex-direction: column;
    height: 100vh;
    height: 100dvh;
    overflow: hidden;
    background: var(--et-bg);
    color: var(--et-fg);
    font-family: var(--et-font);
    -webkit-font-smoothing: antialiased;
    transition: background .25s, color .25s;
}

/* 极光背景：径向渐变 + 呼吸动画（edupick 品质基线，老内核也不掉帧） */
.et-app::before {
    content: '';
    position: fixed;
    inset: 0;
    z-index: -1;
    pointer-events: none;
    background:
        radial-gradient(46% 40% at 20% 18%, var(--et-accent-weak), transparent 65%),
        radial-gradient(42% 38% at 82% 24%, var(--et-accent-weak), transparent 70%),
        radial-gradient(50% 44% at 55% 95%, rgba(16, 185, 129, .10), transparent 65%);
    animation: et-aurora 16s ease-in-out infinite alternate;
}

@keyframes et-aurora {
    from { opacity: .55; transform: scale(1); }
    to { opacity: 1; transform: scale(1.06); }
}

.et-app *,
.et-app *::before,
.et-app *::after { box-sizing: border-box; }

[hidden] { display: none !important; }

.et-icon {
    width: 18px;
    height: 18px;
    fill: none;
    stroke: currentColor;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
    flex: none;
}

/* ============ 顶栏 ============ */
.et-topbar {
    flex: none;
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 11px 20px;
    border-bottom: 1px solid var(--et-line);
    background: var(--et-glass);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    z-index: 20;
}

.et-brand {
    display: flex;
    align-items: center;
    gap: 10px;
    min-width: 0;
}

.et-brand__dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: var(--et-accent);
    box-shadow: 0 0 0 4px var(--et-accent-weak);
    flex: none;
}

.et-brand__name {
    font-weight: 800;
    font-size: 15px;
    letter-spacing: -.01em;
    white-space: nowrap;
}

.et-brand__sub {
    font-size: 12.5px;
    color: var(--et-muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.et-status {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 5px 14px;
    border-radius: 999px;
    font-size: 12.5px;
    color: var(--et-muted);
    background: var(--et-surface-2);
    border: 1px solid var(--et-line);
    white-space: nowrap;
    max-width: 42vw;
    overflow: hidden;
    text-overflow: ellipsis;
}

.et-status__dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--et-ok);
    flex: none;
    transition: background .2s;
}

.et-status[data-tone="err"] .et-status__dot { background: var(--et-err); }
.et-status[data-tone="warn"] .et-status__dot { background: var(--et-warn); }

.et-actions {
    display: flex;
    align-items: center;
    gap: 7px;
}

.et-icon-btn {
    display: inline-grid;
    place-items: center;
    width: 38px;
    height: 38px;
    font-size: 16px;
    line-height: 1;
    border-radius: 11px;
    border: 1px solid var(--et-line);
    background: var(--et-surface-2);
    color: var(--et-fg);
    cursor: pointer;
    transition: transform .14s, border-color .14s, color .14s, opacity .14s;
    -webkit-tap-highlight-color: transparent;
}

.et-icon-btn:hover {
    border-color: var(--et-accent);
    color: var(--et-accent);
    transform: translateY(-1px);
}

.et-icon-btn:active { transform: translateY(0); }
.et-icon-btn.is-off { opacity: .4; }
.et-icon-btn:focus-visible { outline: 2px solid var(--et-accent); outline-offset: 2px; }

/* ============ 主区默认 ============ */
.et-main {
    flex: 1;
    min-height: 0;
    position: relative;
    overflow: auto;
}

/* ============ 页脚（品牌回流 L2） ============ */
.et-footer {
    flex: none;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 7px 16px;
    font-size: 12px;
    color: var(--et-muted);
    border-top: 1px solid var(--et-line);
    background: var(--et-glass);
    user-select: none;
    z-index: 20;
}

.et-footer a {
    color: inherit;
    text-decoration: none;
    transition: color .14s;
}

.et-footer a:hover { color: var(--et-accent); }

/* ============ 按钮 ============ */
.et-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
    padding: 9px 16px;
    border-radius: 11px;
    font: inherit;
    font-size: 13.5px;
    font-weight: 700;
    border: 1px solid var(--et-line);
    background: var(--et-surface-2);
    color: var(--et-fg);
    cursor: pointer;
    transition: transform .14s, border-color .14s, color .14s, background .14s, box-shadow .14s;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
}

.et-btn:hover {
    border-color: var(--et-accent);
    color: var(--et-accent);
    transform: translateY(-1px);
}

.et-btn:active { transform: translateY(0); }
.et-btn:focus-visible { outline: 2px solid var(--et-accent); outline-offset: 2px; }
.et-btn:disabled { opacity: .45; cursor: not-allowed; transform: none; }

.et-btn--primary {
    background: var(--et-accent);
    border-color: var(--et-accent);
    color: #fff;
    box-shadow: 0 6px 18px -8px var(--et-accent);
}

.et-btn--primary:hover { color: #fff; filter: brightness(1.08); }
.et-btn--primary:disabled { filter: none; }

.et-btn--danger:hover {
    border-color: var(--et-err);
    color: var(--et-err);
}

.et-btn--lg {
    padding: 13px 26px;
    font-size: 16px;
    border-radius: 14px;
}

/* ============ 弹窗 ============ */
.et-modal {
    position: fixed;
    inset: 0;
    z-index: 100;
    display: grid;
    place-items: center;
    padding: 24px;
    background: rgba(2, 6, 23, .55);
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    animation: et-fade .18s ease;
}

.et-modal__panel {
    width: min(680px, 94vw);
    max-height: 86vh;
    max-height: 86dvh;
    display: flex;
    flex-direction: column;
    background: var(--et-surface);
    border: 1px solid var(--et-line);
    border-radius: 16px;
    box-shadow: var(--et-shadow-lg);
    animation: et-pop .2s cubic-bezier(.34, 1.4, .64, 1);
    overflow: hidden;
}

.et-modal__panel--narrow { width: min(460px, 92vw); }
.et-modal__panel--wide { width: min(900px, 94vw); }

.et-modal__head {
    flex: none;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 16px 20px;
    border-bottom: 1px solid var(--et-line);
    font-weight: 800;
    font-size: 15px;
}

.et-modal__head .et-icon-btn {
    margin-left: auto;
    width: 32px;
    height: 32px;
}

.et-modal__body {
    flex: 1;
    min-height: 0;
    overflow: auto;
    padding: 18px 20px;
}

.et-modal__foot {
    flex: none;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 14px 20px;
    border-top: 1px solid var(--et-line);
    background: var(--et-surface-2);
}

.et-modal__foot .spacer { flex: 1; }

@keyframes et-fade {
    from { opacity: 0; }
}

@keyframes et-pop {
    from { opacity: 0; transform: translateY(14px) scale(.97); }
}

/* ============ 轻提示（toast） ============ */
.et-toast {
    position: fixed;
    left: 50%;
    bottom: 56px;
    transform: translateX(-50%) translateY(10px);
    z-index: 120;
    display: flex;
    align-items: center;
    gap: 9px;
    max-width: min(520px, 88vw);
    padding: 11px 18px;
    border-radius: 12px;
    font-size: 13.5px;
    font-weight: 600;
    color: #fff;
    background: rgba(15, 23, 42, .92);
    border: 1px solid rgba(148, 163, 184, .25);
    box-shadow: var(--et-shadow-lg);
    opacity: 0;
    pointer-events: none;
    transition: opacity .22s, transform .22s;
}

.et-toast.is-show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
}

.et-toast[data-tone="ok"] { background: rgba(5, 150, 105, .95); }
.et-toast[data-tone="err"] { background: rgba(220, 38, 38, .95); }
.et-toast[data-tone="warn"] { background: rgba(217, 119, 6, .95); }

/* ============ 设置抽屉（右上角入口，edupick 交互） ============ */
.et-drawer-backdrop {
    position: fixed;
    inset: 0;
    z-index: 90;
    background: rgba(2, 6, 23, .45);
    backdrop-filter: blur(3px);
    -webkit-backdrop-filter: blur(3px);
    opacity: 0;
    transition: opacity .2s;
}

.et-drawer-backdrop.is-open { opacity: 1; }

.et-drawer {
    position: absolute;
    top: 0;
    right: 0;
    height: 100%;
    width: min(400px, 92vw);
    display: flex;
    flex-direction: column;
    background: var(--et-surface);
    border-left: 1px solid var(--et-line);
    box-shadow: var(--et-shadow-lg);
    transform: translateX(100%);
    transition: transform .22s cubic-bezier(.32, .72, .35, 1);
}

.et-drawer-backdrop.is-open .et-drawer { transform: translateX(0); }

.et-drawer__head {
    flex: none;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 15px 18px;
    border-bottom: 1px solid var(--et-line);
    font-weight: 800;
    font-size: 15px;
    color: var(--et-accent);
}

.et-drawer__head .et-icon-btn {
    margin-left: auto;
    width: 32px;
    height: 32px;
}

.et-drawer__body {
    flex: 1;
    min-height: 0;
    overflow: auto;
    padding: 16px 18px 24px;
}

/* 抽屉内容通用小节（工具复用） */
.et-drawer__body h4 {
    margin: 18px 0 8px;
    font-size: 12px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: .08em;
    color: var(--et-muted);
}

.et-drawer__body h4:first-child { margin-top: 0; }

.et-drawer__row {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
}

.et-drawer__tip {
    margin: 8px 0 0;
    font-size: 12px;
    line-height: 1.8;
    color: var(--et-muted);
}

.et-drawer__tip b { color: var(--et-fg); }

.et-drawer__input {
    flex: 1;
    min-width: 0;
    padding: 9px 12px;
    border: 1px solid var(--et-line-strong);
    border-radius: 9px;
    background: var(--et-surface-2);
    color: var(--et-fg);
    font: inherit;
    font-size: 13.5px;
    transition: border-color .14s, box-shadow .14s;
}

.et-drawer__input:focus {
    outline: none;
    border-color: var(--et-accent);
    box-shadow: 0 0 0 3px var(--et-accent-weak);
}

.et-drawer__switch {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 10px 0;
    border-bottom: 1px dashed var(--et-line);
    font-size: 13.5px;
    font-weight: 600;
    color: var(--et-fg);
    cursor: pointer;
    user-select: none;
}

.et-drawer__switch input {
    width: 17px;
    height: 17px;
    accent-color: var(--et-accent);
    cursor: pointer;
}
</style>

<body class="et-app">

<header id="et-topbar"></header>

<main id="et-main" class="cd-main">

    <div class="cd-modes" id="segMode" role="group" aria-label="计时模式">

/*!

 *
 * 共享逻辑源。改这里，然后跑：python scripts/sync_shared.py
 * 依赖：无。
 * 全局：ET.Countdown
 *
 * 用法：
 *   var timer = ET.Countdown.create({
 *     onTick: function (remaining, total) { … },   // 毫秒，remaining ≤ 0 表示结束
 *     onFinish: function () { … },
 *     onState: function (state) { … }              // 'idle' | 'running' | 'paused' | 'done'
 *   });
 *   timer.set(5 * 60 * 1000);  // 设置总时长（idle 态下）
 *   timer.start(); timer.pause(); timer.resume(); timer.toggle(); timer.reset();
 *   timer.add(30 * 1000);      // 运行中 +30s（可为负，最低减到 0）
 *   timer.state; timer.remaining; timer.total;
 *
 * 特性：
 * - 用 endAt 绝对时间计算剩余，后台标签页休眠后回来不漂移
 * - 触发粒度 100ms，回调里的 remaining 为真实剩余毫秒
 */
(function (global) {
    'use strict';

    var TICK_MS = 100;

    function create(options) {
        var opt = options || {};
        var state = 'idle';          /* idle / running / paused / done */
        var total = 0;               /* 总时长 ms */
        var endAt = 0;               /* 结束绝对时间戳 */
        var remainAtPause = 0;       /* 暂停时刻的剩余 */
        var intervalId = 0;
        var finished = false;

        var api = {};

        function callTick(remaining) {
            if (opt.onTick) { opt.onTick(remaining, total); }
        }

        function callState(s) {
            state = s;
            api.state = s;
            if (opt.onState) { opt.onState(s); }

        function stopLoop() {
            if (intervalId) {
                clearInterval(intervalId);
                intervalId = 0;
            }

            remainAtPause = 0;
            if (!finished) {
                finished = true;
                callState('done');
                if (opt.onFinish) { opt.onFinish(); }
            }
            callTick(0);
        }

        function loop() {
            var remaining = endAt - Date.now();
            if (remaining <= 0) {
                finish();
            } else {
                callTick(remaining);
            }

        /** 设置总时长（仅在非运行态有效） */

            if (state === 'running') { return; }
            total = Math.max(0, Math.round(ms));
            remainAtPause = total;
            finished = false;
            callState(state === 'done' ? 'idle' : state === 'idle' ? 'idle' : 'idle');
            callTick(total);
        };

        api.start = function () {
            if (state === 'running' || total <= 0) { return; }
            finished = false;
            endAt = Date.now() + (state === 'paused' ? remainAtPause : total);
            callState('running');
            loop();
            stopLoop();
            intervalId = setInterval(loop, TICK_MS);
        };

        api.resume = api.start;

        api.pause = function () {
            if (state !== 'running') { return; }
            remainAtPause = Math.max(0, endAt - Date.now());
            stopLoop();
            callState('paused');
            callTick(remainAtPause);
        };

        api.toggle = function () {
            if (state === 'running') { api.pause(); } else { api.start(); }
        };

        api.reset = function () {
            stopLoop();
            remainAtPause = total;
            finished = false;
            callState('idle');
            callTick(total);
        };

        /** 运行/暂停态增减时间；delta 毫秒（可负）。运行中直接推 endAt。 */
        api.add = function (delta) {
            delta = Math.round(delta || 0);
            if (state === 'running') {
                endAt += delta;
                var remaining = endAt - Date.now();
                if (remaining <= 0) { finish(); }
                else { callTick(remaining); }

                var base = state === 'paused' ? remainAtPause : total;
                var next = Math.max(0, base + delta);
                if (state === 'paused') { remainAtPause = next; }
                else { total = next; remainAtPause = next; }
                callTick(next);
            }
            if (state === 'idle' && total === 0 && delta > 0) { total = delta; remainAtPause = delta; }
        };

        Object.defineProperty(api, 'remaining', {
            get: function () {
                if (state === 'running') { return Math.max(0, endAt - Date.now()); }
                if (state === 'paused') { return remainAtPause; }
                if (state === 'done') { return 0; }

    function breakdown(ms) {

 *
 * ┌────────────────────────────────────────────────────────────────┐
 * │ 说明：本模块只做一件事——工具被打开时向上报端点发一条匿名计数。 │
 * │ · 在线（iframe 内）：宿主页面已服务端计数，本模块不重复上报。   │
 * │ · 离线打开（file:// / 下载单文件 / 离线包）：联网条件具备时，   │
 * │   以 sendBeacon 上报 use_offline 事件（text/plain 免预检）。    │
 * │ · 上报端点 = window.ET_SITE_ORIGIN（由宿主注入或离线包配置）。  │
 * │   未配置端点时本模块完全静默，不发任何请求。                    │
 * │ · **整个 <script> 块可安全删除**：删除后工具其余功能完全正常，  │
 * │   且完全不再发起任何网络请求。                                  │
 * └────────────────────────────────────────────────────────────────┘
 */
(function (global) {
    'use strict';

    var ET = global.ET = global.ET || {};

    var Stats = {
        /** 上报端点来源（站点绝对地址，无协议尾斜杠） */
        endpoint: (typeof global.ET_SITE_ORIGIN === 'string' && /^https?:\/\//.test(global.ET_SITE_ORIGIN))
            ? global.ET_SITE_ORIGIN
            : null,

        _done: {},

        /**
         * 上报一次事件（同一事件同一工具每次页面加载只报一次）。
         * event: 'use_offline' 等；toolId: 工具 id。
         */
        send: function (event, toolId) {
            if (!event || this._done[event + ':' + (toolId || '')]) { return false; }
            if (!this.endpoint) { return false; }
            /* iframe 内由宿主统计，避免双计 */
            try {
                if (global.parent && global.parent !== global) { return false; }
            } catch (err) { return false; }
            /* 断网时挂起，网络恢复自动补报一次 */
            if (global.navigator && global.navigator.onLine === false) {
                var self = this;
                global.addEventListener('online', function () { self.send(event, toolId); }, { once: true });
                return false;
            }

            this._done[event + ':' + (toolId || '')] = true;
            var payload = JSON.stringify({ event: event, tool: toolId || '' });

            try {
                if (global.navigator.sendBeacon) {
                    return global.navigator.sendBeacon(
                        this.endpoint + '/api/track',
                        new Blob([payload], { type: 'text/plain;charset=UTF-8' })
                    );
                }
                global.fetch(this.endpoint + '/api/track', {
                    method: 'POST',
                    body: payload,
                    keepalive: true,
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'text/plain;charset=UTF-8' }
                });
                return true;
            } catch (err) {
                return false;
            }
        }
    };

    ET.Stats = Stats;
})(window);
</script>
<!-- /ET:INLINE -->

<!-- 使用统计（模块化：删除上方 et-stats 注入块即可完全不联网，见 README） -->
<script>
try { ET.Stats.send('use_offline', 'countdown-timer'); } catch (e) { /* 静默 */ }
</script>

<script>
(function () {
    'use strict';

    var TOOL_ID = 'countdown-timer';
    var store = ET.store(TOOL_ID);

    var PRESETS = [1, 2, 3, 5, 10, 15, 20, 30]; /* 分钟 */
    var RING_LEN = 2 * Math.PI * 94;
    var WARN_MS = 30 * 1000;   /* <30s 变橙 */
    var DANGER_MS = 10 * 1000; /* <10s 变红 + 滴答 */

    var chrome = ET.Chrome.mount({
        toolId: TOOL_ID,
        title: '课堂倒计时',
        sub: '练习 · 讨论 · 考试',
        accent: '#6366f1',
        status: '就绪',
        sound: true,
        primary: function () { els.btnMain.click(); },   /* 翻页笔 PageDown：开始/暂停 */
        secondary: function () { els.btnReset.click(); }, /* 翻页笔 PageUp：重置 */
        help: '<div style="font-size:13.5px;line-height:2">' +
            '<p style="margin:0 0 8px"><b>两种模式</b>：顶部可切换「倒计时」与「正计时」。倒计时用于限时练习 / 讨论 / 考试；正计时是秒表，用于记录学生完成任务用了多久（朗读、默写、小组汇报等）。</p>' +
            '<p style="margin:0 0 8px"><b>正计时</b>：空格开始 / 暂停，R 清零；可选「到点提醒」——设一个时长，到点响铃 + 变红，适合「超过 3 分钟就提醒」这类场景（↑↓ 可 ±30 秒调整提醒时长）。</p>' +
            '<p style="margin:0 0 8px"><b>快捷键</b>：空格 开始/暂停 · R 重置 · ↑↓ 倒计时 ±30 秒 / 正计时调整提醒。</p>' +
            '<p style="margin:0 0 8px"><b>翻页笔</b>：下页键 开始/暂停 · 上页键 重置（两种模式通用）。</p>' +
            '<p style="margin:0 0 8px"><b>运行中可调</b>：倒计时的 ±30 秒按钮在计时进行中也能用。</p>' +
            '<p style="margin:0 0 8px"><b>警示</b>：倒计时剩 30 秒数字变橙，剩 10 秒变红并每秒滴答，结束时全屏提醒。</p>' +
            '<p style="margin:0"><b>精度</b>：基于系统时钟计算，休眠 / 切页回来不会走快走慢；正计时切到别的标签页也会继续走。</p></div>'
    });

    var els = {
        ring: document.getElementById('ring'),
        timeText: document.getElementById('timeText'),
        timeLabel: document.getElementById('timeLabel'),
        presets: document.getElementById('presets'),
        btnMain: document.getElementById('btnMain'),
        btnMainText: document.getElementById('btnMainText'),
        btnReset: document.getElementById('btnReset'),
        btnPlus30: document.getElementById('btnPlus30'),
        btnMinus30: document.getElementById('btnMinus30'),
        inHour: document.getElementById('inHour'),
        inMin: document.getElementById('inMin'),
        inSec: document.getElementById('inSec'),
        btnCustom: document.getElementById('btnCustom'),
        segMode: document.getElementById('segMode'),
        customRow: document.getElementById('customRow'),
        upRemindRow: document.getElementById('upRemindRow'),
        inRemindMin: document.getElementById('inRemindMin'),
        inRemindSec: document.getElementById('inRemindSec'),
        btnRemind: document.getElementById('btnRemind'),
        btnRemindClear: document.getElementById('btnRemindClear'),
        remindState: document.getElementById('remindState')
    };

    var lastMinutes = store.get('last_minutes', 5);
    var mode = store.get('mode', 'down') === 'up' ? 'up' : 'down';

    var timer = ET.Countdown.create({
        onTick: onTick,
        onFinish: onFinish,
        onState: onState
    });

    var lastWholeSecond = -1;
    var overShown = false;

    /* ============ 正计时（秒表） ============ */

    var up = {
        running: false,
        startedAt: 0,
        acc: 0,
        timerId: 0,
        target: Math.max(0, Number(store.get('up_target', 0)) || 0),
        fired: false
    };

    function upElapsed() {
        return up.acc + (up.running ? Date.now() - up.startedAt : 0);
    }

    function swapMainIcon(playing) {
        var icon = els.btnMain.querySelector('use');
        if (!icon) { return; }
        var iconId = playing ? '#i-pause' : '#i-play';
        icon.setAttribute('href', iconId);
        icon.setAttributeNS('http://www.w3.org/1999/xlink', 'xlink:href', iconId); /* et-allow-external SVG 命名空间 */
    }

    function upSyncButton() {
        els.btnMainText.textContent = up.running ? '暂停' : (upElapsed() > 0 ? '继续' : '开始');
        swapMainIcon(up.running);
    }

    function renderRemindState() {
        els.remindState.textContent = up.target > 0
            ? '当前提醒：' + ET.Countdown.format(up.target)
            : '未设提醒';
    }

    function upRender() {
        var el = upElapsed();
        els.timeText.textContent = ET.Countdown.format(el);

        var over = up.target > 0 && el >= up.target;
        var near = up.target > 0 && !over && el >= up.target * 0.8;

        var cls = 'cd-time__text';
        if (over) { cls += ' is-danger cd-pulse'; }
        else if (near) { cls += ' is-warning'; }
        if (els.timeText.className !== cls) { els.timeText.className = cls; }

        var ratio = up.target > 0
            ? Math.max(0, Math.min(1, el / up.target))
            : (el % 60000) / 60000;
        els.ring.style.strokeDasharray = RING_LEN.toFixed(1);
        els.ring.style.strokeDashoffset = (RING_LEN * (1 - ratio)).toFixed(1);
        els.ring.setAttribute('class', 'cd-ring' + (over ? ' is-danger' : (near ? ' is-warning' : '')));

        els.timeLabel.textContent = over ? '已超过提醒时长'
            : (up.running ? '计时中' : (el > 0 ? '已暂停' : '准备开始'));

        if (over && !up.fired) {
            up.fired = true;
            chrome.beep('over');
            chrome.toast('正计时已到 ' + ET.Countdown.format(up.target) + '，注意控制时间', 'warn');
        }
        chrome.setStatus('正计时 · ' + ET.Countdown.format(el), over ? 'warn' : undefined);

        upSyncButton();
        if (up.running) { up.timerId = window.setTimeout(upRender, 200); }
    }

    function upToggle() {
        if (up.running) {
            up.acc = upElapsed();
            up.running = false;
            window.clearTimeout(up.timerId);
            upRender();
            return;
        }
        up.running = true;
        up.startedAt = Date.now();
        upRender();
    }

    function upReset() {
        up.running = false;
        window.clearTimeout(up.timerId);
        up.acc = 0;
        up.fired = false;
        upRender();
    }

    function upSetTarget(ms) {
        up.target = Math.max(0, Math.round(ms));
        up.fired = up.target > 0 && upElapsed() >= up.target;
        store.set('up_target', up.target);
        renderRemindState();
        upRender();
    }

    function applyModeUi() {
        var btns = els.segMode.querySelectorAll('button');
        for (var i = 0; i < btns.length; i++) {
            btns[i].classList.toggle('is-active', btns[i].getAttribute('data-mode') === mode);
        }
        var upOnly = mode === 'up';
        els.presets.classList.toggle('cd-hidden', upOnly);
        els.customRow.classList.toggle('cd-hidden', upOnly);
        els.upRemindRow.classList.toggle('cd-hidden', !upOnly);
        els.btnPlus30.classList.toggle('cd-hidden', upOnly);
        els.btnMinus30.classList.toggle('cd-hidden', upOnly);
    }

    function setMode(next, announce) {
        next = next === 'up' ? 'up' : 'down';
        if (next === mode) { return; }
        /* 切换时把另一侧计时停下，避免两个表同时跑 */
        if (mode === 'up') {
            up.running = false;
            window.clearTimeout(up.timerId);
            up.acc = 0;
        } else if (timer.state === 'running') {
            timer.pause();
        }
        mode = next;
        store.set('mode', mode);
        applyModeUi();

        if (mode === 'up') {
            upReset();
            chrome.setStatus('正计时 · 准备开始');
        } else {
            timer.reset();
            renderPresets();
        }
        if (announce) {
            chrome.beep('ok');
            chrome.toast(mode === 'up' ? '已切到正计时：空格开始，可设到点提醒' : '已切到倒计时');
        }
    }

    /* ============ 渲染 ============ */

    function renderPresets() {
        els.presets.textContent = '';
        PRESETS.forEach(function (min) {
            var b = document.createElement('button');
            b.className = 'cd-preset' + (timer.total === min * 60000 ? ' is-active' : '');
            b.type = 'button';
            b.textContent = min + ' 分钟';
            b.addEventListener('click', function () {
                if (timer.state === 'running') { return; }
                lastMinutes = min;
                store.set('last_minutes', min);
                timer.set(min * 60000);
                renderPresets();
                chrome.toast('已设定 ' + min + ' 分钟');
            });
            els.presets.appendChild(b);
        });
    }

    function onTick(remaining, total) {
        var fmt = ET.Countdown.format(remaining);
        var b = ET.Countdown.breakdown(remaining);

        var cls = 'cd-time__text';
        if (remaining > 0 && remaining <= DANGER_MS) { cls += ' is-danger cd-pulse'; }
        else if (remaining > 0 && remaining <= WARN_MS) { cls += ' is-warning'; }
        if (els.timeText.className !== cls) { els.timeText.className = cls; }
        els.timeText.textContent = fmt;

        /* 进度环 */
        var ratio = total > 0 ? Math.max(0, Math.min(1, remaining / total)) : 0;
        els.ring.style.strokeDasharray = RING_LEN.toFixed(1);
        els.ring.style.strokeDashoffset = (RING_LEN * (1 - ratio)).toFixed(1);
        /* SVG 元素 className 只读，必须用 setAttribute */
        els.ring.setAttribute('class', 'cd-ring' +
            (remaining > 0 && remaining <= DANGER_MS ? ' is-danger'
                : remaining > 0 && remaining <= WARN_MS ? ' is-warning' : ''));

        /* 最后 10 秒每秒滴答 */
        var whole = Math.ceil(remaining / 1000);
        if (remaining > 0 && remaining <= DANGER_MS && whole !== lastWholeSecond) {
            lastWholeSecond = whole;
            chrome.beep('tick');
        }

        if (timer.state === 'running') {
            chrome.setStatus('剩余 ' + fmt);
        }
    }

    function onState(s) {
        var playing = s === 'running';
        els.btnMainText.textContent = s === 'paused' ? '继续'
            : playing ? '暂停'
            : (s === 'done' ? '再 来' : '开始');
        var icon = els.btnMain.querySelector('use');
        var iconId = playing ? '#i-pause' : '#i-play';
        icon.setAttribute('href', iconId);
        icon.setAttributeNS('http://www.w3.org/1999/xlink', 'xlink:href', iconId); /* et-allow-external SVG 命名空间 */

        els.timeLabel.textContent = s === 'running' ? '计时中'
            : s === 'paused' ? '已暂停'
            : s === 'done' ? '时间到'
            : '准备开始';

        renderPresets();

        if (s === 'done') {
            chrome.setStatus('时间到', 'err');
        } else if (s === 'idle') {
            chrome.setStatus('就绪 · ' + ET.Countdown.format(timer.total));
            lastWholeSecond = -1;
        }
    }

    function onFinish() {
        chrome.beep('over');
        if (!overShown) {
            overShown = true;
            var overlay = document.createElement('div');
            overlay.className = 'cd-over';
            overlay.innerHTML = '<div style="text-align:center"><div class="cd-over__text">时间到</div></div>' +
                '<div class="cd-over__hint">点击任意处关闭</div>';
            overlay.addEventListener('click', function () {
                if (overlay.parentNode) { overlay.parentNode.removeChild(overlay); }
                overShown = false;
            });
            document.body.appendChild(overlay);
        }
    }

    /* ============ 事件 ============ */

    els.btnMain.addEventListener('click', function () {
        if (mode === 'up') {
            upToggle();
            chrome.beep('ok');
            return;
        }
        if (timer.state === 'idle' && timer.total <= 0) {
            timer.set(lastMinutes * 60000);
        }
        if (timer.state === 'done') {
            timer.reset();
            overShown = false;
            var overlay = document.querySelector('.cd-over');
            if (overlay && overlay.parentNode) { overlay.parentNode.removeChild(overlay); }
        }
        timer.toggle();
        chrome.beep('ok');
    });

    els.btnReset.addEventListener('click', function () {
        if (mode === 'up') {
            upReset();
            chrome.beep('ok');
            chrome.toast('已清零，可重新开始计时');
            return;
        }
        overShown = false;
        var overlay = document.querySelector('.cd-over');
        if (overlay && overlay.parentNode) { overlay.parentNode.removeChild(overlay); }
        timer.reset();
        chrome.beep('ok');
    });

    els.btnPlus30.addEventListener('click', function () { timer.add(30000); });
    els.btnMinus30.addEventListener('click', function () { timer.add(-30000); });

    els.segMode.addEventListener('click', function (ev) {
        var v = ev.target && ev.target.getAttribute ? ev.target.getAttribute('data-mode') : null;
        if (v) { setMode(v, true); }
    });

    els.btnRemind.addEventListener('click', function () {
        var m = Math.max(0, Math.min(180, Number(els.inRemindMin.value) || 0));
        var s = Math.max(0, Math.min(59, Number(els.inRemindSec.value) || 0));
        var ms = (m * 60 + s) * 1000;
        if (ms <= 0) {
            chrome.toast('请输入大于 0 的提醒时长，或点「取消」关闭提醒', 'warn');
            return;
        }
        upSetTarget(ms);
        chrome.beep('ok');
        chrome.toast('已设到点提醒：' + ET.Countdown.format(ms));
    });

    els.btnRemindClear.addEventListener('click', function () {
        upSetTarget(0);
        els.inRemindMin.value = '';
        els.inRemindSec.value = '';
        chrome.beep('tick');
        chrome.toast('已取消到点提醒');
    });

    els.btnCustom.addEventListener('click', function () {
        if (timer.state === 'running') { chrome.toast('请先暂停再调整时长', 'warn'); return; }
        var h = Math.max(0, Math.min(23, Number(els.inHour.value) || 0));
        var m = Math.max(0, Math.min(59, Number(els.inMin.value) || 0));
        var s = Math.max(0, Math.min(59, Number(els.inSec.value) || 0));
        var ms = (h * 3600 + m * 60 + s) * 1000;
        if (ms <= 0) { chrome.toast('请输入大于 0 的时长', 'warn'); return; }
        timer.set(ms);
        renderPresets();
        chrome.beep('ok');
        chrome.setStatus('就绪 · ' + ET.Countdown.format(ms));
    });

    document.addEventListener('keydown', function (ev) {
        var tag = (document.activeElement && document.activeElement.tagName) || '';
        var inInput = tag === 'INPUT' || tag === 'TEXTAREA';
        if (document.querySelector('.et-modal')) { return; }

        if (ev.key === ' ' && !inInput) {
            ev.preventDefault();
            els.btnMain.click();
        } else if ((ev.key === 'r' || ev.key === 'R') && !inInput) {
            ev.preventDefault();
            els.btnReset.click();
        } else if (ev.key === 'ArrowUp' && !inInput) {
            ev.preventDefault();
            if (mode === 'up') { upSetTarget(up.target + 30000); } else { timer.add(30000); }
        } else if (ev.key === 'ArrowDown' && !inInput) {
            ev.preventDefault();
            if (mode === 'up') { upSetTarget(Math.max(0, up.target - 30000)); } else { timer.add(-30000); }
        }
    });

    /* ============ 启动 ============ */
    els.ring.style.strokeDasharray = RING_LEN.toFixed(1);
    els.ring.style.strokeDashoffset = '0';
    timer.set(lastMinutes * 60000);
    renderPresets();
    renderRemindState();
    applyModeUi();
    if (mode === 'up') {
        upRender();
    } else {
        timer.set(lastMinutes * 60000);
    }
})();
</script>
