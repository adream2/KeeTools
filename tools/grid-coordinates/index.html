/*!
 * et-chrome.css — 工具通用外壳样式（顶栏 / 页脚 / 弹窗 / 按钮 / 主题）
 *
 * 共享样式源。改这里，然后跑：python scripts/sync_shared.py
 * 所有类名带 et- 前缀，避免与工具自身样式冲突。
 * 依赖：无外部资源；颜色全部为令牌变量。
 */

/* ============ 设计令牌 ============ */
:root {
    --et-accent: #2563eb;
    --et-accent-weak: rgba(37, 99, 235, .14);
    --et-bg: #f4f6fb;
    --et-surface: #ffffff;
    --et-surface-2: #f8fafc;
    --et-fg: #0b1220;
    --et-muted: #64748b;
    --et-line: rgba(15, 23, 42, .12);
    --et-line-strong: rgba(15, 23, 42, .22);
    --et-glass: rgba(255, 255, 255, .85);
    --et-shadow-md: 0 10px 28px -18px rgba(15, 23, 42, .3);
    --et-shadow-lg: 0 24px 60px -32px rgba(15, 23, 42, .4);
    --et-ok: #059669;
    --et-warn: #d97706;
    --et-err: #dc2626;
    --et-radius: 12px;
    --et-radius-sm: 9px;
    --et-font: -apple-system, BlinkMacSystemFont, "Segoe UI",
               "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei",
               "Noto Sans SC", sans-serif;
    --et-mono: ui-monospace, "Cascadia Mono", Consolas, Menlo, monospace;
}

html[data-et-theme="dark"] {
    --et-bg: #0b1120;
    --et-surface: #111a2e;
    --et-surface-2: #0f1729;
    --et-fg: #f1f5f9;
    --et-muted: #94a3b8;
    --et-line: rgba(148, 163, 184, .18);
    --et-line-strong: rgba(148, 163, 184, .3);
    --et-glass: rgba(17, 26, 46, .85);
    --et-shadow-md: 0 10px 34px -18px rgba(0, 0, 0, .8);
    --et-shadow-lg: 0 24px 70px -30px rgba(0, 0, 0, .9);
    --et-ok: #34d399;
    --et-warn: #fbbf24;
    --et-err: #f87171;
}

/* ============ 基础 ============ */

/* body 作为外壳时必须清掉浏览器默认 8px 外边距，
   否则 iframe 预览中文档会比视口高 16px（底部白边 + 多余滚动） */
body.et-app {
    margin: 0;
}

.et-app {
    position: relative;
    isolation: isolate;
    display: flex;
    flex-direction: column;
    height: 100vh;
    height: 100dvh;
    overflow: hidden;
    background: var(--et-bg);
    color: var(--et-fg);
    font-family: var(--et-font);
    -webkit-font-smoothing: antialiased;
    transition: background .25s, color .25s;
}

/* 极光背景：径向渐变 + 呼吸动画（edupick 品质基线，老内核也不掉帧） */
.et-app::before {
    content: '';
    position: fixed;
    inset: 0;
    z-index: -1;
    pointer-events: none;
    background:
        radial-gradient(46% 40% at 20% 18%, var(--et-accent-weak), transparent 65%),
        radial-gradient(42% 38% at 82% 24%, var(--et-accent-weak), transparent 70%),
        radial-gradient(50% 44% at 55% 95%, rgba(16, 185, 129, .10), transparent 65%);
    animation: et-aurora 16s ease-in-out infinite alternate;
}

@keyframes et-aurora {
    from { opacity: .55; transform: scale(1); }
    to { opacity: 1; transform: scale(1.06); }
}

.et-app *,
.et-app *::before,
.et-app *::after { box-sizing: border-box; }

[hidden] { display: none !important; }

.et-icon {
    width: 18px;
    height: 18px;
    fill: none;
    stroke: currentColor;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
    flex: none;
}

/* ============ 顶栏 ============ */
.et-topbar {
    flex: none;
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 11px 20px;
    border-bottom: 1px solid var(--et-line);
    background: var(--et-glass);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    z-index: 20;
}

.et-brand {
    display: flex;
    align-items: center;
    gap: 10px;
    min-width: 0;
}

.et-brand__dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: var(--et-accent);
    box-shadow: 0 0 0 4px var(--et-accent-weak);
    flex: none;
}

.et-brand__name {
    font-weight: 800;
    font-size: 15px;
    letter-spacing: -.01em;
    white-space: nowrap;
}

.et-brand__sub {
    font-size: 12.5px;
    color: var(--et-muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.et-status {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 5px 14px;
    border-radius: 999px;
    font-size: 12.5px;
    color: var(--et-muted);
    background: var(--et-surface-2);
    border: 1px solid var(--et-line);
    white-space: nowrap;
    max-width: 42vw;
    overflow: hidden;
    text-overflow: ellipsis;
}

.et-status__dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--et-ok);
    flex: none;
    transition: background .2s;
}

.et-status[data-tone="err"] .et-status__dot { background: var(--et-err); }
.et-status[data-tone="warn"] .et-status__dot { background: var(--et-warn); }

.et-actions {
    display: flex;
    align-items: center;
    gap: 7px;
}

.et-icon-btn {
    display: inline-grid;
    place-items: center;
    width: 38px;
    height: 38px;
    font-size: 16px;
    line-height: 1;
    border-radius: 11px;
    border: 1px solid var(--et-line);
    background: var(--et-surface-2);
    color: var(--et-fg);
    cursor: pointer;
    transition: transform .14s, border-color .14s, color .14s, opacity .14s;
    -webkit-tap-highlight-color: transparent;
}

.et-icon-btn:hover {
    border-color: var(--et-accent);
    color: var(--et-accent);
    transform: translateY(-1px);
}

.et-icon-btn:active { transform: translateY(0); }
.et-icon-btn.is-off { opacity: .4; }
.et-icon-btn:focus-visible { outline: 2px solid var(--et-accent); outline-offset: 2px; }

/* ============ 主区默认 ============ */
.et-main {
    flex: 1;
    min-height: 0;
    position: relative;
    overflow: auto;
}

/* ============ 页脚（品牌回流 L2） ============ */
.et-footer {
    flex: none;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 7px 16px;
    font-size: 12px;
    color: var(--et-muted);
    border-top: 1px solid var(--et-line);
    background: var(--et-glass);
    user-select: none;
    z-index: 20;
}

.et-footer a {
    color: inherit;
    text-decoration: none;
    transition: color .14s;
}

.et-footer a:hover { color: var(--et-accent); }

/* ============ 按钮 ============ */
.et-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
    padding: 9px 16px;
    border-radius: 11px;
    font: inherit;
    font-size: 13.5px;
    font-weight: 700;
    border: 1px solid var(--et-line);
    background: var(--et-surface-2);
    color: var(--et-fg);
    cursor: pointer;
    transition: transform .14s, border-color .14s, color .14s, background .14s, box-shadow .14s;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
}

.et-btn:hover {
    border-color: var(--et-accent);
    color: var(--et-accent);
    transform: translateY(-1px);
}

.et-btn:active { transform: translateY(0); }
.et-btn:focus-visible { outline: 2px solid var(--et-accent); outline-offset: 2px; }
.et-btn:disabled { opacity: .45; cursor: not-allowed; transform: none; }

.et-btn--primary {
    background: var(--et-accent);
    border-color: var(--et-accent);
    color: #fff;
    box-shadow: 0 6px 18px -8px var(--et-accent);
}

.et-btn--primary:hover { color: #fff; filter: brightness(1.08); }
.et-btn--primary:disabled { filter: none; }

.et-btn--danger:hover {
    border-color: var(--et-err);
    color: var(--et-err);
}

.et-btn--lg {
    padding: 13px 26px;
    font-size: 16px;
    border-radius: 14px;
}

/* ============ 弹窗 ============ */
.et-modal {
    position: fixed;
    inset: 0;
    z-index: 100;
    display: grid;
    place-items: center;
    padding: 24px;
    background: rgba(2, 6, 23, .55);
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    animation: et-fade .18s ease;
}

.et-modal__panel {
    width: min(680px, 94vw);
    max-height: 86vh;
    max-height: 86dvh;
    display: flex;
    flex-direction: column;
    background: var(--et-surface);
    border: 1px solid var(--et-line);
    border-radius: 16px;
    box-shadow: var(--et-shadow-lg);
    animation: et-pop .2s cubic-bezier(.34, 1.4, .64, 1);
    overflow: hidden;
}

.et-modal__panel--narrow { width: min(460px, 92vw); }
.et-modal__panel--wide { width: min(900px, 94vw); }

.et-modal__head {
    flex: none;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 16px 20px;
    border-bottom: 1px solid var(--et-line);
    font-weight: 800;
    font-size: 15px;
}

.et-modal__head .et-icon-btn {
    margin-left: auto;
    width: 32px;
    height: 32px;
}

.et-modal__body {
    flex: 1;
    min-height: 0;
    overflow: auto;
    padding: 18px 20px;
}

.et-modal__foot {
    flex: none;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 14px 20px;
    border-top: 1px solid var(--et-line);
    background: var(--et-surface-2);
}

.et-modal__foot .spacer { flex: 1; }

@keyframes et-fade {
    from { opacity: 0; }
}

@keyframes et-pop {
    from { opacity: 0; transform: translateY(14px) scale(.97); }
}

/* ============ 轻提示（toast） ============ */
.et-toast {
    position: fixed;
    left: 50%;
    bottom: 56px;
    transform: translateX(-50%) translateY(10px);
    z-index: 120;
    display: flex;
    align-items: center;
    gap: 9px;
    max-width: min(520px, 88vw);
    padding: 11px 18px;
    border-radius: 12px;
    font-size: 13.5px;
    font-weight: 600;
    color: #fff;
    background: rgba(15, 23, 42, .92);
    border: 1px solid rgba(148, 163, 184, .25);
    box-shadow: var(--et-shadow-lg);
    opacity: 0;
    pointer-events: none;
    transition: opacity .22s, transform .22s;
}

.et-toast.is-show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
}

.et-toast[data-tone="ok"] { background: rgba(5, 150, 105, .95); }
.et-toast[data-tone="err"] { background: rgba(220, 38, 38, .95); }
.et-toast[data-tone="warn"] { background: rgba(217, 119, 6, .95); }

/* ============ 设置抽屉（右上角入口，edupick 交互） ============ */
.et-drawer-backdrop {
    position: fixed;
    inset: 0;
    z-index: 90;
    background: rgba(2, 6, 23, .45);
    backdrop-filter: blur(3px);
    -webkit-backdrop-filter: blur(3px);
    opacity: 0;
    transition: opacity .2s;
}

.et-drawer-backdrop.is-open { opacity: 1; }

.et-drawer {
    position: absolute;
    top: 0;
    right: 0;
    height: 100%;
    width: min(400px, 92vw);
    display: flex;
    flex-direction: column;
    background: var(--et-surface);
    border-left: 1px solid var(--et-line);
    box-shadow: var(--et-shadow-lg);
    transform: translateX(100%);
    transition: transform .22s cubic-bezier(.32, .72, .35, 1);
}

.et-drawer-backdrop.is-open .et-drawer { transform: translateX(0); }

.et-drawer__head {
    flex: none;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 15px 18px;
    border-bottom: 1px solid var(--et-line);
    font-weight: 800;
    font-size: 15px;
    color: var(--et-accent);
}

.et-drawer__head .et-icon-btn {
    margin-left: auto;
    width: 32px;
    height: 32px;
}

.et-drawer__body {
    flex: 1;
    min-height: 0;
    overflow: auto;
    padding: 16px 18px 24px;
}

/* 抽屉内容通用小节（工具复用） */
.et-drawer__body h4 {
    margin: 18px 0 8px;
    font-size: 12px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: .08em;
    color: var(--et-muted);
}

.et-drawer__body h4:first-child { margin-top: 0; }

.et-drawer__row {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
}

.et-drawer__tip {
    margin: 8px 0 0;
    font-size: 12px;
    line-height: 1.8;
    color: var(--et-muted);
}

.et-drawer__tip b { color: var(--et-fg); }

.et-drawer__input {
    flex: 1;
    min-width: 0;
    padding: 9px 12px;
    border: 1px solid var(--et-line-strong);
    border-radius: 9px;
    background: var(--et-surface-2);
    color: var(--et-fg);
    font: inherit;
    font-size: 13.5px;
    transition: border-color .14s, box-shadow .14s;
}

.et-drawer__input:focus {
    outline: none;
    border-color: var(--et-accent);
    box-shadow: 0 0 0 3px var(--et-accent-weak);
}

.et-drawer__switch {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 10px 0;
    border-bottom: 1px dashed var(--et-line);
    font-size: 13.5px;
    font-weight: 600;
    color: var(--et-fg);
    cursor: pointer;
    user-select: none;
}

.et-drawer__switch input {
    width: 17px;
    height: 17px;
    accent-color: var(--et-accent);
    cursor: pointer;
}
</style>

<style>
/* ── 工具自身样式：自包含，不引用任何外部资源 ── */
:root {
    --gc-accent: #0891b2;
    --gc-line: #94a3b8;
    --gc-cell: #ffffff;

}

}

.gc-seg button + button { border-left: 1px solid var(--et-line); }

.gc-board {
    flex: none;

.gc-label {

    font-weight: 800;
    color: var(--et-fg);
    font-variant-numeric: tabular-nums;

.gc-cell.is-picked {
    background: var(--gc-pick);

}

.gc-cell.is-dug { background: var(--gc-dug); }

.gc-cell.is-treasure {

.gc-cell .gc-dot {

        function onKey(ev) {
            if (ev.key === 'Escape') { ev.stopPropagation(); close(); }
        }
        document.addEventListener('keydown', onKey);
        backdrop.addEventListener('mousedown', function (ev) {
            if (ev.target === backdrop) { close(); }
        });

        if (typeof build === 'function') {
            /* 兼容两种约定：build 自己往 body 里塞内容，或 return 一个元素节点 */
            var ret = build(body, { close: close });
            if (ret && ret.nodeType === 1 && ret.parentNode !== body) {
                body.appendChild(ret);
            }
        }
        return { body: body, close: close };
    }

    /* ---------- 通用弹窗 / toast（同时挂模块级，供其他共享组件使用） ---------- */

    function modal(mo) {
        var backdrop = el('div', 'et-modal');
        var panel = el('div', 'et-modal__panel' + (mo.size === 'narrow' ? ' et-modal__panel--narrow'
            : mo.size === 'wide' ? ' et-modal__panel--wide' : ''));
        var head = el('div', 'et-modal__head');
        if (mo.icon) { head.appendChild(makeIcon(mo.icon)); }
        head.appendChild(el('span', null, mo.title || ''));
        head.appendChild(makeBtn('i-x', '关闭', close));
        panel.appendChild(head);

        var body = el('div', 'et-modal__body');
        if (typeof mo.body === 'string') { body.innerHTML = mo.body; }
        else if (mo.body) { body.appendChild(mo.body); }
        panel.appendChild(body);

        var foot = null;
        if (mo.buttons && mo.buttons.length) {
            foot = el('div', 'et-modal__foot');
            foot.appendChild(el('span', 'spacer'));
            mo.buttons.forEach(function (b) {
                var btn = el('button', 'et-btn' + (b.primary ? ' et-btn--primary' : '') + (b.danger ? ' et-btn--danger' : ''), b.label);
                btn.type = 'button';
                btn.addEventListener('click', function () {
                    if (b.onClick) { b.onClick(close); } else { close(); }
                });
                foot.appendChild(btn);
            });
            panel.appendChild(foot);
        }

        backdrop.appendChild(panel);
        document.body.appendChild(backdrop);

        function close() {
            if (backdrop.parentNode) { backdrop.parentNode.removeChild(backdrop); }
            document.removeEventListener('keydown', onKey);
            if (mo.onClose) { mo.onClose(); }
        }
        function onKey(ev) {
            if (ev.key === 'Escape') { ev.stopPropagation(); close(); }
        }
        document.addEventListener('keydown', onKey);
        backdrop.addEventListener('mousedown', function (ev) {

        toastTimer = setTimeout(function () { toastEl.classList.remove('is-show'); }, 2200);

                theme_color: accent || '#2563eb',
                icons: [{ src: iconUri, sizes: 'any', type: 'image/svg+xml', purpose: 'any' }]
            };
            var blob = new Blob([JSON.stringify(mf)], { type: 'application/manifest+json' });

        document.addEventListener('fullscreenchange', function () {

        });
        document.addEventListener('webkitfullscreenchange', function () {

        syncFsIcon(false);

        api.toggleFullscreen = toggleFullscreen;

        var siteOrigin = typeof global.ET_SITE_ORIGIN === 'string' && /^https?:\/\//.test(global.ET_SITE_ORIGIN)
            ? global.ET_SITE_ORIGIN

        try {

            }
        } catch (err) { /* 跨域异常忽略 */ }

        global.addEventListener('message', function (ev) {

<script>
  /* 此块由 scripts/sync_shared.py 自动注入，请勿手工修改 */
/*!
 * et-stats.js — 使用统计模块（模块化，可整体移除）
 *
 * 共享逻辑源。改这里，然后跑：python scripts/sync_shared.py
 * 依赖：无（可脱离 et-util / et-chrome 独立运行）。
 * 全局：ET.Stats
 *
 * ┌────────────────────────────────────────────────────────────────┐
 * │ 说明：本模块只做一件事——工具被打开时向上报端点发一条匿名计数。 │
 * │ · 在线（iframe 内）：宿主页面已服务端计数，本模块不重复上报。   │
 * │ · 离线打开（file:// / 下载单文件 / 离线包）：联网条件具备时，   │
 * │   以 sendBeacon 上报 use_offline 事件（text/plain 免预检）。    │
 * │ · 上报端点 = window.ET_SITE_ORIGIN（由宿主注入或离线包配置）。  │
 * │   未配置端点时本模块完全静默，不发任何请求。                    │
 * │ · **整个 <script> 块可安全删除**：删除后工具其余功能完全正常，  │
 * │   且完全不再发起任何网络请求。                                  │
 * └────────────────────────────────────────────────────────────────┘
 */
(function (global) {
    'use strict';

    var ET = global.ET = global.ET || {};

    var Stats = {
        /** 上报端点来源（站点绝对地址，无协议尾斜杠） */
        endpoint: (typeof global.ET_SITE_ORIGIN === 'string' && /^https?:\/\//.test(global.ET_SITE_ORIGIN))
            ? global.ET_SITE_ORIGIN
            : null,

        _done: {},

        /**
         * 上报一次事件（同一事件同一工具每次页面加载只报一次）。
         * event: 'use_offline' 等；toolId: 工具 id。
         */
        send: function (event, toolId) {
            if (!event || this._done[event + ':' + (toolId || '')]) { return false; }
            if (!this.endpoint) { return false; }
            /* iframe 内由宿主统计，避免双计 */
            try {
                if (global.parent && global.parent !== global) { return false; }
            } catch (err) { return false; }
            /* 断网时挂起，网络恢复自动补报一次 */
            if (global.navigator && global.navigator.onLine === false) {
                var self = this;
                global.addEventListener('online', function () { self.send(event, toolId); }, { once: true });
                return false;
            }

            this._done[event + ':' + (toolId || '')] = true;
            var payload = JSON.stringify({ event: event, tool: toolId || '' });

            try {
                if (global.navigator.sendBeacon) {
                    return global.navigator.sendBeacon(
                        this.endpoint + '/api/track',
                        new Blob([payload], { type: 'text/plain;charset=UTF-8' })
                    );
                }
                global.fetch(this.endpoint + '/api/track', {
                    method: 'POST',
                    body: payload,
                    keepalive: true,
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'text/plain;charset=UTF-8' }
                });
                return true;
            } catch (err) {
                return false;
            }
        }
    };

    ET.Stats = Stats;
})(window);
</script>

<script>
(function () {
    'use strict';

    var TOOL_ID = 'grid-coordinates';
    var store = ET.store(TOOL_ID);

    var MODES = ['pair', 'seek', 'jump'];
    var MODE_LABEL = { pair: '认识数对', seek: '寻宝游戏', jump: '按数对找格' };
    var SIZES = [5, 6, 8, 10];
    var TREASURES = 3;

    var chrome = ET.Chrome.mount({
        toolId: TOOL_ID,
        title: '数对定位 · 方格寻宝',
        sub: '数学 · 图形与位置 · 用数对确定位置',
        accent: '#0891b2',
        status: '认识数对',
        sound: true,
        primary: resetAll,      /* 翻页笔下页键 = 重新开始 */
        secondary: cycleMode,   /* 翻页笔上页键 = 切换玩法 */
        actions: [
            { icon: 'i-refresh', label: '重新开始', onClick: resetAll }
        ],
        settings: { title: '数对定位 / 设置', build: buildSettings },
        help: '<div style="font-size:13.5px;line-height:2">' +
            '<p style="margin:0 0 8px"><b>认识数对</b>：点任意格子，右侧立刻给出 <b>(列, 行)</b> —— ' +
            '竖着数是<b>列</b>（从左往右），横着数是<b>行</b>（从下往上数是教材常用口径，本表按从上往下标注行号时口径会变，' + 
            '默认<b>从下往上</b>）。先列后行，中间用逗号隔开。</p>' +
            '<p style="margin:0 0 8px"><b>寻宝游戏</b>：盘上藏了 3 个宝箱，点格子挖宝 —— ' +
            '没挖到会提示「离最近的宝藏还有几格」（隔几格 = 横竖走的步数），全班一起分析范围。</p>' +
            '<p style="margin:0 0 8px"><b>按数对找格</b>：输入数对，看谁最快说出这个格子里有什么 —— ' +
            '反向练习「数对 → 位置」。</p>' +
            '<p style="margin:0"><b>快捷键</b>：<b>1</b>/<b>2</b>/<b>3</b> 切换玩法、<b>R</b> 重新开始、<b>P</b> 打印；' +
            '翻页笔下页键 = 重新开始。玩法与盘面保存在本机浏览器。</p></div>'
    });

    var els = {
        seg: document.getElementById('modeSeg'),

    function loadState() {
        var mode = store.get('mode', 'pair');

        var size = parseInt(store.get('size', 6), 10);
        if (SIZES.indexOf(size) < 0) { size = 6; }
        return { mode: mode, size: size };

        store.set('mode', state.mode);
        store.set('size', state.size);

    function isTypingTarget(node) {
        if (!node || !node.tagName) { return false; }
        var tag = node.tagName.toUpperCase();

    function dealTreasures() {
        treasures = [];
        found = [];
        var guard = 0;
        while (treasures.length < TREASURES && guard++ < 200) {
            var c = 1 + Math.floor(Math.random() * state.size);
            var r = 1 + Math.floor(Math.random() * state.size);
            var key = c + ',' + r;
            if (treasures.indexOf(key) < 0) { treasures.push(key); }
        }
    }

    function keyOf(c, r) { return c + ',' + r; }

    function nearestDistance(c, r) {
        var best = Infinity;

            var parts = treasures[i].split(',');

        var n = state.size;
        els.board.innerHTML = '';
        els.board.style.gridTemplateColumns = '2.4em repeat(' + n + ', minmax(0, 1fr))';
        els.board.style.gridTemplateRows = '2.4em repeat(' + n + ', minmax(0, 1fr))';

        /* 左上角空白 + 列号 */
        els.board.appendChild(el('div', 'gc-label', '列'));
        for (var c = 1; c <= n; c++) {
            els.board.appendChild(el('div', 'gc-label', String(c)));
        }
        for (var r = 1; r <= n; r++) {
            els.board.appendChild(el('div', 'gc-label', String(n - r + 1)));  /* 行号从下往上 */
            for (var c2 = 1; c2 <= n; c2++) {
                (function (col, row) {
                    var cell = el('button', 'gc-cell');
                    cell.type = 'button';
                    cell.setAttribute('data-c', String(col));
                    cell.setAttribute('data-r', String(row));
                    var key = keyOf(col, row);
                    var ti = treasures.indexOf(key);
                    var isTreasure = ti >= 0 && found.indexOf(key) >= 0;
                    if (isTreasure) {
                        cell.className += ' is-treasure';
                        cell.appendChild(el('span', 'gc-dot', '💰'));
                    } else if (found.indexOf(key) >= 0) {
                        cell.className += ' is-dug';
                    } else if (picked && picked.c === col && picked.r === row) {
                        cell.className += ' is-picked';
                    }
                    cell.addEventListener('click', function () { onCell(col, row); });
                    els.board.appendChild(cell);
                })(c2, r);
            }
        }
    }

    function pairText(c, r) {
        return '(' + c + ', ' + r + ')';
    }

    function onCell(c, r) {
        picked = { c: c, r: r };
        if (state.mode === 'seek') {
            var key = keyOf(c, r);
            if (found.indexOf(key) >= 0) {
                lastMsg = '这个格子已经挖过啦';
            } else if (treasures.indexOf(key) >= 0) {
                found.push(key);
                lastMsg = '🎉 挖到宝藏！数对 ' + pairText(c, r);
                try { chrome.beep('win'); } catch (e) { /* 静默 */ }
                if (found.length === treasures.length) {
                    lastMsg = '🎉 全部 ' + treasures.length + ' 个宝藏都找到了，太厉害了！';
                    chrome.toast('寻宝完成！', 'ok');
                }
            } else {
                var d = nearestDistance(c, r);
                lastMsg = '没有宝藏。离最近的宝藏还有 ' + d + ' 格';
                try { chrome.beep('tick'); } catch (e) { /* 静默 */ }
            }
        }
        render();
    }

    function renderPanel() {
        els.panel.innerHTML = '';

        var read = el('div', 'gc-card');
        read.appendChild(el('div', 'gc-card__title', '当前格子'));
        var coord = el('div', 'gc-coord');
        if (picked) {
            coord.appendChild(el('span', null, pairText(picked.c, picked.r)));
            coord.appendChild(el('small', null,
                '第 ' + picked.c + ' 列 · 第 ' + picked.r + ' 行（行号从下往上数）'));
        } else {
            coord.appendChild(el('span', null, '（点击格子）'));
            coord.appendChild(el('small', null, '先列后行，写成 (列, 行)'));
        }
        read.appendChild(coord);
        els.panel.appendChild(read);

        if (state.mode === 'seek') {
            var card = el('div', 'gc-card');
            card.appendChild(el('div', 'gc-card__title', '寻宝进度'));
            var msg = el('div', 'gc-msg', lastMsg || '盘上藏了 ' + treasures.length +
                ' 个宝箱，点格子开始挖！');
            if (found.length === treasures.length) { msg.className += ' is-ok'; }
            card.appendChild(msg);
            var dots = el('div', 'gc-found');
            for (var i = 0; i < treasures.length; i++) {
                dots.appendChild(el('span', null, found.length > i ? '💰' : '❔'));
            }
            card.appendChild(dots);
            els.panel.appendChild(card);
        }

        if (state.mode === 'jump') {
            var jump = el('div', 'gc-card');
            jump.appendChild(el('div', 'gc-card__title', '按数对找格'));
            var row = el('div', 'gc-row');
            var inC = el('input', 'gc-input');
            inC.id = 'gcInC';
            inC.type = 'number';
            inC.min = '1';
            inC.max = String(state.size);
            inC.placeholder = '列';
            var inR = el('input', 'gc-input');
            inR.id = 'gcInR';
            inR.type = 'number';
            inR.min = '1';
            inR.max = String(state.size);
            inR.placeholder = '行';
            var go = el('button', 'et-btn', '跳转');
            go.type = 'button';
            go.addEventListener('click', doJump);
            row.appendChild(el('span', null, '('));
            row.appendChild(inC);
            row.appendChild(el('span', null, ','));
            row.appendChild(inR);
            row.appendChild(el('span', null, ')'));
            row.appendChild(go);
            jump.appendChild(row);
            jump.appendChild(el('p', 'gc-tip', '输入后回车或点「跳转」：看谁先说出这个格子的位置特点。'));
            els.panel.appendChild(jump);
        }

        var tip = el('div', 'gc-card');
        tip.appendChild(el('div', 'gc-card__title', MODE_LABEL[state.mode] + ' · 怎么玩'));
        var tipBody = el('p', 'gc-tip');
        tipBody.innerHTML = modeTip();
        tip.appendChild(tipBody);
        els.panel.appendChild(tip);
    }

    function modeTip() {
        if (state.mode === 'pair') {
            return '<b>数对</b>用两个数确定位置：<b>第一个数是列</b>（从左往右数），' +
                '<b>第二个数是行</b>（从下往上数）。例如 (3, 5) = 第 3 列、第 5 行。' +
                '点名时老师说「请 (2, 4) 的同学回答」，就是这张表。';
        }
        if (state.mode === 'seek') {
            return '宝藏藏在某个 <b>数对</b> 上。挖空一格就缩小一点范围 —— ' +
                '用「离宝藏还有几格」推算可能的位置，全班一起喊数对。';
        }
        return '老师说一个数对，你指出格子：先把列找对，再往上数行。' +
            '也可以反过来：点一个格子，请学生<b>说出</b>它的数对。';
    }

    function doJump() {
        var c = parseInt((document.getElementById('gcInC') || {}).value, 10);
        var r = parseInt((document.getElementById('gcInR') || {}).value, 10);
        if (!(c >= 1 && c <= state.size && r >= 1 && r <= state.size)) {
            chrome.toast('数对要在 1 – ' + state.size + ' 之间', 'warn');
            return;
        }
        picked = { c: c, r: r };
        lastMsg = '数对 ' + pairText(c, r) + ' → 第 ' + c + ' 列、第 ' + r + ' 行';
        render();
        try { chrome.beep('ok'); } catch (e) { /* 静默 */ }
    }

    function updateStat() {
        els.stat.textContent = state.size + ' × ' + state.size +
            (state.mode === 'seek' ? ' · 宝藏 ' + found.length + '/' + treasures.length : '');
        chrome.setStatus(MODE_LABEL[state.mode], 'ok');
    }

    function syncSeg() {
        var btns = els.seg.getElementsByTagName('button');
        for (var i = 0; i < btns.length; i++) {
            btns[i].className = btns[i].getAttribute('data-mode') === state.mode ? 'is-on' : '';
        }
    }

    /* ---------- 操作 ---------- */

    function setMode(mode) {
        if (MODES.indexOf(mode) < 0 || mode === state.mode) { return; }
        state.mode = mode;
        picked = null;
        lastMsg = '';
        if (mode === 'seek' && !treasures.length) { dealTreasures(); }
        persist();
        render();
    }

    function cycleMode() {
        var i = MODES.indexOf(state.mode);
        setMode(MODES[(i + 1) % MODES.length]);
    }

    function resetAll() {
        picked = null;
        lastMsg = '';
        dealTreasures();
        render();
        chrome.toast('已重新开始');
    }

    function doPrint() {
        if (typeof window.print !== 'function') { chrome.toast('当前环境不支持打印', 'err'); return; }
        window.setTimeout(function () {
            try { window.print(); } catch (e) { chrome.toast('打印失败，请用浏览器打印快捷键', 'err'); }
        }, 60);
    }

    /* ---------- 设置 ---------- */

    function buildSettings(body) {
        body.innerHTML =
            '<h4>玩法</h4>' +
            '<div class="et-drawer__row">' +
            '<select class="et-drawer__input" id="gcSetMode">' +
            '<option value="pair"' + (state.mode === 'pair' ? ' selected' : '') + '>认识数对（点格读数对）</option>' +
            '<option value="seek"' + (state.mode === 'seek' ? ' selected' : '') + '>寻宝游戏（挖宝 + 距离提示）</option>' +
            '<option value="jump"' + (state.mode === 'jump' ? ' selected' : '') + '>按数对找格（数对 → 位置）</option>' +
            '</select></div>' +
            '<h4>盘面</h4>' +
            '<div class="et-drawer__row">' +
            '<select class="et-drawer__input" id="gcSetSize">' +
            '<option value="5"' + (state.size === 5 ? ' selected' : '') + '>5 × 5</option>' +
            '<option value="6"' + (state.size === 6 ? ' selected' : '') + '>6 × 6</option>' +
            '<option value="8"' + (state.size === 8 ? ' selected' : '') + '>8 × 8</option>' +
            '<option value="10"' + (state.size === 10 ? ' selected' : '') + '>10 × 10</option>' +
            '</select></div>' +
            '<p class="et-drawer__tip">行号按教材口径<b>从下往上</b>标（列在横轴、行在纵轴）；' +
            '寻宝藏 3 个宝箱，距离 = 横竖走的格数。</p>' +
            '<div class="et-drawer__row">' +
            '<button class="et-btn" id="gcSetReset" type="button">重新开始（重摆宝藏）</button>' +
            '</div>';

        var q = function (id) { return document.getElementById(id); };
        q('gcSetMode').addEventListener('change', function () { setMode(this.value); });
        q('gcSetSize').addEventListener('change', function () {
            var n = parseInt(this.value, 10);
            state.size = SIZES.indexOf(n) >= 0 ? n : 6;
            picked = null;
            lastMsg = '';
            dealTreasures();
            persist();
            render();
        });
        q('gcSetReset').addEventListener('click', resetAll);
    }

    /* ---------- 事件与启动 ---------- */

    var segBtns = els.seg.getElementsByTagName('button');
    for (var b = 0; b < segBtns.length; b++) {
        (function (btn) {
            btn.addEventListener('click', function () { setMode(btn.getAttribute('data-mode')); });
        })(segBtns[b]);
    }

    els.sizeSel.addEventListener('change', function () {
        var n = parseInt(this.value, 10);
        state.size = SIZES.indexOf(n) >= 0 ? n : 6;
        picked = null;
        lastMsg = '';
        dealTreasures();
        persist();
        render();
    });

    els.btnReset.addEventListener('click', resetAll);
    els.btnPrint.addEventListener('click', doPrint);

    document.addEventListener('keydown', function (e) {
        if (isTypingTarget(e.target)) {
            if (e.key === 'Enter') { doJump(); }
            return;
        }
        if (e.key === '1') { setMode('pair'); }
        else if (e.key === '2') { setMode('seek'); }
        else if (e.key === '3') { setMode('jump'); }
        else if (e.key === 'r' || e.key === 'R') { resetAll(); }
        else if ((e.key === 'p' || e.key === 'P') && !e.ctrlKey && !e.metaKey) { doPrint(); }
    });

    dealTreasures();
    render();
})();
</script>

</body>
</html>
