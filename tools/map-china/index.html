/*!
 * et-chrome.css — 工具通用外壳样式（顶栏 / 页脚 / 弹窗 / 按钮 / 主题）
 *
 * 共享样式源。改这里，然后跑：python scripts/sync_shared.py

/* ============ 设计令牌 ============ */
:root {
    --et-accent: #2563eb;
    --et-accent-weak: rgba(37, 99, 235, .14);
    --et-bg: #f4f6fb;
    --et-surface: #ffffff;
    --et-surface-2: #f8fafc;
    --et-fg: #0b1220;
    --et-muted: #64748b;
    --et-line: rgba(15, 23, 42, .12);
    --et-line-strong: rgba(15, 23, 42, .22);
    --et-glass: rgba(255, 255, 255, .85);
    --et-shadow-md: 0 10px 28px -18px rgba(15, 23, 42, .3);
    --et-shadow-lg: 0 24px 60px -32px rgba(15, 23, 42, .4);
    --et-ok: #059669;
    --et-warn: #d97706;
    --et-err: #dc2626;
    --et-radius: 12px;
    --et-radius-sm: 9px;
    --et-font: -apple-system, BlinkMacSystemFont, "Segoe UI",
               "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei",
               "Noto Sans SC", sans-serif;
    --et-mono: ui-monospace, "Cascadia Mono", Consolas, Menlo, monospace;
}

html[data-et-theme="dark"] {
    --et-bg: #0b1120;
    --et-surface: #111a2e;
    --et-surface-2: #0f1729;
    --et-fg: #f1f5f9;
    --et-muted: #94a3b8;
    --et-line: rgba(148, 163, 184, .18);
    --et-line-strong: rgba(148, 163, 184, .3);
    --et-glass: rgba(17, 26, 46, .85);
    --et-shadow-md: 0 10px 34px -18px rgba(0, 0, 0, .8);
    --et-shadow-lg: 0 24px 70px -30px rgba(0, 0, 0, .9);
    --et-ok: #34d399;
    --et-warn: #fbbf24;
    --et-err: #f87171;
}

/* ============ 基础 ============ */
.et-app {
    position: relative;
    isolation: isolate;
    display: flex;
    flex-direction: column;
    height: 100vh;
    height: 100dvh;
    overflow: hidden;
    background: var(--et-bg);
    color: var(--et-fg);
    font-family: var(--et-font);
    -webkit-font-smoothing: antialiased;
    transition: background .25s, color .25s;
}

/* 极光背景：径向渐变 + 呼吸动画（edupick 品质基线，老内核也不掉帧） */
.et-app::before {
    content: '';
    position: fixed;
    inset: 0;
    z-index: -1;
    pointer-events: none;
    background:
        radial-gradient(46% 40% at 20% 18%, var(--et-accent-weak), transparent 65%),
        radial-gradient(42% 38% at 82% 24%, var(--et-accent-weak), transparent 70%),
        radial-gradient(50% 44% at 55% 95%, rgba(16, 185, 129, .10), transparent 65%);
    animation: et-aurora 16s ease-in-out infinite alternate;
}

@keyframes et-aurora {
    from { opacity: .55; transform: scale(1); }
    to { opacity: 1; transform: scale(1.06); }
}

.et-app *,
.et-app *::before,
.et-app *::after { box-sizing: border-box; }

[hidden] { display: none !important; }

.et-icon {
    width: 18px;
    height: 18px;
    fill: none;
    stroke: currentColor;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
    flex: none;
}

/* ============ 顶栏 ============ */
.et-topbar {
    flex: none;
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 11px 20px;
    border-bottom: 1px solid var(--et-line);
    background: var(--et-glass);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    z-index: 20;
}

.et-brand {
    display: flex;
    align-items: center;
    gap: 10px;
    min-width: 0;
}

.et-brand__dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: var(--et-accent);
    box-shadow: 0 0 0 4px var(--et-accent-weak);
    flex: none;
}

.et-brand__name {
    font-weight: 800;
    font-size: 15px;
    letter-spacing: -.01em;
    white-space: nowrap;
}

.et-brand__sub {
    font-size: 12.5px;
    color: var(--et-muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.et-status {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 5px 14px;
    border-radius: 999px;
    font-size: 12.5px;
    color: var(--et-muted);
    background: var(--et-surface-2);
    border: 1px solid var(--et-line);
    white-space: nowrap;
    max-width: 42vw;
    overflow: hidden;
    text-overflow: ellipsis;
}

.et-status__dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--et-ok);
    flex: none;
    transition: background .2s;
}

.et-status[data-tone="err"] .et-status__dot { background: var(--et-err); }
.et-status[data-tone="warn"] .et-status__dot { background: var(--et-warn); }

.et-actions {
    display: flex;
    align-items: center;
    gap: 7px;
}

.et-icon-btn {
    display: inline-grid;
    place-items: center;
    width: 38px;
    height: 38px;
    font-size: 16px;
    line-height: 1;
    border-radius: 11px;
    border: 1px solid var(--et-line);
    background: var(--et-surface-2);
    color: var(--et-fg);
    cursor: pointer;
    transition: transform .14s, border-color .14s, color .14s, opacity .14s;
    -webkit-tap-highlight-color: transparent;
}

.et-icon-btn:hover {
    border-color: var(--et-accent);
    color: var(--et-accent);
    transform: translateY(-1px);
}

.et-icon-btn:active { transform: translateY(0); }
.et-icon-btn.is-off { opacity: .4; }
.et-icon-btn:focus-visible { outline: 2px solid var(--et-accent); outline-offset: 2px; }

/* ============ 主区默认 ============ */
.et-main {
    flex: 1;
    min-height: 0;
    position: relative;
    overflow: auto;
}

/* ============ 页脚（品牌回流 L2） ============ */
.et-footer {
    flex: none;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 7px 16px;
    font-size: 12px;
    color: var(--et-muted);
    border-top: 1px solid var(--et-line);
    background: var(--et-glass);
    user-select: none;
    z-index: 20;
}

.et-footer a {
    color: inherit;
    text-decoration: none;
    transition: color .14s;
}

.et-footer a:hover { color: var(--et-accent); }

/* ============ 按钮 ============ */
.et-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
    padding: 9px 16px;
    border-radius: 11px;
    font: inherit;
    font-size: 13.5px;
    font-weight: 700;
    border: 1px solid var(--et-line);
    background: var(--et-surface-2);
    color: var(--et-fg);
    cursor: pointer;
    transition: transform .14s, border-color .14s, color .14s, background .14s, box-shadow .14s;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
}

.et-btn:hover {
    border-color: var(--et-accent);
    color: var(--et-accent);
    transform: translateY(-1px);
}

.et-btn:active { transform: translateY(0); }
.et-btn:focus-visible { outline: 2px solid var(--et-accent); outline-offset: 2px; }
.et-btn:disabled { opacity: .45; cursor: not-allowed; transform: none; }

.et-btn--primary {
    background: var(--et-accent);
    border-color: var(--et-accent);
    color: #fff;
    box-shadow: 0 6px 18px -8px var(--et-accent);
}

.et-btn--primary:hover { color: #fff; filter: brightness(1.08); }
.et-btn--primary:disabled { filter: none; }

.et-btn--danger:hover {
    border-color: var(--et-err);
    color: var(--et-err);
}

.et-btn--lg {
    padding: 13px 26px;
    font-size: 16px;
    border-radius: 14px;
}

/* ============ 弹窗 ============ */
.et-modal {
    position: fixed;
    inset: 0;
    z-index: 100;
    display: grid;
    place-items: center;
    padding: 24px;
    background: rgba(2, 6, 23, .55);
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    animation: et-fade .18s ease;
}

.et-modal__panel {
    width: min(680px, 94vw);
    max-height: 86vh;
    max-height: 86dvh;
    display: flex;
    flex-direction: column;
    background: var(--et-surface);
    border: 1px solid var(--et-line);
    border-radius: 16px;
    box-shadow: var(--et-shadow-lg);
    animation: et-pop .2s cubic-bezier(.34, 1.4, .64, 1);
    overflow: hidden;
}

.et-modal__panel--narrow { width: min(460px, 92vw); }
.et-modal__panel--wide { width: min(900px, 94vw); }

.et-modal__head {
    flex: none;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 16px 20px;
    border-bottom: 1px solid var(--et-line);
    font-weight: 800;
    font-size: 15px;
}

.et-modal__head .et-icon-btn {
    margin-left: auto;
    width: 32px;
    height: 32px;
}

.et-modal__body {
    flex: 1;
    min-height: 0;
    overflow: auto;
    padding: 18px 20px;
}

.et-modal__foot {
    flex: none;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 14px 20px;
    border-top: 1px solid var(--et-line);
    background: var(--et-surface-2);
}

.et-modal__foot .spacer { flex: 1; }

@keyframes et-fade {
    from { opacity: 0; }
}

@keyframes et-pop {
    from { opacity: 0; transform: translateY(14px) scale(.97); }
}

/* ============ 轻提示（toast） ============ */
.et-toast {
    position: fixed;
    left: 50%;
    bottom: 56px;
    transform: translateX(-50%) translateY(10px);
    z-index: 120;
    display: flex;
    align-items: center;
    gap: 9px;
    max-width: min(520px, 88vw);
    padding: 11px 18px;
    border-radius: 12px;
    font-size: 13.5px;
    font-weight: 600;
    color: #fff;
    background: rgba(15, 23, 42, .92);
    border: 1px solid rgba(148, 163, 184, .25);
    box-shadow: var(--et-shadow-lg);
    opacity: 0;
    pointer-events: none;
    transition: opacity .22s, transform .22s;
}

.et-toast.is-show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
}

.et-toast[data-tone="ok"] { background: rgba(5, 150, 105, .95); }
.et-toast[data-tone="err"] { background: rgba(220, 38, 38, .95); }
.et-toast[data-tone="warn"] { background: rgba(217, 119, 6, .95); }

/* ============ 设置抽屉（右上角入口，edupick 交互） ============ */
.et-drawer-backdrop {
    position: fixed;
    inset: 0;
    z-index: 90;
    background: rgba(2, 6, 23, .45);
    backdrop-filter: blur(3px);
    -webkit-backdrop-filter: blur(3px);
    opacity: 0;
    transition: opacity .2s;
}

.et-drawer-backdrop.is-open { opacity: 1; }

.et-drawer {
    position: absolute;
    top: 0;
    right: 0;
    height: 100%;
    width: min(400px, 92vw);
    display: flex;
    flex-direction: column;
    background: var(--et-surface);
    border-left: 1px solid var(--et-line);
    box-shadow: var(--et-shadow-lg);
    transform: translateX(100%);
    transition: transform .22s cubic-bezier(.32, .72, .35, 1);
}

.et-drawer-backdrop.is-open .et-drawer { transform: translateX(0); }

.et-drawer__head {
    flex: none;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 15px 18px;
    border-bottom: 1px solid var(--et-line);
    font-weight: 800;
    font-size: 15px;
    color: var(--et-accent);
}

.et-drawer__head .et-icon-btn {
    margin-left: auto;
    width: 32px;
    height: 32px;
}

.et-drawer__body {
    flex: 1;
    min-height: 0;
    overflow: auto;
    padding: 16px 18px 24px;
}

/* 抽屉内容通用小节（工具复用） */
.et-drawer__body h4 {
    margin: 18px 0 8px;
    font-size: 12px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: .08em;
    color: var(--et-muted);
}

.et-drawer__body h4:first-child { margin-top: 0; }

.et-drawer__row {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
}

.et-drawer__tip {
    margin: 8px 0 0;
    font-size: 12px;
    line-height: 1.8;
    color: var(--et-muted);
}

.et-drawer__tip b { color: var(--et-fg); }

.et-drawer__input {
    flex: 1;
    min-width: 0;
    padding: 9px 12px;
    border: 1px solid var(--et-line-strong);
    border-radius: 9px;
    background: var(--et-surface-2);
    color: var(--et-fg);
    font: inherit;
    font-size: 13.5px;
    transition: border-color .14s, box-shadow .14s;
}

.et-drawer__input:focus {
    outline: none;
    border-color: var(--et-accent);
    box-shadow: 0 0 0 3px var(--et-accent-weak);
}

.et-drawer__switch {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 10px 0;
    border-bottom: 1px dashed var(--et-line);
    font-size: 13.5px;
    font-weight: 600;
    color: var(--et-fg);
    cursor: pointer;
    user-select: none;
}

.et-drawer__switch input {
    width: 17px;
    height: 17px;
    accent-color: var(--et-accent);
    cursor: pointer;
}
</style>

            }, 220);
        }
        function onKey(ev) {
            if (ev.key === 'Escape') { ev.stopPropagation(); close(); }
        }
        document.addEventListener('keydown', onKey);
        backdrop.addEventListener('mousedown', function (ev) {
            if (ev.target === backdrop) { close(); }

    /* ---------- 通用弹窗 / toast（同时挂模块级，供其他共享组件使用） ---------- */

    function modal(mo) {
        var backdrop = el('div', 'et-modal');
        var panel = el('div', 'et-modal__panel' + (mo.size === 'narrow' ? ' et-modal__panel--narrow'
            : mo.size === 'wide' ? ' et-modal__panel--wide' : ''));
        var head = el('div', 'et-modal__head');
        if (mo.icon) { head.appendChild(makeIcon(mo.icon)); }
        head.appendChild(el('span', null, mo.title || ''));
        head.appendChild(makeBtn('i-x', '关闭', close));
        panel.appendChild(head);

        var body = el('div', 'et-modal__body');
        if (typeof mo.body === 'string') { body.innerHTML = mo.body; }
        else if (mo.body) { body.appendChild(mo.body); }
        panel.appendChild(body);

        var foot = null;
        if (mo.buttons && mo.buttons.length) {
            foot = el('div', 'et-modal__foot');
            foot.appendChild(el('span', 'spacer'));
            mo.buttons.forEach(function (b) {
                var btn = el('button', 'et-btn' + (b.primary ? ' et-btn--primary' : '') + (b.danger ? ' et-btn--danger' : ''), b.label);
                btn.type = 'button';
                btn.addEventListener('click', function () {
                    if (b.onClick) { b.onClick(close); } else { close(); }
                });
                foot.appendChild(btn);
            });
            panel.appendChild(foot);
        }

        backdrop.appendChild(panel);
        document.body.appendChild(backdrop);

        function close() {
            if (backdrop.parentNode) { backdrop.parentNode.removeChild(backdrop); }
            document.removeEventListener('keydown', onKey);
            if (mo.onClose) { mo.onClose(); }
        }
        function onKey(ev) {
            if (ev.key === 'Escape') { ev.stopPropagation(); close(); }
        }
        document.addEventListener('keydown', onKey);
        backdrop.addEventListener('mousedown', function (ev) {
            if (ev.target === backdrop) { close(); }

    var toastEl = null;
    var toastTimer = 0;

    function toast(msg, tone) {
        if (!toastEl) {
            toastEl = el('div', 'et-toast');
            document.body.appendChild(toastEl);

        toastEl.textContent = msg;
        toastEl.setAttribute('data-tone', tone || '');
        void toastEl.offsetWidth;
        toastEl.classList.add('is-show');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(function () { toastEl.classList.remove('is-show'); }, 2200);

    /* ---------- PWA 元数据（blob manifest，环境不支持时静默跳过） ---------- */

    function installPwa(toolId, title, accent) {
        try {
            var theme = document.querySelector('meta[name="theme-color"]');
            if (!theme) {
                theme = document.createElement('meta');

            var svg = '<svg xmlns="' + NS_SVG + '" viewBox="0 0 64 64">' +
                '<rect width="64" height="64" rx="14" fill="' + (accent || '#2563eb') + '"/>' +
                '<text x="32" y="43" font-size="32" font-weight="800" font-family="sans-serif" ' +
                'fill="#fff" text-anchor="middle">' + (title || '课').charAt(0) + '</text></svg>';
            var iconUri = 'data:image/svg+xml,' + encodeURIComponent(svg);

            var mf = {
                name: title || 'KeeTools 课工具',
                short_name: title || '课工具',
                start_url: '.',
                display: 'standalone',
                background_color: '#f4f6fb',
                theme_color: accent || '#2563eb',
                icons: [{ src: iconUri, sizes: 'any', type: 'image/svg+xml', purpose: 'any' }]
            };
            var blob = new Blob([JSON.stringify(mf)], { type: 'application/manifest+json' });
            var link = document.createElement('link');
            link.rel = 'manifest';

        if (!main) { main = el('main'); main.id = 'et-main'; topbar.after(main); }
        if (!footer) { footer = el('footer'); footer.id = 'et-footer'; document.body.appendChild(footer); }

        topbar.className = 'et-topbar';
        main.classList.add('et-main');
        footer.className = 'et-footer';

        /* 品牌 */
        var brand = el('div', 'et-brand');
        brand.appendChild(el('span', 'et-brand__dot'));
        var nameWrap = el('div');
        nameWrap.style.cssText = 'min-width:0;line-height:1.25';
        nameWrap.appendChild(el('div', 'et-brand__name', opt.title || '课工具'));
        if (opt.sub) { nameWrap.appendChild(el('div', 'et-brand__sub', opt.sub)); }
        brand.appendChild(nameWrap);

        statusPill.appendChild(el('span', 'et-status__dot'));
        var statusText = el('span', null, '');

            soundBtn.appendChild(makeIcon(soundEnabled ? 'i-volume' : 'i-volume-off'));
            soundBtn.title = soundEnabled ? '关闭音效' : '开启音效';
            soundBtn.classList.toggle('is-off', !soundEnabled);
            if (soundEnabled) { api.beep('ok'); }

        api.openSettings = function () {
            if (settingsBtn) { settingsBtn.click(); }

            } else {
                var req = root.requestFullscreen || root.webkitRequestFullscreen;
                if (req) { try { req.call(root); } catch (err) { /* 忽略 */ } }
            }
        }

        function syncFsIcon(on) {
            if (!fsBtn) { return; }
            fsBtn.innerHTML = '';
            fsBtn.appendChild(makeIcon(on ? 'i-minimize' : 'i-maximize'));
            fsBtn.title = on ? '退出全屏' : '全屏';
        }

        document.addEventListener('fullscreenchange', function () {
            syncFsIcon(!!(document.fullscreenElement || document.webkitFullscreenElement));
        });
        document.addEventListener('webkitfullscreenchange', function () {
            syncFsIcon(!!(document.fullscreenElement || document.webkitFullscreenElement));
        });
        syncFsIcon(false);

        api.toggleFullscreen = toggleFullscreen;

        /* ---------- 音效 API ---------- */
        api.beep = function (kind) {
            if (!soundEnabled) { return; }
            playBeep(kind);
        };
        api.soundOn = function () { return soundEnabled; };

        api.modal = modal;

        /* ---------- 帮助 ---------- */
        function openHelp() {
            modal({
                title: '使用说明',
                icon: 'i-help',
                size: 'narrow',
                body: opt.help,
                buttons: [{ label: '知道了', primary: true }]

        api.openHelp = openHelp;

        /* ---------- toast ---------- */
        api.toast = toast;

        /* ---------- 页脚（L2 品牌回流，低调一行） ---------- */
        var siteOrigin = typeof global.ET_SITE_ORIGIN === 'string' && /^https?:\/\//.test(global.ET_SITE_ORIGIN)
            ? global.ET_SITE_ORIGIN
            : null;

        function renderFooter() {
            footer.textContent = '';
            footer.appendChild(el('span', null, 'KeeTools 课工具'));
            footer.appendChild(el('span', null, '·'));
            if (siteOrigin) {
                var a = el('a', null, '更多课堂工具');
                a.href = siteOrigin + '/?from=tool-footer&tool=' + encodeURIComponent(toolId);
                a.target = '_blank';
                a.rel = 'noopener';
                footer.appendChild(a);
            } else {
                footer.appendChild(el('span', null, '更多课堂工具'));
            }
        }
        renderFooter();

        /* 站点来源发现：iframe 内向父窗口询问；也可由宿主直接注入 ET_SITE_ORIGIN */
        try {
            if (global.parent && global.parent !== global) {
                global.parent.postMessage(JSON.stringify({ type: 'et-hello', toolId: toolId }), '*');
            }
        } catch (err) { /* 跨域异常忽略 */ }

        global.addEventListener('message', function (ev) {
            var data = ev.data;
            if (typeof data === 'string') {

/*!
 * et-stats.js — 使用统计模块（模块化，可整体移除）
 *
 * 共享逻辑源。改这里，然后跑：python scripts/sync_shared.py
 * 依赖：无（可脱离 et-util / et-chrome 独立运行）。
 * 全局：ET.Stats
 *
 * ┌────────────────────────────────────────────────────────────────┐
 * │ 说明：本模块只做一件事——工具被打开时向上报端点发一条匿名计数。 │
 * │ · 在线（iframe 内）：宿主页面已服务端计数，本模块不重复上报。   │
 * │ · 离线打开（file:// / 下载单文件 / 离线包）：联网条件具备时，   │
 * │   以 sendBeacon 上报 use_offline 事件（text/plain 免预检）。    │
 * │ · 上报端点 = window.ET_SITE_ORIGIN（由宿主注入或离线包配置）。  │
 * │   未配置端点时本模块完全静默，不发任何请求。                    │
 * │ · **整个 <script> 块可安全删除**：删除后工具其余功能完全正常，  │
 * │   且完全不再发起任何网络请求。                                  │
 * └────────────────────────────────────────────────────────────────┘
 */
(function (global) {
    'use strict';

    var ET = global.ET = global.ET || {};

    var Stats = {
        /** 上报端点来源（站点绝对地址，无协议尾斜杠） */
        endpoint: (typeof global.ET_SITE_ORIGIN === 'string' && /^https?:\/\//.test(global.ET_SITE_ORIGIN))
            ? global.ET_SITE_ORIGIN
            : null,

        _done: {},

        /**
         * 上报一次事件（同一事件同一工具每次页面加载只报一次）。
         * event: 'use_offline' 等；toolId: 工具 id。
         */
        send: function (event, toolId) {
            if (!event || this._done[event + ':' + (toolId || '')]) { return false; }
            if (!this.endpoint) { return false; }
            /* iframe 内由宿主统计，避免双计 */
            try {
                if (global.parent && global.parent !== global) { return false; }
            } catch (err) { return false; }
            /* 断网时挂起，网络恢复自动补报一次 */
            if (global.navigator && global.navigator.onLine === false) {
                var self = this;
                global.addEventListener('online', function () { self.send(event, toolId); }, { once: true });
                return false;
            }

            this._done[event + ':' + (toolId || '')] = true;
            var payload = JSON.stringify({ event: event, tool: toolId || '' });

            try {
                if (global.navigator.sendBeacon) {
                    return global.navigator.sendBeacon(
                        this.endpoint + '/api/track',
                        new Blob([payload], { type: 'text/plain;charset=UTF-8' })
                    );
                }
                global.fetch(this.endpoint + '/api/track', {
                    method: 'POST',
                    body: payload,
                    keepalive: true,
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'text/plain;charset=UTF-8' }
                });
                return true;
            } catch (err) {
                return false;
            }
        }
    };

    ET.Stats = Stats;
})(window);
</script>

        { n: '台湾省', s: '台', c: '台北', area: 3.6, pop: 2356, r: 'huadong', col: 7, row: 6, tip: '我国面积最大的岛屿，地形东高西低，隔台湾海峡与福建相望。' },
        { n: '河南省', s: '豫', c: '郑州', area: 16.7, pop: 9937, r: 'huazhong', col: 4, row: 3, tip: '地处中原，跨黄河、淮河、海河等流域，是我国重要的粮食产区。' },
        { n: '湖北省', s: '鄂', c: '武汉', area: 18.59, pop: 5775, r: 'huazhong', col: 4, row: 4, tip: '长江中游、千湖之省，三峡水利枢纽位于其西部。' },
        { n: '湖南省', s: '湘', c: '长沙', area: 21.18, pop: 6644, r: 'huazhong', col: 4, row: 5, tip: '洞庭湖平原为"鱼米之乡"，张家界地貌奇特。' },
        { n: '广东省', s: '粤', c: '广州', area: 17.97, pop: 12601, r: 'huanan', col: 5, row: 6, tip: '我国人口最多的省份，珠江三角洲经济发达。' },
        { n: '广西壮族自治区', s: '桂', c: '南宁', area: 23.76, pop: 5013, r: 'huanan', col: 4, row: 6, tip: '喀斯特地貌广布，桂林山水甲天下。' },
        { n: '海南省', s: '琼', c: '海口', area: 3.54, pop: 1008, r: 'huanan', col: 4, row: 7, tip: '我国纬度最低的省份，管辖南海诸岛及其海域。' },
        { n: '香港特别行政区', s: '港', c: '香港', area: 0.11, pop: 747, r: 'huanan', col: 6, row: 7, tip: '特别行政区，国际金融、贸易与航运中心，与深圳相邻。' },
        { n: '澳门特别行政区', s: '澳', c: '澳门', area: 0.0033, pop: 68, r: 'huanan', col: 5, row: 7, tip: '特别行政区，与珠海相邻，以旅游与博彩业著称。' },
        { n: '重庆市', s: '渝', c: '重庆', area: 8.24, pop: 3205, r: 'xinan', col: 3, row: 4, tip: '长江上游的直辖市，山城地形，夏季气候炎热。' },
        { n: '四川省', s: '川', alt: '蜀', c: '成都', area: 48.6, pop: 8367, r: 'xinan', col: 2, row: 4, tip: '西有川西高原、东有四川盆地，都江堰水利工程闻名世界。' },
        { n: '贵州省', s: '贵', alt: '黔', c: '贵阳', area: 17.6, pop: 3856, r: 'xinan', col: 3, row: 5, tip: '喀斯特地貌典型，夏季凉爽，有黄果树瀑布。' },
        { n: '云南省', s: '云', alt: '滇', c: '昆明', area: 39.4, pop: 4721, r: 'xinan', col: 2, row: 5, tip: '我国少数民族最多的省份，地形复杂、气候多样。' },
        { n: '西藏自治区', s: '藏', c: '拉萨', area: 122.8, pop: 365, r: 'xinan', col: 0, row: 4, tip: '青藏高原西南部，平均海拔 4000 米以上，雅鲁藏布江谷地为主要农业区。' },
        { n: '陕西省', s: '陕', alt: '秦', c: '西安', area: 20.56, pop: 3953, r: 'xibei', col: 3, row: 3, tip: '南北跨秦岭，北部为黄土高原，是中华文明重要发祥地之一。' },
        { n: '甘肃省', s: '甘', alt: '陇', c: '兰州', area: 45.4, pop: 2502, r: 'xibei', col: 2, row: 2, tip: '形似如意，河西走廊是古丝绸之路的通道。' },
        { n: '青海省', s: '青', c: '西宁', area: 72.2, pop: 592, r: 'xibei', col: 1, row: 3, tip: '青海湖是我国最大的咸水湖，长江、黄河均发源于此。' },
        { n: '宁夏回族自治区', s: '宁', c: '银川', area: 6.64, pop: 720, r: 'xibei', col: 3, row: 2, tip: '黄河灌溉造就"塞上江南"，贺兰山阻挡风沙。' },
        { n: '新疆维吾尔自治区', s: '新', c: '乌鲁木齐', area: 166.0, pop: 2585, r: 'xibei', col: 0, row: 2, tip: '我国面积最大的省级行政区，三山夹两盆，盛产瓜果与棉花。' }
    ];

    var chrome = ET.Chrome.mount({
        toolId: TOOL_ID,
        title: '中国地图',
        sub: '地理 · 省级行政区速记',
        accent: '#0f766e',
        status: '就绪',
        sound: true,
        primary: quizNext,
        help: '<div style="font-size:13.5px;line-height:2">' +
            '<p style="margin:0 0 8px"><b>怎么用</b>：点击任意方块，右侧显示该省级行政区的简称、行政中心、面积与人口，颜色代表所属地理分区。</p>' +
            '<p style="margin:0 0 8px"><b>速记练习</b>：切换到「速记练习」后，系统给出简称或行政中心，请在地图上点出对应的省级行政区，答对会打绿框。</p>' +
            '<p style="margin:0 0 8px"><b>注意</b>：方块按相对方位排列（拼块示意图），不代表真实轮廓与面积比例；面积、人口为常用统计约数。</p>' +
            '<p style="margin:0"><b>快捷键</b>：空格 / 翻页笔下页键 = 练习模式下换一题。</p></div>',
        settings: {
            title: '数据说明',
            build: function (body, drawer) {
                var p = document.createElement('p');
                p.style.cssText = 'font-size:13.2px;line-height:1.95;color:var(--et-muted);margin:0 0 8px';
                p.innerHTML = '共收录 <b>' + PROVINCES.length + '</b> 个省级行政区（含 23 省、5 自治区、' +
                    '4 直辖市、2 特别行政区）。<br>面积单位为万平方千米，人口为常用统计约数（万人）。';
                var key = document.createElement('div');
                key.className = 'mc-key';
                Object.keys(REGIONS).forEach(function (k) {
                    var sp = document.createElement('span');
                    sp.innerHTML = '<i style="background:' + REGIONS[k].color + '"></i>' + REGIONS[k].label;
                    key.appendChild(sp);
                });
                body.appendChild(p);
                body.appendChild(key);
                drawer.close();
            }
        }
    });

    var els = {
        grid: document.getElementById('grid'),
        panel: document.getElementById('panel'),
        key: document.getElementById('key'),
        modeBrowse: document.getElementById('modeBrowse'),
        modeQuiz: document.getElementById('modeQuiz')
    };

    var state = {
        mode: store.get('mode', 'browse'),
        sel: store.get('sel', 0),
        quiz: null,
        total: 0,
        hit: 0
    };

    if (state.mode !== 'browse' && state.mode !== 'quiz') { state.mode = 'browse'; }

    function byName(n) {
        for (var i = 0; i < PROVINCES.length; i++) {
            if (PROVINCES[i].n === n) { return i; }
        }
        return -1;
    }

    /* ---------- 图例 ---------- */

    function buildKey() {
        els.key.innerHTML = '';
        Object.keys(REGIONS).forEach(function (k) {
            var sp = document.createElement('span');
            sp.innerHTML = '<i style="background:' + REGIONS[k].color + '"></i>' + REGIONS[k].label;
            els.key.appendChild(sp);
        });
    }

    /* ---------- 地图 ---------- */

    function buildGrid() {
        els.grid.innerHTML = '';
        PROVINCES.forEach(function (p, i) {
            var b = document.createElement('button');
            b.type = 'button';
            b.className = 'mc-prov';
            b.setAttribute('data-i', i);
            b.style.gridColumn = String(p.col + 1);
            b.style.gridRow = String(p.row + 1);
            b.style.setProperty('--mc-region', REGIONS[p.r].color);
            b.title = p.n + '（简称 ' + p.s + '，行政中心 ' + p.c + '）';

            var s = document.createElement('span');
            s.className = 'mc-prov__short';
            s.textContent = p.s;
            if (p.s.length >= 3) { s.style.fontSize = '14px'; }
            b.appendChild(s);

            var plain = p.n.replace(/(省|市|自治区|特别行政区|壮族|回族|维吾尔)/g, '') || p.n;
            if (plain !== p.s) {
                var nm = document.createElement('span');
                nm.className = 'mc-prov__name';
                nm.textContent = plain;
                b.appendChild(nm);
            }

            b.addEventListener('click', function () {
                if (state.mode === 'quiz') {
                    answerQuiz(i, b);
                    return;
                }
                select(i);
                try { chrome.beep('tick'); } catch (e) { /* 静默 */ }
            });

            els.grid.appendChild(b);
        });
    }

    function select(i) {
        state.sel = i;
        store.set('sel', i);
        var blocks = els.grid.children;
        for (var k = 0; k < blocks.length; k++) {
            blocks[k].classList.toggle('is-on', k === i);
        }
        renderPanel();
        var p = PROVINCES[i];
        if (p) { chrome.setStatus(p.n + ' · ' + p.s, 'ok'); }
    }

    function renderPanel() {
        var html = '';

        if (state.mode === 'quiz') {
            html += quizPanelHtml();
        }

        if (state.sel < 0 || state.mode === 'quiz') {
            if (state.mode === 'quiz') {
                html += '<p class="mc-tip" style="margin-top:12px">练习进行中：点击地图上的方块作答。' +
                    '答错的方块会打红框，正确答案会打绿框。</p>';
            } else {
                html += '<div class="mc-empty">点击左侧任意方块<br>查看简称 · 行政中心 · 面积 · 人口</div>';
            }
            els.panel.innerHTML = html;
            els.panel.style.removeProperty('--mc-region');
            bindQuizButtons();
            return;
        }

        var p = PROVINCES[state.sel];
        els.panel.style.setProperty('--mc-region', REGIONS[p.r].color);
        html += '<div class="mc-title">' +
            '<h2>' + p.n + '</h2><span>' + REGIONS[p.r].label + '</span></div>';
        html += '<div class="mc-grid2">' +
            cell('简称', p.s + (p.alt ? '（别称 ' + p.alt + '）' : '')) +
            cell('行政中心', p.c) +
            cell('面积', p.area >= 1 ? (p.area + ' 万平方千米') : (p.area * 10000 + ' 平方千米')) +
            cell('人口（约）', p.pop + ' 万人') +
            '</div>';
        html += '<p class="mc-tip">' + p.tip + '</p>';
        els.panel.innerHTML = html;
    }

    function cell(label, value) {
        return '<div class="mc-cell"><b>' + label + '</b><span>' + value + '</span></div>';
    }

    /* ---------- 速记练习 ---------- */

    function setMode(mode) {
        state.mode = mode;
        store.set('mode', mode);
        els.modeBrowse.classList.toggle('is-on', mode === 'browse');
        els.modeQuiz.classList.toggle('is-on', mode === 'quiz');
        clearMarks();
        if (mode === 'quiz') {
            quizNext();
        } else {
            state.quiz = null;
            renderPanel();
        }
    }

    function clearMarks() {
        var blocks = els.grid.children;
        for (var i = 0; i < blocks.length; i++) {
            blocks[i].classList.remove('is-ok', 'is-no');
        }
    }

    function quizNext() {
        if (state.mode !== 'quiz') {
            setMode('quiz');
            return;
        }
        clearMarks();
        var idx = Math.floor(Math.random() * PROVINCES.length);
        var p = PROVINCES[idx];
        var askShort = Math.random() < 0.5;
        state.quiz = {
            idx: idx,
            text: askShort
                ? ('简称「' + p.s + '」是哪个省级行政区？')
                : ('行政中心是「' + p.c + '」的是哪个省级行政区？'),
            locked: false
        };
        renderPanel();
    }

    function quizPanelHtml() {
        if (!state.quiz) { return ''; }
        return '<div class="mc-quiz" style="margin:0 0 12px">' +
            '<div class="mc-quiz__q">' + state.quiz.text + '</div>' +
            '<div class="mc-quiz__feed" id="qFeed">在地图上点出正确的方块</div>' +
            '<div class="mc-quiz__stat" id="qStat">已答 ' + state.total + ' 题，答对 ' + state.hit + ' 题</div>' +
            '<button class="mc-btn mc-btn--primary" id="btnQuizNext" type="button">换一题</button>' +
            '</div>';
    }

    function bindQuizButtons() {
        var b = document.getElementById('btnQuizNext');
        if (b) { b.addEventListener('click', quizNext); }
    }

    function answerQuiz(i, block) {
        if (!state.quiz || state.quiz.locked) { return; }
        state.quiz.locked = true;
        state.total++;
        var ok = i === state.quiz.idx;
        var feed = document.getElementById('qFeed');
        var stat = document.getElementById('qStat');
        var right = PROVINCES[state.quiz.idx];

        if (ok) {
            state.hit++;
            block.classList.add('is-ok');
            if (feed) {
                feed.className = 'mc-quiz__feed is-ok';
                feed.textContent = '✓ 正确！' + right.n + '（' + right.s + '）行政中心 ' + right.c;
            }
            try { chrome.beep('ok'); } catch (e) { /* 静默 */ }
        } else {
            block.classList.add('is-no');
            var blocks = els.grid.children;
            if (blocks[state.quiz.idx]) { blocks[state.quiz.idx].classList.add('is-ok'); }
            if (feed) {
                feed.className = 'mc-quiz__feed is-no';
                feed.textContent = '✗ 你选的是 ' + PROVINCES[i].n + '，正确答案是 ' + right.n +
                    '（' + right.s + '，行政中心 ' + right.c + '）';
            }
            try { chrome.beep('err'); } catch (e) { /* 静默 */ }
        }
        if (stat) {
            stat.textContent = '已答 ' + state.total + ' 题，答对 ' + state.hit + ' 题 · 正确率 ' +
                Math.round(state.hit / state.total * 100) + '%';
        }
        chrome.setStatus(ok ? '答对了' : '再接再厉', ok ? 'ok' : 'warn');
        setTimeout(function () {
            if (state.mode === 'quiz') { quizNext(); }
        }, ok ? 900 : 2000);
    }

    /* ---------- 事件 ---------- */

    els.modeBrowse.addEventListener('click', function () { setMode('browse'); });
    els.modeQuiz.addEventListener('click', function () { setMode('quiz'); });

    function isTypingTarget(node) {
        if (!node || !node.tagName) { return false; }
        var tag = node.tagName.toUpperCase();
        return tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT' || node.isContentEditable === true;
    }

    document.addEventListener('keydown', function (e) {
        if (isTypingTarget(e.target) || document.querySelector('.et-modal, .et-drawer-backdrop')) { return; }
        if (e.code === 'Space') {
            e.preventDefault();
            quizNext();
        } else if (e.key === 'Escape' && state.mode === 'quiz') {
            setMode('browse');
        }
    });

    /* ---------- 启动 ---------- */

    buildKey();
    buildGrid();
    if (typeof state.sel !== 'number' || state.sel < 0 || state.sel >= PROVINCES.length) { state.sel = 0; }
    if (state.mode === 'quiz') {
        els.modeBrowse.classList.remove('is-on');
        els.modeQuiz.classList.add('is-on');
        quizNext();
    } else {
        select(state.sel);
    }
})();
</script>

</body>
</html>
