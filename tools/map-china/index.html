/* ============ 设计令牌 ============ */
:root {
    --et-accent: #2563eb;
    --et-accent-weak: rgba(37, 99, 235, .14);
    --et-bg: #f4f6fb;
    --et-surface: #ffffff;
    --et-surface-2: #f8fafc;
    --et-fg: #0b1220;
    --et-muted: #64748b;
    --et-line: rgba(15, 23, 42, .12);
    --et-line-strong: rgba(15, 23, 42, .22);
    --et-glass: rgba(255, 255, 255, .85);
    --et-shadow-md: 0 10px 28px -18px rgba(15, 23, 42, .3);
    --et-shadow-lg: 0 24px 60px -32px rgba(15, 23, 42, .4);
    --et-ok: #059669;
    --et-warn: #d97706;
    --et-err: #dc2626;
    --et-radius: 12px;
    --et-radius-sm: 9px;
    --et-font: -apple-system, BlinkMacSystemFont, "Segoe UI",
               "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei",
               "Noto Sans SC", sans-serif;
    --et-mono: ui-monospace, "Cascadia Mono", Consolas, Menlo, monospace;
}

html[data-et-theme="dark"] {
    --et-bg: #0b1120;
    --et-surface: #111a2e;
    --et-surface-2: #0f1729;
    --et-fg: #f1f5f9;
    --et-muted: #94a3b8;
    --et-line: rgba(148, 163, 184, .18);
    --et-line-strong: rgba(148, 163, 184, .3);
    --et-glass: rgba(17, 26, 46, .85);
    --et-shadow-md: 0 10px 34px -18px rgba(0, 0, 0, .8);
    --et-shadow-lg: 0 24px 70px -30px rgba(0, 0, 0, .9);
    --et-ok: #34d399;
    --et-warn: #fbbf24;
    --et-err: #f87171;
}

/* ============ 基础 ============ */

/* body 作为外壳时必须清掉浏览器默认 8px 外边距，
   否则 iframe 预览中文档会比视口高 16px（底部白边 + 多余滚动） */
body.et-app {
    margin: 0;
}

.et-app {
    position: relative;
    isolation: isolate;
    display: flex;
    flex-direction: column;
    height: 100vh;
    height: 100dvh;
    overflow: hidden;
    background: var(--et-bg);
    color: var(--et-fg);
    font-family: var(--et-font);
    -webkit-font-smoothing: antialiased;
    transition: background .25s, color .25s;
}

/* 极光背景：径向渐变 + 呼吸动画（edupick 品质基线，老内核也不掉帧） */
.et-app::before {
    content: '';
    position: fixed;
    inset: 0;
    z-index: -1;
    pointer-events: none;
    background:
        radial-gradient(46% 40% at 20% 18%, var(--et-accent-weak), transparent 65%),
        radial-gradient(42% 38% at 82% 24%, var(--et-accent-weak), transparent 70%),
        radial-gradient(50% 44% at 55% 95%, rgba(16, 185, 129, .10), transparent 65%);
    animation: et-aurora 16s ease-in-out infinite alternate;
}

@keyframes et-aurora {
    from { opacity: .55; transform: scale(1); }
    to { opacity: 1; transform: scale(1.06); }
}

.et-app *,
.et-app *::before,
.et-app *::after { box-sizing: border-box; }

[hidden] { display: none !important; }

.et-icon {
    width: 18px;
    height: 18px;
    fill: none;
    stroke: currentColor;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
    flex: none;
}

/* ============ 顶栏 ============ */
.et-topbar {
    flex: none;
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 11px 20px;
    border-bottom: 1px solid var(--et-line);
    background: var(--et-glass);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    z-index: 20;
}

.et-brand {
    display: flex;
    align-items: center;
    gap: 10px;
    min-width: 0;
}

.et-brand__dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: var(--et-accent);
    box-shadow: 0 0 0 4px var(--et-accent-weak);
    flex: none;
}

.et-brand__name {
    font-weight: 800;
    font-size: 15px;
    letter-spacing: -.01em;
    white-space: nowrap;
}

.et-brand__sub {
    font-size: 12.5px;
    color: var(--et-muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.et-status {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 5px 14px;
    border-radius: 999px;
    font-size: 12.5px;
    color: var(--et-muted);
    background: var(--et-surface-2);
    border: 1px solid var(--et-line);
    white-space: nowrap;
    max-width: 42vw;
    overflow: hidden;
    text-overflow: ellipsis;
}

.et-status__dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--et-ok);
    flex: none;
    transition: background .2s;
}

.et-status[data-tone="err"] .et-status__dot { background: var(--et-err); }
.et-status[data-tone="warn"] .et-status__dot { background: var(--et-warn); }

.et-actions {
    display: flex;
    align-items: center;
    gap: 7px;
}

.et-icon-btn {
    display: inline-grid;
    place-items: center;
    width: 38px;
    height: 38px;
    font-size: 16px;
    line-height: 1;
    border-radius: 11px;
    border: 1px solid var(--et-line);
    background: var(--et-surface-2);
    color: var(--et-fg);
    cursor: pointer;
    transition: transform .14s, border-color .14s, color .14s, opacity .14s;
    -webkit-tap-highlight-color: transparent;
}

.et-icon-btn:hover {
    border-color: var(--et-accent);
    color: var(--et-accent);
    transform: translateY(-1px);
}

.et-icon-btn:active { transform: translateY(0); }
.et-icon-btn.is-off { opacity: .4; }
.et-icon-btn:focus-visible { outline: 2px solid var(--et-accent); outline-offset: 2px; }

/* ============ 主区默认 ============ */
.et-main {
    flex: 1;
    min-height: 0;
    position: relative;
    overflow: auto;
}

/* ============ 页脚（品牌回流 L2） ============ */
.et-footer {
    flex: none;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 7px 16px;
    font-size: 12px;
    color: var(--et-muted);
    border-top: 1px solid var(--et-line);
    background: var(--et-glass);
    user-select: none;
    z-index: 20;
}

.et-footer a {
    color: inherit;
    text-decoration: none;
    transition: color .14s;
}

.et-footer a:hover { color: var(--et-accent); }

/* ============ 按钮 ============ */
.et-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
    padding: 9px 16px;
    border-radius: 11px;
    font: inherit;
    font-size: 13.5px;
    font-weight: 700;
    border: 1px solid var(--et-line);
    background: var(--et-surface-2);
    color: var(--et-fg);
    cursor: pointer;
    transition: transform .14s, border-color .14s, color .14s, background .14s, box-shadow .14s;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
}

.et-btn:hover {
    border-color: var(--et-accent);
    color: var(--et-accent);
    transform: translateY(-1px);
}

.et-btn:active { transform: translateY(0); }
.et-btn:focus-visible { outline: 2px solid var(--et-accent); outline-offset: 2px; }
.et-btn:disabled { opacity: .45; cursor: not-allowed; transform: none; }

.et-btn--primary {
    background: var(--et-accent);
    border-color: var(--et-accent);
    color: #fff;
    box-shadow: 0 6px 18px -8px var(--et-accent);
}

.et-btn--primary:hover { color: #fff; filter: brightness(1.08); }
.et-btn--primary:disabled { filter: none; }

.et-btn--danger:hover {
    border-color: var(--et-err);
    color: var(--et-err);
}

.et-btn--lg {
    padding: 13px 26px;
    font-size: 16px;
    border-radius: 14px;
}

/* ============ 弹窗 ============ */
.et-modal {
    position: fixed;
    inset: 0;
    z-index: 100;
    display: grid;
    place-items: center;
    padding: 24px;
    background: rgba(2, 6, 23, .55);
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    animation: et-fade .18s ease;
}

.et-modal__panel {
    width: min(680px, 94vw);
    max-height: 86vh;
    max-height: 86dvh;
    display: flex;
    flex-direction: column;
    background: var(--et-surface);
    border: 1px solid var(--et-line);
    border-radius: 16px;
    box-shadow: var(--et-shadow-lg);
    animation: et-pop .2s cubic-bezier(.34, 1.4, .64, 1);
    overflow: hidden;
}

.et-modal__panel--narrow { width: min(460px, 92vw); }
.et-modal__panel--wide { width: min(900px, 94vw); }

.et-modal__head {
    flex: none;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 16px 20px;
    border-bottom: 1px solid var(--et-line);
    font-weight: 800;
    font-size: 15px;
}

.et-modal__head .et-icon-btn {
    margin-left: auto;
    width: 32px;
    height: 32px;
}

.et-modal__body {
    flex: 1;
    min-height: 0;
    overflow: auto;
    padding: 18px 20px;
}

.et-modal__foot {
    flex: none;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 14px 20px;
    border-top: 1px solid var(--et-line);
    background: var(--et-surface-2);
}

.et-modal__foot .spacer { flex: 1; }

@keyframes et-fade {
    from { opacity: 0; }
}

@keyframes et-pop {
    from { opacity: 0; transform: translateY(14px) scale(.97); }
}

/* ============ 轻提示（toast） ============ */
.et-toast {
    position: fixed;
    left: 50%;
    bottom: 56px;
    transform: translateX(-50%) translateY(10px);
    z-index: 120;
    display: flex;
    align-items: center;
    gap: 9px;
    max-width: min(520px, 88vw);
    padding: 11px 18px;
    border-radius: 12px;
    font-size: 13.5px;
    font-weight: 600;
    color: #fff;
    background: rgba(15, 23, 42, .92);
    border: 1px solid rgba(148, 163, 184, .25);
    box-shadow: var(--et-shadow-lg);
    opacity: 0;
    pointer-events: none;
    transition: opacity .22s, transform .22s;
}

.et-toast.is-show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
}

.et-toast[data-tone="ok"] { background: rgba(5, 150, 105, .95); }
.et-toast[data-tone="err"] { background: rgba(220, 38, 38, .95); }
.et-toast[data-tone="warn"] { background: rgba(217, 119, 6, .95); }

/* ============ 设置抽屉（右上角入口，edupick 交互） ============ */
.et-drawer-backdrop {
    position: fixed;
    inset: 0;
    z-index: 90;
    background: rgba(2, 6, 23, .45);
    backdrop-filter: blur(3px);
    -webkit-backdrop-filter: blur(3px);
    opacity: 0;
    transition: opacity .2s;
}

.et-drawer-backdrop.is-open { opacity: 1; }

.et-drawer {
    position: absolute;
    top: 0;
    right: 0;
    height: 100%;
    width: min(400px, 92vw);
    display: flex;
    flex-direction: column;
    background: var(--et-surface);
    border-left: 1px solid var(--et-line);
    box-shadow: var(--et-shadow-lg);
    transform: translateX(100%);
    transition: transform .22s cubic-bezier(.32, .72, .35, 1);
}

.et-drawer-backdrop.is-open .et-drawer { transform: translateX(0); }

.et-drawer__head {
    flex: none;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 15px 18px;
    border-bottom: 1px solid var(--et-line);
    font-weight: 800;
    font-size: 15px;
    color: var(--et-accent);
}

.et-drawer__head .et-icon-btn {
    margin-left: auto;
    width: 32px;
    height: 32px;
}

.et-drawer__body {
    flex: 1;
    min-height: 0;
    overflow: auto;
    padding: 16px 18px 24px;
}

/* 抽屉内容通用小节（工具复用） */
.et-drawer__body h4 {
    margin: 18px 0 8px;
    font-size: 12px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: .08em;
    color: var(--et-muted);
}

.et-drawer__body h4:first-child { margin-top: 0; }

.et-drawer__row {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
}

.et-drawer__tip {
    margin: 8px 0 0;
    font-size: 12px;
    line-height: 1.8;
    color: var(--et-muted);
}

.et-drawer__tip b { color: var(--et-fg); }

.et-drawer__input {
    flex: 1;
    min-width: 0;
    padding: 9px 12px;
    border: 1px solid var(--et-line-strong);
    border-radius: 9px;
    background: var(--et-surface-2);
    color: var(--et-fg);
    font: inherit;
    font-size: 13.5px;
    transition: border-color .14s, box-shadow .14s;
}

.et-drawer__input:focus {
    outline: none;
    border-color: var(--et-accent);
    box-shadow: 0 0 0 3px var(--et-accent-weak);
}

.et-drawer__switch {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 10px 0;
    border-bottom: 1px dashed var(--et-line);
    font-size: 13.5px;
    font-weight: 600;
    color: var(--et-fg);
    cursor: pointer;
    user-select: none;
}

.et-drawer__switch input {
    width: 17px;
    height: 17px;
    accent-color: var(--et-accent);
    cursor: pointer;
}
</style>

        { n: '青海省', s: '青', c: '西宁', area: 72.2, pop: 592, r: 'xibei', col: 1, row: 3, tip: '青海湖是我国最大的咸水湖，长江、黄河均发源于此。' },
        { n: '宁夏回族自治区', s: '宁', c: '银川', area: 6.64, pop: 720, r: 'xibei', col: 3, row: 2, tip: '黄河灌溉造就"塞上江南"，贺兰山阻挡风沙。' },
        { n: '新疆维吾尔自治区', s: '新', c: '乌鲁木齐', area: 166.0, pop: 2585, r: 'xibei', col: 0, row: 2, tip: '我国面积最大的省级行政区，三山夹两盆，盛产瓜果与棉花。' }
    ];

    var chrome = ET.Chrome.mount({
        toolId: TOOL_ID,
        title: '中国地图',
        sub: '地理 · 省级行政区速记',
        accent: '#0f766e',
        status: '就绪',
        sound: true,
        primary: quizNext,
        help: '<div style="font-size:13.5px;line-height:2">' +
            '<p style="margin:0 0 8px"><b>怎么用</b>：点击地图上任意省份轮廓，右侧显示该省级行政区的简称、行政中心、面积与人口，颜色代表所属地理分区。</p>' +
            '<p style="margin:0 0 8px"><b>速记练习</b>：切换到「速记练习」后，系统给出简称或行政中心，请在地图上点出对应的省级行政区，答对会打绿框。</p>' +
            '<p style="margin:0 0 8px"><b>注意</b>：地图为真实省界轮廓（Albers 等积投影，含南海诸岛与十段线），边界经简化仅作教学示意，不代表权威划界；面积、人口为常用统计约数。</p>' +
            '<p style="margin:0"><b>快捷键</b>：空格 / 翻页笔下页键 = 练习模式下换一题。</p></div>',
        settings: {
            title: '数据说明',
            build: function (body, drawer) {
                var p = document.createElement('p');
                p.style.cssText = 'font-size:13.2px;line-height:1.95;color:var(--et-muted);margin:0 0 8px';
                p.innerHTML = '共收录 <b>' + PROVINCES.length + '</b> 个省级行政区（含 23 省、5 自治区、' +
                    '4 直辖市、2 特别行政区）。<br>面积单位为万平方千米，人口为常用统计约数（万人）。';
                var key = document.createElement('div');
                key.className = 'mc-key';
                Object.keys(REGIONS).forEach(function (k) {
                    var sp = document.createElement('span');
                    sp.innerHTML = '<i style="background:' + REGIONS[k].color + '"></i>' + REGIONS[k].label;
                    key.appendChild(sp);
                });
                body.appendChild(p);
                body.appendChild(key);
                drawer.close();
            }
        }
    });

    var els = {
        grid: document.getElementById('grid'),
        panel: document.getElementById('panel'),
        key: document.getElementById('key'),
        modeBrowse: document.getElementById('modeBrowse'),
        modeQuiz: document.getElementById('modeQuiz')
    };

    var state = {
        mode: store.get('mode', 'browse'),
        sel: store.get('sel', 0),
        quiz: null,
        total: 0,
        hit: 0
    };

    if (state.mode !== 'browse' && state.mode !== 'quiz') { state.mode = 'browse'; }

    function byName(n) {
        for (var i = 0; i < PROVINCES.length; i++) {
            if (PROVINCES[i].n === n) { return i; }
        }
        return -1;
    }

    /* ---------- 图例 ---------- */

    function buildKey() {
        els.key.innerHTML = '';
        Object.keys(REGIONS).forEach(function (k) {
            var sp = document.createElement('span');
            sp.innerHTML = '<i style="background:' + REGIONS[k].color + '"></i>' + REGIONS[k].label;
            els.key.appendChild(sp);
        });
    }

    /* ---------- 地图（真实省界 SVG） ---------- */

    var NS_SVG = 'http://www.w3.org/2000/svg'; /* et-allow-external SVG 命名空间 */
    var mcPaths = []; /* 下标与 PROVINCES 对齐 */

    /* 个别省份形心不适合放标注（飞地/形状导致），手工偏移 */
    var LBL_SHIFT = {
        '河北省': [-34, -6],
        '香港特别行政区': [16, -4],
        '澳门特别行政区': [-4, 13]
    };

    function labelFont(area) {
        if (area >= 2500) { return 17; }
        if (area >= 900) { return 13; }
        if (area >= 200) { return 10.5; }
        if (area >= 30) { return 9; }
        return 8;
    }

    function svgEl(tag) {
        return document.createElementNS(NS_SVG, tag);
    }

    function buildMap() {
        var svg = document.getElementById('map');
        var geoByName = {};
        MC_GEO.p.forEach(function (g) { geoByName[g.n] = g; });

        /* 十段线（最底层） */
        var jd = svgEl('path');
        jd.setAttribute('d', MC_GEO.jd);
        jd.setAttribute('class', 'mc-jd');
        svg.appendChild(jd);

        var gProv = svgEl('g');
        PROVINCES.forEach(function (p, i) {
            var g = geoByName[p.n];
            if (!g) { return; }
            var path = svgEl('path');
            path.setAttribute('d', g.d);
            path.setAttribute('class', 'mc-prov');
            path.setAttribute('data-i', i);
            path.style.setProperty('--mc-region', REGIONS[p.r].color);

            var title = svgEl('title');
            title.textContent = p.n + '（简称 ' + p.s + '，行政中心 ' + p.c + '）';
            path.appendChild(title);

            path.addEventListener('click', function () {
                if (state.mode === 'quiz') {
                    answerQuiz(i, path);
                    return;
                }
                select(i);
                try { chrome.beep('tick'); } catch (e) { /* 静默 */ }
            });

            gProv.appendChild(path);
            mcPaths[i] = path;
        });
        svg.appendChild(gProv);

        /* 简称标注（最上层，不响应鼠标） */
        var gLbl = svgEl('g');
        MC_GEO.p.forEach(function (g) {
            var i = byName(g.n);
            if (i < 0) { return; }
            var p = PROVINCES[i];
            var sh = LBL_SHIFT[p.n] || [0, 0];
            var tx = svgEl('text');
            tx.setAttribute('x', g.cx + sh[0]);
            tx.setAttribute('y', g.cy + sh[1]);
            tx.setAttribute('class', 'mc-lbl');
            tx.setAttribute('font-size', labelFont(g.a));
            tx.textContent = p.s;
            gLbl.appendChild(tx);
        });
        svg.appendChild(gLbl);
    }

    function select(i) {
        state.sel = i;
        store.set('sel', i);
        for (var k = 0; k < mcPaths.length; k++) {
            if (mcPaths[k]) { mcPaths[k].classList.toggle('is-on', k === i); }
        }
        renderPanel();
        var p = PROVINCES[i];
        if (p) { chrome.setStatus(p.n + ' · ' + p.s, 'ok'); }
    }

    function renderPanel() {
        var html = '';

        if (state.mode === 'quiz') {
            html += quizPanelHtml();
        }

        if (state.sel < 0 || state.mode === 'quiz') {
            if (state.mode === 'quiz') {
                html += '<p class="mc-tip" style="margin-top:12px">练习进行中：点击地图上对应的省份作答。' +
                    '答错的省份会打红框，正确答案会打绿框。</p>';
            } else {
                html += '<div class="mc-empty">点击地图上任意省份<br>查看简称 · 行政中心 · 面积 · 人口</div>';
            }
            els.panel.innerHTML = html;
            els.panel.style.removeProperty('--mc-region');
            bindQuizButtons();
            return;
        }

        var p = PROVINCES[state.sel];
        els.panel.style.setProperty('--mc-region', REGIONS[p.r].color);
        html += '<div class="mc-title">' +
            '<h2>' + p.n + '</h2><span>' + REGIONS[p.r].label + '</span></div>';
        html += '<div class="mc-grid2">' +
            cell('简称', p.s + (p.alt ? '（别称 ' + p.alt + '）' : '')) +
            cell('行政中心', p.c) +
            cell('面积', p.area >= 1 ? (p.area + ' 万平方千米') : (p.area * 10000 + ' 平方千米')) +
            cell('人口（约）', p.pop + ' 万人') +
            '</div>';
        html += '<p class="mc-tip">' + p.tip + '</p>';
        els.panel.innerHTML = html;
    }

    function cell(label, value) {
        return '<div class="mc-cell"><b>' + label + '</b><span>' + value + '</span></div>';
    }

    /* ---------- 速记练习 ---------- */

    function setMode(mode) {
        state.mode = mode;
        store.set('mode', mode);
        els.modeBrowse.classList.toggle('is-on', mode === 'browse');
        els.modeQuiz.classList.toggle('is-on', mode === 'quiz');
        clearMarks();
        if (mode === 'quiz') {
            quizNext();
        } else {
            state.quiz = null;
            renderPanel();
        }
    }

    function clearMarks() {
        for (var i = 0; i < mcPaths.length; i++) {
            if (mcPaths[i]) { mcPaths[i].classList.remove('is-ok', 'is-no'); }
        }
    }

    function quizNext() {
        if (state.mode !== 'quiz') {
            setMode('quiz');
            return;
        }
        clearMarks();
        var idx = Math.floor(Math.random() * PROVINCES.length);
        var p = PROVINCES[idx];
        var askShort = Math.random() < 0.5;
        state.quiz = {
            idx: idx,
            text: askShort
                ? ('简称「' + p.s + '」是哪个省级行政区？')
                : ('行政中心是「' + p.c + '」的是哪个省级行政区？'),
            locked: false
        };
        renderPanel();
    }

    function quizPanelHtml() {
        if (!state.quiz) { return ''; }
        return '<div class="mc-quiz" style="margin:0 0 12px">' +
            '<div class="mc-quiz__q">' + state.quiz.text + '</div>' +
            '<div class="mc-quiz__feed" id="qFeed">在地图上点出对应的省份</div>' +
            '<div class="mc-quiz__stat" id="qStat">已答 ' + state.total + ' 题，答对 ' + state.hit + ' 题</div>' +
            '<button class="mc-btn mc-btn--primary" id="btnQuizNext" type="button">换一题</button>' +
            '</div>';
    }

    function bindQuizButtons() {
        var b = document.getElementById('btnQuizNext');
        if (b) { b.addEventListener('click', quizNext); }
    }

    function answerQuiz(i, block) {
        if (!state.quiz || state.quiz.locked) { return; }
        state.quiz.locked = true;
        state.total++;
        var ok = i === state.quiz.idx;
        var feed = document.getElementById('qFeed');
        var stat = document.getElementById('qStat');
        var right = PROVINCES[state.quiz.idx];

        if (ok) {
            state.hit++;
            block.classList.add('is-ok');
            if (feed) {
                feed.className = 'mc-quiz__feed is-ok';
                feed.textContent = '✓ 正确！' + right.n + '（' + right.s + '）行政中心 ' + right.c;
            }
            try { chrome.beep('ok'); } catch (e) { /* 静默 */ }
        } else {
            block.classList.add('is-no');
            if (mcPaths[state.quiz.idx]) { mcPaths[state.quiz.idx].classList.add('is-ok'); }
            if (feed) {
                feed.className = 'mc-quiz__feed is-no';
                feed.textContent = '✗ 你选的是 ' + PROVINCES[i].n + '，正确答案是 ' + right.n +
                    '（' + right.s + '，行政中心 ' + right.c + '）';
            }
            try { chrome.beep('err'); } catch (e) { /* 静默 */ }
        }
        if (stat) {
            stat.textContent = '已答 ' + state.total + ' 题，答对 ' + state.hit + ' 题 · 正确率 ' +
                Math.round(state.hit / state.total * 100) + '%';
        }
        chrome.setStatus(ok ? '答对了' : '再接再厉', ok ? 'ok' : 'warn');
        setTimeout(function () {
            if (state.mode === 'quiz') { quizNext(); }
        }, ok ? 900 : 2000);
    }

    /* ---------- 事件 ---------- */

    els.modeBrowse.addEventListener('click', function () { setMode('browse'); });
    els.modeQuiz.addEventListener('click', function () { setMode('quiz'); });

    function isTypingTarget(node) {
        if (!node || !node.tagName) { return false; }
        var tag = node.tagName.toUpperCase();
        return tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT' || node.isContentEditable === true;
    }

    document.addEventListener('keydown', function (e) {
        if (isTypingTarget(e.target) || document.querySelector('.et-modal, .et-drawer-backdrop')) { return; }
        if (e.code === 'Space') {
            e.preventDefault();
            quizNext();
        } else if (e.key === 'Escape' && state.mode === 'quiz') {
            setMode('browse');
        }
    });

    /* ---------- 启动 ---------- */

    buildKey();
    buildMap();
    if (typeof state.sel !== 'number' || state.sel < 0 || state.sel >= PROVINCES.length) { state.sel = 0; }
    if (state.mode === 'quiz') {
        els.modeBrowse.classList.remove('is-on');
        els.modeQuiz.classList.add('is-on');
        quizNext();
    } else {
        select(state.sel);
    }
})();
</script>

</body>
</html>
