/* ============ 设计令牌 ============ */
:root {
    --et-accent: #2563eb;
    --et-accent-weak: rgba(37, 99, 235, .14);
    --et-bg: #f4f6fb;
    --et-surface: #ffffff;
    --et-surface-2: #f8fafc;
    --et-fg: #0b1220;
    --et-muted: #64748b;
    --et-line: rgba(15, 23, 42, .12);
    --et-line-strong: rgba(15, 23, 42, .22);
    --et-glass: rgba(255, 255, 255, .85);
    --et-shadow-md: 0 10px 28px -18px rgba(15, 23, 42, .3);
    --et-shadow-lg: 0 24px 60px -32px rgba(15, 23, 42, .4);
    --et-ok: #059669;
    --et-warn: #d97706;
    --et-err: #dc2626;
    --et-radius: 12px;
    --et-radius-sm: 9px;
    --et-font: -apple-system, BlinkMacSystemFont, "Segoe UI",
               "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei",
               "Noto Sans SC", sans-serif;
    --et-mono: ui-monospace, "Cascadia Mono", Consolas, Menlo, monospace;
}

html[data-et-theme="dark"] {
    --et-bg: #0b1120;
    --et-surface: #111a2e;
    --et-surface-2: #0f1729;
    --et-fg: #f1f5f9;
    --et-muted: #94a3b8;
    --et-line: rgba(148, 163, 184, .18);
    --et-line-strong: rgba(148, 163, 184, .3);
    --et-glass: rgba(17, 26, 46, .85);
    --et-shadow-md: 0 10px 34px -18px rgba(0, 0, 0, .8);
    --et-shadow-lg: 0 24px 70px -30px rgba(0, 0, 0, .9);
    --et-ok: #34d399;
    --et-warn: #fbbf24;
    --et-err: #f87171;
}

/* ============ 基础 ============ */

/* body 作为外壳时必须清掉浏览器默认 8px 外边距，
   否则 iframe 预览中文档会比视口高 16px（底部白边 + 多余滚动） */
body.et-app {
    margin: 0;
}

.et-app {
    position: relative;
    isolation: isolate;
    display: flex;
    flex-direction: column;
    height: 100vh;
    height: 100dvh;
    overflow: hidden;
    background: var(--et-bg);
    color: var(--et-fg);
    font-family: var(--et-font);
    -webkit-font-smoothing: antialiased;
    transition: background .25s, color .25s;
}

/* 极光背景：径向渐变 + 呼吸动画（edupick 品质基线，老内核也不掉帧） */
.et-app::before {
    content: '';
    position: fixed;
    inset: 0;
    z-index: -1;
    pointer-events: none;
    background:
        radial-gradient(46% 40% at 20% 18%, var(--et-accent-weak), transparent 65%),
        radial-gradient(42% 38% at 82% 24%, var(--et-accent-weak), transparent 70%),
        radial-gradient(50% 44% at 55% 95%, rgba(16, 185, 129, .10), transparent 65%);
    animation: et-aurora 16s ease-in-out infinite alternate;
}

@keyframes et-aurora {
    from { opacity: .55; transform: scale(1); }
    to { opacity: 1; transform: scale(1.06); }
}

.et-app *,
.et-app *::before,
.et-app *::after { box-sizing: border-box; }

[hidden] { display: none !important; }

.et-icon {
    width: 18px;
    height: 18px;
    fill: none;
    stroke: currentColor;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
    flex: none;
}

/* ============ 顶栏 ============ */
.et-topbar {
    flex: none;
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 11px 20px;
    border-bottom: 1px solid var(--et-line);
    background: var(--et-glass);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    z-index: 20;
}

.et-brand {
    display: flex;
    align-items: center;
    gap: 10px;
    min-width: 0;
}

.et-brand__dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: var(--et-accent);
    box-shadow: 0 0 0 4px var(--et-accent-weak);
    flex: none;
}

.et-brand__name {
    font-weight: 800;
    font-size: 15px;
    letter-spacing: -.01em;
    white-space: nowrap;
}

.et-brand__sub {
    font-size: 12.5px;
    color: var(--et-muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.et-status {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 5px 14px;
    border-radius: 999px;
    font-size: 12.5px;
    color: var(--et-muted);
    background: var(--et-surface-2);
    border: 1px solid var(--et-line);
    white-space: nowrap;
    max-width: 42vw;
    overflow: hidden;
    text-overflow: ellipsis;
}

.et-status__dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--et-ok);
    flex: none;
    transition: background .2s;
}

.et-status[data-tone="err"] .et-status__dot { background: var(--et-err); }
.et-status[data-tone="warn"] .et-status__dot { background: var(--et-warn); }

.et-actions {
    display: flex;
    align-items: center;
    gap: 7px;
}

.et-icon-btn {
    display: inline-grid;
    place-items: center;
    width: 38px;
    height: 38px;
    font-size: 16px;
    line-height: 1;
    border-radius: 11px;
    border: 1px solid var(--et-line);
    background: var(--et-surface-2);
    color: var(--et-fg);
    cursor: pointer;
    transition: transform .14s, border-color .14s, color .14s, opacity .14s;
    -webkit-tap-highlight-color: transparent;
}

.et-icon-btn:hover {
    border-color: var(--et-accent);
    color: var(--et-accent);
    transform: translateY(-1px);
}

.et-icon-btn:active { transform: translateY(0); }
.et-icon-btn.is-off { opacity: .4; }
.et-icon-btn:focus-visible { outline: 2px solid var(--et-accent); outline-offset: 2px; }

/* ============ 主区默认 ============ */
.et-main {
    flex: 1;
    min-height: 0;
    position: relative;
    overflow: auto;
}

/* ============ 页脚（品牌回流 L2） ============ */
.et-footer {
    flex: none;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 7px 16px;
    font-size: 12px;
    color: var(--et-muted);
    border-top: 1px solid var(--et-line);
    background: var(--et-glass);
    user-select: none;
    z-index: 20;
}

.et-footer a {
    color: inherit;
    text-decoration: none;
    transition: color .14s;
}

.et-footer a:hover { color: var(--et-accent); }

/* ============ 按钮 ============ */
.et-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
    padding: 9px 16px;
    border-radius: 11px;
    font: inherit;
    font-size: 13.5px;
    font-weight: 700;
    border: 1px solid var(--et-line);
    background: var(--et-surface-2);
    color: var(--et-fg);
    cursor: pointer;
    transition: transform .14s, border-color .14s, color .14s, background .14s, box-shadow .14s;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
}

.et-btn:hover {
    border-color: var(--et-accent);
    color: var(--et-accent);
    transform: translateY(-1px);
}

.et-btn:active { transform: translateY(0); }
.et-btn:focus-visible { outline: 2px solid var(--et-accent); outline-offset: 2px; }
.et-btn:disabled { opacity: .45; cursor: not-allowed; transform: none; }

.et-btn--primary {
    background: var(--et-accent);
    border-color: var(--et-accent);
    color: #fff;
    box-shadow: 0 6px 18px -8px var(--et-accent);
}

.et-btn--primary:hover { color: #fff; filter: brightness(1.08); }
.et-btn--primary:disabled { filter: none; }

.et-btn--danger:hover {
    border-color: var(--et-err);
    color: var(--et-err);
}

.et-btn--lg {
    padding: 13px 26px;
    font-size: 16px;
    border-radius: 14px;
}

/* ============ 弹窗 ============ */
.et-modal {
    position: fixed;
    inset: 0;
    z-index: 100;
    display: grid;
    place-items: center;
    padding: 24px;
    background: rgba(2, 6, 23, .55);
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    animation: et-fade .18s ease;
}

.et-modal__panel {
    width: min(680px, 94vw);
    max-height: 86vh;
    max-height: 86dvh;
    display: flex;
    flex-direction: column;
    background: var(--et-surface);
    border: 1px solid var(--et-line);
    border-radius: 16px;
    box-shadow: var(--et-shadow-lg);
    animation: et-pop .2s cubic-bezier(.34, 1.4, .64, 1);
    overflow: hidden;
}

.et-modal__panel--narrow { width: min(460px, 92vw); }
.et-modal__panel--wide { width: min(900px, 94vw); }

.et-modal__head {
    flex: none;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 16px 20px;
    border-bottom: 1px solid var(--et-line);
    font-weight: 800;
    font-size: 15px;
}

.et-modal__head .et-icon-btn {
    margin-left: auto;
    width: 32px;
    height: 32px;
}

.et-modal__body {
    flex: 1;
    min-height: 0;
    overflow: auto;
    padding: 18px 20px;
}

.et-modal__foot {
    flex: none;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 14px 20px;
    border-top: 1px solid var(--et-line);
    background: var(--et-surface-2);
}

.et-modal__foot .spacer { flex: 1; }

@keyframes et-fade {
    from { opacity: 0; }
}

@keyframes et-pop {
    from { opacity: 0; transform: translateY(14px) scale(.97); }
}

/* ============ 轻提示（toast） ============ */
.et-toast {
    position: fixed;
    left: 50%;
    bottom: 56px;
    transform: translateX(-50%) translateY(10px);
    z-index: 120;
    display: flex;
    align-items: center;
    gap: 9px;
    max-width: min(520px, 88vw);
    padding: 11px 18px;
    border-radius: 12px;
    font-size: 13.5px;
    font-weight: 600;
    color: #fff;
    background: rgba(15, 23, 42, .92);
    border: 1px solid rgba(148, 163, 184, .25);
    box-shadow: var(--et-shadow-lg);
    opacity: 0;
    pointer-events: none;
    transition: opacity .22s, transform .22s;
}

.et-toast.is-show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
}

.et-toast[data-tone="ok"] { background: rgba(5, 150, 105, .95); }
.et-toast[data-tone="err"] { background: rgba(220, 38, 38, .95); }
.et-toast[data-tone="warn"] { background: rgba(217, 119, 6, .95); }

/* ============ 设置抽屉（右上角入口，edupick 交互） ============ */
.et-drawer-backdrop {
    position: fixed;
    inset: 0;
    z-index: 90;
    background: rgba(2, 6, 23, .45);
    backdrop-filter: blur(3px);
    -webkit-backdrop-filter: blur(3px);
    opacity: 0;
    transition: opacity .2s;
}

.et-drawer-backdrop.is-open { opacity: 1; }

.et-drawer {
    position: absolute;
    top: 0;
    right: 0;
    height: 100%;
    width: min(400px, 92vw);
    display: flex;
    flex-direction: column;
    background: var(--et-surface);
    border-left: 1px solid var(--et-line);
    box-shadow: var(--et-shadow-lg);
    transform: translateX(100%);
    transition: transform .22s cubic-bezier(.32, .72, .35, 1);
}

.et-drawer-backdrop.is-open .et-drawer { transform: translateX(0); }

.et-drawer__head {
    flex: none;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 15px 18px;
    border-bottom: 1px solid var(--et-line);
    font-weight: 800;
    font-size: 15px;
    color: var(--et-accent);
}

.et-drawer__head .et-icon-btn {
    margin-left: auto;
    width: 32px;
    height: 32px;
}

.et-drawer__body {
    flex: 1;
    min-height: 0;
    overflow: auto;
    padding: 16px 18px 24px;
}

/* 抽屉内容通用小节（工具复用） */
.et-drawer__body h4 {
    margin: 18px 0 8px;
    font-size: 12px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: .08em;
    color: var(--et-muted);
}

.et-drawer__body h4:first-child { margin-top: 0; }

.et-drawer__row {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
}

.et-drawer__tip {
    margin: 8px 0 0;
    font-size: 12px;
    line-height: 1.8;
    color: var(--et-muted);
}

.et-drawer__tip b { color: var(--et-fg); }

.et-drawer__input {
    flex: 1;
    min-width: 0;
    padding: 9px 12px;
    border: 1px solid var(--et-line-strong);
    border-radius: 9px;
    background: var(--et-surface-2);
    color: var(--et-fg);
    font: inherit;
    font-size: 13.5px;
    transition: border-color .14s, box-shadow .14s;
}

.et-drawer__input:focus {
    outline: none;
    border-color: var(--et-accent);
    box-shadow: 0 0 0 3px var(--et-accent-weak);
}

.et-drawer__switch {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 10px 0;
    border-bottom: 1px dashed var(--et-line);
    font-size: 13.5px;
    font-weight: 600;
    color: var(--et-fg);
    cursor: pointer;
    user-select: none;
}

.et-drawer__switch input {
    width: 17px;
    height: 17px;
    accent-color: var(--et-accent);
    cursor: pointer;
}
</style>

/* 关键：盘面包裹层是 justify-content:center 的 flex，
   图鉴模式下必须改回块级，否则 #board 收缩成内容宽、居中留白 */
.cuboidnet-main.is-gallery .cn-board-wrap {
    display: block;
    padding: clamp(16px, 2.4vmin, 32px);
}

.cuboidnet-main.is-gallery #board {
    width: 100%;
}

.cn-card {
    border: 1px solid var(--et-line);
    border-radius: 12px;
    background: var(--et-surface);
    padding: 16px 14px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 7px;
    cursor: pointer;
    transition: border-color .15s, transform .15s;
}

.cn-card:hover {
    border-color: var(--cuboidnet-accent);
    transform: translateY(-2px);
}

.cn-card.is-on {
    border-color: var(--cuboidnet-accent);
    box-shadow: 0 0 0 2px var(--et-accent-weak);
}

.cn-mini {
    display: grid;
    gap: calc(var(--cn-mini-cell) * .14);
}

.cn-mini span {
    width: var(--cn-mini-cell);
    height: var(--cn-mini-cell);
    border-radius: 4px;
    background: var(--cuboidnet-accent);
}

.cn-mini span.is-off {
    background: transparent;
}

.cn-card em {
    font-style: normal;
    font-size: 13.5px;
    color: var(--et-muted);
}

.cn-card b {
    font-size: 14.5px;
}

/* ---------- 家族筛选 ---------- */

.cn-fams {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
}

.cn-fams button {
    border: 1px solid var(--et-line);
    background: var(--et-surface);
    color: var(--et-muted);
    font: inherit;
    font-size: 12.5px;
    padding: 4px 10px;
    border-radius: 999px;
    cursor: pointer;
}

.cn-fams button.is-on {
    border-color: var(--cuboidnet-accent);
    color: var(--cuboidnet-accent);
    background: var(--et-accent-weak);
    font-weight: 600;
}

/* ---------- 打印 ---------- */

@media print {
    .cn-side,
    .cn-bar,
    .cn-actions {
        display: none !important;
    }

    .cn-board-wrap {
        border: 0;
    }

    body {
        background: #fff;
    }
}
</style>

        var svg = document.createElementNS(NS_SVG, 'svg');
        svg.setAttribute('class', cls || 'et-icon');
        var use = document.createElementNS(NS_SVG, 'use');
        use.setAttribute('href', '#' + id);
        use.setAttributeNS(NS_XLINK, 'xlink:href', '#' + id);
        svg.appendChild(use);
        return svg;
    }

    function makeBtn(icon, title, onClick) {
        var b = document.createElement('button');
        b.className = 'et-icon-btn';
        b.type = 'button';
        b.title = title;
        b.setAttribute('aria-label', title);
        b.appendChild(makeIcon(icon));
        if (onClick) { b.addEventListener('click', onClick); }
        return b;
    }

    function el(tag, cls, text) {
        var node = document.createElement(tag);
        if (cls) { node.className = cls; }
        if (text !== undefined && text !== null) { node.textContent = text; }
        return node;
    }

    /* ---------- 音效（WebAudio，无音频文件，音量按教室大屏调校） ---------- */

    var audioCtx = null;

    function ensureCtx() {
        if (!audioCtx) {
            var AC = global.AudioContext || global.webkitAudioContext;
            if (!AC) { return null; }
            try { audioCtx = new AC(); } catch (err) { return null; }
        }
        if (audioCtx.state === 'suspended') {
            try { audioCtx.resume(); } catch (err) { /* 忽略 */ }
        }
        return audioCtx;
    }

    var MASTER_GAIN = 0.5; /* 整体音量层（教室设备音量 100% 也要听得清） */

    function tone(ctx, freq, start, dur, gainPeak, type) {
        var osc = ctx.createOscillator();
        var gain = ctx.createGain();
        osc.type = type || 'triangle';
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(0, start);
        gain.gain.linearRampToValueAtTime(gainPeak, start + 0.012);
        gain.gain.exponentialRampToValueAtTime(0.0001, start + dur);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(start);
        osc.stop(start + dur + 0.05);
    }

    var BEEPS = {
        tick: [[880, 0, 0.06, 0.42]],
        ok: [[660, 0, 0.1, 0.46], [880, 0.1, 0.14, 0.46]],
        win: [[523.25, 0, 0.16, 0.5], [659.25, 0.12, 0.16, 0.5], [783.99, 0.24, 0.16, 0.5], [1046.5, 0.36, 0.34, 0.52]],
        err: [[220, 0, 0.22, 0.46, 'square']],
        over: [[880, 0, 0.18, 0.5], [659.25, 0.2, 0.18, 0.5], [523.25, 0.4, 0.36, 0.5]]
    };

    function playBeep(kind) {
        var ctx = ensureCtx();
        if (!ctx || !BEEPS[kind]) { return; }
        var seq = BEEPS[kind];
        var t0 = ctx.currentTime + 0.01;
        for (var i = 0; i < seq.length; i++) {
            tone(ctx, seq[i][0], t0 + seq[i][1], seq[i][2], seq[i][3] * MASTER_GAIN, seq[i][4]);
        }
    }

    /* ---------- 设置抽屉 ---------- */

    function openDrawer(title, build) {
        var backdrop = el('div', 'et-drawer-backdrop');
        var drawer = el('aside', 'et-drawer');
        drawer.setAttribute('role', 'dialog');
        drawer.setAttribute('aria-label', title);

        var head = el('div', 'et-drawer__head');
        head.appendChild(makeIcon('i-sliders'));
        head.appendChild(el('span', 'et-drawer__title', title));
        head.appendChild(makeBtn('i-x', '关闭', close));
        drawer.appendChild(head);

        var body = el('div', 'et-drawer__body');
        drawer.appendChild(body);

        backdrop.appendChild(drawer);
        document.body.appendChild(backdrop);
        requestAnimationFrame(function () { backdrop.classList.add('is-open'); });

        function close() {
            backdrop.classList.remove('is-open');
            document.removeEventListener('keydown', onKey);
            setTimeout(function () {
                if (backdrop.parentNode) { backdrop.parentNode.removeChild(backdrop); }
            }, 220);
        }
        function onKey(ev) {
            if (ev.key === 'Escape') { ev.stopPropagation(); close(); }
        }
        document.addEventListener('keydown', onKey);
        backdrop.addEventListener('mousedown', function (ev) {
            if (ev.target === backdrop) { close(); }
        });

        if (typeof build === 'function') {
            /* 兼容两种约定：build 自己往 body 里塞内容，或 return 一个元素节点 */
            var ret = build(body, { close: close });
            if (ret && ret.nodeType === 1 && ret.parentNode !== body) {
                body.appendChild(ret);
            }
        }
        return { body: body, close: close };
    }

    /* ---------- 通用弹窗 / toast（同时挂模块级，供其他共享组件使用） ---------- */

    function modal(mo) {
        var backdrop = el('div', 'et-modal');
        var panel = el('div', 'et-modal__panel' + (mo.size === 'narrow' ? ' et-modal__panel--narrow'
            : mo.size === 'wide' ? ' et-modal__panel--wide' : ''));
        var head = el('div', 'et-modal__head');
        if (mo.icon) { head.appendChild(makeIcon(mo.icon)); }
        head.appendChild(el('span', null, mo.title || ''));
        head.appendChild(makeBtn('i-x', '关闭', close));
        panel.appendChild(head);

        var body = el('div', 'et-modal__body');
        if (typeof mo.body === 'string') { body.innerHTML = mo.body; }
        else if (mo.body) { body.appendChild(mo.body); }
        panel.appendChild(body);

        var foot = null;
        if (mo.buttons && mo.buttons.length) {
            foot = el('div', 'et-modal__foot');
            foot.appendChild(el('span', 'spacer'));
            mo.buttons.forEach(function (b) {
                var btn = el('button', 'et-btn' + (b.primary ? ' et-btn--primary' : '') + (b.danger ? ' et-btn--danger' : ''), b.label);
                btn.type = 'button';
                btn.addEventListener('click', function () {
                    if (b.onClick) { b.onClick(close); } else { close(); }
                });
                foot.appendChild(btn);
            });
            panel.appendChild(foot);
        }

        backdrop.appendChild(panel);
        document.body.appendChild(backdrop);

        function close() {
            if (backdrop.parentNode) { backdrop.parentNode.removeChild(backdrop); }
            document.removeEventListener('keydown', onKey);
            if (mo.onClose) { mo.onClose(); }
        }
        function onKey(ev) {
            if (ev.key === 'Escape') { ev.stopPropagation(); close(); }
        }
        document.addEventListener('keydown', onKey);
        backdrop.addEventListener('mousedown', function (ev) {
            if (ev.target === backdrop) { close(); }
        });

        return { panel: panel, body: body, foot: foot, close: close };

    var toastEl = null;
    var toastTimer = 0;

    function toast(msg, tone) {
        if (!toastEl) {
            toastEl = el('div', 'et-toast');
            document.body.appendChild(toastEl);
        }
        toastEl.textContent = msg;
        toastEl.setAttribute('data-tone', tone || '');
        void toastEl.offsetWidth;
        toastEl.classList.add('is-show');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(function () { toastEl.classList.remove('is-show'); }, 2200);
    }

    /* ---------- PWA 元数据（blob manifest，环境不支持时静默跳过） ---------- */

    function installPwa(toolId, title, accent) {
        try {
            var theme = document.querySelector('meta[name="theme-color"]');
            if (!theme) {
                theme = document.createElement('meta');
                theme.setAttribute('name', 'theme-color');
                document.head.appendChild(theme);
            }
            theme.setAttribute('content', accent || '#2563eb');

            var svg = '<svg xmlns="' + NS_SVG + '" viewBox="0 0 64 64">' +
                '<rect width="64" height="64" rx="14" fill="' + (accent || '#2563eb') + '"/>' +
                '<text x="32" y="43" font-size="32" font-weight="800" font-family="sans-serif" ' +
                'fill="#fff" text-anchor="middle">' + (title || '课').charAt(0) + '</text></svg>';
            var iconUri = 'data:image/svg+xml,' + encodeURIComponent(svg);

            var mf = {
                name: title || 'KeeTools 课工具',
                short_name: title || '课工具',
                start_url: '.',
                display: 'standalone',
                background_color: '#f4f6fb',
                theme_color: accent || '#2563eb',
                icons: [{ src: iconUri, sizes: 'any', type: 'image/svg+xml', purpose: 'any' }]
            };
            var blob = new Blob([JSON.stringify(mf)], { type: 'application/manifest+json' });
            var link = document.createElement('link');
            link.rel = 'manifest';
            link.href = URL.createObjectURL(blob);
            document.head.appendChild(link);
        } catch (err) { /* 不支持 PWA 元数据的环境静默跳过 */ }
    }

    /* ---------- 挂载 ---------- */

    function mount(options) {
        var opt = options || {};
        var toolId = opt.toolId || 'unknown-tool';
        var store = global.ET && global.ET.store
            ? global.ET.store(toolId)
            : (function () { return { get: function () { return null; }, set: function () {} }; })();

        var api = { toolId: toolId, store: store };
        var soundEnabled = store.get('sound', true) !== false;

        /* 主题色 */
        if (opt.accent) {
            document.documentElement.style.setProperty('--et-accent', opt.accent);
        }

        installPwa(toolId, opt.title, opt.accent);

        /* ---------- 主题 ---------- */
        var theme = store.get('theme', null);
        if (theme !== 'dark' && theme !== 'light') {
            theme = (global.matchMedia && global.matchMedia('(prefers-color-scheme: dark)').matches)
                ? 'dark' : 'light';
        }
        applyTheme(theme);

        function applyTheme(t) {
            theme = t;
            document.documentElement.setAttribute('data-et-theme', t);
            store.set('theme', t);
            if (themeBtn) {
                themeBtn.innerHTML = '';
                themeBtn.appendChild(makeIcon(t === 'dark' ? 'i-sun' : 'i-moon'));
                themeBtn.title = t === 'dark' ? '切换到浅色' : '切换到深色';
            }
        }

        /* ---------- 顶栏 ---------- */
        var topbar = document.getElementById('et-topbar');
        var main = document.getElementById('et-main');
        var footer = document.getElementById('et-footer');

        if (!topbar) { topbar = el('header'); topbar.id = 'et-topbar'; document.body.insertBefore(topbar, document.body.firstChild); }
        if (!main) { main = el('main'); main.id = 'et-main'; topbar.after(main); }
        if (!footer) { footer = el('footer'); footer.id = 'et-footer'; document.body.appendChild(footer); }

        topbar.className = 'et-topbar';
        main.classList.add('et-main');
        footer.className = 'et-footer';

        /* 品牌 */
        var brand = el('div', 'et-brand');
        brand.appendChild(el('span', 'et-brand__dot'));
        var nameWrap = el('div');
        nameWrap.style.cssText = 'min-width:0;line-height:1.25';
        nameWrap.appendChild(el('div', 'et-brand__name', opt.title || '课工具'));
        if (opt.sub) { nameWrap.appendChild(el('div', 'et-brand__sub', opt.sub)); }
        brand.appendChild(nameWrap);
        topbar.appendChild(brand);

        /* 状态胶囊 */
        var statusPill = el('div', 'et-status');
        statusPill.hidden = true;
        statusPill.appendChild(el('span', 'et-status__dot'));
        var statusText = el('span', null, '');
        statusPill.appendChild(statusText);
        topbar.appendChild(statusPill);

        api.setStatus = function (text, tone) {
            if (!text) { statusPill.hidden = true; return; }
            statusText.textContent = text;
            statusPill.setAttribute('data-tone', tone || 'ok');
            statusPill.hidden = false;
        };
        if (opt.status) { api.setStatus(opt.status); }

        /* 动作区（edupick 交互：右上角聚合设置入口） */
        var actions = el('div', 'et-actions');

        var settingsBtn = null;
        if (opt.settings && typeof opt.settings.build === 'function') {
            settingsBtn = makeBtn('i-sliders', opt.settings.title || '设置', function () {
                openDrawer(opt.settings.title || '设置', function (body, drawerApi) {
                    return opt.settings.build(body, { api: api, close: drawerApi.close });
                });
            });
            actions.appendChild(settingsBtn);
        }

        (opt.actions || []).forEach(function (a) {
            var b = makeBtn(a.icon, a.label || '', a.onClick);
            if (a.id) { b.id = a.id; }
            actions.appendChild(b);
        });

        var soundBtn = null;
        if (opt.sound) {
            soundBtn = makeBtn(soundEnabled ? 'i-volume' : 'i-volume-off',
                soundEnabled ? '关闭音效' : '开启音效', toggleSound);
            if (!soundEnabled) { soundBtn.classList.add('is-off'); }
            actions.appendChild(soundBtn);
        }

        if (opt.help) {
            actions.appendChild(makeBtn('i-help', '使用说明', function () { openHelp(); }));
        }

        var themeBtn = makeBtn('', '切换主题', function () {
            applyTheme(theme === 'dark' ? 'light' : 'dark');
        });
        applyTheme(theme); /* 填充图标 */
        actions.appendChild(themeBtn);

        /* 全屏按钮始终保留：iframe 内对本工具文档 requestFullscreen
           （宿主 iframe 已声明 allow="fullscreen"），与宿主「全屏体验」等效同屏。 */
        var fsBtn = makeBtn('i-maximize', '全屏', toggleFullscreen);
        actions.appendChild(fsBtn);

        topbar.appendChild(actions);

        function toggleSound() {
            soundEnabled = !soundEnabled;
            store.set('sound', soundEnabled);
            soundBtn.innerHTML = '';
            soundBtn.appendChild(makeIcon(soundEnabled ? 'i-volume' : 'i-volume-off'));
            soundBtn.title = soundEnabled ? '关闭音效' : '开启音效';
            soundBtn.classList.toggle('is-off', !soundEnabled);
            if (soundEnabled) { api.beep('ok'); }
        }

        api.openSettings = function () {
            if (settingsBtn) { settingsBtn.click(); }
        };

        /* ---------- 全屏（iframe 内委托宿主，避免双层全屏） ---------- */

        function inIframe() {
            try { return global.parent && global.parent !== global; } catch (err) { return true; }
        }

        function toggleFullscreen() {
            var root = document.documentElement;
            var fsEl = document.fullscreenElement || document.webkitFullscreenElement || null;
            if (fsEl) {
                (document.exitFullscreen || document.webkitExitFullscreen || function () {}).call(document);
            } else {
                var req = root.requestFullscreen || root.webkitRequestFullscreen;
                if (req) { try { req.call(root); } catch (err) { /* 忽略 */ } }
            }
        }

        function syncFsIcon(on) {
            if (!fsBtn) { return; }
            fsBtn.innerHTML = '';
            fsBtn.appendChild(makeIcon(on ? 'i-minimize' : 'i-maximize'));
            fsBtn.title = on ? '退出全屏' : '全屏';
        }

        document.addEventListener('fullscreenchange', function () {
            syncFsIcon(!!(document.fullscreenElement || document.webkitFullscreenElement));
        });
        document.addEventListener('webkitfullscreenchange', function () {
            syncFsIcon(!!(document.fullscreenElement || document.webkitFullscreenElement));
        });
        syncFsIcon(false);

        api.toggleFullscreen = toggleFullscreen;

        /* ---------- 音效 API ---------- */
        api.beep = function (kind) {
            if (!soundEnabled) { return; }
            playBeep(kind);
        };
        api.soundOn = function () { return soundEnabled; };

        api.modal = modal;

        /* ---------- 帮助 ---------- */
        function openHelp() {
            modal({
                title: '使用说明',
                icon: 'i-help',
                size: 'narrow',
                body: opt.help,
                buttons: [{ label: '知道了', primary: true }]
            });
        }
        api.openHelp = openHelp;

        /* ---------- toast ---------- */
        api.toast = toast;

        /* ---------- 页脚（L2 品牌回流，低调一行） ---------- */
        var siteOrigin = typeof global.ET_SITE_ORIGIN === 'string' && /^https?:\/\//.test(global.ET_SITE_ORIGIN)
            ? global.ET_SITE_ORIGIN
            : null;

        function renderFooter() {
            footer.textContent = '';
            footer.appendChild(el('span', null, 'KeeTools 课工具'));
            footer.appendChild(el('span', null, '·'));
            if (siteOrigin) {
                var a = el('a', null, '更多课堂工具');
                a.href = siteOrigin + '/?from=tool-footer&tool=' + encodeURIComponent(toolId);
                a.target = '_blank';
                a.rel = 'noopener';
                footer.appendChild(a);
            } else {
                footer.appendChild(el('span', null, '更多课堂工具'));
            }
        }
        renderFooter();

        /* 站点来源发现：iframe 内向父窗口询问；也可由宿主直接注入 ET_SITE_ORIGIN */
        try {
            if (global.parent && global.parent !== global) {
                global.parent.postMessage(JSON.stringify({ type: 'et-hello', toolId: toolId }), '*');
            }
        } catch (err) { /* 跨域异常忽略 */ }

        global.addEventListener('message', function (ev) {
            var data = ev.data;
            if (typeof data === 'string') {
                try { data = JSON.parse(data); } catch (err) { return; }
            }
            if (!data || typeof data !== 'object') { return; }

            if (data.type === 'et-origin' && typeof data.origin === 'string' && /^https?:\/\//.test(data.origin)) {
                siteOrigin = data.origin;
                if (!global.ET_SITE_ORIGIN) { global.ET_SITE_ORIGIN = data.origin; }
                renderFooter();
            }
            if (data.type === 'et-fullscreen-change' && typeof data.value === 'boolean') {
                syncFsIcon(data.value);
            }
        });

        api.el = { topbar: topbar, main: main, footer: footer, actions: actions };

         * 翻页笔的上下页键在系统层等价于 PageDown / PageUp。
         * 工具通过 opt.primary / opt.secondary 注册动作：
         *   PageDown → primary（主操作，如开始点名 / 开始计时）
         *   PageUp   → secondary（副操作，缺省时同 primary）
         * 输入框聚焦或弹窗/抽屉打开时不响应，避免误触。 */
        if (typeof opt.primary === 'function') {
            document.addEventListener('keydown', function (ev) {
                if (ev.key !== 'PageDown' && ev.key !== 'PageUp') { return; }
                var tag = (document.activeElement && document.activeElement.tagName) || '';
                if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') { return; }
                if (document.querySelector('.et-modal, .et-drawer-backdrop, .ws-winner')) { return; }
                ev.preventDefault();
                if (ev.key === 'PageDown') { opt.primary(); }
                else if (typeof opt.secondary === 'function') { opt.secondary(); }
                else { opt.primary(); }
            });
        }

        return api;
    }

    global.ET = global.ET || {};
    global.ET.Chrome = {

        modal: modal,
        toast: toast,
        beep: playBeep /* 挂载前的独立音效入口（不经过音效开关） */
    };
})(window);
</script>

  /* 此块由 scripts/sync_shared.py 自动注入，请勿手工修改 */
/*!
 * et-stats.js — 使用统计模块（模块化，可整体移除）
 *
 * 共享逻辑源。改这里，然后跑：python scripts/sync_shared.py
 * 依赖：无（可脱离 et-util / et-chrome 独立运行）。
 * 全局：ET.Stats
 *
 * ┌────────────────────────────────────────────────────────────────┐
 * │ 说明：本模块只做一件事——工具被打开时向上报端点发一条匿名计数。 │
 * │ · 在线（iframe 内）：宿主页面已服务端计数，本模块不重复上报。   │
 * │ · 离线打开（file:// / 下载单文件 / 离线包）：联网条件具备时，   │
 * │   以 sendBeacon 上报 use_offline 事件（text/plain 免预检）。    │
 * │ · 上报端点 = window.ET_SITE_ORIGIN（由宿主注入或离线包配置）。  │
 * │   未配置端点时本模块完全静默，不发任何请求。                    │
 * │ · **整个 <script> 块可安全删除**：删除后工具其余功能完全正常，  │
 * │   且完全不再发起任何网络请求。                                  │
 * └────────────────────────────────────────────────────────────────┘
 */
(function (global) {
    'use strict';

    var ET = global.ET = global.ET || {};

    var Stats = {
        /** 上报端点来源（站点绝对地址，无协议尾斜杠） */
        endpoint: (typeof global.ET_SITE_ORIGIN === 'string' && /^https?:\/\//.test(global.ET_SITE_ORIGIN))
            ? global.ET_SITE_ORIGIN
            : null,

        _done: {},

        /**
         * 上报一次事件（同一事件同一工具每次页面加载只报一次）。
         * event: 'use_offline' 等；toolId: 工具 id。
         */
        send: function (event, toolId) {
            if (!event || this._done[event + ':' + (toolId || '')]) { return false; }
            if (!this.endpoint) { return false; }
            /* iframe 内由宿主统计，避免双计 */
            try {
                if (global.parent && global.parent !== global) { return false; }
            } catch (err) { return false; }
            /* 断网时挂起，网络恢复自动补报一次 */
            if (global.navigator && global.navigator.onLine === false) {
                var self = this;
                global.addEventListener('online', function () { self.send(event, toolId); }, { once: true });
                return false;
            }

            this._done[event + ':' + (toolId || '')] = true;
            var payload = JSON.stringify({ event: event, tool: toolId || '' });

            try {
                if (global.navigator.sendBeacon) {
                    return global.navigator.sendBeacon(
                        this.endpoint + '/api/track',
                        new Blob([payload], { type: 'text/plain;charset=UTF-8' })
                    );
                }
                global.fetch(this.endpoint + '/api/track', {
                    method: 'POST',
                    body: payload,
                    keepalive: true,
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'text/plain;charset=UTF-8' }
                });
                return true;
            } catch (err) {
                return false;
            }
        }
    };

    ET.Stats = Stats;
})(window);
</script>

    function isTypingTarget(node) {

    /* ---------- 立方体滚动内核 ---------- */

    var START = { top: 'U', bottom: 'D', north: 'N', south: 'S', east: 'E', west: 'W' };

    function roll(s, dx, dy) {
        if (dx === 1) {
            return { top: s.west, bottom: s.east, east: s.top, west: s.bottom, north: s.north, south: s.south };
        }
        if (dx === -1) {
            return { top: s.east, bottom: s.west, west: s.top, east: s.bottom, north: s.north, south: s.south };
        }
        if (dy === 1) {
            return { top: s.north, bottom: s.south, south: s.top, north: s.bottom, east: s.east, west: s.west };
        }
        return { top: s.south, bottom: s.north, north: s.top, south: s.bottom, east: s.east, west: s.west };
    }

    /* 在格子集合上滚动立方体，返回 { 'x,y': 底面标签 }。
       某格被两条路径到达且底面不同、或图形不连通时返回 null —— 该形状不可折叠。 */
    function faceMap(cells) {
        var set = {};
        var i;
        for (i = 0; i < cells.length; i++) { set[cells[i][0] + ',' + cells[i][1]] = true; }
        var queue = [[cells[0], START]];
        var res = {};
        while (queue.length) {
            var cell = queue[0][0];
            var st = queue[0][1];
            queue.shift();
            var key = cell[0] + ',' + cell[1];
            if (res[key] !== undefined) {
                if (res[key] !== st.bottom) { return null; }
                continue;
            }
            res[key] = st.bottom;
            var dirs = [[1, 0], [-1, 0], [0, 1], [0, -1]];
            for (var d = 0; d < dirs.length; d++) {
                var nx = cell[0] + dirs[d][0];
                var ny = cell[1] + dirs[d][1];
                if (set[nx + ',' + ny]) {
                    queue.push([[nx, ny], roll(st, dirs[d][0], dirs[d][1])]);
                }
            }
        }
        var n = 0;
        for (var k in res) {
            if (Object.prototype.hasOwnProperty.call(res, k)) { n++; }
        }
        return n === cells.length ? res : null;
    }

    function flatToCells(flat) {
        var out = [];
        for (var i = 0; i < flat.length; i += 2) { out.push([flat[i], flat[i + 1]]); }
        return out;
    }

    function normalize(list) {
        var mx = Infinity;
        var my = Infinity;
        var i;
        for (i = 0; i < list.length; i++) {
            if (list[i][0] < mx) { mx = list[i][0]; }
            if (list[i][1] < my) { my = list[i][1]; }
        }
        var out = [];
        for (i = 0; i < list.length; i++) { out.push([list[i][0] - mx, list[i][1] - my]); }
        return out;
    }

    /* ---------- 出题 ---------- */

    function netFromData(item) {
        var cells = flatToCells(item.c);
        var faces = item.f.split('');
        var mir = Math.random() < 0.5 ? 1 : 0;
        var rot = Math.floor(Math.random() * 4);
        var moved = [];
        var i;
        for (i = 0; i < cells.length; i++) {
            var x = cells[i][0];
            var y = cells[i][1];
            if (mir) { var t0 = x; x = y; y = t0; }
            for (var r = 0; r < rot; r++) { var t1 = x; x = -y; y = t1; }
            moved.push({ x: x, y: y, f: faces[i] });
        }
        var minx = Infinity;
        var miny = Infinity;
        for (i = 0; i < moved.length; i++) {
            if (moved[i].x < minx) { minx = moved[i].x; }
            if (moved[i].y < miny) { miny = moved[i].y; }
        }
        var arr = [];
        var map = {};
        for (i = 0; i < moved.length; i++) {
            var cx = moved[i].x - minx;
            var cy = moved[i].y - miny;
            arr.push([cx, cy]);
            map[cx + ',' + cy] = moved[i].f;
        }
        return { cells: arr, faceOf: map, fam: item.fam, answer: true };
    }

    function buildQuestion() {
        if (Math.random() < 0.5) {
            return netFromData(NETS[Math.floor(Math.random() * NETS.length)]);
        }
        var flat = BAD_SHAPES[Math.floor(Math.random() * BAD_SHAPES.length)];
        return { cells: normalize(flatToCells(flat)), faceOf: null, fam: '', answer: false };
    }

    function nextQuestion() {
        if (state.mode === 'gallery') { return; }
        if (state.mode === 'judge') {
            cur = buildQuestion();
            answered = false;
        } else {
            cur = netFromData(NETS[Math.floor(Math.random() * NETS.length)]);
            picked = null;
            answered = false;
        }
        render();
    }

    /* ---------- 渲染 ---------- */

    function render() {
        var btns = els.seg.getElementsByTagName('button');
        for (var b = 0; b < btns.length; b++) {
            btns[b].classList.toggle('is-on', btns[b].getAttribute('data-mode') === state.mode);
        }
        chrome.setStatus(MODE_LABEL[state.mode]);
        els.pairs.textContent = '';
        els.note.textContent = '';
        var cube = document.querySelector('.cn-cube');
        if (cube) { cube.parentNode.removeChild(cube); }
        /* 图鉴模式：侧栏与作答条隐藏，盘面区全屏铺开 */
        els.main.classList.toggle('is-gallery', state.mode === 'gallery');

        if (state.mode === 'gallery') {
            els.actions.classList.add('is-hidden');
            els.btnNew.style.visibility = 'hidden';
            renderGallery();
            return;
        }
        els.actions.classList.toggle('is-hidden', state.mode !== 'judge');
        els.btnNew.style.visibility = state.mode === 'build' ? 'hidden' : '';
        renderBoard();

        if (state.mode === 'judge') {
            els.stat.textContent = total > 0
                ? '已答 ' + total + ' 题 · 正确 ' + correct + ' 题（' + Math.round(correct / total * 100) + '%）'
                : '先想一想，再作答';
            if (answered) {
                setVerdict(answered === 'yes' === cur.answer ? 'ok' : 'bad', verdictText());
                if (cur.faceOf) { renderPairs(cur.faceOf); }
            } else {
                setVerdict('idle', '这个图形能折成正方体吗？');
            }
            els.note.textContent = '提示：能折成正方体的 6 格图形一共只有 11 种（旋转翻面算一种）。';
        } else {
            els.stat.textContent = '点一个面，看它折到哪一面';
            setVerdict('idle', picked ? pickedText() : '点格子里的编号，观察它折到正方体的哪一面。');
            renderPairs(cur.faceOf);
            renderCube(picked ? cur.faceOf[picked[0] + ',' + picked[1]] : null);
            els.note.textContent = '同一个面上写同样的编号，折起来后它们就是同一个面。';
        }

    function setVerdict(tone, text) {
        els.verdict.setAttribute('data-tone', tone);

    }

    function verdictText() {
        var ok = cur.answer;

        var head = right ? '答对了！' : '再想一想 —— ';
        return head + (ok
            ? '这个图形能折成正方体' + (cur.fam ? '（' + cur.fam + '型）' : '') + '。'
            : '这个图形不能折成正方体：折叠时会有两个面重叠、另有一个面空着。');
    }

    function pickedText() {
        var face = cur.faceOf[picked[0] + ',' + picked[1]];
        return '折起来是「' + FACE_LABEL[face] + '」面，它的相对面是「' + FACE_LABEL[OPP[face]] + '」。';
    }

    /* 盘面格子按容器可用空间自适应（尽量铺满，上限 170px） */
    var boardCols = 3;
    var boardRows = 4;

    function fitCells() {
        if (state.mode === 'gallery' || !els.board.parentNode) { return; }
        var wrap = els.board.parentNode;
        var availW = wrap.clientWidth - 56;
        var availH = wrap.clientHeight - 56;
        if (availW <= 0 || availH <= 0) { return; }
        var size = Math.floor(Math.min(
            (availW - (boardCols - 1) * 4) / boardCols,
            (availH - (boardRows - 1) * 4) / boardRows
        )) - 4;
        size = Math.max(44, Math.min(size, 170));
        document.documentElement.style.setProperty('--cn-cell', size + 'px');
    }

    function renderBoard() {
        els.board.textContent = '';
        els.board.className = 'cn-board';
        els.board.style.gridTemplateColumns = '';
        els.board.style.gridAutoRows = '';
        if (!cur) { return; }
        var cells = cur.cells;
        var minx = Infinity;
        var miny = Infinity;
        var maxx = -Infinity;
        var maxy = -Infinity;
        var i;
        for (i = 0; i < cells.length; i++) {
            if (cells[i][0] < minx) { minx = cells[i][0]; }
            if (cells[i][0] > maxx) { maxx = cells[i][0]; }
            if (cells[i][1] < miny) { miny = cells[i][1]; }
            if (cells[i][1] > maxy) { maxy = cells[i][1]; }
        }
        els.board.className = 'cn-board';
        els.board.style.gridTemplateColumns = 'repeat(' + (maxx - minx + 1) + ', auto)';
        var has = {};
        for (i = 0; i < cells.length; i++) { has[cells[i][0] + ',' + cells[i][1]] = true; }
        for (var y = miny; y <= maxy; y++) {
            for (var x = minx; x <= maxx; x++) {
                var node = el('div', 'cn-cell');
                node.style.gridColumn = (x - minx + 1);
                node.style.gridRow = (y - miny + 1);
                if (!has[x + ',' + y]) {
                    node.classList.add('is-empty');
                } else {
                    node.classList.add('is-fill');
                    var face = cur.faceOf ? cur.faceOf[x + ',' + y] : null;
                    if (face) {
                        node.textContent = String(FACE_NUM[face]);
                        node.style.background = FACE_COLOR[face];
                        node.style.borderColor = FACE_COLOR[face];
                        if (picked && picked[0] === x && picked[1] === y) { node.classList.add('is-pick'); }
                        bind(node, x, y);
                    } else {
                        node.style.background = ACCENT;
                        node.style.borderColor = ACCENT;
                    }
                }
                els.board.appendChild(node);
            }
        }
        boardCols = maxx - minx + 1;
        boardRows = maxy - miny + 1;
        fitCells();
    }

    function bind(node, x, y) {
        node.addEventListener('click', function () {
            picked = [x, y];
            try { chrome.beep(); } catch (e) { /* 静默 */ }
            render();
        });

    function renderPairs(fm) {
        els.pairs.textContent = '';
        if (!fm) {
            els.pairs.appendChild(el('div', 'cn-note', '折叠时出现面重叠，不存在稳定的相对面关系。'));
            return;
        }
        var pos = {};
        for (var k in fm) {
            if (Object.prototype.hasOwnProperty.call(fm, k)) { pos[fm[k]] = true; }
        }
        var groups = [['U', 'D'], ['N', 'S'], ['E', 'W']];
        for (var i = 0; i < groups.length; i++) {
            var a = groups[i][0];
            var b = groups[i][1];
            if (!pos[a] || !pos[b]) { continue; }
            var row = el('div', 'cn-pair');
            var ca = el('span', 'cn-chip', String(FACE_NUM[a]));
            ca.style.background = FACE_COLOR[a];
            var cb = el('span', 'cn-chip', String(FACE_NUM[b]));
            cb.style.background = FACE_COLOR[b];
            row.appendChild(ca);
            row.appendChild(el('i', '', '与'));
            row.appendChild(cb);
            row.appendChild(document.createTextNode('相对（' + FACE_LABEL[a] + ' / ' + FACE_LABEL[b] + '）'));
            els.pairs.appendChild(row);
        }
    }

    function renderCube(highlight) {
        var box = el('div', 'cn-cube');
        var NS = 'http://www.w3.org/2000/svg'; /* et-allow-external SVG 命名空间 */
        var svg = document.createElementNS(NS, 'svg');
        svg.setAttribute('viewBox', '0 0 220 210');
        var top = [[110, 18], [196, 61], [110, 104], [24, 61]];
        var left = [[24, 61], [110, 104], [110, 190], [24, 147]];
        var right = [[196, 61], [110, 104], [110, 190], [196, 147]];
        var faces = [{ pts: top, key: 'U' }, { pts: left, key: 'W' }, { pts: right, key: 'E' }];
        for (var i = 0; i < faces.length; i++) {
            var on = highlight === faces[i].key;
            var poly = document.createElementNS(NS, 'polygon');
            var pts = [];
            for (var p = 0; p < faces[i].pts.length; p++) { pts.push(faces[i].pts[p].join(',')); }
            poly.setAttribute('points', pts.join(' '));
            poly.setAttribute('fill', FACE_COLOR[faces[i].key]);
            poly.setAttribute('opacity', on ? '1' : '0.5');
            poly.setAttribute('stroke', on ? '#111827' : 'var(--et-surface)');
            poly.setAttribute('stroke-width', on ? '3' : '2');
            svg.appendChild(poly);
            var txt = document.createElementNS(NS, 'text');
            txt.setAttribute('x', faces[i].key === 'U' ? '110' : (faces[i].key === 'W' ? '62' : '158'));
            txt.setAttribute('y', faces[i].key === 'U' ? '68' : '136');
            txt.setAttribute('text-anchor', 'middle');
            txt.setAttribute('font-size', '24');
            txt.setAttribute('font-weight', '700');
            txt.setAttribute('fill', '#fff');
            txt.textContent = String(FACE_NUM[faces[i].key]);
            svg.appendChild(txt);
        }
        box.appendChild(svg);
        els.pairs.parentNode.insertBefore(box, els.pairs);
    }

    function renderGallery() {
        els.stat.textContent = '共 11 种（旋转、翻面算同一种）';
        els.board.textContent = '';

        var bar = el('div', 'cn-fams');

                btn.addEventListener('click', function () {
                    famFilter = name;
                    renderGallery();
                });
                bar.appendChild(btn);
            })(options[i]);
        }
        els.board.appendChild(bar);

        var wrap = el('div', 'cn-gallery');
        var shown = 0;
        for (var k = 0; k < NETS.length; k++) {
            if (famFilter !== '全部' && NETS[k].fam !== famFilter) { continue; }
            shown++;
            galleryCard(wrap, NETS[k], k);
        }
        if (!shown) { wrap.appendChild(el('div', 'cn-note', '该家族暂无图形。')); }
        els.board.appendChild(wrap);
    }

    function galleryCard(wrap, item, idx) {
        var card = el('div', 'cn-card');
        var cells = flatToCells(item.c);
        var maxx = 0;
        var maxy = 0;
        var i;
        for (i = 0; i < cells.length; i++) {
            if (cells[i][0] > maxx) { maxx = cells[i][0]; }
            if (cells[i][1] > maxy) { maxy = cells[i][1]; }
        }
        var mini = el('div', 'cn-mini');
        mini.style.gridTemplateColumns = 'repeat(' + (maxx + 1) + ', auto)';
        var has = {};
        for (i = 0; i < cells.length; i++) { has[cells[i][0] + ',' + cells[i][1]] = true; }
        for (var y = 0; y <= maxy; y++) {
            for (var x = 0; x <= maxx; x++) {
                var sp = document.createElement('span');
                if (!has[x + ',' + y]) { sp.className = 'is-off'; }
                mini.appendChild(sp);
            }
        }
        card.appendChild(mini);
        card.appendChild(el('b', '', '第 ' + (idx + 1) + ' 种'));
        card.appendChild(el('em', '', item.fam + '型'));
        card.addEventListener('click', function () {
            var kids = wrap.getElementsByClassName('cn-card');
            for (var b = 0; b < kids.length; b++) { kids[b].classList.remove('is-on'); }
            card.classList.add('is-on');
            chrome.modal({
                title: '第 ' + (idx + 1) + ' 种展开图（' + item.fam + '型）',
                body: '<div style="font-size:13.5px;line-height:1.9">' +
                    '<p style="margin:0 0 8px">沿格线折起来正好围成一个正方体，' +
                    '6 个面两两不重叠、也不留空。</p>' +
                    '<p style="margin:0">课堂建议：每人剪一张亲手折，再数一数' +
                    '「相对的两个面隔着几个格」—— 隔一个。</p></div>'
            });
        });
        wrap.appendChild(card);
    }

    /* ---------- 作答 ---------- */

    function answer(choice) {
        if (state.mode !== 'judge' || answered || !cur) { return; }
        answered = choice;
        total++;
        state.total = total;
        if ((choice === 'yes') === cur.answer) {
            correct++;
            state.correct = correct;
            try { chrome.beep(); } catch (e) { /* 静默 */ }
        }
        persist();
        render();
    }

    /* ---------- 模式 ---------- */

    function setMode(mode) {
        if (MODES.indexOf(mode) < 0 || mode === state.mode) { return; }
        state.mode = mode;
        persist();
        picked = null;
        answered = false;
        if (mode === 'gallery') {
            render();
        } else {
            nextQuestion();
        }
    }

    function cycleMode() {
        setMode(MODES[(MODES.indexOf(state.mode) + 1) % MODES.length]);
    }

    function doPrint() {
        window.print();
    }

    function resetScore() {
        correct = 0;
        total = 0;
        state.correct = 0;
        state.total = 0;
        persist();
        render();
        chrome.toast('答题记录已清零');
    }

    /* ---------- 设置 ---------- */

    function buildSettings() {
        var box = document.createElement('div');
        var html = '<div class="et-drawer__row"><label>玩法</label>' +
            '<select class="et-drawer__input" id="cnSetMode">';
        for (var i = 0; i < MODES.length; i++) {
            html += '<option value="' + MODES[i] + '"' +
                (state.mode === MODES[i] ? ' selected' : '') + '>' + MODE_LABEL[MODES[i]] + '</option>';
        }
        html += '</select></div>' +
            '<div class="et-drawer__row"><label>答题记录</label>' +
            '<span class="et-drawer__tip">已答 <b>' + total + '</b> 题，正确 <b>' + correct + '</b> 题</span></div>' +
            '<div class="et-drawer__row"><button class="et-btn" id="cnSetClear" type="button">' +
            '清空答题记录</button></div>' +
            '<div class="et-drawer__tip">全部数据只保存在本机浏览器，不上传。</div>';
        box.innerHTML = html;
        var sel = box.querySelector('#cnSetMode');
        sel.addEventListener('change', function () { setMode(this.value); });
        box.querySelector('#cnSetClear').addEventListener('click', resetScore);
        return box;
    }

    /* ---------- 事件 ---------- */

    var btns = els.seg.getElementsByTagName('button');
    for (var b = 0; b < btns.length; b++) {
        (function (btn) {
            btn.addEventListener('click', function () { setMode(btn.getAttribute('data-mode')); });
        })(btns[b]);
    }

    els.btnNew.addEventListener('click', nextQuestion);

    window.addEventListener('resize', function () {
        if (state.mode !== 'gallery') { fitCells(); }
    });
    els.btnPrint.addEventListener('click', doPrint);
    els.btnYes.addEventListener('click', function () { answer('yes'); });
    els.btnNo.addEventListener('click', function () { answer('no'); });

    document.addEventListener('keydown', function (e) {
        if (isTypingTarget(e.target)) { return; }
        if (e.key === '1') { setMode('judge'); }
        else if (e.key === '2') { setMode('build'); }
        else if (e.key === '3') { setMode('gallery'); }
        else if (e.code === 'Space') { e.preventDefault(); nextQuestion(); }
        else if (e.key === 'y' || e.key === 'Y') { answer('yes'); }
        else if (e.key === 'n' || e.key === 'N') { answer('no'); }
        else if ((e.key === 'p' || e.key === 'P') && !e.ctrlKey && !e.metaKey) { doPrint(); }
    });

    nextQuestion();
})();
})();
</script>

</body>
</html>
