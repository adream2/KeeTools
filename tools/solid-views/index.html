/*!

/* ============ 设计令牌 ============ */
:root {
    --et-accent: #2563eb;
    --et-accent-weak: rgba(37, 99, 235, .14);
    --et-bg: #f4f6fb;
    --et-surface: #ffffff;
    --et-surface-2: #f8fafc;
    --et-fg: #0b1220;
    --et-muted: #64748b;
    --et-line: rgba(15, 23, 42, .12);
    --et-line-strong: rgba(15, 23, 42, .22);
    --et-glass: rgba(255, 255, 255, .85);
    --et-shadow-md: 0 10px 28px -18px rgba(15, 23, 42, .3);
    --et-shadow-lg: 0 24px 60px -32px rgba(15, 23, 42, .4);
    --et-ok: #059669;
    --et-warn: #d97706;
    --et-err: #dc2626;
    --et-radius: 12px;
    --et-radius-sm: 9px;
    --et-font: -apple-system, BlinkMacSystemFont, "Segoe UI",
               "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei",
               "Noto Sans SC", sans-serif;
    --et-mono: ui-monospace, "Cascadia Mono", Consolas, Menlo, monospace;
}

html[data-et-theme="dark"] {
    --et-bg: #0b1120;
    --et-surface: #111a2e;
    --et-surface-2: #0f1729;
    --et-fg: #f1f5f9;
    --et-muted: #94a3b8;
    --et-line: rgba(148, 163, 184, .18);
    --et-line-strong: rgba(148, 163, 184, .3);
    --et-glass: rgba(17, 26, 46, .85);
    --et-shadow-md: 0 10px 34px -18px rgba(0, 0, 0, .8);
    --et-shadow-lg: 0 24px 70px -30px rgba(0, 0, 0, .9);
    --et-ok: #34d399;
    --et-warn: #fbbf24;
    --et-err: #f87171;
}

/* ============ 基础 ============ */

/* body 作为外壳时必须清掉浏览器默认 8px 外边距，
   否则 iframe 预览中文档会比视口高 16px（底部白边 + 多余滚动） */
body.et-app {
    margin: 0;
}

.et-app {
    position: relative;
    isolation: isolate;
    display: flex;
    flex-direction: column;
    height: 100vh;
    height: 100dvh;
    overflow: hidden;
    background: var(--et-bg);
    color: var(--et-fg);
    font-family: var(--et-font);
    -webkit-font-smoothing: antialiased;
    transition: background .25s, color .25s;
}

/* 极光背景：径向渐变 + 呼吸动画（edupick 品质基线，老内核也不掉帧） */
.et-app::before {
    content: '';
    position: fixed;
    inset: 0;
    z-index: -1;
    pointer-events: none;
    background:
        radial-gradient(46% 40% at 20% 18%, var(--et-accent-weak), transparent 65%),
        radial-gradient(42% 38% at 82% 24%, var(--et-accent-weak), transparent 70%),
        radial-gradient(50% 44% at 55% 95%, rgba(16, 185, 129, .10), transparent 65%);
    animation: et-aurora 16s ease-in-out infinite alternate;
}

@keyframes et-aurora {
    from { opacity: .55; transform: scale(1); }
    to { opacity: 1; transform: scale(1.06); }
}

.et-app *,
.et-app *::before,
.et-app *::after { box-sizing: border-box; }

[hidden] { display: none !important; }

.et-icon {
    width: 18px;
    height: 18px;
    fill: none;
    stroke: currentColor;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
    flex: none;
}

/* ============ 顶栏 ============ */
.et-topbar {
    flex: none;
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 11px 20px;
    border-bottom: 1px solid var(--et-line);
    background: var(--et-glass);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    z-index: 20;
}

.et-brand {
    display: flex;
    align-items: center;
    gap: 10px;
    min-width: 0;
}

.et-brand__dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: var(--et-accent);
    box-shadow: 0 0 0 4px var(--et-accent-weak);
    flex: none;
}

.et-brand__name {
    font-weight: 800;
    font-size: 15px;
    letter-spacing: -.01em;
    white-space: nowrap;
}

.et-brand__sub {
    font-size: 12.5px;
    color: var(--et-muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.et-status {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 5px 14px;
    border-radius: 999px;
    font-size: 12.5px;
    color: var(--et-muted);
    background: var(--et-surface-2);
    border: 1px solid var(--et-line);
    white-space: nowrap;
    max-width: 42vw;
    overflow: hidden;
    text-overflow: ellipsis;
}

.et-status__dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--et-ok);
    flex: none;
    transition: background .2s;
}

.et-status[data-tone="err"] .et-status__dot { background: var(--et-err); }
.et-status[data-tone="warn"] .et-status__dot { background: var(--et-warn); }

.et-actions {
    display: flex;
    align-items: center;
    gap: 7px;
}

.et-icon-btn {
    display: inline-grid;
    place-items: center;
    width: 38px;
    height: 38px;
    font-size: 16px;
    line-height: 1;
    border-radius: 11px;
    border: 1px solid var(--et-line);
    background: var(--et-surface-2);
    color: var(--et-fg);
    cursor: pointer;
    transition: transform .14s, border-color .14s, color .14s, opacity .14s;
    -webkit-tap-highlight-color: transparent;
}

.et-icon-btn:hover {
    border-color: var(--et-accent);
    color: var(--et-accent);
    transform: translateY(-1px);
}

.et-icon-btn:active { transform: translateY(0); }
.et-icon-btn.is-off { opacity: .4; }
.et-icon-btn:focus-visible { outline: 2px solid var(--et-accent); outline-offset: 2px; }

/* ============ 主区默认 ============ */
.et-main {
    flex: 1;
    min-height: 0;
    position: relative;
    overflow: auto;
}

/* ============ 页脚（品牌回流 L2） ============ */
.et-footer {
    flex: none;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 7px 16px;
    font-size: 12px;
    color: var(--et-muted);
    border-top: 1px solid var(--et-line);
    background: var(--et-glass);
    user-select: none;
    z-index: 20;
}

.et-footer a {
    color: inherit;
    text-decoration: none;
    transition: color .14s;
}

.et-footer a:hover { color: var(--et-accent); }

/* ============ 按钮 ============ */
.et-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
    padding: 9px 16px;
    border-radius: 11px;
    font: inherit;
    font-size: 13.5px;
    font-weight: 700;
    border: 1px solid var(--et-line);
    background: var(--et-surface-2);
    color: var(--et-fg);
    cursor: pointer;
    transition: transform .14s, border-color .14s, color .14s, background .14s, box-shadow .14s;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
}

.et-btn:hover {
    border-color: var(--et-accent);
    color: var(--et-accent);
    transform: translateY(-1px);
}

.et-btn:active { transform: translateY(0); }
.et-btn:focus-visible { outline: 2px solid var(--et-accent); outline-offset: 2px; }
.et-btn:disabled { opacity: .45; cursor: not-allowed; transform: none; }

.et-btn--primary {
    background: var(--et-accent);
    border-color: var(--et-accent);
    color: #fff;
    box-shadow: 0 6px 18px -8px var(--et-accent);
}

.et-btn--primary:hover { color: #fff; filter: brightness(1.08); }
.et-btn--primary:disabled { filter: none; }

.et-btn--danger:hover {
    border-color: var(--et-err);
    color: var(--et-err);
}

.et-btn--lg {
    padding: 13px 26px;
    font-size: 16px;
    border-radius: 14px;
}

/* ============ 弹窗 ============ */
.et-modal {
    position: fixed;
    inset: 0;
    z-index: 100;
    display: grid;
    place-items: center;
    padding: 24px;
    background: rgba(2, 6, 23, .55);
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    animation: et-fade .18s ease;
}

.et-modal__panel {
    width: min(680px, 94vw);
    max-height: 86vh;
    max-height: 86dvh;
    display: flex;
    flex-direction: column;
    background: var(--et-surface);
    border: 1px solid var(--et-line);
    border-radius: 16px;
    box-shadow: var(--et-shadow-lg);
    animation: et-pop .2s cubic-bezier(.34, 1.4, .64, 1);
    overflow: hidden;
}

.et-modal__panel--narrow { width: min(460px, 92vw); }
.et-modal__panel--wide { width: min(900px, 94vw); }

.et-modal__head {
    flex: none;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 16px 20px;
    border-bottom: 1px solid var(--et-line);
    font-weight: 800;
    font-size: 15px;
}

.et-modal__head .et-icon-btn {
    margin-left: auto;
    width: 32px;
    height: 32px;
}

.et-modal__body {
    flex: 1;
    min-height: 0;
    overflow: auto;
    padding: 18px 20px;
}

.et-modal__foot {
    flex: none;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 14px 20px;
    border-top: 1px solid var(--et-line);
    background: var(--et-surface-2);
}

.et-modal__foot .spacer { flex: 1; }

@keyframes et-fade {
    from { opacity: 0; }
}

@keyframes et-pop {
    from { opacity: 0; transform: translateY(14px) scale(.97); }
}

/* ============ 轻提示（toast） ============ */
.et-toast {
    position: fixed;
    left: 50%;
    bottom: 56px;
    transform: translateX(-50%) translateY(10px);
    z-index: 120;
    display: flex;
    align-items: center;
    gap: 9px;
    max-width: min(520px, 88vw);
    padding: 11px 18px;
    border-radius: 12px;
    font-size: 13.5px;
    font-weight: 600;
    color: #fff;
    background: rgba(15, 23, 42, .92);
    border: 1px solid rgba(148, 163, 184, .25);
    box-shadow: var(--et-shadow-lg);
    opacity: 0;
    pointer-events: none;
    transition: opacity .22s, transform .22s;
}

.et-toast.is-show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
}

.et-toast[data-tone="ok"] { background: rgba(5, 150, 105, .95); }
.et-toast[data-tone="err"] { background: rgba(220, 38, 38, .95); }
.et-toast[data-tone="warn"] { background: rgba(217, 119, 6, .95); }

/* ============ 设置抽屉（右上角入口，edupick 交互） ============ */
.et-drawer-backdrop {
    position: fixed;
    inset: 0;
    z-index: 90;
    background: rgba(2, 6, 23, .45);
    backdrop-filter: blur(3px);
    -webkit-backdrop-filter: blur(3px);
    opacity: 0;
    transition: opacity .2s;
}

.et-drawer-backdrop.is-open { opacity: 1; }

.et-drawer {
    position: absolute;
    top: 0;
    right: 0;
    height: 100%;
    width: min(400px, 92vw);
    display: flex;
    flex-direction: column;
    background: var(--et-surface);
    border-left: 1px solid var(--et-line);
    box-shadow: var(--et-shadow-lg);
    transform: translateX(100%);
    transition: transform .22s cubic-bezier(.32, .72, .35, 1);
}

.et-drawer-backdrop.is-open .et-drawer { transform: translateX(0); }

.et-drawer__head {
    flex: none;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 15px 18px;
    border-bottom: 1px solid var(--et-line);
    font-weight: 800;
    font-size: 15px;
    color: var(--et-accent);
}

.et-drawer__head .et-icon-btn {
    margin-left: auto;
    width: 32px;
    height: 32px;
}

.et-drawer__body {
    flex: 1;
    min-height: 0;
    overflow: auto;
    padding: 16px 18px 24px;
}

/* 抽屉内容通用小节（工具复用） */
.et-drawer__body h4 {
    margin: 18px 0 8px;
    font-size: 12px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: .08em;
    color: var(--et-muted);
}

.et-drawer__body h4:first-child { margin-top: 0; }

.et-drawer__row {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
}

.et-drawer__tip {
    margin: 8px 0 0;
    font-size: 12px;
    line-height: 1.8;
    color: var(--et-muted);
}

.et-drawer__tip b { color: var(--et-fg); }

.et-drawer__input {
    flex: 1;
    min-width: 0;
    padding: 9px 12px;
    border: 1px solid var(--et-line-strong);
    border-radius: 9px;
    background: var(--et-surface-2);
    color: var(--et-fg);
    font: inherit;
    font-size: 13.5px;
    transition: border-color .14s, box-shadow .14s;
}

.et-drawer__input:focus {
    outline: none;
    border-color: var(--et-accent);
    box-shadow: 0 0 0 3px var(--et-accent-weak);
}

.et-drawer__switch {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 10px 0;
    border-bottom: 1px dashed var(--et-line);
    font-size: 13.5px;
    font-weight: 600;
    color: var(--et-fg);
    cursor: pointer;
    user-select: none;
}

.et-drawer__switch input {
    width: 17px;
    height: 17px;
    accent-color: var(--et-accent);
    cursor: pointer;
}
</style>

        function onKey(ev) {
            if (ev.key === 'Escape') { ev.stopPropagation(); close(); }
        }
        document.addEventListener('keydown', onKey);
        backdrop.addEventListener('mousedown', function (ev) {
            if (ev.target === backdrop) { close(); }
        });

        if (typeof build === 'function') {
            /* 兼容两种约定：build 自己往 body 里塞内容，或 return 一个元素节点 */
            var ret = build(body, { close: close });
            if (ret && ret.nodeType === 1 && ret.parentNode !== body) {
                body.appendChild(ret);
            }

        return { body: body, close: close };

    /* ---------- 通用弹窗 / toast（同时挂模块级，供其他共享组件使用） ---------- */

    function modal(mo) {
        var backdrop = el('div', 'et-modal');
        var panel = el('div', 'et-modal__panel' + (mo.size === 'narrow' ? ' et-modal__panel--narrow'
            : mo.size === 'wide' ? ' et-modal__panel--wide' : ''));
        var head = el('div', 'et-modal__head');
        if (mo.icon) { head.appendChild(makeIcon(mo.icon)); }
        head.appendChild(el('span', null, mo.title || ''));
        head.appendChild(makeBtn('i-x', '关闭', close));
        panel.appendChild(head);

        var body = el('div', 'et-modal__body');
        if (typeof mo.body === 'string') { body.innerHTML = mo.body; }
        else if (mo.body) { body.appendChild(mo.body); }
        panel.appendChild(body);

        var foot = null;
        if (mo.buttons && mo.buttons.length) {
            foot = el('div', 'et-modal__foot');
            foot.appendChild(el('span', 'spacer'));
            mo.buttons.forEach(function (b) {
                var btn = el('button', 'et-btn' + (b.primary ? ' et-btn--primary' : '') + (b.danger ? ' et-btn--danger' : ''), b.label);
                btn.type = 'button';
                btn.addEventListener('click', function () {
                    if (b.onClick) { b.onClick(close); } else { close(); }
                });
                foot.appendChild(btn);
            });
            panel.appendChild(foot);
        }

        backdrop.appendChild(panel);
        document.body.appendChild(backdrop);

        function close() {
            if (backdrop.parentNode) { backdrop.parentNode.removeChild(backdrop); }
            document.removeEventListener('keydown', onKey);
            if (mo.onClose) { mo.onClose(); }
        }
        function onKey(ev) {
            if (ev.key === 'Escape') { ev.stopPropagation(); close(); }
        }
        document.addEventListener('keydown', onKey);
        backdrop.addEventListener('mousedown', function (ev) {

        toastTimer = setTimeout(function () { toastEl.classList.remove('is-show'); }, 2200);

    /* ---------- PWA 元数据（blob manifest，环境不支持时静默跳过） ---------- */

            var iconUri = 'data:image/svg+xml,' + encodeURIComponent(svg);

            var mf = {

                theme_color: accent || '#2563eb',
                icons: [{ src: iconUri, sizes: 'any', type: 'image/svg+xml', purpose: 'any' }]
            };
            var blob = new Blob([JSON.stringify(mf)], { type: 'application/manifest+json' });

        syncFsIcon(false);

        api.toggleFullscreen = toggleFullscreen;

            ? global.ET_SITE_ORIGIN

        try {

<script>

/*!
 * et-stats.js — 使用统计模块（模块化，可整体移除）
 *
 * 共享逻辑源。改这里，然后跑：python scripts/sync_shared.py
 * 依赖：无（可脱离 et-util / et-chrome 独立运行）。
 * 全局：ET.Stats
 *
 * ┌────────────────────────────────────────────────────────────────┐
 * │ 说明：本模块只做一件事——工具被打开时向上报端点发一条匿名计数。 │
 * │ · 在线（iframe 内）：宿主页面已服务端计数，本模块不重复上报。   │
 * │ · 离线打开（file:// / 下载单文件 / 离线包）：联网条件具备时，   │
 * │   以 sendBeacon 上报 use_offline 事件（text/plain 免预检）。    │
 * │ · 上报端点 = window.ET_SITE_ORIGIN（由宿主注入或离线包配置）。  │
 * │   未配置端点时本模块完全静默，不发任何请求。                    │
 * │ · **整个 <script> 块可安全删除**：删除后工具其余功能完全正常，  │
 * │   且完全不再发起任何网络请求。                                  │
 * └────────────────────────────────────────────────────────────────┘
 */
(function (global) {
    'use strict';

    var ET = global.ET = global.ET || {};

    var Stats = {
        /** 上报端点来源（站点绝对地址，无协议尾斜杠） */
        endpoint: (typeof global.ET_SITE_ORIGIN === 'string' && /^https?:\/\//.test(global.ET_SITE_ORIGIN))
            ? global.ET_SITE_ORIGIN
            : null,

        _done: {},

        /**
         * 上报一次事件（同一事件同一工具每次页面加载只报一次）。
         * event: 'use_offline' 等；toolId: 工具 id。
         */
        send: function (event, toolId) {
            if (!event || this._done[event + ':' + (toolId || '')]) { return false; }
            if (!this.endpoint) { return false; }
            /* iframe 内由宿主统计，避免双计 */
            try {
                if (global.parent && global.parent !== global) { return false; }
            } catch (err) { return false; }
            /* 断网时挂起，网络恢复自动补报一次 */
            if (global.navigator && global.navigator.onLine === false) {
                var self = this;
                global.addEventListener('online', function () { self.send(event, toolId); }, { once: true });
                return false;
            }

            this._done[event + ':' + (toolId || '')] = true;
            var payload = JSON.stringify({ event: event, tool: toolId || '' });

            try {
                if (global.navigator.sendBeacon) {
                    return global.navigator.sendBeacon(
                        this.endpoint + '/api/track',
                        new Blob([payload], { type: 'text/plain;charset=UTF-8' })
                    );
                }
                global.fetch(this.endpoint + '/api/track', {
                    method: 'POST',
                    body: payload,
                    keepalive: true,
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'text/plain;charset=UTF-8' }
                });
                return true;
            } catch (err) {
                return false;
            }
        }
    };

    ET.Stats = Stats;
})(window);
</script>

<script>

    }

    function maxHeight() {
        var m = 0;
        for (var x = 0; x < SIZE; x++) {
            for (var y = 0; y < SIZE; y++) { m = Math.max(m, state.grid[x][y]); }
        }
        return m;
    }

    /** 主视图：从前往后看（沿 y 方向投影），每列取最高 */
    function frontHeights() {
        var out = [];
        for (var x = 0; x < SIZE; x++) {
            var m = 0;
            for (var y = 0; y < SIZE; y++) { m = Math.max(m, state.grid[x][y]); }
            out.push(m);
        }
        return out;
    }

    /** 左视图：从左往右看（沿 x 方向投影），每列取最高 */
    function sideHeights() {
        var out = [];
        for (var y = 0; y < SIZE; y++) {
            var m = 0;
            for (var x = 0; x < SIZE; x++) { m = Math.max(m, state.grid[x][y]); }
            out.push(m);
        }
        return out;
    }

    /* ---------- 渲染 ---------- */

    function render() {
        els.preview.innerHTML = '';
        els.preview.appendChild(buildPage());
        syncSeg();
        updateStat();
    }

    function buildPage() {
        var page = el('section', 'sv-page');
        page.appendChild(el('div', 'sv-title', '观察物体　·　三视图'));
        page.appendChild(el('div', 'sv-sub', state.mode === 'guess'
            ? '猜一猜：从正面看、从左面看各是什么形状？想好再看三视图'
            : '搭一搭：在下方格子里摆小正方体，三视图实时更新'));

        var meta = el('div', 'sv-meta');
        meta.appendChild(el('span', null, '姓名：____________'));
        meta.appendChild(el('span', null, '班级：__________'));
        meta.appendChild(el('span', null, '共 ' + cubeCount() + ' 个小正方体'));
        page.appendChild(meta);

        var body = el('div', 'sv-body');
        body.appendChild(buildStage());
        body.appendChild(buildViews());
        page.appendChild(body);

        page.appendChild(buildEditor());

        var foot = el('div', 'sv-foot');
        foot.appendChild(el('span', null, '口径：主视图 = 从前往后看；左视图 = 从左往右看；俯视图 = 从上往下看'));
        foot.appendChild(el('span', null, 'KeeTools 课工具 · 观察物体'));
        page.appendChild(foot);

        return page;
    }

    function buildStage() {
        var stage = el('div', 'sv-stage');
        var svg = svgEl('svg', 'sv-iso');

        var cubes = [];
        for (var x = 0; x < SIZE; x++) {
            for (var y = 0; y < SIZE; y++) {
                for (var z = 0; z < state.grid[x][y]; z++) {
                    cubes.push([x, y, z]);
                }
            }
        }
        /* 画家算法：先画远处的（x+y 小），同柱自下而上 */
        cubes.sort(function (a, b) {
            return (a[0] + a[1]) - (b[0] + b[1]) || a[2] - b[2];
        });

        var maxH = Math.max(1, maxHeight());
        var minX = -(SIZE - 1) / 2 - 0.5;
        var width = (SIZE - 1) + 1;
        var minY = -maxH * 0.5 - 0.5;
        var height = (SIZE - 1) * 0.5 + maxH * 0.5 + 1;
        svg.setAttribute('viewBox', minX.toFixed(2) + ' ' + minY.toFixed(2) + ' ' +
            width.toFixed(2) + ' ' + height.toFixed(2));
        svg.setAttribute('preserveAspectRatio', 'xMidYMid meet');

        for (var i = 0; i < cubes.length; i++) {
            appendCube(svg, cubes[i][0], cubes[i][1], cubes[i][2]);
        }

        if (!cubes.length) {
            var tip = svgEl('text');
            tip.setAttribute('x', String(minX + width / 2));
            tip.setAttribute('y', String(minY + height / 2));
            tip.setAttribute('text-anchor', 'middle');
            tip.setAttribute('font-size', '0.5');
            tip.textContent = '在下方格子里点一下开始搭';
            svg.appendChild(tip);
        }

        stage.appendChild(svg);
        return stage;
    }

    function appendCube(svg, x, y, z) {
        var cx = (x - y) * 0.5;
        var cy = (x + y) * 0.25 - z * 0.5;
        svg.appendChild(poly([
            [cx, cy - 0.5], [cx + 0.5, cy - 0.25], [cx, cy], [cx - 0.5, cy - 0.25]
        ], 'var(--sv-top)'));
        svg.appendChild(poly([
            [cx - 0.5, cy - 0.25], [cx, cy], [cx, cy + 0.5], [cx - 0.5, cy + 0.25]
        ], 'var(--sv-left)'));
        svg.appendChild(poly([
            [cx, cy], [cx + 0.5, cy - 0.25], [cx + 0.5, cy + 0.25], [cx, cy + 0.5]
        ], 'var(--sv-right)'));
    }

    function poly(points, fill) {
        var node = svgEl('polygon');
        var parts = [];
        for (var i = 0; i < points.length; i++) {
            parts.push(points[i][0].toFixed(3) + ',' + points[i][1].toFixed(3));
        }
        node.setAttribute('points', parts.join(' '));
        node.setAttribute('fill', fill);
        node.setAttribute('stroke', 'var(--sv-edge)');
        node.setAttribute('stroke-width', '0.02');
        return node;
    }

    function buildViews() {
        var wrap = el('div', 'sv-views');
        var hidden = !state.showViews;

        var front = el('div', 'sv-viewcard' + (hidden ? ' is-hidden' : ''));
        front.appendChild(el('div', 'sv-viewname', null));
        front.firstChild.innerHTML = '主视图 <span>（从前往后看）</span>';
        front.appendChild(viewGrid(frontHeights(), SIZE));
        wrap.appendChild(front);

        var side = el('div', 'sv-viewcard' + (hidden ? ' is-hidden' : ''));
        side.appendChild(el('div', 'sv-viewname', null));
        side.firstChild.innerHTML = '左视图 <span>（从左往右看）</span>';
        side.appendChild(viewGrid(sideHeights(), SIZE));
        wrap.appendChild(side);

        var top = el('div', 'sv-viewcard');
        top.appendChild(el('div', 'sv-viewname', null));
        top.firstChild.innerHTML = '俯视图 <span>（从上往下看，数字 = 这格的层数）</span>';
        top.appendChild(buildTopGrid());
        wrap.appendChild(top);

        return wrap;
    }

    function viewGrid(heights, cols) {
        var maxH = 1;
        for (var i = 0; i < heights.length; i++) { maxH = Math.max(maxH, heights[i]); }
        var grid = el('div', 'sv-viewgrid');
        grid.style.gridTemplateColumns = 'repeat(' + cols + ', 8mm)';
        for (var row = maxH - 1; row >= 0; row--) {
            for (var c = 0; c < cols; c++) {
                var cell = el('div', 'sv-vcell' + (heights[c] > row ? ' is-fill' : ''));
                grid.appendChild(cell);
            }
        }
        return grid;
    }

    function buildTopGrid() {
        var grid = el('div', 'sv-viewgrid');
        grid.style.gridTemplateColumns = 'repeat(' + SIZE + ', 8mm)';
        for (var y = 0; y < SIZE; y++) {
            for (var x = 0; x < SIZE; x++) {
                var h = state.grid[x][y];
                var cell = el('div', 'sv-vcell' + (h ? ' is-fill' : ''), h ? String(h) : '');
                cell.setAttribute('data-x', String(x));
                cell.setAttribute('data-y', String(y));
                cell.style.cursor = 'pointer';
                cell.addEventListener('click', function () {
                    var cx = parseInt(this.getAttribute('data-x'), 10);
                    var cy = parseInt(this.getAttribute('data-y'), 10);
                    state.grid[cx][cy] = (state.grid[cx][cy] + 1) % (MAX_H + 1);
                    persist();
                    render();
                    try { chrome.beep('tick'); } catch (e) { /* 静默 */ }
                });
                grid.appendChild(cell);
            }
        }
        return grid;
    }

    function buildEditor() {
        var box = el('div', 'sv-editor');
        var title = el('div', 'sv-editor__title', null);
        title.innerHTML = '从上面看（俯视图）· 点格子摆 / 加层 <span>点一下 = 1 层，再点加一层，点到 0 拿走</span>';
        box.appendChild(title);
        box.appendChild(buildTopGrid());
        return box;
    }

    function updateStat() {
        els.stat.textContent = '底面 ' + SIZE + ' × ' + SIZE + ' · 共 ' + cubeCount() +
            ' 个小正方体 · 最高 ' + maxHeight() + ' 层';
        els.btnViews.querySelector('span').textContent = state.showViews ? '隐藏三视图' : '显示三视图';
        chrome.setStatus(state.mode === 'guess' ? '猜一猜（三视图已遮住）' : '搭一搭', 'ok');
    }

    function syncSeg() {
        var btns = els.seg.getElementsByTagName('button');
        for (var i = 0; i < btns.length; i++) {
            btns[i].className = btns[i].getAttribute('data-mode') === state.mode ? 'is-on' : '';
        }
    }

    /* ---------- 操作 ---------- */

    function setMode(mode) {
        if (MODES.indexOf(mode) < 0 || mode === state.mode) { return; }
        state.mode = mode;
        persist();
        render();
    }

    function randomShape() {
        state.grid = emptyGrid();
        var want = 5 + Math.floor(Math.random() * 4);   /* 5–8 个立方体 */
        var guard = 0;
        while (cubeCount() < want && guard++ < 200) {
            var x = Math.floor(Math.random() * SIZE);
            var y = Math.floor(Math.random() * SIZE);
            if (state.grid[x][y] >= 2) { continue; }
            state.grid[x][y]++;
        }
        persist();
        render();
        try { chrome.beep('ok'); } catch (e) { /* 静默 */ }
    }

    function clearAll() {
        state.grid = emptyGrid();
        persist();
        render();
        chrome.toast('已清空，开始搭吧');
    }

    function toggleViews() {
        state.showViews = !state.showViews;
        persist();
        render();
        chrome.toast(state.showViews ? '三视图已显示' : '三视图已遮住，请学生先猜');
    }

    function doPrint() {
        if (typeof window.print !== 'function') { chrome.toast('当前环境不支持打印', 'err'); return; }
        window.setTimeout(function () {
            try { window.print(); } catch (e) { chrome.toast('打印失败，请用浏览器打印快捷键', 'err'); }
        }, 60);
    }

    /* ---------- 设置 ---------- */

    function buildSettings(body) {
        body.innerHTML =
            '<h4>玩法</h4>' +
            '<div class="et-drawer__row">' +
            '<select class="et-drawer__input" id="svSetMode">' +
            '<option value="build"' + (state.mode === 'build' ? ' selected' : '') + '>搭一搭（边搭边看三视图）</option>' +
            '<option value="guess"' + (state.mode === 'guess' ? ' selected' : '') + '>猜一猜（遮住主视图 / 左视图）</option>' +
            '</select></div>' +
            '<p class="et-drawer__tip">「猜一猜」适合先让学生说，再点「显示三视图」对照；' +
            '底面固定 4 × 4、每格最多 4 层，符合教材常用规模。</p>' +

            '<h4>三视图口径</h4>' +
            '<p class="et-drawer__tip"><b>主视图</b>：从前往后看；<b>左视图</b>：从左往右看；' +
            '<b>俯视图</b>：从上往下看。某一排看到几列，取决于这一排最高的那格。</p>' +

            '<h4>当前</h4>' +
            '<p class="et-drawer__tip">共 <b>' + cubeCount() + '</b> 个小正方体，最高 <b>' + maxHeight() +
            '</b> 层。搭法保存在本机浏览器，刷新不丢。</p>' +
            '<div class="et-drawer__row">' +
            '<button class="et-btn" id="svSetRandom" type="button">随机搭一个</button>' +
            '<button class="et-btn et-btn--danger" id="svSetClear" type="button">清空</button>' +
            '</div>';

        var q = function (id) { return document.getElementById(id); };
        q('svSetMode').addEventListener('change', function () { setMode(this.value); });
        q('svSetRandom').addEventListener('click', randomShape);
        q('svSetClear').addEventListener('click', clearAll);
    }

    /* ---------- 事件与启动 ---------- */

    var segBtns = els.seg.getElementsByTagName('button');
    for (var b = 0; b < segBtns.length; b++) {
        (function (btn) {
            btn.addEventListener('click', function () { setMode(btn.getAttribute('data-mode')); });
        })(segBtns[b]);
    }

    els.btnRandom.addEventListener('click', randomShape);
    els.btnClear.addEventListener('click', clearAll);
    els.btnViews.addEventListener('click', toggleViews);
    els.btnPrint.addEventListener('click', doPrint);

    document.addEventListener('keydown', function (e) {
        if (isTypingTarget(e.target)) { return; }
        if (e.key === '1') { setMode('build'); }
        else if (e.key === '2') { setMode('guess'); }
        else if (e.key === 'r' || e.key === 'R') { randomShape(); }
        else if (e.key === 'v' || e.key === 'V') { toggleViews(); }
        else if ((e.key === 'p' || e.key === 'P') && !e.ctrlKey && !e.metaKey) { doPrint(); }
    });

    if (!cubeCount()) { randomShape(); }
    render();
})();
</script>

</body>
</html>
