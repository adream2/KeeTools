/*!

/* ============ 设计令牌 ============ */
:root {
    --et-accent: #2563eb;
    --et-accent-weak: rgba(37, 99, 235, .14);
    --et-bg: #f4f6fb;
    --et-surface: #ffffff;
    --et-surface-2: #f8fafc;
    --et-fg: #0b1220;
    --et-muted: #64748b;
    --et-line: rgba(15, 23, 42, .12);
    --et-line-strong: rgba(15, 23, 42, .22);
    --et-glass: rgba(255, 255, 255, .85);
    --et-shadow-md: 0 10px 28px -18px rgba(15, 23, 42, .3);
    --et-shadow-lg: 0 24px 60px -32px rgba(15, 23, 42, .4);
    --et-ok: #059669;
    --et-warn: #d97706;
    --et-err: #dc2626;
    --et-radius: 12px;
    --et-radius-sm: 9px;
    --et-font: -apple-system, BlinkMacSystemFont, "Segoe UI",
               "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei",
               "Noto Sans SC", sans-serif;
    --et-mono: ui-monospace, "Cascadia Mono", Consolas, Menlo, monospace;
}

html[data-et-theme="dark"] {
    --et-bg: #0b1120;
    --et-surface: #111a2e;
    --et-surface-2: #0f1729;
    --et-fg: #f1f5f9;
    --et-muted: #94a3b8;
    --et-line: rgba(148, 163, 184, .18);
    --et-line-strong: rgba(148, 163, 184, .3);
    --et-glass: rgba(17, 26, 46, .85);
    --et-shadow-md: 0 10px 34px -18px rgba(0, 0, 0, .8);
    --et-shadow-lg: 0 24px 70px -30px rgba(0, 0, 0, .9);
    --et-ok: #34d399;
    --et-warn: #fbbf24;
    --et-err: #f87171;
}

/* ============ 基础 ============ */

/* body 作为外壳时必须清掉浏览器默认 8px 外边距，
   否则 iframe 预览中文档会比视口高 16px（底部白边 + 多余滚动） */
body.et-app {
    margin: 0;
}

.et-app {
    position: relative;
    isolation: isolate;
    display: flex;
    flex-direction: column;
    height: 100vh;
    height: 100dvh;
    overflow: hidden;
    background: var(--et-bg);
    color: var(--et-fg);
    font-family: var(--et-font);
    -webkit-font-smoothing: antialiased;
    transition: background .25s, color .25s;
}

/* 极光背景：径向渐变 + 呼吸动画（edupick 品质基线，老内核也不掉帧） */
.et-app::before {
    content: '';
    position: fixed;
    inset: 0;
    z-index: -1;
    pointer-events: none;
    background:
        radial-gradient(46% 40% at 20% 18%, var(--et-accent-weak), transparent 65%),
        radial-gradient(42% 38% at 82% 24%, var(--et-accent-weak), transparent 70%),
        radial-gradient(50% 44% at 55% 95%, rgba(16, 185, 129, .10), transparent 65%);
    animation: et-aurora 16s ease-in-out infinite alternate;
}

@keyframes et-aurora {
    from { opacity: .55; transform: scale(1); }
    to { opacity: 1; transform: scale(1.06); }
}

.et-app *,
.et-app *::before,
.et-app *::after { box-sizing: border-box; }

[hidden] { display: none !important; }

.et-icon {
    width: 18px;
    height: 18px;
    fill: none;
    stroke: currentColor;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
    flex: none;
}

/* ============ 顶栏 ============ */
.et-topbar {
    flex: none;
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 11px 20px;
    border-bottom: 1px solid var(--et-line);
    background: var(--et-glass);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    z-index: 20;
}

.et-brand {
    display: flex;
    align-items: center;
    gap: 10px;
    min-width: 0;
}

.et-brand__dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: var(--et-accent);
    box-shadow: 0 0 0 4px var(--et-accent-weak);
    flex: none;
}

.et-brand__name {
    font-weight: 800;
    font-size: 15px;
    letter-spacing: -.01em;
    white-space: nowrap;
}

.et-brand__sub {
    font-size: 12.5px;
    color: var(--et-muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.et-status {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 5px 14px;
    border-radius: 999px;
    font-size: 12.5px;
    color: var(--et-muted);
    background: var(--et-surface-2);
    border: 1px solid var(--et-line);
    white-space: nowrap;
    max-width: 42vw;
    overflow: hidden;
    text-overflow: ellipsis;
}

.et-status__dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--et-ok);
    flex: none;
    transition: background .2s;
}

.et-status[data-tone="err"] .et-status__dot { background: var(--et-err); }
.et-status[data-tone="warn"] .et-status__dot { background: var(--et-warn); }

.et-actions {
    display: flex;
    align-items: center;
    gap: 7px;
}

.et-icon-btn {
    display: inline-grid;
    place-items: center;
    width: 38px;
    height: 38px;
    font-size: 16px;
    line-height: 1;
    border-radius: 11px;
    border: 1px solid var(--et-line);
    background: var(--et-surface-2);
    color: var(--et-fg);
    cursor: pointer;
    transition: transform .14s, border-color .14s, color .14s, opacity .14s;
    -webkit-tap-highlight-color: transparent;
}

.et-icon-btn:hover {
    border-color: var(--et-accent);
    color: var(--et-accent);
    transform: translateY(-1px);
}

.et-icon-btn:active { transform: translateY(0); }
.et-icon-btn.is-off { opacity: .4; }
.et-icon-btn:focus-visible { outline: 2px solid var(--et-accent); outline-offset: 2px; }

/* ============ 主区默认 ============ */
.et-main {
    flex: 1;
    min-height: 0;
    position: relative;
    overflow: auto;
}

/* ============ 页脚（品牌回流 L2） ============ */
.et-footer {
    flex: none;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 7px 16px;
    font-size: 12px;
    color: var(--et-muted);
    border-top: 1px solid var(--et-line);
    background: var(--et-glass);
    user-select: none;
    z-index: 20;
}

.et-footer a {
    color: inherit;
    text-decoration: none;
    transition: color .14s;
}

.et-footer a:hover { color: var(--et-accent); }

/* ============ 按钮 ============ */
.et-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
    padding: 9px 16px;
    border-radius: 11px;
    font: inherit;
    font-size: 13.5px;
    font-weight: 700;
    border: 1px solid var(--et-line);
    background: var(--et-surface-2);
    color: var(--et-fg);
    cursor: pointer;
    transition: transform .14s, border-color .14s, color .14s, background .14s, box-shadow .14s;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
}

.et-btn:hover {
    border-color: var(--et-accent);
    color: var(--et-accent);
    transform: translateY(-1px);
}

.et-btn:active { transform: translateY(0); }
.et-btn:focus-visible { outline: 2px solid var(--et-accent); outline-offset: 2px; }
.et-btn:disabled { opacity: .45; cursor: not-allowed; transform: none; }

.et-btn--primary {
    background: var(--et-accent);
    border-color: var(--et-accent);
    color: #fff;
    box-shadow: 0 6px 18px -8px var(--et-accent);
}

.et-btn--primary:hover { color: #fff; filter: brightness(1.08); }
.et-btn--primary:disabled { filter: none; }

.et-btn--danger:hover {
    border-color: var(--et-err);
    color: var(--et-err);
}

.et-btn--lg {
    padding: 13px 26px;
    font-size: 16px;
    border-radius: 14px;
}

/* ============ 弹窗 ============ */
.et-modal {
    position: fixed;
    inset: 0;
    z-index: 100;
    display: grid;
    place-items: center;
    padding: 24px;
    background: rgba(2, 6, 23, .55);
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    animation: et-fade .18s ease;
}

.et-modal__panel {
    width: min(680px, 94vw);
    max-height: 86vh;
    max-height: 86dvh;
    display: flex;
    flex-direction: column;
    background: var(--et-surface);
    border: 1px solid var(--et-line);
    border-radius: 16px;
    box-shadow: var(--et-shadow-lg);
    animation: et-pop .2s cubic-bezier(.34, 1.4, .64, 1);
    overflow: hidden;
}

.et-modal__panel--narrow { width: min(460px, 92vw); }
.et-modal__panel--wide { width: min(900px, 94vw); }

.et-modal__head {
    flex: none;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 16px 20px;
    border-bottom: 1px solid var(--et-line);
    font-weight: 800;
    font-size: 15px;
}

.et-modal__head .et-icon-btn {
    margin-left: auto;
    width: 32px;
    height: 32px;
}

.et-modal__body {
    flex: 1;
    min-height: 0;
    overflow: auto;
    padding: 18px 20px;
}

.et-modal__foot {
    flex: none;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 14px 20px;
    border-top: 1px solid var(--et-line);
    background: var(--et-surface-2);
}

.et-modal__foot .spacer { flex: 1; }

@keyframes et-fade {
    from { opacity: 0; }
}

@keyframes et-pop {
    from { opacity: 0; transform: translateY(14px) scale(.97); }
}

/* ============ 轻提示（toast） ============ */
.et-toast {
    position: fixed;
    left: 50%;
    bottom: 56px;
    transform: translateX(-50%) translateY(10px);
    z-index: 120;
    display: flex;
    align-items: center;
    gap: 9px;
    max-width: min(520px, 88vw);
    padding: 11px 18px;
    border-radius: 12px;
    font-size: 13.5px;
    font-weight: 600;
    color: #fff;
    background: rgba(15, 23, 42, .92);
    border: 1px solid rgba(148, 163, 184, .25);
    box-shadow: var(--et-shadow-lg);
    opacity: 0;
    pointer-events: none;
    transition: opacity .22s, transform .22s;
}

.et-toast.is-show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
}

.et-toast[data-tone="ok"] { background: rgba(5, 150, 105, .95); }
.et-toast[data-tone="err"] { background: rgba(220, 38, 38, .95); }
.et-toast[data-tone="warn"] { background: rgba(217, 119, 6, .95); }

/* ============ 设置抽屉（右上角入口，edupick 交互） ============ */
.et-drawer-backdrop {
    position: fixed;
    inset: 0;
    z-index: 90;
    background: rgba(2, 6, 23, .45);
    backdrop-filter: blur(3px);
    -webkit-backdrop-filter: blur(3px);
    opacity: 0;
    transition: opacity .2s;
}

.et-drawer-backdrop.is-open { opacity: 1; }

.et-drawer {
    position: absolute;
    top: 0;
    right: 0;
    height: 100%;
    width: min(400px, 92vw);
    display: flex;
    flex-direction: column;
    background: var(--et-surface);
    border-left: 1px solid var(--et-line);
    box-shadow: var(--et-shadow-lg);
    transform: translateX(100%);
    transition: transform .22s cubic-bezier(.32, .72, .35, 1);
}

.et-drawer-backdrop.is-open .et-drawer { transform: translateX(0); }

.et-drawer__head {
    flex: none;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 15px 18px;
    border-bottom: 1px solid var(--et-line);
    font-weight: 800;
    font-size: 15px;
    color: var(--et-accent);
}

.et-drawer__head .et-icon-btn {
    margin-left: auto;
    width: 32px;
    height: 32px;
}

.et-drawer__body {
    flex: 1;
    min-height: 0;
    overflow: auto;
    padding: 16px 18px 24px;
}

/* 抽屉内容通用小节（工具复用） */
.et-drawer__body h4 {
    margin: 18px 0 8px;
    font-size: 12px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: .08em;
    color: var(--et-muted);
}

.et-drawer__body h4:first-child { margin-top: 0; }

.et-drawer__row {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
}

.et-drawer__tip {
    margin: 8px 0 0;
    font-size: 12px;
    line-height: 1.8;
    color: var(--et-muted);
}

.et-drawer__tip b { color: var(--et-fg); }

.et-drawer__input {
    flex: 1;
    min-width: 0;
    padding: 9px 12px;
    border: 1px solid var(--et-line-strong);
    border-radius: 9px;
    background: var(--et-surface-2);
    color: var(--et-fg);
    font: inherit;
    font-size: 13.5px;
    transition: border-color .14s, box-shadow .14s;
}

.et-drawer__input:focus {
    outline: none;
    border-color: var(--et-accent);
    box-shadow: 0 0 0 3px var(--et-accent-weak);
}

.et-drawer__switch {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 10px 0;
    border-bottom: 1px dashed var(--et-line);
    font-size: 13.5px;
    font-weight: 600;
    color: var(--et-fg);
    cursor: pointer;
    user-select: none;
}

.et-drawer__switch input {
    width: 17px;
    height: 17px;
    accent-color: var(--et-accent);
    cursor: pointer;
}
</style>

            document.body.appendChild(toastEl);
        }
        toastEl.textContent = msg;
        toastEl.setAttribute('data-tone', tone || '');

        toastEl.classList.add('is-show');

        toastTimer = setTimeout(function () { toastEl.classList.remove('is-show'); }, 2200);
    }

    /* ---------- PWA 元数据（blob manifest，环境不支持时静默跳过） ---------- */

    function installPwa(toolId, title, accent) {
        try {
            var theme = document.querySelector('meta[name="theme-color"]');
            if (!theme) {
                theme = document.createElement('meta');
                theme.setAttribute('name', 'theme-color');
                document.head.appendChild(theme);

            theme.setAttribute('content', accent || '#2563eb');

            var svg = '<svg xmlns="' + NS_SVG + '" viewBox="0 0 64 64">' +
                '<rect width="64" height="64" rx="14" fill="' + (accent || '#2563eb') + '"/>' +
                '<text x="32" y="43" font-size="32" font-weight="800" font-family="sans-serif" ' +
                'fill="#fff" text-anchor="middle">' + (title || '课').charAt(0) + '</text></svg>';
            var iconUri = 'data:image/svg+xml,' + encodeURIComponent(svg);

            var mf = {

                start_url: '.',
                display: 'standalone',

                theme_color: accent || '#2563eb',
                icons: [{ src: iconUri, sizes: 'any', type: 'image/svg+xml', purpose: 'any' }]

            var blob = new Blob([JSON.stringify(mf)], { type: 'application/manifest+json' });

        if (!main) { main = el('main'); main.id = 'et-main'; topbar.after(main); }

        var statusText = el('span', null, '');

            ? global.ET_SITE_ORIGIN

        try {

        if (typeof opt.primary === 'function') {

                if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') { return; }
                if (document.querySelector('.et-modal, .et-drawer-backdrop, .ws-winner')) { return; }
                ev.preventDefault();
                if (ev.key === 'PageDown') { opt.primary(); }
                else if (typeof opt.secondary === 'function') { opt.secondary(); }
                else { opt.primary(); }
            });

<script>
  /* 此块由 scripts/sync_shared.py 自动注入，请勿手工修改 */
/*!
 * et-stats.js — 使用统计模块（模块化，可整体移除）
 *
 * 共享逻辑源。改这里，然后跑：python scripts/sync_shared.py
 * 依赖：无（可脱离 et-util / et-chrome 独立运行）。
 * 全局：ET.Stats
 *
 * ┌────────────────────────────────────────────────────────────────┐
 * │ 说明：本模块只做一件事——工具被打开时向上报端点发一条匿名计数。 │
 * │ · 在线（iframe 内）：宿主页面已服务端计数，本模块不重复上报。   │
 * │ · 离线打开（file:// / 下载单文件 / 离线包）：联网条件具备时，   │
 * │   以 sendBeacon 上报 use_offline 事件（text/plain 免预检）。    │
 * │ · 上报端点 = window.ET_SITE_ORIGIN（由宿主注入或离线包配置）。  │
 * │   未配置端点时本模块完全静默，不发任何请求。                    │
 * │ · **整个 <script> 块可安全删除**：删除后工具其余功能完全正常，  │
 * │   且完全不再发起任何网络请求。                                  │
 * └────────────────────────────────────────────────────────────────┘
 */
(function (global) {
    'use strict';

    var ET = global.ET = global.ET || {};

    var Stats = {
        /** 上报端点来源（站点绝对地址，无协议尾斜杠） */
        endpoint: (typeof global.ET_SITE_ORIGIN === 'string' && /^https?:\/\//.test(global.ET_SITE_ORIGIN))
            ? global.ET_SITE_ORIGIN
            : null,

        _done: {},

        /**
         * 上报一次事件（同一事件同一工具每次页面加载只报一次）。
         * event: 'use_offline' 等；toolId: 工具 id。
         */
        send: function (event, toolId) {
            if (!event || this._done[event + ':' + (toolId || '')]) { return false; }
            if (!this.endpoint) { return false; }
            /* iframe 内由宿主统计，避免双计 */
            try {
                if (global.parent && global.parent !== global) { return false; }
            } catch (err) { return false; }
            /* 断网时挂起，网络恢复自动补报一次 */
            if (global.navigator && global.navigator.onLine === false) {
                var self = this;
                global.addEventListener('online', function () { self.send(event, toolId); }, { once: true });
                return false;
            }

            this._done[event + ':' + (toolId || '')] = true;
            var payload = JSON.stringify({ event: event, tool: toolId || '' });

            try {
                if (global.navigator.sendBeacon) {
                    return global.navigator.sendBeacon(
                        this.endpoint + '/api/track',
                        new Blob([payload], { type: 'text/plain;charset=UTF-8' })
                    );
                }
                global.fetch(this.endpoint + '/api/track', {
                    method: 'POST',
                    body: payload,
                    keepalive: true,
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'text/plain;charset=UTF-8' }
                });
                return true;
            } catch (err) {
                return false;
            }
        }
    };

    ET.Stats = Stats;
})(window);
</script>

<script>
(function () {
    'use strict';

    var TOOL_ID = 'derivative-graph';
    var store = ET.store(TOOL_ID);

    /* ── 示例函数库 ── */
    var EXAMPLES = [
        { label: '三次函数 x³−3x', expr: 'x^3-3x' },
        { label: '二次函数 x²−2x−1', expr: 'x^2-2x-1' },
        { label: '正弦函数 sin(x)', expr: 'sin(x)' },
        { label: 'sin(x) + x/2', expr: 'sin(x)+x/2' },
        { label: '指数函数 e^x', expr: 'e^x' },
        { label: '对数函数 ln(x)', expr: 'ln(x)' },
        { label: '反比例 1/x', expr: '1/x' },
        { label: '平方根 √x', expr: 'sqrt(x)' },
        { label: 'sin(x)/x', expr: 'sin(x)/x' },
        { label: '双曲音频 x·e^(−x²)', expr: 'x*e^(-x^2)' }
    ];

    /* ── 表达式编译：白名单 + 隐式乘法 + Math 映射 ── */
    var FN_MAP = [
        ['asin', 'Math.asin'], ['acos', 'Math.acos'], ['atan', 'Math.atan'],
        ['sin', 'Math.sin'], ['cos', 'Math.cos'], ['tan', 'Math.tan'],
        ['sqrt', 'Math.sqrt'], ['abs', 'Math.abs'], ['exp', 'Math.exp'],
        ['floor', 'Math.floor'], ['ceil', 'Math.ceil'], ['round', 'Math.round'],
        ['sign', 'Math.sign'], ['log10', 'Math.log10'],
        ['log', 'Math.log10'], ['ln', 'Math.log']
    ];

    function compile(src) {
        var s = String(src || '').toLowerCase().replace(/\s+/g, '');
        if (!s || s.length > 120) { return null; }
        if (!/^[0-9a-z+\-*/^().,]+$/.test(s)) { return null; }
        s = s.replace(/\^/g, '**');
        /* 隐式乘法：数字/右括号 与 变量/常量/左括号 之间 */
        s = s.replace(/(\d|\))\s*(x|pi|e\b|\()/g, '$1*$2');
        for (var i = 0; i < FN_MAP.length; i++) {
            s = s.replace(new RegExp('\\b' + FN_MAP[i][0] + '\\b', 'g'), FN_MAP[i][1]);
        }
        s = s.replace(/\bpi\b/g, 'Math.PI');
        s = s.replace(/\be\b/g, 'Math.E');
        s = s.replace(/\bx\b/g, 'X');
        var fn;
        try {
            fn = new Function('X', '"use strict";return (' + s + ');');
        } catch (err) {
            return null;
        }
        /* 抽样自证：三个点必须可计算（允许个别点发散，但至少一个有限） */
        var ok = 0;
        try {
            var probes = [0.5, 1.3, -2.1];
            for (var j = 0; j < probes.length; j++) {
                var v = fn(probes[j]);
                if (typeof v === 'number' && isFinite(v)) { ok++; }
            }
        } catch (err2) { return null; }
        return ok >= 1 ? fn : null;
    }

    /* ── 状态 ── */
    var fn = null;                 /* 编译后的函数 */
    var view = { cx: 0, cy: 0, span: 12 };   /* 中心 + 横向跨度 */
    var hover = null;              /* {px, py, x, y, d} */
    var cv = document.getElementById('cv');
    var ctx = cv.getContext('2d');
    var els = {
        expr: document.getElementById('expr'),
        examples: document.getElementById('examples'),
        chkDeriv: document.getElementById('chkDeriv'),
        chkMono: document.getElementById('chkMono'),
        chkExtrema: document.getElementById('chkExtrema'),
        readout: document.getElementById('readout'),
        btnReset: document.getElementById('btnReset'),
        btnZoomIn: document.getElementById('btnZoomIn'),
        btnZoomOut: document.getElementById('btnZoomOut')
    };

    function cssVar(name) {
        return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
    }

    /* 主题由共享外壳写在 <html data-et-theme> 上（不是 body 类名） */
    function isDark() {
        return document.documentElement.getAttribute('data-et-theme') === 'dark';
    }

    function worldToScreen(x, y) {
        var w = cv.clientWidth, h = cv.clientHeight;
        var scale = w / view.span;
        return { x: w / 2 + (x - view.cx) * scale, y: h / 2 - (y - view.cy) * scale };
    }

    function screenToWorld(px, py) {
        var w = cv.clientWidth, h = cv.clientHeight;
        var scale = w / view.span;
        return { x: view.cx + (px - w / 2) / scale, y: view.cy - (py - h / 2) / scale };
    }

    function deriv(x) {
        var h = 1e-4;
        var a, b;
        try { a = fn(x + h); } catch (e) { return NaN; }
        try { b = fn(x - h); } catch (e2) { return NaN; }
        return (a - b) / (2 * h);
    }

    /* ── 绘制 ── */
    function draw() {
        var w = cv.clientWidth, h = cv.clientHeight;
        var dpr = window.devicePixelRatio || 1;
        if (cv.width !== Math.round(w * dpr) || cv.height !== Math.round(h * dpr)) {
            cv.width = Math.round(w * dpr);
            cv.height = Math.round(h * dpr);
        }
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        ctx.clearRect(0, 0, w, h);

        var fg = isDark() ? '#e8eaed' : '#1f2328';
        var grid = isDark() ? 'rgba(255,255,255,.08)' : 'rgba(0,0,0,.07)';
        var axis = isDark() ? 'rgba(255,255,255,.35)' : 'rgba(0,0,0,.35)';
        var accent = cssVar('--dg-accent') || '#0891b2';

        /* 网格 */
        var step = niceStep(view.span / 10);
        var tl = screenToWorld(0, 0), br = screenToWorld(w, h);
        ctx.lineWidth = 1;
        ctx.strokeStyle = grid;
        ctx.font = '11px sans-serif';
        ctx.fillStyle = isDark() ? 'rgba(255,255,255,.45)' : 'rgba(0,0,0,.45)';
        var x0 = Math.ceil(tl.x / step) * step;
        for (var gx = x0; gx <= br.x; gx += step) {
            var p = worldToScreen(gx, 0);
            ctx.beginPath(); ctx.moveTo(p.x, 0); ctx.lineTo(p.x, h); ctx.stroke();
            if (Math.abs(gx) > step / 1000) { ctx.fillText(fmtNum(gx, step), p.x + 3, Math.min(h - 4, Math.max(12, worldToScreen(0, 0).y - 4))); }
        }
        var y0 = Math.ceil(br.y / step) * step;
        for (var gy = y0; gy <= tl.y; gy += step) {
            var q = worldToScreen(0, gy);
            ctx.beginPath(); ctx.moveTo(0, q.y); ctx.lineTo(w, q.y); ctx.stroke();
            if (Math.abs(gy) > step / 1000) { ctx.fillText(fmtNum(gy, step), Math.min(w - 30, Math.max(3, worldToScreen(0, 0).x + 4)), q.y - 3); }
        }

        /* 坐标轴 */
        var ox = worldToScreen(0, 0);
        ctx.strokeStyle = axis;
        ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.moveTo(0, ox.y); ctx.lineTo(w, ox.y); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(ox.x, 0); ctx.lineTo(ox.x, h); ctx.stroke();

        if (!fn) { return; }

        /* 单调区间着色（f′ 符号） */
        if (els.chkMono.checked) {
            var cols = Math.max(60, Math.min(400, Math.round(w / 2)));
            for (var i = 0; i < cols; i++) {
                var xm = tl.x + (br.x - tl.x) * (i + 0.5) / cols;
                var d = deriv(xm);
                if (!isFinite(d) || Math.abs(d) < 1e-9) { continue; }
                ctx.fillStyle = d > 0 ? 'rgba(34,197,94,.16)' : 'rgba(239,68,68,.16)';
                var s1 = worldToScreen(tl.x + (br.x - tl.x) * i / cols, 0);
                ctx.fillRect(s1.x, 0, w / cols + 1, h);
            }
        }

        /* 曲线 */
        plotCurve(fn, accent, 2.5);
        if (els.chkDeriv.checked) { plotCurve(deriv, '#ea580c', 2); }

        /* 极值点（f′ 变号） */
        if (els.chkExtrema.checked) {
            var n = 600;
            var prevD = deriv(tl.x), found = [];
            for (var k = 1; k <= n; k++) {
                var xx = tl.x + (br.x - tl.x) * k / n;
                var dd = deriv(xx);
                if (isFinite(prevD) && isFinite(dd) && prevD * dd < 0) {
                    var xe = prevD > 0 ? xx : xx;
                    var ye = fn(xe);
                    if (isFinite(ye)) { found.push({ x: xe, y: ye, max: prevD > 0 }); }
                }
                prevD = dd;
            }
            ctx.font = '600 12px sans-serif';
            for (var m = 0; m < found.length; m++) {
                var pp = worldToScreen(found[m].x, found[m].y);
                ctx.fillStyle = found[m].max ? '#dc2626' : '#2563eb';
                ctx.beginPath(); ctx.arc(pp.x, pp.y, 5, 0, Math.PI * 2); ctx.fill();
                ctx.fillStyle = found[m].max ? '#dc2626' : '#2563eb';
                ctx.fillText((found[m].max ? '极大' : '极小') + ' (' + fmtVal(found[m].x) + ', ' + fmtVal(found[m].y) + ')', pp.x + 8, pp.y - 8);
            }
        }

        /* 悬停探针：点 + 切线 */
        if (hover && fn) {
            var hv = worldToScreen(hover.wx, hover.wy);
            ctx.strokeStyle = 'rgba(128,128,128,.5)';
            ctx.lineWidth = 1;
            ctx.setLineDash([4, 4]);
            ctx.beginPath(); ctx.moveTo(0, hv.y); ctx.lineTo(w, hv.y); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(hv.x, 0); ctx.lineTo(hv.x, h); ctx.stroke();
            ctx.setLineDash([]);
            var slope = deriv(hover.wx);
            if (isFinite(slope)) {
                var dirX = 40;
                var dirY = -slope * dirX;
                var len = Math.sqrt(dirX * dirX + dirY * dirY);
                if (len > 0) {
                    var L = 70;
                    ctx.strokeStyle = accent;
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.moveTo(hv.x - dirX / len * L, hv.y - dirY / len * L);
                    ctx.lineTo(hv.x + dirX / len * L, hv.y + dirY / len * L);
                    ctx.stroke();
                }
                ctx.fillStyle = accent;
                ctx.beginPath(); ctx.arc(hv.x, hv.y, 5, 0, Math.PI * 2); ctx.fill();
                els.readout.textContent = 'x = ' + fmtVal(hover.wx) +
                    '　f(x) = ' + fmtVal(hover.wy) +
                    '　f′(x) = ' + fmtVal(slope) +
                    (Math.abs(slope) < 0.02 ? '　（切线近水平）' : slope > 0 ? '　（上升）' : '　（下降）');
            }
        }
    }

    function plotCurve(f, color, lw) {
        var w = cv.clientWidth, h = cv.clientHeight;
        ctx.strokeStyle = color;
        ctx.lineWidth = lw;
        ctx.lineJoin = 'round';
        ctx.beginPath();
        var started = false, lastY = null;
        for (var px = 0; px <= w; px += 2) {
            var wx = screenToWorld(px, 0).x;
            var wy;
            try { wy = f(wx); } catch (e) { wy = NaN; }
            if (!isFinite(wy) || Math.abs(wy) > 1e6) { started = false; lastY = null; continue; }
            var sp = worldToScreen(wx, wy);
            if (lastY !== null && Math.abs(sp.y - lastY) > h * 2) { started = false; }
            if (!started) { ctx.moveTo(sp.x, sp.y); started = true; }
            else { ctx.lineTo(sp.x, sp.y); }
            lastY = sp.y;
        }
        ctx.stroke();
    }

    function niceStep(raw) {
        var p = Math.pow(10, Math.floor(Math.log10(raw)));
        var r = raw / p;
        if (r < 1.5) { return p; }
        if (r < 3.5) { return 2 * p; }
        if (r < 7.5) { return 5 * p; }
        return 10 * p;
    }

    function fmtNum(v, step) {
        var dec = Math.max(0, -Math.floor(Math.log10(step)));
        var s = v.toFixed(Math.min(4, dec));
        return String(parseFloat(s));
    }

    function fmtVal(v) {
        if (!isFinite(v)) { return '—'; }
        if (Math.abs(v) >= 1e5 || (Math.abs(v) < 1e-4 && v !== 0)) { return v.toExponential(2); }
        return String(parseFloat(v.toFixed(3)));
    }

    /* ── 交互 ── */
    var dragging = false, dragStart = null;

    cv.addEventListener('pointerdown', function (e) {
        dragging = true;
        dragStart = { px: e.offsetX, py: e.offsetY, cx: view.cx, cy: view.cy };
        cv.setPointerCapture(e.pointerId);
    });
    cv.addEventListener('pointermove', function (e) {
        if (dragging && dragStart) {
            var scale = cv.clientWidth / view.span;
            view.cx = dragStart.cx - (e.offsetX - dragStart.px) / scale;
            view.cy = dragStart.cy + (e.offsetY - dragStart.py) / scale;
            hover = null;
        } else {
            var wp = screenToWorld(e.offsetX, e.offsetY);
            hover = { wx: wp.x, wy: fn ? fn(wp.x) : wp.y, px: e.offsetX, py: e.offsetY };
        }
        draw();
    });
    cv.addEventListener('pointerup', function () { dragging = false; dragStart = null; });
    cv.addEventListener('pointerleave', function () { hover = null; draw(); });
    cv.addEventListener('wheel', function (e) {
        e.preventDefault();
        zoomAt(e.offsetX, e.offsetY, e.deltaY > 0 ? 1.15 : 1 / 1.15);
    }, { passive: false });

    function zoomAt(px, py, factor) {
        var before = screenToWorld(px, py);
        view.span = Math.min(1000, Math.max(0.2, view.span * factor));
        var after = screenToWorld(px, py);
        view.cx += before.x - after.x;
        view.cy += before.y - after.y;
        draw();
    }

    els.btnZoomIn.addEventListener('click', function () { zoomAt(cv.clientWidth / 2, cv.clientHeight / 2, 1 / 1.3); });
    els.btnZoomOut.addEventListener('click', function () { zoomAt(cv.clientWidth / 2, cv.clientHeight / 2, 1.3); });
    els.btnReset.addEventListener('click', function () { view = { cx: 0, cy: 0, span: 12 }; draw(); });

    function loadExpr(src, keepSilent) {
        var f = compile(src);
        if (!f) {
            if (!keepSilent) { chrome.setStatus('表达式无效', 'warn'); }
            return false;
        }
        fn = f;
        els.expr.value = src;
        store.set('expr', src);
        draw();
        return true;
    }

    els.expr.addEventListener('input', function () {
        if (loadExpr(els.expr.value, true)) { chrome.setStatus('就绪'); }
    });
    els.expr.addEventListener('change', function () {
        if (!loadExpr(els.expr.value)) {
            chrome.toast('表达式无法解析，请检查写法', 'warn');
        }
    });
    els.chkDeriv.addEventListener('change', draw);
    els.chkMono.addEventListener('change', draw);
    els.chkExtrema.addEventListener('change', draw);
    window.addEventListener('resize', draw);

    /* 切换深浅色后重绘（Canvas 颜色不随 CSS 自动更新） */
    try {
        var themeObserver = new MutationObserver(function () { draw(); });
        themeObserver.observe(document.documentElement, { attributes: true, attributeFilter: ['data-et-theme'] });
    } catch (err) { /* 老内核忽略 */ }

    /* ── Chrome 外壳 ── */
    var chrome = ET.Chrome.mount({
        toolId: TOOL_ID,
        title: '导数图像',
        sub: '数学',
        accent: '#0891b2',
        status: '就绪',
        sound: true,
        primary: function () { /* 主操作留空：绘图工具无需翻页键动作 */ },
        settings: {
            title: '设置',
            build: function (body) {
                body.innerHTML = '<p style="font-size:13.5px;line-height:2;color:var(--et-muted)">' +
                    '支持的写法：+ − × ÷ 乘方 ^、括号；函数 sin cos tan sqrt ln log abs exp 等；' +
                    '常量 pi、e。乘号可省略（如 3x、x(x+1)）。</p>';
            }
        },
        help: '<div style="font-size:13.5px;line-height:2">' +
            '<p style="margin:0 0 8px"><b>怎么用</b>：输入任意 f(x)，实时绘制函数与导函数图像；' +
            '绿色/红色底色分别表示 f′&gt;0（上升）与 f′&lt;0（下降）区间，圆点标注极值点。</p>' +
            '<p style="margin:0 0 8px"><b>操作</b>：拖动平移，滚轮缩放，悬停显示坐标、切线与斜率。</p>' +
            '<p style="margin:0"><b>教学建议</b>：先让学生猜导函数形状再勾选显示；用示例库切换典型函数对比。</p></div>'
    });

    /* 示例下拉 */
    for (var i = 0; i < EXAMPLES.length; i++) {
        var opt = document.createElement('option');
        opt.value = EXAMPLES[i].expr;
        opt.textContent = EXAMPLES[i].label;
        els.examples.appendChild(opt);
    }
    els.examples.addEventListener('change', function () {
        if (els.examples.value) {
            loadExpr(els.examples.value);
            chrome.setStatus('示例：' + els.examples.value);
            els.examples.selectedIndex = 0;
        }
    });

    /* 恢复上次表达式，否则默认示例 */
    var saved = store.get('expr', 'x^3-3x');
    if (!loadExpr(saved, true)) { loadExpr('x^3-3x', true); }
    draw();
})();
</script>

</body>
</html>
