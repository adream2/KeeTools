/*!
 * et-chrome.css — 工具通用外壳样式（顶栏 / 页脚 / 弹窗 / 按钮 / 主题）
 *
 * 共享样式源。改这里，然后跑：python scripts/sync_shared.py
 * 所有类名带 et- 前缀，避免与工具自身样式冲突。
 * 依赖：无外部资源；颜色全部为令牌变量。

/* ============ 设计令牌 ============ */
:root {
    --et-accent: #2563eb;
    --et-accent-weak: rgba(37, 99, 235, .14);
    --et-bg: #f4f6fb;
    --et-surface: #ffffff;
    --et-surface-2: #f8fafc;
    --et-fg: #0b1220;
    --et-muted: #64748b;
    --et-line: rgba(15, 23, 42, .12);
    --et-line-strong: rgba(15, 23, 42, .22);
    --et-glass: rgba(255, 255, 255, .85);
    --et-shadow-md: 0 10px 28px -18px rgba(15, 23, 42, .3);
    --et-shadow-lg: 0 24px 60px -32px rgba(15, 23, 42, .4);
    --et-ok: #059669;
    --et-warn: #d97706;
    --et-err: #dc2626;
    --et-radius: 12px;
    --et-radius-sm: 9px;
    --et-font: -apple-system, BlinkMacSystemFont, "Segoe UI",
               "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei",
               "Noto Sans SC", sans-serif;
    --et-mono: ui-monospace, "Cascadia Mono", Consolas, Menlo, monospace;
}

html[data-et-theme="dark"] {
    --et-bg: #0b1120;
    --et-surface: #111a2e;
    --et-surface-2: #0f1729;
    --et-fg: #f1f5f9;
    --et-muted: #94a3b8;
    --et-line: rgba(148, 163, 184, .18);
    --et-line-strong: rgba(148, 163, 184, .3);
    --et-glass: rgba(17, 26, 46, .85);
    --et-shadow-md: 0 10px 34px -18px rgba(0, 0, 0, .8);
    --et-shadow-lg: 0 24px 70px -30px rgba(0, 0, 0, .9);
    --et-ok: #34d399;
    --et-warn: #fbbf24;
    --et-err: #f87171;
}

/* ============ 基础 ============ */

/* body 作为外壳时必须清掉浏览器默认 8px 外边距，
   否则 iframe 预览中文档会比视口高 16px（底部白边 + 多余滚动） */
body.et-app {
    margin: 0;
}

.et-app {
    position: relative;
    isolation: isolate;
    display: flex;
    flex-direction: column;
    height: 100vh;
    height: 100dvh;
    overflow: hidden;
    background: var(--et-bg);
    color: var(--et-fg);
    font-family: var(--et-font);
    -webkit-font-smoothing: antialiased;
    transition: background .25s, color .25s;
}

/* 极光背景：径向渐变 + 呼吸动画（edupick 品质基线，老内核也不掉帧） */
.et-app::before {
    content: '';
    position: fixed;
    inset: 0;
    z-index: -1;
    pointer-events: none;
    background:
        radial-gradient(46% 40% at 20% 18%, var(--et-accent-weak), transparent 65%),
        radial-gradient(42% 38% at 82% 24%, var(--et-accent-weak), transparent 70%),
        radial-gradient(50% 44% at 55% 95%, rgba(16, 185, 129, .10), transparent 65%);
    animation: et-aurora 16s ease-in-out infinite alternate;
}

@keyframes et-aurora {
    from { opacity: .55; transform: scale(1); }
    to { opacity: 1; transform: scale(1.06); }
}

.et-app *,
.et-app *::before,
.et-app *::after { box-sizing: border-box; }

[hidden] { display: none !important; }

.et-icon {
    width: 18px;
    height: 18px;
    fill: none;
    stroke: currentColor;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
    flex: none;
}

/* ============ 顶栏 ============ */
.et-topbar {
    flex: none;
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 11px 20px;
    border-bottom: 1px solid var(--et-line);
    background: var(--et-glass);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    z-index: 20;
}

.et-brand {
    display: flex;
    align-items: center;
    gap: 10px;
    min-width: 0;
}

.et-brand__dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: var(--et-accent);
    box-shadow: 0 0 0 4px var(--et-accent-weak);
    flex: none;
}

.et-brand__name {
    font-weight: 800;
    font-size: 15px;
    letter-spacing: -.01em;
    white-space: nowrap;
}

.et-brand__sub {
    font-size: 12.5px;
    color: var(--et-muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.et-status {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 5px 14px;
    border-radius: 999px;
    font-size: 12.5px;
    color: var(--et-muted);
    background: var(--et-surface-2);
    border: 1px solid var(--et-line);
    white-space: nowrap;
    max-width: 42vw;
    overflow: hidden;
    text-overflow: ellipsis;
}

.et-status__dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--et-ok);
    flex: none;
    transition: background .2s;
}

.et-status[data-tone="err"] .et-status__dot { background: var(--et-err); }
.et-status[data-tone="warn"] .et-status__dot { background: var(--et-warn); }

.et-actions {
    display: flex;
    align-items: center;
    gap: 7px;
}

.et-icon-btn {
    display: inline-grid;
    place-items: center;
    width: 38px;
    height: 38px;
    font-size: 16px;
    line-height: 1;
    border-radius: 11px;
    border: 1px solid var(--et-line);
    background: var(--et-surface-2);
    color: var(--et-fg);
    cursor: pointer;
    transition: transform .14s, border-color .14s, color .14s, opacity .14s;
    -webkit-tap-highlight-color: transparent;
}

.et-icon-btn:hover {
    border-color: var(--et-accent);
    color: var(--et-accent);
    transform: translateY(-1px);
}

.et-icon-btn:active { transform: translateY(0); }
.et-icon-btn.is-off { opacity: .4; }
.et-icon-btn:focus-visible { outline: 2px solid var(--et-accent); outline-offset: 2px; }

/* ============ 主区默认 ============ */
.et-main {
    flex: 1;
    min-height: 0;
    position: relative;
    overflow: auto;
}

/* ============ 页脚（品牌回流 L2） ============ */
.et-footer {
    flex: none;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 7px 16px;
    font-size: 12px;
    color: var(--et-muted);
    border-top: 1px solid var(--et-line);
    background: var(--et-glass);
    user-select: none;
    z-index: 20;
}

.et-footer a {
    color: inherit;
    text-decoration: none;
    transition: color .14s;
}

.et-footer a:hover { color: var(--et-accent); }

/* ============ 按钮 ============ */
.et-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
    padding: 9px 16px;
    border-radius: 11px;
    font: inherit;
    font-size: 13.5px;
    font-weight: 700;
    border: 1px solid var(--et-line);
    background: var(--et-surface-2);
    color: var(--et-fg);
    cursor: pointer;
    transition: transform .14s, border-color .14s, color .14s, background .14s, box-shadow .14s;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
}

.et-btn:hover {
    border-color: var(--et-accent);
    color: var(--et-accent);
    transform: translateY(-1px);
}

.et-btn:active { transform: translateY(0); }
.et-btn:focus-visible { outline: 2px solid var(--et-accent); outline-offset: 2px; }
.et-btn:disabled { opacity: .45; cursor: not-allowed; transform: none; }

.et-btn--primary {
    background: var(--et-accent);
    border-color: var(--et-accent);
    color: #fff;
    box-shadow: 0 6px 18px -8px var(--et-accent);
}

.et-btn--primary:hover { color: #fff; filter: brightness(1.08); }
.et-btn--primary:disabled { filter: none; }

.et-btn--danger:hover {
    border-color: var(--et-err);
    color: var(--et-err);
}

.et-btn--lg {
    padding: 13px 26px;
    font-size: 16px;
    border-radius: 14px;
}

/* ============ 弹窗 ============ */
.et-modal {
    position: fixed;
    inset: 0;
    z-index: 100;
    display: grid;
    place-items: center;
    padding: 24px;
    background: rgba(2, 6, 23, .55);
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    animation: et-fade .18s ease;
}

.et-modal__panel {
    width: min(680px, 94vw);
    max-height: 86vh;
    max-height: 86dvh;
    display: flex;
    flex-direction: column;
    background: var(--et-surface);
    border: 1px solid var(--et-line);
    border-radius: 16px;
    box-shadow: var(--et-shadow-lg);
    animation: et-pop .2s cubic-bezier(.34, 1.4, .64, 1);
    overflow: hidden;
}

.et-modal__panel--narrow { width: min(460px, 92vw); }
.et-modal__panel--wide { width: min(900px, 94vw); }

.et-modal__head {
    flex: none;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 16px 20px;
    border-bottom: 1px solid var(--et-line);
    font-weight: 800;
    font-size: 15px;
}

.et-modal__head .et-icon-btn {
    margin-left: auto;
    width: 32px;
    height: 32px;
}

.et-modal__body {
    flex: 1;
    min-height: 0;
    overflow: auto;
    padding: 18px 20px;
}

.et-modal__foot {
    flex: none;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 14px 20px;
    border-top: 1px solid var(--et-line);
    background: var(--et-surface-2);
}

.et-modal__foot .spacer { flex: 1; }

@keyframes et-fade {
    from { opacity: 0; }
}

@keyframes et-pop {
    from { opacity: 0; transform: translateY(14px) scale(.97); }
}

/* ============ 轻提示（toast） ============ */
.et-toast {
    position: fixed;
    left: 50%;
    bottom: 56px;
    transform: translateX(-50%) translateY(10px);
    z-index: 120;
    display: flex;
    align-items: center;
    gap: 9px;
    max-width: min(520px, 88vw);
    padding: 11px 18px;
    border-radius: 12px;
    font-size: 13.5px;
    font-weight: 600;
    color: #fff;
    background: rgba(15, 23, 42, .92);
    border: 1px solid rgba(148, 163, 184, .25);
    box-shadow: var(--et-shadow-lg);
    opacity: 0;
    pointer-events: none;
    transition: opacity .22s, transform .22s;
}

.et-toast.is-show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
}

.et-toast[data-tone="ok"] { background: rgba(5, 150, 105, .95); }
.et-toast[data-tone="err"] { background: rgba(220, 38, 38, .95); }
.et-toast[data-tone="warn"] { background: rgba(217, 119, 6, .95); }

/* ============ 设置抽屉（右上角入口，edupick 交互） ============ */
.et-drawer-backdrop {
    position: fixed;
    inset: 0;
    z-index: 90;
    background: rgba(2, 6, 23, .45);
    backdrop-filter: blur(3px);
    -webkit-backdrop-filter: blur(3px);
    opacity: 0;
    transition: opacity .2s;
}

.et-drawer-backdrop.is-open { opacity: 1; }

.et-drawer {
    position: absolute;
    top: 0;
    right: 0;
    height: 100%;
    width: min(400px, 92vw);
    display: flex;
    flex-direction: column;
    background: var(--et-surface);
    border-left: 1px solid var(--et-line);
    box-shadow: var(--et-shadow-lg);
    transform: translateX(100%);
    transition: transform .22s cubic-bezier(.32, .72, .35, 1);
}

.et-drawer-backdrop.is-open .et-drawer { transform: translateX(0); }

.et-drawer__head {
    flex: none;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 15px 18px;
    border-bottom: 1px solid var(--et-line);
    font-weight: 800;
    font-size: 15px;
    color: var(--et-accent);
}

.et-drawer__head .et-icon-btn {
    margin-left: auto;
    width: 32px;
    height: 32px;
}

.et-drawer__body {
    flex: 1;
    min-height: 0;
    overflow: auto;
    padding: 16px 18px 24px;
}

/* 抽屉内容通用小节（工具复用） */
.et-drawer__body h4 {
    margin: 18px 0 8px;
    font-size: 12px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: .08em;
    color: var(--et-muted);
}

.et-drawer__body h4:first-child { margin-top: 0; }

.et-drawer__row {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
}

.et-drawer__tip {
    margin: 8px 0 0;
    font-size: 12px;
    line-height: 1.8;
    color: var(--et-muted);
}

.et-drawer__tip b { color: var(--et-fg); }

.et-drawer__input {
    flex: 1;
    min-width: 0;
    padding: 9px 12px;
    border: 1px solid var(--et-line-strong);
    border-radius: 9px;
    background: var(--et-surface-2);
    color: var(--et-fg);
    font: inherit;
    font-size: 13.5px;
    transition: border-color .14s, box-shadow .14s;
}

.et-drawer__input:focus {
    outline: none;
    border-color: var(--et-accent);
    box-shadow: 0 0 0 3px var(--et-accent-weak);
}

.et-drawer__switch {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 10px 0;
    border-bottom: 1px dashed var(--et-line);
    font-size: 13.5px;
    font-weight: 600;
    color: var(--et-fg);
    cursor: pointer;
    user-select: none;
}

.et-drawer__switch input {
    width: 17px;
    height: 17px;
    accent-color: var(--et-accent);
    cursor: pointer;
}
</style>

<style>
/* ── 工具自身样式：自包含，不引用任何外部资源 ── */
:root {
    --wm-accent: #7c3aed;

.wm-grid {

.wm-card {

        var dropSvg = document.createElementNS(NS_SVG, 'svg');
        dropSvg.setAttribute('class', 'et-icon');
        var dropUse = document.createElementNS(NS_SVG, 'use');
        dropUse.setAttribute('href', '#i-upload');
        dropSvg.appendChild(dropUse);
        dropIconHost.appendChild(dropSvg);

        drop.addEventListener('click', function () { fileInput.click(); });
        drop.addEventListener('keydown', function (ev) {
            if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); fileInput.click(); }
        });
        ['dragenter', 'dragover'].forEach(function (evName) {
            drop.addEventListener(evName, function (ev) {
                ev.preventDefault();
                drop.classList.add('is-over');
            });
        });
        ['dragleave', 'drop'].forEach(function (evName) {
            drop.addEventListener(evName, function (ev) {
                ev.preventDefault();
                drop.classList.remove('is-over');
            });
        });
        drop.addEventListener('drop', function (ev) {
            var files = ev.dataTransfer && ev.dataTransfer.files;
            if (files && files.length) { readFile(files[0]); }
        });
        fileInput.addEventListener('change', function () {
            if (fileInput.files && fileInput.files.length) { readFile(fileInput.files[0]); }
        });

        function readFile(file) {
            var reader = new FileReader();
            reader.onload = function () {
                var text = decodeBuffer(reader.result);
                var isJson = /\.json$/i.test(file.name) ||
                    (text.charAt(0) !== '\n' && (text.charAt(0) === '['));
                if (isJson) {
                    try {
                        JSON.parse(text.trim()); /* 校验合法性，错误交给 parseText 报 */
                    } catch (err) { /* parseText 会再次报错 */ }
                }
                textEl.value = text;
                /* 切回粘贴页让用户可见内容 */
                wrap.querySelectorAll('.etimp-tab').forEach(function (t) {
                    t.classList.toggle('is-active', t.getAttribute('data-tab') === 'paste');
                });
                q('[data-panel="paste"]').hidden = false;
                q('[data-panel="file"]').hidden = true;
                refresh();
                global.ET.Chrome.toast('已读取 ' + file.name, 'ok');
            };
            reader.onerror = function () {
                global.ET.Chrome.toast('文件读取失败', 'err');
            };
            reader.readAsArrayBuffer(file);
        }

        refresh();
        setTimeout(function () { textEl.focus(); }, 60);

        return modal;
    }

    global.ET = global.ET || {};
    global.ET.Import = { open: open, parseText: parseText, decodeBuffer: decodeBuffer };
})(window);
</script>

/*!
 * download.js — 通用文件导出（Blob + a[download]）
 *
 * 共享逻辑源。改这里，然后跑：python scripts/sync_shared.py
 * 依赖：无。
 * 全局：ET.download / ET.csvCell
 *
 * 用法：
 *   ET.download('词表.csv', lines.join('\r\n'), 'text/csv');  // 默认加 UTF-8 BOM
 *   ET.download('名单.txt', text, 'text/plain');
 *   ET.download('数据.json', json, 'application/json', false); // 第 4 参 false = 不加 BOM
 *   ET.csvCell(v)  // CSV 单元格转义（含逗号/引号/换行时加引号）
 *
 * 说明：BOM 让 Excel / WPS / 记事本正确识别 UTF-8；JSON 等程序消费格式传 false。
 */
(function (global) {
    'use strict';

    var ET = global.ET = global.ET || {};

    function download(filename, text, mime, bom) {
        var type = (mime || 'text/plain') + ';charset=utf-8';
        var blob = new Blob([bom === false ? text : '\uFEFF' + text], { type: type });
        var url = URL.createObjectURL(blob);
        var a = document.createElement('a');
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        setTimeout(function () {
            if (a.parentNode) { a.parentNode.removeChild(a); }
            URL.revokeObjectURL(url);
        }, 120);
    }

    function csvCell(v) {
        var s = String(v === undefined || v === null ? '' : v);
        if (/[",\n\r]/.test(s)) { return '"' + s.replace(/"/g, '""') + '"'; }
        return s;
    }

    ET.download = download;
    ET.csvCell = csvCell;
})(window);
</script>

<script>
  /* 此块由 scripts/sync_shared.py 自动注入，请勿手工修改 */
/*!
 * et-stats.js — 使用统计模块（模块化，可整体移除）
 *
 * 共享逻辑源。改这里，然后跑：python scripts/sync_shared.py
 * 依赖：无（可脱离 et-util / et-chrome 独立运行）。
 * 全局：ET.Stats
 *
 * ┌────────────────────────────────────────────────────────────────┐
 * │ 说明：本模块只做一件事——工具被打开时向上报端点发一条匿名计数。 │
 * │ · 在线（iframe 内）：宿主页面已服务端计数，本模块不重复上报。   │
 * │ · 离线打开（file:// / 下载单文件 / 离线包）：联网条件具备时，   │
 * │   以 sendBeacon 上报 use_offline 事件（text/plain 免预检）。    │
 * │ · 上报端点 = window.ET_SITE_ORIGIN（由宿主注入或离线包配置）。  │
 * │   未配置端点时本模块完全静默，不发任何请求。                    │
 * │ · **整个 <script> 块可安全删除**：删除后工具其余功能完全正常，  │
 * │   且完全不再发起任何网络请求。                                  │
 * └────────────────────────────────────────────────────────────────┘
 */
(function (global) {
    'use strict';

    var ET = global.ET = global.ET || {};

    var Stats = {
        /** 上报端点来源（站点绝对地址，无协议尾斜杠） */
        endpoint: (typeof global.ET_SITE_ORIGIN === 'string' && /^https?:\/\//.test(global.ET_SITE_ORIGIN))
            ? global.ET_SITE_ORIGIN
            : null,

        _done: {},

        /**
         * 上报一次事件（同一事件同一工具每次页面加载只报一次）。
         * event: 'use_offline' 等；toolId: 工具 id。
         */
        send: function (event, toolId) {
            if (!event || this._done[event + ':' + (toolId || '')]) { return false; }
            if (!this.endpoint) { return false; }
            /* iframe 内由宿主统计，避免双计 */
            try {
                if (global.parent && global.parent !== global) { return false; }
            } catch (err) { return false; }
            /* 断网时挂起，网络恢复自动补报一次 */
            if (global.navigator && global.navigator.onLine === false) {
                var self = this;
                global.addEventListener('online', function () { self.send(event, toolId); }, { once: true });
                return false;
            }

            this._done[event + ':' + (toolId || '')] = true;
            var payload = JSON.stringify({ event: event, tool: toolId || '' });

            try {
                if (global.navigator.sendBeacon) {
                    return global.navigator.sendBeacon(
                        this.endpoint + '/api/track',
                        new Blob([payload], { type: 'text/plain;charset=UTF-8' })
                    );
                }
                global.fetch(this.endpoint + '/api/track', {
                    method: 'POST',
                    body: payload,
                    keepalive: true,
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'text/plain;charset=UTF-8' }
                });
                return true;
            } catch (err) {
                return false;
            }
        }
    };

    ET.Stats = Stats;
})(window);
</script>

<script>
(function () {
    'use strict';

    var TOOL_ID = 'word-memory';
    var store = ET.store(TOOL_ID);

    var MODES = ['memory', 'open'];
    var MODE_LABEL = { memory: '记忆翻牌', open: '明牌配对' };
    var PAIRS = [4, 6, 8, 10, 12];

    /* 内置示例词表：通用基础词汇（自编，不取任何教材单元词表） */
    var SAMPLE = [
        ['apple', '苹果'], ['banana', '香蕉'], ['orange', '橙子'], ['pear', '梨'],
        ['dog', '狗'], ['cat', '猫'], ['bird', '鸟'], ['fish', '鱼'],
        ['book', '书'], ['pen', '钢笔'], ['ruler', '尺子'], ['desk', '课桌'],
        ['chair', '椅子'], ['red', '红色'], ['blue', '蓝色'], ['green', '绿色'],
        ['milk', '牛奶'], ['bread', '面包'], ['water', '水'], ['school', '学校']
    ];

    var chrome = ET.Chrome.mount({
        toolId: TOOL_ID,
        title: '单词配对连连看',
        sub: '英语 · 记忆翻牌 / 明牌配对',
        accent: '#7c3aed',
        status: '记忆翻牌',
        sound: true,
        primary: restart,        /* 翻页笔下页键 = 重开一局 */
        secondary: peekAll,      /* 翻页笔上页键 = 全部亮一下 */
        actions: [
            { icon: 'i-upload', label: '导入词表', onClick: openImport },
            { icon: 'i-list', label: '查看词表', onClick: showList },
            { icon: 'i-eye', label: '全部亮一下', onClick: peekAll },
            { icon: 'i-refresh', label: '重开一局', onClick: restart }
        ],
        settings: { title: '配对 / 设置', build: buildSettings },
        help: '<div style="font-size:13.5px;line-height:2">' +
            '<p style="margin:0 0 8px"><b>两种玩法</b>：<b>记忆翻牌</b>——牌面全盖住，凭记忆找「英文 ↔ 中文」配对；' +
            '<b>明牌配对</b>——牌面全部朝上，直接点两张配对的牌（低年级或快速热身用）。</p>' +
            '<p style="margin:0 0 8px"><b>怎么用</b>：点「导入词表」粘贴单元词汇（一行一个，可写 <b>apple,苹果</b>），' +
            '或直接用内置 20 个基础词汇；在 ⚙ 设置里选牌面规模（4–12 对）。</p>' +
            '<p style="margin:0 0 8px"><b>课堂用法</b>：投屏后请学生轮流上台翻两张；' +
            '也可点「全部亮一下」给 2 秒记忆时间再开始。步数与用时自动记录，' +
            '同一规模的最佳成绩存在本机。</p>' +
            '<p style="margin:0"><b>快捷键</b>：<b>空格</b> 重开一局、<b>P</b> 全部亮一下；' +
            '翻页笔下页键 = 重开一局。词表与记录保存在本机浏览器。</p></div>'
    });

    var els = {
        seg: document.getElementById('modeSeg'),
        pairSel: document.getElementById('pairSel'),
        stat: document.getElementById('stat'),
        preview: document.getElementById('preview'),
        foot: document.getElementById('foot'),
        btnImport: document.getElementById('btnImport'),
        btnList: document.getElementById('btnList'),
        btnRestart: document.getElementById('btnRestart')
    };

    var state = loadState();
    var words = loadWords();
    var game = null;

    /* ---------- 状态 ---------- */

    function loadState() {
        var s = {
            mode: store.get('mode', 'memory'),
            pairs: parseInt(store.get('pairs', 8), 10) || 8,
            best: store.get('best', {})
        };
        if (MODES.indexOf(s.mode) < 0) { s.mode = 'memory'; }
        if (PAIRS.indexOf(s.pairs) < 0) { s.pairs = 8; }
        if (!s.best || typeof s.best !== 'object') { s.best = {}; }
        return s;
    }

    function loadWords() {
        var list = normalizeWords(store.get('words', null));
        return list.length ? list : toWords(SAMPLE);
    }

    function normalizeWords(list) {
        var out = [];
        if (!Array.isArray(list)) { return out; }
        for (var i = 0; i < list.length; i++) {
            var it = list[i];
            if (!it) { continue; }
            var w = String(it.word === undefined || it.word === null ? '' : it.word).trim();
            if (!w || !/[A-Za-z]/.test(w)) { continue; }
            var m = String(it.mean === undefined || it.mean === null ? '' : it.mean).trim();
            out.push({ word: w, mean: m || w });
        }
        return out;
    }

    function toWords(pairs) {
        var out = [];
        for (var i = 0; i < pairs.length; i++) {
            out.push({ word: pairs[i][0], mean: pairs[i][1] || pairs[i][0] });
        }
        return out;
    }

    function persist() {
        store.set('mode', state.mode);
        store.set('pairs', state.pairs);
        store.set('best', state.best);
        store.set('words', words);
    }

    function isTypingTarget(node) {
        if (!node || !node.tagName) { return false; }
        var tag = node.tagName.toUpperCase();
        return tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT' || node.isContentEditable === true;
    }

    function el(tag, cls, value) {
        var node = document.createElement(tag);
        if (cls) { node.className = cls; }
        if (value !== undefined && value !== null) { node.textContent = value; }
        return node;
    }

    /** 需要加粗等简单标记的片段用 innerHTML（内容均为程序生成，无外部输入） */
    function htmlEl(tag, cls, markup) {
        var node = document.createElement(tag);
        if (cls) { node.className = cls; }
        node.innerHTML = markup;
        return node;
    }

    function pad2(n) { return (n < 10 ? '0' : '') + n; }

    function fmtTime(secs) {
        var m = Math.floor(secs / 60);
        return pad2(m) + ':' + pad2(secs % 60);
    }

    function shuffle(arr) {
        var out = arr.slice();
        for (var i = out.length - 1; i > 0; i--) {
            var j = Math.floor(Math.random() * (i + 1));
            var t = out[i]; out[i] = out[j]; out[j] = t;
        }
        return out;
    }

    /* ---------- 开局 ---------- */

    function deal() {
        if (!words.length) { game = null; return; }
        var pool = shuffle(words).slice(0, Math.min(state.pairs, words.length));
        var cards = [];
        for (var i = 0; i < pool.length; i++) {
            cards.push({ pid: i, kind: 'en', text: pool[i].word, state: 'down' });
            cards.push({ pid: i, kind: 'cn', text: pool[i].mean, state: 'down' });
        }
        cards = shuffle(cards);
        for (var c = 0; c < cards.length; c++) { cards[c].id = c; }
        game = {
            cards: cards,
            pairs: pool.length,
            picked: [],
            moves: 0,
            secs: 0,
            running: false,
            done: false,
            busy: false,
            peek: false
        };
        stopTimer();
    }

    var timer = null;

    function startTimer() {
        if (timer) { return; }
        timer = window.setInterval(function () {
            if (!game || game.done) { return; }
            game.secs++;
            updateFoot();
        }, 1000);
    }

    function stopTimer() {
        if (timer) {
            window.clearInterval(timer);
            timer = null;
        }
    }

    /* ---------- 渲染 ---------- */

    function render() {
        els.preview.innerHTML = '';
        if (!words.length) {
            var empty = el('div', 'wm-empty');
            empty.appendChild(el('div', 'wm-empty__title', '还没有词表'));
            var tip = document.createElement('div');
            tip.innerHTML = '点右上角「导入词表」粘贴单词（一行一个，可写 <b>apple,苹果</b>），<br>' +
                '或点「载入示例词表」使用 20 个基础词汇。';
            empty.appendChild(tip);
            els.preview.appendChild(empty);
            updateFoot();
            return;
        }
        if (!game) { deal(); }

        var cols = columnsFor(game.cards.length);
        var grid = el('div', 'wm-grid');
        grid.style.setProperty('--wm-cols', String(cols));

        for (var i = 0; i < game.cards.length; i++) {
            grid.appendChild(buildCard(game.cards[i]));
        }
        els.preview.appendChild(grid);
        syncSeg();
        els.pairSel.value = String(state.pairs);
        updateFoot();
    }

    function columnsFor(count) {
        if (count <= 8) { return 4; }
        if (count <= 12) { return 4; }
        if (count <= 16) { return 4; }
        if (count <= 20) { return 5; }
        return 6;
    }

    function buildCard(card) {
        var cls = 'wm-card';
        if (card.state === 'done') { cls += ' is-done is-ok'; }
        if (card.state === 'ok') { cls += ' is-ok'; }
        if (card.state === 'bad') { cls += ' is-bad'; }
        if (game.picked.indexOf(card.id) >= 0) { cls += ' is-pick'; }
        var hidden = (state.mode === 'memory' && card.state === 'down' && !game.peek);
        if (hidden) { cls += ' is-hidden'; }

        var node = el('button', cls);
        node.type = 'button';
        node.appendChild(el('span', 'wm-card__label', card.kind === 'en' ? 'EN' : '中'));
        node.appendChild(el('span', 'wm-card__face', card.text));
        node.addEventListener('click', function () { pick(card.id); });
        return node;
    }

    function pick(id) {
        if (!game || game.done || game.busy) { return; }
        var card = game.cards[id];
        if (card.state === 'done') { return; }
        if (game.picked.indexOf(id) >= 0) {
            game.picked.splice(game.picked.indexOf(id), 1);
            render();
            return;
        }
        game.picked.push(id);
        if (!game.running) {
            game.running = true;
            startTimer();
        }
        if (game.picked.length < 2) {
            render();
            return;
        }

        game.moves++;
        var a = game.cards[game.picked[0]];
        var b = game.cards[game.picked[1]];
        if (a.pid === b.pid && a.kind !== b.kind) {
            a.state = 'ok';
            b.state = 'ok';
            game.picked = [];
            try { chrome.beep('ok'); } catch (e) { /* 静默 */ }
            render();
            window.setTimeout(function () {
                if (!game) { return; }
                a.state = 'done';
                b.state = 'done';
                checkDone();
                render();
            }, 360);
        } else {
            game.busy = true;
            a.state = 'bad';
            b.state = 'bad';
            try { chrome.beep('tick'); } catch (e) { /* 静默 */ }
            render();
            window.setTimeout(function () {
                if (!game) { return; }
                a.state = 'down';
                b.state = 'down';
                game.picked = [];
                game.busy = false;
                render();
            }, 720);
        }
    }

    function checkDone() {
        for (var i = 0; i < game.cards.length; i++) {
            if (game.cards[i].state !== 'done') { return; }
        }
        game.done = true;
        game.running = false;
        stopTimer();
        var key = String(game.pairs);
        var rec = state.best[key];
        var better = !rec || game.moves < rec.moves ||
            (game.moves === rec.moves && game.secs < rec.secs);
        if (better) {
            state.best[key] = { moves: game.moves, secs: game.secs };
        }
        persist();
        try { chrome.beep('win'); } catch (e) { /* 静默 */ }
        chrome.toast('全部配对完成！' + game.moves + ' 步 · ' + fmtTime(game.secs) +
            (better ? '（新纪录）' : ''), 'ok');
    }

    function updateFoot() {
        if (!game) {
            els.foot.innerHTML = '';
            els.stat.textContent = words.length ? words.length + ' 个单词可用' : '尚未导入词表';
            return;
        }
        var left = 0;
        for (var i = 0; i < game.cards.length; i++) {
            if (game.cards[i].state !== 'done') { left++; }
        }
        left = Math.ceil(left / 2);
        els.foot.innerHTML = '';
        els.foot.appendChild(htmlEl('span', null, '剩余 <b>' + left + '</b> 对'));
        els.foot.appendChild(htmlEl('span', null, '步数 <b>' + game.moves + '</b>'));
        els.foot.appendChild(htmlEl('span', null, '用时 <b>' + fmtTime(game.secs) + '</b>'));
        var rec = state.best[String(game.pairs)];
        els.foot.appendChild(htmlEl('span', null, '最佳（' + game.pairs + ' 对）：' +
            (rec ? '<b>' + rec.moves + '</b> 步 / ' + fmtTime(rec.secs) : '—')));

        els.stat.textContent = words.length + ' 个单词 · ' + MODE_LABEL[state.mode] +
            ' · ' + game.pairs + ' 对';
        chrome.setStatus(MODE_LABEL[state.mode] + ' · ' + game.pairs + ' 对', 'ok');
    }

    function syncSeg() {
        var btns = els.seg.getElementsByTagName('button');
        for (var i = 0; i < btns.length; i++) {
            btns[i].className = btns[i].getAttribute('data-mode') === state.mode ? 'is-on' : '';
        }
    }

    /* ---------- 操作 ---------- */

    function restart() {
        stopTimer();
        deal();
        render();
        try { chrome.beep('ok'); } catch (e) { /* 静默 */ }
    }

    function peekAll() {
        if (!game) { return; }
        if (state.mode === 'open') { chrome.toast('明牌模式下牌面本来就是亮的'); return; }
        game.peek = true;
        game.picked = [];
        render();
        chrome.toast('全部亮一下，2 秒后盖回去');
        window.setTimeout(function () {
            if (!game) { return; }
            game.peek = false;
            render();
        }, 2000);
    }

    function setMode(mode) {
        if (MODES.indexOf(mode) < 0 || mode === state.mode) { return; }
        state.mode = mode;
        persist();
        restart();
        chrome.toast('玩法：' + MODE_LABEL[mode]);
    }

    function setPairs(n) {
        if (PAIRS.indexOf(n) < 0 || n === state.pairs) { return; }
        state.pairs = n;
        persist();
        restart();
    }

    /* ---------- 词表 ---------- */

    function openImport() {
        if (!(window.ET && ET.Import)) { chrome.toast('导入组件未加载', 'err'); return; }
        var lines = [];
        for (var i = 0; i < words.length; i++) {
            lines.push(words[i].word === words[i].mean ? words[i].word : words[i].word + ',' + words[i].mean);
        }
        ET.Import.open({
            toolId: TOOL_ID,
            title: '导入词表',
            fields: [
                { key: 'word', label: '单词', keys: ['单词', '英文', '内容', 'word', 'english'] },
                { key: 'mean', label: '中文', keys: ['中文', '释义', '意思', '词义', 'mean'] }
            ],
            current: lines.join('\n'),
            placeholder: '一行一个单词，务必带中文（配对靠中文面）：\napple,苹果\nbanana,香蕉',
            help: '第一列是<b>英文单词</b>，第二列是<b>中文释义</b>（配对时用中文面，建议填写）。' +
                '支持逗号 / Tab 分隔、带表头 CSV 与 JSON 数组。建议每局 8–12 对，' +
                '牌面太多会挤；词条太长（如整句）也会挤压牌面。',
            onConfirm: function (rows) {
                var list = [];
                for (var r = 0; r < rows.length; r++) {
                    if (!rows[r].word) { continue; }
                    list.push({ word: rows[r].word, mean: rows[r].mean || '' });
                }
                words = normalizeWords(list);
                if (!words.length) { chrome.toast('没有可用单词（需含英文字母）', 'err'); return; }
                store.set('words', words);
                persist();
                restart();
                try { chrome.beep('ok'); } catch (e) { /* 静默 */ }
                chrome.toast('已导入 ' + words.length + ' 个单词', 'ok');
            }
        });
    }

    function showList() {
        var html = '<ul class="wm-wordlist">';
        for (var i = 0; i < words.length; i++) {
            html += '<li><b>' + ET.escapeHtml(words[i].word) + '</b>' +
                (words[i].mean && words[i].mean !== words[i].word
                    ? ' <span>' + ET.escapeHtml(words[i].mean) + '</span>' : '') + '</li>';
        }
        html += '</ul>';
        chrome.modal({
            title: '当前词表（' + words.length + ' 个）',
            icon: 'i-list',
            size: 'wide',
            body: html,
            buttons: [
                {
                    label: '载入示例词表', onClick: function (close) {
                        words = toWords(SAMPLE);
                        store.set('words', words);
                        persist();
                        restart();
                        close();
                        chrome.toast('已载入 ' + words.length + ' 个基础词汇');
                    }
                },
                { label: '关闭', primary: true }
            ]
        });
    }

    /* ---------- 设置 ---------- */

    function options(pairs, current) {
        var out = '';
        for (var i = 0; i < pairs.length; i++) {
            out += '<option value="' + pairs[i][0] + '"' +
                (String(pairs[i][0]) === String(current) ? ' selected' : '') + '>' + pairs[i][1] + '</option>';
        }
        return out;
    }

    /* ---------- 导出 ---------- */

    function exportCsv() {
        if (!words.length) { chrome.toast('没有可导出的单词', 'warn'); return; }
        var lines = ['单词,中文'];
        for (var i = 0; i < words.length; i++) {
            lines.push(ET.csvCell(words[i].word) + ',' + ET.csvCell(words[i].mean || ''));
        }
        ET.download('单词配对词表.csv', lines.join('\r\n'), 'text/csv');
        chrome.toast('已导出 ' + words.length + ' 个单词（可在 Excel 编辑后导回）', 'ok');
    }

    function buildSettings(body) {
        var rec = [];
        for (var i = 0; i < PAIRS.length; i++) {
            var r = state.best[String(PAIRS[i])];
            rec.push(PAIRS[i] + ' 对：' + (r ? r.moves + ' 步 / ' + fmtTime(r.secs) : '—'));
        }
        body.innerHTML =
            '<h4>玩法</h4>' +
            '<div class="et-drawer__row">' +
            '<select class="et-drawer__input" id="wmSetMode">' +
            options([['memory', '记忆翻牌（牌面朝下）'], ['open', '明牌配对（牌面朝上）']], state.mode) +
            '</select></div>' +
            '<div class="et-drawer__row" style="margin-top:8px">' +
            '<select class="et-drawer__input" id="wmSetPairs">' +
            options([['4', '4 对（8 张）'], ['6', '6 对（12 张）'], ['8', '8 对（16 张）'],
                ['10', '10 对（20 张）'], ['12', '12 对（24 张）']], state.pairs) +
            '</select></div>' +
            '<p class="et-drawer__tip">低年级建议 4–6 对；人数多的小组赛用 10–12 对。</p>' +

            '<h4>本机最佳记录</h4>' +
            '<p class="et-drawer__tip">' + rec.join('<br>') + '</p>' +
            '<div class="et-drawer__row">' +
            '<button class="et-btn et-btn--danger" id="wmSetClearRec" type="button">清空记录</button>' +
            '</div>' +

            '<h4>词表</h4>' +
            '<p class="et-drawer__tip">当前 <b>' + words.length + '</b> 个单词（每局随机抽 ' + state.pairs +
            ' 个）。内置示例为通用基础词汇，不含任何教材单元词表。</p>' +
            '<div class="et-drawer__row">' +
            '<button class="et-btn" id="wmSetSample" type="button">载入示例词表</button>' +
            '<button class="et-btn" id="wmSetImport" type="button">导入词表</button>' +
            '<button class="et-btn" id="wmSetExport" type="button">导出 CSV</button>' +
            '</div>' +
            '<p class="et-drawer__tip">导出 CSV 含 UTF-8 BOM，可用 Excel / WPS 编辑后原样导入；数据保存在本机浏览器。</p>';

        var q = function (id) { return document.getElementById(id); };
        q('wmSetMode').addEventListener('change', function () { setMode(this.value); });
        q('wmSetPairs').addEventListener('change', function () { setPairs(parseInt(this.value, 10)); });
        q('wmSetClearRec').addEventListener('click', function () {
            state.best = {};
            persist();
            render();
            chrome.toast('记录已清空');
        });
        q('wmSetSample').addEventListener('click', function () {
            words = toWords(SAMPLE);
            store.set('words', words);
            persist();
            restart();
            chrome.toast('已载入 ' + words.length + ' 个基础词汇');
        });
        q('wmSetImport').addEventListener('click', openImport);
        q('wmSetExport').addEventListener('click', exportCsv);
    }

    /* ---------- 事件与启动 ---------- */

    var segBtns = els.seg.getElementsByTagName('button');
    for (var b = 0; b < segBtns.length; b++) {
        (function (btn) {
            btn.addEventListener('click', function () { setMode(btn.getAttribute('data-mode')); });
        })(segBtns[b]);
    }

    els.pairSel.addEventListener('change', function () { setPairs(parseInt(this.value, 10)); });
    els.btnImport.addEventListener('click', openImport);
    els.btnList.addEventListener('click', showList);
    els.btnRestart.addEventListener('click', restart);

    document.addEventListener('keydown', function (e) {
        if (isTypingTarget(e.target)) { return; }
        if (e.key === ' ' || e.key === 'Enter') {
            restart();
            e.preventDefault();
            return;
        }
        if (e.key === 'p' || e.key === 'P') { peekAll(); }
        if (e.key === '1') { setMode('memory'); }
        if (e.key === '2') { setMode('open'); }
    });

    render();
})();
</script>

</body>
</html>
