/*!
 * et-chrome.css — 工具通用外壳样式（顶栏 / 页脚 / 弹窗 / 按钮 / 主题）
 *
 * 共享样式源。改这里，然后跑：python scripts/sync_shared.py
 * 所有类名带 et- 前缀，避免与工具自身样式冲突。
 * 依赖：无外部资源；颜色全部为令牌变量。
 */

/* ============ 设计令牌 ============ */
:root {
    --et-accent: #2563eb;
    --et-accent-weak: rgba(37, 99, 235, .14);
    --et-bg: #f4f6fb;
    --et-surface: #ffffff;
    --et-surface-2: #f8fafc;
    --et-fg: #0b1220;
    --et-muted: #64748b;
    --et-line: rgba(15, 23, 42, .12);
    --et-line-strong: rgba(15, 23, 42, .22);
    --et-glass: rgba(255, 255, 255, .85);
    --et-shadow-md: 0 10px 28px -18px rgba(15, 23, 42, .3);
    --et-shadow-lg: 0 24px 60px -32px rgba(15, 23, 42, .4);
    --et-ok: #059669;
    --et-warn: #d97706;
    --et-err: #dc2626;
    --et-radius: 12px;
    --et-radius-sm: 9px;
    --et-font: -apple-system, BlinkMacSystemFont, "Segoe UI",
               "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei",
               "Noto Sans SC", sans-serif;
    --et-mono: ui-monospace, "Cascadia Mono", Consolas, Menlo, monospace;
}

html[data-et-theme="dark"] {
    --et-bg: #0b1120;
    --et-surface: #111a2e;
    --et-surface-2: #0f1729;
    --et-fg: #f1f5f9;
    --et-muted: #94a3b8;
    --et-line: rgba(148, 163, 184, .18);
    --et-line-strong: rgba(148, 163, 184, .3);
    --et-glass: rgba(17, 26, 46, .85);
    --et-shadow-md: 0 10px 34px -18px rgba(0, 0, 0, .8);
    --et-shadow-lg: 0 24px 70px -30px rgba(0, 0, 0, .9);
    --et-ok: #34d399;
    --et-warn: #fbbf24;
    --et-err: #f87171;
}

/* ============ 基础 ============ */

/* body 作为外壳时必须清掉浏览器默认 8px 外边距，
   否则 iframe 预览中文档会比视口高 16px（底部白边 + 多余滚动） */
body.et-app {
    margin: 0;
}

.et-app {
    position: relative;
    isolation: isolate;
    display: flex;
    flex-direction: column;
    height: 100vh;
    height: 100dvh;
    overflow: hidden;
    background: var(--et-bg);
    color: var(--et-fg);
    font-family: var(--et-font);
    -webkit-font-smoothing: antialiased;
    transition: background .25s, color .25s;
}

/* 极光背景：径向渐变 + 呼吸动画（edupick 品质基线，老内核也不掉帧） */
.et-app::before {
    content: '';
    position: fixed;
    inset: 0;
    z-index: -1;
    pointer-events: none;
    background:
        radial-gradient(46% 40% at 20% 18%, var(--et-accent-weak), transparent 65%),
        radial-gradient(42% 38% at 82% 24%, var(--et-accent-weak), transparent 70%),
        radial-gradient(50% 44% at 55% 95%, rgba(16, 185, 129, .10), transparent 65%);
    animation: et-aurora 16s ease-in-out infinite alternate;
}

@keyframes et-aurora {
    from { opacity: .55; transform: scale(1); }
    to { opacity: 1; transform: scale(1.06); }
}

.et-app *,
.et-app *::before,
.et-app *::after { box-sizing: border-box; }

[hidden] { display: none !important; }

.et-icon {
    width: 18px;
    height: 18px;
    fill: none;
    stroke: currentColor;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
    flex: none;
}

/* ============ 顶栏 ============ */
.et-topbar {
    flex: none;
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 11px 20px;
    border-bottom: 1px solid var(--et-line);
    background: var(--et-glass);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    z-index: 20;
}

.et-brand {
    display: flex;
    align-items: center;
    gap: 10px;
    min-width: 0;
}

.et-brand__dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: var(--et-accent);
    box-shadow: 0 0 0 4px var(--et-accent-weak);
    flex: none;
}

.et-brand__name {
    font-weight: 800;
    font-size: 15px;
    letter-spacing: -.01em;
    white-space: nowrap;
}

.et-brand__sub {
    font-size: 12.5px;
    color: var(--et-muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.et-status {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 5px 14px;
    border-radius: 999px;
    font-size: 12.5px;
    color: var(--et-muted);
    background: var(--et-surface-2);
    border: 1px solid var(--et-line);
    white-space: nowrap;
    max-width: 42vw;
    overflow: hidden;
    text-overflow: ellipsis;
}

.et-status__dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--et-ok);
    flex: none;
    transition: background .2s;
}

.et-status[data-tone="err"] .et-status__dot { background: var(--et-err); }
.et-status[data-tone="warn"] .et-status__dot { background: var(--et-warn); }

.et-actions {
    display: flex;
    align-items: center;
    gap: 7px;
}

.et-icon-btn {
    display: inline-grid;
    place-items: center;
    width: 38px;
    height: 38px;
    font-size: 16px;
    line-height: 1;
    border-radius: 11px;
    border: 1px solid var(--et-line);
    background: var(--et-surface-2);
    color: var(--et-fg);
    cursor: pointer;
    transition: transform .14s, border-color .14s, color .14s, opacity .14s;
    -webkit-tap-highlight-color: transparent;
}

.et-icon-btn:hover {
    border-color: var(--et-accent);
    color: var(--et-accent);
    transform: translateY(-1px);
}

.et-icon-btn:active { transform: translateY(0); }
.et-icon-btn.is-off { opacity: .4; }
.et-icon-btn:focus-visible { outline: 2px solid var(--et-accent); outline-offset: 2px; }

/* ============ 主区默认 ============ */
.et-main {
    flex: 1;
    min-height: 0;
    position: relative;
    overflow: auto;
}

/* ============ 页脚（品牌回流 L2） ============ */
.et-footer {
    flex: none;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 7px 16px;
    font-size: 12px;
    color: var(--et-muted);
    border-top: 1px solid var(--et-line);
    background: var(--et-glass);
    user-select: none;
    z-index: 20;
}

.et-footer a {
    color: inherit;
    text-decoration: none;
    transition: color .14s;
}

.et-footer a:hover { color: var(--et-accent); }

/* ============ 按钮 ============ */
.et-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
    padding: 9px 16px;
    border-radius: 11px;
    font: inherit;
    font-size: 13.5px;
    font-weight: 700;
    border: 1px solid var(--et-line);
    background: var(--et-surface-2);
    color: var(--et-fg);
    cursor: pointer;
    transition: transform .14s, border-color .14s, color .14s, background .14s, box-shadow .14s;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
}

.et-btn:hover {
    border-color: var(--et-accent);
    color: var(--et-accent);
    transform: translateY(-1px);
}

.et-btn:active { transform: translateY(0); }
.et-btn:focus-visible { outline: 2px solid var(--et-accent); outline-offset: 2px; }
.et-btn:disabled { opacity: .45; cursor: not-allowed; transform: none; }

.et-btn--primary {
    background: var(--et-accent);
    border-color: var(--et-accent);
    color: #fff;
    box-shadow: 0 6px 18px -8px var(--et-accent);
}

.et-btn--primary:hover { color: #fff; filter: brightness(1.08); }
.et-btn--primary:disabled { filter: none; }

.et-btn--danger:hover {
    border-color: var(--et-err);
    color: var(--et-err);
}

.et-btn--lg {
    padding: 13px 26px;
    font-size: 16px;
    border-radius: 14px;
}

/* ============ 弹窗 ============ */
.et-modal {
    position: fixed;
    inset: 0;
    z-index: 100;
    display: grid;
    place-items: center;
    padding: 24px;
    background: rgba(2, 6, 23, .55);
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    animation: et-fade .18s ease;
}

.et-modal__panel {
    width: min(680px, 94vw);
    max-height: 86vh;
    max-height: 86dvh;
    display: flex;
    flex-direction: column;
    background: var(--et-surface);
    border: 1px solid var(--et-line);
    border-radius: 16px;
    box-shadow: var(--et-shadow-lg);
    animation: et-pop .2s cubic-bezier(.34, 1.4, .64, 1);
    overflow: hidden;
}

.et-modal__panel--narrow { width: min(460px, 92vw); }
.et-modal__panel--wide { width: min(900px, 94vw); }

.et-modal__head {
    flex: none;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 16px 20px;
    border-bottom: 1px solid var(--et-line);
    font-weight: 800;
    font-size: 15px;
}

.et-modal__head .et-icon-btn {
    margin-left: auto;
    width: 32px;
    height: 32px;
}

.et-modal__body {
    flex: 1;
    min-height: 0;
    overflow: auto;
    padding: 18px 20px;
}

.et-modal__foot {
    flex: none;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 14px 20px;
    border-top: 1px solid var(--et-line);
    background: var(--et-surface-2);
}

.et-modal__foot .spacer { flex: 1; }

@keyframes et-fade {
    from { opacity: 0; }
}

@keyframes et-pop {
    from { opacity: 0; transform: translateY(14px) scale(.97); }
}

/* ============ 轻提示（toast） ============ */
.et-toast {
    position: fixed;
    left: 50%;
    bottom: 56px;
    transform: translateX(-50%) translateY(10px);
    z-index: 120;
    display: flex;
    align-items: center;
    gap: 9px;
    max-width: min(520px, 88vw);
    padding: 11px 18px;
    border-radius: 12px;
    font-size: 13.5px;
    font-weight: 600;
    color: #fff;
    background: rgba(15, 23, 42, .92);
    border: 1px solid rgba(148, 163, 184, .25);
    box-shadow: var(--et-shadow-lg);
    opacity: 0;
    pointer-events: none;
    transition: opacity .22s, transform .22s;
}

.et-toast.is-show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
}

.et-toast[data-tone="ok"] { background: rgba(5, 150, 105, .95); }
.et-toast[data-tone="err"] { background: rgba(220, 38, 38, .95); }
.et-toast[data-tone="warn"] { background: rgba(217, 119, 6, .95); }

/* ============ 设置抽屉（右上角入口，edupick 交互） ============ */
.et-drawer-backdrop {
    position: fixed;
    inset: 0;
    z-index: 90;
    background: rgba(2, 6, 23, .45);
    backdrop-filter: blur(3px);
    -webkit-backdrop-filter: blur(3px);
    opacity: 0;
    transition: opacity .2s;
}

.et-drawer-backdrop.is-open { opacity: 1; }

.et-drawer {
    position: absolute;
    top: 0;
    right: 0;
    height: 100%;
    width: min(400px, 92vw);
    display: flex;
    flex-direction: column;
    background: var(--et-surface);
    border-left: 1px solid var(--et-line);
    box-shadow: var(--et-shadow-lg);
    transform: translateX(100%);
    transition: transform .22s cubic-bezier(.32, .72, .35, 1);
}

.et-drawer-backdrop.is-open .et-drawer { transform: translateX(0); }

.et-drawer__head {
    flex: none;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 15px 18px;
    border-bottom: 1px solid var(--et-line);
    font-weight: 800;
    font-size: 15px;
    color: var(--et-accent);
}

.et-drawer__head .et-icon-btn {
    margin-left: auto;
    width: 32px;
    height: 32px;
}

.et-drawer__body {
    flex: 1;
    min-height: 0;
    overflow: auto;
    padding: 16px 18px 24px;
}

/* 抽屉内容通用小节（工具复用） */
.et-drawer__body h4 {
    margin: 18px 0 8px;
    font-size: 12px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: .08em;
    color: var(--et-muted);
}

.et-drawer__body h4:first-child { margin-top: 0; }

.et-drawer__row {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
}

.et-drawer__tip {
    margin: 8px 0 0;
    font-size: 12px;
    line-height: 1.8;
    color: var(--et-muted);
}

.et-drawer__tip b { color: var(--et-fg); }

.et-drawer__input {
    flex: 1;
    min-width: 0;
    padding: 9px 12px;
    border: 1px solid var(--et-line-strong);
    border-radius: 9px;
    background: var(--et-surface-2);
    color: var(--et-fg);
    font: inherit;
    font-size: 13.5px;
    transition: border-color .14s, box-shadow .14s;
}

.et-drawer__input:focus {
    outline: none;
    border-color: var(--et-accent);
    box-shadow: 0 0 0 3px var(--et-accent-weak);
}

.et-drawer__switch {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 10px 0;
    border-bottom: 1px dashed var(--et-line);
    font-size: 13.5px;
    font-weight: 600;
    color: var(--et-fg);
    cursor: pointer;
    user-select: none;
}

.et-drawer__switch input {
    width: 17px;
    height: 17px;
    accent-color: var(--et-accent);
    cursor: pointer;
}
</style>

    }

    var MASTER_GAIN = 0.5; /* 整体音量层（教室设备音量 100% 也要听得清） */

    function tone(ctx, freq, start, dur, gainPeak, type) {
        var osc = ctx.createOscillator();
        var gain = ctx.createGain();
        osc.type = type || 'triangle';
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(0, start);
        gain.gain.linearRampToValueAtTime(gainPeak, start + 0.012);
        gain.gain.exponentialRampToValueAtTime(0.0001, start + dur);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(start);
        osc.stop(start + dur + 0.05);
    }

    var BEEPS = {
        tick: [[880, 0, 0.06, 0.42]],
        ok: [[660, 0, 0.1, 0.46], [880, 0.1, 0.14, 0.46]],
        win: [[523.25, 0, 0.16, 0.5], [659.25, 0.12, 0.16, 0.5], [783.99, 0.24, 0.16, 0.5], [1046.5, 0.36, 0.34, 0.52]],
        err: [[220, 0, 0.22, 0.46, 'square']],
        over: [[880, 0, 0.18, 0.5], [659.25, 0.2, 0.18, 0.5], [523.25, 0.4, 0.36, 0.5]]
    };

    function playBeep(kind) {
        var ctx = ensureCtx();
        if (!ctx || !BEEPS[kind]) { return; }
        var seq = BEEPS[kind];
        var t0 = ctx.currentTime + 0.01;
        for (var i = 0; i < seq.length; i++) {
            tone(ctx, seq[i][0], t0 + seq[i][1], seq[i][2], seq[i][3] * MASTER_GAIN, seq[i][4]);

    /* ---------- 设置抽屉 ---------- */

    function openDrawer(title, build) {
        var backdrop = el('div', 'et-drawer-backdrop');
        var drawer = el('aside', 'et-drawer');
        drawer.setAttribute('role', 'dialog');
        drawer.setAttribute('aria-label', title);

        var head = el('div', 'et-drawer__head');
        head.appendChild(makeIcon('i-sliders'));
        head.appendChild(el('span', 'et-drawer__title', title));
        head.appendChild(makeBtn('i-x', '关闭', close));
        drawer.appendChild(head);

        var body = el('div', 'et-drawer__body');
        drawer.appendChild(body);

        backdrop.appendChild(drawer);
        document.body.appendChild(backdrop);
        requestAnimationFrame(function () { backdrop.classList.add('is-open'); });

        function close() {
            backdrop.classList.remove('is-open');
            document.removeEventListener('keydown', onKey);
            setTimeout(function () {
                if (backdrop.parentNode) { backdrop.parentNode.removeChild(backdrop); }
            }, 220);
        }
        function onKey(ev) {
            if (ev.key === 'Escape') { ev.stopPropagation(); close(); }
        }
        document.addEventListener('keydown', onKey);
        backdrop.addEventListener('mousedown', function (ev) {
            if (ev.target === backdrop) { close(); }
        });

        if (typeof build === 'function') {
            /* 兼容两种约定：build 自己往 body 里塞内容，或 return 一个元素节点 */
            var ret = build(body, { close: close });
            if (ret && ret.nodeType === 1 && ret.parentNode !== body) {
                body.appendChild(ret);
            }

        return { body: body, close: close };

    /* ---------- 通用弹窗 / toast（同时挂模块级，供其他共享组件使用） ---------- */

    function modal(mo) {
        var backdrop = el('div', 'et-modal');
        var panel = el('div', 'et-modal__panel' + (mo.size === 'narrow' ? ' et-modal__panel--narrow'
            : mo.size === 'wide' ? ' et-modal__panel--wide' : ''));
        var head = el('div', 'et-modal__head');
        if (mo.icon) { head.appendChild(makeIcon(mo.icon)); }
        head.appendChild(el('span', null, mo.title || ''));
        head.appendChild(makeBtn('i-x', '关闭', close));
        panel.appendChild(head);

        var body = el('div', 'et-modal__body');
        if (typeof mo.body === 'string') { body.innerHTML = mo.body; }
        else if (mo.body) { body.appendChild(mo.body); }
        panel.appendChild(body);

        var foot = null;
        if (mo.buttons && mo.buttons.length) {
            foot = el('div', 'et-modal__foot');
            foot.appendChild(el('span', 'spacer'));
            mo.buttons.forEach(function (b) {
                var btn = el('button', 'et-btn' + (b.primary ? ' et-btn--primary' : '') + (b.danger ? ' et-btn--danger' : ''), b.label);
                btn.type = 'button';
                btn.addEventListener('click', function () {
                    if (b.onClick) { b.onClick(close); } else { close(); }
                });
                foot.appendChild(btn);
            });
            panel.appendChild(foot);
        }

        backdrop.appendChild(panel);
        document.body.appendChild(backdrop);

        function close() {
            if (backdrop.parentNode) { backdrop.parentNode.removeChild(backdrop); }
            document.removeEventListener('keydown', onKey);
            if (mo.onClose) { mo.onClose(); }
        }
        function onKey(ev) {
            if (ev.key === 'Escape') { ev.stopPropagation(); close(); }
        }
        document.addEventListener('keydown', onKey);
        backdrop.addEventListener('mousedown', function (ev) {

    /* ---------- PWA 元数据（blob manifest，环境不支持时静默跳过） ---------- */

    function installPwa(toolId, title, accent) {
        try {

            var iconUri = 'data:image/svg+xml,' + encodeURIComponent(svg);

                theme_color: accent || '#2563eb',
                icons: [{ src: iconUri, sizes: 'any', type: 'image/svg+xml', purpose: 'any' }]
            };
            var blob = new Blob([JSON.stringify(mf)], { type: 'application/manifest+json' });
            var link = document.createElement('link');
            link.rel = 'manifest';

        function applyTheme(t) {

            if (themeBtn) {

        var topbar = document.getElementById('et-topbar');

        if (!main) { main = el('main'); main.id = 'et-main'; topbar.after(main); }

        main.classList.add('et-main');
        footer.className = 'et-footer';

        /* 品牌 */
        var brand = el('div', 'et-brand');
        brand.appendChild(el('span', 'et-brand__dot'));
        var nameWrap = el('div');

        brand.appendChild(nameWrap);

        /* 状态胶囊 */

        /* 动作区（edupick 交互：右上角聚合设置入口） */
        var actions = el('div', 'et-actions');

            soundBtn.appendChild(makeIcon(soundEnabled ? 'i-volume' : 'i-volume-off'));
            soundBtn.title = soundEnabled ? '关闭音效' : '开启音效';
            soundBtn.classList.toggle('is-off', !soundEnabled);
            if (soundEnabled) { api.beep('ok'); }
        }

        api.openSettings = function () {
            if (settingsBtn) { settingsBtn.click(); }

            var root = document.documentElement;
            var fsEl = document.fullscreenElement || document.webkitFullscreenElement || null;

            } else {

            }

        function syncFsIcon(on) {

            fsBtn.appendChild(makeIcon(on ? 'i-minimize' : 'i-maximize'));

        }

        document.addEventListener('fullscreenchange', function () {
            syncFsIcon(!!(document.fullscreenElement || document.webkitFullscreenElement));
        });
        document.addEventListener('webkitfullscreenchange', function () {
            syncFsIcon(!!(document.fullscreenElement || document.webkitFullscreenElement));
        });
        syncFsIcon(false);

        api.toggleFullscreen = toggleFullscreen;

        /* ---------- 音效 API ---------- */
        api.beep = function (kind) {
            if (!soundEnabled) { return; }
            playBeep(kind);
        };
        api.soundOn = function () { return soundEnabled; };

        api.modal = modal;

        /* ---------- 帮助 ---------- */
        function openHelp() {
            modal({
                title: '使用说明',
                icon: 'i-help',

        api.openHelp = openHelp;

        /* ---------- toast ---------- */

            ? global.ET_SITE_ORIGIN

        function renderFooter() {

            footer.appendChild(el('span', null, 'KeeTools 课工具'));
            footer.appendChild(el('span', null, '·'));
            if (siteOrigin) {
                var a = el('a', null, '更多课堂工具');
                a.href = siteOrigin + '/?from=tool-footer&tool=' + encodeURIComponent(toolId);
                a.target = '_blank';
                a.rel = 'noopener';
                footer.appendChild(a);
            } else {
                footer.appendChild(el('span', null, '更多课堂工具'));
            }

        renderFooter();

        /* 站点来源发现：iframe 内向父窗口询问；也可由宿主直接注入 ET_SITE_ORIGIN */
        try {
            if (global.parent && global.parent !== global) {
                global.parent.postMessage(JSON.stringify({ type: 'et-hello', toolId: toolId }), '*');
            }
        } catch (err) { /* 跨域异常忽略 */ }

        global.addEventListener('message', function (ev) {

<script>
  /* 此块由 scripts/sync_shared.py 自动注入，请勿手工修改 */
/*!
 * et-stats.js — 使用统计模块（模块化，可整体移除）
 *
 * 共享逻辑源。改这里，然后跑：python scripts/sync_shared.py
 * 依赖：无（可脱离 et-util / et-chrome 独立运行）。
 * 全局：ET.Stats
 *
 * ┌────────────────────────────────────────────────────────────────┐
 * │ 说明：本模块只做一件事——工具被打开时向上报端点发一条匿名计数。 │
 * │ · 在线（iframe 内）：宿主页面已服务端计数，本模块不重复上报。   │
 * │ · 离线打开（file:// / 下载单文件 / 离线包）：联网条件具备时，   │
 * │   以 sendBeacon 上报 use_offline 事件（text/plain 免预检）。    │
 * │ · 上报端点 = window.ET_SITE_ORIGIN（由宿主注入或离线包配置）。  │
 * │   未配置端点时本模块完全静默，不发任何请求。                    │
 * │ · **整个 <script> 块可安全删除**：删除后工具其余功能完全正常，  │
 * │   且完全不再发起任何网络请求。                                  │
 * └────────────────────────────────────────────────────────────────┘
 */
(function (global) {
    'use strict';

    var ET = global.ET = global.ET || {};

    var Stats = {
        /** 上报端点来源（站点绝对地址，无协议尾斜杠） */
        endpoint: (typeof global.ET_SITE_ORIGIN === 'string' && /^https?:\/\//.test(global.ET_SITE_ORIGIN))
            ? global.ET_SITE_ORIGIN
            : null,

        _done: {},

        /**
         * 上报一次事件（同一事件同一工具每次页面加载只报一次）。
         * event: 'use_offline' 等；toolId: 工具 id。
         */
        send: function (event, toolId) {
            if (!event || this._done[event + ':' + (toolId || '')]) { return false; }
            if (!this.endpoint) { return false; }
            /* iframe 内由宿主统计，避免双计 */
            try {
                if (global.parent && global.parent !== global) { return false; }
            } catch (err) { return false; }
            /* 断网时挂起，网络恢复自动补报一次 */
            if (global.navigator && global.navigator.onLine === false) {
                var self = this;
                global.addEventListener('online', function () { self.send(event, toolId); }, { once: true });
                return false;
            }

            this._done[event + ':' + (toolId || '')] = true;
            var payload = JSON.stringify({ event: event, tool: toolId || '' });

            try {
                if (global.navigator.sendBeacon) {
                    return global.navigator.sendBeacon(
                        this.endpoint + '/api/track',
                        new Blob([payload], { type: 'text/plain;charset=UTF-8' })
                    );
                }
                global.fetch(this.endpoint + '/api/track', {
                    method: 'POST',
                    body: payload,
                    keepalive: true,
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'text/plain;charset=UTF-8' }
                });
                return true;
            } catch (err) {
                return false;
            }
        }
    };

    ET.Stats = Stats;
})(window);
</script>

            '<p style="margin:0 0 8px"><b>候选数</b>：点「候选」进入铅笔模式，' +
            '此时点数字是记小字候选（再点一次取消），不填正式答案。</p>' +
            '<p style="margin:0 0 8px"><b>三种规格</b>：4×4（低年级，2×2 宫）/ 6×6（2×3 宫）' +
            '/ 9×9（标准，3×3 宫）；难度只影响挖空数量，越难空格越多。</p>' +
            '<p style="margin:0 0 8px"><b>课堂用法</b>：投影后点「新题目」换题，「提示」补一格，' +
            '「检查」标出冲突格；「打印」把当前题目印成 A4 练习纸（屏上什么样，纸上就什么样）。</p>' +
            '<p style="margin:0"><b>快捷键</b>：<b>N</b> 新题目、<b>H</b> 提示、<b>P</b> 打印、' +
            '<b>空格</b> 暂停 / 继续；翻页笔下页键 = 新题目、上页键 = 提示。进度保存在本机浏览器。</p></div>'
    });

    var els = {
        sizeSeg: document.getElementById('sizeSeg'),
        diffSel: document.getElementById('diffSel'),
        clock: document.getElementById('clock'),
        stat: document.getElementById('stat'),
        preview: document.getElementById('preview'),
        pad: document.getElementById('pad'),
        btnPause: document.getElementById('btnPause'),
        btnNew: document.getElementById('btnNew'),
        btnHint: document.getElementById('btnHint'),
        btnCheck: document.getElementById('btnCheck'),
        btnSolve: document.getElementById('btnSolve'),
        btnPrint: document.getElementById('btnPrint')
    };

    var state = loadState();
    var game = loadGame();
    var sel = -1;
    var noteMode = false;
    var badSet = {};
    var tickTimer = 0;

    /* ---------- 基础工具 ---------- */

    function clampInt(v, min, max, fallback) {
        var n = parseInt(v, 10);
        if (isNaN(n)) { return fallback; }
        return Math.max(min, Math.min(max, n));
    }

    function loadState() {
        var s = {};
        for (var k in DEFAULTS) {
            if (Object.prototype.hasOwnProperty.call(DEFAULTS, k)) {
                s[k] = store.get(k, DEFAULTS[k]);
            }
        }
        s.size = SIZES.indexOf(parseInt(s.size, 10)) >= 0 ? parseInt(s.size, 10) : DEFAULTS.size;
        if (!DIFF_LABEL[s.diff]) { s.diff = DEFAULTS.diff; }
        s.title = typeof s.title === 'string' ? s.title : DEFAULTS.title;
        return s;
    }

    function loadGame() {
        var g = store.get('game', null);
        if (g && g.size === state.size && Array.isArray(g.puzzle) &&
            g.puzzle.length === state.size * state.size &&
            Array.isArray(g.solution) && g.solution.length === state.size * state.size) {
            return {
                size: g.size,
                diff: DIFF_LABEL[g.diff] ? g.diff : state.diff,
                puzzle: g.puzzle.slice(),
                solution: g.solution.slice(),
                values: Array.isArray(g.values) ? g.values.slice() : g.puzzle.slice(),
                notes: (g.notes && typeof g.notes === 'object') ? g.notes : {},
                secs: clampInt(g.secs, 0, 359999, 0),
                running: g.running !== false,
                done: g.done === true
            };
        }
        return makeGame(state.size, state.diff);
    }

    function persist() {
        for (var k in DEFAULTS) {
            if (Object.prototype.hasOwnProperty.call(DEFAULTS, k)) {
                store.set(k, state[k]);
            }
        }
        store.set('game', game);
    }

    function isTypingTarget(node) {
        if (!node || !node.tagName) { return false; }
        var tag = node.tagName.toUpperCase();
        return tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT' || node.isContentEditable === true;
    }

    function text(tag, cls, value) {
        var node = document.createElement(tag);
        if (cls) { node.className = cls; }
        if (value !== undefined && value !== null) { node.textContent = value; }
        return node;
    }

    function pad2(n) { return (n < 10 ? '0' : '') + n; }

    function fmtTime(secs) {
        var h = Math.floor(secs / 3600);
        var m = Math.floor((secs % 3600) / 60);
        var s = secs % 60;
        return (h ? h + ':' + pad2(m) : pad2(m)) + ':' + pad2(s);
    }

    /* ---------- 出题 / 解题（算法生成 + 唯一解校验） ---------- */

    function boxOf(idx, n, bc) {
        var r = Math.floor(idx / n), c = idx % n;
        return Math.floor(r / BOX[n][0]) * Math.ceil(n / bc) + Math.floor(c / bc);
    }

    function unitIndexes(n, br, bc) {
        var units = [];
        var r, c, k, list;
        for (r = 0; r < n; r++) {
            list = [];
            for (c = 0; c < n; c++) { list.push(r * n + c); }
            units.push(list);
        }
        for (c = 0; c < n; c++) {
            list = [];
            for (r = 0; r < n; r++) { list.push(r * n + c); }
            units.push(list);
        }
        var boxesPerRow = n / bc;
        for (var b = 0; b < n; b++) {
            list = [];
            var b0 = Math.floor(b / boxesPerRow) * br;
            var b1 = (b % boxesPerRow) * bc;
            for (r = b0; r < b0 + br; r++) {
                for (c = b1; c < b1 + bc; c++) { list.push(r * n + c); }
            }
            units.push(list);
        }
        return units;
    }

    /** 同行 / 同列 / 同宫内是否已有数字 d（只看这三条，比遍历 27 个单元快得多） */
    function validAt(grid, n, idx, d) {
        var r = Math.floor(idx / n), c = idx % n;
        var br = BOX[n][0], bc = BOX[n][1];
        var i, rr, cc;
        for (i = 0; i < n; i++) {
            if (i !== c && grid[r * n + i] === d) { return false; }
        }
        for (i = 0; i < n; i++) {
            if (i !== r && grid[i * n + c] === d) { return false; }
        }
        var r0 = Math.floor(r / br) * br;
        var c0 = Math.floor(c / bc) * bc;
        for (rr = r0; rr < r0 + br; rr++) {
            for (cc = c0; cc < c0 + bc; cc++) {
                if ((rr !== r || cc !== c) && grid[rr * n + cc] === d) { return false; }
            }
        }
        return true;
    }

    function shuffledDigits(n) {
        var out = [];
        for (var i = 1; i <= n; i++) { out.push(i); }
        for (var j = out.length - 1; j > 0; j--) {
            var k = Math.floor(Math.random() * (j + 1));
            var t = out[j]; out[j] = out[k]; out[k] = t;
        }
        return out;
    }

    function fill(grid, n) {
        var idx = -1;
        for (var i = 0; i < grid.length; i++) {
            if (!grid[i]) { idx = i; break; }
        }
        if (idx < 0) { return true; }
        var digits = shuffledDigits(n);
        for (var d = 0; d < digits.length; d++) {
            if (validAt(grid, n, idx, digits[d])) {
                grid[idx] = digits[d];
                if (fill(grid, n)) { return true; }
                grid[idx] = 0;
            }
        }
        return false;
    }

    /** 解的数量（最多数到 limit 个就停，用于唯一解校验） */
    function countSolutions(grid, n, limit) {
        var g = grid.slice();
        var count = 0;
        function rec() {
            if (count >= limit) { return; }
            var idx = -1;
            for (var i = 0; i < g.length; i++) {
                if (!g[i]) { idx = i; break; }
            }
            if (idx < 0) { count++; return; }
            for (var d = 1; d <= n; d++) {
                if (validAt(g, n, idx, d)) {
                    g[idx] = d;
                    rec();
                    g[idx] = 0;
                    if (count >= limit) { return; }
                }
            }
        }
        rec();
        return count;
    }

    function makeGame(size, diff) {
        var n = size;
        var units = unitIndexes(n);
        var solution = new Array(n * n).fill(0);
        fill(solution, n);

        var puzzle = solution.slice();
        var order = [];
        for (var i = 0; i < n * n; i++) { order.push(i); }
        for (var j = order.length - 1; j > 0; j--) {
            var k = Math.floor(Math.random() * (j + 1));
            var t = order[j]; order[j] = order[k]; order[k] = t;
        }

        var target = REMOVALS[size][diff];
        var removed = 0;
        for (var o = 0; o < order.length && removed < target; o++) {
            var idx = order[o];
            var saved = puzzle[idx];
            if (!saved) { continue; }
            puzzle[idx] = 0;
            if (countSolutions(puzzle, n, 2) === 1) {
                removed++;
            } else {
                puzzle[idx] = saved;
            }
        }

        return {
            size: size,
            diff: diff,
            puzzle: puzzle,
            solution: solution,
            values: puzzle.slice(),
            notes: {},
            secs: 0,
            running: false,   /* 计时从第一次填数开始 */
            done: false
        };
    }

    /* ---------- 冲突检测 ---------- */

    function conflictsOf(values, n) {
        var bad = {};
        var units = unitIndexes(n);
        for (var u = 0; u < units.length; u++) {
            var list = units[u];
            var seen = {};
            var dup = {};
            for (var i = 0; i < list.length; i++) {
                var v = values[list[i]];
                if (!v) { continue; }
                if (seen[v]) { dup[v] = true; } else { seen[v] = true; }
            }
            for (var j = 0; j < list.length; j++) {
                var vv = values[list[j]];
                if (vv && dup[vv]) { bad[list[j]] = true; }
            }
        }
        return bad;
    }

    function emptyCount() {
        var c = 0;
        for (var i = 0; i < game.values.length; i++) {
            if (!game.values[i]) { c++; }
        }
        return c;
    }

    /* ---------- 渲染 ---------- */

    function render() {
        els.preview.innerHTML = '';
        els.preview.appendChild(buildPage());
        updateStat();
        syncSeg();
        els.diffSel.value = game.diff;
        renderPad();
    }

    function buildPage() {
        var n = game.size;
        var page = text('section', 'sd-page');

        page.appendChild(text('div', 'sd-title', state.title || '数 独'));

        var sub = n + ' × ' + n + ' · 难度：' + DIFF_LABEL[game.diff];
        if (game.running && game.secs > 0) { sub += ' · 用时 ' + fmtTime(game.secs); }
        if (state.showMeta) { sub += '　｜　姓名：____________　班级：__________'; }
        page.appendChild(text('div', 'sd-sub', sub));

        var grid = text('div', 'sd-grid');
        grid.style.setProperty('--sd-n', String(n));
        grid.style.setProperty('--sd-w', (CELL_MM[n] * n) + 'mm');
        grid.style.setProperty('--sd-cell', CELL_MM[n] + 'mm');
        grid.style.setProperty('--sd-fs', FONT_MM[n] + 'mm');

        var br = BOX[n][0], bc = BOX[n][1];
        var selRow = sel >= 0 ? Math.floor(sel / n) : -1;
        var selCol = sel >= 0 ? sel % n : -1;
        var selBox = sel >= 0 ? boxOf(sel, n, bc) : -1;
        var selVal = sel >= 0 ? game.values[sel] : 0;

        for (var i = 0; i < n * n; i++) {
            var r = Math.floor(i / n), c = i % n;
            var cls = 'sd-cell';
            if ((c + 1) % bc === 0 && c !== n - 1) { cls += ' bx-r'; }
            if ((r + 1) % br === 0 && r !== n - 1) { cls += ' bx-b'; }

            var val = game.values[i];
            if (game.puzzle[i]) { cls += ' is-given'; }
            else if (val) { cls += ' is-user'; }
            if (badSet[i]) { cls += ' is-wrong'; }

            if (sel >= 0 && i !== sel) {
                var sameUnit = (r === selRow || c === selCol || boxOf(i, n, bc) === selBox);
                if (sameUnit) { cls += ' is-peer'; }
                if (selVal && val === selVal) { cls += ' is-same'; }
            }
            if (i === sel) { cls += ' is-sel'; }

            var cell = text('div', cls);
            cell.setAttribute('data-i', String(i));

            if (val) {
                cell.appendChild(text('span', null, String(val)));
            } else {
                var notes = game.notes[i];
                if (notes && notes.length) {
                    var box = text('div', 'sd-notes');
                    for (var d = 1; d <= n; d++) {
                        box.appendChild(text('span', null, notes.indexOf(d) >= 0 ? String(d) : ''));
                    }
                    cell.appendChild(box);
                }
            }
            grid.appendChild(cell);
        }
        page.appendChild(grid);

        var foot = text('div', 'sd-foot');
        foot.appendChild(text('span', null, '每行、每列、每宫的数字都不能重复'));
        var filled = n * n - emptyCount();
        foot.appendChild(text('span', null, '已填 ' + filled + ' / ' + (n * n)));
        page.appendChild(foot);

        return page;
    }

    function renderPad() {
        var n = game.size;
        els.pad.innerHTML = '';
        var frag = document.createDocumentFragment();

        var noteBtn = text('button', 'sd-key sd-key--wide' + (noteMode ? ' is-note' : ''), '候选');
        noteBtn.type = 'button';
        noteBtn.addEventListener('click', function () {
            noteMode = !noteMode;
            renderPad();
        });
        frag.appendChild(noteBtn);

        for (var d = 1; d <= 9; d++) {
            (function (digit) {
                var btn = text('button', 'sd-key' + (digit > n ? ' is-off' : ''), String(digit));
                btn.type = 'button';
                btn.addEventListener('click', function () {
                    if (digit > n) { return; }
                    inputDigit(digit);
                });
                frag.appendChild(btn);
            })(d);
        }

        var clearBtn = text('button', 'sd-key sd-key--wide', '清除');
        clearBtn.type = 'button';
        clearBtn.addEventListener('click', function () { clearCell(); });
        frag.appendChild(clearBtn);

        els.pad.appendChild(frag);
    }

    function updateStat() {
        var n = game.size;
        var filled = n * n - emptyCount();
        els.stat.textContent = '已填 ' + filled + ' / ' + (n * n);
        els.clock.textContent = fmtTime(game.secs);
        els.btnPause.querySelector('span').textContent =
            (game.running || game.secs === 0) ? '暂停' : '继续';
        chrome.setStatus(n + '×' + n + ' · ' + DIFF_LABEL[game.diff] +
            (game.running || game.secs === 0 ? '' : ' · 已暂停'), 'ok');
    }

    function syncSeg() {
        var btns = els.sizeSeg.getElementsByTagName('button');
        for (var i = 0; i < btns.length; i++) {
            btns[i].className = parseInt(btns[i].getAttribute('data-size'), 10) === game.size ? 'is-on' : '';
        }
    }

    function refreshCell() {
        /* 只刷新受影响格子的样式与内容（避免整页重排） */
        var n = game.size;
        var br = BOX[n][0], bc = BOX[n][1];
        var selRow = sel >= 0 ? Math.floor(sel / n) : -1;
        var selCol = sel >= 0 ? sel % n : -1;
        var selBox = sel >= 0 ? boxOf(sel, n, bc) : -1;
        var selVal = sel >= 0 ? game.values[sel] : 0;
        var cells = els.preview.querySelectorAll('.sd-cell');
        if (!cells.length) { render(); return; }
        for (var i = 0; i < cells.length; i++) {
            var idx = parseInt(cells[i].getAttribute('data-i'), 10);
            var r = Math.floor(idx / n), c = idx % n;
            var cls = 'sd-cell';
            if ((c + 1) % bc === 0 && c !== n - 1) { cls += ' bx-r'; }
            if ((r + 1) % br === 0 && r !== n - 1) { cls += ' bx-b'; }
            var val = game.values[idx];
            if (game.puzzle[idx]) { cls += ' is-given'; }
            else if (val) { cls += ' is-user'; }
            if (badSet[idx]) { cls += ' is-wrong'; }
            if (sel >= 0 && idx !== sel) {
                if (r === selRow || c === selCol || boxOf(idx, n, bc) === selBox) { cls += ' is-peer'; }
                if (selVal && val === selVal) { cls += ' is-same'; }
            }
            if (idx === sel) { cls += ' is-sel'; }
            cells[i].className = cls;

            cells[i].textContent = '';
            if (val) {
                cells[i].appendChild(text('span', null, String(val)));
            } else {
                var notes = game.notes[idx];
                if (notes && notes.length) {
                    var box = text('div', 'sd-notes');
                    for (var d = 1; d <= n; d++) {
                        box.appendChild(text('span', null, notes.indexOf(d) >= 0 ? String(d) : ''));
                    }
                    cells[i].appendChild(box);
                }
            }
        }
        updateStat();
    }

    /* ---------- 交互 ---------- */

    function startTimer() {
        if (tickTimer){ return; }
        tickTimer = window.setInterval(function () {
            if (!game.running || game.done) { return; }
            game.secs++;
            els.clock.textContent = fmtTime(game.secs);
            if (game.secs % 10 === 0) { persist(); }
        }, 1000);
    }

    function select(idx) {
        sel = idx;
        refreshCell();
    }

    function inputDigit(d) {
        if (sel < 0) { chrome.toast('先点一个格子'); return; }
        if (game.puzzle[sel]) { chrome.toast('这是题目给出的数字，不能改'); return; }
        if (game.done) { chrome.toast('本题已完成，点「新题目」换一题'); return; }

        if (noteMode) {
            var notes = game.notes[sel] || [];
            var at = notes.indexOf(d);
            if (at >= 0) { notes.splice(at, 1); } else { notes.push(d); }
            notes.sort(function (a, b) { return a - b; });
            if (notes.length) { game.notes[sel] = notes; } else { delete game.notes[sel]; }
        } else {
            game.values[sel] = game.values[sel] === d ? 0 : d;
            delete game.notes[sel];
            badSet = conflictsOf(game.values, game.size);
        }
        if (!game.running) { game.running = true; }
        game.done = false;
        startTimer();
        persist();
        refreshCell();
    }

    function clearCell() {
        if (sel < 0) { return; }
        if (game.puzzle[sel]) { chrome.toast('题目给出的数字不能清除'); return; }
        game.values[sel] = 0;
        delete game.notes[sel];
        badSet = conflictsOf(game.values, game.size);
        game.done = false;
        persist();
        refreshCell();
    }

    function moveSel(dx, dy) {
        var n = game.size;
        if (sel < 0) { select(0); return; }
        var r = Math.floor(sel / n), c = sel % n;
        r = (r + dy + n) % n;
        c = (c + dx + n) % n;
        select(r * n + c);
    }

    function newPuzzle() {
        var gen = function () {
            game = makeGame(state.size, state.diff);
            sel = -1;
            badSet = {};
            persist();
            render();
            chrome.toast('已生成 ' + state.size + '×' + state.size + ' ' + DIFF_LABEL[state.diff] + '题目', 'ok');
        };
        window.setTimeout(gen, 30);
    }

    function hint() {
        var n = game.size;
        var target = sel;
        if (target < 0 || game.values[target]) {
            target = -1;
            for (var i = 0; i < game.values.length; i++) {
                if (!game.values[i]) { target = i; break; }
            }
        }
        if (target < 0) { chrome.toast('已经填满了'); return; }
        game.values[target] = game.solution[target];
        delete game.notes[target];
        sel = target;
        badSet = conflictsOf(game.values, game.size);
        startTimer();
        persist();
        refreshCell();
        chrome.toast('提示：这里填 ' + game.solution[target]);
    }

    function check() {
        badSet = conflictsOf(game.values, game.size);
        var bad = 0, k;
        for (k in badSet) {
            if (Object.prototype.hasOwnProperty.call(badSet, k)) { bad++; }
        }
        refreshCell();
        var empty = emptyCount();
        if (bad) {
            try { chrome.beep('err'); } catch (e) { /* 静默 */ }
            chrome.toast(bad + ' 个格子重复了（红色标出）', 'warn');
            return;
        }
        if (empty) {
            chrome.toast('暂时没有冲突，还剩 ' + empty + ' 格没填');
            return;
        }
        var wrong = 0;
        for (var i = 0; i < game.values.length; i++) {
            if (game.values[i] !== game.solution[i]) { wrong++; }
        }
        if (!wrong) {
            game.done = true;
            persist();
            try { chrome.beep('win'); } catch (e) { /* 静默 */ }
            chrome.toast('全部正确，用时 ' + fmtTime(game.secs) + '！', 'ok');
        } else {
            chrome.toast('填满了，但有 ' + wrong + ' 处与答案不符，再检查一下', 'warn');
        }
    }

    function revealAll() {
        chrome.modal({
            title: '显示答案',
            icon: 'i-sparkles',
            size: 'narrow',
            body: '<p style="margin:0;font-size:13.5px;line-height:1.9">' +
                '将把整盘答案填上（本机进度会被覆盖）。想留给学生做，可先「打印」再显示答案。</p>',
            buttons: [
                { label: '取消' },
                {
                    label: '显示答案',
                    primary: true,
                    onClick: function (close) {
                        game.values = game.solution.slice();
                        game.notes = {};
                        badSet = {};
                        game.done = true;
                        persist();
                        close();
                        refreshCell();
                        chrome.toast('已显示答案');
                    }
                }
            ]
        });
    }

    function togglePause() {
        game.running = !game.running;
        persist();
        updateStat();
        chrome.toast(game.running ? '计时继续' : '已暂停');
    }

    function doPrint() {
        if (typeof window.print !== 'function') { chrome.toast('当前环境不支持打印', 'err'); return; }
        window.setTimeout(function () {
            try { window.print(); } catch (e) { chrome.toast('打印失败，请用浏览器打印快捷键', 'err'); }
        }, 60);
    }

    function setSize(size) {
        if (SIZES.indexOf(size) < 0 || size === state.size) { return; }
        state.size = size;
        persist();
        newPuzzle();
    }

    function setDiff(diff) {
        if (!DIFF_LABEL[diff] || diff === state.diff) { return; }
        state.diff = diff;
        persist();
        newPuzzle();
    }

    /* ---------- 设置抽屉 ---------- */

    function buildSettings(body) {
        var v = function (s) { return ET.escapeHtml(s); };
        body.innerHTML =
            '<h4>纸面</h4>' +
            '<div class="et-drawer__row">' +
            '<input class="et-drawer__input" id="sdSetTitle" value="' + v(state.title) +
            '" placeholder="纸面标题"></div>' +
            '<label class="et-drawer__switch">打印姓名 / 班级栏' +
            '<input type="checkbox" id="sdSetMeta"' + (state.showMeta ? ' checked' : '') + '></label>' +

            '<h4>题目</h4>' +
            '<p class="et-drawer__tip">当前 <b>' + game.size + '×' + game.size + '</b> · 难度 <b>' +
            DIFF_LABEL[game.diff] + '</b>（挖空 ' + (game.size * game.size - emptyCount()) +
            ' 格已填）· 已校验唯一解。</p>' +
            '<div class="et-drawer__row">' +
            '<button class="et-btn" id="sdSetNew" type="button">重新出题</button>' +
            '<button class="et-btn" id="sdSetDiff" type="button">换难度</button>' +
            '</div>' +
            '<p class="et-drawer__tip">题目由程序实时生成（回溯法 + 唯一解校验），' +
            '不预置题库，每次都是新题。</p>' +

            '<h4>操作说明</h4>' +
            '<p class="et-drawer__tip">点格子 → 数字键盘 / 键盘 1–9 填数；<b>候选</b> 模式下数字为小字候选；' +
            '方向键移动，Backspace 清除。计时从第一次填数开始。</p>';

        var q = function (id) { return document.getElementById(id); };
        q('sdSetTitle').addEventListener('input', function () { state.title = this.value; persist(); render(); });
        q('sdSetMeta').addEventListener('change', function () { state.showMeta = this.checked; persist(); render(); });
        q('sdSetNew').addEventListener('click', newPuzzle);
        q('sdSetDiff').addEventListener('click', function () {
            setDiff(game.diff === 'easy' ? 'normal' : (game.diff === 'normal' ? 'hard' : 'easy'));
        });
    }

    /* ---------- 事件与启动 ---------- */

    els.preview.addEventListener('click', function (evt) {
        var node = evt.target;
        while (node && node !== els.preview) {
            if (node.className && String(node.className).indexOf('sd-cell') >= 0) {
                var idx = parseInt(node.getAttribute('data-i'), 10);
                if (idx >= 0) { select(idx); }
                return;
            }
            node = node.parentNode;
        }
    });

    var sizeBtns = els.sizeSeg.getElementsByTagName('button');
    for (var b = 0; b < sizeBtns.length; b++) {
        (function (btn) {
            btn.addEventListener('click', function () {
                setSize(parseInt(btn.getAttribute('data-size'), 10));
            });
        })(sizeBtns[b]);
    }

    els.diffSel.addEventListener('change', function () { setDiff(this.value); });
    els.btnPause.addEventListener('click', togglePause);
    els.btnNew.addEventListener('click', newPuzzle);
    els.btnHint.addEventListener('click', hint);
    els.btnCheck.addEventListener('click', check);
    els.btnSolve.addEventListener('click', revealAll);
    els.btnPrint.addEventListener('click', doPrint);

    document.addEventListener('keydown', function (e) {
        if (isTypingTarget(e.target)) { return; }
        if (e.key >= '1' && e.key <= '9') {
            inputDigit(parseInt(e.key, 10));
            e.preventDefault();
            return;
        }
        if (e.key === 'Backspace' || e.key === 'Delete' || e.key === '0') {
            clearCell();
            e.preventDefault();
            return;
        }
        if (e.key === 'ArrowLeft') { moveSel(-1, 0); e.preventDefault(); return; }
        if (e.key === 'ArrowRight') { moveSel(1, 0); e.preventDefault(); return; }
        if (e.key === 'ArrowUp') { moveSel(0, -1); e.preventDefault(); return; }
        if (e.key === 'ArrowDown') { moveSel(0, 1); e.preventDefault(); return; }
        if (e.key === ' ' || e.code === 'Space') { togglePause(); e.preventDefault(); return; }
        if (e.key === 'n' || e.key === 'N') { newPuzzle(); return; }
        if (e.key === 'h' || e.key === 'H') { hint(); return; }
        if (e.key === 'c' || e.key === 'C') { check(); return; }
        if ((e.key === 'p' || e.key === 'P') && !e.ctrlKey && !e.metaKey) { doPrint(); }
    });

    badSet = conflictsOf(game.values, game.size);
    if (game.running && !game.done) { startTimer(); }
    render();
})();
</script>

</body>
</html>
