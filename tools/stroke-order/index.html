    --et-shadow-lg: 0 24px 60px -32px rgba(15, 23, 42, .4);

.et-app {

}

.et-btn:hover {
    border-color: var(--et-accent);
    color: var(--et-accent);

}

.et-btn:active { transform: translateY(0); }
.et-btn:focus-visible { outline: 2px solid var(--et-accent); outline-offset: 2px; }
.et-btn:disabled { opacity: .45; cursor: not-allowed; transform: none; }

.et-btn--primary {

/* ============ 弹窗 ============ */
.et-modal {
    position: fixed;
    inset: 0;
    z-index: 100;
    display: grid;

    color: var(--et-muted);
}

.so-panel__head b { color: var(--et-fg); font-size: 14px; }

.so-panel__count {
    margin-left: auto;
    font-weight: 700;
    letter-spacing: 0;
    text-transform: none;
    color: var(--so-accent);
}

.so-panel__body {
    flex: 1;
    min-height: 0;
    overflow: auto;
    padding: 12px 14px 14px;
}

/* 笔顺步骤 */
.so-steps {
    display: flex;
    flex-wrap: wrap;
    gap: 7px;
}

.so-step {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 6px 10px 6px 7px;
    border-radius: 9px;
    border: 1px solid var(--et-line);
    background: var(--et-surface-2);
    color: var(--et-muted);
    font: inherit;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    transition: border-color .14s, background .14s, color .14s, transform .14s;
}

.so-step:hover { transform: translateY(-1px); border-color: var(--so-accent); }

.so-step__n {
    display: inline-grid;
    place-items: center;
    min-width: 19px;
    height: 19px;
    padding: 0 4px;
    border-radius: 6px;
    background: var(--et-surface);
    border: 1px solid var(--et-line);
    font-size: 11px;
    font-weight: 800;
    line-height: 1;
}

.so-step.is-done {
    color: var(--et-ok);
    border-color: rgba(5, 150, 105, .35);
    background: rgba(5, 150, 105, .08);
}

.so-step.is-done .so-step__n {
    color: #fff;
    background: var(--et-ok);
    border-color: var(--et-ok);
}

.so-step.is-cur {
    color: #fff;
    background: var(--so-accent);
    border-color: var(--so-accent);
    box-shadow: 0 6px 16px -8px var(--so-accent);
}

.so-step.is-cur .so-step__n {
    color: var(--so-accent);
    background: #fff;
    border-color: #fff;
}

/* 常用字网格 */
.so-chars {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(52px, 1fr));
    gap: 7px;
}

.so-char {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1px;
    padding: 5px 2px 4px;
    border-radius: 10px;
    border: 1px solid var(--et-line);
    background: var(--et-surface-2);
    color: var(--et-fg);
    font: inherit;
    cursor: pointer;
    transition: border-color .14s, background .14s, color .14s, transform .14s;
}

.so-char:hover { transform: translateY(-1px); border-color: var(--so-accent); color: var(--so-accent); }

.so-char.is-on {
    background: var(--so-accent);
    border-color: var(--so-accent);
    color: #fff;
}

.so-char__c {
    font-size: 22px;
    font-weight: 600;
    line-height: 1.15;
}

.so-char__n {
    font-size: 10.5px;
    font-weight: 600;
    opacity: .72;
}

.so-empty {
    padding: 18px 6px;
    text-align: center;
    font-size: 13px;
    color: var(--et-muted);
}

.so-foot-note {
    margin: 0;
    font-size: 11.5px;
    color: var(--et-muted);
    text-align: center;
    line-height: 1.7;
}

@media (max-width: 900px) {
    .so-body { grid-template-columns: minmax(0, 1fr); }
    .so-right { flex: none; }
    .so-panel--flex { flex: none; }
    .so-left { min-height: 340px; }
}
</style>

        '我': [[458,627,392,631,336,588,274,552,258,550,253,542,220,530,212,532,203,522],[174,404,215,398,241,402,672,514,742,512],[323,556,351,542,365,522,361,116,340,67,246,113],[100,206,124,195,163,189,492,334],[492,807,537,760,538,627,569,435,612,299,676,170,717,112,779,48,817,22,859,12,880,78,891,140,886,147,894,173],[723,412,737,365,664,259,594,198,489,142,454,132],[657,710,750,668,781,634]],
        '找': [[143,512,204,512,309,538,363,559,430,565],[282,793,298,785,329,753,320,574,323,117,317,85,301,55,260,68,194,103,192,110,181,110],[77,221,126,215,257,314,419,425],[443,500,515,502,616,533,718,574,743,579,770,575],[527,804,545,792,572,757,571,668,580,550,614,385,659,262,719,156,775,88,807,60,840,41,870,37,897,113,914,225],[744,464,758,431,755,413,696,325,642,266,603,234,531,190,422,147],[681,749,772,702,800,667]],
        '前': [[360,805,428,756,443,738,454,710],[658,856,678,835,686,816,645,767,573,700],[110,599,174,582,486,632,855,670,895,665,953,645],[252,496,275,478,284,456,285,380,273,238,262,167,245,109,243,64],[311,466,323,475,434,505,449,500,469,477,473,141,466,94,452,73,365,112],[305,348,318,359,364,370,408,366],[302,236,314,252,344,259,381,260,403,254],[581,473,606,443,602,199],[723,569,756,527,760,66,749,39,733,22,684,44,640,77]],
        '其': [[231,648,288,640,369,650,711,711,749,713,793,705],[341,792,383,742,389,659,387,303,370,288],[581,851,631,808,605,335,586,311],[414,522,425,530,514,548,549,548,557,543],[417,400,422,411,433,414,527,429,556,426],[107,237,162,228,451,270,840,308,922,287],[427,158,392,154,350,105,289,56,227,17,189,1],[581,187,669,119,717,73,742,35,753,-3]],
        '具': [[327,758,338,754,359,728,371,676,373,305,372,290,352,271],[387,747,413,734,623,780,653,760,670,733,657,605,646,321,621,303],[403,600,417,612,495,631,522,635,556,629],[406,486,415,497,508,514,535,516,559,509],[403,366,416,377,475,389,542,397,566,390],[116,231,179,213,434,250,854,288,944,260],[444,158,406,152,335,71,273,23,221,-6],[600,176,749,70,772,37,788,-1]],
        '直': [[272,649,328,637,728,692,800,681],[495,825,524,797,533,775,498,547,479,527],[339,520,366,496,379,469,383,113,385,99,400,85],[394,509,424,497,475,503,636,540,656,532,670,517,680,497,666,329,662,124,640,109],[415,377,424,388,516,407,558,413,579,407],[415,270,425,283,489,296,549,305,571,299],[416,169,424,182,487,193,561,202,582,196],[136,52,197,31,417,58,795,84,843,84,913,57]]
    };

    /* ── 构建索引 ── */
    var LIST = [];
    var MAP = {};
    (function build() {
        var keys = Object.keys(RAW);
        for (var i = 0; i < keys.length; i++) {
            var codes = RAW[keys[i]].split(' ');
            var item = { char: keys[i], codes: codes, count: codes.length };
            LIST.push(item);
            MAP[item.char] = item;
        }
    })();

    var SPEEDS = { slow: 900, normal: 520, fast: 280 };
    var SPEED_LABEL = { slow: '慢', normal: '标准', fast: '快' };

    var state = {
        char: '一',
        cur: 0,          /* 0 = 未开始；1..n = 当前第 n 笔 */
        filter: '',
        query: '',
        grid: true,
        loop: false,
        speed: 'normal'
    };

    var timer = 0;

    var els = {
        inpQuery: document.getElementById('inpQuery'),
        filters: document.getElementById('filters'),
        btnPlay: document.getElementById('btnPlay'),
        btnPlayText: document.getElementById('btnPlayText'),
        btnNextTop: document.getElementById('btnNextTop'),
        btnPrev: document.getElementById('btnPrev'),
        btnNext: document.getElementById('btnNext'),
        btnReset: document.getElementById('btnReset'),
        tzg: document.getElementById('tzg'),
        tzgChar: document.getElementById('tzgChar'),
        ink: document.getElementById('ink'),
        inkG: document.getElementById('inkG'),
        curNum: document.getElementById('curNum'),
        curName: document.getElementById('curName'),
        progressFill: document.getElementById('progressFill'),
        stepCount: document.getElementById('stepCount'),
        steps: document.getElementById('steps'),
        charGrid: document.getElementById('charGrid'),
        charEmpty: document.getElementById('charEmpty'),
        charCount: document.getElementById('charCount')
    };

    var chrome = ET.Chrome.mount({
        toolId: TOOL_ID,
        title: '汉字笔画笔顺演示',
        sub: '语文 · 笔顺查询器',
        accent: '#dc2626',
        status: '字库 ' + LIST.length + ' 字 · 就绪',
        sound: true,
        primary: next,
        secondary: prev,
        settings: { title: '演示设置', build: buildSettings },
        help: '<div style="font-size:13.5px;line-height:2">' +
            '<p style="margin:0 0 8px"><b>用法</b>：左侧输入框键入汉字，或点右侧「常用字」选取；点「下一笔」逐步演示。</p>' +
            '<p style="margin:0 0 8px"><b>快捷键</b>：空格 / → = 下一笔；← = 上一笔；R = 重来。</p>' +
            '<p style="margin:0 0 8px"><b>翻页笔</b>：下页键 = 下一笔，上页键 = 上一笔。</p>' +
            '<p style="margin:0 0 8px"><b>说明</b>：本地内置 ' + LIST.length + ' 个常用字，笔顺依据国家语委规范；每笔按真实书写轨迹逐笔写出。</p>' +
            '<p style="margin:0"><b>笔迹数据</b>：hanzi-writer-data（派生自 Make Me a Hanzi），Arphic Public License，已内联，运行时不联网。</p></div>'
    });

    /* ---------- 工具函数 ---------- */

    function item() {
        return MAP[state.char] || LIST[0];
    }

    function nameOf(code) {
        return STROKE_NAME[code] || '笔画';
    }

    function save() {
        store.set('char', state.char);
        store.set('grid', state.grid);
        store.set('loop', state.loop);
        store.set('speed', state.speed);
    }

    /* ---------- 渲染 ---------- */

    function renderStage(animate) {
        var it = item();
        els.tzgChar.textContent = it.char;
        els.tzg.classList.toggle('is-plain', !state.grid);

        els.curNum.textContent = '共 ' + it.count + ' 画' + (state.cur ? ' · 第 ' + state.cur + ' 笔' : '');
        if (state.cur) {
            els.curName.textContent = nameOf(it.codes[state.cur - 1]);
            els.curName.classList.remove('is-idle');
        } else {
            els.curName.textContent = '未开始';
            els.curName.classList.add('is-idle');
        }

        els.progressFill.style.width = (it.count ? (state.cur / it.count * 100) : 0) + '%';
        els.stepCount.textContent = state.cur + ' / ' + it.count;

        renderInk(!!animate);
    }

    function renderSteps() {
        var it = item();
        if (els.steps.getAttribute('data-ch') !== it.char) {
            els.steps.textContent = '';
            els.steps.setAttribute('data-ch', it.char);
            for (var i = 0; i < it.count; i++) {
                var b = document.createElement('button');
                b.type = 'button';
                b.className = 'so-step';
                b.setAttribute('data-i', String(i + 1));
                var n = document.createElement('span');
                n.className = 'so-step__n';
                n.textContent = String(i + 1);
                var t = document.createElement('span');
                t.className = 'so-step__t';
                t.textContent = nameOf(it.codes[i]);
                b.appendChild(n);
                b.appendChild(t);
                els.steps.appendChild(b);
            }
        }
        var kids = els.steps.children;
        for (var k = 0; k < kids.length; k++) {
            var num = k + 1;
            kids[k].className = 'so-step'
                + (num === state.cur ? ' is-cur' : (num < state.cur ? ' is-done' : ''));
        }
    }

    function renderGrid() {
        var parts = state.filter ? state.filter.split('-') : null;
        var lo = parts ? parseInt(parts[0], 10) : 0;
        var hi = parts ? parseInt(parts[1], 10) : 999;
        var q = state.query;

        els.charGrid.textContent = '';
        var shown = 0;
        for (var i = 0; i < LIST.length; i++) {
            var it = LIST[i];
            if (it.count < lo || it.count > hi) { continue; }
            if (q && it.char.indexOf(q) === -1) { continue; }

            var b = document.createElement('button');
            b.type = 'button';
            b.className = 'so-char' + (it.char === state.char ? ' is-on' : '');
            b.setAttribute('data-c', it.char);
            b.title = it.char + ' · ' + it.count + ' 画';

            var c = document.createElement('span');
            c.className = 'so-char__c';
            c.textContent = it.char;
            var m = document.createElement('span');
            m.className = 'so-char__n';
            m.textContent = it.count + '画';

            b.appendChild(c);
            b.appendChild(m);
            els.charGrid.appendChild(b);
            shown++;
        }

        els.charEmpty.hidden = shown > 0;
        els.charCount.textContent = shown + ' 字';
    }

    function renderFilterBtns() {
        var btns = ET.qsa('.so-fbtn', els.filters);
        for (var i = 0; i < btns.length; i++) {
            btns[i].classList.toggle('is-on', btns[i].getAttribute('data-pick') === state.filter);
        }
    }

    function renderAll() {
        renderStage();
        renderSteps();
        renderFilterBtns();
    }

    /* ---------- 笔迹轨迹动画 ---------- */

    var inkTip = null;   /* 笔尖圆点 */
    var inkRAF = 0;      /* requestAnimationFrame 句柄 */

    /* 扁平数组 [x,y,x,y,…] → SVG points 字符串 */
    function pointsOf(flat) {
        var s = '';
        for (var i = 0; i + 1 < flat.length; i += 2) {
            s += (i ? ' ' : '') + flat[i] + ',' + flat[i + 1];
        }
        return s;
    }

    /* 折线总长（数据坐标即视框坐标） */
    function lengthOf(flat) {
        var total = 0;
        for (var i = 2; i + 1 < flat.length; i += 2) {
            var dx = flat[i] - flat[i - 2];
            var dy = flat[i + 1] - flat[i - 1];
            total += Math.sqrt(dx * dx + dy * dy);
        }
        return total;
    }

    /* 沿折线取距起点 d 处的点 */
    function pointAt(flat, d) {
        var acc = 0;
        for (var i = 2; i + 1 < flat.length; i += 2) {
            var dx = flat[i] - flat[i - 2];
            var dy = flat[i + 1] - flat[i - 1];
            var seg = Math.sqrt(dx * dx + dy * dy);
            if (acc + seg >= d) {
                var t = seg ? (d - acc) / seg : 0;
                return [flat[i - 2] + dx * t, flat[i - 1] + dy * t];
            }
            acc += seg;
        }
        return [flat[flat.length - 2], flat[flat.length - 1]];
    }

    function stopInk() {
        if (inkRAF) {
            cancelAnimationFrame(inkRAF);
            inkRAF = 0;
        }
        if (inkTip) { inkTip.classList.remove('is-live'); }
    }

    /* 单笔书写：描红扫描 + 笔尖游走 */
    function sweepStroke(pl, flat) {
        var len = lengthOf(flat);
        if (!len) { return; }
        var dur = SPEEDS[state.speed];
        pl.setAttribute('stroke-dasharray', len + ' ' + len);
        pl.setAttribute('stroke-dashoffset', String(len));
        inkTip.classList.add('is-live');
        var t0 = 0;
        function step(ts) {
            if (!t0) { t0 = ts; }
            var p = Math.min(1, (ts - t0) / dur);
            var e = 1 - Math.pow(1 - p, 2);          /* 收笔稍缓，更像书写 */
            pl.setAttribute('stroke-dashoffset', String(len * (1 - e)));
            var pt = pointAt(flat, len * e);
            inkTip.setAttribute('cx', String(pt[0]));
            inkTip.setAttribute('cy', String(pt[1]));
            if (p < 1) {
                inkRAF = requestAnimationFrame(step);
            } else {
                inkRAF = 0;
                pl.removeAttribute('stroke-dasharray');
                pl.removeAttribute('stroke-dashoffset');
                inkTip.classList.remove('is-live');
            }
        }
        inkRAF = requestAnimationFrame(step);
    }

    /* animate = true 时对「当前笔」重播书写动画 */
    function renderInk(animate) {
        stopInk();
        var data = STROKE_INK[state.char] || null;
        els.tzg.classList.toggle('has-ink', !!data);
        els.inkG.textContent = '';
        inkTip = null;
        if (!data) { return; }

        var cur = state.cur;
        var curEl = null;
        for (var i = 0; i < data.length; i++) {
            var pl = document.createElementNS(NS_SVG, 'polyline');
            pl.setAttribute('class', 'so-ink__s'
                + (i + 1 < cur ? ' is-done' : (i + 1 === cur ? ' is-cur' : ' is-pending')));
            pl.setAttribute('points', pointsOf(data[i]));
            els.inkG.appendChild(pl);
            if (i + 1 === cur) { curEl = pl; }
        }

        inkTip = document.createElementNS(NS_SVG, 'circle');
        inkTip.setAttribute('class', 'so-ink__tip');
        inkTip.setAttribute('r', '23');
        inkTip.setAttribute('cx', '-200');
        inkTip.setAttribute('cy', '-200');
        els.inkG.appendChild(inkTip);

        if (animate && curEl) { sweepStroke(curEl, data[cur - 1]); }
    }

    /* ---------- 选字 ---------- */

    function select(ch) {
        if (!MAP[ch]) { return; }
        stopPlay();
        state.char = ch;
        state.cur = 0;
        save();
        renderSteps();
        renderStage();
        renderGrid();
        chrome.setStatus(ch + ' · 共 ' + item().count + ' 画');
    }

    function tryQuery() {
        var q = els.inpQuery.value.trim();
        if (!q) { return; }
        if (q.length === 1 && MAP[q]) {
            select(q);
            els.inpQuery.value = '';
            state.query = '';
            renderGrid();
        } else {
            chrome.beep('err');
            chrome.toast('字库中暂无「' + q + '」', 'warn');
        }
    }

    /* ---------- 逐笔推进 ---------- */

    function setCur(v, animate) {
        var it = item();
        if (v < 0) { v = 0; }
        if (v > it.count) { v = it.count; }
        state.cur = v;
        renderStage(animate);
        renderSteps();
    }

    function next() {
        var it = item();
        if (state.cur >= it.count) {
            if (state.cur && it.count) { chrome.beep('win'); }
            if (state.loop) { setCur(1, true); chrome.beep('tick'); }
            else { stopPlay(); }
            return;
        }
        setCur(state.cur + 1, true);
        chrome.beep('tick');
        if (state.cur === it.count) {
            chrome.beep('win');
            chrome.setStatus(it.char + ' · 笔顺演示完成');
            if (!state.loop) { stopPlay(); }
        }
    }

    function prev() {
        stopPlay();
        setCur(state.cur - 1);
    }

    function reset() {
        stopPlay();
        setCur(0);
        chrome.setStatus(item().char + ' · 共 ' + item().count + ' 画');
    }

    /* ---------- 自动播放 ---------- */

    function playing() {
        return timer !== 0;
    }

    function startPlay() {
        if (playing()) { return; }
        var it = item();
        if (state.cur >= it.count) { setCur(0); }
        els.btnPlayText.textContent = '暂停';
        els.btnPlay.querySelector('use').setAttribute('href', '#i-pause');
        timer = setInterval(function () {
            var cur = item();
            if (state.cur >= cur.count) {
                if (state.loop) { setCur(1, true); }
                else { stopPlay(); }
                return;
            }
            setCur(state.cur + 1, true);
            chrome.beep('tick');
            if (state.cur >= cur.count) {
                chrome.beep('win');
                if (!state.loop) { stopPlay(); }
            }
        }, SPEEDS[state.speed]);
    }

    function stopPlay() {
        if (timer) {
            clearInterval(timer);
            timer = 0;
        }
        els.btnPlayText.textContent = '演示笔顺';
        els.btnPlay.querySelector('use').setAttribute('href', '#i-play');
    }

    function togglePlay() {
        if (playing()) { stopPlay(); } else { startPlay(); }
    }

    /* ---------- 设置抽屉 ---------- */

    function buildSettings(body) {
        body.appendChild(heading('演示'));

        body.appendChild(switchRow('显示田字格', state.grid, function (v) {
            state.grid = v;
            save();
            renderStage();
        }));

        body.appendChild(switchRow('循环播放', state.loop, function (v) {
            state.loop = v;
            save();
        }));

        body.appendChild(heading('播放速度'));
        var seg = ET.create('div', 'so-filters');
        var keys = ['slow', 'normal', 'fast'];
        for (var i = 0; i < keys.length; i++) {
            (function (key) {
                var b = ET.create('button', 'so-fbtn' + (state.speed === key ? ' is-on' : ''), SPEED_LABEL[key]);
                b.type = 'button';
                b.addEventListener('click', function () {
                    state.speed = key;
                    save();
                    var sibs = ET.qsa('.so-fbtn', seg);
                    for (var j = 0; j < sibs.length; j++) {
                        sibs[j].classList.toggle('is-on', sibs[j] === b);
                    }
                    if (playing()) { stopPlay(); startPlay(); }
                });
                seg.appendChild(b);
            })(keys[i]);
        }
        body.appendChild(seg);

        body.appendChild(heading('字库'));
        var tip = ET.create('p', 'et-drawer__tip');
        tip.innerHTML = '内置 <b>' + LIST.length + '</b> 个常用字，按笔画数筛选与查询。<br>' +
            '逐笔书写演示，笔迹数据取自 hanzi-writer-data（Arphic Public License）。';
        body.appendChild(tip);
    }

    function heading(text) {
        return ET.create('h4', null, text);
    }

    function switchRow(label, checked, onChange) {
        var row = ET.create('label', 'et-drawer__switch');
        row.appendChild(ET.create('span', null, label));
        var inp = document.createElement('input');
        inp.type = 'checkbox';
        inp.checked = !!checked;
        inp.addEventListener('change', function () { onChange(inp.checked); });
        row.appendChild(inp);
        return row;
    }

    /* ---------- 事件 ---------- */

    els.inpQuery.addEventListener('input', function () {
        var q = els.inpQuery.value.trim();
        if (q.length === 1 && MAP[q]) { tryQuery(); }
    });
    els.inpQuery.addEventListener('keydown', function (ev) {
        if (ev.key === 'Enter') { ev.preventDefault(); tryQuery(); }
    });

    els.filters.addEventListener('click', function (ev) {
        var btn = ev.target.closest ? ev.target.closest('.so-fbtn') : null;
        if (!btn) { return; }
        state.filter = btn.getAttribute('data-pick') || '';
        renderFilterBtns();
        renderGrid();
    });

    els.charGrid.addEventListener('click', function (ev) {
        var btn = ev.target.closest ? ev.target.closest('.so-char') : null;
        if (!btn) { return; }
        select(btn.getAttribute('data-c'));
    });

    els.steps.addEventListener('click', function (ev) {
        var btn = ev.target.closest ? ev.target.closest('.so-step') : null;
        if (!btn) { return; }
        stopPlay();
        setCur(parseInt(btn.getAttribute('data-i'), 10) || 0);
    });

    els.btnNext.addEventListener('click', next);
    els.btnNextTop.addEventListener('click', next);
    els.btnPrev.addEventListener('click', prev);
    els.btnReset.addEventListener('click', reset);
    els.btnPlay.addEventListener('click', togglePlay);

    document.addEventListener('keydown', function (ev) {
        var tag = (ev.target && ev.target.tagName) || '';
        if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') { return; }
        if (document.querySelector('.et-modal, .et-drawer-backdrop')) { return; }

        if (ev.code === 'Space' || ev.key === 'ArrowRight') {
            ev.preventDefault();
            next();
        } else if (ev.key === 'ArrowLeft') {
            ev.preventDefault();
            prev();
        } else if (ev.key === 'r' || ev.key === 'R') {
            reset();
        }
    });

    /* ---------- 初始化 ---------- */

    (function init() {
        state.grid = store.get('grid', true) !== false;
        state.loop = store.get('loop', false) === true;
        var sp = store.get('speed', 'normal');
        state.speed = SPEEDS[sp] ? sp : 'normal';
        var ch = store.get('char', '一');
        state.char = MAP[ch] ? ch : '一';
        state.cur = 0;

        renderAll();
        renderGrid();
        chrome.setStatus(item().char + ' · 共 ' + item().count + ' 画');
    })();
})();
</script>
