/* ============ 基础 ============ */
.et-app {
    position: relative;
    isolation: isolate;
    display: flex;
    flex-direction: column;
    height: 100vh;
    height: 100dvh;
    overflow: hidden;
    background: var(--et-bg);
    color: var(--et-fg);
    font-family: var(--et-font);
    -webkit-font-smoothing: antialiased;
    transition: background .25s, color .25s;

/* 极光背景：径向渐变 + 呼吸动画（edupick 品质基线，老内核也不掉帧） */
.et-app::before {
    content: '';
    position: fixed;
    inset: 0;
    z-index: -1;
    pointer-events: none;
    background:
        radial-gradient(46% 40% at 20% 18%, var(--et-accent-weak), transparent 65%),
        radial-gradient(42% 38% at 82% 24%, var(--et-accent-weak), transparent 70%),

}

.et-app *,
.et-app *::before,
.et-app *::after { box-sizing: border-box; }

[hidden] { display: none !important; }

.et-icon {

}

}

}

.et-status[data-tone="err"] .et-status__dot { background: var(--et-err); }

.et-actions {

}

.et-icon-btn {
    display: inline-grid;
    place-items: center;
    width: 38px;
    height: 38px;
    font-size: 16px;
    line-height: 1;
    border-radius: 11px;
    border: 1px solid var(--et-line);
    background: var(--et-surface-2);
    color: var(--et-fg);
    cursor: pointer;
    transition: transform .14s, border-color .14s, color .14s, opacity .14s;
    -webkit-tap-highlight-color: transparent;
}

.et-icon-btn:hover {
    border-color: var(--et-accent);
    color: var(--et-accent);

}

.et-icon-btn:active { transform: translateY(0); }

/* ============ 主区默认 ============ */
.et-main {
    flex: 1;

    position: relative;
    overflow: auto;
}

/* ============ 页脚（品牌回流 L2） ============ */
.et-footer {

    justify-content: center;
    gap: 6px;
    padding: 7px 16px;
    font-size: 12px;

}

.et-footer a {

}

/* ============ 按钮 ============ */
.et-btn {

    justify-content: center;
    gap: 7px;
    padding: 9px 16px;
    border-radius: 11px;
    font: inherit;
    font-size: 13.5px;
    font-weight: 700;
    border: 1px solid var(--et-line);
    background: var(--et-surface-2);
    color: var(--et-fg);
    cursor: pointer;
    transition: transform .14s, border-color .14s, color .14s, background .14s, box-shadow .14s;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
}

.et-btn:hover {

    color: var(--et-accent);
    transform: translateY(-1px);
}

.et-btn:active { transform: translateY(0); }
.et-btn:focus-visible { outline: 2px solid var(--et-accent); outline-offset: 2px; }
.et-btn:disabled { opacity: .45; cursor: not-allowed; transform: none; }

.et-btn--primary {
    background: var(--et-accent);
    border-color: var(--et-accent);
    color: #fff;
    box-shadow: 0 6px 18px -8px var(--et-accent);
}

.et-btn--primary:hover { color: #fff; filter: brightness(1.08); }
.et-btn--primary:disabled { filter: none; }

.et-btn--danger:hover {
    border-color: var(--et-err);
    color: var(--et-err);
}

.et-btn--lg {
    padding: 13px 26px;

}

/* ============ 弹窗 ============ */
.et-modal {
    position: fixed;
    inset: 0;
    z-index: 100;
    display: grid;
    place-items: center;
    padding: 24px;
    background: rgba(2, 6, 23, .55);
    backdrop-filter: blur(4px);

.et-modal__panel {

.et-toast {

    line-height: 1;
}

.so-step.is-done {
    color: var(--et-ok);
    border-color: rgba(5, 150, 105, .35);
    background: rgba(5, 150, 105, .08);
}

.so-step.is-done .so-step__n {
    color: #fff;
    background: var(--et-ok);
    border-color: var(--et-ok);
}

.so-step.is-cur {
    color: #fff;
    background: var(--so-accent);
    border-color: var(--so-accent);
    box-shadow: 0 6px 16px -8px var(--so-accent);
}

.so-step.is-cur .so-step__n {
    color: var(--so-accent);
    background: #fff;
    border-color: #fff;
}

/* 常用字网格 */
.so-chars {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(52px, 1fr));
    gap: 7px;
}

.so-char {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1px;
    padding: 5px 2px 4px;
    border-radius: 10px;
    border: 1px solid var(--et-line);
    background: var(--et-surface-2);
    color: var(--et-fg);
    font: inherit;
    cursor: pointer;
    transition: border-color .14s, background .14s, color .14s, transform .14s;
}

.so-char:hover { transform: translateY(-1px); border-color: var(--so-accent); color: var(--so-accent); }

.so-char.is-on {
    background: var(--so-accent);
    border-color: var(--so-accent);
    color: #fff;
}

.so-char__c {
    font-size: 22px;
    font-weight: 600;
    line-height: 1.15;
}

.so-char__n {
    font-size: 10.5px;
    font-weight: 600;
    opacity: .72;
}

.so-empty {
    padding: 18px 6px;
    text-align: center;
    font-size: 13px;
    color: var(--et-muted);
}

.so-foot-note {
    margin: 0;
    font-size: 11.5px;
    color: var(--et-muted);
    text-align: center;
    line-height: 1.7;
}

@media (max-width: 900px) {
    .so-body { grid-template-columns: minmax(0, 1fr); }
    .so-right { flex: none; }
    .so-panel--flex { flex: none; }
    .so-left { min-height: 340px; }
}

    /* ── 构建索引 ── */
    var LIST = [];
    var MAP = {};
    (function build() {
        var keys = Object.keys(RAW);
        for (var i = 0; i < keys.length; i++) {
            var codes = RAW[keys[i]].split(' ');
            var item = { char: keys[i], codes: codes, count: codes.length };
            LIST.push(item);
            MAP[item.char] = item;
        }
    })();

    var SPEEDS = { slow: 900, normal: 520, fast: 280 };
    var SPEED_LABEL = { slow: '慢', normal: '标准', fast: '快' };

    var state = {
        char: '一',
        cur: 0,          /* 0 = 未开始；1..n = 当前第 n 笔 */
        filter: '',
        query: '',
        grid: true,
        loop: false,
        speed: 'normal'
    };

    var timer = 0;

    var els = {
        inpQuery: document.getElementById('inpQuery'),
        filters: document.getElementById('filters'),
        btnPlay: document.getElementById('btnPlay'),
        btnPlayText: document.getElementById('btnPlayText'),
        btnNextTop: document.getElementById('btnNextTop'),
        btnPrev: document.getElementById('btnPrev'),
        btnNext: document.getElementById('btnNext'),
        btnReset: document.getElementById('btnReset'),
        tzg: document.getElementById('tzg'),
        tzgChar: document.getElementById('tzgChar'),
        curNum: document.getElementById('curNum'),
        curName: document.getElementById('curName'),
        progressFill: document.getElementById('progressFill'),
        stepCount: document.getElementById('stepCount'),
        steps: document.getElementById('steps'),
        charGrid: document.getElementById('charGrid'),
        charEmpty: document.getElementById('charEmpty'),
        charCount: document.getElementById('charCount')
    };

    var chrome = ET.Chrome.mount({
        toolId: TOOL_ID,
        title: '汉字笔画笔顺演示',
        sub: '语文 · 笔顺查询器',
        accent: '#dc2626',
        status: '字库 ' + LIST.length + ' 字 · 就绪',
        sound: true,
        primary: next,
        secondary: prev,
        settings: { title: '演示设置', build: buildSettings },
        help: '<div style="font-size:13.5px;line-height:2">' +
            '<p style="margin:0 0 8px"><b>用法</b>：左侧输入框键入汉字，或点右侧「常用字」选取；点「下一笔」逐步演示。</p>' +
            '<p style="margin:0 0 8px"><b>快捷键</b>：空格 / → = 下一笔；← = 上一笔；R = 重来。</p>' +
            '<p style="margin:0 0 8px"><b>翻页笔</b>：下页键 = 下一笔，上页键 = 上一笔。</p>' +
            '<p style="margin:0"><b>说明</b>：本地内置 ' + LIST.length + ' 个常用字，笔顺依据国家语委规范；仅展示笔画序号与名称，不绘制笔迹轨迹。</p></div>'
    });

    /* ---------- 工具函数 ---------- */

    function item() {
        return MAP[state.char] || LIST[0];
    }

    function nameOf(code) {
        return STROKE_NAME[code] || '笔画';
    }

    function save() {
        store.set('char', state.char);
        store.set('grid', state.grid);
        store.set('loop', state.loop);
        store.set('speed', state.speed);
    }

    /* ---------- 渲染 ---------- */

    function renderStage() {
        var it = item();
        els.tzgChar.textContent = it.char;
        els.tzg.classList.toggle('is-plain', !state.grid);

        els.curNum.textContent = '共 ' + it.count + ' 画' + (state.cur ? ' · 第 ' + state.cur + ' 笔' : '');
        if (state.cur) {
            els.curName.textContent = nameOf(it.codes[state.cur - 1]);
            els.curName.classList.remove('is-idle');
        } else {
            els.curName.textContent = '未开始';
            els.curName.classList.add('is-idle');
        }

        els.progressFill.style.width = (it.count ? (state.cur / it.count * 100) : 0) + '%';
        els.stepCount.textContent = state.cur + ' / ' + it.count;
    }

    function renderSteps() {
        var it = item();
        if (els.steps.getAttribute('data-ch') !== it.char) {
            els.steps.textContent = '';
            els.steps.setAttribute('data-ch', it.char);
            for (var i = 0; i < it.count; i++) {
                var b = document.createElement('button');
                b.type = 'button';
                b.className = 'so-step';
                b.setAttribute('data-i', String(i + 1));
                var n = document.createElement('span');
                n.className = 'so-step__n';
                n.textContent = String(i + 1);
                var t = document.createElement('span');
                t.className = 'so-step__t';
                t.textContent = nameOf(it.codes[i]);
                b.appendChild(n);
                b.appendChild(t);
                els.steps.appendChild(b);
            }
        }
        var kids = els.steps.children;
        for (var k = 0; k < kids.length; k++) {
            var num = k + 1;
            kids[k].className = 'so-step'
                + (num === state.cur ? ' is-cur' : (num < state.cur ? ' is-done' : ''));
        }
    }

    function renderGrid() {
        var parts = state.filter ? state.filter.split('-') : null;
        var lo = parts ? parseInt(parts[0], 10) : 0;
        var hi = parts ? parseInt(parts[1], 10) : 999;
        var q = state.query;

        els.charGrid.textContent = '';
        var shown = 0;
        for (var i = 0; i < LIST.length; i++) {
            var it = LIST[i];
            if (it.count < lo || it.count > hi) { continue; }
            if (q && it.char.indexOf(q) === -1) { continue; }

            var b = document.createElement('button');
            b.type = 'button';
            b.className = 'so-char' + (it.char === state.char ? ' is-on' : '');
            b.setAttribute('data-c', it.char);
            b.title = it.char + ' · ' + it.count + ' 画';

            var c = document.createElement('span');
            c.className = 'so-char__c';
            c.textContent = it.char;
            var m = document.createElement('span');
            m.className = 'so-char__n';
            m.textContent = it.count + '画';

            b.appendChild(c);
            b.appendChild(m);
            els.charGrid.appendChild(b);
            shown++;
        }

        els.charEmpty.hidden = shown > 0;
        els.charCount.textContent = shown + ' 字';
    }

    function renderFilterBtns() {
        var btns = ET.qsa('.so-fbtn', els.filters);
        for (var i = 0; i < btns.length; i++) {
            btns[i].classList.toggle('is-on', btns[i].getAttribute('data-pick') === state.filter);
        }
    }

    function renderAll() {
        renderStage();
        renderSteps();
        renderFilterBtns();
    }

    /* ---------- 选字 ---------- */

    function select(ch) {
        if (!MAP[ch]) { return; }
        stopPlay();
        state.char = ch;
        state.cur = 0;
        save();
        renderSteps();
        renderStage();
        renderGrid();
        chrome.setStatus(ch + ' · 共 ' + item().count + ' 画');
    }

    function tryQuery() {
        var q = els.inpQuery.value.trim();
        if (!q) { return; }
        if (q.length === 1 && MAP[q]) {
            select(q);
            els.inpQuery.value = '';
            state.query = '';
            renderGrid();
        } else {
            chrome.beep('err');
            chrome.toast('字库中暂无「' + q + '」', 'warn');
        }
    }

    /* ---------- 逐笔推进 ---------- */

    function setCur(v) {
        var it = item();
        if (v < 0) { v = 0; }
        if (v > it.count) { v = it.count; }
        state.cur = v;
        renderStage();
        renderSteps();
    }

    function next() {
        var it = item();
        if (state.cur >= it.count) {
            if (state.cur && it.count) { chrome.beep('win'); }
            if (state.loop) { setCur(1); chrome.beep('tick'); }
            else { stopPlay(); }
            return;
        }
        setCur(state.cur + 1);
        chrome.beep('tick');
        if (state.cur === it.count) {
            chrome.beep('win');
            chrome.setStatus(it.char + ' · 笔顺演示完成');
            if (!state.loop) { stopPlay(); }
        }
    }

    function prev() {
        stopPlay();
        setCur(state.cur - 1);
    }

    function reset() {
        stopPlay();
        setCur(0);
        chrome.setStatus(item().char + ' · 共 ' + item().count + ' 画');
    }

    /* ---------- 自动播放 ---------- */

    function playing() {
        return timer !== 0;
    }

    function startPlay() {
        if (playing()) { return; }
        var it = item();
        if (state.cur >= it.count) { setCur(0); }
        els.btnPlayText.textContent = '暂停';
        els.btnPlay.querySelector('use').setAttribute('href', '#i-pause');
        timer = setInterval(function () {
            var cur = item();
            if (state.cur >= cur.count) {
                if (state.loop) { setCur(1); }
                else { stopPlay(); }
                return;
            }
            setCur(state.cur + 1);
            chrome.beep('tick');
            if (state.cur >= cur.count) {
                chrome.beep('win');
                if (!state.loop) { stopPlay(); }
            }
        }, SPEEDS[state.speed]);
    }

    function stopPlay() {
        if (timer) {
            clearInterval(timer);
            timer = 0;
        }
        els.btnPlayText.textContent = '演示笔顺';
        els.btnPlay.querySelector('use').setAttribute('href', '#i-play');
    }

    function togglePlay() {
        if (playing()) { stopPlay(); } else { startPlay(); }
    }

    /* ---------- 设置抽屉 ---------- */

    function buildSettings(body) {
        body.appendChild(heading('演示'));

        body.appendChild(switchRow('显示田字格', state.grid, function (v) {
            state.grid = v;
            save();
            renderStage();
        }));

        body.appendChild(switchRow('循环播放', state.loop, function (v) {
            state.loop = v;
            save();
        }));

        body.appendChild(heading('播放速度'));
        var seg = ET.create('div', 'so-filters');
        var keys = ['slow', 'normal', 'fast'];
        for (var i = 0; i < keys.length; i++) {
            (function (key) {
                var b = ET.create('button', 'so-fbtn' + (state.speed === key ? ' is-on' : ''), SPEED_LABEL[key]);
                b.type = 'button';
                b.addEventListener('click', function () {
                    state.speed = key;
                    save();
                    var sibs = ET.qsa('.so-fbtn', seg);
                    for (var j = 0; j < sibs.length; j++) {
                        sibs[j].classList.toggle('is-on', sibs[j] === b);
                    }
                    if (playing()) { stopPlay(); startPlay(); }
                });
                seg.appendChild(b);
            })(keys[i]);
        }
        body.appendChild(seg);

        body.appendChild(heading('字库'));
        var tip = ET.create('p', 'et-drawer__tip');
        tip.innerHTML = '内置 <b>' + LIST.length + '</b> 个常用字，按笔画数筛选与查询。<br>' +
            '笔顺依据国家语委《现代汉语通用字笔顺规范》，仅展示笔画序号与名称。';
        body.appendChild(tip);
    }

    function heading(text) {
        return ET.create('h4', null, text);
    }

    function switchRow(label, checked, onChange) {
        var row = ET.create('label', 'et-drawer__switch');
        row.appendChild(ET.create('span', null, label));
        var inp = document.createElement('input');
        inp.type = 'checkbox';
        inp.checked = !!checked;
        inp.addEventListener('change', function () { onChange(inp.checked); });
        row.appendChild(inp);
        return row;
    }

    /* ---------- 事件 ---------- */

    els.inpQuery.addEventListener('input', function () {
        var q = els.inpQuery.value.trim();
        if (q.length === 1 && MAP[q]) { tryQuery(); }
    });
    els.inpQuery.addEventListener('keydown', function (ev) {
        if (ev.key === 'Enter') { ev.preventDefault(); tryQuery(); }
    });

    els.filters.addEventListener('click', function (ev) {
        var btn = ev.target.closest ? ev.target.closest('.so-fbtn') : null;
        if (!btn) { return; }
        state.filter = btn.getAttribute('data-pick') || '';
        renderFilterBtns();
        renderGrid();
    });

    els.charGrid.addEventListener('click', function (ev) {
        var btn = ev.target.closest ? ev.target.closest('.so-char') : null;
        if (!btn) { return; }
        select(btn.getAttribute('data-c'));
    });

    els.steps.addEventListener('click', function (ev) {
        var btn = ev.target.closest ? ev.target.closest('.so-step') : null;
        if (!btn) { return; }
        stopPlay();
        setCur(parseInt(btn.getAttribute('data-i'), 10) || 0);
    });

    els.btnNext.addEventListener('click', next);
    els.btnNextTop.addEventListener('click', next);
    els.btnPrev.addEventListener('click', prev);
    els.btnReset.addEventListener('click', reset);
    els.btnPlay.addEventListener('click', togglePlay);

    document.addEventListener('keydown', function (ev) {
        var tag = (ev.target && ev.target.tagName) || '';
        if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') { return; }
        if (document.querySelector('.et-modal, .et-drawer-backdrop')) { return; }

        if (ev.code === 'Space' || ev.key === 'ArrowRight') {
            ev.preventDefault();
            next();
        } else if (ev.key === 'ArrowLeft') {
            ev.preventDefault();
            prev();
        } else if (ev.key === 'r' || ev.key === 'R') {
            reset();
        }
    });

    /* ---------- 初始化 ---------- */

    (function init() {
        state.grid = store.get('grid', true) !== false;
        state.loop = store.get('loop', false) === true;
        var sp = store.get('speed', 'normal');
        state.speed = SPEEDS[sp] ? sp : 'normal';
        var ch = store.get('char', '一');
        state.char = MAP[ch] ? ch : '一';
        state.cur = 0;

        renderAll();
        renderGrid();
        chrome.setStatus(item().char + ' · 共 ' + item().count + ' 画');
    })();
})();
</script>

</body>
</html>
