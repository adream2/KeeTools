/* ============ 设计令牌 ============ */
:root {
    --et-accent: #2563eb;
    --et-accent-weak: rgba(37, 99, 235, .14);
    --et-bg: #f4f6fb;
    --et-surface: #ffffff;
    --et-surface-2: #f8fafc;
    --et-fg: #0b1220;
    --et-muted: #64748b;
    --et-line: rgba(15, 23, 42, .12);
    --et-line-strong: rgba(15, 23, 42, .22);
    --et-glass: rgba(255, 255, 255, .85);
    --et-shadow-md: 0 10px 28px -18px rgba(15, 23, 42, .3);
    --et-shadow-lg: 0 24px 60px -32px rgba(15, 23, 42, .4);
    --et-ok: #059669;
    --et-warn: #d97706;
    --et-err: #dc2626;
    --et-radius: 12px;
    --et-radius-sm: 9px;
    --et-font: -apple-system, BlinkMacSystemFont, "Segoe UI",
               "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei",
               "Noto Sans SC", sans-serif;
    --et-mono: ui-monospace, "Cascadia Mono", Consolas, Menlo, monospace;
}

html[data-et-theme="dark"] {
    --et-bg: #0b1120;
    --et-surface: #111a2e;
    --et-surface-2: #0f1729;
    --et-fg: #f1f5f9;
    --et-muted: #94a3b8;
    --et-line: rgba(148, 163, 184, .18);
    --et-line-strong: rgba(148, 163, 184, .3);
    --et-glass: rgba(17, 26, 46, .85);
    --et-shadow-md: 0 10px 34px -18px rgba(0, 0, 0, .8);
    --et-shadow-lg: 0 24px 70px -30px rgba(0, 0, 0, .9);
    --et-ok: #34d399;
    --et-warn: #fbbf24;
    --et-err: #f87171;
}

/* ============ 基础 ============ */

/* body 作为外壳时必须清掉浏览器默认 8px 外边距，
   否则 iframe 预览中文档会比视口高 16px（底部白边 + 多余滚动） */
body.et-app {
    margin: 0;
}

.et-app {
    position: relative;
    isolation: isolate;
    display: flex;
    flex-direction: column;
    height: 100vh;
    height: 100dvh;
    overflow: hidden;
    background: var(--et-bg);
    color: var(--et-fg);
    font-family: var(--et-font);
    -webkit-font-smoothing: antialiased;
    transition: background .25s, color .25s;
}

/* 极光背景：径向渐变 + 呼吸动画（edupick 品质基线，老内核也不掉帧） */
.et-app::before {
    content: '';
    position: fixed;
    inset: 0;
    z-index: -1;
    pointer-events: none;
    background:
        radial-gradient(46% 40% at 20% 18%, var(--et-accent-weak), transparent 65%),
        radial-gradient(42% 38% at 82% 24%, var(--et-accent-weak), transparent 70%),
        radial-gradient(50% 44% at 55% 95%, rgba(16, 185, 129, .10), transparent 65%);
    animation: et-aurora 16s ease-in-out infinite alternate;
}

@keyframes et-aurora {
    from { opacity: .55; transform: scale(1); }
    to { opacity: 1; transform: scale(1.06); }
}

.et-app *,
.et-app *::before,
.et-app *::after { box-sizing: border-box; }

[hidden] { display: none !important; }

.et-icon {
    width: 18px;
    height: 18px;
    fill: none;
    stroke: currentColor;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
    flex: none;
}

/* ============ 顶栏 ============ */
.et-topbar {
    flex: none;
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 11px 20px;
    border-bottom: 1px solid var(--et-line);
    background: var(--et-glass);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    z-index: 20;
}

.et-brand {
    display: flex;
    align-items: center;
    gap: 10px;
    min-width: 0;
}

.et-brand__dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: var(--et-accent);
    box-shadow: 0 0 0 4px var(--et-accent-weak);
    flex: none;
}

.et-brand__name {
    font-weight: 800;
    font-size: 15px;
    letter-spacing: -.01em;
    white-space: nowrap;
}

.et-brand__sub {
    font-size: 12.5px;
    color: var(--et-muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.et-status {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 5px 14px;
    border-radius: 999px;
    font-size: 12.5px;
    color: var(--et-muted);
    background: var(--et-surface-2);
    border: 1px solid var(--et-line);
    white-space: nowrap;
    max-width: 42vw;
    overflow: hidden;
    text-overflow: ellipsis;
}

.et-status__dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--et-ok);
    flex: none;
    transition: background .2s;
}

.et-status[data-tone="err"] .et-status__dot { background: var(--et-err); }
.et-status[data-tone="warn"] .et-status__dot { background: var(--et-warn); }

.et-actions {
    display: flex;
    align-items: center;
    gap: 7px;
}

.et-icon-btn {
    display: inline-grid;
    place-items: center;
    width: 38px;
    height: 38px;
    font-size: 16px;
    line-height: 1;
    border-radius: 11px;
    border: 1px solid var(--et-line);
    background: var(--et-surface-2);
    color: var(--et-fg);
    cursor: pointer;
    transition: transform .14s, border-color .14s, color .14s, opacity .14s;
    -webkit-tap-highlight-color: transparent;
}

.et-icon-btn:hover {
    border-color: var(--et-accent);
    color: var(--et-accent);
    transform: translateY(-1px);
}

.et-icon-btn:active { transform: translateY(0); }
.et-icon-btn.is-off { opacity: .4; }
.et-icon-btn:focus-visible { outline: 2px solid var(--et-accent); outline-offset: 2px; }

/* ============ 主区默认 ============ */
.et-main {
    flex: 1;
    min-height: 0;
    position: relative;
    overflow: auto;
}

/* ============ 页脚（品牌回流 L2） ============ */
.et-footer {
    flex: none;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 7px 16px;
    font-size: 12px;
    color: var(--et-muted);
    border-top: 1px solid var(--et-line);
    background: var(--et-glass);
    user-select: none;
    z-index: 20;
}

.et-footer a {
    color: inherit;
    text-decoration: none;
    transition: color .14s;
}

.et-footer a:hover { color: var(--et-accent); }

/* ============ 按钮 ============ */
.et-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
    padding: 9px 16px;
    border-radius: 11px;
    font: inherit;
    font-size: 13.5px;
    font-weight: 700;
    border: 1px solid var(--et-line);
    background: var(--et-surface-2);
    color: var(--et-fg);
    cursor: pointer;
    transition: transform .14s, border-color .14s, color .14s, background .14s, box-shadow .14s;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
}

.et-btn:hover {
    border-color: var(--et-accent);
    color: var(--et-accent);
    transform: translateY(-1px);
}

.et-btn:active { transform: translateY(0); }
.et-btn:focus-visible { outline: 2px solid var(--et-accent); outline-offset: 2px; }
.et-btn:disabled { opacity: .45; cursor: not-allowed; transform: none; }

.et-btn--primary {
    background: var(--et-accent);
    border-color: var(--et-accent);
    color: #fff;
    box-shadow: 0 6px 18px -8px var(--et-accent);
}

.et-btn--primary:hover { color: #fff; filter: brightness(1.08); }
.et-btn--primary:disabled { filter: none; }

.et-btn--danger:hover {
    border-color: var(--et-err);
    color: var(--et-err);
}

.et-btn--lg {
    padding: 13px 26px;
    font-size: 16px;
    border-radius: 14px;
}

/* ============ 弹窗 ============ */
.et-modal {
    position: fixed;
    inset: 0;
    z-index: 100;
    display: grid;
    place-items: center;
    padding: 24px;
    background: rgba(2, 6, 23, .55);
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    animation: et-fade .18s ease;
}

.et-modal__panel {
    width: min(680px, 94vw);
    max-height: 86vh;
    max-height: 86dvh;
    display: flex;
    flex-direction: column;
    background: var(--et-surface);
    border: 1px solid var(--et-line);
    border-radius: 16px;
    box-shadow: var(--et-shadow-lg);
    animation: et-pop .2s cubic-bezier(.34, 1.4, .64, 1);
    overflow: hidden;
}

.et-modal__panel--narrow { width: min(460px, 92vw); }
.et-modal__panel--wide { width: min(900px, 94vw); }

.et-modal__head {
    flex: none;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 16px 20px;
    border-bottom: 1px solid var(--et-line);
    font-weight: 800;
    font-size: 15px;
}

.et-modal__head .et-icon-btn {
    margin-left: auto;
    width: 32px;
    height: 32px;
}

.et-modal__body {
    flex: 1;
    min-height: 0;
    overflow: auto;
    padding: 18px 20px;
}

.et-modal__foot {
    flex: none;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 14px 20px;
    border-top: 1px solid var(--et-line);
    background: var(--et-surface-2);
}

.et-modal__foot .spacer { flex: 1; }

@keyframes et-fade {
    from { opacity: 0; }
}

@keyframes et-pop {
    from { opacity: 0; transform: translateY(14px) scale(.97); }
}

/* ============ 轻提示（toast） ============ */
.et-toast {
    position: fixed;
    left: 50%;
    bottom: 56px;
    transform: translateX(-50%) translateY(10px);
    z-index: 120;
    display: flex;
    align-items: center;
    gap: 9px;
    max-width: min(520px, 88vw);
    padding: 11px 18px;
    border-radius: 12px;
    font-size: 13.5px;
    font-weight: 600;
    color: #fff;
    background: rgba(15, 23, 42, .92);
    border: 1px solid rgba(148, 163, 184, .25);
    box-shadow: var(--et-shadow-lg);
    opacity: 0;
    pointer-events: none;
    transition: opacity .22s, transform .22s;
}

.et-toast.is-show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
}

.et-toast[data-tone="ok"] { background: rgba(5, 150, 105, .95); }
.et-toast[data-tone="err"] { background: rgba(220, 38, 38, .95); }
.et-toast[data-tone="warn"] { background: rgba(217, 119, 6, .95); }

/* ============ 设置抽屉（右上角入口，edupick 交互） ============ */
.et-drawer-backdrop {
    position: fixed;
    inset: 0;
    z-index: 90;
    background: rgba(2, 6, 23, .45);
    backdrop-filter: blur(3px);
    -webkit-backdrop-filter: blur(3px);
    opacity: 0;
    transition: opacity .2s;
}

.et-drawer-backdrop.is-open { opacity: 1; }

.et-drawer {
    position: absolute;
    top: 0;
    right: 0;
    height: 100%;
    width: min(400px, 92vw);
    display: flex;
    flex-direction: column;
    background: var(--et-surface);
    border-left: 1px solid var(--et-line);
    box-shadow: var(--et-shadow-lg);
    transform: translateX(100%);
    transition: transform .22s cubic-bezier(.32, .72, .35, 1);
}

.et-drawer-backdrop.is-open .et-drawer { transform: translateX(0); }

.et-drawer__head {
    flex: none;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 15px 18px;
    border-bottom: 1px solid var(--et-line);
    font-weight: 800;
    font-size: 15px;
    color: var(--et-accent);
}

.et-drawer__head .et-icon-btn {
    margin-left: auto;
    width: 32px;
    height: 32px;
}

.et-drawer__body {
    flex: 1;
    min-height: 0;
    overflow: auto;
    padding: 16px 18px 24px;
}

/* 抽屉内容通用小节（工具复用） */
.et-drawer__body h4 {
    margin: 18px 0 8px;
    font-size: 12px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: .08em;
    color: var(--et-muted);
}

.et-drawer__body h4:first-child { margin-top: 0; }

.et-drawer__row {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
}

.et-drawer__tip {
    margin: 8px 0 0;
    font-size: 12px;
    line-height: 1.8;
    color: var(--et-muted);
}

.et-drawer__tip b { color: var(--et-fg); }

.et-drawer__input {
    flex: 1;
    min-width: 0;
    padding: 9px 12px;
    border: 1px solid var(--et-line-strong);
    border-radius: 9px;
    background: var(--et-surface-2);
    color: var(--et-fg);
    font: inherit;
    font-size: 13.5px;
    transition: border-color .14s, box-shadow .14s;
}

.et-drawer__input:focus {
    outline: none;
    border-color: var(--et-accent);
    box-shadow: 0 0 0 3px var(--et-accent-weak);
}

.et-drawer__switch {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 10px 0;
    border-bottom: 1px dashed var(--et-line);
    font-size: 13.5px;
    font-weight: 600;
    color: var(--et-fg);
    cursor: pointer;
    user-select: none;
}

.et-drawer__switch input {
    width: 17px;
    height: 17px;
    accent-color: var(--et-accent);
    cursor: pointer;
}
</style>

        backdrop.appendChild(drawer);
        document.body.appendChild(backdrop);

            backdrop.classList.remove('is-open');

            if (ev.key === 'Escape') { ev.stopPropagation(); close(); }
        }
        document.addEventListener('keydown', onKey);
        backdrop.addEventListener('mousedown', function (ev) {
            if (ev.target === backdrop) { close(); }
        });

        if (typeof build === 'function') {
            /* 兼容两种约定：build 自己往 body 里塞内容，或 return 一个元素节点 */
            var ret = build(body, { close: close });

    function modal(mo) {

            : mo.size === 'wide' ? ' et-modal__panel--wide' : ''));

                btn.type = 'button';
                btn.addEventListener('click', function () {
                    if (b.onClick) { b.onClick(close); } else { close(); }

        }

        backdrop.appendChild(panel);
        document.body.appendChild(backdrop);

        function close() {
            if (backdrop.parentNode) { backdrop.parentNode.removeChild(backdrop); }

/*!
 * et-stats.js — 使用统计模块（模块化，可整体移除）
 *
 * 共享逻辑源。改这里，然后跑：python scripts/sync_shared.py
 * 依赖：无（可脱离 et-util / et-chrome 独立运行）。
 * 全局：ET.Stats
 *
 * ┌────────────────────────────────────────────────────────────────┐
 * │ 说明：本模块只做一件事——工具被打开时向上报端点发一条匿名计数。 │
 * │ · 在线（iframe 内）：宿主页面已服务端计数，本模块不重复上报。   │
 * │ · 离线打开（file:// / 下载单文件 / 离线包）：联网条件具备时，   │
 * │   以 sendBeacon 上报 use_offline 事件（text/plain 免预检）。    │
 * │ · 上报端点 = window.ET_SITE_ORIGIN（由宿主注入或离线包配置）。  │
 * │   未配置端点时本模块完全静默，不发任何请求。                    │
 * │ · **整个 <script> 块可安全删除**：删除后工具其余功能完全正常，  │
 * │   且完全不再发起任何网络请求。                                  │
 * └────────────────────────────────────────────────────────────────┘
 */
(function (global) {
    'use strict';

    var ET = global.ET = global.ET || {};

    var Stats = {
        /** 上报端点来源（站点绝对地址，无协议尾斜杠） */
        endpoint: (typeof global.ET_SITE_ORIGIN === 'string' && /^https?:\/\//.test(global.ET_SITE_ORIGIN))
            ? global.ET_SITE_ORIGIN
            : null,

        _done: {},

        /**
         * 上报一次事件（同一事件同一工具每次页面加载只报一次）。
         * event: 'use_offline' 等；toolId: 工具 id。
         */
        send: function (event, toolId) {
            if (!event || this._done[event + ':' + (toolId || '')]) { return false; }
            if (!this.endpoint) { return false; }
            /* iframe 内由宿主统计，避免双计 */
            try {
                if (global.parent && global.parent !== global) { return false; }
            } catch (err) { return false; }
            /* 断网时挂起，网络恢复自动补报一次 */
            if (global.navigator && global.navigator.onLine === false) {
                var self = this;
                global.addEventListener('online', function () { self.send(event, toolId); }, { once: true });
                return false;
            }

            this._done[event + ':' + (toolId || '')] = true;
            var payload = JSON.stringify({ event: event, tool: toolId || '' });

            try {
                if (global.navigator.sendBeacon) {
                    return global.navigator.sendBeacon(
                        this.endpoint + '/api/track',
                        new Blob([payload], { type: 'text/plain;charset=UTF-8' })
                    );
                }
                global.fetch(this.endpoint + '/api/track', {
                    method: 'POST',
                    body: payload,
                    keepalive: true,
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'text/plain;charset=UTF-8' }
                });
                return true;
            } catch (err) {
                return false;
            }
        }
    };

    ET.Stats = Stats;
})(window);

    function svgEl(tag, cls) {
        var node = document.createElementNS(NS, tag);
        if (cls) { node.setAttribute('class', cls); }
        return node;
    }

    function ptsAttr(pts) {
        var out = [];
        for (var i = 0; i < pts.length; i++) {
            out.push(pts[i][0].toFixed(2) + ',' + pts[i][1].toFixed(2));
        }
        return out.join(' ');
    }

    /* ---------- 镜像几何 ---------- */

    function mirrorX(pts) {
        var out = [];
        for (var i = 0; i < pts.length; i++) { out.push([-pts[i][0], pts[i][1]]); }
        return out;
    }

    function mirrorY(pts) {
        var out = [];
        for (var i = 0; i < pts.length; i++) { out.push([pts[i][0], -pts[i][1]]); }
        return out;
    }

    /** 按当前对称方式生成所有镜像副本（含原笔迹） */
    function mirrored(pts) {
        var out = [pts];
        if (state.mode === 'v') {
            out.push(mirrorX(pts));
        } else if (state.mode === 'h') {
            out.push(mirrorY(pts));
        } else {
            out.push(mirrorX(pts), mirrorY(pts));
            var both = [];
            for (var i = 0; i < pts.length; i++) { both.push([-pts[i][0], -pts[i][1]]); }
            out.push(both);
        }
        return out;
    }

    /* ---------- 渲染 ---------- */

    function render() {
        els.stage.innerHTML = '';
        svg = svgEl('svg', 'sd-board' + (state.eraser ? ' is-erase' : ''));
        svg.setAttribute('viewBox', (-HALF) + ' ' + (-HALF) + ' ' + (HALF * 2) + ' ' + (HALF * 2));
        svg.setAttribute('preserveAspectRatio', 'xMidYMid meet');

        /* 网格 */
        if (state.grid) {
            var g = svgEl('g', 'sd-gridlines');
            for (var v = -HALF; v <= HALF; v += GRID) {
                var l1 = svgEl('line');
                l1.setAttribute('x1', v); l1.setAttribute('y1', -HALF);
                l1.setAttribute('x2', v); l1.setAttribute('y2', HALF);
                g.appendChild(l1);
                var l2 = svgEl('line');
                l2.setAttribute('x1', -HALF); l2.setAttribute('y1', v);
                l2.setAttribute('x2', HALF); l2.setAttribute('y2', v);
                g.appendChild(l2);
            }
            svg.appendChild(g);
        }

        /* 纸面底 */
        var bg = svgEl('rect');
        bg.setAttribute('x', -HALF); bg.setAttribute('y', -HALF);
        bg.setAttribute('width', HALF * 2); bg.setAttribute('height', HALF * 2);
        bg.setAttribute('class', 'sd-paper');
        svg.insertBefore(bg, svg.firstChild);

        /* 对称轴 */
        var axes = svgEl('g', 'sd-axes');
        if (state.mode === 'v' || state.mode === 'vh') {
            var ax = svgEl('line');
            ax.setAttribute('x1', 0); ax.setAttribute('y1', -HALF);
            ax.setAttribute('x2', 0); ax.setAttribute('y2', HALF);
            axes.appendChild(ax);
        }
        if (state.mode === 'h' || state.mode === 'vh') {
            var ay = svgEl('line');
            ay.setAttribute('x1', -HALF); ay.setAttribute('y1', 0);
            ay.setAttribute('x2', HALF); ay.setAttribute('y2', 0);
            axes.appendChild(ay);
        }
        svg.appendChild(axes);

        /* 笔迹与镜像 */
        var gP = svgEl('g', 'sd-strokes');
        for (var i = 0; i < state.strokes.length; i++) {
            addStrokeNodes(gP, state.strokes[i]);
        }
        svg.appendChild(gP);
        els.stage.appendChild(svg);
    }

    function addStrokeNodes(gP, stroke) {
        var copies = mirrored(stroke.pts);
        for (var i = 0; i < copies.length; i++) {
            var pl = svgEl('polyline');
            pl.setAttribute('points', ptsAttr(copies[i]));
            pl.setAttribute('fill', 'none');
            pl.setAttribute('stroke', stroke.c);
            pl.setAttribute('stroke-width', stroke.w);
            pl.setAttribute('stroke-linecap', 'round');
            pl.setAttribute('stroke-linejoin', 'round');
            gP.appendChild(pl);
        }
    }

    /* ---------- 指针交互 ---------- */

    function toWorldPoint(evt) {
        if (!svg) { return null; }
        var ctm = svg.getScreenCTM();
        if (!ctm) { return null; }
        var inv;
        try { inv = ctm.inverse(); } catch (e) { return null; }
        if (typeof DOMPoint === 'function') {
            var p = new DOMPoint(evt.clientX, evt.clientY).matrixTransform(inv);
            return [p.x, p.y];
        }
        if (svg.createSVGPoint) {
            var sp = svg.createSVGPoint();
            sp.x = evt.clientX; sp.y = evt.clientY;
            var r = sp.matrixTransform(inv);
            return [r.x, r.y];
        }
        return null;
    }

    function distToSeg(p, a, b) {
        var vx = b[0] - a[0], vy = b[1] - a[1];
        var wx = p[0] - a[0], wy = p[1] - a[1];
        var len2 = vx * vx + vy * vy;
        var t = len2 > 0 ? Math.max(0, Math.min(1, (wx * vx + wy * vy) / len2)) : 0;
        return Math.hypot(p[0] - (a[0] + t * vx), p[1] - (a[1] + t * vy));
    }

    /** 橡皮：命中任一镜像副本即删除整条笔迹 */
    function eraseAt(pt) {
        var TH = 6;
        for (var i = state.strokes.length - 1; i >= 0; i--) {
            var copies = mirrored(state.strokes[i].pts);
            for (var c = 0; c < copies.length; c++) {
                var pts = copies[c];
                for (var k = 0; k < pts.length - 1; k++) {
                    if (distToSeg(pt, pts[k], pts[k + 1]) < TH) {
                        state.strokes.splice(i, 1);
                        persist();
                        render();
                        return;
                    }
                }
            }
        }
    }

    function onDown(evt) {
        var pt = toWorldPoint(evt);
        if (!pt) { return; }
        if (state.eraser) {
            erasing = true;
            eraseAt(pt);
            evt.preventDefault();
            return;
        }
        liveStroke = {
            c: COLORS[state.color],
            w: WIDTHS[state.width],
            pts: [pt],
            node: null
        };
        var copies = mirrored(liveStroke.pts);
        liveStroke.nodes = [];
        for (var i = 0; i < copies.length; i++) {
            var pl = svgEl('polyline');
            pl.setAttribute('fill', 'none');
            pl.setAttribute('stroke', liveStroke.c);
            pl.setAttribute('stroke-width', liveStroke.w);
            pl.setAttribute('stroke-linecap', 'round');
            pl.setAttribute('stroke-linejoin', 'round');
            svg.querySelector('.sd-strokes').appendChild(pl);
            liveStroke.nodes.push(pl);
        }
        evt.preventDefault();
    }

    function onMove(evt) {
        if (erasing) {
            var pe = toWorldPoint(evt);
            if (pe) { eraseAt(pe); }
            return;
        }
        if (!liveStroke) { return; }
        var pt = toWorldPoint(evt);
        if (!pt) { return; }
        var last = liveStroke.pts[liveStroke.pts.length - 1];
        if (Math.hypot(pt[0] - last[0], pt[1] - last[1]) < 1.2) { return; }
        liveStroke.pts.push(pt);
        var copies = mirrored(liveStroke.pts);
        for (var i = 0; i < liveStroke.nodes.length && i < copies.length; i++) {
            liveStroke.nodes[i].setAttribute('points', ptsAttr(copies[i]));
        }
        evt.preventDefault();
    }

    function onUp() {
        if (erasing) { erasing = false; return; }
        if (!liveStroke) { return; }
        if (liveStroke.pts.length >= 2 && state.strokes.length < 400) {
            state.strokes.push({ c: liveStroke.c, w: liveStroke.w, pts: liveStroke.pts });
            persist();
        } else if (liveStroke.nodes) {
            for (var i = 0; i < liveStroke.nodes.length; i++) {
                if (liveStroke.nodes[i].parentNode) {
                    liveStroke.nodes[i].parentNode.removeChild(liveStroke.nodes[i]);
                }
            }
        }
        liveStroke = null;
    }

    /* ---------- 工具栏 ---------- */

    function buildToolbar() {
        for (var i = 0; i < COLORS.length; i++) {
            (function (idx) {
                var b = document.createElement('button');
                b.type = 'button';
                b.className = 'sd-color' + (idx === state.color ? ' is-on' : '');
                b.style.background = COLORS[idx];
                b.title = '颜色 ' + (idx + 1);
                b.addEventListener('click', function () {
                    state.color = idx;
                    state.eraser = false;
                    syncToolbar();
                });
                els.colors.appendChild(b);
            })(i);
        }
        for (var w = 0; w < WIDTHS.length; w++) {
            (function (idx) {
                var b = document.createElement('button');
                b.type = 'button';
                b.className = 'sd-width' + (idx === state.width ? ' is-on' : '');
                b.title = WIDTH_LABELS[idx];
                var bar = document.createElement('i');
                bar.style.width = (6 + idx * 5) + 'px';
                bar.style.height = (2 + idx * 2.5) + 'px';
                b.appendChild(bar);
                b.addEventListener('click', function () {
                    state.width = idx;
                    syncToolbar();
                });
                els.widths.appendChild(b);
            })(w);
        }
    }

    function syncToolbar() {
        var colorBtns = els.colors.children;
        for (var i = 0; i < colorBtns.length; i++) {
            colorBtns[i].className = 'sd-color' + (i === state.color && !state.eraser ? ' is-on' : '');
        }
        var widthBtns = els.widths.children;
        for (var j = 0; j < widthBtns.length; j++) {
            widthBtns[j].className = 'sd-width' + (j === state.width && !state.eraser ? ' is-on' : '');
        }
        els.eraser.classList.toggle('et-btn--primary', state.eraser);
        if (svg) { svg.setAttribute('class', 'sd-board' + (state.eraser ? ' is-erase' : '')); }
        persist();
    }

    function setMode(mode) {
        if (MODES.indexOf(mode) < 0) { return; }
        state.mode = mode;
        var btns = els.modes.getElementsByTagName('button');
        for (var i = 0; i < btns.length; i++) {
            btns[i].className = btns[i].getAttribute('data-mode') === mode ? 'is-on' : '';
        }
        persist();
        render();
    }

    /* ---------- 打印 ---------- */

    function doPrint() {
        if (typeof window.print !== 'function') { chrome.toast('当前环境不支持打印', 'err'); return; }
        var old = document.querySelector('.sd-print');
        if (old && old.parentNode) { old.parentNode.removeChild(old); }
        var wrap = document.createElement('div');
        wrap.className = 'sd-print';
        var title = document.createElement('div');
        title.className = 'sd-print__title';
        title.textContent = '轴对称对称画';
        wrap.appendChild(title);
        var sub = document.createElement('div');
        sub.className = 'sd-print__sub';
        var modeName = { v: '左右对称', h: '上下对称', vh: '四象限对称' }[state.mode] || '';
        sub.textContent = '对称方式：' + modeName + '　｜　姓名：____________　日期：__________';
        wrap.appendChild(sub);
        if (svg) {
            var clone = svg.cloneNode(true);
            clone.setAttribute('class', 'sd-print__svg');
            wrap.appendChild(clone);
        }
        document.body.appendChild(wrap);
        var done = function () {
            if (wrap.parentNode) { wrap.parentNode.removeChild(wrap); }
        };
        window.addEventListener('afterprint', done, { once: true });
        window.setTimeout(function () {
            try { window.print(); } catch (e) { chrome.toast('打印失败，请用浏览器打印快捷键', 'err'); }
            window.setTimeout(done, 800);
        }, 60);
    }

    /* ---------- 事件 ---------- */

    els.stage.addEventListener('pointerdown', onDown);
    window.addEventListener('pointermove', onMove);
    window.addEventListener('pointerup', onUp);
    window.addEventListener('pointercancel', onUp);

    els.eraser.addEventListener('click', function () {
        state.eraser = !state.eraser;
        syncToolbar();
    });

    els.undo.addEventListener('click', function () {
        if (state.strokes.length) {
            state.strokes.pop();
            persist();
            render();
        }
    });

    els.clear.addEventListener('click', function () {
        chrome.modal({
            title: '清空画布',
            icon: 'i-trash',
            size: 'narrow',
            body: '确定要擦掉全部 ' + state.strokes.length + ' 条笔迹吗？清空后无法恢复。',
            buttons: [
                { label: '取消' },
                {
                    label: '清空', danger: true,
                    onClick: function (close) {
                        state.strokes = [];
                        persist();
                        render();
                        close();
                        chrome.toast('已清空');
                    }
                }
            ]
        });
    });

    els.modes.addEventListener('click', function (ev) {
        var btn = ev.target.closest ? ev.target.closest('[data-mode]') : null;
        if (btn) { setMode(btn.getAttribute('data-mode')); }
    });

    els.grid.addEventListener('change', function () {
        state.grid = this.checked;
        persist();
        render();
    });

    els.print.addEventListener('click', doPrint);

    document.addEventListener('keydown', function (e) {
        if (isTypingTarget(e.target)) { return; }
        if ((e.ctrlKey || e.metaKey) && (e.key === 'z' || e.key === 'Z')) {
            e.preventDefault();
            if (state.strokes.length) {
                state.strokes.pop();
                persist();
                render();
            }
            return;
        }
        var k = e.key;
        if (k === '1') { setMode('v'); }
        else if (k === '2') { setMode('h'); }
        else if (k === '3') { setMode('vh'); }
        else if (k === 'e' || k === 'E') { state.eraser = !state.eraser; syncToolbar(); }
        else if ((k === 'p' || k === 'P') && !e.ctrlKey && !e.metaKey) { doPrint(); }
    });

    /* ---------- 启动 ---------- */

    buildToolbar();
    syncToolbar();
    els.grid.checked = state.grid;
    var modeBtns = els.modes.getElementsByTagName('button');
    for (var m = 0; m < modeBtns.length; m++) {
        modeBtns[m].className = modeBtns[m].getAttribute('data-mode') === state.mode ? 'is-on' : '';
    }
    render();
})();
</script>

</body>
</html>
