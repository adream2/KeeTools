<style>
  /* 此块由 scripts/sync_shared.py 自动注入，请勿手工修改 */
/*!
 * et-chrome.css — 工具通用外壳样式（顶栏 / 页脚 / 弹窗 / 按钮 / 主题）
 *
 * 共享样式源。改这里，然后跑：python scripts/sync_shared.py
 * 所有类名带 et- 前缀，避免与工具自身样式冲突。
 * 依赖：无外部资源；颜色全部为令牌变量。
 */

/* ============ 设计令牌 ============ */
:root {
    --et-accent: #2563eb;
    --et-accent-weak: rgba(37, 99, 235, .14);
    --et-bg: #f4f6fb;
    --et-surface: #ffffff;
    --et-surface-2: #f8fafc;
    --et-fg: #0b1220;
    --et-muted: #64748b;
    --et-line: rgba(15, 23, 42, .12);
    --et-line-strong: rgba(15, 23, 42, .22);
    --et-glass: rgba(255, 255, 255, .85);
    --et-shadow-md: 0 10px 28px -18px rgba(15, 23, 42, .3);
    --et-shadow-lg: 0 24px 60px -32px rgba(15, 23, 42, .4);
    --et-ok: #059669;
    --et-warn: #d97706;
    --et-err: #dc2626;
    --et-radius: 12px;
    --et-radius-sm: 9px;
    --et-font: -apple-system, BlinkMacSystemFont, "Segoe UI",
               "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei",
               "Noto Sans SC", sans-serif;
    --et-mono: ui-monospace, "Cascadia Mono", Consolas, Menlo, monospace;
}

html[data-et-theme="dark"] {
    --et-bg: #0b1120;
    --et-surface: #111a2e;
    --et-surface-2: #0f1729;
    --et-fg: #f1f5f9;
    --et-muted: #94a3b8;
    --et-line: rgba(148, 163, 184, .18);
    --et-line-strong: rgba(148, 163, 184, .3);
    --et-glass: rgba(17, 26, 46, .85);
    --et-shadow-md: 0 10px 34px -18px rgba(0, 0, 0, .8);
    --et-shadow-lg: 0 24px 70px -30px rgba(0, 0, 0, .9);
    --et-ok: #34d399;
    --et-warn: #fbbf24;
    --et-err: #f87171;
}

/* ============ 基础 ============ */

/* body 作为外壳时必须清掉浏览器默认 8px 外边距，
   否则 iframe 预览中文档会比视口高 16px（底部白边 + 多余滚动） */
body.et-app {
    margin: 0;
}

.et-app {
    position: relative;
    isolation: isolate;
    display: flex;
    flex-direction: column;
    height: 100vh;
    height: 100dvh;
    overflow: hidden;
    background: var(--et-bg);
    color: var(--et-fg);
    font-family: var(--et-font);
    -webkit-font-smoothing: antialiased;
    transition: background .25s, color .25s;
}

/* 极光背景：径向渐变 + 呼吸动画（edupick 品质基线，老内核也不掉帧） */
.et-app::before {
    content: '';
    position: fixed;
    inset: 0;
    z-index: -1;
    pointer-events: none;
    background:
        radial-gradient(46% 40% at 20% 18%, var(--et-accent-weak), transparent 65%),
        radial-gradient(42% 38% at 82% 24%, var(--et-accent-weak), transparent 70%),
        radial-gradient(50% 44% at 55% 95%, rgba(16, 185, 129, .10), transparent 65%);
    animation: et-aurora 16s ease-in-out infinite alternate;
}

@keyframes et-aurora {
    from { opacity: .55; transform: scale(1); }
    to { opacity: 1; transform: scale(1.06); }
}

.et-app *,
.et-app *::before,
.et-app *::after { box-sizing: border-box; }

[hidden] { display: none !important; }

.et-icon {
    width: 18px;
    height: 18px;
    fill: none;
    stroke: currentColor;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
    flex: none;
}

/* ============ 顶栏 ============ */
.et-topbar {
    flex: none;
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 11px 20px;
    border-bottom: 1px solid var(--et-line);
    background: var(--et-glass);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    z-index: 20;
}

.et-brand {
    display: flex;
    align-items: center;
    gap: 10px;
    min-width: 0;
}

.et-brand__dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: var(--et-accent);
    box-shadow: 0 0 0 4px var(--et-accent-weak);
    flex: none;
}

.et-brand__name {
    font-weight: 800;
    font-size: 15px;
    letter-spacing: -.01em;
    white-space: nowrap;
}

.et-brand__sub {
    font-size: 12.5px;
    color: var(--et-muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.et-status {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 5px 14px;
    border-radius: 999px;
    font-size: 12.5px;
    color: var(--et-muted);
    background: var(--et-surface-2);
    border: 1px solid var(--et-line);
    white-space: nowrap;
    max-width: 42vw;
    overflow: hidden;
    text-overflow: ellipsis;
}

.et-status__dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--et-ok);
    flex: none;
    transition: background .2s;
}

.et-status[data-tone="err"] .et-status__dot { background: var(--et-err); }
.et-status[data-tone="warn"] .et-status__dot { background: var(--et-warn); }

.et-actions {
    display: flex;
    align-items: center;
    gap: 7px;
}

.et-icon-btn {
    display: inline-grid;
    place-items: center;
    width: 38px;
    height: 38px;
    font-size: 16px;
    line-height: 1;
    border-radius: 11px;
    border: 1px solid var(--et-line);
    background: var(--et-surface-2);
    color: var(--et-fg);
    cursor: pointer;
    transition: transform .14s, border-color .14s, color .14s, opacity .14s;
    -webkit-tap-highlight-color: transparent;
}

.et-icon-btn:hover {
    border-color: var(--et-accent);
    color: var(--et-accent);
    transform: translateY(-1px);
}

.et-icon-btn:active { transform: translateY(0); }
.et-icon-btn.is-off { opacity: .4; }
.et-icon-btn:focus-visible { outline: 2px solid var(--et-accent); outline-offset: 2px; }

/* ============ 主区默认 ============ */
.et-main {
    flex: 1;
    min-height: 0;
    position: relative;
    overflow: auto;
}

/* ============ 页脚（品牌回流 L2） ============ */
.et-footer {
    flex: none;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 7px 16px;
    font-size: 12px;
    color: var(--et-muted);
    border-top: 1px solid var(--et-line);
    background: var(--et-glass);
    user-select: none;
    z-index: 20;
}

.et-footer a {
    color: inherit;
    text-decoration: none;
    transition: color .14s;
}

.et-footer a:hover { color: var(--et-accent); }

/* ============ 按钮 ============ */
.et-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
    padding: 9px 16px;
    border-radius: 11px;
    font: inherit;
    font-size: 13.5px;
    font-weight: 700;
    border: 1px solid var(--et-line);
    background: var(--et-surface-2);
    color: var(--et-fg);
    cursor: pointer;
    transition: transform .14s, border-color .14s, color .14s, background .14s, box-shadow .14s;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
}

.et-btn:hover {
    border-color: var(--et-accent);
    color: var(--et-accent);
    transform: translateY(-1px);
}

.et-btn:active { transform: translateY(0); }
.et-btn:focus-visible { outline: 2px solid var(--et-accent); outline-offset: 2px; }
.et-btn:disabled { opacity: .45; cursor: not-allowed; transform: none; }

.et-btn--primary {
    background: var(--et-accent);
    border-color: var(--et-accent);
    color: #fff;
    box-shadow: 0 6px 18px -8px var(--et-accent);
}

.et-btn--primary:hover { color: #fff; filter: brightness(1.08); }
.et-btn--primary:disabled { filter: none; }

.et-btn--danger:hover {
    border-color: var(--et-err);
    color: var(--et-err);
}

.et-btn--lg {
    padding: 13px 26px;
    font-size: 16px;
    border-radius: 14px;
}

/* ============ 弹窗 ============ */
.et-modal {
    position: fixed;
    inset: 0;
    z-index: 100;
    display: grid;
    place-items: center;
    padding: 24px;
    background: rgba(2, 6, 23, .55);
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    animation: et-fade .18s ease;
}

.et-modal__panel {
    width: min(680px, 94vw);
    max-height: 86vh;
    max-height: 86dvh;
    display: flex;
    flex-direction: column;
    background: var(--et-surface);
    border: 1px solid var(--et-line);
    border-radius: 16px;
    box-shadow: var(--et-shadow-lg);
    animation: et-pop .2s cubic-bezier(.34, 1.4, .64, 1);
    overflow: hidden;
}

.et-modal__panel--narrow { width: min(460px, 92vw); }
.et-modal__panel--wide { width: min(900px, 94vw); }

.et-modal__head {
    flex: none;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 16px 20px;
    border-bottom: 1px solid var(--et-line);
    font-weight: 800;
    font-size: 15px;
}

.et-modal__head .et-icon-btn {
    margin-left: auto;
    width: 32px;
    height: 32px;
}

.et-modal__body {
    flex: 1;
    min-height: 0;
    overflow: auto;
    padding: 18px 20px;
}

.et-modal__foot {
    flex: none;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 14px 20px;
    border-top: 1px solid var(--et-line);
    background: var(--et-surface-2);
}

.et-modal__foot .spacer { flex: 1; }

@keyframes et-fade {
    from { opacity: 0; }
}

@keyframes et-pop {
    from { opacity: 0; transform: translateY(14px) scale(.97); }
}

/* ============ 轻提示（toast） ============ */
.et-toast {
    position: fixed;
    left: 50%;
    bottom: 56px;
    transform: translateX(-50%) translateY(10px);
    z-index: 120;
    display: flex;
    align-items: center;
    gap: 9px;
    max-width: min(520px, 88vw);
    padding: 11px 18px;
    border-radius: 12px;
    font-size: 13.5px;
    font-weight: 600;
    color: #fff;
    background: rgba(15, 23, 42, .92);
    border: 1px solid rgba(148, 163, 184, .25);
    box-shadow: var(--et-shadow-lg);
    opacity: 0;
    pointer-events: none;
    transition: opacity .22s, transform .22s;
}

.et-toast.is-show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
}

.et-toast[data-tone="ok"] { background: rgba(5, 150, 105, .95); }
.et-toast[data-tone="err"] { background: rgba(220, 38, 38, .95); }
.et-toast[data-tone="warn"] { background: rgba(217, 119, 6, .95); }

/* ============ 设置抽屉（右上角入口，edupick 交互） ============ */
.et-drawer-backdrop {
    position: fixed;
    inset: 0;
    z-index: 90;
    background: rgba(2, 6, 23, .45);
    backdrop-filter: blur(3px);
    -webkit-backdrop-filter: blur(3px);
    opacity: 0;
    transition: opacity .2s;
}

.et-drawer-backdrop.is-open { opacity: 1; }

.et-drawer {
    position: absolute;
    top: 0;
    right: 0;
    height: 100%;
    width: min(400px, 92vw);
    display: flex;
    flex-direction: column;
    background: var(--et-surface);
    border-left: 1px solid var(--et-line);
    box-shadow: var(--et-shadow-lg);
    transform: translateX(100%);
    transition: transform .22s cubic-bezier(.32, .72, .35, 1);
}

.et-drawer-backdrop.is-open .et-drawer { transform: translateX(0); }

.et-drawer__head {
    flex: none;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 15px 18px;
    border-bottom: 1px solid var(--et-line);
    font-weight: 800;
    font-size: 15px;
    color: var(--et-accent);
}

.et-drawer__head .et-icon-btn {
    margin-left: auto;
    width: 32px;
    height: 32px;
}

.et-drawer__body {
    flex: 1;
    min-height: 0;
    overflow: auto;
    padding: 16px 18px 24px;
}

/* 抽屉内容通用小节（工具复用） */
.et-drawer__body h4 {
    margin: 18px 0 8px;
    font-size: 12px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: .08em;
    color: var(--et-muted);
}

.et-drawer__body h4:first-child { margin-top: 0; }

.et-drawer__row {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
}

.et-drawer__tip {
    margin: 8px 0 0;
    font-size: 12px;
    line-height: 1.8;
    color: var(--et-muted);
}

.et-drawer__tip b { color: var(--et-fg); }

.et-drawer__input {
    flex: 1;
    min-width: 0;
    padding: 9px 12px;
    border: 1px solid var(--et-line-strong);
    border-radius: 9px;
    background: var(--et-surface-2);
    color: var(--et-fg);
    font: inherit;
    font-size: 13.5px;
    transition: border-color .14s, box-shadow .14s;
}

.et-drawer__input:focus {
    outline: none;
    border-color: var(--et-accent);
    box-shadow: 0 0 0 3px var(--et-accent-weak);
}

.et-drawer__switch {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 10px 0;
    border-bottom: 1px dashed var(--et-line);
    font-size: 13.5px;
    font-weight: 600;
    color: var(--et-fg);
    cursor: pointer;
    user-select: none;
}

.et-drawer__switch input {
    width: 17px;
    height: 17px;
    accent-color: var(--et-accent);
    cursor: pointer;
}
</style>

<svg xmlns="http://www.w3.org/2000/svg" style="display:none" aria-hidden="true">
  <!--
    工具用图标 symbol 集合（内联源，独立于网站 sprite）。

      .et-icon { fill:none; stroke:currentColor; stroke-width:2;

        var body = el('div', 'et-modal__body');
        if (typeof mo.body === 'string') { body.innerHTML = mo.body; }
        else if (mo.body) { body.appendChild(mo.body); }

        var foot = null;
        if (mo.buttons && mo.buttons.length) {
            foot = el('div', 'et-modal__foot');
            foot.appendChild(el('span', 'spacer'));
            mo.buttons.forEach(function (b) {
                var btn = el('button', 'et-btn' + (b.primary ? ' et-btn--primary' : '') + (b.danger ? ' et-btn--danger' : ''), b.label);
                btn.type = 'button';
                btn.addEventListener('click', function () {
                    if (b.onClick) { b.onClick(close); } else { close(); }
                });
                foot.appendChild(btn);
            });
            panel.appendChild(foot);
        }

        backdrop.appendChild(panel);
        document.body.appendChild(backdrop);

        function close() {
            if (backdrop.parentNode) { backdrop.parentNode.removeChild(backdrop); }
            document.removeEventListener('keydown', onKey);
            if (mo.onClose) { mo.onClose(); }
        }
        function onKey(ev) {
            if (ev.key === 'Escape') { ev.stopPropagation(); close(); }
        }
        document.addEventListener('keydown', onKey);
        backdrop.addEventListener('mousedown', function (ev) {
            if (ev.target === backdrop) { close(); }
        });

        return { panel: panel, body: body, foot: foot, close: close };

    var toastEl = null;
    var toastTimer = 0;

    function toast(msg, tone) {
        if (!toastEl) {
            toastEl = el('div', 'et-toast');

        toastEl.textContent = msg;
        toastEl.setAttribute('data-tone', tone || '');
        void toastEl.offsetWidth;
        toastEl.classList.add('is-show');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(function () { toastEl.classList.remove('is-show'); }, 2200);

    /* ---------- PWA 元数据（blob manifest，环境不支持时静默跳过） ---------- */

    function installPwa(toolId, title, accent) {
        try {
            var theme = document.querySelector('meta[name="theme-color"]');
            if (!theme) {
                theme = document.createElement('meta');
                theme.setAttribute('name', 'theme-color');
                document.head.appendChild(theme);
            }
            theme.setAttribute('content', accent || '#2563eb');

            var svg = '<svg xmlns="' + NS_SVG + '" viewBox="0 0 64 64">' +
                '<rect width="64" height="64" rx="14" fill="' + (accent || '#2563eb') + '"/>' +
                '<text x="32" y="43" font-size="32" font-weight="800" font-family="sans-serif" ' +
                'fill="#fff" text-anchor="middle">' + (title || '课').charAt(0) + '</text></svg>';
            var iconUri = 'data:image/svg+xml,' + encodeURIComponent(svg);

            var mf = {

                short_name: title || '课工具',
                start_url: '.',
                display: 'standalone',
                background_color: '#f4f6fb',
                theme_color: accent || '#2563eb',
                icons: [{ src: iconUri, sizes: 'any', type: 'image/svg+xml', purpose: 'any' }]
            };
            var blob = new Blob([JSON.stringify(mf)], { type: 'application/manifest+json' });
            var link = document.createElement('link');
            link.rel = 'manifest';
            link.href = URL.createObjectURL(blob);
            document.head.appendChild(link);

    /* ---------- 挂载 ---------- */

    function mount(options) {

        brand.appendChild(nameWrap);

        function toggleFullscreen() {
            var root = document.documentElement;

            if (fsEl) {

            } else {
                var req = root.requestFullscreen || root.webkitRequestFullscreen;
                if (req) { try { req.call(root); } catch (err) { /* 忽略 */ } }
            }
        }

        function syncFsIcon(on) {
            if (!fsBtn) { return; }

        document.addEventListener('fullscreenchange', function () {
            syncFsIcon(!!(document.fullscreenElement || document.webkitFullscreenElement));
        });
        document.addEventListener('webkitfullscreenchange', function () {
            syncFsIcon(!!(document.fullscreenElement || document.webkitFullscreenElement));
        });
        syncFsIcon(false);

        api.toggleFullscreen = toggleFullscreen;

        /* ---------- 音效 API ---------- */
        api.beep = function (kind) {
            if (!soundEnabled) { return; }
            playBeep(kind);
        };
        api.soundOn = function () { return soundEnabled; };

        api.modal = modal;

        /* ---------- 帮助 ---------- */
        function openHelp() {
            modal({
                title: '使用说明',
                icon: 'i-help',
                size: 'narrow',
                body: opt.help,
                buttons: [{ label: '知道了', primary: true }]
            });
        }
        api.openHelp = openHelp;

        /* ---------- toast ---------- */
        api.toast = toast;

        /* ---------- 页脚（L2 品牌回流，低调一行） ---------- */
        var siteOrigin = typeof global.ET_SITE_ORIGIN === 'string' && /^https?:\/\//.test(global.ET_SITE_ORIGIN)
            ? global.ET_SITE_ORIGIN
            : null;

        function renderFooter() {
            footer.textContent = '';
            footer.appendChild(el('span', null, 'KeeTools 课工具'));
            footer.appendChild(el('span', null, '·'));
            if (siteOrigin) {
                var a = el('a', null, '更多课堂工具');
                a.href = siteOrigin + '/?from=tool-footer&tool=' + encodeURIComponent(toolId);
                a.target = '_blank';
                a.rel = 'noopener';
                footer.appendChild(a);
            } else {
                footer.appendChild(el('span', null, '更多课堂工具'));
            }
        }
        renderFooter();

        /* 站点来源发现：iframe 内向父窗口询问；也可由宿主直接注入 ET_SITE_ORIGIN */
        try {
            if (global.parent && global.parent !== global) {
                global.parent.postMessage(JSON.stringify({ type: 'et-hello', toolId: toolId }), '*');
            }
        } catch (err) { /* 跨域异常忽略 */ }

        global.addEventListener('message', function (ev) {
            var data = ev.data;
            if (typeof data === 'string') {
                try { data = JSON.parse(data); } catch (err) { return; }
            }
            if (!data || typeof data !== 'object') { return; }

            if (data.type === 'et-origin' && typeof data.origin === 'string' && /^https?:\/\//.test(data.origin)) {
                siteOrigin = data.origin;
                if (!global.ET_SITE_ORIGIN) { global.ET_SITE_ORIGIN = data.origin; }
                renderFooter();
            }
            if (data.type === 'et-fullscreen-change' && typeof data.value === 'boolean') {
                syncFsIcon(data.value);
            }
        });

        api.el = { topbar: topbar, main: main, footer: footer, actions: actions };

         * 翻页笔的上下页键在系统层等价于 PageDown / PageUp。
         * 工具通过 opt.primary / opt.secondary 注册动作：
         *   PageDown → primary（主操作，如开始点名 / 开始计时）
         *   PageUp   → secondary（副操作，缺省时同 primary）
         * 输入框聚焦或弹窗/抽屉打开时不响应，避免误触。 */
        if (typeof opt.primary === 'function') {
            document.addEventListener('keydown', function (ev) {
                if (ev.key !== 'PageDown' && ev.key !== 'PageUp') { return; }
                var tag = (document.activeElement && document.activeElement.tagName) || '';
                if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') { return; }
                if (document.querySelector('.et-modal, .et-drawer-backdrop, .ws-winner')) { return; }
                ev.preventDefault();
                if (ev.key === 'PageDown') { opt.primary(); }
                else if (typeof opt.secondary === 'function') { opt.secondary(); }
                else { opt.primary(); }
            });
        }

        return api;
    }

    global.ET.Chrome = {
        mount: mount,
        modal: modal,
        toast: toast,
        beep: playBeep /* 挂载前的独立音效入口（不经过音效开关） */
    };

<script>
  /* 此块由 scripts/sync_shared.py 自动注入，请勿手工修改 */
/*!
 * et-stats.js — 使用统计模块（模块化，可整体移除）
 *
 * 共享逻辑源。改这里，然后跑：python scripts/sync_shared.py
 * 依赖：无（可脱离 et-util / et-chrome 独立运行）。
 * 全局：ET.Stats
 *
 * ┌────────────────────────────────────────────────────────────────┐
 * │ 说明：本模块只做一件事——工具被打开时向上报端点发一条匿名计数。 │
 * │ · 在线（iframe 内）：宿主页面已服务端计数，本模块不重复上报。   │
 * │ · 离线打开（file:// / 下载单文件 / 离线包）：联网条件具备时，   │
 * │   以 sendBeacon 上报 use_offline 事件（text/plain 免预检）。    │
 * │ · 上报端点 = window.ET_SITE_ORIGIN（由宿主注入或离线包配置）。  │
 * │   未配置端点时本模块完全静默，不发任何请求。                    │
 * │ · **整个 <script> 块可安全删除**：删除后工具其余功能完全正常，  │
 * │   且完全不再发起任何网络请求。                                  │
 * └────────────────────────────────────────────────────────────────┘
 */
(function (global) {
    'use strict';

    var ET = global.ET = global.ET || {};

    var Stats = {
        /** 上报端点来源（站点绝对地址，无协议尾斜杠） */
        endpoint: (typeof global.ET_SITE_ORIGIN === 'string' && /^https?:\/\//.test(global.ET_SITE_ORIGIN))
            ? global.ET_SITE_ORIGIN
            : null,

        _done: {},

        /**
         * 上报一次事件（同一事件同一工具每次页面加载只报一次）。
         * event: 'use_offline' 等；toolId: 工具 id。
         */
        send: function (event, toolId) {
            if (!event || this._done[event + ':' + (toolId || '')]) { return false; }
            if (!this.endpoint) { return false; }
            /* iframe 内由宿主统计，避免双计 */
            try {
                if (global.parent && global.parent !== global) { return false; }
            } catch (err) { return false; }
            /* 断网时挂起，网络恢复自动补报一次 */
            if (global.navigator && global.navigator.onLine === false) {
                var self = this;
                global.addEventListener('online', function () { self.send(event, toolId); }, { once: true });
                return false;
            }

            this._done[event + ':' + (toolId || '')] = true;
            var payload = JSON.stringify({ event: event, tool: toolId || '' });

            try {
                if (global.navigator.sendBeacon) {
                    return global.navigator.sendBeacon(
                        this.endpoint + '/api/track',
                        new Blob([payload], { type: 'text/plain;charset=UTF-8' })
                    );
                }
                global.fetch(this.endpoint + '/api/track', {
                    method: 'POST',
                    body: payload,
                    keepalive: true,
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'text/plain;charset=UTF-8' }
                });
                return true;
            } catch (err) {
                return false;
            }
        }
    };

    ET.Stats = Stats;
})(window);
</script>

            steps.innerHTML = fig.steps;
            panel.appendChild(steps);
        }
        page.appendChild(panel);

        var foot = el('div', 'ae-foot');
        foot.appendChild(el('span', null, 'KeeTools 课工具 · 面积公式推导（图形为示意，比例按数据绘制）'));
        foot.appendChild(el('span', null, '剪拼进度 ' + state.t + '%'));
        page.appendChild(foot);

        return page;
    }

    function pts(list) {
        var out = [];
        for (var i = 0; i < list.length; i++) {
            out.push(list[i][0].toFixed(2) + ',' + list[i][1].toFixed(2));
        }
        return out.join(' ');
    }

    /** 由若干组点求外接框（留 margin 边距），旋转过程中图形不会被裁掉 */
    function fitBox(lists, margin) {
        var minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
        for (var i = 0; i < lists.length; i++) {
            for (var j = 0; j < lists[i].length; j++) {
                minX = Math.min(minX, lists[i][j][0]);
                maxX = Math.max(maxX, lists[i][j][0]);
                minY = Math.min(minY, lists[i][j][1]);
                maxY = Math.max(maxY, lists[i][j][1]);
            }
        }
        if (!isFinite(minX)) { return '0 0 10 6'; }
        return (minX - margin).toFixed(2) + ' ' + (minY - margin).toFixed(2) + ' ' +
            (maxX - minX + margin * 2).toFixed(2) + ' ' + (maxY - minY + margin * 2).toFixed(2);
    }

    function label(x, y, text, color) {
        var node = svgEl('text', 'ae-note');
        node.setAttribute('x', String(x));
        node.setAttribute('y', String(y));
        if (color) { node.setAttribute('fill', color); }
        node.textContent = text;
        return node;
    }

    function dash(x1, y1, x2, y2) {
        var line = svgEl('line');
        line.setAttribute('x1', String(x1)); line.setAttribute('y1', String(y1));
        line.setAttribute('x2', String(x2)); line.setAttribute('y2', String(y2));
        line.setAttribute('stroke', 'var(--ae-cut)');
        line.setAttribute('stroke-width', '0.06');
        line.setAttribute('stroke-dasharray', '0.28 0.2');
        return line;
    }

    function group(children, transform) {
        var g = svgEl('g');
        for (var i = 0; i < children.length; i++) { g.appendChild(children[i]); }
        if (transform) { g.setAttribute('transform', transform); }
        return g;
    }

    /* ---------- 四种图形 ---------- */

    var hint = '';

    function buildFigure() {
        hint = '';
        if (state.shape === 'para') { return buildPara(); }
        if (state.shape === 'tri') { return buildTri(); }
        if (state.shape === 'trap') { return buildTrap(); }
        return buildCircle();
    }

    /** 平行四边形：沿高剪下左边的直角三角形，平移到右边 → 长方形 */
    function buildPara() {
        var b = state.b, h = state.h, d = Math.min(4, Math.round(b * 0.4));
        var t = state.t / 100;
        var svg = svgEl('svg', 'ae-fig');

        var main = [
            [d, 0], [b, 0], [b + d, h], [d, h]
        ];
        var tri = [
            [0, 0], [d, 0], [d, h]
        ];
        var move = t * b;

        svg.appendChild(group([svgPoly(main, 'var(--ae-a)', 'var(--ae-a-ink)')]));
        svg.appendChild(group([svgPoly(tri, 'var(--ae-b)', 'var(--ae-b-ink)')],
            'translate(' + move.toFixed(2) + ',0)'));
        if (t > 0.02 && t < 0.98) {
            svg.appendChild(dash(d, h, d, 0));
        }

        /* 标注 */
        svg.appendChild(label(d + b / 2, h / 2, '高 ' + h, 'var(--ae-muted)'));
        svg.appendChild(dash(d + b / 2, h, d + b / 2, 0));
        svg.appendChild(label(b / 2 + d / 2, -0.35, '底 ' + b, 'var(--ae-a-ink)'));
        if (t > 0.9) {
            svg.appendChild(label(d + b / 2, h + 0.45, '长方形：长 ' + b + '，宽 ' + h, 'var(--ae-b-ink)'));
        } else {
            svg.appendChild(label(d + b / 2, h + 0.45, '剪下三角形，向右平移到另一边', 'var(--ae-muted)'));
        }
        hint = '拖动滑块：看直角三角形怎么「搬家」';

        var vb = '-1 -1.2 ' + (b + d + 2) + ' ' + (h + 2.4);
        svg.setAttribute('viewBox', vb);
        svg.setAttribute('preserveAspectRatio', 'xMidYMid meet');

        var area = b * h;
        return {
            svg: svg,
            formula: '平行四边形面积 = 底 × 高 = <b>' + b + ' × ' + h + ' = ' + area + '</b>' +
                (t > 0.9 ? '　（剪拼后是长方形：长 = 底，宽 = 高）' : ''),
            steps: '<li>沿高剪下一个直角三角形（两条直角边 = 偏出的距离与高）</li>' +
                '<li>把三角形平移到右边，两条斜边正好拼在一起</li>' +
                '<li>拼成<b>长方形</b>：长 = 平行四边形的底，宽 = 平行四边形的高</li>' +
                '<li>所以：平行四边形面积 = 底 × 高</li>'
        };
    }

    /** 三角形：两个完全一样的三角形，一个旋转 180° → 平行四边形 */
    function buildTri() {
        var b = state.b, h = state.h, d = Math.min(4, Math.round(b * 0.4));
        var t = state.t / 100;
        var svg = svgEl('svg', 'ae-fig');

        var base = [
            [0, 0], [b, 0], [d, h]
        ];
        var mx = (b + d) / 2, my = h / 2;
        var ang = t * 180;

        svg.appendChild(group([svgPoly(base, 'var(--ae-a)', 'var(--ae-a-ink)')]));
        svg.appendChild(group([svgPoly(base, 'var(--ae-b)', 'var(--ae-b-ink)')],
            'rotate(' + ang.toFixed(1) + ' ' + mx.toFixed(2) + ' ' + my.toFixed(2) + ')'));

        svg.appendChild(label(d + 0.15, h / 2, '高 ' + h, 'var(--ae-muted)'));
        svg.appendChild(dash(d, h, d, 0));
        svg.appendChild(label(b / 2, -0.35, '底 ' + b, 'var(--ae-a-ink)'));
        hint = t > 0.9 ? '拼成了平行四边形：底不变，高不变' : '看黄色的三角形转 180° 之后跑到哪里';

        var rotated = base.map(function (p) {
            var dx = p[0] - mx, dy = p[1] - my;
            var rad = ang * Math.PI / 180;   /* 与 SVG rotate(角度) 完全一致（y 向下，正角为顺时针） */
            return [mx + dx * Math.cos(rad) - dy * Math.sin(rad),
                my + dx * Math.sin(rad) + dy * Math.cos(rad)];
        });
        svg.setAttribute('viewBox', fitBox([base, rotated], 1.2));
        svg.setAttribute('preserveAspectRatio', 'xMidYMid meet');

        var area = b * h / 2;
        return {
            svg: svg,
            formula: '三角形面积 = 底 × 高 ÷ 2 = <b>' + b + ' × ' + h + ' ÷ 2 = ' + area + '</b>' +
                (t > 0.9 ? '　（两个完全一样的三角形拼成平行四边形，所以要 ÷2）' : ''),
            steps: '<li>再拿一个<b>完全一样</b>的三角形（黄色）</li>' +
                '<li>绕右边这条边的中点旋转 <b>180°</b></li>' +
                '<li>拼成<b>平行四边形</b>：底 = 三角形的底，高 = 三角形的高</li>' +
                '<li>平行四边形 = 两个三角形 → 三角形面积 = 底 × 高 ÷ 2</li>'
        };
    }

    /** 梯形：两个完全一样的梯形，一个旋转 180° → 平行四边形（底 = 上底 + 下底） */
    function buildTrap() {
        var a = 10, b = 6, h = 4;
        var left = (a - b) / 2;
        var base = [
            [0, 0], [a, 0], [a - left, h], [left, h]
        ];
        var t = state.t / 100;
        var svg = svgEl('svg', 'ae-fig');

        var mx = (a + a - left) / 2, my = h / 2;
        var ang = t * 180;

        svg.appendChild(group([svgPoly(base, 'var(--ae-a)', 'var(--ae-a-ink)')]));
        svg.appendChild(group([svgPoly(base, 'var(--ae-b)', 'var(--ae-b-ink)')],
            'rotate(' + ang.toFixed(1) + ' ' + mx.toFixed(2) + ' ' + my.toFixed(2) + ')'));

        svg.appendChild(label(a / 2, -0.35, '下底 ' + a, 'var(--ae-a-ink)'));
        svg.appendChild(label((left + a - left) / 2 + 0.2, h + 0.4, '上底 ' + b, 'var(--ae-a-ink)'));
        svg.appendChild(label(-0.9, h / 2, '高 ' + h, 'var(--ae-muted)'));
        svg.appendChild(dash(left, h, left, 0));
        hint = t > 0.9 ? '拼成的平行四边形：底 = 上底 + 下底' : '黄色梯形转 180° 后与蓝色拼在一起';

        var rotated = base.map(function (p) {
            var dx = p[0] - mx, dy = p[1] - my;
            var rad = ang * Math.PI / 180;
            return [mx + dx * Math.cos(rad) - dy * Math.sin(rad),
                my + dx * Math.sin(rad) + dy * Math.cos(rad)];
        });
        svg.setAttribute('viewBox', fitBox([base, rotated], 1.4));
        svg.setAttribute('preserveAspectRatio', 'xMidYMid meet');

        var area = (a + b) * h / 2;
        return {
            svg: svg,
            formula: '梯形面积 = (上底 + 下底) × 高 ÷ 2 = <b>(' + b + ' + ' + a + ') × ' + h +
                ' ÷ 2 = ' + area + '</b>',
            steps: '<li>再拿一个<b>完全一样</b>的梯形（黄色），旋转 180°</li>' +
                '<li>拼成<b>平行四边形</b>：底 = 上底 + 下底，高不变</li>' +
                '<li>平行四边形面积 = (上底 + 下底) × 高，它是<b>两个</b>梯形</li>' +
                '<li>所以：梯形面积 = (上底 + 下底) × 高 ÷ 2</li>'
        };
    }

    /** 圆：平均分成若干份，交错拼开 → 近似的长方形（长 ≈ 周长一半，宽 = 半径） */
    function buildCircle() {
        var r = state.r, n = state.n;
        var t = state.t / 100;
        var svg = svgEl('svg', 'ae-fig');

        var delta = 2 * Math.PI / n;
        var ox = r + 0.6, oy = r + 0.6;
        var w = 2 * Math.PI * r / n;
        var x0 = 2 * r + 1.6;
        var yBottom = r + 0.6;
        var yTop = yBottom - r;

        for (var i = 0; i < n; i++) {
            var mid = (i + 0.5) * delta;
            var j = Math.floor(i / 2);
            var flip = i % 2;
            var tx = x0 + (j + 0.5) * w;
            var ty = flip === 0 ? yBottom : yTop;
            var targetDeg = flip === 0 ? -90 : 90;
            var fromDeg = mid * 180 / Math.PI;
            var deg = fromDeg + t * (targetDeg - fromDeg);
            var px = ox + t * (tx - ox);
            var py = oy + t * (ty - oy);

            var sector = svgEl('path');
            var a1 = -delta / 2, a2 = delta / 2;
            sector.setAttribute('d', 'M0,0 L' + (r * Math.cos(a1)).toFixed(3) + ',' +
                (r * Math.sin(a1)).toFixed(3) + ' A' + r + ',' + r + ' 0 0 1 ' +
                (r * Math.cos(a2)).toFixed(3) + ',' + (r * Math.sin(a2)).toFixed(3) + ' Z');
            sector.setAttribute('fill', i % 2 === 0 ? 'var(--ae-a)' : 'var(--ae-b)');
            sector.setAttribute('fill-opacity', '0.85');
            sector.setAttribute('stroke', 'var(--ae-ink)');
            sector.setAttribute('stroke-width', '0.02');
            sector.setAttribute('transform', 'translate(' + px.toFixed(3) + ',' + py.toFixed(3) + ') rotate(' +
                deg.toFixed(1) + ')');
            svg.appendChild(sector);
        }

        svg.appendChild(label(ox, 2 * r + 1.25, '圆：半径 ' + r, 'var(--ae-muted)'));
        svg.appendChild(label(x0 + Math.PI * r / 2, yBottom + 0.55,
            '长 ≈ 周长的一半 = πr ≈ ' + (3.14 * r).toFixed(2), 'var(--ae-a-ink)'));
        hint = t > 0.9 ? '拼成近似的长方形：长 ≈ πr，宽 = r' : '份数越多，拼出的图形越接近长方形';

        var vb = '-0.8 -0.8 ' + (x0 + Math.PI * r + 1.6) + ' ' + (2 * r + 2.6);
        svg.setAttribute('viewBox', vb);
        svg.setAttribute('preserveAspectRatio', 'xMidYMid meet');

        var area = 3.14 * r * r;
        return {
            svg: svg,
            formula: '圆面积 = π × 半径 × 半径 = <b>3.14 × ' + r + ' × ' + r + ' = ' + area.toFixed(2) + '</b>' +
                (t > 0.9 ? '　（长 ≈ πr，宽 = r → 面积 = πr × r = πr²）' : ''),
            steps: '<li>把圆平均分成 <b>' + n + '</b> 份（份数越多越接近长方形）</li>' +
                '<li>交错拼开：上面一排、下面一排</li>' +
                '<li>近似长方形的<b>长</b> ≈ 周长的一半 = πr，<b>宽</b> = 半径 r</li>' +
                '<li>所以：圆面积 = πr × r = πr²</li>'
        };
    }

    function svgPoly(points, fill, stroke) {
        var node = svgEl('polygon');
        node.setAttribute('points', pts(points));
        node.setAttribute('fill', fill);
        node.setAttribute('fill-opacity', '0.85');
        node.setAttribute('stroke', stroke);
        node.setAttribute('stroke-width', '0.06');
        node.setAttribute('stroke-linejoin', 'round');
        return node;
    }

    function updateStat() {
        els.stat.textContent = SHAPE_LABEL[state.shape] + ' · 剪拼进度 ' + state.t + '%';
        els.btnPlay.querySelector('span').textContent = timer ? '暂停' : '播放';
        chrome.setStatus(SHAPE_LABEL[state.shape] + ' · ' + state.t + '%', 'ok');
    }

    function syncSeg() {
        var btns = els.seg.getElementsByTagName('button');
        for (var i = 0; i < btns.length; i++) {
            btns[i].className = btns[i].getAttribute('data-shape') === state.shape ? 'is-on' : '';
        }
    }

    /* ---------- 操作 ---------- */

    function setShape(shape) {
        if (SHAPES.indexOf(shape) < 0 || shape === state.shape) { return; }
        state.shape = shape;
        state.t = 0;
        stopPlay();
        persist();
        render();
    }

    function setT(v) {
        state.t = Math.max(0, Math.min(100, parseInt(v, 10) || 0));
        persist();
        render();
    }

    function playPause() {
        if (timer) { stopPlay(); render(); return; }
        if (state.t >= 100) { state.t = 0; }
        timer = window.setInterval(function () {
            state.t = Math.min(100, state.t + 2);
            els.slider.value = String(state.t);
            if (state.t >= 100) { stopPlay(); try { chrome.beep('ok'); } catch (e) { /* 静默 */ } }
            render();
        }, 45);
        render();
    }

    function stopPlay() {
        if (timer) {
            window.clearInterval(timer);
            timer = null;
        }
    }

    function resetT() {
        stopPlay();
        state.t = 0;
        persist();
        render();
    }

    function doPrint() {
        if (typeof window.print !== 'function') { chrome.toast('当前环境不支持打印', 'err'); return; }
        window.setTimeout(function () {
            try { window.print(); } catch (e) { chrome.toast('打印失败，请用浏览器打印快捷键', 'err'); }
        }, 60);
    }

    /* ---------- 设置 ---------- */

    function options(pairs, current) {
        var out = '';
        for (var i = 0; i < pairs.length; i++) {
            out += '<option value="' + pairs[i][0] + '"' +
                (String(pairs[i][0]) === String(current) ? ' selected' : '') + '>' + pairs[i][1] + '</option>';
        }
        return out;
    }

    function buildSettings(body) {
        body.innerHTML =
            '<h4>图形与数据</h4>' +
            '<div class="et-drawer__row">' +
            '<input class="et-drawer__input" id="aeSetB" type="number" min="4" max="12" value="' + state.b +
            '" style="flex:0 0 84px" title="底（cm）"><span class="etimp-dim">底 / 下底</span>' +
            '<input class="et-drawer__input" id="aeSetH" type="number" min="3" max="8" value="' + state.h +
            '" style="flex:0 0 84px" title="高（cm）"><span class="etimp-dim">高</span>' +
            '</div>' +
            '<div class="et-drawer__row" style="margin-top:8px">' +
            '<input class="et-drawer__input" id="aeSetR" type="number" min="2" max="5" value="' + state.r +
            '" style="flex:0 0 84px" title="半径（cm）"><span class="etimp-dim">半径（圆）</span>' +
            '<select class="et-drawer__input" id="aeSetN">' +
            options([['4', '圆分成 4 份'], ['8', '圆分成 8 份'], ['16', '圆分成 16 份'],
                ['32', '圆分成 32 份']], state.n) +
            '</select></div>' +
            '<p class="et-drawer__tip">数据改动后公式与计算同步更新；梯形固定用「上底 6、下底 10、高 4」演示，' +
            '重点是<b>转化过程</b>而不是数值。</p>' +
            '<p class="et-drawer__tip">演示进度当前 <b>' + state.t + '%</b>。' +
            '建议节奏：先猜 → 拖滑块 → 说结论 → 看公式。</p>';

        var q = function (id) { return document.getElementById(id); };
        q('aeSetB').addEventListener('change', function () {
            state.b = Math.max(4, Math.min(12, parseInt(this.value, 10) || 8));
            this.value = state.b;
            persist(); render();
        });
        q('aeSetH').addEventListener('change', function () {
            state.h = Math.max(3, Math.min(8, parseInt(this.value, 10) || 5));
            this.value = state.h;
            persist(); render();
        });
        q('aeSetR').addEventListener('change', function () {
            state.r = Math.max(2, Math.min(5, parseInt(this.value, 10) || 3));
            this.value = state.r;
            persist(); render();
        });
        q('aeSetN').addEventListener('change', function () {
            state.n = SECTOR_OPTS.indexOf(parseInt(this.value, 10)) >= 0 ? parseInt(this.value, 10) : 16;
            persist(); render();
        });
    }

    /* ---------- 事件与启动 ---------- */

    var segBtns = els.seg.getElementsByTagName('button');
    for (var b = 0; b < segBtns.length; b++) {
        (function (btn) {
            btn.addEventListener('click', function () { setShape(btn.getAttribute('data-shape')); });
        })(segBtns[b]);
    }

    els.slider.addEventListener('input', function () {
        stopPlay();
        setT(this.value);
    });

    els.btnPlay.addEventListener('click', playPause);
    els.btnReset.addEventListener('click', resetT);
    els.btnPrint.addEventListener('click', doPrint);

    document.addEventListener('keydown', function (e) {
        if (isTypingTarget(e.target)) { return; }
        if (e.key === '1') { setShape('para'); }
        else if (e.key === '2') { setShape('tri'); }
        else if (e.key === '3') { setShape('trap'); }
        else if (e.key === '4') { setShape('circle'); }
        else if (e.key === ' ' || e.code === 'Space') { playPause(); e.preventDefault(); }
        else if (e.key === 'ArrowLeft') { stopPlay(); setT(state.t - 2); e.preventDefault(); }
        else if (e.key === 'ArrowRight') { stopPlay(); setT(state.t + 2); e.preventDefault(); }
        else if ((e.key === 'p' || e.key === 'P') && !e.ctrlKey && !e.metaKey) { doPrint(); }
    });

    render();
})();
</script>

</body>
</html>
