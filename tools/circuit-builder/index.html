<style>
  /* 此块由 scripts/sync_shared.py 自动注入，请勿手工修改 */
/*!
 * et-chrome.css — 工具通用外壳样式（顶栏 / 页脚 / 弹窗 / 按钮 / 主题）
 *
 * 共享样式源。改这里，然后跑：python scripts/sync_shared.py
 * 所有类名带 et- 前缀，避免与工具自身样式冲突。
 * 依赖：无外部资源；颜色全部为令牌变量。
 */

/* ============ 设计令牌 ============ */
:root {
    --et-accent: #2563eb;
    --et-accent-weak: rgba(37, 99, 235, .14);
    --et-bg: #f4f6fb;
    --et-surface: #ffffff;
    --et-surface-2: #f8fafc;
    --et-fg: #0b1220;
    --et-muted: #64748b;
    --et-line: rgba(15, 23, 42, .12);
    --et-line-strong: rgba(15, 23, 42, .22);
    --et-glass: rgba(255, 255, 255, .85);
    --et-shadow-md: 0 10px 28px -18px rgba(15, 23, 42, .3);
    --et-shadow-lg: 0 24px 60px -32px rgba(15, 23, 42, .4);
    --et-ok: #059669;
    --et-warn: #d97706;
    --et-err: #dc2626;
    --et-radius: 12px;
    --et-radius-sm: 9px;
    --et-font: -apple-system, BlinkMacSystemFont, "Segoe UI",
               "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei",
               "Noto Sans SC", sans-serif;
    --et-mono: ui-monospace, "Cascadia Mono", Consolas, Menlo, monospace;
}

html[data-et-theme="dark"] {
    --et-bg: #0b1120;
    --et-surface: #111a2e;
    --et-surface-2: #0f1729;
    --et-fg: #f1f5f9;
    --et-muted: #94a3b8;
    --et-line: rgba(148, 163, 184, .18);
    --et-line-strong: rgba(148, 163, 184, .3);
    --et-glass: rgba(17, 26, 46, .85);
    --et-shadow-md: 0 10px 34px -18px rgba(0, 0, 0, .8);
    --et-shadow-lg: 0 24px 70px -30px rgba(0, 0, 0, .9);
    --et-ok: #34d399;
    --et-warn: #fbbf24;
    --et-err: #f87171;
}

/* ============ 基础 ============ */

/* body 作为外壳时必须清掉浏览器默认 8px 外边距，
   否则 iframe 预览中文档会比视口高 16px（底部白边 + 多余滚动） */
body.et-app {
    margin: 0;
}

.et-app {
    position: relative;
    isolation: isolate;
    display: flex;
    flex-direction: column;
    height: 100vh;
    height: 100dvh;
    overflow: hidden;
    background: var(--et-bg);
    color: var(--et-fg);
    font-family: var(--et-font);
    -webkit-font-smoothing: antialiased;
    transition: background .25s, color .25s;
}

/* 极光背景：径向渐变 + 呼吸动画（edupick 品质基线，老内核也不掉帧） */
.et-app::before {
    content: '';
    position: fixed;
    inset: 0;
    z-index: -1;
    pointer-events: none;
    background:
        radial-gradient(46% 40% at 20% 18%, var(--et-accent-weak), transparent 65%),
        radial-gradient(42% 38% at 82% 24%, var(--et-accent-weak), transparent 70%),
        radial-gradient(50% 44% at 55% 95%, rgba(16, 185, 129, .10), transparent 65%);
    animation: et-aurora 16s ease-in-out infinite alternate;
}

@keyframes et-aurora {
    from { opacity: .55; transform: scale(1); }
    to { opacity: 1; transform: scale(1.06); }
}

.et-app *,
.et-app *::before,
.et-app *::after { box-sizing: border-box; }

[hidden] { display: none !important; }

.et-icon {
    width: 18px;
    height: 18px;
    fill: none;
    stroke: currentColor;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
    flex: none;
}

/* ============ 顶栏 ============ */
.et-topbar {
    flex: none;
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 11px 20px;
    border-bottom: 1px solid var(--et-line);
    background: var(--et-glass);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    z-index: 20;
}

.et-brand {
    display: flex;
    align-items: center;
    gap: 10px;
    min-width: 0;
}

.et-brand__dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: var(--et-accent);
    box-shadow: 0 0 0 4px var(--et-accent-weak);
    flex: none;
}

.et-brand__name {
    font-weight: 800;
    font-size: 15px;
    letter-spacing: -.01em;
    white-space: nowrap;
}

.et-brand__sub {
    font-size: 12.5px;
    color: var(--et-muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.et-status {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 5px 14px;
    border-radius: 999px;
    font-size: 12.5px;
    color: var(--et-muted);
    background: var(--et-surface-2);
    border: 1px solid var(--et-line);
    white-space: nowrap;
    max-width: 42vw;
    overflow: hidden;
    text-overflow: ellipsis;
}

.et-status__dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--et-ok);
    flex: none;
    transition: background .2s;
}

.et-status[data-tone="err"] .et-status__dot { background: var(--et-err); }
.et-status[data-tone="warn"] .et-status__dot { background: var(--et-warn); }

.et-actions {
    display: flex;
    align-items: center;
    gap: 7px;
}

.et-icon-btn {
    display: inline-grid;
    place-items: center;
    width: 38px;
    height: 38px;
    font-size: 16px;
    line-height: 1;
    border-radius: 11px;
    border: 1px solid var(--et-line);
    background: var(--et-surface-2);
    color: var(--et-fg);
    cursor: pointer;
    transition: transform .14s, border-color .14s, color .14s, opacity .14s;
    -webkit-tap-highlight-color: transparent;
}

.et-icon-btn:hover {
    border-color: var(--et-accent);
    color: var(--et-accent);
    transform: translateY(-1px);
}

.et-icon-btn:active { transform: translateY(0); }
.et-icon-btn.is-off { opacity: .4; }
.et-icon-btn:focus-visible { outline: 2px solid var(--et-accent); outline-offset: 2px; }

/* ============ 主区默认 ============ */
.et-main {
    flex: 1;
    min-height: 0;
    position: relative;
    overflow: auto;
}

/* ============ 页脚（品牌回流 L2） ============ */
.et-footer {
    flex: none;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 7px 16px;
    font-size: 12px;
    color: var(--et-muted);
    border-top: 1px solid var(--et-line);
    background: var(--et-glass);
    user-select: none;
    z-index: 20;
}

.et-footer a {
    color: inherit;
    text-decoration: none;
    transition: color .14s;
}

.et-footer a:hover { color: var(--et-accent); }

/* ============ 按钮 ============ */
.et-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
    padding: 9px 16px;
    border-radius: 11px;
    font: inherit;
    font-size: 13.5px;
    font-weight: 700;
    border: 1px solid var(--et-line);
    background: var(--et-surface-2);
    color: var(--et-fg);
    cursor: pointer;
    transition: transform .14s, border-color .14s, color .14s, background .14s, box-shadow .14s;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
}

.et-btn:hover {
    border-color: var(--et-accent);
    color: var(--et-accent);
    transform: translateY(-1px);
}

.et-btn:active { transform: translateY(0); }
.et-btn:focus-visible { outline: 2px solid var(--et-accent); outline-offset: 2px; }
.et-btn:disabled { opacity: .45; cursor: not-allowed; transform: none; }

.et-btn--primary {
    background: var(--et-accent);
    border-color: var(--et-accent);
    color: #fff;
    box-shadow: 0 6px 18px -8px var(--et-accent);
}

.et-btn--primary:hover { color: #fff; filter: brightness(1.08); }
.et-btn--primary:disabled { filter: none; }

.et-btn--danger:hover {
    border-color: var(--et-err);
    color: var(--et-err);
}

.et-btn--lg {
    padding: 13px 26px;
    font-size: 16px;
    border-radius: 14px;
}

/* ============ 弹窗 ============ */
.et-modal {
    position: fixed;
    inset: 0;
    z-index: 100;
    display: grid;
    place-items: center;
    padding: 24px;
    background: rgba(2, 6, 23, .55);
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    animation: et-fade .18s ease;
}

.et-modal__panel {
    width: min(680px, 94vw);
    max-height: 86vh;
    max-height: 86dvh;
    display: flex;
    flex-direction: column;
    background: var(--et-surface);
    border: 1px solid var(--et-line);
    border-radius: 16px;
    box-shadow: var(--et-shadow-lg);
    animation: et-pop .2s cubic-bezier(.34, 1.4, .64, 1);
    overflow: hidden;
}

.et-modal__panel--narrow { width: min(460px, 92vw); }
.et-modal__panel--wide { width: min(900px, 94vw); }

.et-modal__head {
    flex: none;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 16px 20px;
    border-bottom: 1px solid var(--et-line);
    font-weight: 800;
    font-size: 15px;
}

.et-modal__head .et-icon-btn {
    margin-left: auto;
    width: 32px;
    height: 32px;
}

.et-modal__body {
    flex: 1;
    min-height: 0;
    overflow: auto;
    padding: 18px 20px;
}

.et-modal__foot {
    flex: none;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 14px 20px;
    border-top: 1px solid var(--et-line);
    background: var(--et-surface-2);
}

.et-modal__foot .spacer { flex: 1; }

@keyframes et-fade {
    from { opacity: 0; }
}

@keyframes et-pop {
    from { opacity: 0; transform: translateY(14px) scale(.97); }
}

/* ============ 轻提示（toast） ============ */
.et-toast {
    position: fixed;
    left: 50%;
    bottom: 56px;
    transform: translateX(-50%) translateY(10px);
    z-index: 120;
    display: flex;
    align-items: center;
    gap: 9px;
    max-width: min(520px, 88vw);
    padding: 11px 18px;
    border-radius: 12px;
    font-size: 13.5px;
    font-weight: 600;
    color: #fff;
    background: rgba(15, 23, 42, .92);
    border: 1px solid rgba(148, 163, 184, .25);
    box-shadow: var(--et-shadow-lg);
    opacity: 0;
    pointer-events: none;
    transition: opacity .22s, transform .22s;
}

.et-toast.is-show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
}

.et-toast[data-tone="ok"] { background: rgba(5, 150, 105, .95); }
.et-toast[data-tone="err"] { background: rgba(220, 38, 38, .95); }
.et-toast[data-tone="warn"] { background: rgba(217, 119, 6, .95); }

/* ============ 设置抽屉（右上角入口，edupick 交互） ============ */
.et-drawer-backdrop {
    position: fixed;
    inset: 0;
    z-index: 90;
    background: rgba(2, 6, 23, .45);
    backdrop-filter: blur(3px);
    -webkit-backdrop-filter: blur(3px);
    opacity: 0;
    transition: opacity .2s;
}

.et-drawer-backdrop.is-open { opacity: 1; }

.et-drawer {
    position: absolute;
    top: 0;
    right: 0;
    height: 100%;
    width: min(400px, 92vw);
    display: flex;
    flex-direction: column;
    background: var(--et-surface);
    border-left: 1px solid var(--et-line);
    box-shadow: var(--et-shadow-lg);
    transform: translateX(100%);
    transition: transform .22s cubic-bezier(.32, .72, .35, 1);
}

.et-drawer-backdrop.is-open .et-drawer { transform: translateX(0); }

.et-drawer__head {
    flex: none;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 15px 18px;
    border-bottom: 1px solid var(--et-line);
    font-weight: 800;
    font-size: 15px;
    color: var(--et-accent);
}

.et-drawer__head .et-icon-btn {
    margin-left: auto;
    width: 32px;
    height: 32px;
}

.et-drawer__body {
    flex: 1;
    min-height: 0;
    overflow: auto;
    padding: 16px 18px 24px;
}

/* 抽屉内容通用小节（工具复用） */
.et-drawer__body h4 {
    margin: 18px 0 8px;
    font-size: 12px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: .08em;
    color: var(--et-muted);
}

.et-drawer__body h4:first-child { margin-top: 0; }

.et-drawer__row {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
}

.et-drawer__tip {
    margin: 8px 0 0;
    font-size: 12px;
    line-height: 1.8;
    color: var(--et-muted);
}

.et-drawer__tip b { color: var(--et-fg); }

.et-drawer__input {
    flex: 1;
    min-width: 0;
    padding: 9px 12px;
    border: 1px solid var(--et-line-strong);
    border-radius: 9px;
    background: var(--et-surface-2);
    color: var(--et-fg);
    font: inherit;
    font-size: 13.5px;
    transition: border-color .14s, box-shadow .14s;
}

.et-drawer__input:focus {
    outline: none;
    border-color: var(--et-accent);
    box-shadow: 0 0 0 3px var(--et-accent-weak);
}

.et-drawer__switch {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 10px 0;
    border-bottom: 1px dashed var(--et-line);
    font-size: 13.5px;
    font-weight: 600;
    color: var(--et-fg);
    cursor: pointer;
    user-select: none;
}

.et-drawer__switch input {
    width: 17px;
    height: 17px;
    accent-color: var(--et-accent);
    cursor: pointer;
}
</style>

<style>
/* ── 电路搭建模拟：工具自身样式（自包含，不引用任何外部资源） ── */
:root { --cb-accent: #4f46e5; }

.cb-main { flex: 1; min-height: 0; display: flex; flex-direction: column; }

/* ---------- 工具栏 ---------- */
.cb-bar {
    flex: none;
    display: flex;
    align-items: center;
    gap: 10px 16px;
    flex-wrap: wrap;
    padding: 8px 16px;
    border-bottom: 1px solid var(--et-line);
    background: var(--et-surface-2);
}

.cb-group { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }

.cb-sep-v {
    width: 1px;
    align-self: stretch;
    min-height: 34px;
    background: var(--et-line);
    margin: 0 3px;
}

.cb-group__label {
    font-size: 12px;
    font-weight: 800;
    letter-spacing: .04em;
    color: var(--et-muted);
}

.cb-tool {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1px;
    width: 54px;
    padding: 4px 3px 3px;
    border: 1px solid var(--et-line);
    border-radius: 10px;
    background: var(--et-surface);
    color: var(--et-muted);
    font: inherit;
    font-size: 10.5px;
    font-weight: 700;
    line-height: 1.2;
    cursor: grab;
    transition: border-color .14s, color .14s, background .14s, transform .12s;
    -webkit-tap-highlight-color: transparent;
    touch-action: none;
}

.cb-tool:hover { border-color: var(--et-accent); color: var(--et-accent); transform: translateY(-1px); }
.cb-tool.is-active { background: var(--et-accent); border-color: var(--et-accent); color: #fff; }
.cb-tool .cb-ico { width: 38px; height: 22px; }

.cb-ico {
    fill: none;
    stroke: currentColor;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
}

.cb-seg {
    display: flex;
    gap: 3px;
    padding: 3px;
    border: 1px solid var(--et-line);
    border-radius: 10px;
    background: var(--et-surface);
}

.cb-seg button {
    border: 0;
    background: none;
    color: var(--et-muted);
    font: inherit;
    font-size: 12.5px;
    font-weight: 700;
    padding: 5px 9px;
    border-radius: 7px;
    cursor: pointer;
    white-space: nowrap;
    transition: background .14s, color .14s;
    -webkit-tap-highlight-color: transparent;
}

.cb-seg button:hover { color: var(--et-accent); }
.cb-seg button.is-active { background: var(--et-accent); color: #fff; }
.cb-spacer { flex: 1 1 auto; }

/* ---------- 画布 ---------- */
.cb-stage {
    position: relative;
    flex: 1;
    min-height: 0;
    overflow: hidden;
    background: var(--et-surface);

.cb-stage canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    touch-action: none;
    cursor: crosshair;
}

.cb-ghost {
    position: fixed;
    z-index: 200;
    padding: 5px 10px;
    border-radius: 9px;
    background: var(--et-accent);
    color: #fff;
    font-size: 12.5px;
    font-weight: 700;
    pointer-events: none;
    transform: translate(-50%, -160%);
    box-shadow: var(--et-shadow-md);
}

.cb-foot {
    flex: none;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px 22px;
    flex-wrap: wrap;
    min-height: 58px;
    padding: 8px 16px 12px;
    border-top: 1px solid var(--et-line);
    background: var(--et-surface-2);
}

.cb-stat { font-size: 13px; font-weight: 700; color: var(--et-muted); }

.cb-ok { font-size: 14.5px; font-weight: 800; color: var(--et-ok); }

.cb-gal__lg b { font-weight: 700; }

.cb-gal__card {

    color: var(--et-fg);

.cb-gal__card:hover { border-color: var(--et-accent); transform: translateY(-2px); box-shadow: var(--et-shadow-md); }
.cb-gal__card:focus-visible { outline: 2px solid var(--et-accent); outline-offset: 2px; }
.cb-gal__card.is-active { border-color: var(--et-accent); box-shadow: 0 0 0 3px var(--et-accent-weak); }

.cb-gal__pic {
    display: block;
    padding: 4px 2px 2px;

.cb-gal__pic .cbs { width: 100%; height: auto; max-height: 132px; }

.cb-gal__name { font-size: 14.5px; font-weight: 800; }

.cb-gal__note {

    font-size: 12.5px;
    line-height: 1.85;

}

/* ---------- 电路示意图（SVG 符号） ---------- */
.cbs { display: block; overflow: visible; }
.cbs-w { fill: none; stroke: var(--et-fg); stroke-width: 2.2; stroke-linecap: round; }

 *   宿主页面可回复 {type:'et-origin', origin:'https://…'}，
 *   工具据此渲染页脚官网链接。也可直接提供 window.ET_SITE_ORIGIN。

        head.appendChild(el('span', null, mo.title || ''));

            if (ev.key === 'Escape') { ev.stopPropagation(); close(); }

                '<text x="32" y="43" font-size="32" font-weight="800" font-family="sans-serif" ' +

    /* ============ 线性方程组（高斯消元，列主元） ============ */

    function solveLinear(A, b, n) {
        var col, r, c, i;
        for (col = 0; col < n; col++) {
            var piv = col;
            for (r = col + 1; r < n; r++) {
                if (Math.abs(A[r][col]) > Math.abs(A[piv][col])) { piv = r; }
            }
            if (Math.abs(A[piv][col]) < 1e-14) { return null; }
            if (piv !== col) {
                var t = A[piv]; A[piv] = A[col]; A[col] = t;
                var tb = b[piv]; b[piv] = b[col]; b[col] = tb;
            }
            var d = A[col][col];
            for (r = col + 1; r < n; r++) {
                var f = A[r][col] / d;
                if (!f) { continue; }
                for (c = col; c < n; c++) { A[r][c] -= f * A[col][c]; }
                b[r] -= f * b[col];
            }
        }
        var x = [];
        for (i = n - 1; i >= 0; i--) {
            var s = b[i];
            for (c = i + 1; c < n; c++) { s -= A[i][c] * x[c]; }
            x[i] = s / A[i][i];
            if (!isFinite(x[i])) { return null; }
        }
        return x;
    }

    function resistanceOf(e) {
        if (e.type === 'bulb') { return state.bulbR; }
        if (e.type === 'resistor') { return state.resR; }
        if (e.type === 'motor') { return R_MOTOR; }
        if (e.type === 'ammeter') { return R_AMMETER; }
        if (e.type === 'voltmeter') { return R_VOLTMETER; }
        if (e.type === 'rheostat') { return Math.max(0.05, state.rheoR); }
        if (e.type === 'battery') { return R_INT; }
        return R_WIRE;
    }

    /* 视为「导体」的元件（用于短路通路判定） */
    function isConductor(e) {
        if (e.type === 'wire' || e.type === 'ammeter') { return true; }
        if (e.type === 'switch') { return e.closed !== false; }
        if (e.type === 'rheostat') { return state.rheoR <= 0.1; }
        return false;
    }

    /* openKey：把某条支路临时断开，用于判断串并联 */
    function simulate(openKey) {
        var A = [];
        var rhs = [];
        var i, j;
        for (i = 0; i < NODES; i++) {
            var row = [];
            for (j = 0; j < NODES; j++) { row.push(0); }
            row[i] = G_SHUNT;
            A.push(row);
            rhs.push(0);
        }

        var items = [];
        for (var k in state.edges) {
            var e = state.edges[k];
            if (!e) { continue; }
            if (e.type === 'switch' && e.closed === false) { continue; }
            if (openKey && k === openKey) { continue; }
            var nd = keyNodes(k);
            var a = nd[0];
            var b = nd[1];
            var r = resistanceOf(e);
            var G = 1 / r;
            A[a][a] += G;
            A[a][b] -= G;
            A[b][a] -= G;
            A[b][b] += G;
            if (e.type === 'battery') {
                rhs[a] += G * state.volt;
                rhs[b] -= G * state.volt;
            }
            items.push({ key: k, a: a, b: b, r: r, e: e });
        }

        var V = solveLinear(A, rhs, NODES);
        if (!V) { return null; }

        var out = { items: {}, battery: 0, bulbs: [], resistors: [], batteries: [] };
        for (i = 0; i < items.length; i++) {
            var it = items[i];
            var u = V[it.a] - V[it.b];
            var emf = it.e.type === 'battery' ? state.volt : 0;
            var cur = (u - emf) / it.r;
            var rec = { current: cur, voltage: u, r: it.r, power: cur * cur * it.r };
            out.items[it.key] = rec;
            if (it.e.type === 'battery') {
                out.battery += Math.abs(cur);
                out.batteries.push(it.key);
            } else if (it.e.type === 'bulb') {
                out.bulbs.push(it.key);
            } else if (it.e.type === 'resistor') {
                out.resistors.push(it.key);
            }
        }
        return out;
    }

    function countType(type) {
        var n = 0;
        for (var k in state.edges) {
            if (state.edges[k].type === type) { n++; }
        }
        return n;
    }

    function reachable(adj, from, to) {
        var seen = {};
        var queue = [from];
        seen[from] = true;
        while (queue.length) {
            var cur = queue.shift();
            var nb = adj[cur] || [];
            for (var i = 0; i < nb.length; i++) {
                var n = nb[i];
                if (n === to) { return true; }
                if (!seen[n]) { seen[n] = true; queue.push(n); }
            }
        }
        return false;
    }

    /* 短路：电源两端之间存在只由导线 / 闭合开关构成的通路 */
    function isShorted() {
        var batteries = [];
        var k;
        for (k in state.edges) {
            if (state.edges[k].type === 'battery') { batteries.push(k); }
        }
        if (!batteries.length) { return false; }

        var adj = {};
        for (k in state.edges) {
            var e = state.edges[k];
            if (!isConductor(e)) { continue; }
            var nd = keyNodes(k);
            if (!adj[nd[0]]) { adj[nd[0]] = []; }
            if (!adj[nd[1]]) { adj[nd[1]] = []; }
            adj[nd[0]].push(nd[1]);
            adj[nd[1]].push(nd[0]);
        }

        for (var i = 0; i < batteries.length; i++) {
            var b = keyNodes(batteries[i]);
            if (reachable(adj, b[0], b[1])) { return true; }
        }
        return false;
    }

    /* 判定方式与课堂一致：分别把一只灯泡断开，看另一只是否还亮；
       两灯都在同一分支上（串联）时断开任意一只另一只必灭。 */
    function relationOf(bulbKeys) {
        var r0 = simulate(bulbKeys[0]);
        var r1 = simulate(bulbKeys[1]);
        var i0 = r0 && r0.items[bulbKeys[1]] ? Math.abs(r0.items[bulbKeys[1]].current) : 0;
        var i1 = r1 && r1.items[bulbKeys[0]] ? Math.abs(r1.items[bulbKeys[0]].current) : 0;
        var on0 = i0 > I_MIN;
        var on1 = i1 > I_MIN;
        if (on0 && on1) { return '两只灯泡并联（两条分支，电流在分支处分开）'; }
        if (!on0 && !on1) { return '两只灯泡串联（只有一条路径，电流处处相等）'; }
        return '混联（既有串联又有并联）';
    }

    function simulateAll() {
        state.res = simulate(null);
        state.verdict = '';
        state.warning = '';

        var batteries = countType('battery');
        var bulbs = countType('bulb');
        var resistors = countType('resistor');
        var motors = countType('motor');
        var live = state.res && state.res.battery > 0.002;

        if (!batteries) {
            state.verdict = '还没有电源，先放一个电源';
        } else if (!bulbs && !resistors && !motors) {
            state.verdict = '还没有接入用电器';
        } else if (!live) {
            state.warning = '断路：电路没有连通，检查开关是否闭合、回路是否成圈';
        } else if (isShorted()) {
            state.warning = '短路！电源两端被导线直接连通，电流过大（实际会烧坏电源）';
        }

        if (batteries && (bulbs || resistors || motors) && live) {
            if (bulbs === 2 && state.res.bulbs.length === 2) {
                state.verdict = relationOf([state.res.bulbs[0], state.res.bulbs[1]]);
            } else if (bulbs === 1) {
                state.verdict = '单个灯泡';
            } else if (bulbs > 2) {
                state.verdict = bulbs + ' 个灯泡（可逐个断开观察以判断串并联）';
            } else if (motors && !resistors) {
                state.verdict = '电动机电路：电流越大转子转得越快';
            } else if (resistors) {
                state.verdict = '定值电阻电路：读电流表与电压表即可算出 R = U ÷ I';
            }
        }

        flowing = false;
        if (state.res) {
            for (var k in state.res.items) {
                if (Math.abs(state.res.items[k].current) > 0.002) { flowing = true; }
            }
        }

        renderFoot();
        requestDraw();
    }

    /* ============ 画布 ============ */

    var cv = document.getElementById('cv');
    var ctx = cv.getContext('2d');
    var W = 800;
    var H = 500;
    var geom = { ox: 40, oy: 40, s: 60 };
    var phase = 0;
    var raf = 0;
    var flowing = false;

    function layout() {
        var pad = 38;
        var s = Math.min((W - pad * 2) / (COLS - 1), (H - pad * 2) / (ROWS - 1));
        geom.s = Math.max(26, s);
        geom.ox = (W - geom.s * (COLS - 1)) / 2;
        geom.oy = (H - geom.s * (ROWS - 1)) / 2;
    }

    function nodeXY(r, c) { return [geom.ox + c * geom.s, geom.oy + r * geom.s]; }
    function nodeXYi(i) { return nodeXY(Math.floor(i / COLS), i % COLS); }

    function edgeGeom(k) {
        var nd = keyNodes(k);
        var a = nodeXYi(nd[0]);
        var b = nodeXYi(nd[1]);
        return {
            x1: a[0], y1: a[1], x2: b[0], y2: b[1],
            mx: (a[0] + b[0]) / 2, my: (a[1] + b[1]) / 2,
            ang: Math.atan2(b[1] - a[1], b[0] - a[0]),
            len: Math.sqrt((b[0] - a[0]) * (b[0] - a[0]) + (b[1] - a[1]) * (b[1] - a[1]))
        };
    }

    function distToSeg(px, py, g) {
        var dx = g.x2 - g.x1;
        var dy = g.y2 - g.y1;
        var len2 = dx * dx + dy * dy;
        var t = len2 ? ((px - g.x1) * dx + (py - g.y1) * dy) / len2 : 0;
        t = Math.max(0, Math.min(1, t));
        var x = g.x1 + t * dx;
        var y = g.y1 + t * dy;
        return Math.sqrt((px - x) * (px - x) + (py - y) * (py - y));
    }

    function edgeAt(clientX, clientY) {
        var rect = cv.getBoundingClientRect();
        var px = clientX - rect.left;
        var py = clientY - rect.top;
        var best = null;
        var bestD = Math.min(geom.s * 0.34, 26);
        for (var i = 0; i < ALL_KEYS.length; i++) {
            var d = distToSeg(px, py, edgeGeom(ALL_KEYS[i]));
            if (d < bestD) { bestD = d; best = ALL_KEYS[i]; }
        }
        return best;
    }

    function cssVar(name, fallback) {
        try {
            var v = window.getComputedStyle(document.documentElement).getPropertyValue(name);
            v = String(v || '').replace(/^\s+|\s+$/g, '');
            return v || fallback;
        } catch (err) {
            return fallback;
        }
    }

    function highlight(k, color, solid) {
        var g = edgeGeom(k);
        ctx.save();
        ctx.strokeStyle = color;
        ctx.globalAlpha = solid ? 0.42 : 0.22;
        ctx.lineWidth = Math.min(18, geom.s * 0.46);
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(g.x1, g.y1);
        ctx.lineTo(g.x2, g.y2);
        ctx.stroke();
        ctx.restore();
    }

    function drawEdge(k, e, cFg, cMuted, cAccent, cWarn, cBg, cOk) {
        var g = edgeGeom(k);
        var rec = state.res && state.res.items[k] ? state.res.items[k] : null;
        var cur = rec ? rec.current : 0;
        var L = g.len;
        var h = Math.min(13, geom.s * 0.26);

        ctx.save();
        ctx.translate(g.mx, g.my);
        ctx.rotate(g.ang);
        ctx.lineCap = 'round';

        if (e.type === 'bulb') {
            var bright = 0;
            if (rec && Math.abs(cur) > I_MIN) {
                var pnom = (state.volt * state.volt) / state.bulbR;
                bright = Math.min(1.15, rec.power / pnom);
            }
            if (bright > 0.02) {
                var rad = Math.min(L * 0.6, geom.s * 0.8);
                var grd = ctx.createRadialGradient(0, 0, 1, 0, 0, rad);
                grd.addColorStop(0, 'rgba(251,191,36,' + Math.min(0.85, 0.22 + bright * 0.6).toFixed(3) + ')');
                grd.addColorStop(1, 'rgba(251,191,36,0)');
                ctx.fillStyle = grd;
                ctx.beginPath();
                ctx.arc(0, 0, rad, 0, Math.PI * 2);
                ctx.fill();
            }
            var R = Math.min(h * 1.3, L * 0.3);
            ctx.globalAlpha = 0.5;
            ctx.strokeStyle = cFg;
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.moveTo(-L / 2, 0);
            ctx.lineTo(-R, 0);
            ctx.moveTo(R, 0);
            ctx.lineTo(L / 2, 0);
            ctx.stroke();
            ctx.globalAlpha = 1;
            ctx.strokeStyle = bright > 0.02 ? '#f59e0b' : cFg;
            ctx.lineWidth = 2.6;
            ctx.beginPath();
            ctx.arc(0, 0, R, 0, Math.PI * 2);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(-R * 0.62, -R * 0.62);
            ctx.lineTo(R * 0.62, R * 0.62);
            ctx.moveTo(R * 0.62, -R * 0.62);
            ctx.lineTo(-R * 0.62, R * 0.62);
            ctx.stroke();
            if (bright > 0.12) {
                ctx.fillStyle = 'rgba(251,191,36,' + Math.min(0.55, bright * 0.5).toFixed(3) + ')';
                ctx.beginPath();
                ctx.arc(0, 0, R * 0.9, 0, Math.PI * 2);
                ctx.fill();
            }
        } else if (e.type === 'battery') {
            ctx.globalAlpha = 0.5;
            ctx.strokeStyle = cFg;
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.moveTo(-L / 2, 0);
            ctx.lineTo(-L * 0.14, 0);
            ctx.moveTo(L * 0.14, 0);
            ctx.lineTo(L / 2, 0);
            ctx.stroke();
            ctx.globalAlpha = 1;
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(-L * 0.14, -h);
            ctx.lineTo(-L * 0.14, h);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(L * 0.14, -h * 0.5);
            ctx.lineTo(L * 0.14, h * 0.5);
            ctx.stroke();
        } else if (e.type === 'resistor') {
            ctx.globalAlpha = 0.5;
            ctx.strokeStyle = cFg;
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.moveTo(-L / 2, 0);
            ctx.lineTo(-L * 0.22, 0);
            ctx.moveTo(L * 0.22, 0);
            ctx.lineTo(L / 2, 0);
            ctx.stroke();
            ctx.globalAlpha = 1;
            ctx.strokeStyle = cAccent;
            ctx.lineWidth = 2.4;
            ctx.beginPath();
            ctx.rect(-L * 0.22, -h * 0.85, L * 0.44, h * 1.7);
            ctx.stroke();
        } else if (e.type === 'switch') {
            /* 开关：闭合=绿色水平杆，断开=红色抬起杆 + 断口，颜色与「通/断」标注都很醒目 */
            var isOpen = e.closed === false;
            var lead = L * 0.24;
            ctx.globalAlpha = 0.5;
            ctx.strokeStyle = cFg;
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.moveTo(-L / 2, 0);
            ctx.lineTo(-lead, 0);
            ctx.moveTo(lead, 0);
            ctx.lineTo(L / 2, 0);
            ctx.stroke();
            ctx.globalAlpha = 1;

            /* 触点 */
            ctx.fillStyle = isOpen ? cWarn : cOk;
            ctx.beginPath();
            ctx.arc(-lead, 0, 3.2, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(lead, 0, 3.2, 0, Math.PI * 2);
            ctx.fill();

            /* 刀杆 */
            ctx.strokeStyle = isOpen ? cWarn : cOk;
            ctx.lineWidth = 4.6;
            ctx.lineCap = 'round';
            ctx.beginPath();
            ctx.moveTo(-lead, 0);
            if (isOpen) { ctx.lineTo(lead * 0.82, -h * 1.6); } else { ctx.lineTo(lead, 0); }
            ctx.stroke();

            /* 断开时光口加一道虚线，远看也能看出「没接通」 */
            if (isOpen) {
                ctx.save();
                ctx.setLineDash([3, 3]);
                ctx.strokeStyle = cWarn;
                ctx.lineWidth = 1.6;
                ctx.globalAlpha = 0.85;
                ctx.beginPath();
                ctx.moveTo(-lead, 0);
                ctx.lineTo(lead, 0);
                ctx.stroke();
                ctx.restore();
            }
        } else if (e.type === 'ammeter' || e.type === 'voltmeter') {
            /* 电表：圆 + A / V 字样 */
            var isA = e.type === 'ammeter';
            var Rm = Math.min(h * 1.15, L * 0.3);
            ctx.globalAlpha = 0.5;
            ctx.strokeStyle = cFg;
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.moveTo(-L / 2, 0);
            ctx.lineTo(-Rm, 0);
            ctx.moveTo(Rm, 0);
            ctx.lineTo(L / 2, 0);
            ctx.stroke();
            ctx.globalAlpha = 1;

            ctx.beginPath();
            ctx.arc(0, 0, Rm, 0, Math.PI * 2);
            ctx.fillStyle = cBg;
            ctx.fill();
            ctx.lineWidth = 2.6;
            ctx.strokeStyle = isA ? '#2563eb' : '#7c3aed';
            ctx.stroke();

            ctx.save();
            ctx.font = 'bold ' + Math.round(Rm * 1.05) + 'px ' + FONT;
            ctx.fillStyle = isA ? '#2563eb' : '#7c3aed';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(isA ? 'A' : 'V', 0, Rm * 0.06);
            ctx.restore();
        } else if (e.type === 'motor') {
            /* 电动机：圆 + M + 三叶转子（转速随电流变化） */
            var Rm2 = Math.min(h * 1.15, L * 0.3);
            ctx.globalAlpha = 0.5;
            ctx.strokeStyle = cFg;
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.moveTo(-L / 2, 0);
            ctx.lineTo(-Rm2, 0);
            ctx.moveTo(Rm2, 0);
            ctx.lineTo(L / 2, 0);
            ctx.stroke();
            ctx.globalAlpha = 1;

            ctx.beginPath();
            ctx.arc(0, 0, Rm2, 0, Math.PI * 2);
            ctx.fillStyle = cBg;
            ctx.fill();
            ctx.lineWidth = 2.6;
            ctx.strokeStyle = cOk;
            ctx.stroke();

            var spin = Math.abs(cur) > 0.004 ? phase * (6 + Math.min(40, Math.abs(cur) * 90)) : 0;
            ctx.save();
            ctx.translate(0, 0);
            ctx.rotate(spin);
            ctx.strokeStyle = cOk;
            ctx.lineWidth = 2.2;
            for (var blade = 0; blade < 3; blade++) {
                ctx.rotate(Math.PI * 2 / 3);
                ctx.beginPath();
                ctx.moveTo(0, 0);
                ctx.lineTo(0, -Rm2 * 0.72);
                ctx.stroke();
            }
            ctx.restore();

            ctx.save();
            ctx.font = 'bold ' + Math.round(Rm2 * 0.7) + 'px ' + FONT;
            ctx.fillStyle = cOk;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('M', 0, Rm2 * 0.02);
            ctx.restore();
        } else if (e.type === 'rheostat') {
            /* 滑动变阻器：矩形 + 上方滑片箭头 */
            ctx.globalAlpha = 0.5;
            ctx.strokeStyle = cFg;
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.moveTo(-L / 2, 0);
            ctx.lineTo(-L * 0.26, 0);
            ctx.moveTo(L * 0.26, 0);
            ctx.lineTo(L / 2, 0);
            ctx.stroke();
            ctx.globalAlpha = 1;

            ctx.strokeStyle = cAccent;
            ctx.lineWidth = 2.4;
            ctx.beginPath();
            ctx.rect(-L * 0.26, -h * 0.6, L * 0.52, h * 1.2);
            ctx.stroke();

            /* 滑片 */
            var ratio = Math.max(0, Math.min(1, state.rheoR / 20));
            var slideX = -L * 0.24 + L * 0.48 * ratio;
            ctx.beginPath();
            ctx.moveTo(slideX, -h * 0.6);
            ctx.lineTo(slideX, -h * 1.7);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(slideX - 4, -h * 1.7);
            ctx.lineTo(slideX + 4, -h * 1.7);
            ctx.lineTo(slideX, -h * 1.05);
            ctx.closePath();
            ctx.fillStyle = cAccent;
            ctx.fill();
        } else {
            ctx.globalAlpha = 0.5;
            ctx.strokeStyle = cFg;
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.moveTo(-L / 2, 0);
            ctx.lineTo(L / 2, 0);
            ctx.stroke();
            ctx.globalAlpha = 1;
        }

        /* 电流方向与大小（流动虚线 + 箭头） */
        if (state.flow && rec && Math.abs(cur) > 0.004) {
            var dir = cur > 0 ? 1 : -1;
            var mag = Math.min(1.8, Math.abs(cur) / 0.35);
            ctx.save();
            ctx.strokeStyle = '#f59e0b';
            ctx.globalAlpha = 0.92;
            ctx.lineWidth = 2.2;
            ctx.setLineDash([7, 9]);
            ctx.lineDashOffset = -dir * ((phase * 60 * mag * state.speed) % (16 * 1000));
            ctx.beginPath();
            ctx.moveTo(-L / 2 + 2, 0);
            ctx.lineTo(L / 2 - 2, 0);
            ctx.stroke();
            ctx.restore();

            ctx.fillStyle = '#f59e0b';
            var ax = dir * L * 0.3;
            ctx.beginPath();
            ctx.moveTo(ax + dir * 7, 0);
            ctx.lineTo(ax - dir * 3.5, -5);
            ctx.lineTo(ax - dir * 3.5, 5);
            ctx.closePath();
            ctx.fill();
        }

        ctx.restore();

        /* ---------- 以下在屏幕坐标系绘制，保证文字始终水平 ---------- */
        var nx = -Math.sin(g.ang);
        var ny = Math.cos(g.ang);
        var label = '';
        if (state.values) {
            if (e.type === 'battery') { label = state.volt + 'V'; }
            else if (e.type === 'bulb') { label = Math.abs(cur) > I_MIN ? trimNum(Math.abs(cur), 2) + 'A' : '不亮'; }
            else if (e.type === 'resistor') { label = state.resR + 'Ω'; }
            else if (e.type === 'rheostat') { label = state.rheoR + 'Ω'; }
            else if (e.type === 'motor') { label = Math.abs(cur) > 0.004 ? trimNum(Math.abs(cur), 2) + 'A' : '不转'; }
            else if (e.type === 'ammeter') { label = trimNum(Math.abs(cur), 3) + 'A'; }
            else if (e.type === 'voltmeter') { label = trimNum(Math.abs(rec ? rec.voltage : 0), 2) + 'V'; }
        }

        var tags = [];
        if (label) { tags.push({ text: label, tone: cMuted }); }
        if (e.type === 'switch') {
            tags.push({ text: e.closed === false ? '断' : '通', tone: e.closed === false ? cWarn : cOk });
        }
        if (e.type === 'battery') {
            tags.unshift({ text: '＋', tone: cMuted });
        }

        for (var ti = 0; ti < tags.length; ti++) {
            var dist = h + 15 + ti * 19;
            var tx = g.mx + nx * dist;
            var ty = g.my + ny * dist;
            ctx.save();
            ctx.font = 'bold 11.5px ' + FONT;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            var tw = ctx.measureText(tags[ti].text).width;
            ctx.globalAlpha = 0.88;
            ctx.fillStyle = cBg;
            ctx.fillRect(tx - tw / 2 - 5, ty - 9, tw + 10, 18);
            ctx.globalAlpha = 1;
            ctx.fillStyle = tags[ti].tone;
            ctx.fillText(tags[ti].text, tx, ty + 0.5);
            ctx.restore();
        }
    }

    function draw() {
        var cBg = cssVar('--et-surface', '#ffffff');
        var cFg = cssVar('--et-fg', '#0b1220');
        var cMuted = cssVar('--et-muted', '#64748b');
        var cAccent = cssVar('--et-accent', '#4f46e5');
        var cWarn = cssVar('--et-err', '#dc2626');
        var cOk = cssVar('--et-ok', '#059669');

        ctx.clearRect(0, 0, W, H);
        ctx.fillStyle = cBg;
        ctx.fillRect(0, 0, W, H);

        /* 空槽（可放置位置） */
        var i;
        ctx.lineWidth = 2;
        ctx.setLineDash([4, 7]);
        ctx.strokeStyle = cMuted;
        ctx.globalAlpha = 0.16;
        ctx.beginPath();
        for (i = 0; i < ALL_KEYS.length; i++) {
            if (state.edges[ALL_KEYS[i]]) { continue; }
            var g = edgeGeom(ALL_KEYS[i]);
            ctx.moveTo(g.x1, g.y1);
            ctx.lineTo(g.x2, g.y2);
        }
        ctx.stroke();
        ctx.setLineDash([]);
        ctx.globalAlpha = 1;

        /* 节点 */
        ctx.fillStyle = cMuted;
        ctx.globalAlpha = 0.32;
        for (var r = 0; r < ROWS; r++) {
            for (var c = 0; c < COLS; c++) {
                var p = nodeXY(r, c);
                ctx.beginPath();
                ctx.arc(p[0], p[1], 2, 0, Math.PI * 2);
                ctx.fill();
            }
        }
        ctx.globalAlpha = 1;

        /* 高亮（画在元件下面） */
        if (state.sel && state.sel !== state.hover) { highlight(state.sel, cAccent, true); }
        if (state.hover) { highlight(state.hover, cAccent, false); }

        /* 元件 */
        for (var k in state.edges) {
            drawEdge(k, state.edges[k], cFg, cMuted, cAccent, cWarn, cBg, cOk);
        }
    }

    function tick() {
        raf = 0;
        phase += 0.016;
        draw();
        if (flowing) { raf = window.requestAnimationFrame(tick); }
    }

    function requestDraw() {
        if (!raf) { raf = window.requestAnimationFrame(tick); }
    }

    /* ============ 状态带 ============ */

    function el(tag, cls, text) {
        var node = document.createElement(tag);
        if (cls) { node.className = cls; }
        if (text !== undefined && text !== null) { node.textContent = text; }
        return node;
    }

    function stat(label, value) {
        var s = el('span', 'cb-stat', label + ' ');
        s.appendChild(el('b', null, value));
        return s;
    }

    function renderFoot() {
        var foot = document.getElementById('foot');
        foot.textContent = '';

        if (!countType('battery')) {
            foot.appendChild(el('span', 'cb-hint',
                '把左侧元件拖到画布的虚线格上即可搭电路，「现成电路」里有一键载入的演示电路'));
            return;
        }

        foot.appendChild(stat('电源', state.volt + 'V'));
        foot.appendChild(stat('总电流', state.res ? trimNum(state.res.battery, 3) + 'A' : '—'));

        var n = 0;
        for (var k in state.edges) {
            if (state.edges[k].type !== 'bulb') { continue; }
            n++;
            var rec = state.res && state.res.items[k] ? state.res.items[k] : null;
            var i = rec ? Math.abs(rec.current) : 0;
            foot.appendChild(stat('灯泡' + n, i > I_MIN
                ? (trimNum(i, 2) + 'A · ' + trimNum(rec.power, 2) + 'W')
                : '不亮'));
        }

        /* 电表读数（最多各显示 2 个） */
        var meters = { ammeter: [], voltmeter: [], motor: [] };
        for (var mk in state.edges) {
            var mt = state.edges[mk].type;
            if (meters[mt] && meters[mt].length < 2) { meters[mt].push(mk); }
        }
        var mi;
        for (mi = 0; mi < meters.ammeter.length; mi++) {
            var arec = state.res && state.res.items[meters.ammeter[mi]];
            foot.appendChild(stat('电流表' + (mi + 1), arec ? trimNum(Math.abs(arec.current), 3) + 'A' : '—'));
        }
        for (mi = 0; mi < meters.voltmeter.length; mi++) {
            var vrec = state.res && state.res.items[meters.voltmeter[mi]];
            foot.appendChild(stat('电压表' + (mi + 1), vrec ? trimNum(Math.abs(vrec.voltage), 2) + 'V' : '—'));
        }
        for (mi = 0; mi < meters.motor.length; mi++) {
            var mrec = state.res && state.res.items[meters.motor[mi]];
            var mc = mrec ? Math.abs(mrec.current) : 0;
            foot.appendChild(stat('电动机' + (mi + 1), mc > 0.01 ? trimNum(mc, 2) + 'A · 转动' : '不转'));
        }

        if (state.verdict) { foot.appendChild(el('span', 'cb-verdict', state.verdict)); }
        if (state.warning) {
            foot.appendChild(el('span', 'cb-warn', state.warning));
        } else if (state.res && state.res.battery > 0.002) {
            foot.appendChild(el('span', 'cb-ok', '通路'));
        }
    }

    /* ============ 视图与几何 ============ */

    function resize() {
        var stage = document.getElementById('stage');
        var rect = stage.getBoundingClientRect();
        var dpr = window.devicePixelRatio || 1;
        W = Math.max(320, Math.floor(rect.width));
        H = Math.max(220, Math.floor(rect.height));
        cv.width = Math.round(W * dpr);
        cv.height = Math.round(H * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        layout();

    }

    /* ============ 交互 ============ */

    function describe(key, e, rec) {
        if (e.type === 'battery') {
            return '电源：' + state.volt + 'V（内阻 ' + R_INT + 'Ω），输出电流 ' +
                (rec ? trimNum(Math.abs(rec.current), 3) + 'A' : '—');
        }
        if (e.type === 'bulb') {
            if (!rec || Math.abs(rec.current) < I_MIN) { return '灯泡：不亮（无电流通过）'; }
            return '灯泡：电流 ' + trimNum(Math.abs(rec.current), 3) + 'A，电压 ' +
                trimNum(Math.abs(rec.voltage), 2) + 'V，功率 ' + trimNum(rec.power, 3) + 'W';
        }
        if (e.type === 'motor') {
            return '电动机：电流 ' + (rec ? trimNum(Math.abs(rec.current), 3) + 'A' : '—') +
                '，转速随电流增大（线圈电阻 ' + R_MOTOR + 'Ω）';
        }
        if (e.type === 'resistor') {
            return '定值电阻：阻值 ' + state.resR + 'Ω，电流 ' +
                (rec ? trimNum(Math.abs(rec.current), 3) + 'A' : '—');
        }
        if (e.type === 'rheostat') {
            return '滑动变阻器：当前接入阻值 ' + state.rheoR + 'Ω，电流 ' +
                (rec ? trimNum(Math.abs(rec.current), 3) + 'A' : '—') + '（阻值在 ⚙ 里调）';
        }
        if (e.type === 'ammeter') {
            return '电流表：读数 ' + (rec ? trimNum(Math.abs(rec.current), 3) + 'A' : '—') +
                '（内阻约 ' + R_AMMETER + 'Ω，串联接入、电流从「+」接线柱流入）';
        }
        if (e.type === 'voltmeter') {
            return '电压表：读数 ' + (rec ? trimNum(Math.abs(rec.voltage), 2) + 'V' : '—') +
                '（内阻极大，并联在被测元件两端）';
        }
        if (e.type === 'switch') {
            return '开关：' + (e.closed === false ? '断开（电路断开）' : '闭合（电流可以通过）');
        }
        return '导线：电阻约 ' + R_WIRE + 'Ω，可近似看作没有电阻';
    }

    function onCanvasTap(key) {
        if (!key) { return; }
        var e = state.edges[key];

        if (state.tool === 'erase') {
            if (e) {
                delete state.edges[key];
                if (state.sel === key) { state.sel = null; }
                simulateAll();
                save();
                chrome.beep('tick');
            }
            return;
        }

        if (state.tool === 'select') {
            if (e && e.type === 'switch') {
                e.closed = e.closed === false;
                state.sel = key;
                simulateAll();
                save();
                chrome.toast(e.closed ? '开关已闭合' : '开关已断开');
                return;
            }
            state.sel = key;
            requestDraw();
            if (e) {
                chrome.toast(describe(key, e, state.res && state.res.items[key] ? state.res.items[key] : null));
            }
            return;
        }

        /* 放置元件 */
        state.edges[key] = { type: state.tool, closed: true };
        state.sel = key;
        simulateAll();
        save();
        chrome.beep('tick');
    }

    function save() {
        store.set('tool', state.tool);
        store.set('volt', state.volt);
        store.set('bulbR', state.bulbR);
        store.set('resR', state.resR);
        store.set('rheoR', state.rheoR);
        store.set('values', state.values);
        store.set('flow', state.flow);
        store.set('speed', state.speed);
        store.set('edges', state.edges);
    }

    /* ============ 典型电路图（示意图缩略图） ============ */

    var GAL_S = 46;      /* 缩略图每格边长（viewBox 单位） */
    var GAL_PAD = 30;

    /* 把预设的 runs 展开成边表，供缩略图使用（与画布同一套坐标） */
    function presetEdges(preset) {
        var edges = {};
        for (var i = 0; i < preset.runs.length; i++) {
            var run = preset.runs[i];
            for (var t = run[2]; t <= run[3]; t++) {
                var key = run[0] === 'h' ? ekey('h', run[1], t) : ekey('v', t, run[1]);
                edges[key] = { type: run[4] };
            }
        }
        return edges;
    }

    function segAxes(x1, y1, x2, y2) {
        var dx = x2 - x1;
        var dy = y2 - y1;
        var len = Math.sqrt(dx * dx + dy * dy) || 1;
        return { ux: dx / len, uy: dy / len, px: -dy / len, py: dx / len, len: len };
    }

    function svgPt(x, y) { return x.toFixed(1) + ' ' + y.toFixed(1); }

    function svgLine(x1, y1, x2, y2, cls) {
        return '<line class="' + (cls || 'cbs-w') + '" x1="' + x1.toFixed(1) + '" y1="' + y1.toFixed(1) +
            '" x2="' + x2.toFixed(1) + '" y2="' + y2.toFixed(1) + '"></line>';
    }

    function arrowHead(x, y, dx, dy, size) {
        var len = Math.sqrt(dx * dx + dy * dy) || 1;
        var ux = dx / len;
        var uy = dy / len;
        var px = -uy;
        var py = ux;
        var s = size || 5;
        return '<polygon class="cbs-a" points="' + svgPt(x, y) + ' ' +
            svgPt(x - ux * s + px * s * 0.62, y - uy * s + py * s * 0.62) + ' ' +
            svgPt(x - ux * s - px * s * 0.62, y - uy * s - py * s * 0.62) + '"></polygon>';
    }

    /* 单个元件符号：画在 (x1,y1)-(x2,y2) 这一段上（含两侧引脚） */
    function schematicSymbol(type, x1, y1, x2, y2) {
        var ax = segAxes(x1, y1, x2, y2);
        var ux = ax.ux;
        var uy = ax.uy;
        var px = ax.px;
        var py = ax.py;
        var len = ax.len;
        var mx = (x1 + x2) / 2;
        var my = (y1 + y2) / 2;
        var out = '';

        function at(dist, side) {
            return [mx + ux * dist + px * side, my + uy * dist + py * side];
        }
        function lead(gap) {
            var d = len * gap;
            return svgLine(x1, y1, mx - ux * d, my - uy * d) +
                svgLine(mx + ux * d, my + uy * d, x2, y2);
        }
        function bar(dist, half, cls) {
            var a = at(dist, -half);
            var b = at(dist, half);
            return svgLine(a[0], a[1], b[0], b[1], cls || 'cbs-s');
        }
        function poly(points, cls) {
            var s = '';
            for (var i = 0; i < points.length; i++) { s += svgPt(points[i][0], points[i][1]) + ' '; }
            return '<polygon class="' + (cls || 'cbs-f') + '" points="' + s.replace(/\s+$/, '') + '"></polygon>';
        }
        function dial(label) {
            out += lead(0.24);
            out += '<circle class="cbs-f" cx="' + mx.toFixed(1) + '" cy="' + my.toFixed(1) +
                '" r="' + (len * 0.24).toFixed(1) + '"></circle>';
            out += '<text class="cbs-t" x="' + mx.toFixed(1) + '" y="' + (my + 4.4).toFixed(1) + '">' + label + '</text>';
            return out;
        }

        if (type === 'wire') {
            return svgLine(x1, y1, x2, y2);
        }
        if (type === 'battery') {
            out += lead(0.13);
            out += bar(-len * 0.1, len * 0.22, 'cbs-s cbs-s--long');
            out += bar(len * 0.1, len * 0.11, 'cbs-s');
            return out;
        }
        if (type === 'bulb') {
            out += lead(0.24);
            out += '<circle class="cbs-f" cx="' + mx.toFixed(1) + '" cy="' + my.toFixed(1) +
                '" r="' + (len * 0.24).toFixed(1) + '"></circle>';
            var a1 = at(-len * 0.17, -len * 0.17);
            var b1 = at(len * 0.17, len * 0.17);
            var a2 = at(-len * 0.17, len * 0.17);
            var b2 = at(len * 0.17, -len * 0.17);
            out += svgLine(a1[0], a1[1], b1[0], b1[1], 'cbs-s') + svgLine(a2[0], a2[1], b2[0], b2[1], 'cbs-s');
            return out;
        }
        if (type === 'switch') {
            out += lead(0.3);
            var p1 = at(-len * 0.3, 0);
            var p2 = at(len * 0.3, 0);
            out += svgLine(p1[0], p1[1], p2[0], p2[1], 'cbs-s');
            var tip = at(len * 0.48, -len * 0.22);
            out += svgLine(p2[0], p2[1], tip[0], tip[1], 'cbs-s');
            out += '<circle class="cbs-d" cx="' + p1[0].toFixed(1) + '" cy="' + p1[1].toFixed(1) + '" r="2"></circle>';
            out += '<circle class="cbs-d" cx="' + p2[0].toFixed(1) + '" cy="' + p2[1].toFixed(1) + '" r="2"></circle>';
            return out;
        }
        if (type === 'resistor' || type === 'rheostat') {
            var rw = len * 0.3;
            var rh = len * 0.16;
            out += lead(0.3);
            out += poly([at(-rw, -rh), at(rw, -rh), at(rw, rh), at(-rw, rh)], 'cbs-f');
            if (type === 'rheostat') {
                var s1 = at(-rw, rh + len * 0.2);
                var s2 = at(rw, -rh - len * 0.2);
                out += svgLine(s1[0], s1[1], s2[0], s2[1], 'cbs-s');
                out += arrowHead(s2[0], s2[1], s2[0] - s1[0], s2[1] - s1[1], 6);
            }
            return out;
        }
        return dial(type === 'ammeter' ? 'A' : (type === 'voltmeter' ? 'V' : 'M'));
    }

    /* 生成一个预设的整幅示意图（返回 viewBox 与图形片段） */
    function schematic(preset) {
        var edges = presetEdges(preset);
        var keys = [];
        var r0 = 99;
        var c0 = 99;
        var r1 = -1;
        var c1 = -1;
        var k;
        var i;
        for (k in edges) {
            keys.push(k);
            var nd = keyNodes(k);
            for (i = 0; i < 2; i++) {
                var rr = Math.floor(nd[i] / COLS);
                var cc = nd[i] % COLS;
                if (rr < r0) { r0 = rr; }
                if (cc < c0) { c0 = cc; }
                if (rr > r1) { r1 = rr; }
                if (cc > c1) { c1 = cc; }
            }
        }

        function nx(c) { return GAL_PAD + (c - c0) * GAL_S; }
        function ny(r) { return GAL_PAD + (r - r0) * GAL_S; }

        var deg = {};
        for (i = 0; i < keys.length; i++) {
            var nd2 = keyNodes(keys[i]);
            deg[nd2[0]] = (deg[nd2[0]] || 0) + 1;
            deg[nd2[1]] = (deg[nd2[1]] || 0) + 1;
        }

        var body = '';
        for (i = 0; i < keys.length; i++) {
            var kk = keys[i];
            var nn = keyNodes(kk);
            body += schematicSymbol(edges[kk].type,
                nx(nn[0] % COLS), ny(Math.floor(nn[0] / COLS)),
                nx(nn[1] % COLS), ny(Math.floor(nn[1] / COLS)));
        }
        for (k in deg) {
            if (deg[k] < 3) { continue; }
            var num = Number(k);
            body += '<circle class="cbs-d" cx="' + nx(num % COLS).toFixed(1) + '" cy="' +
                ny(Math.floor(num / COLS)).toFixed(1) + '" r="2.8"></circle>';
        }

        return { vw: (c1 - c0) * GAL_S + GAL_PAD * 2, vh: (r1 - r0) * GAL_S + GAL_PAD * 2, body: body };
    }

    var SYMBOLS = [
        ['wire', '导线'], ['battery', '电源'], ['switch', '开关'], ['bulb', '小灯泡'],
        ['resistor', '定值电阻'], ['rheostat', '滑动变阻器'], ['ammeter', '电流表'],
        ['voltmeter', '电压表'], ['motor', '电动机']
    ];

    function openGallery() {

        });

    function applyPreset(index, announce) {
        var preset = PRESETS[index];
        if (!preset) { return; }
        state.edges = {};
        for (var i = 0; i < preset.runs.length; i++) {
            var run = preset.runs[i];
            var dir = run[0];
            var fixed = run[1];
            for (var t = run[2]; t <= run[3]; t++) {
                var key = dir === 'h' ? ekey('h', fixed, t) : ekey('v', t, fixed);
                if (ALL_KEYS.indexOf(key) === -1) { continue; }
                state.edges[key] = { type: run[4], closed: true };
            }
        }
        state.preset = index;
        state.sel = null;
        store.set('preset', index);
        simulateAll();
        save();
        if (announce) {
            chrome.beep('ok');
            chrome.toast('已载入示例：' + preset.name);
        }
    }

    function toggleAllSwitches() {
        var switches = [];
        for (var k in state.edges) {
            if (state.edges[k].type === 'switch') { switches.push(k); }
        }
        if (!switches.length) {
            chrome.toast('还没有放开关，可在左侧选「开关」拖到电线上', 'warn');
            return;
        }
        var anyOpen = false;
        for (var i = 0; i < switches.length; i++) {
            if (state.edges[switches[i]].closed === false) { anyOpen = true; }
        }
        for (i = 0; i < switches.length; i++) {
            state.edges[switches[i]].closed = anyOpen;
        }
        simulateAll();
        save();
        chrome.beep(anyOpen ? 'ok' : 'tick');
        chrome.toast(anyOpen ? '全部开关已闭合' : '全部开关已断开');
    }

    function setTool(tool) {
        if (!TOOL_NAME[tool]) { return; }
        state.tool = tool;
        store.set('tool', tool);
        var btns = document.getElementById('palette').querySelectorAll('button[data-tool]');
        for (var i = 0; i < btns.length; i++) {
            btns[i].classList.toggle('is-active', btns[i].getAttribute('data-tool') === tool);
        }
    }

    function renderChips() {
        var list = document.getElementById('segVolt').querySelectorAll('button');
        var i;
        for (i = 0; i < list.length; i++) {
            list[i].classList.toggle('is-active', Number(list[i].getAttribute('data-volt')) === state.volt);
        }
        var btnText = document.getElementById('btnGalleryText');
        var cur = PRESETS[state.preset];
        if (btnText) { btnText.textContent = '典型电路图 · ' + (cur ? cur.name : '自定义'); }
        setTool(state.tool);
    }

    /* ============ 设置抽屉 ============ */

    function buildSettings(body) {
        function heading(text) {
            var h = document.createElement('h4');
            h.textContent = text;
            body.appendChild(h);
        }

        function switchRow(label, checked, onChange) {
            var row = document.createElement('label');
            row.className = 'et-drawer__switch';
            row.appendChild(document.createTextNode(label));
            var cb = document.createElement('input');
            cb.type = 'checkbox';
            cb.checked = checked;
            cb.addEventListener('change', function () { onChange(cb.checked); });
            row.appendChild(cb);
            body.appendChild(row);
        }

        function segRow(labels, values, current, onPick) {
            var row = document.createElement('div');
            row.className = 'et-drawer__row';
            for (var i = 0; i < values.length; i++) {
                (function (value, label) {
                    var b = document.createElement('button');
                    b.type = 'button';
                    b.className = 'et-btn' + (value === current ? ' et-btn--primary' : '');
                    b.style.flex = '1 1 28%';
                    b.textContent = label;
                    b.addEventListener('click', function () {
                        onPick(value);
                        refresh();
                    });
                    row.appendChild(b);
                })(values[i], labels[i]);
            }
            body.appendChild(row);
        }

        heading('电源电压');
        segRow(['1.5V', '3V', '4.5V', '6V'], [1.5, 3, 4.5, 6], state.volt, function (v) {
            state.volt = v;
            renderChips();
            simulateAll();
            save();
        });

        heading('灯泡电阻');
        segRow(['5Ω', '10Ω', '20Ω'], [5, 10, 20], state.bulbR, function (v) {
            state.bulbR = v;
            simulateAll();
            save();
        });

        heading('定值电阻');
        segRow(['5Ω', '10Ω', '20Ω'], [5, 10, 20], state.resR, function (v) {
            state.resR = v;
            simulateAll();
            save();
        });

        heading('滑动变阻器接入阻值');
        segRow(['0Ω', '5Ω', '10Ω', '20Ω'], [0, 5, 10, 20], state.rheoR, function (v) {
            state.rheoR = v;
            simulateAll();
            save();
        });

        heading('显示');
        switchRow('显示元件数值', state.values, function (on) {
            state.values = on;
            save();
            requestDraw();
        });
        switchRow('显示电流方向动画', state.flow, function (on) {
            state.flow = on;
            save();
            simulateAll();
        });

        heading('动画速度');
        segRow(['慢', '正常', '快'], [0.6, 1, 1.6], state.speed, function (v) {
            state.speed = v;
            save();
            simulateAll();
        });

        var tip = document.createElement('p');
        tip.className = 'et-drawer__tip';
        tip.innerHTML = '求解方式：把每个节点看成未知电位，用<b>节点法</b>列线性方程组（基尔霍夫电流定律），'
            + '再用列主元高斯消元求解，灯泡亮度按实际功率 P = I²R 与原功率的比值显示。'
            + '<br>元件内阻：导线 0.05Ω、电源 0.5Ω、电流表 0.01Ω、电压表 1MΩ、电动机线圈 20Ω。'
            + '<br>串联 / 并联判定采用与课堂一致的做法：分别把一只灯泡断开，看另一只是否还亮。'
            + '<br><b>为什么我接的「并联」被判成串联？</b>常见原因：电源串在了某一条分支里（电流只有一条路径）。'
            + '正确接法是把电源接在两分支「汇合后的干路」上，可点「两灯并联」载入对照。'
            + '<br>电路与设置保存在本机浏览器，下次打开自动恢复。';
        body.appendChild(tip);

        function refresh() {
            while (body.firstChild) { body.removeChild(body.firstChild); }
            buildSettings(body);
        }
    }

    /* ============ 事件绑定 ============ */

    cv.addEventListener('pointerdown', function (ev) {
        ev.preventDefault();
        onCanvasTap(edgeAt(ev.clientX, ev.clientY));
    });

    cv.addEventListener('pointermove', function (ev) {
        var key = edgeAt(ev.clientX, ev.clientY);
        if (key !== state.hover) {
            state.hover = key;
            requestDraw();
        }
    });

    cv.addEventListener('pointerleave', function () {
        state.hover = null;
        requestDraw();
    });

    cv.addEventListener('contextmenu', function (ev) {
        ev.preventDefault();
        var key = edgeAt(ev.clientX, ev.clientY);
        if (key && state.edges[key]) {
            delete state.edges[key];
            if (state.sel === key) { state.sel = null; }
            simulateAll();
            save();
            chrome.beep('tick');
        }
    });

    var ghost = null;

    function moveGhost(x, y) {
        if (!ghost) { return; }
        ghost.style.left = x + 'px';
        ghost.style.top = y + 'px';
    }

    document.getElementById('palette').addEventListener('pointerdown', function (ev) {
        var btn = ev.target && ev.target.closest ? ev.target.closest('button[data-tool]') : null;
        if (!btn) { return; }
        var tool = btn.getAttribute('data-tool');
        setTool(tool);
        if (tool === 'select' || tool === 'erase') { return; }
        ghost = el('div', 'cb-ghost', TOOL_NAME[tool] + ' → 拖到格子上');
        document.body.appendChild(ghost);
        moveGhost(ev.clientX, ev.clientY);
        ev.preventDefault();
    });

    document.addEventListener('pointermove', function (ev) {
        if (!ghost) { return; }
        moveGhost(ev.clientX, ev.clientY);
        var key = edgeAt(ev.clientX, ev.clientY);
        if (key !== state.hover) {
            state.hover = key;
            requestDraw();
        }
    });

    document.addEventListener('pointerup', function (ev) {
        if (!ghost) { return; }
        document.body.removeChild(ghost);
        ghost = null;
        var key = edgeAt(ev.clientX, ev.clientY);
        state.hover = null;
        if (key) {
            state.edges[key] = { type: state.tool, closed: true };
            state.sel = key;
            simulateAll();
            save();
            chrome.beep('tick');
        } else {
            requestDraw();
        }
    });

    document.getElementById('segVolt').addEventListener('click', function (ev) {
        var v = ev.target && ev.target.getAttribute ? ev.target.getAttribute('data-volt') : null;
        if (!v) { return; }
        state.volt = Number(v);
        renderChips();
        simulateAll();
        save();
        chrome.beep('tick');
    });

    document.getElementById('btnGallery').addEventListener('click', function () {
        openGallery();
        chrome.beep('tick');
    });

    document.getElementById('btnClear').addEventListener('click', function () {
        state.edges = {};
        state.sel = null;
        simulateAll();
        save();
        chrome.beep('tick');
        chrome.toast('已清空电路，可以自己重新搭一个');
    });

    document.addEventListener('keydown', function (ev) {
        var node = document.activeElement;
        var tag = node && node.tagName ? node.tagName.toUpperCase() : '';
        if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT' || (node && node.isContentEditable)) { return; }
        if (document.querySelector('.et-modal, .et-drawer-backdrop')) { return; }

        if (TOOL_KEYS[ev.key]) {
            setTool(TOOL_KEYS[ev.key]);
            ev.preventDefault();
            return;
        }
        if (ev.key === 'Escape') {
            state.sel = null;
            requestDraw();
            return;
        }
        if (ev.code === 'Space' || ev.key === ' ') {
            ev.preventDefault();
            toggleAllSwitches();
            return;
        }
        if (ev.key === 'g' || ev.key === 'G') {
            ev.preventDefault();
            openGallery();
        }
    });

    window.addEventListener('resize', function () {
        window.clearTimeout(window.__cbResize);
        window.__cbResize = window.setTimeout(resize, 140);
    });

    try {
        var observer = new MutationObserver(function () { requestDraw(); });
        observer.observe(document.documentElement, { attributes: true, attributeFilter: ['data-et-theme'] });
    } catch (err) { /* 老内核忽略 */ }

    /* ============ 启动 ============ */

    var savedPreset = Number(store.get('preset', 0));
    if (!isFinite(savedPreset) || savedPreset < 0 || savedPreset > PRESETS.length - 1) { savedPreset = 0; }
    state.preset = savedPreset;

    if (!restoreEdges()) { applyPreset(savedPreset, false); }
    renderChips();
    resize();
    simulateAll();
})();
</script>

</body>
</html>
