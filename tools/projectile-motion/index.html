/* ============ 设计令牌 ============ */
:root {
    --et-accent: #2563eb;
    --et-accent-weak: rgba(37, 99, 235, .14);
    --et-bg: #f4f6fb;
    --et-surface: #ffffff;
    --et-surface-2: #f8fafc;
    --et-fg: #0b1220;
    --et-muted: #64748b;
    --et-line: rgba(15, 23, 42, .12);
    --et-line-strong: rgba(15, 23, 42, .22);
    --et-glass: rgba(255, 255, 255, .85);
    --et-shadow-md: 0 10px 28px -18px rgba(15, 23, 42, .3);
    --et-shadow-lg: 0 24px 60px -32px rgba(15, 23, 42, .4);
    --et-ok: #059669;
    --et-warn: #d97706;
    --et-err: #dc2626;
    --et-radius: 12px;
    --et-radius-sm: 9px;
    --et-font: -apple-system, BlinkMacSystemFont, "Segoe UI",
               "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei",
               "Noto Sans SC", sans-serif;
    --et-mono: ui-monospace, "Cascadia Mono", Consolas, Menlo, monospace;
}

html[data-et-theme="dark"] {
    --et-bg: #0b1120;
    --et-surface: #111a2e;
    --et-surface-2: #0f1729;
    --et-fg: #f1f5f9;
    --et-muted: #94a3b8;
    --et-line: rgba(148, 163, 184, .18);
    --et-line-strong: rgba(148, 163, 184, .3);
    --et-glass: rgba(17, 26, 46, .85);
    --et-shadow-md: 0 10px 34px -18px rgba(0, 0, 0, .8);
    --et-shadow-lg: 0 24px 70px -30px rgba(0, 0, 0, .9);
    --et-ok: #34d399;
    --et-warn: #fbbf24;
    --et-err: #f87171;
}

/* ============ 基础 ============ */

/* body 作为外壳时必须清掉浏览器默认 8px 外边距，
   否则 iframe 预览中文档会比视口高 16px（底部白边 + 多余滚动） */
body.et-app {
    margin: 0;
}

.et-app {
    position: relative;
    isolation: isolate;
    display: flex;
    flex-direction: column;
    height: 100vh;
    height: 100dvh;
    overflow: hidden;
    background: var(--et-bg);
    color: var(--et-fg);
    font-family: var(--et-font);
    -webkit-font-smoothing: antialiased;
    transition: background .25s, color .25s;
}

/* 极光背景：径向渐变 + 呼吸动画（edupick 品质基线，老内核也不掉帧） */
.et-app::before {
    content: '';
    position: fixed;
    inset: 0;
    z-index: -1;
    pointer-events: none;
    background:
        radial-gradient(46% 40% at 20% 18%, var(--et-accent-weak), transparent 65%),
        radial-gradient(42% 38% at 82% 24%, var(--et-accent-weak), transparent 70%),
        radial-gradient(50% 44% at 55% 95%, rgba(16, 185, 129, .10), transparent 65%);
    animation: et-aurora 16s ease-in-out infinite alternate;
}

@keyframes et-aurora {
    from { opacity: .55; transform: scale(1); }
    to { opacity: 1; transform: scale(1.06); }
}

.et-app *,
.et-app *::before,
.et-app *::after { box-sizing: border-box; }

[hidden] { display: none !important; }

.et-icon {
    width: 18px;
    height: 18px;
    fill: none;
    stroke: currentColor;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
    flex: none;
}

/* ============ 顶栏 ============ */
.et-topbar {
    flex: none;
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 11px 20px;
    border-bottom: 1px solid var(--et-line);
    background: var(--et-glass);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    z-index: 20;
}

.et-brand {
    display: flex;
    align-items: center;
    gap: 10px;
    min-width: 0;
}

.et-brand__dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: var(--et-accent);
    box-shadow: 0 0 0 4px var(--et-accent-weak);
    flex: none;
}

.et-brand__name {
    font-weight: 800;
    font-size: 15px;
    letter-spacing: -.01em;
    white-space: nowrap;
}

.et-brand__sub {
    font-size: 12.5px;
    color: var(--et-muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.et-status {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 5px 14px;
    border-radius: 999px;
    font-size: 12.5px;
    color: var(--et-muted);
    background: var(--et-surface-2);
    border: 1px solid var(--et-line);
    white-space: nowrap;
    max-width: 42vw;
    overflow: hidden;
    text-overflow: ellipsis;
}

.et-status__dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--et-ok);
    flex: none;
    transition: background .2s;
}

.et-status[data-tone="err"] .et-status__dot { background: var(--et-err); }
.et-status[data-tone="warn"] .et-status__dot { background: var(--et-warn); }

.et-actions {
    display: flex;
    align-items: center;
    gap: 7px;
}

.et-icon-btn {
    display: inline-grid;
    place-items: center;
    width: 38px;
    height: 38px;
    font-size: 16px;
    line-height: 1;
    border-radius: 11px;
    border: 1px solid var(--et-line);
    background: var(--et-surface-2);
    color: var(--et-fg);
    cursor: pointer;
    transition: transform .14s, border-color .14s, color .14s, opacity .14s;
    -webkit-tap-highlight-color: transparent;
}

.et-icon-btn:hover {
    border-color: var(--et-accent);
    color: var(--et-accent);
    transform: translateY(-1px);
}

.et-icon-btn:active { transform: translateY(0); }
.et-icon-btn.is-off { opacity: .4; }
.et-icon-btn:focus-visible { outline: 2px solid var(--et-accent); outline-offset: 2px; }

/* ============ 主区默认 ============ */
.et-main {
    flex: 1;
    min-height: 0;
    position: relative;
    overflow: auto;
}

/* ============ 页脚（品牌回流 L2） ============ */
.et-footer {
    flex: none;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 7px 16px;
    font-size: 12px;
    color: var(--et-muted);
    border-top: 1px solid var(--et-line);
    background: var(--et-glass);
    user-select: none;
    z-index: 20;
}

.et-footer a {
    color: inherit;
    text-decoration: none;
    transition: color .14s;
}

.et-footer a:hover { color: var(--et-accent); }

/* ============ 按钮 ============ */
.et-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
    padding: 9px 16px;
    border-radius: 11px;
    font: inherit;
    font-size: 13.5px;
    font-weight: 700;
    border: 1px solid var(--et-line);
    background: var(--et-surface-2);
    color: var(--et-fg);
    cursor: pointer;
    transition: transform .14s, border-color .14s, color .14s, background .14s, box-shadow .14s;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
}

.et-btn:hover {
    border-color: var(--et-accent);
    color: var(--et-accent);
    transform: translateY(-1px);
}

.et-btn:active { transform: translateY(0); }
.et-btn:focus-visible { outline: 2px solid var(--et-accent); outline-offset: 2px; }
.et-btn:disabled { opacity: .45; cursor: not-allowed; transform: none; }

.et-btn--primary {
    background: var(--et-accent);
    border-color: var(--et-accent);
    color: #fff;
    box-shadow: 0 6px 18px -8px var(--et-accent);
}

.et-btn--primary:hover { color: #fff; filter: brightness(1.08); }
.et-btn--primary:disabled { filter: none; }

.et-btn--danger:hover {
    border-color: var(--et-err);
    color: var(--et-err);
}

.et-btn--lg {
    padding: 13px 26px;
    font-size: 16px;
    border-radius: 14px;
}

/* ============ 弹窗 ============ */
.et-modal {
    position: fixed;
    inset: 0;
    z-index: 100;
    display: grid;
    place-items: center;
    padding: 24px;
    background: rgba(2, 6, 23, .55);
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    animation: et-fade .18s ease;
}

.et-modal__panel {
    width: min(680px, 94vw);
    max-height: 86vh;
    max-height: 86dvh;
    display: flex;
    flex-direction: column;
    background: var(--et-surface);
    border: 1px solid var(--et-line);
    border-radius: 16px;
    box-shadow: var(--et-shadow-lg);
    animation: et-pop .2s cubic-bezier(.34, 1.4, .64, 1);
    overflow: hidden;
}

.et-modal__panel--narrow { width: min(460px, 92vw); }
.et-modal__panel--wide { width: min(900px, 94vw); }

.et-modal__head {
    flex: none;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 16px 20px;
    border-bottom: 1px solid var(--et-line);
    font-weight: 800;
    font-size: 15px;
}

.et-modal__head .et-icon-btn {
    margin-left: auto;
    width: 32px;
    height: 32px;
}

.et-modal__body {
    flex: 1;
    min-height: 0;
    overflow: auto;
    padding: 18px 20px;
}

.et-modal__foot {
    flex: none;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 14px 20px;
    border-top: 1px solid var(--et-line);
    background: var(--et-surface-2);
}

.et-modal__foot .spacer { flex: 1; }

@keyframes et-fade {
    from { opacity: 0; }
}

@keyframes et-pop {
    from { opacity: 0; transform: translateY(14px) scale(.97); }
}

/* ============ 轻提示（toast） ============ */
.et-toast {
    position: fixed;
    left: 50%;
    bottom: 56px;
    transform: translateX(-50%) translateY(10px);
    z-index: 120;
    display: flex;
    align-items: center;
    gap: 9px;
    max-width: min(520px, 88vw);
    padding: 11px 18px;
    border-radius: 12px;
    font-size: 13.5px;
    font-weight: 600;
    color: #fff;
    background: rgba(15, 23, 42, .92);
    border: 1px solid rgba(148, 163, 184, .25);
    box-shadow: var(--et-shadow-lg);
    opacity: 0;
    pointer-events: none;
    transition: opacity .22s, transform .22s;
}

.et-toast.is-show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
}

.et-toast[data-tone="ok"] { background: rgba(5, 150, 105, .95); }
.et-toast[data-tone="err"] { background: rgba(220, 38, 38, .95); }
.et-toast[data-tone="warn"] { background: rgba(217, 119, 6, .95); }

/* ============ 设置抽屉（右上角入口，edupick 交互） ============ */
.et-drawer-backdrop {
    position: fixed;
    inset: 0;
    z-index: 90;
    background: rgba(2, 6, 23, .45);
    backdrop-filter: blur(3px);
    -webkit-backdrop-filter: blur(3px);
    opacity: 0;
    transition: opacity .2s;
}

.et-drawer-backdrop.is-open { opacity: 1; }

.et-drawer {
    position: absolute;
    top: 0;
    right: 0;
    height: 100%;
    width: min(400px, 92vw);
    display: flex;
    flex-direction: column;
    background: var(--et-surface);
    border-left: 1px solid var(--et-line);
    box-shadow: var(--et-shadow-lg);
    transform: translateX(100%);
    transition: transform .22s cubic-bezier(.32, .72, .35, 1);
}

.et-drawer-backdrop.is-open .et-drawer { transform: translateX(0); }

.et-drawer__head {
    flex: none;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 15px 18px;
    border-bottom: 1px solid var(--et-line);
    font-weight: 800;
    font-size: 15px;
    color: var(--et-accent);
}

.et-drawer__head .et-icon-btn {
    margin-left: auto;
    width: 32px;
    height: 32px;
}

.et-drawer__body {
    flex: 1;
    min-height: 0;
    overflow: auto;
    padding: 16px 18px 24px;
}

/* 抽屉内容通用小节（工具复用） */
.et-drawer__body h4 {
    margin: 18px 0 8px;
    font-size: 12px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: .08em;
    color: var(--et-muted);
}

.et-drawer__body h4:first-child { margin-top: 0; }

.et-drawer__row {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
}

.et-drawer__tip {
    margin: 8px 0 0;
    font-size: 12px;
    line-height: 1.8;
    color: var(--et-muted);
}

.et-drawer__tip b { color: var(--et-fg); }

.et-drawer__input {
    flex: 1;
    min-width: 0;
    padding: 9px 12px;
    border: 1px solid var(--et-line-strong);
    border-radius: 9px;
    background: var(--et-surface-2);
    color: var(--et-fg);
    font: inherit;
    font-size: 13.5px;
    transition: border-color .14s, box-shadow .14s;
}

.et-drawer__input:focus {
    outline: none;
    border-color: var(--et-accent);
    box-shadow: 0 0 0 3px var(--et-accent-weak);
}

.et-drawer__switch {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 10px 0;
    border-bottom: 1px dashed var(--et-line);
    font-size: 13.5px;
    font-weight: 600;
    color: var(--et-fg);
    cursor: pointer;
    user-select: none;
}

.et-drawer__switch input {
    width: 17px;
    height: 17px;
    accent-color: var(--et-accent);
    cursor: pointer;
}
</style>

    function installPwa(toolId, title, accent) {
        try {
            var theme = document.querySelector('meta[name="theme-color"]');
            if (!theme) {
                theme = document.createElement('meta');
                theme.setAttribute('name', 'theme-color');
                document.head.appendChild(theme);
            }
            theme.setAttribute('content', accent || '#2563eb');

            var svg = '<svg xmlns="' + NS_SVG + '" viewBox="0 0 64 64">' +
                '<rect width="64" height="64" rx="14" fill="' + (accent || '#2563eb') + '"/>' +
                '<text x="32" y="43" font-size="32" font-weight="800" font-family="sans-serif" ' +
                'fill="#fff" text-anchor="middle">' + (title || '课').charAt(0) + '</text></svg>';
            var iconUri = 'data:image/svg+xml,' + encodeURIComponent(svg);

            var mf = {
                name: title || 'KeeTools 课工具',
                short_name: title || '课工具',
                start_url: '.',
                display: 'standalone',
                background_color: '#f4f6fb',
                theme_color: accent || '#2563eb',
                icons: [{ src: iconUri, sizes: 'any', type: 'image/svg+xml', purpose: 'any' }]
            };
            var blob = new Blob([JSON.stringify(mf)], { type: 'application/manifest+json' });
            var link = document.createElement('link');
            link.rel = 'manifest';
            link.href = URL.createObjectURL(blob);

    function mount(options) {

        var store = global.ET && global.ET.store

            : (function () { return { get: function () { return null; }, set: function () {} }; })();

        var api = { toolId: toolId, store: store };

        /* ---------- 主题 ---------- */

        if (theme !== 'dark' && theme !== 'light') {

        applyTheme(theme);

        function applyTheme(t) {

            store.set('theme', t);
            if (themeBtn) {
                themeBtn.innerHTML = '';
                themeBtn.appendChild(makeIcon(t === 'dark' ? 'i-sun' : 'i-moon'));
                themeBtn.title = t === 'dark' ? '切换到浅色' : '切换到深色';

        /* ---------- 顶栏 ---------- */
        var topbar = document.getElementById('et-topbar');

        var footer = document.getElementById('et-footer');

        if (!main) { main = el('main'); main.id = 'et-main'; topbar.after(main); }
        if (!footer) { footer = el('footer'); footer.id = 'et-footer'; document.body.appendChild(footer); }

        main.classList.add('et-main');
        footer.className = 'et-footer';

        brand.appendChild(el('span', 'et-brand__dot'));
        var nameWrap = el('div');
        nameWrap.style.cssText = 'min-width:0;line-height:1.25';
        nameWrap.appendChild(el('div', 'et-brand__name', opt.title || '课工具'));
        if (opt.sub) { nameWrap.appendChild(el('div', 'et-brand__sub', opt.sub)); }
        brand.appendChild(nameWrap);
        topbar.appendChild(brand);

        /* 状态胶囊 */
        var statusPill = el('div', 'et-status');
        statusPill.hidden = true;
        statusPill.appendChild(el('span', 'et-status__dot'));
        var statusText = el('span', null, '');
        statusPill.appendChild(statusText);
        topbar.appendChild(statusPill);

        api.setStatus = function (text, tone) {
            if (!text) { statusPill.hidden = true; return; }

            statusPill.setAttribute('data-tone', tone || 'ok');

            soundBtn.title = soundEnabled ? '关闭音效' : '开启音效';

                if (req) { try { req.call(root); } catch (err) { /* 忽略 */ } }

        }

        function syncFsIcon(on) {

        document.addEventListener('webkitfullscreenchange', function () {

        syncFsIcon(false);

        api.toggleFullscreen = toggleFullscreen;

        /* ---------- 音效 API ---------- */
        api.beep = function (kind) {

        function openHelp() {

        api.openHelp = openHelp;

        /* ---------- toast ---------- */
        api.toast = toast;

        /* ---------- 页脚（L2 品牌回流，低调一行） ---------- */
        var siteOrigin = typeof global.ET_SITE_ORIGIN === 'string' && /^https?:\/\//.test(global.ET_SITE_ORIGIN)
            ? global.ET_SITE_ORIGIN
            : null;

        function renderFooter() {
            footer.textContent = '';
            footer.appendChild(el('span', null, 'KeeTools 课工具'));
            footer.appendChild(el('span', null, '·'));
            if (siteOrigin) {
                var a = el('a', null, '更多课堂工具');
                a.href = siteOrigin + '/?from=tool-footer&tool=' + encodeURIComponent(toolId);
                a.target = '_blank';
                a.rel = 'noopener';
                footer.appendChild(a);
            } else {
                footer.appendChild(el('span', null, '更多课堂工具'));
            }
        }
        renderFooter();

        /* 站点来源发现：iframe 内向父窗口询问；也可由宿主直接注入 ET_SITE_ORIGIN */
        try {
            if (global.parent && global.parent !== global) {
                global.parent.postMessage(JSON.stringify({ type: 'et-hello', toolId: toolId }), '*');
            }
        } catch (err) { /* 跨域异常忽略 */ }

        global.addEventListener('message', function (ev) {
            var data = ev.data;
            if (typeof data === 'string') {
                try { data = JSON.parse(data); } catch (err) { return; }
            }
            if (!data || typeof data !== 'object') { return; }

            if (data.type === 'et-origin' && typeof data.origin === 'string' && /^https?:\/\//.test(data.origin)) {
                siteOrigin = data.origin;
                if (!global.ET_SITE_ORIGIN) { global.ET_SITE_ORIGIN = data.origin; }
                renderFooter();
            }
            if (data.type === 'et-fullscreen-change' && typeof data.value === 'boolean') {
                syncFsIcon(data.value);

        });

        api.el = { topbar: topbar, main: main, footer: footer, actions: actions };

        /* ---------- 激光笔 / 翻页笔适配（HID 翻页键） ----------
         * 翻页笔的上下页键在系统层等价于 PageDown / PageUp。
         * 工具通过 opt.primary / opt.secondary 注册动作：
         *   PageDown → primary（主操作，如开始点名 / 开始计时）
         *   PageUp   → secondary（副操作，缺省时同 primary）
         * 输入框聚焦或弹窗/抽屉打开时不响应，避免误触。 */
        if (typeof opt.primary === 'function') {
            document.addEventListener('keydown', function (ev) {
                if (ev.key !== 'PageDown' && ev.key !== 'PageUp') { return; }
                var tag = (document.activeElement && document.activeElement.tagName) || '';
                if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') { return; }
                if (document.querySelector('.et-modal, .et-drawer-backdrop, .ws-winner')) { return; }
                ev.preventDefault();
                if (ev.key === 'PageDown') { opt.primary(); }
                else if (typeof opt.secondary === 'function') { opt.secondary(); }
                else { opt.primary(); }
            });

    global.ET.Chrome = {
        mount: mount,
        modal: modal,
        toast: toast,
        beep: playBeep /* 挂载前的独立音效入口（不经过音效开关） */
    };

<script>
  /* 此块由 scripts/sync_shared.py 自动注入，请勿手工修改 */
/*!
 * et-stats.js — 使用统计模块（模块化，可整体移除）
 *
 * 共享逻辑源。改这里，然后跑：python scripts/sync_shared.py
 * 依赖：无（可脱离 et-util / et-chrome 独立运行）。
 * 全局：ET.Stats
 *
 * ┌────────────────────────────────────────────────────────────────┐
 * │ 说明：本模块只做一件事——工具被打开时向上报端点发一条匿名计数。 │
 * │ · 在线（iframe 内）：宿主页面已服务端计数，本模块不重复上报。   │
 * │ · 离线打开（file:// / 下载单文件 / 离线包）：联网条件具备时，   │
 * │   以 sendBeacon 上报 use_offline 事件（text/plain 免预检）。    │
 * │ · 上报端点 = window.ET_SITE_ORIGIN（由宿主注入或离线包配置）。  │
 * │   未配置端点时本模块完全静默，不发任何请求。                    │
 * │ · **整个 <script> 块可安全删除**：删除后工具其余功能完全正常，  │
 * │   且完全不再发起任何网络请求。                                  │
 * └────────────────────────────────────────────────────────────────┘
 */
(function (global) {
    'use strict';

    var ET = global.ET = global.ET || {};

    var Stats = {
        /** 上报端点来源（站点绝对地址，无协议尾斜杠） */
        endpoint: (typeof global.ET_SITE_ORIGIN === 'string' && /^https?:\/\//.test(global.ET_SITE_ORIGIN))
            ? global.ET_SITE_ORIGIN
            : null,

        _done: {},

        /**
         * 上报一次事件（同一事件同一工具每次页面加载只报一次）。
         * event: 'use_offline' 等；toolId: 工具 id。
         */
        send: function (event, toolId) {
            if (!event || this._done[event + ':' + (toolId || '')]) { return false; }
            if (!this.endpoint) { return false; }
            /* iframe 内由宿主统计，避免双计 */
            try {
                if (global.parent && global.parent !== global) { return false; }
            } catch (err) { return false; }
            /* 断网时挂起，网络恢复自动补报一次 */
            if (global.navigator && global.navigator.onLine === false) {
                var self = this;
                global.addEventListener('online', function () { self.send(event, toolId); }, { once: true });
                return false;
            }

            this._done[event + ':' + (toolId || '')] = true;
            var payload = JSON.stringify({ event: event, tool: toolId || '' });

            try {
                if (global.navigator.sendBeacon) {
                    return global.navigator.sendBeacon(
                        this.endpoint + '/api/track',
                        new Blob([payload], { type: 'text/plain;charset=UTF-8' })
                    );
                }
                global.fetch(this.endpoint + '/api/track', {
                    method: 'POST',
                    body: payload,
                    keepalive: true,
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'text/plain;charset=UTF-8' }
                });
                return true;
            } catch (err) {
                return false;
            }
        }
    };

    ET.Stats = Stats;
})(window);
</script>

<script>
(function () {
    'use strict';

    var TOOL_ID = 'projectile-motion';
    var store = ET.store(TOOL_ID);
    var G = 9.8;

    var state = {
        mode: store.get('mode', 'horizontal'),
        v0: store.get('v0', 20),
        angle: store.get('angle', 45),
        h0: store.get('h0', 45)
    };

    var chrome = ET.Chrome.mount({
        toolId: TOOL_ID,
        title: '平抛斜抛运动',
        sub: '物理',
        accent: '#6d28d9',
        status: '就绪',
        sound: true,
        primary: launch,
        settings: {
            title: '设置',
            build: function (body) {
                body.innerHTML = '<p style="font-size:13.5px;line-height:2;color:var(--et-muted)">' +
                    'g 取 9.8 m/s²，忽略空气阻力。空格 / 翻页笔下页键 = 发射。</p>';
            }
        },
        help: '<div style="font-size:13.5px;line-height:2">' +
            '<p style="margin:0 0 8px"><b>怎么用</b>：选平抛 / 斜抛，调初速度、抛射角、初始高度，按「发射」；' +
            '紫红色虚线为理论轨迹，圆点为实际模拟位置（两者应重合）。</p>' +
            '<p style="margin:0 0 8px"><b>速度矢量</b>：球上三支箭头为速度分解——' +
            '<b style="color:#22c55e">绿色 vx</b>（水平分速度）、<b style="color:#f59e0b">橙色 vy</b>（竖直分速度）、' +
            '<b style="color:#dc2626">红色 v</b>（合速度），箭头长度随滑块设置的初速度自适应，旁附实时数值。</p>' +
            '<p style="margin:0 0 8px"><b>读数</b>：左上实时显示 t、x、y、vx、vy、v；右上给出理论射程、最大高度与飞行时间。</p>' +
            '<p style="margin:0 0 8px"><b>对比实验</b>：连续发射多次（不点清除），可叠加对比不同初速度 / 角度的轨迹。</p>' +
            '<p style="margin:0"><b>要点</b>：平抛 = 水平匀速 + 竖直自由落体；45° 射程最远；互余角度射程相等。</p></div>'
    });

    var cv = document.getElementById('cv');
    var ctx = cv.getContext('2d');
    var els = {
        btnLaunch: document.getElementById('btnLaunch'),
        btnClear: document.getElementById('btnClear'),
        v0: document.getElementById('v0'), v0Val: document.getElementById('v0Val'),
        angle: document.getElementById('angle'), angleVal: document.getElementById('angleVal'),
        h0: document.getElementById('h0'), h0Val: document.getElementById('h0Val'),
        slAngle: document.getElementById('slAngle'),
        readout: document.getElementById('readout'),
        theory: document.getElementById('theory')
    };

    /* 模拟状态 */
    var sim = null;               /* {t, x, y, vx, vy, trail:[], done} */
    var ghosts = [];              /* 历史轨迹（世界坐标点列） */
    var view = { scale: 6, groundY: 60 };   /* px/m */

    function cssVar(name) {
        return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
    }
    /* 主题由共享外壳写在 <html data-et-theme> 上（不是 body 类名） */
    function isDark() { return document.documentElement.getAttribute('data-et-theme') === 'dark'; }

    function toPx(wx, wy) {
        var w = cv.clientWidth, h = cv.clientHeight;
        return { x: 50 + wx * view.scale, y: h - view.groundY - wy * view.scale };
    }

    function fitView() {
        var p = theoryParams();
        var maxX = Math.max(p.range * 1.08, 10);
        var maxY = Math.max(p.hmax * 1.15 + h0Mode(), 10);
        var w = cv.clientWidth - 90, h = cv.clientHeight - view.groundY - 30;
        view.scale = Math.min(w / maxX, h / maxY);
        view.scale = Math.max(0.5, Math.min(30, view.scale));
    }

    function theoryParams() {
        var h = h0Mode();
        if (state.mode === 'horizontal') {
            var T = Math.sqrt(2 * h / G);
            return { T: T, range: state.v0 * T, hmax: 0, apex: null };
        }
        var th = state.angle * Math.PI / 180;
        var vy = state.v0 * Math.sin(th);
        var T = (vy + Math.sqrt(vy * vy + 2 * G * h)) / G;
        return {
            T: T,
            range: state.v0 * Math.cos(th) * T,
            hmax: vy * vy / (2 * G),
            apex: { t: vy / G, x: state.v0 * Math.cos(th) * vy / G, y: h + vy * vy / (2 * G) }
        };
    }

    function h0Mode() {
        /* 斜抛从地面发射（高度滑杆只作用于平抛） */
        return state.mode === 'horizontal' ? state.h0 : 0;
    }

    /* ════════ 绘制 ════════ */

    function draw() {
        var w = cv.clientWidth, h = cv.clientHeight;
        var dpr = window.devicePixelRatio || 1;
        if (cv.width !== Math.round(w * dpr) || cv.height !== Math.round(h * dpr)) {
            cv.width = Math.round(w * dpr);
            cv.height = Math.round(h * dpr);
        }
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        ctx.clearRect(0, 0, w, h);
        var fg = isDark() ? '#e8eaed' : '#1f2328';
        var muted = isDark() ? 'rgba(255,255,255,.4)' : 'rgba(0,0,0,.4)';
        var accent = cssVar('--pm-accent') || '#6d28d9';

        /* 地面 */
        var gy = h - view.groundY;
        ctx.fillStyle = isDark() ? 'rgba(255,255,255,.06)' : 'rgba(0,0,0,.05)';
        ctx.fillRect(0, gy, w, h - gy);
        ctx.strokeStyle = muted;
        ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.moveTo(0, gy); ctx.lineTo(w, gy); ctx.stroke();

        /* 比例尺刻度（竖直，每 10m） */
        ctx.font = '11px sans-serif';
        ctx.fillStyle = muted;
        var stepM = view.scale > 8 ? 5 : 10;
        for (var m = 0; m * view.scale < h - view.groundY; m += stepM) {
            var py = gy - m * view.scale;
            ctx.strokeStyle = muted;
            ctx.beginPath(); ctx.moveTo(36, py); ctx.lineTo(46, py); ctx.stroke();
            ctx.textAlign = 'right';
            ctx.fillText(m + 'm', 33, py + 4);
        }
        ctx.textAlign = 'left';

        /* 历史轨迹（灰） */
        ctx.strokeStyle = isDark() ? 'rgba(255,255,255,.22)' : 'rgba(0,0,0,.18)';
        ctx.lineWidth = 1.5;
        for (var gi = 0; gi < ghosts.length; gi++) {
            drawTrail(ghosts[gi], false);
        }

        /* 理论轨迹虚线 */
        var p = theoryParams();
        if (!sim || !sim.done) {
            ctx.setLineDash([6, 6]);
            ctx.strokeStyle = accent;
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            var th = state.mode === 'angled' ? state.angle * Math.PI / 180 : 0;
            var vy0 = state.v0 * Math.sin(th), vx0 = state.v0 * Math.cos(th);
            for (var s = 0; s <= 200; s++) {
                var t = p.T * s / 200;
                var wx = vx0 * t;
                var wy = h0Mode() + vy0 * t - 0.5 * G * t * t;
                var pp = toPx(wx, wy);
                if (s === 0) { ctx.moveTo(pp.x, pp.y); } else { ctx.lineTo(pp.x, pp.y); }
            }
            ctx.stroke();
            ctx.setLineDash([]);
        }

        /* 当前轨迹 + 小球 */
        if (sim) {
            ctx.strokeStyle = accent;
            ctx.lineWidth = 2.5;
            drawTrail(sim.trail, true);
            var bp = toPx(sim.x, sim.y);
            ctx.fillStyle = accent;
            ctx.beginPath(); ctx.arc(bp.x, bp.y, 8, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = '#fff';
            ctx.beginPath(); ctx.arc(bp.x - 2.5, bp.y - 2.5, 2.5, 0, Math.PI * 2); ctx.fill();
            /* 速度矢量分解（长度自适应 + 数值标签） */
            velocityVectors(bp.x, bp.y, sim.vx, sim.vy);
        }

        /* 落点与最高点标注 */
        if (sim && sim.done) {
            var lp = toPx(sim.x, 0);
            ctx.fillStyle = '#dc2626';
            ctx.textAlign = 'center';
            ctx.fillText('落点 x=' + sim.x.toFixed(1) + 'm', lp.x, gy + 16);
            if (sim.apex) {
                var ap = toPx(sim.apex.x, sim.apex.y);
                ctx.strokeStyle = 'rgba(128,128,128,.6)';
                ctx.setLineDash([4, 4]);
                ctx.beginPath(); ctx.moveTo(ap.x, ap.y); ctx.lineTo(ap.x, gy); ctx.stroke();
                ctx.setLineDash([]);
                ctx.fillStyle = '#2563eb';
                ctx.fillText('最高点 H=' + sim.apex.y.toFixed(1) + 'm', ap.x, ap.y - 12);
            }
            ctx.textAlign = 'left';
        }

        /* 读数 */
        if (sim) {
            els.readout.textContent =
                't  = ' + sim.t.toFixed(2) + ' s\n' +
                'x  = ' + sim.x.toFixed(1) + ' m\n' +
                'y  = ' + Math.max(sim.y, 0).toFixed(1) + ' m\n' +
                'vx = ' + sim.vx.toFixed(1) + ' m/s\n' +
                'vy = ' + sim.vy.toFixed(1) + ' m/s\n' +
                'v  = ' + Math.sqrt(sim.vx * sim.vx + sim.vy * sim.vy).toFixed(1) + ' m/s';
        } else {
            els.readout.textContent = '按「发射」或空格开始';
        }

        /* 理论面板 */
        var thTxt = state.mode === 'horizontal'
            ? '平抛：x = v₀t，y = h − ½gt²'
            : '斜抛：θ = ' + state.angle + '°，v₀ = ' + state.v0 + ' m/s';
        els.theory.innerHTML = thTxt +
            '<br>理论射程 R = ' + p.range.toFixed(1) + ' m' +
            '<br>飞行时间 T = ' + p.T.toFixed(2) + ' s' +
            (p.hmax > 0 ? '<br>最大高度 = ' + (p.hmax + h0Mode()).toFixed(1) + ' m' : '');
    }

    function drawTrail(trail, glow) {
        for (var i = 1; i < trail.length; i++) {
            var a = toPx(trail[i - 1][0], trail[i - 1][1]);
            var b = toPx(trail[i][0], trail[i][1]);
            ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
        }
    }

    /* ── 矢量箭头 ────────────────────────────────────────────────
       自适应长度方案：合速度箭头固定在 90~170px（随画布尺寸缩放），
       分量按真实比例分配，箭头长度不再随初速度变小而缩水。 */

    var TAG_FONT = '700 12.5px ui-monospace, Consolas, monospace';

    function tagWidth(text) {
        ctx.save();
        ctx.font = TAG_FONT;
        var tw = ctx.measureText(text).width;
        ctx.restore();
        return tw + 13;   /* 含左右内边距 */
    }

    function roundedBox(x, y, w, h, r) {
        ctx.beginPath();
        ctx.moveTo(x + r, y);
        ctx.lineTo(x + w - r, y);
        ctx.quadraticCurveTo(x + w, y, x + w, y + r);
        ctx.lineTo(x + w, y + h - r);
        ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
        ctx.lineTo(x + r, y + h);
        ctx.quadraticCurveTo(x, y + h, x, y + h - r);
        ctx.lineTo(x, y + r);
        ctx.quadraticCurveTo(x, y, x + r, y);
        ctx.closePath();
    }

    /** 带底衬的数值标签：anchorX = left|center|right，anchorY = top|middle|bottom */
    function vectorTag(ax, ay, text, color, anchorX, anchorY) {
        var cw = cv.clientWidth, chh = cv.clientHeight;
        ctx.save();
        ctx.font = TAG_FONT;
        var tw = ctx.measureText(text).width;
        var padX = 6, boxH = 19;
        var bw = tw + padX * 2;
        var bx = anchorX === 'center' ? ax - bw / 2 : anchorX === 'right' ? ax - bw : ax;
        var by = anchorY === 'middle' ? ay - boxH / 2 : anchorY === 'bottom' ? ay - boxH : ay;
        bx = Math.max(4, Math.min(bx, cw - bw - 4));
        by = Math.max(4, Math.min(by, chh - boxH - 4));
        ctx.fillStyle = isDark() ? 'rgba(15,23,42,.85)' : 'rgba(255,255,255,.92)';
        ctx.strokeStyle = color;
        ctx.lineWidth = 1;
        roundedBox(bx, by, bw, boxH, 6);
        ctx.fill();
        ctx.stroke();
        ctx.fillStyle = color;
        ctx.textAlign = 'left';
        ctx.textBaseline = 'middle';
        ctx.fillText(text, bx + padX, by + boxH / 2 + 0.5);
        ctx.restore();
    }

    function arrow(x1, y1, x2, y2, color, width) {
        var dx = x2 - x1, dy = y2 - y1;
        var len = Math.sqrt(dx * dx + dy * dy);
        if (len < 1) { return; }
        var ang = Math.atan2(dy, dx);
        var head = Math.max(8, Math.min(16, len * 0.32));
        var lw = width || 2.5;
        /* 与轨迹/网格交叠时的底衬光晕，保证箭头始终看得清 */
        var halo = isDark() ? 'rgba(11,17,32,.75)' : 'rgba(255,255,255,.85)';
        var sx = x2 - Math.cos(ang) * head * 0.9;
        var sy = y2 - Math.sin(ang) * head * 0.9;
        var h1x = x2 - head * Math.cos(ang - 0.42), h1y = y2 - head * Math.sin(ang - 0.42);
        var h2x = x2 - head * Math.cos(ang + 0.42), h2y = y2 - head * Math.sin(ang + 0.42);

        ctx.save();
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(x1, y1); ctx.lineTo(sx, sy);
        ctx.moveTo(x2, y2); ctx.lineTo(h1x, h1y); ctx.lineTo(h2x, h2y);
        ctx.closePath();

        ctx.lineJoin = 'round';
        ctx.strokeStyle = halo;
        ctx.fillStyle = halo;
        ctx.lineWidth = lw + 3.5;
        ctx.stroke();
        ctx.fill();

        ctx.lineJoin = 'miter';
        ctx.strokeStyle = color;
        ctx.fillStyle = color;
        ctx.lineWidth = lw;
        ctx.stroke();
        ctx.fill();
        ctx.restore();
    }

    function velocityVectors(ox, oy, vx, vy) {
        var speed = Math.sqrt(vx * vx + vy * vy);
        if (speed < 0.05) { return; }
        var cw = cv.clientWidth, chh = cv.clientHeight;
        var M = 40;   /* 画布内边距：箭头与标签不顶边 */

        /* 像素比例 k：合速度箭头约 90~170px，随后按可用空间收缩 */
        var target = Math.max(90, Math.min(170, Math.min(cw, chh) * 0.3));
        var k = target / speed;
        if (vx > 1e-6) { k = Math.min(k, (cw - M - ox) / vx); }
        if (vy > 1e-6) { k = Math.min(k, (oy - M) / vy); }
        else if (vy < -1e-6) { k = Math.min(k, (chh - M - oy) / (-vy)); }
        k = Math.max(k, 10 / speed);

        var lx = vx * k, ly = vy * k;      /* lx≥0，ly 上正下负（屏幕像素） */
        var tx = ox + lx, ty = oy - ly;
        var cX = '#22c55e', cY = '#f59e0b', cV = '#dc2626';

        /* 平行四边形分解辅助线 */
        ctx.save();
        ctx.setLineDash([5, 5]);
        ctx.lineWidth = 1.5;
        ctx.strokeStyle = isDark() ? 'rgba(148,163,184,.65)' : 'rgba(100,116,139,.5)';
        ctx.beginPath();
        ctx.moveTo(ox + lx, oy); ctx.lineTo(tx, ty);
        ctx.moveTo(ox, oy - ly); ctx.lineTo(tx, ty);
        ctx.stroke();
        ctx.restore();

        /* 分量短于 12px 不画（数值标签仍给出真实大小），避免看不清的碎点 */
        if (lx >= 12) { arrow(ox, oy, ox + lx, oy, cX, 2.5); }
        if (Math.abs(ly) >= 12) { arrow(ox, oy, ox, oy - ly, cY, 2.5); }
        arrow(ox, oy, tx, ty, cV, 3);

        /* 数值标签：优先放在不压轨迹、不压地面的一侧 */
        if (lx >= 12) {
            var roomBelow = oy + 7 + 19 <= chh - view.groundY - 2;
            vectorTag(ox + lx / 2, roomBelow ? oy + 7 : oy - 7,
                'vx=' + vx.toFixed(1), cX, 'center', roomBelow ? 'top' : 'bottom');
        }
        if (Math.abs(ly) >= 12) {
            var vyTxt = 'vy=' + vy.toFixed(1);
            if (ox - tagWidth(vyTxt) > 6) {
                vectorTag(ox - 9, oy - ly / 2, vyTxt, cY, 'right', 'middle');
            } else if (ly > 0) {
                vectorTag(ox, oy - ly - 7, vyTxt, cY, 'center', 'bottom');
            } else {
                vectorTag(ox, oy - ly + 7, vyTxt, cY, 'center', 'top');
            }
        }
        var vTxt = 'v=' + speed.toFixed(1);
        var toRight = tx + 9 + tagWidth(vTxt) <= cw - 4;
        /* vy≈0 时合速度与 vx 共线，标签抬到箭头上方避让 */
        var nearFlat = Math.abs(ly) < 12;
        vectorTag(toRight ? tx + 9 : tx - 9, nearFlat ? ty - 10 : ty, vTxt, cV,
            toRight ? 'left' : 'right', nearFlat ? 'bottom' : 'middle');
    }

    /* ════════ 模拟 ════════ */

    var rafId = null, lastTs = null;

    function launch() {
        if (sim && !sim.done) { return; }
        if (sim && sim.done) {
            ghosts.push(sim.trail.slice());
            if (ghosts.length > 3) { ghosts.shift(); }
        }
        fitView();
        var th = state.mode === 'angled' ? state.angle * Math.PI / 180 : 0;
        sim = {
            t: 0,
            x: 0,
            y: h0Mode(),
            vx: state.v0 * Math.cos(th),
            vy: state.v0 * Math.sin(th),
            trail: [[0, h0Mode()]],
            done: false,
            apex: state.mode === 'angled' ? null : undefined
        };
        chrome.setStatus('飞行中…');
        lastTs = null;
        if (rafId === null) { rafId = requestAnimationFrame(tick); }
    }

    function tick(ts) {
        rafId = null;
        if (!sim || sim.done) { return; }
        var dt = lastTs === null ? 0 : Math.min(0.05, (ts - lastTs) / 1000);
        lastTs = ts;
        /* 固定小步长积分，保证轨迹平滑 */
        var steps = Math.max(1, Math.round(dt / 0.008));
        var sub = dt / steps;
        for (var i = 0; i < steps; i++) {
            sim.vy -= G * sub;
            sim.x += sim.vx * sub;
            sim.y += sim.vy * sub;
            sim.t += sub;
            if (sim.y <= 0 && sim.vy <= 0) {
                /* 须在下降段才判落地：防止首帧 dt=0、地面发射 y=0 时误判 */
                sim.y = 0;
                sim.done = true;
                break;
            }
            sim.trail.push([sim.x, sim.y]);
        }
        /* 记录最高点 */
        if (sim.apex !== undefined && sim.apex !== null) {
            if (!sim.apex || sim.y > sim.apex.y) { sim.apex = { x: sim.x, y: sim.y }; }
        } else if (sim.apex === null && sim.vy <= 0 && sim.trail.length > 1) {
            sim.apex = { x: sim.x, y: sim.y };
        }
        if (sim.done) {
            sim.trail.push([sim.x, 0]);
            chrome.setStatus('已落地：射程 ' + sim.x.toFixed(1) + ' m，用时 ' + sim.t.toFixed(2) + ' s');
            try { chrome.beep('ok'); } catch (e) { /* 静默 */ }
        }
        draw();
        if (sim && !sim.done) { rafId = requestAnimationFrame(tick); }
    }

    /* ════════ 控件 ════════ */

    els.v0.addEventListener('input', function () {
        state.v0 = Number(els.v0.value);
        els.v0Val.textContent = state.v0 + ' m/s';
        store.set('v0', state.v0);
        draw();
    });
    els.angle.addEventListener('input', function () {
        state.angle = Number(els.angle.value);
        els.angleVal.textContent = state.angle + '°';
        store.set('angle', state.angle);
        draw();
    });
    els.h0.addEventListener('input', function () {
        state.h0 = Number(els.h0.value);
        els.h0Val.textContent = state.h0 + ' m';
        store.set('h0', state.h0);
        draw();
    });

    document.querySelectorAll('.pm-mode').forEach(function (btn) {
        btn.addEventListener('click', function () {
            state.mode = btn.getAttribute('data-mode');
            document.querySelectorAll('.pm-mode').forEach(function (b) {
                b.classList.toggle('is-active', b === btn);
            });
            els.slAngle.style.display = state.mode === 'angled' ? '' : 'none';
            sim = null;
            store.set('mode', state.mode);
            fitView();
            draw();
            chrome.setStatus(state.mode === 'horizontal' ? '平抛运动' : '斜抛运动');
        });
    });

    els.btnLaunch.addEventListener('click', launch);
    els.btnClear.addEventListener('click', function () {
        ghosts = [];
        sim = null;
        draw();
    });

    window.addEventListener('resize', function () {
        if (sim && !sim.done) { fitView(); }
        else { fitView(); }
        draw();
    });

    /* 切换深浅色后重绘（Canvas 颜色不随 CSS 自动更新） */
    try {
        var themeObserver = new MutationObserver(function () { draw(); });
        themeObserver.observe(document.documentElement, { attributes: true, attributeFilter: ['data-et-theme'] });
    } catch (err) { /* 老内核忽略 */ }

    /* 初始化 */
    els.v0.value = state.v0; els.v0Val.textContent = state.v0 + ' m/s';
    els.angle.value = state.angle; els.angleVal.textContent = state.angle + '°';
    els.h0.value = state.h0; els.h0Val.textContent = state.h0 + ' m';
    els.slAngle.style.display = state.mode === 'angled' ? '' : 'none';
    (function () {
        var btns = document.querySelectorAll('.pm-mode');
        for (var i = 0; i < btns.length; i++) {
            btns[i].classList.toggle('is-active', btns[i].getAttribute('data-mode') === state.mode);
        }
    })();
    fitView();
    draw();
})();
</script>

</body>
</html>
