name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gates:
    runs-on: ubuntu-latest
    name: 六项门禁校验
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: manifest 与 ET-META 一致性
        run: python scripts/check_manifest.py

      - name: 零外部依赖检查
        run: python scripts/check_no_external.py

      - name: 共享逻辑同步检查
        run: python scripts/sync_shared.py --check

      - name: CSS 令牌检查
        run: python scripts/check_css_tokens.py

      - name: CSS 产物最新
        run: python scripts/build_css.py --check

      - name: 图标 sprite 产物最新
        run: python scripts/icons/build_sprite.py --check

      - name: 第三方素材登记同步
        run: python scripts/gen_licenses.py --check
